# Автослияние безопасных PR (ADR студии 0018, классы 1 и 2). Включает auto-merge GitHub
# (squash), когда сошлось всё:
#   - на PR стоит метка «ревью: ок» — её ставит Ревьюер, другая сессия, чем исполнитель;
#   - проверки «Проверки PR» (pr.yml) зелёные на последнем коммите PR;
#   - в PR нет путей владельца из .github/CODEOWNERS — их сливает только владелец.
# Новый коммит снимает метку и выключает автослияние: Ревьюер смотрел прежний код.
#
# pull_request_target и workflow_run берут этот файл и CODEOWNERS из main, а не из PR: PR не
# может переписать правила своего же слияния. Код PR здесь не выгружается и не запускается.
# Последнее слово — за защитой ветки main: обязательные проверки и ревью владельца кода
# включает владелец в настройках репозитория (docs/08-process.md, «Слияние»).
name: Автослияние

on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [PR]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Автослияние
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        env:
          LABEL: 'ревью: ок'
          CHECK: 'Проверки PR'
        with:
          script: |
            const { owner, repo } = context.repo;
            const { LABEL, CHECK } = process.env;

            // какой PR: из события PR или из законченного запуска проверок
            let number;
            if (context.eventName === 'pull_request_target') {
              number = context.payload.pull_request.number;
            } else {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success') return core.info(`Проверки PR: ${run.conclusion} — не сливаю.`);
              number = run.pull_requests?.[0]?.number;
              if (!number) {
                const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', head: `${owner}:${run.head_branch}`, per_page: 100 });
                number = open.find(p => p.head.sha === run.head_sha)?.number;
              }
              if (!number) return core.info('Открытого PR с этим коммитом нет.');
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.draft) return core.info(`PR #${number}: закрыт или черновик.`);
            const labeled = pr.labels.some(l => l.name === LABEL);

            // новый коммит после ревью — метку снять, автослияние выключить
            if (context.eventName === 'pull_request_target' && context.payload.action === 'synchronize') {
              if (!labeled) return core.info('Метки нет — снимать нечего.');
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: LABEL });
              if (pr.auto_merge) {
                await github.graphql('mutation($id: ID!) { disablePullRequestAutoMerge(input: { pullRequestId: $id }) { clientMutationId } }', { id: pr.node_id });
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `Новый коммит после ревью: метка «${LABEL}» снята, автослияние выключено. Ревьюер смотрел прежний код — нужен повторный просмотр.`,
              });
              return;
            }
            if (!labeled) return core.info(`Метки «${LABEL}» нет.`);

            // пути владельца — по CODEOWNERS из целевой ветки, не из PR
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path: '.github/CODEOWNERS', ref: pr.base.ref });
            const patterns = Buffer.from(file.content, 'base64').toString('utf8').split('\n')
              .map(line => line.replace(/#.*/, '').trim()).filter(Boolean).map(line => line.split(/\s+/)[0]);
            // как в CODEOWNERS: «/» в начале — от корня, «/» в конце — папка со всем внутри, «*» — любые символы, кроме «/»
            const owns = (pattern, path) => {
              let p = pattern;
              const rooted = p.startsWith('/');
              if (rooted) p = p.slice(1);
              const dir = p.endsWith('/');
              if (dir) p = p.slice(0, -1);
              const body = p.split('*').map(s => s.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('[^/]*');
              return new RegExp(`${rooted ? '^' : '(^|/)'}${body}${dir ? '/' : '(/|$)'}`).test(path);
            };
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const touched = files.flatMap(f => [f.filename, f.previous_filename].filter(Boolean));
            const owned = touched.filter(path => patterns.some(p => owns(p, path)));
            if (owned.length > 0) {
              core.notice(`PR #${number} трогает пути владельца (${owned.join(', ')}) — его сливает владелец.`);
              return;
            }

            // проверки — на последнем коммите PR, все зелёные
            const { data: checks } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha, check_name: CHECK, filter: 'latest' });
            if (checks.check_runs.length === 0 || checks.check_runs.some(r => r.status !== 'completed' || r.conclusion !== 'success')) {
              return core.info(`«${CHECK}» на ${pr.head.sha.slice(0, 7)} ещё не зелёные — дождусь их.`);
            }

            if (pr.auto_merge) return core.info(`PR #${number}: автослияние уже включено.`);
            // включить auto-merge; если ждать нечего, GitHub сливает сразу — делаем то же,
            // ровно тот коммит, который проверили
            try {
              await github.graphql('mutation($id: ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) { clientMutationId } }', { id: pr.node_id });
              core.notice(`PR #${number}: автослияние (squash) включено.`);
            } catch (e) {
              if (/clean status/i.test(String(e.message))) {
                await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: 'squash', sha: pr.head.sha });
                core.notice(`PR #${number}: ждать было нечего — слит (squash).`);
              } else if (/auto.?merge is not allowed|not enabled/i.test(String(e.message))) {
                core.warning('Автослияние выключено в настройках: Settings → General → Pull Requests → Allow auto-merge.');
              } else {
                throw e;
              }
            }
