# Автослияние безопасных PR (ADR студии 0018, классы 1 и 2). Сливает PR (squash), когда сошлось
# всё:
#   - на PR стоит метка «ревью: ок» — её ставит Ревьюер, другая сессия, чем исполнитель;
#   - «Проверки PR» (pr.yml) зелёные на одобренном коммите, а других красных или
#     незаконченных проверок на нём нет;
#   - в PR нет путей владельца из .github/CODEOWNERS — их сливает только владелец.
# Метка одобряет коммит: бот пишет его хеш в PR, и слить можно только его. Новый коммит
# снимает метку и выключает автослияние: Ревьюер смотрел прежний код.
#
# Логика — в общем наборе студии (ADR студии 0022): Nefeste/gornitsa-kit, workflow
# automerge.yml. pull_request_target и workflow_run берут этот файл из main, CODEOWNERS тоже
# выгружается из main: PR не может переписать правила своего слияния. Код PR не выгружается
# и не запускается. Последнее слово — за защитой ветки main: обязательные проверки и ревью
# владельца кода включает владелец (docs/05-process.md, «Слияние»).
name: Автослияние

on:
  pull_request_target:
    branches: [main]
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [PR]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: automerge-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automerge:
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request'
    uses: Nefeste/gornitsa-kit/.github/workflows/automerge.yml@v1
    with:
      check: 'Проверки PR'
      label: 'ревью: ок'
    secrets:
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
