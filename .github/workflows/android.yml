# из votchina: .github/workflows/android.yml @ 1cd15dc
# Только на тег версии vX.Y.Z, ручного запуска нет (ADR студии 0019, решение владельца
# 03.10.2026): проверки, сценарий в браузере, APK, подписанный постоянным ключом, и
# публикация в Releases (docs/05-process.md «Сборка и выкладывание», ADR 0015). Слияние в main
# сборку не запускает: на каждый PR идут быстрые проверки pr.yml.
#
# Без секретов ключа релиза нет никогда: APK собирается только на проверку (манифест,
# разрешения, 16 КБ, размер) и выбрасывается — подписанный отладочным ключом файл не должен
# попасть ни на чей телефон.
#
# AAB для Google Play не собирается (решение владельца 03.10.2026 — экономия минут Actions).
# Вернуть — второй строкой матрицы в задании «Ключ подписи»: target aab, store play, задача
# Gradle для бандла; шаги сборки, проверок и релиза AAB уже понимают.
name: Android

on:
  # тег ставит владелец, когда версия готова к телефону: vX.Y.Z — тот же номер, что в app.json
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Тег должен называть ту версию, что в app.json: иначе релиз v0.3.2 с файлами 0.3.1. Отдельным
  # заданием и первым — чтобы при ошибке не сгорели минуты проверок и сборки (так же в «Вотчине»).
  version:
    name: Тег и версия
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: app.json
          sparse-checkout-cone-mode: false
      - name: Тег и версия совпадают
        run: |
          V=$(node -p "require('./app.json').expo.version")
          if [ "$GITHUB_REF_NAME" != "v$V" ]; then echo "::error::Тег $GITHUB_REF_NAME, а в app.json версия $V. Тег — v$V."; exit 1; fi

  checks:
    name: Проверки
    needs: version
    runs-on: ubuntu-24.04
    # С пределом в 20 минут задание сняли на тегах v0.5.1 и v0.5.2: тесты шли 13,7 минуты, «Виртуальный врач» — 5,5,
    # и APK не вышел. С 0.5.3 оба короче, а предел — с запасом на разброс машин (docs/05-process.md, «Релизы и проверки»).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm ci
      - name: Медицинская база — сборка и валидатор
        run: bun tools/content/build.ts
      - name: Типы приложения
        run: npx tsc --noEmit
      - name: Типы инструментов и тестов
        run: npx tsc --noEmit -p tools
      - name: Линтер
        run: npm run lint
      - name: Тесты
        run: bun test tools/test
      # Пороги — docs/11-content.md §6; полный прогон по всем отделениям — отдельно.
      - name: Виртуальный врач, 3000 пациентов
        run: bun tools/sim/doctor.ts --n 3000

  # Веб-сборка и сценарий Playwright по всем экранам (docs/06-testing.md §4). Здесь же
  # проверяется, что движок в V8 даёт тот же отпечаток тысячи пациентов, что в Bun.
  # Только в сборке, не на PR: сценарий гоняется локально перед пушем, а в CI он — ворота
  # релиза, которые берегут минуты Actions (решение владельца).
  web:
    name: Веб-сборка и сценарий
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm ci
      - run: npm run export:web
      - name: Chromium для Playwright
        run: npx playwright install --with-deps chromium
      - name: Сценарий
        run: bun tools/e2e/smoke.ts
      # Снимки экранов — только когда сценарий упал, и на неделю: место под артефакты общее на все
      # закрытые репозитории аккаунта и в октябре 2026 кончилось (docs/05-process.md, «Место под
      # артефакты»). Не выгрузились — не беда: задание уже красное, а сценарий пишет те же снимки
      # и локально (tools/e2e/out/).
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: screens-${{ github.run_number }}
          path: tools/e2e/out/
          if-no-files-found: ignore
          retention-days: 7

  # Есть ли постоянный ключ — решается один раз, до сборок: от этого зависит, что собирать.
  key:
    name: Ключ подписи
    needs: version
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.k.outputs.ready }}
      matrix: ${{ steps.k.outputs.matrix }}
    steps:
      - id: k
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK='{"target":"apk","store":"","task":"assembleRelease","file":"android/app/build/outputs/apk/release/app-release.apk"}'
          if [ -z "$KEYSTORE_B64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[$APK]}" >> "$GITHUB_OUTPUT"
            echo "::warning::Секретов ключа подписи нет: APK собирается только на проверку и выбрасывается, релиза не будет. Как завести ключ — docs/05-process.md."
            exit 0
          fi
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Секреты ключа заданы не все: нужны ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS и ANDROID_KEY_PASSWORD."
            exit 1
          fi
          if [ -z "$CERT" ]; then
            echo "::error::Ключ есть, а переменной репозитория ANDROID_CERT_SHA256 нет — не с чем сверить подпись. Отпечаток: keytool -list -v -keystore anamnez-release.jks -alias anamnez | grep SHA256"
            exit 1
          fi
          echo "ready=yes" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":[$APK]}" >> "$GITHUB_OUTPUT"

  # Матрица сборок: сейчас только APK (Releases и RuStore). Если вернуть AAB, это вторая сборка из того же коммита, параллельно. В одном задании нельзя: Gradle не считает переменные окружения
  # входом сборки JS, и вторая сборка тихо взяла бы бандл первой.
  build:
    name: Сборка ${{ matrix.target }}
    needs: [key]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.key.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      # Бандл JS берёт базу из src/content/generated — её собирают скрипты (ADR 0007).
      - name: Медицинская база
        run: bun tools/content/build.ts
      - name: Нативный проект (expo prebuild)
        run: npx expo prebuild --platform android --no-install
      - name: Больше памяти Gradle
        # в созданном файле нет перевода строки в конце — начинаем с него; действует последнее значение
        run: printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> android/gradle.properties

      # Ключ, подпись и содержимое — действия общего набора студии (ADR студии 0022):
      # Nefeste/gornitsa-kit, actions/android-*. Секретов нет — подпись отладочная, релиза нет.
      - id: keystore
        if: needs.key.outputs.ready == 'yes'
        uses: Nefeste/gornitsa-kit/actions/android-keystore@v1
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          gradle-prefix: ANAMNEZ

      - name: Сборка ${{ matrix.target }}
        working-directory: android
        env:
          NODE_ENV: production
          # для какого магазина: play — Google Play, без экрана «Поддержать» (docs/05-process.md)
          EXPO_PUBLIC_STORE: ${{ matrix.store }}
          # пароли нужны Gradle, только если выше подложен файл ключа; в файлы они не пишутся
          ORG_GRADLE_PROJECT_ANAMNEZ_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ANAMNEZ_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ANAMNEZ_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Только 64-битный ARM: игра — для современных телефонов (NFR-PRF-1), 32-битные
        # библиотеки почти вдвое увеличили бы APK ради телефонов, которые мы не поддерживаем.
        run: ./gradlew ${{ matrix.task }} --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      # Подпись проверяется на готовом файле, а не по настройкам: «должен был подписаться»
      # и «подписан» — разные вещи. Отпечаток постоянного ключа закреплён переменной
      # ANDROID_CERT_SHA256 — чужой ключ в секретах остановит сборку. Файл ключа удаляется.
      - name: Подпись
        id: cert
        uses: Nefeste/gornitsa-kit/actions/android-signature@v1
        with:
          file: ${{ matrix.file }}
          expected: ${{ vars.ANDROID_CERT_SHA256 }}
          permanent: ${{ steps.keystore.outputs.permanent || 'no' }}
          keystore-file: ${{ steps.keystore.outputs.file }}

      # Что внутри: 16 КБ (Google Play требует для Android 15+), только 64-битный ARM,
      # разрешения ровно по белому списку .github/apk-permissions.txt и без сети (ADR 0006,
      # её вырезает из релиза plugins/with-release-no-internet.js), запретные разрешения
      # студии (их нет в политике конфиденциальности), target API, размер (NFR-SIZE-1:
      # не больше 100 МБ). Автобэкап не проверяется: игра без сети, ключа устройства нет.
      # Нужное разрешение — в белый список и в docs/05-process.md, ненужное — в
      # blockedPermissions в app.json.
      - name: Содержимое
        uses: Nefeste/gornitsa-kit/actions/android-contents@v1
        with:
          file: ${{ matrix.file }}
          allow-file: .github/apk-permissions.txt
          forbid: 'INTERNET|NETWORK_STATE|FOREGROUND_SERVICE|INSTALL_REFERRER'
          backup: any
          min-target-sdk: '36'
          only-arm64: 'true'
          max-size-mb: '100'

      - name: Собрать
        if: needs.key.outputs.ready == 'yes'
        env:
          FILE: ${{ matrix.file }}
          TARGET: ${{ matrix.target }}
          LABEL: ${{ steps.cert.outputs.label }}
          SHA: ${{ steps.cert.outputs.sha256 }}
        run: |
          mkdir -p dist
          cp "$FILE" "dist/anamnez-${{ github.run_number }}.$TARGET"
          printf '%s\n%s\n' "$LABEL" "$SHA" > "dist/signature-$TARGET.txt"
          ls -la dist

      # Файлы — заданию «Релиз» через кэш Actions, а не артефактом (docs/05-process.md, «Место
      # под артефакты»): кэш в это место не входит. Ключ — своя строка матрицы и прогон.
      - uses: actions/cache/save@v4
        if: needs.key.outputs.ready == 'yes'
        with:
          path: dist
          key: dist-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Одна публикация на все сборки: тег vX.Y.Z — релиз «Latest» с разделом версии из README.
  release:
    name: Релиз
    needs: [checks, web, key, build]
    if: needs.key.outputs.ready == 'yes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: repo
          sparse-checkout: |
            app.json
            README.md
          sparse-checkout-cone-mode: false
      # Те файлы, что собраны и проверены выше, — по ключу на строку матрицы. Путь — тот же, что
      # при сохранении (он входит в версию кэша); перезапуск одного «Релиза» берёт сборку прежней
      # попытки. AAB — только если его вернули в матрицу (шапка файла); тогда без него релиза нет.
      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-apk-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dist-apk-${{ github.run_id }}-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        if: contains(needs.key.outputs.matrix, '"target":"aab"')
        with:
          path: dist
          key: dist-aab-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dist-aab-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: Подпись
        id: sig
        run: |
          ls -la dist
          echo "label=$(sed -n 1p dist/signature-apk.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=$(sed -n 2p dist/signature-apk.txt)" >> "$GITHUB_OUTPUT"
      - name: Версия и «Что нового»
        id: ver
        run: |
          # тег сверен с app.json в задании «Тег и версия»
          V=$(node -p "require('./repo/app.json').expo.version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # «Что нового» — раздел «### X.Y.Z …» из «## Версии» README, до следующего заголовка
          awk -v v="$V" 'index($0, "### " v) == 1 { on = 1; next } on && /^##/ { exit } on' repo/README.md > notes.md
          {
            cat notes.md
            echo
            echo "---"
            echo "**anamnez-${{ github.run_number }}.apk** — для телефона: скачайте и откройте. Этот же файл — для RuStore."
            if compgen -G 'dist/*.aab' > /dev/null; then
              echo "**anamnez-${{ github.run_number }}.aab** — только для загрузки в Google Play Console (на телефон не ставится)."
              echo "Подписаны ${{ steps.sig.outputs.label }}, SHA-256 сертификата: \`${{ steps.sig.outputs.sha }}\`."
            else
              echo "Подписан ${{ steps.sig.outputs.label }}, SHA-256 сертификата: \`${{ steps.sig.outputs.sha }}\`."
            fi
            echo "Собрано из коммита ${{ github.sha }}, сборка ${{ github.run_number }}."
          } > release.md
          cat release.md
      - name: Релиз vX.Y.Z
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Анамнез ${{ steps.ver.outputs.version }}
          body_path: release.md
          files: |
            dist/*.apk
            dist/*.aab
          prerelease: false
          make_latest: true
