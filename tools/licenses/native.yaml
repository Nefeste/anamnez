# Записи под CC BY в звуках игры (ADR 0019, assets/audio/LICENSES.md): условия лицензий — назвать название, автора и
# источник, указать лицензию и что запись изменена (`via`). Тексты лицензий — дословно с creativecommons.org.
sounds:
  - name: >-
      Av. Pradera 1101, Azteca, 37520 León de los Aldama, Gto., Mexico - Gente formada esperando su turno en el área
      para sacar cita con un doctor especialista que necesite ver en el hospital del ISSSTE.
    holder: Ed Visoso
    license: CC-BY-3.0
    via: голоса в фоне амбулатории — отрезок 42 с, глуше и тише, стуки приглушены, смешан с гулом
    source: https://archive.org/details/aporee_66705_77139
    texts: [cc-by-3.0.txt]
  - name: Automatic Electric (AE) Telephone Ringing
    holder: Cloud16 Films
    license: CC-BY-4.0
    via: телефон регистратуры — звонок укорочен до секунды, три звонка, глуше и тише
    source: https://archive.org/details/yellow-ae-80
    texts: [cc-by-4.0.txt]
