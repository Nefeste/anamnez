# Что в сборке для Android, кроме кода JS, и под какими лицензиями (spec 2026-10-licenses, 0.5.6): нативные библиотеки
# React Native, модулей Expo и Skia, шрифты и, с 0.6.6, записи звуков под CC BY. Код JS в сборке и его лицензии собирает
# `tools/licenses/build.ts` из карты кода сборки. Тексты лицензий — в `texts/`, дословно из источника по ссылке
# `source`; общий текст Apache 2.0 — с apache.org, а правообладатель — в `holder`. `maven` — группы и артефакты Gradle,
# которые запись покрывает (`licenses.test.ts` сверяет их с `android/build.gradle` модулей); `version` сверяется с тем,
# что стоит в node_modules.

android:
