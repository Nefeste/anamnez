id: exam.coagulation
name: { ru: "Коагулограмма" }
kind: lab
# ориентировочное исследование гемостаза — протромбиновый индекс и МНО (spec 2026-10-chapter-4, часть 52а): при гепатите —
# критерий тяжести (718_2 и 672_2, приложение А3), при печёночной коме — не позднее 3 часов (718_2, раздел 2.3, УУР C, УДД 5;
# критерий качества Б-7). Кровь из вены; коагулометра в игре нет — на анализаторе биохимии, упрощение; точность и ₽ —
# игровая оценка
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.procedure
time: { procedure: 3, turnaround: 45 }
cost: 500
discomfort: 1
checks:
  - { f: lab.pti_low, sens: 95, spec: 97 }
texts:
  hint:
    ru: "Свёртываемость крови: протромбиновый индекс и МНО. При остром гепатите показывает, справляется ли печень: снижен протромбиновый индекс — тяжёлая форма, а с энцефалопатией — печёночная недостаточность."
  summary:
    ru: "Кровь из вены: протромбиновый индекс, МНО, время свёртывания."
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3 (УУР C, УДД 5): коагулограмма — протромбиновое время, МНО, время свёртывания — при геморрагическом синдроме, при печёночной коме — не позднее 3 часов от поступления; приложение А3: ПТИ — критерий тяжести; критерии качества А-3 и Б-7; точность — игровая оценка" }
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; приложение А3: протромбиновый индекс — критерий тяжести, менее 80 % — тяжёлая форма; раздел 2.3.1: при тяжёлом течении — снижение факторов свёртывания и ПТИ" }
review: draft
