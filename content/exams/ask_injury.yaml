id: exam.ask_injury
name: { ru: "Расспрос: травма" }
kind: ask
time: { procedure: 2 }
cost: 0
discomfort: 0
# при травме колена — каждому, первым: механизм и подкашивание уточняют у всех (691_2, раздел 2.1;
# критерий диагноза 2 — характерный механизм травмы); без него после ложноотрицательного теста
# Лахмана разумный врач был уверен в ушибе (часть 32д)
routineFor: [sym.knee_pain]
# жалоба травмы — факт: без травмы о падении не расскажут, ложной она не бывает (spec 100); с
# пятью жалобами ложные 3 % давали у каждого седьмого без травмы «травму» — часть 32б
checks:
  - { f: sym.wrist_pain, sens: 95, spec: 100 }
  - { f: sym.ankle_pain, sens: 95, spec: 100 }
  - { f: sym.foot_pain, sens: 95, spec: 100 }
  - { f: sym.hip_pain, sens: 95, spec: 100 }
  - { f: sym.shoulder_pain, sens: 95, spec: 100 }
  - { f: sym.chest_injury_pain, sens: 95, spec: 100 }
  - { f: sym.head_injury, sens: 95, spec: 100 }
  - { f: sym.hand_wound, sens: 95, spec: 100 }
  - { f: sym.head_wound, sens: 95, spec: 100 }
  - { f: sym.animal_bite, sens: 98, spec: 100 }
  - { f: sym.knee_pain, sens: 95, spec: 100 }
  - { f: sym.immediate_dysfunction, sens: 85, spec: 85 }
  # колено (часть 32д): подкашивается ли, как травмировал — удар или поворот при стоящей стопе
  - { f: sym.knee_instability, sens: 85, spec: 95 }
  - { f: hx.knee_blow, sens: 90, spec: 90 }
  - { f: hx.knee_twist, sens: 85, spec: 90 }
  # давность раны (часть 32г-2): меньше суток — шов, больше — обработка без шва (688_2, раздел 3.2)
  - { f: hx.wound_late, sens: 95, spec: 98 }
  # ожог (часть 32д-2): когда и чем обжёгся, сколько действовал агент (687_3, раздел 2.1)
  - { f: sym.burn, sens: 95, spec: 100 }
  # боль в ноге (часть 33а): где болит — и при надрыве мышцы, и при тромбе; без этого вопроса у того,
  # кто о ноге не говорил, болезни с одной этой жалобой нечем исключить
  - { f: sym.leg_pain, sens: 95, spec: 100 }
texts:
  hint:
    ru: "Как именно случилась травма и что было сразу после неё. Если двигать суставом стало невозможно сразу, это довод за перелом или вывих; при ушибе движения пропадают позже, по мере отёка."
  summary:
    ru: "Что и где болит, обстоятельства и механизм травмы, время с её момента, что стало с движениями сразу после неё."
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1: сбор анамнеза — обстоятельства, механизм, время с момента травмы; раздел 1.6: при ушибе движения вначале сохранены, при переломе и вывихе невозможны сразу; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей.", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1 (УУР C, УДД 5): в анамнезе — время и обстоятельства травмы, вид и продолжительность действия агента, что уже сделали, сопутствующие болезни" }
review: draft
