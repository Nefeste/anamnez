id: exam.electrolytes
name: { ru: "Натрий и калий крови" }
kind: lab
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.procedure
time: { procedure: 5, turnaround: 60 }
cost: 250
# надпочечниковая недостаточность в анамнезе — каждому (spec 2026-10-chapter-4, часть 56а): натрий и калий нужны «для
# лабораторной оценки степени тяжести состояния пациента и эффективности терапии» (524_3, раздел 2.3)
routineSeen: [hx.adrenal_insufficiency]
discomfort: 1
checks:
  - { f: lab.na_low, sens: 97, spec: 97 }
  - { f: lab.k_high, sens: 97, spec: 97 }
  # расчётная осмолярность плазмы по натрию, калию и глюкозе (часть 73; Алгоритмы, 2023, с. 47–48): выше 320 при ГГС;
  # точность — игровая оценка
  - { f: lab.osm_high, sens: 95, spec: 98 }
texts:
  hint:
    ru: "Натрий и калий в крови. Низкий натрий с высоким калием при рвоте и низком давлении — признак надпочечникового криза. Ждать ответа, чтобы начать гидрокортизон, не нужно."
  summary:
    ru: "Кровь из вены, биохимический анализатор."
sources:
  - { kind: guideline, title: "Первичная надпочечниковая недостаточность", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/524_3", note: "ID 524_3, опубликованы 22.04.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3: исследование натрия и калия не подтверждает и не исключает диагноз, но проводится для оценки тяжести состояния и эффективности терапии; раздел 1.6, табл. 3: гипонатриемия менее 132 ммоль/л и гиперкалиемия при кризе; точность — игровая оценка" }
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом. 11-й выпуск", org: "Под ред. И.И. Дедова, М.В. Шестаковой, А.Ю. Майорова", year: 2023, url: "https://doi.org/10.14341/DM13042", note: "Сахарный диабет. 2023;26(2S):1–157, сверено 15.10.2026; раздел 8.2, с. 47–48: при ГГС осмолярность плазмы > 320 мосмоль/л, осмолярность = 2 (Na+ + K+) + глюкоза; раздел 8.1, с. 45: Na+, K+ плазмы при ДКА и расчёт эффективной осмолярности; точность — игровая оценка" }
review: draft
