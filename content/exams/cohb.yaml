id: exam.cohb
name: { ru: "Карбоксигемоглобин крови" }
kind: lab
room: room.lab
# анализатора газов крови в игре нет — биохимический; ответ быстрее биохимии, как у лактата, — игровая оценка
equipment: [eq.biochem_analyzer]
collect: room.procedure
time: { procedure: 5, turnaround: 20 }
cost: 300
# «Рекомендовано всем пациентам с целью диагностики отравления монооксидом углерода исследование уровня карбоксигемоглобина в
# крови» (spec 2026-10-chapter-4, часть 57б; 885_1, раздел 2.3, УУР С, УДД 5; критерий качества 2): каждому с пожара и угоревшему
# у печи или мотора, а при розовых слизистых и копоти — когда их увидели. Точность — игровая оценка
routineFor: [sym.smoke_inhaled, sym.co_home]
routineSeen: [sign.pink_mucosa, sign.soot_face]
discomfort: 1
checks:
  - { f: lab.cohb_high, sens: 97, spec: 99 }
texts:
  hint:
    ru: "Сколько гемоглобина связано с угарным газом, в процентах. Подтверждает отравление. Тяжесть при поступлении по нему не судят: в дороге, особенно с кислородом, угарный газ уходит из крови — на месте было больше."
  summary:
    ru: "Кровь из вены; доля карбоксигемоглобина в процентах к общему гемоглобину."
sources:
  - { kind: guideline, title: "Токсическое действие окиси углерода. Токсическое действие других газов, дымов и паров", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/885_1", note: "ID 885_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2.3 (УУР С, УДД 5): всем пациентам — уровень карбоксигемоглобина в крови в процентах к общему гемоглобину, основной метод диагностики; раздел 1.5: при поступлении он может быть значительно ниже, чем на месте; критерий качества 2; время и точность — игровая оценка" }
review: draft
