  # 2.1); точность — игровая оценка
  - { f: hx.drug_use, sens: 75, spec: 99 }
texts:
  hint:
    ru: "Курение — главный фактор риска ХОБЛ, инфаркта и пневмонии; алкоголь повышает давление и раздражает желудок. О спиртном часто недоговаривают."
  summary:
    ru: "Курит ли и сколько лет, как часто и сколько выпивает, бывают ли запои, когда выпивал в последний раз и тянет ли выпить, где работает."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: расспрос больного", note: "точность расспроса — игровая оценка, не из литературы" }
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 2.1: токсикологический анамнез у такого больного удаётся собрать далеко не всегда; точность расспроса — игровая оценка" }
