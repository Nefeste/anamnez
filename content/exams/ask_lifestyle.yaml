id: exam.ask_lifestyle
name: { ru: "Образ жизни: курение, алкоголь" }
kind: ask
time: { procedure: 1 }
cost: 0
discomfort: 0
checks:
  - { f: hx.smoking, sens: 95, spec: 99 }
  - { f: hx.alcohol, sens: 80, spec: 97 }
  # с частью 54б (spec 2026-10-chapter-4): запои и похмелье по утрам — вопрос 4 CAGE (711_2, приложение Г3), бросил ли пить и
  # тянет ли выпить — критерии синдрома отмены (784_1, разделы 1.6 и 2); о выпивке недоговаривают — точность игровая
  - { f: hx.binge, sens: 80, spec: 99 }
  - { f: hx.stopped_drinking, sens: 90, spec: 99 }
  - { f: sym.craving, sens: 80, spec: 99 }
  # наркотики (spec 2026-10-chapter-4, часть 57а): у отравленного выяснить удаётся далеко не всегда — расскажут знакомые (743_2, раздел
  # 2.1); точность — игровая оценка
  - { f: hx.drug_use, sens: 75, spec: 99 }
  # печь, газовая колонка или мотор в закрытом помещении (spec 2026-10-chapter-4, часть 57б; 885_1, раздел 2): выяснить удаётся
  # «далеко не всегда» (раздел 2.1) — точность игровая
  - { f: sym.co_home, sens: 75, spec: 99 }
  # что пил (spec 2026-10-chapter-4, часть 57в): какую спиртосодержащую жидкость принял, где купил, зачем (873_1, раздел 2.1); собрать
  # токсикологический анамнез удаётся «далеко не всегда» (там же) — точность игровая
  - { f: sym.methanol_drink, sens: 75, spec: 99 }
  - { f: sym.antifreeze_drink, sens: 75, spec: 99 }
  # где и как работает (spec 2026-10-occupation, 0.5.10): тяжёлый труд, пыль и газы, лес и поле — о работе рассказывают
  # охотно; точность — игровая оценка
  - { f: hx.heavy_labor, sens: 95, spec: 99 }
  - { f: hx.dust_work, sens: 90, spec: 99 }
  - { f: hx.outdoor_work, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Курение — главный фактор риска ХОБЛ, инфаркта и пневмонии; алкоголь повышает давление и раздражает желудок. О спиртном часто недоговаривают."
  summary:
    ru: "Курит ли и сколько лет, как часто и сколько выпивает, бывают ли запои, когда выпивал в последний раз и тянет ли выпить, где работает и чем топят дома."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: расспрос больного", note: "точность расспроса — игровая оценка, не из литературы" }
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 2.1: токсикологический анамнез у такого больного удаётся собрать далеко не всегда; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Токсическое действие окиси углерода. Токсическое действие других газов, дымов и паров", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/885_1", note: "ID 885_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2: печи и отопительные приборы, двигатели внутреннего сгорания в плохо вентилируемых помещениях; раздел 2.1: в случае отравления угарным газом анамнез собрать далеко не всегда возможно; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2.1: выяснить, какую спиртосодержащую жидкость принял пациент, где купил, с какой целью и был ли приём этанола; общие принципы сбора токсикологического анамнеза применить удаётся далеко не всегда; точность — игровая оценка" }
review: draft
