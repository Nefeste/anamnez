id: exam.ask_seizure
name: { ru: "Расспрос: приступ — у очевидцев и самого" }
kind: ask
time: { procedure: 3 }
cost: 0
discomfort: 0
# каждому с судорожным приступом (spec 2026-10-chapter-3, часть 44в): описание приступа пациентом и очевидцами,
# бывали ли приступы раньше, есть ли эпилепсия, не пропускал ли лекарство (741_1, разделы 2.1 и 1.6.7). При статусе
# — не первым делом: противосудорожное за 5 минут, расспросить успеют и потом. Точность — игровая оценка: о пропуске
# таблеток говорят не все
complaints: [sym.seizure, sym.seizure_ongoing]
routineFor: [sym.seizure]
checks:
  - { f: sym.seizure, sens: 98, spec: 99 }
  - { f: sym.seizure_ongoing, sens: 100, spec: 100 }
  - { f: hx.first_seizure, sens: 98, spec: 98 }
  - { f: hx.epilepsy, sens: 98, spec: 99 }
  - { f: hx.missed_aed, sens: 90, spec: 97 }
texts:
  hint:
    ru: "Как начался приступ и сколько длился, бывали ли такие раньше, есть ли эпилепсия, не пропущено ли лекарство — у самого и у тех, кто видел. Приступ впервые — ищут причину: КТ головы и стационар."
  summary:
    ru: "Каким был приступ, бывали ли раньше, эпилепсия и пропуски лекарства — у самого больного и у очевидцев."
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 2.1: подробный сбор жалоб и анамнеза с описанием приступов пациентом и очевидцами — что было до, во время и после приступа; раздел 1.6.7: несоблюдение режима приёма противоэпилептических препаратов — фактор риска статуса; точность расспроса — игровая оценка" }
review: draft
