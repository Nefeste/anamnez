texts:
  hint:
    ru: "Расспрос открывает симптомы, о которых пациент не сказал сам: кашель, температура, горло, одышка, свист в груди. Самое дешёвое и часто самое полезное обследование."
  summary:
    ru: "Кашель, мокрота и кровь в ней, температура, озноб, горло, насморк, ломота, одышка — и началась ли она вдруг, свист и стеснение в груди, ночные приступы."
