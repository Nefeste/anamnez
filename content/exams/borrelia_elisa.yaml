id: exam.borrelia_elisa
name: { ru: "Антитела к боррелиям (ИФА)" }
kind: lab
# ИФА на IgM и IgG к боррелиям (spec 2026-10-chapter-4, часть 51а; 566_2, разделы 2 и 2.3.2, критерии качества 9 и 12): кровь из
# вены в процедурном, иммунохимический анализатор лаборатории. Сколько больных с антителами, решает запись болезни (IgM — со
# 2-й недели); точность самого анализа и ₽ — игровая оценка: в 566_2 чисел нет
room: room.lab
equipment: [eq.immuno_analyzer]
collect: room.procedure
time: { procedure: 3, turnaround: 60 }
cost: 700
discomfort: 1
checks:
  - { f: lab.borrelia_igm, sens: 90, spec: 95 }
texts:
  hint:
    ru: "Антитела к боррелиям в крови. Появляются со 2-й недели болезни: при свежей мигрирующей эритеме анализ часто ещё отрицателен и для диагноза не нужен; при поражении нервов и сердца подтверждает болезнь Лайма."
  summary:
    ru: "Кровь из вены, ИФА: антитела IgM и IgG к боррелиям."
sources:
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2: IgM — со 2 недели болезни; раздел 2.3.2: не ранее 10–14 дней от начала заболевания; чувствительности и специфичности в тексте нет — игровая оценка" }
review: draft
