id: exam.burn_exam
name: { ru: "Осмотр ожога" }
kind: physical
time: { procedure: 5 }
cost: 0
discomfort: 2
complaints: [sym.burn]
# площадь и глубину ожога определяют каждому (687_3, раздел 2.2, УУР C, УДД 5): от них — тактика
routineFor: [sym.burn]
# площадь по правилу ладони ориентировочна, небольшая переоценка допустима (раздел 2.2); точность
# осмотра — игровая оценка
checks:
  - { f: sign.burn_blisters, sens: 95, spec: 95 }
  - { f: sign.burn_eschar, sens: 95, spec: 95 }
  - { f: sign.burn_large, sens: 95, spec: 95 }
texts:
  hint:
    ru: "Площадь ожога считают ладонями больного: ладонь — около 1 % поверхности тела. Глубину видно по пузырям и струпу; если струп есть, чувствительность проверяют пробами."
  summary:
    ru: "Осмотр ожоговой раны: площадь по правилу ладони, пузыри и их содержимое, дно раны, струп, отёк, не опоясывает ли ожог руку или ногу."
sources:
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей.", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2 (УУР C, УДД 5): визуальное исследование и определение площади и глубины ожога всем — правило ладони, признаки степеней; на догоспитальном этапе абсолютной точности не требуется, допустима незначительная гипердиагностика; раздел 3.2.2: после туалета раны глубину и площадь оценивают точнее; точность осмотра — игровая оценка" }
review: draft
