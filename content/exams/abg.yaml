id: exam.abg
name: { ru: "Кислотно-основное состояние крови" }
kind: lab
room: room.lab
# анализатора газов крови в игре нет — биохимический; ответ быстрее биохимии, как у лактата, — игровая оценка
equipment: [eq.biochem_analyzer]
collect: room.procedure
time: { procedure: 5, turnaround: 20 }
cost: 400
# «Рекомендуется всем пациентам с острым отравлением токсифицирующимися спиртами средней и тяжелой степени с целью своевременной
# диагностики метаболического ацидоза … проведение исследования кислотно-основного состояния и газов крови» (spec 2026-10-chapter-4,
# часть 57в; 873_1, раздел 2.3, УУР С, УДД 5; критерий качества 4 — без оговорки о степени): каждому, кто пил метанол или антифриз, а
# при дыхании Куссмауля — когда его увидели. Точность — игровая оценка
routineFor: [sym.methanol_drink, sym.antifreeze_drink]
routineSeen: [sign.kussmaul]
discomfort: 1
checks:
  - { f: lab.acidosis, sens: 97, spec: 98 }
texts:
  hint:
    ru: "pH, углекислый газ, кислород и бикарбонат крови. Показывает ацидоз — закисление крови: при отравлении метанолом и этиленгликолем он главная угроза жизни, его снимают натрия гидрокарбонатом, а pH 7,15 и ниже — показание к гемодиализу."
  summary:
    ru: "Кровь из артерии или вены; pH, pCO₂, pO₂, бикарбонат и дефицит оснований."
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2.3 (УУР С, УДД 5): КОС и газы крови — pH, pCO2, pO2, HCO3, BE — при средней и тяжёлой степени, тяжёлые часто с декомпенсированным смешанным ацидозом и гиперкалиемией; раздел 3.2: ацидоз — главная опасность для жизни, pH 7,15 и ниже — показание к гемодиализу; критерий качества 4 — исследование КОС и газов крови; время и точность — игровая оценка" }
review: draft
