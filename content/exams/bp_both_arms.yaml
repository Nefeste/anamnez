id: exam.bp_both_arms
name: { ru: "Давление на обеих руках" }
kind: bedside
time: { procedure: 3 }
cost: 0
discomfort: 0
# при внезапной боли в груди или спине — каждому (spec 2026-10-chapter-3, часть 43а): «АД должно измеряться на
# обеих руках» — чтобы выявить или исключить разницу при расслоении аорты (946_1, раздел 2.2); ноги в игре не меряют
routineFor: [sym.tearing_pain]
checks:
  # точность — игровая оценка: два измерения одним тонометром
  - { f: sign.bp_arm_difference, sens: 90, spec: 97 }
texts:
  hint:
    ru: "Давление меряют на правой и на левой руке и сравнивают. Разница верхнего больше 20 при боли в груди — признак расслоения аорты: оно перекрывает ветвь к руке. Обычная разница — до 10."
  summary:
    ru: "Медсестра измеряет давление на правой и на левой руке и сравнивает верхнее."
sources:
  - { kind: guideline, title: "Расслоение аорты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/946_1", note: "ID 946_1, опубликованы 23.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.2: АД должно измеряться на обеих руках и обеих нижних конечностях, чтобы выявить или исключить разницу АД при ОАС; точность — игровая оценка" }
review: draft
