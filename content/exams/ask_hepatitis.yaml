id: exam.ask_hepatitis
name: { ru: "Расспрос: желтуха, моча, кровь" }
kind: ask
time: { procedure: 2 }
cost: 0
discomfort: 0
# эпиданамнез и жалобы при подозрении на гепатит (spec 2026-10-chapter-4, часть 52а): цвет мочи и кала, желтуха у близких и
# поездки (718_2, раздел 2.1, УУР C, УДД 5), инъекции, переливания, татуировки и связи (672_2, раздел 2.1) — первым, когда
# пожелтел или потемнела моча. Точность — игровая оценка
routineFor: [sym.yellow_skin, sym.dark_urine]
checks:
  - { f: sym.yellow_skin, sens: 95, spec: 99 }
  - { f: sym.dark_urine, sens: 95, spec: 98 }
  - { f: sym.pale_stool, sens: 90, spec: 98 }
  - { f: hx.jaundice_contact, sens: 85, spec: 97 }
  - { f: hx.parenteral_risk, sens: 80, spec: 95 }
texts:
  hint:
    ru: "Темнеет ли моча, светлеет ли кал; болел ли кто-то рядом желтухой, куда ездил; были ли уколы, переливания, татуировки, случайные связи. Гепатит A приходит с едой и водой за месяц до болезни, гепатит B — с кровью за 1–6 месяцев."
  summary:
    ru: "Желтели ли глаза и кожа, цвет мочи и кала; желтуха у близких, поездки; уколы, переливания, татуировки, случайные связи за полгода."
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1 (УУР C, УДД 5): пребывание в очаге, поездки в эндемичные районы, вспышка, сезонность, совместное проживание и сексуальные отношения с больным; потемнение мочи и обесцвечивание кала; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1: эпидемиологический анамнез — парентеральные вмешательства, инъекции, переливания, половые контакты; раздел 1.3: пути передачи" }
review: draft
