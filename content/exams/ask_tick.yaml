id: exam.ask_tick
name: { ru: "Расспрос: клещ и прививки от энцефалита" }
kind: ask
time: { procedure: 1 }
cost: 0
discomfort: 0
# при присасывании клеща — когда он присосался и привит ли человек от клещевого энцефалита (spec 2026-10-chapter-4, часть 51а;
# 567_2, раздел 2.1: присасывание, вакцинопрофилактика; раздел 5.1: иммуноглобулин в первые 72 часа не привитым), и всем —
# был ли клещ за последний месяц (566_2, раздел 2.1). Первым — каждому с присасыванием: без часов и прививок профилактику не
# выбрать. Точность — игровая оценка
routineFor: [sym.tick_bite]
checks:
  # свежий укус и растущее пятно на месте укуса — жалобы присасывания и болезни Лайма; точность — игровая оценка
  - { f: sym.tick_bite, sens: 99, spec: 99 }
  - { f: sym.rash_ring, sens: 90, spec: 98 }
  - { f: hx.tick_hours, sens: 95, spec: 99 }
  - { f: hx.tbe_vaccinated, sens: 90, spec: 98 }
  - { f: hx.tick_bite_recent, sens: 90, spec: 98 }
texts:
  hint:
    ru: "Когда присосался клещ, был ли клещ за последний месяц, привит ли человек от клещевого энцефалита полным курсом. От часов зависит профилактика: иммуноглобулин — в первые 72 часа, антибиотик — не позже 5 суток."
  summary:
    ru: "Когда и где присосался клещ, был ли клещ за последний месяц, растёт ли пятно на месте укуса, прививки от клещевого энцефалита."
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1 (УУР C, УДД 5): сведения о присасывании клеща, обратить внимание на наличие или отсутствие вакцинопрофилактики КЭ" }
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1: эпидемиологический анамнез — присасывание клеща, пребывание в лесной зоне эндемичного района" }
review: draft
