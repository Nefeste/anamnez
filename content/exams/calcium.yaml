id: exam.calcium
name: { ru: "Кальций и альбумин крови" }
kind: lab
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.procedure
time: { procedure: 5, turnaround: 60 }
cost: 300
# при онемении вокруг рта и судорогах кистей — каждому (spec 2026-10-chapter-4, часть 56в): парестезии лица и конечностей, судороги
# мышц позволяют заподозрить гипокальциемию (627_3, раздел 2.1, комментарий); диагноз — по кальцию с поправкой на альбумин или
# ионизированному (раздел 2, УУР С, УДД 5); критерии качества 2 и 3 — общий кальций и альбумин
# С частью 57в — и пившему антифриз: кальций — в биохимии всем с отравлением токсифицирующимися спиртами (873_1, раздел 2.3, УУР С,
# УДД 4; критерий качества 16), кальций при этиленгликоле вводят «под контролем уровня кальция в крови» (раздел 3.2, УУР С, УДД 5)
routineFor: [sym.perioral_paresthesia, sym.hand_spasm, sym.antifreeze_drink]
discomfort: 1
checks:
  - { f: lab.ca_low, sens: 98, spec: 99 }
texts:
  hint:
    ru: "Общий кальций и альбумин из одной пробирки: кальций пересчитывают с поправкой на альбумин, иначе при низком белке он кажется ниже, чем есть. Норма — 2,12–2,62 ммоль/л. Ниже — гипокальциемия; после операции на щитовидной железе это гипопаратиреоз."
  summary:
    ru: "Кровь из вены, биохимический анализатор; кальций — с поправкой на альбумин."
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2 (УУР С, УДД 5): диагноз — по альбумин-скорректированному или ионизированному кальцию, поправка на альбумин; раздел 2.1: парестезии и судороги мышц позволяют заподозрить гипокальциемию; критерии качества 2 и 3: общий кальций и альбумин крови; время и точность анализа — игровая оценка" }
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2.3 (УУР С, УДД 4): кальций — в биохимии всем с отравлением токсифицирующимися спиртами; раздел 3.2 (УУР С, УДД 5): при этиленгликоле кальций вводят под контролем его уровня в крови; критерий качества 16" }
review: draft
