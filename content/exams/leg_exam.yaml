id: exam.leg_exam
name: { ru: "Осмотр ног" }
kind: physical
time: { procedure: 6 }
cost: 0
discomfort: 1
complaints: [sym.leg_pain]
# при боли в ноге — каждому, первым: обе ноги, отёк и разница окружности голеней, болезненность по
# ходу вен, тяж по ходу подкожной вены (960_1, раздел 2.2; 668_2, раздел 2.2; критерии качества)
routineFor: [sym.leg_pain]
# точность осмотра в рекомендациях не дана — игровая оценка; окружность голени мерят лентой
checks:
  - { f: sign.deep_vein_tenderness, sens: 85, spec: 92 }
  - { f: sign.leg_swollen_whole, sens: 95, spec: 97 }
  - { f: sign.calf_swelling_3cm, sens: 90, spec: 95 }
  - { f: sign.pitting_edema, sens: 90, spec: 95 }
  - { f: sign.collateral_veins, sens: 80, spec: 96 }
  - { f: sign.superficial_cord, sens: 95, spec: 98 }
  - { f: sign.varicose_veins, sens: 95, spec: 98 }
  - { f: sign.calf_muscle_tenderness, sens: 85, spec: 92 }
  - { f: sign.calf_bruise, sens: 95, spec: 99 }
  - { f: sign.homans, sens: 90, spec: 95 }
texts:
  hint:
    ru: "Обе ноги: отёк, на сколько сантиметров толще больная голень, остаётся ли ямка, где больно — по ходу глубоких вен или в мышце, нет ли красного тяжа по ходу подкожной вены и кровоподтёка. Пять пунктов шкалы Уэллса — из осмотра."
  summary:
    ru: "Осмотр обеих ног, окружность голеней на 10 см ниже бугристости большеберцовой кости, отёк и ямка после нажатия, подкожные вены, пальпация по ходу глубоких вен и в мышцах голени, симптом Хоманса."
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2 (УУР А): боль, цвет кожи, отёк, разница периметра конечностей на симметричных участках, болезненность по ходу сосудисто-нервного пучка; обе ноги; прил. Г1: пять пунктов шкалы Уэллса; раздел 1.6: симптом Хоманса — специфичность 30,4 %; точность осмотра — игровая оценка" }
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2 (УДД 4, УУР С): шнуровидный плотный болезненный тяж или уплотнённые варикозные узлы, локальная гипертермия; осмотр обеих ног; критерий качества — клиническое обследование" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: состояние кожных покровов, функция мышц и смежных суставов" }
review: draft
