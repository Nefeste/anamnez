id: exam.glucometer
name: { ru: "Глюкометр" }
kind: bedside
time: { procedure: 2 }
cost: 50
discomfort: 1
# каждому с внезапным неврологическим дефицитом (spec 2026-10-chapter-3, часть 44а): гипогликемия — «маска» инсульта,
# глюкоза — единственный анализ, нужный перед тромболизисом (814_1, раздел 2.3); и при дрожи, внезапном голоде и
# спутанности — так начинается гипогликемия (290_2, раздел 3.7). И каждому с оглушением — по шкале комы Глазго; и
# каждому, кто на инсулине или сульфонилмочевине: гипогликемия — это уровень глюкозы (там же), без глюкометра её не
# поставить и не исключить
routineFor: [sym.tremor, sym.hunger, sym.confusion, sym.weakness_one_side, sym.speech_trouble, sym.face_droop]
routineSeen: [sign.gcs_low, hx.insulin, hx.sulfonylurea]
checks:
  - { f: lab.glucose_high, sens: 90, spec: 93 }
  # гипогликемия — то же измерение (spec 2026-10-chapter-3, часть 41а): перед тромболизисом глюкоза —
  # единственный нужный анализ (814_1, раздел 2.3); точность — из измерения
  - { f: lab.glucose_low, sens: 93, spec: 100 }
texts:
  hint:
    ru: "Сахар крови из пальца за минуту. Для отбора годится, для диагноза диабета — нет: его подтверждают лабораторией. При признаках инсульта, спутанности и оглушении — каждому: гипогликемия бывает «маской» инсульта и лечится за минуты. И каждому, кто колет инсулин или пьёт таблетки сульфонилмочевины."
  summary:
    ru: "Капля крови из пальца на тест-полоску."
sources:
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом", org: "Российская ассоциация эндокринологов", note: "черновик: точность глюкометра — игровая оценка" }
review: draft
