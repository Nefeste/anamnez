id: exam.glucometer
name: { ru: "Глюкометр" }
kind: bedside
time: { procedure: 2 }
cost: 50
discomfort: 1
# каждому с внезапным неврологическим дефицитом (spec 2026-10-chapter-3, часть 44а): гипогликемия — «маска» инсульта,
# глюкоза — единственный анализ, нужный перед тромболизисом (814_1, раздел 2.3); и при дрожи, внезапном голоде и
# спутанности — так начинается гипогликемия (290_2, раздел 3.7). И каждому с оглушением — по шкале комы Глазго; и
# каждому, кто на инсулине или сульфонилмочевине: гипогликемия — это уровень глюкозы (там же), без глюкометра её не
# поставить и не исключить
# С частью 44в — и каждому с судорожным приступом: при эпилептическом статусе на месте оценивают уровень глюкозы,
# в стационаре — анализ крови с глюкозой (741_1, блок «Оказание медицинской помощи пациенту с эпилептическим
# статусом»; гипогликемия — среди причин статуса, раздел 1.6.7)
# С частью 57а — и каждому, кого нашли без сознания, и при коме: «исследование уровня глюкозы в крови проводить не позднее 1 ч
# от момента поступления в стационар при нарушении сознания» (743_2, раздел 2.3, УУР С, УДД 4; критерий качества 10)
# С частью 57в — и пившему метанол или антифриз: «Исследование уровня глюкозы в крови не позднее 1 часа от момента поступления в
# стационар» (873_1, раздел 2.3, УУР С, УДД 4; критерий качества 5)
routineFor: [sym.tremor, sym.hunger, sym.confusion, sym.weakness_one_side, sym.speech_trouble, sym.face_droop, sym.seizure, sym.seizure_ongoing, sym.found_unconscious, sym.methanol_drink, sym.antifreeze_drink]
routineSeen: [sign.gcs_low, hx.insulin, hx.sulfonylurea, sign.gcs_coma]
checks:
  - { f: lab.glucose_high, sens: 90, spec: 93 }
  # гипогликемия — то же измерение (spec 2026-10-chapter-3, часть 41а): перед тромболизисом глюкоза —
  # единственный нужный анализ (814_1, раздел 2.3); точность — из измерения
  - { f: lab.glucose_low, sens: 93, spec: 100 }
texts:
  hint:
    ru: "Сахар крови из пальца за минуту. Для отбора годится, для диагноза диабета — нет: его подтверждают лабораторией. При признаках инсульта, спутанности и оглушении — каждому: гипогликемия бывает «маской» инсульта и лечится за минуты. И каждому, кто колет инсулин или пьёт таблетки сульфонилмочевины."
  summary:
    ru: "Капля крови из пальца на тест-полоску."
sources:
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом", org: "Российская ассоциация эндокринологов", note: "черновик: точность глюкометра — игровая оценка" }
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 2.3 (УУР С, УДД 4): глюкоза крови не позднее 1 ч от поступления при нарушении сознания; критерий качества 10" }
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2.3 (УУР С, УДД 4): глюкоза крови не позднее 1 часа от поступления в стационар; критерий качества 5" }
review: draft
