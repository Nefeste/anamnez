id: exam.creatinine
name: { ru: "Креатинин крови" }
kind: lab
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.procedure
time: { procedure: 5, turnaround: 60 }
cost: 250
# при давлении 180/110 и выше — каждому (spec 2026-10-chapter-3, часть 43г): креатинин — в рутинном обследовании всех
# с гипертоническим кризом (62_3, раздел 3.7)
routineSeen: [vital.bp_very_high]
discomfort: 1
checks:
  - { f: lab.creatinine_high, sens: 97, spec: 97 }
  # креатинин выше 300 — тяжёлая ГЛПС (spec 2026-10-chapter-4, часть 52б; 347_2, приложение А3): то же число, точность из него
  - { f: lab.creatinine_300, sens: 97, spec: 100 }
texts:
  hint:
    ru: "Показывает, как работают почки. Нужен при гипертонии, перед частью лекарств и при обезвоживании. При геморрагической лихорадке с почечным синдромом выше 300 — тяжёлая форма."
  summary:
    ru: "Кровь из вены; по креатинину, полу и возрасту считают скорость клубочковой фильтрации."
sources:
  - { kind: textbook, title: "Клиническая лабораторная диагностика: креатинин и СКФ", note: "черновик" }
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3.3 (УУР C, УДД 5): биохимический анализ крови, в том числе мочевина и креатинин, — при любой тяжести; приложение А3: креатинин 220–300 мкмоль/л — среднетяжёлая форма, до 600 — тяжёлая; критерий качества 5" }
review: draft
