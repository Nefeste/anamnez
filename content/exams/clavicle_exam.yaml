id: exam.clavicle_exam
name: { ru: "Осмотр надплечья и ключицы" }
kind: physical
time: { procedure: 3 }
cost: 0
discomfort: 1
checks:
  - { f: sign.clavicle_tenderness, sens: 90, spec: 85 }
  - { f: sign.clavicle_deformity, sens: 85, spec: 95 }
  - { f: sign.clavicle_crepitus, sens: 70, spec: 98 }
  - { f: sign.clavicle_skin_tenting, sens: 90, spec: 99 }
  - { f: sign.shoulder_motion_pain, sens: 90, spec: 85 }
texts:
  hint:
    ru: "Отёк и деформация над ключицей, смещение отломков на ощупь, не натянута ли над отломком кожа, может ли человек поднять руку; пульс на руке и чувствительность пальцев. Окончательно перелом подтверждает снимок."
  summary:
    ru: "Осмотр и осторожная пальпация ключицы по всей длине, кожи над ней, движения в плечевом суставе, пульс на лучевой артерии, чувствительность и сила кисти."
sources:
  - { kind: guideline, title: "Переломы ключицы и лопатки", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/853_1", note: "ID 853_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: боль, отёк, деформация, смещение отломков на ощупь, симптом «клавиши», крепитация, ограничение движений, натяжение кожи; раздел 2.2: осмотр не позднее часа после поступления, оценка иннервации и кровообращения; точность осмотра — игровая оценка" }
review: draft
