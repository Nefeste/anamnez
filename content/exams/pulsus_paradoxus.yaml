id: exam.pulsus_paradoxus
name: { ru: "Давление на вдохе и выдохе" }
# парадоксальный пульс (746_2, раздел 2.2; приложение Б — снижение систолического АД на вдохе): меряют, когда думают о
# тампонаде (spec 2026-10-chapter-3, часть 43д). Точность — игровая оценка
kind: bedside
time: { procedure: 3 }
cost: 0
discomfort: 0
routineSeen: [sign.heart_sounds_muffled, img.echo_effusion_large, ecg.low_voltage]
checks:
  - { f: sign.pulsus_paradoxus, sens: 90, spec: 97 }
texts:
  hint:
    ru: "Давление меряют на спокойном вдохе и на выдохе. Если на вдохе верхнее падает больше чем на 10 — это парадоксальный пульс, признак тампонады сердца."
  summary:
    ru: "Манжету медленно спускают и замечают, когда тоны слышны только на выдохе и когда — на вдохе и выдохе; разница больше 10 — парадоксальный пульс."
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.2: парадоксальный пульс — патогномоничный симптом тампонады, снижение систолического АД больше чем на 10 мм рт. ст. на вдохе при спокойном дыхании; приложение Б: измерение АД на периферических артериях — снижение систолического АД на вдохе; точность — игровая оценка" }
review: draft
