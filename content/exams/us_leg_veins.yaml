id: exam.us_leg_veins
name: { ru: "УЗИ вен ног" }
kind: imaging
room: room.ultrasound
equipment: [eq.us_basic, eq.us_expert]
radiation: none
# длительность и цена — игровые оценки; врач УЗД описывает сразу
time: { procedure: 20, report: 5 }
cost: 1500
discomfort: 1
checks:
  # проксимальный тромбоз: 94–96 % и 94–98 %; дистальный: картирование кровотока — 71–75 % (960_1,
  # раздел 2.4); специфичность у голени в тексте не дана — как у проксимального, игровая оценка
  - { f: img.us_dvt_prox, sens: 95, spec: 97 }
  - { f: img.us_dvt_calf, sens: 73, spec: 97 }
  # подвздошный сегмент: граница видна лишь в 23 % (раздел 2.4), что тромб уходит выше паховой
  # складки — чаще; игровая оценка
  - { f: img.us_dvt_iliac, sens: 70, spec: 97 }
  # подкожные вены, ствол и граница тромба у соустья (668_2, раздел 2.4) — точности нет, игровая
  - { f: img.us_superficial_thrombus, sens: 95, spec: 97 }
  - { f: img.us_saphenous_trunk, sens: 95, spec: 97 }
  - { f: img.us_near_junction, sens: 90, spec: 97 }
  # надрыв мышцы (832_2, раздел 2.4) — игровая оценка
  - { f: img.us_muscle_tear, sens: 85, spec: 98 }
texts:
  hint:
    ru: "Датчиком через кожу, без облучения: вену сдавливают датчиком — здоровая сжимается, с тромбом нет. Смотрят глубокие и подкожные вены обеих ног. Тромб в голени УЗИ находит хуже, чем в бедре."
  summary:
    ru: "Врач УЗД сжимает вены датчиком через каждые 2 см на обеих ногах — глубокие и подкожные, указывает верхнюю границу тромба и сразу описывает."
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4 (УДД 1, УУР А): дуплексное или триплексное сканирование, B-режим с компрессией вен через каждые 2 см; проксимальный тромбоз — 94–96 % и 94–98 %, дистальный — 71–75 % с картированием; обе ноги, глубокие и поверхностные вены — критерий качества 2" }
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: при тромбофлебите — поверхностные и глубокие вены обеих ног, обязательно указать проксимальную границу; критерий качества 2" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: УЗИ повреждённой мышцы при признаках её разрыва" }
review: draft
