texts:
  hint:
    ru: "Отличает простуду, синусит и аллергию: сколько дней насморк, было ли второе ухудшение, болит ли лицо, чешется ли нос, повторяется ли каждый год."
  summary:
    ru: "Заложенность и выделения, боль в лице, обоняние, чихание и зуд, как давно и было ли так раньше."
sources:
  - { kind: guideline, title: "Fokkens WJ et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020. Rhinology 2020;58(Suppl S29):1–464", note: "черновик: точность расспроса — игровая оценка" }
review: draft
