  - { f: sym.nasal_congestion, sens: 92, spec: 95 }
  - { f: sym.facial_pain, sens: 85, spec: 95 }
  - { f: sym.purulent_nasal, sens: 85, spec: 92 }
  - { f: sym.nasal_long, sens: 92, spec: 96 }
  - { f: sym.double_worsening, sens: 75, spec: 95 }
  - { f: sym.sneezing, sens: 90, spec: 95 }
