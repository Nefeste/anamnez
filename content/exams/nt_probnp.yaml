id: exam.nt_probnp
name: { ru: "NT-proBNP" }
kind: lab
room: room.lab
equipment: [eq.immuno_analyzer]
collect: room.procedure
# «У всех пациентов с остро возникшей одышкой в максимально ранние сроки» (spec 2026-10-chapter-3, часть 43в; 156_2,
# раздел 7.3.2); критерий качества 7 и первичной, и специализированной помощи. Срок и цена — игровые оценки
# одышка лёжа, влажные хрипы в обоих лёгких, отёки обеих ног — подозрение на сердечную недостаточность: пептид каждому
# (игровое правило по разделу 7.3.2)
routineFor: [sym.orthopnea]
routineSeen: [sign.crackles_bilateral, sign.crackles_diffuse, sign.leg_edema_bilateral]
time: { procedure: 5, turnaround: 60 }
cost: 1500
discomfort: 1
# точность у пришедших с одышкой — ICON (Januzzi 2006): пороги по возрасту — чувствительность 90 %, специфичность 84 %
checks:
  - { f: lab.ntprobnp_high, sens: 90, spec: 84 }
texts:
  hint:
    ru: "Кровь из вены на натрийуретический пептид — его выделяет растянутое сердце. Выше порога для возраста — острая сердечная недостаточность вероятна, ниже 300 пг/мл — исключена. Делают каждому с внезапной или нарастающей одышкой."
  summary:
    ru: "Кровь из вены. Порог для острой сердечной недостаточности — 450 пг/мл моложе 55 лет, 900 — в 55–75, 1800 — старше 75; ниже 300 — её нет."
sources:
  - { kind: guideline, title: "Хроническая сердечная недостаточность", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/156_2", note: "ID 156_2, опубликованы 07.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 7.3.2: натрийуретические пептиды — у всех с остро возникшей одышкой в максимально ранние сроки; пороги по возрасту; критерий качества 7 (табл. 18 и 19); срок и цена — игровая оценка" }
  - { kind: paper, title: "Januzzi JL, van Kimmenade R, Lainchbury J и др. NT-proBNP testing for diagnosis and short-term prognosis in acute destabilized heart failure: an international pooled analysis of 1256 patients: the International Collaborative of NT-proBNP Study. Eur Heart J 2006;27(3):330–337", url: "https://pubmed.ncbi.nlm.nih.gov/16293638/", note: "PMID 16293638, сверено 05.10.2026: 1256 пришедших с одышкой, острая СН — у 720 (57,3 %); пороги по возрасту 450, 900 и 1800 пг/мл — чувствительность 90 %, специфичность 84 %; ниже 300 — отрицательная предсказательная ценность 98 %" }
review: draft
