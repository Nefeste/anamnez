id: exam.throat
name: { ru: "Осмотр зева и шеи" }
kind: physical
time: { procedure: 2 }
cost: 0
discomfort: 1
# при кровотечении из носа — каждому: не стекает ли кровь по задней стенке глотки (977_1, раздел 2)
routineFor: [sym.nosebleed]
checks:
  - { f: sign.tonsillar_exudate, sens: 90, spec: 95 }
  - { f: sign.pharyngeal_hyperemia, sens: 90, spec: 85 }
  - { f: sign.tender_cervical_nodes, sens: 80, spec: 90 }
  # кровь стекает по задней стенке глотки — кровит сзади (часть 33б): точность — игровая оценка
  - { f: sign.blood_pharynx, sens: 90, spec: 97 }
texts:
  hint:
    ru: "Налёты на миндалинах и болезненные лимфоузлы — доводы за стрептококковую ангину, насморк и кашель — против. При кровотечении из носа смотрят, не стекает ли кровь по задней стенке глотки."
  summary:
    ru: "Миндалины, задняя стенка глотки, шейные лимфоузлы."
sources:
  - { kind: paper, title: "Ebell MH et al. Does this patient have strep throat? JAMA 2000;284(22):2912–2918", note: "черновик: чувствительность осмотра — игровая оценка" }
  - { kind: guideline, title: "Носовое кровотечение", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/977_1", note: "ID 977_1, опубликованы 08.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2: диагноз — по риноскопии и фарингоскопии; раздел 3.1.2: кровь продолжает стекать в глотку при прижатых крыльях носа — источник в задних отделах; точность — игровая оценка" }
review: draft
