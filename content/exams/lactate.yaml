id: exam.lactate
name: { ru: "Лактат крови" }
kind: lab
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.procedure
# анализатор газов крови отвечает быстрее биохимии — игровая оценка
time: { procedure: 5, turnaround: 20 }
cost: 300
discomfort: 1
checks:
  - { f: lab.lactate_high, sens: 97, spec: 97 }
texts:
  hint:
    ru: "Показывает, хватает ли тканям кислорода. При подозрении на сепсис с низким давлением лактат выше 2 ммоль/л — признак шока."
  summary:
    ru: "Кровь из вены или артерии; молочная кислота — маркёр гипоперфузии."
sources:
  - { kind: guideline, title: "Сепсис (у взрослых)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/898_1", note: "ID 898_1, опубликованы 27.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.3 (УДД 5, УУР С): при артериальной гипотензии — исследовать лактат в артериальной крови; раздел 2.5: выше 2 ммоль/л — гипоперфузия; критерий качества 5: при подозрении на септический шок выполнено исследование лактата; время и точность анализа — игровая оценка" }
review: draft
