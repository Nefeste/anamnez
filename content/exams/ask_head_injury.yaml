id: exam.ask_head_injury
name: { ru: "Расспрос: травма головы" }
kind: ask
time: { procedure: 2 }
cost: 0
discomfort: 0
# спрашивают пришедших с травмой головы: иначе вопрос о рвоте и тошноте задавали бы и при пиелонефрите
complaints: [sym.head_injury, sym.head_wound]
# пока черепно-мозговая травма не исключена — каждому с травмой и раной головы (733_2, раздел 2.1;
# 734_2, раздел 2.1)
routineFor: [sym.head_injury, sym.head_wound]
checks:
  - { f: sym.loss_of_consciousness, sens: 85, spec: 97 }
  - { f: sym.amnesia, sens: 85, spec: 95 }
  - { f: sym.vomiting, sens: 95, spec: 99 }
  - { f: sym.seizure_after_injury, sens: 90, spec: 99 }
  - { f: hx.road_accident, sens: 98, spec: 100 }
  - { f: sym.headache, sens: 95, spec: 95 }
  - { f: sym.dizziness, sens: 88, spec: 94 }
  - { f: sym.nausea, sens: 90, spec: 95 }
texts:
  hint:
    ru: "Терял ли сознание, помнит ли, как всё случилось, была ли рвота или судороги, как получил травму. Так отличают сотрясение головного мозга от ушиба мягких тканей и решают, нужна ли компьютерная томография."
  summary:
    ru: "Механизм и время травмы, потеря сознания и её длительность, память на события до и после удара, рвота, судороги, головная боль, головокружение и тошнота."
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1 (УУР C, УДД 5): выявлять механизм повреждения, факт нарушения сознания и его длительность, посттравматическую амнезию и её длительность; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1 (УУР C, УДД 5): установить, терял ли пациент сознание, была ли рвота, помнит ли обстоятельства травмы, механизм и время травмы" }
review: draft
