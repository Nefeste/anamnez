id: exam.tbe_elisa
name: { ru: "Антитела к вирусу клещевого энцефалита (ИФА)" }
kind: lab
# ИФА на IgM и IgG к вирусу клещевого энцефалита (spec 2026-10-chapter-4, часть 51б; 567_2, раздел 2.3.2, приложение Б): кровь из
# вены в процедурном, иммунохимический анализатор лаборатории. Сколько больных с антителами, решает запись болезни (IgM — с
# 3–4-го дня); точность самого анализа и ₽ — игровая оценка: в 567_2 чисел нет
room: room.lab
equipment: [eq.immuno_analyzer]
collect: room.procedure
time: { procedure: 3, turnaround: 60 }
cost: 800
discomfort: 1
checks:
  - { f: lab.tbe_igm, sens: 92, spec: 97 }
texts:
  hint:
    ru: "Антитела к вирусу клещевого энцефалита в крови: IgM появляются с 3–4-го дня болезни. Подтверждают клещевой энцефалит у лихорадящего после укуса клеща; в первые дни болезни анализ бывает отрицательным."
  summary:
    ru: "Кровь из вены, ИФА: антитела IgM и IgG к вирусу клещевого энцефалита."
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3.2 (УУР C, УДД 5): ИФА — IgM с 3–4 дня болезни, IgG после 5–7 дня, повтор через 10–14 дней при отрицательном IgG; приложение Б: обнаружение антител IgM и IgG — первый шаг алгоритма; чувствительности и специфичности в тексте нет — игровая оценка" }
review: draft
