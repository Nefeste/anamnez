id: exam.sigmoidoscopy
name: { ru: "Сигмоидоскопия" }
kind: imaging
room: room.endoscopy
equipment: [eq.videoendoscope]
# осмотр прямой и сигмовидной кишки гибким эндоскопом (spec 2026-10-chapter-4, часть 55а): «Пациентам с выраженной
# активностью ЯК рекомендуется проведение сигмоидоскопии» (193_2, раздел 2.4, УУР С, УДД 4) — без подготовки кишки
# слабительными. Прямая кишка при язвенном колите вовлечена всегда (раздел 1.1) — колит видно и так. Время, цена, неудобство
# и точность — игровая оценка
radiation: none
complaints: [sym.bloody_diarrhea, sym.diarrhea, sym.mucus_blood_stool]
# каждому с частым стулом с кровью: «колоноскопия обязательна для установления диагноза ЯК» (раздел 2.4), при тяжёлой атаке
# вместо неё — сигмоидоскопия
routineFor: [sym.bloody_diarrhea]
time: { procedure: 15, report: 5 }
cost: 2000
discomfort: 3
checks:
  - { f: img.colon_uc, sens: 95, spec: 98 }
texts:
  hint:
    ru: "Гибкий эндоскоп через задний проход: осмотр прямой и сигмовидной кишки, без подготовки слабительными. При тяжёлой атаке язвенного колита вместо колоноскопии делают её: колит начинается с прямой кишки, его видно и так."
  summary:
    ru: "Осмотр прямой и сигмовидной кишки гибким эндоскопом без подготовки кишки; описание делает эндоскопист."
sources:
  - { kind: guideline, title: "Язвенный колит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/193_2", note: "ID 193_2, опубликованы 29.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.1: прямая кишка вовлекается обязательно; раздел 2.4 (УУР С, УДД 4): при лёгкой и умеренной активности — илеоколоноскопия, при выраженной — сигмоидоскопия; время, цена и точность — игровая оценка" }
review: draft
