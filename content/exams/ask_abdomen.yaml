texts:
  hint:
    ru: "Где болит и куда отдаёт, куда сместилась боль, после чего началась, есть ли тошнота, рвота, жидкий стул, изжога. Отличает кишечную инфекцию, аппендицит, болезни желудка, желчного пузыря и поджелудочной железы."
  summary:
    ru: "Боль в животе: где, как и после чего началась, схватками или ровная, куда отдаёт и куда сместилась; аппетит, тошнота, рвота, стул и газы, вздутие, изжога, отрыжка, тяжесть после еды; при поносе — какой стул, нет ли слизи и крови, ложных позывов, сколько мочи и не сводит ли ноги."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: расспрос больного", note: "точность расспроса — игровая оценка, не из литературы" }
  - { kind: guideline, title: "Сальмонеллез у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/700_3", note: "ID 700_3, опубликованы 17.09.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 1.6: стул обильный, водянистый, зловонный, иногда зеленоватый, тенезмов и ложных позывов нет; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Шигеллез", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/869_1", note: "ID 869_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.1: расспрос — боль внизу живота, спазмы, ложные позывы, характер и частота стула; точность расспроса — игровая оценка" }
