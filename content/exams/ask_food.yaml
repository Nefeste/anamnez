id: exam.ask_food
name: { ru: "Расспрос: еда, зрение, глотание" }
kind: ask
time: { procedure: 2 }
cost: 0
discomfort: 0
# ботулизм (spec 2026-10-chapter-4, часть 51в): «диагностика ботулизма, как правило, основывается на эпидемиологических и
# клинических данных» (911_1, раздел 2.3) — о продуктах за несколько часов — 7 суток до болезни, о зрении, сухости во рту и
# глотании (разделы 1.6 и 2). Точность — игровая оценка
routineFor: [sym.diplopia, sym.swallow_trouble, sym.choking_liquids]
checks:
  - { f: hx.home_canned, sens: 90, spec: 97 }
  - { f: sym.diplopia, sens: 95, spec: 99 }
  - { f: sym.dry_mouth, sens: 90, spec: 95 }
  - { f: sym.swallow_trouble, sens: 95, spec: 98 }
  - { f: sym.choking_liquids, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Что ел в последние дни: домашние грибы и овощи из банок, вяленую и копчёную рыбу, мясо. И о зрении, сухости во рту, глотании твёрдой еды и воды. Ботулизм узнают по расспросу и осмотру: анализ на токсин идёт долго и в половине случаев отрицательный."
  summary:
    ru: "Ел ли домашние консервы, грибы, вяленую рыбу за последнюю неделю; двоится ли в глазах, сухо ли во рту, проходит ли твёрдая еда, не поперхивается ли водой."
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2: эпиданамнез — употребление подозрительного продукта от нескольких часов до 7 суток до болезни; раздел 2.3: диагноз основывается на эпидемиологических и клинических данных, не менее чем в 50 % случаев — при отрицательных анализах; точность расспроса — игровая оценка" }
review: draft
