id: exam.ecg
name: { ru: "ЭКГ" }
kind: functional
room: room.ecg
equipment: [eq.ecg]
time: { procedure: 10, report: 10 }
cost: 400
discomfort: 0
# при сердцебиении — каждому (spec 2026-10-chapter-3, часть 42а): диагноз фибрилляции и трепетания предсердий —
# только по ЭКГ, запись 12 отведений с эпизодом аритмии (382_2, раздел 2; критерий качества 2); с частью 42б — и после
# обморока: у больных с болезнью сердца и после инфаркта причиной считают желудочковую аритмию (569_2, раздел 2.1)
routineFor: [sym.palpitations, sym.syncope]
# и каждому, у кого на осмотре пульс неритмичный или 150 и чаще (часть 42б): ЭКГ — всем с подозрением на
# наджелудочковую тахикардию (619_3, раздел 2, РКО IC), пульс в покое — чтобы найти фибрилляцию (382_2,
# раздел 2.2), при любой тахикардии с широкими комплексами — ЭКГ 12 отведений (569_2, раздел 3.1.3)
routineSeen: [sign.pulse_irregular, vital.tachycardia_150]
checks:
  - { f: ecg.st_elevation, sens: 92, spec: 99 }
  - { f: ecg.st_depression, sens: 85, spec: 95 }
  - { f: ecg.lvh, sens: 60, spec: 95 }
  # фибрилляция предсердий (часть 33б): неправильный ритм без зубцов P; с частью 42а — и трепетание, пилообразные
  # волны F — игровая оценка
  - { f: ecg.af, sens: 95, spec: 99 }
  # тахикардия с узкими и с широкими комплексами (часть 42б): по ширине QRS — игровая оценка
  - { f: ecg.svt, sens: 97, spec: 99 }
  - { f: ecg.vt, sens: 95, spec: 99 }
# у постели в смотровой приёмного (spec 2026-10-chapter-3, часть 37): монитором с дефибриллятором,
# за 5 минут, без очереди в кабинет ЭКГ и без описания — ленту читает врач; точность та же —
# игровая оценка
bedside: { room: room.emergency, equipment: [eq.monitor_defib], time: { procedure: 5 } }
texts:
  hint:
    ru: "Электрокардиограмма показывает ишемию и инфаркт, нарушения ритма, утолщение стенки сердца. При боли в груди её делают в первые минуты; нормальная ЭКГ инфаркт не исключает."
  summary:
    ru: "Двенадцать отведений в покое, описание — врачом функциональной диагностики. В смотровой приёмного с монитором — у постели за 5 минут, ленту читает врач."
sources:
  - { kind: guideline, title: "2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J 2023;44(38):3720–3826", note: "черновик: точность — игровая оценка" }
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.4 (ЕОК IB, УУР С, УДД 5): ЭКГ регистрируют в течение 10 минут от первичного медицинского контакта на месте этого контакта и интерпретирует её квалифицированный специалист; время на месте ЭКГ у постели и без описания — игровая оценка" }
review: draft
