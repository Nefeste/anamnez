id: exam.lumbar_puncture
name: { ru: "Люмбальная пункция" }
kind: lab
# спинномозговая пункция у постели (spec 2026-10-chapter-4, часть 50а): лёжа на боку, колени к груди, между III и IV
# поясничными позвонками (1020_1, раздел 2.2) — в смотровой приёмного; ликвор — в лабораторию: цитоз, белок, глюкоза,
# мазок по Граму и ПЦР-панель «в экспресс режиме за 60 минут» (раздел 2.3). В амбулатории пункцию не делают. ₽ — игровое
# число
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.emergency
time: { procedure: 20, turnaround: 60 }
cost: 3500
discomfort: 3
# противопоказания — приложение А3.3 (1020_1) и признаки дислокации мозга (523_3, раздел 2.4): с ними пункция может
# вызвать вклинение мозга или кровотечение — полоса игровая; правило «Можно ли пункцию» называет пункты
harm: { rule: rule.lp_safe, band: often }
checks:
  # цитоз считают в камере, глюкозу и белок — анализатором: сам анализ точен; что в ликворе — в записях болезней
  - { f: lab.csf_pleocytosis, sens: 98, spec: 98 }
  - { f: lab.csf_purulent, sens: 98, spec: 100 }
  - { f: lab.csf_protein_high, sens: 95, spec: 95 }
  - { f: lab.csf_glucose_low, sens: 95, spec: 97 }
  # ПЦР ликвора: совокупная чувствительность 94,2 %, специфичность 99,8 % (1020_1, раздел 2.3)
  - { f: lab.csf_meningococcus, sens: 94, spec: 99.8 }
  # кровь в ликворе (523_3, раздел 2.4); примесь крови из задетого иглой сосуда — игровая оценка
  - { f: lab.csf_blood, sens: 97, spec: 95 }
  # ПЦР ликвора на вирус простого герпеса (spec 2026-10-chapter-4, часть 50б): чувствительность 98 %, специфичность 100 %
  # (492_2, раздел 2.3.2)
  - { f: lab.csf_hsv, sens: 98, spec: 100 }
texts:
  hint:
    ru: "Ликвор — жидкость вокруг мозга: по нему отличают гнойный менингит от вирусного и находят кровь под оболочками. Перед пункцией проверяют сознание, очаговые признаки, судороги, давление, сыпь, тромбоциты, антикоагулянты и дыхание: с противопоказанием возможно вклинение мозга. Антибиотик ликвора не ждёт."
  summary:
    ru: "Игла между поясничными позвонками у лежащего на боку; ликвор — в лабораторию: клетки, белок, глюкоза, мазок и ПЦР. Результат — через час."
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 2.2 (УУР С, УДД 4): спинномозговая пункция при подозрении на ГФМИ, менингеальных симптомах, общемозговой и очаговой симптоматике — при отсутствии противопоказаний, лёжа на боку на уровне L3–L4; раздел 2.3: при противопоказаниях — после стабилизации; общий анализ ликвора, мазок по Граму, ПЦР-панель за 60 минут, чувствительность 94,2 %, специфичность 99,8 %; приложение А3.3: противопоказания; критерий качества 5; цена и полоса осложнения — игровая оценка" }
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР С, УДД 4): пункция для определения крови в ликворе, если нельзя сделать КТ или МРТ; при клинических или инструментальных признаках дислокации противопоказана" }
  - { kind: guideline, title: "Простой герпес (ПГ) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/492_2", note: "ID 492_2, опубликованы 27.10.2025, применяются; сверено с рубрикатором 06.10.2026; раздел 2.4 (УУР С, УДД 3): спинномозговая пункция при поражении ЦНС с общемозговой или очаговой симптоматикой, судорогами, признаками внутричерепной гипертензии; противопоказания — прогрессирующий отёк мозга, дислокационный синдром, геморрагический синдром; раздел 2.3.2: ПЦР СМЖ на ДНК ВПГ — чувствительность 98 %, специфичность 100 %" }
review: draft
