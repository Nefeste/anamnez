id: exam.swallow_test
name: { ru: "Тест глотания" }
kind: bedside
time: { procedure: 5 }
cost: 0
discomfort: 1
# трёхглотковая проба с пульсоксиметром (spec 2026-10-chapter-3, часть 41а; 814_1, раздел 2.2 и
# критерий качества 2): до первой еды и таблеток, в первые 3 часа. Точность — середина диапазонов
# раздела 2.2 для неинструментальных тестов: чувствительность 64–79 %, специфичность 61–81 %
complaints: [sym.weakness_one_side, sym.speech_trouble, sym.face_droop]
checks:
  - { f: sign.dysphagia, sens: 72, spec: 71 }
texts:
  hint:
    ru: "Три глотка воды с чайной ложки, пульсоксиметр на пальце: поперхнулся, закашлялся, упала сатурация — глотание нарушено. При инсульте тест делают до первой еды и таблеток, в первые 3 часа."
  summary:
    ru: "Трёхглотковая проба: глотки воды под пульсоксиметром, кашель, поперхивание, сатурация."
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.2: тест оценки глотания до приёма пищи и таблеток в первые 3 часа, «трёхглотковая проба» с пульсоксиметром; чувствительность неинструментальных тестов 64–79 %, специфичность 61–81 %; критерий качества 2" }
review: draft
