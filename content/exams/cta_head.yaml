id: exam.cta_head
name: { ru: "КТ-ангиография сосудов головы и шеи" }
kind: imaging
room: room.ct
equipment: [eq.ct_16, eq.ct_64]
# КТ без контраста и сразу — с контрастом в вену (spec 2026-10-chapter-3, часть 41а): кровь и окклюзия
# крупной артерии за один заход; показана в первые 6 часов при NIHSS 6 и больше (814_1, раздел 2.4).
# Время, цена и точность — игровая оценка; облучение — высокое: две серии и контраст
radiation: high
time: { procedure: 12, report: 18 }
cost: 6000
discomfort: 1
checks:
  - { f: img.ct_blood, sens: 95, spec: 100 }
  - { f: img.cta_occlusion, sens: 95, spec: 97 }
texts:
  hint:
    ru: "Сначала срезы без контраста — нет ли крови, затем контраст в вену, и видны артерии от дуги аорты до мозга. При инсульте в первые 6 часов и NIHSS 6 и больше ищет окклюзию крупной артерии: её убирают тромбэктомией."
  summary:
    ru: "Бесконтрастная КТ и ангиография артерий шеи и мозга с контрастом в вену; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.4: КТ-ангиография с уровня дуги аорты поступившим в первые 6 часов с NIHSS 6 и больше, ASPECTS 6 и больше и mRS 0–2; не ждать креатинина перед КТ-ангиографией без почечной недостаточности в анамнезе; рис. 2 приложения Б: до 4,5 часа — КТ и КТ-ангиография; время и точность — игровая оценка" }
review: draft
