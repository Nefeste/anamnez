id: exam.toxic_alcohols
name: { ru: "Метанол и этиленгликоль в крови" }
kind: lab
room: room.lab
# газового хроматографа в игре нет — биохимический анализатор; ответ — через час, игровая оценка
equipment: [eq.biochem_analyzer]
collect: room.procedure
time: { procedure: 5, turnaround: 60 }
cost: 1500
# «Рекомендовано исследование уровня этанола, метанола и этиленгликоля в крови и моче всем пациентам с подозрением на отравление
# метанолом или этиленгликолем с целью проведения дифференциальной диагностики, а также определения тактики проведения антидотной
# терапии» (spec 2026-10-chapter-4, часть 57в; 873_1, раздел 2.3, УУР С, УДД 5; критерии качества 6 и 7): каждому, кто пил
# метанол или антифриз, и при ацидозе — когда его нашли. Этанола в игре нет; точность — игровая оценка: после долгого скрытого
# периода яда в крови остаётся мало
routineFor: [sym.methanol_drink, sym.antifreeze_drink]
routineSeen: [lab.acidosis]
discomfort: 1
checks:
  - { f: lab.methanol_blood, sens: 95, spec: 99.5 }
  - { f: lab.eg_blood, sens: 92, spec: 99.5 }
texts:
  hint:
    ru: "Газовая хроматография крови и мочи находит метанол и этиленгликоль и различает их — так подтверждают отравление и решают об антидоте и гемодиализе. Ответ — через час, а антидот при ясной картине начинают, не дожидаясь."
  summary:
    ru: "Кровь и моча; метанол, этиленгликоль и этанол — газовой хроматографией."
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2.3 (УУР С, УДД 5): уровень этанола, метанола и этиленгликоля в крови и моче газовой хроматографией всем с подозрением, для дифференциальной диагностики и тактики антидотной терапии и экстракорпоральной детоксикации; раздел 3.2: этанол — и при клинике с анамнезом приёма, без подтверждённого уровня; критерии качества 6 и 7; время и точность — игровая оценка" }
review: draft
