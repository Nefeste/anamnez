id: exam.xray_abdomen
name: { ru: "Обзорная рентгенография брюшной полости" }
kind: imaging
room: room.xray
equipment: [eq.xray_analog, eq.xray_digital]
radiation: low
time: { procedure: 10, report: 20 }
cost: 900
discomfort: 0
checks:
  # свободный газ виден у 30–85 % перфораций (WSES 2020; 277_2, раздел 2.4) — середина;
  # специфичность — игровая оценка: ложный газ на снимке редок
  - { f: img.xr_free_gas, sens: 57, spec: 98 }
  # тонкокишечная непроходимость видна у 50–60 % (327_3, раздел 2.4) — середина; специфичность —
  # из отношения правдоподобия 1,64 (Taylor 2013) при этой чувствительности
  - { f: img.xr_bowel_levels, sens: 55, spec: 66 }
texts:
  hint:
    ru: "Снимок живота стоя: под куполом диафрагмы виден свободный газ, если прорвалась язва или кишка, а раздутые петли с уровнями жидкости — при кишечной непроходимости. Нормальный снимок ни того, ни другого не исключает."
  summary:
    ru: "Снимок в прямой проекции в вертикальном положении; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: обзорная рентгенография в вертикальном положении — всем с подозрением на прободную язву, для поиска свободного газа; диагностическая точность — от 30 до 85 %, отрицательный снимок перфорацию не исключает" }
  - { kind: guideline, title: "Tarasconi A et al. Perforated and bleeding peptic ulcer: WSES guidelines. World J Emerg Surg 2020;15:3", url: "https://pubmed.ncbi.nlm.nih.gov/31921329/", note: "PMID 31921329, PMC6947898, сверено 29.09.2026: свободный газ на снимке — у 30–85 % перфораций" }
  - { kind: guideline, title: "Острая неопухолевая кишечная непроходимость", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/327_3", note: "ID 327_3, опубликованы 06.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: рентгенография устанавливает тонкокишечную непроходимость у 50–60 % пациентов, у 20–30 % данные неубедительны, у 10–20 % вводят в заблуждение; признаки — расширенные петли кишки, арки с уровнями жидкости" }
  - { kind: paper, title: "Taylor MR, Lalani N. Adult small bowel obstruction. Acad Emerg Med 2013;20(6):528–544", url: "https://pubmed.ncbi.nlm.nih.gov/23758299/", note: "PMID 23758299, сверено 29.09.2026: метаанализ, отношение правдоподобия положительного рентгена — 1,64" }
review: draft
