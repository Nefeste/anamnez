kind: ask
time: { procedure: 1 }
cost: 0
discomfort: 0
# о прививках спрашивают при любой ране и укусе (733_2, раздел 2.1; СанПиН 3.3686-21, п. 4156)
complaints: [sym.hand_wound, sym.head_wound, sym.animal_bite]
