  - { f: hx.tetanus_records, sens: 95, spec: 98 }
  - { f: hx.tetanus_recent, sens: 95, spec: 98 }
texts:
  hint:
    ru: "Есть ли записи о прививках от столбняка и когда была последняя. От этого зависит, что ввести при ране: ничего, анатоксин или анатоксин вместе с иммуноглобулином."
  summary:
    ru: "Прививки от столбняка по записям: пройден ли полный курс, сколько лет прошло после последней прививки."
sources:
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1 (УУР C, УДД 5): получить сведения о проведённой вакцинации — от столбняка, при укушенных ранах и от бешенства; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.3.4 и приложение А3.1: средства экстренной профилактики выбирают по документальному подтверждению прививок и сроку после последней" }
