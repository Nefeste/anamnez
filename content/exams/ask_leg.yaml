id: exam.ask_leg
name: { ru: "Расспрос: нога и тромбозы" }
kind: ask
time: { procedure: 3 }
cost: 0
discomfort: 0
# с частью 43б — и при подозрении на ТЭЛА: пункты Женевской шкалы и sPESI (тромбоз в прошлом, гипс, рак) — из расспроса
complaints: [sym.leg_pain, sym.dyspnea_sudden, sym.hemoptysis]
# при боли в ноге — каждому, первым: как началось и что было в последние месяцы (960_1, раздел 2.1:
# ВТЭО в прошлом, операции, травмы и иммобилизации за 3 месяца, рак; 832_2, раздел 2.1:
# обстоятельства и механизм травмы). Четыре пункта шкалы Уэллса — из расспроса
routineFor: [sym.leg_pain]
# точность расспроса — игровая оценка; жалоба — факт: без боли в ноге о ней не расскажут (как
# жалобы травм в «Расспросе: травма»)
checks:
  - { f: sym.leg_pain, sens: 95, spec: 100 }
  - { f: hx.calf_snap, sens: 95, spec: 97 }
  - { f: hx.cancer_active, sens: 95, spec: 99 }
  - { f: hx.leg_cast, sens: 95, spec: 99 }
  - { f: hx.bed_rest, sens: 90, spec: 98 }
  - { f: hx.prior_dvt, sens: 95, spec: 99 }
  - { f: hx.travel, sens: 90, spec: 97 }
  # онемение и холод в ноге (часть 33б): без ишемии не бывает — игровая оценка
  - { f: sym.leg_numb, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Как заболела нога — сама или после рывка, и что было в последние месяцы: операция, постельный режим, гипс, лечение рака, тромбоз раньше, долгая поездка. Четыре пункта шкалы Уэллса узнают из расспроса. Нога вдруг онемела и похолодела — думают об артерии."
  summary:
    ru: "Когда и как началась боль, был ли рывок или удар, онемела ли нога, операции, постельный режим и гипс за 3 месяца, рак и его лечение, тромбозы в прошлом, долгие поездки."
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1 (УУР А): тщательный анамнез — ВТЭО в прошлом и у родственников, операции, травмы и иммобилизации в последние 3 месяца, онкологические болезни, приём гормонов; прил. Г1: пункты шкалы Уэллса; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1 (УУР C, УДД 5): обстоятельства и механизм травмы, время с её момента" }
  - { kind: guideline, title: "Острая ишемия конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/1006_1", note: "ID 1006_1, опубликованы 29.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1: подробный расспрос — жалобы, анамнез, факторы риска; онемение, похолодание, парестезии — патогномоничные симптомы; точность расспроса — игровая оценка" }
review: draft
