id: exam.knee_ligament_tests
name: { ru: "Тесты на связки колена" }
kind: physical
time: { procedure: 5 }
cost: 0
discomfort: 2
complaints: [sym.knee_pain]
# тесты — всем с травмой колена (691_2, раздел 2.2, УУР C, УДД 5): без них разумный врач «верил»
# доле ушибов и принимал разрыв связки за ушиб
routineFor: [sym.knee_pain]
# точности тестов в 691_2 нет — игровая оценка; при острой боли они хуже, чем после неё. Ложных
# «положительно» мало: голень сравнивают со здоровой ногой (раздел 2.2), у кого связки от природы
# мягкие, она смещается и там
checks:
  - { f: sign.lachman_positive, sens: 85, spec: 97 }
  - { f: sign.valgus_laxity, sens: 85, spec: 97 }
texts:
  hint:
    ru: "Тест Лахмана и выдвижные ящики проверяют крестообразные связки, варус- и вальгус-тесты — боковые: голень смещают относительно бедра и сравнивают со здоровой ногой."
  summary:
    ru: "Тест Лахмана при сгибании 15–30°, передний и задний выдвижные ящики при 90°, тест Хьюстона, варус- и вальгус-стресс-тесты при 20–30°, сравнение со здоровым коленом."
sources:
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2 (УУР C, УДД 5): всем — тест Лахмана и передний выдвижной ящик при сгибании 90°, задний выдвижной ящик, тест Хьюстона, варус и вальгус стресс-тесты; чувствительности и специфичности тестов в тексте нет" }
review: draft
