id: exam.ask_reaction
name: { ru: "Расспрос: что было перед реакцией" }
kind: ask
# при сыпи с зудом — каждому: что было перед этим — лекарство, еда, ужаление (263_2, раздел 1.2;
# рек. 8: прекратить поступление аллергена — критерий качества 1)
routineFor: [sym.hives]
time: { procedure: 1 }
cost: 0
discomfort: 0
# точность расспроса — игровая оценка; сыпь спрашивают, если о ней не сказали сами
checks:
  - { f: sym.hives, sens: 95, spec: 99 }
  - { f: hx.trigger_drug, sens: 95, spec: 99 }
  - { f: hx.trigger_food, sens: 90, spec: 98 }
  - { f: hx.trigger_sting, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Что было за минуты или час до того, как стало плохо: укол лекарства, орехи или рыба, ужалила оса. Тяжёлая реакция начинается быстро, и причину надо убрать: остановить капельницу, вынуть жало."
  summary:
    ru: "Когда началось, что было перед этим — уколы и новые лекарства, еда, ужаления; бывало ли так раньше."
sources:
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: причины — лекарства 31,2–46,5 %, пища 23,3–31 %, яд перепончатокрылых 14,9–20 %, не установлена — 24–26 %; раздел 1.6: начало обычно в течение 2 часов, при пище — 30 минут; рек. 1: анамнез — после стабилизации; рек. 8: прекратить поступление аллергена, удалить жало — критерий качества 1; точность расспроса — игровая оценка" }
review: draft
