id: exam.cta_chest
name: { ru: "КТ-ангиография грудной клетки" }
kind: imaging
room: room.ct
equipment: [eq.ct_16, eq.ct_64]
# контраст в вену и срезы груди (spec 2026-10-chapter-3, часть 43а): КТ-ангиография аорты — предпочтительный метод
# при подозрении на расслоение (946_1, раздел 2.4; критерий качества 3); с частью 43б — и ТЭЛА. Время и цена —
# игровая оценка, как у КТ-ангиографии сосудов головы; облучение — высокое: контраст и область больше
radiation: high
time: { procedure: 10, report: 15 }
cost: 6000
discomfort: 1
# при внезапной рвущей боли в груди или спине — каждому, где есть кабинет КТ: при высокой вероятности или типичной
# боли в груди — визуализация, КТ (946_1, приложение Б; критерий качества 3); УЗИ сердца у постели в игре нет
routineFor: [sym.tearing_pain]
checks:
  # КТ: чувствительность 98–100 %, специфичность 95–98 %, отношение правдоподобия положительного результата —
  # 13,9 (Shiga 2006)
  - { f: img.cta_aortic_dissection, sens: 99, spec: 98 }
texts:
  hint:
    ru: "Контраст в вену и срезы груди: видны аорта и лёгочные артерии. При подозрении на расслоение аорты — главное обследование: отслоённая интима и два просвета, расслоена ли восходящая аорта."
  summary:
    ru: "Срезы груди с контрастом в вену, на уровне лёгочного ствола; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Расслоение аорты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/946_1", note: "ID 946_1, опубликованы 23.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.4: для первоначальной диагностической визуализации — КТ-ангиография аорты, предпочтительный метод при подозрении на острый аортальный синдром; приложение Б: при высокой вероятности или типичной боли в груди — ЭхоКГ и КТ; критерий качества 3; время и цена — игровая оценка" }
  - { kind: review, title: "Shiga T, Wajima Z, Apfel CC, Inoue T, Ohe Y. Diagnostic accuracy of transesophageal echocardiography, helical computed tomography, and magnetic resonance imaging for suspected thoracic aortic dissection: systematic review and meta-analysis. Arch Intern Med 2006;166(13):1350–1356", url: "https://pubmed.ncbi.nlm.nih.gov/16831999/", note: "PMID 16831999, сверено 05.10.2026: 16 исследований, 1139 больных; объединённая чувствительность — 98–100 %, специфичность — 95–98 %; у спиральной КТ отношение правдоподобия положительного результата — 13,9" }
review: draft
