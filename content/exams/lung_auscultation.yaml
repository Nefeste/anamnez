id: exam.lung_auscultation
name: { ru: "Аускультация лёгких" }
kind: physical
time: { procedure: 2 }
cost: 0
discomfort: 0
checks:
  - { f: sign.crackles_local, sens: 80, spec: 95 }
  - { f: sign.wheezes, sens: 85, spec: 95 }
  # травма груди (часть 32в): ослабленное дыхание над воздухом и кровью — игровая оценка
  - { f: sign.breath_sounds_diminished, sens: 80, spec: 97 }
  # стридор при отёке гортани (часть 33б) — слышен и без фонендоскопа: игровая оценка
  - { f: sign.stridor, sens: 90, spec: 98 }
texts:
  hint:
    ru: "Врач слушает, как проходит воздух: крепитация бывает при пневмонии, свистящие хрипы — когда сужены бронхи, ослабленное дыхание — когда лёгкое поджал воздух или кровь в плевральной полости. Шумный свистящий вдох — стридор — значит, отекла гортань."
  summary:
    ru: "Выслушать лёгкие фонендоскопом с обеих сторон, сверху вниз."
sources:
  - { kind: paper, title: "Metlay JP, Kapoor WN, Fine MJ. Does this patient have community-acquired pneumonia? JAMA 1997;278(17):1440–1445", note: "черновик: сверить согласие врачей в выслушивании хрипов" }
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: при пневмотораксе — ослабленное дыхание, при большом — ослабление или отсутствие; при гемотораксе — ослабление дыхания на стороне повреждения; точность — игровая оценка" }
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1: одышка, бронхоспазм, стридор, осиплость; раздел 1.5: при 2-й степени возможен стридор; точность — игровая оценка" }
review: draft
