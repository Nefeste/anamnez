id: exam.colonoscopy
name: { ru: "Колоноскопия" }
kind: imaging
room: room.endoscopy
equipment: [eq.videoendoscope]
# осмотр всей толстой кишки (spec 2026-10-chapter-4, часть 55а): «колоноскопия обязательна для установления диагноза ЯК и
# оценки активности ЯК» (193_2, раздел 2.4) — при лёгкой и умеренной активности. Накануне кишку готовят осмотическими
# слабительными, а это фактор риска токсической дилатации при тяжёлой атаке (раздел 3.2.2) — правило «Можно ли колоноскопию
# с подготовкой». Подготовку в игре не ждут: она — в минутах процедуры. Время, цена, неудобство и точность — игровая оценка.
# С частью 55б — и при запоре месяцами: по правилу «Нужна ли колоноскопия при запоре» (274_3, раздел 2.4); при синдроме
# раздражённого кишечника — «всем взрослым пациентам с СРК» (892_1, раздел 2.4, УУР В, УДД 3; критерий качества 1): каждому,
# у кого боль в животе связана со стулом полгода и дольше
radiation: none
complaints: [sym.bloody_diarrhea, sym.diarrhea, sym.mucus_blood_stool, sym.constipation_long]
routineSeen: [sym.pain_with_stool]
time: { procedure: 40, report: 5 }
cost: 4000
discomfort: 3
# долей осложнения в 193_2 нет — игровая оценка
harm: { rule: rule.colonoscopy_prep, band: rarely }
checks:
  - { f: img.colon_uc, sens: 97, spec: 98 }
texts:
  hint:
    ru: "Гибкий эндоскоп осматривает всю толстую кишку, накануне её очищают слабительными. Нужна для диагноза язвенного колита, всем взрослым с СРК и при запоре старше 50 лет или с симптомами тревоги. При тяжёлой атаке колита подготовка опасна: кишка может раздуться — тогда делают сигмоидоскопию."
  summary:
    ru: "Осмотр всей толстой кишки гибким эндоскопом после подготовки кишки слабительными; описание делает эндоскопист."
sources:
  - { kind: guideline, title: "Язвенный колит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/193_2", note: "ID 193_2, опубликованы 29.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4: колоноскопия обязательна для установления диагноза и оценки активности, при лёгкой и умеренной активности — илеоколоноскопия (УУР С, УДД 4); раздел 3.2.2: подготовка кишки к колоноскопии осмотическими слабительными — фактор риска токсической дилатации; критерий качества 2; время, цена, точность и доля осложнения — игровая оценка" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР В, УДД 3): колоноскопия с биопсией всем взрослым с СРК, чтобы исключить органические заболевания; критерий качества 1" }
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР C, УДД 5): колоноскопия при хроническом запоре старше 50 лет, при симптомах тревоги и наследственной отягощённости по колоректальному раку; критерий качества 1" }
review: draft
