id: exam.ask_onset
name: { ru: "Как началась болезнь и сколько длится" }
kind: ask
time: { procedure: 2 }
cost: 0
discomfort: 0
checks:
  - { f: sym.abrupt_onset, sens: 85, spec: 90 }
  - { f: sym.chronic_cough, sens: 88, spec: 95 }
  - { f: sym.cough_long, sens: 92, spec: 95 }
  # сколько часов назад стало плохо (часть 39а): время больной называет сам — без ошибки
  - { f: hx.onset_hours, sens: 100, spec: 100 }
  - { f: hx.recent_cold, sens: 90, spec: 95 }
texts:
  hint:
    ru: "Как и когда началось, подсказывает причину: грипп начинается внезапно, простуда — постепенно, а кашель дольше недели говорит о бронхите."
  summary:
    ru: "Остро или постепенно, что было до этого, бывало ли так раньше."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: расспрос больного", note: "точность расспроса — игровая оценка, не из литературы" }
review: draft
