id: exam.glucose_lab
name: { ru: "Глюкоза крови натощак" }
kind: lab
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.procedure
time: { procedure: 5, turnaround: 40 }
cost: 150
discomfort: 1
# каждому с жалобой на жажду или похудание (spec 2026-10-chapter-4, часть 61а): глюкозу плазмы или HbA1c — «всем лицам с жалобами
# на жажду (до 3–5 л/сут); кожный зуд; никтурию; полиурию; ... резкое и значительное снижение массы тела» (290_2, раздел 2.3, УУР С,
# УДД 5). Полиурия — не жалоба, с ней не приходят: о ней спрашивают
routineFor: [sym.thirst, sym.weight_loss]
checks:
  - { f: lab.glucose_high, sens: 97, spec: 97 }
  # пороги ДКА и ГГС (часть 73; Алгоритмы, 2023, с. 43, 47)
  - { f: lab.glucose_14, sens: 97, spec: 100 }
  - { f: lab.glucose_35, sens: 97, spec: 100 }
texts:
  hint:
    ru: "Сахар крови натощак в лаборатории: 7,0 ммоль/л и выше дважды — сахарный диабет."
  summary:
    ru: "Кровь из вены натощак."
sources:
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом", org: "Российская ассоциация эндокринологов", note: "черновик" }
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 12.10.2026; раздел 2.3 (УУР С, УДД 5): глюкоза плазмы или HbA1c — всем с жалобами на жажду, полиурию, снижение массы тела" }
review: draft
