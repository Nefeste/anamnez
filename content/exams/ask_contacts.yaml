id: exam.ask_contacts
name: { ru: "Контакты и поездки" }
kind: ask
time: { procedure: 1 }
cost: 0
discomfort: 0
checks:
  - { f: hx.sick_contact, sens: 90, spec: 97 }
  - { f: hx.travel, sens: 95, spec: 99 }
  # дача, лес, мыши (spec 2026-10-chapter-4, часть 52б): эпиданамнез ГЛПС — пребывание в природном очаге в срок инкубационного
  # периода (347_2, раздел 2.1, УУР С, УДД 5); точность расспроса — игровая оценка
  - { f: hx.rodent_contact, sens: 85, spec: 95 }
texts:
  hint:
    ru: "Если рядом болеют похоже, вероятнее заразная инфекция — грипп, ОРВИ, COVID-19, кишечная инфекция. После поездки чаще кишечные инфекции, после дачи и леса с мышами — геморрагическая лихорадка с почечным синдромом."
  summary:
    ru: "Болеет ли кто-то дома или на работе, куда ездил в последние две недели, бывал ли за месяц на даче и в лесу."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: расспрос больного", note: "точность расспроса — игровая оценка, не из литературы" }
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1 (УУР С, УДД 5): эпиданамнез — пребывание в очаге в срок инкубационного периода (1–5 недель), контакт с хворостом, соломой, сеном, термически не обработанные продукты; точность расспроса — игровая оценка" }
