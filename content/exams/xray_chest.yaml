id: exam.xray_chest
name: { ru: "Рентгенография органов грудной клетки" }
kind: imaging
room: room.xray
equipment: [eq.xray_analog, eq.xray_digital]
radiation: low
time: { procedure: 15, report: 20 }
cost: 900
discomfort: 0
checks:
  - { f: img.cxr_infiltrate, sens: 80, spec: 93 }
  - { f: img.cxr_hyperinflation, sens: 70, spec: 92 }
texts:
  hint:
    ru: "Показывает лёгкие целиком: инфильтрат при пневмонии, признаки эмфиземы. Облучение небольшое, но без нужды снимок не делают."
  summary:
    ru: "Снимок в прямой проекции; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Внебольничная пневмония у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/654_2", note: "ID 654_2, опубликованы 23.12.2024, применяются; сверено с рубрикатором 28.09.2026; черновик: чувствительность рентгена сверить по статьям" }
review: draft
