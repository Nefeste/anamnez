id: exam.xray_chest
name: { ru: "Рентгенография органов грудной клетки" }
kind: imaging
room: room.xray
equipment: [eq.xray_analog, eq.xray_digital]
radiation: low
time: { procedure: 15, report: 20 }
cost: 900
discomfort: 0
# «Рекомендуется всем пациентам с закрытой травмой груди выполнение рентгенографии легких»
# (728_2, раздел 2.4, УУР C, УДД 5)
routineFor: [sym.chest_injury_pain]
checks:
  - { f: img.cxr_infiltrate, sens: 80, spec: 93 }
  - { f: img.cxr_hyperinflation, sens: 70, spec: 92 }
  # травма груди (часть 32в): каждый четвёртый перелом рёбер снимок не видит — 25,9 % (728_2,
  # раздел 1.3); три и больше рёбер — игровая оценка (обзорный снимок нашёл перелом у 46 %,
  # Hoffstetter 2014); кровь — 96,2 и 100 % (Ma 1997); специфичность пневмоторакса — 99,4 %
  # (Alrajhi 2012), его чувствительность — игровая: в игре только пневмоторакс, видный на снимке;
  # уточнения — большой, смещение, выше угла лопатки — игровые оценки
  - { f: img.xr_rib_fracture, sens: 74, spec: 99.5 }
  - { f: img.xr_rib_multiple, sens: 50, spec: 99.9 }
  - { f: img.cxr_pneumothorax, sens: 90, spec: 99.4 }
  - { f: img.cxr_pneumothorax_large, sens: 95, spec: 99.9 }
  - { f: img.cxr_mediastinal_shift, sens: 90, spec: 99.9 }
  - { f: img.cxr_hemothorax, sens: 96, spec: 100 }
  - { f: img.cxr_hemothorax_large, sens: 95, spec: 99.9 }
  # расширенное средостение (spec 2026-10-chapter-3, часть 43а): при расслоении аорты снимок изменён у 90 %
  # (Klompas 2002); точность чтения — игровая оценка
  - { f: img.cxr_wide_mediastinum, sens: 95, spec: 98 }
texts:
  hint:
    ru: "Показывает лёгкие целиком: инфильтрат при пневмонии, признаки эмфиземы; при травме груди — воздух и кровь в плевральной полости, переломы рёбер; расширенное средостение. Облучение небольшое, но без нужды снимок не делают."
  summary:
    ru: "Снимок в прямой проекции; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Внебольничная пневмония у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/654_2", note: "ID 654_2, опубликованы 23.12.2024, применяются; сверено с рубрикатором 28.09.2026; черновик: чувствительность рентгена сверить по статьям" }
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: рентгенография лёгких — всем с закрытой травмой груди (УУР C, УДД 5), оценить пневмоторакс или гемоторакс, смещение средостения; гемоторакс менее 300 см³ не определяется; раздел 1.3: 25,9 % переломов рёбер рентгенонегативны при рутинной рентгенографии лёгких" }
  - { kind: review, title: "Klompas M. Does this patient have an acute thoracic aortic dissection? JAMA 2002;287(17):2262–2272", url: "https://pubmed.ncbi.nlm.nih.gov/11980527/", note: "PMID 11980527, сверено 05.10.2026: при расслоении аорты обзорный снимок груди обычно изменён — чувствительность 90 %; нормальные аорта и средостение — отношение правдоподобия отрицательного результата 0,3" }
  - { kind: review, title: "Alrajhi K, Woo MY, Vaillancourt C. Test characteristics of ultrasonography for the detection of pneumothorax: a systematic review and meta-analysis. Chest 2012;141(3):703–708", url: "https://pubmed.ncbi.nlm.nih.gov/21868468/", note: "PMID 21868468, сверено 29.09.2026: 8 исследований, 1 048 больных; снимок груди лёжа — чувствительность 50,2 %, специфичность 99,4 %; УЗИ — 90,9 и 98,2 %" }
  - { kind: paper, title: "Ma OJ, Mateer JR. Trauma ultrasound examination versus chest radiography in the detection of hemothorax. Ann Emerg Med 1997;29(3):312–315", url: "https://pubmed.ncbi.nlm.nih.gov/9055768/", note: "PMID 9055768, сверено 29.09.2026: 240 больных, гемоторакс — у 26; снимок груди и УЗИ — чувствительность 96,2 %, специфичность 100 %" }
review: draft
