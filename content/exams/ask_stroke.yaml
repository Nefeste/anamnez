id: exam.ask_stroke
name: { ru: "Расспрос: слабость, речь, лицо и когда началось" }
kind: ask
time: { procedure: 2 }
cost: 0
discomfort: 0
# каждому с признаками инсульта (spec 2026-10-chapter-3, часть 41а): точное время появления симптомов,
# а если оно неизвестно, — когда человека последний раз видели без них (814_1, раздел 2.1); от него
# зависят тромболизис и тромбэктомия. Точность — игровая оценка, время больной или родные называют без
# ошибки, как в расспросе о начале болезни
complaints: [sym.weakness_one_side, sym.speech_trouble, sym.face_droop]
routineFor: [sym.weakness_one_side, sym.speech_trouble, sym.face_droop]
checks:
  - { f: sym.weakness_one_side, sens: 95, spec: 99 }
  - { f: sym.speech_trouble, sens: 92, spec: 98 }
  - { f: sym.face_droop, sens: 90, spec: 98 }
  - { f: hx.onset_hours, sens: 100, spec: 100 }
texts:
  hint:
    ru: "Что ослабло, нарушилась ли речь, перекосило ли лицо — и главное, когда это началось или когда человека последний раз видели здоровым. От часов зависит, можно ли растворить тромб."
  summary:
    ru: "Слабость в руке и ноге, речь, лицо, время начала — у самого больного и у родных."
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.1: установить точное время появления симптомов, неизвестно — время последнего контакта, в том числе по телефону с родственниками; у каждого третьего время дебюта неизвестно; точность расспроса — игровая оценка" }
review: draft
