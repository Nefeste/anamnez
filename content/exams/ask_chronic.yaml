id: exam.ask_chronic
name: { ru: "Хронические болезни" }
kind: ask
routine: true
time: { procedure: 1 }
cost: 0
discomfort: 0
checks:
  - { f: hx.copd, sens: 95, spec: 99 }
  - { f: hx.asthma, sens: 95, spec: 99 }
  - { f: hx.hypertension, sens: 95, spec: 99 }
  - { f: hx.diabetes, sens: 95, spec: 99 }
  - { f: hx.gallstones, sens: 95, spec: 99 }
  - { f: hx.ulcer, sens: 95, spec: 99 }
  - { f: hx.hernia, sens: 95, spec: 99 }
  - { f: hx.abdominal_surgery, sens: 95, spec: 99 }
  - { f: hx.kidney_stones, sens: 95, spec: 99 }
  # мерцательная аритмия (часть 33б) — источник эмболии артерий ноги (1006_1, раздел 1.2)
  - { f: hx.atrial_fibrillation, sens: 95, spec: 99 }
  # пункты шкалы CHA₂DS₂-VASc (часть 42а; 382_2, приложение Г1): сердечная недостаточность, инфаркт или
  # атеросклероз артерий ног, инсульт или ТИА; точность — как у остальных, игровая оценка
  - { f: hx.heart_failure, sens: 95, spec: 99 }
  - { f: hx.vascular, sens: 92, spec: 99 }
  - { f: hx.stroke_tia, sens: 95, spec: 99 }
  # рак, который лечат сейчас (часть 43б): пункт sPESI (ESC 2019, табл. 7) — его узнают у каждого больного ТЭЛА,
  # не только с болью в ноге или внезапной одышкой; точность — как у остальных, игровая оценка
  - { f: hx.cancer_active, sens: 95, spec: 99 }
  # цирроз печени (spec 2026-10-chapter-4, часть 54а): кто знает о нём — скажет; точность — как у остальных, игровая оценка
  - { f: hx.cirrhosis, sens: 95, spec: 99 }
  # язвенный колит (spec 2026-10-chapter-4, часть 55а) — как и цирроз, знает тот, у кого его уже находили
  - { f: hx.uc, sens: 95, spec: 99 }
  # болезнь Аддисона (spec 2026-10-chapter-4, часть 56а): кто лечится, знает о ней — у больных бывает браслет или карточка (524_3,
  # раздел 5); точность — как у остальных, игровая оценка
  - { f: hx.adrenal_insufficiency, sens: 95, spec: 99 }
  # тиреотоксикоз уже находили и лечили (spec 2026-10-chapter-4, часть 56б) — знает тот, кто лечился; точность — игровая оценка
  - { f: hx.thyrotoxicosis, sens: 95, spec: 99 }
  # операция на щитовидной железе на днях (spec 2026-10-chapter-4, часть 56в): об операциях на органах шеи спрашивают при подозрении
  # на гипопаратиреоз (627_3, раздел 2.1, УУР С, УДД 5); точность — игровая оценка
  - { f: hx.thyroidectomy, sens: 95, spec: 99 }
  # миастения (spec 2026-10-chapter-4, часть 58в): больной и родные называют её и пиридостигмин (165_2, приложение В: «Сообщить врачу о
  # диагнозе „миастения“»); точность — игровая оценка
  - { f: hx.myasthenia, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Хронические болезни меняют картину: у человека с ХОБЛ или астмой одышка может быть обострением, а не новой болезнью; при циррозе рвота кровью — чаще из вен пищевода."
  summary:
    ru: "Какие болезни уже известны — в том числе сердечная недостаточность, инфаркт, инсульт, рак, — какие были операции, чем лечится постоянно."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: расспрос больного", note: "точность расспроса — игровая оценка, не из литературы" }
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2.1 (УУР С, УДД 5): при подозрении на гипопаратиреоз — анамнез о хирургических вмешательствах на органах шеи; точность — игровая оценка" }
  - { kind: guideline, title: "Миастения", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/165_2", note: "ID 165_2, опубликованы 15.12.2025, применяются; сверено с рубрикатором 12.10.2026; приложение В: больному — сообщить врачу о диагнозе «миастения»; точность — игровая оценка" }
review: draft
