texts:
  hint:
    ru: "Хронические болезни меняют картину: у человека с ХОБЛ или астмой одышка может быть обострением, а не новой болезнью."
  summary:
    ru: "Какие болезни уже известны — в том числе сердечная недостаточность, инфаркт, инсульт, — какие были операции, чем лечится постоянно."
