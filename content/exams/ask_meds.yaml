id: exam.ask_meds
name: { ru: "Какие лекарства принимает" }
kind: ask
time: { procedure: 1 }
cost: 0
discomfort: 0
# при кровотечении из носа — каждому: антикоагулянты и антиагреганты (977_1, раздел 2.1); при поносе — каждому (spec
# 2026-10-chapter-4, часть 49б): антибиотики в последние три месяца и слабительные (878_1, раздел 2.1)
# с частью 55а — и при стуле с кровью: «принимаемые лекарственные препараты (в частности, антибиотики и нестероидные
# противовоспалительные…)» (193_2, раздел 2.1)
routineFor: [sym.nosebleed, sym.diarrhea, sym.bloody_diarrhea]
# при гипогликемии — каждому (spec 2026-10-chapter-3, часть 44а): от чего упал сахар — инсулин или сульфонилмочевина,
# лишняя доза или пропущенная еда (290_2, раздел 3.7)
routineSeen: [lab.glucose_low]
checks:
  - { f: hx.nsaid_use, sens: 90, spec: 97 }
  # антикоагулянты — основной признак правила КТ при травме головы (часть 32г); точность — игровая оценка
  - { f: hx.anticoagulants, sens: 95, spec: 99 }
  # инсулин знают все, кто его колет; название таблеток помнят не все (часть 44а) — точность — игровая оценка
  - { f: hx.insulin, sens: 98, spec: 99 }
  - { f: hx.sulfonylurea, sens: 90, spec: 97 }
  - { f: hx.missed_meal, sens: 90, spec: 95 }
  # антибиотики (spec 2026-10-chapter-4, часть 49б): главный фактор риска энтероколита, вызванного C. difficile (878_1,
  # раздел 2.1); курс за три месяца помнят не все — точность игровая
  - { f: hx.antibiotics_recent, sens: 90, spec: 97 }
  - { f: hx.antibiotic_now, sens: 97, spec: 99 }
  # острая крапивница (часть 73): что пил в последние дни и помогли ли таблетки от аллергии (264_2, раздел 2.1);
  # точность — игровая оценка
  - { f: hx.new_drug, sens: 90, spec: 97 }
  - { f: hx.antihistamine_failed, sens: 95, spec: 99 }
  # пропуск инсулина — причина ДКА (часть 73; Алгоритмы, 2023, с. 44); точность — игровая оценка
  - { f: hx.missed_insulin, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Лекарства бывают причиной жалоб: обезболивающие раздражают желудок и повышают давление, инсулин и таблетки сульфонилмочевины без еды роняют сахар, после антибиотика бывает понос от C. difficile, от нового лекарства — крапивница. От них зависит, что ещё можно назначить, а после травмы головы — нужна ли КТ."
  summary:
    ru: "Что принимает постоянно и что пил в последние дни, включая безрецептурное; не было ли антибиотиков в последние три месяца."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: расспрос больного", note: "точность расспроса — игровая оценка, не из литературы" }
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: антикоагулянтная терапия — основной фактор риска для КТ при лёгкой ЧМТ" }
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: провоцирующие факторы гипогликемии — передозировка инсулина или сульфонилмочевины, пропуск приёма пищи или мало углеводов; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Носовое кровотечение", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/977_1", note: "ID 977_1, опубликованы 08.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1: уточнять приём антиагрегантных, антикоагулянтных и других препаратов; на них кровотечения чаще повторяются" }
  - { kind: guideline, title: "Энтероколит, вызванный Clostridioides difficile (C. difficile)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/878_1", note: "ID 878_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.1: факторы риска — пожилой возраст, госпитализация и антибиотикотерапия, риск в 7–10 раз выше во время неё и в первый месяц после; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Крапивница", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/264_2", note: "ID 264_2, опубликованы 19.07.2023, применяются; сверено с рубрикатором 15.10.2026; раздел 2.1: связь с приёмом АСК, НПВП, ингибиторов АПФ и других лекарств, эффективность антигистаминных и предшествующего лечения; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом. 11-й выпуск", org: "Под ред. И.И. Дедова, М.В. Шестаковой, А.Ю. Майорова", year: 2023, url: "https://doi.org/10.14341/DM13042", note: "Сахарный диабет. 2023;26(2S):1–157, сверено 15.10.2026; раздел 8.1, с. 44: провоцирующие факторы ДКА — пропуск или отмена инсулина, ошибки в технике инъекций, неисправность средств для введения инсулина; точность расспроса — игровая оценка" }
review: draft
