id: exam.wound_exam
name: { ru: "Осмотр раны" }
kind: physical
time: { procedure: 3 }
cost: 0
discomfort: 1
complaints: [sym.hand_wound, sym.head_wound]
# осмотр и пальпация раны — всем (733_2, раздел 2.2; 688_2, раздел 2.2)
routineFor: [sym.hand_wound, sym.head_wound]
checks:
  - { f: sign.wound_gaping, sens: 95, spec: 95 }
  - { f: sign.wound_large, sens: 95, spec: 95 }
texts:
  hint:
    ru: "Где рана, какого она размера и глубины, сходятся ли края, есть ли в ней грязь и инородные тела, кровит ли она. От этого зависит, зашивать ли рану и где лечить."
  summary:
    ru: "Осмотр и пальпация раны: место, размер, глубина, края, загрязнение и инородные тела, кровотечение, окружающие ткани."
sources:
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2 (УУР C, УДД 5): оценить локализацию раны, размеры, глубину и состояние краёв, связь с сосудами и нервами, инородные тела, окружающие ткани; точность осмотра — игровая оценка" }
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2 (УУР C, УДД 5): визуальное исследование и пальпация области раны всем" }
review: draft
