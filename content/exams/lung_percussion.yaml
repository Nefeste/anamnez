id: exam.lung_percussion
name: { ru: "Перкуссия лёгких" }
kind: physical
time: { procedure: 2 }
cost: 0
discomfort: 0
checks:
  - { f: sign.dullness, sens: 65, spec: 95 }
  # травма груди (часть 32в): тимпанит над воздухом в плевральной полости — игровая оценка
  - { f: sign.percussion_tympany, sens: 70, spec: 98 }
texts:
  hint:
    ru: "Над воздушным лёгким звук гулкий, над плотным участком и жидкостью — глухой, над воздухом в плевральной полости — звонкий, тимпанический. Помогает заподозрить пневмонию без снимка, но небольшие очаги пропускает."
  summary:
    ru: "Простучать грудную клетку, сравнивая симметричные участки."
sources:
  - { kind: paper, title: "Metlay JP, Kapoor WN, Fine MJ. JAMA 1997;278(17):1440–1445", note: "черновик" }
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: для пневмоторакса характерен тимпанит, большой гемоторакс — тупой перкуторный звук; точность — игровая оценка" }
review: draft
