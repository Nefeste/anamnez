id: exam.neuro_exam
name: { ru: "Неврологический осмотр" }
kind: physical
time: { procedure: 5 }
cost: 0
discomfort: 0
# каждому с травмой и раной головы (733_2, раздел 2.2 и критерий качества 2; 734_2, раздел 2.2.1); с частью 43г — и
# каждому с давлением 180/110 и выше: неврологический статус — в осмотре всех с АГ (62_3, раздел 2.2), оглушение —
# энцефалопатия, это криз (раздел 3.7)
routineFor: [sym.head_injury, sym.head_wound]
routineSeen: [vital.bp_very_high]
checks:
  - { f: sign.gcs_low, sens: 90, spec: 98 }
  - { f: sign.nystagmus, sens: 80, spec: 95 }
  - { f: sign.romberg_unsteady, sens: 80, spec: 93 }
  - { f: sign.anisoreflexia, sens: 70, spec: 93 }
  # очаговый дефицит и шкала инсульта NIH (spec 2026-10-chapter-3, часть 41а; 814_1, раздел 2.2 и критерий
  # качества 1): точность — игровая оценка; NIHSS 6 и больше — то же число, точность из него
  - { f: sign.hemiparesis, sens: 92, spec: 97 }
  - { f: sign.facial_weakness, sens: 88, spec: 97 }
  - { f: sign.speech_deficit, sens: 90, spec: 98 }
  - { f: sign.nihss, sens: 98, spec: 100 }
  - { f: sign.nihss_high, sens: 100, spec: 100 }
  # менингеальный синдром при кровоизлиянии (часть 41в; 523_3, раздел 1.6): точность — игровая оценка
  - { f: sign.neck_stiffness, sens: 85, spec: 97 }
texts:
  hint:
    ru: "Сознание по шкале комы Глазго, сила, лицо, речь, равновесие, рефлексы и шкала инсульта NIH. После травмы головы — каждому; при признаках инсульта — в первые 10 минут: по нему решают КТ-ангиографию."
  summary:
    ru: "Оценка сознания по шкале комы Глазго, зрачков, движений глазных яблок и нистагма, устойчивости в позе Ромберга, сухожильных рефлексов, силы и чувствительности в руках и ногах, лица и речи; при подозрении на инсульт — по шкале инсульта NIH."
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 1.6: менингеальный синдром при САК — боль в шее и ригидность, при ВМГ — светобоязнь, затем ригидность мышц затылка; точность — игровая оценка" }
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2.1 (УУР C, УДД 4): тщательный неврологический осмотр при поступлении и в динамике с оценкой по шкале комы Глазго; частоты нистагма, атаксии и анизорефлексии; критерии качества 1 и 2: осмотр с оценкой неврологического статуса, оценка по шкале Глазго; точность осмотра — игровая оценка" }
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2 (УУР C, УДД 5): всем с ранами головы — общеклинический и неврологический осмотр; критерий качества 2" }
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.2: осмотр невролога в первые 10 минут; критерий качества 1: с оценкой по шкале NIH и шкале комы Глазго; приложение Г1: шкала NIH; точность осмотра — игровая оценка" }
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 2.2: всем пациентам с АГ — оценка неврологического статуса; в игре — каждому с давлением 180/110 и выше (часть 43г): оглушение при кризе — энцефалопатия (раздел 3.7)" }
review: draft
