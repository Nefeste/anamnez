id: exam.neuro_exam
name: { ru: "Неврологический осмотр" }
kind: physical
time: { procedure: 5 }
cost: 0
discomfort: 0
# каждому с травмой и раной головы (733_2, раздел 2.2 и критерий качества 2; 734_2, раздел 2.2.1); с частью 43г — и
# каждому с давлением 180/110 и выше: неврологический статус — в осмотре всех с АГ (62_3, раздел 2.2), оглушение —
# энцефалопатия, это криз (раздел 3.7); с частью 44в — и каждому после судорожного приступа: неврологический осмотр
# при впервые развившемся приступе — критерий качества (741_1, раздел 2.2); с частью 50а (spec 2026-10-chapter-4) — и при
# сильной распирающей головной боли: «при наличии сильной головной боли на фоне гипертермии» — менингеальные знаки и
# очаговые симптомы (1020_1, раздел 2.1); с частью 51б — и когда голова не держится: парезы на осмотре (567_2, раздел 2.2);
# с частью 51в — и при двоении в глазах: неврологический статус с птозом и зрачками — критерий качества 2 при ботулизме (911_1);
# с частью 54а — и когда днём сонлив и путает дни: стадию печёночной энцефалопатии определяют по сознанию и хлопающему
# тремору (715_2, раздел 1.5, табл. 2), от неё — место; с частью 57а — и каждому, кого нашли без сознания: шкала комы Глазго,
# зрачки и их реакция на свет (743_2, раздел 2.2)
routineFor: [sym.head_injury, sym.head_wound, sym.seizure, sym.headache_severe, sym.neck_weakness, sym.diplopia, sym.daytime_sleepiness, sym.found_unconscious]
routineSeen: [vital.bp_very_high]
checks:
  - { f: sign.gcs_low, sens: 90, spec: 98 }
  # кома — 8 баллов и меньше (spec 2026-10-chapter-4, часть 50а; 1020_1, приложение Г1): то же число, точность — из него
  - { f: sign.gcs_coma, sens: 98, spec: 100 }
  - { f: sign.nystagmus, sens: 80, spec: 95 }
  - { f: sign.romberg_unsteady, sens: 80, spec: 93 }
  - { f: sign.anisoreflexia, sens: 70, spec: 93 }
  # очаговый дефицит и шкала инсульта NIH (spec 2026-10-chapter-3, часть 41а; 814_1, раздел 2.2 и критерий
  # качества 1): точность — игровая оценка; NIHSS 6 и больше — то же число, точность из него
  - { f: sign.hemiparesis, sens: 92, spec: 97 }
  - { f: sign.facial_weakness, sens: 88, spec: 97 }
  - { f: sign.speech_deficit, sens: 90, spec: 98 }
  - { f: sign.nihss, sens: 98, spec: 100 }
  - { f: sign.nihss_high, sens: 100, spec: 100 }
  # невропатия лицевого нерва (spec 2026-10-chapter-3, часть 44б): лоб — проба «Поднимите брови вверх» (895_1,
  # раздел 2.2, табл. 11), глаз — зажмуриться; ложных признаков лица на глаз не бывает — с ними снимается срок КТ
  # при перекошенном лице, точность — игровая оценка
  - { f: sign.facial_palsy_peripheral, sens: 95, spec: 100 }
  - { f: sign.lagophthalmos, sens: 95, spec: 100 }
  - { f: sign.facial_palsy_severe, sens: 92, spec: 100 }
  # менингеальный синдром при кровоизлиянии (часть 41в; 523_3, раздел 1.6) и менингите (spec 2026-10-chapter-4, часть 50а;
  # 1020_1, раздел 2.2): точность — игровая оценка
  - { f: sign.neck_stiffness, sens: 85, spec: 97 }
  # постприступная спутанность и сон (часть 44в; 741_1, разделы 1.6.5.3 и 2.1): точность — игровая оценка
  - { f: sign.postictal, sens: 95, spec: 97 }
  # свисающая голова — вялый парез мышц шеи и плеч при полиомиелитической форме клещевого энцефалита (spec 2026-10-chapter-4,
  # часть 51б; 567_2, разделы 1.6 и 2.2: парезы на осмотре): точность — игровая оценка
  - { f: sign.head_drop, sens: 95, spec: 99 }
  # птоз и широкие зрачки с вялой реакцией на свет при ботулизме (spec 2026-10-chapter-4, часть 51в; 911_1, раздел 2 и критерий
  # качества 2): точность — игровая оценка
  - { f: sign.ptosis, sens: 92, spec: 98 }
  - { f: sign.mydriasis, sens: 88, spec: 97 }
  # хлопающий тремор — астериксис, вторая и третья стадия печёночной энцефалопатии (spec 2026-10-chapter-4, часть 54а; 715_2,
  # раздел 1.5, табл. 2): точность — игровая оценка
  - { f: sign.asterixis, sens: 85, spec: 97 }
  # узкие зрачки (spec 2026-10-chapter-4, часть 57а): миоз — ведущий симптом отравления опиоидами (743_2, разделы 1.5 и 1.6); точность
  # — игровая оценка
  - { f: sign.miosis, sens: 95, spec: 98 }
texts:
  hint:
    ru: "Сознание по шкале комы Глазго, сила, лицо, речь, равновесие, рефлексы и шкала инсульта NIH. После травмы головы — каждому; при признаках инсульта — в первые 10 минут: по нему решают КТ-ангиографию. Перекошенное лицо — попросить поднять брови: не морщится и лоб — невропатия лицевого нерва, а не инсульт."
  summary:
    ru: "Оценка сознания по шкале комы Глазго, зрачков, движений глазных яблок и нистагма, устойчивости в позе Ромберга, сухожильных рефлексов, силы и чувствительности в руках и ногах, лица и речи, хлопающего тремора кистей; при подозрении на инсульт — по шкале инсульта NIH."
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 2.2: неврологический осмотр пациентам с впервые развившимся эпилептическим приступом (критерий качества); разделы 1.6.5.3 и 2.1: постприступное оглушение и сон, постприступная спутанность после ГТКП; точность — игровая оценка" }
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 1.6: менингеальный синдром при САК — боль в шее и ригидность, при ВМГ — светобоязнь, затем ригидность мышц затылка; точность — игровая оценка" }
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2.1 (УУР C, УДД 4): тщательный неврологический осмотр при поступлении и в динамике с оценкой по шкале комы Глазго; частоты нистагма, атаксии и анизорефлексии; критерии качества 1 и 2: осмотр с оценкой неврологического статуса, оценка по шкале Глазго; точность осмотра — игровая оценка" }
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2 (УУР C, УДД 5): всем с ранами головы — общеклинический и неврологический осмотр; критерий качества 2" }
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.2: осмотр невролога в первые 10 минут; критерий качества 1: с оценкой по шкале NIH и шкале комы Глазго; приложение Г1: шкала NIH; точность осмотра — игровая оценка" }
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 2.2: осмотр невролога, оценка лагофтальма; табл. 11: проба «Поднимите брови вверх»; раздел 1.6: слабость только нижней группы мимических мышц — центральное поражение; точность — игровая оценка" }
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 2.2: всем пациентам с АГ — оценка неврологического статуса; в игре — каждому с давлением 180/110 и выше (часть 43г): оглушение при кризе — энцефалопатия (раздел 3.7)" }
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 2.2: менингеальные знаки — ригидность мышц затылка, симптомы Брудзинского и Кернига, в первые часы могут быть отрицательны; приложение Г1: шкала комы Глазго, 8 баллов и ниже — кома; точность — игровая оценка" }
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2: острый вялый парез — птоз век, ограничение движений глазных яблок во все стороны, мидриаз, вялость или отсутствие зрачковых реакций на свет, ограничение подвижности мягкого нёба; критерий качества 2 — оценка неврологического статуса; точность — игровая оценка" }
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.5, табл. 2: астериксис — признак второй стадии ПЭ по West Haven; точность — игровая оценка" }
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; разделы 1.5 и 1.6: миоз со снижением реакции на свет — ведущий симптом; раздел 2.2 (УУР С, УДД 5): оценка сознания по шкале комы Глазго, ширины зрачков и их реакции на свет; точность — игровая оценка" }
review: draft
