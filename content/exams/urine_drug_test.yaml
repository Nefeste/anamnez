id: exam.urine_drug_test
name: { ru: "Экспресс-тест мочи на наркотики" }
kind: rapid
# иммунохроматографический тест мочи (spec 2026-10-chapter-4, часть 57а): предварительный анализ при отравлении (743_2, раздел 2.3, УУР
# В, УДД 3), не позднее 24 часов от поступления — критерий качества 2. Каждому, кого нашли без сознания, и с узкими зрачками. Фентанилы
# тест не видит — отсюда чувствительность ниже 100; время и точность — игровая оценка
routineFor: [sym.found_unconscious]
routineSeen: [sign.miosis]
time: { procedure: 5, turnaround: 10 }
cost: 400
discomfort: 0
checks:
  - { f: lab.opioids_urine, sens: 92, spec: 97 }
texts:
  hint:
    ru: "Тест-полоска с мочой за несколько минут находит морфин и героин, метадон и ещё несколько веществ. Положительный подтверждают в лаборатории, отрицательный при типичной картине отравления не исключает: фентанилы полоска не видит."
  summary:
    ru: "Тест-полоска с мочой на группы наркотиков."
sources:
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 2.3 (УУР В, УДД 3): предварительный иммунохроматографический анализ мочи, положительный и отрицательный при типичной картине проверяют хромато-масс-спектрометрией; производных фентанила в перечне теста нет; критерий качества 2; время и точность — игровая оценка" }
review: draft
