id: exam.ice_test
name: { ru: "Проба со льдом" }
kind: physical
# холодовая проба при птозе (spec 2026-10-chapter-4, часть 58в): «простой и экономически целесообразной прикроватной пробой» —
# «пакет со льдом накладывается на 2 минуты» (165_2, раздел 2.5, УУР A, УДД 1). Каждому с опущенными веками
routineSeen: [sign.ptosis]
time: { procedure: 3 }
cost: 0
discomfort: 1
checks:
  # «Специфичность теста по разным исследованиям составляет 62,5%-95%»; «отрицательный холодовой тест с вероятностью 94% исключает
  # миастению» (там же): специфичность — середина, чувствительность — игровая оценка по отрицательной прогностической ценности
  - { f: sign.ice_test_positive, sens: 90, spec: 80 }
texts:
  hint:
    ru: "Пакет со льдом на опущенное веко на 2 минуты. Поднялось больше чем на 2 мм — за миастению; не поднялось — миастения почти исключена. Проба быстрая и безопасная, её делают у постели."
  summary:
    ru: "Пакет со льдом на 2 минуты на веко с наибольшим птозом, затем — насколько поднялось веко."
sources:
  - { kind: guideline, title: "Миастения", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/165_2", note: "ID 165_2, опубликованы 15.12.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2.5 (УУР A, УДД 1): холодовой тест — простая прикроватная проба, лёд на 2 минуты, положительный — подъём века более чем на 2 мм, специфичность 62,5–95 %, отрицательный с вероятностью 94 % исключает миастению; чувствительность — игровая оценка" }
review: draft
