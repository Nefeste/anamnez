id: exam.burn_depth_tests
name: { ru: "Пробы на глубину ожога" }
kind: physical
time: { procedure: 3 }
cost: 0
discomfort: 2
complaints: [sym.burn]
# укол иглой, волосковая и капиллярная пробы (687_3, раздел 2.2); точность клинической оценки неясной
# глубины в первые 48 ч — 60–70 % (раздел 2.4), а безболезненное удаление волос и нет боли при уколе
# струпа — «убедительные признаки» глубокого ожога (раздел 2.2): чувствительность 85, специфичность
# 95 — игровая оценка с этой опорой
checks:
  - { f: sign.burn_insensate, sens: 90, spec: 95 }
texts:
  hint:
    ru: "Ожог колют кончиком иглы, выдёргивают волосок, нажимают на кожу пальцем. Больно, а пятно от нажатия заполняется кровью — ожог II степени; не больно, волоски выходят легко, пятна нет — III степень."
  summary:
    ru: "Болевая чувствительность — укол иглой, волосковая проба, капиллярная проба: белое пятно при нажатии и заполняется ли оно кровью."
sources:
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей.", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: капиллярная проба, уколы иглой, выдёргивание волосков, спиртовая и тепловая пробы; лёгкое безболезненное удаление волос и отсутствие боли при уколе струпа — убедительные признаки глубокого ожога; учитывать сознание и обезболивание; раздел 2.4: точность клинических методов при неясной глубине в первые 48 ч — 60–70 %; точность проб — игровая оценка" }
review: draft
