id: exam.xray_foot
name: { ru: "Рентгенография стопы" }
kind: imaging
room: room.xray
equipment: [eq.xray_analog, eq.xray_digital]
radiation: low
time: { procedure: 10, report: 20 }
cost: 900
discomfort: 1
# точность снимка в рекомендации не дана — игровая оценка
checks:
  - { f: img.xr_mt5_fracture, sens: 95, spec: 98 }
  - { f: img.xr_mt5_displaced, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Снимок стопы в двух проекциях: есть ли перелом плюсневых костей и насколько сместились отломки. Без признаков по оттавским правилам его можно не делать."
  summary:
    ru: "Снимки в прямой и косой проекциях; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: рентгенография стопы в двух проекциях, при необходимости — в дополнительных, чтобы определить положение отломков и тактику; при недостатке данных — КТ; точность снимка не дана — игровая оценка" }
review: draft
