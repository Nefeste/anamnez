id: exam.hernia_check
name: { ru: "Осмотр грыжевых ворот" }
kind: physical
time: { procedure: 2 }
cost: 0
discomfort: 1
checks:
  # клиническое обследование при паховой грыже — чувствительность 74,5–92 % (середина), специфичность 93 % (684_2, раздел 2.2)
  - { f: sign.hernia_strangulated, sens: 83, spec: 93 }
texts:
  hint:
    ru: "Врач осматривает и ощупывает паховые области, пупок и рубцы стоя и лёжа, просит покашлять. При боли в животе и рвоте ущемлённую грыжу ищут всегда: её легко пропустить."
  summary:
    ru: "Осмотр и пальпация паховых и бедренных областей, пупочного кольца и послеоперационных рубцов; кашлевой толчок."
sources:
  - { kind: guideline, title: "Паховая и бедренная грыжа", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/684_2", note: "ID 684_2, опубликованы 18.10.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: клиническое обследование при паховой грыже — чувствительность 74,5–92 %, специфичность 93 %; при ущемлении — напряжённое, болезненное, невправимое выпячивание без кашлевого толчка" }
  - { kind: guideline, title: "Острая неопухолевая кишечная непроходимость", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/327_3", note: "ID 327_3, опубликованы 06.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: всем пациентам с кишечной непроходимостью — исследование всех грыжевых ворот и послеоперационных рубцов" }
review: draft
