id: exam.nose_exam
name: { ru: "Осмотр носа и пальпация пазух" }
kind: physical
time: { procedure: 3 }
cost: 0
discomfort: 1
# при кровотечении из носа — каждому: диагноз по риноскопии и фарингоскопии (977_1, раздел 2)
routineFor: [sym.nosebleed]
checks:
  - { f: sign.pale_nasal_mucosa, sens: 80, spec: 92 }
  - { f: sign.purulent_discharge_nose, sens: 75, spec: 92 }
  - { f: sign.sinus_tenderness, sens: 60, spec: 80 }
  # источник спереди на перегородке (часть 33б): точность — игровая оценка
  - { f: sign.nasal_bleeding_point, sens: 90, spec: 98 }
texts:
  hint:
    ru: "Бледная отёчная слизистая — довод за аллергию, гной в носовых ходах — за синусит. Болезненность над пазухами — признак неточный. При кровотечении из носа ищут, где кровит: сосуд на перегородке видно и можно прижечь или прижать турундой."
  summary:
    ru: "Передняя риноскопия с налобным осветителем, пальпация в проекции пазух."
sources:
  - { kind: guideline, title: "Острый синусит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/313_3", note: "ID 313_3, опубликованы 28.10.2024, применяются; сверено с рубрикатором 28.09.2026; точность осмотра — игровая оценка" }
  - { kind: guideline, title: "Носовое кровотечение", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/977_1", note: "ID 977_1, опубликованы 08.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2: диагноз — по риноскопии и фарингоскопии; раздел 2.4: не виден источник при передней риноскопии — эндоскопия; точность осмотра — игровая оценка" }
review: draft
