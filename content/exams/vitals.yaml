id: exam.vitals
name: { ru: "Температура, пульс, давление, дыхание, сатурация" }
kind: bedside
time: { procedure: 6 }
cost: 0
discomfort: 0
# при сыпи с удушьем — мониторинг пульса, давления и дыхания (263_2, рек. 6, критерий качества 4);
# при кровотечении из носа — давление всем (977_1, раздел 2.2, критерий качества 4); при сердцебиении — пульс
# в покое и давление: нестабилен ли (382_2, разделы 2.2 и 3.1.2.2); после обморока и при головокружении — тоже (часть
# 42б: сердцебиение, предобморочное состояние и обморок — три главных симптома желудочковых аритмий, 569_2, раздел
# 1.6; симптомная гипотензия и обморок или предобморок — признаки нестабильности, раздел 3.1.2); при резком подъёме
# давления — перемерить (часть 43г; 62_3, раздел 3.7: трёхкратное измерение для верификации стойкого подъёма АД); при
# головной боли и пелене перед глазами — тоже (62_3, раздел 2.1: головные боли и расстройство зрения — симптомы АГ;
# без давления разумный врач принимал криз с головной болью и тошнотой за пиелонефрит)
routineFor: [sym.hives, sym.nosebleed, sym.palpitations, sym.syncope, sym.dizziness, sym.bp_surge, sym.headache, sym.vision_blurred]
checks:
  - { f: vital.fever, sens: 98, spec: 98 }
  - { f: vital.tachycardia, sens: 98, spec: 98 }
  # пульс 150 и чаще (часть 42б) — то же измерение: точность — из него
  - { f: vital.tachycardia_150, sens: 98, spec: 100 }
  # пульс реже 50 (часть 42в) — то же измерение: точность — из него
  - { f: vital.bradycardia, sens: 98, spec: 100 }
  # неритмичный пульс (часть 42а): пульс в покое — чтобы не пропустить фибрилляцию предсердий (382_2,
  # раздел 2.2); точность — игровая оценка
  - { f: sign.pulse_irregular, sens: 95, spec: 97 }
  - { f: vital.bp_high, sens: 95, spec: 95 }
  # низкое давление (часть 33б) — то же измерение: число одно, «есть» — если оно ниже 90; ошибается
  # вместе с тонометром — чувствительность из специфичности высокого
  - { f: vital.bp_low, sens: 95, spec: 100 }
  # давление 180/110 и выше (часть 43г) — то же измерение, точность — из него
  - { f: vital.bp_very_high, sens: 95, spec: 100 }
  # верхнее 100 и ниже (spec 2026-10-chapter-4, часть 48а: пункт qSOFA) — то же измерение, точность — из него
  - { f: vital.bp_100, sens: 95, spec: 100 }
  - { f: vital.tachypnea, sens: 95, spec: 97 }
  - { f: vital.spo2_low, sens: 95, spec: 97 }
  # холодная влажная кожа и слабый пульс (часть 43в): при поступлении с ОДСН оценивают вместе с давлением, пульсом и
  # дыханием (156_2, раздел 7.3.2); точность — игровая оценка. При 98 медсестра на сортировке видела её у каждого
  # 45-го пришедшего сам, и почти все такие «красные» были без неё (часть 43г: 33 из 34 в районной больнице за 30 дней)
  - { f: sign.cold_clammy, sens: 95, spec: 99.5 }
texts:
  hint:
    ru: "Быстрые измерения показывают, насколько пациенту плохо: высокая температура, частый пульс и дыхание, низкая сатурация. Давление меряют всем взрослым — гипертония часто ничем себя не выдаёт, а верхнее ниже 90 — признак шока."
  summary:
    ru: "Медсестра измеряет температуру, пульс — ритмичный ли он и хорошо ли наполнен, давление, частоту дыхания и сатурацию."
sources:
  - { kind: textbook, title: "Сестринское дело: измерение витальных показателей", note: "черновик: точность измерения — игровая оценка" }
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; рек. 6 (УУР С, УДД 5): мониторинг пульса, АД, ЧДД, без монитора — каждые 2–5 минут; критерий качества 4" }
  - { kind: guideline, title: "Носовое кровотечение", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/977_1", note: "ID 977_1, опубликованы 08.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2 (УУР С, УДД 5): АД всем — артериальная гипертензия и гиповолемия; критерий качества 4" }
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: при резком подъёме АД без осложнений — трёхкратное измерение в покое для верификации стойкого подъёма (в игре — одно измерение); давление 180/110 и выше — то же число, что 140/90 (часть 43г)" }
review: draft
