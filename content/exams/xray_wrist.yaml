id: exam.xray_wrist
name: { ru: "Рентгенография лучезапястного сустава" }
kind: imaging
room: room.xray
equipment: [eq.xray_analog, eq.xray_digital]
radiation: low
time: { procedure: 10, report: 20 }
cost: 900
discomfort: 1
# точность снимка в рекомендации не дана — игровая оценка
checks:
  - { f: img.xr_radius_fracture, sens: 95, spec: 98 }
  - { f: img.xr_radius_displaced, sens: 95, spec: 98 }
  - { f: img.xr_radius_unstable, sens: 90, spec: 95 }
  - { f: img.xr_ulnar_styloid, sens: 90, spec: 98 }
texts:
  hint:
    ru: "Снимок запястья в двух проекциях: есть ли перелом лучевой кости, смещён ли отломок и нет ли признаков нестабильности — от этого зависит, гипс, вправление или операция."
  summary:
    ru: "Снимки в прямой и боковой проекциях на одной плёнке; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Переломы дистального отдела костей предплечья", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/846_1", note: "ID 846_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: рентгенография лучезапястного сустава в двух проекциях — для диагноза, характера перелома и степени смещения; оценка по критериям нестабильности; критерий качества 2; чувствительность и специфичность снимка не даны — игровая оценка" }
review: draft
