id: exam.ask_lysis
name: { ru: "Расспрос перед тромболизисом" }
kind: ask
time: { procedure: 2 }
cost: 0
discomfort: 0
# кому — всем (часть 39а): подъём ST бывает и без давящей боли в груди, а при нём правило «Можно ли
# тромболизис» ждёт ответов; как о лекарствах, о противопоказаниях можно спросить каждого
# противопоказания к тромболизису (157_5, раздел 3.1.3), которые узнают расспросом; точность — игровая оценка
checks:
  - { f: hx.stroke_history, sens: 95, spec: 99 }
  - { f: hx.recent_bleed_surgery, sens: 95, spec: 99 }
  - { f: hx.bleeding_tendency, sens: 90, spec: 98 }
  - { f: hx.anticoagulants, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Перед тромболизисом спрашивают о том, что делает его опасным: инсульт, операция, травма или кровотечение за последний месяц, кровоточивость, антикоагулянты. Есть хоть одно — растворять тромб нельзя, больного везут на вмешательство без тромболизиса."
  summary:
    ru: "Инсульт в прошлом, операции, травмы и кровотечения за последний месяц, кровоточивость, антикоагулянты."
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.1.3: абсолютные и относительные противопоказания к ТЛТ; точность расспроса — игровая оценка" }
review: draft
