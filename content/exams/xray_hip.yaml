id: exam.xray_hip
name: { ru: "Рентгенография таза и тазобедренного сустава" }
kind: imaging
room: room.xray
equipment: [eq.xray_analog, eq.xray_digital]
radiation: low
time: { procedure: 10, report: 20 }
cost: 1100
discomfort: 1
# чувствительность снимка — 90–98 %, рентгенонегативных переломов шейки — 2–10 % (980_1, раздел 2.4):
# взята середина, 94; специфичность и точность для смещения не даны — игровая оценка
checks:
  - { f: img.xr_femoral_neck_fracture, sens: 94, spec: 98 }
  - { f: img.xr_femoral_neck_displaced, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Обзорный снимок таза и снимок сустава на стороне травмы: есть ли перелом шейки бедра и сместились ли отломки. Снимок пропускает часть переломов без смещения — при типичной картине и чистом снимке нужна КТ или МРТ."
  summary:
    ru: "Обзорный снимок таза и снимок тазобедренного сустава в прямой проекции — в первые 45 минут после поступления; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Переломы проксимального отдела бедренной кости", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/980_1", note: "ID 980_1, опубликованы 10.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: обзорная рентгенография таза и рентгенография тазобедренного сустава в прямой проекции в течение первых 45 минут; чувствительность 90–98 %, рентгенонегативных переломов шейки — 2–10 %, при несоответствии клиники и снимка — КТ или МРТ; критерий качества 1" }
review: draft
