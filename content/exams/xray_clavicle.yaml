id: exam.xray_clavicle
name: { ru: "Рентгенография ключицы" }
kind: imaging
room: room.xray
equipment: [eq.xray_analog, eq.xray_digital]
radiation: low
time: { procedure: 10, report: 20 }
cost: 900
discomfort: 1
# точность снимка в рекомендации не дана — игровая оценка
checks:
  - { f: img.xr_clavicle_fracture, sens: 95, spec: 98 }
  - { f: img.xr_clavicle_displaced, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Снимок ключицы и плечевого сустава: есть ли перелом и насколько разошлись отломки. Смещение больше ширины кости — показание к операции."
  summary:
    ru: "Снимок ключицы и плечевого сустава в переднезадней проекции, для укорочения — с наклоном луча 20°; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Переломы ключицы и лопатки", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/853_1", note: "ID 853_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: рентгенография ключицы и плечевого сустава в переднезадней проекции всем, с наклоном луча 20° — оценить укорочение; критерий качества 4; точность снимка не дана — игровая оценка" }
review: draft
