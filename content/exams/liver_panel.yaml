id: exam.liver_panel
name: { ru: "Печёночные пробы" }
kind: lab
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.procedure
# время и цена — игровые оценки; точность измерения — как у других анализов биохимии
time: { procedure: 5, turnaround: 60 }
cost: 600
discomfort: 1
# каждому с ТТГ ниже 0,1 (spec 2026-10-chapter-4, часть 56б): АСТ, АЛТ и билирубин перед антитиреоидной терапией — исключить
# повреждение печени (270_2, раздел 3.1.1, УУР С, УДД 3)
routineSeen: [lab.tsh_low]
checks:
  - { f: lab.bilirubin_high, sens: 98, spec: 98 }
  - { f: lab.alt_high, sens: 98, spec: 98 }
  - { f: lab.alp_high, sens: 98, spec: 98 }
  # билирубин выше 200 — тяжёлая форма гепатита (spec 2026-10-chapter-4, часть 52а; 718_2 и 672_2, приложение А3): то же число,
  # точность из него
  - { f: lab.bilirubin_200, sens: 98, spec: 100 }
  # АСТ выше АЛТ — признак алкогольного поражения печени (spec 2026-10-chapter-4, часть 54б; 711_2, раздел 2.3): из тех же
  # ферментов, точность — как у АЛТ
  - { f: lab.ast_over_alt, sens: 98, spec: 98 }
texts:
  hint:
    ru: "Билирубин, АЛТ, АСТ и щелочная фосфатаза. Повышены — страдает печень или затруднён отток желчи; при остром холецистите — у половины больных и больше. При гепатите билирубин выше 200 — тяжёлая форма, АСТ выше АЛТ — думают об алкоголе."
  summary:
    ru: "Кровь из вены; общий билирубин, АЛТ, АСТ, щелочная фосфатаза."
sources:
  - { kind: guideline, title: "Желчнокаменная болезнь", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/877_1", note: "ID 877_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.3: при подозрении на острый холецистит — АЛТ, АСТ, ЩФ, ГГТ, билирубин" }
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3 (УУР C, УДД 5): биохимия всем с подозрением — билирубин и фракции, АЛТ, АСТ, ГГТП, ЩФ; приложение А3: билирубин до 100 мкмоль/л — лёгкая форма, 100–200 — средняя, более 200 — тяжёлая; критерий качества А-2" }
  - { kind: guideline, title: "Алкогольная болезнь печени", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/711_2", note: "ID 711_2, опубликованы 30.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3 (УУР С, УДД 5): биохимия крови всем с АБП — билирубин, АЛТ, АСТ, щелочная фосфатаза, ГГТ и другие; как правило АСТ выше АЛТ; критерий качества 2" }
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 3.1.1 (УУР С, УДД 3): АСТ, АЛТ и общий билирубин перед началом антитиреоидной терапии — исключить повреждение печени" }
review: draft
