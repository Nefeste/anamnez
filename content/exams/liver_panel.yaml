id: exam.liver_panel
name: { ru: "Печёночные пробы" }
kind: lab
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.procedure
# время и цена — игровые оценки; точность измерения — как у других анализов биохимии
time: { procedure: 5, turnaround: 60 }
cost: 600
discomfort: 1
checks:
  - { f: lab.bilirubin_high, sens: 98, spec: 98 }
  - { f: lab.alt_high, sens: 98, spec: 98 }
  - { f: lab.alp_high, sens: 98, spec: 98 }
  # билирубин выше 200 — тяжёлая форма гепатита (spec 2026-10-chapter-4, часть 52а; 718_2 и 672_2, приложение А3): то же число,
  # точность из него
  - { f: lab.bilirubin_200, sens: 98, spec: 99 }
texts:
  hint:
    ru: "Билирубин, АЛТ и щелочная фосфатаза. Повышены — страдает печень или затруднён отток желчи; при остром холецистите бывают повышены у половины больных и больше. При гепатите билирубин выше 200 — тяжёлая форма."
  summary:
    ru: "Кровь из вены; общий билирубин, АЛТ, щелочная фосфатаза."
sources:
  - { kind: guideline, title: "Желчнокаменная болезнь", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/877_1", note: "ID 877_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.3: при подозрении на острый холецистит — АЛТ, АСТ, ЩФ, ГГТ, билирубин" }
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3 (УУР C, УДД 5): биохимия всем с подозрением — билирубин и фракции, АЛТ, АСТ, ГГТП, ЩФ; приложение А3: билирубин до 100 мкмоль/л — лёгкая форма, 100–200 — средняя, более 200 — тяжёлая; критерий качества А-2" }
review: draft
