id: exam.hp_stool
name: { ru: "Антиген H. pylori в кале" }
kind: lab
# тест на H. pylori (spec 2026-10-chapter-4, часть 53б): всем с язвенной болезнью (277_2, раздел 2.5, УУР B, УДД 2) и всем с
# подозрением на гастрит (708_2, раздел 2.5.1, УУР A, УДД 1) — 13С-уреазный дыхательный тест или антиген H. pylori в кале,
# при ЭГДС — быстрый уреазный тест (он — в записи ЭГДС). В игре — антиген иммунохроматографией на иммунохимическом
# анализаторе лаборатории: он есть в каждой больнице игры; кал собирают в процедурном. Чувствительность — 83 % при
# специфичности 90 % (277_2, раздел 2.5; 708_2, раздел 2.5.1). ИПН за 2 недели до теста в игре не отменяют. Время и ₽ —
# игровая оценка
room: room.lab
equipment: [eq.immuno_analyzer]
collect: room.procedure
complaints: [sym.epigastric_pain, sym.heartburn, sym.early_satiety]
time: { procedure: 3, turnaround: 30 }
cost: 700
discomfort: 0
checks:
  - { f: lab.h_pylori, sens: 83, spec: 90 }
texts:
  hint:
    ru: "Ищет белки H. pylori в кале. Делают при боли под ложечкой: нашли — нужна эрадикация. Отрицательный результат не исключает инфекцию наверняка: тест находит её у 8 из 10. Ингибиторы протонной помпы перед тестом отменяют за 2 недели."
  summary:
    ru: "Кал в контейнере, лаборатория: антиген Helicobacter pylori иммунохроматографией, результат через полчаса."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.5 (УУР B, УДД 2): всем с ЯБ — 13С-уреазный дыхательный тест или антиген H. pylori в кале, при ЭГДС — быстрый уреазный тест; по «Маастрихт-VI» чувствительность антигена в кале — 83 % (95 % ДИ 73–90) при фиксированной специфичности 90 %; время и цена — игровая оценка" }
  - { kind: guideline, title: "Гастрит и дуоденит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/708_2", note: "ID 708_2, опубликованы 10.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.5.1 (УУР A, УДД 1): всем с подозрением на гастрит — 13С-уреазный дыхательный тест и моноклональный антиген H. pylori в кале; чувствительность 94 и 83 % при специфичности 90 %; ИПН отменить за 2 недели, антибиотики и висмут — за 4 недели до теста" }
review: draft
