id: exam.us_leg_arteries
name: { ru: "УЗИ артерий ног" }
kind: imaging
room: room.ultrasound
equipment: [eq.us_basic, eq.us_expert]
radiation: none
# при боли в ноге (часть 33б): острая ишемия приходит с болью в ноге; длительность и цена — игровые
# оценки, врач УЗД описывает сразу
complaints: [sym.leg_pain]
time: { procedure: 20, report: 5 }
cost: 1500
discomfort: 1
checks:
  # дуплексное сканирование: 88 % и 96 % для стеноза больше 50 % или окклюзии — при хронической
  # болезни артерий (1006_1, прил. А3); при острой ишемии чисел нет — та же точность, игровая оценка
  - { f: img.us_artery_occluded, sens: 88, spec: 96 }
texts:
  hint:
    ru: "Датчиком через кожу, без облучения: видно, где артерия закрыта тромбом и есть ли кровоток ниже. Делают, если это не задерживает лечение: при острой ишемии ноги счёт идёт на часы."
  summary:
    ru: "Врач УЗД смотрит артерии обеих ног от паха до стопы с цветным кровотоком, указывает, где кровоток обрывается, и сразу описывает."
sources:
  - { kind: guideline, title: "Острая ишемия конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/1006_1", note: "ID 1006_1, опубликованы 29.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4 (УУР С, УДД 5): визуализация — если она не откладывает лечение, диагностический этап не дольше 2 часов; раздел 2.4.4 (УУР В, УДД 1): дуплексное УЗИ или МР-ангиография перед лечением — критерий качества 3; прил. А3: дуплексное сканирование — чувствительность 88 %, специфичность 96 % для стеноза больше 50 % или окклюзии при хронической болезни артерий; при острой ишемии — игровая оценка" }
review: draft
