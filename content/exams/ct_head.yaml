id: exam.ct_head
name: { ru: "КТ головного мозга" }
kind: imaging
room: room.ct
equipment: [eq.ct_16, eq.ct_64]
# облучение — среднее: доза КТ головы больше обзорного снимка; время — игровая оценка: укладка и
# срезы за несколько минут, описание рентгенологом (spec 2026-10-chapter-3, часть 40); цена — как
# тариф ОМС за КТ, игровая оценка
radiation: medium
time: { procedure: 10, report: 15 }
cost: 3000
discomfort: 0
checks:
  # кровь внутри черепа (часть 40): при сотрясении изменений на КТ не бывает по определению (734_2,
  # раздел 1.1); с частью 41в — внутримозговое и субарахноидальное кровоизлияние: свежую кровь КТ в
  # первые часы видит почти всегда — чувствительность 99, игровая оценка (в 523_3 чисел нет); ложной крови
  # КТ не покажет — специфичность 100
  - { f: img.ct_blood, sens: 99, spec: 100 }
  # где кровь и сколько её (часть 41в) — уточнение: только когда кровь видна (523_3, раздел 2.4: очаг, объём,
  # цистерны). Объём гематомы — одно число на два порога; ошибается КТ в объёме у 2 из 100, игровая оценка
  - { f: img.ct_hematoma, sens: 99, spec: 98, given: img.ct_blood }
  - { f: img.ct_hematoma_large, sens: 98, spec: 100 }
  - { f: img.ct_sah, sens: 98, spec: 99, given: img.ct_blood }
texts:
  hint:
    ru: "Томограф снимает голову слоями без контраста: свежая кровь на срезе светлее мозга. После удара по голове КТ ищет кровоизлияние внутри черепа; при подозрении на инсульт — кровь, при которой тромболизис нельзя: гематому в веществе мозга и её объём, кровь в бороздах и цистернах."
  summary:
    ru: "Срезы головы без контраста в «мозговом окне»; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 2.4 (УУР B, УДД 2): КТ или МРТ не позднее 40 минут от поступления — расположение и объём кровоизлияния; описать очаг, объём по формуле ABC/2, смещение срединных структур, желудочки и цистерны; точность — игровая оценка" }
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.1: сотрясение — без видимых изменений на КТ; раздел 1.3: смертность при лёгкой ЧМТ — практически исключительно от внутричерепных гематом; раздел 2.4 (УУР C, УДД 4): КТ головного мозга при факторах риска; критерий качества 3: КТ при факторах риска; приложение Б: что находит КТ — перелом, гематомы, ушиб, отёк мозга, САК, пневмоцефалия; без патологии и тревожных признаков — домой с инструкциями" }
review: draft
