id: exam.ct_head
name: { ru: "КТ головного мозга" }
kind: imaging
room: room.ct
equipment: [eq.ct_16, eq.ct_64]
# облучение — среднее: доза КТ головы больше обзорного снимка; время — игровая оценка: укладка и
# срезы за несколько минут, описание рентгенологом (spec 2026-10-chapter-3, часть 40); цена — как
# тариф ОМС за КТ, игровая оценка
radiation: medium
time: { procedure: 10, report: 15 }
cost: 3000
discomfort: 0
checks:
  # кровь внутри черепа (часть 40): у болезней базы её пока нет — при сотрясении изменений на КТ не
  # бывает по определению (734_2, раздел 1.1); чувствительность — игровая оценка до кровоизлияний
  # части 41в; ложной крови КТ не покажет — специфичность 100
  - { f: img.ct_blood, sens: 95, spec: 100 }
texts:
  hint:
    ru: "Томограф снимает голову слоями без контраста: свежая кровь на срезе светлее мозга. После удара по голове КТ ищет кровоизлияние внутри черепа — от него почти вся смертность при лёгкой травме; при сотрясении на КТ изменений нет. Облучение больше, чем у обычного снимка, поэтому КТ делают по показаниям — их решает правило."
  summary:
    ru: "Срезы головы без контраста в «мозговом окне»; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.1: сотрясение — без видимых изменений на КТ; раздел 1.3: смертность при лёгкой ЧМТ — практически исключительно от внутричерепных гематом; раздел 2.4 (УУР C, УДД 4): КТ головного мозга при факторах риска; критерий качества 3: КТ при факторах риска; приложение Б: что находит КТ — перелом, гематомы, ушиб, отёк мозга, САК, пневмоцефалия; без патологии и тревожных признаков — домой с инструкциями" }
review: draft
