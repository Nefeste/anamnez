id: exam.ciwa
name: { ru: "Шкала CIWA-Ar" }
kind: physical
# тяжесть синдрома отмены алкоголя (spec 2026-10-chapter-4, часть 54б): «у всех пациентов с диагнозом ААС с целью оценки
# степени тяжести… использовать шкалу CIWA-Ar» (784_1, раздел 2.1, УУР C, УДД 4); «проведение оценки по шкале занимает около
# 5 минут» (там же). Каждому, кто бросил пить после запоя: от тяжести — где лечить и нужен ли бензодиазепин. Пациент должен
# быть в контакте (приложение Г1) — в игре без комы
time: { procedure: 5 }
cost: 0
discomfort: 0
routineSeen: [hx.stopped_drinking]
checks:
  # число одно: точность — игровая оценка
  - { f: sign.ciwa, sens: 95, spec: 98 }
  - { f: sign.ciwa_16, sens: 98, spec: 100 }
texts:
  hint:
    ru: "Десять симптомов отмены алкоголя — тошнота, дрожь рук, пот, тревога, возбуждение, головная боль, обманы осязания, слуха и зрения, ориентировка — по баллам, до 67. До 8 — лёгкая отмена, лечат дома; 9–15 — средняя, 16 и больше — тяжёлая: в стационар, бензодиазепин."
  summary:
    ru: "Врач расспрашивает и наблюдает по десяти пунктам шкалы — около 5 минут."
sources:
  - { kind: guideline, title: "Психические и поведенческие расстройства, вызванные употреблением алкоголя. Синдром отмены алкоголя (алкогольное абстинентное состояние)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/784_1", note: "ID 784_1, опубликованы 20.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1 (УУР C, УДД 4): шкала CIWA-Ar у всех пациентов с синдромом отмены, 10 частых симптомов, около 5 минут; приложение Г1: применяется только при контакте с пациентом; точность — игровая оценка" }
review: draft
