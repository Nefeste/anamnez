id: exam.thyroid_palpation
name: { ru: "Осмотр и пальпация щитовидной железы" }
kind: physical
# увеличение щитовидной железы (spec 2026-10-chapter-4, часть 56б): при болезни Грейвса — диффузный зоб у 80 %, при узловом —
# пальпируются узлы (270_2, разделы 1.6 и 2.2; табл. 1 — степени по ВОЗ). Точность — игровая оценка
time: { procedure: 2 }
cost: 0
discomfort: 0
checks:
  - { f: sign.goiter, sens: 85, spec: 95 }
  # с частью 56в — и рубец после операции: осмотр передней поверхности шеи при подозрении на гипопаратиреоз (627_3, раздел 2.2, УУР С,
  # УДД 5); точность — игровая оценка
  - { f: sign.neck_scar, sens: 99, spec: 100 }
texts:
  hint:
    ru: "Врач смотрит на шею спереди и прощупывает щитовидную железу: увеличена ли, мягкая или с узлами. Зоб бывает при болезни Грейвса и узловом зобе, но много ли гормонов, покажут только ТТГ и свободный Т4. Виден и рубец после операции на шее."
  summary:
    ru: "Осмотр шеи и пальпация щитовидной железы."
sources:
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 1.6: при болезни Грейвса железа диффузно увеличена в 80 % случаев, при узловом зобе пальпируются очаговые образования; раздел 2.2: увеличение щитовидной железы; табл. 1: степени зоба по ВОЗ; точность — игровая оценка" }
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2.2 (УУР С, УДД 5): осмотр передней поверхности шеи — оценить факт операции на органах шеи; точность — игровая оценка" }
review: draft
