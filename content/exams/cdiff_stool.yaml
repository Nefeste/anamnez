id: exam.cdiff_stool
name: { ru: "Кал на C. difficile: антиген и токсины" }
kind: lab
# двухступенчатый алгоритм (spec 2026-10-chapter-4, часть 49б; 878_1, раздел 2.3, УУР C, УДД 5): первая ступень — ПЦР на
# ДНК C. difficile или глутаматдегидрогеназа, при положительной — токсины A и B иммунохроматографией или ИФА; в игре — на
# иммунохимическом анализаторе лаборатории, жидкий стул собирают в процедурном. Обследуют только тех, у кого понос (раздел
# 2.3: «не рекомендуется … пациентам без диареи»). Точность — игровая оценка в пределах таблиц 2–3, ₽ — игровое число
room: room.lab
equipment: [eq.immuno_analyzer]
collect: room.procedure
# с частью 55а — и при стуле с кровью: «пациентам с обострением ЯК выполнить исследование кала на токсины А и В Clostridioides
# difficile» (193_2, раздел 2.3, УУР С, УДД 4)
complaints: [sym.diarrhea, sym.bloody_diarrhea]
routineFor: [sym.bloody_diarrhea]
time: { procedure: 3, turnaround: 30 }
cost: 900
discomfort: 0
checks:
  - { f: lab.cdiff_gdh, sens: 95, spec: 97 }
  - { f: lab.cdiff_toxin, sens: 90, spec: 99 }
texts:
  hint:
    ru: "Тест на энтероколит, вызванный C. difficile, в два шага: сначала ищут сам микроб, при нём — его токсины. Делают только при поносе; не нашли микроб — болезни нет, нашли и токсины — есть."
  summary:
    ru: "Жидкий стул в контейнере, лаборатория: антиген (ГДГ) и токсины A и B, результат через полчаса."
sources:
  - { kind: guideline, title: "Энтероколит, вызванный Clostridioides difficile (C. difficile)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/878_1", note: "ID 878_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.3: обследуют только при впервые возникшей диарее (тип 6–7 по Бристольской шкале, 3 раза и больше в сутки) без другой очевидной причины; двухступенчатый алгоритм не менее чем двумя методами; таблицы 2–3: ИХА — 15–30 минут, ПЦР — 2–4 часа, чувствительность ИХА на токсины 29–79 %, специфичность 89–100 %; повторно в течение 7 дней не тестируют; точность в игре — игровая оценка" }
  - { kind: guideline, title: "Язвенный колит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/193_2", note: "ID 193_2, опубликованы 29.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3 (УУР С, УДД 4): при обострении язвенного колита — кал на токсины А и В C. difficile методами ИФА, иммунохемилюминесцентного анализа или ПЦР" }
review: draft
