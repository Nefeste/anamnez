  - { f: sym.constipation, sens: 88, spec: 95 }
  # с частью 44а: дрожь, пот, внезапный голод — гипогликемия; спутанность называют родные. Точность — игровая оценка
  - { f: sym.tremor, sens: 90, spec: 97 }
  - { f: sym.sweating, sens: 85, spec: 95 }
  - { f: sym.hunger, sens: 85, spec: 96 }
  - { f: sym.confusion, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Общие вопросы о силах, весе, жажде и мочеиспускании, переносимости холода, о дрожи, поте и голоде. Такие жалобы сами не называют, а за ними бывают анемия, диабет и гипогликемия, болезни щитовидной железы."
  summary:
    ru: "Слабость и утомляемость, изменения веса, жажда, как переносит холод, кружится ли голова, бывают ли сердцебиение и перебои, были ли обмороки; дрожь, пот, внезапный голод, не путается ли в мыслях — у самого больного и у родных."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: расспрос больного", note: "точность расспроса — игровая оценка, не из литературы" }
review: draft
