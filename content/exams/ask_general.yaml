id: exam.ask_general
name: { ru: "Расспрос: самочувствие, вес, жажда" }
kind: ask
time: { procedure: 2 }
cost: 0
discomfort: 0
checks:
  - { f: sym.fatigue, sens: 90, spec: 92 }
  - { f: sym.dizziness, sens: 88, spec: 94 }
  # сердцебиение и перебои (часть 42а) — точность игровая; обморок (часть 42б) — тоже
  - { f: sym.palpitations, sens: 92, spec: 98 }
  - { f: sym.syncope, sens: 95, spec: 99 }
  - { f: sym.high_bp_readings, sens: 92, spec: 98 }
  - { f: sym.thirst, sens: 92, spec: 96 }
  - { f: sym.polyuria, sens: 88, spec: 95 }
  - { f: sym.weight_gain, sens: 88, spec: 95 }
  - { f: sym.weight_loss, sens: 90, spec: 97 }
  - { f: sym.cold_intolerance, sens: 80, spec: 94 }
  - { f: sym.constipation, sens: 88, spec: 95 }
  # запоры месяцами (spec 2026-10-chapter-4, часть 55б): стул реже трёх раз в неделю, твёрдый (274_3, раздел 2); точность —
  # игровая оценка
  - { f: sym.constipation_long, sens: 92, spec: 99 }
  # с частью 44а: дрожь, пот, внезапный голод — гипогликемия; спутанность называют родные. Точность — игровая оценка
  - { f: sym.tremor, sens: 90, spec: 97 }
  - { f: sym.sweating, sens: 85, spec: 95 }
  - { f: sym.hunger, sens: 85, spec: 96 }
  - { f: sym.confusion, sens: 95, spec: 99 }
  # сыпь на коже (spec 2026-10-chapter-4, часть 50а): выяснить у каждого с подозрением на менингококковую инфекцию (1020_1,
  # раздел 2.1); точность — игровая оценка
  - { f: sym.rash_spots, sens: 90, spec: 99 }
  # странное поведение со слов родных (spec 2026-10-chapter-4, часть 50б; 492_2, разделы 1.6 и 2.2) — точность игровая
  - { f: sym.strange_behavior, sens: 90, spec: 98 }
  # голова не держится и руки не поднимаются (часть 51б; 567_2, раздел 1.6: полиомиелитическая форма) — точность игровая
  - { f: sym.neck_weakness, sens: 95, spec: 99 }
  # сонливость днём, бессонница ночью, путает дни — начало печёночной энцефалопатии (spec 2026-10-chapter-4, часть 54а;
  # 715_2, разделы 1.5 и 2.1); точность — игровая оценка
  - { f: sym.daytime_sleepiness, sens: 88, spec: 96 }
  # тревога, бессонница и обманы восприятия — синдром отмены алкоголя (spec 2026-10-chapter-4, часть 54б; 784_1, раздел 2);
  # точность — игровая оценка
  - { f: sym.anxiety, sens: 90, spec: 95 }
  - { f: sym.insomnia, sens: 90, spec: 96 }
  - { f: sym.hallucinations, sens: 90, spec: 99 }
  # жарко и потеет, ест больше обычного — тиреотоксикоз (spec 2026-10-chapter-4, часть 56б; 270_2, разделы 1.6 и 2.1); точность —
  # игровая оценка
  - { f: sym.heat_intolerance, sens: 85, spec: 95 }
  - { f: sym.appetite_high, sens: 85, spec: 95 }
  # онемение вокруг рта и в пальцах, судороги кистей — гипокальциемия (spec 2026-10-chapter-4, часть 56в; 627_3, раздел 2.1:
  # самая частая жалоба при гипопаратиреозе); точность — игровая оценка
  - { f: sym.perioral_paresthesia, sens: 90, spec: 99 }
  - { f: sym.hand_spasm, sens: 92, spec: 99 }
texts:
  hint:
    ru: "Общие вопросы о силах, весе, жажде и мочеиспускании, переносимости холода, о дрожи, поте и голоде. Такие жалобы сами не называют, а за ними бывают анемия, диабет и гипогликемия, болезни щитовидной железы."
  summary:
    ru: "Слабость и утомляемость, изменения веса и аппетита, жажда, как переносит холод и жару, кружится ли голова, бывают ли сердцебиение и перебои, были ли обмороки; дрожь, пот, внезапный голод, не путается ли в мыслях, не спит ли днём и не путает ли дни, нет ли тревоги и бессонницы, не видит ли то, чего нет, не немеет ли вокруг рта, не сводит ли кисти, — у самого больного и у родных."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: расспрос больного", note: "точность расспроса — игровая оценка, не из литературы" }
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1: при декомпенсации — бессонница ночью и сонливость днём, заторможенность; раздел 1.5, табл. 2: вторая стадия ПЭ — дезориентация во времени; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 1.6: похудание при повышенном аппетите, горячая влажная кожа; раздел 2.1: жалобы на потливость, сердцебиение, дрожь, потерю веса; точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2.1: самая частая жалоба при гипопаратиреозе — судороги и/или парестезии в мышцах конечностей и околоротовой области; точность расспроса — игровая оценка" }
review: draft
