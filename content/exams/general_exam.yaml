id: exam.general_exam
name: { ru: "Общий осмотр" }
kind: physical
time: { procedure: 3 }
cost: 0
discomfort: 0
# степень обезвоживания по В. И. Покровскому — всем с кишечной инфекцией при обращении (875_1, раздел 2.1, УУР C, УДД 5;
# критерий качества 2; spec 2026-10-chapter-4, часть 49а): при поносе осмотр — каждому. Рвоты одной мало: она бывает при
# сотрясении и эпилептическом статусе, и осмотр не должен оттеснять глюкометр и осмотр раны
# С частью 50а — и каждому, кто заметил сыпь: при лихорадке кожу осматривают сразу — геморрагическая сыпь (1020_1, раздел 2.1)
# С частью 51а — и с присасыванием клеща и растущим пятном: клещ в коже и мигрирующая эритема видны на осмотре (566_2, раздел 2.2)
routineFor: [sym.diarrhea, sym.rash_spots, sym.tick_bite, sym.rash_ring]
checks:
  - { f: sign.dehydration, sens: 80, spec: 92 }
  - { f: sign.obesity, sens: 95, spec: 97 }
  - { f: sign.pallor, sens: 70, spec: 90 }
  - { f: sign.dry_skin, sens: 65, spec: 88 }
  - { f: sign.jaundice, sens: 85, spec: 97 }
  # отёк губ, век, языка (часть 33б) — виден сразу: игровая оценка
  - { f: sign.angioedema, sens: 95, spec: 99 }
  # отёки обеих ног и холодная влажная кожа (часть 43в; 156_2, раздел 7.3.1) — точность игровая
  - { f: sign.leg_edema_bilateral, sens: 90, spec: 95 }
  - { f: sign.cold_clammy, sens: 85, spec: 98 }
  # степень обезвоживания (spec 2026-10-chapter-4, часть 49а): слизистые и голос (875_1, разделы 2.1–2.2, приложение А3.1) —
  # точность игровая
  - { f: sign.dry_mucosa, sens: 75, spec: 90 }
  - { f: sign.hoarse_voice, sens: 85, spec: 97 }
  # геморрагическая сыпь (spec 2026-10-chapter-4, часть 50а; 1020_1, разделы 1.6 и 2.2): мелкую на ногах и ягодицах можно
  # не заметить, крупную сливающуюся — нет; точность — игровая оценка
  - { f: sign.petechial_rash, sens: 90, spec: 99 }
  - { f: sign.rash_spreading, sens: 98, spec: 100 }
  # пузырьки простого герпеса на губах (spec 2026-10-chapter-4, часть 50б; 492_2, раздел 2.2: осмотр кожи и слизистых) —
  # точность игровая
  - { f: sign.herpes_labialis, sens: 92, spec: 99 }
  # присосавшийся клещ и мигрирующая эритема (spec 2026-10-chapter-4, часть 51а; 566_2, раздел 2.2: осмотр кожи — мигрирующая и
  # вторичные эритемы) — точность игровая
  - { f: sign.tick_attached, sens: 95, spec: 100 }
  - { f: sign.erythema_migrans, sens: 92, spec: 99 }
  # красное лицо и шея, инъекция склер (spec 2026-10-chapter-4, часть 52б; 347_2, разделы 1.6 и 2.2: осмотр кожи и слизистых) —
  # точность игровая
  - { f: sign.face_flushing, sens: 92, spec: 97 }
  - { f: sign.scleral_injection, sens: 90, spec: 97 }
  # сосудистые звёздочки и пальмарная эритема у больного циррозом (spec 2026-10-chapter-4, часть 54а; 715_2, раздел 2.2:
  # осмотр кожных покровов) — точность игровая
  - { f: sign.spider_angiomas, sens: 85, spec: 97 }
  - { f: sign.palmar_erythema, sens: 75, spec: 95 }
  # сладковатый запах изо рта при тяжёлой печёночной недостаточности (715_2, раздел 2.2) — точность игровая
  - { f: sign.fetor_hepaticus, sens: 70, spec: 98 }
  # потемнение кожи в складках и на слизистых (spec 2026-10-chapter-4, часть 56а): выражено по-разному и бывает незаметно (524_3,
  # раздел 1.6) — точность игровая
  - { f: sign.hyperpigmentation, sens: 75, spec: 98 }
  # блеск глаз, ретракция и отставание век, экзофтальм (spec 2026-10-chapter-4, часть 56б; 270_2, разделы 1.6 и 2.2) — точность
  # игровая
  - { f: sign.exophthalmos, sens: 85, spec: 98 }
  # поперечный рубец на шее после операции на щитовидной железе (spec 2026-10-chapter-4, часть 56в; 627_3, раздел 2.2) — его можно
  # не заметить под воротником, но не увидеть того, чего нет: точность игровая
  - { f: sign.neck_scar, sens: 90, spec: 100 }
  # синюшные губы и лицо, следы уколов по ходу вен (spec 2026-10-chapter-4, часть 57а; 743_2, раздел 2.2) — точность игровая
  - { f: sign.cyanosis, sens: 85, spec: 98 }
  - { f: sign.injection_marks, sens: 85, spec: 99 }
texts:
  hint:
    ru: "Кожа, слизистые, питание, отёки: видно обезвоживание, бледность, желтуху, ожирение, сухость кожи, отёк губ и век, отёки обеих ног, холодную влажную кожу, геморрагическую сыпь, красное лицо и глаза, сосудистые звёздочки и красные ладони. Многое заметно ещё до расспроса."
  summary:
    ru: "Сознание, кожа и слизистые, тургор, голос, питание (рост, вес, индекс массы тела), отёки."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: общий осмотр", note: "черновик: точность — игровая оценка" }
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1–2.2: крапивница, зуд, ангиоотёк; частот и точности нет — игровая оценка" }
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; разделы 1.6 и 2.2: геморрагическая сыпь на дистальных отделах конечностей и ягодицах, при тяжёлом течении — крупная, с некрозами, на лице и туловище; точность — игровая оценка" }
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: выраженная гиперемия лица, шеи, верхней половины туловища, инъекция сосудов склер и конъюнктив, петехии; раздел 2.2 (УУР C, УДД 5): общий осмотр кожи и слизистых; точность — игровая оценка" }
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.2: при осмотре кожи — желтушность, сосудистые звёздочки в области плечевого пояса и декольте, пальмарная эритема; сладковатый запах изо рта при тяжёлой печёночной недостаточности; точность — игровая оценка" }
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 1.6: глазные симптомы тиреотоксикоза, эндокринная офтальмопатия у 40–50 % больных болезнью Грейвса; раздел 2.2: экзофтальм, ретракция век; точность — игровая оценка" }
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2.2 (УУР С, УДД 5): осмотр передней поверхности шеи — оценить факт операции на органах шеи; точность — игровая оценка" }
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 2.2: при нарушении дыхания — цианоз губ, лица, акроцианоз; следы инъекций по ходу подкожных вен определяются далеко не всегда; точность — игровая оценка" }
review: draft
