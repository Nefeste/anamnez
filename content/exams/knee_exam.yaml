id: exam.knee_exam
name: { ru: "Осмотр коленного сустава" }
kind: physical
time: { procedure: 5 }
cost: 0
discomfort: 1
complaints: [sym.knee_pain]
# осматривают каждого с травмой колена, первым: по осмотру оттавские правила решают, нужен ли
# снимок (832_2, раздел 2.4; 691_2, раздел 2.2)
routineFor: [sym.knee_pain]
# точность осмотра в рекомендациях не дана — игровая оценка
checks:
  - { f: sign.knee_swelling, sens: 90, spec: 90 }
  - { f: sign.knee_effusion, sens: 80, spec: 92 }
  - { f: sign.patella_tenderness, sens: 95, spec: 92 }
  - { f: sign.fibular_head_tenderness, sens: 90, spec: 95 }
  - { f: sign.knee_flexion_limited, sens: 95, spec: 95 }
  - { f: sign.no_weight_bearing, sens: 95, spec: 95 }
  - { f: sign.no_active_extension, sens: 90, spec: 97 }
  - { f: sign.patella_gap, sens: 70, spec: 99 }
texts:
  hint:
    ru: "Отёк и выпот, где больно — надколенник или головка малоберцовой кости, сгибается ли колено до прямого угла, разгибает ли человек его сам и может ли пройти четыре шага. По этим признакам оттавские правила решают, нужен ли снимок."
  summary:
    ru: "Походка, осмотр обоих коленей, баллотирование надколенника, пальпация надколенника, суставной щели и головки малоберцовой кости, сгибание и активное разгибание, проба пройти четыре шага, пульс на стопе и чувствительность."
sources:
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: походка, оба сустава, выпот и сглаженность контуров, кожа, болезненность суставной щели, неполное разгибание, положение надколенника" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4 (УУР B, УДД 3): оттавские критерии — возраст 55 лет и старше, изолированная болезненность надколенника, болезненность головки малоберцовой кости, сгибание меньше 90°, не может опереться сразу после травмы и пройти 4 шага" }
  - { kind: guideline, title: "Переломы надколенника", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/970_1", note: "ID 970_1, опубликованы 25.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: боль и отёк спереди колена, баллотирование надколенника, пальпируемое западение, невозможность активного разгибания" }
review: draft
