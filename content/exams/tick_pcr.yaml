id: exam.tick_pcr
name: { ru: "Исследование клеща: ПЦР" }
kind: lab
# клеща, снятого с человека, исследуют методом ПЦР на вирус клещевого энцефалита и боррелии (spec 2026-10-chapter-4, часть 51а;
# 567_2, раздел 5.1 и приложение В; 566_2, раздел 5.1): по результату решают о профилактике. В игре клещ есть у каждого с
# присасыванием — сняли здесь или принёс в баночке; принимают его в процедурном, ПЦР — на биохимическом анализаторе
# лаборатории, как ПЦР ликвора. Время, точность и ₽ — игровая оценка
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.procedure
complaints: [sym.tick_bite]
time: { procedure: 2, turnaround: 60 }
cost: 1200
discomfort: 0
checks:
  - { f: lab.tick_tbe, sens: 95, spec: 99 }
  - { f: lab.tick_borrelia, sens: 95, spec: 98 }
texts:
  hint:
    ru: "Снятого клеща исследуют методом ПЦР: есть ли в нём вирус клещевого энцефалита и боррелии — возбудители болезни Лайма. От ответа зависит, нужен ли иммуноглобулин и антибиотик для профилактики."
  summary:
    ru: "Клещ в баночке, лаборатория: ПЦР на РНК вируса клещевого энцефалита и ДНК боррелий, результат через час."
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 5.1: иммуноглобулин — при присасывании вирусофорных клещей; приложение В: клеща — в лабораторию, в том числе на РНК вируса; сроков исследования в тексте нет" }
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 5.1: выявление боррелий в присосавшемся клеще методом ПЦР или темнопольной микроскопии — показание к экстренной профилактике" }
review: draft
