id: exam.ask_family
name: { ru: "Болезни у родственников" }
kind: ask
time: { procedure: 1 }
cost: 0
discomfort: 0
checks:
  - { f: hx.family_cad, sens: 90, spec: 98 }
  # рак кишки у родителей, братьев и сестёр (spec 2026-10-chapter-4, часть 55б): при запоре — к колоноскопии (274_3, раздел
  # 2.1); точность — игровая оценка
  - { f: hx.family_crc, sens: 90, spec: 99 }
texts:
  hint:
    ru: "Ранний инфаркт или инсульт у родителей, братьев и сестёр повышает риск ишемической болезни сердца — это учитывают при боли в груди и высоком давлении. Рак кишки у близких — повод к колоноскопии при запоре."
  summary:
    ru: "Инфаркты, инсульты, диабет, гипертония и рак кишки у близких родственников и в каком возрасте."
sources:
  - { kind: guideline, title: "2021 ESC Guidelines on cardiovascular disease prevention in clinical practice. Eur Heart J 2021;42(34):3227–3337", note: "точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1: наследственная отягощённость по колоректальному раку — повод к колоноскопии; точность расспроса — игровая оценка" }
review: draft
