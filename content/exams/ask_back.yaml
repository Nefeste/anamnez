id: exam.ask_back
name: { ru: "Расспрос: боль в спине" }
kind: ask
time: { procedure: 2 }
cost: 0
discomfort: 0
checks:
  - { f: sym.back_pain, sens: 95, spec: 97 }
  - { f: sym.pain_movement, sens: 85, spec: 92 }
  - { f: sym.sciatica, sens: 88, spec: 95 }
  - { f: sym.flank_pain, sens: 90, spec: 96 }
  # радикулопатия и синдром конского хвоста (spec 2026-10-chapter-4, часть 58б): боль сильнее при кашле, онемение и
  # покалывание, подъём тяжести (777_1, раздел 1.6); задержка мочи, онемение промежности и слабость ног — «красные флажки»,
  # о которых спрашивают отдельно (раздел 2.2, табл. 2; приложение В); точность — игровая оценка
  - { f: sym.pain_cough, sens: 88, spec: 95 }
  - { f: sym.leg_tingling, sens: 88, spec: 95 }
  - { f: hx.heavy_lifting, sens: 90, spec: 97 }
  - { f: sym.urinary_retention, sens: 92, spec: 99 }
  - { f: sym.saddle_numbness, sens: 88, spec: 99 }
  - { f: sym.legs_weak, sens: 90, spec: 98 }
texts:
  hint:
    ru: "Где болит, отдаёт ли в ногу, меняется ли от движений. Механическая боль — мышцы и суставы; стреляет ниже колена и сильнее при кашле — корешок; задержка мочи и онемение промежности — конский хвост; постоянная боль в боку с температурой — почка."
  summary:
    ru: "Место и характер боли, связь с движением и кашлем, отдаёт ли в ногу, немеет ли она, была ли травма или подъём тяжести; нет ли задержки мочи, онемения промежности и слабости в ногах."
sources:
  - { kind: guideline, title: "Low back pain and sciatica in over 16s: assessment and management. NICE guideline NG59", org: "NICE", year: 2016, note: "черновик: точность расспроса — игровая оценка" }
  - { kind: guideline, title: "Дискогенная пояснично-крестцовая радикулопатия", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/777_1", note: "ID 777_1, опубликованы 07.12.2023, применяются; сверено с рубрикатором 12.10.2026; раздел 1.6: боль сильнее при кашле, чихании, наклоне, легче лёжа, часто после подъёма тяжести, с парестезиями; раздел 2.1, Р1: опросник «красных флажков» — критерий качества 1; раздел 2.2, табл. 2 и приложение В: тазовые расстройства, онемение промежности, слабость ног — синдром конского хвоста; точность — игровая оценка" }
review: draft
