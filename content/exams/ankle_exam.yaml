id: exam.ankle_exam
name: { ru: "Осмотр голеностопного сустава" }
kind: physical
time: { procedure: 4 }
cost: 0
discomfort: 1
checks:
  - { f: sign.ankle_swelling, sens: 90, spec: 90 }
  - { f: sign.ankle_deformity, sens: 85, spec: 98 }
  - { f: sign.malleolus_tenderness, sens: 95, spec: 85 }
  - { f: sign.no_weight_bearing, sens: 95, spec: 95 }
  - { f: sign.lateral_ligament_tenderness, sens: 85, spec: 85 }
  - { f: sign.medial_ankle_swelling, sens: 80, spec: 90 }
texts:
  hint:
    ru: "Отёк, деформация, где именно больно — кость у лодыжки или связки под ней, может ли человек пройти четыре шага. По этим признакам оттавские правила решают, нужен ли снимок."
  summary:
    ru: "Осмотр сустава, пальпация лодыжек и дистальных 6 см берцовых костей, связок под наружной лодыжкой, проба пройти четыре шага, пульс на стопе и чувствительность."
sources:
  - { kind: guideline, title: "Переломы лодыжек", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/855_1", note: "ID 855_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: отёк, деформация при смещении, вывихе и подвывихе; раздел 2.2: отёк и гематома у внутренней лодыжки при переломе наружной — подозрение на разрыв дельтовидной связки; оценка иннервации и кровообращения; точность осмотра — игровая оценка" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: болезненность книзу и кпереди от наружной лодыжки — признак повреждения наружных связок; раздел 2.4: оттавские правила — пальпация кости на протяжении 6 см, проба пройти 4 шага" }
review: draft
