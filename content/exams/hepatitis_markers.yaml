id: exam.hepatitis_markers
name: { ru: "Маркёры вирусных гепатитов (ИФА)" }
kind: lab
# анти-HAV IgM, HBsAg и анти-HBc IgM (spec 2026-10-chapter-4, часть 52а): при подозрении на острый гепатит — всем, в том числе
# для различия гепатитов и микст-инфекции (718_2, раздел 2.3, УУР C, УДД 4; 672_2, раздел 2.3.2; критерий качества 4 у
# гепатита A). Кровь из вены в процедурном, иммунохимический анализатор лаборатории; точность и ₽ — игровая оценка: в
# рекомендациях чисел нет
room: room.lab
equipment: [eq.immuno_analyzer]
collect: room.procedure
time: { procedure: 3, turnaround: 60 }
cost: 1200
discomfort: 1
checks:
  - { f: lab.hav_igm, sens: 95, spec: 99 }
  - { f: lab.hbv_markers, sens: 95, spec: 99 }
texts:
  hint:
    ru: "ИФА на маркёры вирусных гепатитов: антитела IgM к вирусу гепатита A, HBsAg и антитела IgM к ядру вируса гепатита B. Различает гепатиты при желтухе: по виду больного A от B не отличить."
  summary:
    ru: "Кровь из вены, ИФА: анти-HAV IgM, HBsAg, анти-HBc IgM."
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3: анти-HAV IgM методом ИФА — при любом варианте течения для этиологического подтверждения (УУР C, УДД 4); HBsAg, анти-HCV, анти-HEV IgM — всем с подозрением на острый гепатит для дифференциальной диагностики и выявления микст-инфекции (УУР C, УДД 4); критерий качества 4; чувствительности и специфичности в тексте нет — игровая оценка" }
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3.2: HBsAg, анти-HBc IgM и IgG, HBeAg, ДНК вируса гепатита B, анти-HCV и анти-HAV IgM; анти-HBc IgM — самый достоверный специфический маркёр острого гепатита B" }
review: draft
