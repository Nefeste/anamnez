id: exam.chest_exam
name: { ru: "Осмотр грудной клетки" }
kind: physical
time: { procedure: 3 }
cost: 0
discomfort: 1
# точность осмотра в рекомендации не дана — игровая оценка
checks:
  - { f: sign.chest_wall_tenderness, sens: 95, spec: 85 }
  - { f: sign.rib_crepitus, sens: 70, spec: 98 }
  - { f: sign.interrupted_inspiration, sens: 85, spec: 90 }
  - { f: sign.rib_compression_pain, sens: 80, spec: 85 }
  - { f: sign.subcutaneous_emphysema, sens: 85, spec: 99 }
  - { f: sign.neck_veins_distended, sens: 80, spec: 97 }
  - { f: sign.paradoxical_breathing, sens: 80, spec: 99 }
texts:
  hint:
    ru: "Осмотр и осторожная пальпация грудной клетки: где болит, хрустят ли отломки, обрывается ли глубокий вдох, больно ли при сдавлении, нет ли воздуха под кожей, набухших шейных вен и западающего при вдохе участка стенки. Перелом подтверждает снимок."
  summary:
    ru: "Осмотр грудной клетки и шеи, пальпация по рёбрам, сдавление спереди назад и с боков, проба с глубоким вдохом."
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: всем при осмотре — пальпация грудной клетки (УУР C, УДД 5), при осмотре — набухание шейных вен, эмфизема мягких тканей, парадоксальные дыхательные движения; раздел 1.6: болезненность в месте перелома, крепитация и «ступенька», симптом прерванного вдоха (не возникает при ушибе), симптом осевых нагрузок; точность осмотра не дана — игровая оценка" }
review: draft
