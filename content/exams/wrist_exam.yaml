id: exam.wrist_exam
name: { ru: "Осмотр запястья и кисти" }
kind: physical
time: { procedure: 3 }
cost: 0
discomfort: 1
checks:
  - { f: sign.wrist_swelling, sens: 90, spec: 90 }
  - { f: sign.wrist_deformity, sens: 85, spec: 97 }
  - { f: sign.wrist_axial_pain, sens: 85, spec: 90 }
texts:
  hint:
    ru: "Отёк и деформация над запястьем, боль при нагрузке по оси предплечья. Штыкообразная деформация — довод за перелом со смещением; окончательно перелом подтверждает снимок."
  summary:
    ru: "Осмотр и пальпация запястья, осторожная нагрузка по оси предплечья, пульс на лучевой артерии и чувствительность пальцев."
sources:
  - { kind: guideline, title: "Переломы дистального отдела костей предплечья", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/846_1", note: "ID 846_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: отёк нижней трети предплечья и кисти, болезненность при пальпации и осевой нагрузке, при смещении — угловая или штыкообразная деформация; раздел 2.2: оценка иннервации и кровообращения; точность осмотра — игровая оценка" }
review: draft
