id: exam.tetany_signs
name: { ru: "Симптомы Труссо и Хвостека" }
kind: physical
# при подозрении на гипопаратиреоз — каждому (spec 2026-10-chapter-4, часть 56в): «рекомендуется оценка симптомов Хвостека и
# Труссо» (627_3, раздел 2.2, УУР С, УДД 5); подозрение — парестезии лица и конечностей, подёргивания и судороги мышц (раздел 2.1,
# комментарий). Манжета — 1–3 минуты, точность — по разделу 2.2
routineFor: [sym.perioral_paresthesia, sym.hand_spasm]
time: { procedure: 3 }
cost: 0
discomfort: 1
checks:
  - { f: sign.trousseau, sens: 94, spec: 99 }
  - { f: sign.chvostek, sens: 70, spec: 90 }
texts:
  hint:
    ru: "Две пробы на скрытую тетанию. Труссо: манжета тонометра на плече 1–3 минуты — при нехватке кальция кисть сводит. Хвостек: постукивание по щеке перед ухом — дёргается угол рта. Труссо точнее: он положителен у 94 из 100 больных с низким кальцием."
  summary:
    ru: "Манжета тонометра на плече на 1–3 минуты; постукивание молоточком перед ухом."
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2.2 (УУР С, УДД 5): оценка симптомов Хвостека и Труссо при подозрении на гипопаратиреоз; Труссо — у 94 % пациентов с гипокальциемией и у 1 % с нормокальциемией, Хвостек отрицателен у 30 % больных и положителен у 10 % людей без гипокальциемии; раздел 2.1: что позволяет заподозрить гипокальциемию" }
review: draft
