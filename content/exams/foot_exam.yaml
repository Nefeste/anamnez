id: exam.foot_exam
name: { ru: "Осмотр стопы" }
kind: physical
time: { procedure: 3 }
cost: 0
discomfort: 1
checks:
  - { f: sign.foot_swelling, sens: 90, spec: 90 }
  - { f: sign.mt5_tenderness, sens: 95, spec: 85 }
  - { f: sign.navicular_tenderness, sens: 95, spec: 85 }
  - { f: sign.no_weight_bearing, sens: 95, spec: 95 }
texts:
  hint:
    ru: "Отёк стопы и где именно больно — основание пятой плюсневой, ладьевидная кость, — может ли человек пройти четыре шага. По этим признакам оттавские правила решают, нужен ли снимок стопы."
  summary:
    ru: "Осмотр стопы, пальпация основания пятой плюсневой и ладьевидной кости, проба пройти четыре шага, пульс на стопе и чувствительность."
sources:
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: физикальный осмотр, оценка кожи и нейротрофического статуса; раздел 2.4: оттавские правила — болезненность основания 5 плюсневой и ладьевидной кости, неспособность пройти 4 шага; точность осмотра — игровая оценка" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: оттавские правила — пальпация основания V плюсневой и ладьевидной кости, проба пройти 4 шага" }
review: draft
