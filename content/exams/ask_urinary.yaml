texts:
  hint:
    ru: "Жжение и частые позывы — довод за цистит; боль в пояснице с температурой — за пиелонефрит; внезапная боль в пояснице волнами, отдающая в пах, — за почечную колику."
  summary:
    ru: "Боль и жжение при мочеиспускании, частота, кровь в моче, боль над лобком и в пояснице, отдаёт ли она в пах."
