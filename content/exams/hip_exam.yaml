id: exam.hip_exam
name: { ru: "Осмотр тазобедренного сустава" }
kind: physical
time: { procedure: 3 }
cost: 0
discomfort: 1
checks:
  - { f: sign.leg_shortened_rotated, sens: 90, spec: 97 }
  - { f: sign.straight_leg_raise, sens: 90, spec: 90 }
  - { f: sign.hip_tenderness, sens: 90, spec: 85 }
  - { f: sign.no_weight_bearing, sens: 95, spec: 95 }
texts:
  hint:
    ru: "Лёжа на спине: одинаковы ли ноги по длине, не развёрнута ли стопа наружу, может ли человек поднять выпрямленную ногу, больно ли в паху; встать и пройти несколько шагов. Окончательно перелом шейки бедра подтверждает снимок."
  summary:
    ru: "Осмотр лёжа, сравнение длины ног и положения стоп, подъём выпрямленной ноги, пальпация паховой области и большого вертела, проба опоры, пульс и чувствительность на стопе."
sources:
  - { kind: guideline, title: "Переломы проксимального отдела бедренной кости", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/980_1", note: "ID 980_1, опубликованы 10.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: боль в паху и верхней трети бедра, болезненная пальпация, не может поднять выпрямленную ногу, укорочение, приведение и наружная ротация; раздел 2.2: осмотр в первый час; точность осмотра — игровая оценка" }
review: draft
