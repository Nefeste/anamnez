id: exam.hantavirus_elisa
name: { ru: "Антитела к хантавирусам (ИФА)" }
kind: lab
# IgM и IgG к хантавирусам (spec 2026-10-chapter-4, часть 52б): обязательно при госпитализации лихорадящего с поражением почек и
# геморрагическим синдромом (347_2, раздел 2.3.2, УУР C, УДД 4; критерий качества 7). Кровь из вены в процедурном, иммунохимический
# анализатор лаборатории. Сколько больных с антителами, решает запись болезни (IgM — с 6-го дня); точность анализа — по
# информативности 96–98 %, ₽ — игровая оценка
room: room.lab
equipment: [eq.immuno_analyzer]
collect: room.procedure
time: { procedure: 3, turnaround: 60 }
cost: 900
discomfort: 1
checks:
  - { f: lab.hantavirus_igm, sens: 96, spec: 99 }
texts:
  hint:
    ru: "ИФА на антитела к хантавирусам: подтверждает геморрагическую лихорадку с почечным синдромом. IgM появляются с 6-го дня болезни — в первые дни анализ бывает отрицательным, тогда его повторяют через 4–7 дней."
  summary:
    ru: "Кровь из вены, ИФА: антитела IgM и IgG к хантавирусам."
sources:
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3.2 (УУР C, УДД 4): IgM и IgG к хантавирусам — для подтверждения, обязательно при госпитализации с острым лихорадочным заболеванием, поражением почек и геморрагическим синдромом; РНИФ и ИФА информативны в 96–98 %; IgM — с 6-го по 56-й день; парные сыворотки — через 4–7 дней; критерий качества 7; специфичность и ₽ — игровая оценка" }
review: draft
