id: exam.crp
name: { ru: "С-реактивный белок" }
kind: lab
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.procedure
time: { procedure: 5, turnaround: 60 }
cost: 400
discomfort: 1
# при боли, которая легче сидя с наклоном вперёд (spec 2026-10-chapter-3, часть 43д): маркеры воспаления — всем с
# подозрением на острый перикардит (746_2, раздел 2.3, ЕОК IC)
routineFor: [sym.pericardial_pain]
# и каждому, у кого боль в животе связана со стулом (spec 2026-10-chapter-4, часть 55б): «всем пациентам с подозрением на
# диагноз СРК» (892_1, раздел 2.3, УУР B, УДД 3)
routineSeen: [sym.pain_with_stool]
checks:
  - { f: lab.crp_high, sens: 98, spec: 98 }
texts:
  hint:
    ru: "Показывает, насколько сильное воспаление. Очень высокий уровень — довод за бактериальную инфекцию, например пневмонию."
  summary:
    ru: "Кровь из вены; белок острой фазы воспаления."
sources:
  - { kind: guideline, title: "Внебольничная пневмония у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/654_2", note: "ID 654_2, опубликованы 23.12.2024, применяются; сверено с рубрикатором 28.09.2026; черновик: пороги СРБ сверить" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3 (УУР B, УДД 3): С-реактивный белок, общий анализ крови и биохимия всем с подозрением на СРК" }
review: draft
