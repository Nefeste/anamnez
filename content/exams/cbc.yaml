id: exam.cbc
name: { ru: "Общий анализ крови" }
kind: lab
room: room.lab
equipment: [eq.hematology_analyzer]
collect: room.procedure
time: { procedure: 5, turnaround: 40 }
cost: 350
discomfort: 1
# каждому с невропатией лицевого нерва (spec 2026-10-chapter-3, часть 44б): развёрнутый ОАК «всем пациентам с НЛН»
# (895_1, раздел 2.3, УУР B; критерий качества)
# и каждому с ТТГ ниже 0,1 (spec 2026-10-chapter-4, часть 56б): развёрнутый ОАК «перед началом антитиреоидной терапии для
# исключения наличия лейкопении» (270_2, раздел 3.1.1, УУР С, УДД 3; критерий качества 5)
routineSeen: [sign.facial_palsy_peripheral, sym.pain_with_stool, lab.tsh_low]
# каждому с запором месяцами (часть 55б): «с целью исключения анемии, как следствия скрытой кровопотери» (274_3, раздел 2.3,
# УУР С, УДД 5); и каждому, у кого боль в животе связана со стулом, — «всем пациентам с подозрением на диагноз СРК» (892_1,
# раздел 2.3, УУР B, УДД 3)
routineFor: [sym.constipation_long]
checks:
  - { f: lab.wbc_high, sens: 98, spec: 98 }
  - { f: lab.hb_low, sens: 98, spec: 98 }
  - { f: lab.mcv_low, sens: 97, spec: 97 }
  # тромбоциты (spec 2026-10-chapter-4, часть 50а): при шоке их расходует свёртывание (1020_1, раздел 2.3), меньше 100 —
  # пункцию не делают (приложение А3.3); точность — игровая оценка
  - { f: lab.platelets_low, sens: 98, spec: 98 }
texts:
  hint:
    ru: "Лейкоциты повышаются при воспалении, особенно бактериальном; гемоглобин снижен при анемии, а мелкие эритроциты говорят о нехватке железа; тромбоцитов меньше при шоке и кровоточивости. Анализ дешёвый, но при пневмонии бывает и нормальным."
  summary:
    ru: "Кровь из пальца или вены; гемоглобин, эритроциты и их объём, лейкоциты и формула, тромбоциты."
sources:
  - { kind: textbook, title: "Клиническая лабораторная диагностика: референсные значения ОАК", note: "черновик" }
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 2.3 (УУР B, УДД 2): общий (клинический) анализ крови развёрнутый всем пациентам с НЛН; критерий качества" }
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 2.3: развёрнутый общий анализ крови всем с подозрением на ГФМИ (критерий качества 2), при ИТШ — лейкопения и тромбоцитопения; приложение А3.3: тромбоциты менее 100 × 10⁹/л — противопоказание к спинномозговой пункции; точность — игровая оценка" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3 (УУР B, УДД 3): общий анализ крови, СРБ и биохимия всем с подозрением на СРК — исключить органические заболевания (снижение гемоглобина, лейкоцитоз)" }
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3 (УУР С, УДД 5): общий анализ крови при запоре — исключить анемию от скрытой кровопотери" }
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 3.1.1 (УУР С, УДД 3): развёрнутый общий анализ крови перед началом антитиреоидной терапии — исключить лейкопению; раздел 2.5: общий анализ крови лицам с диагностированным тиреотоксикозом; критерий качества 5" }
review: draft
