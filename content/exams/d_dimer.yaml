id: exam.d_dimer
name: { ru: "D-димер" }
kind: lab
room: room.lab
equipment: [eq.biochem_analyzer, eq.immuno_analyzer]
collect: room.procedure
# цена и срок — игровые оценки
time: { procedure: 5, turnaround: 60 }
cost: 900
discomfort: 1
# сам анализ точен; повышен ли он без тромба — в записях болезней (Stein 2004)
checks:
  - { f: lab.d_dimer_high, sens: 98, spec: 98 }
texts:
  hint:
    ru: "Кровь из вены на D-димер — осколок распавшегося тромба. При низкой вероятности тромбоза по шкале Уэллса нормальный D-димер тромбоз исключает, и УЗИ не нужно; повышенный — повод для УЗИ. При тромбофлебите и беременности не делают."
  summary:
    ru: "Кровь из вены; D-димер выше 500 нг/мл — повышен."
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.3 (УДД 1, УУР В): при низкой вероятности ТГВ по шкале Уэллса — D-димер как альтернатива УЗИ для исключения ТГВ; критерий качества 3; раздел 3.8.1: у беременных D-димер не использовать" }
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.3 (УДД 5, УУР С): лабораторные тесты при тромбофлебите, в том числе D-димер, не рекомендуются" }
review: draft
