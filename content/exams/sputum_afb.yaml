id: exam.sputum_afb
name: { ru: "Мокрота на кислотоустойчивые микобактерии" }
kind: lab
# микроскопия мазка мокроты (окраска по Цилю — Нильсену) — в общей лечебной сети, «не менее двух образцов» (КР
# «Туберкулез у взрослых», 16_4, раздел 2.3, УУР B, УДД 1); приказ № 932н, пункт 9: при подозрении на туберкулёз органов дыхания —
# мокрота на КУМ методом микроскопии трёхкратно. В игре — одна проба за приём, результат в ту же смену: пробы
# следующих дней — у фтизиатра. Мазок смотрят под микроскопом на месте гематологии лаборатории, где смотрят и мазки
# крови, — в игре это место гематологического анализатора, отдельного микроскопа нет. Сроки и ₽ — игровая оценка;
# точность чтения найденного — игровая: сколько больных выделяет микобактерии, задаёт сама болезнь
room: room.lab
equipment: [eq.hematology_analyzer]
collect: room.procedure
time: { procedure: 5, turnaround: 60 }
cost: 600
discomfort: 0
checks:
  - { f: lab.afb_sputum, sens: 95, spec: 99.5 }
texts:
  hint:
    ru: "Мазок мокроты под микроскопом: есть ли кислотоустойчивые микобактерии. Нашли — человек заразен. Не нашли — туберкулёз не исключён: так находят не больше половины больных."
  summary:
    ru: "Мокроту откашливают в баночку; мазок окрашивают и смотрят под микроскопом."
sources:
  - { kind: guideline, title: "Туберкулез у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/16_4", note: "ID 16_4, опубликованы 16.01.2026, применяются; сверено с рубрикатором 20.11.2026 по карточке, которую прислал владелец (вопрос 78), текст — по копии документа; раздел 2.3 (УУР B, УДД 1): микроскопия мокроты — не менее двух образцов, находит не больше 50 % впервые выявленных, рекомендуется в общей лечебной сети" }
  - { kind: guideline, title: "Об утверждении Порядка оказания медицинской помощи больным туберкулезом (приказ № 932н)", org: "Минздрав России", year: 2012, note: "приказ от 15.11.2012 № 932н, зарегистрирован в Минюсте России 07.03.2013 № 27557; пункт 9: при подозрении на туберкулёз органов дыхания — рентген груди, общий анализ крови, мокрота на кислотоустойчивые микобактерии методом микроскопии трёхкратно; сверено 20.11.2026" }
review: draft
