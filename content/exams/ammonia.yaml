id: exam.ammonia
name: { ru: "Аммиак крови" }
kind: lab
# венозная кровь на аммиак (spec 2026-10-chapter-4, часть 54а): «при диагностически неясной энцефалопатии» — с целью
# дифференциального диагноза изменённого сознания (715_2, раздел 2.5, УУР C, УДД 5). Пробу везут в лабораторию сразу,
# на холоде, — берут в процедурном, как кровь на лактат. Время и ₽ — игровые числа
room: room.lab
equipment: [eq.biochem_analyzer]
collect: room.procedure
time: { procedure: 5, turnaround: 40 }
cost: 700
discomfort: 1
checks:
  # анализатор меряет точно; повышен ли аммиак — правда больного, игровая оценка
  - { f: lab.ammonia_high, sens: 95, spec: 97 }
texts:
  hint:
    ru: "Аммиак в крови: при циррозе он копится и отравляет мозг. Высокий — довод за печёночную энцефалопатию, нормальный при спутанности — повод искать другую причину: инсульт, инфекцию, гипогликемию."
  summary:
    ru: "Кровь из вены — сразу в лабораторию, на холоде. Результат — через 40 минут."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.5 (УУР C, УДД 5): пациентам с ЦП и диагностически неясной энцефалопатией — приём невролога и исследование уровня аммиака в крови для дифференциального диагноза изменённого сознания; точность, время и цена — игровая оценка" }
review: draft
