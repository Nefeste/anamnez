id: exam.hand_function
name: { ru: "Движения пальцев и чувствительность" }
kind: physical
time: { procedure: 2 }
cost: 0
discomfort: 1
complaints: [sym.hand_wound]
# при каждой ране кисти — перерезанное сухожилие рана скрывает (Griffin 2012)
routineFor: [sym.hand_wound]
checks:
  - { f: sign.finger_flexion_loss, sens: 90, spec: 98 }
texts:
  hint:
    ru: "Попросить согнуть и разогнуть каждый палец по отдельности, проверить чувствительность кончиков пальцев. Так находят перерезанное сухожилие или нерв, которые рана скрывает."
  summary:
    ru: "Активное сгибание и разгибание каждого пальца в отдельности, чувствительность кончиков пальцев, их цвет и кровоснабжение."
sources:
  - { kind: review, title: "Griffin M, Hindocha S, Jordan D, Saleh M, Khan W. An overview of the management of flexor tendon injuries. Open Orthop J 2012;6:28–35", url: "https://pubmed.ncbi.nlm.nih.gov/22431948/", note: "PMID 22431948, PMC3293389, сверено 29.09.2026: поверхностный и глубокий сгибатели проверяют по отдельности, остальные пальцы держат разогнутыми; повреждение нерва оценивают обязательно; точность проверки — игровая оценка" }
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2: дифференциальный диагноз — раны с функционально значимым повреждением нервов, сосудов, сухожилий; как это проверить, рекомендация не пишет" }
review: draft
