id: exam.us_abdomen
name: { ru: "УЗИ брюшной полости" }
kind: imaging
room: room.ultrasound
equipment: [eq.us_basic, eq.us_expert]
radiation: none
# длительность и цена — игровые оценки; врач УЗД описывает сразу
time: { procedure: 20, report: 5 }
cost: 1300
discomfort: 0
checks:
  - { f: img.us_appendicitis, sens: 76, spec: 95 }
texts:
  hint:
    ru: "Датчиком через кожу живота — без облучения. При подозрении на аппендицит ищут утолщённый несжимаемый отросток; если его не видно, аппендицит этим не исключён."
  summary:
    ru: "Врач УЗД смотрит правую подвздошную область с дозированным надавливанием датчиком и сразу описывает."
sources:
  - { kind: guideline, title: "Di Saverio S et al. Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines. World J Emerg Surg 2020;15:27", url: "https://pubmed.ncbi.nlm.nih.gov/32295644/", note: "PMC7386163, сверено 28.09.2026: чувствительность УЗИ при аппендиците — 76 %, специфичность — 95 % (у КТ — 99 % и 84 %); УЗИ с дозированной компрессией — первое исследование; отросток не виден у 34,1–71 % больных с подтверждённым аппендицитом" }
  - { kind: guideline, title: "Острый аппендицит у взрослых", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/325_2", note: "ID 325_2, опубликованы 24.11.2023, применяются; сверено с рубрикатором 28.09.2026; раздел 2.4: УЗИ — при средней вероятности аппендицита по шкалам" }
review: draft
