id: exam.heart_auscultation
name: { ru: "Аускультация сердца" }
# физикальное обследование всем при подозрении на перикардит (746_2, раздел 2.2, ЕОК IC): шум трения, приглушённые
# тоны (spec 2026-10-chapter-3, часть 43д). Точность — игровая оценка
kind: physical
time: { procedure: 2 }
cost: 0
discomfort: 0
routineFor: [sym.pericardial_pain]
checks:
  - { f: sign.pericardial_rub, sens: 85, spec: 99 }
  - { f: sign.heart_sounds_muffled, sens: 80, spec: 97 }
texts:
  hint:
    ru: "Фонендоскопом слушают тоны сердца в точках над клапанами и вдоль грудины. При перикардите бывает скребущий шум трения; глухие тоны — признак выпота вокруг сердца."
  summary:
    ru: "Врач слушает сердце над верхушкой, вдоль левого края грудины и в основании, сидя с наклоном вперёд и лёжа."
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.2: физикальное обследование всем при подозрении на перикардит (ЕОК IC): шум трения перикарда, приглушённые или глухие тоны; приложение Б: аускультация — шум трения, равномерное ослабление тонов; точность — игровая оценка" }
review: draft
