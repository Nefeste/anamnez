id: exam.ask_witnesses
name: { ru: "Расспрос: где и как нашли" }
kind: ask
# без сознания больной ничего не скажет (spec 2026-10-chapter-4, часть 57а): расспрашивают тех, кто вызвал скорую, — где нашли, что было
# рядом, что принимал; у отравленного опиоидами это удаётся «далеко не всегда» (743_2, раздел 2.1). Только тем, кого нашли без сознания;
# точность — игровая оценка
complaints: [sym.found_unconscious]
routineFor: [sym.found_unconscious]
time: { procedure: 2 }
cost: 0
discomfort: 0
checks:
  - { f: sym.found_unconscious, sens: 100, spec: 100 }
  - { f: hx.drug_use, sens: 80, spec: 99 }
texts:
  hint:
    ru: "Без сознания больной ничего не расскажет — спрашивают тех, кто его нашёл или вызвал скорую: где и как нашли, что было рядом — шприцы, бутылки, упаковки таблеток, — что принимал и пил, когда его видели в последний раз."
  summary:
    ru: "Где и как нашли, что было рядом, что принимал — у тех, кто вызвал скорую."
sources:
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 2.1: жалоб больной не предъявляет, помощь вызывают родственники или знакомые; токсикологический анамнез — вид вещества, время и путь приёма — удаётся выяснить далеко не всегда; точность — игровая оценка" }
review: draft
