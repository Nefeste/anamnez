id: exam.troponin_hs
name: { ru: "Тропонин высокочувствительный: 0 и 1 час" }
kind: lab
room: room.lab
equipment: [eq.immuno_analyzer]
# кровь берут у постели в смотровой приёмного (spec 2026-10-chapter-3, часть 39в): догоспитально маркеры
# некроза не определяют — в амбулатории анализа нет (154_4, раздел 6.1; 155_2, раздел 6)
collect: room.emergency
# результат — в течение 60 минут после взятия крови (154_4, раздел 2.3, ЕОК IB); цена — игровое число
time: { procedure: 5, turnaround: 60 }
cost: 1200
discomfort: 1
# при боли, которая легче сидя с наклоном вперёд (spec 2026-10-chapter-3, часть 43д): маркеры повреждения миокарда —
# всем с подозрением на острый перикардит (746_2, раздел 2.3, ЕОК IC): миоперикардит
routineFor: [sym.pericardial_pain]
# сам анализ точен; повышен ли тропонин — в записях болезней. Пороги — тест-системы на тропонин T из
# таблицы алгоритма 0/1 час (приложение А3)
checks:
  - { f: lab.troponin_high, sens: 99, spec: 99 }
  - { f: lab.troponin_rise, sens: 99, spec: 99 }
# повторный забор через час — алгоритм 0/1 час (раздел 2.3, ЕОК IB): прирост — по нему
repeat:
  minutes: 60
  checks: [lab.troponin_rise]
  name: { ru: "Тропонин через час" }
texts:
  hint:
    ru: "Кровь на высокочувствительный тропонин сейчас и через час — алгоритм 0/1 час: он подтверждает или исключает инфаркт без подъёма ST. Результат — через час после каждого забора. При подъёме ST тропонин не ждут: тромболизис и перевод решает ЭКГ."
  summary:
    ru: "Кровь из вены у постели в смотровой приёмного — сейчас и через час. Тропонин T 52 нг/л и выше в первом анализе или прирост за час 5 нг/л и больше — острый некроз миокарда подтверждён; первый ниже 12 и прирост меньше 3 — исключён. Тропонин поднимается через 1–6 часов после начала ишемии, поэтому одного анализа мало."
sources:
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 04.10.2026; раздел 2.3 (ЕОК IB): тропонин T или I высокочувствительным методом с результатом в течение 60 минут после взятия крови; алгоритмы 0/1, 0/2 или 0/3 часа; повышение до диагностических уровней — через 1–6 часов после ишемии; приложение А3: алгоритм 0/1 час — пороги для тропонина T: исключён при первом ниже 12 и приросте меньше 3 (ниже 5 — если от начала боли больше 3 часов), подтверждён при первом 52 и выше или приросте 5 и больше, иначе повтор через 3 часа — «серой зоны» в игре нет; раздел 6.1: догоспитально маркеры не определяют" }
review: draft
