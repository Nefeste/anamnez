id: exam.paracentesis
name: { ru: "Диагностический парацентез" }
kind: lab
# прокол брюшной стенки тонкой иглой у постели (spec 2026-10-chapter-4, часть 54а): «пациентам с ЦП и впервые развившимся
# асцитом» и «с подозрением на инфицирование асцитической жидкости» (715_2, раздел 2.3, УУР B, УДД 2) — в смотровой
# приёмного; жидкость — в лабораторию: нейтрофилы считают в камере или анализатором, посев — потом. В амбулатории не
# делают. ₽ — игровое число
room: room.lab
equipment: [eq.hematology_analyzer]
collect: room.emergency
time: { procedure: 15, turnaround: 60 }
cost: 2500
discomfort: 2
checks:
  # жидкость или есть, или нет: при асците её набирают почти всегда — игровая оценка
  - { f: lab.ascitic_fluid, sens: 99, spec: 100 }
  # нейтрофилы считают в полученной жидкости; сам подсчёт точен — игровая оценка
  - { f: lab.ascites_pmn_250, sens: 97, spec: 98, given: lab.ascitic_fluid }
texts:
  hint:
    ru: "Тонкой иглой через брюшную стенку набирают немного жидкости из живота и считают в ней нейтрофилы: больше 250 в 1 мм³ — инфекция, спонтанный бактериальный перитонит. Делают каждому с впервые появившимся асцитом и при подозрении на инфекцию: она бывает почти без жалоб."
  summary:
    ru: "Под местной анестезией — прокол тонкой иглой сбоку внизу живота; жидкость — в лабораторию: нейтрофилы и посев. Результат — через час."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3 (УУР B, УДД 2): диагностический парацентез при впервые возникшем асците и при подозрении на инфицирование асцитической жидкости, при кровотечении, шоке, лихорадке, ухудшении функции печени и почек, печёночной энцефалопатии; ранний, в первые 12 ч, — ниже госпитальная смертность (ОР 0,69); нейтрофилы более 250 клеток/мм³ — критерий СБП; раздел 3.2.1: процедура безопасна, риск местных осложнений очень низкий даже при МНО больше 1,5 и тромбоцитах меньше 30 тыс.; критерий качества 4; точность и цена — игровая оценка" }
review: draft
