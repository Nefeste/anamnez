texts:
  hint:
    ru: "Проверяет, воспалена ли брюшина: при аппендиците и других «острых животах» боль резко усиливается, когда врач отпускает руку. Положительный — повод вызвать скорую."
  summary:
    ru: "Симптом Щёткина–Блюмберга, кашлевой толчок, поколачивание по передней брюшной стенке."
sources:
  - { kind: paper, title: "Wagner JM, McKinney WP, Carpenter JL. Does this patient have appendicitis? JAMA 1996;276(19):1589–1594", note: "черновик: точность — игровая оценка" }
