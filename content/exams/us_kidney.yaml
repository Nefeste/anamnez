id: exam.us_kidney
name: { ru: "УЗИ почек и мочевых путей" }
kind: imaging
room: room.ultrasound
equipment: [eq.us_basic, eq.us_expert]
radiation: none
# длительность и цена — игровые оценки; врач УЗД описывает сразу
time: { procedure: 15, report: 5 }
cost: 1000
discomfort: 0
checks:
  # расширение лоханки: чувствительность 92,7 % у обученных врачей, отношение правдоподобия 4,97 —
  # специфичность из него около 81 % (Herbst 2014, КТ — эталон)
  - { f: img.us_hydronephrosis, sens: 93, spec: 81 }
  # сам камень мочеточника УЗИ находит у 45 % при специфичности 94 % (587_2, раздел 2.4): ниже
  # порога точности игры (50 %) — отдельного признака нет, о нём говорит подсказка
texts:
  hint:
    ru: "Датчиком через кожу поясницы и живота — без облучения. Видно, расширена ли лоханка почки, иногда — сам камень. Камень мочеточника УЗИ находит меньше чем у половины больных; при колике у беременной — исследование первой линии."
  summary:
    ru: "Врач УЗД смотрит обе почки, лоханки и чашечки, мочеточники и мочевой пузырь и сразу описывает."
sources:
  - { kind: guideline, title: "Почечная колика", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/587_2", note: "ID 587_2, опубликованы 09.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: метод выбора — КТ без контраста; без КТ — УЗИ вместе с обзорной урографией; как единственный метод УЗИ не рекомендуется: камень мочеточника — чувствительность 45 %, специфичность 94 %, камень почки — 45 и 88 %; расширение полостной системы — только у 89,1 % с камнем мочеточника по КТ; у беременных УЗИ — первая линия" }
  - { kind: paper, title: "Herbst MK, Rosenberg G, Daniels B, Gross CP, Singh D, Molinaro AM, Luty S, Moore CL. Effect of provider experience on clinician-performed ultrasonography for hydronephrosis in patients with suspected renal colic. Ann Emerg Med 2014;64(3):269–276", url: "https://pubmed.ncbi.nlm.nih.gov/24630203/", note: "PMID 24630203, сверено 29.09.2026: 670 УЗИ у постели, эталон — КТ; у всех врачей чувствительность 72,6 %, специфичность 73,3 %; у врачей с подготовкой по УЗИ — чувствительность 92,7 %, отношение правдоподобия положительного результата 4,97" }
review: draft
