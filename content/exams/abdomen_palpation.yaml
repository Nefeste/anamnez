id: exam.abdomen_palpation
name: { ru: "Пальпация живота" }
kind: physical
time: { procedure: 3 }
cost: 0
discomfort: 1
# каждому с запором месяцами (spec 2026-10-chapter-4, часть 55б): «пальпации живота и пальцевого ректального исследования» —
# исключить опухоль (274_3, раздел 2.2, УУР С, УДД 5); с частью 58б — и каждому, кто не может помочиться: переполненный пузырь над
# лобком
routineFor: [sym.constipation_long, sym.urinary_retention]
checks:
  - { f: sign.rlq_tenderness, sens: 85, spec: 90 }
  - { f: sign.epigastric_tenderness, sens: 75, spec: 88 }
  - { f: sign.suprapubic_tenderness, sens: 70, spec: 92 }
  - { f: sign.ruq_tenderness, sens: 85, spec: 90 }
  - { f: sign.murphy, sens: 85, spec: 95 }
  - { f: sign.board_abdomen, sens: 90, spec: 96 }
  - { f: sign.llq_tenderness, sens: 85, spec: 90 }
  - { f: sign.llq_mass, sens: 80, spec: 97 }
  # увеличенная печень при гепатитах (spec 2026-10-chapter-4, часть 52а; 718_2, раздел 2.2: пальпация с размерами печени и
  # селезёнки, УУР C, УДД 5): точность — игровая оценка
  - { f: sign.hepatomegaly, sens: 85, spec: 95 }
  # селезёнка и асцит у больного циррозом (spec 2026-10-chapter-4, часть 54а; 715_2, раздел 2.2): притупление
  # перкуторного звука во фланках — диагностическая точность 57,1 %, флюктуация — 20 %; небольшой асцит виден только на УЗИ
  # (раздел 1.5). Чувствительность и специфичность — игровая оценка
  - { f: sign.splenomegaly, sens: 55, spec: 95 }
  - { f: sign.ascites, sens: 65, spec: 90 }
  # напряжённый асцит — третья степень (715_2, раздел 1.5): живот натянут куполом — его видят, когда видят асцит; точность —
  # игровая оценка
  - { f: sign.ascites_tense, sens: 90, spec: 97, given: sign.ascites }
  # переполненный мочевой пузырь при задержке мочи (spec 2026-10-chapter-4, часть 58б): точность — игровая оценка
  - { f: sign.bladder_distended, sens: 90, spec: 98 }
texts:
  hint:
    ru: "Где болит при надавливании: над лобком — мочевой пузырь, под ложечкой — желудок, справа под рёбрами — желчный пузырь, справа внизу — аппендикс, слева внизу — сигмовидная кишка. Заодно — край печени и селезёнки, а перкуссией — тупой звук во фланках при асците."
  summary:
    ru: "Поверхностная и глубокая пальпация живота по областям."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: пальпация живота", note: "черновик: точность — игровая оценка" }
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.2 (УУР C, УДД 5): пальпация живота с определением размеров и консистенции печени и селезёнки для диагностики гепатолиенального синдрома; точность — игровая оценка" }
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.2: плотная увеличенная селезёнка; притупление перкуторного звука во фланках при асците — точность 57,1 %, флюктуация — 20 %; чувствительность и специфичность — игровая оценка" }
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.2 (УУР С, УДД 5): при запоре — пальпация живота и пальцевое ректальное исследование, чтобы исключить опухоли брюшной полости" }
review: draft
