id: exam.abdomen_palpation
name: { ru: "Пальпация живота" }
kind: physical
time: { procedure: 3 }
cost: 0
discomfort: 1
checks:
  - { f: sign.rlq_tenderness, sens: 85, spec: 90 }
  - { f: sign.epigastric_tenderness, sens: 75, spec: 88 }
  - { f: sign.suprapubic_tenderness, sens: 70, spec: 92 }
  - { f: sign.ruq_tenderness, sens: 85, spec: 90 }
  - { f: sign.murphy, sens: 85, spec: 95 }
  - { f: sign.board_abdomen, sens: 90, spec: 96 }
  - { f: sign.llq_tenderness, sens: 85, spec: 90 }
  - { f: sign.llq_mass, sens: 80, spec: 97 }
  # увеличенная печень при гепатитах (spec 2026-10-chapter-4, часть 52а; 718_2, раздел 2.2: пальпация с размерами печени и
  # селезёнки, УУР C, УДД 5): точность — игровая оценка
  - { f: sign.hepatomegaly, sens: 85, spec: 95 }
texts:
  hint:
    ru: "Где болит при надавливании: над лобком — мочевой пузырь, под ложечкой — желудок, справа под рёбрами — желчный пузырь, справа внизу — аппендикс, слева внизу — сигмовидная кишка. Заодно — край печени: увеличена при гепатите."
  summary:
    ru: "Поверхностная и глубокая пальпация живота по областям."
sources:
  - { kind: textbook, title: "Пропедевтика внутренних болезней: пальпация живота", note: "черновик: точность — игровая оценка" }
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.2 (УУР C, УДД 5): пальпация живота с определением размеров и консистенции печени и селезёнки для диагностики гепатолиенального синдрома; точность — игровая оценка" }
review: draft
