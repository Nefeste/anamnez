id: exam.urine_dipstick
name: { ru: "Тест-полоска мочи" }
kind: rapid
time: { procedure: 2, turnaround: 3 }
cost: 100
# при давлении 180/110 и выше — каждому (spec 2026-10-chapter-3, часть 43г): анализ мочи — в рутинном обследовании всех
# с гипертоническим кризом (62_3, раздел 3.7)
routineSeen: [vital.bp_very_high]
discomfort: 0
checks:
  - { f: lab.urine_leuk, sens: 85, spec: 88 }
  - { f: lab.urine_nitrite, sens: 90, spec: 98 }
  - { f: lab.urine_blood, sens: 90, spec: 85 }
  - { f: lab.urine_glucose, sens: 90, spec: 98 }
  # кетоны в моче — «анализ любой порции мочи на кетоновые тела» при подозрении на ДКА и ГГС (часть 73; Алгоритмы, 2023, с.
  # 45, 48); точность — игровая оценка
  - { f: lab.urine_ketones, sens: 90, spec: 97 }
  # белок (spec 2026-10-chapter-4, часть 52б) — поле полоски; точность относительно анализа мочи — игровая оценка
  - { f: lab.urine_protein, sens: 85, spec: 92 }
texts:
  hint:
    ru: "За пару минут показывает лейкоциты, нитриты, кровь и белок в моче. Нитриты — сильный довод за инфекцию; отрицательная полоска при типичных жалобах цистит не исключает."
  summary:
    ru: "Полоска в свежей порции мочи, цвет полей сравнивают со шкалой."
sources:
  - { kind: paper, title: "Devillé WL et al. The urine dipstick test useful to rule out infections. A meta-analysis of the accuracy. BMC Urol 2004;4:4", note: "черновик: точность относительно анализа мочи — игровая оценка" }
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом. 11-й выпуск", org: "Под ред. И.И. Дедова, М.В. Шестаковой, А.Ю. Майорова", year: 2023, url: "https://doi.org/10.14341/DM13042", note: "Сахарный диабет. 2023;26(2S):1–157, сверено 15.10.2026; раздел 8.1, с. 45: на догоспитальном этапе или в приёмном — экспресс-анализ гликемии и анализ любой порции мочи на кетоновые тела; раздел 8.2, с. 48: так же при ГГС; точность — игровая оценка" }
review: draft
