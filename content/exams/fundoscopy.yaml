id: exam.fundoscopy
name: { ru: "Осмотр глазного дна" }
kind: physical
time: { procedure: 5 }
cost: 0
discomfort: 1
# при давлении 180/110 и выше — каждому (spec 2026-10-chapter-3, часть 43г): офтальмоскопия — в рутинном обследовании
# всех с гипертоническим кризом, ищут поражение органов-мишеней (62_3, раздел 3.7); и при пелене перед глазами
# С частью 57в — и при падении зрения, и каждому, кто пил метанол: «Рекомендуется всем пациентам с острым отравлением метанолом приём
# (осмотр, консультация) врачом-офтальмологом первичный с целью диагностики нарушений зрения» (873_1, раздел 2.5, УУР С, УДД 5);
# офтальмолога в игре нет — глазное дно смотрит врач
routineFor: [sym.vision_blurred, sym.vision_loss, sym.methanol_drink]
routineSeen: [vital.bp_very_high]
checks:
  # точность — игровая оценка: прямая офтальмоскопия врачом без расширения зрачка пропускает часть изменений
  - { f: sign.retinopathy_acute, sens: 85, spec: 98 }
  # отравление метанолом (spec 2026-10-chapter-4, часть 57в): гиперемия и размытость границ дисков зрительных нервов (873_1, раздел
  # 1.5.1) — точность та же, игровая оценка
  - { f: sign.optic_disc_blurred, sens: 85, spec: 98 }
texts:
  hint:
    ru: "Врач смотрит в глаз офтальмоскопом. Кровоизлияния и отёк диска зрительного нерва при очень высоком давлении — признак злокачественной гипертензии: это криз, его лечат в стационаре. Красный диск с размытыми границами после спиртного — отравление метанолом."
  summary:
    ru: "Прямая офтальмоскопия: сосуды сетчатки, кровоизлияния, экссудаты, диск зрительного нерва."
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: рутинное обследование всех с ГК — офтальмоскопия с осмотром глазного дна, ЭКГ, анализы крови и мочи; раздел 2.4: офтальмоскопия — геморрагии, экссудаты, отёк соска зрительного нерва; точность, время и цена — игровая оценка" }
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.5.1: при средней степени отравления метанолом на глазном дне — гиперемия и размытость границ дисков зрительных нервов, расширение вен и кровоизлияния, при лёгкой — норма; раздел 2.5 (УУР С, УДД 5): первичный осмотр офтальмолога всем с отравлением метанолом; точность — игровая оценка" }
review: draft
