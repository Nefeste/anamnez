id: exam.fundoscopy
name: { ru: "Осмотр глазного дна" }
kind: physical
time: { procedure: 5 }
cost: 0
discomfort: 1
# при давлении 180/110 и выше — каждому (spec 2026-10-chapter-3, часть 43г): офтальмоскопия — в рутинном обследовании
# всех с гипертоническим кризом, ищут поражение органов-мишеней (62_3, раздел 3.7); и при пелене перед глазами
routineFor: [sym.vision_blurred]
routineSeen: [vital.bp_very_high]
checks:
  # точность — игровая оценка: прямая офтальмоскопия врачом без расширения зрачка пропускает часть изменений
  - { f: sign.retinopathy_acute, sens: 85, spec: 98 }
texts:
  hint:
    ru: "Врач смотрит в глаз офтальмоскопом. Кровоизлияния и отёк диска зрительного нерва при очень высоком давлении — признак злокачественной гипертензии: это криз, его лечат в стационаре."
  summary:
    ru: "Прямая офтальмоскопия: сосуды сетчатки, кровоизлияния, экссудаты, диск зрительного нерва."
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: рутинное обследование всех с ГК — офтальмоскопия с осмотром глазного дна, ЭКГ, анализы крови и мочи; раздел 2.4: офтальмоскопия — геморрагии, экссудаты, отёк соска зрительного нерва; точность, время и цена — игровая оценка" }
review: draft
