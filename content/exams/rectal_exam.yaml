id: exam.rectal_exam
name: { ru: "Осмотр промежности и пальцевое исследование прямой кишки" }
kind: physical
time: { procedure: 4 }
cost: 0
discomfort: 3
# с частью 55б (spec 2026-10-chapter-4) — каждому с запором месяцами: пальпация живота и пальцевое ректальное исследование
# «с целью исключения опухолей брюшной полости» (274_3, раздел 2.2, УУР С, УДД 5); при СРК обследование «обязательно включать
# осмотр перианальной области и трансректальное пальцевое исследование» (892_1, раздел 2.2)
routineFor: [sym.constipation_long]
routineSeen: [sym.pain_with_stool]
checks:
  # точности осмотра в 185_3 нет — игровые оценки: снаружи подкожный гнойник видно почти всегда,
  # глубокий находит только палец
  - { f: sign.perianal_infiltrate, sens: 95, spec: 97 }
  - { f: sign.rectal_bulge, sens: 80, spec: 95 }
texts:
  hint:
    ru: "Врач осматривает кожу вокруг заднего прохода, ягодицы и крестец, ощупывает их и исследует прямую кишку пальцем. Снаружи виден подкожный гнойник; глубокий, высоко в тазу, находит только пальцевое исследование. При запоре и СРК так ищут опухоль, трещины и геморрой."
  summary:
    ru: "Осмотр и пальпация перианальной, крестцово-копчиковой и ягодичной областей, пальцевое исследование прямой кишки."
sources:
  - { kind: guideline, title: "Острый парапроктит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/185_3", note: "ID 185_3, опубликованы 02.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: всем — осмотр и пальпация перианальной, крестцово-копчиковой и ягодичной областей и пальцевое исследование прямой кишки; что оно находит при разных формах; точность — игровая оценка, чисел в тексте нет" }
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.2 (УУР С, УДД 5): при запоре — пальпация живота и пальцевое ректальное исследование: опухоли, экскориации, геморрой, трещины, ректоцеле, тонус сфинктера" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.2: физикальное обследование при СРК обязательно включает осмотр перианальной области и пальцевое исследование прямой кишки" }
review: draft
