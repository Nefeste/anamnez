id: exam.rectal_exam
name: { ru: "Осмотр промежности и пальцевое исследование прямой кишки" }
kind: physical
time: { procedure: 4 }
cost: 0
discomfort: 3
checks:
  # точности осмотра в 185_3 нет — игровые оценки: снаружи подкожный гнойник видно почти всегда,
  # глубокий находит только палец
  - { f: sign.perianal_infiltrate, sens: 95, spec: 97 }
  - { f: sign.rectal_bulge, sens: 80, spec: 95 }
texts:
  hint:
    ru: "Врач осматривает кожу вокруг заднего прохода, ягодицы и крестец, ощупывает их и исследует прямую кишку пальцем. Снаружи виден подкожный гнойник; глубокий, высоко в тазу, находит только пальцевое исследование."
  summary:
    ru: "Осмотр и пальпация перианальной, крестцово-копчиковой и ягодичной областей, пальцевое исследование прямой кишки."
sources:
  - { kind: guideline, title: "Острый парапроктит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/185_3", note: "ID 185_3, опубликованы 02.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: всем — осмотр и пальпация перианальной, крестцово-копчиковой и ягодичной областей и пальцевое исследование прямой кишки; что оно находит при разных формах; точность — игровая оценка, чисел в тексте нет" }
review: draft
