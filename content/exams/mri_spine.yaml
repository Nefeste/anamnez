id: exam.mri_spine
name: { ru: "МРТ поясничного отдела позвоночника" }
kind: imaging
room: room.mri
equipment: [eq.mri_15]
# без облучения; укладка и серии — дольше, чем головы: игровая оценка (spec 2026-10-chapter-4, часть 58б); цена — как у МРТ
# головы, игровая оценка. Без «красных флажков» при типичной радикулопатии в первые 4 недели МРТ не нужна (777_1, раздел 2.4,
# Р12, УУР A): в игре её цена — лишняя трата; при синдроме конского хвоста — экстренно (Р11)
radiation: none
time: { procedure: 20, report: 15 }
cost: 6000
discomfort: 1
checks:
  # грыжа диска у корешка (777_1, раздел 1.2: МРТ «информативна в выявлении грыжи дисков») — точность игровая; у многих она есть
  # и без боли — это фон признака
  - { f: img.mri_disc_herniation, sens: 95, spec: 97 }
  # перекрытый канал при синдроме конского хвоста (Р11) — точность игровая
  - { f: img.mri_canal_block, sens: 98, spec: 100 }
texts:
  hint:
    ru: "Томограф снимает поясничный отдел позвоночника сериями без облучения: диски, канал с корешками, тела позвонков. Нужна, когда есть тревожные признаки — прежде всего задержка мочи и онемение промежности. При обычной радикулопатии в первые 4 недели она исход не меняет."
  summary:
    ru: "Продольные и поперечные срезы поясничного отдела в режиме T2; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Дискогенная пояснично-крестцовая радикулопатия", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/777_1", note: "ID 777_1, опубликованы 07.12.2023, применяются; сверено с рубрикатором 12.10.2026; раздел 2.4: МРТ — при наличии симптомов опасности («красных флажков») (Р9, УУР C, УДД 5); экстренно — при синдроме конского хвоста (Р11, УУР C, УДД 5); без «красных флажков» при типичной картине МРТ, КТ и рентгенография в первые 4 недели не рекомендуются (Р12, УУР A, УДД 2); через 4–6 недель без улучшения — МРТ или КТ (Р13); МРТ предпочтительнее КТ: нет лучевой нагрузки и информативна в выявлении грыжи; критерий качества 5; время, цена и точность — игровая оценка" }
review: draft
