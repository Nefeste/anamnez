id: exam.urinalysis
name: { ru: "Общий анализ мочи" }
kind: lab
room: room.lab
equipment: [eq.urine_analyzer]
collect: room.procedure
time: { procedure: 3, turnaround: 60 }
cost: 300
discomfort: 0
checks:
  - { f: lab.urine_leuk, sens: 95, spec: 96 }
  - { f: lab.urine_nitrite, sens: 95, spec: 99 }
  - { f: lab.urine_blood, sens: 95, spec: 96 }
  - { f: lab.urine_glucose, sens: 97, spec: 99 }
  # белок в моче (spec 2026-10-chapter-4, часть 52б): общий анализ мочи всем с подозрением на ГЛПС (347_2, раздел 2.3.1, УУР С,
  # УДД 4; критерий качества 4) — точность игровая
  - { f: lab.urine_protein, sens: 95, spec: 97 }
texts:
  hint:
    ru: "Лейкоциты, нитриты, эритроциты и белок в моче под микроскопом и на анализаторе — точнее полоски, но результат через час."
  summary:
    ru: "Средняя порция утренней или свежей мочи, лаборатория."
sources:
  - { kind: textbook, title: "Клиническая лабораторная диагностика: общий анализ мочи", note: "черновик" }
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3.1 (УУР С, УДД 4): общий анализ мочи в динамике всем с подозрением на ГЛПС — протеинурия, эритроциты, цилиндры, плотность; критерий качества 4; точность — игровая оценка" }
review: draft
