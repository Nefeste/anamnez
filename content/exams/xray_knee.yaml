id: exam.xray_knee
name: { ru: "Рентгенография коленного сустава" }
kind: imaging
room: room.xray
equipment: [eq.xray_analog, eq.xray_digital]
radiation: low
time: { procedure: 10, report: 20 }
cost: 900
discomfort: 1
# точность снимка в рекомендациях не дана — игровая оценка
checks:
  - { f: img.xr_patella_fracture, sens: 95, spec: 99.5 }
  - { f: img.xr_patella_displaced, sens: 95, spec: 98 }
  - { f: img.xr_knee_effusion, sens: 70, spec: 92 }
texts:
  hint:
    ru: "Снимок колена в двух проекциях: есть ли перелом, разошлись ли отломки надколенника, есть ли выпот в суставе. Связки на снимке не видны. Без признаков по оттавским правилам его можно не делать."
  summary:
    ru: "Снимки в прямой и боковой проекциях на одной плёнке, с нижней третью бедра и верхней третью голени; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4 (УУР B, УДД 3): рентгенография коленного сустава для исключения перелома — при одном из пяти оттавских критериев; правила исключают переломы в 98,5 % случаев" }
  - { kind: guideline, title: "Переломы надколенника", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/970_1", note: "ID 970_1, опубликованы 25.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: рентгенография коленного сустава в двух проекциях с захватом нижней трети бедра и верхней трети голени всем с подозрением на перелом надколенника" }
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: рентгенография в двух проекциях для исключения переломов и вывихов; при острой травме решение о снимке — по оттавским критериям; связки оценивает МРТ" }
review: draft
