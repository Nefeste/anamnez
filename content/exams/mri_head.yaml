id: exam.mri_head
name: { ru: "МРТ головного мозга" }
kind: imaging
room: room.mri
equipment: [eq.mri_15]
# без облучения; время — игровая оценка: укладка и короткий протокол серий за четверть часа (при инсульте МРТ, как КТ, — в
# первые 40 минут: 814_1, раздел 2.4), описание рентгенологом (spec 2026-10-chapter-4,
# часть 50б); тесно и шумно — неудобство небольшое; цена — как тариф ОМС за МРТ, игровая оценка
radiation: none
time: { procedure: 15, report: 15 }
cost: 6000
discomfort: 1
checks:
  # кровь внутри черепа (523_3, раздел 2.4: «КТ или МРТ» при геморрагическом инсульте) — точность игровая: свежую кровь
  # МРТ видит чуть хуже КТ, ложной не покажет; где кровь и сколько её — уточнение, только когда кровь видна
  - { f: img.ct_blood, sens: 97, spec: 100 }
  - { f: img.ct_hematoma, sens: 98, spec: 98, given: img.ct_blood }
  - { f: img.ct_hematoma_large, sens: 98, spec: 100 }
  - { f: img.ct_sah, sens: 90, spec: 99, given: img.ct_blood }
  # свежий очаг ишемии в режиме диффузии (814_1, раздел 2.4: «КТ или МРТ») — игровая оценка
  - { f: img.mri_ischemia, sens: 95, spec: 98 }
  # очаг в височной доле при герпетическом энцефалите (492_2, раздел 2.4) — игровая оценка
  - { f: img.temporal_lesion, sens: 95, spec: 98 }
texts:
  hint:
    ru: "Томограф с сильным магнитом снимает мозг сериями без облучения. Дольше и дороже КТ, зато в первые часы инсульта видит свежий очаг ишемии, а при энцефалите — воспаление в височной доле. Кровь внутри черепа находит, как КТ, — тромболизис можно решать и по МРТ."
  summary:
    ru: "Серии срезов головы в разных режимах, в том числе в режиме диффузии; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.4 (УУР A, УДД 1): бесконтрастная КТ или МРТ с заключением в течение 40 минут от поступления; критерий качества 3; точность — игровая оценка" }
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 2.4 (УУР B, УДД 2): КТ или МРТ не позднее 40 минут от поступления — расположение и объём кровоизлияния; точность — игровая оценка" }
  - { kind: guideline, title: "Простой герпес (ПГ) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/492_2", note: "ID 492_2, опубликованы 27.10.2025, применяются; сверено с рубрикатором 06.10.2026; раздел 2.4 (УУР С, УДД 4): КТ и/или МРТ головного мозга — степень поражения и тактика; очаги некроза чаще в лобно-височной области; для этиологического диагноза недостаточно; точность — игровая оценка" }
review: draft
