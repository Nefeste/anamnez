id: exam.xray_ankle
name: { ru: "Рентгенография голеностопного сустава" }
kind: imaging
room: room.xray
equipment: [eq.xray_analog, eq.xray_digital]
radiation: low
time: { procedure: 10, report: 20 }
cost: 900
discomfort: 1
# точность снимка в рекомендации не дана — игровая оценка
checks:
  - { f: img.xr_ankle_fracture, sens: 95, spec: 98 }
  - { f: img.xr_ankle_unstable, sens: 90, spec: 97 }
texts:
  hint:
    ru: "Снимок голеностопа в двух проекциях: есть ли перелом лодыжек и стабилен ли он — на месте ли таранная кость, не расширена ли щель у внутренней лодыжки. Без признаков по оттавским правилам его можно не делать."
  summary:
    ru: "Снимки в прямой и боковой проекциях на одной плёнке; описание делает рентгенолог."
sources:
  - { kind: guideline, title: "Переломы лодыжек", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/855_1", note: "ID 855_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: рентгенография голеностопного сустава в двух проекциях всем с подозрением на перелом лодыжек; медиальная часть сочленения в норме меньше 5 мм; критерий качества 2; точность снимка не дана — игровая оценка" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: по оттавским правилам снимок нужен при болезненности кости у лодыжек или неспособности пройти 4 шага" }
review: draft
