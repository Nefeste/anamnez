id: exam.egd
name: { ru: "ЭГДС" }
kind: imaging
room: room.endoscopy
equipment: [eq.videoendoscope]
# эзофагогастродуоденоскопия (spec 2026-10-chapter-4, часть 53а): при кровотечении из верхних отделов ЖКТ — экстренно, в
# течение 2 часов от госпитализации (277_2, раздел 2.4; 1026_1, раздел 2.4); эндоскопист сам проводит и сам описывает.
# Время, цена и неудобство — игровая оценка: под седацией, без облучения
radiation: none
time: { procedure: 20, report: 5 }
cost: 3000
discomfort: 2
checks:
  # язва — источник (277_2, раздел 2.4); что в её дне — уточнение, только когда язва видна (приложение Г5)
  - { f: img.egd_ulcer, sens: 97, spec: 99 }
  - { f: img.egd_bleeding, sens: 98, spec: 99 }
  - { f: img.egd_stigmata, sens: 92, spec: 95, given: img.egd_ulcer }
  # разрыв слизистой кардии при синдроме Мэллори–Вейсса (1026_1, раздел 2.4)
  - { f: img.egd_tear, sens: 95, spec: 99 }
  # гастрит (spec 2026-10-chapter-4, часть 53б): диффузная эритема и отёк — по Киотской характеристике (708_2, Приложение
  # А3); точность — игровая оценка. H. pylori — быстрым уреазным тестом в биоптате: чувствительность 85–95 %, специфичность
  # 95–100 % (708_2, раздел 2.5.1) — середины
  - { f: img.egd_gastritis, sens: 80, spec: 95 }
  - { f: lab.h_pylori, sens: 90, spec: 97 }
  # варикозные вены пищевода (spec 2026-10-chapter-4, часть 54а): ЭГДС оценивает их размер и стигмы, при кровотечении —
  # подтверждает варикозный источник (715_2, раздел 2.4); точность — игровая оценка
  - { f: img.egd_varices, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Гибкий эндоскоп через рот: осмотр пищевода, желудка и двенадцатиперстной кишки. Находит язву, гастрит и варикозные вены пищевода, из биоптата — H. pylori; при кровотечении — его источник и идёт ли кровь сейчас: тут же её и останавливают. При кровотечении — в первые 2 часа."
  summary:
    ru: "Осмотр пищевода, желудка и двенадцатиперстной кишки гибким эндоскопом, биопсия с быстрым уреазным тестом на H. pylori; описание делает эндоскопист."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР C, УДД 5): экстренная ЭГДС всем с острым кровотечением из верхних отделов ЖКТ, в течение 2 часов от госпитализации, параллельно с инфузионной терапией; стратификация по Forrest (УУР B, УДД 3); точность — игровая оценка" }
  - { kind: guideline, title: "Гастрит и дуоденит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/708_2", note: "ID 708_2, опубликованы 10.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР A, УДД 2): ЭГДС всем для подтверждения гастрита; раздел 2.5.1 (УУР B, УДД 2): при показаниях к ЭГДС — быстрый уреазный тест, чувствительность 85–95 %, специфичность 95–100 %; Приложение А3: Киотская эндоскопическая характеристика гастрита; точность находки гастрита — игровая оценка" }
  - { kind: guideline, title: "Синдром Мэллори-Вейсса (желудочно-пищеводный разрывно-геморрагический синдром)", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1026_1", note: "ID 1026_1, опубликованы 02.02.2026, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР C, УДД 5): ЭГДС подтверждает разрыв, в течение 2 часов от госпитализации; точность — игровая оценка" }
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР C, УДД 4): ЭГДС больным циррозом — размер вен и пятна васкулопатии; (УУР A, УДД 2) при варикозном кровотечении — как можно раньше, желательно в первые 12 ч; точность — игровая оценка" }
review: draft
