id: exam.egd
name: { ru: "ЭГДС" }
kind: imaging
room: room.endoscopy
equipment: [eq.videoendoscope]
# эзофагогастродуоденоскопия (spec 2026-10-chapter-4, часть 53а): при кровотечении из верхних отделов ЖКТ — экстренно, в
# течение 2 часов от госпитализации (277_2, раздел 2.4; 1026_1, раздел 2.4); эндоскопист сам проводит и сам описывает.
# Время, цена и неудобство — игровая оценка: под седацией, без облучения
radiation: none
time: { procedure: 20, report: 5 }
cost: 3000
discomfort: 2
checks:
  # язва — источник (277_2, раздел 2.4); что в её дне — уточнение, только когда язва видна (приложение Г5)
  - { f: img.egd_ulcer, sens: 97, spec: 99 }
  - { f: img.egd_bleeding, sens: 98, spec: 99 }
  - { f: img.egd_stigmata, sens: 92, spec: 95, given: img.egd_ulcer }
  # разрыв слизистой кардии при синдроме Мэллори–Вейсса (1026_1, раздел 2.4)
  - { f: img.egd_tear, sens: 95, spec: 99 }
texts:
  hint:
    ru: "Гибкий эндоскоп через рот: осмотр пищевода, желудка и двенадцатиперстной кишки на экране. При кровотечении находит источник — язву или разрыв слизистой — и показывает, идёт ли кровь сейчас; тут же через эндоскоп её и останавливают. Делают в первые 2 часа от поступления."
  summary:
    ru: "Осмотр пищевода, желудка и двенадцатиперстной кишки гибким эндоскопом; описание делает эндоскопист."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР C, УДД 5): экстренная ЭГДС всем с острым кровотечением из верхних отделов ЖКТ, в течение 2 часов от госпитализации, параллельно с инфузионной терапией; стратификация по Forrest (УУР B, УДД 3); точность — игровая оценка" }
  - { kind: guideline, title: "Синдром Мэллори-Вейсса (желудочно-пищеводный разрывно-геморрагический синдром)", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1026_1", note: "ID 1026_1, опубликованы 02.02.2026, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР C, УДД 5): ЭГДС подтверждает разрыв, в течение 2 часов от госпитализации; точность — игровая оценка" }
review: draft
