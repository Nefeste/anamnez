id: rule.spesi
name: { ru: "Упрощённый индекс тяжести ТЭЛА (sPESI)" }
# тяжесть и риск ранней смерти при подтверждённой ТЭЛА без шока (spec 2026-10-chapter-3, часть 43б; ESC 2019, табл. 7 и
# 8): sPESI 0 — низкий риск, ранняя выписка и лечение дома; 1 и больше — стационар (рис. 6). Считают, когда тромбы
# видны на КТ-ангиографии. Жалобы — те же, что у Женевской шкалы: с одышкой и кашлем приходят и с пневмонией, и
# строка «не считают» стояла бы у каждого; у остальных больных ТЭЛА пункты шкалы врач узнаёт, потому что от них
# зависит место
complaints: [sym.dyspnea_sudden, sym.hemoptysis]
requires: [img.cta_pe]
onlyIfApplies: true
# по баллу за пункт (табл. 7). В игре: пульс чаще 100 вместо 110 и чаще, давление ниже 90 вместо 100, сатурация ниже 95
# вместо 90 — своих порогов на этих числах у игры нет; хроническая болезнь сердца или лёгких — один пункт
points:
  items:
    - { f: hx.cancer_active, w: 1 }
    - { f: hx.heart_failure, w: 1 }
    - { f: hx.copd, w: 1, unless: [hx.heart_failure] }
    - { f: vital.tachycardia, w: 1 }
    - { f: vital.bp_low, w: 1 }
    - { f: vital.spo2_low, w: 1 }
  age: { from: 81, w: 1 }
  from: 1
place: true
ageMin: 18
about: [cond.pe]
texts:
  summary:
    ru: >-
      Насколько тяжела тромбоэмболия лёгочной артерии без шока и где её лечить. По баллу: возраст старше
      80 лет, рак, хроническая сердечная недостаточность или болезнь лёгких, пульс 110 в минуту и чаще,
      верхнее давление ниже 100, сатурация ниже 90 %. 0 баллов — риск смерти за 30 дней около 1 %: можно
      выписать рано и лечить дома пероральным антикоагулянтом. 1 балл и больше — около 11 %: в
      стационар. Расширенный правый желудочек на КТ-ангиографии с повышенным тропонином — риск
      промежуточно-высокий, нужен монитор.
  hint:
    ru: "Шкала тяжести тромбоэмболии: возраст старше 80, рак, болезнь сердца или лёгких, частый пульс, низкое давление, низкая сатурация. 0 баллов — лечить дома, 1 и больше — в стационаре."
  yes: { ru: "Риск выше низкого — лечить в стационаре" }
  no: { ru: "Риск низкий — можно лечить дома пероральным антикоагулянтом" }
  na: { ru: "Тромбоэмболия на КТ-ангиографии не подтверждена — шкалу не считают" }
sources:
  - { kind: guideline, title: "Рекомендации ESC по диагностике и лечению острой легочной эмболии, разработанные в сотрудничестве с Европейским респираторным обществом (ERS)", org: "ESC, ERS", year: 2019, url: "https://doi.org/10.15829/1560-4071-2020-3848", note: "перевод — Российский кардиологический журнал 2020;25(8):3848 (решение владельца, вопрос 25); стр. 24, табл. 7: sPESI — возраст > 80, рак, хроническая сердечная недостаточность или хроническое заболевание лёгких, ЧСС ≥ 110, САД < 100, SaO2 < 90 % — по 1 баллу; 0 баллов — 30-дневная смертность 1,0 %, ≥ 1 — 10,9 %; стр. 25, табл. 8: sPESI ≥ 1 — промежуточный риск; стр. 36, рис. 6: низкий риск — ранняя выписка и лечение в амбулаторных условиях; стр. 33, раздел 6.10 (IIa A): ранняя выписка при низком риске; пульс > 100, давление < 90 и сатурация < 95 вместо порогов шкалы — игровое упрощение" }
review: draft
