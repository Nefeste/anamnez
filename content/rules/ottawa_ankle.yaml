id: rule.ottawa_ankle
name: { ru: "Оттавские правила для голеностопа" }
complaints: [sym.ankle_pain]
# признаки 1–2 (болезненность кости у лодыжек) и 5 (не наступил сразу и не проходит 4 шага);
# признаки стопы — основание пятой плюсневой и ладьевидная кость — придут с переломами стопы
any: [sign.malleolus_tenderness, sign.no_weight_bearing]
exams: [exam.xray_ankle]
# «тест специфичен только для пациентов старше 18 лет» (832_2, раздел 2.4)
ageMin: 18
about: [cond.ankle_fracture, cond.ankle_sprain]
texts:
  summary:
    ru: >-
      Нужен ли снимок при травме голеностопа. Нужен, если кость болезненна у верхушки лодыжки или
      по её заднему краю на протяжении 6 см либо если сразу после травмы не удалось наступить на
      ногу и в кабинете человек не проходит четырёх шагов. Нет ни одного признака — перелом
      маловероятен, меньше 1 %: снимок можно не делать, но посоветовать прийти через 5–7 дней, если
      боль не пройдёт. Чувствительность правил — почти 100 %, снимков меньше на 30–40 %. Признаки
      для стопы — болезненность основания пятой плюсневой и ладьевидной кости — появятся в игре с
      переломами стопы.
  hint:
    ru: "Правило для травмы голеностопа: снимок нужен, только если болезненна кость у лодыжки или человек не может пройти четыре шага. Без этих признаков перелом маловероятен."
  yes: { ru: "Снимок нужен" }
  no: { ru: "Ни одного признака — перелом маловероятен: снимок можно не делать, прийти снова через 5–7 дней, если боль не пройдёт" }
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: оттавские правила для голеностопного сустава и стопы — пять признаков; тест специфичен для пациентов старше 18 лет; письменный совет обратиться через 5–7 дней; чувствительность почти 100 %, снимков меньше на 30–40 %, без признаков вероятность перелома меньше 1 %" }
  - { kind: paper, title: "Stiell IG, Greenberg GH, McKnight RD, Nair RC, McDowell I, Reardon M, Stewart JP, Maloney J. Decision rules for the use of radiography in acute ankle injuries. Refinement and prospective validation. JAMA 1993;269(9):1127–1132", url: "https://pubmed.ncbi.nlm.nih.gov/8433468/", note: "PMID 8433468, сверено 29.09.2026: 1032 взрослых; чувствительность 1,0 для 121 перелома в зоне лодыжек" }
  - { kind: review, title: "Bachmann LM, Kolb E, Koller MT, Steurer J, ter Riet G. Accuracy of Ottawa ankle rules to exclude fractures of the ankle and mid-foot: systematic review. BMJ 2003;326(7386):417", url: "https://pubmed.ncbi.nlm.nih.gov/12595378/", note: "PMID 12595378, сверено 29.09.2026: 27 исследований, 15 581 больной; отношение правдоподобия отрицательного результата — 0,08; снимков меньше на 30–40 %" }
review: draft
