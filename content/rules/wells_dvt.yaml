id: rule.wells_dvt
name: { ru: "Шкала Уэллса и D-димер при боли в ноге" }
complaints: [sym.leg_pain]
# D-димер повышен — УЗИ вен (960_1, раздел 2.3; прил. Б)
any: [lab.d_dimer_high]
# шкала Уэллса (прил. Г1): по баллу за пункт, два и больше — ТГВ вероятен (28 %), сразу УЗИ; пункт
# «другой диагноз столь же вероятен» (минус 2) в игре не считается — это оценка врача
minor:
  any: [hx.cancer_active, hx.leg_cast, hx.bed_rest, sign.deep_vein_tenderness, sign.leg_swollen_whole, sign.calf_swelling_3cm, sign.pitting_edema, sign.collateral_veins, hx.prior_dvt]
  count: 2
# тромбофлебит: УЗИ обеих ног нужно всем, анализы, в том числе D-димер, — нет (668_2, разделы
# 2.3–2.4); при беременности D-димер не используют (960_1, раздел 3.8.1); нет пульса на стопе — это
# острая ишемия, её отличают от тромбоза вен (1006_1, раздел 2.2): шкала не для неё (часть 33б)
excludes: [sign.superficial_cord, hx.pregnancy, sign.foot_pulse_absent]
exams: [exam.us_leg_veins]
# рекомендации — для взрослых (960_1)
ageMin: 18
about: [cond.dvt, cond.calf_strain, cond.superficial_thrombophlebitis, cond.limb_ischemia]
texts:
  summary:
    ru: >-
      Нужно ли УЗИ вен при боли в ноге. Шкала Уэллса — по баллу за пункт: лечение рака, гипс или
      паралич ноги, операция или постельный режим, болезненность по ходу глубоких вен, отёк всей ноги,
      голень толще другой на 3 см, отёк с ямкой, расширенные подкожные вены, тромбоз в прошлом. Два
      балла и больше — тромбоз вероятен, сразу УЗИ. Меньше — D-димер: повышен — УЗИ, в норме — тромбоз
      исключён, УЗИ не нужно. Пункт «другой диагноз столь же вероятен» (минус два балла) игра не
      считает: это оценка врача. При тромбофлебите и беременности правило не применяют, без пульса на
      стопе — тоже: это острая ишемия ноги, а не тромбоз вен.
  hint:
    ru: "Правило для боли в ноге: два пункта шкалы Уэллса и больше — сразу УЗИ вен; меньше — D-димер, и только повышенный ведёт на УЗИ. При тромбофлебите, беременности и без пульса на стопе не применяют."
  yes: { ru: "УЗИ вен нужно" }
  no: { ru: "Шкала меньше двух и D-димер в норме — тромбоз глубоких вен исключён, УЗИ можно не делать" }
  na: { ru: "Шкалу и D-димер не применяют: при тяже по ходу подкожной вены и беременности УЗИ вен нужно и так, а без пульса на стопе думают об острой ишемии ноги" }
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2 (УДД 1, УУР В): шкала Уэллса, упрощённо — ≥ 2 вероятен, < 2 маловероятен; прил. Г1: пункты и баллы, маловероятен — 5,5 %, вероятен — 28 %; раздел 2.3 (УДД 1, УУР В): при низкой вероятности — D-димер, в норме ТГВ исключён, повышен — УЗИ; критерий качества 3; прил. Б: высокая вероятность — сразу УЗИ; раздел 3.8.1: у беременных D-димер не использовать" }
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.3 (УДД 5, УУР С): лабораторные тесты, в том числе D-димер, при тромбофлебите не рекомендуются; раздел 2.4: УЗИ поверхностных и глубоких вен обеих ног — каждому" }
  - { kind: paper, title: "Wells PS, Anderson DR, Rodger M, Forgie M, Kearon C, Dreyer J, Kovacs G, Mitchell M, Lewandowski B, Kovacs MJ. Evaluation of D-dimer in the diagnosis of suspected deep-vein thrombosis. N Engl J Med 2003;349(13):1227–1235", url: "https://pubmed.ncbi.nlm.nih.gov/14507948/", note: "PMID 14507948, сверено 30.09.2026: двухуровневая шкала Уэллса и D-димер у 1096 амбулаторных пациентов; «маловероятен» и отрицательный D-димер — ВТЭО за 3 месяца 0,4 %; без УЗИ обошлись 39 %" }
  - { kind: guideline, title: "Острая ишемия конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/1006_1", note: "ID 1006_1, опубликованы 29.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1: отсутствие пульса дистальнее окклюзии; раздел 2.2: дифференцировать острую ишемию от тромбоза глубоких вен" }
review: draft
