id: rule.colonoscopy_constipation
name: { ru: "Нужна ли колоноскопия при запоре" }
# колоноскопия при хроническом запоре (spec 2026-10-chapter-4, часть 55б): «Пациентам с хроническим запором старше 50 лет, а
# также имеющим „симптомы тревоги“ и наследственную отягощенность по колоректальному раку, с целью исключения органических
# заболеваний кишечника рекомендуется проведение колоноскопии» (274_3, раздел 2.4, УУР C, УДД 5; критерий качества 1).
# Симптомы тревоги — «примесь крови в кале, потеря более 10% массы тела за последние 3 месяца и др.» (раздел 2.1); анемия —
# признак скрытой кровопотери при колоректальном раке (раздел 2.3), у СРК — «снижение уровня гемоглобина» (892_1, раздел 2).
# Похудание в игре — без порога в 10 %
complaints: [sym.constipation_long]
any: [sym.stool_blood, sym.weight_loss, lab.hb_low, hx.family_crc]
age: { main: 50 }
# рекомендации — для взрослых (274_3: «взрослые»)
ageMin: 18
exams: [exam.colonoscopy]
about: [cond.constipation, cond.ibs]
texts:
  summary:
    ru: >-
      Нужна ли колоноскопия при хроническом запоре. Она нужна старше 50 лет и в любом возрасте при симптомах тревоги: крови в
      кале, похудании, анемии — и при раке толстой или прямой кишки у родителей, братьев или сестёр. Колоноскопия ищет
      органическую причину запора — прежде всего опухоль кишки. Без этих признаков запор лечат без неё.
  hint:
    ru: "Колоноскопия при запоре нужна старше 50 лет, при крови в кале, похудании, анемии и раке кишки у близких родственников."
  yes: { ru: "Колоноскопия нужна" }
  no: { ru: "Колоноскопия не нужна: моложе 50 лет, симптомов тревоги и рака кишки у родственников нет" }
sources:
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1: симптомы тревоги — примесь крови в кале, потеря более 10 % массы тела за последние 3 месяца и др., наследственная отягощённость по колоректальному раку; раздел 2.3: анемия от скрытой кровопотери — важный симптом колоректального рака; раздел 2.4 (УУР C, УДД 5): колоноскопия старше 50 лет, при симптомах тревоги и наследственной отягощённости; критерий качества 1" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2: симптомы тревоги — потеря массы тела, снижение уровня гемоглобина, скрытая кровь в кале, рак толстой кишки у родственников и др.; раздел 2.4 (УУР В, УДД 3): колоноскопия всем взрослым с СРК" }
review: draft
