id: rule.ottawa_foot
name: { ru: "Оттавские правила для стопы" }
complaints: [sym.foot_pain]
# боль в среднем отделе стопы и один из признаков: болезненность основания пятой плюсневой,
# ладьевидной кости, не наступил сразу и не проходит 4 шага (856_1 и 832_2, раздел 2.4)
any: [sign.mt5_tenderness, sign.navicular_tenderness, sign.no_weight_bearing]
exams: [exam.xray_foot]
# «тест специфичен только для пациентов старше 18 лет» (832_2, раздел 2.4)
ageMin: 18
about: [cond.mt5_fracture, cond.foot_contusion]
texts:
  summary:
    ru: >-
      Нужен ли снимок стопы при травме. Нужен, если болит средний отдел стопы и есть хоть один
      признак: болезненна кость у основания пятой плюсневой, болезненна ладьевидная кость или сразу
      после травмы не удалось наступить на ногу и в кабинете человек не проходит четырёх шагов. Нет
      ни одного признака — перелом маловероятен, меньше 1 %: снимок можно не делать, но посоветовать
      прийти через 5–7 дней, если боль не пройдёт. Чувствительность правил — почти 100 %, снимков
      меньше на 30–40 %. Для голеностопа — свои признаки, у лодыжек.
  hint:
    ru: "Правило для травмы стопы: снимок нужен, если болезненна кость у основания пятой плюсневой или ладьевидная кость или человек не может пройти четыре шага. Без этих признаков перелом маловероятен."
  yes: { ru: "Снимок стопы нужен" }
  no: { ru: "Ни одного признака — перелом маловероятен: снимок можно не делать, прийти снова через 5–7 дней, если боль не пройдёт" }
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: оттавские правила для голеностопного сустава и стопы — болезненность у основания V плюсневой, в проекции ладьевидной кости, неопороспособность сразу после травмы и неспособность пройти 4 шага; тест специфичен для пациентов старше 18 лет; письменный совет обратиться через 5–7 дней; чувствительность почти 100 %, снимков меньше на 30–40 %, без признаков вероятность перелома меньше 1 %" }
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: на усмотрение врача — оттавские правила: рентгенография стопы при боли в среднем отделе стопы и одном из критериев — болезненность ладьевидной кости, основания 5 плюсневой кости, неспособность пройти 4 шага сразу после травмы и при осмотре" }
  - { kind: paper, title: "Stiell IG, Greenberg GH, McKnight RD, Nair RC, McDowell I, Reardon M, Stewart JP, Maloney J. Decision rules for the use of radiography in acute ankle injuries. Refinement and prospective validation. JAMA 1993;269(9):1127–1132", url: "https://pubmed.ncbi.nlm.nih.gov/8433468/", note: "PMID 8433468, сверено 29.09.2026: 1032 взрослых с острой травмой голеностопа; 49 переломов в среднем отделе стопы, чувствительность правила для стопы — 1,0" }
  - { kind: review, title: "Bachmann LM, Kolb E, Koller MT, Steurer J, ter Riet G. Accuracy of Ottawa ankle rules to exclude fractures of the ankle and mid-foot: systematic review. BMJ 2003;326(7386):417", url: "https://pubmed.ncbi.nlm.nih.gov/12595378/", note: "PMID 12595378, сверено 29.09.2026: 27 исследований, 15 581 больной; правила для голеностопа и среднего отдела стопы исключают перелом почти наверняка; снимков меньше на 30–40 %" }
review: draft
