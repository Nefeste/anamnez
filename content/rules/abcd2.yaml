id: rule.abcd2
name: { ru: "Шкала ABCD2 после транзиторной ишемической атаки" }
complaints: [sym.transient_weakness, sym.transient_speech]
# первая шкала с баллами у правил (spec 2026-10-chapter-3, часть 41б): пункты и веса — по 814_1,
# приложение Г17. «Очаговая симптоматика» — 2 балла: у первоисточника (Johnston 2007) это слабость с
# одной стороны; нарушение речи без неё — 1 балл; длительность 60 минут и больше — 2, 10–59 — 1.
# Давление — первое измерение (140/90 и выше), диабет — известный
points:
  items:
    - { f: vital.bp_high, w: 1 }
    - { f: sym.transient_weakness, w: 2 }
    - { f: sym.transient_speech, w: 1, unless: [sym.transient_weakness] }
    - { f: hx.tia_long, w: 2 }
    - { f: hx.tia_mid, w: 1 }
    - { f: hx.diabetes, w: 1 }
  age: { from: 60, w: 1 }
  # ТИА высокого риска — больше 3 баллов: двойная антиагрегантная терапия (раздел 5.3, рис. 5 приложения Б)
  from: 4
# решает о втором антиагреганте: клопидогрел вдобавок к ацетилсалициловой кислоте на 21 день (раздел 5.3)
decides: tx.clopidogrel
about: [cond.tia]
texts:
  summary:
    ru: >-
      Риск инсульта после транзиторной ишемической атаки. Баллы: возраст 60 лет и старше — 1, давление
      140/90 и выше — 1, слабость в руке и ноге с одной стороны — 2, нарушение речи без слабости — 1,
      эпизод длился час и дольше — 2, от 10 до 59 минут — 1, сахарный диабет — 1. До 3 баллов риск
      низкий: инсульт в ближайшие 7 дней — у 1,2 %; 4–5 — умеренный, 5,9 %; 6 и больше — высокий, 12 %.
      Больше 3 баллов — два антиагреганта сразу: ацетилсалициловая кислота и клопидогрел на 21 день;
      меньше — один. Антиагрегант — сразу, как поставлен диагноз.
  hint:
    ru: "Шкала для транзиторной ишемической атаки: возраст, давление, слабость или речь, сколько длилось, диабет. Больше 3 баллов — риск инсульта выше, и антиагрегантов нужно два."
  yes: { ru: "Риск инсульта выше — нужны два антиагреганта, ацетилсалициловая кислота и клопидогрел" }
  no: { ru: "Риск инсульта низкий — хватит одного антиагреганта" }
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; приложение Г17: шкала ABCD2 — пункты и баллы, группы риска 0–3, 4–5, 6–8 и риск инсульта за 2, 7 и 90 дней — 1,0/1,2/3,1 %, 4,1/5,9/9,8 %, 8,1/12/18 %; раздел 5.3: ТИА высокого риска (больше 3 баллов по ABCD2) — двойная антиагрегантная терапия АСК и клопидогрелом не меньше 21 суток; раздел 5.1: вторичная профилактика — сразу после диагностики ТИА; рис. 5 приложения Б" }
  - { kind: paper, title: "Johnston SC, Rothwell PM, Nguyen-Huynh MN, Giles MF, Elkins JS, Bernstein AL, Sidney S. Validation and refinement of scores to predict very early stroke risk after transient ischaemic attack. Lancet 2007;369(9558):283–292", url: "https://pubmed.ncbi.nlm.nih.gov/17258668/", note: "PMID 17258668, сверено 04.10.2026: возраст 60 лет и старше — 1, давление 140/90 и выше — 1, слабость с одной стороны — 2, нарушение речи без слабости — 1, 60 минут и дольше — 2, 10–59 — 1, диабет — 1; сумма 0–7; высокий риск (6–7) — у 21 %, умеренный (4–5) — у 45 %, низкий (0–3) — у 34 %, риск инсульта за 2 дня — 8,1, 4,1 и 1,0 %" }
review: draft
