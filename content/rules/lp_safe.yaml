id: rule.lp_safe
name: { ru: "Можно ли пункцию" }
# противопоказания к спинномозговой пункции (spec 2026-10-chapter-4, часть 50а; 1020_1, приложение А3.3), как «Можно ли
# тромболизис» (часть 39а): пункт есть — пункцию не делают, пока не проверено всё — «пока неизвестно». Решают её при
# менингеальных знаках или геморрагической сыпи (раздел 2.2: при подозрении на ГФМИ и менингеальных симптомах) — в карте
# правило появляется с ними. Пункты проверяют перед самой пункцией, и с ними она опасна и без этих признаков: при коме и
# гемипарезе — вклинение (523_3, раздел 2.4: признаки дислокации). В игре: кома — 8 баллов и меньше по шкале Глазго;
# очаговые признаки — гемипарез; нестабильная гемодинамика и септический шок — давление ниже 90; нарушения гемостаза —
# тромбоциты ниже 100 и антикоагулянты; дыхательная недостаточность — сатурация ниже 90. Относительной брадикардии с
# гипертензией, зрачков и инфекции кожи в месте пункции в игре нет. Судороги — только те, что идут сейчас (часть 50б): в
# 1020_1 они противопоказание, а 492_2 пункцию при судорогах назначает (раздел 2.4) — прошедший приступ её не запрещает,
# идущие судороги сначала останавливают; при менингококковой инфекции судороги бывают при отёке мозга, а его видно комой.
# С частью 51б — и о клещевом энцефалите: пункция в первые сутки от вероятного диагноза, при угрозе дислокации — после
# стабилизации (567_2, раздел 2.4)
complaints: [sym.fever_hx, sym.headache, sym.vomiting, sym.confusion, sym.seizure, sym.seizure_ongoing]
requires: [sign.neck_stiffness, sign.petechial_rash]
any: [sign.gcs_coma, sign.hemiparesis, sym.seizure_ongoing, vital.bp_low, sign.rash_spreading, lab.platelets_low, hx.anticoagulants, vital.spo2_low]
decides: exam.lumbar_puncture
about: [cond.meningococcal, cond.hsv_encephalitis, cond.sah, cond.ich, cond.tbe]
texts:
  summary:
    ru: >-
      Можно ли делать люмбальную пункцию. При подозрении на менингит, менингококковую инфекцию и энцефалит ликвор берут,
      если нет противопоказаний: комы — 8 баллов и меньше по шкале Глазго, очаговых признаков, судорог, которые идут
      сейчас, шока и нестабильного давления, нарастающей геморрагической сыпи, тромбоцитов ниже 100 и других нарушений
      свёртывания, антикоагулянтов, дыхательной недостаточности. С противопоказанием пункция может вызвать вклинение мозга или
      кровотечение у спинного мозга: её откладывают до стабилизации, а лечат сразу — кровь на посев и антибиотик в
      вену ликвора не ждут.
  hint:
    ru: "Перед пункцией проверяют: сознание и очаговые признаки, не идут ли судороги, давление и сатурацию, сыпь, тромбоциты, антикоагулянты. Есть хоть одно — пункцию не делают."
  yes: { ru: "Пункцию нельзя — сначала стабилизировать, лечить не дожидаясь ликвора" }
  no: { ru: "Противопоказаний к пункции не нашли — её можно делать" }
  na: { ru: "Менингеальных знаков и геморрагической сыпи нет — о пункции по этому правилу не решают" }
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 2.2 (УУР С, УДД 4): пункция при подозрении на ГФМИ, менингеальных симптомах — при отсутствии противопоказаний; раздел 2.3: при противопоказаниях — после стабилизации; приложение А3.3: противопоказания — ШКГ менее 9 баллов или флюктуирующее сознание, относительная брадикардия и гипертензия, очаговая симптоматика, судороги, нестабильная гемодинамика, реакция зрачков, септический шок, прогрессирующая геморрагическая сыпь, нарушения гемостаза, тромбоциты менее 100 × 10⁹/л, антикоагулянты, инфекция кожи в зоне пункции, дыхательная недостаточность" }
  - { kind: guideline, title: "Простой герпес (ПГ) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/492_2", note: "ID 492_2, опубликованы 27.10.2025, применяются; сверено с рубрикатором 06.10.2026; раздел 2.4 (УУР С, УДД 3): пункция при поражении ЦНС с общемозговой или очаговой симптоматикой, судорогами, признаками внутричерепной гипертензии; противопоказания — прогрессирующий отёк мозга, дислокационный синдром, геморрагический синдром; при повышенном внутричерепном давлении ацикловир начинают до пункции" }
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4: при клинических или инструментальных признаках дислокации спинномозговая пункция противопоказана" }
review: draft
