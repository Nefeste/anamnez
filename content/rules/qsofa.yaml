id: rule.qsofa
name: { ru: "qSOFA: органная дисфункция при инфекции" }
# первичный скрининг сепсиса вне ОРИТ и вне стационара (spec 2026-10-chapter-4, часть 48а; 898_1, раздел 2.2, УДД 1, УУР
# А): при очаге инфекции два балла и больше — высокий риск органной дисфункции, искать сепсис. Кому: с жалобой на
# лихорадку, озноб, кашель, боль в пояснице, при мочеиспускании или в животе (часть 48б) — и при признаках инфекции: жар или озноб, по
# расспросу или градуснику (`requires`); без них шкалу не считают — иначе давление ниже 90 и частое дыхание у
# анафилактического шока с кашлем давали бы два балла. Давление и частота дыхания — в осмотре каждого; оглушение
# проверяют, когда один пункт уже набран: без него двух баллов не набрать
complaints: [sym.fever_hx, sym.chills, sym.cough, sym.flank_pain, sym.dysuria, sym.abdominal_pain, sym.ruq_pain]
requires: [sym.fever_hx, sym.chills, vital.fever]
onlyIfApplies: true
# по баллу за пункт (приложение Г.2). В игре: частота дыхания чаще 20 вместо 22 и чаще — своего порога 22 у игры нет;
# давление — «100 и ниже» и «ниже 90», один балл на оба
points:
  items:
    - { f: vital.bp_low, w: 1 }
    - { f: vital.bp_100, w: 1, unless: [vital.bp_low] }
    - { f: vital.tachypnea, w: 1 }
    - { f: sign.gcs_low, w: 1 }
  from: 2
exams: [exam.lactate]
ageMin: 18
about: [cond.sepsis]
texts:
  summary:
    ru: >-
      Быстрая оценка органной дисфункции у больного с инфекцией — вне реанимации и до анализов. По баллу:
      верхнее давление 100 и ниже, частота дыхания 22 в минуту и чаще, нарушение сознания (по шкале комы
      Глазго меньше 15). Два балла и больше — высокий риск органной дисфункции: ищут сепсис — лактат, посевы
      крови, — и антибиотик не откладывают. Шкала менее чувствительна, чем SOFA: меньше двух баллов сепсис
      не исключает.
  hint:
    ru: "Три пункта у больного с инфекцией: давление 100 и ниже, дыхание 22 и чаще, оглушение. Два и больше — подозрение на сепсис: лактат, посевы и антибиотик в вену."
  yes: { ru: "Два балла и больше — подозрение на сепсис: лактат, посевы крови, антибиотик" }
  no: { ru: "Меньше двух баллов — высокого риска органной дисфункции по qSOFA нет" }
  na: { ru: "Ни жара, ни озноба, ни температуры — признаков инфекции нет, шкалу не считают" }
sources:
  - { kind: guideline, title: "Сепсис (у взрослых)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/898_1", note: "ID 898_1, опубликованы 27.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.2 (УДД 1, УУР А): qSOFA — для первичного скрининга вне ОРИТ и вне стационара; приложение Г.2: систолическое АД 100 и ниже, частота дыхания 22 и чаще, Глазго меньше 15 — по баллу, два и больше при очаге инфекции — высокий риск органной дисфункции; qSOFA специфичнее, но менее чувствительна, чем SIRS и NEWS; ЧД чаще 20 вместо 22 — игровое упрощение" }
review: draft
