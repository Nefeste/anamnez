id: rule.acs_invasive
name: { ru: "Коронарография в первые сутки при ОКС" }
complaints: [sym.chest_pain_pressing]
# категории риска при ОКС без подъёма ST (154_4, приложение А3; spec 2026-10-chapter-3, часть 39в): высокий
# — инфаркт без подъёма ST (тропонин по алгоритму 0/1 час), смещения сегмента ST; очень высокий — шок
# (давление ниже 90) и острая сердечная недостаточность (хрипы внизу лёгких). Хватит одного: коронарография
# в первые 24 часа, при очень высоком — в первые 2, а больница без ЧКВ переводит (раздел 3.1.1). Подъём ST —
# свой путь (157_5), тоже перевод. Не вошли: GRACE больше 140 (баллы у правил — с первой шкалой с весами,
# часть 41а), боль, которая не проходит после лечения, угрожающие жизни аритмии — своих признаков нет
any: [ecg.st_elevation, lab.troponin_high, lab.troponin_rise, ecg.st_depression, vital.bp_low, sign.crackles_local]
about: [cond.acs]
texts:
  summary:
    ru: >-
      Кому при остром коронарном синдроме нужна коронарография в первые сутки, а значит — перевод в
      сосудистый центр. Высокий риск: инфаркт без подъёма ST — тропонин по алгоритму 0/1 час, смещения
      сегмента ST на ЭКГ, по шкале GRACE больше 140 баллов. Очень высокий — шок, острая сердечная
      недостаточность, боль, которая не проходит после лечения, угрожающие жизни аритмии: коронарография
      в первые 2 часа, переводят сразу. Остальным — наблюдение в палате интенсивной терапии и нагрузочная
      проба в первые 72 часа, а коронарографию делают, если боль вернётся. При подъёме ST везут в центр
      всегда. Шкалу GRACE игра пока не считает: в правиле — тропонин, ЭКГ, давление и хрипы.
  hint:
    ru: "Хоть один признак — коронарография в первые сутки, перевод в сосудистый центр: подъём или депрессия ST, тропонин 52 нг/л и выше или прирост за час 5 и больше, давление ниже 90, хрипы внизу лёгких. Нет ни одного — наблюдение в палате интенсивной терапии."
  yes: { ru: "Коронарография в первые сутки — перевод в сосудистый центр" }
  no: { ru: "Риск не высокий — наблюдение в палате интенсивной терапии, коронарография — если боль вернётся" }
  exam: { ru: "коронарография в сосудистом центре" }
sources:
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 04.10.2026; приложение А3, категории риска: очень высокий — нестабильность гемодинамики или кардиогенный шок, боль, рефрактерная к лечению, угрожающие жизни аритмии или остановка кровообращения, острая сердечная недостаточность, механические осложнения, повторяющиеся динамические смещения ST; высокий — ИМбпST, динамические смещения ST или изменения T, преходящий подъём ST, GRACE больше 140; раздел 3.1.1: очень высокий риск — КГ в первые 2 часа (ЕОК IC), высокий — в первые 24 часа (ЕОК IIaA), стационары без ЧКВ немедленно или срочно переводят; остальным — избирательная инвазивная стратегия; раздел 2.4: нагрузочная проба в первые 72 часа" }
review: draft
