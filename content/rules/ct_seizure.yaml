id: rule.ct_seizure
name: { ru: "Нужна ли КТ при судорожном приступе" }
# кому КТ головы после приступа (spec 2026-10-chapter-3, часть 44в): взрослым, впервые перенёсшим приступ, — когда
# нет МРТ (741_1, раздел 2.4.5, УУР C, УДД 5); при известной эпилепсии и обычном приступе — нет. Впервые или нет —
# узнают расспросом: пока не спросили, правило не решено
complaints: [sym.seizure]
any: [hx.first_seizure]
ageMin: 18
exams: [exam.ct_head]
about: [cond.seizure]
texts:
  summary:
    ru: >-
      Нужна ли компьютерная томография головного мозга после судорожного приступа. Взрослому, у которого приступ
      впервые в жизни, КТ нужна: она ищет причину, при которой нужна срочная помощь, — кровоизлияние, инсульт,
      опухоль, травму. Изменений на КТ может и не быть: это не значит, что эпилепсии нет. Если эпилепсия известна и
      приступ обычный для человека, КТ в экстренном порядке не нужна. МРТ лучше, но в игре её пока нет.
  hint:
    ru: "Приступ впервые в жизни — КТ головы: исключить кровоизлияние, инсульт, опухоль и травму. При известной эпилепсии и обычном приступе не нужна."
  yes: { ru: "КТ головного мозга нужна: приступ — впервые в жизни" }
  no: { ru: "КТ в экстренном порядке не нужна: приступы бывали и раньше" }
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 2.4.5 (УУР C, УДД 5): КТ головного мозга взрослым (старше 18 лет), впервые перенесшим единичный неспровоцированный эпилептический приступ, как первичное исследование при отсутствии возможности выполнить МРТ; КТ — для исключения внутричерепных кровоизлияний, ишемического инсульта, опухолей с дислокацией, черепно-мозговой травмы; отсутствие изменений на КТ не доказывает отсутствие эпилепсии" }
review: draft
