id: rule.colonoscopy_prep
name: { ru: "Можно ли колоноскопию с подготовкой" }
# эндоскопия при атаке язвенного колита (spec 2026-10-chapter-4, часть 55а), как «Можно ли пункцию» (часть 50а): при
# выраженной активности — сигмоидоскопия (193_2, раздел 2.4, УУР С, УДД 4), подготовка кишки осмотическими слабительными —
# фактор риска токсической дилатации (раздел 3.2.2). В игре тяжёлую атаку выдаёт один признак — стул с кровью 6 раз в сутки
# и чаще: системный признак воспаления (СРБ выше 30) при нём есть всегда, а вред обследования и проверка перед ним смотрят
# только пункты `any`
complaints: [sym.bloody_diarrhea]
any: [sym.bloody_diarrhea]
decides: exam.colonoscopy
about: [cond.uc_attack]
texts:
  summary:
    ru: >-
      Можно ли делать колоноскопию с подготовкой кишки слабительными. При тяжёлой атаке язвенного колита — стул с кровью 6 раз
      в сутки и чаще и хотя бы один признак воспаления — подготовка осмотическими слабительными может вызвать токсическую
      дилатацию: толстая кишка раздувается, грозит прободением. Тогда осматривают только прямую и сигмовидную кишку —
      сигмоидоскопией, без подготовки; колоноскопию делают, когда атака стихнет.
  hint:
    ru: "Перед колоноскопией спрашивают, нет ли тяжёлой атаки колита: стул с кровью 6 раз в сутки и чаще. Есть — только сигмоидоскопия."
  yes: { ru: "Колоноскопию с подготовкой нельзя — тяжёлая атака колита: только сигмоидоскопия" }
  no: { ru: "Тяжёлой атаки колита нет — колоноскопию с подготовкой можно" }
sources:
  - { kind: guideline, title: "Язвенный колит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/193_2", note: "ID 193_2, опубликованы 29.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР С, УДД 4): при лёгкой и умеренной активности — илеоколоноскопия, при выраженной — сигмоидоскопия; раздел 3.2.2: подготовка кишки к колоноскопии осмотическими слабительными и антидиарейные препараты — факторы риска токсической дилатации; раздел 1.5, таблица 2: тяжёлая атака — стул с кровью 6 раз в сутки и чаще и хотя бы один признак системного воспаления" }
review: draft
