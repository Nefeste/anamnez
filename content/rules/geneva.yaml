id: rule.geneva
name: { ru: "Женевская шкала и D-димер при подозрении на ТЭЛА" }
# при подозрении на ТЭЛА без шока (spec 2026-10-chapter-3, часть 43б; ESC 2019, рис. 5): подозрение в игре — внезапная
# одышка или кровохарканье; одышку и боль при дыхании без них разумный врач разбирает сам — иначе D-димер делали бы
# каждому девятому, кто пришёл с одышкой: с пневмонией, ковидом, переломом рёбер
complaints: [sym.dyspnea_sudden, sym.hemoptysis]
# пересмотренная Женевская шкала, упрощённая версия (табл. 5): по баллу за пункт, пульс 95 и чаще — 2. В игре: пульс
# чаще 100 вместо 95 и чаще, пульса 75–94 — балла нет (у игры нет этих порогов); «операция или перелом за месяц» —
# одним пунктом. Высокая вероятность — 5 баллов и больше: сразу КТ-ангиография; низкая и промежуточная — сначала
# D-димер: повышен — КТ-ангиография, в норме — ТЭЛА исключена (рис. 5; раздел 4.11, I A)
points:
  items:
    - { f: hx.prior_dvt, w: 1 }
    - { f: vital.tachycardia, w: 2 }
    - { f: hx.recent_bleed_surgery, w: 1 }
    - { f: hx.leg_cast, w: 1, unless: [hx.recent_bleed_surgery] }
    - { f: sym.hemoptysis, w: 1 }
    - { f: hx.cancer_active, w: 1 }
    - { f: sym.leg_pain, w: 1 }
    - { f: sign.deep_vein_tenderness, w: 1 }
  age: { from: 66, w: 1 }
  from: 5
any: [lab.d_dimer_high]
exams: [exam.cta_chest]
ageMin: 18
about: [cond.pe]
texts:
  summary:
    ru: >-
      Нужна ли КТ-ангиография при подозрении на тромбоэмболию лёгочной артерии. Баллы упрощённой
      пересмотренной Женевской шкалы: тромбоз вен или ТЭЛА в прошлом — 1, пульс 95 в минуту и чаще — 2
      (75–94 — 1), операция или перелом за последний месяц — 1, кровохарканье — 1, рак — 1, боль в одной
      ноге — 1, боль по ходу вены и отёк одной ноги — 1, возраст старше 65 лет — 1. 5 баллов и больше —
      вероятность высокая: сразу КТ-ангиография, D-димер не нужен. Меньше — сначала D-димер: в норме ТЭЛА
      исключена, повышен — КТ-ангиография. При высокой и промежуточной вероятности антикоагулянт начинают,
      не дожидаясь снимка.
  hint:
    ru: "Шкала вероятности тромбоэмболии: тромбоз в прошлом, частый пульс, операция или перелом, кровохарканье, рак, боль и отёк одной ноги, возраст. 5 баллов и больше — сразу КТ-ангиография; меньше — D-димер, и только повышенный ведёт на КТ."
  yes: { ru: "КТ-ангиография нужна" }
  no: { ru: "Вероятность невысокая и D-димер в норме — ТЭЛА исключена, КТ-ангиография не нужна" }
sources:
  - { kind: guideline, title: "Рекомендации ESC по диагностике и лечению острой легочной эмболии, разработанные в сотрудничестве с Европейским респираторным обществом (ERS)", org: "ESC, ERS", year: 2019, url: "https://doi.org/10.15829/1560-4071-2020-3848", note: "перевод — Российский кардиологический журнал 2020;25(8):3848 (решение владельца, вопрос 25); стр. 13, табл. 5: пересмотренная Женевская шкала — оригинальная и упрощённая версии, три уровня (упрощённая: 0–1, 2–4, ≥ 5) и два (0–2 — ТЭЛА маловероятна, ≥ 3 — вероятна); стр. 14, раздел 4.2: при низкой вероятности ТЭЛА подтверждают у ~10 %, при промежуточной — у 30 %, при высокой — у 65 %; стр. 35, рис. 5: низкая или промежуточная вероятность — D-димер, отрицательный — без терапии, положительный — КТ-ангиография; высокая — сразу КТ-ангиография; стр. 20, раздел 4.11: D-димер при низком и промежуточном риске — I A, при высокой вероятности — не рекомендован (III A); антикоагулянт при высокой и промежуточной вероятности, не дожидаясь результатов, — I C; пульс > 100 вместо ≥ 95 — игровое упрощение" }
review: draft
