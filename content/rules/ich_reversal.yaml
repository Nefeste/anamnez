id: rule.ich_reversal
name: { ru: "Нейтрализовать ли антикоагулянт при кровоизлиянии" }
complaints: [sym.weakness_one_side, sym.speech_trouble, sym.face_droop]
ageMin: 18
# при гипертензивной внутримозговой гематоме на фоне антитромботиков — немедленная отмена и инактивация (spec
# 2026-10-chapter-3, часть 41в; 523_3, раздел 3.1.1, приложение Б2). При САК 523_3 называет отмену
# антитромботиков без инактивации (раздел 3.2.1): правило — при крови на КТ, но не в бороздах и цистернах. О
# каком препарате речь, в игре не уточняется: протромбиновый комплекс — в каждой ветви алгоритма
requires: [img.ct_blood]
excludes: [img.ct_sah]
onlyIfApplies: true
any: [hx.anticoagulants]
decides: tx.pcc
about: [cond.ich]
texts:
  summary:
    ru: >-
      Нейтрализовать ли антикоагулянт при внутримозговом кровоизлиянии. Если человек принимает
      антикоагулянт, его отменяют сразу и вводят протромбиновый комплекс: он нейтрализует и варфарин —
      вместе с витамином K1, — и ривароксабан, апиксабан и дабигатран; у дабигатрана есть и свой антидот.
      Не рекомендуются эптаког альфа, менадион и тромбоцитарная масса при антиагрегантах.
  hint:
    ru: "При гематоме на КТ спрашивают об антикоагулянтах: принимает — отменить и сразу ввести протромбиновый комплекс, при варфарине — вместе с витамином K1."
  yes: { ru: "Нейтрализовать антикоагулянт протромбиновым комплексом" }
  no: { ru: "Антикоагулянтов не принимает — нейтрализовать нечего" }
  na: { ru: "Гематомы в веществе мозга на КТ нет — правило не применяют" }
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.1: немедленная отмена и инактивация антитромботиков при гипертензивной ВМГ — при АВК фитоменадион с протромбиновым комплексом или СЗП, при дабигатране идаруцизумаб или протромбиновый комплекс, при ривароксабане и апиксабане протромбиновый комплекс; не рекомендуются эптаког альфа для коррекции МНО, менадион, тромбоцитарная масса при антиагрегантах; приложение Б2; раздел 3.2.1: при аСАК — отмена антитромботиков" }
review: draft
