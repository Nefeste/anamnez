id: rule.cha2ds2vasc
name: { ru: "Шкала CHA₂DS₂-VASc при фибрилляции предсердий" }
complaints: [sym.palpitations]
# вторая шкала с баллами (spec 2026-10-chapter-3, часть 42а): пункты и баллы — по 382_2, приложение Г1, табл.
# П3. Применяют, когда на ЭКГ фибрилляция или трепетание предсердий: схема антикоагуляции при трепетании та же
# (раздел 3.1.1.2). Гипертония, диабет, сердечная недостаточность, сосуды, инсульт — то, что известно из
# расспроса; возраст — полосами, женский пол — балл, и порог у женщин свой
requires: [ecg.af]
points:
  items:
    - { f: hx.heart_failure, w: 1 }
    - { f: hx.hypertension, w: 1 }
    - { f: hx.diabetes, w: 1 }
    - { f: hx.stroke_tia, w: 2 }
    - { f: hx.vascular, w: 1 }
  age:
    - { from: 65, w: 1 }
    - { from: 75, w: 2 }
  sex: { f: 1 }
  # антикоагулянт постоянно — мужчинам с 2 баллов, женщинам с 3 (раздел 3.1.1.1, ЕОК IA)
  from: 2
  fromSex: { f: 3 }
# решает о постоянном пероральном антикоагулянте (раздел 3.1.1.1)
decides: tx.doac
about: [cond.af]
texts:
  summary:
    ru: >-
      Риск инсульта при фибрилляции и трепетании предсердий. Баллы: хроническая сердечная недостаточность
      — 1, артериальная гипертония — 1, возраст 75 лет и старше — 2, сахарный диабет — 1, инсульт,
      транзиторная ишемическая атака или эмболия в прошлом — 2, инфаркт или атеросклероз артерий ног — 1,
      возраст 65–74 года — 1, женский пол — 1. Инсультов за год: при 2 баллах — 2,2 %, при 4 — 4 %, при 6 —
      9,8 %. Мужчинам с 2 баллов и женщинам с 3 — антикоагулянт постоянно, лучше прямой пероральный;
      ацетилсалициловая кислота и клопидогрел вместо него не защищают.
  hint:
    ru: "Шкала риска инсульта при фибрилляции предсердий: сердечная недостаточность, гипертония, возраст, диабет, инсульт в прошлом, болезнь сосудов, женский пол. Мужчинам с 2 баллов, женщинам с 3 — антикоагулянт."
  yes: { ru: "Риск инсульта высокий — нужен антикоагулянт постоянно" }
  no: { ru: "Риск инсульта невысокий — постоянный антикоагулянт по шкале не обязателен" }
  na: { ru: "На ЭКГ нет фибрилляции и трепетания предсердий — шкала не нужна" }
sources:
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; приложение Г1, табл. П3: пункты CHA₂DS₂-VASc и частота инсульта за год по баллам — 0 — 0 %, 1 — 1,3 %, 2 — 2,2 %, 3 — 3,2 %, 4 — 4,0 %, 5 — 6,7 %, 6 — 9,8 %; раздел 3.1.1.1: постоянный пероральный антикоагулянт мужчинам с 2 баллов и женщинам с 3 (ЕОК IA), мужчинам с 1 и женщинам с 2 — с учётом особенностей (ЕОК IIaB); антиагреганты для профилактики инсульта не рекомендованы (ЕОК IIIA); в РФ используется CHA₂DS₂-VASc, CHA₂DS₂-VA не валидирована" }
review: draft
