id: rule.ottawa_knee
name: { ru: "Оттавские правила для колена" }
complaints: [sym.knee_pain]
# хватит одного признака: изолированная болезненность надколенника, болезненность головки
# малоберцовой, сгибание меньше 90°, не может опереться сразу и пройти 4 шага (832_2, раздел 2.4)
any: [sign.patella_tenderness, sign.fibular_head_tenderness, sign.knee_flexion_limited, sign.no_weight_bearing]
# «возраст ≥ 55 лет» — пятый признак (832_2, раздел 2.4)
age: { from: 55 }
exams: [exam.xray_knee]
# рекомендация — для взрослых (832_2, раздел 2.4: «взрослым пациентам»)
ageMin: 18
about: [cond.knee_contusion, cond.knee_ligament, cond.patella_fracture]
texts:
  summary:
    ru: >-
      Нужен ли снимок при травме колена. Нужен, если человеку 55 лет и больше, если болезнен сам
      надколенник или головка малоберцовой кости, если колено не сгибается до прямого угла либо если
      сразу после травмы не удалось наступить на ногу и в кабинете человек не проходит четырёх шагов.
      Нет ни одного признака — перелом маловероятен: правила находят почти все переломы колена, а
      снимков с ними на четверть меньше. Связки на снимке не видны — их проверяют тестами.
  hint:
    ru: "Правило для травмы колена: снимок нужен с 55 лет, при болезненности надколенника или головки малоберцовой кости, если колено не сгибается до 90° или человек не может пройти четыре шага."
  yes: { ru: "Снимок нужен" }
  no: { ru: "Ни одного признака — перелом маловероятен: снимок можно не делать" }
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4 (УУР B, УДД 3): рентгенография коленного сустава взрослым при одном из критериев — возраст ≥ 55 лет, изолированная болезненность надколенника, болезненность головки малоберцовой кости, сгибание меньше 90°, не может опереться сразу после травмы и пройти 4 шага; оттавские правила исключают переломы в 98,5 % случаев, недиагностированные — меньше 1,5 %" }
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: при острой травме колена решение о рентгенографии — по оттавским критериям" }
  - { kind: paper, title: "Stiell IG, Greenberg GH, Wells GA, McKnight RD, Cwinn AA, Cacciotti T, McDowell I, Smith NA. Derivation of a decision rule for the use of radiography in acute knee injuries. Ann Emerg Med 1995;26(4):405–413", url: "https://pubmed.ncbi.nlm.nih.gov/7574120/", note: "PMID 7574120, сверено 29.09.2026: 1047 взрослых с острой травмой колена, переломов — 68; пять признаков правила; чувствительность 1,0, специфичность 0,54; снимков меньше на 28 % (с 68,6 до 49,4 %)" }
  - { kind: paper, title: "Stiell IG, Greenberg GH, Wells GA, McDowell I, Cwinn AA, Smith NA, Cacciotti TF, Sivilotti ML. Prospective validation of a decision rule for the use of radiography in acute knee injuries. JAMA 1996;275(8):611–615", url: "https://pubmed.ncbi.nlm.nih.gov/8594242/", note: "PMID 8594242, сверено 29.09.2026: 1096 взрослых, 63 клинически значимых перелома; чувствительность 1,0; при отрицательном правиле вероятность перелома — 0 % (0–0,4 %); снимков меньше на 28 %" }
review: draft
