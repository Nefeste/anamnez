id: rule.ct_head
name: { ru: "КТ при лёгкой черепно-мозговой травме" }
complaints: [sym.head_injury]
# применяют при признаках черепно-мозговой травмы: потеря сознания, амнезия, рвота, судороги,
# оглушение (734_2, раздел 1.1 и табл. 1; 733_2, раздел 2.1); без них — ушиб мягких тканей головы,
# «отсутствие признаков ЧМТ» (733_2, раздел 2)
requires: [sym.loss_of_consciousness, sym.amnesia, sym.vomiting, sym.seizure_after_injury, sign.gcs_low]
# основные факторы — хватит одного (734_2, раздел 2.4, картинка «Факторы риска»; табл. 1: ШКГ
# 13–14 — категория 3, КТ показана). Амнезии дольше 4 часов, снижения ШКГ в динамике и признаков
# перелома черепа при сотрясении не бывает (раздел 1.6: амнезия — минуты–1 час; раздел 2.2.1:
# повреждений костей черепа нет) — в правиле их нет
any: [sym.vomiting, sym.seizure_after_injury, hx.anticoagulants, sign.gcs_low, hx.road_accident]
# дополнительные — нужно не меньше двух (табл. 1: «≥ 2 дополнительных»); возраст 40–60 лет — тоже
# один. Персистирующей амнезии, амнезии 2–4 часа и очаговой симптоматики в игре нет
minor: { any: [sym.loss_of_consciousness], count: 2 }
age: { main: 60, minor: [40, 60] }
# рекомендации — для взрослых (734_2: «взрослые»)
ageMin: 18
# КТ головного мозга — в своём кабинете КТ (часть 40); где его нет, при показаниях — перевод в
# стационар с КТ и нейрохирургией (734_2, раздел 6)
exams: [exam.ct_head]
about: [cond.concussion, cond.head_bruise]
texts:
  summary:
    ru: >-
      Нужна ли компьютерная томография головного мозга после удара по голове. Правило применяют,
      если есть признак черепно-мозговой травмы: потеря сознания, амнезия, рвота, судороги или
      оглушение; без них это ушиб мягких тканей. КТ нужна, если есть хоть один основной признак —
      возраст старше 60 лет, рвота, судороги сразу после травмы, приём антикоагулянтов, оглушение
      (меньше 15 баллов по шкале комы Глазго), травма в ДТП — или два дополнительных: возраст 40–60
      лет и потеря сознания. КТ ищет кровоизлияние внутри черепа — от него почти вся смертность
      при лёгкой травме; при сотрясении на КТ изменений нет. Где КТ нет, при показаниях везут в
      больницу с КТ и нейрохирургией.
  hint:
    ru: "Правило для удара по голове с потерей сознания, амнезией, рвотой, судорогами или оглушением: КТ нужна при одном основном признаке (старше 60 лет, рвота, судороги, антикоагулянты, оглушение, ДТП) или двух дополнительных (40–60 лет и потеря сознания)."
  yes: { ru: "КТ головного мозга нужна" }
  no: { ru: "Показаний к КТ нет: основных признаков нет, дополнительных меньше двух — можно лечить дома" }
  na: { ru: "Признаков черепно-мозговой травмы нет — правило не применяют: это ушиб мягких тканей" }
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.1: лёгкая ЧМТ — кратковременная потеря сознания и/или амнезия, включает сотрясение и лёгкий ушиб мозга; сотрясение — без видимых изменений на КТ; раздел 1.3: смертность при лёгкой ЧМТ практически исключительно от внутричерепных гематом; раздел 2.4 (УУР C, УДД 4): КТ при наличии факторов риска; картинка «Факторы риска»: основные — возраст > 60 лет, рвота, посттравматические судороги, антикоагулянтная терапия, ШКГ менее 15, опасный механизм (ДТП) и др., дополнительные — возраст 40–60 лет, потеря сознания и др.; табл. 1: ШКГ 15 и ≥ 1 основной или ≥ 2 дополнительных, ШКГ 13–14 — КТ; критерий качества 3: КТ при наличии факторов риска; раздел 6: транспортировка в стационар с КТ и нейрохирургическим отделением, амбулаторно — после КТ или при отсутствии показаний к ней; приложение Б: наблюдение не менее 24 часов" }
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1 (УУР C, УДД 5): терял ли сознание, была ли рвота, помнит ли обстоятельства травмы, двигательные и чувствительные расстройства; раздел 2: критерий диагноза раны — отсутствие признаков ЧМТ" }
  - { kind: paper, title: "Smits M, Dippel DW, Steyerberg EW, de Haan GG, Dekker HM, Vos PE, Kool DR, Nederkoorn PJ, Hofman PA, Twijnstra A, Tanghe HL, Hunink MG. Predicting intracranial traumatic findings on computed tomography in patients with minor head injury: the CHIP prediction rule. Ann Intern Med 2007;146(6):397–405", url: "https://pubmed.ncbi.nlm.nih.gov/17371884/", note: "PMID 17371884, сверено 29.09.2026: правило CHIP — основа списка факторов 734_2; 3 181 взрослый с лёгкой травмой головы (ШКГ 13–14 или 15 и хоть один фактор риска); находки на КТ — 7,6 %, нейрохирургическое вмешательство — 0,5 %; чувствительность для вмешательств — 100 %, КТ меньше на 23–30 %" }
review: draft
