id: rule.lysis_stroke
name: { ru: "Можно ли тромболизис при инсульте" }
complaints: [sym.weakness_one_side, sym.speech_trouble, sym.face_droop]
ageMin: 18
# противопоказания, названные в тексте 814_1 (spec 2026-10-chapter-3, часть 41а): кровь на КТ —
# абсолютное (раздел 2.4); гипогликемия — «маска» инсульта, глюкоза — единственный анализ перед
# тромболизисом (раздел 2.3); приём ПОАК меньше 48 часов назад и гипокоагуляция (раздел 3.1.2.1.1).
# Сводного списка в 814_1 нет — она отсылает к инструкции к алтеплазе; в игре — только названные в
# тексте. Давление выше 185/110, которое не удалось снизить, — с частью 43в
any: [img.ct_blood, lab.glucose_low, hx.anticoagulants, hx.bleeding_tendency]
decides: tx.thrombolysis_stroke
about: [cond.stroke_ischemic]
texts:
  summary:
    ru: >-
      Можно ли растворять тромб при ишемическом инсульте. Тромболизис делают в первые 4,5 часа от
      начала или от времени, когда человека видели здоровым. Перед ним — КТ головы: кровь внутри черепа —
      абсолютное противопоказание; глюкоза: гипогликемия бывает «маской» инсульта; расспрос об
      антикоагулянтах и кровоточивости. Есть хоть одно — тромболизис нельзя.
  hint:
    ru: "Перед тромболизисом при инсульте нужны КТ без крови, глюкоза и ответ на вопросы об антикоагулянтах и кровоточивости. Хоть одно противопоказание — растворять тромб нельзя."
  yes: { ru: "Тромболизис нельзя" }
  no: { ru: "Противопоказаний к тромболизису не нашли — его можно делать в первые 4,5 часа" }
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.4: острое внутричерепное кровоизлияние — абсолютное противопоказание к тромболизису; раздел 2.3: гипо- или гипергликемия — «маска» инсульта, уровень гликемии — единственный лабораторный показатель перед тромболизисом; раздел 3.1.2.1.1: противопоказан при гипокоагуляции, ПОАК — только если последний приём больше 48 часов назад; антиагреганты, возраст старше 80 лет и диабет — не причина отказа" }
review: draft
