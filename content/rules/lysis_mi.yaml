id: rule.lysis_mi
name: { ru: "Можно ли тромболизис при инфаркте" }
complaints: [sym.chest_pain_pressing]
# правило — при подъёме ST (157_5, раздел 3.1.3: ЭКГ-критерии ТЛТ); без него тромболизис не нужен, и о
# противопоказаниях не спрашивают, пока ЭКГ не готова
requires: [ecg.st_elevation]
onlyIfApplies: true
# противопоказания, которые узнают расспросом (раздел 3.1.3): абсолютные — инсульт, операция, травма
# или кровотечение за месяц, кровоточивость; относительное — пероральные антикоагулянты: взвешивать
# риск игра не умеет, поэтому и оно в игре — «нельзя». Расслоение аорты — с частью 43а, давление выше
# 180/110 «рефрактерное» — с частью 43б (снижать давление в игре пока нечем)
any: [hx.stroke_history, hx.recent_bleed_surgery, hx.bleeding_tendency, hx.anticoagulants]
decides: tx.thrombolysis
about: [cond.acs]
texts:
  summary:
    ru: >-
      Можно ли растворять тромб при инфаркте с подъёмом ST. Тромболизис делают, если до вмешательства
      в сосудистом центре дальше 120 минут и от начала боли прошло не больше 12 часов, — в первые 10
      минут после диагноза, а потом сразу везут. Нельзя при кровоизлиянии в мозг когда-либо или
      инфаркте мозга за полгода; при операции, серьёзной травме, ударе по голове или кровотечении из
      желудка за последний месяц; при кровоточивости; при подозрении на расслоение аорты. Осторожно —
      при приёме антикоагулянтов, беременности, давлении выше 180/110, которое не удалось снизить, и
      обострении язвенной болезни. С противопоказанием больного везут на вмешательство без тромболизиса.
  hint:
    ru: "Перед тромболизисом при инфаркте спрашивают о противопоказаниях: инсульт, операция, травма или кровотечение за последний месяц, кровоточивость, антикоагулянты. Есть хоть одно — растворять тромб нельзя."
  yes: { ru: "Тромболизис нельзя — везти на вмешательство без него" }
  no: { ru: "Противопоказаний к тромболизису не нашли — его можно делать" }
  na: { ru: "Подъёма ST на ЭКГ нет — тромболизис не нужен" }
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.1.3 (ЕОК IA): ТЛТ в пределах 10 минут от диагноза, если первичное ЧКВ невозможно в течение 120 минут и прошло не более 12 часов от начала симптомов, при отсутствии противопоказаний; абсолютные противопоказания — геморрагический инсульт или НМК неизвестной этиологии, ишемический инсульт за 6 месяцев, поражения ЦНС, недавняя серьёзная травма, операция, травма головы, ЖКК (за месяц), геморрагический диатез или кровоточивость, расслоение аорты, пункции некомпрессируемых сосудов за 24 часа; относительные — ТИА за 6 месяцев, пероральные антикоагулянты, беременность, рефрактерная АГ > 180/110, тяжёлое заболевание печени, инфекционный эндокардит, травматичная СЛР, обострение язвенной болезни" }
review: draft
