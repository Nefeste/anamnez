id: sym.transient_weakness
name: { ru: "Прошедшая слабость в руке и ноге" }
# жалоба транзиторной ишемической атаки (spec 2026-10-chapter-3, часть 41б): у болезней базы без ТИА её нет
leak: { pct: 0 }
triage: yellow
redFlag: true
salience: 3
attrs:
  side:
    right: { ru: "справа" }
    left: { ru: "слева" }
texts:
  hint:
    ru: "Рука и нога с одной стороны ненадолго ослабли и снова слушаются. Прошедшая слабость — не повод успокоиться: это может быть транзиторная ишемическая атака, а за ней в ближайшие дни бывает инсульт."
  complaint:
    - ru: "Утром отнялись рука и нога {side}, сейчас всё прошло"
    - ru: "Рука {side} вдруг перестала слушаться, нога подкашивалась — потом отпустило"
  present:
    - ru: "Была слабость в руке и ноге {side}, прошла"
  absent:
    - ru: "Слабости в руках и ногах не было"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 1.1: ТИА — кратковременный эпизод неврологического дефицита, симптомы длятся не больше 24 часов, на нейровизуализации нет острого инфаркта; раздел 1.6: симптомы могут быть преходящими — от секунд до часов" }
review: draft
