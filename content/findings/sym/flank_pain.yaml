texts:
  hint:
    ru: "Боль сбоку в пояснице, где почки. С температурой и ознобом — довод за пиелонефрит; с обеих сторон при высокой температуре, жажде и тумане перед глазами — за геморрагическую лихорадку с почечным синдромом; без температуры чаще болят мышцы спины."
  complaint:
    - ru: "Болит поясница {side}"
    - ru: "Ноет в боку, отдаёт в поясницу"
  present:
    - ru: "Боль в поясничной области {side}"
  absent:
    - ru: "В пояснице сбоку не болит"
sources:
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: тяжесть в пояснице в лихорадочном периоде, боли в пояснице — наиболее постоянный признак перехода в олигурический период; приложение А3: при пиелонефрите — односторонний характер боли" }
