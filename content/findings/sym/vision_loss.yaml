id: sym.vision_loss
name: { ru: "Почти ничего не видит" }
# офтальмическая форма отравления метанолом (spec 2026-10-chapter-4, часть 57в): «постепенно нарастающими тяжелыми нарушениями
# зрения, вплоть до полной слепоты с атрофией зрительных нервов»; «на следующий день просыпались слепыми» (873_1, раздел 1.5.1).
# Других причин внезапной слепоты в игре нет — без болезни не бывает: фон игровая оценка
leak: { pct: 0 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Зрение резко упало: различает только свет и тени или не видит совсем. После спиртного — отравление метанолом: страдает зрительный нерв, и чем быстрее снят ацидоз, тем больше зрения удаётся сохранить."
  complaint:
    - ru: "Проснул{ся|ась} и почти ничего не вижу"
    - ru: "Со вчерашнего дня вижу всё хуже — теперь только свет и тени"
  present:
    - ru: "Почти ничего не видит: различает только свет и тени"
  absent:
    - ru: "Зрение не падало"
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.5.1: средняя, офтальмическая форма — нарастающие тяжёлые нарушения зрения вплоть до полной слепоты, на следующий день просыпались слепыми, на 3–4-е сутки зрение могло вернуться и снова ухудшиться; раздел 3.2: степень нарушения зрения зависит от того, как быстро купирован ацидоз; фон — игровая оценка" }
