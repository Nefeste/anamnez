id: sym.fatigue_evening
name: { ru: "К вечеру и после нагрузки слабее" }
# патологическая утомляемость при миастении (spec 2026-10-chapter-4, часть 58в): «Типична динамичность этих симптомов с их нарастанием
# в течение дня» (165_2, раздел 1.6); «усилением слабости при физической нагрузке и уменьшением после отдыха и после сна» (раздел 2.2).
# Фон — игровая оценка
leak: { pct: 1 }
salience: 1
texts:
  hint:
    ru: "Утром сил больше, к вечеру веки опускаются, двоится, голос садится; после разговора или еды слабеет, после отдыха и сна легче. Так устают мышцы при миастении — это не обычная усталость."
  complaint:
    - ru: "К вечеру совсем слабею, после отдыха получше"
  present:
    - ru: "К вечеру и после нагрузки слабость сильнее, после отдыха легче"
  absent:
    - ru: "Слабость не зависит от времени дня и нагрузки"
review: draft
