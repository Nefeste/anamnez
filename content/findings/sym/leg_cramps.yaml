id: sym.leg_cramps
name: { ru: "Судороги в икрах" }
# судороги при обезвоживании (spec 2026-10-chapter-4, часть 49а): при II степени — икроножные мышцы, кратковременные, при III —
# продолжительные и болезненные, при IV — генерализованные клонические (875_1, приложение А3.1); о судорогах врач спрашивает
# прицельно (раздел 2.1). Фон — игровая оценка
leak: { pct: 2 }
salience: 1
texts:
  hint:
    ru: "Сводит икры, иногда и кисти: с водой при рвоте и поносе уходят соли. Короткие судороги бывают при обезвоживании средней тяжести, долгие и болезненные — при тяжёлом."
  complaint:
    - ru: "Сводит ноги"
  present:
    - ru: "Сводит икры, судороги болезненные"
  absent:
    - ru: "Судорог в ногах нет"
sources:
  - { kind: guideline, title: "Острые кишечные инфекции (ОКИ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/875_1", note: "ID 875_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.1: прицельно уточнить возникновение судорог; приложение А3.1: судороги по степеням обезвоживания — нет, икроножные кратковременные, продолжительные и болезненные, генерализованные клонические" }
review: draft
