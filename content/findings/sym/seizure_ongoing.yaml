id: sym.seizure_ongoing
name: { ru: "Судороги не прекращаются" }
# эпилептический статус судорожных приступов (spec 2026-10-chapter-3, часть 44в): приступ дольше 5 минут или
# приступы один за другим, и между ними человек не приходит в сознание (741_1, разделы 1.1.2 и 1.6.7: «Постановка
# диагноза ЭССП не вызывает затруднений»); о нём говорит бригада скорой. Красный; без статуса так не бывает
leak: { pct: 0 }
triage: red
redFlag: true
salience: 3
texts:
  hint:
    ru: "Эпилептический статус: приступ длится дольше 5 минут или приступы идут один за другим, а между ними человек не приходит в сознание. Чем дольше, тем сильнее страдает мозг: противосудорожное — сразу, потом палата интенсивной терапии."
  complaint:
    - ru: "Судороги не прекращаются больше пяти минут, между приступами в себя не приходит — привезла скорая"
    - ru: "Приступы идут один за другим, сознание не возвращается — бригада везёт с мигалкой"
  present:
    - ru: "Приступы один за другим, между ними в сознание не приходит"
  absent:
    - ru: "Судорог сейчас нет"
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 1.1.2: эпилептический статус — пролонгированный приступ или повторяющиеся приступы, в интервалах между которыми состояние не возвращается к исходному; у тонико-клонического t1 — 5 минут (время начала лечения), t2 — 30 минут; раздел 1.6.7: при эпилептическом статусе судорожных приступов приступы следуют один за другим, в промежутке пациент не приходит в сознание" }
