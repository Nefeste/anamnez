id: sym.hand_wound
name: { ru: "Рана на кисти" }
# жалоба травмы: без раны так не жалуются
leak: { pct: 0 }
salience: 3
texts:
  hint:
    ru: "Порез, укус или другая рана на кисти или пальце. Зашивать ли её, решают по тому, свежая ли она, чистая ли и сходятся ли края, а движения пальцев проверяют всегда: перерезанное сухожилие само не срастётся."
  complaint:
    - ru: "Поранил{|а} руку — кровит"
    - ru: "Рана на руке, сильно кровила"
  present:
    - ru: "Рана на кисти"
  absent:
    - ru: "Ран на кисти нет"
sources:
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: жалобы — рана на запястье и кисти, боль в области раны, кровотечение" }
review: draft
