id: sym.yellow_skin
name: { ru: "Пожелтели глаза и кожа" }
# желтуха, которую замечает сам больной (spec 2026-10-chapter-4, часть 52а): при гепатитах — «желтушностью склер, слизистых
# оболочек ротоглотки, а затем кожи» (718_2, раздел 1.6); с ней и приходят. Без болезни не бывает — фон игровая оценка
leak: { pct: 0 }
salience: 3
texts:
  hint:
    ru: "Сначала желтеют белки глаз, потом кожа; моча темнеет, кал светлеет. Желтуха после недомогания, тошноты и потери аппетита — вирусный гепатит; с приступом боли под рёбрами справа — камень в желчном протоке."
  complaint:
    - ru: "Пожелтели глаза, потом и кожа"
    - ru: "Говорят, я {весь жёлтый|вся жёлтая}, и глаза жёлтые"
  present:
    - ru: "Пожелтели белки глаз и кожа"
  absent:
    - ru: "Желтизны не замечал{|а}"
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: желтуха — сначала склеры и слизистые ротоглотки, затем кожа, нарастает быстро, за 2–3 дня до неё темнеет моча и светлеет кал; раздел 2: желтушность кожи и слизистых — критерий диагноза" }
