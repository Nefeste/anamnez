id: sym.pale_stool
name: { ru: "Светлый кал" }
# ахоличный кал при гепатитах (spec 2026-10-chapter-4, часть 52а): «испражнения - бесцветными» в желтушном периоде (718_2,
# раздел 1.6; 672_2, раздел 1.6). Без болезни печени и желчных путей не бывает — фон игровая оценка
leak: { pct: 0.3 }
salience: 2
texts:
  hint:
    ru: "Кал светлый, серо-белый, как глина: желчь не доходит до кишки. Вместе с тёмной мочой и желтухой — гепатит или камень, перекрывший желчный проток."
  complaint:
    - ru: "Кал стал светлый, почти белый"
  present:
    - ru: "Кал светлый, как глина"
  absent:
    - ru: "Кал обычного цвета"
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: испражнения становятся бесцветными (ахолия) в желтушном периоде, гипохоличными — за 2–3 дня до желтухи" }
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: кал на высоте желтухи становится ахоличным" }
review: draft
