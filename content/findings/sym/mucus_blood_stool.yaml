id: sym.mucus_blood_stool
name: { ru: "Стул скудный, со слизью и кровью" }
# колит при шигеллёзе (spec 2026-10-chapter-4, часть 49б): «не каловый слизисто-кровянистый стул („ректальный плевок“)»
# (869_1, раздел 2); гемоколит — у 70–75 % больных (раздел 1.6). Фон — кровь в стуле от других причин, игровая оценка
leak: { pct: 1 }
salience: 3
texts:
  hint:
    ru: "Стула мало, он почти без кала — слизь с прожилками крови. Так проявляется воспаление толстой кишки, прежде всего при шигеллёзе (дизентерии). Обильный водянистый стул без крови — скорее вирусная инфекция или сальмонеллёз."
  complaint:
    - ru: "В туалет бегаю постоянно, а выходит одна слизь с кровью"
    - ru: "Понос со слизью и кровью"
  present:
    - ru: "Стул скудный, слизь с прожилками крови"
  absent:
    - ru: "Ни слизи, ни крови в стуле нет"
sources:
  - { kind: guideline, title: "Шигеллез", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/869_1", note: "ID 869_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2: колитический синдром — не каловый слизисто-кровянистый стул («ректальный плевок»); раздел 1.6: гемоколит у 70–75 % больных" }
review: draft
