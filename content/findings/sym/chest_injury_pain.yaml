id: sym.chest_injury_pain
name: { ru: "Боль в груди после травмы" }
# жалоба травмы: без травмы так не жалуются
leak: { pct: 0 }
triage: yellow
salience: 3
attrs:
  side:
    right: { ru: "справа" }
    left: { ru: "слева" }
texts:
  hint:
    ru: "Боль в груди после удара или падения: сильнее в месте удара, при вдохе и кашле. Так болит и ушиб, и перелом рёбер; воздух или кровь в плевральной полости добавляют одышку. Отличают их осмотр и снимок."
  complaint:
    - ru: "Упал{|а} на бок — болит грудь {side}, больно вдохнуть"
    - ru: "Ударил{ся|ась} грудью — болит {side}, больно дышать и кашлять"
  present:
    - ru: "Боль в грудной клетке {side} после травмы, усиливается при дыхании"
  absent:
    - ru: "Грудь после травмы не болит"
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: боль сопровождает костную травму и пневмоторакс в 100 % случаев, выраженная боль в грудной клетке, наибольшая в месте перелома, усиливается при глубоком дыхании и кашле" }
review: draft
