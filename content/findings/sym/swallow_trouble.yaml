id: sym.swallow_trouble
name: { ru: "Трудно глотать" }
# бульбарный синдром при ботулизме (spec 2026-10-chapter-4, часть 51в): чувство «комка» в горле, затем затруднение глотания
# «твердой, сухой пищи» (911_1, раздел 1.6) — среднетяжёлое течение и тяжелее (раздел 1.5, приложение А3); фон — игровая оценка
leak: { pct: 1 }
salience: 3
texts:
  hint:
    ru: "Ком в горле, твёрдая и сухая еда не проходит, приходится запивать. При ботулизме глотание нарушается по порядку: сначала твёрдое, потом мягкое, жидкость — в последнюю очередь. Не проходит и вода — тяжёлое течение, реанимация."
  complaint:
    - ru: "Трудно глотать — ком в горле, еда не проходит"
  present:
    - ru: "Трудно глотать твёрдую пищу, ком в горле"
  absent:
    - ru: "Твёрдую еду глотает без труда"
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: дисфагия — от чувства «комка» в горле к затруднению глотания твёрдой, сухой пищи, затем мягкой и жидкой, питьё ограничивается в последнюю очередь; раздел 1.5, приложение А3: затруднение глотания твёрдой пищи — среднетяжёлое течение" }
review: draft
