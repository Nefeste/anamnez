id: sym.dark_urine
name: { ru: "Тёмная моча" }
# потемнение мочи при гепатитах (spec 2026-10-chapter-4, часть 52а): «за 2-3 дня до появления желтушности склер и кожных покровов»
# и всё темнее в желтушном периоде (718_2, раздел 1.6; 672_2, раздел 1.6). Темнеет и при обезвоживании — фон игровая оценка
leak: { pct: 0.3 }
salience: 3
texts:
  hint:
    ru: "Моча цвета крепкого чая или пива: в ней желчный пигмент. За 2–3 дня до желтухи и вместе с ней — гепатит; при обезвоживании моча тоже тёмная, но её мало и она не пенится жёлтым."
  complaint:
    - ru: "Моча тёмная, как пиво"
    - ru: "Моча стала цвета крепкого чая"
  present:
    - ru: "Моча тёмная, цвета крепкого чая"
  absent:
    - ru: "Моча обычного цвета"
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: за 2–3 дня до желтушности склер и кожи — потемнение мочи и светлый кал; в желтушном периоде цвет мочи становится всё более тёмным" }
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: в конце преджелтушного периода — тёмная моча и ахоличный кал; в желтушном периоде моча становится тёмной" }
