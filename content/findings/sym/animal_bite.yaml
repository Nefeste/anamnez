id: sym.animal_bite
name: { ru: "Укус животного" }
# жалоба травмы: без укуса так не жалуются
leak: { pct: 0 }
salience: 3
texts:
  hint:
    ru: "Рана от зубов собаки, кошки или дикого зверя — самая загрязнённая: во рту животного много бактерий, и через слюну передаётся бешенство. Её не зашивают сразу, а после укуса в голову или кисть сразу нужны и вакцина от бешенства, и иммуноглобулин."
  complaint:
    - ru: "Укусила собака"
    - ru: "Покусала собака"
  present:
    - ru: "Укус животного"
  absent:
    - ru: "Животные не кусали"
sources:
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.5: укушенная рана — максимальная степень инфицирования микрофлорой ротовой полости, возможно заражение вирусом бешенства" }
  - { kind: guideline, title: "Бешенство (гидрофобия) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/979_1", note: "ID 979_1, опубликованы 09.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 5.2: антирабическую помощь начинают немедленно при обращении по поводу укуса; приложение А3: любые укусы головы, лица, шеи, кисти, пальцев — категория 3, сразу иммуноглобулин и вакцина" }
