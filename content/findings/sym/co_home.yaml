id: sym.co_home
name: { ru: "Угорел у печи или мотора" }
# бытовой угарный газ (spec 2026-10-chapter-4, часть 57б): «выявление неисправностей или неправильной эксплуатации печей,
# отопительных приборов, работа двигателей внутреннего сгорания в плохо вентилируемых помещениях» (885_1, раздел 2). Скорая ставит
# диагноз по токсикологической обстановке (раздел 2.1) и говорит о ней при поступлении — жалоба события; но анамнез собрать удаётся
# «далеко не всегда» (там же): у болезни — не у каждого. Фон — игровая оценка
leak: { pct: 0.3 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Дома топили печь и рано закрыли заслонку, не тянет вытяжка газовой колонки или человек сидел в закрытом гараже с работающим мотором. Угарный газ не пахнет: головная боль и тошнота у всех, кто был рядом, — повод думать о нём."
  complaint:
    - ru: "Дома топили печь и рано закрыли заслонку — плохо всей семье"
    - ru: "Сидел{|а} в закрытом гараже с работающим мотором — стало плохо"
  present:
    - ru: "Дома топили печь и рано закрыли заслонку"
    - ru: "Сидел{|а} в закрытом гараже с работающим мотором"
    - ru: "Дома газовая колонка, вытяжка плохо тянет"
  absent:
    - ru: "Печей, газовых колонок и работающего мотора в закрытом помещении не было"
sources:
  - { kind: guideline, title: "Токсическое действие окиси углерода. Токсическое действие других газов, дымов и паров", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/885_1", note: "ID 885_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2: неисправные или неправильно используемые печи и отопительные приборы, двигатели внутреннего сгорания в плохо вентилируемых помещениях; раздел 2.1: в случае отравления угарным газом анамнез собрать далеко не всегда возможно; фон — игровая оценка" }
review: draft
