id: sym.syncope
name: { ru: "Обморок" }
# потеря сознания без травмы головы (spec 2026-10-chapter-3, часть 42б): у болезней базы — при желудочковой
# тахикардии; обмороки без болезни сердца (рефлекторные) в модели не разбираются — доля утечки, игровая оценка
leak: { pct: 0.1 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Человек ненадолго потерял сознание и упал, потом пришёл в себя. Бывает от волнения и духоты, а бывает от аритмии — желудочковой тахикардии: тогда сердце на секунды перестаёт качать кровь. После обморока нужна ЭКГ."
  complaint:
    - ru: "Потерял{|а} сознание, упал{|а}, потом {пришёл|пришла} в себя"
    - ru: "Был обморок — всё потемнело, {очнулся|очнулась} уже на полу"
  present:
    - ru: "Был обморок"
  absent:
    - ru: "Обмороков не было"
sources:
  - { kind: guideline, title: "Желудочковые нарушения ритма сердца. Внезапная сердечная смерть.", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/569_2", note: "ID 569_2, опубликованы 07.10.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6: учащённое сердцебиение, предобморочное состояние и обмороки — три наиболее важных симптома желудочковых аритмий; раздел 2.1: у больных со структурной патологией сердца и после инфаркта рассматривать желудочковую аритмию как причину синкопе; доля утечки — игровая оценка" }
review: draft
