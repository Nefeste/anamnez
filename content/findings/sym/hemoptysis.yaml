id: sym.hemoptysis
name: { ru: "Кровохарканье" }
# кровь в мокроте (spec 2026-10-chapter-3, часть 43б): у больных ТЭЛА — 5 % (PIOPED II, Stein 2007); мелкие эмболы
# дают кровоизлияния в альвеолы — «инфаркт лёгкого» (ESC 2019, раздел 3.3). У других болезней базы его нет; фон —
# игровая оценка: туберкулёз и рак лёгкого в игре не разбираются
leak: { pct: 0.05 }
