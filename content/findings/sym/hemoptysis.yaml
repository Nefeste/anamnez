texts:
  hint:
    ru: "Кашель с кровью: прожилки крови или сгустки в мокроте. Бывает при тромбоэмболии лёгочной артерии — в Женевской шкале это балл, — а ещё при туберкулёзе и раке лёгкого."
  complaint:
    - ru: "Кашляю с кровью"
    - ru: "В мокроте прожилки крови"
  present:
    - ru: "Кашель с кровью"
  absent:
    - ru: "Крови в мокроте нет"
sources:
