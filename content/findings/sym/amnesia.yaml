id: sym.amnesia
name: { ru: "Не помнит момент травмы" }
leak: { pct: 0 }
salience: 1
texts:
  hint:
    ru: "Амнезия — выпадение памяти на события до удара, во время него или сразу после. При сотрясении — от нескольких минут до часа. Помнит всё — довод против сотрясения, но не доказательство."
  present:
    - ru: "Не помнит, как получил{|а} травму и что было сразу после неё"
  absent:
    - ru: "Обстоятельства травмы помнит"
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: ретро-, кон-, антероградная амнезия на короткий период (от нескольких минут до 1 часа) — 30–50 % случаев; раздел 2.1: длительность посттравматической амнезии — важная прогностическая характеристика" }
review: draft
