id: sym.ear_pain_behind
name: { ru: "Боль за ухом" }
# бывает в день, когда перекосило лицо, или за 1–2 дня до того (spec 2026-10-chapter-3, часть 44б; 895_1,
# приложение В3): о ней спрашивают при перекошенном лице, сама по себе с ней в приёмное не приходят
leak: { pct: 2 }
salience: 1
texts:
  hint:
    ru: "Ноющая боль за ухом накануне или в день, когда перекосило лицо, — частое начало невропатии лицевого нерва. При инсульте её обычно нет."
  present:
    - ru: "За ухом болело — накануне и сегодня"
  absent:
    - ru: "За ухом не болело"
sources:
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6: боль в ухе или заушной области накануне или в момент развития асимметрии; приложение В3: в день заболевания или за 1–2 дня накануне" }
review: draft
