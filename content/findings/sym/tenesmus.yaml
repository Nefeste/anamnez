id: sym.tenesmus
name: { ru: "Тенезмы и ложные позывы" }
# колит при шигеллёзе (spec 2026-10-chapter-4, часть 49б): «тенезмы (тянущая судорожная боль в ректальной области), ложные
# позывы» (869_1, раздел 1.6); при сальмонеллёзе «тенезмы и ложные позывы отсутствуют» (700_3, раздел 1.6). Фон — игровая
# оценка
leak: { pct: 1 }
salience: 2
texts:
  hint:
    ru: "Мучительные позывы в туалет, после которых почти ничего не выходит, и тянущая боль в прямой кишке. Признак воспаления нижнего отдела толстой кишки — прежде всего при шигеллёзе."
  complaint:
    - ru: "Постоянно тянет в туалет, а сходить не получается"
  present:
    - ru: "Мучительные позывы в туалет, после них почти ничего не выходит"
  absent:
    - ru: "Ложных позывов нет"
sources:
  - { kind: guideline, title: "Шигеллез", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/869_1", note: "ID 869_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 1.6: появляются тенезмы (тянущая судорожная боль в ректальной области), ложные позывы; приложение А3: при шигеллёзе тенезмы характерны, при сальмонеллёзе — нет" }
review: draft
