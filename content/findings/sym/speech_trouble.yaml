id: sym.speech_trouble
name: { ru: "Внезапно нарушилась речь" }
# жалоба инсульта (часть 41а): у болезней базы без инсульта её нет
leak: { pct: 0 }
triage: red
redFlag: true
salience: 3
texts:
  hint:
    ru: "Речь вдруг стала невнятной, слова путаются или не находятся, человек не понимает, что ему говорят. Внезапное нарушение речи — признак инсульта, как и слабость с одной стороны."
  complaint:
    - ru: "Речь вдруг стала невнятной — родные заметили"
    - ru: "Внезапно не может подобрать слова, говорит не то"
  present:
    - ru: "Внезапно нарушилась речь"
  absent:
    - ru: "Речь не нарушалась"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 1.6, табл. 5: моторная и сенсорная афазия при инсульте в доминантном полушарии, дизартрия; приложение В: «заговорить»" }
review: draft
