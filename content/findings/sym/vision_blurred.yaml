id: sym.vision_blurred
name: { ru: "Пелена перед глазами" }
# острые нарушения зрения — осложнение АГ, требующее интенсивной терапии (62_3, раздел 6.2); фон — игровая оценка. С частью 57в —
# и при отравлении метанолом: «В случае если пациент предъявляет жалобы на нарушения зрения после приема спиртосодержащей» жидкости,
# «следует заподозрить возможное отравление метанолом» (873_1, раздел 2.1)
leak: { pct: 1 }
salience: 2
texts:
  hint:
    ru: "Видит как сквозь пелену, мелькают мушки, расплывается. При очень высоком давлении — признак того, что страдают сосуды глаза и мозга: это уже криз. При лихорадке с болью в пояснице «туман» перед глазами — довод за геморрагическую лихорадку с почечным синдромом. После спиртного — подозрение на отравление метанолом."
  complaint:
    - ru: "Перед глазами пелена, всё расплывается"
  present:
    - ru: "Перед глазами пелена и мушки, видит хуже обычного"
  absent:
    - ru: "Видит как обычно, пелены нет"
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 6.2: осложнения АГ, требующие интенсивной терапии, — в том числе острые нарушения зрения; раздел 3.7: злокачественная АГ — изменения на глазном дне, энцефалопатия; доля — игровая оценка" }
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: нарушения зрения — снижение остроты, «летающие мушки», туман перед глазами — на 2–7-й день болезни, важны для диагноза; приложение А3: нарушение зрения — при тяжёлой форме" }
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2.1: жалобы на нарушения зрения после спиртосодержащей жидкости — заподозрить отравление метанолом, хотя нарушения зрения бывают и при других состояниях с декомпенсированным ацидозом; раздел 1.5.1: при лёгкой форме — неясность видения, потемнение в глазах, мелькание мушек" }
review: draft
