id: sym.vision_blurred
name: { ru: "Пелена перед глазами" }
# острые нарушения зрения — осложнение АГ, требующее интенсивной терапии (62_3, раздел 6.2); фон — игровая оценка
leak: { pct: 1 }
salience: 2
texts:
  hint:
    ru: "Видит как сквозь пелену, мелькают мушки, расплывается. При очень высоком давлении — признак того, что страдают сосуды глаза и мозга: это уже криз."
  complaint:
    - ru: "Перед глазами пелена, всё расплывается"
  present:
    - ru: "Перед глазами пелена и мушки, видит хуже обычного"
  absent:
    - ru: "Видит как обычно, пелены нет"
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 6.2: осложнения АГ, требующие интенсивной терапии, — в том числе острые нарушения зрения; раздел 3.7: злокачественная АГ — изменения на глазном дне, энцефалопатия; доля — игровая оценка" }
review: draft
