id: sym.head_injury
name: { ru: "Травма головы" }
# жалоба травмы: без травмы так не жалуются
leak: { pct: 0 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Удар по голове при падении, в драке или аварии. За ним бывает и ушиб мягких тканей, и сотрясение головного мозга; отличают их расспрос о потере сознания, памяти и рвоте и неврологический осмотр."
  complaint:
    - ru: "Упал{|а} и ударил{ся|ась} головой"
    - ru: "Ударил{ся|ась} головой — болит место удара"
  present:
    - ru: "Травма головы: удар при падении или ударе"
  absent:
    - ru: "Головой не ударял{ся|ась}"
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1: при сборе анамнеза выявлять механизм повреждения, факт нарушения сознания и его длительность, посттравматическую амнезию" }
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.4: S00.0 — поверхностная травма волосистой части головы; раздел 2.1: терял ли пациент сознание, была ли рвота, помнит ли обстоятельства травмы; любого пациента с раной головы вести как пострадавшего с ЧМТ, пока не доказано её отсутствие" }
