id: sym.green_stool
name: { ru: "Обильный зловонный стул, зеленоватый" }
# сальмонеллёз (spec 2026-10-chapter-4, часть 49б): стул «обильный, водянистый, пенистый, зловонный, иногда с зеленоватым
# оттенком, имеющим вид „болотной тины“» (700_3, раздел 1.6); при шигеллёзе — скудный, со слизью и кровью (приложение А3).
# Фон — игровая оценка
leak: { pct: 1 }
salience: 1
texts:
  hint:
    ru: "Обильный жидкий стул с резким запахом, зеленоватый, как болотная тина, — так чаще выглядит стул при сальмонеллёзе. При шигеллёзе стул скудный, со слизью и кровью."
  complaint:
    - ru: "Стул жидкий, зелёный и очень пахнет"
  present:
    - ru: "Стул обильный, зеленоватый, с резким запахом"
  absent:
    - ru: "Стул без зелени и резкого запаха"
sources:
  - { kind: guideline, title: "Сальмонеллез у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/700_3", note: "ID 700_3, опубликованы 17.09.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 1.6: стул обильный, водянистый, пенистый, зловонный, иногда с зеленоватым оттенком («болотная тина»), тенезмов нет; приложение А3: у шигеллёза — скудный, со слизью и кровью" }
review: draft
