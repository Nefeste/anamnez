id: sym.seizure
name: { ru: "Судорожный приступ" }
# генерализованный тонико-клонический приступ, к приезду закончился (spec 2026-10-chapter-3, часть 44в): о нём
# рассказывают очевидцы — сначала тонические судороги, затем клонические, сознание нарушено; большинство приступов
# длится 2–5 минут (741_1, раздел 1.6.5.3). Жёлтый: приступ закончился, но причину ищут срочно; фон — игровая оценка
leak: { pct: 0 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Генерализованный судорожный приступ: человек теряет сознание, тело напрягается, потом ритмично дёргаются руки и ноги — обычно 2–5 минут. Бывает при эпилепсии, а впервые в жизни — и от гипогликемии, кровоизлияния, инсульта, опухоли, травмы. Первым делом — глюкоза; при первом приступе — КТ головы."
  complaint:
    - ru: "Упал{|а}, всё тело напряглось, потом дёргались руки и ноги — минуты две, — рассказывают очевидцы"
    - ru: "Был приступ судорог на улице, сейчас как будто спит — скорую вызвали прохожие"
  present:
    - ru: "Был судорожный приступ: тело напряглось, потом подёргивания рук и ног — со слов очевидцев"
  absent:
    - ru: "Судорог не было"
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6.5.3: генерализованный тонико-клонический приступ — тоническая, затем клоническая фаза, нарушение сознания, длительность большинства приступов — 2–5 минут; раздел 2.1: описание приступа пациентом и очевидцами; фон — игровая оценка" }
review: draft
