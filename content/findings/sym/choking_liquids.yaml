id: sym.choking_liquids
name: { ru: "Поперхивается водой" }
# тяжёлое течение ботулизма (spec 2026-10-chapter-4, часть 51в): нарушение глотания жидкости — «проглатываемая жидкость частично
# попадает в трахею, вызывая поперхивание, а частично выливается через нос» (911_1, раздел 1.6); «абсолютным показанием к
# госпитализации… в реанимационное отделение» (раздел 1.5)
leak: { pct: 0 }
salience: 3
texts:
  hint:
    ru: "Вода попадает «не в то горло», вызывает кашель и выливается через нос. При ботулизме жидкость перестаёт проходить последней — это уже тяжёлое течение: сразу реанимация, а дыхание может остановиться внезапно, без одышки и синевы."
  complaint:
    - ru: "Поперхиваюсь водой, она выливается через нос"
  present:
    - ru: "Поперхивается водой, жидкость выливается через нос"
  absent:
    - ru: "Воду пьёт без поперхивания"
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.5: нарушение глотания жидкости любой степени — абсолютное показание к госпитализации в реанимационное отделение; раздел 1.6: жидкость попадает в трахею, вызывая поперхивание, и выливается через нос; остановка дыхания может наступить без тахипноэ, цианоза и жалоб на нехватку воздуха" }
review: draft
