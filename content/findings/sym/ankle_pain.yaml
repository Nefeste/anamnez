id: sym.ankle_pain
name: { ru: "Боль в голеностопе после травмы" }
# жалоба травмы: без травмы так не жалуются
leak: { pct: 0 }
triage: yellow
salience: 3
attrs:
  side:
    right: { ru: "правую" }
    left: { ru: "левую" }
texts:
  hint:
    ru: "Боль в голеностопном суставе после того, как подвернулась стопа или человек упал. Так болит и растяжение связок, и перелом лодыжек: нужен ли снимок, подсказывают оттавские правила."
  complaint:
    - ru: "Подвернул{|а} {side} ногу — болит голеностоп"
    - ru: "Оступил{ся|ась} на лестнице, подвернул{|а} {side} ногу, голеностоп опух"
  present:
    - ru: "Боль в голеностопе: подвернул{|а} {side} ногу"
  absent:
    - ru: "Голеностоп не болит"
review: draft
