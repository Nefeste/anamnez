id: sym.headache_severe
name: { ru: "Сильная распирающая головная боль" }
# менингит (spec 2026-10-chapter-4, часть 50а): головная боль «диффузная, распирающая, постоянная, не снимающаяся другими
# анальгетиками и антипиретиками» на фоне интоксикации — повод заподозрить менингит (1020_1, раздел 2.1), к концу суток
# становится сильной (раздел 1.6). Внезапная, как удар, — другой признак, у кровоизлияния. Без болезни — игровая оценка
leak: { pct: 0 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Голова раскалывается вся, боль распирает изнутри, нарастает за часы и не проходит от обезболивающих; от света, звуков и движения хуже, бывает рвота. С температурой — повод искать менингит: ригидность затылка и другие менингеальные знаки."
  complaint:
    - ru: "Голова раскалывается, обезболивающие не помогают, от света и любого движения хуже"
    - ru: "Голова болит всё сильнее, распирает изнутри — такой боли не было никогда"
  present:
    - ru: "Головная боль сильная, распирающая, нарастает и не снимается обезболивающими"
  absent:
    - ru: "Сильной распирающей головной боли нет"
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 2.1 (УУР С, УДД 4–5): уточнить наличие сильной головной боли, тошноты и рвоты; сильная, диффузная, распирающая, постоянная, не снимающаяся анальгетиками и антипиретиками головная боль с рвотой на фоне интоксикации позволяет заподозрить ГФМИ, менингит; при сильной головной боли на фоне гипертермии — осмотр менингеальных знаков; раздел 1.6: головная боль быстро усиливается и к концу суток становится сильной, распирающей; без болезни — игровая оценка" }
