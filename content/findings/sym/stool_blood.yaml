id: sym.stool_blood
name: { ru: "Кровь в кале" }
# симптом тревоги при запоре (spec 2026-10-chapter-4, часть 55б): «примесь крови в кале» — к колоноскопии (274_3, разделы
# 2.1 и 2.4). Есть у каждого, у кого стул с кровью от болезней базы — шигеллёза, атаки язвенного колита, кровотечения из язвы;
# сама по себе о болезни не говорит — в выводе не участвует, нужна правилу колоноскопии. Фон — трещины, геморрой, рак кишки,
# которых в игре нет: игровая оценка
leak: { pct: 1 }
salience: 1
follows: [sym.mucus_blood_stool, sym.bloody_diarrhea, sym.melena]
evidence: false
texts:
  hint:
    ru: "Кровь в кале или на туалетной бумаге. Бывает от трещины или геморроя, но при запоре это симптом тревоги: нужна колоноскопия, чтобы не пропустить опухоль кишки."
  present:
    - ru: "В кале бывает кровь"
  absent:
    - ru: "Крови в кале не замечал{|а}"
sources:
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1: симптомы тревоги — примесь крови в кале, потеря более 10 % массы тела за 3 месяца и др., наследственная отягощённость по колоректальному раку; раздел 2.4 (УУР C, УДД 5): при них — колоноскопия; фон — игровая оценка" }
review: draft
