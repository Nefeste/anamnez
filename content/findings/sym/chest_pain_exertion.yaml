# Стенокардия напряжения (spec 2026-10-chapter-3, часть 39г): типичная — все три признака сразу (155_2,
# раздел 2.1): боль или дискомфорт за грудиной от 2 до 5 (меньше 20) минут; возникает при нагрузке или
# волнении; быстро проходит в покое или через 1–3 минуты после нитроглицерина. Та же жалоба — у впервые
# возникшей и утяжелившейся стенокардии, а это уже ОКС (154_4, раздел 1.5)
id: sym.chest_pain_exertion
name: { ru: "Боль за грудиной при нагрузке" }
leak: never
# срочность — красная, как у давящей боли: при сортировке стабильную от нестабильной не отличить, а
# нестабильная — ОКС, и ЭКГ ей — в первые 10 минут от первого контакта с медиком (154_4, раздел 2.4)
triage: red
salience: 3
texts:
  hint:
    ru: "Давит или жжёт за грудиной при быстрой ходьбе, на лестнице, на холоде или при волнении и проходит в покое за несколько минут или от нитроглицерина — стенокардия напряжения. Если такие боли появились впервые или стали чаще и сильнее — это уже острый коронарный синдром."
  complaint:
    - ru: "Когда иду быстро или по лестнице — давит за грудиной, постою — проходит"
    - ru: "На ходу, особенно на холоде, сжимает в груди, остановлюсь — отпускает"
  present:
    - ru: "Давящая боль за грудиной при нагрузке, в покое проходит за 2–5 минут"
  absent:
    - ru: "Боли за грудиной при нагрузке нет"
review: draft
