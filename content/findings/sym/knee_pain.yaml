id: sym.knee_pain
name: { ru: "Боль в колене после травмы" }
# жалоба травмы: без травмы так не жалуются
leak: { pct: 0 }
triage: yellow
salience: 3
attrs:
  side:
    right: { ru: "правое" }
    left: { ru: "левое" }
texts:
  hint:
    ru: "Боль в коленном суставе после удара, падения или когда колено подвернулось. Так болит и ушиб, и разрыв связок, и перелом надколенника: нужен ли снимок, подсказывают оттавские правила для колена."
  complaint:
    - ru: "Травмировал{|а} {side} колено — болит и опухло"
    - ru: "Болит {side} колено после травмы, больно ступить"
  present:
    - ru: "Травма колена: болит {side} колено"
  absent:
    - ru: "Колено не болит"
sources:
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: боль, болезненность в проекции суставной щели, в анамнезе — факт травмы; раздел 2: жалобы — боль, ограничение движений, припухлость, нестабильность, блокада" }
review: draft
