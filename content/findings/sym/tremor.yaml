id: sym.tremor
name: { ru: "Дрожь в руках" }
# вегетативный признак гипогликемии (spec 2026-10-chapter-3, часть 44а): «сердцебиение, дрожь, бледность кожи,
# потливость… сильный голод» (290_2, раздел 3.7; 286_3, раздел 3.6). Фон — тревога, алкоголь, щитовидная железа —
# игровая оценка
leak: { pct: 0.5 }
salience: 3
texts:
  hint:
    ru: "Руки трясутся мелкой дрожью. Внезапная дрожь с потом и голодом у больного диабетом — первый признак гипогликемии: сахар упал. Бывает и от волнения, кофе, алкоголя и при избытке гормонов щитовидной железы."
  complaint:
    - ru: "Вдруг затрясло, руки ходуном, накатила слабость"
    - ru: "Внезапно задрожали руки, сердце колотится"
  present:
    - ru: "Мелкая дрожь в руках"
  absent:
    - ru: "Дрожи нет"
sources:
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: вегетативные симптомы гипогликемии — сердцебиение, дрожь, бледность кожи, потливость, мидриаз, тошнота, сильный голод, беспокойство, тревога, агрессивность; фон — игровая оценка" }
review: draft
