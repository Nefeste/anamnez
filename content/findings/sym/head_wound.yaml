id: sym.head_wound
name: { ru: "Рана на голове" }
# жалоба травмы: без раны так не жалуются
leak: { pct: 0 }
# пока черепно-мозговая травма не исключена, пострадавшего ведут как с ЧМТ (733_2, раздел 2.1)
triage: yellow
salience: 3
texts:
  hint:
    ru: "Рана волосистой части головы после падения, удара или укуса. Кожа головы хорошо снабжается кровью, поэтому такие раны сильно кровят. Пока не доказано, что черепно-мозговой травмы нет, пострадавшего ведут как с ней: расспрос о сознании, памяти и рвоте и неврологический осмотр."
  complaint:
    - ru: "Поранил{|а} голову — кровит"
    - ru: "Рана на голове, долго кровила"
  present:
    - ru: "Рана на голове"
  absent:
    - ru: "Ран на голове нет"
sources:
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: хорошее кровоснабжение мешает спадению сосудов — значительное кровотечение; раздел 1.6: основные симптомы — боль в области раны и кровотечение; раздел 2.1 (УУР C, УДД 5): любого с открытой раной головы расценивать и лечить как пострадавшего с ЧМТ, пока не доказано её отсутствие" }
review: draft
