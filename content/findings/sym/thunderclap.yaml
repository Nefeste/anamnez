id: sym.thunderclap
name: { ru: "Внезапная сильнейшая головная боль" }
# типичное начало субарахноидального кровоизлияния (spec 2026-10-chapter-3, часть 41в): внезапная сильная
# головная боль «по типу удара в голову», «худшая головная боль в моей жизни» — у 70 % (523_3, раздел 1.6).
# У остальных болезней базы её нет; фон — игровая оценка: так болит голова и без кровоизлияния, но редко —
# у 1 из 2000 обратившихся (при 1 из 200 с неё начинал бы рассказ каждый 200-й больной поликлиники, и
# кровоизлияние за ней терялось бы)
leak: { pct: 0.05 }
triage: red
redFlag: true
salience: 3
texts:
  hint:
    ru: "Голова заболела вдруг, за секунды, как от удара, — сильнее, чем когда-либо в жизни. Так начинается кровоизлияние под оболочки мозга из аневризмы: сразу КТ головы. Мигрень так не начинается."
  complaint:
    - ru: "Голова заболела внезапно, как удар, — такой боли никогда не было"
    - ru: "Вдруг как ударило в голову — это худшая боль в моей жизни"
  present:
    - ru: "Головная боль началась внезапно, как удар, — сильнейшая в жизни"
  absent:
    - ru: "Головная боль нарастала постепенно"
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 1.6: типичные (70 %) и атипичные (30 %) проявления САК, при типичном — внезапная сильная головная боль «по типу удара в голову», «худшая головная боль в моей жизни», часто с рвотой, светобоязнью и утратой сознания" }
review: draft
