id: sym.hand_spasm
name: { ru: "Сводит кисти" }
# тетания (spec 2026-10-chapter-4, часть 56в): «Чаще всего судороги возникают в мышцах верхних конечностей, реже – в нижних»; кисть
# — «рукой акушера»: «пальцы сжаты и слегка приведены к ладони, I палец сведен, кисть согнута в лучезапястном суставе» (627_3,
# раздел 1.6.1). Жёлтый: тетания доходит и до ларингоспазма (раздел 1.6). Фон — игровая оценка
leak: { pct: 0.3 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Судорога сама складывает кисть: пальцы сжаты и прижаты к ладони, большой приведён — «рука акушера». Это тетания: в крови мало кальция, мышцы перевозбуждены. Опаснее всего, когда так же сводит мышцы гортани: ларингоспазм угрожает жизни."
  complaint:
    - ru: "Сводит руки, пальцы сами сжимаются"
    - ru: "Кисти свело судорогой, не могу разжать"
  present:
    - ru: "Кисти сводит судорогой: пальцы сжаты и прижаты к ладони — «рука акушера»"
  absent:
    - ru: "Судорог в кистях нет"
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 1.6: от карпопедального спазма до жизнеугрожающего ларингоспазма; раздел 1.6.1: приступы тетании, чаще в мышцах верхних конечностей, положение «рука акушера»; фон — игровая оценка" }
review: draft
