id: sym.pericardial_pain
name: { ru: "Острая боль в груди, легче сидя с наклоном вперёд" }
# боль при перикардите (spec 2026-10-chapter-3, часть 43д): острая, сильнее на вдохе, при кашле и лёжа, легче сидя с
# наклоном вперёд — у 85–90 % (ESC 2015, раздел 3.1); отдаёт в плечи и лопатку (746_2, раздел 1.6.1; табл. А3-1).
# Фон — игровая оценка
leak: { pct: 0.3 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Острая боль за грудиной или слева, сильнее на вдохе, при кашле и лёжа на спине, легче сидя с наклоном вперёд. Так болит воспалённый перикард — оболочка сердца. Боль при инфаркте давящая и от положения тела не зависит."
  complaint:
    - ru: "Колет за грудиной — сильнее, когда вдыхаю и когда лягу. Сяду, наклонюсь вперёд — легче"
    - ru: "Острая боль в груди, отдаёт в плечо. Лёжа не могу, легче сидя"
  present:
    - ru: "Острая боль за грудиной, сильнее на вдохе и лёжа, легче сидя с наклоном вперёд"
  absent:
    - ru: "Боль от положения тела и дыхания не зависит"
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6.1: типична острая разлитая боль, иррадиирует в плечи, лопатку, спину, усиливается на вдохе, при кашле и глотании; табл. А3-1: начало острое, но не внезапное, боль постоянная, дни; фон — игровая оценка" }
  - { kind: guideline, title: "Adler Y, Charron P, Imazio M et al. 2015 ESC Guidelines for the diagnosis and management of pericardial diseases. Eur Heart J 2015;36(42):2921–2964", url: "https://pubmed.ncbi.nlm.nih.gov/26320112/", note: "PMID 26320112, PMC7539677, сверено 05.10.2026; раздел 3.1: боль в груди — больше чем у 85–90 %, обычно острая, плевритическая, легче сидя с наклоном вперёд" }
review: draft
