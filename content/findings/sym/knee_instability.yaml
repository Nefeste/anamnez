texts:
  hint:
    ru: "Колено «подламывается» при шаге или повороте, будто выскакивает из сустава. Главная жалоба при разрыве связок, особенно передней крестообразной."
  complaint:
    - ru: "Колено подкашивается, будто выскакивает"
  present:
    - ru: "Чувство подкашивания и неустойчивости в колене"
  absent:
    - ru: "Колено не подкашивается"
sources:
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1 (УУР C, УДД 5): у всех уточнить жалобы на чувство подкашивания, неустойчивости; прил. В: основная жалоба — нестабильность коленного сустава" }
