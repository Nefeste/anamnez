id: sym.night_sweats
name: { ru: "Ночная потливость" }
# «ночные поты» — при снижении температуры во сне обильный пот (КР «Туберкулез у взрослых», 16_4, раздел 1.6); фон —
# игровая оценка: потеют ночью и при других инфекциях, в климаксе, при тревоге
leak: { pct: 2 }
salience: 1
texts:
  hint:
    ru: "Ночью просыпается мокрым, приходится менять бельё. Вместе с похуданием и долгой небольшой температурой — признак хронической инфекции, прежде всего туберкулёза."
  present:
    - ru: "По ночам просыпаюсь мокр{ым|ой} от пота"
    - ru: "Ночью сильно потею, меняю бельё"
  absent:
    - ru: "Ночью не потеет"
sources:
  - { kind: guideline, title: "Туберкулез у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/16_4", note: "ID 16_4, опубликованы 16.01.2026, применяются; сверено с рубрикатором 20.11.2026 по карточке, которую прислал владелец (вопрос 78), текст — по копии документа; раздел 1.6: лихорадка чаще субфебрильная, к вечеру; при снижении температуры, как правило во сне, — обильный пот, симптом «ночных потов»" }
review: draft
