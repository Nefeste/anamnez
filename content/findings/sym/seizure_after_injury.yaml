id: sym.seizure_after_injury
name: { ru: "Судороги сразу после травмы" }
leak: { pct: 0 }
salience: 1
texts:
  hint:
    ru: "Судорожный приступ сразу после удара по голове. Бывает у 1–2 % сотрясений и на их исход не влияет, но это основной признак в правиле, кому нужна компьютерная томография."
  present:
    - ru: "Сразу после удара были судороги — со слов очевидцев"
  absent:
    - ru: "Судорог не было"
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: судорожный приступ сразу после травматического события — 1–2 % случаев, не влияет на исход и риск посттравматической эпилепсии; раздел 2.4: посттравматические судороги — основной фактор риска для КТ" }
review: draft
