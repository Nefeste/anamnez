id: sym.palpitations
name: { ru: "Сердцебиение и перебои" }
# с чем приходят при фибрилляции и трепетании предсердий (spec 2026-10-chapter-3, часть 42а): у болезней
# базы без них его нет, у здоровых бывает — игровая оценка
leak: { pct: 0.3 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Сердце колотится часто, неровно, с перебоями. Так чувствуют нарушения ритма — фибрилляцию и трепетание предсердий; что за ритм, покажет ЭКГ. Бывает и без болезни сердца: после кофе, при волнении."
  complaint:
    - ru: "Сердце колотится и бьётся неровно"
    - ru: "Перебои в сердце: то частит, то замирает"
  present:
    - ru: "Сердцебиение, перебои в работе сердца"
  absent:
    - ru: "Сердцебиения и перебоев нет"
sources:
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 2.1: ощущения сердцебиения, одышки, тяжести в груди, слабости; у ряда пациентов симптомов нет совсем; доля утечки — игровая оценка" }
review: draft
