id: sym.palpitations
name: { ru: "Сердцебиение" }
# с чем приходят при нарушениях ритма (spec 2026-10-chapter-3, части 42а и 42б): у болезней базы без них его нет,
# у здоровых бывает — игровая оценка
leak: { pct: 0.3 }
triage: yellow
salience: 3
# какое (часть 42б): при фибрилляции и трепетании предсердий — неровно, с перебоями; при приступе
# наджелудочковой и желудочковой тахикардии — часто и ровно (619_3, раздел 1.6.5: внезапное начало и такое же
# внезапное окончание приступа)
attrs:
  rhythm:
    irregular: { ru: "неровно, с перебоями" }
    regular: { ru: "часто-часто и ровно" }
# записи из сохранений до 0.3.14 ритма не знают: сердцебиение тогда было только при фибрилляции
fallback: { rhythm: irregular }
texts:
  hint:
    ru: "Сердце колотится: часто и неровно, с перебоями — или часто и ровно, приступом, который внезапно начинается и так же внезапно кончается. Так чувствуют нарушения ритма; что за ритм, покажет ЭКГ. Бывает и без болезни сердца: после кофе, при волнении."
  complaint:
    - ru: "Сердце колотится — {rhythm}"
    - ru: "Сердцебиение: сердце стучит {rhythm}"
  present:
    - ru: "Сердцебиение: сердце бьётся {rhythm}"
  absent:
    - ru: "Сердцебиения нет"
sources:
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 2.1: ощущения сердцебиения, одышки, тяжести в груди, слабости; у ряда пациентов симптомов нет совсем; доля утечки — игровая оценка" }
  - { kind: guideline, title: "Наджелудочковые тахикардии", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/619_3", note: "ID 619_3, опубликованы 17.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.1: ощущение сердцебиения, дискомфорт в груди, одышка, головокружение; раздел 1.6.5: внезапное начало и такое же внезапное окончание приступа; пароксизмальные НЖТ обычно симптомны" }
review: draft
