id: sym.foot_pain
name: { ru: "Боль в стопе после травмы" }
# жалоба травмы: без травмы так не жалуются
leak: { pct: 0 }
triage: yellow
salience: 3
attrs:
  side:
    right: { ru: "правую" }
    left: { ru: "левую" }
texts:
  hint:
    ru: "Боль в среднем отделе стопы после того, как подвернулась стопа или на неё упало тяжёлое. Так болит и ушиб, и перелом плюсневой кости: нужен ли снимок стопы, подсказывают оттавские правила."
  complaint:
    - ru: "Подвернул{|а} {side} ногу — болит стопа снаружи"
    - ru: "Оступил{ся|ась}, подвернул{|а} стопу — больно наступать на {side} ногу"
  present:
    - ru: "Боль в стопе после травмы: подвернул{|а} {side} ногу"
  absent:
    - ru: "Стопа не болит"
review: draft
