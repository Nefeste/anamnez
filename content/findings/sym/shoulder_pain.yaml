id: sym.shoulder_pain
name: { ru: "Боль над ключицей после падения на плечо" }
# жалоба травмы: без травмы так не жалуются
leak: { pct: 0 }
triage: yellow
salience: 3
attrs:
  side:
    right: { ru: "правое" }
    left: { ru: "левое" }
texts:
  hint:
    ru: "Боль над ключицей и в плече после падения на плечо. Так болит и ушиб, и перелом ключицы: отличают их осмотр и снимок."
  complaint:
    - ru: "Упал{|а} на {side} плечо — больно над ключицей"
    - ru: "Упал{|а} с велосипеда на {side} плечо — больно поднять руку"
  present:
    - ru: "Боль над ключицей после падения на {side} плечо"
  absent:
    - ru: "Плечо и ключица не болят"
sources:
  - { kind: guideline, title: "Переломы ключицы и лопатки", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/853_1", note: "ID 853_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: жалобы на боли в области ключицы и/или плечевого сустава, нарушение функции верхней конечности" }
review: draft
