id: sym.orthopnea
name: { ru: "Одышка лёжа" }
# ортопноэ и одышка по ночам — признаки застоя по малому кругу (spec 2026-10-chapter-3, часть 43в; 156_2, раздел
# 7.3.1); специфичность — 89 %, чувствительность низкая (раздел 1.6). Фон — игровая оценка
leak: { pct: 0.5 }
triage: yellow
salience: 2
texts:
  hint:
    ru: "Лёжа дышать тяжелее: человек спит полусидя, на нескольких подушках, а ночью просыпается от удушья и садится. Так застаивается кровь в лёгких, когда сердце не справляется."
  complaint:
    - ru: "Лёжа задыхаюсь — сплю сидя, на трёх подушках"
    - ru: "Ночью просыпаюсь — нечем дышать, сяду — отпускает"
  present:
    - ru: "Лёжа одышка сильнее, спит полусидя"
  absent:
    - ru: "Лёжа одышка не усиливается"
sources:
  - { kind: guideline, title: "Хроническая сердечная недостаточность", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/156_2", note: "ID 156_2, опубликованы 07.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6: ортопноэ — специфичность 89 %, чувствительность признаков низкая; раздел 7.3.1: ортопноэ и пароксизмальная одышка по ночам — признаки застоя по малому кругу; фон — игровая оценка" }
review: draft
