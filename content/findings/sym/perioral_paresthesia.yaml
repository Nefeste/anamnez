id: sym.perioral_paresthesia
name: { ru: "Покалывание вокруг рта и в пальцах" }
# «Самой частой жалобой пациентов с гипопаратиреозом является наличие судорог и/или парестезий в мышцах верхних и нижних
# конечностей, околоротовой области» (spec 2026-10-chapter-4, часть 56в; 627_3, раздел 2.1); при остром кризе тетании «могут
# предшествовать парестезии лица, кистей и стоп» (раздел 1.6.1). Фон — игровая оценка
leak: { pct: 1 }
salience: 3
texts:
  hint:
    ru: "Немеют губы, колет кончики пальцев рук и ног. Так бывает, когда в крови мало кальция, — чаще всего после операции на щитовидной железе. Следом может свести судорогой кисти."
  complaint:
    - ru: "Немеют губы, колет пальцы"
    - ru: "Покалывает вокруг рта и в пальцах рук"
  present:
    - ru: "Покалывание и онемение вокруг рта и в пальцах"
  absent:
    - ru: "Онемения и покалывания нет"
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2.1: самая частая жалоба — судороги и/или парестезии в мышцах конечностей и околоротовой области, парестезии лица и конечностей позволяют заподозрить гипокальциемию; раздел 1.6.1: тетании могут предшествовать парестезии лица, кистей и стоп; фон — игровая оценка" }
review: draft
