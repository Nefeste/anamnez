id: sym.insomnia
name: { ru: "Не спит ночами" }
# бессонница — признак синдрома отмены алкоголя (spec 2026-10-chapter-4, часть 54б): «бессонница» (784_1, раздел 2);
# «прерывистый, поверхностный, тревожный сон; яркие, беспокойные, пугающие сновидения» (раздел 1.6). И при печёночной
# энцефалопатии: «бессонницу ночью и сонливость в дневные часы» (715_2, раздел 2.1). Фон — игровая оценка
leak: { pct: 2 }
salience: 2
texts:
  hint:
    ru: "Не может уснуть, сон прерывистый и тревожный, с кошмарами. Бывает от волнения и боли; у пьющего, который бросил пить, — признак синдрома отмены алкоголя, у больного циррозом с сонливостью днём — печёночной энцефалопатии."
  complaint:
    - ru: "Вторую ночь не сплю, а задремлю — снятся кошмары"
    - ru: "Не могу уснуть, сон рваный, тревожный"
  present:
    - ru: "Не спит ночами, сон тревожный, с кошмарами"
  absent:
    - ru: "Сон обычный"
sources:
  - { kind: guideline, title: "Психические и поведенческие расстройства, вызванные употреблением алкоголя. Синдром отмены алкоголя (алкогольное абстинентное состояние)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/784_1", note: "ID 784_1, опубликованы 20.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: прерывистый, поверхностный, тревожный сон, яркие, беспокойные, пугающие сновидения; раздел 2: бессонница — среди признаков синдрома отмены; фон — игровая оценка" }
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1: при декомпенсации — бессонница ночью и сонливость в дневные часы" }
