id: sym.anxiety
name: { ru: "Тревога, не находит себе места" }
# симптом синдрома отмены алкоголя (spec 2026-10-chapter-4, часть 54б): «тревога» — в списке признаков (784_1, раздел 2),
# пункт 4 шкалы CIWA-Ar (приложение Г1). Бывает и от волнения, и при тревожных расстройствах, которых в игре нет: фон —
# игровая оценка
leak: { pct: 1 }
salience: 2
texts:
  hint:
    ru: "Человек встревожен без видимой причины, не находит себе места, не может усидеть. Так бывает от волнения и при тревожном расстройстве, а у пьющего, который бросил пить, — при синдроме отмены алкоголя, вместе с дрожью рук, потом и бессонницей."
  complaint:
    - ru: "Тревожно, места себе не нахожу"
    - ru: "Накатывает страх, не могу усидеть на месте"
  present:
    - ru: "Встревожен{|а}, не находит себе места"
  absent:
    - ru: "{Спокоен|Спокойна}, тревоги нет"
sources:
  - { kind: guideline, title: "Психические и поведенческие расстройства, вызванные употреблением алкоголя. Синдром отмены алкоголя (алкогольное абстинентное состояние)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/784_1", note: "ID 784_1, опубликованы 20.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2: тревога — среди признаков синдрома отмены; приложение Г1: пункт 4 шкалы CIWA-Ar — тревога; фон — игровая оценка" }
