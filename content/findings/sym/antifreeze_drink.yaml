id: sym.antifreeze_drink
name: { ru: "Пил антифриз или тормозную жидкость" }
# что выпил (spec 2026-10-chapter-4, часть 57в): этиленгликоль — в антифризах, тормозных, амортизаторных и гидравлических
# жидкостях, и «В большинстве случаев отравление этиленгликолем (антифризами) происходит при приеме его внутрь в целях опьянения»
# (873_1, раздел 1.2). О выпитом говорят скорая и родные — жалоба события. Фон — игровая оценка
leak: { pct: 0.02 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Выпил антифриз, тормозную или другую техническую жидкость — обычно чтобы опьянеть. В них этиленгликоль: сладковатый на вкус, сначала пьянит, а через несколько часов — рвота, сильная боль в животе и пояснице, судороги и кома, потом страдают почки."
  complaint:
    - ru: "Выпил{|а} антифриз вместо спиртного — привезла скорая"
    - ru: "Выпил{|а} тормозную жидкость — вызвали скорую"
  present:
    - ru: "Пил{|а} антифриз"
    - ru: "Пил{|а} тормозную жидкость"
  absent:
    - ru: "Антифриз и тормозную жидкость не пил{|а}"
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.2: этиленгликоль — в антифризах, тормозных, амортизаторных и гидравлических жидкостях, отравление в большинстве случаев — при приёме внутрь в целях опьянения; раздел 1.3: сладковатый вкус; раздел 1.6.2: опьянение, затем рвота, боли в животе и пояснице, судороги и кома, гепаторенальная фаза; фон — игровая оценка" }
review: draft
