id: sym.dyspnea_sudden
name: { ru: "Одышка началась внезапно" }
# одышка за секунды или минуты (spec 2026-10-chapter-3, часть 43б): у больных ТЭЛА с одышкой — у 72 % (PIOPED II,
# Stein 2007). У других болезней базы одышка нарастает часами и днями; фон — игровая оценка: так задыхаются и при
# панической атаке, и при спонтанном пневмотораксе, которых в игре нет
leak: { pct: 0.1 }
triage: yellow
redFlag: true
salience: 3
texts:
  hint:
    ru: "Дышать стало тяжело вдруг — за секунды или минуты, а не за дни, как при простуде и пневмонии. Так часто начинается тромбоэмболия лёгочной артерии: при внезапной одышке считают Женевскую шкалу и смотрят ноги."
  complaint:
    - ru: "Вдруг стало нечем дышать — за пару минут"
    - ru: "Резко начал{|а} задыхаться, прямо на ровном месте"
  present:
    - ru: "Одышка началась внезапно — за минуты"
  absent:
    - ru: "Одышка не начиналась внезапно"
sources:
  - { kind: paper, title: "Stein PD, Beemath A, Matta F и др. Clinical characteristics of patients with acute pulmonary embolism: data from PIOPED II. Am J Med 2007;120(10):871–879", url: "https://pubmed.ncbi.nlm.nih.gov/17904458/", note: "PMID 17904458, сверено 05.10.2026: 133 больных ТЭЛА без прежних болезней сердца и лёгких; одышка — у 73 %; из 92 с одышкой она началась за секунды у 46 %, за минуты — у 26 %, за часы — у 11 %, за дни — у 17 %; доля утечки — игровая оценка" }
review: draft
