id: sym.leg_pain
name: { ru: "Боль в ноге" }
# жалоба тромбоза глубоких вен, тромбофлебита и надрыва икроножной мышцы (часть 33а); без них так
# не жалуются — у травм свои жалобы
leak: { pct: 0 }
triage: yellow
salience: 3
attrs:
  side:
    right: { ru: "правая" }
    left: { ru: "левая" }
texts:
  hint:
    ru: "Болит голень или вся нога — без удара или после рывка. Так болит тромбоз глубоких вен, воспаление подкожной вены и надрыв икроножной мышцы: различают их осмотр, расспрос, шкала Уэллса с D-димером и УЗИ вен."
  complaint:
    - ru: "Болит {side} нога, ходить трудно"
    - ru: "Ноет {side} нога, больно наступать"
  present:
    - ru: "Болит {side} нога"
  absent:
    - ru: "Ноги не болят"
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1: жалобы — отёк конечности, боли распирающего характера в конечности или икроножных мышцах, снижение подвижности из-за отёка и боли" }
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1: боль и покраснение по ходу тромбированных вен" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: при повреждении мышцы — острая боль в момент травмы, напряжённость мышцы при нагрузке" }
review: draft
