id: sym.tearing_pain
name: { ru: "Внезапная рвущая боль в груди или спине" }
# начало расслоения аорты (spec 2026-10-chapter-3, часть 43а): резко начавшаяся сильная боль в груди и/или в
# спине, острая, разрывающая, «как удар ножом», максимальная в начале (946_1, разделы 1.6 и 2.1). У остальных
# болезней базы её нет; фон — игровая оценка, как у внезапной головной боли: так болит и без расслоения, но
# редко — у 1 из 2000 обратившихся
leak: { pct: 0.05 }
triage: red
redFlag: true
salience: 3
# где болит: спереди в груди — чаще при типе A, в спине — при типе B (946_1, раздел 1.6)
attrs:
  site:
    chest: { ru: "грудь" }
    back: { ru: "спину между лопатками" }
texts:
  hint:
    ru: "Боль в груди или спине началась вдруг и сразу во всю силу — рвёт, режет, как ножом. Так начинается расслоение аорты: давление на обеих руках и КТ-ангиография. Боль инфаркта чаще давит и нарастает."
  complaint:
    - ru: "Вдруг как ножом ударило в {site} — сразу со всей силы"
    - ru: "Резко рвануло в {site}, такой боли никогда не было"
  present:
    - ru: "Боль ударила в {site} внезапно, сразу во всю силу — рвущая"
  absent:
    - ru: "Внезапной рвущей боли в груди и спине нет"
sources:
  - { kind: guideline, title: "Расслоение аорты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/946_1", note: "ID 946_1, опубликованы 23.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6: резко начавшаяся сильная боль в груди и/или в спине — наиболее типичная, острая, разрывающая, похожая на удар ножом, резкость начала — самая специфичная черта; грудь — 80 %, спина — 40 %, живот — 25 %; раздел 2.1: максимальная в начале; доля утечки — игровая оценка" }
review: draft
