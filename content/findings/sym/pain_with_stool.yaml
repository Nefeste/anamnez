id: sym.pain_with_stool
name: { ru: "Боль в животе связана со стулом — полгода и дольше" }
# синдром раздражённого кишечника по Римским критериям IV (spec 2026-10-chapter-4, часть 55б): повторяющаяся боль в животе
# «по меньшей мере 1 раз в неделю», которая «Связана с дефекацией», «с изменением частоты стула», «с изменением формы стула» —
# двумя или более; «последние 3 месяца при общей продолжительности не менее 6 месяцев» (892_1, раздел 2). В игре это один
# признак и только СРК: органических болезней с такой картиной в базе нет — фона нет
leak: never
salience: 0
texts:
  hint:
    ru: "Римские критерии IV: боль в животе раз в неделю и чаще связана со стулом — стихает после него, меняется частота или вид стула; так последние 3 месяца, а началось не меньше полугода назад. Без симптомов тревоги это синдром раздражённого кишечника."
  present:
    - ru: "Полгода и дольше живот болит раз в неделю и чаще; после туалета легче, стул то чаще, то реже"
  absent:
    - ru: "Долгой боли в животе, связанной со стулом, нет"
sources:
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2: Римские критерии IV — рецидивирующая боль в животе не реже 1 раза в неделю, связанная с дефекацией, изменением частоты или формы стула (два признака или больше), последние 3 месяца при общей длительности не менее 6 месяцев" }
review: draft
