id: sym.dry_mouth
name: { ru: "Сухость во рту" }
# ботулизм (spec 2026-10-chapter-4, часть 51в): «нарушение глотания и сухость во рту - столь же ранний симптом, как и
# расстройство зрения»; сухость — иногда раньше поноса и рвоты (911_1, раздел 1.6). Сухо во рту бывает от жажды и лекарств —
# фон игровая оценка
leak: { pct: 3 }
salience: 2
texts:
  hint:
    ru: "Во рту сухо, слюны почти нет, язык шершавый. Бывает от жажды, обезвоживания, лекарств. Вместе с двоением в глазах и трудным глотанием — ботулизм: токсин выключает слюнные железы раньше мышц."
  complaint:
    - ru: "Во рту пересохло, слюны совсем нет"
  present:
    - ru: "Во рту сухо, слюны почти нет"
  absent:
    - ru: "Сухости во рту нет"
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: нарушение глотания и сухость во рту — столь же ранний симптом, как расстройство зрения; гипосаливация появляется несколько раньше паралитического синдрома, иногда даже раньше поноса и рвоты" }
review: draft
