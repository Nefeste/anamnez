id: sym.loss_of_consciousness
name: { ru: "Потеря сознания при травме" }
# только при черепно-мозговой травме: обмороков без травмы в модели нет
leak: { pct: 0 }
salience: 1
texts:
  hint:
    ru: "Человек ненадолго отключился в момент удара — на секунды или минуты. Признак сотрясения головного мозга: при ушибе мягких тканей головы сознание не теряют."
  present:
    - ru: "В момент удара ненадолго потерял{|а} сознание"
  absent:
    - ru: "Сознание не терял{|а}"
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.1: лёгкая ЧМТ — кратковременная потеря сознания (до 30 минут) и/или амнезия (до 24 часов); раздел 1.6: нарушения сознания — примерно у 90 % с сотрясением, кратковременная утрата сознания в момент травмы — у 70 %" }
review: draft
