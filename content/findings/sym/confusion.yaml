id: sym.confusion
name: { ru: "Спутанность сознания" }
# нейрогликопения (spec 2026-10-chapter-3, часть 44а): «растерянность, дезориентация, дизартрия… спутанность сознания,
# кома» (290_2, раздел 3.7) — о ней говорят родные или бригада. Красный: новая спутанность — 3 балла NEWS2 (часть 27).
# Фон — игровая оценка
leak: { pct: 0 }
triage: red
redFlag: true
salience: 3
texts:
  hint:
    ru: "Человек не понимает, где он и какой сегодня день, отвечает невпопад, не узнаёт близких. Так бывает при гипогликемии, инсульте, инфекции, отравлении, после судорожного приступа. Первым делом — сахар глюкометром: гипогликемию лечат за минуты."
  complaint:
    - ru: "Стал{|а} заговариваться, не понимает, где находится, — привезли родные"
    - ru: "Сидит, на вопросы отвечает невпопад, {весь|вся} в поту — вызвали скорую соседи"
  present:
    - ru: "Спутанность: отвечает невпопад, не знает, где находится и какой день"
  absent:
    - ru: "Ориентирован{|а} в месте и времени"
sources:
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: нейрогликопенические симптомы — растерянность, дезориентация, дизартрия, нарушение координации, спутанность сознания, кома, возможны судороги; раздел 6: экстренная госпитализация при гипогликемии с дезориентацией и нарушением сознания" }
