id: sym.found_unconscious
name: { ru: "Нашли без сознания" }
# жалоб нет: скорую вызывают родные, знакомые или прохожие, заметив нарушение сознания (spec 2026-10-chapter-4, часть 57а; 743_2,
# раздел 2.1); «В большинстве случаев пациенты с острым отравлением опиоидными наркотическими веществами поступают в критическом
# состоянии» (раздел 1.3). Красный: без сознания. Фона нет — только от болезни
leak: { pct: 0 }
triage: red
salience: 3
texts:
  hint:
    ru: "Человека нашли без сознания, и рассказать он ничего не может: кто вызвал скорую, тот и говорит. Без сознания бывают от отравления, гипогликемии, инсульта, травмы головы. Первым делом — дыхание, зрачки и сахар крови."
  complaint:
    - ru: "Нашли без сознания — скорую вызвали соседи"
    - ru: "Знакомые не смогли разбудить — вызвали скорую"
  present:
    - ru: "Нашли без сознания — со слов тех, кто вызвал скорую"
  absent:
    - ru: "Сознание не терял{|а}"
sources:
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 1.3: в большинстве случаев поступают в критическом состоянии; раздел 2.1: жалоб пациент не предъявляет, помощь вызывают родственники или знакомые, заметив нарушение сознания" }
review: draft
