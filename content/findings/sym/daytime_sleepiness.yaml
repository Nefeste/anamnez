id: sym.daytime_sleepiness
name: { ru: "Днём сонлив, ночью не спит, путает дни" }
# начало явной печёночной энцефалопатии (spec 2026-10-chapter-4, часть 54а): вторая стадия по West Haven — вялость, апатия,
# дезориентация во времени (715_2, раздел 1.5, табл. 2); при декомпенсации — «бессонницу ночью и сонливость в дневные часы,
# заторможенность» (раздел 2.1). О них говорят родные. Фон — игровая оценка
leak: { pct: 0.2 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Днём клонит в сон, ночью не спится, человек путает дни и числа, стал вялым и равнодушным. У больного циррозом это начало печёночной энцефалопатии: аммиак из кишечника отравляет мозг. Её снимает лактулоза."
  complaint:
    - ru: "Последние дни путает числа: днём спит, а ночью бродит по квартире, — привезли родные"
    - ru: "Стал{|а} вял{ым|ой}, всё время дремлет, не помнит, какой сегодня день, — говорят родные"
  present:
    - ru: "Днём сонлив{|а}, ночью не спит, путает дни"
  absent:
    - ru: "Сон обычный, дни не путает"
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.5, табл. 2: вторая стадия ПЭ по West Haven — вялость или апатия, дезориентация во времени, изменение личности, неадекватное поведение, астериксис; раздел 2.1: при декомпенсации — бессонница ночью и сонливость днём, заторможенность, изменение сознания; фон — игровая оценка" }
review: draft
