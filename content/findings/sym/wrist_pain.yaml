id: sym.wrist_pain
name: { ru: "Боль в запястье после падения на руку" }
# жалоба травмы: без травмы так не жалуются
leak: { pct: 0 }
triage: yellow
salience: 3
attrs:
  side:
    right: { ru: "правую" }
    left: { ru: "левую" }
texts:
  hint:
    ru: "Боль в нижней трети предплечья и в запястье после падения на кисть. Так начинается и перелом лучевой кости «в типичном месте», и ушиб: отличают их осмотр и снимок."
  complaint:
    - ru: "Упал{|а} на {side} руку — болит запястье"
    - ru: "Поскользнул{ся|ась}, упал{|а} на {side} руку, запястье болит и опухает"
  present:
    - ru: "Боль в запястье после падения на {side} руку"
  absent:
    - ru: "Запястье не болит"
review: draft
