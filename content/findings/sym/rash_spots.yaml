id: sym.rash_spots
name: { ru: "Заметил сыпь на коже" }
# сам больной или родные заметили сыпь (spec 2026-10-chapter-4, часть 50а): о сыпи, сроках, месте и характере выясняют у
# каждого с подозрением на менингококковую инфекцию (1020_1, раздел 2.1). Сыпь видят на осмотре — «Геморрагическая сыпь»;
# эта жалоба — со слов. Без болезни — игровая оценка
leak: { pct: 0 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "На коже появились тёмно-красные пятнышки, и они не проходят. При лихорадке это может быть геморрагическая сыпь менингококковой инфекции: кожу осматривают сразу, целиком, с ногами и ягодицами."
  complaint:
    - ru: "На ногах высыпали тёмные пятнышки, их всё больше — заметили родные"
    - ru: "Температура под сорок, а на ногах и ягодицах появились красные точки"
  present:
    - ru: "Сам{|а} или родные заметили тёмные пятнышки на коже"
  absent:
    - ru: "Сыпи на коже не замечал{|а}"
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 2.1 (УУР С, УДД 4–5): выяснить о наличии сыпи на коже, сроки появления, локализацию, характер и форму; раздел 1.6: геморрагическая сыпь к концу первых — началу вторых суток на дистальных отделах конечностей и ягодицах; сколько больных замечают сыпь сами — игровая оценка" }
review: draft
