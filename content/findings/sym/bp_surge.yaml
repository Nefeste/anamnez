id: sym.bp_surge
name: { ru: "Резко поднялось давление" }
# повод вызвать скорую или прийти: «резкий подъём АД» (62_3, раздел 3.7) — и при кризе, и без поражения органов
leak: { pct: 0 }
salience: 3
texts:
  hint:
    ru: "Давление подскочило до 180–200 и выше и не снижается. Частый повод вызвать скорую. Опасно оно не числом, а тем, страдают ли мозг, сердце, почки и глаза: это и ищут."
  complaint:
    - ru: "Давление подскочило до двухсот и не сбивается"
    - ru: "Тонометр показал 200 на 120, выпил{|а} таблетку — не помогает"
  present:
    - ru: "Давление поднялось резко, за часы, и таблетки не помогают"
  absent:
    - ru: "Резкого подъёма давления не было"
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: «недостижение целевых цифр АД» — если причиной вызова является резкий подъём АД без осложнений; тексты жалобы — игровые" }
review: draft
