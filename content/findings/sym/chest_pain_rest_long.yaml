# Давящая боль в груди в покое дольше 20 минут (spec 2026-10-chapter-3, часть 46а): нестабильная стенокардия
# покоя — «при болевом синдроме более 20 минут» (154_4, раздел 1.5), и острый коронарный синдром без подъёма
# ST заподозрить надо при «длительном (более 20 минут) ангинозном приступе в покое» (раздел 1.6); при инфаркте
# боль, как правило, возникает в покое и длится от 20 минут до нескольких часов (157_5, раздел 1.6). Без ОКС
# в игре её нет — как и впервые возникшей стенокардии: стабильная проходит в покое за минуты (155_2, раздел 2.1)
id: sym.chest_pain_rest_long
name: { ru: "Давящая боль в груди в покое дольше 20 минут" }
leak: never
texts:
  hint:
    ru: "Давит или жмёт за грудиной в покое и не отпускает больше 20 минут — так начинается острый коронарный синдром, даже если ЭКГ и тропонин пока в норме. Стенокардия напряжения в покое проходит за несколько минут."
  present:
    - ru: "Давит за грудиной в покое уже полчаса, сидя и лёжа — одинаково"
    - ru: "Боль за грудиной началась в покое и не отпускает больше двадцати минут"
  absent:
    - ru: "В покое боль не держится дольше нескольких минут"
