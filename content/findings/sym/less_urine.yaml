id: sym.less_urine
name: { ru: "Мочится меньше обычного" }
# диурез при обезвоживании (spec 2026-10-chapter-4, часть 49а): при II степени снижен, при III — олигурия, при IV — анурия
# (875_1, приложение А3.1); на количество мочи врач обращает внимание прицельно (раздел 2.1). Фон — игровая оценка
leak: { pct: 2 }
salience: 1
texts:
  hint:
    ru: "Мочи меньше, чем обычно, она тёмная, а при тяжёлом обезвоживании её почти нет: почки берегут воду, которую тело теряет с рвотой и поносом. Чем меньше мочи, тем сильнее обезвоживание."
  complaint:
    - ru: "Почти не хожу в туалет по-маленькому"
  present:
    - ru: "Мочится редко и мало, моча тёмная"
  absent:
    - ru: "Мочится как обычно"
sources:
  - { kind: guideline, title: "Острые кишечные инфекции (ОКИ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/875_1", note: "ID 875_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.1: акцентировать внимание на количестве выделенной мочи; приложение А3.1: диурез по степеням обезвоживания — норма, снижен, олигурия, анурия" }
review: draft
