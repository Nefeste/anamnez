id: sym.abdomen_enlarged
name: { ru: "Живот увеличился" }
# асцит второй степени «проявляется симметричным увеличением живота» (spec 2026-10-chapter-4, часть 54а; 715_2, раздел
# 1.5), третьей — напряжённый; с ним и приходят: впервые возникший или напряжённый асцит — показание к госпитализации
# (раздел 6). Фон — игровая оценка: живот растёт и от веса, и от вздутия
leak: { pct: 0.5 }
salience: 3
texts:
  hint:
    ru: "Живот за несколько недель стал большим, одежда не сходится, хотя руки и ноги не полнеют. Так копится жидкость в брюшной полости — асцит: чаще всего при циррозе печени, реже при сердечной недостаточности и опухолях."
  complaint:
    - ru: "Живот за последние недели сильно вырос, брюки не сходятся"
    - ru: "Живот стал большой и тугой, тяжело наклоняться"
  present:
    - ru: "Живот увеличился за последние недели"
  absent:
    - ru: "Живот не увеличивался"
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.5: асцит 2-й степени по ICA — симметричное увеличение живота, 3-й — напряжённый; раздел 1.6: отёчно-асцитический синдром — отёки ног и видимое увеличение живота; раздел 6: впервые возникший или напряжённый асцит — показание к госпитализации; фон — игровая оценка" }
review: draft
