id: sym.hip_pain
name: { ru: "Боль в тазобедренном суставе после падения" }
# жалоба травмы: без травмы так не жалуются
leak: { pct: 0 }
triage: yellow
salience: 3
attrs:
  side:
    right: { ru: "правое" }
    left: { ru: "левое" }
texts:
  hint:
    ru: "Боль в паху и в верхней трети бедра после падения на бок. У пожилого человека так начинается перелом шейки бедра — и ушиб: отличают их осмотр и снимок."
  complaint:
    - ru: "Упал{|а} дома на бок — болит {side} бедро, в паху"
    - ru: "Поскользнул{ся|ась}, упал{|а} на бок — теперь больно ступать, болит {side} бедро"
  present:
    - ru: "Боль в паху и в верхней трети бедра после падения, болит {side} бедро"
  absent:
    - ru: "Бедро и пах не болят"
sources:
  - { kind: guideline, title: "Переломы проксимального отдела бедренной кости", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/980_1", note: "ID 980_1, опубликованы 10.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: боль в паховой области и в верхней трети бедра, болезненная пальпация области сустава; раздел 1.3: чаще — падение с высоты роста на бок у людей старше 60 лет" }
review: draft
