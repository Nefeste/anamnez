id: sym.strange_behavior
name: { ru: "Странное поведение" }
# психические расстройства при герпетическом энцефалите (spec 2026-10-chapter-4, часть 50б): «регистрируются у 80 %
# больных», у 20 % болезнь с них начинается — галлюцинации, немотивированные поступки, дезориентация (492_2, раздел 1.6);
# их принимают за психическое заболевание или опьянение (раздел 2.2). О них говорят родные. Бывает и при отёке мозга у
# менингококковой инфекции, и при гипогликемии; без болезни базы — опьянение и психические расстройства, которых в игре нет:
# фон — игровая оценка
leak: { pct: 0.3 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Человек ведёт себя не так, как всегда: возбуждён, видит то, чего нет, совершает странные поступки. Если при этом жар, это может быть энцефалит, а не психическое расстройство и не опьянение: ему нужны пункция, МРТ и противовирусное в вену."
  complaint:
    - ru: "Второй день сам{|а} не сво{й|я}: говорит странное, видит то, чего нет, — привезли родные"
    - ru: "С температурой, а ведёт себя будто пьян{|а}: суетится, не узнаёт дом — вызвали скорую"
  present:
    - ru: "Родные говорят: ведёт себя странно, видит то, чего нет"
  absent:
    - ru: "Поведение, по словам родных, обычное"
sources:
  - { kind: guideline, title: "Простой герпес (ПГ) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/492_2", note: "ID 492_2, опубликованы 27.10.2025, применяются; сверено с рубрикатором 06.10.2026; раздел 1.6: психические расстройства — у 80 % больных, у 20 % болезнь начинается с психических нарушений, галлюцинации, немотивированные поступки; раздел 2.2: изменения в поведении ошибочно принимают за психическое заболевание или последствия токсического действия алкоголя" }
review: draft
