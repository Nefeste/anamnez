id: sym.bloody_diarrhea
name: { ru: "Стул с кровью 6 раз в сутки и чаще" }
# тяжёлая атака язвенного колита по Трулаву–Виттсу (spec 2026-10-chapter-4, часть 55а): стул с кровью «≥6 и» хотя бы один
# признак системного воспаления (193_2, раздел 1.5, табл. 2); кровь в стуле при язвенном колите — «95-100% случаев», понос
# чаще ночью (раздел 1.6). Скудный стул со слизью и кровью при шигеллёзе — свой признак. Фон — игровая оценка
leak: { pct: 0.2 }
salience: 3
texts:
  hint:
    ru: "Жидкий стул с кровью 6 раз в сутки и чаще, и ночью тоже. С хотя бы одним признаком воспаления — пульс чаще 90, температура выше 37,8 °C, гемоглобин ниже 105, СОЭ или С-реактивный белок выше 30 — это тяжёлая атака язвенного колита по Трулаву–Виттсу."
  complaint:
    - ru: "Понос с кровью раз по восемь в сутки, ночью тоже бегаю"
    - ru: "Стул жидкий, с кровью, больше шести раз в день"
  present:
    - ru: "Жидкий стул с кровью 6 раз в сутки и чаще, и ночью"
  absent:
    - ru: "Стула с кровью нет"
sources:
  - { kind: guideline, title: "Язвенный колит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/193_2", note: "ID 193_2, опубликованы 29.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.5, таблица 2: тяжёлая атака — стул с кровью 6 раз в сутки и чаще и хотя бы одно: ЧСС выше 90, температура выше 37,8 °С, гемоглобин ниже 105 г/л, СОЭ выше 30 мм/ч или СРБ выше 30 мг/л; раздел 1.6: кровь в стуле — в 95–100 % случаев, диарея преимущественно ночью — в 65 %; фон — игровая оценка" }
review: draft
