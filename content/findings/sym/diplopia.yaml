id: sym.diplopia
name: { ru: "Двоение и туман в глазах" }
# первая жалоба при ботулизме (spec 2026-10-chapter-4, часть 51в): «туман» и «пелена» перед глазами, расплывчатость контуров,
# диплопия, усиливающаяся при взгляде в сторону (911_1, раздел 1.6). Без болезни не бывает — фон игровая оценка
leak: { pct: 0 }
salience: 3
texts:
  hint:
    ru: "Предметы двоятся, особенно при взгляде в сторону, всё как в тумане, буквы вблизи расплываются. Внезапно, с обеих сторон и после домашних консервов — ботулизм: токсин парализует мышцы глаз. Очки и окулист тут не помогут."
  complaint:
    - ru: "Двоится в глазах, всё как в тумане"
    - ru: "Перед глазами туман, предметы двоятся, читать не могу"
  present:
    - ru: "Двоится в глазах, особенно при взгляде в сторону"
  absent:
    - ru: "В глазах не двоится"
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: первая жалоба большинства — «туман» или «пелена» перед глазами, расплывчатость контуров предметов, диплопия, усиливающаяся при взгляде в сторону; в лёгких случаях больные неоднократно обращаются к окулисту" }
