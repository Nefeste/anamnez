id: sym.rash_ring
name: { ru: "Красное пятно растёт" }
# жалоба мигрирующей эритемы (spec 2026-10-chapter-4, часть 51а): пятно на месте укуса клеща растёт, центр бледнеет
# (566_2, раздел 1.6)
leak: { pct: 0 }
salience: 3
texts:
  hint:
    ru: "Пятно на коже, которое с каждым днём становится больше, часто с бледным центром — кольцом. Через дни и недели после укуса клеща это мигрирующая эритема болезни Лайма, пока не доказано иное."
  complaint:
    - ru: "На коже красное пятно — с каждым днём всё больше"
    - ru: "Покраснело место, где был клещ, и пятно расползается кольцом"
  present:
    - ru: "Красное пятно на коже растёт"
  absent:
    - ru: "Растущих пятен на коже нет"
sources:
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: мигрирующая эритема сопряжена с местом присасывания клеща, распространяется в проксимальном и дистальном направлениях; приложение В: появляется от нескольких часов до 30 дней после присасывания" }
review: draft
