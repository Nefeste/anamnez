id: sym.hives
name: { ru: "Сыпь по телу и зуд" }
leak: { pct: 0 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Волдыри по телу, как от крапивы, и сильный зуд — крапивница: каждый волдырь держится несколько часов и исчезает бесследно. Если вместе с ней трудно дышать или кружится голова, это может быть анафилаксия: счёт идёт на минуты."
  # одышка и слабость — свои жалобы (sym.dyspnea, sym.dizziness): в жалобе на сыпь их нет — сыпь бывает и при острой
  # крапивнице, где их нет (spec 2026-10-urticaria-dka, часть 73)
  complaint:
    - ru: "Всё тело в сыпи, сильно чешется"
    - ru: "Вдруг обсыпало всё тело, зуд невыносимый"
  present:
    - ru: "Волдыри по телу, сильный зуд"
  absent:
    - ru: "Сыпи и зуда нет"
sources:
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.1: крапивница, зуд, ангиоотёк; начало обычно в течение 2 часов после контакта с аллергеном" }
  - { kind: guideline, title: "Крапивница", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/264_2", note: "ID 264_2, опубликованы 19.07.2023, применяются; сверено с рубрикатором 15.10.2026; раздел 1.6: волдырь — отёк, почти всегда с эритемой, зуд, иногда жжение, исчезает бесследно за 1–24 часа; при острой — за несколько часов (приложение А3.2)" }
review: draft
