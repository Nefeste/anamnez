id: sym.constipation_long
name: { ru: "Запоры месяцами" }
# хронический запор (spec 2026-10-chapter-4, часть 55б): критерии диагноза — «изменение консистенции кала по Бристольской
# Шкале Формы стула (1 и 2 типы)», «урежение частоты стула менее 3 раз в неделю» (274_3, раздел 2); больные отмечают
# «ощущение неполного опорожнения кишечника и повышенное натуживание» (раздел 1.6). Срока «хронического» в 274_3 нет — как у
# СРК, полгода (892_1, раздел 2). С жалобой приходят функциональный запор и СРК с запором; фона нет: свои причины запора в
# базе — эти две болезни
leak: never
salience: 2
texts:
  hint:
    ru: "Стул реже трёх раз в неделю, твёрдый, «орешками», с натуживанием и чувством неполного опорожнения — месяцами. Это функциональный запор или СРК с запором. Старше 50 лет, при крови в кале, похудании, анемии и раке кишки у родственников нужна колоноскопия."
  complaint:
    - ru: "Запоры замучили, уже который месяц"
    - ru: "По нескольку дней не могу сходить в туалет, и так месяцами"
  present:
    - ru: "Стул реже трёх раз в неделю, твёрдый, — уже несколько месяцев"
  absent:
    - ru: "Долгих запоров нет"
sources:
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: стул 3 раза в неделю и реже, ощущение неполного опорожнения, натуживание; раздел 2: критерии — Бристольская шкала 1 и 2 типа, стул реже 3 раз в неделю, масса кала меньше 35 г в сутки, замедление транзита; срок «хронического» не указан — полгода, как у СРК, игровая оценка" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.5: СРК с запором — больше 25 % дефекаций 1–2 типа по Бристольской шкале; раздел 2: последние 3 месяца при общей длительности не менее 6 месяцев" }
review: draft
