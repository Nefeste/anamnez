id: sym.weakness_one_side
name: { ru: "Внезапная слабость в руке и ноге" }
# жалоба инсульта (spec 2026-10-chapter-3, часть 41а): у болезней базы без инсульта её нет
leak: { pct: 0 }
triage: red
redFlag: true
salience: 3
attrs:
  side:
    right: { ru: "справа" }
    left: { ru: "слева" }
texts:
  hint:
    ru: "Рука и нога с одной стороны вдруг ослабли: не удержать чашку, подгибается нога. Внезапная слабость с одной стороны — главный признак инсульта: скорая, КТ и счёт времени от начала."
  complaint:
    - ru: "Внезапно ослабли рука и нога {side}"
    - ru: "Рука {side} вдруг перестала слушаться, и нога подволакивается"
  present:
    - ru: "Внезапная слабость в руке и ноге {side}"
  absent:
    - ru: "Слабости в руках и ногах нет"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 1.6: внезапное появление очаговой неврологической симптоматики; табл. 5: контралатеральный гемипарез при инсульте в бассейне средней мозговой артерии; приложение В: тест «улыбнуться, заговорить, поднять обе руки»" }
review: draft
