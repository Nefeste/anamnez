id: sym.smoke_inhaled
name: { ru: "Надышался дымом на пожаре" }
# с пожара (spec 2026-10-chapter-4, часть 57б): «подавляющее большинство пострадавших, подвергшихся интоксикации монооксидом
# углерода, в настоящее время, доставляют из очагов пожаров» (885_1, раздел 1.1); о пожаре скажут сам больной или скорая —
# жалоба события, как травма головы. Фона нет
leak: { pct: 0 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Человек был в дыму на пожаре. В дыму — угарный газ, а при горении пластика — ещё и цианиды; горячий дым обжигает дыхательные пути. Даже без ожогов и с ясным сознанием это отравление: нужны карбоксигемоглобин, ЭКГ и кислород."
  complaint:
    - ru: "Вынесли из горящей квартиры — надышал{ся|ась} дымом"
    - ru: "Был{|а} на пожаре, надышал{ся|ась} дымом"
  present:
    - ru: "Был{|а} в дыму на пожаре"
  absent:
    - ru: "В дыму не был{|а}"
sources:
  - { kind: guideline, title: "Токсическое действие окиси углерода. Токсическое действие других газов, дымов и паров", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/885_1", note: "ID 885_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.1: подавляющее большинство отравленных угарным газом доставляют из очагов пожаров; раздел 2.1: диагноз основан на анамнезе — эвакуация из очага возгорания" }
review: draft
