id: sym.tick_bite
name: { ru: "Присасывание клеща" }
# жалоба присасывания (spec 2026-10-chapter-4, часть 51а): без клеща так не жалуются
leak: { pct: 0 }
salience: 3
texts:
  hint:
    ru: "Клещ присасывается незаметно — на шее, груди, в подмышках и паху, на волосистой части головы. Его удаляют целиком, не раздавив, и отдают на исследование: от результата зависит, нужна ли защита от клещевого энцефалита и болезни Лайма."
  complaint:
    - ru: "Присосался клещ — наш{ёл|ла} на себе после леса"
    - ru: "Клещ: был{|а} на даче, вечером заметил{|а} на коже"
  present:
    - ru: "Присасывался клещ"
  absent:
    - ru: "Свежего укуса клеща нет"
sources:
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: присасывание в большинстве случаев остаётся незамеченным, места — шея, грудь, подмышечные впадины, паховые складки, волосистая часть головы" }
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; приложение В: в максимально короткий срок обратиться в медицинское учреждение для удаления клеща и его исследования" }
review: draft
