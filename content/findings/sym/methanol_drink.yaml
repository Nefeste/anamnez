id: sym.methanol_drink
name: { ru: "Пил стеклоомыватель или алкоголь с рук" }
# что выпил (spec 2026-10-chapter-4, часть 57в): метанол — в напитках, «купленных через сеть Интернет по дешевой цене», в
# «контрафактной стеклоомывающей жидкости, содержащей метанол», в спиртосодержащем концентрате для ванн (873_1, раздел 1.3);
# спрашивают, «какую спиртосодержащую жидкость принял пациент», «где была приобретена алкогольная продукция» (раздел 2.1). О выпитом
# говорят скорая и родные — жалоба события. Фон — пил, но не отравился: игровая оценка
leak: { pct: 0.05 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Выпил стеклоомывающую жидкость, дешёвый «коньяк» с рук или из интернета, спиртовой концентрат для ванн. В них бывает метанол: пахнет он как обычный спирт, а на таре стеклоомывателя пишут, что метанола нет. Плохо может стать и через сутки."
  complaint:
    - ru: "По ошибке выпил{|а} стеклоомыватель — привезла скорая"
    - ru: "Пил{|а} дешёвый коньяк, купленный через интернет, — вызвали скорую"
  present:
    - ru: "Пил{|а} стеклоомывающую жидкость"
    - ru: "Пил{|а} дешёвый алкоголь, купленный с рук или через интернет"
    - ru: "Пил{|а} спиртовой концентрат для ванн"
  absent:
    - ru: "Стеклоомыватель, технический спирт и алкоголь с рук не пил{|а}"
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.3: фальсифицированный алкоголь, купленный дёшево через интернет, контрафактная стеклоомывающая жидкость зимой — на таре указано, что метилового спирта в ней нет, спиртосодержащий концентрат для ванн; раздел 1.1: запах метанола похож на запах этанола; раздел 2.1: выяснить, какую жидкость принял и где купил, обращаются обычно родственники или знакомые; фон — игровая оценка" }
review: draft
