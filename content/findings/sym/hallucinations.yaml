id: sym.hallucinations
name: { ru: "Видит и слышит то, чего нет" }
# обманы восприятия при синдроме отмены алкоголя (spec 2026-10-chapter-4, часть 54б): «эпизодические зрительные,
# тактильные, слуховые галлюцинации или иллюзии» (784_1, раздел 2), пункты 7–9 шкалы CIWA-Ar (приложение Г1); при 16
# баллах и больше — «тяжёлом ААС и угрожающем делирии» (раздел 2.1). Фон — психические расстройства, которых в игре нет:
# игровая оценка
leak: { pct: 0.1 }
triage: yellow
salience: 3
texts:
  hint:
    ru: "Человек видит, слышит или чувствует то, чего нет: пауков на стене, голоса за окном, мурашек под кожей. У пьющего, бросившего пить, это тяжёлый синдром отмены и угроза алкогольного делирия — белой горячки."
  complaint:
    - ru: "Ночью по стене ползали пауки, а за окном звали по имени"
    - ru: "По коже будто бегают мурашки, в углах мерещатся тени"
  present:
    - ru: "Видит и слышит то, чего нет: пауков, голоса"
  absent:
    - ru: "Обманов восприятия нет"
sources:
  - { kind: guideline, title: "Психические и поведенческие расстройства, вызванные употреблением алкоголя. Синдром отмены алкоголя (алкогольное абстинентное состояние)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/784_1", note: "ID 784_1, опубликованы 20.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: отдельные слуховые и зрительные обманы, гипнагогические галлюцинации; раздел 2: эпизодические зрительные, тактильные, слуховые галлюцинации или иллюзии; раздел 2.1: 16 баллов и более по CIWA-Ar — тяжёлый синдром отмены и угрожающий делирий; приложение Г1: пункты 7–9 шкалы; фон — игровая оценка" }
review: draft
