id: sym.transient_speech
name: { ru: "Прошедшее нарушение речи" }
# жалоба транзиторной ишемической атаки (часть 41б): у болезней базы без ТИА её нет
leak: { pct: 0 }
triage: yellow
redFlag: true
salience: 3
texts:
  hint:
    ru: "Речь на время стала невнятной или пропали слова — и вернулась. Даже прошедшее нарушение речи — признак транзиторной ишемической атаки: риск инсульта в ближайшие дни."
  complaint:
    - ru: "{Не мог|Не могла} подобрать слова, {говорил|говорила} невнятно — сейчас прошло"
    - ru: "Вдруг {стал|стала} говорить не то, родные испугались, а потом всё прошло"
  present:
    - ru: "Ненадолго нарушалась речь, прошло"
  absent:
    - ru: "Речь не нарушалась"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 1.1: ТИА — кратковременный эпизод неврологического дефицита до 24 часов; раздел 1.6, табл. 5: афазия и дизартрия" }
review: draft
