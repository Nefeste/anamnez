id: sym.anosmia
name: { ru: "Снижение или потеря обоняния" }
leak: { pct: 1 }
salience: 2
texts:
  hint:
    ru: "Человек хуже чувствует запахи или не чувствует их совсем. Бывает при заложенности носа и синусите, а внезапная полная потеря обоняния — частый признак COVID-19."
  complaint:
    - ru: "Перестал{|а} чувствовать запахи"
    - ru: "Не чувствую ни запахов, ни вкуса еды"
  present:
    - ru: "Обоняние снижено"
  absent:
    - ru: "Запахи чувствует как обычно"
review: draft
