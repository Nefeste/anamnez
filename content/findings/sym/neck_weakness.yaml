# жалоба полиомиелитической формы клещевого энцефалита (spec 2026-10-chapter-4, часть 51б): вялые параличи мышц шеи и плечевого
# пояса — «свисающая голова» (567_2, раздел 1.6)
leak: { pct: 0 }
salience: 3
texts:
  hint:
    ru: "Голова падает на грудь, руки не поднять выше плеч, мышцы шеи и плеч слабые и вялые. После лихорадки и укуса клеща это полиомиелитическая форма клещевого энцефалита: опасно поражение диафрагмы и дыхания."
  complaint:
    - ru: "Голова не держится — падает на грудь, руки не поднять"
    - ru: "Ослабли шея и плечи, не могу поднять руки"
  present:
    - ru: "Голова не держится, руки не поднимаются"
  absent:
    - ru: "Шея и руки держат как обычно"
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: полиомиелитическая форма — вялые параличи мышц шеи, проксимальных отделов плечевого пояса и верхних конечностей; поражение мышц шеи делает невозможным удержание головы в вертикальном положении" }
