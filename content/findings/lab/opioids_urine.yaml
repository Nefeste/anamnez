id: lab.opioids_urine
name: { ru: "Опиаты или метадон в моче" }
# иммунохроматографический тест мочи (spec 2026-10-chapter-4, часть 57а; 743_2, раздел 2.3): находит морфин и героин, метадон;
# производных фентанила в его перечне нет, положительный подтверждают газовой или жидкостной хромато-масс-спектрометрией (УУР В, УДД 3).
# Фон — употребляет, но не отравился: игровая оценка
leak: { pct: 0.5 }
texts:
  hint:
    ru: "Полоска теста показала морфин, героин или метадон в моче. Это значит, что человек их принимал, но не говорит, насколько тяжело отравление: его оценивают по сознанию и дыханию. Фентанилы этот тест не видит."
  present:
    - ru: "Экспресс-тест мочи: опиаты или метадон есть"
  absent:
    - ru: "Экспресс-тест мочи: опиатов и метадона нет"
sources:
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 2.3: предварительный иммунохроматографический анализ мочи и подтверждающие методы — газовая и жидкостная хромато-масс-спектрометрия (УУР В, УДД 3); производных фентанила в перечне теста нет; критерий качества 2: экспресс-тест мочи не позднее 24 часов; фон — игровая оценка" }
review: draft
