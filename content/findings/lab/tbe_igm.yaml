# антитела IgM к вирусу клещевого энцефалита в крови (spec 2026-10-chapter-4, часть 51б): с 3–4-го дня болезни (567_2, раздел
# 2.3.2); у пришедшего в первые дни их может ещё не быть
leak: never
texts:
  hint:
    ru: "ИФА на антитела IgM к вирусу клещевого энцефалита: появляются с 3–4-го дня болезни, раньше анализ бывает отрицательным. Подтверждает клещевой энцефалит у лихорадящего после укуса клеща."
  present:
    - ru: "ИФА: антитела IgM к вирусу клещевого энцефалита"
  absent:
    - ru: "Антител к вирусу клещевого энцефалита нет"
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3.2 (УУР C, УДД 5): IgM — с 3–4 дня болезни, для своевременного назначения этиотропной терапии; IgG — после 5–7 дня; приложение Б: подозрение на КЭ — антитела IgM и IgG; чувствительности и специфичности в тексте нет" }
