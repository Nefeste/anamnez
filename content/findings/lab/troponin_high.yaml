id: lab.troponin_high
name: { ru: "Тропонин T 52 нг/л и выше" }
leak: never
# первый анализ алгоритма 0/1 час (spec 2026-10-chapter-3, часть 39в; 154_4, приложение А3): 52 и выше —
# острый некроз подтверждён, ниже 12 — нужен прирост за час. «Серой зоны» 12–51 в игре нет: число в
# карте всегда даёт вывод алгоритма. Норма в карте — до порога исключения
value:
  unit: "нг/л"
  ref: [0, 11]
  present: [52, 2000]
  absent: [2, 11]
  decimals: 0
texts:
  hint:
    ru: "Тропонин — белок клеток сердечной мышцы: в кровь он выходит, когда они гибнут. Первый анализ 52 нг/л и выше — инфаркт подтверждён сразу; ниже 12 — смотрят, вырос ли он за час. Поднимается через 1–6 часов после начала ишемии."
  present:
    - ru: "Тропонин T {value} {unit} — 52 и выше: острый некроз миокарда подтверждён"
  absent:
    - ru: "Тропонин T {value} {unit} — ниже 12"
sources:
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 04.10.2026; приложение А3, алгоритм 0/1 час для тропонина T: первый анализ 52 нг/л и выше — острый некроз миокарда подтверждён; ниже 12 и прирост меньше 3 — исключён; раздел 2.3: повышение — через 1–6 часов после ишемии" }
review: draft
