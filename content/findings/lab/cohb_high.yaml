id: lab.cohb_high
name: { ru: "Карбоксигемоглобин повышен" }
# главный анализ отравления угарным газом (spec 2026-10-chapter-4, часть 57б): исследование уровня карбоксигемоглобина «в процентах к
# общему гемоглобину» (885_1, раздел 2.3, УУР С, УДД 5; критерий качества 2). Тяжесть — менее 30, 30–50 и более 50 % (раздел 1.5),
# но «при поступлении в стационар, может быть значительно ниже, чем на месте происшествия» (там же): по числу при поступлении тяжесть
# не читается. Нормы в 885_1 нет — границы игровые
leak: { pct: 0.5 }
value:
  unit: "%"
  ref: [0, 4]
  present: [10, 45]
  absent: [0, 3]
  decimals: 0
texts:
  hint:
    ru: "Доля гемоглобина, связанного с угарным газом. Подтверждает отравление, но тяжесть по ней при поступлении не судят: пока везли, особенно с кислородом, угарный газ уходил из крови, и на месте число было выше."
  present:
    - ru: "Карбоксигемоглобин {value} {unit} — повышен"
sources:
  - { kind: guideline, title: "Токсическое действие окиси углерода. Токсическое действие других газов, дымов и паров", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/885_1", note: "ID 885_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.5: лёгкая степень — карбоксигемоглобин менее 30 %, средняя — 30–50 %, тяжёлая — более 50 %, при поступлении он может быть значительно ниже, чем на месте происшествия; раздел 2.3 (УУР С, УДД 5): уровень карбоксигемоглобина в процентах к общему гемоглобину — основной метод диагностики; критерий качества 2; нормы нет — числа игровые" }
review: draft
