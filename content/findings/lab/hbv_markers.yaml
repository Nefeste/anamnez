id: lab.hbv_markers
name: { ru: "HBsAg и антитела IgM к вирусу гепатита B" }
# маркёры острого гепатита B (spec 2026-10-chapter-4, часть 52а): HBsAg и анти-HBc IgM — анти-HBc IgM «самым достоверным
# специфическим маркёром» (672_2, раздел 2.3.2); HBsAg без анти-HBc IgM бывает у носителей и при хроническом гепатите —
# фон игровая оценка
leak: { pct: 0.5 }
texts:
  hint:
    ru: "HBsAg — белок оболочки вируса гепатита B, анти-HBc IgM — антитела, которые появляются при свежем заражении. Вместе подтверждают острый гепатит B; один HBsAg без антител IgM бывает у носителей вируса."
  present:
    - ru: "ИФА: HBsAg и анти-HBc IgM обнаружены"
  absent:
    - ru: "HBsAg и анти-HBc IgM нет"
sources:
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3.2: HBsAg, анти-HBc IgM и IgG, HBeAg, ДНК вируса методом ПЦР; анти-HBc IgM — самый достоверный специфический маркёр, появляется в конце инкубационного периода; HBsAg и HBeAg — уже в инкубационном; доля фона — игровая оценка" }
review: draft
