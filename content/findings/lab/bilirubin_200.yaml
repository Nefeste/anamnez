id: lab.bilirubin_200
name: { ru: "Билирубин выше 200 мкмоль/л" }
# порог тяжёлой формы гепатитов (spec 2026-10-chapter-4, часть 52а): лёгкая — до 100, средняя — 100–200, тяжёлая — «более 200»
# (718_2 и 672_2, приложение А3). Бывает и при камне в протоке — фон игровая оценка
leak: { pct: 0.2 }
texts:
  hint:
    ru: "Очень высокий билирубин — больше 200 мкмоль/л. При остром гепатите это признак тяжёлой формы: желтуха интенсивная и долгая, печень может не справиться. Лёгкая форма — до 100."
  present:
    - ru: "Билирубин выше 200 мкмоль/л"
  absent:
    - ru: "Билирубин не выше 200 мкмоль/л"
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; приложение А3: билирубин до 100 мкмоль/л — лёгкая форма, 100–200 — средняя, более 200 — тяжёлая; раздел 1.6: при лёгкой не превышает 100, при тяжёлой — превышает 200" }
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; приложение А3: билирубин до 100 мкмоль/л — лёгкая, от 100 до 200 — средняя, более 200 — тяжёлая" }
