id: lab.hantavirus_igm
name: { ru: "Антитела IgM к хантавирусам" }
# IgM к хантавирусам (spec 2026-10-chapter-4, часть 52б): подтверждают ГЛПС, выявляются с 6-го по 56-й день болезни (347_2,
# раздел 2.3.2, УУР C, УДД 4); после болезни в невысоком титре держатся антитела IgG, а не IgM. Без болезни — почти не бывает,
# фон — игровая оценка
leak: { pct: 0.3 }
texts:
  hint:
    ru: "Антитела IgM к хантавирусам — возбудителям геморрагической лихорадки с почечным синдромом. Появляются с 6-го дня болезни: в первые дни анализ бывает отрицательным, и диагноз ставят по признакам и тому, где был больной."
  present:
    - ru: "ИФА: IgM к хантавирусам обнаружены"
  absent:
    - ru: "IgM к хантавирусам нет"
sources:
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3.2 (УУР C, УДД 4): IgM и IgG к хантавирусам, РНК методом ПЦР — для подтверждения; РНИФ и ИФА информативны в 96–98 %, серонегативные формы — в 2–4 %; IgM — с 6-го по 56-й день болезни; первая сыворотка — до 4–7-го дня или в первый день госпитализации, парные — через 4–7 дней; фон — игровая оценка" }
review: draft
