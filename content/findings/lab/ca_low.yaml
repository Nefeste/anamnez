name: { ru: "Кальций крови снижен" }
# гипокальциемия — по кальцию с поправкой на альбумин или по ионизированному (spec 2026-10-chapter-4, часть 56в; 627_3, раздел 2,
# УУР С, УДД 5): поправка нужна, чтобы не было ложных результатов при изменении белков плазмы; норма общего кальция — 2,12–2,62
# ммоль/л (раздел 1.2.3). Значения у больного — игровая оценка: порога тяжёлой гипокальциемии в 627_3 нет. Фон — дефицит витамина
# D и болезни почек, игровая оценка
leak: { pct: 0.5 }
value:
  unit: "ммоль/л"
  ref: [2.12, 2.62]
  present: [1.5, 1.98]
  absent: [2.16, 2.55]
  decimals: 2
texts:
  hint:
    ru: "Кальций с поправкой на альбумин ниже 2,12 ммоль/л. После операции на щитовидной железе это гипопаратиреоз: околощитовидные железы задеты и не держат кальций. С судорогами и покалыванием — кальция глюконат в вену и сразу кальций внутрь с альфакальцидолом или кальцитриолом."
  present:
    - ru: "Кальций с поправкой на альбумин — {value} {unit}, ниже нормы"
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2 (УУР С, УДД 5): диагноз — гипокальциемия по альбумин-скорректированному или ионизированному кальцию с низким ПТГ, поправка на альбумин исключает ложные результаты; раздел 1.2.3: нормальный диапазон общего кальция 2,12–2,62 ммоль/л; значения и фон — игровая оценка" }
