id: lab.csf_pleocytosis
name: { ru: "Цитоз в ликворе повышен" }
# клеток в ликворе больше нормы (spec 2026-10-chapter-4, часть 50а): воспаление оболочек мозга. Число — одно на ликвор;
# тысячи нейтрофилов — свой порог на том же числе, «Гнойный ликвор» (1020_1, раздел 1.6). До 400 в 1 мкл — игровая оценка
leak: { pct: 0 }
value:
  unit: "клеток в 1 мкл"
  ref: [0, 5]
  present: [30, 400]
  absent: [0, 4]
  decimals: 0
texts:
  hint:
    ru: "Цитоз — сколько клеток в 1 мкл ликвора; в норме до 5. Больше — воспаление оболочек мозга: сотни лимфоцитов — чаще вирусное, тысячи нейтрофилов и мутный ликвор — гнойный, бактериальный менингит."
  present:
    - ru: "Цитоз {value} {unit}"
  absent:
    - ru: "Цитоз {value} {unit}"
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 1.6: ликвор вытекает под повышенным давлением; гнойный, мутный, до 3–10 тыс. и более клеток в 1 мкл (более 90 % — нейтрофилы); раздел 2.3: общий анализ ликвора — цитоз, нейтрофильный плеоцитоз; приложение А3.4: у вирусных серозных менингитов ликвор прозрачный, плеоцитоз лимфоцитарный; диапазон — игровая оценка" }
review: draft
