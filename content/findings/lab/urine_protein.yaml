id: lab.urine_protein
name: { ru: "Белок в моче" }
# протеинурия (spec 2026-10-chapter-4, часть 52б): при ГЛПС в лихорадочном периоде — умеренная, в олигурическом — массивная, до
# десятков граммов на литр (347_2, разделы 1.6 и 2.3.1); при остром пиелонефрите — умеренная (приложение А3). Фон — игровая оценка
leak: { pct: 3 }
texts:
  hint:
    ru: "Белок в моче — почки пропускают то, что должны задерживать. При лихорадке, боли в пояснице и малом количестве мочи — довод за геморрагическую лихорадку с почечным синдромом; немного белка бывает при пиелонефрите и после нагрузки."
  present:
    - ru: "Белок в моче: повышен"
  absent:
    - ru: "Белок в моче: не обнаружен"
sources:
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: в начальном периоде — протеинурия, в олигурическом — массивная, до 33–66 г/л; раздел 2.3.1 (УУР С, УДД 4): общий анализ мочи в динамике всем с подозрением на ГЛПС; приложение А3: лёгкая — следы белка, среднетяжёлая — до 3,3 г/л, тяжёлая — больше 3,3 г/л; при пиелонефрите — умеренная протеинурия; фон — игровая оценка" }
