id: lab.eg_blood
name: { ru: "Этиленгликоль в крови" }
# химико-токсикологическое исследование (spec 2026-10-chapter-4, часть 57в): уровень этиленгликоля в крови и моче газовой
# хроматографией — всем с подозрением (873_1, раздел 2.3, УУР С, УДД 5); «„Золотым стандартом“ диагностики является исследование
# уровня гликолей (этиленгликоля) и их эфиров в крови и моче методом газовой хроматографии» (раздел 1.6.2). Без отравления не
# бывает — фон игровая оценка
leak: { pct: 0 }
texts:
  hint:
    ru: "Газовая хроматография нашла в крови этиленгликоль — так подтверждают отравление антифризом. Выше 0,2 г/л показан антидот — этанол, выше 0,5 г/л — гемодиализ; ацидоз при отравлении — повод к антидоту, даже если уровень ниже."
  present:
    - ru: "Хроматография: этиленгликоль в крови есть"
  absent:
    - ru: "Хроматография: этиленгликоля в крови нет"
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.6.2: золотой стандарт диагностики — уровень гликолей и их эфиров в крови и моче газовой хроматографией; раздел 2.3 (УУР С, УДД 5): уровень этиленгликоля в крови и моче всем с подозрением; раздел 3.2: уровень выше 0,2 г/л или ацидоз с увеличенным анионным интервалом — показание к этанолу, выше 0,5 г/л — к гемодиализу; фон — игровая оценка" }
