id: lab.acidosis
name: { ru: "Метаболический ацидоз" }
# кислотно-основное состояние (spec 2026-10-chapter-4, часть 57в): при отравлении метанолом «Среди метаболических нарушений ведущим
# является декомпенсированный метаболический ацидоз» (873_1, раздел 1.6.1), при этиленгликоле — ацидоз «с большим анионным разрывом»
# (раздел 1.6.2). По шкале тяжести отравлений pH — 7,25–7,32, 7,15–7,24 и ниже 7,15 (приложение Г2); pH 7,15 и ниже — показание к
# гемодиализу (раздел 3.2). Нормы в 873_1 нет — границы игровые; фон — игровая оценка
leak: { pct: 0.5 }
value:
  unit: ""
  ref: [7.35, 7.45]
  present: [6.95, 7.3]
  absent: [7.36, 7.44]
  decimals: 2
texts:
  hint:
    ru: "Кровь закислена: pH снижен, бикарбонат низкий. При отравлении метанолом и этиленгликолем анионный промежуток большой — копятся кислоты, в которые печень превращает яд. Ацидоз снимают натрия гидрокарбонатом; pH 7,15 и ниже — показание к гемодиализу."
  present:
    - ru: "pH {value}, бикарбонат снижен — метаболический ацидоз, анионный промежуток большой"
  absent:
    - ru: "pH {value}, бикарбонат в норме"
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.6.1: при метаноле ведущее метаболическое нарушение — декомпенсированный метаболический ацидоз; раздел 1.6.2: при этиленгликоле — метаболический ацидоз с большим анионным разрывом от гликолевой кислоты; раздел 2.3 (УУР С, УДД 5): КОС и газы крови при средней и тяжёлой степени; раздел 3.2: pH 7,15 и ниже и анионный промежуток выше 24 ммоль/л — показания к гемодиализу, ацидоз купируют натрия гидрокарбонатом; приложение Г2: pH по степеням тяжести; критерий качества 4; норма и фон — игровая оценка" }
