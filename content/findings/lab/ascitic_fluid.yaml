id: lab.ascitic_fluid
name: { ru: "Асцитическая жидкость получена" }
# жидкость из брюшной полости при диагностическом парацентезе (spec 2026-10-chapter-4, часть 54а): «обычно асцитическая
# жидкость прозрачна и имеет соломенный цвет» (715_2, раздел 2.3). Есть у каждого, у кого асцит — на осмотре или хотя бы на
# УЗИ, — и только у него: без жидкости игла ничего не набирает
leak: { pct: 0 }
follows: [sign.ascites, img.us_ascites]
texts:
  hint:
    ru: "Жидкость, набранная иглой из живота: при циррозе обычно прозрачная, соломенно-жёлтая. В ней считают нейтрофилы и ищут микробы — так находят инфекцию асцита, которая бывает почти без жалоб."
  present:
    - ru: "Получена асцитическая жидкость"
  absent:
    - ru: "Свободной жидкости нет — пунктат не получен"
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3: асцитическая жидкость обычно прозрачна, соломенного цвета; её направляют на микроскопию и посев; фон — игровая оценка" }
review: draft
