id: lab.afb_sputum
name: { ru: "Кислотоустойчивые микобактерии в мокроте" }
# фон — игровая оценка: нетуберкулёзные микобактерии микроскопия от туберкулёзных не отличает (КР «Туберкулез у
# взрослых», 16_4, раздел 2.3), но у взрослых без туберкулёза их в мокроте почти не бывает
leak: { pct: 0.05 }
salience: 3
texts:
  hint:
    ru: "В мазке мокроты под микроскопом видны кислотоустойчивые палочки. Человек выделяет микобактерии и заразен для окружающих: его направляют к фтизиатру в тот же день."
  present:
    - ru: "Микроскопия мокроты: найдены кислотоустойчивые микобактерии"
  absent:
    - ru: "Микроскопия мокроты: кислотоустойчивые микобактерии не найдены"
sources:
  - { kind: guideline, title: "Туберкулез у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/16_4", note: "ID 16_4, опубликованы 16.01.2026, применяются; сверено с рубрикатором 20.11.2026 по карточке, которую прислал владелец (вопрос 78), текст — по копии документа; раздел 2.3: микроскопия не отличает микобактерии туберкулёза от нетуберкулёзных, находит не больше 50 % впервые выявленных" }
review: draft
