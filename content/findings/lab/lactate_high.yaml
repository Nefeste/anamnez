id: lab.lactate_high
name: { ru: "Лактат выше 2 ммоль/л" }
# гипоперфузия (spec 2026-10-chapter-4, часть 48а): «Значения выше 2 ммоль/л четко свидетельствуют о наличии
# гипоперфузии» (898_1, раздел 2.5); у здорового в покое не бывает — игровая оценка
leak: { pct: 1 }
value:
  unit: "ммоль/л"
  ref: [0.5, 2.0]
  present: [2.3, 7.5]
  absent: [0.6, 1.8]
  decimals: 1
texts:
  hint:
    ru: "Молочная кислота копится, когда тканям не хватает кислорода. Выше 2 ммоль/л — признак гипоперфузии: при сепсисе так узнают шок, а по снижению лактата судят, помогает ли лечение."
  present:
    - ru: "Лактат {value} {unit}"
  absent:
    - ru: "Лактат {value} {unit}"
sources:
  - { kind: guideline, title: "Сепсис (у взрослых)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/898_1", note: "ID 898_1, опубликованы 27.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.5: значения лактата выше 2 ммоль/л четко свидетельствуют о гипоперфузии; раздел 2: критерий септического шока — лактат выше 2 ммоль/л несмотря на инфузию; диапазоны чисел — игровая оценка" }
review: draft
