id: lab.oxalate_crystals
name: { ru: "Кристаллы оксалата кальция в моче" }
# отравление этиленгликолем (spec 2026-10-chapter-4, часть 57в): щавелевая кислота связывает кальций в оксалаты (873_1, раздел 1.2);
# «Кристаллы оксалата кальция могут появиться в моче еще в первой фазе, но их отсутствие не исключает отравление этиленгликолем»
# (раздел 1.6.2). Бывают и без отравления — фон игровая оценка
leak: { pct: 2 }
texts:
  hint:
    ru: "В осадке мочи — кристаллы оксалата кальция. Бывают и у здоровых, но вместе с ацидозом, болью в животе и пояснице после «опьянения» — довод за отравление этиленгликолем. Их нет — отравление это не исключает."
  present:
    - ru: "В осадке мочи — кристаллы оксалата кальция"
  absent:
    - ru: "Кристаллов оксалата в моче нет"
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.2: щавелевая кислота осаждает кальций в виде оксалатов; раздел 1.6.2: кристаллурия, кристаллы оксалата кальция могут появиться в моче ещё в первой фазе, но их отсутствие отравления не исключает, в гепаторенальной фазе в осадке — оксалаты; фон — игровая оценка" }
review: draft
