id: lab.troponin_rise
name: { ru: "Прирост тропонина T за час 5 нг/л и больше" }
leak: never
# второй анализ алгоритма 0/1 час (spec 2026-10-chapter-3, часть 39в; 154_4, приложение А3): прирост 5 и
# больше — острый некроз подтверждён, меньше 3 при первом ниже 12 — исключён; «серой зоны» 3–4 в игре нет
value:
  unit: "нг/л"
  ref: [0, 2]
  present: [5, 300]
  absent: [0, 2]
  decimals: 0
texts:
  hint:
    ru: "Насколько тропонин вырос за час между двумя анализами. Прирост 5 нг/л и больше — некроз идёт сейчас, инфаркт подтверждён; меньше 3 при первом анализе ниже 12 — инфаркт исключён. Повышенный, но неподвижный тропонин бывает и без инфаркта — при болезни почек, сердечной недостаточности."
  present:
    - ru: "Через час тропонин T вырос на {value} {unit} — 5 и больше: острый некроз миокарда подтверждён"
  absent:
    - ru: "Через час тропонин T почти не изменился: прирост {value} {unit} — меньше 3"
sources:
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 04.10.2026; приложение А3, алгоритм 0/1 час для тропонина T: прирост за час 5 нг/л и больше — подтверждён, меньше 3 при первом ниже 12 — исключён; раздел 2.3: повышенный тропонин без инфаркта — при нарушенной функции почек, сердечной недостаточности, ТЭЛА, миокардите" }
review: draft
