id: lab.platelets_low
name: { ru: "Тромбоциты ниже 100" }
# тромбоцитопения при инфекционно-токсическом шоке (spec 2026-10-chapter-4, часть 50а; 1020_1, раздел 2.3 и приложение А3.6):
# меньше 100 × 10⁹/л — показание к реанимации (раздел 6.1) и противопоказание к пункции (приложение А3.3). Без болезни
# почти не бывает — игровая оценка
leak: { pct: 1 }
value:
  unit: "×10⁹/л"
  ref: [150, 400]
  present: [20, 95]
  absent: [160, 380]
  decimals: 0
texts:
  hint:
    ru: "Тромбоциты — кровяные пластинки, которые останавливают кровотечение. Меньше 100 × 10⁹/л — кровоточивость: при шоке их расходует свёртывание в мелких сосудах. Люмбальную пункцию с такими тромбоцитами не делают — кровь может излиться у спинного мозга."
  present:
    - ru: "Тромбоциты {value} {unit}"
  absent:
    - ru: "Тромбоциты {value} {unit}"
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 2.3: при ИТШ — лейкопения, тромбоцитопения; приложение А3.6: прогрессирующая тромбоцитопения — во II фазе ИТШ 50 тыс. и менее, в III — менее 20 тыс.; раздел 6.1: тромбоцитопения менее 100 тыс./мкл — показание к ОРИТ; приложение А3.3: тромбоциты менее 100 × 10⁹/л — противопоказание к спинномозговой пункции; диапазоны — игровая оценка" }
review: draft
