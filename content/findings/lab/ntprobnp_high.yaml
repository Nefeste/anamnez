id: lab.ntprobnp_high
name: { ru: "NT-proBNP выше порога для возраста" }
# натрийуретический пептид при острой одышке (spec 2026-10-chapter-3, часть 43в; 156_2, раздел 7.3.2): за ОДСН — больше
# 450 пг/мл моложе 55 лет, больше 900 — в 55–75, больше 1800 — старше 75; ниже 300 — ОДСН исключена. Число в карте не
# показано: порог у каждого возраста свой. Повышен ли он без ОДСН — в точности анализа (ICON)
leak: never
texts:
  hint:
    ru: "NT-proBNP — осколок гормона, который выделяет растянутое сердце. Выше порога для возраста — острая сердечная недостаточность вероятна; ниже 300 пг/мл — исключена. Ложно низкий бывает при ожирении и очень быстром начале, высокий без неё — при фибрилляции предсердий и болезнях почек."
  present:
    - ru: "NT-proBNP выше порога для возраста — острая сердечная недостаточность вероятна"
  absent:
    - ru: "NT-proBNP не выше порога для возраста"
sources:
  - { kind: guideline, title: "Хроническая сердечная недостаточность", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/156_2", note: "ID 156_2, опубликованы 07.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 7.3.2: NT-proBNP ниже 300 пг/мл исключает ОДСН; за ОДСН — больше 450 пг/мл моложе 55 лет, больше 900 в 55–75 лет, больше 1800 старше 75; ложно низкий — при ожирении, крайне быстром утяжелении, правожелудочковой недостаточности; высокий — при ФП и тяжёлой почечной дисфункции" }
  - { kind: paper, title: "Januzzi JL, van Kimmenade R, Lainchbury J и др. NT-proBNP testing for diagnosis and short-term prognosis in acute destabilized heart failure: an international pooled analysis of 1256 patients: the International Collaborative of NT-proBNP Study. Eur Heart J 2006;27(3):330–337", url: "https://pubmed.ncbi.nlm.nih.gov/16293638/", note: "PMID 16293638, сверено 05.10.2026: 1256 пришедших с одышкой, острая СН — у 720 (57,3 %); пороги по возрасту 450, 900 и 1800 пг/мл — чувствительность 90 %, специфичность 84 %; ниже 300 — отрицательная предсказательная ценность 98 %" }
review: draft
