id: lab.csf_blood
name: { ru: "Кровь в ликворе" }
# кровоизлияние, дошедшее до ликвора (spec 2026-10-chapter-4, часть 50а): пункцию делают, чтобы найти кровь в
# спинномозговой жидкости, если нет КТ и МРТ (523_3, раздел 2.4); при субарахноидальном кровоизлиянии кровь — в самом
# ликворном пространстве, при внутримозговом — когда прорвалась в желудочки. Без кровоизлияния — игровая оценка: кровь
# из сосуда, задетого иглой, в игре не моделируется
leak: { pct: 0 }
texts:
  hint:
    ru: "Ликвор окрашен кровью, а после того как пробирку отстояли, остаётся желтоватым: кровь попала в ликвор до пункции. Так узнают кровоизлияние под оболочки мозга, если нет компьютерного или магнитно-резонансного томографа."
  present:
    - ru: "Ликвор окрашен кровью, после отстаивания — желтоватый"
  absent:
    - ru: "Ликвор бесцветный, крови нет"
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР С, УДД 4): спинномозговая пункция при симптомах геморрагического инсульта, если нельзя сделать КТ или МРТ, — для определения крови в ликворе; при признаках дислокации противопоказана; раздел 1.6: кровь в ликворе при прорыве гематомы; ксантохромия — игровая оценка" }
review: draft
