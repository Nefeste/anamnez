id: lab.cdiff_gdh
name: { ru: "Антиген C. difficile (ГДГ) в кале" }
# первая ступень двухступенчатого алгоритма (spec 2026-10-chapter-4, часть 49б; 878_1, раздел 2.3): ПЦР на ДНК
# C. difficile или глутаматдегидрогеназа; отрицательный — инфекция исключается. Положительна и у носителей: токсигенными
# штаммами колонизированы около 5 % взрослых (раздел 1.2) — это фон
leak: { pct: 5 }
texts:
  hint:
    ru: "Первый шаг теста на C. difficile: ищут сам микроб. Отрицательный — энтероколита нет. Положительный бывает и у носителя без болезни, поэтому вторым шагом ищут токсины."
  present:
    - ru: "Антиген C. difficile в кале: положительный"
  absent:
    - ru: "Антиген C. difficile в кале: отрицательный"
sources:
  - { kind: guideline, title: "Энтероколит, вызванный Clostridioides difficile (C. difficile)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/878_1", note: "ID 878_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.3: двухступенчатый алгоритм — ПЦР или ГДГ, при положительном — токсины A и B; отрицательный первый шаг исключает инфекцию; раздел 1.2: около 5 % взрослых колонизированы токсигенными штаммами" }
review: draft
