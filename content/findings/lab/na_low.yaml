    ru: "Натрия в крови мало. При рвоте с низким давлением, слабостью и тёмной кожей — прежде всего надпочечниковый криз; бывает и от мочегонных, при циррозе. Сам по себе натрий диагноз не ставит, но показывает, насколько тяжело больному."
