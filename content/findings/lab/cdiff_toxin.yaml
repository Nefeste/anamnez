id: lab.cdiff_toxin
name: { ru: "Токсины A и B C. difficile в кале" }
# вторая ступень (spec 2026-10-chapter-4, часть 49б; 878_1, раздел 2.3): токсины A и B иммунохроматографией или ИФА.
# Токсин быстро разрушается при комнатной температуре, тест бывает отрицательным в начале болезни и при осложнённом
# течении — у части больных его нет (полоса в записи болезни). Фон — игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "Второй шаг теста на C. difficile: токсины, которыми микроб повреждает кишку. Найдены — энтероколит подтверждён. Не найдены при найденном микробе — либо носительство, либо токсин пропустили: решает картина болезни."
  present:
    - ru: "Токсины A и B C. difficile в кале: найдены"
  absent:
    - ru: "Токсины A и B C. difficile в кале: не найдены"
sources:
  - { kind: guideline, title: "Энтероколит, вызванный Clostridioides difficile (C. difficile)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/878_1", note: "ID 878_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.3, таблицы 2–3: ИХА на токсины — 15–30 минут, чувствительность 29–79 %, специфичность 89–100 %; токсин разрушается при комнатной температуре примерно за 2 часа; при положительном первом шаге и отрицательных токсинах — тщательная клиническая оценка" }
review: draft
