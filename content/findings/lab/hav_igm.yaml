id: lab.hav_igm
name: { ru: "Антитела IgM к вирусу гепатита A" }
# анти-HAV IgM (spec 2026-10-chapter-4, часть 52а): «появляются в крови с конца инкубационного периода - первых дней
# манифестации», держатся в среднем 3 месяца (718_2, раздел 2.3); подтверждают гепатит A у любого варианта течения (УУР C,
# УДД 4). Бывают и в первые недели после прививки — фон игровая оценка
leak: { pct: 0.3 }
texts:
  hint:
    ru: "ИФА на антитела IgM к вирусу гепатита A: появляются уже в первые дни болезни и держатся около трёх месяцев. Подтверждают гепатит A; бывают и в первые недели после прививки от него."
  present:
    - ru: "ИФА: анти-HAV IgM обнаружены"
  absent:
    - ru: "Анти-HAV IgM нет"
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3 (УУР C, УДД 4): анти-HAV IgM методом ИФА — при любом варианте течения для этиологического подтверждения; появляются с конца инкубационного периода — первых дней манифестации, циркулируют от нескольких недель до 4–6 месяцев; возможны в ближайшие недели после вакцинации; чувствительности и специфичности в тексте нет" }
