id: lab.ascites_pmn_250
name: { ru: "Нейтрофилов в асцитической жидкости больше 250" }
# критерий спонтанного бактериального перитонита (spec 2026-10-chapter-4, часть 54а): «обязательно обнаружение нейтрофилов
# более 250 в 1 мм³ независимо от результата посева» (715_2, раздел 1.5), «при отсутствии перфораций или воспаления органов
# брюшной полости» (раздел 2.3). Без инфекции асцита не бывает; диапазоны — игровая оценка
leak: { pct: 0 }
