  unit: "клеток в 1 мм³"
  ref: [0, 250]
  present: [300, 4000]
  absent: [10, 200]
  decimals: 0
texts:
  hint:
    ru: "Нейтрофилы — клетки, которые первыми борются с бактериями. Больше 250 в 1 мм³ асцитической жидкости — спонтанный бактериальный перитонит, даже если жалоб почти нет: антибиотик в вену сразу, и альбумин."
  present:
    - ru: "Нейтрофилов {value} {unit}"
  absent:
    - ru: "Нейтрофилов {value} {unit}"
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.5: СБП — нейтрофилов более 250 в 1 мм³ независимо от посева; раздел 2.3 (УУР B, УДД 2): подсчёт нейтрофилов в асцитической жидкости, более 250 клеток/мм³ — критерий СБП при отсутствии перфораций и воспаления органов брюшной полости; диапазоны — игровая оценка" }
