id: lab.ast_over_alt
name: { ru: "АСТ выше АЛТ" }
# коэффициент де Ритиса при повышенных ферментах (spec 2026-10-chapter-4, часть 54б): при алкогольном гепатите «Как правило,
# уровень АСТ выше, чем АЛТ (индекс де Ритиса – АСТ/АЛТ > 1.)» (711_2, раздел 2.3), АБП подозревают и по «коэффициент де Ритиса
# > 1 (АСТ/АЛТ)» (раздел 2). При остром гепатите A нарастает «особенно аланинаминотрансферазы» (718_2, раздел 1.6). У здорового
# соотношение не толкуют — фон игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "АСТ и АЛТ — ферменты клеток печени. Если они повышены и АСТ выше АЛТ (коэффициент де Ритиса больше 1), думают об алкогольном поражении печени; при остром вирусном гепатите обычно выше АЛТ."
  present:
    - ru: "АСТ выше АЛТ: коэффициент де Ритиса больше 1"
  absent:
    - ru: "АСТ не выше АЛТ"
sources:
  - { kind: guideline, title: "Алкогольная болезнь печени", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/711_2", note: "ID 711_2, опубликованы 30.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2: АБП подозревают по коэффициенту де Ритиса больше 1 (АСТ/АЛТ); раздел 2.3: при некрозе гепатоцитов АЛТ и АСТ более чем вдвое выше нормы, но редко больше 300, как правило АСТ выше АЛТ; фон — игровая оценка" }
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: в желтушном периоде резко нарастает активность аминотрансфераз, особенно аланинаминотрансферазы" }
review: draft
