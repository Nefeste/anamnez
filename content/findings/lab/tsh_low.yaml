id: lab.tsh_low
name: { ru: "ТТГ ниже 0,1 мМЕ/л" }
# то же измерение, что «ТТГ повышен» (spec 2026-10-chapter-4, часть 56б): «При тиреотоксикозе уровень тиреотропного гормона
# (ТТГ) должен быть низким (<0,1 мЕ/л)» (270_2, раздел 2.3.1, УУР С, УДД 4) — порог игры тот же. Фон — субклинический
# тиреотоксикоз и тяжёлые болезни не щитовидной железы, игровая оценка
leak: { pct: 1 }
value:
  unit: "мМЕ/л"
  ref: [0.4, 4.0]
  present: [0.01, 0.08]
  absent: [0.6, 3.8]
  decimals: 2
  of: lab.tsh_high
texts:
  hint:
    ru: "ТТГ почти не определяется: щитовидная железа выделяет столько гормонов, что гипофиз перестаёт её подгонять. Это главный признак тиреотоксикоза. Дальше — свободный Т4 и ЭКГ, а перед тиамазолом — анализ крови."
  present:
    - ru: "ТТГ {value} {unit} — ниже 0,1"
sources:
