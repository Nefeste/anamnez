id: lab.csf_protein_high
name: { ru: "Белок в ликворе повышен" }
# воспаление оболочек (spec 2026-10-chapter-4, часть 50а): при менингококковом менингите — «до 1,5–6 г/л и более» (1020_1,
# раздел 1.6), норма — меньше 0,45 г/л (раздел 6.2). Диапазон — игровая оценка
leak: { pct: 0 }
value:
  unit: "г/л"
  ref: [0.15, 0.45]
  present: [0.8, 4.5]
  absent: [0.2, 0.4]
  decimals: 2
texts:
  hint:
    ru: "Белка в ликворе в норме меньше 0,45 г/л. Больше — оболочки мозга воспалены или в ликвор попала кровь: при гнойном менингите белок поднимается до нескольких граммов на литр."
  present:
    - ru: "Белок в ликворе {value} {unit}"
  absent:
    - ru: "Белок в ликворе {value} {unit}"
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 1.6: белок в ликворе до 1,5–6 г/л и более; раздел 6.2: при выздоровлении — менее 0,45 г/л; приложение А3.4: у менингококкового менингита — 0,9 и выше, у вирусных серозных — 0,4–1,2; диапазон — игровая оценка" }
