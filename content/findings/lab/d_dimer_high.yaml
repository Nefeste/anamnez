sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.3 (УУР В): лабораторные тесты для подтверждения ТГВ не рекомендуются; при низкой вероятности по шкале Уэллса D-димер — альтернатива УЗИ: в норме ТГВ исключён с высокой вероятностью, повышен — направить на УЗИ; раздел 3.9.2.1: пороговое значение 500 нг/мл" }
  - { kind: paper, title: "Stein PD, Hull RD, Patel KC, Olson RE, Ghali WA, Brant R, Biel RK, Bharadia V, Kalra NK. D-dimer for the exclusion of acute venous thrombosis and pulmonary embolism: a systematic review. Ann Intern Med 2004;140(8):589–602", url: "https://pubmed.ncbi.nlm.nih.gov/15096330/", note: "PMID 15096330, сверено 30.09.2026: при ТГВ чувствительность ELISA — 0,96, отношение правдоподобия отрицательного результата — 0,12; быстрого количественного ELISA — 0,96 и 0,09; положительного — 1,5–2,5: повышенный D-димер мало что доказывает" }
