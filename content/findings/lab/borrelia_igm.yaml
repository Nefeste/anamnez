id: lab.borrelia_igm
name: { ru: "Антитела к боррелиям" }
# антитела к боррелиям в крови (spec 2026-10-chapter-4, часть 51а): IgM — со 2-й недели болезни, кровь — не раньше 10–14 дней
# от начала (566_2, разделы 2 и 2.3.2); при эритеме в первые дни их ещё нет
leak: never
texts:
  hint:
    ru: "ИФА на антитела к боррелиям: IgM появляются со 2-й недели болезни, поэтому в первые дни анализ бывает отрицательным. При мигрирующей эритеме он для диагноза не нужен, при поражении нервов и сердца — подтверждает болезнь Лайма."
  present:
    - ru: "ИФА: антитела IgM к боррелиям"
  absent:
    - ru: "Антител к боррелиям нет"
sources:
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2: IgM — со 2 недели болезни, IgG — с 4 недели; раздел 2.3.2: исследование не ранее чем через 10–14 дней от начала, ранние результаты бывают ложноотрицательными; чувствительности и специфичности в тексте нет" }
review: draft
