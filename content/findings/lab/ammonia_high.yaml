id: lab.ammonia_high
name: { ru: "Аммиак крови повышен" }
# гипераммониемия (spec 2026-10-chapter-4, часть 54а): «ключевой фактор» печёночной энцефалопатии; при циррозе аммиак
# растёт от потери гепатоцитов и портосистемного шунтирования (715_2, раздел 1.2) — бывает и без явной энцефалопатии. Аммиак
# крови — при диагностически неясной энцефалопатии (раздел 2.5). Диапазоны — игровая оценка
leak: { pct: 0.3 }
value:
  unit: "мкмоль/л"
  ref: [11, 35]
  present: [60, 200]
  absent: [15, 34]
  decimals: 0
texts:
  hint:
    ru: "Аммиак — яд для мозга; его обезвреживает печень. При циррозе он копится в крови и вызывает печёночную энцефалопатию. Повышен аммиак — довод за неё; нормальный при спутанности — повод искать другую причину."
  present:
    - ru: "Аммиак {value} {unit}"
  absent:
    - ru: "Аммиак {value} {unit}"
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.2: гипераммониемия — ключевой фактор патогенеза ПЭ, её причины при ЦП — потеря перипортальных гепатоцитов и портосистемное шунтирование; раздел 2.5 (УУР C, УДД 5): при диагностически неясной энцефалопатии — невролог и уровень аммиака в крови; диапазоны — игровая оценка" }
review: draft
