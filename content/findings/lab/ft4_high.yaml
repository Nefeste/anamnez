# явный тиреотоксикоз (spec 2026-10-chapter-4, часть 56б): «При манифестном тиреотоксикозе определяется повышенный уровень CТ4
# и/или CТ3 в крови» (270_2, раздел 2.3.1, УУР C, УДД 4). Референса в 270_2 нет — границы и числа игровые, как у типичной
