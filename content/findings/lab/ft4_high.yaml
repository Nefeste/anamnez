texts:
  hint:
    ru: "Свободный тироксин — гормон щитовидной железы в крови. При низком ТТГ высокий свободный Т4 значит явный тиреотоксикоз: железа работает с избытком. Через 3–4 недели на тиамазоле его проверяют снова — ТТГ ещё долго остаётся низким."
  present:
    - ru: "Свободный Т4 {value} {unit} — выше нормы"
  absent:
    - ru: "Свободный Т4 {value} {unit}"
sources:
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2.3.1 (УУР C, УДД 4): при низком ТТГ — свободный Т4 и свободный Т3, при манифестном тиреотоксикозе они повышены; раздел 3.1.1: нормализация через 3–4 недели, ТТГ может оставаться низким до 4 месяцев; референс и числа — игровая оценка" }
