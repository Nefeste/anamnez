id: lab.glucose_low
name: { ru: "Гипогликемия" }
# то же измерение, что «Глюкоза крови повышена» (часть 41а): «маска» инсульта, глюкозу перед
# тромболизисом проверяют каждому; у болезней базы гипогликемии пока нет — она придёт с частью 44
leak: { pct: 0 }
value:
  unit: "ммоль/л"
  ref: [3.9, 6.0]
  present: [1.6, 2.9]
  absent: [4.2, 5.9]
  decimals: 1
  of: lab.glucose_high
texts:
  hint:
    ru: "Глюкоза ниже 3,0 ммоль/л — гипогликемия, требующая немедленного лечения. Она бывает «маской» инсульта: слабость и нарушение речи проходят, когда поднимают сахар. Поэтому перед тромболизисом глюкозу проверяют каждому."
  present:
    - ru: "Глюкоза {value} {unit} — гипогликемия"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.3: гипо- или гипергликемия — имитатор («маска») инсульта; уровень гликемии — единственный лабораторный показатель, необходимый перед тромболизисом" }
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 03.10.2026; раздел 3.7: уровень 2 — глюкоза плазмы ниже 3,0 ммоль/л, клинически значимая гипогликемия, требующая немедленного купирования" }
review: draft
