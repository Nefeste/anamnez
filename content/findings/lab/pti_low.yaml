id: lab.pti_low
name: { ru: "Протромбиновый индекс снижен" }
# свёртываемость при гепатитах (spec 2026-10-chapter-4, часть 52а): ПТИ — «синтетической функции печени»; при гепатите A
# тяжёлая — ПТИ «Менее 50» (718_2, приложение А3), при гепатите B — «Менее 80» (672_2, приложение А3). Снижается и на
# антикоагулянтах, при ДВС — фон игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "Печень делает белки свёртывания; протромбиновый индекс показывает, сколько их. Снижен при остром гепатите — тяжёлая форма: при гепатите A ниже 50 %, при гепатите B ниже 80 %. Ещё ниже и с энцефалопатией — печёночная недостаточность."
  present:
    - ru: "Протромбиновый индекс снижен"
  absent:
    - ru: "Протромбиновый индекс в норме"
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; приложение А3: ПТИ более 60 % — лёгкая форма, 50–60 — средняя, менее 50 — тяжёлая; раздел 3.2: МНО больше 1,5 и печёночная энцефалопатия — консультация трансплантолога и направление в центр трансплантации печени" }
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; приложение А3: ПТИ 80–100 % — лёгкая и средняя форма, менее 80 — тяжёлая; раздел 1.6: белково-синтетическая функция нарушается при тяжёлом течении" }
review: draft
