name: { ru: "Метанол в крови" }
# химико-токсикологическое исследование (spec 2026-10-chapter-4, часть 57в): «Рекомендовано исследование уровня этанола, метанола
# и этиленгликоля в крови и моче всем пациентам с подозрением на отравление метанолом или этиленгликолем» — газовой хроматографией
# (873_1, раздел 2.3, УУР С, УДД 5; критерии качества 6 и 7). Уровень выше 0,2 г/л — показание к этанолу, выше 0,5 г/л — к
# гемодиализу (раздел 3.2). Без отравления не бывает — фон игровая оценка
leak: { pct: 0 }
texts:
  hint:
    ru: "Газовая хроматография нашла в крови метанол. Это подтверждает отравление. Выше 0,2 г/л показан антидот — этанол, выше 0,5 г/л — гемодиализ; ацидоз при метаноле — повод к антидоту, даже если уровень ниже."
  present:
    - ru: "Хроматография: метанол в крови есть"
  absent:
    - ru: "Хроматография: метанола в крови нет"
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2.3 (УУР С, УДД 5): метанол, этиленгликоль и этанол в крови и моче — газовой хроматографией всем с подозрением, для дифференциальной диагностики и решения об антидоте; раздел 3.2: уровень выше 0,2 г/л или ацидоз с увеличенным анионным интервалом — показание к этанолу, выше 0,5 г/л — к гемодиализу; критерии качества 6 и 7; фон — игровая оценка" }
