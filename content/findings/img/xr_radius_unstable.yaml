id: img.xr_radius_unstable
name: { ru: "Признаки нестабильного перелома лучевой кости" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Раздроблен метаэпифиз, кость укорочена больше чем на 5 мм, угол больше 10 градусов или ступенька суставной поверхности больше 2 мм. Такой перелом в гипсе не удержать — его оперируют."
  present:
    - ru: "Многооскольчатый перелом метаэпифиза, укорочение лучевой кости более 5 мм, ступенька суставной поверхности"
  absent:
    - ru: "Признаков нестабильности перелома нет"
sources:
  - { kind: guideline, title: "Переломы дистального отдела костей предплечья", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/846_1", note: "ID 846_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: критерии нестабильности — значительная фрагментация метаэпифиза, угловая деформация 10 градусов и более, укорочение более 5 мм, смещение фрагментов суставной поверхности более 2 мм, вывих или подвывих кисти" }
