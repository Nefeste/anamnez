    - ru: "Вены голени не сжимаются датчиком, в просвете — тромб"
  absent:
    - ru: "Глубокие вены голени сжимаются"
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: при дистальном тромбозе чувствительность УЗИ с картированием кровотока — 71–75 %, компрессионного — не выше 57 %; раздел 1.6: дистальный тромбоз — до 50 % всех ТГВ" }
