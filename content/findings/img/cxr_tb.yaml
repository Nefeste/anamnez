id: img.cxr_tb
name: { ru: "Очаги и инфильтрация в верхних отделах" }
# такие тени на снимке — повод направить в противотуберкулёзный диспансер в 3-дневный срок: «очаговые тени, ограниченные
# затенения легочной ткани (участки инфильтрации), округлые и полостные образования, диссеминация» (приказ № 932н,
# пункт 12). Верхние отделы — игровое упрощение: там вторичный туберкулёз чаще всего; фон — игровая оценка
leak: { pct: 0.2 }
attrs:
  side:
    right: { ru: "справа" }
    left: { ru: "слева" }
    both: { ru: "с обеих сторон" }
texts:
  hint:
    ru: "В верхних отделах лёгкого — неоднородное затенение с мелкими очагами вокруг. Так часто выглядит туберкулёз; на антибиотики, как пневмония, такие тени быстро не уходят."
  present:
    - ru: "В верхних отделах {side} — неоднородная инфильтрация и очаговые тени"
  absent:
    - ru: "Очаговых теней в верхних отделах нет"
sources:
  - { kind: guideline, title: "Об утверждении Порядка оказания медицинской помощи больным туберкулезом (приказ № 932н)", org: "Минздрав России", year: 2012, note: "приказ от 15.11.2012 № 932н, зарегистрирован в Минюсте России 07.03.2013 № 27557; пункт 12: в противотуберкулёзный диспансер в 3-дневный срок направляют, если на снимке очаговые тени, участки инфильтрации, округлые и полостные образования, диссеминация; сверено 20.11.2026" }
