  hint:
    ru: "Кровь под паутинной оболочкой мозга: на КТ светлые борозды, щели и цистерны, где обычно тёмная жидкость. Чаще всего — из разорвавшейся аневризмы: перевод в нейрохирургию, аневризму выключают в первые 72 часа."
