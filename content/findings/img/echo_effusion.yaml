id: img.echo_effusion
name: { ru: "Выпот в перикарде" }
# у перикардита — до 60 %, обычно небольшой (ESC 2015, раздел 3.1); у сердечной недостаточности бывает транссудат
# (746_2, раздел 2.4) — в игре фон, игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "Между листками перикарда — жидкость: на УЗИ тёмная полоска вокруг сердца. Небольшой выпот — листки расходятся меньше чем на сантиметр — бывает при перикардите и сердечной недостаточности."
  present:
    - ru: "Выпот в перикарде: листки расходятся"
  absent:
    - ru: "Выпота в перикарде нет"
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.4: ЭхоКГ всем с перикардитом (ЕОК IC); расхождение листков меньше 1 см — около 300 мл, 1–2 см — около 500 мл, больше 2 см — больше 700 мл; транссудат — при тяжёлой ХСН; фон — игровая оценка" }
  - { kind: guideline, title: "Adler Y, Charron P, Imazio M et al. 2015 ESC Guidelines for the diagnosis and management of pericardial diseases. Eur Heart J 2015;36(42):2921–2964", url: "https://pubmed.ncbi.nlm.nih.gov/26320112/", note: "PMID 26320112, PMC7539677, сверено 05.10.2026; раздел 3.1: выпот — до 60 %, обычно небольшой" }
review: draft
