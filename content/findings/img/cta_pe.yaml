id: img.cta_pe
name: { ru: "Тромбоэмболы в лёгочных артериях на КТ-ангиографии" }
# дефекты наполнения в лёгочных артериях (spec 2026-10-chapter-3, часть 43б): тромб, который контраст обтекает; без
# тромбоэмболии не бывает — пропустить или найти лишнее может само обследование
leak: { pct: 0 }
redFlag: true
# где тромбы — по параметру болезни: в ветвях обеих лёгочных артерий или одной
attrs:
  side:
    both: { ru: "в ветвях обеих лёгочных артерий" }
    right: { ru: "в правой лёгочной артерии и её ветвях" }
    left: { ru: "в левой лёгочной артерии и её ветвях" }
fallback: { side: both }
texts:
  hint:
    ru: "На срезе с контрастом лёгочные артерии светлые, а тромб — тёмное пятно, которое контраст обтекает. Тромб хотя бы в сегментарной ветви подтверждает тромбоэмболию лёгочной артерии."
  present:
    - ru: "Дефекты наполнения {side} — тромбоэмболия"
  absent:
    - ru: "Дефектов наполнения в лёгочных артериях нет"
sources:
  - { kind: guideline, title: "Рекомендации ESC по диагностике и лечению острой легочной эмболии, разработанные в сотрудничестве с Европейским респираторным обществом (ERS)", org: "ESC, ERS", year: 2019, url: "https://doi.org/10.15829/1560-4071-2020-3848", note: "перевод — Российский кардиологический журнал 2020;25(8):3848 (решение владельца, вопрос 25); стр. 15–16, раздел 4.5: КТ-ангиография лёгочных артерий — метод выбора при подозрении на ТЭЛА; стр. 34–35, раздел 7.1.2.1: изменения диагностически значимы при тромбе как минимум на сегментарном уровне" }
review: draft
