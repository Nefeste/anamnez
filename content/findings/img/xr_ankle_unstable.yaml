id: img.xr_ankle_unstable
name: { ru: "Нестабильный перелом лодыжек: сдвиг таранной кости" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Сломаны обе лодыжки, таранная кость сдвинулась кнаружи, щель у внутренней лодыжки шире 5 мм. Два повреждения кольца сустава — перелом нестабильный, его оперируют."
  present:
    - ru: "Двухлодыжечный перелом, подвывих стопы кнаружи, медиальная суставная щель расширена более 5 мм"
  absent:
    - ru: "Конгруэнтность суставных поверхностей сохранена, таранная кость не смещена"
sources:
  - { kind: guideline, title: "Переломы лодыжек", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/855_1", note: "ID 855_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: нестабильность — два и более повреждения кольца сустава, например переломы обеих лодыжек; раздел 2.4: медиальная часть сочленения в норме меньше 5 мм" }
