id: img.cta_occlusion
name: { ru: "Окклюзия крупной артерии мозга" }
# на КТ-ангиографии (часть 41а): у инсульта при NIHSS 6 и больше — повод для тромбэктомии
leak: { pct: 0 }
texts:
  hint:
    ru: "Крупная артерия мозга — внутренняя сонная, средняя мозговая, основная — перекрыта тромбом. Тромболизис такой тромб растворяет редко; его извлекают тромбэктомией в сосудистом центре, чем раньше, тем лучше."
  present:
    - ru: "Крупная артерия мозга перекрыта тромбом: контраст дальше не идёт"
  absent:
    - ru: "Крупные артерии мозга проходимы"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.1.2.1.3: тромбэктомия при окклюзии внутренней сонной и проксимальной части средней мозговой артерии; раздел 3.1.2.1.2: вероятность реперфузии снижается на 22 % каждый час" }
