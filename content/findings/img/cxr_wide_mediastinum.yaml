# тень над сердцем шире обычного (spec 2026-10-chapter-3, часть 43а): в алгоритме 946_1 (приложение Б) —
# «Расширение средостения» ведёт к КТ. Без расслоения — у пожилых с развёрнутой аортой, при опухоли; фон —
# игровая оценка
leak: { pct: 0.5 }
texts:
  hint:
    ru: "Тень над сердцем на снимке шире обычного, контур аорты изменён. Так бывает при расширенной или расслоённой аорте. При боли в груди — повод для КТ-ангиографии; нормальное средостение расслоения не исключает."
  present:
    - ru: "Верхнее средостение расширено, контур аорты изменён"
  absent:
    - ru: "Средостение не расширено"
