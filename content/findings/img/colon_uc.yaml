# Язвенный колит на эндоскопии (spec 2026-10-chapter-4, часть 55а): «Наиболее характерными являются диффузное воспаление,
# ограниченное слизистой оболочкой, начинающееся в прямой кишке и распространяющееся проксимальнее, с четкой границей
# воспаления»; активность — контактная ранимость, нет сосудистого рисунка, эрозии и изъязвления (193_2, раздел 2.4). Прямая
# кишка вовлечена обязательно (раздел 1.1) — его видит и сигмоидоскопия. Инфекционный колит на эндоскопии в игре не описан
