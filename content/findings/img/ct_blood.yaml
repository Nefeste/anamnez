# Кровь внутри черепа на КТ (spec 2026-10-chapter-3, часть 40): ради неё КТ делают после травмы
# головы и до тромболизиса при инсульте. С частью 41в — у внутримозгового и субарахноидального
# кровоизлияния; где кровь и сколько её, КТ уточняет следующими строками — только когда кровь видна
id: img.ct_blood
name: { ru: "Кровь внутри черепа" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Свежая кровь на КТ светлее мозга: у свода черепа — полоской или линзой, в веществе мозга — пятном, в бороздах и цистернах — светлыми линиями. Кровь внутри черепа — абсолютное противопоказание к тромболизису."
  present:
    - ru: "Внутри черепа свежая кровь: участки повышенной плотности"
  absent:
    - ru: "Крови внутри черепа нет"
sources:
