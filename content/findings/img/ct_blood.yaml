texts:
  hint:
    ru: "Свежая кровь на КТ светлее мозга: у свода черепа — полоской или линзой, в веществе мозга — пятном, в бороздах и цистернах — светлыми линиями. От внутричерепных гематом — почти вся смертность при лёгкой черепно-мозговой травме."
