id: img.mri_disc_herniation
name: { ru: "Грыжа диска сдавливает корешок" }
# МРТ позвоночника (spec 2026-10-chapter-4, часть 58б): грыжу видят и у многих без боли — «их обнаружение, например, при МРТ
# или КТ позвоночника у пациента с болью в спине не означает, что они служат её причиной» (777_1, раздел 1.2): фон — каждый
# пятый, игровая оценка
leak: { pct: 20 }
texts:
  hint:
    ru: "На МРТ задний край диска выбухает в позвоночный канал и прижимает корешок. Грыжи диска бывают и у многих людей без боли: находка подтверждает радикулопатию, только если совпадает с тем, где болит и что ослабло."
  present:
    - ru: "Грыжа диска выбухает в канал и прижимает корешок"
  absent:
    - ru: "Грыж дисков нет, канал свободен"
sources:
  - { kind: guideline, title: "Дискогенная пояснично-крестцовая радикулопатия", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/777_1", note: "ID 777_1, опубликованы 07.12.2023, применяются; сверено с рубрикатором 12.10.2026; раздел 1.2: грыжи дисков встречаются у многих людей и без симптомов, находка на МРТ не означает, что она — причина боли; раздел 2.2, Р6: результаты нейровизуализации должны совпадать с клинической картиной; фон — игровая оценка" }
