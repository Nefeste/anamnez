id: img.cxr_congestion
name: { ru: "Застой в лёгких на снимке" }
# венозный застой и отёк лёгких (spec 2026-10-chapter-3, часть 43в): рентгенография при ОДСН — «для выявления венозного
# застоя в легких, плеврального выпота, верификации отека легких» (156_2, раздел 7.3.2). Без застоя на снимке — каждый
# пятый больной ОДСН (Collins 2006) — это в точности снимка. Фон — игровая оценка
leak: { pct: 0.3 }
texts:
  hint:
    ru: "Когда сердце не справляется, кровь застаивается в лёгких: на снимке корни шире и размыты, внизу — короткие горизонтальные линии Керли, в синусах — немного жидкости. У каждого пятого больного снимок ещё чистый."
  present:
    - ru: "Застой в лёгких: корни расширены и размыты, внизу — линии Керли, в синусах — немного жидкости"
  absent:
    - ru: "Признаков застоя в лёгких нет"
sources:
  - { kind: guideline, title: "Хроническая сердечная недостаточность", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/156_2", note: "ID 156_2, опубликованы 07.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 7.3.2: рентгенография — всем с ОДСН, для выявления венозного застоя в лёгких, плеврального выпота, верификации отёка лёгких; фон — игровая оценка" }
  - { kind: paper, title: "Collins SP, Lindsell CJ, Storrow AB, Abraham WT. Prevalence of negative chest radiography results in the emergency department patient with decompensated heart failure. Ann Emerg Med 2006;47(1):13–18", url: "https://pubmed.ncbi.nlm.nih.gov/16387212/", note: "PMID 16387212, сверено 05.10.2026: регистр ADHERE, 85 376 больных декомпенсацией СН — на снимке в приёмном нет застоя у 18,7 %" }
review: draft
