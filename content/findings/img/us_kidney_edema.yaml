id: img.us_kidney_edema
name: { ru: "Почки увеличены, паренхима отёчна" }
# УЗИ почек при ГЛПС (spec 2026-10-chapter-4, часть 52б): «увеличение почек, усиление кортикальной эхогенности, отек паренхимы
# почек („синдром выделенных пирамидок“)» — всем пациентам для дополнительного подтверждения (347_2, раздел 2.4, УУР C, УДД 5).
# Фон — игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "На УЗИ почки больше обычного, кора светлее, а пирамидки в ней видны тёмными пятнами — паренхима отекла. При лихорадке с болью в пояснице — довод за геморрагическую лихорадку с почечным синдромом."
  present:
    - ru: "Почки увеличены, эхогенность коры повышена, пирамидки выделены — отёк паренхимы"
  absent:
    - ru: "Почки обычных размеров, паренхима не изменена"
sources:
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР C, УДД 5): УЗИ почек — всем пациентам с ГЛПС для дополнительного подтверждения диагноза: увеличение почек, усиление кортикальной эхогенности, отёк паренхимы («синдром выделенных пирамидок»); критерий качества 8; фон — игровая оценка" }
