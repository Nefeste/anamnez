id: img.xr_clavicle_displaced
name: { ru: "Смещение отломков ключицы больше ширины кости" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Отломки ключицы разошлись больше чем на ширину кости: наружный опущен и заходит под внутренний, ключица укорочена. Со смещением больше ширины кости есть показания к операции."
  present:
    - ru: "Смещение отломков более чем на ширину диафиза, с укорочением ключицы"
  absent:
    - ru: "Отломки стоят, смещение меньше ширины кости"
sources:
  - { kind: guideline, title: "Переломы ключицы и лопатки", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/853_1", note: "ID 853_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; прил. Б1: смещение отломков больше 1 ширины диафиза — показания к хирургическому лечению; раздел 3.2: изолированный перелом со смещением — относительное показание; раздел 2.4: снимок с наклоном луча 20° — оценить укорочение" }
review: draft
