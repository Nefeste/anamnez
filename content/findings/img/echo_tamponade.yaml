# тампонада на ЭхоКГ (746_2, раздел 2.4): нижняя полая вена расширена и не спадается на вдохе, правый желудочек
# сдавлен в диастолу, правое предсердие спадается в систолу
leak: { pct: 0 }
redFlag: true
texts:
  hint:
    ru: "Выпот сдавил сердце: правое предсердие и правый желудочек спадаются, нижняя полая вена переполнена и не спадается на вдохе. Это тампонада — сердце не наполняется. Спасает только пункция перикарда."
  present:
    - ru: "Правое предсердие и правый желудочек спадаются, нижняя полая вена не спадается на вдохе — тампонада"
  absent:
    - ru: "Признаков тампонады нет"
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.4: ЭхоКГ подтверждает тампонаду — стабильное расширение нижней полой вены, не спадающейся на вдохе; компрессия правого желудочка в диастолу или его коллабирование; коллабирование правого предсердия в систолу" }
