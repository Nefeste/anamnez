id: img.ct_hematoma
name: { ru: "Гематома в веществе мозга" }
# внутримозговая гематома и её объём по КТ (spec 2026-10-chapter-3, часть 41в): «объем ВМГ имеет
# принципиально важное значение для выработки тактики» (523_3, раздел 1.5), его считают по формуле ABC/2
# (раздел 2.4). Число — объём, см³: до 30 — эта находка, больше — порог на том же числе. Сторона — полушарие
# напротив слабости. Строки «нет» нет: без гематомы КТ о её объёме не пишет
leak: { pct: 0 }
attrs:
  side:
    right: { ru: "в правом полушарии" }
    left: { ru: "в левом полушарии" }
value:
  unit: "см³"
  ref: [0, 0]
  present: [5, 29]
  absent: [0, 0]
  decimals: 0
texts:
  hint:
    ru: "Сгусток крови в веществе мозга — светлое пятно на КТ. Объём считают по срезам: длина на ширину на высоту пополам. От объёма зависит тактика: до 30 см³ лечат в палате интенсивной терапии, больше — решает нейрохирург."
  present:
    - ru: "Гематома {side} — {value} {unit}"
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 1.5: по объёму — небольшие до 20–30 мл, средние 30–50/60 мл, большие свыше 60 мл, объём важен для тактики и прогноза; раздел 2.4: описать очаг, его объём, смещение срединных структур, объём — по формуле ABC/2" }
review: draft
