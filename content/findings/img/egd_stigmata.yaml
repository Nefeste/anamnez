# Стигмы недавнего кровотечения (spec 2026-10-chapter-4, часть 53а): видимый сосуд (Форрест F2a) или фиксированный
# сгусток (F2b) в дне язвы — высокий риск рецидива, нужна эндоскопическая профилактика; плоские пятна (F2c) и чистое дно
# (F3) — без неё (277_2, приложение Г5, раздел 3.3)
id: img.egd_stigmata
name: { ru: "Сосуд или сгусток в дне язвы" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Кровотечение остановилось, но в дне язвы виден тромбированный сосуд или сгусток, который не смывается: оно может повториться. Это Форрест F2a или F2b — сосуд прошивают через эндоскоп заранее. Плоские тёмные пятна и чистое дно — F2c и F3: эндоскопия не нужна, хватает лекарств."
  present:
    - ru: "В дне язвы — видимый сосуд или фиксированный сгусток (Форрест F2a–b)"
  absent:
    - ru: "В дне язвы — плоские пятна или чистый фибрин (Форрест F2c–F3)"
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; приложение Г5: F2a — видимый тромбированный сосуд, F2b — фиксированный сгусток, F2c — плоские пятна, F3 — чистый фибрин; раздел 3.3: при F2A и F2B — эндоскопическая профилактика рецидива, при FIIC и FIII — не рекомендуется (УУР C, УДД 5); точность — игровая оценка" }
