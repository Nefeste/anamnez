# большой выпот — эхонегативное пространство в диастолу больше 20 мм: большой предиктор неблагоприятного прогноза,
# хоть один такой — в стационар (746_2, раздел 2.4; приложение Б)
leak: { pct: 0 }
redFlag: true
texts:
  hint:
    ru: "Листки перикарда разошлись больше чем на 2 см — жидкости больше полулитра. Большой выпот — признак высокого риска: лечат в стационаре и ищут причину, он может сдавить сердце."
  present:
    - ru: "Выпот в перикарде большой: больше 20 мм в диастолу"
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.4: большое количество выпота (эхонегативное пространство в диастолу больше 20 мм) — фактор неблагоприятного прогноза, при хотя бы одном — госпитализация и поиск причины; приложение Б: большие предикторы высокого риска" }
