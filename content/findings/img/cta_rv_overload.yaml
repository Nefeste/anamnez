id: img.cta_rv_overload
name: { ru: "Правый желудочек расширен на КТ-ангиографии" }
# соотношение диаметров ПЖ/ЛЖ 1 и больше (spec 2026-10-chapter-3, часть 43б): признак дисфункции правого желудочка
# при ТЭЛА (ESC 2019, раздел 5.2.2). Без ТЭЛА бывает при лёгочной гипертензии и болезнях лёгких, которых в игре
# нет как причин; фон — игровая оценка
leak: { pct: 0.5 }
redFlag: true
texts:
  hint:
    ru: "Правый желудочек шире левого — соотношение 1 и больше. Сердце не справляется с давлением в лёгочной артерии: при тромбоэмболии это признак тяжести — с повышенным тропонином риск ранней смерти выше, больного держат под монитором."
  present:
    - ru: "Правый желудочек шире левого: ПЖ/ЛЖ 1 и больше — перегрузка правого желудочка"
  absent:
    - ru: "Правый желудочек не расширен: ПЖ/ЛЖ меньше 1"
sources:
  - { kind: guideline, title: "Рекомендации ESC по диагностике и лечению острой легочной эмболии, разработанные в сотрудничестве с Европейским респираторным обществом (ERS)", org: "ESC, ERS", year: 2019, url: "https://doi.org/10.15829/1560-4071-2020-3848", note: "перевод — Российский кардиологический журнал 2020;25(8):3848 (решение владельца, вопрос 25); стр. 22, раздел 5.2.2: соотношение ПЖ/ЛЖ ≥ 1,0 по данным КТ-ангиографии точнее определяет плохой прогноз — смертность от всех причин выше в 2,5 раза, от ТЭЛА — в 5 раз; стр. 25, табл. 8: дисфункция ПЖ при ЭхоКГ или КТ и повышенный тропонин — промежуточно-высокий риск; доля утечки — игровая оценка" }
review: draft
