texts:
  hint:
    ru: "На срезе с контрастом в аорте видна тонкая тёмная линия — отслоённая внутренняя оболочка, по одну её сторону — ложный просвет. Тип A — с восходящей аортой, её оперируют в первые сутки; тип B — без неё, лечат лекарствами."
