# Кровотечение продолжается (spec 2026-10-chapter-4, часть 53а): из язвы — Форрест F1a (струя) и F1b (просачивание)
# (277_2, приложение Г5); из разрыва слизистой — «продолжающееся» (1026_1, термины). Такому — гемостаз через эндоскоп
id: img.egd_bleeding
name: { ru: "Кровотечение продолжается на ЭГДС" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Кровь идёт из источника в момент осмотра — струёй или подтекает. Такое кровотечение останавливают тут же, через эндоскоп: уколом с коагуляцией или клипсой. Из язвы это Форрест F1."
  present:
    - ru: "Кровотечение продолжается — кровь поступает из источника"
  absent:
    - ru: "Кровотечение остановилось"
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; приложение Г5: F1a — продолжающееся струйное, F1b — диффузное просачивание; раздел 3.3: при продолжающемся кровотечении из язвы (FIa, FIb) — гемостаз через эндоскоп (УУР C, УДД 5)" }
