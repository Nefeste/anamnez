texts:
  hint:
    ru: "Воспаление и отёк в веществе мозга — в височной доле и островке. Так выглядит герпетический энцефалит: на МРТ очаг светлый уже в первые дни, на КТ он темнее мозга, но появляется поздно — к 5–7-му дню. Снимок причину не доказывает — её находит ПЦР ликвора."
