# Очаг в височной доле (spec 2026-10-chapter-4, часть 50б): при герпетическом энцефалите — очаги некроза, «чаще в
# лобно-височной области мозга (с 5–7-го дня заболевания)»; на КТ — «уменьшение плотности ткани в височных долях»
# (492_2, раздел 2.4). МРТ видит их раньше КТ — игровая оценка: в рекомендации чисел нет. КТ в первые дни видит их реже, чем
# в половине случаев, — ниже порога точности игры: в игре очаг ищет МРТ. Сторона — параметр болезни
