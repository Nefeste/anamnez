id: hx.rodent_contact
name: { ru: "Дача, лес, мыши" }
# эпиданамнез ГЛПС (spec 2026-10-chapter-4, часть 52б): пребывание в природном очаге за 1–5 недель — дача, походы, ягоды и грибы,
# уборка и ремонт помещений, заготовка сена, дров, соломы; заражение — с пылью от высохших испражнений лесных мышевидных грызунов
# (347_2, разделы 1.3 и 2.1, УУР С, УДД 5; приложение В). Фон — игровая оценка
leak: { pct: 5 }
texts:
  hint:
    ru: "За последние 1–5 недель — дача, лес, сбор грибов и ягод, уборка сарая или старого дома, сено, дрова, мыши. Так заражаются геморрагической лихорадкой с почечным синдромом: вирус — в пыли от помёта лесных мышей и полёвок."
  present:
    - ru: "Три недели назад открывал{|а} дачу после зимы, выметал{|а} мышиный помёт"
    - ru: "Месяц назад ходил{|а} в лес за грибами, ночевал{|а} в старом доме"
  absent:
    - ru: "На даче и в лесу не был{|а}, мышей не видел{|а}"
sources:
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: резервуар — дикие мышевидные грызуны, заражение воздушно-пылевым путём (до 80 %) при вдыхании высохших испражнений, контактным и алиментарным; освоение дачных участков, походы, заготовка ягод и грибов; инкубационный период — от 1 до 5 недель (раздел 1.6); раздел 2.1 (УУР С, УДД 5): эпиданамнез — пребывание в очаге в срок инкубационного периода; приложение В: домашние мыши и крысы инфекцию не распространяют; фон — игровая оценка" }
review: draft
