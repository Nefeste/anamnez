id: hx.abdominal_surgery
name: { ru: "Операции на животе в прошлом" }
# у больных с непроходимостью другой природы операции в прошлом — у 22 % (327_3, раздел 2.1:
# специфичность 78 %); та же доля у остальных — игровая оценка
leak: { pct: 22 }
texts:
  hint:
    ru: "Удаляли аппендикс, желчный пузырь, оперировали грыжу, кишку, матку или делали кесарево сечение. После операции в животе остаются спайки: у больного с непроходимостью кишки это первая подсказка на спаечную."
  present:
    - ru: "Говорит, что на животе уже оперировали"
  absent:
    - ru: "Операций на животе не было"
review: draft
