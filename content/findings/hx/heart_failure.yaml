id: hx.heart_failure
name: { ru: "Хроническая сердечная недостаточность" }
leak: never
texts:
  hint:
    ru: "Сердце давно не справляется с работой: одышка при нагрузке, отёки ног. Пункт шкалы CHA₂DS₂-VASc; при ней урежать пульс верапамилом нельзя — только бета-адреноблокатором."
  present:
    - ru: "Давно сердечная недостаточность: одышка при ходьбе, отекают ноги"
  absent:
    - ru: "О сердечной недостаточности не знает"
sources:
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; приложение Г1, табл. П3: C — хроническая сердечная недостаточность или дисфункция левого желудочка — 1 балл; раздел 3.1.2.1.2: при фракции выброса меньше 40 % для контроля ЧСС — бета-адреноблокаторы и дигоксин" }
review: draft
