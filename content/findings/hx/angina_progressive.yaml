# Впервые возникшая или утяжелившаяся стенокардия — нестабильная (spec 2026-10-chapter-3, часть 39г; 154_4,
# раздел 1.5: впервые возникшая не меньше II ФК, утяжеление до III ФК). Спрашивают по опроснику Роуза
# (155_2, приложение Г1): «Когда впервые появились эти боли? — менее 4 недель назад», «Изменился ли их
# характер в течение последнего месяца?»
id: hx.angina_progressive
name: { ru: "Боли при нагрузке — впервые или чаще и сильнее" }
leak: never
texts:
  hint:
    ru: "Боли за грудиной при нагрузке появились меньше месяца назад или за последний месяц стали чаще, сильнее, при меньшей нагрузке. Это нестабильная стенокардия — острый коронарный синдром: больного везут в больницу, а не лечат дома."
  present:
    - ru: "Боли при нагрузке начались недели три назад и с каждым днём всё чаще"
    - ru: "Давит за грудиной давно, но последние две недели — уже от пары шагов по лестнице"
  absent:
    - ru: "Приступы такие же, как и много месяцев назад"
review: draft
