id: hx.tick_hours
name: { ru: "Когда присосался клещ" }
leak: never
# часы от присасывания клеща до прихода (spec 2026-10-chapter-4, часть 51а): от них зависит профилактика —
# иммуноглобулин против клещевого энцефалита в первые 72 часа (567_2, раздел 5.1), антибиотик против болезни Лайма — не
# позже 5 суток (566_2, раздел 5.1). Сам по себе признак о болезни не говорит (evidence: false): решает его число. Число —
# по долям записи болезни (course.onset)
evidence: false
value:
  unit: "ч"
  ref: [1, 240]
  present: [1, 336]
  absent: [0, 0]
  decimals: 0
  # с двух суток строка называет сутками: «около 4 суток назад»
  long: { from: 48, per: 24, unit: "суток" }
texts:
  hint:
    ru: "Сколько часов назад присосался клещ. Иммуноглобулин против клещевого энцефалита вводят в первые 72 часа, антибиотик против болезни Лайма начинают не позже 5 суток — лучше в первые сутки."
  present:
    - ru: "Клещ присосался около {amount} назад"
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 5.1 (УУР C, УДД 5): иммуноглобулин — в первые 72 часа после присасывания" }
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 5.1: антибиотикопрофилактику начинают не позднее 5 суток от присасывания, наиболее эффективно — с первых суток" }
review: draft
