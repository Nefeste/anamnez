id: hx.tb_contact
name: { ru: "Контакт с больным туберкулёзом" }
leak: { pct: 0.5 }
texts:
  hint:
    ru: "Рядом был человек с туберкулёзом: дома, на работе, в общежитии. Возможный контакт — то, о чём рекомендации велят спросить каждого с подозрением на туберкулёз."
  present:
    - ru: "Сосед по общежитию лечился от туберкулёза"
    - ru: "У родственника, с которым живём, нашли туберкулёз"
  absent:
    - ru: "С больными туберкулёзом не общал{ся|ась}"
sources:
  - { kind: guideline, title: "Туберкулез у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/16_4", note: "ID 16_4, опубликованы 16.01.2026, применяются; сверено с рубрикатором 20.11.2026 по карточке, которую прислал владелец (вопрос 78), текст — по копии документа; раздел 1.6: в анамнезе уточнять возможный контакт с больными туберкулёзом" }
review: draft
