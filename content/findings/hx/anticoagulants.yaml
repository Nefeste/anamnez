id: hx.anticoagulants
name: { ru: "Принимает антикоагулянты" }
leak: never
texts:
  hint:
    ru: "Лекарства, снижающие свёртываемость крови, — их пьют при мерцательной аритмии, после тромбозов. При травме головы с ними опаснее кровоизлияние внутри черепа: это основной признак в правиле, кому нужна компьютерная томография."
  present:
    - ru: "Постоянно принимает антикоагулянты"
  absent:
    - ru: "Антикоагулянтов не принимает"
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: антикоагулянтная терапия — основной фактор риска для КТ; приложение Б: нарушения свёртываемости крови — признак для госпитализации" }
review: draft
