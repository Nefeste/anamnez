id: hx.missed_aed
name: { ru: "Пропуск противоэпилептического препарата" }
# несоблюдение приёма противоэпилептических препаратов — частая причина приступа и статуса у больного эпилепсией
# (spec 2026-10-chapter-3, часть 44в; 741_1, раздел 1.6.7); узнают расспросом
leak: never
texts:
  hint:
    ru: "Пропущенный или отменённый противоэпилептический препарат — частая причина приступа и эпилептического статуса у больного эпилепсией. Лечение — вернуться к своему препарату и не пропускать."
  present:
    - ru: "Пропустил{|а} приём противоэпилептического препарата: забыл{|а} или кончились таблетки"
  absent:
    - ru: "Противоэпилептический препарат принимает без пропусков"
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6.7: факторы риска эпилептического статуса — несоблюдение режима приёма противоэпилептических препаратов, снижение дозы, замена, отмена; депривация сна, алкоголизация" }
review: draft
