id: hx.trigger_sting
name: { ru: "Незадолго до этого ужалила оса или пчела" }
# ужаление без тяжёлой реакции тоже бывает — игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "Ужалила оса, пчела или шмель — реакция на яд бывает тяжёлой и начинается за минуты."
  present:
    - ru: "Ужалила оса за четверть часа до этого"
  absent:
    - ru: "Насекомые не жалили"
sources:
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: яд перепончатокрылых — 14,9–20 %; раздел 1.6: при смертельных реакциях на яд остановка кровообращения — в среднем через 15 минут" }
