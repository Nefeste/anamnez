id: hx.parenteral_risk
name: { ru: "Кровь, уколы, случайные связи" }
# эпиданамнез гепатита B (spec 2026-10-chapter-4, часть 52а): инъекции наркотиков (риск «80-100%»), переливания, операции,
# татуировки, пирсинг, маникюр нестерильным инструментом, случайные половые связи, половой партнёр с гепатитом B — за 1–6
# месяцев до болезни (672_2, разделы 1.3 и 1.6; приложение А3). Фон — игровая оценка
leak: { pct: 8 }
texts:
  hint:
    ru: "За последние полгода — уколы наркотиков, переливание крови, операция, татуировка или пирсинг, случайные половые связи, партнёр с гепатитом B. Гепатит B передаётся с кровью и при сексе; болезнь начинается через 1–6 месяцев."
  present:
    - ru: "Четыре месяца назад сделал{|а} татуировку в квартире у знакомого"
    - ru: "Были случайные связи без презерватива"
  absent:
    - ru: "Уколов, переливаний, татуировок и случайных связей не было"
sources:
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: механизм гемоконтактный — инъекции наркотиков (наибольший риск 80–100 %), татуировки, пирсинг, переливания, операции, гемодиализ, половой путь (в парах 17–50 %); раздел 1.6: инкубационный период — от 1–4 до 6 месяцев, в среднем 80 дней; приложение А3: гемотрансфузии, операции, парентеральные вмешательства, половой контакт с больным; доля фона — игровая оценка" }
review: draft
