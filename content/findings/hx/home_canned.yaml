id: hx.home_canned
name: { ru: "Домашние консервы в последние дни" }
# подозрительный продукт при ботулизме (spec 2026-10-chapter-4, часть 51в): «в большинстве случаев ботулизм развивается
# вследствие употребления грибов (65-68% случаев), овощей, соленой (вяленой) и копченой рыбы… и мяса кустарного производства»
# (911_1, раздел 1.3); опрос — о продуктах за несколько часов — 7 суток до болезни (раздел 2). Домашние заготовки едят многие и
# без ботулизма — фон игровая оценка
leak: { pct: 10 }
texts:
  hint:
    ru: "Домашние грибы и овощи из банок, вяленая или копчёная рыба, мясо домашнего приготовления за последнюю неделю. Ядовитые консервы на вид, вкус и запах обычные, крышка не вздута. Двоение в глазах и сухость во рту после них — ботулизм."
  present:
    - ru: "Два дня назад ел{|а} домашние грибы из банки"
    - ru: "На днях ел{|а} вяленую рыбу домашнего приготовления"
  absent:
    - ru: "Домашних консервов, грибов и вяленой рыбы не ел{|а}"
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: грибы — 65–68 % случаев, овощи, солёная, вяленая и копчёная рыба, мясо кустарного производства; испорченные консервы не меняют вида и вкуса, бомбажа нет; раздел 2: подозрительный продукт — от нескольких часов до 7 суток до начала болезни; доля евших домашние консервы без ботулизма — игровая оценка" }
review: draft
