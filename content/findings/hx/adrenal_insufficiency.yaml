id: hx.adrenal_insufficiency
name: { ru: "Надпочечниковая недостаточность в анамнезе" }
# болезнь Аддисона уже находили, и человек принимает гидрокортизон (spec 2026-10-chapter-4, часть 56а): криз — осложнение,
# «возникающее при несоответствии уровня кортизола увеличенной потребности в нем» (524_3, «Термины и определения»).
# Распространённость первичной надпочечниковой недостаточности — 100–144 на миллион (раздел 1.3): фон — игровая оценка
leak: { pct: 0.01 }
texts:
  hint:
    ru: "Болезнь Аддисона: кора надпочечников не вырабатывает гормоны, и человек всю жизнь принимает гидрокортизон. При инфекции, рвоте и поносе его нужно больше, а таблетки не держатся — начинается надпочечниковый криз. Такому больному с рвотой и низким давлением гидрокортизон в вену — сразу."
  present:
    - ru: "Болезнь Аддисона, каждый день принимает гидрокортизон"
  absent:
    - ru: "Болезней надпочечников нет"
sources:
  - { kind: guideline, title: "Первичная надпочечниковая недостаточность", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/524_3", note: "ID 524_3, опубликованы 22.04.2025, применяются; сверено с рубрикатором 11.10.2026; «Термины и определения»: криз — жизнеугрожающее осложнение надпочечниковой недостаточности при несоответствии уровня кортизола увеличенной потребности в нём; раздел 1.3: распространённость 100–144 на миллион; фон — игровая оценка" }
review: draft
