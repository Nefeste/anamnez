id: hx.missed_insulin
name: { ru: "Пропуск инсулина" }
# пропуск инсулина без кетоацидоза в игре не встречается: фона нет
leak: { pct: 0 }
texts:
  hint:
    ru: "Пропустил уколы инсулина или перестал колоть: кончился, плохо себя чувствовал и не ел, сломалась шприц-ручка. Так у больного на инсулине начинается кетоацидоз."
  present:
    - ru: "Два дня не колол{|а} инсулин — кончился"
    - ru: "Не ел{|а}, поэтому и инсулин не колол{|а}"
  absent:
    - ru: "Инсулин колет как обычно"
sources:
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом. 11-й выпуск", org: "Под ред. И.И. Дедова, М.В. Шестаковой, А.Ю. Майорова", year: 2023, url: "https://doi.org/10.14341/DM13042", note: "Сахарный диабет. 2023;26(2S):1–157, сверено 15.10.2026; раздел 8.1, с. 44: провоцирующие факторы ДКА — пропуск или отмена инсулина больными, ошибки в технике инъекций, неисправность средств для введения инсулина" }
review: draft
