id: hx.heavy_lifting
name: { ru: "Заболело после подъёма тяжести" }
# радикулопатия (spec 2026-10-chapter-4, часть 58б): боль «часто возникает на фоне значительной физической нагрузки, например,
# подъема тяжести» (777_1, раздел 1.6); поднимал тяжёлое и без грыжи диска — фон игровая оценка
leak: { pct: 6 }
texts:
  hint:
    ru: "Поднял тяжёлое, резко наклонился или повернулся — и прострелило поясницу. Так часто начинается и обычная боль в спине, и грыжа диска; само по себе это не тревожный признак."
  present:
    - ru: "Заболело, когда поднимал{|а} тяжёлое"
    - ru: "Прострелило, когда нагнул{ся|ась} за тяжёлым"
  absent:
    - ru: "Тяжёлого не поднимал{|а}, заболело само"
sources:
  - { kind: guideline, title: "Дискогенная пояснично-крестцовая радикулопатия", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/777_1", note: "ID 777_1, опубликованы 07.12.2023, применяются; сверено с рубрикатором 12.10.2026; раздел 1.6: боль часто возникает при значительной физической нагрузке, например подъёме тяжести; раздел 1.2: первый эпизод — тяжёлая физическая нагрузка, ожирение и курение; фон — игровая оценка" }
review: draft
