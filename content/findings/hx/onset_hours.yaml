id: hx.onset_hours
name: { ru: "Когда стало плохо" }
leak: never
# часы от начала до прихода (spec 2026-10-chapter-3, часть 39а). Знает их всякий, кому плохо остро, —
# с болью в груди, одышкой, потом, тошнотой, болью под ложечкой, с сердцебиением (follows), а больной
# ОКС — всегда; у ОКС число — по долям записи болезни (course.onset), у остальных — поровну. Сам по себе
# признак о болезни не говорит (evidence: false): иначе строка выдавала бы инфаркт — решает его число,
# окно тромболизиса. С частью 42а — до двух недель: фибрилляция предсердий бывает и неделю, а от 48
# часов зависит, можно ли восстанавливать ритм; больше двух суток строка называет сутками
follows: [sym.chest_pain_pressing, sym.pleuritic_pain, sym.pain_radiation, sym.dyspnea, sym.sweating, sym.nausea, sym.epigastric_pain, sym.weakness_one_side, sym.speech_trouble, sym.face_droop, sym.palpitations]
evidence: false
value:
  unit: "ч"
  ref: [1, 48]
  present: [1, 336]
  absent: [0, 0]
  decimals: 0
  # с двух суток строка называет сутками: «около 5 суток назад»
  long: { from: 48, per: 24, unit: "суток" }
texts:
  hint:
    ru: "Сколько часов назад стало плохо. От этого зависит лечение: тромболизис при инфаркте с подъёмом ST — в первые 12 часов, при ишемическом инсульте — в первые 4,5 часа; при фибрилляции предсердий ритм восстанавливают сразу, только если ей меньше 48 часов."
  present:
    - ru: "Плохо стало около {amount} назад"
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.1: фиксировать время от начала болевого эпизода до контакта с врачом — важно для основных решений; раздел 3.1.3: ТЛТ — если прошло не более 12 часов от начала симптомов" }
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.1: установить точное время появления симптомов; раздел 3.1.2.1.1: тромболизис в первые 4,5 часа от начала заболевания" }
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.1.2: при длительности 48 часов и больше или неизвестной — антикоагулянт не меньше 3 недель перед кардиоверсией; при меньше 48 часов — ранняя кардиоверсия" }
review: draft
