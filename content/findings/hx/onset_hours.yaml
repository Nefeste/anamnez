id: hx.onset_hours
name: { ru: "Когда стало плохо" }
leak: never
# часы от начала до прихода (spec 2026-10-chapter-3, часть 39а). Знает их всякий, кому плохо остро, —
# с болью в груди, одышкой, потом, тошнотой, болью под ложечкой (follows), а больной ОКС — всегда;
# у ОКС число — по долям записи болезни (course.onset), у остальных — поровну. Сам по себе признак о
# болезни не говорит (evidence: false): иначе строка выдавала бы инфаркт — решает его число, окно
# тромболизиса
follows: [sym.chest_pain_pressing, sym.pleuritic_pain, sym.pain_radiation, sym.dyspnea, sym.sweating, sym.nausea, sym.epigastric_pain]
evidence: false
value:
  unit: "ч"
  ref: [1, 48]
  present: [1, 48]
  absent: [0, 0]
  decimals: 0
texts:
  hint:
    ru: "Сколько часов назад стало плохо. При инфаркте с подъёмом ST от этого зависит, растворять ли тромб: тромболизис делают в первые 12 часов от начала симптомов, позже он уже не помогает."
  present:
    - ru: "Плохо стало около {value} ч назад"
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.1: фиксировать время от начала болевого эпизода до контакта с врачом — важно для основных решений; раздел 3.1.3: ТЛТ — если прошло не более 12 часов от начала симптомов" }
review: draft
