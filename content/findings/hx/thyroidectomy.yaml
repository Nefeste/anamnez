id: hx.thyroidectomy
name: { ru: "Недавно оперировали щитовидную железу" }
# операция на шее (spec 2026-10-chapter-4, часть 56в) — «самая распространенная причина развития гипопаратиреоза, обуславливающая
# около 75% всех случаев данного заболевания» (627_3, раздел 1.2.3); транзиторная гипокальциемия развивается «в первые 24 часа после
# операции на органах шеи» («Термины и определения»). Об операциях на шее спрашивают прицельно (раздел 2.1, УУР С, УДД 5). Фон —
# игровая оценка
leak: { pct: 0.1 }
texts:
  hint:
    ru: "Несколько дней назад удаляли щитовидную железу или её часть. Рядом с ней — околощитовидные железы, которые держат кальций крови: их могут задеть на операции. Онемение вокруг рта и судороги кистей у такого больного — повод сразу проверить кальций."
  present:
    - ru: "На днях оперировали щитовидную железу"
  absent:
    - ru: "Операций на щитовидной железе не было"
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; «Термины и определения»: транзиторный послеоперационный гипопаратиреоз — гипокальциемия в первые 24 часа после операции на органах шеи; раздел 1.2.3: операция на шее — около 75 % всех случаев гипопаратиреоза, транзиторный — у 25–30 % после тотальной тиреоидэктомии; раздел 2.1 (УУР С, УДД 5): сбор анамнеза о хирургических вмешательствах на органах шеи; фон — игровая оценка" }
