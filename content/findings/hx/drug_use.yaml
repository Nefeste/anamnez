id: hx.drug_use
name: { ru: "Употребляет наркотики" }
# что принял, когда и сколько — у такого больного выяснить удаётся «далеко не всегда» (spec 2026-10-chapter-4, часть 57а; 743_2, раздел
# 2.1): рассказывают знакомые, рядом — шприцы и упаковки. Фон — игровая оценка
leak: { pct: 0.5 }
texts:
  hint:
    ru: "Знакомые или родные говорят, что человек употребляет наркотики, рядом нашли шприц или упаковки. Чаще всего сейчас это метадон. Отравление им узнают по угнетению сознания, редкому дыханию и узким зрачкам."
  present:
    - ru: "Употребляет наркотики"
  absent:
    - ru: "Наркотики не употребляет"
sources:
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 1.2: в последние 10 лет самая частая причина отравлений опиоидами — метадон; раздел 2.1: общие принципы сбора токсикологического анамнеза удаётся применить далеко не всегда; фон — игровая оценка" }
review: draft
