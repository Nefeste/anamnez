id: hx.first_seizure
name: { ru: "Приступ — впервые" }
# впервые в жизни (spec 2026-10-chapter-3, часть 44в): при первом неспровоцированном приступе — КТ головы, когда нет
# МРТ (741_1, раздел 2.4.5), и обследование в стационаре (раздел 6); при известной эпилепсии — нет
leak: never
texts:
  hint:
    ru: "Приступ впервые в жизни — повод искать причину: кровоизлияние, инсульт, опухоль, травму. КТ головы и стационар. При известной эпилепсии и обычном для человека приступе это не нужно."
  present:
    - ru: "Такой приступ — впервые в жизни"
  absent:
    - ru: "Приступы бывали и раньше"
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 2.4.5 (УУР C, УДД 5): КТ головного мозга взрослым, впервые перенесшим единичный неспровоцированный эпилептический приступ, как первичное исследование при отсутствии возможности выполнить МРТ; раздел 6: пациент с впервые выявленным эпилептическим приступом подлежит обследованию и лечению в условиях стационара" }
review: draft
