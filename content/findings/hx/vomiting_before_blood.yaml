# Кровь — после многократной рвоты (spec 2026-10-chapter-4, часть 53а): «рвота кровью со сгустками после многократной
# „сухой“ рвоты» — классическая картина разрыва Мэллори–Вейсса (1026_1, приложение В); у молодых, злоупотребляющих
# алкоголем, многократная рвота, закончившаяся алой кровью, — повод заподозрить разрыв (277_2, раздел 2.5)
id: hx.vomiting_before_blood
name: { ru: "Кровь появилась после многократной рвоты" }
leak: never
texts:
  hint:
    ru: "Сначала долго рвало без крови — после застолья, отравления, — и только потом появилась кровь. Так бывает при разрыве слизистой у входа в желудок; при кровотечении из язвы рвота кровью начинается сразу."
  present:
    - ru: "Сначала много раз рвало без крови, потом — с кровью"
  absent:
    - ru: "Рвота кровью — сразу, без рвоты до неё"
sources:
