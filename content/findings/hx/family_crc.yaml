id: hx.family_crc
name: { ru: "Рак кишки у близких родственников" }
# наследственная отягощённость по колоректальному раку (spec 2026-10-chapter-4, часть 55б): при хроническом запоре — повод
# к колоноскопии в любом возрасте (274_3, разделы 2.1 и 2.4); при СРК рак толстой кишки у родственников — симптом тревоги
# (892_1, раздел 2). Доля людей с ним — игровая оценка
leak: { pct: 5 }
texts:
  hint:
    ru: "Рак толстой или прямой кишки у родителей, братьев или сестёр. При запоре это повод к колоноскопии в любом возрасте, при боли в животе со стулом — симптом тревоги."
  present:
    - ru: "У отца был рак кишки"
    - ru: "У матери был рак толстой кишки"
  absent:
    - ru: "Рака кишки в семье не было"
sources:
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1: наследственная отягощённость по колоректальному раку; раздел 2.4 (УУР C, УДД 5): колоноскопия при ней обязательна; доля людей с ней — игровая оценка" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2: рак толстой кишки, целиакия, язвенный колит и болезнь Крона у родственников — симптом тревоги" }
review: draft
