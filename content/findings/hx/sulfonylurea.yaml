id: hx.sulfonylurea
name: { ru: "Пьёт таблетки сульфонилмочевины" }
# причина гипогликемии (spec 2026-10-chapter-3, часть 44а): гликлазид, глимепирид, гликвидон, глибенкламид — «риск
# гипогликемии» (290_2, табл. 11), действуют 8–24 часа (приложение А3) — гипогликемия от них затяжная
leak: never
texts:
  hint:
    ru: "Таблетки сульфонилмочевины — гликлазид, глимепирид, глибенкламид — заставляют поджелудочную железу выделять инсулин. Действуют до суток: вызванная ими гипогликемия затягивается и возвращается, поэтому лечат её в стационаре капельницей с декстрозой."
  present:
    - ru: "Пьёт таблетки сульфонилмочевины: гликлазид или глимепирид"
  absent:
    - ru: "Таблеток сульфонилмочевины не пьёт"
sources:
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 3.4.1, табл. 11: ПСМ (гликлазид, глимепирид, гликвидон, глибенкламид) — риск гипогликемии; приложение А3: длительность действия 8–24 часа; раздел 3.7: при передозировке ПССП с большой продолжительностью действия декстрозу капельно продолжать до нормализации гликемии и полного выведения препарата" }
review: draft
