id: hx.atrial_fibrillation
name: { ru: "Мерцательная аритмия в прошлом" }
leak: never
texts:
  hint:
    ru: "Фибрилляция предсердий, или мерцательная аритмия, — нарушение ритма, при котором в сердце образуются сгустки. Главная причина эмболии артерий ноги."
  present:
    - ru: "Давно мерцательная аритмия"
  absent:
    - ru: "О нарушениях ритма не знает"
sources:
  - { kind: guideline, title: "Острая ишемия конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/1006_1", note: "ID 1006_1, опубликованы 29.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: 90–96 % эмболий — из-за болезней сердца, среди них фибрилляция предсердий; раздел 2.1: собрать анамнез сопутствующих заболеваний" }
review: draft
