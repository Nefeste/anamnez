id: hx.antihistamine_failed
name: { ru: "Таблетки от аллергии не помогли" }
# пьют их и без крапивницы — при насморке и зуде, — но «не помогли от сыпи» говорит только тот, у кого она есть: фона нет
leak: { pct: 0 }
texts:
  hint:
    ru: "Сыпь с зудом не проходит, хотя больной уже несколько дней пьёт таблетки от аллергии второго поколения. При острой крапивнице тогда назначают короткий курс гормона."
  present:
    - ru: "Третий день пью таблетки от аллергии — не помогают"
    - ru: "Пил{|а} таблетки от аллергии, а сыпь не проходит"
  absent:
    - ru: "Таблетки от аллергии ещё не пил{|а}"
sources:
  - { kind: guideline, title: "Крапивница", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/264_2", note: "ID 264_2, опубликованы 19.07.2023, применяются; сверено с рубрикатором 15.10.2026; раздел 2.1: при сборе анамнеза — эффективность антигистаминных средств системного действия, характер и эффективность предшествующего лечения; раздел 3.3.1, рек. 2 (УУР C, УДД 4): без эффекта от антигистаминных — глюкокортикоиды коротким курсом" }
