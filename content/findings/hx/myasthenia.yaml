id: hx.myasthenia
name: { ru: "Миастения в анамнезе" }
# миастению уже находили, и человек принимает пиридостигмин (spec 2026-10-chapter-4, часть 58в): «Миастения гравис (МГ, myasthenia
# gravis, болезнь Эрба-Гольдфлама) – это классическое, аутоиммунное заболевание, клинические проявления которого в виде слабости и
# патологической мышечной утомляемости обусловлены явлениями аутоагрессии» (165_2, раздел 1.1). Распространённость в России —
# 5,3–10,7 на 100 000 (раздел 1.3): фон — игровая оценка
leak: { pct: 0.01 }
texts:
  hint:
    ru: "Миастения: антитела мешают нервам передавать сигнал мышцам, и мышцы быстро устают — веки опускаются, двоится, трудно жевать и глотать. Человек принимает пиридостигмин. Инфекция или лекарство могут обрушить её в криз: не глотает, задыхается — это экстренно."
  present:
    - ru: "Болеет миастенией, принимает пиридостигмин"
  absent:
    - ru: "Миастении нет"
sources:
  - { kind: guideline, title: "Миастения", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/165_2", note: "ID 165_2, опубликованы 15.12.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 1.1: определение; раздел 1.3: распространённость в России — 5,3–10,7 на 100 000; раздел 3.1.1: пиридостигмина бромид — симптоматическая терапия первого ряда; фон — игровая оценка" }
review: draft
