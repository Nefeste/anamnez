id: hx.binge
name: { ru: "Запои, по утрам опохмеляется" }
# признак синдрома зависимости от алкоголя (spec 2026-10-chapter-4, часть 54б): «опохмелялись, чтобы успокоить свои нервы,
# или избавиться от плохого самочувствия» — вопрос 4 CAGE (711_2, приложение Г3); влечение «опохмелиться» — вторичное, оно
# и отличает зависимость (784_1, раздел 1.6). Не у зависимого — не бывает
leak: never
texts:
  hint:
    ru: "Пьёт запоями по нескольку дней, а по утрам выпивает, чтобы снять похмелье. Это признак зависимости от алкоголя: бросив пить, такой человек через несколько часов получает синдром отмены — дрожь, пот, тревогу, бессонницу."
  present:
    - ru: "Пьёт запоями, по утрам опохмеляется"
  absent:
    - ru: "Запоев нет, по утрам не опохмеляется"
sources:
  - { kind: guideline, title: "Алкогольная болезнь печени", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/711_2", note: "ID 711_2, опубликованы 30.10.2024, применяются; сверено с рубрикатором 11.10.2026; приложение Г3: вопросник CAGE, вопрос 4 — опохмелялись ли, чтобы успокоить нервы или избавиться от плохого самочувствия; раздел 2: пациенты склонны преуменьшать количество выпитого или отрицать сам факт употребления" }
  - { kind: guideline, title: "Психические и поведенческие расстройства, вызванные употреблением алкоголя. Синдром отмены алкоголя (алкогольное абстинентное состояние)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/784_1", note: "ID 784_1, опубликованы 20.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: сильное желание употребить алкоголь (опохмелиться) — вторичное патологическое влечение, основное отличие синдрома отмены от похмелья" }
review: draft
