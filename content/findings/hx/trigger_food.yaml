id: hx.trigger_food
name: { ru: "Незадолго до этого — орехи, рыба, морепродукты" }
# орехи, рыбу, морепродукты едят и без аллергии — игровая оценка
leak: { pct: 5 }
texts:
  hint:
    ru: "Перед реакцией была еда, на которую бывает тяжёлая аллергия: орехи, арахис, рыба, морепродукты, яйца, молоко. Пища — вторая по частоте причина анафилаксии и одна из причин острой крапивницы."
  present:
    - ru: "Перед этим за едой были орехи и рыба"
  absent:
    - ru: "Ничего необычного в еде не было"
sources:
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: пищевые продукты — 23,3–31 % (молоко, рыба, морепродукты, орехи, арахис, яйца)" }
  - { kind: guideline, title: "Крапивница", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/264_2", note: "ID 264_2, опубликованы 19.07.2023, применяются; сверено с рубрикатором 15.10.2026; раздел 2.1: связь обострений с приёмом пищи; раздел 3.1.3 (УУР B, УДД 3): при доказанной пищевой аллергии — избегать этиологически значимых продуктов" }
