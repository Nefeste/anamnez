# орехи, рыбу, морепродукты едят и без аллергии — игровая оценка
leak: { pct: 5 }
texts:
  hint:
    ru: "Перед реакцией была еда, на которую бывает тяжёлая аллергия: орехи, арахис, рыба, морепродукты, яйца, молоко. Пища — вторая по частоте причина анафилаксии."
  present:
    - ru: "Перед этим за едой были орехи и рыба"
  absent:
    - ru: "Ничего необычного в еде не было"
sources:
