id: hx.tbe_vaccinated
name: { ru: "Прививки от клещевого энцефалита" }
leak: never
texts:
  hint:
    ru: "Привитым считается тот, кто получил законченный курс — три прививки — и ревакцинацию. Привитому иммуноглобулин после укуса не нужен; не привитому или с незаконченным курсом — нужен, если в клеще нашли вирус."
  present:
    - ru: "Привит{|а} от клещевого энцефалита: полный курс и ревакцинация"
  absent:
    - ru: "От клещевого энцефалита не привит{|а} или курс не закончен"
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 5.1: привитым считается получивший законченный курс и одну или более ревакцинаций, трёхкратное введение — законченный курс; иммуноглобулин — не болевшим и не вакцинированным, а также с незавершённым или дефектным курсом" }
