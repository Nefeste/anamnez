id: hx.recent_cold
name: { ru: "Недавно была простуда" }
# острый перикардит чаще всего — осложнение вирусной инфекции (746_2, приложение В; spec 2026-10-chapter-3, часть
# 43д). Фон — у многих взрослых простуда была за последние недели: игровая оценка
leak: { pct: 6 }
texts:
  hint:
    ru: "За одну-три недели до болезни был насморк, кашель или температура. Перед перикардитом и миокардитом так бывает часто: их вызывают те же вирусы."
  present:
    - ru: "Недели две назад была простуда — насморк, горло, температура"
    - ru: "Перед этим болел{|а} гриппом, неделю лежал{|а}"
  absent:
    - ru: "Простуды в последний месяц не было"
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; приложение В: острый перикардит чаще всего является осложнением перенесённой вирусной инфекции; раздел 1.2: вирусные причины — энтеровирусы, аденовирусы, вирусы гриппа и другие; доля и фон — игровая оценка" }
review: draft
