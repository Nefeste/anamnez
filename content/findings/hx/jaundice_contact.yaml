id: hx.jaundice_contact
name: { ru: "Рядом болели желтухой" }
# эпиданамнез гепатита A (spec 2026-10-chapter-4, часть 52а): пребывание в очаге в срок инкубации, совместное проживание и
# половые связи с больным, вспышка, поездки в районы с высокой заболеваемостью без прививки (718_2, разделы 2 и 2.1, УУР C,
# УДД 5). Фон — игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "Дома, на работе или в поездке за последние полтора месяца кто-то болел желтухой; поездка туда, где гепатит A частый, без прививки. Гепатит A передаётся через грязные руки, воду и еду."
  present:
    - ru: "Месяц назад у соседа по комнате была желтуха"
    - ru: "Недавно вернул{ся|ась} из поездки, там многие болели желтухой"
  absent:
    - ru: "Желтухой рядом никто не болел, никуда не ездил{|а}"
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; разделы 2 и 2.1 (УУР C, УДД 5): пребывание в очаге гепатита A в период, соответствующий инкубационному, поездки в районы высокой эндемичности без иммунизации, эндемичная вспышка, совместное проживание и сексуальные отношения с больным; раздел 1.6: инкубационный период — 15–30 дней, до 50; доля фона — игровая оценка" }
review: draft
