id: hx.tick_bite_recent
name: { ru: "Клещ в последний месяц" }
# присасывание клеща за последний месяц (spec 2026-10-chapter-4, часть 51а): у болезни Лайма признаки — «в течение месяца после
# присасывания клеща» (566_2, раздел 2), у клещевого энцефалита инкубация — до 35 дней (567_2, раздел 1.6). Присасывание
# может остаться незамеченным (566_2, раздел 2.1): сам больной вспоминает его не всегда — игровая оценка
leak: { pct: 30 }
texts:
  hint:
    ru: "Был ли клещ за последний месяц: в лесу, парке, на даче, снимали ли клещей с собаки. У болезни Лайма пятно появляется в течение месяца после укуса, у клещевого энцефалита болезнь начинается обычно через 7–12 дней. Не помнит укуса — это болезнь не исключает."
  present:
    - ru: "В последний месяц присасывался клещ"
  absent:
    - ru: "Клещей за последний месяц не находил{|а}"
sources:
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2: эпиданамнез — присасывание клеща, пребывание в лесной зоне эндемичного района, признаки в течение месяца после присасывания; раздел 2.1: присасывание может остаться незамеченным" }
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: инкубационный период 1–35 дней, в большинстве случаев 7–12; раздел 2.1: подъём температуры после присасывания клеща, весенне-летний период" }
review: draft
