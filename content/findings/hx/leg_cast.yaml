name: { ru: "Гипс на ноге недавно" }
leak: never
texts:
  hint:
    ru: "Нога, которая недавно была в гипсе или не двигается после инсульта, неподвижна — кровь в венах застаивается. В шкале Уэллса это один балл."
  present:
    - ru: "Недавно нога была в гипсе"
  absent:
    - ru: "Гипса на ноге не было"
sources:
