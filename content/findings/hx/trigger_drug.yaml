id: hx.trigger_drug
name: { ru: "Незадолго до этого — укол лекарства" }
# укол лекарства незадолго до обращения бывает и без аллергии — игровая оценка
leak: { pct: 2 }
texts:
  hint:
    ru: "За минуты или час до реакции сделали укол антибиотика, обезболивающего или контраста. Лекарства — самая частая причина анафилактического шока у взрослых."
  present:
    - ru: "За полчаса до этого сделали укол лекарства"
  absent:
    - ru: "Уколов и новых лекарств не было"
sources:
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: лекарства — 31,2–46,5 % (парентеральные антибиотики, прежде всего бета-лактамы, НПВП, йодсодержащий контраст)" }
