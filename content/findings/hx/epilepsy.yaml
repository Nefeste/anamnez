id: hx.epilepsy
name: { ru: "Эпилепсия" }
# известная эпилепсия (spec 2026-10-chapter-3, часть 44в): у такого больного в стационаре реже нужны сложные
# диагностические процедуры (741_1, раздел 1.6.7); узнают расспросом
leak: never
texts:
  hint:
    ru: "Эпилепсия — болезнь, при которой приступы повторяются без внешней причины. Если она известна и приступ обычный для человека, главное — понять, почему он случился: пропустил лекарство, не выспался, выпил."
  present:
    - ru: "Эпилепсия — наблюдается у невролога, принимает противоэпилептический препарат"
  absent:
    - ru: "Эпилепсии нет"
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 1.1.1: эпилепсия — не менее двух неспровоцированных приступов с интервалом больше 24 часов; раздел 1.6.7: если статус развился у пациента, длительно страдающего эпилепсией, в стационаре вероятнее не потребуется сложных диагностических процедур" }
review: draft
