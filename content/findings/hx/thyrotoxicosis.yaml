id: hx.thyrotoxicosis
name: { ru: "Тиреотоксикоз в анамнезе" }
# болезнь Грейвса или узловой зоб уже нашли (spec 2026-10-chapter-4, часть 56б): тиреотоксический криз — у больных с тяжёлым
# течением болезни Грейвса (270_2, раздел 3.5), после отмены тиамазола тиреотоксикоз сохраняется или возвращается у 70 % и больше
# (раздел 3.1.1). Фон — игровая оценка
leak: { pct: 0.3 }
texts:
  hint:
    ru: "Щитовидная железа уже выделяла лишние гормоны: болезнь Грейвса или узловой зоб, лечились тиамазолом. После его отмены болезнь часто возвращается. Если у такого больного жар, сердце колотится и он возбуждён или в забытьи — подумайте о тиреотоксическом кризе."
  present:
    - ru: "Лечил{ся|ась} от тиреотоксикоза — болезни Грейвса или узлового зоба"
  absent:
    - ru: "Болезней щитовидной железы не было"
sources:
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 3.5: диагностические критерии тиреотоксического криза — у пациентов с тяжёлым течением болезни Грейвса; раздел 3.1.1: сохранение тиреотоксикоза после отмены антитиреоидных препаратов и рецидивы — 70 % и более; фон — игровая оценка" }
review: draft
