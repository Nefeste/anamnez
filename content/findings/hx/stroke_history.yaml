id: hx.stroke_history
name: { ru: "Был инсульт: кровоизлияние в мозг или инфаркт мозга за полгода" }
leak: never
texts:
  hint:
    ru: "Кровоизлияние в мозг когда-либо или инфаркт мозга за последние полгода. После него растворять тромб нельзя: тромболизис может вызвать новое кровоизлияние."
  present:
    - ru: "Был инсульт: {лечился|лечилась} в неврологии с кровоизлиянием в мозг"
    - ru: "Четыре месяца назад был инсульт — инфаркт мозга"
  absent:
    - ru: "Инсульта не было"
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.1.3: абсолютные противопоказания к ТЛТ" }
