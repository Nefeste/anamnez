id: hx.recent_bleed_surgery
name: { ru: "За месяц — операция, серьёзная травма или кровотечение из желудка" }
leak: never
texts:
  hint:
    ru: "Операция, серьёзная травма, удар по голове или желудочно-кишечное кровотечение в последний месяц. Тромболитик растворит и свежий сгусток в ране или язве — кровотечение возобновится."
  present:
    - ru: "Три недели назад оперировали на желчном пузыре"
    - ru: "В прошлом месяце {лежал|лежала} в больнице с кровотечением из язвы желудка"
  absent:
    - ru: "Операций, травм и кровотечений за последний месяц не было"
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.1.3: абсолютные противопоказания к ТЛТ" }
