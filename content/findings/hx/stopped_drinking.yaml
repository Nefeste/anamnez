id: hx.stopped_drinking
name: { ru: "Бросил пить день-два назад" }
# первый критерий диагноза синдрома отмены — «четких данных о недавнем прекращении приема или снижении доз алкоголя после его
# употребления в течение длительного времени и/или в высоких дозах» (spec 2026-10-chapter-4, часть 54б; 784_1, раздел 2);
# отмена начинается «через несколько часов после прекращения употребления алкоголя» (раздел 1.1). Бросают пить и без
# зависимости — фон, игровая оценка
leak: { pct: 0.2 }
texts:
  hint:
    ru: "Человек, который долго пил, резко бросил или сильно убавил выпивку. Через несколько часов у зависимого начинается синдром отмены: дрожь, пот, тревога, бессонница; самые опасные — второй и третий день."
  present:
    - ru: "Пил{|а} несколько дней подряд, вчера–позавчера резко бросил{|а}"
  absent:
    - ru: "Резко пить не бросал{|а}"
sources:
  - { kind: guideline, title: "Психические и поведенческие расстройства, вызванные употреблением алкоголя. Синдром отмены алкоголя (алкогольное абстинентное состояние)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/784_1", note: "ID 784_1, опубликованы 20.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.1: синдром отмены возникает через несколько часов после прекращения употребления алкоголя и, если не осложняется, проходит за 2–5 дней; раздел 2: критерий 1 — чёткие данные о недавнем прекращении приёма или снижении доз алкоголя; раздел 2.1 (УУР C, УДД 5): при сборе анамнеза обращать внимание на временную связь прекращения употребления и симптомов; приложение В: самый опасный период — 2–3 день; фон — игровая оценка" }
review: draft
