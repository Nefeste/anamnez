id: hx.antibiotics_recent
name: { ru: "Антибиотики в последние три месяца" }
# главный фактор риска энтероколита, вызванного C. difficile (spec 2026-10-chapter-4, часть 49б): риск в 7–10 раз выше во
# время приёма антибиотика и в первый месяц после, втрое — в следующие 2 месяца (878_1, раздел 2.1). Фон — у других людей
# курс антибиотика за три месяца, игровая оценка
leak: { pct: 10 }
texts:
  hint:
    ru: "Курс антибиотика в последние три месяца — главная причина энтероколита, вызванного C. difficile: антибиотик губит обычных обитателей кишки, и этот микроб размножается. Опаснее всего клиндамицин, цефалоспорины, фторхинолоны и карбапенемы."
  present:
    - ru: "Недавно пил{|а} антибиотик от бронхита"
    - ru: "Месяц назад лежал{|а} в больнице, кололи антибиотики"
  absent:
    - ru: "Антибиотиков давно не принимал{|а}"
sources:
  - { kind: guideline, title: "Энтероколит, вызванный Clostridioides difficile (C. difficile)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/878_1", note: "ID 878_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.1: риск в 7–10 раз выше во время антибактериальной терапии и в первый месяц после неё, в 3 раза — в последующие 2 месяца; наибольший — клиндамицин, бета-лактамы, цефалоспорины III–IV поколения, карбапенемы и фторхинолоны; доля людей с курсом антибиотика за три месяца — игровая оценка" }
review: draft
