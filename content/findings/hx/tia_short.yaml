id: hx.tia_short
name: { ru: "Прошло меньше чем за 10 минут" }
# сколько длился эпизод транзиторной ишемической атаки (spec 2026-10-chapter-3, часть 41б): больной или
# родные называют при расспросе; строки «нет» нет — длительность одна, её и показывают
leak: never
texts:
  hint:
    ru: "Эпизод транзиторной ишемической атаки короче 10 минут. По шкале ABCD2 за длительность баллов нет."
  present:
    - ru: "Всё прошло за несколько минут"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; приложение Г17: шкала ABCD2 — продолжительность 60 минут и больше — 2 балла, 10–59 минут — 1 балл" }
