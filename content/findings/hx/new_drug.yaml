id: hx.new_drug
name: { ru: "Незадолго до сыпи — новое лекарство" }
# новое лекарство за последние дни бывает и без крапивницы — игровая оценка
leak: { pct: 4 }
texts:
  hint:
    ru: "Перед сыпью начали пить новое лекарство: ацетилсалициловую кислоту, обезболивающее из группы НПВП (ибупрофен, диклофенак) или таблетки от давления — ингибитор АПФ. Лекарства бывают причиной острой крапивницы; подозреваемое лекарство отменяют."
  present:
    - ru: "Накануне начал{|а} пить обезболивающее — ибупрофен"
    - ru: "Позавчера выпил{|а} ацетилсалициловую кислоту от головной боли"
    - ru: "Неделю назад назначили новые таблетки от давления"
  absent:
    - ru: "Новых лекарств в последние дни не было"
sources:
  - { kind: guideline, title: "Крапивница", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/264_2", note: "ID 264_2, опубликованы 19.07.2023, применяются; сверено с рубрикатором 15.10.2026; раздел 2.1: связь обострения с приёмом ацетилсалициловой кислоты, НПВП, ингибиторов АПФ или других лекарственных средств; раздел 3.1.1 (УУР C, УДД 5): лекарственные средства могут быть причиной, подозреваемые отменить или заменить; фон — игровая оценка" }
review: draft
