texts:
  hint:
    ru: "Экстренную профилактику столбняка выбирают по записям о прививках. Если записей нет, взрослого прививают как непривитого: анатоксин столбнячный и иммуноглобулин вместе."
  present:
    - ru: "Прививки от столбняка есть в записях — полный курс"
  absent:
    - ru: "Записей о прививках от столбняка нет"
sources:
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; приложение А3.1 — схема выбора средств экстренной профилактики столбняка: нет документального подтверждения о прививках, взрослые — анатоксин столбнячный и иммуноглобулин человека противостолбнячный" }
  - { kind: guideline, title: "СанПиН 3.3686-21 «Санитарно-эпидемиологические требования по профилактике инфекционных болезней»", org: "Главный государственный санитарный врач РФ", year: 2021, url: "https://base.garant.ru/400342149/", note: "постановление от 28.01.2021 № 4, в редакции от 25.07.2025; сверено 29.09.2026; глава XLV, п. 4158: препараты для экстренной профилактики назначают дифференцированно по документальному подтверждению прививок" }
