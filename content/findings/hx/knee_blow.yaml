id: hx.knee_blow
name: { ru: "Удар или падение на колено" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Прямой удар по колену или падение на согнутое колено. Так чаще всего ушибают колено и ломают надколенник; удар снаружи рвёт и внутреннюю боковую связку. Передняя крестообразная обычно рвётся без удара — от поворота."
  present:
    - ru: "Упал{|а} на колено или ударил{ся|ась} им"
  absent:
    - ru: "Прямого удара по колену не было"
sources:
  - { kind: guideline, title: "Переломы надколенника", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/970_1", note: "ID 970_1, опубликованы 25.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: чаще всего — падение с высоты собственного роста (44,3 %) и ДТП (33,0 %), у женщин — падение на коленный сустав (68,3 %)" }
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.1: внутренняя боковая связка удерживает колено от отклонения внутрь — вальгусной нагрузки; раздел 1.2: причина повреждения связок — прямая травма, удар в область коленного сустава; большая часть повреждений передней крестообразной связки — бесконтактный механизм" }
review: draft
