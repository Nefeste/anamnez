id: hx.bed_rest
name: { ru: "Недавняя операция или постельный режим" }
leak: never
texts:
  hint:
    ru: "Большая операция под наркозом за последние 12 недель или три дня и больше в постели — в шкале Уэллса один балл: неподвижность и операция повышают риск тромбоза."
  present:
    - ru: "Недавно была операция под наркозом или три дня и больше пролежал{{|а}} в постели"
  absent:
    - ru: "Операций не было, в постели не лежал{{|а}}"
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; прил. Г1: недавний постельный режим 3 дня и более или большая операция за последние 12 недель — +1 балл; раздел 2.1: операции, травмы и иммобилизации в последние 3 месяца" }
review: draft
