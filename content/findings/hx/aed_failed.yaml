id: hx.aed_failed
name: { ru: "Противосудорожные скорой не помогли" }
# рефрактерный эпилептический статус (spec 2026-10-chapter-4, часть 47): не купируется препаратами первой и второй
# очереди, дольше 60 минут (741_1, раздел 1.6.7); на догоспитальном этапе вводят диазепам, могут — и вальпроевую
# кислоту (741_1, «Купирование ЭССП у взрослых»). Узнают расспросом о приступе — от бригады скорой
leak: never
texts:
  hint:
    ru: "Приступы идут больше часа, хотя бригада скорой уже ввела противосудорожные первой и второй очереди. Это рефрактерный эпилептический статус: третья очередь — наркоз в вену с ИВЛ, в реанимации."
  present:
    - ru: "Приступы идут больше часа: бригада скорой ввела диазепам и вальпроевую кислоту — не помогло"
  absent:
    - ru: "Приступы начались меньше часа назад; противосудорожное второй очереди ещё не вводили"
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6.7: рефрактерный (стойкий) эпилептический статус — не купируемый препаратами первой и второй очереди выбора, длительностью свыше 60 минут; «Купирование ЭССП у взрослых», догоспитальный этап: диазепам в/в медленно, могут быть использованы препараты второй очереди — вальпроевая кислота" }
review: draft
