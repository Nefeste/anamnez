id: ecg.af
name: { ru: "Фибрилляция или трепетание предсердий на ЭКГ" }
# без фибрилляции в прошлом и без болезни — не бывает (у фактора риска и у фибрилляции предсердий); игровая оценка
leak: { pct: 0 }
# вид (spec 2026-10-chapter-3, часть 42а): фибрилляция — ритм абсолютно неправильный, зубцов P нет;
# трепетание — пилообразные волны F, ритм желудочков чаще правильный (382_2, разделы 1.1 и 2). Строка и
# лента — по виду
attrs:
  kind:
    fibrillation: { ru: "Ритм неправильный, зубцов P нет — фибрилляция предсердий" }
    flutter: { ru: "Пилообразные волны F вместо зубцов P — трепетание предсердий" }
# записи из сохранений до 0.3.13 вида не знают: строка тогда называла фибрилляцию
fallback: { kind: fibrillation }
texts:
  hint:
    ru: "Фибрилляция предсердий: предсердия не сокращаются, а дрожат, сердце бьётся неритмично. Трепетание: предсердия сокращаются часто и правильно — 250–350 раз в минуту, на ленте «пила». В неработающем предсердии образуются сгустки — они могут улететь в артерию мозга или ноги."
  present:
    - ru: "{kind}"
  # не «ритм синусовый»: тахикардия с узкими или широкими комплексами (часть 42б) — тоже без фибрилляции
  absent:
    - ru: "Фибрилляции и трепетания предсердий нет"
sources:
  - { kind: guideline, title: "Острая ишемия конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/1006_1", note: "ID 1006_1, опубликованы 29.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: на заболевания сердца — ИБС, инфаркт, фибрилляцию предсердий, пороки — приходится 90–96 % эмболий" }
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 1.1: ФП — хаотическая активность предсердий 350–700 в минуту без зубцов P, ТП — возбуждение предсердий 250–350 в минуту, волны трепетания без изолинии; раздел 2: абсолютно нерегулярные интервалы RR, нет отчётливых зубцов P, запись 12 отведений — 10 секунд и больше" }
review: draft
