leak: { pct: 0 }
texts:
  hint:
    ru: "Мерцательная аритмия: предсердия не сокращаются, а дрожат, сердце бьётся неритмично. В дрожащем предсердии образуются сгустки — они могут улететь в артерию ноги или мозга."
