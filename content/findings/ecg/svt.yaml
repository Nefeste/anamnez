id: ecg.svt
name: { ru: "Наджелудочковая тахикардия на ЭКГ" }
# без приступа наджелудочковой тахикардии не бывает (spec 2026-10-chapter-3, часть 42б): игровая оценка
leak: { pct: 0 }
texts:
  hint:
    ru: "Частый ровный ритм — 150–250 в минуту — с узкими комплексами QRS, как в норме: возбуждение идёт к желудочкам обычным путём, через АВ-узел. Зубцы P прячутся в комплексах или видны после них. Помогают вагусные пробы и трифосаденин."
  present:
    - ru: "Ритм частый и правильный, комплексы QRS узкие, зубцов P перед ними нет — наджелудочковая тахикардия"
  absent:
    - ru: "Тахикардии с узкими комплексами нет"
sources:
  - { kind: guideline, title: "Наджелудочковые тахикардии", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/619_3", note: "ID 619_3, опубликованы 17.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.1: тахикардия с узкими QRS — QRS ≤ 120 мс; раздел 2.4: АВУРТ — ретроградные P сливаются с QRS; ортодромная АВРТ — ЧСС 150–250, RP' короче P'R" }
