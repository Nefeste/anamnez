id: ecg.vt
name: { ru: "Тахикардия с широкими комплексами на ЭКГ" }
# без желудочковой тахикардии не бывает (spec 2026-10-chapter-3, часть 42б): наджелудочковой с аберрацией и
# предвозбуждением в игре нет — игровая оценка
leak: { pct: 0 }
redFlag: true
texts:
  hint:
    ru: "Частый ритм с широкими, уродливыми комплексами QRS — 120 мс и шире, без зубцов P перед ними: возбуждение идёт из желудочков. Такую тахикардию считают желудочковой, пока не доказано иное, даже при нормальном давлении. Верапамил при ней нельзя."
  present:
    - ru: "Ритм частый, комплексы QRS широкие, больше 120 мс, без зубцов P перед ними — желудочковая тахикардия"
  absent:
    - ru: "Тахикардии с широкими комплексами нет"
sources:
  - { kind: guideline, title: "Желудочковые нарушения ритма сердца. Внезапная сердечная смерть.", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/569_2", note: "ID 569_2, опубликованы 07.10.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2: широкий деформированный QRS (≥ 120 мс), нет предшествующего P, дискордантный T, сливные комплексы; раздел 3.1.3 (ЕОК IC): тахикардию с широкими QRS расценивать как ЖТ, пока диагноз НЖТ не вызывает сомнения" }
