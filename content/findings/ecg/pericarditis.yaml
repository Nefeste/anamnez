id: ecg.pericarditis
name: { ru: "Подъём ST почти во всех отведениях с депрессией PQ" }
# перикардит (746_2, табл. А3-2; spec 2026-10-chapter-3, часть 43д): подъём ST диффузный, в одну сторону с
# положительным T, депрессия PQ; в aVR — наоборот. Ранняя реполяризация и другое — фон, игровая оценка
leak: { pct: 0.3 }
texts:
  hint:
    ru: "Сегмент ST поднят вогнуто почти во всех отведениях сразу, а не в отведениях одной стенки, без зеркальной депрессии напротив; интервал PQ опущен, в aVR — наоборот. Так выглядит перикардит. При инфаркте подъём — в отведениях своей стенки, напротив — зеркальная депрессия."
  present:
    - ru: "Подъём ST почти во всех отведениях, вогнутый, депрессия PQ, в aVR — наоборот: перикардит"
  absent:
    - ru: "Признаков перикардита на ЭКГ нет"
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.4: ЭКГ всем при подозрении на перикардит (ЕОК IC), характерные изменения — у 60 %; табл. А3-2: при перикардите ST поднят диффузно, в одну сторону с положительным T, депрессия PQ, патологических Q нет; при инфаркте — локально, с отрицательным T; табл. А3-5: в aVR — подъём PR; фон — игровая оценка" }
review: draft
