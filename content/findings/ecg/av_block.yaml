id: ecg.av_block
name: { ru: "АВ-блокада II–III степени на ЭКГ" }
# без блокады не бывает (spec 2026-10-chapter-3, часть 42в): Мобитц I и блокады I степени в игре нет — игровая
# оценка
leak: { pct: 0 }
redFlag: true
# вид (160_2, раздел 1.5): Мобитц II — импульс блокируется без предшествующего удлинения PQ; полная — предсердия
# и желудочки возбуждаются независимо, выскальзывающий ритм узкий из АВ-соединения или широкий из желудочков.
# Строка и лента — по виду
attrs:
  kind:
    mobitz2: { ru: "Часть зубцов P без комплексов QRS, PQ перед проведёнными не меняется — АВ-блокада II степени, Мобитц II" }
    narrow: { ru: "Зубцы P и комплексы QRS — каждые в своём ритме, комплексы узкие — полная АВ-блокада" }
    wide: { ru: "Зубцы P и комплексы QRS — каждые в своём ритме, комплексы широкие и редкие — полная АВ-блокада" }
fallback: { kind: wide }
texts:
  hint:
    ru: "Импульс от предсердий проходит к желудочкам не весь: при Мобитц II часть зубцов P без комплекса, при полной блокаде не проходит ни один — желудочки бьются в своём редком ритме. Узкие комплексы — ритм из АВ-соединения, широкие — из желудочков, он реже и ненадёжнее. Кардиостимулятор нужен и без жалоб."
  present:
    - ru: "{kind}"
  absent:
    - ru: "АВ-блокады II–III степени нет"
sources:
  - { kind: guideline, title: "Брадиаритмии и нарушения проводимости", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/160_2", note: "ID 160_2, опубликованы 18.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.5: ПЖБ II степени Мобитц II — блокирование импульса без предшествующего удлинения проведения; III степени — полная блокада проведения с предсердно-желудочковой диссоциацией; уровень — АВ-узел или ниже (интра- и инфрагисиальные); раздел 2.4.1: ЭКГ 12 отведений — всем (ЕОК I C)" }
review: draft
