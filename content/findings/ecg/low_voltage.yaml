id: ecg.low_voltage
name: { ru: "Низкий вольтаж и чередование высоты комплексов" }
# большой выпот: амплитуда QRS снижается, при «качающемся сердце» — электрическая альтернация (746_2, раздел 2.4).
# Фон — при ожирении и эмфиземе вольтаж тоже низкий: игровая оценка
leak: { pct: 0.5 }
texts:
  hint:
    ru: "Комплексы QRS низкие во всех отведениях, а их высота чередуется от удара к удару: сердце качается в жидкости. Признак большого выпота в перикарде и тампонады."
  present:
    - ru: "Вольтаж комплексов низкий, их высота чередуется — электрическая альтернация"
  absent:
    - ru: "Вольтаж комплексов обычный"
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.4: прогрессивное снижение амплитуд QRS свидетельствует об увеличении объёма экссудата; симптом «качающегося сердца» при большом выпоте часто сопровождается тампонадой и электрической альтернацией на ЭКГ; фон — игровая оценка" }
review: draft
