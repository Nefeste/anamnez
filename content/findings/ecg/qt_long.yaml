# при гипопаратиреозе — «Удлинение интервала QT и неспецифические изменения зубца T, нарушения сердечного ритма» (spec
# 2026-10-chapter-4, часть 56в; 627_3, раздел 1.6.2, табл. 2). Порога QTc и вида ленты в 627_3 нет: игра удлиняет ровный сегмент
# ST, зубец T — обычный. Фон — лекарства и врождённое удлинение, игровая оценка
leak: { pct: 0.5 }
texts:
  hint:
    ru: "От начала комплекса QRS до конца зубца T дольше обычного для этой частоты: желудочки дольше восстанавливаются после сокращения. При нехватке кальция удлиняется ровный отрезок ST. Длинный QT опасен нарушениями ритма."
  present:
    - ru: "Интервал QT удлинён: длинный ровный сегмент ST"
  absent:
    - ru: "Интервал QT обычный"
sources:
