id: vital.bradypnea
name: { ru: "Дыхание реже 10 в минуту" }
# угнетение дыхания при отравлении опиоидами (spec 2026-10-chapter-4, часть 57а): «брадипноэ до 4-8 в минуту» (743_2, раздел 1.6); при
# средней степени — до 6–8 дыханий, при тяжёлой — меньше 6 или единичные вдохи (раздел 1.5), в таблицах приложения А3 — меньше 10
# и меньше 8. Порог игры — 10, как в таблице средней степени. Только от болезни. То же измерение, что «Частота дыхания больше 20
# в минуту»: число одно, и порог по другую сторону нормы его снимает
leak: { pct: 0 }
triage: red
redFlag: true
value:
  unit: "в минуту"
  ref: [12, 20]
  present: [3, 9]
  absent: [13, 20]
  decimals: 0
  of: vital.tachypnea
texts:
  hint:
    ru: "Дыхание реже 10 раз в минуту: мозг почти перестал им управлять. Так бывает при отравлении опиоидами и снотворными, при тяжёлой травме мозга. Это угроза остановки дыхания: нужна вентиляция."
  present:
    - ru: "Частота дыхания {value} {unit} — дыхание редкое"
sources:
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 1.5: при средней степени брадипноэ до 6–8, при тяжёлой — менее 6 дыхательных движений в минуту или единичные вдохи; раздел 1.6: брадипноэ до 4–8 в минуту; приложение А3, табл. 10 и 11: брадипноэ менее 10 и менее 8 в минуту" }
