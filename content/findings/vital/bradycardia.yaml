id: vital.bradycardia
name: { ru: "Пульс реже 50 в минуту" }
# только от болезни (spec 2026-10-chapter-3, часть 42в): у тренированных днём в покое до 40 в минуту — норма
# (160_2, раздел 2.4.2), но такого фона в игре нет — игровая оценка
leak: { pct: 0 }
# на сортировке — жёлтый (игровое правило); NEWS2 добавляет баллы по самому числу: 40 и реже — 3 балла
triage: yellow
# то же измерение, что «Пульс чаще 100 в минуту» (как «Давление ниже 90», часть 33б): число одно, и порог по
# другую сторону от нормы его снимает — пульс 38 не бывает «чаще 100». Выскальзывающий ритм полной блокады —
# 20–55 в минуту: в игре 28–48
value:
  unit: "уд/мин"
  ref: [60, 90]
  present: [28, 48]
  absent: [62, 99]
  decimals: 0
  of: vital.tachycardia
texts:
  hint:
    ru: "Редкий пульс — реже 50 ударов в минуту. Бывает у тренированных людей, во сне, от лекарств, урежающих ритм, и при блокаде проведения в сердце. Если при этом кружится голова или был обморок — ЭКГ сразу."
  present:
    - ru: "Пульс редкий: реже 50 в минуту"
sources:
  - { kind: guideline, title: "Брадиаритмии и нарушения проводимости", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/160_2", note: "ID 160_2, опубликованы 18.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6: при острых брадиаритмиях — внезапные головокружения, спутанность, предобмороки и обмороки до приступов Морганьи — Адамса — Стокса; раздел 2.4.2: днём в покое снижение до 40 в минуту — предельная норма; порог 50 и диапазон — игровая оценка" }
review: draft
