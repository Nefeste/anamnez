id: vital.tachycardia_150
name: { ru: "Пульс 150 в минуту и чаще" }
# только от болезни (spec 2026-10-chapter-3, часть 42б): у взрослого в покое без пароксизма не бывает —
# игровая оценка
leak: { pct: 0 }
# в покое так часто сердце бьётся при пароксизме: на сортировке — красный (игровое правило)
triage: red
# то же измерение, что «Пульс чаще 100 в минуту» (как «Давление ниже 90», часть 33б): число одно, и того порог
# не снимает (`implies`): пульс 150 — это и «чаще 100». Частота пароксизма — 150–250 в минуту (619_3, разделы
# 1.6.4 и 2.4), в игре до 210
value:
  unit: "уд/мин"
  ref: [60, 90]
  present: [150, 210]
  absent: [62, 99]
  decimals: 0
  of: vital.tachycardia
  implies: true
texts:
  hint:
    ru: "Пульс 150 в минуту и чаще в покое — так бьётся сердце при приступе тахикардии: наджелудочковой или желудочковой. Какой ритм — покажет ЭКГ."
  present:
    - ru: "Пульс очень частый: 150 в минуту и чаще"
sources:
  - { kind: guideline, title: "Наджелудочковые тахикардии", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/619_3", note: "ID 619_3, опубликованы 17.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6.4: при трепетании предсердий ЧСС чаще 130–160; раздел 2.4: ортодромная АВРТ — 150–250 в минуту; диапазон в игре — до 210, игровая оценка" }
review: draft
