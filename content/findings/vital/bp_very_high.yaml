id: vital.bp_very_high
name: { ru: "Давление 180/110 и выше" }
# только от болезни: у взрослого на приёме без неё так высоко не бывает (игровая оценка)
leak: { pct: 0 }
# на сортировке — жёлтый: срочность решает не число, а поражение органов (62_3, раздел 3.7) — игровое правило
triage: yellow
# то же измерение, что «Давление 140/90 и выше» (spec 2026-10-chapter-3, часть 43г; как пульс 150 и чаще, часть 42б):
# число одно, и порог «140/90» оно не снимает (`implies`) — 180 и выше это и «140/90 и выше». АГ 3-й степени — 180 и
# выше и/или 110 и выше (62_3, приложение А3, табл. П2); в игре — до 240
value:
  unit: "мм рт. ст."
  ref: [100, 139]
  present: [180, 240]
  absent: [105, 136]
  decimals: 0
  derived: { dia: 0.62 }
  of: vital.bp_high
  implies: true
texts:
  hint:
    ru: "Верхнее давление 180 и выше или нижнее 110 и выше — гипертензия 3-й степени. Само число ещё не криз: криз — когда страдают органы: мозг, сердце, почки, глаза. Без этого давление снижают таблетками, а не в вену."
  present:
    - ru: "Давление очень высокое: 180/110 и выше"
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; приложение А3, табл. П2: АГ 3-й степени — САД 180 и выше и/или ДАД 110 и выше; раздел 3.7: при определении тяжести скорость и степень повышения АД важны так же, как абсолютный уровень; диапазон в игре — до 240, игровая оценка" }
review: draft
