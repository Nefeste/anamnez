id: sign.bp_arm_difference
name: { ru: "Разница давления на руках больше 20" }
# дефицит пульса и разница давления на правой и левой руке — при распространении расслоения на ветви дуги аорты
# (spec 2026-10-chapter-3, часть 43а; 946_1, раздел 1.6). Без расслоения разница больше 20 тоже бывает — при
# стенозе подключичной артерии; фон — игровая оценка
leak: { pct: 2 }
value:
  unit: "мм рт. ст."
  ref: [0, 10]
  present: [22, 48]
  absent: [0, 8]
  decimals: 0
texts:
  hint:
    ru: "Верхнее давление на правой и левой руке различается больше чем на 20. При боли в груди это признак расслоения аорты: расслоение перекрывает ветвь, идущую к руке. Давление при боли в груди меряют на обеих руках."
  present:
    - ru: "Верхнее давление на руках разное: разница {value} {unit}"
  absent:
    - ru: "Давление на обеих руках почти одинаковое: разница {value} {unit}"
sources:
  - { kind: guideline, title: "Расслоение аорты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/946_1", note: "ID 946_1, опубликованы 23.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6: дефицит пульса — у 30 % при типе A и 15 % при типе B, разница АД на правой и левой плечевой артерии — при распространении расслоения на ветви дуги; раздел 2.2: АД должно измеряться на обеих руках; порог 20 и доля утечки — игровая оценка" }
  - { kind: review, title: "Klompas M. Does this patient have an acute thoracic aortic dissection? JAMA 2002;287(17):2262–2272", url: "https://pubmed.ncbi.nlm.nih.gov/11980527/", note: "PMID 11980527, сверено 05.10.2026: дефицит пульса или разница давления — у 31 % больных расслоением, отношение правдоподобия положительного результата — 5,7" }
review: draft
