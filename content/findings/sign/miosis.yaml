id: sign.miosis
name: { ru: "Зрачки узкие, как точки" }
# миоз — ведущий признак (spec 2026-10-chapter-4, часть 57а): при лёгкой степени — «уменьшение диаметров зрачков (миоз) и снижение
# их реакции на свет», при средней — «вплоть до появления „точечных зрачков“» (743_2, раздел 1.5); самые информативные признаки —
# «миоз и выраженное угнетение дыхания» (раздел 1.6). Фон — капли и яркий свет, игровая оценка
leak: { pct: 0.5 }
texts:
  hint:
    ru: "Зрачки сужены до точки и почти не реагируют на свет. Вместе с редким дыханием и угнетением сознания — главный признак отравления опиоидами: героином, метадоном, морфином."
  present:
    - ru: "Зрачки узкие, как точки, на свет почти не реагируют"
  absent:
    - ru: "Зрачки обычной ширины"
sources:
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 1.5: миоз со снижением реакции на свет при лёгкой степени, вплоть до точечных зрачков при средней; раздел 1.6: самые информативные признаки — миоз и выраженное угнетение дыхания; фон — игровая оценка" }
review: draft
