id: sign.kussmaul
name: { ru: "Дыхание Куссмауля" }
# «При развитии декомпенсированного метаболического ацидоза отмечается частое, глубокое, „шумное“ дыхание (дыхание Куссмауля)»
# (spec 2026-10-chapter-4, часть 57в; 873_1, раздел 2.2, УУР С, УДД 5); при этиленгликоле «Тахипноэ, тахикардия, дыхание Куссмауля
# имеют компенсаторный характер» (раздел 1.6.2). Кетоацидоза в игре нет (вопрос владельцу 28) — без болезни базы не бывает: фон
# игровая оценка
leak: { pct: 0 }
texts:
  hint:
    ru: "Дышит часто, глубоко и шумно, хотя лежит спокойно. Это ответ на тяжёлый ацидоз: кровь закислена. После спиртного — довод за отравление метанолом или этиленгликолем; так дышат и при диабетическом кетоацидозе."
  present:
    - ru: "Дыхание частое, глубокое, шумное — дыхание Куссмауля"
  absent:
    - ru: "Дыхание обычной глубины, не шумное"
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2.2 (УУР С, УДД 5): при декомпенсированном метаболическом ацидозе — частое, глубокое, шумное дыхание Куссмауля; раздел 1.6.2: при этиленгликоле тахипноэ, тахикардия и дыхание Куссмауля компенсаторные, от тяжёлого метаболического ацидоза; фон — игровая оценка" }
review: draft
