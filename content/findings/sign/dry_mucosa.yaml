id: sign.dry_mucosa
name: { ru: "Суховатые слизистые" }
# слизистые при обезвоживании (spec 2026-10-chapter-4, часть 49а): при I степени влажные, при II — суховатые, при III — сухие, при
# IV — сухие, резко гиперемированы (875_1, приложение А3.1). Сухой язык и сниженный тургор — свой признак «Выраженное
# обезвоживание». Фон — игровая оценка
leak: { pct: 3 }
texts:
  hint:
    ru: "Язык и щёки изнутри суше обычного, человек облизывает губы и просит пить. Первый видный признак, что воды не хватает: при лёгком обезвоживании слизистые ещё влажные."
  present:
    - ru: "Слизистые рта суховатые, язык обложен"
  absent:
    - ru: "Слизистые влажные"
sources:
  - { kind: guideline, title: "Острые кишечные инфекции (ОКИ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/875_1", note: "ID 875_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.2: осмотр кожи и слизистых — цвет, влажность, тургор; приложение А3.1: слизистые по степеням обезвоживания — влажные, суховатые, сухие, сухие и резко гиперемированы" }
review: draft
