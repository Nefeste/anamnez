id: sign.no_active_extension
name: { ru: "Не может сам разогнуть колено" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Лёжа на спине человек не может сам разогнуть голень и поднять выпрямленную ногу: прерван разгибательный аппарат — надколенник, его связка или сухожилие четырёхглавой мышцы. При переломе надколенника так бывает, когда отломки разошлись."
  present:
    - ru: "Активное разгибание голени невозможно, выпрямленную ногу не поднимает"
  absent:
    - ru: "Голень разгибает сам, выпрямленную ногу поднимает"
sources:
  - { kind: guideline, title: "Переломы надколенника", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/970_1", note: "ID 970_1, опубликованы 25.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: при поперечном или многооскольчатом переломе активное разгибание голени может быть невозможно; раздел 3.2: утрата активного разгибания — показание к операции; проба с подъёмом выпрямленной ноги в тексте не названа — игровая оценка" }
review: draft
