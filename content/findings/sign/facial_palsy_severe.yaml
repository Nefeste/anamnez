id: sign.facial_palsy_severe
name: { ru: "Тяжёлый парез лица" }
# V–VI степень по шкале Хауса-Брэкманна (spec 2026-10-chapter-3, часть 44б; 895_1, приложение Г4): движений в
# половине лица почти или совсем нет — прозоплегия (раздел 1.1); от неё зависит метилпреднизолон в вену в первые 3 дня
leak: { pct: 0 }
attrs:
  side:
    right: { ru: "справа" }
    left: { ru: "слева" }
texts:
  hint:
    ru: "Движений в половине лица почти или совсем нет: глаз не закрыть даже с усилием, рот не шевелится. По шкале Хауса-Брэкманна это V–VI степень — тяжёлая невропатия: в первые 3 дня гормон вводят в вену."
  present:
    - ru: "Движений в половине лица {side} почти нет: глаз не закрыть даже с усилием"
  absent:
    - ru: "Мимика на больной стороне есть, хоть и слабая"
sources:
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 1.1: при наличии движений — прозопарез, при отсутствии — прозоплегия; раздел 3.2.1: тяжесть выше IV степени по шкале Хауса-Брэкманна в первые 3 дня — метилпреднизолон в вену; приложение Г4: шкала Хауса-Брэкманна — лоб, глаз, рот в покое и при движении; точность осмотра — игровая оценка" }
review: draft
