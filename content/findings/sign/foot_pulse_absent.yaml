id: sign.foot_pulse_absent
name: { ru: "Нет пульса на артериях стопы" }
# у пожилых с атеросклерозом пульса на стопе бывает не слышно и без острой ишемии — игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "На тыле стопы и за лодыжкой пульс не прощупывается. Ниже закрытой артерии пульса нет — главный признак острой ишемии ноги; при тромбозе вен пульс есть."
  present:
    - ru: "На артериях стопы пульса нет"
  absent:
    - ru: "Пульс на стопах есть"
sources:
  - { kind: guideline, title: "Острая ишемия конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/1006_1", note: "ID 1006_1, опубликованы 29.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: отсутствие пульса — в «правиле 6 П»; раздел 2.2 (УУР С, УДД 5): при пальпации определяют температуру конечности, пульсацию артерий; дифференцировать ОИК от тромбоза глубоких вен" }
review: draft
