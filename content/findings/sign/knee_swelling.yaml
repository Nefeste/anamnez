id: sign.knee_swelling
name: { ru: "Отёк колена" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Колено опухло, контуры сустава сглажены. Бывает и при ушибе, и при разрыве связок, и при переломе: сам по себе отёк их не различает."
  present:
    - ru: "Отёк, контуры коленного сустава сглажены"
  absent:
    - ru: "Отёка колена нет"
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: припухлость нарастает часами или сутками, при гемартрозе движения теряются по мере нарастания отёка" }
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: оценить наличие выпота или сглаженности контуров коленного сустава" }
