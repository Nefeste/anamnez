id: sign.nystagmus
name: { ru: "Нистагм" }
# мелкоразмашистый нистагм бывает и без травмы; фон — игровая оценка
leak: { pct: 2 }
texts:
  hint:
    ru: "Нистагм — ритмичные подёргивания глазных яблок, когда человек смотрит в сторону. После травмы головы мелкоразмашистый нистагм — признак сотрясения; при ушибе мягких тканей его нет."
  present:
    - ru: "Мелкоразмашистый нистагм при взгляде в стороны"
  absent:
    - ru: "Нистагма нет"
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2.1: мелкоразмашистый нистагм — 40 %, исчезает у 90 % в течение 4–5 суток" }
review: draft
