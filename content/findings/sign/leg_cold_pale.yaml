    ru: "Кожа ноги бледная или мраморная, на ощупь холоднее другой. Так выглядит нога, к которой не поступает кровь."
  present:
    - ru: "Нога бледная, мраморная, на ощупь холодная"
  absent:
    - ru: "Кожа ног обычного цвета, тёплая"
