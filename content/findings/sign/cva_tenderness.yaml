id: sign.cva_tenderness
name: { ru: "Болезненность при поколачивании по пояснице" }
leak: { pct: 2 }
texts:
  hint:
    ru: "Врач легко постукивает ребром ладони по пояснице; если отдаёт болью в почку — довод за пиелонефрит (симптом поколачивания). С обеих сторон при высокой температуре — и за геморрагическую лихорадку с почечным синдромом."
  present:
    - ru: "Симптом поколачивания положительный"
  absent:
    - ru: "Симптом поколачивания отрицательный с обеих сторон"
sources:
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; приложение А3: симптом Пастернацкого при лёгкой форме — слабоположительный, при среднетяжёлой — положителен, при тяжёлой — резко положителен; положителен и при остром пиелонефрите" }
review: draft
