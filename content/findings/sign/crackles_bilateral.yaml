id: sign.crackles_bilateral
name: { ru: "Влажные хрипы внизу обоих лёгких" }
# застой по малому кругу (spec 2026-10-chapter-3, часть 43в): «влажные незвонкие хрипы при аускультации обоих лёгких»
# (156_2, раздел 7.3.1). Фон — игровая оценка
leak: { pct: 0.5 }
texts:
  hint:
    ru: "Мелкие влажные хрипы внизу обоих лёгких: в альвеолах жидкость с обеих сторон. Так бывает, когда в лёгких застаивается кровь при сердечной недостаточности; при пневмонии хрипы обычно с одной стороны."
  present:
    - ru: "В нижних отделах обоих лёгких — влажные хрипы"
  absent:
    - ru: "Влажных хрипов внизу обоих лёгких нет"
sources:
  - { kind: guideline, title: "Хроническая сердечная недостаточность", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/156_2", note: "ID 156_2, опубликованы 07.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 7.3.1: влажные незвонкие хрипы при аускультации обоих лёгких — признак застоя по малому кругу; фон — игровая оценка" }
review: draft
