id: sign.valgus_laxity
name: { ru: "Колено раскрывается изнутри при вальгус-тесте" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Колено согнуто на 20–30°, врач отводит голень наружу: внутренняя щель сустава раскрывается больше, чем на здоровой ноге, — порвана внутренняя боковая связка."
  present:
    - ru: "Вальгус стресс-тест: медиальная щель раскрывается больше, чем на здоровой ноге"
  absent:
    - ru: "Варус- и вальгус-тесты: щели раскрываются не больше, чем на здоровой ноге"
sources:
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: вальгус стресс-тест при сгибании 20–30° — чрезмерное открытие медиальной суставной щели по сравнению с нормальной ногой указывает на повреждение медиальной коллатеральной связки" }
review: draft
