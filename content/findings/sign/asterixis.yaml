id: sign.asterixis
name: { ru: "Хлопающий тремор кистей" }
# астериксис (spec 2026-10-chapter-4, часть 54а): признак второй и третьей стадии печёночной энцефалопатии по West Haven (715_2,
# раздел 1.5, табл. 2). Бывает и при почечной и дыхательной недостаточности — фон, игровая оценка
leak: { pct: 0.05 }
texts:
  hint:
    ru: "Человек вытягивает руки и разгибает кисти, а они то и дело «падают» и рывком возвращаются, будто машут крыльями. Это хлопающий тремор — признак печёночной энцефалопатии; бывает и при почечной и дыхательной недостаточности."
  present:
    - ru: "Хлопающий тремор кистей при вытянутых руках"
  absent:
    - ru: "Хлопающего тремора нет"
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.5, табл. 2: астериксис — признак второй стадии ПЭ по West Haven; фон — игровая оценка" }
review: draft
