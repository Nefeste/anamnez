id: sign.exophthalmos
name: { ru: "Пучеглазие, веки отстают от радужки" }
# глазные симптомы (spec 2026-10-chapter-4, часть 56б): ретракция век и отставание века при взгляде вниз — симптомы Дальримпля и
# Грефе; эндокринная офтальмопатия с проптозом — «Примерно у 40-50% пациентов с БГ развивается ЭОП» (270_2, раздел 1.6). При
# узловом зобе офтальмопатии нет; фон — игровая оценка
leak: { pct: 0.3 }
texts:
  hint:
    ru: "Глаза широко раскрыты и блестят, над радужкой видна белая полоска, при взгляде вниз веко отстаёт; бывает, глаза выпячены вперёд. Так выглядит болезнь Грейвса: у её больных это эндокринная офтальмопатия. При узловом зобе такого нет."
  present:
    - ru: "Глаза блестят, над радужкой белая полоска, веко отстаёт при взгляде вниз"
  absent:
    - ru: "Глаза обычные, веки не отстают"
sources:
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 1.6: глазные симптомы тиреотоксикоза — Грефе, Кохера, Дальримпля, Штельвага; эндокринная офтальмопатия — у 40–50 % больных болезнью Грейвса; раздел 2.2: экзофтальм, ретракция век; фон — игровая оценка" }
review: draft
