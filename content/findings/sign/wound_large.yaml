id: sign.wound_large
name: { ru: "Большая рана с кровопотерей" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Рана головы может кровить так сильно, что появляются бледность, слабость и частый пульс. Большую рану, которая потребовала наблюдения и дала кровопотерю, лечат в стационаре."
  present:
    - ru: "Большая рана, обильно кровила"
  absent:
    - ru: "Рана небольшая, кровотечение остановилось"
sources:
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; разделы 1.2 и 1.6: кровотечение из раны головы бывает интенсивным — анемия, гиповолемия, артериальная гипотензия; раздел 6 (УУР C, УДД 5): госпитализация при ране большого размера, требующей наблюдения, с кровопотерей" }
review: draft
