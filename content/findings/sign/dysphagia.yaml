id: sign.dysphagia
name: { ru: "Нарушение глотания" }
# дисфагия при инсульте (часть 41а): находит тест глотания
leak: { pct: 0 }
texts:
  hint:
    ru: "Дисфагия — человек поперхивается водой и пищей, она попадает в дыхательные пути. При инсульте частая: до теста глотания не кормят и не дают таблеток, при нарушении ставят зонд — так меньше аспирационных пневмоний."
  present:
    - ru: "Тест глотания не пройден: поперхнулся, сатурация снизилась"
  absent:
    - ru: "Тест глотания пройден: глотает без поперхивания"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.2: дисфагия — частое проявление острого инсульта, фактор риска аспирационной пневмонии; скрининг снижает риск пневмонии (1,9 % против 13,1 %); тест — до еды и таблеток, в первые 3 часа" }
review: draft
