id: sign.romberg_unsteady
name: { ru: "Пошатывание в позе Ромберга" }
# фон — игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "Поза Ромберга — стоять, сдвинув ступни и вытянув руки, с закрытыми глазами. Пошатывание — статическая атаксия, нарушение равновесия; после травмы головы — признак сотрясения."
  present:
    - ru: "В позе Ромберга пошатывается"
  absent:
    - ru: "В позе Ромберга устойчив{|а}"
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2.1: статическая атаксия — 20 %, динамическая — 10 %" }
review: draft
