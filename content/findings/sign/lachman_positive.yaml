id: sign.lachman_positive
name: { ru: "Тест Лахмана положительный" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Колено согнуто на 15–30°, врач смещает голень вперёд: она уходит без жёсткой остановки — передняя крестообразная связка порвана."
  present:
    - ru: "Тест Лахмана положительный: голень смещается кпереди, конечная точка мягкая"
  absent:
    - ru: "Тест Лахмана отрицательный: жёсткая остановка"
sources:
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: тест Лахмана — нога согнута на 15–30°, голень смещают кпереди; нечёткая конечная точка без жёсткой остановки — повреждение ПКС; жёсткая остановка при 3 мм — связка цела" }
