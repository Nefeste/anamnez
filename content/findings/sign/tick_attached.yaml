id: sign.tick_attached
name: { ru: "Клещ в коже" }
# присосавшийся клещ — его видно на осмотре кожи (spec 2026-10-chapter-4, часть 51а)
leak: never
texts:
  hint:
    ru: "Присосавшийся клещ виден на коже: тёмное тельце, головка — в коже. Его сразу удаляют пинцетом или нитью, вращая, не раздавив; ранку обрабатывают антисептиком, клеща — в баночку на исследование."
  present:
    - ru: "В коже — присосавшийся клещ"
  absent:
    - ru: "Клеща в коже нет"
sources:
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 5.2: клеща удаляют немедленно, пинцетом или нитью, раскачивающе-выкручивающими движениями, не раздавив" }
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; приложение В: захватить как можно ближе к хоботку, вращая вокруг оси; не допустить раздавливания; мазевые повязки и масло не накладывать" }
