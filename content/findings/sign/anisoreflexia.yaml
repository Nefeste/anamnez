id: sign.anisoreflexia
name: { ru: "Анизорефлексия" }
# фон — игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "Разница сухожильных рефлексов справа и слева. После травмы головы негрубая анизорефлексия бывает при сотрясении и проходит за несколько дней; при ушибе мягких тканей её нет."
  present:
    - ru: "Негрубая анизорефлексия: сухожильные рефлексы справа и слева различаются"
  absent:
    - ru: "Рефлексы живые, одинаковые с обеих сторон"
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2.1: негрубая анизорефлексия сухожильных и кожных рефлексов — 20 %, исчезает у 90 % в течение 4–5 суток" }
review: draft
