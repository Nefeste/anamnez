id: sign.finger_flexion_loss
name: { ru: "Палец не сгибается или не разгибается" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Рана кисти может перерезать сухожилие или нерв: тогда палец не сгибается или не разгибается, а кончик теряет чувствительность. Такую рану не зашивают в приёмном — сухожилие сшивает кистевой хирург."
  present:
    - ru: "Не может согнуть или разогнуть палец"
  absent:
    - ru: "Сгибает и разгибает все пальцы, чувствительность сохранена"
sources:
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.1: рекомендация — только о ранах без функционально значимого повреждения сухожилий и нервов; раздел 6: глубокая рана с повреждением мышц, сухожилий, сосудов — показание к экстренной госпитализации" }
  - { kind: review, title: "Griffin M, Hindocha S, Jordan D, Saleh M, Khan W. An overview of the management of flexor tendon injuries. Open Orthop J 2012;6:28–35", url: "https://pubmed.ncbi.nlm.nih.gov/22431948/", note: "PMID 22431948, PMC3293389, сверено 29.09.2026: при повреждении сухожилия-сгибателя палец не сгибается; поверхностный и глубокий сгибатели проверяют по отдельности, обязательно — чувствительность" }
review: draft
