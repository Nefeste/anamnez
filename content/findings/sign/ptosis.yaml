id: sign.ptosis
name: { ru: "Опущенные веки" }
# птоз при ботулизме (spec 2026-10-chapter-4, часть 51в): «больным приходится поднимать веки руками» (911_1, раздел 1.6); на
# осмотре — птоз век и ограничение движений глазных яблок во все стороны (раздел 2). С возрастом веки опускаются и без болезни —
# фон игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "Верхние веки опущены с обеих сторон, глаза не открыть полностью, глазные яблоки плохо двигаются в стороны. Внезапно и вместе с широкими зрачками — ботулизм. Опущено одно веко — другое: поражение нерва, инсульт."
  present:
    - ru: "Веки опущены с обеих сторон, движения глаз ограничены"
  absent:
    - ru: "Веки не опущены, глаза двигаются в полном объёме"
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: птоз — больным приходится поднимать веки руками, иногда вместо птоза тяжесть в веках; паралитический синдром симметричный и двусторонний; раздел 2: птоз век, ограничение движений глазных яблок во все стороны; критерий качества 2" }
review: draft
