id: sign.varicose_veins
name: { ru: "Варикозные вены" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Подкожные вены расширены больше 3 мм, узловатые и извитые. Самый частый фон тромбофлебита: варикоз у восьми из десяти больных."
  present:
    - ru: "На ногах варикозно расширенные вены"
  absent:
    - ru: "Варикозных вен нет"
sources:
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; термины: варикозно расширенные подкожные вены — диаметром более 3 мм стоя, узловатые или извитые; раздел 1.2: варикоз у пациентов с тромбофлебитом — до 80 %" }
review: draft
