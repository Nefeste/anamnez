id: sign.scleral_injection
name: { ru: "Красные белки глаз" }
# инъекция сосудов склер и конъюнктив (spec 2026-10-chapter-4, часть 52б): при ГЛПС «особенно заметна» в лихорадочном периоде,
# при среднетяжёлой — и кровоизлияния в склеры (347_2, раздел 1.6; приложение А3); бывает и при гриппе (приложение А3). Фон —
# игровая оценка
leak: { pct: 2 }
texts:
  hint:
    ru: "Сосуды на белках глаз расширены, глаза красные, бывают и пятна кровоизлияний. При высокой температуре с болью в пояснице — довод за геморрагическую лихорадку с почечным синдромом; красные глаза бывают и при гриппе."
  present:
    - ru: "Инъекция сосудов склер и конъюнктив"
  absent:
    - ru: "Склеры белые, сосуды не расширены"
sources:
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: особенно заметна инъекция сосудов склер и конъюнктив; раздел 2.2 (УУР C, УДД 5): осмотр — инъекция склер и конъюнктив; приложение А3: при среднетяжёлой — кровоизлияния в склеры, инъецированность склер — общий признак ГЛПС и гриппа; фон — игровая оценка" }
