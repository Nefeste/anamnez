id: sign.petechial_rash
name: { ru: "Геморрагическая сыпь" }
# менингококкемия (spec 2026-10-chapter-4, часть 50а): необильная геморрагическая сыпь до 0,5 см, «преимущественно в
# дистальных отделах конечностей и на ягодицах» (1020_1, раздел 1.6); в первые сутки болезни — «главная
# дифференциальная особенность» (раздел 2.5). Других болезней с такой сыпью в базе нет — игровая оценка
leak: { pct: 0 }
# лихорадка с геморрагической сыпью — сразу к врачу (игровое правило сортировки)
triage: red
texts:
  hint:
    ru: "Мелкие тёмно-красные пятнышки и звёздочки, которые не бледнеют, если прижать к ним стеклянный стакан, — это кровоизлияния в кожу. На ногах и ягодицах в первые сутки лихорадки — менингококковая инфекция, пока не доказано иное: кровь на посев и антибиотик в вену в первый час."
  present:
    - ru: "На ногах и ягодицах — мелкая тёмно-красная сыпь звёздочками, при надавливании стаканом не бледнеет"
  absent:
    - ru: "Геморрагической сыпи нет"
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 1.6: при менингококкемии средней тяжести — к концу первых или началу вторых суток необильная геморрагическая сыпь до 0,5 см, на дистальных отделах конечностей и ягодицах; раздел 2.5: главная особенность — геморрагическая сыпь в первые сутки болезни, при других болезнях — позже 3-го дня; приложение А3.5: при менингококкемии сыпь бывает в 100 % случаев; без болезни — игровая оценка" }
review: draft
