id: sign.chvostek
name: { ru: "Симптом Хвостека" }
# «сокращение мышц лица при постукивании в месте выхода лицевого нерва – менее чувствительный и специфичный признак. Отрицательный
# симптом Хвостека наблюдается у 30% пациентов, имеющих гипокальциемию, положительный – у 10% людей без данной патологии» (spec
# 2026-10-chapter-4, часть 56в; 627_3, раздел 2.2) — точность пробы (exam.tetany_signs); признак — у каждого с гипокальциемией
leak: { pct: 0 }
texts:
  hint:
    ru: "Врач постукивает молоточком по щеке перед ухом, где выходит лицевой нерв. Дёрнулся угол рта — симптом положительный. Признак слабее Труссо: у 30 из 100 больных с низким кальцием его нет, а у 10 из 100 людей без гипокальциемии он есть."
  present:
    - ru: "При постукивании перед ухом дёргается угол рта — симптом Хвостека положительный"
  absent:
    - ru: "Симптом Хвостека отрицательный"
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2.2 (УУР С, УДД 5): симптом Хвостека — сокращение мышц лица при постукивании в месте выхода лицевого нерва, менее чувствительный и специфичный признак: отрицателен у 30 % пациентов с гипокальциемией, положителен у 10 % людей без неё" }
