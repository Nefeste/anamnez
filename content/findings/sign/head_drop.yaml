id: sign.head_drop
name: { ru: "Свисающая голова" }
# синдром «свисающей головы» — вялый парез мышц шеи и плечевого пояса, «патогномоничный симптом» полиомиелитической формы
# клещевого энцефалита (spec 2026-10-chapter-4, часть 51б; 567_2, раздел 1.6)
leak: never
texts:
  hint:
    ru: "Голову не удержать — она свисает на грудь, руки не поднимаются, мышцы шеи и плеч вялые и быстро худеют. Признак полиомиелитической формы клещевого энцефалита; при поражении диафрагмы — частое поверхностное дыхание."
  present:
    - ru: "Вялый парез мышц шеи и плеч: голова свисает на грудь"
  absent:
    - ru: "Мышцы шеи и плеч в норме"
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: синдром «свисающей головы» является патогномоничным симптомом полиомиелитической формы; рано наступающая и резко выраженная атрофия мышц; диафрагма нередко парализована — частое поверхностное дыхание с парадоксальным втягиванием живота на вдохе" }
review: draft
