# напряжённом — куполом; притупление перкуторного звука во фланках (715_2, раздел 2.2). Фон — игровая оценка
leak: { pct: 0.2 }
texts:
  hint:
    ru: "Жидкость в животе: он увеличен, распластан или натянут куполом, при перкуссии во фланках — тупой звук. Самое частое осложнение цирроза; бывает и при сердечной недостаточности и опухолях."
  present:
    - ru: "Живот увеличен, во фланках притупление — асцит"
  absent:
    - ru: "Свободной жидкости в животе не определяется"
