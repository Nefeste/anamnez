texts:
  hint:
    ru: "Сыпь прибывает на глазах: пятна крупные, сливаются, в центре темнеют от некроза, появляются на груди, шее и лице. Это тяжёлая менингококкемия: в первые 30 минут — в реанимацию, а люмбальную пункцию откладывают."
  present:
    - ru: "Сыпь прибывает на глазах: крупные сливающиеся пятна с тёмным некрозом в центре — на туловище, шее и лице"
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 1.6: при тяжёлой менингококкемии сыпь в первые 12 часов — обильная, крупная, до 1–2 см, на лице и туловище, крупные элементы некротизируются; при фульминантной — с большим числом некрозов в первые часы; раздел 6.1: раннее появление геморрагической сыпи, быстрое прогрессирование и локализация на груди, шее, лице — показание к ОРИТ; приложение А3.3: прогрессирующая геморрагическая сыпь — противопоказание к спинномозговой пункции; без болезни — игровая оценка" }
