id: sign.straight_leg_raise
name: { ru: "Не может поднять выпрямленную ногу" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Лёжа на спине, человек не может оторвать от кушетки выпрямленную ногу — пятка будто прилипла. Частый признак перелома шейки бедра."
  present:
    - ru: "Поднять выпрямленную ногу лёжа не может — симптом «прилипшей пятки»"
  absent:
    - ru: "Выпрямленную ногу лёжа поднимает"
sources:
  - { kind: guideline, title: "Переломы проксимального отдела бедренной кости", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/980_1", note: "ID 980_1, опубликованы 10.12.2025, применяются; сверено с рубрикатором 29.09.2026; разделы 1.6 и 2.2: пациент, лежа на спине, не способен, в том числе из-за боли, поднять выпрямленную нижнюю конечность; частоты не даны" }
review: draft
