id: sign.navicular_tenderness
name: { ru: "Болезненность ладьевидной кости" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Больно, когда врач надавливает на кость по внутреннему краю стопы, впереди и ниже внутренней лодыжки, — на ладьевидную кость. Признак оттавских правил для стопы: с ним нужен снимок стопы."
  present:
    - ru: "Болезненность при пальпации ладьевидной кости"
  absent:
    - ru: "Пальпация ладьевидной кости безболезненна"
sources:
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: оттавские правила — рентгенография стопы при боли в среднем отделе стопы и болезненности при пальпации ладьевидной кости" }
review: draft
