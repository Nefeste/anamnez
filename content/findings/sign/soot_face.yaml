sources:
  - { kind: guideline, title: "Токсическое действие окиси углерода. Токсическое действие других газов, дымов и паров", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/885_1", note: "ID 885_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2.1: жалобы при ингаляционной травме — наличие копоти на лице и ротоглотке; раздел 2.2: косвенные признаки ингаляционной травмы — следы копоти в носоглотке и ротоглотке, изменение голоса; раздел 3.2: дыхательная недостаточность может не проявляться в первые 24–72 часа" }
