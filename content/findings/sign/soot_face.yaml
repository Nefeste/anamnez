# косвенный признак ингаляционной травмы на пожаре (spec 2026-10-chapter-4, часть 57б): «следы копоти в носоглотке и ротоглотке»
# (885_1, раздел 2.2), жалобы — на «наличие копоти на лице, ротоглотке» (раздел 2.1). Только от пожара
leak: { pct: 0 }
texts:
  hint:
    ru: "Копоть на лице, в носу и во рту — человек дышал дымом. Это косвенный признак ингаляционной травмы: горячий дым и продукты горения повреждают дыхательные пути, а дыхательная недостаточность может проявиться через 1–3 суток."
  present:
