id: sign.acetone_breath
name: { ru: "Запах ацетона изо рта" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Запах ацетона в выдыхаемом воздухе. У больного диабетом с жаждой и рвотой — довод за кетоацидоз; при гиперосмолярном состоянии его нет."
  present:
    - ru: "Изо рта пахнет ацетоном"
  absent:
    - ru: "Запаха ацетона нет"
sources:
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом. 11-й выпуск", org: "Под ред. И.И. Дедова, М.В. Шестаковой, А.Ю. Майорова", year: 2023, url: "https://doi.org/10.14341/DM13042", note: "Сахарный диабет. 2023;26(2S):1–157, сверено 15.10.2026; раздел 8.1, с. 44: клиническая картина ДКА — запах ацетона в выдыхаемом воздухе; раздел 8.2, с. 47: при ГГС запаха ацетона и дыхания Куссмауля нет" }
