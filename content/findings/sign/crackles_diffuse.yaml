id: sign.crackles_diffuse
name: { ru: "Влажные хрипы над всеми полями лёгких" }
# отёк лёгких (spec 2026-10-chapter-3, часть 43в): влажные хрипы — уже не только внизу, а над всеми полями обоих лёгких
# (156_2, раздел 7.3.1: признаки застоя по малому кругу, отёк лёгких — жизнеугрожающее состояние, раздел 6). Без
# болезни не бывает — игровая оценка
leak: { pct: 0 }
triage: red
texts:
  hint:
    ru: "Влажные хрипы слышны над всеми полями обоих лёгких, до верхушек: жидкость заполняет альвеолы — это отёк лёгких. Человек задыхается сидя, кашляет пенистой мокротой; нужна палата интенсивной терапии."
  present:
    - ru: "Над всеми полями обоих лёгких — влажные хрипы, до верхушек"
  absent:
    - ru: "Влажных хрипов над верхними полями лёгких нет"
sources:
  - { kind: guideline, title: "Хроническая сердечная недостаточность", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/156_2", note: "ID 156_2, опубликованы 07.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 7.3.1: влажные незвонкие хрипы при аускультации обоих лёгких — застой по малому кругу; раздел 6: отёк лёгких — жизнеугрожающее состояние, признак для ПИТ; хрипы над всеми полями при отёке — игровая оценка" }
