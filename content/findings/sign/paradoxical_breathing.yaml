id: sign.paradoxical_breathing
name: { ru: "Парадоксальное движение участка грудной стенки" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Несколько рёбер сломаны в двух местах, и кусок грудной стенки потерял опору: на вдохе он западает, на выдохе выбухает. Это реберный клапан — лечат в торакальном отделении."
  present:
    - ru: "На вдохе участок грудной стенки западает, на выдохе выбухает"
  absent:
    - ru: "Грудная стенка движется при дыхании равномерно"
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.1: флотирующие переломы рёбер — реберный клапан, парадоксальное дыхание; раздел 2.4: диагноз реберного клапана скорее опирается на клиническую картину парадоксальных движений; раздел 6: множественные и флотирующие переломы — в торакальное хирургическое отделение; частоты не даны" }
review: draft
