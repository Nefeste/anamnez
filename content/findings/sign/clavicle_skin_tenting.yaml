id: sign.clavicle_skin_tenting
name: { ru: "Кожа натянута над отломком ключицы" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Острый отломок ключицы изнутри натягивает кожу, она бледнеет. Грозит проколом кожи — открытым переломом: такой перелом оперируют экстренно."
  present:
    - ru: "Кожа над отломком ключицы натянута, побледнела — угроза перфорации"
  absent:
    - ru: "Кожа над ключицей не натянута"
sources:
  - { kind: guideline, title: "Переломы ключицы и лопатки", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/853_1", note: "ID 853_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: при значительном угловом смещении — дефигурация ключицы с напряжением кожных покровов, угроза их перфорации; разделы 3.2 и 6: угроза перфорации кожи отломками — показание к операции и экстренной госпитализации" }
review: draft
