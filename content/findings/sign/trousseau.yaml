id: sign.trousseau
name: { ru: "Симптом Труссо" }
# появление судорог в кисти через 1–3 минуты после сдавления плеча манжетой (spec 2026-10-chapter-4, часть 56в; 627_3, раздел 2.2):
# «выявляется у 94% пациентов с гипокальциемией и у 1% людей с нормокальциемией» — это точность пробы (exam.tetany_signs); признак
# — у каждого с гипокальциемией
leak: { pct: 0 }
texts:
  hint:
    ru: "Манжету тонометра на плече накачивают, как при измерении давления, и держат. Если через 1–3 минуты кисть сводит судорогой — симптом положительный. Признак гипокальциемии: есть у 94 из 100 больных и лишь у одного из 100 человек с нормальным кальцием."
  present:
    - ru: "Под манжетой через пару минут кисть свело — симптом Труссо положительный"
  absent:
    - ru: "Симптом Труссо отрицательный: под манжетой кисть не сводит"
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2.2 (УУР С, УДД 5): оценка симптомов Хвостека и Труссо при подозрении на гипопаратиреоз; положительный симптом Труссо — судороги в кисти через 1–3 минуты после сдавления плеча манжетой, у 94 % пациентов с гипокальциемией и у 1 % людей с нормокальциемией" }
review: draft
