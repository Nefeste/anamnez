id: sign.mydriasis
name: { ru: "Широкие зрачки" }
# мидриаз при ботулизме (spec 2026-10-chapter-4, часть 51в): «расширение зрачков (мидриаз) и вялость или отсутствие всех
# зрачковых реакций» (911_1, раздел 1.6); у миастении мидриаза нет (раздел 2.6). С частью 57в — и при отравлении метанолом:
# «умеренное расширение зрачков и ослабление фотореакции» при лёгкой форме, «мидриаз» при тяжёлой (873_1, раздел 1.5.1)
leak: never
texts:
  hint:
    ru: "Зрачки расширены с обеих сторон и вяло сужаются на свет. Вместе с опущенными веками и двоением — ботулизм: при миастении зрачки обычные. Расширяют зрачки и атропин, красавка, дурман — но тогда лицо красное, сердцебиение и возбуждение. После спиртного с пеленой перед глазами — отравление метанолом."
  present:
    - ru: "Зрачки широкие, на свет реагируют вяло"
  absent:
    - ru: "Зрачки обычной ширины, на свет реагируют живо"
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: расширение зрачков и вялость или отсутствие всех зрачковых реакций; раздел 2.6: при миастении мидриаза нет; при передозировке атропина и отравлении красавкой, беленой, дурманом — гиперемия лица, тахикардия, расстройства психики; критерий качества 2" }
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.5.1: при лёгкой форме отравления метанолом — умеренное расширение зрачков и ослабление фотореакции, при тяжёлой — мидриаз и стремительное нарушение зрения; раздел 1.6.1: вялая реакция на свет или её отсутствие" }
review: draft
