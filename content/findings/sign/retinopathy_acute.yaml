# злокачественная АГ — кровоизлияния и/или отёк соска зрительного нерва на глазном дне (62_3, раздел 3.7); без
# болезни не бывает
leak: { pct: 0 }
texts:
  hint:
    ru: "На глазном дне — кровоизлияния и отёк диска зрительного нерва. Так выглядит злокачественная гипертензия: сосуды страдают по всему телу, и с ними — почки и мозг. Это криз, даже если голова не болит."
  present:
    - ru: "На глазном дне — кровоизлияния, экссудаты и отёк диска зрительного нерва"
  absent:
    - ru: "Глазное дно без кровоизлияний, диск зрительного нерва не отёчен"
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: злокачественная АГ — изменения на глазном дне (кровоизлияния и/или отёк соска зрительного нерва); раздел 2.4: офтальмоскопия — геморрагии, экссудаты, отёк соска зрительного нерва" }
