id: sign.postictal
name: { ru: "Постприступное состояние" }
# после генерализованного тонико-клонического приступа — спутанность и сон (spec 2026-10-chapter-3, часть 44в;
# 741_1, раздел 1.6.5.3); постприступная спутанность — после каждого такого приступа (741_1, раздел 2.1: 100 % после
# ГТКП, 13–16 % — при психогенных). Видно на осмотре
leak: { pct: 0 }
texts:
  hint:
    ru: "После генерализованного приступа человек от минут до нескольких часов сонлив, спутан и приступа не помнит. После обморока сознание возвращается за секунды — так их и различают."
  present:
    - ru: "Сонлив{|а}, спутан{|а}, приступа не помнит — понемногу приходит в себя"
  absent:
    - ru: "Постприступной спутанности нет"
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6.5.3: после генерализованного тонико-клонического приступа — постприступное оглушение и сон; раздел 2.1: постприступная спутанность — 100 % после генерализованного тонико-клонического приступа, 13–16 % при психогенных; точность осмотра — игровая оценка" }
review: draft
