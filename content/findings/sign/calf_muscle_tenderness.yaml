id: sign.calf_muscle_tenderness
name: { ru: "Болезненность в икроножной мышце" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Больно и плотно в толще икроножной мышцы, трудно встать на носок: мышца напряжена после надрыва. Похоже на тромбоз, но болит сама мышца, а не по ходу вен."
  present:
    - ru: "Болезненность и уплотнение в толще икроножной мышцы, больно встать на носок"
  absent:
    - ru: "Икроножная мышца безболезненна"
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: при повреждении мышцы — напряжённость мышцы, усиливающаяся при нагрузке или движениях в смежных суставах, снижение силы мышцы при частичном сохранении функции" }
review: draft
