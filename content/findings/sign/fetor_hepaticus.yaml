id: sign.fetor_hepaticus
name: { ru: "Печёночный запах изо рта" }
# «сладковатый запах изо рта, что связано с тяжёлой печёночной недостаточностью» (spec 2026-10-chapter-4, часть 54а; 715_2,
# раздел 2.2). Без болезни печени не бывает — фон игровая оценка
leak: { pct: 0.02 }
texts:
  hint:
    ru: "Сладковатый, чуть «мышиный» запах изо рта: больная печень не обезвреживает летучие вещества, и они выходят с дыханием. Бывает при тяжёлой печёночной недостаточности, часто — вместе с печёночной энцефалопатией."
  present:
    - ru: "Сладковатый печёночный запах изо рта"
  absent:
    - ru: "Необычного запаха изо рта нет"
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.2: при осмотре органов пищеварения — сладковатый запах изо рта, что связано с тяжёлой печёночной недостаточностью; фон — игровая оценка" }
