id: sign.mt5_tenderness
name: { ru: "Болезненность у основания пятой плюсневой кости" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Больно, когда врач надавливает на кость по наружному краю стопы, в её середине, — там, где выступает основание пятой плюсневой кости. Признак оттавских правил для стопы: с ним нужен снимок стопы."
  present:
    - ru: "Болезненность при пальпации основания пятой плюсневой кости"
  absent:
    - ru: "Пальпация основания пятой плюсневой кости безболезненна"
sources:
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: оттавские правила — рентгенография стопы при боли в среднем отделе стопы и болезненности при пальпации основания 5 плюсневой кости" }
