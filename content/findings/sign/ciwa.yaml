sources:
  - { kind: guideline, title: "Психические и поведенческие расстройства, вызванные употреблением алкоголя. Синдром отмены алкоголя (алкогольное абстинентное состояние)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/784_1", note: "ID 784_1, опубликованы 20.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 2.1 (УУР C, УДД 4): шкала CIWA-Ar у всех пациентов с синдромом отмены — 0–8 баллов: отсутствие или низкая степень тяжести, 9–15 — средняя, 16 и более — тяжёлый синдром отмены и угрожающий делирий; приложение Г1: десять пунктов, максимум 67 баллов" }
