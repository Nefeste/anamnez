# тяжесть синдрома отмены алкоголя — число шкалы CIWA-Ar (spec 2026-10-chapter-4, часть 54б): десять симптомов, до 67
# баллов (784_1, приложение Г1); «Баллы от 0 до 8 свидетельствуют об отсутствии или низкой степени тяжести ААС…; 9-15
# баллов свидетельствуют о средней степени тяжести; 16 баллов и более говорят о тяжёлом ААС и угрожающем делирии» (раздел
# 2.1). 16 и больше — порог на том же числе (`sign.ciwa_16`), как у NIHSS
