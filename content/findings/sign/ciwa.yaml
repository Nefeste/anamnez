  decimals: 0
texts:
  hint:
    ru: "Шкала CIWA-Ar складывает баллы десяти симптомов отмены алкоголя: тошнота, дрожь, пот, тревога, возбуждение, головная боль, обманы осязания, слуха и зрения, ориентировка. До 8 баллов — лёгкая отмена, 9–15 — средняя: лечат бензодиазепином в стационаре, 16 и больше — тяжёлая, грозит делирием."
