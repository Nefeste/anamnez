id: sign.cold_clammy
name: { ru: "Холодная влажная кожа" }
# гипоперфузия (spec 2026-10-chapter-3, часть 43в): «холодные и влажные конечности, олигурия, спутанность сознания,
# слабое наполнение пульса» (156_2, раздел 7.3.1); профиль по температуре кожи — табл. 13. Без болезни не бывает —
# игровая оценка
leak: { pct: 0 }
# органам не хватает крови — красный: как низкое давление (игровое правило сортировки)
triage: red
texts:
  hint:
    ru: "Руки и ноги холодные и влажные, пульс слабый, человек заторможен: органам не хватает крови. При острой сердечной недостаточности это «холодный» больной — мочегонное и нитроглицерин ему сначала вредны."
  present:
    - ru: "Кожа холодная и влажная, пульс слабого наполнения"
  absent:
    - ru: "Кожа тёплая, пульс хорошего наполнения"
sources:
  - { kind: guideline, title: "Хроническая сердечная недостаточность", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/156_2", note: "ID 156_2, опубликованы 07.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 7.3.1: признаки гипоперфузии — холодные и влажные конечности, олигурия, спутанность сознания, слабое наполнение пульса; табл. 13: профиль по температуре кожных покровов; без болезни — игровая оценка" }
review: draft
