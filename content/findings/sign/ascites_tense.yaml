id: sign.ascites_tense
name: { ru: "Живот натянут, пупок выбухает" }
# асцит третьей степени по ICA (spec 2026-10-chapter-4, часть 54а): «напряжённый асцит» (715_2, раздел 1.5) — живот натянут
# куполом, кожа блестит, пупок выбухает; при нём — лечебный парацентез (раздел 3.2.1). Без асцита не бывает
leak: { pct: 0 }
texts:
  hint:
    ru: "Жидкости в животе так много, что он натянут, как барабан: кожа блестит, пупок выпячен, тяжело дышать. Это третья степень асцита — жидкость выпускают лечебным парацентезом, мочегонные одни не успеют."
  present:
    - ru: "Живот натянут куполом, пупок выбухает — асцит напряжённый"
  absent:
    - ru: "Живот не натянут"
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.5: третья степень по ICA — напряжённый асцит; раздел 3.2.1 (УУР B, УДД 2): при третьей степени — лечебный парацентез" }
review: draft
