id: sign.wound_gaping
name: { ru: "Края раны расходятся" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Если края свежей чистой раны под повязкой не сходятся, её зашивают. Если сходятся, хватит повязки: шов не нужен."
  present:
    - ru: "Края раны расходятся — сами не сойдутся"
  absent:
    - ru: "Края раны сходятся"
sources:
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: зияние раны; раздел 3.2 (УУР C, УДД 5): первичное ушивание, если наложенная повязка не обеспечивает сопоставления краёв раны" }
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2: расхождение краёв раны — показание к хирургическому лечению" }
