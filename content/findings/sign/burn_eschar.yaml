id: sign.burn_eschar
name: { ru: "Струп на ожоге" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Корка из омертвевшей кожи. Толстый струп, через который просвечивают тромбированные вены, — признак глубокого ожога III степени; тонкий светлый струп бывает и при ожоге II степени от очень горячего агента. Глубину уточняют пробы на чувствительность."
  present:
    - ru: "На ожоге струп — корка из омертвевшей кожи"
  absent:
    - ru: "Струпа нет"
sources:
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: III степень — некротические ткани в виде толстого струпа, через который могут просвечивать тромбированные подкожные вены, дно раны тусклое, белесоватое; при II степени от агентов с высокой температурой — тонкий светло-жёлтый или коричневый струп, через который не просвечивают сосуды; частот нет — игровые" }
