id: sign.pulsus_paradoxus
name: { ru: "Парадоксальный пульс" }
# патогномоничный симптом тампонады: на вдохе верхнее давление падает больше чем на 10 (746_2, раздел 2.2). Без
# тампонады — не бывает в игре: при тяжёлой астме и ХОБЛ он тоже возможен, но там его не меряют — игровая оценка
leak: { pct: 0 }
redFlag: true
texts:
  hint:
    ru: "На спокойном вдохе верхнее давление падает больше чем на 10: выпот сдавил сердце, и на вдохе правый желудочек отнимает место у левого. Признак тампонады — нужна срочная пункция перикарда."
  present:
    - ru: "На вдохе верхнее давление падает больше чем на 10 — парадоксальный пульс"
  absent:
    - ru: "На вдохе давление почти не меняется"
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.2: парадоксальный пульс — патогномоничный симптом тампонады, снижение систолического АД больше чем на 10 мм рт. ст. на вдохе при спокойном дыхании; приложение Б: измерение АД — снижение систолического на вдохе" }
review: draft
