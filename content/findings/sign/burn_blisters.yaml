id: sign.burn_blisters
name: { ru: "Пузыри на ожоге" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Отслоившийся эпидермис вздувается пузырями с прозрачной желтоватой жидкостью, под ними — розовое влажное дно, прикосновение больно. Так выглядит поверхностный ожог I–II степени."
  present:
    - ru: "Пузыри с прозрачным содержимым, дно розовое, влажное, болезненное"
  absent:
    - ru: "Пузырей нет"
sources:
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей.", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: I степень — тонкостенные пузыри с прозрачной желтоватой жидкостью, дно розовое, влажное, чувствительность сохранена; II — толстостенные пузыри или десквамация эпидермиса; III — геморрагическое содержимое оставшихся пузырей; частот нет — игровые" }
review: draft
