texts:
  hint:
    ru: "Голос в нос, слова смазываются и тускнеют к концу разговора — слабеют мышцы нёба и языка. Вместе с трудным глотанием это бульбарные нарушения: при миастении и ботулизме за ними может отказать дыхание."
  present:
