id: sign.pericardial_rub
name: { ru: "Шум трения перикарда" }
# у трети больных в первый день (746_2, раздел 2.2; ESC 2015 — не больше 33 %); при накоплении выпота исчезает
# (157_5, раздел 3.4.4). Без перикардита не бывает — игровая оценка
leak: { pct: 0 }
texts:
  hint:
    ru: "Поверхностный скребущий звук над сердцем, как скрип снега, — трутся воспалённые листки перикарда. Слышен у трети больных перикардитом в первый день и быстро исчезает; когда набирается выпот, листки расходятся и шум пропадает."
  present:
    - ru: "Над сердцем — шум трения перикарда"
  absent:
    - ru: "Шума трения перикарда нет"
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.2: шум трения перикарда определяется у трети пациентов в первый день болезни, в последующие дни — единичные случаи" }
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.4.4: шум трения перикарда выслушивается лишь у каждого третьего, нередко короткое время; при накоплении экссудата исчезает" }
review: draft
