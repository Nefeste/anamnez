id: sign.nasal_bleeding_point
name: { ru: "Кровоточит сосуд на перегородке носа" }
leak: { pct: 0 }
texts:
  hint:
    ru: "При осмотре носа виден кровоточащий сосуд в передней части перегородки. Такое кровотечение останавливают прижатием и турундой с лекарством."
  present:
    - ru: "Спереди на перегородке — кровоточащий сосуд"
  absent:
    - ru: "Источник кровотечения в передних отделах не виден"
sources:
  - { kind: guideline, title: "Носовое кровотечение", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/977_1", note: "ID 977_1, опубликованы 08.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2: передняя риноскопия; раздел 3.1.1 (УУР А, УДД 1): при видимом источнике — анемизация или аппликация гемостатика; критерий качества 2" }
