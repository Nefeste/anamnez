    ru: "Больно, когда надавливают по ходу глубоких вен — на внутренней стороне голени, в подколенной ямке, на бедре. Признак тромбоза глубоких вен и пункт шкалы Уэллса."
  present:
    - ru: "Болезненность при надавливании по ходу глубоких вен голени и бедра"
  absent:
    - ru: "По ходу глубоких вен безболезненно"
sources:
