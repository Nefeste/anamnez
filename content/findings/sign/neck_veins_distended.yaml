id: sign.neck_veins_distended
name: { ru: "Набухшие шейные вены" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Шейные вены набухают, когда крови трудно вернуться к сердцу: при напряжённом пневмотораксе воздух под давлением сдавливает сердце и крупные вены — нужна экстренная декомпрессия; при сердечной недостаточности кровь застаивается перед ослабевшим сердцем."
  present:
    - ru: "Шейные вены набухли"
  absent:
    - ru: "Шейные вены не набухшие"
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: при клапанном пневмотораксе видны набухшие шейные вены, нарастает подкожная эмфизема; раздел 2.2: при осмотре — набухание шейных вен; раздел 3: экстренная декомпрессия торакоцентезом и дренированием (УУР C, УДД 5); частоты не даны" }
review: draft
