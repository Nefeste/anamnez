id: sign.goiter
name: { ru: "Щитовидная железа увеличена" }
# зоб (spec 2026-10-chapter-4, часть 56б): «ЩЖ в 80% случаев при БГ диффузно увеличена, умеренной плотности, безболезненная,
# подвижная» (270_2, раздел 1.6); при узловом зобе пальпируются узлы (там же); степени — по ВОЗ (табл. 1). Фон — эутиреоидный
# зоб, игровая оценка
leak: { pct: 2 }
texts:
  hint:
    ru: "Щитовидная железа на шее спереди прощупывается или даже видна. Мягкая и ровная — бывает при болезни Грейвса, с плотными узлами — при узловом зобе. Сам по себе зоб не говорит, много ли гормонов: это покажут ТТГ и свободный Т4."
  present:
    - ru: "Щитовидная железа увеличена, прощупывается легко"
  absent:
    - ru: "Щитовидная железа не увеличена"
sources:
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 1.6: при болезни Грейвса железа диффузно увеличена в 80 % случаев, при узловом зобе пальпируются очаговые образования; табл. 1: классификация зоба ВОЗ; фон — игровая оценка" }
