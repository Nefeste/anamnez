id: sign.heart_sounds_muffled
name: { ru: "Глухие тоны сердца" }
# большой выпот и тампонада: тоны приглушены или глухие (746_2, раздел 2.2); триада Бека — гипотония, набухшие шейные
# вены, глухие тоны. Фон — у тучных и при эмфиземе тоны тоже тише: игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "Тоны сердца еле слышны. Бывает, когда сердце окружено жидкостью — при большом выпоте в перикарде; вместе с низким давлением и набухшими шейными венами — тампонада. Тише тоны и у полных людей."
  present:
    - ru: "Тоны сердца глухие, еле слышны"
  absent:
    - ru: "Тоны сердца ясные"
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.2: аускультативно тоны сердца приглушены либо глухие; при выраженных выпотах — триада Бека: гипотония, пульсация яремных вен и приглушённые тоны; фон — игровая оценка" }
review: draft
