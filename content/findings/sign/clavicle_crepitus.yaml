id: sign.clavicle_crepitus
name: { ru: "Хруст отломков ключицы" }
leak: { pct: 0 }
texts:
  hint:
    ru: "При осторожном ощупывании под пальцами хрустят трущиеся отломки — крепитация. Признак перелома; нарочно её не вызывают — это больно."
  present:
    - ru: "Крепитация отломков ключицы"
  absent:
    - ru: "Крепитации нет"
sources:
  - { kind: guideline, title: "Переломы ключицы и лопатки", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/853_1", note: "ID 853_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: крепитация отломков; частота не дана" }
