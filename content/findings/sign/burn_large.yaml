id: sign.burn_large
name: { ru: "Ожог больше 15 ладоней" }
leak: { pct: 0 }
texts:
  hint:
    ru: "На обожжённую кожу ложится больше 15 ладоней больного: ладонь — около 1 % поверхности тела, покраснение без пузырей не считают. Ожог от 10 % лечат в ожоговом центре, при площади больше 15 % развивается ожоговый шок — капельницу ставят сразу."
  present:
    - ru: "Площадь ожога — больше 15 ладоней больного, больше 15 % поверхности тела"
  absent:
    - ru: "Площадь ожога — меньше 10 ладоней больного"
sources:
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: правило ладони — площадь ладони около 1 % поверхности тела; раздел 1.5: ладонь — 170–200 см², ожоговая болезнь — при площади больше 15–20 %; раздел 3.1.4: эритема в площадь не входит, внутривенная инфузия — при площади больше 15 %; раздел 6, п. 7 и 11: амбулаторно — I–II степень до 10 %, от 10 % — ожоговое отделение" }
review: draft
