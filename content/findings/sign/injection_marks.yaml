id: sign.injection_marks
name: { ru: "Следы уколов на венах" }
# следы инъекций по ходу подкожных вен конечностей, «однако, это происходит далеко не всегда» (spec 2026-10-chapter-4, часть 57а; 743_2,
# раздел 2.2); вводят чаще всего в вену — «почти в 80 % общего числа случаев употребления» (раздел 1.2). Фон — игровая оценка
leak: { pct: 0.3 }
texts:
  hint:
    ru: "Точки уколов и рубчики по ходу вен на руках и ногах. Говорят, что человек вводит что-то в вену, — но их бывает не видно, а нюхают и глотают наркотики тоже."
  present:
    - ru: "На руках по ходу вен — следы уколов"
  absent:
    - ru: "Следов уколов не видно"
sources:
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 1.2: внутривенно — почти в 80 % случаев употребления, интраназально — около 15 %; раздел 2.2: следы инъекций по ходу подкожных вен конечностей определяются далеко не всегда; фон — игровая оценка" }
review: draft
