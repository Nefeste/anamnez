id: sign.lagophthalmos
name: { ru: "Лагофтальм" }
# глаз не закрывается до конца (spec 2026-10-chapter-3, часть 44б): «неполное смыкание век вследствие слабости
# круговой мышцы глаза, встречается у 3/4 пациентов» с невропатией лицевого нерва (895_1, раздел 1.6)
leak: { pct: 0 }
attrs:
  side:
    right: { ru: "справа" }
    left: { ru: "слева" }
texts:
  hint:
    ru: "Глаз на стороне пареза не закрывается до конца: видна полоска белка, роговица сохнет. Без капель днём и геля на ночь — кератит и язва роговицы."
  present:
    - ru: "Глаз {side} не закрывается до конца — видна полоска белка"
  absent:
    - ru: "Глаза закрываются полностью"
sources:
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6: лагофтальм у 3/4 пациентов, неполное смыкание век ведёт к ксерозу, кератиту, язве; раздел 3.2.1: искусственные слёзы днём и в ночное время; точность осмотра — игровая оценка" }
review: draft
