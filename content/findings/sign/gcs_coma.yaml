id: sign.gcs_coma
name: { ru: "Кома по шкале комы Глазго" }
# 8 баллов и ниже — кома (spec 2026-10-chapter-4, часть 50а; 1020_1, приложение Г1): при отёке мозга у менингококкового
# менингита (раздел 1.6). Порог на том же числе, что «Оглушение по шкале комы Глазго», и его снимает: кома — не
# оглушение. 3–4 балла — смерть мозга, в игре — от 5
leak: { pct: 0 }
triage: red
value:
  unit: "баллов"
  ref: [15, 15]
  present: [5, 8]
  absent: [15, 15]
  decimals: 0
  of: sign.gcs_low
texts:
  hint:
    ru: "Кома — 8 баллов и меньше по шкале комы Глазго: глаза открывает только на боль или не открывает, не говорит, на боль лишь отдёргивает руку. Дыхательные пути не защищены — нужна интубация. Люмбальная пункция при коме опасна: мозг может вклиниться в большое затылочное отверстие."
  present:
    - ru: "Кома: 8 баллов и меньше по шкале комы Глазго"
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; приложение Г1: шкала комы Глазго — 7–8 баллов кома 1, 5–6 кома 2, 3–4 смерть мозга; 8 баллов и ниже — кома; раздел 1.6: отёк-набухание головного мозга — спутанность, возбуждение с быстрым переходом в кому, судороги, нарушения дыхания; приложение А3.3: ШКГ менее 9 баллов — противопоказание к спинномозговой пункции; диапазон 5–8 — игровая оценка" }
review: draft
