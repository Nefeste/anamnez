id: sign.breath_sounds_diminished
name: { ru: "Ослабленное дыхание" }
leak: { pct: 0 }
attrs:
  side:
    right: { ru: "справа" }
    left: { ru: "слева" }
texts:
  hint:
    ru: "Над частью лёгкого дыхание почти не слышно: лёгкое поджал воздух или кровь в плевральной полости. Чем их больше, тем тише."
  present:
    - ru: "Дыхание {side} ослаблено"
  absent:
    - ru: "Дыхание проводится с обеих сторон"
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: при пневмотораксе — ослабленное дыхание, при среднем и большом — значительное ослабление или отсутствие; при гемотораксе — ослабление дыхания на стороне повреждения; частоты не даны" }
review: draft
