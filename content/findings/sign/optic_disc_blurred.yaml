id: sign.optic_disc_blurred
name: { ru: "Диск зрительного нерва красный, границы размыты" }
# офтальмическая форма отравления метанолом (spec 2026-10-chapter-4, часть 57в): «При исследовании глазного дна отмечаются
# гиперемия и размытость границ сосков зрительных нервов, расширение вен и кровоизлияния»; при лёгкой форме «Глазное дно сохраняет
# нормальный вид» (873_1, раздел 1.5.1). Без болезни не бывает — фон игровая оценка
leak: { pct: 0 }
texts:
  hint:
    ru: "На глазном дне диск зрительного нерва покрасневший, его границы размыты, вены расширены, бывают кровоизлияния. С падением зрения после спиртного — отравление метанолом: его продукты повреждают зрительный нерв."
  present:
    - ru: "Диски зрительных нервов гиперемированы, границы размыты, вены расширены"
  absent:
    - ru: "Диски зрительных нервов бледно-розовые, границы чёткие"
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.5.1: при средней степени на глазном дне — гиперемия и размытость границ дисков зрительных нервов, расширение вен и кровоизлияния, при лёгкой глазное дно нормальное; раздел 1.2: метанол способствует демиелинизации и атрофии зрительного нерва; фон — игровая оценка" }
review: draft
