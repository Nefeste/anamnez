id: sign.nihss
name: { ru: "NIHSS от 1 до 5 баллов" }
# тяжесть инсульта — число неврологического осмотра (spec 2026-10-chapter-3, часть 41а): балл из
# диапазона тяжести, как тонометр показывает давление; 0 — дефицита нет (814_1, приложение Г1). Есть —
# 1–5 баллов; 6 и больше — порог на том же числе (`sign.nihss_high`). Строки «нет» нет: без очагового
# дефицита — при травме головы — осмотр о шкале инсульта не пишет. С частью 44а баллы бывают и при гипогликемии с
# дизартрией — «маска» инсульта
leak: { pct: 0 }
value:
  unit: "баллов"
  ref: [0, 0]
  present: [1, 5]
  absent: [0, 0]
  decimals: 0
texts:
  hint:
    ru: "NIHSS складывает баллы неврологического осмотра от 0 до 42: сознание, взор, поля зрения, лицо, сила рук и ног, координация, чувствительность, речь. Меньше 5 — малый инсульт; 6 и больше с окклюзией в первые 6 часов — тромбэктомия."
  present:
    - ru: "По шкале инсульта NIH — {value}"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; приложение Г1: максимум 42 балла, отсутствие дефицита — 0; раздел 3.1.2.1.1: малый инсульт — NIHSS меньше 5; раздел 2.4: КТ-ангиография при NIHSS 6 и больше в первые 6 часов" }
review: draft
