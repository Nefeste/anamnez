name: { ru: "Отёки обеих ног" }
# застой по большому кругу (spec 2026-10-chapter-3, часть 43в): «двусторонние периферические отёки» (156_2, раздел
# 7.3.1); при ХСН отёки симметричны, на самых низких частях тела (раздел 1.6); чувствительность 53 %, специфичность
# 72 % (раздел 1.6). Фон — игровая оценка: отёки обеих ног бывают и при болезнях почек и вен
