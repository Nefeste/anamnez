texts:
  hint:
    ru: "Обе голени и стопы отёчны, после нажатия пальцем остаётся ямка. Отёк одной ноги — повод искать тромбоз; обеих — сердечную недостаточность, болезни почек и вен."
  present:
    - ru: "Голени и стопы отёчны с обеих сторон, после нажатия — ямка"
  absent:
    - ru: "Отёков ног нет"
