id: sign.speech_deficit
name: { ru: "Нарушение речи: афазия или дизартрия" }
# на осмотре (часть 41а): у болезней базы без инсульта его нет
leak: { pct: 0 }
texts:
  hint:
    ru: "Афазия — человек не находит слов или не понимает речь: очаг в доминантном полушарии. Дизартрия — речь невнятная, «смазанная»: страдают мышцы, которыми говорят. И то и другое внезапно — признак инсульта."
  present:
    - ru: "Речь нарушена: не находит слов, говорит невнятно"
  absent:
    - ru: "Речь не нарушена"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 1.6, табл. 5: моторная и сенсорная афазия, дизартрия; приложение Г1: речь и дизартрия в шкале NIHSS" }
review: draft
