id: sign.hyperpigmentation
name: { ru: "Потемнение кожи в складках и на слизистых" }
# гиперпигментация — признак первичной надпочечниковой недостаточности (spec 2026-10-chapter-4, часть 56а): «Повышенная
# секреция АКТГ … часто приводит к гиперпигментации кожи и слизистых» (524_3, раздел 1.6; табл. 3: складки кожи, слизистые,
# рубцы, соски, открытая солнцу кожа — «только при первичной надпочечниковой недостаточности»). Выражена она по-разному и бывает
# незаметна; фон — загар и смуглая кожа, игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "Кожа темнеет в складках ладоней, на локтях, рубцах, сосках и на слизистой рта, «загар» не сходит и зимой. Так бывает при болезни Аддисона: гипофиз выделяет много АКТГ, и кожа темнеет. Сравнить помогает цвет кожи брата или сестры."
  present:
    - ru: "Кожа тёмная в складках ладоней, на рубцах и на слизистой рта"
  absent:
    - ru: "Цвет кожи обычный"
sources:
  - { kind: guideline, title: "Первичная надпочечниковая недостаточность", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/524_3", note: "ID 524_3, опубликованы 22.04.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: гиперпигментация кожи и слизистых от повышенной секреции АКТГ, выражена в различной степени, бывает незаметна; табл. 3 — только при первичной надпочечниковой недостаточности; фон — игровая оценка" }
review: draft
