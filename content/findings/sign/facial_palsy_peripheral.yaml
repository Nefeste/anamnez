id: sign.facial_palsy_peripheral
name: { ru: "Периферический парез лица" }
# на осмотре (spec 2026-10-chapter-3, часть 44б): слаба вся половина лица — и лоб, и глаз, и рот. При инсульте
# лоб морщится с обеих сторон (`sign.facial_weakness`): «слабость только нижней группы мимических мышц половины
# лица может говорить о центральном уровне поражения» (895_1, раздел 1.6)
leak: { pct: 0 }
attrs:
  side:
    right: { ru: "справа" }
    left: { ru: "слева" }
texts:
  hint:
    ru: "Лицевой нерв ведёт ко всем мышцам своей половины лица, поэтому при его поражении не двигается и лоб: бровь не поднимается, лоб не морщится. При инсульте лоб морщится с обеих сторон. Проверка простая — попросить поднять брови."
  present:
    - ru: "Слаба вся половина лица {side}, и лоб: бровь поднимается хуже или совсем не поднимается, угол рта опущен"
  absent:
    - ru: "Лоб морщится с обеих сторон"
sources:
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 1.1: асимметрия лица за счёт односторонней слабости мимических мышц; раздел 1.6: слабость только нижней группы мышц — признак центрального поражения; раздел 2.2, табл. 11: проба «Поднимите брови вверх»; точность осмотра — игровая оценка" }
review: draft
