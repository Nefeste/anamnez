id: sign.hoarse_voice
name: { ru: "Осиплость голоса" }
# голос при обезвоживании (spec 2026-10-chapter-4, часть 49а): при I–II степени сохранён, при III — осиплость, при IV — афония
# (875_1, приложение А3.1); звонкость голоса врач оценивает при расспросе (раздел 2.1). Фон — игровая оценка
leak: { pct: 2 }
texts:
  hint:
    ru: "Голос сиплый, а при очень тяжёлом обезвоживании пропадает совсем: голосовые связки пересыхают. Признак тяжёлого обезвоживания — III степени и тяжелее."
  present:
    - ru: "Голос сиплый, говорит тихо"
  absent:
    - ru: "Голос звонкий"
sources:
  - { kind: guideline, title: "Острые кишечные инфекции (ОКИ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/875_1", note: "ID 875_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.1: оценить звонкость голоса; приложение А3.1: голос по степеням обезвоживания — сохранён, сохранён, осиплость, афония" }
