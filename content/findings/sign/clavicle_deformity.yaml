id: sign.clavicle_deformity
name: { ru: "Деформация ключицы: отломки смещаются на ощупь" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Ключица на вид неровная, под пальцами отломок пружинит, как клавиша, надплечье опущено. Признак перелома со смещением."
  present:
    - ru: "Деформация ключицы, пальпаторно определяется смещение отломков, симптом «клавиши»"
  absent:
    - ru: "Контур ключицы ровный, смещения отломков на ощупь нет"
sources:
  - { kind: guideline, title: "Переломы ключицы и лопатки", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/853_1", note: "ID 853_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: деформация в области ключицы за счёт смещения отломков, пальпаторно определяемое смещение отломков, симптом «клавиши»; частоты не даны" }
review: draft
