id: sign.knee_flexion_limited
name: { ru: "Колено не сгибается до прямого угла" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Согнуть колено до 90° не получается — мешают боль или кровь в суставе. Признак оттавских правил для колена: с ним нужен снимок."
  present:
    - ru: "Сгибание в коленном суставе меньше 90°"
  absent:
    - ru: "Сгибает колено больше чем до 90°"
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4 (УУР B, УДД 3): неспособность сгибания в коленном суставе до 90° — один из пяти оттавских критериев" }
