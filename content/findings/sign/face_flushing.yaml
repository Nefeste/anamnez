id: sign.face_flushing
name: { ru: "Лицо и шея красные" }
# гиперемия кожи лица, шеи и верхней половины туловища (spec 2026-10-chapter-4, часть 52б): в лихорадочном периоде ГЛПС —
# «выраженная» (347_2, раздел 1.6; раздел 2.2, УУР C, УДД 5); бывает и при гриппе (приложение А3, дифференциальная диагностика).
# Фон — игровая оценка
leak: { pct: 2 }
texts:
  hint:
    ru: "Лицо, шея и верх груди красные, как после бани. При высокой температуре вместе с красными глазами — довод за геморрагическую лихорадку с почечным синдромом; так же краснеет лицо и при гриппе."
  present:
    - ru: "Лицо, шея и верхняя часть груди гиперемированы"
  absent:
    - ru: "Лицо обычного цвета"
sources:
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: в лихорадочном периоде — выраженная гиперемия кожи лица, шеи, верхней половины туловища; раздел 2.2 (УУР C, УДД 5): общий осмотр кожи и слизистых; приложение А3: гиперемия лица — общий признак ГЛПС и гриппа; фон — игровая оценка" }
review: draft
