id: sign.erythema_migrans
name: { ru: "Мигрирующая эритема" }
# патогномоничный признак болезни Лайма (spec 2026-10-chapter-4, часть 51а; 566_2, раздел 1.6): диагноз по нему не требует
# серологического подтверждения
leak: never
texts:
  hint:
    ru: "Ярко-розовое пятно на месте укуса клеща, от 2 до 70 см, в среднем 15–20, чаще с бледным центром — кольцо; растёт, без лечения проходит за 2–4 недели. Это болезнь Лайма: анализы для диагноза не нужны."
  present:
    - ru: "Ярко-розовое кольцо с бледным центром на месте укуса — мигрирующая эритема"
  absent:
    - ru: "Кольцевидной эритемы на коже нет"
sources:
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: патогномоничный симптом, который не требует серологического подтверждения; равномерно насыщенное пятно ярко-розового цвета с просветлением в центре, от 2 до 70 см, в среднем 15–20; регрессирует в среднем до 2–4 недель" }
review: draft
