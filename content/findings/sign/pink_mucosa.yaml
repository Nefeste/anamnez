id: sign.pink_mucosa
name: { ru: "Ярко-розовые слизистые и мочки ушей" }
# «патогномоничного признака отравления монооксидом углерода»: «розовое окрашивание видимых слизистых полости рта, крыльев носа и
# мочек уха» (spec 2026-10-chapter-4, часть 57б; 885_1, раздел 2.2, комментарий); частоты в 885_1 нет — полоса у болезни игровая.
# Фона почти нет
leak: { pct: 0.2 }
texts:
  hint:
    ru: "Слизистые рта, крылья носа и мочки ушей ярко-розовые: гемоглобин связан с угарным газом и не отдаёт кислород. Признак отравления угарным газом, но бывает не у каждого — отсутствие розового цвета отравления не исключает."
  present:
    - ru: "Слизистые рта, крылья носа и мочки ушей ярко-розовые"
  absent:
    - ru: "Слизистые обычного цвета"
sources:
  - { kind: guideline, title: "Токсическое действие окиси углерода. Токсическое действие других газов, дымов и паров", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/885_1", note: "ID 885_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 2.2, комментарий: патогномоничный признак — розовое окрашивание видимых слизистых полости рта, крыльев носа и мочек уха; частоты нет — игровая оценка" }
review: draft
