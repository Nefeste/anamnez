id: sign.pulse_irregular
name: { ru: "Пульс неритмичный" }
# при фибрилляции предсердий интервалы между ударами абсолютно нерегулярны (spec 2026-10-chapter-3, часть
# 42а; 382_2, раздел 2); у здоровых — единичные лишние удары: доля утечки — игровая оценка
leak: { pct: 1 }
texts:
  hint:
    ru: "Удары следуют через разные промежутки, пульс на запястье «сбивается». Так бывает при фибрилляции предсердий; пульс считают за целую минуту, а ритм подтверждает ЭКГ."
  present:
    - ru: "Пульс неритмичный, разного наполнения"
  absent:
    - ru: "Пульс ритмичный"
sources:
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 2.2: пальпаторное определение пульса в покое — для выявления бессимптомного пароксизма ФП/ТП; раздел 2: абсолютно нерегулярные интервалы RR; доля утечки — игровая оценка" }
review: draft
