id: sign.knee_effusion
name: { ru: "Выпот в колене: надколенник баллотирует" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Надколенник «плавает» и пружинит под пальцем: в полости сустава жидкость. После травмы это обычно кровь — гемартроз, при разрыве крестообразной связки и переломе."
  present:
    - ru: "Баллотирование надколенника — выпот в коленном суставе"
  absent:
    - ru: "Баллотирования надколенника нет"
sources:
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: резкое ограничение движений, гемартроз или выпот в суставе" }
  - { kind: guideline, title: "Переломы надколенника", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/970_1", note: "ID 970_1, опубликованы 25.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: увеличение объёма сустава, баллотирование надколенника" }
review: draft
