id: sign.herpes_labialis
name: { ru: "Герпетические пузырьки на губах" }
# кожные проявления простого герпеса (spec 2026-10-chapter-4, часть 50б): при поражении нервной системы «в 1/3 случаев…
# кожных герпетических проявлений не отмечается» (492_2, раздел 1.6) — у остальных они есть. Простой герпес губ бывает и
# у здоровых: фон — игровая оценка
leak: { pct: 2 }
texts:
  hint:
    ru: "Группа мелких пузырьков на губах или коже лица на покрасневшем основании — простой герпес. Сам по себе он не опасен, но при лихорадке со спутанностью и судорогами напоминает о герпетическом энцефалите; у трети таких больных пузырьков нет."
  present:
    - ru: "На губах — группа пузырьков на покрасневшей коже"
  absent:
    - ru: "Пузырьков на губах и лице нет"
sources:
  - { kind: guideline, title: "Простой герпес (ПГ) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/492_2", note: "ID 492_2, опубликованы 27.10.2025, применяются; сверено с рубрикатором 06.10.2026; раздел 1.6: в 1/3 случаев при поражении ЦНС кожных герпетических проявлений не отмечается; раздел 2.2: осмотр кожи и слизистых; доля у здоровых — игровая оценка" }
review: draft
