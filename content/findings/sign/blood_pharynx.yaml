id: sign.blood_pharynx
name: { ru: "Кровь стекает по задней стенке глотки" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Кровь стекает в горло, даже когда крылья носа прижаты. Значит, кровит сзади — такое кровотечение останавливают в стационаре."
  present:
    - ru: "По задней стенке глотки стекает кровь"
  absent:
    - ru: "Крови на задней стенке глотки нет"
sources:
  - { kind: guideline, title: "Носовое кровотечение", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/977_1", note: "ID 977_1, опубликованы 08.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: при заднем кровотечении кровь стекает в носоглотку; раздел 3.1.2: стекание при прижатых крыльях носа — задний источник; фарингоскопия — раздел 2" }
