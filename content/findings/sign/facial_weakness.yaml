id: sign.facial_weakness
name: { ru: "Центральный парез лица" }
# на осмотре (часть 41а): при инсульте страдает нижняя половина лица, лоб морщится — в отличие от
# невропатии лицевого нерва (часть 44)
leak: { pct: 0 }
attrs:
  side:
    right: { ru: "справа" }
    left: { ru: "слева" }
texts:
  hint:
    ru: "При инсульте опускается угол рта и сглаживается носогубная складка, а лоб морщится с обеих сторон: верхнюю половину лица снабжают оба полушария. Не морщится и лоб — это уже невропатия лицевого нерва."
  present:
    - ru: "Угол рта {side} опущен, носогубная складка сглажена; лоб морщится с обеих сторон"
  absent:
    - ru: "Лицо симметрично"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; приложение Г1: парез лицевой мускулатуры в шкале NIHSS — центральный (нижняя часть лица) и периферический (вся половина лица)" }
review: draft
