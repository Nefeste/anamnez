id: sign.hemiparesis
name: { ru: "Гемипарез" }
# слабость руки и ноги одной стороны на осмотре (часть 41а): у болезней базы без инсульта её нет
leak: { pct: 0 }
attrs:
  side:
    right: { ru: "справа" }
    left: { ru: "слева" }
texts:
  hint:
    ru: "Гемипарез — слабость руки и ноги одной стороны: вытянутая рука опускается, нога не держится на весу. При инсульте он на стороне, противоположной очагу в мозге."
  present:
    - ru: "Сила в руке и ноге {side} снижена: гемипарез"
  absent:
    - ru: "Сила в руках и ногах одинаковая, парезов нет"
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 1.6, табл. 5: контралатеральный гемипарез; приложение Г1: двигательные функции рук и ног в шкале NIHSS" }
review: draft
