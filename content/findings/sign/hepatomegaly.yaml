id: sign.hepatomegaly
name: { ru: "Печень увеличена" }
# гепатомегалия при гепатитах (spec 2026-10-chapter-4, часть 52а): «увеличение, уплотнение и повышение чувствительности края
# печени» (718_2, раздел 1.6); при средней тяжести — на 3–4 см, при тяжёлой — на 4–6 см, при прогрессировании резко
# уменьшается (приложение А3). Бывает и без гепатита — у пьющих, при сердечной недостаточности: фон игровая оценка
leak: { pct: 2 }
texts:
  hint:
    ru: "Край печени выходит из-под рёбер справа, плотный и чувствительный. При остром гепатите печень увеличена почти у всех; если она вдруг уменьшается на фоне тяжёлой желтухи — гибнет ткань печени, это плохой признак."
  present:
    - ru: "Печень выступает из-под рёбер на 3–4 см, край чувствительный"
  absent:
    - ru: "Печень не выступает из-под рёбер"
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: увеличение, уплотнение и повышение чувствительности печени; приложение А3: печень в норме или до 3 см при лёгкой форме, на 3–4 см — при средней, на 4–6 см — при тяжёлой, резкое уменьшение на фоне прогрессирования; раздел 2.2: пальпация печени и селезёнки (УУР C, УДД 5); доля фона — игровая оценка" }
review: draft
