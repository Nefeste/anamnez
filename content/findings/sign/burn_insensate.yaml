id: sign.burn_insensate
name: { ru: "Ожог не чувствует боли" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Укол иглой по ожогу не чувствуется, волоски выдёргиваются легко и безболезненно, белое пятно при нажатии не образуется: нервные окончания и сосуды кожи погибли. Это глубокий ожог III степени — сам он не заживёт."
  present:
    - ru: "Укол иглой не чувствует, волоски удаляются безболезненно, белое пятно при нажатии не образуется"
  absent:
    - ru: "Укол иглой чувствует, белое пятно при нажатии заполняется кровью"
sources:
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей.", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 2.2: при III степени сосудистая реакция и болевая чувствительность отсутствуют, волоски легко удаляются; белое пятно, заполняющееся кровью, — признак II степени, не образуется — глубокого поражения; лёгкое безболезненное удаление волос и отсутствие боли при уколе струпа иглой — убедительные признаки глубокого ожога; глубину окончательно определяют через 7–10 дней" }
review: draft
