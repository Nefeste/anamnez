# при нарушении дыхания — «цианоз губ, лица, акроцианоз» (spec 2026-10-chapter-4, часть 57а; 743_2, раздел 2.2). Фон — болезни сердца и
# лёгких, игровая оценка
leak: { pct: 0.5 }
texts:
  hint:
    ru: "Губы, лицо и кончики пальцев синеватые: крови не хватает кислорода. Бывает при остановке или резком урежении дыхания, при тяжёлой болезни лёгких и сердца."
  present:
    - ru: "Губы и лицо синюшные"
  absent:
    - ru: "Цвет губ и лица обычный"
sources:
