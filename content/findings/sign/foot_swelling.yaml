id: sign.foot_swelling
name: { ru: "Отёк и кровоподтёк стопы" }
leak: { pct: 0 }
texts:
  hint:
    ru: "Стопа припухла, на ней синяк. Бывает и при ушибе, и при переломе: сам по себе отёк их не различает."
  present:
    - ru: "Отёк и кровоподтёк в среднем отделе стопы"
  absent:
    - ru: "Отёка и кровоподтёка на стопе нет"
sources:
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: при переломах плюсневых костей — гематома и отёк в области перелома; частоты не даны" }
review: draft
