id: sign.crackles_local
name: { ru: "Локальная крепитация" }
leak: { pct: 2 }
attrs:
  side:
    right: { ru: "справа" }
    left: { ru: "слева" }
    both: { ru: "с обеих сторон" }
texts:
  hint:
    ru: "Крепитация — тихий треск на вдохе, как шорох волос у самого уха. Слышна, когда в альвеолах жидкость; на одном участке — довод за пневмонию."
  present:
    - ru: "В нижних отделах {side} — крепитация"
  absent:
    - ru: "Крепитации нет"
review: draft
