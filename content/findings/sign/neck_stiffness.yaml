id: sign.neck_stiffness
name: { ru: "Ригидность затылочных мышц" }
# менингеальный синдром (spec 2026-10-chapter-3, часть 41в): кровь раздражает оболочки мозга — боль в шее и
# её ригидность при САК, при внутримозговом кровоизлиянии — позже (523_3, раздел 1.6); с частью 50а (spec
# 2026-10-chapter-4) — и воспаление: менингококковый менингит (1020_1, раздел 2.2). У остальных болезней базы её
# нет; точность осмотра — у обследования
leak: { pct: 0 }
texts:
  hint:
    ru: "Подбородок не достаёт до груди: мышцы затылка напряжены — оболочки мозга раздражены кровью или воспалением. Признак кровоизлияния под оболочки мозга и менингита; при мигрени и головной боли напряжения его нет."
  present:
    - ru: "Ригидность затылочных мышц: подбородок не достаёт до груди"
  absent:
    - ru: "Ригидности затылочных мышц нет"
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 1.6: при САК по мере распространения крови до уровня спинного мозга — боль в шее и её ригидность; при ВМГ менингизм в первые часы — светобоязнь, затем ригидность мышц затылка, симптомы Кернига и Брудзинского, у пожилых в трети случаев не выявляется" }
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 2.2: ригидность мышц затылка, симптомы Брудзинского и Кернига — в конце 1-х или на 2-е сутки, в первые часы могут быть отрицательными, максимум — на 2–3-и сутки" }
review: draft
