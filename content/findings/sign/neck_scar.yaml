id: sign.neck_scar
name: { ru: "Рубец после операции на шее" }
# осмотр передней поверхности шеи — для оценки «факта проведения хирургического вмешательства на органах шеи» (spec
# 2026-10-chapter-4, часть 56в; 627_3, раздел 2.2, УУР С, УДД 5). Рубец, которого нет, не видят. Фон — давние операции на
# щитовидной железе, игровая оценка
leak: { pct: 0.5 }
texts:
  hint:
    ru: "Поперечный шов или рубец на шее спереди, над ключицами: так оперируют щитовидную железу. Свежий шов у больного с покалыванием вокруг рта и судорогами кистей — подсказка: на операции могли задеть околощитовидные железы."
  present:
    - ru: "На шее спереди — поперечный послеоперационный рубец"
  absent:
    - ru: "Рубцов на шее нет"
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2.2 (УУР С, УДД 5): осмотр передней поверхности шеи — оценить факт хирургического вмешательства на органах шеи; фон — игровая оценка" }
review: draft
