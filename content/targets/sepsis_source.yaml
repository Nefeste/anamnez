id: target.sepsis_source
name: { ru: "Контроль источника при сепсисе" }
# кому: у кого qSOFA дал 2 балла и больше и УЗИ нашло воспаление желчного пузыря (spec 2026-10-chapter-4, часть 48б);
# что — холецистостомия, назначение; отсчёт — от предположения сепсиса, как у антибиотика (898_1, раздел 3.1: контроль
# источника «в течение до 12 часов», УДД 2, УУР А)
from: rule
rule: rule.qsofa
findings: [img.us_cholecystitis]
treatments: [tx.cholecystostomy]
minutes: 720
texts:
  from: { ru: "от того, как qSOFA дал 2 балла" }
  after: { ru: "после того, как qSOFA дал 2 балла" }
  hint: { ru: "Очаг, который можно убрать, — гнойный желчный пузырь, абсцесс, перфорацию — убирают в первые 12 часов от того, как сепсис можно предположить: позже выживаемость ниже." }
sources:
  - { kind: guideline, title: "Сепсис (у взрослых)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/898_1", note: "ID 898_1, опубликованы 27.12.2024, применяются; раздел 3.1: контроль источника — «в течение до 12 часов, поскольку за пределами этого срока обычно демонстрируется снижение выживаемости» (УДД 2, УУР А); отсчёт от предположения сепсиса — qSOFA 2 и больше при очаге (раздел 2.2), игровое правило" }
review: draft
