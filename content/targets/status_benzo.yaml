id: target.status_benzo
name: { ru: "Противосудорожное при эпилептическом статусе" }
# кому: лежащим в смотровой приёмного, кого привезли с непрекращающимися судорогами (spec 2026-10-chapter-3, часть
# 44в); что: бензодиазепин — назначение; за 5 минут от поступления. У тонико-клонического статуса время начала
# лечения t1 — 5 минут от начала приступа (741_1, раздел 1.1.2), к поступлению оно уже прошло: лечат сразу; сам
# срок от поступления — игровое правило по t1
complaints: [sym.seizure_ongoing]
room: room.emergency
treatments: [tx.benzodiazepine]
minutes: 5
texts:
  hint: { ru: "При эпилептическом статусе противосудорожное начинают с 5-й минуты приступа, а к приезду в больницу эти минуты уже прошли: бензодиазепин — в первые 5 минут от поступления. Чем дольше длится статус, тем сильнее страдает мозг." }
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 1.1.2: тонико-клонический эпилептический статус — t1 (время начала лечения) 5 минут, t2 (начало долгосрочных повреждений) 30 минут; блок «Оказание медицинской помощи пациенту с эпилептическим статусом»: первая очередь — диазепам в/в или мидазолам в/м; срок от поступления — игровое правило" }
review: draft
