id: target.ecg_chest_pain
name: { ru: "ЭКГ при боли в груди" }
# кому: давящая боль в груди при поступлении — подозрение на острый коронарный синдром; срок —
# лежащим в смотровой приёмного: там монитор и ЭКГ у постели за 5 минут. В кабинете ЭКГ с очередью
# и описанием — не меньше 22 минут, в 10 там не успеть (spec 2026-10-chapter-3, «Что изменилось»). С частью
# 39г — и боль при нагрузке: впервые возникшая и утяжелившаяся стенокардия — тоже ОКС (154_4, раздел 1.5),
# а отличить её от стабильной — расспросом, после ЭКГ. С частью 43а — и внезапная рвущая боль в груди или спине:
# алгоритм при острой боли в груди начинается с ЭКГ — нет ли инфаркта с подъёмом ST (946_1, приложение Б)
complaints: [sym.chest_pain_pressing, sym.chest_pain_exertion, sym.tearing_pain]
room: room.emergency
exams: [exam.ecg]
minutes: 10
texts:
  hint: { ru: "При подозрении на острый коронарный синдром ЭКГ снимают и читают в первые 10 минут от первого контакта с медиком: по ней решают, есть ли подъём ST — тромболизис и перевод — или нет." }
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.4 (ЕОК IB, УУР С, УДД 5): ЭКГ в течение 10 минут от первичного медицинского контакта; приложение Б2: от контакта до диагноза — не больше 10 минут, это время на регистрацию и интерпретацию ЭКГ" }
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.4: ЭКГ в течение 10 минут от первичного медицинского контакта" }
  - { kind: guideline, title: "Расслоение аорты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/946_1", note: "ID 946_1, опубликованы 23.09.2025, применяются; сверено с рубрикатором 05.10.2026; приложение Б: при острой боли в груди — анамнез, клиническое обследование и ЭКГ (инфаркт с подъёмом ST), затем оценка гемодинамики" }
review: draft
