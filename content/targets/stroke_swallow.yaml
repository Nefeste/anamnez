id: target.stroke_swallow
name: { ru: "Тест глотания при инсульте" }
# кому: признаки инсульта, и только остающимся у нас (часть 41а): переведённому тест делают там, куда
# везут; что: тест глотания; за 3 часа от поступления — до первой еды и таблеток
complaints: [sym.weakness_one_side, sym.speech_trouble, sym.face_droop]
# кроме тех, у кого невролог нашёл периферический парез лица (часть 44б): это невропатия лицевого нерва, не
# инсульт — «при типичной клинической картине… в экстренном порядке нецелесообразно» (895_1, раздел 2.4)
except: [sign.facial_palsy_peripheral]
exams: [exam.swallow_test]
stays: true
minutes: 180
texts:
  hint: { ru: "При инсульте глотание проверяют в первые 3 часа пребывания в больнице, до первой еды и таблеток: при дисфагии ставят зонд, и аспирационных пневмоний становится меньше." }
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.2: тест до приёма пищи и таблеток в первые 3 часа; критерий качества 2: трёхглотковая проба с пульсоксиметром в первые 3 часа пребывания в стационаре" }
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 2.4: при типичной клинической картине невропатии лицевого нерва КТ и МРТ в экстренном порядке нецелесообразны; при нетипичной, в том числе при подозрении на ОНМК, — экстренно" }
review: draft
