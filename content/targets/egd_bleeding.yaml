id: target.egd_bleeding
name: { ru: "ЭГДС при кровотечении из верхних отделов ЖКТ" }
# кому: рвота кровью или «кофейной гущей», чёрный стул (spec 2026-10-chapter-4, часть 53а); что: ЭГДС; за 2 часа от
# поступления — «в течение 2 часов от момента госпитализации пациента» (277_2, раздел 2.4; 1026_1, раздел 2.4). Срок — там,
# где ЭГДС можно сделать: без эндоскопического кабинета больного переводят
complaints: [sym.hematemesis, sym.melena]
exams: [exam.egd]
minutes: 120
texts:
  hint: { ru: "При рвоте кровью и чёрном стуле ЭГДС — в первые 2 часа от поступления: она находит источник, и кровотечение тут же останавливают через эндоскоп." }
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4 (УУР C, УДД 5): ЭГДС в течение 2 часов от госпитализации; раздел 3.3: эндоскопический гемостаз — в те же 2 часа" }
  - { kind: guideline, title: "Синдром Мэллори-Вейсса (желудочно-пищеводный разрывно-геморрагический синдром)", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1026_1", note: "ID 1026_1, опубликованы 02.02.2026, применяются; сверено с рубрикатором 11.10.2026; раздел 2.4: ЭГДС в течение 2 часов от госпитализации; критерий качества 2" }
