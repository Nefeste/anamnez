id: target.adrenal_saline
name: { ru: "Раствор при надпочечниковом кризе" }
# кому: лежащим в смотровой приёмного, у кого известна надпочечниковая недостаточность (spec 2026-10-chapter-4, часть 56а); что —
# 0,9 % натрия хлорид в вену, назначение; в первый час от поступления: «внутривенное введение 0,9%-го раствора натрия хлорида …
# в течение первого часа» (524_3, табл. 6, аддисонический криз). Гидрокортизону часов в 524_3 нет — только «незамедлительно»:
# срока у него нет
findings: [hx.adrenal_insufficiency]
room: room.emergency
treatments: [tx.iv_fluids]
minutes: 60
texts:
  hint: { ru: "При надпочечниковом кризе солевой раствор в вену — в первый час от поступления, вместе с гидрокортизоном. Без жидкости давление не поднимется." }
sources:
  - { kind: guideline, title: "Первичная надпочечниковая недостаточность", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/524_3", note: "ID 524_3, опубликованы 22.04.2025, применяются; сверено с рубрикатором 11.10.2026; табл. 6, аддисонический криз: внутривенно 0,9 % натрия хлорид в течение первого часа, дальше — по необходимости, контроль гемодинамики; раздел 3: гидрокортизон — незамедлительно, без часов; кому срок — известная надпочечниковая недостаточность, игровое правило" }
