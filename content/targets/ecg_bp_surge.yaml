id: target.ecg_bp_surge
name: { ru: "ЭКГ при резком подъёме давления" }
# кому: жалоба на резкий подъём давления при поступлении или давление 180/110 и выше, которое намерили (spec
# 2026-10-chapter-3, часть 43г; в смотровой — фельдшер скорой или медсестра на сортировке) — криз ещё надо отличить
# от подъёма без поражения органов, и ЭКГ ищет поражение сердца; лежащим в смотровой приёмного: там монитор и ЭКГ у
# постели. За 15 минут от поступления (62_3, раздел 3.7)
complaints: [sym.bp_surge]
findings: [vital.bp_very_high]
room: room.emergency
exams: [exam.ecg]
minutes: 15
texts:
  hint: { ru: "При гипертоническом кризе ЭКГ снимают не позднее 15 минут от поступления: ищут поражение сердца — ишемию, перегрузку. Резкий подъём давления — повод проверить, криз ли это." }
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7 (УУР C, УДД 5): ЭКГ всем с ГК не позднее 15 минут от поступления в стационар для выявления ПОМ; кому — по жалобе на резкий подъём АД или давлению 180/110 и выше, игровое правило" }
review: draft
