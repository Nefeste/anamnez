id: target.stroke_ct
name: { ru: "КТ при подозрении на инсульт" }
# кому: признаки инсульта (часть 41а); что: КТ головы или КТ-ангиография — с заключением; за 40 минут от
# поступления: КТ исключает кровь — без неё тромболизис не решить
complaints: [sym.weakness_one_side, sym.speech_trouble, sym.face_droop]
exams: [exam.ct_head, exam.cta_head]
minutes: 40
texts:
  hint: { ru: "При подозрении на инсульт КТ головы с заключением — в первые 40 минут от поступления: она исключает кровоизлияние, абсолютное противопоказание к тромболизису." }
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.4 (УУР A, УДД 1): бесконтрастная КТ или МРТ с заключением в течение 40 минут от поступления; критерий качества 3" }
review: draft
