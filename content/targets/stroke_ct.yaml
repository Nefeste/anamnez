id: target.stroke_ct
name: { ru: "КТ при подозрении на инсульт" }
# кому: признаки инсульта (часть 41а), с частью 41б — и прошедшие: всем с признаками ОНМК (814_1, раздел
# 2.4); что: КТ головы или КТ-ангиография — с заключением; за 40 минут от поступления: КТ исключает кровь
# — без неё тромболизис не решить. С частью 41в — и внезапная сильнейшая головная боль, и всем, у кого КТ
# показала кровь: «всем пациентам с геморрагическим инсультом» (523_3, раздел 2.4, критерий качества 1)
complaints: [sym.weakness_one_side, sym.speech_trouble, sym.face_droop, sym.transient_weakness, sym.transient_speech, sym.thunderclap]
findings: [img.ct_blood]
exams: [exam.ct_head, exam.cta_head]
minutes: 40
texts:
  hint: { ru: "При подозрении на инсульт КТ головы с заключением — в первые 40 минут от поступления: она исключает кровоизлияние, абсолютное противопоказание к тромболизису." }
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 2.4 (УУР B, УДД 2): КТ или МРТ не позднее 40 минут от поступления всем с геморрагическим инсультом; критерий качества 1" }
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.4 (УУР A, УДД 1): бесконтрастная КТ или МРТ с заключением в течение 40 минут от поступления; критерий качества 3" }
review: draft
