id: target.stroke_exam
name: { ru: "Осмотр при подозрении на инсульт" }
# кому: внезапная слабость, нарушение речи или перекошенное лицо (spec 2026-10-chapter-3, часть 41а), с
# частью 41б — и прошедшие: всем с предположительным диагнозом ОНМК (814_1, раздел 2.2); что:
# неврологический осмотр с NIHSS и шкалой комы Глазго; за 10 минут от поступления
complaints: [sym.weakness_one_side, sym.speech_trouble, sym.face_droop, sym.transient_weakness, sym.transient_speech]
exams: [exam.neuro_exam]
minutes: 10
texts:
  hint: { ru: "При подозрении на инсульт невролог осматривает больного в первые 10 минут от поступления: тяжесть по шкале инсульта NIH и сознание по шкале комы Глазго." }
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.2: осмотр невролога не позднее 10 минут от поступления; критерий качества 1: осмотр с оценкой по шкале NIH и шкале комы Глазго не позднее 10 минут" }
review: draft
