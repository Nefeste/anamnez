id: target.transfer_stemi
name: { ru: "Перевод при подъёме ST" }
# кому: лежащим в смотровой приёмного, у кого ЭКГ показала подъём ST и кого перевели (spec
# 2026-10-chapter-3, часть 39б); что — решение «Вызвать скорую» или «Перевести»; отсчёт — от прихода
# в больницу, где вмешательства на артериях сердца не делают
findings: [ecg.st_elevation]
room: room.emergency
settings: [ambulance, transfer]
minutes: 30
texts:
  hint: { ru: "Больницу, где вмешательства на артериях сердца не делают, больной с подъёмом ST покидает в первые 30 минут от поступления: тромболизис — здесь, остальное — в сосудистом центре." }
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; приложение Б2: время от госпитализации в не ЧКВ-центр до начала транспортировки в ЧКВ-центр не должно превышать 30 минут; после тромболизиса — перевод в максимально ранние сроки" }
review: draft
