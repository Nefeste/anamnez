id: target.meningococcal_abx
name: { ru: "Антибиотик при менингококковой инфекции" }
# кому: лежащим в смотровой приёмного, у кого нашли геморрагическую сыпь или гнойный ликвор (spec 2026-10-chapter-4, часть
# 50а); что — антибиотик в вену, назначение; не позднее 1 часа «после поступления и постановки диагноза» (1020_1, раздел
# 3.1.1) — отсчёт от находки, по которой ставят диагноз: лихорадка с геморрагической сыпью — менингококковая инфекция,
# пока не доказано иное (игровое правило)
findings: [sign.petechial_rash, sign.rash_spreading, lab.csf_purulent]
from: finding
room: room.emergency
treatments: [tx.antibiotic_iv]
minutes: 60
texts:
  from: { ru: "от геморрагической сыпи или гнойного ликвора" }
  after: { ru: "после геморрагической сыпи или гнойного ликвора" }
  hint: { ru: "При менингококковой инфекции антибиотик в вену — не позже часа от поступления и диагноза: каждый час промедления повышает риск смерти, при шоке — сильнее. Кровь на посев берут до него, а ликвор и анализы его не задерживают." }
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.1 (УУР В, УДД 3): внутривенное введение антибиотиков не позднее 1 часа после поступления и постановки диагноза; каждый час задержки увеличивал шанс летального исхода в 1,04 раза, при ИТШ — в 1,14 раза; отсчёт от находки — игровое правило" }
review: draft
