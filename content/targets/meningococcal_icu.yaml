id: target.meningococcal_icu
name: { ru: "Реанимация при нарастающей сыпи" }
# кому: лежащим в смотровой приёмного, у кого сыпь нарастает и сливается (spec 2026-10-chapter-4, часть 50а): раннее
# появление геморрагической сыпи, быстрое прогрессирование, локализация на груди, шее, лице — показание к ОРИТ «в течение 30
# минут» (1020_1, раздел 6.1). Что — место: ПИТ или реанимация; нет своих — перевод
findings: [sign.rash_spreading]
from: finding
room: room.emergency
settings: [icu, ricu, ambulance, transfer]
minutes: 30
texts:
  from: { ru: "от нарастающей сыпи" }
  after: { ru: "после нарастающей сыпи" }
  hint: { ru: "Сыпь нарастает и сливается, появляется на груди, шее и лице — тяжёлая менингококкемия: в реанимацию в первые 30 минут, без своей — перевод бригадой интенсивной терапии." }
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 6.1: показания к ОРИТ — нарушение сознания, цианоз, раннее появление (в первые 10 часов) геморрагической сыпи, быстрое прогрессирование и локализация на груди, шее, лице, одышка более 22, олигурия, нарушения свёртывания, ацидоз, тромбоцитопения менее 100 тыс./мкл и другие; абсолютное показание в течение 30 минут экстренной госпитализации в ОРИТ" }
review: draft
