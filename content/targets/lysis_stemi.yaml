id: target.lysis_stemi
name: { ru: "Тромболизис при подъёме ST" }
# кому: лежащим в смотровой приёмного, у кого ЭКГ показала подъём ST и кому тромболизис назначили
# (spec 2026-10-chapter-3, часть 39б). Не назначили — об этом строка «Не сделано до перевода»
# (часть 39а), а не второй штраф сроком. Отсчёт — от ЭКГ с подъёмом ST: по ней ставят диагноз
findings: [ecg.st_elevation]
from: finding
room: room.emergency
treatments: [tx.thrombolysis]
minutes: 10
texts:
  from: { ru: "от ЭКГ с подъёмом ST" }
  after: { ru: "после ЭКГ с подъёмом ST" }
  hint: { ru: "Если до вмешательства в сосудистом центре дальше 120 минут, тромболизис начинают в первые 10 минут от диагноза инфаркта с подъёмом ST — от ЭКГ — и сразу везут больного в центр." }
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.1.3 (ЕОК IA): тромболизис в пределах 10 минут от постановки диагноза, если первичное ЧКВ нельзя сделать за 120 минут и от начала не больше 12 часов; приложение Б2: от решения до введения тромболитика — не больше 10 минут" }
review: draft
