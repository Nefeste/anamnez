id: target.sepsis_abx
name: { ru: "Антибиотик при сепсисе" }
# кому: у кого qSOFA дал 2 балла и больше (spec 2026-10-chapter-4, часть 48а), без давления ниже 90 (у шока срок — час); что — антибиотик в вену,
# назначение; отсчёт — от предположения сепсиса (898_1, раздел 3.2), а не от прихода
from: rule
rule: rule.qsofa
except: [vital.bp_low]
treatments: [tx.antibiotic_iv]
minutes: 180
texts:
  from: { ru: "от того, как qSOFA дал 2 балла" }
  after: { ru: "после того, как qSOFA дал 2 балла" }
  hint: { ru: "При сепсисе без шока антибиотик широкого спектра в вену — в первые 3 часа от того, как сепсис можно предположить или установить. С низким давлением срок — час." }
sources:
  - { kind: guideline, title: "Сепсис (у взрослых)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/898_1", note: "ID 898_1, опубликованы 27.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.2: при установленном или предполагаемом септическом шоке — антимикробная терапия предпочтительно в течение 1 часа после установления или предположения сепсиса (УДД 2, УУР В); без шока — в течение 3 часов после того, как сепсис установлен или признан наиболее вероятным (УДД 4, УУР С); критерий качества 6; предположение — qSOFA 2 и больше при очаге (раздел 2.2), игровое правило" }
review: draft
