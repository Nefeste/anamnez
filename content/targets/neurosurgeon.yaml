id: target.neurosurgeon
name: { ru: "Консультация нейрохирурга при кровоизлиянии" }
# кому: у кого КТ показала кровь внутри черепа (spec 2026-10-chapter-3, часть 41в); что — консультация
# нейрохирурга, в том числе по телемедицине, в решении; срок — 60 минут от результата КТ (523_3, раздел 6,
# критерий качества 2). Не назначили — строка «Не назначено», а не второй штраф сроком
findings: [img.ct_blood]
from: finding
treatments: [tx.nsg_consult]
minutes: 60
texts:
  hint: { ru: "При крови на КТ нейрохирург смотрит снимки — по телемедицине или с выездной бригадой — в первые 60 минут после КТ и решает, нужна ли операция и куда переводить." }
  from: { ru: "от КТ с кровью" }
  after: { ru: "после КТ с кровью" }
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 2: осмотр нейрохирурга не позднее 60 минут от получения результатов КТ; раздел 6: консультация, в том числе с телемедицинскими технологиями, в течение 60 минут — решить о переводе в нейрохирургический стационар; критерий качества 2" }
review: draft
