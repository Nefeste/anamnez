id: target.paracentesis_ascites
name: { ru: "Диагностический парацентез при асците" }
# кому: у кого нашли асцит — на осмотре или на УЗИ (spec 2026-10-chapter-4, часть 54а): диагностический парацентез «пациентам
# с ЦП и впервые развившимся асцитом» и «с подозрением на инфицирование асцитической жидкости» (715_2, раздел 2.3, УУР B,
# УДД 2); ранний, в первые 12 ч от госпитализации, — госпитальная смертность ниже (ОР 0,69, там же). Отсчёт — от находки:
# жалоба «живот вырос» бывает и без асцита. Срок — там, где парацентез можно сделать: в амбулатории его нет
findings: [sign.ascites, img.us_ascites]
from: finding
exams: [exam.paracentesis]
minutes: 720
texts:
  from: { ru: "от асцита на осмотре или УЗИ" }
  after: { ru: "после асцита на осмотре или УЗИ" }
  hint: { ru: "Нашли асцит — диагностический парацентез в первые 12 часов: нейтрофилы в асцитической жидкости находят спонтанный бактериальный перитонит, который бывает почти без жалоб. Ранний парацентез снижает смертность в больнице." }
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2.3 (УУР B, УДД 2): диагностический парацентез при впервые возникшем асците и при подозрении на инфицирование асцитической жидкости; ранний (12 ч и меньше или сутки и меньше от госпитализации) — госпитальная смертность ниже (ОР 0,69), чем при отсроченном; критерий качества 4; отсчёт от находки — игровое правило" }
review: draft
