id: tx.liver_diet
name: { ru: "Щадящий режим и диета" }
kind: regimen
# базисная терапия острых гепатитов (spec 2026-10-chapter-4, часть 52а): «щадящий режим и диету» — всем независимо от тяжести
# (718_2, раздел 3.1.2, УУР C, УДД 5; 672_2, раздел 3.1.2, УУР С, УДД 4); исключают жареное, копчёное, маринованное,
# тугоплавкие жиры; «Категорически запрещается алкоголь в любых видах»; питьё — пероральная дезинтоксикация. Причину не
# лечит: гепатит A проходит сам. С частью 54б — при алкогольном гепатите: отказ от алкоголя — «единственный этиотропный вариант
# терапии» (711_2, раздел 3.1, УУР C, УДД 4), калорийный рацион «с высоким содержанием белка» (раздел 3.2, УУР С, УДД 5;
# критерий качества 7)
cost: 0
texts:
  hint:
    ru: "Покой, обильное питьё, еда без жареного, копчёного и жирного мяса, ни капли алкоголя и никаких лишних лекарств. Основа лечения острого гепатита: печень восстанавливается сама, а нагрузка ей вредит. При алкогольном — ещё и калорийная еда с большим количеством белка."
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3 и 3.1.2 (УУР C, УДД 5): гепатит A — самолимитирующая инфекция, бережная тактика, избегать неоправданного назначения лекарств; базисная терапия всем — щадящий режим и диета; исключают жареные, копчёные, маринованные блюда, тугоплавкие жиры; алкоголь запрещён; при лёгкой форме — пероральная дезинтоксикация" }
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.2 (УУР С, УДД 4): обязательная базисная терапия всем независимо от тяжести — щадящий режим и диета; алкоголь категорически запрещается" }
  - { kind: guideline, title: "Алкогольная болезнь печени", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/711_2", note: "ID 711_2, опубликованы 30.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1 (УУР C, УДД 4): отказ от алкоголя — единственный этиотропный вариант терапии АБП; раздел 3.2 (УУР С, УДД 5): калорийный рацион с высоким содержанием белка; критерий качества 7 — диетическое питание при заболеваниях печени" }
