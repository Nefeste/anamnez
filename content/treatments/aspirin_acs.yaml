id: tx.aspirin_acs
name: { ru: "Ацетилсалициловая кислота (разжевать)" }
kind: drug
class: antiplatelet.aspirin
route: oral
cost: 50
effects:
  - { on: cond.acs, kind: cure, band: sometimes, days: [3, 7] }
  # ТИА (spec 2026-10-chapter-3, часть 41б): вторичная профилактика снижает риск нового нарушения
  # мозгового кровообращения на 20–30 % (814_1, раздел 5.1) — игровая оценка: 30 %; два антиагреганта —
  # 51 %; помогло — инсульта за неделю нет
  - { on: cond.tia, kind: cure, band: { pct: 30 }, days: [1, 2] }
contraindications:
  - { id: risk.allergy_nsaid, level: absolute, reaction: often }
texts:
  hint:
    ru: "Разжёванная таблетка ацетилсалициловой кислоты при подозрении на инфаркт мешает тромбу расти и снижает смертность. Дают сразу, до приезда скорой, если нет аллергии на НПВС."
sources:
  - { kind: guideline, title: "2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J 2023;44(38):3720–3826" }
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 28.09.2026" }
review: draft
