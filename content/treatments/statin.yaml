# Статин (spec 2026-10-chapter-3, часть 39г): всем с ИБС, сразу после установления диагноза, независимо от
# уровня холестерина; цель — ХС ЛНП меньше 1,4 ммоль/л и снижение наполовину (155_2, раздел 3.1.2.2,
# ЕОК IA). На приступы за неделю не действует — снижает риск инфаркта на годы вперёд
id: tx.statin
name: { ru: "Статин" }
kind: drug
class: lipid.statin
route: oral
