id: tx.rigid_shoe
name: { ru: "Обувь с жёсткой подошвой" }
kind: procedure
class: immobilization.shoe
# обувь или ортез, ₽ — игровое число
cost: 500
effects:
  # плюсневые кости без смещения и с допустимым смещением — обувь с жёсткой подошвой,
  # ортопедическая обувь или гипс 4–6 недель (856_1, раздел 3.1); несращение без операции —
  # 2,7–3,8 % (Pettersen 2022): срастается у 97 %
  - { on: cond.mt5_fracture, kind: cure, band: { pct: 97 }, days: [28, 42], when: { displacement: [none] } }
  # при ушибе разгрузить стопу — облегчает, но не нужно всем (832_2, раздел 4)
  - { on: cond.foot_contusion, kind: relieve, band: often, days: [1, 5] }
texts:
  hint:
    ru: "Обувь с жёсткой подошвой или ортопедическая обувь разгружает передний отдел стопы, пока срастается плюсневая кость, — обычно 4–6 недель. Так же лечат гипсом; какой из способов, решает врач."
sources:
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: консервативное лечение переломов плюсневых костей, включая стрессовые, без смещения и с допустимым смещением — обувь с жёсткой подошвой, специализированная ортопедическая обувь или гипсовая иммобилизация в течение 4–6 недель (УУР C, УДД 5)" }
  - { kind: paper, title: "Pettersen PM, Radojicic N, Grün W, Andresen TKM, Molund M. Proximal Fifth Metatarsal Fractures: A Retrospective Study of 834 Fractures With a Minimum Follow-up of 5 Years. Foot Ankle Int 2022;43(5):602–608", url: "https://pubmed.ncbi.nlm.nih.gov/35125016/", note: "PMID 35125016, сверено 29.09.2026: 834 перелома, без операции — 94,4 %; несращение или переход к операции — 2,7 % в зоне 1, 3,2 % в зоне 2, 3,8 % в зоне 3; опора на ногу сразу или без опоры на срок сращения не повлияла" }
review: draft
