id: tx.atropine
name: { ru: "Атропин в вену" }
kind: drug
# при АВ-блокаде II–III степени с симптомами или нарушением гемодинамики (spec 2026-10-chapter-3, часть 42в; 160_2,
# раздел 3.1.2): улучшает проведение и учащает ритм, «наиболее эффективен при ПЖБ на уровне ПЖУ»; действует
# недолго — «мост» к стимуляции. В вену под монитором — у постели; ₽ — игровое число
class: anticholinergic.atropine
route: iv
cost: 100
bedside: { equipment: [eq.monitor_defib] }
effects:
  # пульс чаще при блокаде в АВ-узле, с узкими комплексами — обычно; ниже узла в игре не помогает (игровое
  # правило по разделу 3.1.2); причину не лечит — кардиостимулятор ставят в центре
  - { on: cond.av_block, kind: relieve, band: usually, days: [0, 0], when: { block: [narrow] } }
texts:
  hint:
    ru: "В вену под монитором: снимает тормозящее действие блуждающего нерва, сердце бьётся чаще. Лучше всего помогает при блокаде в самом АВ-узле — с узкими комплексами. Действует недолго: это мост до стимуляции и перевода."
sources:
  - { kind: guideline, title: "Брадиаритмии и нарушения проводимости", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/160_2", note: "ID 160_2, опубликованы 18.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.2: при ПЖБ II и III степени с симптоматикой или гемодинамически значимым состоянием атропин рекомендован; наиболее эффективен при ПЖБ на уровне ПЖУ и при избыточном тонусе блуждающего нерва; из-за короткого действия — «мост» к адренергическим средствам или временной стимуляции; раздел 3.1.1: период полураспада около 2 часов; что при блоке ниже узла он не помогает — игровое правило" }
review: draft
