id: tx.vagal
name: { ru: "Вагусные пробы" }
kind: procedure
# приёмы, которые раздражают блуждающий нерв и замедляют проведение через АВ-узел (spec 2026-10-chapter-3,
# часть 42б): натуживание на глубоком вдохе (проба Вальсальвы), массаж каротидного синуса — только с одной
# стороны, лицо в холодную воду; лёжа, с поднятыми ногами (619_3, раздел 3.1.1, ЕОК IB). Аппаратов не нужно —
# и в кабинете врача; ₽ — игровое число
class: antiarrhythmic.vagal
cost: 0
effects:
  # обрывают приступ наджелудочковой тахикардии — «иногда»: игровая оценка, в 619_3 долей нет. Нестабильному —
  # разряд сразу (раздел 3.1.1, ЕОК IB): время на пробы в игре не лечит
  - { on: cond.svt, kind: cure, band: sometimes, days: [0, 0], when: { unstable: [no] } }
texts:
  hint:
    ru: "Первое при приступе частой ровной тахикардии с узкими комплексами: натужиться на глубоком вдохе, опустить лицо в холодную воду, массаж сонной артерии на шее — только с одной стороны. Лёжа, с поднятыми ногами. Не помогло — трифосаденин в вену под монитором."
sources:
  - { kind: guideline, title: "Наджелудочковые тахикардии", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/619_3", note: "ID 619_3, опубликованы 17.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1 (ЕОК IB): при стабильной гемодинамике — вагусные приёмы: проба Вальсальвы, массаж каротидного синуса (только с одной стороны), погружение лица в холодную воду, лучше лёжа с приподнятыми ногами; продолжительность — 15–20 секунд; доля успеха — игровая оценка" }
review: draft
