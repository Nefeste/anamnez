id: tx.ivig
name: { ru: "Иммуноглобулин человека нормальный в вену" }
kind: drug
# миастенический криз (spec 2026-10-chapter-4, часть 58в): «Рекомендуется назначение иммуноглобулинов нормальных человеческих для
# внутривенного введения в качестве краткосрочной патогенетической терапии у пациентов с жизнеугрожающими симптомами МГ, такими как
# выраженные бульбарные нарушения и нарастающая дыхательная недостаточность» — когда базовая терапия не помогает и нужен быстрый
# ответ (165_2, раздел 3.1.2, УУР A, УДД 1); курс — 5 дней в стационаре (там же; раздел 6); доз нет (ADR 0012); ₽ — игровое
class: vaccine.ivig
route: iv
cost: 40000
effects:
  # «Клиническое улучшение развивается через 10-14 дней» (раздел 3.1.2); смертность — «от 2-5% до более чем 16%» (раздел 1.3):
  # помогает у 92 из 100 — игровая оценка
  - { on: cond.myasthenic_crisis, kind: cure, band: { pct: 92 }, days: [10, 14] }
texts:
  hint:
    ru: "Антитела из крови тысяч здоровых доноров — капельница пять дней подряд, в стационаре. При миастеническом кризе гасят атаку собственных антител, сила возвращается через 10–14 дней. ИВЛ не заменяет: пока не подействует, дышит аппарат."
sources:
  - { kind: guideline, title: "Миастения", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/165_2", note: "ID 165_2, опубликованы 15.12.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 3.1.2 (УУР A, УДД 1): иммуноглобулины нормальные человеческие внутривенно — краткосрочная патогенетическая терапия при жизнеугрожающих симптомах, курс 5 дней, улучшение через 10–14 дней; раздел 3.2: при острой дыхательной недостаточности лучше иммуноглобулин; раздел 6: вводят в стационаре; критерий качества 10; доля помощи и цена — игровая оценка" }
review: draft
