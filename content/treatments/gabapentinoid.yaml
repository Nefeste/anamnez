id: tx.gabapentinoid
name: { ru: "Габапентин или прегабалин" }
kind: drug
# радикулопатия (spec 2026-10-chapter-4, часть 58б): «Противоэпилептические препараты (АТХ код: N03AX; габапентин,
# прегабалин**) рекомендуются для уменьшения боли при ДПКР» — при невропатической боли (777_1, раздел 3.1.2, Р27, УУР B, УДД
# 2); в обезболивании, а не среди противосудорожных; доз нет; ₽ — игровое
class: analgesic.gabapentinoid
route: oral
cost: 400
effects:
  # по систематическому обзору эффективности не отмечено (там же): помогает не каждому — игровая оценка
  - { on: cond.radiculopathy, kind: relieve, band: sometimes, days: [3, 14] }
texts:
  hint:
    ru: "Противоэпилептические препараты, которые уменьшают невропатическую боль — жгучую, простреливающую, с онемением. При радикулопатии их можно добавить к НПВП; помогают не всем."
sources:
  - { kind: guideline, title: "Дискогенная пояснично-крестцовая радикулопатия", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/777_1", note: "ID 777_1, опубликованы 07.12.2023, применяются; сверено с рубрикатором 12.10.2026; раздел 3.1.2, Р27 (УУР B, УДД 2): габапентин и прегабалин — для уменьшения боли при ДПКР, учитывая эффект при невропатической боли; по систематическому обзору эффективности не отмечено; критерий качества 7" }
review: draft
