id: tx.ppi_iv
name: { ru: "Ингибитор протонной помпы в вену (омепразол, эзомепразол)" }
# при кровотечении из язвы и разрыва слизистой — в вену при поступлении всем (277_2, раздел 3.2, УУР C, УДД 5; 1026_1,
# раздел 3.2, УУР B, УДД 1), после гемостаза — 72 часа, потом внутрь (раздел 3.3); дозы в игре не названы (ADR 0012); ₽ —
# игровое число
kind: drug
class: acid.ppi
route: iv
cost: 700
effects:
  # без высокого риска — плоские пятна и чистое дно (F2c–F3), остановившееся кровотечение из разрыва: эндоскопия не
  # нужна, «медикаментозная профилактика рецидива» (277_2, 1026_1, раздел 3.3); доли — игровая оценка
  - { on: cond.ulcer_bleeding, kind: cure, band: { pct: 95 }, days: [3, 7], when: { forrest: [low] } }
  - { on: cond.mallory_weiss, kind: cure, band: { pct: 96 }, days: [2, 5], when: { active: ['no'] } }
texts:
  hint:
    ru: "Снижают кислотность в желудке, и сгусток на сосуде держится крепче: при кровотечении из язвы и разрыва слизистой их вводят в вену сразу при поступлении. До ЭГДС уменьшают нужду в гемостазе через эндоскоп, но ЭГДС не заменяют. Кровят варикозные вены — ИПН отменяют."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2 (УУР C, УДД 5): парентерально при поступлении всем с язвенным кровотечением, до ЭГДС — меньше нужда в гемостазе, но без задержки эндоскопии; раздел 3.3: после гемостаза — в вену 72 часа, затем внутрь; H2-блокаторы не рекомендуются (УУР B, УДД 2)" }
  - { kind: guideline, title: "Синдром Мэллори-Вейсса (желудочно-пищеводный разрывно-геморрагический синдром)", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1026_1", note: "ID 1026_1, опубликованы 02.02.2026, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2 (УУР B, УДД 1): парентерально при поступлении всем с кровотечением при синдроме; раздел 3.3: при остановившемся кровотечении — медикаментозная профилактика рецидива" }
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.2 (УУР C, УДД 4): при варикозном кровотечении ИПП отменить, как только источник — варикозные вены, если нет прямых показаний: они повышают риск инфекций и печёночной энцефалопатии" }
review: draft
