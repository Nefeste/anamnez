id: tx.thoracotomy
name: { ru: "Торакотомия, остановка кровотечения" }
kind: surgery
class: surgery.thoracic
# расходники и работа, ₽ — игровое число
cost: 30000
effects:
  - { on: cond.traumatic_hemothorax, kind: cure, band: { pct: 100 }, days: [7, 10], when: { volume: [massive] } }
# тотальный гемоторакс — неотложная торакотомия (728_2, прил. Г2); на первом уровне оперирует хирург
# (раздел 6); 120 минут и доля осложнений — игровые оценки; смертность в операционной — 2 из 23,
# 8,7 % (Balkan 2002)
surgery:
  room: room.or
  team: [role.surgeon, role.anesthetist, role.or_nurse]
  equipment: [eq.or_table, eq.anesthesia]
  minutes: 120
  complications: { pct: 20 }
  death: { pct: 8.7 }
texts:
  hint:
    ru: "Грудную клетку вскрывают между рёбрами, находят и останавливают кровотечение, удаляют кровь из плевральной полости. Так оперируют большой, тотальный гемоторакс и кровотечение, которое не останавливается."
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; прил. Г2: показания к неотложной торакотомии — тотальный гемоторакс, продолжающееся внутриплевральное кровотечение с отхождением по дренажам более 250 мл крови в час и другие; раздел 3: торакотомия при поступлении по дренажу 1 л крови и более; раздел 6: при экстренной госпитализации в учреждение 1-го уровня специализированную хирургическую помощь оказывает врач-хирург" }
  - { kind: paper, title: "Balkan ME, Oktar GL, Kayi-Cangir A, Ergül EG. Emergency thoracotomy for blunt thoracic trauma. Ann Thorac Cardiovasc Surg 2002;8(2):78–82", url: "https://pubmed.ncbi.nlm.nih.gov/12027792/", note: "PMID 12027792, сверено 29.09.2026: 745 больных с тупой травмой груди; экстренная торакотомия — у 29 (3,9 %), из них в операционной — 23, умерли 2 (8,7 %)" }
review: draft
