id: tx.oxygen_mask
name: { ru: "Кислород через маску" }
kind: procedure
# медицинский кислород (АТХ V03AN01), ингаляция через лицевую маску (spec 2026-10-chapter-3, часть 38б)
class: oxygen
route: inhaled
cost: 150
# причину не лечит — облегчает, пока действует лечение причины; насколько — игровая оценка. Порог
# сатурации у каждой болезни — свой, по её рекомендации (тактика по параметру spo2_*)
effects:
  - { on: cond.acs, kind: relieve, band: sometimes, days: [0, 1], when: { spo2_below90: [yes] } }
  - { on: cond.pneumonia_cap, kind: relieve, band: often, days: [0, 2], when: { spo2_below90: [yes] } }
  - { on: cond.copd_exacerbation, kind: relieve, band: often, days: [0, 2], when: { spo2_le92: [yes] } }
  - { on: cond.asthma_exacerbation, kind: relieve, band: often, days: [0, 1], when: { spo2_below93: [yes] } }
  - { on: cond.covid19, kind: relieve, band: often, days: [0, 2], when: { spo2_below95: [yes] } }
  - { on: cond.anaphylaxis, kind: relieve, band: sometimes, days: [0, 1] }
contraindications: []
texts:
  hint:
    ru: "Кислород через лицевую маску: поднимает сатурацию, когда лёгкие не справляются. Порог у каждой болезни свой: при пневмонии и инфаркте — ниже 90 %, при обострении ХОБЛ — 92 % и ниже, при астме — ниже 93 %. При инфаркте с нормальной сатурацией не нужен. При травме груди и панкреатите — первая помощь дыханию."
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; коррекция гипоксемии: при SpO2 < 90 % или PaO2 < 60 мм рт. ст. — ингаляторное введение кислорода (ЕОК IC, УУР С, УДД 5); при SpO2 ≥ 90 % не рекомендуется (ЕОК IIIB, УУР А, УДД 2)" }
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 03.10.2026; при SpO2 < 90 % или PaO2 < 60 мм рт. ст. — оксигенотерапия (ЕОК IC, УУР С, УДД 5); при SpO2 ≥ 90 % не рекомендуется (ЕОК IIIB, УУР А, УДД 2)" }
  - { kind: guideline, title: "Внебольничная пневмония у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/654_2", note: "ID 654_2, опубликованы 23.12.2024, применяются; сверено с рубрикатором 03.10.2026; при SpO2 < 90 % или PaO2 < 60 мм рт. ст. в качестве терапии первой линии рекомендована стандартная оксигенотерапия — через назальные канюли или лицевые маски; критерий качества — назначена оксигенотерапия при SpO2 < 90 %" }
  - { kind: guideline, title: "Хроническая обструктивная болезнь легких", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/603_3", note: "ID 603_3, опубликованы 17.12.2024, применяются; сверено с рубрикатором 03.10.2026; при обострении с острой дыхательной недостаточностью — кислородотерапия с целью PaO2 55–65 мм рт. ст. и SpO2 88–92 %; показана при SpO2 ≤ 92 %" }
  - { kind: guideline, title: "Бронхиальная астма", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/359_3", note: "ID 359_3, опубликованы 15.11.2024, применяются; сверено с рубрикатором 03.10.2026; при обострении — оксигенотерапия в случае снижения насыщения крови кислородом для поддержания сатурации 93–95 % у взрослых; среди препаратов первой линии обострения" }
  - { kind: guideline, title: "Коронавирусная инфекция COVID-19", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1024_1", note: "ID 1024_1, опубликованы 28.01.2026, применяются; сверено с рубрикатором 03.10.2026; низкопоточная оксигенотерапия через лицевую маску — при лёгкой и средней гипоксемии; среднетяжёлое течение — SpO2 < 95 %" }
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 03.10.2026; рек. 22: всем пациентам с анафилаксией/АШ — ингаляторное введение кислорода потоком через лицевую маску для коррекции гипоксемии" }
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 03.10.2026; раздел 3 (УУР С, УДД 5): при острой дыхательной недостаточности — эвакуация содержимого плевральной полости и последовательное увеличение инвазивности дыхательной поддержки, начиная с инсуфляции кислорода" }
  - { kind: guideline, title: "Острый панкреатит", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/903_1", note: "ID 903_1, опубликованы 20.01.2025, применяются; сверено с рубрикатором 29.09.2026; ИВЛ — если, несмотря на ингаляцию кислорода и другие способы респираторной поддержки, нарастают тахипноэ и гипоксемия" }
review: draft
