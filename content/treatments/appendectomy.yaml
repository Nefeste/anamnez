id: tx.appendectomy
name: { ru: "Аппендэктомия" }
kind: surgery
class: surgery.abdominal
# расходники операции, ₽ — игровое число
cost: 9000
# удаление отростка устраняет причину; выписка — через срок стационара болезни (1–4 дня)
effects:
  - { on: cond.appendicitis, kind: cure, band: { pct: 100 }, days: [1, 4] }
# бригада, аппараты и длительность — по медиане лапароскопической аппендэктомии (WSES 2020);
# осложнений — как после лапароскопической (WSES 2020), навык хирурга меняет их долю
surgery:
  room: room.or
  team: [role.surgeon, role.anesthetist, role.or_nurse]
  equipment: [eq.or_table, eq.anesthesia]
  minutes: 45
  complications: { pct: 8.7 }
texts:
  hint: { ru: "Удаление воспалённого червеобразного отростка, лучше лапароскопически — через проколы. За час до разреза — антибиотик для профилактики. После операции обычно 1–4 дня в стационаре." }
sources:
  - { kind: guideline, title: "Острый аппендицит у взрослых", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/325_2", note: "ID 325_2, опубликованы 24.11.2023, применяются; сверено с рубрикатором 28.09.2026; разделы 3.2 и 3.3: аппендэктомия — стандарт лечения, лучше лапароскопическая; антибиотикопрофилактика за 60 минут до разреза; при неосложнённом — отсрочка до 24 ч в стационаре; после аппендэктомии в стационаре 1–4 дня" }
  - { kind: guideline, title: "Di Saverio S et al. Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines. World J Emerg Surg 2020;15:27", url: "https://pubmed.ncbi.nlm.nih.gov/32295644/", note: "PMC7386163, сверено 28.09.2026: осложнений после операции — 8,7 % после лапароскопической и 11,1 % после открытой; медиана длительности лапароскопической аппендэктомии — 42 и 44 минуты (сравнение способов обработки культи)" }
review: draft
