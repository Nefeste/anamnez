id: tx.verapamil
name: { ru: "Верапамил" }
kind: drug
# блокатор кальциевых каналов с прямым действием на сердце (spec 2026-10-chapter-3, часть 42а): урежает
# сокращения желудочков при фибрилляции и трепетании предсердий (382_2, раздел 3.1.2.1, ЕОК IA); ₽ — игровое число
class: antiarrhythmic.verapamil
route: oral
cost: 150
effects:
  # пульс реже, сердцебиение стихает; оценивают по ЧСС в покое — игровая оценка
  - { on: cond.af, kind: cure, band: usually, days: [1, 7], when: { unstable: [no] } }
# при сердечной недостаточности со сниженной фракцией выброса урежают только бета-адреноблокатором и
# дигоксином (раздел 3.1.2.1.2): в игре сердечная недостаточность — противопоказание; декомпенсация — игровая
# оценка
contraindications:
  - { id: risk.heart_failure, level: absolute, reaction: sometimes }
texts:
  hint:
    ru: "Урежает пульс при фибрилляции и трепетании предсердий: желудочки сокращаются реже, сердцебиение стихает. При сердечной недостаточности нельзя — сердце слабеет ещё больше; тогда — бета-адреноблокатор."
sources:
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.2.1: контроль ЧСС — бета-адреноблокаторы, дигоксин, верапамил или дилтиазем (ЕОК IA); раздел 3.1.2.1.2: при ФВ 40 % и больше — бета-адреноблокатор, дигоксин, дилтиазем или верапамил; меньше 40 % — бета-адреноблокатор и дигоксин; сочетание верапамила с бета-адреноблокатором нежелательно; доли — игровая оценка" }
review: draft
