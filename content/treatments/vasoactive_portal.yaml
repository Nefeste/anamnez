id: tx.vasoactive_portal
name: { ru: "Терлипрессин или октреотид в вену" }
# вазоактивные препараты при кровотечении из варикозных вен (spec 2026-10-chapter-4, часть 54а): «незамедлительное (до
# выполнения эндоскопии) назначение терлипрессина** или октреотида**» — уменьшают кровопотерю и смертность (715_2, раздел
# 3.2.2, УУР B, УДД 2), 2–5 дней; в комбинации с лигированием — «максимальная эффективность гемостаза» (раздел 3.3.1, УУР A,
# УДД 1). Одна строка на два препарата, без доз (ADR 0012); ₽ — игровое число
kind: drug
class: vascular.portal
route: iv
cost: 2500
effects:
  # сами по себе снижают давление в воротной вене и кровопотерю (715_2, раздел 3.2.2); как часто без лигирования
  # кровотечение останавливается насовсем — в тексте не названо, игровая оценка
  - { on: cond.variceal_bleeding, kind: cure, band: sometimes, days: [2, 5] }
texts:
  hint:
    ru: "Сужают сосуды брюшной полости и снижают давление в воротной вене: кровотечение из варикозных вен слабеет. Начинают сразу, ещё до ЭГДС, и продолжают 2–5 дней; вместе с лигированием вен останавливают кровь лучше всего."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.2 (УУР B, УДД 2): терлипрессин или октреотид — незамедлительно, до эндоскопии, 2–5 дней; раздел 3.3.1 (УУР A, УДД 1): в комбинации с эндоскопическим лигированием; как часто помогают без лигирования — игровая оценка" }
review: draft
