id: tx.botulism_antitoxin
name: { ru: "Антитоксин ботулинический" }
kind: drug
class: vaccine.botulism
route: iv
# противоботулиническая сыворотка типов A, B и E (spec 2026-10-chapter-4, часть 51в; 911_1, раздел 3.1.1, УУР C, УДД 4): всем с
# подозрением на ботулизм, в максимально ранние сроки, один раз, в вену капельно; нейтрализует только свободный токсин в крови —
# параличи могут нарастать и после неё. Лошадиная сыворотка — чужой белок, «вплоть до анафилактического шока»: перед ней
# глюкокортикоид в вену (раздел 3.1.2, УУР C, УДД 5) — спутник. ₽ — игровое число
cost: 8000
companions: [tx.steroid_iv]
effects:
  # летальность в России — 7–9 % (раздел 1.3), восстановление мышц — через 1–2 месяца (раздел 1.2): помогает у 92 из 100 —
  # игровая оценка
  - { on: cond.botulism, kind: cure, band: { pct: 92 }, days: [14, 30] }
texts:
  hint:
    ru: "Лошадиная сыворотка против токсина типов A, B и E — один раз в вену, как можно раньше, не дожидаясь анализов: связывает токсин, который ещё в крови. Наступившие параличи не снимает и может вызвать анафилаксию — перед ней глюкокортикоид в вену."
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.1 (УУР C, УДД 4): антитоксин ботулинический типов A, B, E — в максимально ранние сроки всем пациентам с подозрением на ботулизм, в вену капельно, однократно; нейтрализует лишь свободно циркулирующий токсин, параличи могут нарастать и после введения; способен вызвать аллергические реакции вплоть до анафилактического шока; раздел 3.1.2 (УУР C, УДД 5): глюкокортикоид в вену до введения сыворотки; раздел 1.3: летальность 7–9 %; раздел 1.2: восстановление — через 1–2 месяца; доля излечения — игровая оценка" }
review: draft
