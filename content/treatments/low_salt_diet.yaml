id: tx.low_salt_diet
name: { ru: "Диета с ограничением соли" }
kind: regimen
# ограничение натрия с пищей при асците второй степени (spec 2026-10-chapter-4, часть 54а): «для достижения отрицательного
# водного баланса» (715_2, раздел 3.2.1, УУР C, УДД 5) — до 5 г соли в день, без полуфабрикатов и консервов, но и не меньше
# 60 ммоль натрия: еда становится невкусной, больной недоедает
cost: 0
effects:
  # «может привести к разрешению асцита у 10 % пациентов, особенно у пациентов с впервые возникшим асцитом» (раздел 3.2.1);
  # за сколько дней — игровая оценка
  - { on: cond.cirrhosis_ascites, kind: cure, band: { pct: 10 }, days: [14, 28] }
texts:
  hint:
    ru: "Не больше 5 г соли в день: без полуфабрикатов, консервов, колбасы и солений. При асците соль держит воду в теле; одна диета убирает асцит у немногих, с мочегонным — у большинства. Совсем без соли тоже нельзя: еда невкусная, человек недоедает."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.1 (УУР C, УДД 5): диета с ограничением натрия при асците второй степени — не более 80 ммоль натрия, 5 г соли в сутки, но не меньше 60 ммоль; может разрешить асцит у 10 %, особенно впервые возникший; после объёмного парацентеза — диуретики с диетой; критерий качества 11; за сколько дней — игровая оценка" }
review: draft
