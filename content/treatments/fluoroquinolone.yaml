id: tx.fluoroquinolone
name: { ru: "Фторхинолоны (ципрофлоксацин, левофлоксацин)" }
kind: drug
class: antibiotic.fluoroquinolone
route: oral
cost: 300
effects:
  - { on: cond.pyelonephritis, kind: cure, band: usually, days: [2, 4] }
  - { on: cond.cystitis, kind: cure, band: usually, days: [1, 3] }
  # шигеллёз (spec 2026-10-chapter-4, часть 49б): ципрофлоксацин — препарат выбора при «кровавой диарее» у взрослых, курс
  # 3–5 дней; улучшение — за 48 часов (869_1, разделы 1.6 и 3.1.1). Сальмонеллёз — при тяжёлом и среднетяжёлом течении
  # (700_3, раздел 3.1.1), при лёгком антибиотик не нужен. Дни — игровая оценка
  - { on: cond.shigellosis, kind: cure, band: usually, days: [2, 5] }
  - { on: cond.salmonellosis, kind: cure, band: usually, days: [3, 7], when: { severity: [moderate, severe] } }
contraindications:
  - { id: risk.pregnancy, level: absolute, reaction: never }
texts:
  hint:
    ru: "Сильные антибиотики, которые хорошо проникают в почки и стенку кишки: выбор при нетяжёлом пиелонефрите и при шигеллёзе, при тяжёлом сальмонеллёзе — один из вариантов. При простом цистите — только если другие нельзя: побочные эффекты серьёзнее. При беременности противопоказаны."
sources:
  - { kind: guideline, title: "EAU Guidelines on Urological Infections", org: "European Association of Urology", year: 2024 }
  - { kind: guideline, title: "Pyelonephritis (acute): antimicrobial prescribing. NICE guideline NG111", org: "NICE", year: 2018 }
  - { kind: guideline, title: "Шигеллез", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/869_1", note: "ID 869_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.1 (УУР C, УДД 5): первая линия у взрослых — фторхинолоны 3 дня, ципрофлоксацин — препарат выбора при кровавой диарее; резистентности к ципрофлоксацину не выявлено; нет улучшения за 48 часов — сменить препарат" }
  - { kind: guideline, title: "Сальмонеллез у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/700_3", note: "ID 700_3, опубликованы 17.09.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.1 (УУР C, УДД 5): антимикробная терапия при генерализованных формах, тяжёлом течении и среднетяжёлом с отягощённым фоном — в том числе фторхинолоны, 7–14 дней; при лёгкой форме не рекомендована" }
review: draft
