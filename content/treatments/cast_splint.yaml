id: tx.cast_splint
name: { ru: "Гипсовая лонгета" }
kind: procedure
class: immobilization.cast
# гипс и работа, ₽ — игровое число
cost: 600
effects:
  # перелом без смещения срастается в лонгете за 5–7 недель (846_1, раздел 3.1); вторичное смещение
  # потребовало операции у 9,1 % леченных без операции (Rundgren 2020) — доля для всех без операции
  - { on: cond.distal_radius_fracture, kind: cure, band: { pct: 90.9 }, days: [35, 49], when: { displacement: [none] } }
  # стабильный перелом лодыжек — консервативно, иммобилизация до 6–8 недель (855_1, раздел 3.1);
  # доля неудач консервативного лечения в тексте не дана — игровая оценка
  - { on: cond.ankle_fracture, kind: cure, band: always, days: [42, 56], when: { stability: [stable] } }
  # при ушибе и растяжении — короткая иммобилизация облегчает, но не нужна всем (832_2, раздел 4)
  # основание пятой плюсневой без значительного смещения — гипс так же, как обувь с жёсткой
  # подошвой, 4–6 недель (856_1, раздел 3.1); несращение — 2,7–3,8 % (Pettersen 2022)
  - { on: cond.mt5_fracture, kind: cure, band: { pct: 97 }, days: [28, 42], when: { displacement: [none] } }
  # надколенник без смещения — гипсовая повязка или шарнирный ортез в разгибании 4–8 недель (970_1,
  # разделы 3.1 и 4); вторичное смещение — показание к плановой операции (раздел 6), его доли в тексте
  # нет — «обычно», игровая оценка
  - { on: cond.patella_fracture, kind: cure, band: usually, days: [28, 56], when: { displacement: [none] } }
  # разрыв связок колена — тутор или гипсовая лонгета, современнее — функциональный ортез (691_2,
  # раздел 4); полный разрыв — гипс или функциональная повязка 4–6 недель (832_2, раздел 3.1)
  - { on: cond.knee_ligament, kind: cure, band: often, days: [28, 56] }
  - { on: cond.ankle_sprain, kind: relieve, band: often, days: [1, 5] }
  - { on: cond.wrist_contusion, kind: relieve, band: often, days: [1, 5] }
  - { on: cond.foot_contusion, kind: relieve, band: often, days: [1, 5] }
  # надрыв икроножной мышцы (часть 33а): иммобилизация в нейтральном положении при неполном
  # разрыве мышцы — не больше 10 дней (832_2, раздел 3.1): облегчает, лечит покой и холод
  - { on: cond.calf_strain, kind: relieve, band: often, days: [1, 5] }
texts:
  hint:
    ru: "Гипсовая повязка на половину окружности конечности, закреплённая бинтом: держит отломки на месте, пока кость срастается. Перелом лучевой кости без смещения — 5–7 недель, стабильный перелом лодыжки — 6–8 недель, надколенник без смещения — 4–8 недель в разгибании."
sources:
  - { kind: guideline, title: "Переломы дистального отдела костей предплечья", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/846_1", note: "ID 846_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: при переломе без смещения — консервативное лечение, чаще всего гипсовая лонгета, около 5–7 недель" }
  - { kind: guideline, title: "Переломы лодыжек", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/855_1", note: "ID 855_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: консервативно — изолированный перелом лодыжки без смещения, стабильный перелом; иммобилизация обычно до 6–8 недель после травмы" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 4: при ушибе — иммобилизация на 3–5 дней; давящая повязка при необходимости заменяется на гипсовую лонгету или ортез" }
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: переломы плюсневых костей без смещения и с допустимым смещением — обувь с жёсткой подошвой, ортопедическая обувь или гипсовая иммобилизация в течение 4–6 недель" }
  - { kind: paper, title: "Pettersen PM, Radojicic N, Grün W, Andresen TKM, Molund M. Proximal Fifth Metatarsal Fractures: A Retrospective Study of 834 Fractures With a Minimum Follow-up of 5 Years. Foot Ankle Int 2022;43(5):602–608", url: "https://pubmed.ncbi.nlm.nih.gov/35125016/", note: "PMID 35125016, сверено 29.09.2026: без операции — 94,4 % из 834 переломов основания пятой плюсневой; несращение или переход к операции — 2,7–3,8 % по зонам" }
  - { kind: paper, title: "Rundgren J, Bojan A, Mellstrand Navarro C, Enocson A. Epidemiology, classification, treatment and mortality of distal radius fractures in adults: an observational study of 23,394 fractures from the national Swedish fracture register. BMC Musculoskelet Disord 2020;21:88", url: "https://pubmed.ncbi.nlm.nih.gov/32035488/", note: "PMID 32035488, PMC7007648, сверено 29.09.2026: без операции лечили 74 %; вторичная операция — у 9,1 % из них, в среднем через 11,2 дня" }
  - { kind: guideline, title: "Переломы надколенника", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/970_1", note: "ID 970_1, опубликованы 25.11.2025, применяются; сверено с рубрикатором 29.09.2026; разделы 3.1 и 4: стабильный перелом без смещения или со смещением менее 2–3 мм — гипсовая повязка или шарнирный ортез в положении разгибания, 4–8 недель; прил. В: до 6 недель; раздел 6: вторичное смещение — показание к плановой госпитализации" }
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 4: для иммобилизации накладывается тутор или гипсовая лонгета, более современный способ — функциональный ортез до 6–8 недель" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1 (УУР C, УДД 5): при неполном разрыве мышцы — иммобилизация в нейтральном положении, не более 10 дней" }
