id: tx.fast_carbs
name: { ru: "Быстрые углеводы внутрь" }
# сахар, мёд, сладкий сок, таблетки декстрозы (spec 2026-10-chapter-3, часть 44а; 290_2, раздел 3.7); сколько — не в
# игре (ADR 0012); ₽ — игровое число
kind: regimen
class: glucose.oral
route: oral
cost: 20
effects:
  # лёгкая гипогликемия: через 15 минут не купирована — повторить (286_3, раздел 3.6); насколько помогает — игровая
  # оценка
  - { on: cond.hypoglycemia, kind: cure, band: usually, days: [0, 0], when: { severity: [mild] } }
  # без сознания нельзя вливать в рот сладкие растворы — опасность асфиксии (290_2, раздел 3.7); как часто — игровая
  # оценка
  - { on: cond.hypoglycemia, kind: harm, band: sometimes, days: [0, 0], when: { severity: [severe] } }
texts:
  hint:
    ru: "Сахар, мёд, сладкий сок или таблетки декстрозы. При лёгкой гипогликемии, пока человек в сознании, сахар крови поднимается за минуты; не прошло за 15 минут — ещё раз. Без сознания — ничего в рот: захлебнётся."
sources:
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7 (УУР C, УДД 4): при лёгкой гипогликемии — быстро усваиваемые углеводы: сахар, мёд или варенье, фруктовый сок, лимонад на сахаре, таблетки декстрозы; при потере сознания нельзя вливать в полость рта сладкие растворы — опасность асфиксии" }
  - { kind: guideline, title: "Сахарный диабет 1 типа у взрослых", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/286_3", note: "ID 286_3, опубликованы 02.03.2026, применяются; сверено с рубрикатором 05.10.2026; раздел 3.6: если через 15 минут гипогликемия не купируется — повторить лечение; насколько помогает — игровая оценка" }
review: draft
