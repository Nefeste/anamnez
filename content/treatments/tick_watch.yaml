id: tx.tick_watch
name: { ru: "Памятка: месяц следить за температурой и кожей" }
kind: regimen
cost: 0
# после присасывания клеща (spec 2026-10-chapter-4, часть 51а): болезнь Лайма проявляется в течение месяца, клещевой энцефалит —
# обычно через 7–12 дней; при пятне, лихорадке, головной боли — сразу к врачу (566_2, приложение В; 567_2, раздел 1.6)
texts:
  hint:
    ru: "Месяц после укуса клеща мерить температуру и смотреть на кожу у места укуса. Растущее красное пятно, лихорадка, головная боль, слабость в лице — сразу к врачу: это может быть болезнь Лайма или клещевой энцефалит."
sources:
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; приложение В: следить за кожей и самочувствием — лихорадка, озноб, головная боль, утомляемость, боли в мышцах и суставах; срочно — при нарушении ритма, слабости мимических мышц, менингеальных симптомах; срока наблюдения в тексте нет — месяц по разделу 2" }
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: инкубационный период 1–35 дней, обычно 7–12; порядка наблюдения за укушенным в тексте нет" }
review: draft
