id: tx.pleural_puncture
name: { ru: "Плевральная пункция" }
kind: procedure
class: drainage.pleural
# игла, шприц и работа, ₽ — игровое число
cost: 800
effects:
  # кровь — пункция с удалением крови или дренирование (728_2, раздел 3, УУР C, УДД 5); как часто
  # хватает пункции и за сколько дней — игровая оценка
  - { on: cond.traumatic_hemothorax, kind: cure, band: often, days: [2, 7], when: { volume: [moderate] } }
texts:
  hint:
    ru: "Толстой иглой через межреберье удаляют кровь из плевральной полости. Прокол делают по верхнему краю нижележащего ребра — вдоль нижнего края идут сосуды."
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3: у всех с гемотораксом — плевральная пункция с удалением крови или дренирование плевральной полости (УУР C, УДД 5); раздел 2.4: пункция в VI–VII межреберье по верхнему краю нижележащего ребра; пункцию и дренирование не выполняют, не убедившись в характере содержимого плевральной полости" }
review: draft
