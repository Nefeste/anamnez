id: tx.active_vitamin_d
name: { ru: "Альфакальцидол или кальцитриол" }
kind: drug
# стандартная терапия гипопаратиреоза — препараты витамина D и его аналогов, альфакальцидол или кальцитриол, вместе с препаратами
# кальция (spec 2026-10-chapter-4, часть 56в; 627_3, раздел 3.2, УУР С, УДД 4); при острой гипокальциемии — одновременно с кальцием в
# вену (раздел 7.1). Доз нет; ₽ — игровое число
class: vitamin.d_active
route: oral
cost: 200
effects:
  # дозы подбирают с интервалом 2–3 дня (раздел 3.2, комментарий): доля и сроки без кальция в вену — игровая оценка
  - { on: cond.hypocalcemia_acute, kind: cure, band: sometimes, days: [2, 5] }
texts:
  hint:
    ru: "Активные формы витамина D: помогают кальцию всасываться и держаться в крови, когда околощитовидные железы не работают. При гипопаратиреозе — всегда вместе с препаратами кальция. Обычный витамин D, колекальциферол, их не заменяет."
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 3.2 (УУР С, УДД 4): препараты витамина D и его аналогов (альфакальцидол, кальцитриол) в сочетании с препаратами кальция, коррекция доз — с интервалом 2–3 дня, колекальциферол — при дефиците витамина D (УУР С, УДД 5); раздел 7.1: при острой гипокальциемии — одновременно с кальцием в вену; критерий качества 9; доля и сроки — игровая оценка" }
review: draft
