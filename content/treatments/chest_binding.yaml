id: tx.chest_binding
name: { ru: "Тугое бинтование грудной клетки" }
kind: procedure
class: immobilization.binding
# бинт, ₽ — игровое число
cost: 200
# перелом не лечит: ограничивает дыхание — при переломах рёбер противопоказано (728_2, раздел 3)
texts:
  hint:
    ru: "Грудную клетку туго перебинтовывают, чтобы меньше болело. При переломе рёбер так делать нельзя: грудь почти не расширяется, лёгкие не вентилируются, и развивается пневмония."
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3: не рекомендуется тугое бинтование грудной клетки при переломах рёбер из-за неэффективности (УУР C, УДД 5); оно противопоказано — резко ограничивает подвижность грудной клетки, усугубляет гиповентиляцию лёгких и способствует развитию пневмонии" }
review: draft
