id: tx.knee_brace
name: { ru: "Ортез на коленный сустав" }
kind: procedure
class: immobilization.brace
# ортез, ₽ — игровое число
cost: 3500
effects:
  # разрыв связок — функциональный ортез до 6–8 недель: стабилизирует сустав и оставляет движения
  # (691_2, раздел 4); полный разрыв ПКС консервативно не срастается, и при нестабильности решают об
  # операции (раздел 3.2, прил. В) — острый период проходит «обычно», игровая оценка
  - { on: cond.knee_ligament, kind: cure, band: usually, days: [28, 56] }
  # надколенник без смещения — шарнирный ортез в разгибании так же, как гипс (970_1, раздел 4)
  - { on: cond.patella_fracture, kind: cure, band: usually, days: [28, 56], when: { displacement: [none] } }
  # при ушибе ортез облегчает, но не нужен всем (832_2, раздел 3.1: иммобилизация — при полном разрыве связок)
  - { on: cond.knee_contusion, kind: relieve, band: sometimes, days: [1, 5] }
texts:
  hint:
    ru: "Функциональный ортез держит колено от смещения вперёд, назад и вбок и позволяет сгибать его в заданных пределах. Так лечат разрыв связок — до 6–8 недель; в разгибании фиксируют и перелом надколенника без смещения."
sources:
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 4: функциональный ортез до 6–8 недель, стартовая амплитуда 20°, затем до 90°; раздел 3.1: консервативное лечение — ограничение нагрузок, разгрузка сустава костылями, НПВП, ЛФК" }
  - { kind: guideline, title: "Переломы надколенника", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/970_1", note: "ID 970_1, опубликованы 25.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 4: при консервативном лечении — гипсовая повязка или шарнирный ортез, фиксирующие сустав в положении разгибания, до 4–8 недель" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: при полном разрыве связок с нестабильностью — гипс или функциональная повязка 4–6 недель" }
review: draft
