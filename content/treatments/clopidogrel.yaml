id: tx.clopidogrel
name: { ru: "Клопидогрел" }
kind: drug
# ингибитор P2Y12-рецептора тромбоцитов, тиенопиридин (АТХ B01AC)
class: antiplatelet.thienopyridine
route: oral
cost: 300
effects:
  # ОКС без подъёма ST в своей палате интенсивной терапии (spec 2026-10-chapter-3, часть 39в): к АСК ингибитор
  # P2Y12 снижает риск смерти и инфаркта (154_4, раздел 3.2.3.1, ЕОК IA) — игровая оценка: в рекомендации
  # долей нет; при переводе на коронарографию в первые сутки его до неё не дают
  - { on: cond.acs, kind: cure, band: sometimes, days: [1, 3], when: { type: [nste], invasive: [no] } }
  # ТИА (spec 2026-10-chapter-3, часть 41б): вторичная профилактика снижает риск нового нарушения
  # мозгового кровообращения на 20–30 % (814_1, раздел 5.1) — игровая оценка: 30 %; два антиагреганта —
  # 51 %; помогло — инсульта за неделю нет
  - { on: cond.tia, kind: cure, band: { pct: 30 }, days: [1, 2] }
texts:
  hint:
    ru: "Второй антиагрегант вдобавок к ацетилсалициловой кислоте: мешает тромбоцитам склеиваться. При тромболизисе — обязательно, до него или во время; тикагрелор и прасугрел с тромболизисом не дают. При ОКС без подъёма ST — если лечат здесь; если везут на коронарографию в первые сутки, до неё его не дают."
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.2.3.1 (ЕОК IB): клопидогрел до начала или во время ТЛТ; тикагрелор и прасугрел до и во время ТЛТ не рекомендуются (ЕОК IIIC); раздел 3.2.3.2: неназначение ингибитора P2Y12 до ЧКВ тактической ошибкой не считается" }
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 04.10.2026; раздел 3.2.3.1: ингибитор P2Y12 к АСК — всем без высокого риска кровотечений (ЕОК IA); при коронарографии в первые 24 часа добавлять его до неё не рекомендуется (ЕОК IIIA); если инвазивного лечения в первые 24 часа не планируют — рекомендуется добавить (ЕОК IIaB); клопидогрел — если тикагрелор и прасугрел нельзя или недоступны (ЕОК IB)" }
review: draft
