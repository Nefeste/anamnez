id: tx.clopidogrel
name: { ru: "Клопидогрел" }
kind: drug
# ингибитор P2Y12-рецептора тромбоцитов, тиенопиридин (АТХ B01AC)
class: antiplatelet.thienopyridine
route: oral
cost: 300
texts:
  hint:
    ru: "Второй антиагрегант вдобавок к ацетилсалициловой кислоте: мешает тромбоцитам склеиваться. При тромболизисе — обязательно, до него или во время; тикагрелор и прасугрел с тромболизисом не дают."
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.2.3.1 (ЕОК IB): клопидогрел до начала или во время ТЛТ; тикагрелор и прасугрел до и во время ТЛТ не рекомендуются (ЕОК IIIC); раздел 3.2.3.2: неназначение ингибитора P2Y12 до ЧКВ тактической ошибкой не считается" }
