id: tx.anterior_packing
name: { ru: "Передняя тампонада носа" }
kind: procedure
class: nasal.packing
cost: 400
effects:
  # источник не виден — передняя тампонада (977_1, раздел 3.1.2, УУР В, УДД 2; критерий качества 3);
  # спереди она останавливает и видимый источник; задний — нет: там нужна и задняя тампонада, в
  # стационаре. Доля остановленных — «обычно», игровая оценка
  - { on: cond.epistaxis, kind: cure, band: usually, days: [0, 1], when: { source: [anterior_visible, anterior_hidden] } }
texts:
  hint:
    ru: "Полость носа плотно заполняют тампоном: марлевым, губкой, которая рассасывается сама, или баллоном. Останавливает кровотечение из передних отделов, когда кровоточащий сосуд не виден. Если кровь всё равно стекает в горло — нужна задняя тампонада, её ставят в стационаре."
sources:
  - { kind: guideline, title: "Носовое кровотечение", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/977_1", note: "ID 977_1, опубликованы 08.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1.2 (УУР В, УДД 2): при продолжающемся кровотечении и невозможности определить источник — всем передняя тампонада, критерий качества 3; (УУР С, УДД 4): при кровотечении из задних отделов и неэффективности передней — передняя и задняя тампонада, наблюдение в стационаре; раздел 6: при задней тампонаде госпитализация обязательна; доля остановленных — игровая оценка" }
review: draft
