id: tx.thrombolysis
name: { ru: "Тромболизис при инфаркте" }
kind: drug
# фибринспецифичный тромболитик (АТХ B01AD — ферментные препараты): 157_5, приложения А3 и Б4
class: thrombolytic
route: iv
# тромболитик дорогой, ₽ — игровое число; в кассу лекарства пока не списываются (тариф — часть 39б)
cost: 45000
# только под монитором с дефибриллятором (157_5, раздел 3.1.3: ТЛТ при наличии наружного
# дефибриллятора и средств для сердечно-лёгочной реанимации): в смотровой приёмного
bedside: { equipment: [eq.monitor_defib] }
# сопровождение ТЛТ (раздел 3.2.3.1): АСК, клопидогрел и парентеральный антикоагулянт — эноксапарин
# натрия первого выбора (ЕОК IA), фондапаринукс натрия (IIaB) и гепарин натрия (IIbB) — замена;
# критерий качества 11 — сочетание АСК, ингибитора P2Y12 и антикоагулянта
companions: [tx.aspirin_acs, tx.clopidogrel, [tx.enoxaparin_acs, tx.fondaparinux, tx.heparin_iv]]
effects:
  # растворяет тромб в инфаркт-связанной артерии — только в первые 12 часов; насколько часто удаётся —
  # игровая оценка: в 157_5 доли успеха нет, успех — снижение подъёма ST на 50 % через 60–90 минут
  - { on: cond.acs, kind: cure, band: often, days: [0, 1], when: { type: [stemi], early: [yes] } }
  # вред при кровоизлиянии в мозг (spec 2026-10-chapter-3, часть 41в): кровь на КТ — абсолютное противопоказание
  # (814_1, раздел 2.4), тромболизис — одна из причин внутричерепного кровоизлияния (523_3, раздел 1.2);
  # кровотечение — игровая оценка
  - { on: cond.ich, kind: harm, band: usually, days: [0, 1] }
  - { on: cond.sah, kind: harm, band: usually, days: [0, 1] }
  # и при расслоении аорты (часть 43а): подозрение на расслоение — абсолютное противопоказание к тромболизису (157_5,
  # раздел 3.1.3); кровотечение и разрыв — игровая оценка
  - { on: cond.aortic_dissection, kind: harm, band: usually, days: [0, 1] }
contraindications:
  # кровотечение при противопоказании — игровая оценка
  - { id: risk.stroke_history, level: absolute, reaction: often }
  - { id: risk.recent_bleed_surgery, level: absolute, reaction: often }
  - { id: risk.bleeding_tendency, level: absolute, reaction: often }
  - { id: risk.anticoagulants, level: relative, reaction: sometimes }
texts:
  hint:
    ru: "Фибринспецифичный тромболитик в вену — тенектеплаза, алтеплаза, проурокиназа — растворяет тромб в артерии сердца. При инфаркте с подъёмом ST в первые 12 часов, если до вмешательства дальше 120 минут: в первые 10 минут после диагноза, под монитором, с АСК, клопидогрелом и антикоагулянтом, и сразу везти."
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.1.3 (ЕОК IA): если первичное ЧКВ невозможно в течение 120 минут от диагноза и прошло не более 12 часов от начала симптомов — ТЛТ в пределах 10 минут от диагноза, затем незамедлительный перевод в ЧКВ-центр; противопоказания — там же; приложение А3: тромболитики — алтеплаза, проурокиназа, рекомбинантный белок со стафилокиназой, стрептокиназа, тенектеплаза; рекомендуется предпочесть фибринспецифичные (ЕОК IB); раздел 3.2.3.1: АСК, клопидогрел и эноксапарин натрия при ТЛТ; критерий качества 2: ТЛТ не позднее 10 минут от диагноза" }
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 03.10.2026; тромболитическая терапия при ОКС без подъёма ST не рекомендуется" }
review: draft
