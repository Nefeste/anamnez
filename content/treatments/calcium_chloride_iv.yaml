id: tx.calcium_chloride_iv
name: { ru: "Кальция хлорид в вену" }
kind: drug
# кальция хлорид «имеет серьезные осложнения в виде некроза мягких тканей, в случае выхода раствора из сосудистого русла» (spec
# 2026-10-chapter-4, часть 56в; 627_3, раздел 7.1): предпочтителен кальция глюконат. В игре — вред; центрального катетера нет, доля
# некроза — игровая оценка. ₽ — игровое число
class: mineral.calcium
route: iv
cost: 80
effects:
  - { on: cond.hypocalcemia_acute, kind: harm, band: rarely, days: [0, 1] }
texts:
  hint:
    ru: "Тоже кальций в вену, но раствор едкий: если он выйдет из вены под кожу, ткани вокруг омертвеют. Поэтому при гипокальциемии выбирают кальция глюконат."
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 7.1: предпочтителен кальция глюконат, так как у кальция хлорида серьёзные осложнения — некроз мягких тканей при выходе раствора из сосудистого русла; для инфузии рекомендован центральный венозный катетер; доля некроза — игровая оценка" }
review: draft
