id: tx.loperamide
name: { ru: "Лоперамид" }
kind: drug
# противодиарейное средство, агонист периферических μ-опиоидных рецепторов (spec 2026-10-chapter-4, часть 49б): при острых
# кишечных инфекциях не рекомендовано (875_1, раздел 3.1.2); при шигеллёзе замедление моторики затягивает и утяжеляет
# болезнь (869_1, разделы 1.2 и 3.1.2), при энтероколите, вызванном C. difficile, — дилатация толстой кишки и перфорация
# (878_1, раздел 3.1). Вред — игровая оценка. ₽ — игровое число
class: antidiarrheal.opioid
route: oral
cost: 60
effects:
  - { on: cond.shigellosis, kind: harm, band: sometimes, days: [1, 3] }
  - { on: cond.cdiff, kind: harm, band: sometimes, days: [1, 3] }
contraindications: []
texts:
  hint:
    ru: "Останавливает понос, замедляя кишку. При кишечной инфекции его не дают: возбудитель и его токсины задерживаются в кишке. При шигеллёзе болезнь затягивается и тяжелеет, при энтероколите, вызванном C. difficile, кишка может раздуться и порваться."
sources:
  - { kind: guideline, title: "Острые кишечные инфекции (ОКИ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/875_1", note: "ID 875_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.2 (УУР C, УДД 5): не рекомендовано использование агонистов периферических μ-опиоидных рецепторов в качестве антидиарейного средства при ОКИ" }
  - { kind: guideline, title: "Шигеллез", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/869_1", note: "ID 869_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.2: не показаны препараты, снижающие моторику кишечника; раздел 1.2: у получающих их процесс затягивается и утяжеляется; доля вреда — игровая оценка" }
  - { kind: guideline, title: "Энтероколит, вызванный Clostridioides difficile (C. difficile)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/878_1", note: "ID 878_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1 (УУР C, УДД 5): не рекомендуется использовать препараты, снижающие моторику, например лоперамид, — дилатация толстой кишки, перфорация, рост смертности; доля вреда — игровая оценка" }
review: draft
