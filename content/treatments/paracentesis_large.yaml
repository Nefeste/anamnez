id: tx.paracentesis_large
name: { ru: "Лечебный парацентез" }
kind: procedure
class: drainage.ascites
# объёмный лапароцентез при напряжённом асците (spec 2026-10-chapter-4, часть 54а): «для облегчения их общего физического
# состояния, улучшения перфузии почек, уменьшения одышки» (715_2, раздел 3.2.1, УУР B, УДД 2) — за один сеанс, за 1–4 часа,
# без постоянного дренажа (УУР C, УДД 5); больше 5 л — с альбумином. У постели; ₽ — игровое число
cost: 1500
effects:
  # жидкость уходит сразу, но без мочегонного и диеты асцит возвращается (раздел 3.2.1): облегчение, игровая оценка
  - { on: cond.cirrhosis_ascites, kind: relieve, band: always, days: [0, 1], when: { grade: [tense] } }
texts:
  hint:
    ru: "Через прокол в боку живота за один раз выпускают несколько литров асцитической жидкости: сразу легче дышать, живот мягче. Больше 5 литров — вводят альбумин, иначе падает давление и страдают почки. Без мочегонного жидкость вернётся."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.1 (УУР B, УДД 2): лечебный парацентез при асците третьей степени — облегчение, перфузия почек, меньше одышки; безопасен, местные осложнения редки; больше 5 л — альбумин; за один сеанс без постоянного дренажа (УУР C, УДД 5); затем диуретики и диета; критерий качества 8; облегчение — игровая оценка" }
review: draft
