id: tx.tetanus_toxoid
name: { ru: "Анатоксин столбнячный" }
kind: drug
class: vaccine.tetanus
route: im
cost: 200
texts:
  hint:
    ru: "Прививка от столбняка при ране: заставляет иммунитет быстро выработать защиту. Нужна, если последняя прививка была больше 5 лет назад или записей о прививках нет; вводят до 20-го дня после травмы."
sources:
  - { kind: guideline, title: "СанПиН 3.3686-21 «Санитарно-эпидемиологические требования по профилактике инфекционных болезней»", org: "Главный государственный санитарный врач РФ", year: 2021, url: "https://base.garant.ru/400342149/", note: "постановление от 28.01.2021 № 4, в редакции от 25.07.2025; сверено 29.09.2026; глава XLV: п. 4156 — экстренная профилактика при любых травмах с нарушением целостности кожи и при укусах животными; п. 4157 — до 20 календарного дня после травмы; п. 4159–4160 — активно-пассивная профилактика и экстренная ревакцинация ранее привитых анатоксином" }
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; приложение А3.1: взрослым с полным курсом — не более 5 лет не вводят, более 5 лет — анатоксин; без документов — анатоксин с иммуноглобулином; после активно-пассивной профилактики — ревакцинация через 6 месяцев — 2 года" }
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 5 (УУР C, УДД 5): анатоксин столбнячный при открытой ране запястья и кисти; критерий качества 2" }
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1.17 (УУР C, УДД 5): экстренная профилактика столбняка всем с ожогами кожи, кроме случаев только гиперемии; препараты и схема в тексте не даны — по приложению А3.1 856_1" }
review: draft
