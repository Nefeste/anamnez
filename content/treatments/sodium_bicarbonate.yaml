id: tx.sodium_bicarbonate
name: { ru: "Натрия гидрокарбонат в вену" }
kind: drug
# ацидоз при отравлении метанолом и этиленгликолем (spec 2026-10-chapter-4, часть 57в): «Рекомендуется всем пациентам с острыми
# отравлениями метанолом и этиленгликолем с целью купирования метаболического ацидоза в/в инфузия натрия гидрокарбоната» (873_1,
# раздел 3.2, УУР С, УДД 5; критерий качества 23); ацидоз «представляет главную опасность для жизни пациента», и от того, как
# быстро его сняли, зависит зрение (там же). Причину не лечит; доз нет; ₽ — игровое
class: rehydration.alkali
route: iv
cost: 200
effects: []
texts:
  hint:
    ru: "Щелочной раствор в вену снимает метаболический ацидоз. При отравлении метанолом и этиленгликолем ацидоз — главная угроза жизни, и чем быстрее его сняли, тем больше зрения сохранится. Яд он не выводит: нужны антидот и гемодиализ."
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 3.2 (УУР С, УДД 5): натрия гидрокарбонат в вену — купировать метаболический ацидоз, большинство клинических токсикологов рекомендуют лечить его агрессивно; ацидоз — главная опасность для жизни, степень нарушения зрения зависит от того, как быстро он купирован; критерий качества 23" }
review: draft
