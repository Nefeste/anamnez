id: tx.gastric_lavage
name: { ru: "Промывание желудка и кишечника" }
kind: procedure
# ботулизм (spec 2026-10-chapter-4, часть 51в; 911_1): промывание желудка раствором натрия гидрокарбоната через зонд до чистых
# промывных вод и сифонные клизмы тем же раствором — удалить невсосавшийся токсин (раздел 3, УУР C, УДД 5; критерий качества 5);
# начинают ещё до больницы. При нарушении глотания жидкости — только зондом: опасна аспирация (раздел 3). На причину не
# действует — токсин в крови снимает антитоксин; ₽ — игровое число. С частью 57в — и при метаноле и этиленгликоле: зондовое промывание
# желудка «в ранние сроки» (873_1, раздел 3.1, УУР С, УДД 5; критерий качества 2), но спирты всасываются быстро — «эффективность этого
# мероприятия через несколько часов будет сомнительна» (там же)
cost: 500
texts:
  hint:
    ru: "Желудок промывают через зонд до чистой воды, при ботулизме и кишечник — сифонными клизмами: убирают яд, который ещё не всосался. При ботулизме — всем, ещё до больницы. Метанол и антифриз всасываются быстро: через несколько часов промывание вряд ли поможет. Не глотает — только зондом."
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3 (УУР C, УДД 5): лечение начинают на догоспитальном этапе — промывание желудка раствором натрия гидрокарбоната через желудочный зонд до чистых промывных вод и высокое промывание кишечника; при нарушении глотания жидкости — только зондом, из-за опасности аспирации; сифонные клизмы всем с подозрением (УУР C, УДД 5); критерий качества 5" }
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 3.1 (УУР С, УДД 5): зондовое промывание желудка при отравлении метанолом и этиленгликолем — в ранние сроки, с этапа скорой помощи, при коме и большой дозе; спирты быстро всасываются, через несколько часов эффективность сомнительна; критерий качества 2" }
review: draft
