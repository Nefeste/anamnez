id: tx.nasal_turunda
name: { ru: "Турунда с сосудосуживающим или кровоостанавливающим" }
kind: procedure
class: nasal.turunda
route: nasal
cost: 100
effects:
  # источник виден — анемизация симпатомиметиком или аппликация гемостатика (977_1, раздел 3.1.1,
  # УУР А, УДД 1; критерий качества 2); доля остановленных в тексте не дана — «обычно», игровая оценка
  - { on: cond.epistaxis, kind: cure, band: usually, days: [0, 0], when: { source: [anterior_visible] } }
texts:
  hint:
    ru: "Ватная турунда с ксилометазолином или эпинефрином к кровоточащему сосуду — он сужается; или с транексамовой кислотой, этамзилатом — кровь сворачивается. Годится, когда источник виден. При гипертонии и болезнях сердца сосудосуживающие — с осторожностью."
sources:
  - { kind: guideline, title: "Носовое кровотечение", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/977_1", note: "ID 977_1, опубликованы 08.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1.1 (УУР А, УДД 1): при продолжающемся кровотечении и обнаружении источника — анемизация слизистой симпатомиметиками (ксилометазолин, эпинефрин, оксиметазолин) или аппликация гемостатиков (транексамовая кислота, этамзилат) на турунде; с осторожностью при артериальной гипертензии и ИБС; критерий качества 2; доля остановленных — игровая оценка" }
review: draft
