id: tx.iodophenazone
name: { ru: "Йодофеназон внутрь" }
kind: drug
class: antiviral.tbe
route: oral
cost: 400
# профилактика клещевого энцефалита после присасывания (spec 2026-10-chapter-4, часть 51а; 567_2, раздел 5.1, УУР C, УДД 5;
# критерий качества 28): лицам после присасывания клещей, особенно привитым, обратившимся позже 3–4 дней и когда клеща не
# исследовать; ₽ — игровое число
texts:
  hint:
    ru: "Противовирусное средство внутрь после укуса клеща — для профилактики клещевого энцефалита. Особенно — когда иммуноглобулин уже не показан: прошло больше 3–4 дней, клеща не исследовали, или человек привит."
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 5.1: рекомендуется назначение йодофеназона внутрь лицам после присасывания клещей; целесообразен при противопоказаниях к вакцине и иммуноглобулину, привитым, при обращении позже 3–4 дней, при отсутствии возможности исследовать клеща" }
review: draft
