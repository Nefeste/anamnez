id: tx.lifestyle
name: { ru: "Изменение образа жизни" }
kind: regimen
cost: 0
effects:
  - { on: cond.gerd, kind: relieve, band: often, days: [7, 30] }
  - { on: cond.dyspepsia_functional, kind: relieve, band: sometimes, days: [7, 30] }
  - { on: cond.hypertension_new, kind: cure, band: sometimes, days: [30, 90] }
  - { on: cond.diabetes2_new, kind: cure, band: sometimes, days: [60, 180] }
  - { on: cond.tension_headache, kind: relieve, band: sometimes, days: [7, 30] }
  # запор (spec 2026-10-chapter-4, часть 55б): «изменение образа жизни (увеличение физической нагрузки), характера питания»
  # (274_3, раздел 3); критерий качества 2 — общие мероприятия. Как часто помогают одни они — игровая оценка
  - { on: cond.constipation, kind: cure, band: sometimes, days: [14, 60] }
texts:
  hint:
    ru: "Питание, снижение веса, физическая активность, отказ от курения, меньше алкоголя и соли. Основа лечения гипертонии и диабета 2 типа; при рефлюксе — не есть на ночь и поднять изголовье; при запоре — клетчатка, вода и движение, при СРК — есть регулярно, без спешки."
sources:
  - { kind: guideline, title: "Katz PO et al. ACG Clinical Guideline for the Diagnosis and Management of Gastroesophageal Reflux Disease. Am J Gastroenterol 2022;117(1):27–56", url: "https://pubmed.ncbi.nlm.nih.gov/34807007/" }
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 28.09.2026" }
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 28.09.2026" }
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3: лечение хронического запора — изменение образа жизни, питания и лекарства; раздел 5 (УУР С, УДД 5): питание с пищевыми волокнами, достаточно жидкости, высокая физическая активность; критерий качества 2; доля излечения — игровая оценка" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2: есть регулярно, без спешки, не пропускать приёмы пищи, пищевой дневник; умеренные физические нагрузки уменьшают симптомы" }
review: draft
