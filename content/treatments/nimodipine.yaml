id: tx.nimodipine
name: { ru: "Нимодипин внутрь" }
kind: drug
# при аСАК — внутрь или через назогастральный зонд 21 день; другие блокаторы кальциевых каналов и введение в
# вену для этого не рекомендуются (spec 2026-10-chapter-3, часть 41в; 523_3, раздел 3.2.1). Режим и дозы — не
# в игре; цена — игровое число
class: vascular.nimodipine
route: oral
cost: 800
texts:
  hint:
    ru: "Блокатор кальциевых каналов: при субарахноидальном кровоизлиянии из аневризмы его дают внутрь или через зонд 21 день — от спазма артерий мозга. Другие блокаторы кальциевых каналов и введение в вену для этого не рекомендуются."
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.2.1: нимодипин в таблетках внутрь или через назогастральный зонд в течение 21 дня; другие блокаторы кальциевых каналов и иные способы введения (в вену) не рекомендуются" }
