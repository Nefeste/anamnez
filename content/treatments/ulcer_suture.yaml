id: tx.ulcer_suture
name: { ru: "Ушивание прободной язвы" }
kind: surgery
class: surgery.abdominal
# расходники операции, ₽ — игровое число
cost: 11000
# ушивание закрывает отверстие; после операции — антибиотики 3–5 суток, ИПН в вену не больше 7 дней
# и таблетками до выписки (277_2, раздел 3.5): срока стационара в тексте нет, 5–8 суток — игровая оценка
effects:
  - { on: cond.perforated_ulcer, kind: cure, band: { pct: 100 }, days: [5, 8] }
# максимально раннее ушивание — лапароскопически при стабильном состоянии, иначе открыто (277_2,
# раздел 3.5). Смертность — по шкале Boey в 277_2 (Прил. Г8): без факторов риска — 1,5 %, с одним
# (перфорация давняя, больше 24 ч) — 14,4 %; каждый час от поступления до операции снижает
# вероятность выжить на 2,4 % по сравнению с предыдущим часом (277_2, раздел 3.5; Buck 2013);
# инфекционные осложнения — от 17 до 63 % (277_2, раздел 2.4) — середина; длительность — игровая оценка
surgery:
  room: room.or
  team: [role.surgeon, role.anesthetist, role.or_nurse]
  equipment: [eq.or_table, eq.anesthesia]
  minutes: 75
  complications: { pct: 40 }
  death: { pct: 1.5 }
  complicated: { complications: { pct: 40 }, death: { pct: 14.4 } }
  delay: { pct: 2.4 }
texts:
  hint: { ru: "Хирург зашивает отверстие в стенке желудка или двенадцатиперстной кишки — через проколы, если состояние стабильное, иначе через разрез. До разреза — антибиотик и зонд в желудок, после — антибиотики и лекарства, снижающие кислотность. Оперируют как можно раньше: каждый час ожидания снижает шанс выжить." }
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: инфекционные осложнения — от 17 до 63 %; раздел 3.5: экстренная операция, максимально раннее ушивание, каждый час задержки от поступления до операции снижает вероятность выживания на 2,4 % по сравнению с предыдущим часом, консервативное лечение не рекомендуется, антибиотик за 30–60 минут до разреза, после операции — 3–5 суток; Прил. Г8: шкала J. Boey — летальность 1,5 % без факторов риска и 14,4 % с одним" }
  - { kind: paper, title: "Buck DL, Vester-Andersen M, Møller MH. Surgical delay is a critical determinant of survival in perforated peptic ulcer. Br J Surg 2013;100(8):1045–1049", url: "https://pubmed.ncbi.nlm.nih.gov/23754645/", note: "PMID 23754645, сверено 29.09.2026: 2668 больных; каждый час от поступления до операции — на 2,4 % меньше вероятность выжить 30 дней по сравнению с предыдущим часом (скорректированный ОР 1,024)" }
review: draft
