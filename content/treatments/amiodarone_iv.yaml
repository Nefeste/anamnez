id: tx.amiodarone_iv
name: { ru: "Амиодарон в вену" }
kind: drug
# антиаритмический препарат III класса (spec 2026-10-chapter-3, часть 42а): медикаментозная кардиоверсия, в том
# числе при болезни сердца (382_2, раздел 3.1.2.2.3, ЕОК IA); вводят под мониторированием — у постели с
# монитором; ₽ — игровое число
class: antiarrhythmic.amiodarone
route: iv
cost: 800
bedside: { equipment: [eq.monitor_defib] }
# антикоагулянт — как при электрической: «независимо от метода восстановления синусового ритма» (раздел 3.1.1.2)
companions: [[tx.heparin_iv, tx.lmwh, tx.doac]]
effects:
  # ритм восстанавливается позже — через 8–12 часов (приложение А3, табл. П12); как часто — игровая оценка.
  # Стабильному при 48 часах и больше — как разряд: не лечит, а вредит
  - { on: cond.af, kind: cure, band: often, days: [0, 1], when: { recent: [yes] } }
  - { on: cond.af, kind: cure, band: often, days: [0, 1], when: { unstable: [yes] } }
  # ритм восстановился — и сгусток уходит так же, как после разряда; восстанавливает он реже: в игре — вдвое
  # меньше 5–7 из 100, игровая оценка
  - { on: cond.af, kind: harm, band: { pct: 3 }, days: [1, 5], when: { recent: [no], unstable: [no] }, as: cond.stroke_ischemic }
texts:
  hint:
    ru: "Антиаритмический препарат в вену под монитором: восстанавливает ритм при фибрилляции и трепетании предсердий, в том числе при болезни сердца, но не сразу — через 8–12 часов. Как и разряд, — только если аритмии меньше 48 часов или после трёх недель антикоагулянта."
sources:
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.2.2.3: амиодарон в/в — в том числе при структурном поражении сердца, восстановление ритма обычно позже (ЕОК IA); приложение А3, табл. П12: поздняя конверсия — 8–12 часов; раздел 3.1.1.2: антикоагулянт перед кардиоверсией — независимо от метода; раздел 3.1.2.1.2: при нестабильности — только если электрическая кардиоверсия недоступна или неэффективна; доли — игровая оценка" }
review: draft
