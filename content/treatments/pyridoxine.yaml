id: tx.pyridoxine
name: { ru: "Пиридоксин в вену" }
kind: drug
# отравление этиленгликолем (spec 2026-10-chapter-4, часть 57в): «При отравлении этиленгликолем с целью ускорения метаболизма»
# глиоксилата — пиридоксин и тиамин (873_1, раздел 3.2, УУР С, УДД 5): с витамином B6 глиоксиловая кислота переходит в глицин
# (раздел 1.2); пиридоксин вводят в вену (раздел 3.2). Критериев качества нет — в игре можно. Доз нет; ₽ — игровое
class: vitamin.pyridoxine
route: iv
cost: 60
effects: []
texts:
  hint:
    ru: "Витамин B6. При отравлении этиленгликолем помогает превратить ядовитую глиоксиловую кислоту в безвредный глицин; его дают вместе с тиамином. Антидот и гемодиализ он не заменяет."
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.2: глиоксилат превращается в глицин путём трансаминирования при участии витамина B6; раздел 3.2 (УУР С, УДД 5): при отравлении этиленгликолем — пиридоксин внутривенно и тиамин, ускорить метаболизм глиоксилата" }
