id: tx.nucleoside_analog
name: { ru: "Энтекавир или тенофовир" }
kind: drug
class: antiviral.nrti
# нуклеозиды и нуклеотиды — ингибиторы обратной транскриптазы (spec 2026-10-chapter-4, часть 52а): при остром гепатите B —
# тяжёлом и фульминантном — «с целью предотвращения развития осложнений и хронизации» (672_2, раздел 3.1.1, УУР B, УДД 3);
# при лёгком и среднем рекомендации нет. При гепатите A противовирусные не рекомендованы при любой тяжести (718_2, раздел
# 3.1.1, УУР C, УДД 5). Внутрь; ₽ — игровое число
route: oral
cost: 2500
effects:
  # доля излечения и срок — игровая оценка: в 672_2 чисел нет
  - { on: cond.hepatitis_b, kind: cure, band: usually, days: [14, 30], when: { severity: [severe, fulminant] } }
texts:
  hint:
    ru: "Противовирусные таблетки против вируса гепатита B: подавляют его размножение. При остром гепатите B — только при тяжёлой и молниеносной форме, чтобы печень не отказала. Гепатит A так не лечат: противовирусные ему не нужны."
sources:
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.1 (УУР B, УДД 3): пациентам с тяжёлым и фульминантным течением — нуклеозиды и нуклеотиды, ингибиторы обратной транскриптазы, энтекавир или тенофовир, для предотвращения осложнений и хронизации; доля излечения — игровая оценка" }
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.1 (УУР C, УДД 5): противовирусные препараты системного действия при гепатите A не рекомендованы независимо от тяжести" }
review: draft
