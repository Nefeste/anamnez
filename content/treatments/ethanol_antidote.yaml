id: tx.ethanol_antidote
name: { ru: "Этанол как антидот" }
kind: drug
# антидот метанола и этиленгликоля (spec 2026-10-chapter-4, часть 57в): «Высокое сродство #этанола к АДГ, а также относительно низкая
# собственная токсичность оправдывает его применение при отравлениях токсифицирующимися спиртами» (873_1, раздел 3.2, УУР С, УДД 5;
# критерий качества 21). Вводят через рот или в вену, через рот или зонд — «технически проще и безопасней» (там же). Только в
# стационаре: на этапе скорой помощи «не целесообразно» — без анализа не определить показания (там же). Доз нет; ₽ — игровое
class: antidote.alcohol
route: oral
cost: 150
effects:
  # «Если контролировать уровень этанола в крови невозможно, то его введение продолжается у пациентов с отравлением метанолом по
  # меньшей мере 3-5 суток при условии, если гемодиализ не проводился» (раздел 3.2): лёгкое отравление антидот у себя долечивает;
  # среднее и тяжёлое без гемодиализа — нет. Доля — игровая оценка
  - { on: cond.methanol_poisoning, kind: cure, band: always, days: [3, 5], when: { severity: [mild] } }
  - { on: cond.ethylene_glycol_poisoning, kind: cure, band: always, days: [3, 5], when: { severity: [mild] } }
texts:
  hint:
    ru: "Печень превращает метанол и этиленгликоль в ядовитые кислоты, а этанол занимает её фермент первым — и превращение тормозится. Антидот вводят в стационаре через рот, зонд или в вену, пока яд не выведен; при гемодиализе — обычно первые сутки."
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 3.2 (УУР С, УДД 5): антидот при отравлении метанолом и этиленгликолем — этанол, по сродству к алкогольдегидрогеназе тормозит превращение яда; показания — уровень выше 0,2 г/л, ацидоз с увеличенным анионным интервалом или клиника с анамнезом приёма; через рот или зонд проще и безопаснее, чем в вену; вводят только в стационаре; без контроля уровня при метаноле — не менее 3–5 суток, если гемодиализа не было, при гемодиализе — обычно первые сутки; критерий качества 21; доля — игровая оценка" }
review: draft
