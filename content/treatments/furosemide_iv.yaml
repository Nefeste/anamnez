id: tx.furosemide_iv
name: { ru: "Фуросемид в вену" }
kind: drug
# петлевой диуретик (АТХ C03CA; spec 2026-10-chapter-3, часть 43в): при ОДСН с накоплением жидкости, без выраженной
# гипотонии и гипоперфузии — «скорейшее внутривенное введение» (156_2, раздел 7.4.1.2); до ликвидации гипоперфузии —
# не рекомендуется (разделы 7.4.1.2 и 7.4.1.5). Укол в вену — и в кабинете, без монитора; режим и дозы — не в игре;
# ₽ — игровое число
class: diuretic.loop
route: iv
cost: 100
effects:
  # застой уходит за несколько дней — как часто и за сколько, игровая оценка (ALARM-HF: в стационаре умерли 12 %)
  - { on: cond.adhf, kind: cure, band: usually, days: [3, 7], when: { type: [congestion, edema] } }
texts:
  hint:
    ru: "Сильное мочегонное в вену: выводит лишнюю жидкость, снимает застой в лёгких и отёки. При острой сердечной недостаточности с застоем — сразу. Пока кожа холодная и давление низкое — нельзя: сначала восстанавливают кровоток."
sources:
  - { kind: guideline, title: "Хроническая сердечная недостаточность", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/156_2", note: "ID 156_2, опубликованы 07.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 7.4.1.2: при признаках накопления жидкости без выраженной гипотонии и гипоперфузии — скорейшее введение петлевых диуретиков в вену; до ликвидации гипоперфузии диуретики не рекомендуются; раздел 7.4.1.5: при недостаточном ответе — удвоить дозу и добавить тиазидный; критерий качества 8 (табл. 19); дозы опущены; как часто и за сколько дней — игровая оценка" }
review: draft
