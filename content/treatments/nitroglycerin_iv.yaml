id: tx.nitroglycerin_iv
name: { ru: "Нитроглицерин в вену" }
kind: drug
# периферический вазодилататор в вену (АТХ C01DA; spec 2026-10-chapter-3, часть 43а): при расслоении аорты — если
# после бета-адреноблокатора давление не снизилось (946_1, раздел 3.1.1), и только после него (приложение А3:
# «предварительно установив хронотропный контроль … чтобы избежать рефлекторной тахикардии»). В вену — у постели под
# монитором; режим и дозы — не в игре; ₽ — игровое число
class: antianginal.nitrate
route: iv
cost: 300
bedside: { equipment: [eq.monitor_defib] }
# при расслоении — только вместе с урежающим пульс: бета-адреноблокатором, при противопоказаниях — верапамилом
# (946_1, раздел 3.1.1)
companions: [[tx.beta_blocker_iv, tx.verapamil_iv]]
companionsFor: [cond.aortic_dissection]
effects:
  # снижает давление, причину не лечит; как часто — игровая оценка
  - { on: cond.aortic_dissection, kind: relieve, band: usually, days: [0, 0] }
  # острая сердечная недостаточность (часть 43в): при отёке лёгких и САД выше 110 — для облегчения одышки и уменьшения
  # застоя (156_2, раздел 7.4.1.5); насколько — игровая оценка
  - { on: cond.adhf, kind: cure, band: often, days: [1, 5], when: { type: [edema] } }
  - { on: cond.adhf, kind: relieve, band: sometimes, days: [0, 1], when: { type: [congestion] } }
texts:
  hint:
    ru: "Капельно в вену под монитором: расширяет сосуды и снижает давление. При отёке лёгких с высоким давлением — сразу, вместе с мочегонным. При расслоении аорты — второй шаг, если давление высокое и после бета-адреноблокатора, и только после него: иначе пульс участится. При низком давлении нельзя."
sources:
  - { kind: guideline, title: "Расслоение аорты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/946_1", note: "ID 946_1, опубликованы 23.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1: при неудовлетворительном контроле АД после бета-адреноблокаторов — добавить внутривенно нитроглицерин; не рекомендуется при гипотонии; приложение А3: периферические вазодилататоры — после хронотропного контроля бета-адреноблокаторами, чтобы избежать рефлекторной тахикардии" }
review: draft
