id: tx.coloproctologist_consult
name: { ru: "Консультация колопроктолога" }
kind: procedure
# при сверхтяжёлой атаке язвенного колита больного с поступления наблюдают «врачом-гастроэнтерологом и врачом-колопроктологом
# (врачом-хирургом) для решения вопроса о целесообразности выполнения хирургического вмешательства в течение 24 часов» (spec
# 2026-10-chapter-4, часть 55а; 193_2, раздел 3.1.7). В игре — назначение в решении: колопроктолог осматривает больного в
# стационаре; цена — игровое число
class: consult.coloproctologist
cost: 1500
texts:
  hint:
    ru: "Хирург-колопроктолог оперирует толстую кишку. При сверхтяжёлой атаке язвенного колита он наблюдает больного с первого дня вместе с гастроэнтерологом: если глюкокортикоиды не помогают, решение об удалении кишки принимают в первые 24 часа."
sources:
  - { kind: guideline, title: "Язвенный колит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/193_2", note: "ID 193_2, опубликованы 29.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.7: при сверхтяжёлой атаке — госпитализация в многопрофильный стационар, наблюдение гастроэнтеролога и колопроктолога (хирурга) для решения вопроса об операции в течение 24 часов, оценка каждые 24 часа; при ухудшении колэктомия — единственный путь спасения жизни" }
review: draft
