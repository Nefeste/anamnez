id: tx.hip_block
name: { ru: "Блокада нервов при переломе бедра" }
kind: procedure
class: analgesic.nerve_block
# местный анестетик и работа, ₽ — игровое число
cost: 1500
effects:
  # периферические блокады — бедренного нерва, подвздошной фасции, PENG — часть мультимодальной
  # анальгезии (980_1, раздел 3.5, УУР A, УДД 1): боль, делирий и лёжка меньше; на сращение не действует
  - { on: cond.femoral_neck_fracture, kind: relieve, band: usually, days: [0, 1] }
texts:
  hint:
    ru: "Местный анестетик под контролем УЗИ вводят рядом с нервами бедра — бедренного нерва, под подвздошную фасцию или перикапсулярно (PENG). Боль стихает за минуты и без угнетения сознания; реже делирий. Сам перелом блокада не лечит."
sources:
  - { kind: guideline, title: "Переломы проксимального отдела бедренной кости", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/980_1", note: "ID 980_1, опубликованы 10.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.5: периферические блокады нервов — блок бедренного нерва, подвздошной фасции, PENG — как часть мультимодальной анальгезии (УУР A, УДД 1); уменьшают боль, риск делирия и респираторных инфекций; не требуют прекращения антикоагулянтов; рекомендована УЗ-навигация; обезболивание — не позднее 30 минут после поступления" }
review: draft
