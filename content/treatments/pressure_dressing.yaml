id: tx.pressure_dressing
name: { ru: "Давящая повязка" }
kind: procedure
class: wound.dressing
cost: 150
# первая мера при кровотечении из раны (spec 2026-10-first-measures, часть 95): кровотечение останавливает, рану не лечит —
# её обрабатывают и зашивают (733_2, раздел 3.2); насколько облегчает — игровая оценка
effects:
  - { on: cond.head_wound, kind: relieve, band: usually, days: [0, 1], when: { extent: [large] } }
contraindications: []
texts:
  hint:
    ru: "Стерильная салфетка, смоченная солевым раствором, на рану и тугой бинт поверх: давление останавливает кровотечение, пока рану не обработали и не зашили. Кровь, которая уже потеряна, повязка не вернёт."
sources:
  - { kind: guideline, title: "Об утверждении Порядка оказания первой помощи (приказ № 220н)", org: "Минздрав России", year: 2024, note: "приказ от 03.05.2024 № 220н, зарегистрирован в Минюсте России 31.05.2024 № 78363; приложение 2, пункт 2: временная остановка наружного кровотечения — прямое давление на рану, остановлено — давящая повязка, жгут — при обширном повреждении или отрыве конечности; пункт 9: контроль сознания, дыхания, кровообращения и отсутствия наружного кровотечения; сверено 25.10.2026" }
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 25.10.2026; раздел 1.2: кровотечение из раны головы — до анемии, гиповолемии и гипотензии; раздел 1.6: кровотечение бывает интенсивным, до геморрагического шока; раздел 3.2, комментарий: при продолжающемся кровотечении, пока нельзя оперировать, — стерильная давящая повязка, смоченная раствором натрия хлорида, на 30–60 минут; раздел 6: на догоспитальном этапе — асептическая повязка, при продолжающемся кровотечении — компрессия, достаточная для его прекращения" }
review: draft
