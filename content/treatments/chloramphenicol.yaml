id: tx.chloramphenicol
name: { ru: "Хлорамфеникол" }
kind: drug
class: antibiotic.amphenicol
# ботулизм (spec 2026-10-chapter-4, часть 51в; 911_1, раздел 3.1.2, УУР C, УДД 4): антибиотик всем с подозрением — подавить
# клостридии в кишечнике и не дать им выработать новый токсин; используется хлорамфеникол (путь в игре — одной строкой). Токсин,
# который уже в крови, не снимает — на причину в игре не действует; ₽ — игровое число
cost: 300
texts:
  hint:
    ru: "Давний антибиотик широкого спектра. При ботулизме — всем с подозрением: подавляет клостридии, оставшиеся в кишечнике, чтобы они не выработали новый токсин. Токсин, который уже в крови, не снимает — для этого антитоксин."
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.2 (УУР C, УДД 4): антибактериальные препараты системного действия всем пациентам с подозрением на ботулизм — для подавления возбудителя в ЖКТ и предупреждения образования токсина; используется хлорамфеникол; при раневом ботулизме — бензилпенициллин" }
review: draft
