id: tx.ppi
name: { ru: "Ингибиторы протонной помпы (омепразол, пантопразол)" }
kind: drug
class: acid.ppi
route: oral
cost: 250
effects:
  - { on: cond.gerd, kind: cure, band: usually, days: [3, 10] }
  - { on: cond.dyspepsia_functional, kind: cure, band: often, days: [7, 21] }
  # язва заживает на ИПН за 4–6 недель (spec 2026-10-chapter-4, часть 53б; 277_2, раздел 3.2); полоса — игровая оценка
  - { on: cond.peptic_ulcer, kind: cure, band: usually, days: [28, 42] }
texts:
  hint:
    ru: "Снижают выработку кислоты в желудке. Основное лечение рефлюксной болезни, диспепсии и язвы: изжога проходит за несколько дней, язва заживает за 4–6 недель. Долго без показаний их не принимают. С курсом НПВП при перикардите — для защиты желудка, с первых часов."
sources:
  - { kind: guideline, title: "Katz PO et al. ACG Clinical Guideline for the Diagnosis and Management of Gastroesophageal Reflux Disease. Am J Gastroenterol 2022;117(1):27–56", url: "https://pubmed.ncbi.nlm.nih.gov/34807007/" }
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2 (УУР C, УДД 5): ИПН 4–6 недель при обострении для заживления язвы; продолжительность — по эндоскопическому контролю" }
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1: проведение гастропротекции с первых часов лечения острого перикардита обязательно" }
review: draft
