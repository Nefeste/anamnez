id: tx.insulin_iv
name: { ru: "Инсулин короткого действия в вену" }
kind: drug
# кетоацидоз и гиперосмолярное состояние (spec 2026-10-urticaria-dka, часть 73): инсулин короткого (ультракороткого,
# сверхбыстрого) действия в вену, «режим малых доз» — капельно через инфузомат или ежечасно в порт системы (Алгоритмы, 11-й
# выпуск, 2023, с. 45). Доз и скоростей в игре нет; ₽ — игровое число
class: hormone.insulin
route: iv
cost: 300
effects:
  # «Этиологическое лечение метаболического ацидоза при ДКА – инсулин» (с. 47); разрешение — глюкоза ниже 11 и выправленный
  # ацидоз (там же). Доля и сроки — игровая оценка
  - { on: cond.dka, kind: cure, band: usually, days: [1, 3] }
  # при ГГС — вначале не вводят или в очень малых дозах, позже — как при ДКА, если гипергликемия держится (с. 48): облегчение,
  # главное — растворы; игровая оценка
  - { on: cond.hhs, kind: relieve, band: often, days: [0, 1] }
texts:
  hint:
    ru: "Инсулин короткого действия в вену малыми дозами — главное лечение кетоацидоза. Вместе с ним — солевой раствор и калий: при лечении калий в крови падает. При гиперосмолярном состоянии вначале — растворы, инсулин — позже и осторожно."
sources:
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом. 11-й выпуск", org: "Под ред. И.И. Дедова, М.В. Шестаковой, А.Ю. Майорова", year: 2023, url: "https://doi.org/10.14341/DM13042", note: "Сахарный диабет. 2023;26(2S):1–157, сверено 15.10.2026; раздел 8.1, с. 45–47: инсулинотерапия — режим малых доз, ИКД (ИУКД, ИСБД) в вену болюсно и далее непрерывно или ежечасно; в мышцу — только без доступа в вену; калий — одновременно с инсулином; этиологическое лечение ацидоза — инсулин; раздел 8.2, с. 48: при ГГС в начале инфузионной терапии инсулин не вводят или вводят в очень малых дозах; доля и сроки — игровая оценка; дозы и скорости опущены" }
review: draft
