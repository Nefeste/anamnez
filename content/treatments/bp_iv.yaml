id: tx.bp_iv
name: { ru: "Снижение давления препаратом в вену" }
kind: drug
# группы, названные в 523_3 (spec 2026-10-chapter-3, часть 41в): при внутримозговой гематоме — селективные
# блокаторы кальциевых каналов с преимущественным действием на сосуды (АТХ C08C), ингибиторы АПФ (C09AA),
# бета-адреноблокаторы (C07A) и альфа-адреноблокаторы (C02CA), при непрерывном мониторинге (раздел 3.1.1);
# при субарахноидальном кровоизлиянии — нимодипин или урапидил (раздел 3.2.1). У постели под монитором;
# режим и дозы — не в игре; цена — игровое число
class: antihypertensive.iv
route: iv
cost: 1500
bedside: { equipment: [eq.monitor_defib] }
texts:
  hint:
    ru: "Урапидил, блокаторы кальциевых каналов, ингибиторы АПФ, бета-адреноблокаторы — в вену под монитором. При кровоизлиянии в мозг верхнее давление снижают ниже 140 в первый час, но не ниже 130 и не быстрее чем на 60 в час; при субарахноидальном — ниже 160."
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.1 (УУР B): при гипертензивной ВМГ снижать систолическое давление ниже 140 в первые 6 часов, цель — в течение часа от начала лечения, не быстрее 60 мм рт. ст. в час, не ниже 130, держать 7 дней; группы препаратов в вену при непрерывном мониторинге; раздел 3.2.1: при аСАК систолическое ниже 160 — нимодипин или урапидил" }
review: draft
