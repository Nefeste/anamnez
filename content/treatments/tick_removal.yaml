id: tx.tick_removal
name: { ru: "Удаление клеща" }
kind: procedure
class: wound.tick
cost: 300
# клеща удаляют немедленно, целиком, не раздавив, и отдают на исследование (spec 2026-10-chapter-4, часть 51а; 566_2, раздел 5.2;
# 567_2, приложение В); ₽ — игровое число
texts:
  hint:
    ru: "Клеща захватывают пинцетом или нитью у самой кожи и выкручивают, не раздавив; головку, если осталась, удаляют иглой. Ранку обрабатывают антисептиком, клеща кладут в баночку с влажным тампоном — на исследование. Чем раньше удалён клещ, тем меньше риск заражения."
sources:
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 5.2: удалить немедленно, чем раньше клещ удалён, тем меньше вероятность заражения; пинцетом или нитью, раскачивающе-выкручивающими движениями, избегать раздавливания" }
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; приложение В: при отрыве головки инфицирование может продолжаться — головку удаляют иглой; после — антисептик; клеща — в ёмкость с влажным тампоном на исследование" }
review: draft
