id: tx.metronidazole
name: { ru: "Метронидазол" }
kind: drug
# при энтероколите, вызванном C. difficile (spec 2026-10-chapter-4, часть 49б; 878_1, разделы 3.1.2–3.1.4): внутрь — при
# лёгком течении, если ванкомицин назначить нельзя; в вену — при осложнённом, вместе с ванкомицином внутрь. Эффективность
# ниже ванкомицина, при повторных курсах — нейротоксичность. Доли — игровая оценка. ₽ — игровое число
class: antibiotic.nitroimidazole
route: oral
cost: 150
effects:
  - { on: cond.cdiff, kind: cure, band: often, days: [3, 7], when: { severity: [mild] } }
  - { on: cond.cdiff, kind: relieve, band: often, days: [1, 3], when: { severity: [severe, critical] } }
contraindications: []
texts:
  hint:
    ru: "Антибиотик против анаэробов. При энтероколите, вызванном C. difficile, — запасной: внутрь при лёгком течении, если ванкомицин дать нельзя; при осложнённом — в вену вместе с ванкомицином внутрь. Действует слабее ванкомицина."
sources:
  - { kind: guideline, title: "Энтероколит, вызванный Clostridioides difficile (C. difficile)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/878_1", note: "ID 878_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.2 (УУР C, УДД 5): внутрь при лёгком течении без факторов риска тяжёлого, если ванкомицин назначить нельзя; раздел 3.1.3: при тяжёлом — в вену, если ванкомицин внутрь невозможен; раздел 3.1.4: при осложнённом — в вену вместе с ванкомицином 10 дней; меньшая эффективность и нейротоксичность при повторном применении; доли — игровая оценка" }
review: draft
