id: tx.amoxicillin
name: { ru: "Амоксициллин" }
kind: drug
class: antibiotic.penicillin
route: oral
cost: 150
effects:
  - { on: cond.strep_pharyngitis, kind: cure, band: usually, days: [1, 3] }
  - { on: cond.pneumonia_cap, kind: cure, band: usually, days: [2, 4] }
  - { on: cond.sinusitis_bacterial, kind: cure, band: usually, days: [2, 5] }
contraindications:
  - { id: risk.allergy_penicillin, level: absolute, reaction: often }
texts:
  hint:
    ru: "Антибиотик пенициллинового ряда: препарат выбора при стрептококковой ангине, бактериальном синусите и нетяжёлой пневмонии. На вирусы не действует; при аллергии на пенициллины опасен."
sources:
  - { kind: guideline, title: "Внебольничная пневмония у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/654_2", note: "ID 654_2, опубликованы 23.12.2024, применяются; сверено с рубрикатором 28.09.2026" }
  - { kind: guideline, title: "Острый тонзиллит и фарингит (Острый тонзиллофарингит)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/306_3", note: "ID 306_3, опубликованы 31.10.2024, применяются; сверено с рубрикатором 28.09.2026" }
