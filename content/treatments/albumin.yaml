id: tx.albumin
name: { ru: "Альбумин в вену" }
kind: drug
# раствор альбумина человека 20 или 25 % (АТХ B05AA01; spec 2026-10-chapter-4, часть 54а): после лечебного парацентеза больше
# 5 л — «в целях профилактики циркуляторных расстройств» (715_2, раздел 3.2.1, УУР B, УДД 2; раздел 5.2.4, УУР A, УДД 1); при
# спонтанном бактериальном перитоните — вместе с антибиотиком: гепаторенальный синдром — с 30 до 10 %, смертность — с 29 до
# 10 % (раздел 3.2.5, УУР A, УДД 1). Болезнь он не лечит — предупреждает осложнения. Дозы — не в игре (ADR 0012); ₽ —
# игровое число
class: plasma.albumin
route: iv
cost: 4000
effects: []
texts:
  hint:
    ru: "Белок плазмы крови в капельнице: удерживает жидкость в сосудах. При циррозе его вводят после того, как из живота выпустили много жидкости, и при инфекции асцита — так почки не отказывают и выживают чаще."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.1 (УУР B, УДД 2): после парацентеза больше 5 л — высокодозный альбумин, только 20 или 25 %; раздел 3.2.5 (УУР A, УДД 1): при инфицированном асците — альбумин, ГРС-ОПП с 30 до 10 %, смертность с 29 до 10 %; раздел 5.2.4: при напряжённом асците — лечебный парацентез с альбумином (УУР A, УДД 1), при СБП — альбумин к антибиотику для профилактики ГРС-ОПП (УУР B, УДД 2); критерии качества 10 и 14; дозы опущены" }
review: draft
