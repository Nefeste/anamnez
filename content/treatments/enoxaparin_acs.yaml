id: tx.enoxaparin_acs
name: { ru: "Эноксапарин натрия в вену и под кожу" }
kind: drug
# парентеральный антикоагулянт (группа B01A) — низкомолекулярный гепарин
class: anticoagulant.lmwh
route: sc
cost: 1500
effects:
  # ОКС без подъёма ST в своей палате интенсивной терапии (spec 2026-10-chapter-3, часть 39в): антикоагулянт снижает риск смерти и
  # инфаркта (154_4, раздел 3.2.3.2, ЕОК IA) —
  # игровая оценка: в рекомендации долей нет
  - { on: cond.acs, kind: cure, band: usually, days: [1, 3], when: { type: [nste] } }
texts:
  hint:
    ru: "Антикоагулянт: не даёт тромбу в артерии сердца расти. При инфаркте с подъёмом ST — всем, как можно раньше; при тромболизисе эноксапарин натрия — первого выбора, гепарин натрия и фондапаринукс натрия — замена. При ОКС без подъёма ST, если лечат здесь, первым — фондапаринукс натрия, эноксапарин натрия — когда его нет."
sources:
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.2.3.1 (ЕОК IA): парентеральные антикоагулянты — всем с ИМпST независимо от стратегии лечения, с максимально ранним началом; для сопровождения ТЛТ первого выбора — эноксапарин натрия (ЕОК IA), фондапаринукс натрия (IIaB), гепарин натрия (IIbB)" }
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 04.10.2026; раздел 3.2.3.2: парентеральный антикоагулянт — для снижения риска смерти и инфаркта (ЕОК IA); при коронарографии в первые 24 часа — гепарин натрия или эноксапарин натрия (ЕОК IIaB); без ранней коронарографии — фондапаринукс натрия (ЕОК IB), если его нет — эноксапарин натрия" }
review: draft
