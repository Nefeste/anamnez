id: tx.narcologist_consult
name: { ru: "Консультация психиатра-нарколога" }
kind: procedure
# «при обращении пациента с ААС в медицинскую организацию… выполнить прием (осмотр, консультацию) врачом-психиатром-
# наркологом» (spec 2026-10-chapter-4, часть 54б; 784_1, раздел 6, УУР C, УДД 5; критерий качества 1). В игре — назначение в
# решении: в стационаре нарколог смотрит больного, дома — направление к нему. Цена — игровое число. С частью 54б — при
# алкогольном гепатите: «пациентов с АБП при подозрении на алкогольную зависимость направить к врачу-психиатру-наркологу»
# (711_2, раздел 3.1, УУР C, УДД 5)
class: consult.narcologist
cost: 1200
texts:
  hint:
    ru: "Психиатр-нарколог лечит саму зависимость от алкоголя: без этого синдром отмены вернётся с новым запоем. При синдроме отмены и алкогольном гепатите его консультация обязательна — в стационаре осмотр, дома — направление."
sources:
  - { kind: guideline, title: "Психические и поведенческие расстройства, вызванные употреблением алкоголя. Синдром отмены алкоголя (алкогольное абстинентное состояние)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/784_1", note: "ID 784_1, опубликованы 20.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 6 (УУР C, УДД 5): при обращении пациента с синдромом отмены — приём (осмотр, консультация) врача-психиатра-нарколога; критерий качества 1" }
  - { kind: guideline, title: "Алкогольная болезнь печени", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/711_2", note: "ID 711_2, опубликованы 30.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1 (УУР C, УДД 5): пациентов с АБП при подозрении на алкогольную зависимость направить к врачу-психиатру-наркологу для совместного ведения и лечения" }
review: draft
