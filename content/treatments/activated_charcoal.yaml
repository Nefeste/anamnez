id: tx.activated_charcoal
name: { ru: "Активированный уголь" }
kind: drug
# энтеросорбент (spec 2026-10-chapter-4, часть 57в): «Не рекомендуется всем пациентам с острыми отравлениями метанолом и
# этиленгликолем с целью энтеросорбции применение активированного угля»: он «практически не сорбирует или очень слабо сорбирует
# спирты» (873_1, раздел 3.1, УУР С, УДД 5). Доз нет; ₽ — игровое
class: antidiarrheal.adsorbent
route: oral
cost: 30
effects: []
texts:
  hint:
    ru: "Порошок или таблетки, которые связывают в кишечнике часть ядов. Спирты он почти не связывает: при отравлении метанолом и этиленгликолем рекомендация его не советует."
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 3.1 (УУР С, УДД 5): активированный уголь при отравлении метанолом и этиленгликолем не рекомендуется — практически не сорбирует или очень слабо сорбирует спирты" }
review: draft
