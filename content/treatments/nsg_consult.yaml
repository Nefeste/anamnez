id: tx.nsg_consult
name: { ru: "Консультация нейрохирурга" }
kind: procedure
# в том числе по телемедицине или выездной нейрохирургической бригадой — в первые 60 минут после КТ с кровью:
# решение о переводе в нейрохирургию (spec 2026-10-chapter-3, часть 41в; 523_3, раздел 6, критерий качества 2).
# В игре — назначение в решении: решает о переводе вместе с врачом; цена — игровое число
class: consult.neurosurgeon
cost: 1500
texts:
  hint:
    ru: "Нейрохирург смотрит КТ — по телемедицине или с выездной бригадой — в первые 60 минут после КТ с кровью: нужна ли операция и куда переводить. Гематома больше 30 см³ со смещением — операция, кровь в бороздах и цистернах — перевод: аневризму выключают в первые 72 часа."
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 2: осмотр нейрохирурга не позднее 60 минут от получения результатов КТ; раздел 6: консультация нейрохирурга, в том числе с телемедицинскими технологиями, в течение 60 минут — решить о переводе в нейрохирургический стационар, круглосуточно — выездные нейрохирургические бригады; критерий качества 2" }
review: draft
