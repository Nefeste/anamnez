id: tx.anesthetic_iv
name: { ru: "Наркоз в вену: мидазолам, пропофол или тиопентал натрия" }
kind: drug
# третья очередь при рефрактерном эпилептическом статусе (spec 2026-10-chapter-4, часть 47; 741_1, табл. 10: в/в
# препараты третьей линии — мидазолам, пропофол, тиопентал натрия, кетамин; неспецифическая терапия — по принципам
# реанимационного отделения). Пропофол и тиопентал натрия угнетают дыхание — в игре только в реанимации, вместе с ИВЛ;
# кетамин «редко используется в качестве монотерапии» — в группу не вошёл. Доз и схем в игре нет (ADR 0012); ₽ —
# игровое число
class: anesthetic.iv
route: iv
cost: 3000
bedside: { equipment: [eq.ventilator] }
place: ricu
companions: [tx.ventilation]
effects:
  # рефрактерный статус приступы останавливает часто; в проспективном исследовании Novy 2010 из рефрактерных умерли
  # 39 % против 11 % — насколько помогает наркоз, игровая оценка
  - { on: cond.status_epilepticus, kind: cure, band: often, days: [5, 12], when: { refractory: [yes] } }
texts:
  hint:
    ru: "Анестетик в вену — третья очередь при эпилептическом статусе, который не остановили бензодиазепин и вальпроевая кислота. Он угнетает дыхание, поэтому только в реанимации и вместе с ИВЛ."
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6.7: рефрактерный статус — не купируется препаратами первой и второй очереди, дольше 60 минут; блок «Оказание медицинской помощи пациенту с эпилептическим статусом»: пропофол и тиопентал натрия — препараты третьей очереди (УУР C, УДД 5), угнетают дыхание; табл. 10: рефрактерный генерализованный — в/в препараты третьей линии, неспецифическая терапия по принципам реанимационного отделения; доз и схем в игре нет (ADR 0012)" }
  - { kind: paper, title: "Novy J, Logroscino G, Rossetti AO. Refractory status epilepticus: a prospective observational study. Epilepsia 2010;51(2):251–256", url: "https://pubmed.ncbi.nlm.nih.gov/19817823/", note: "PMID 19817823, сверено 06.10.2026: 128 эпизодов у взрослых, рефрактерных — 29 (22,6 %); смертность 39 % против 11 % у нерефрактерных; наркоз понадобился 12 из 29 (41 %)" }
review: draft
