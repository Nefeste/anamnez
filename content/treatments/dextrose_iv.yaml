id: tx.dextrose_iv
name: { ru: "Декстроза в вену струйно" }
# раствор декстрозы в вену струйно — при тяжёлой гипогликемии до восстановления сознания (spec 2026-10-chapter-3,
# часть 44а; 290_2, раздел 3.7); концентрация и объём — не в игре (ADR 0012); ₽ — игровое число
kind: drug
class: glucose.iv
route: iv
cost: 150
effects:
  # насколько помогает — игровая оценка; не пришёл в себя — капельница (tx.dextrose_infusion)
  - { on: cond.hypoglycemia, kind: cure, band: usually, days: [0, 0] }
texts:
  hint:
    ru: "Концентрированный раствор декстрозы (глюкозы) в вену: при тяжёлой гипогликемии сознание возвращается за минуты. Не пришёл в себя — капельница с декстрозой и стационар. В сознании хватает сахара внутрь."
sources:
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7 (УУР C, УДД 4): при тяжёлой гипогликемии — раствор декстрозы в/в струйно для восстановления сознания; если сознание не восстанавливается — в/в капельно и госпитализировать; насколько помогает — игровая оценка" }
review: draft
