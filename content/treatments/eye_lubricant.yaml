texts:
  hint:
    ru: "Капли искусственной слезы несколько раз в день и гель на ночь: когда глаз не закрывается, роговица сохнет. Без них — кератит и язва роговицы."
sources:
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.2.1 (УУР C, УДД 5): раннее назначение неврологом искусственных слёз и других индифферентных препаратов (капли, гели) днём и в ночное время при неосложнённом лагофтальме; днём — искусственная слеза, на ночь — декспантенол" }
