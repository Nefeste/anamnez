id: tx.patella_orif
name: { ru: "Остеосинтез надколенника" }
kind: surgery
class: surgery.bone
# спицы, проволока, винты и расходники, ₽ — игровое число
cost: 18000
effects:
  # смещение 2 мм и больше, ступенька больше 2 мм, утрата активного разгибания — операция (970_1,
  # раздел 3.2): спицы или канюлированные винты со стягивающей петлёй (УУР A, УДД 2); несостоятельность
  # фиксации — 5,2 %, инфекция — 2,3 % (раздел 3.2: Hsu et al., 170 больных)
  - { on: cond.patella_fracture, kind: cure, band: { pct: 94.8 }, days: [3, 5] }
# в игре оперирует хирург — травматолога-ортопеда в штате нет; 75 минут — игровая оценка
surgery:
  room: room.or
  team: [role.surgeon, role.anesthetist, role.or_nurse]
  equipment: [eq.or_table, eq.anesthesia]
  minutes: 75
  complications: { pct: 2.3 }
texts:
  hint:
    ru: "Отломки надколенника сводят и стягивают спицами и проволочной петлёй или винтами: восстанавливается разгибание колена. Нужна, когда отломки разошлись на 2 мм и больше или человек не может сам разогнуть ногу."
sources:
  - { kind: guideline, title: "Переломы надколенника", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/970_1", note: "ID 970_1, опубликованы 25.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2 (УУР C, УДД 5): показания — диастаз 2 мм и более, ступенька больше 2 мм, остеохондральные переломы со свободными фрагментами, утрата активного разгибания, политравма, неудача консервативного лечения; остеосинтез спицами или канюлированными винтами со стягивающей петлёй (УУР A, УДД 2); по Hsu et al. (170 больных) — несостоятельность фиксации 5,2 %, инфекция 2,3 %; раздел 4: выписка на 3–5-й день; раздел 6: смещение — экстренная госпитализация" }
review: draft
