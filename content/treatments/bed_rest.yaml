id: tx.bed_rest
name: { ru: "Постельный режим" }
kind: regimen
cost: 0
texts:
  hint:
    ru: "Лежать несколько дней. При боли в спине и при сотрясении головного мозга это не помогает и задерживает выздоровление; при простуде достаточно просто больше отдыхать. При геморрагической лихорадке с почечным синдромом — наоборот: строгий постельный режим до конца полиурии."
sources:
  - { kind: review, title: "Dahm KT et al. Advice to rest in bed versus advice to stay active for acute low-back pain and sciatica. Cochrane Database Syst Rev 2010;(6):CD007612" }
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1 (УУР C, УДД 5): постельный режим с исключением всей внешней стимуляции не рекомендован — не улучшает восстановление, может затянуть его" }
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3: строгий постельный режим до конца полиурии при среднетяжёлом и тяжёлом течении; раздел 3.1.2 (УУР С, УДД 5): базисная терапия всем независимо от тяжести — постельный режим, диета, питьё с учётом диуреза; приложение В: при лёгкой — 7–10 дней, среднетяжёлой — 2–3 недели, тяжёлой — не менее 3–4 недель от начала" }
review: draft
