id: tx.bed_rest
name: { ru: "Постельный режим" }
kind: regimen
cost: 0
texts:
  hint:
    ru: "Лежать несколько дней. При боли в спине и при сотрясении головного мозга это не помогает и задерживает выздоровление; при простуде достаточно просто больше отдыхать."
sources:
  - { kind: review, title: "Dahm KT et al. Advice to rest in bed versus advice to stay active for acute low-back pain and sciatica. Cochrane Database Syst Rev 2010;(6):CD007612" }
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1 (УУР C, УДД 5): постельный режим с исключением всей внешней стимуляции не рекомендован — не улучшает восстановление, может затянуть его" }
