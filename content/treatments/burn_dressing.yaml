id: tx.burn_dressing
name: { ru: "Туалет ожоговой раны и повязка" }
kind: procedure
class: wound.burn
cost: 500
effects:
  # I–II степень до 10 % — туалет раны и атравматичная повязка или повязка с влажной средой (687_3,
  # раздел 3.2.2); I с пузырями заживает до 10 дней, II — за 18–20 дней (раздел 1.5); «обычно» —
  # игровая оценка: рана II степени, не зажившая за 3 недели, — возможно, глубокий ожог (раздел 3.2.2)
  - { on: cond.burn, kind: cure, band: usually, days: [10, 20], when: { form: [minor] } }
texts:
  hint:
    ru: "Рану и кожу вокруг промывают водой или физраствором, убирают обрывки эпидермиса и грязь, обрабатывают антисептиком и накладывают повязку с мазью или создающую влажную среду. Маленькие пузыри у лечащихся дома можно не вскрывать 2–3 дня, перевязки — не реже двух раз в неделю."
sources:
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей.", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2.2 (УУР C, УДД 5): туалет или ПХО с лечебной повязкой не позднее 24 ч; промывание водой или изотоническим раствором натрия хлорида, затем антисептик; у лечащихся амбулаторно маленькие пузыри можно не удалять 2–3 дня; перевязки не реже 2 раз в неделю; I–II степень — атравматичные повязки или повязки с влажной средой; раздел 1.5: I степень с пузырями заживает до 10 дней, II — за 18–20 дней; критерии качества первичной помощи 2 и 3 — обработка раны и повязка" }
review: draft
