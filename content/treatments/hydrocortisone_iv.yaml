id: tx.hydrocortisone_iv
name: { ru: "Гидрокортизон в вену" }
kind: drug
# надпочечниковый криз (spec 2026-10-chapter-4, часть 56а): «Пациентам с АК рекомендуется проводить терапию гидрокортизоном»
# (524_3, раздел 3, УУР C, УДД 4) — у него самое сильное натрийзадерживающее действие, и при высокой дозе он заменяет
# минералокортикоид; начинать «незамедлительно», «не дожидаясь результатов лабораторных анализов» (УУР C, УДД 5). Доз в игре нет;
# ₽ — игровое число
class: hormone.corticosteroid
route: iv
cost: 250
effects:
  # «Выраженный положительный эффект от терапии глюкокортикоидами» (табл. 3); в вену — несколько суток, потом таблетки (табл. 6):
  # сроки — игровая оценка
  - { on: cond.adrenal_crisis, kind: cure, band: always, days: [2, 6] }
texts:
  hint:
    ru: "Главный гормон коры надпочечников в вену. При надпочечниковом кризе — сразу, не дожидаясь анализов: каждый час без него опасен. Задерживает натрий и воду, поэтому при кризе лучше преднизолона и дексаметазона."
sources:
  - { kind: guideline, title: "Первичная надпочечниковая недостаточность", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/524_3", note: "ID 524_3, опубликованы 22.04.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3 (лечение аддисонического криза): незамедлительно, не дожидаясь результатов анализов (УУР C, УДД 5); гидрокортизон, в качестве альтернативы — преднизолон, в исключительных случаях — дексаметазон (УУР C, УДД 4); гидрокортизон обладает самым большим натрийзадерживающим действием; табл. 3: выраженный положительный эффект от глюкокортикоидов; табл. 6: в вену с постепенным снижением дозы, потом таблетки; сроки — игровая оценка" }
review: draft
