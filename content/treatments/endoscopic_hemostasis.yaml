id: tx.endoscopic_hemostasis
name: { ru: "Эндоскопический гемостаз" }
# остановка кровотечения через эндоскоп (spec 2026-10-chapter-4, часть 53а): укол в сочетании с коагуляцией или клипсой —
# укол сам по себе «не обеспечивает должной эффективности» (277_2, раздел 3.3). В эндоскопическом кабинете, в первые 2 часа
# от госпитализации (277_2, 1026_1, раздел 3.3); ₽ — игровое число
kind: procedure
class: hemostasis.endoscopic
cost: 5000
room: room.endoscopy
effects:
  # кровотечение из язвы: продолжается (F1a–b) — остановка, сосуд или сгусток (F2a–b) — профилактика рецидива (277_2, раздел
  # 3.3); повторное кровотечение после гемостаза бывает — доля в тексте не названа, игровая оценка
  - { on: cond.ulcer_bleeding, kind: cure, band: { pct: 88 }, days: [3, 7], when: { forrest: [active, stigmata] } }
  # разрыв Мэллори–Вейсса, кровотечение продолжается (1026_1, раздел 3.3, УУР B, УДД 1); доля — игровая оценка
  - { on: cond.mallory_weiss, kind: cure, band: { pct: 95 }, days: [2, 5], when: { active: [yes] } }
texts:
  hint:
    ru: "Через канал эндоскопа в источник кровотечения вводят раствор и прижигают сосуд или ставят на него клипсу. Нужен, когда кровь идёт или в дне язвы виден сосуд или сгусток; при чистом дне язвы и остановившемся кровотечении из разрыва — не нужен. Только там, где работает эндоскопический кабинет."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3 (УУР C, УДД 5): остановка при F1A-B и профилактика рецидива при F2A-B, при FIIC и FIII не рекомендуется; инъекционный метод — только в сочетании с термическим или клипированием; в течение 2 часов от госпитализации; первый рецидив — повторный гемостаз" }
  - { kind: guideline, title: "Синдром Мэллори-Вейсса (желудочно-пищеводный разрывно-геморрагический синдром)", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1026_1", note: "ID 1026_1, опубликованы 02.02.2026, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3: при продолжающемся кровотечении из разрыва — гемостаз через эндоскоп (УУР B, УДД 1); при остановившемся эндоскопическая профилактика рутинно не рекомендуется (УУР C, УДД 5); критерий качества 3" }
review: draft
