id: tx.mebeverine
name: { ru: "Мебеверин" }
kind: drug
# спазмолитик (spec 2026-10-chapter-4, часть 55б): «Пациентам с СРК при наличии жалоб на боли в животе рекомендуется
# назначение спазмолитиков (АТХ А03…)» (892_1, раздел 3.3, УУР A, УДД 1); «Взрослым пациентам с СРК рекомендуется назначение
# мебеверина» (там же, УУР В, УДД 3); критерий качества 2 — назначены спазмолитики. Спазмолитики против плацебо — 58 % и 46 %
# (там же): излечение в игре — жалобы отпустили, полоса «часто». Доз нет (ADR 0012); ₽ — игровое число
class: analgesic.spasmolytic
route: oral
cost: 400
effects:
  - { on: cond.ibs, kind: cure, band: often, days: [7, 28] }
texts:
  hint:
    ru: "Спазмолитик для кишки, в таблетках. При синдроме раздражённого кишечника — от боли в животе при любом варианте, курсом: спазмолитик назначают каждому. Понос и запор он не лечит — для них свои лекарства."
sources:
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3: спазмолитики АТХ A03 при боли в животе (УУР A, УДД 1) — эффективность 58 % против 46 % на плацебо, NNT 7; мебеверин взрослым (УУР В, УДД 3), хорошо переносится при длительном приёме; критерий качества 2; дозы опущены" }
review: draft
