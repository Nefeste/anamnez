id: tx.vancomycin_oral
name: { ru: "Ванкомицин внутрь" }
kind: drug
# первая линия при энтероколите, вызванном C. difficile (spec 2026-10-chapter-4, часть 49б; 878_1, разделы 3.1.2–3.1.4):
# при лёгком и тяжёлом течении — курс 10 дней (УУР A, УДД 2 — при лёгком), при осложнённом — вместе с метронидазолом в вену.
# Внутрь почти не всасывается и действует в просвете кишки. Доля выздоровевших — игровая оценка по смертности 5 %, при
# осложнениях 15–25 % (раздел 1.3). ₽ — игровое число
class: antibiotic.glycopeptide
route: oral
cost: 900
effects:
  - { on: cond.cdiff, kind: cure, band: usually, days: [3, 6], when: { severity: [mild, severe] } }
  - { on: cond.cdiff, kind: cure, band: usually, days: [5, 10], when: { severity: [critical] } }
contraindications: []
texts:
  hint:
    ru: "Антибиотик, который внутрь почти не всасывается и действует прямо в кишке. Препарат выбора при энтероколите, вызванном C. difficile, — и при лёгком, и при тяжёлом течении; курс 10 дней. Можно и при беременности."
sources:
  - { kind: guideline, title: "Энтероколит, вызванный Clostridioides difficile (C. difficile)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/878_1", note: "ID 878_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.2 (УУР A, УДД 2): ванкомицин внутрь 10 дней — первая линия при лёгком течении, раздел 3.1.3 — и при тяжёлом; раздел 3.1.4: при осложнённом — внутрь или через зонд вместе с метронидазолом в вену; раздел 1.3: смертность — 5 %, при осложнениях — 15–25 %, в ОРИТ — до 34 %; доля выздоровевших — игровая оценка" }
review: draft
