id: tx.calcium_gluconate_iv
name: { ru: "Кальция глюконат в вену" }
kind: drug
# острая гипокальциемия (spec 2026-10-chapter-4, часть 56в): «Для купирования острой гипокальциемии используется внутривенное
# введение препаратов кальция в 2 этапа» (627_3, раздел 7.1; без УУР и УДД); «Предпочтительно использование кальция глюконата» — у
# кальция хлорида некроз тканей при выходе раствора из вены (там же). Назначают, когда кальций крови измерен: сначала диагностика,
# потом лечение (приложение Б); срока в 627_3 нет — игровая оценка. Доз в игре нет; ₽ — игровое число
class: mineral.calcium
route: iv
cost: 120
confirmFirst: true
effects:
  # самый частый способ введения — «позволяющим быстро нормализовать клиническое состояние пациента» (раздел 7.1): сроки — игровая
  # оценка
  - { on: cond.hypocalcemia_acute, kind: cure, band: usually, days: [0, 1] }
texts:
  hint:
    ru: "Кальций в вену: сначала медленно струйно, потом капельно. Быстро снимает судороги при острой гипокальциемии. Одного его мало: сразу же — кальций внутрь и альфакальцидол или кальцитриол. Появились тошнота или рвота — введение останавливают."
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 7.1 (без УУР и УДД): внутривенно в 2 этапа — струйно разведённым за 10–20 минут, затем медленно в среднем 8–10 часов; предпочтителен кальция глюконат; одновременно — кальций внутрь и препараты витамина D и его аналогов; введение прекращают при тошноте и рвоте; приложение Б: алгоритм — диагностика, затем лечение; сроки — игровая оценка" }
review: draft
