id: tx.ventilation
name: { ru: "Интубация трахеи и ИВЛ" }
kind: procedure
# дыхание за больного через трубку в трахее (spec 2026-10-chapter-4, часть 47): только в реанимации — у койки с
# аппаратом ИВЛ; назначил — место «В ОРИТ». При рефрактерном эпилептическом статусе наркоз в вену угнетает дыхание:
# пропофол — «кардиореспираторной депрессии», тиопентал натрия — «тяжелую респираторную и сердечно-сосудистую
# депрессию», «желательно в условиях ИВЛ» (741_1, блок о статусе). Причину не лечит; ₽ — игровое число
class: airway.ventilation
cost: 6000
bedside: { equipment: [eq.ventilator] }
place: ricu
effects:
  # кома при отравлении опиоидами (spec 2026-10-chapter-4, часть 57а): ИВЛ дышит за больного, пока опиоид не выведется, — при коме
  # «незамедлительно» (743_2, раздел 3.3.1, УУР С, УДД 5; критерий качества 13). Аспирации и пневмонии в игре нет — проходит у каждого;
  # сроки — игровая оценка
  - { on: cond.opioid_poisoning, kind: cure, band: { pct: 100 }, days: [1, 2], when: { severity: [moderate, severe] } }
texts:
  hint:
    ru: "Трубку вводят в трахею, и аппарат дышит за больного, пока своё дыхание не справляется или его угнетает наркоз. Только в реанимации, у койки с аппаратом ИВЛ: в больнице без реанимации таких больных переводят."
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; блок «Оказание медицинской помощи пациенту с эпилептическим статусом»: пропофол может приводить к кардиореспираторной депрессии, тиопентал натрия — к тяжёлой респираторной и сердечно-сосудистой депрессии, паттерн «вспышка-подавление» — «желательно в условиях ИВЛ»; табл. 10: рефрактерный статус — по принципам реанимационного отделения; раздел 6: при эпилептическом статусе — госпитализация в отделение нейрореанимации или общей реанимации" }
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 3.3.1 (УУР С, УДД 5): ИВЛ при вентиляционной дыхательной недостаточности и при коме 8 баллов и ниже по шкале комы Глазго — незамедлительно; критерий качества 13; сроки — игровая оценка" }
review: draft
