id: tx.ademetionine
name: { ru: "Адеметионин в вену" }
kind: drug
# гепатопротектор (spec 2026-10-chapter-4, часть 54б): при тяжёлом алкогольном гепатите — вместе с преднизолоном, «с целью
# повышения эффективности ГКС, а также с целью снижения частоты гепаторенального синдрома» (711_2, раздел 3.3, УУР В, УДД 2);
# в исследовании «Достоверных различий в показателе краткосрочной выживаемости (28 дней) в обеих группах не выявлено» (там же)
# — излечения в игре он не даёт. Критерий качества 10 — адеметионин или другой гепатопротектор при АБП. Доз нет (ADR 0012); ₽ —
# игровое число
class: liver.ademetionine
route: iv
cost: 1500
effects: []
texts:
  hint:
    ru: "Гепатопротектор капельно в вену. При тяжёлом алкогольном гепатите его дают вместе с преднизолоном: ответ на лечение лучше и реже отказывают почки, хотя выживаемость за первый месяц та же."
sources:
  - { kind: guideline, title: "Алкогольная болезнь печени", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/711_2", note: "ID 711_2, опубликованы 30.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3 (УУР В, УДД 2): при тяжёлом алкогольном гепатите преднизолон комбинируют с адеметионином в вену — повысить эффективность ГКС и снизить частоту гепаторенального синдрома; у 40 пациентов ответ по индексу Лилль лучше, гепаторенальный синдром реже, выживаемость за 28 дней не отличалась; при циррозе классов А и В по Чайлд-Пью (УУР В, УДД 2) и при внутрипечёночном холестазе (УУР С, УДД 4) — тоже; критерий качества 10; дозы опущены" }
review: draft
