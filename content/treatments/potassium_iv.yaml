id: tx.potassium_iv
name: { ru: "Калий в вену (калия хлорид)" }
kind: drug
# кетоацидоз и гиперосмолярное состояние (часть 73): «На фоне регидратации и инсулинотерапии можно ожидать резкого
# снижения уровня К+ … По этой причине в/в инфузию калия начинают одновременно с введением инсулина» (Алгоритмы, 11-й
# выпуск, 2023, с. 46); при ГГС — «по тем же принципам» (с. 48). На причину не действует — бережёт от гипокалиемии; доз нет,
# ₽ — игровое число
class: mineral.potassium
route: iv
cost: 150
effects: []
texts:
  hint:
    ru: "Калия хлорид в вену под контролем ЭКГ и диуреза. При лечении кетоацидоза инсулином и растворами калий в крови резко падает, поэтому его вводят вместе с инсулином; если калий выше 5,5 — не вводят, если ниже 3,3 — сначала калий, потом инсулин."
sources:
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом. 11-й выпуск", org: "Под ред. И.И. Дедова, М.В. Шестаковой, А.Ю. Майорова", year: 2023, url: "https://doi.org/10.14341/DM13042", note: "Сахарный диабет. 2023;26(2S):1–157, сверено 15.10.2026; раздел 8.1, с. 46: калий в вену одновременно с инсулином; уровень неизвестен — не позднее 2 часов после начала инсулинотерапии, под контролем ЭКГ и диуреза; K+ > 5,5 — препараты калия не вводить; K+ < 3,3 — сначала коррекция калия, затем инсулин; раздел 8.2, с. 48: при ГГС — по тем же принципам, дефицит калия обычно больше; скорости опущены" }
review: draft
