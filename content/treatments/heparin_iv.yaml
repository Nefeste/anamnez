id: tx.heparin_iv
name: { ru: "Гепарин натрия в вену" }
kind: drug
class: anticoagulant.ufh
route: iv
# болюс и инфузия под контролем АЧТВ, ₽ — игровое число
cost: 600
effects:
  # острая ишемия ноги: сразу после диагноза, в приёмном отделении, до реваскуляризации (1006_1,
  # раздел 3.1, УУР С, УДД 4); лекарства как единственное лечение малоэффективны (раздел 3.2.1) —
  # «редко», игровая оценка
  - { on: cond.limb_ischemia, kind: cure, band: rarely, days: [1, 7] }
  # ОКС без подъёма ST в своей палате интенсивной терапии (spec 2026-10-chapter-3, часть 39в): антикоагулянт
  # снижает риск смерти и инфаркта (154_4, раздел 3.2.3.2, ЕОК IA) — игровая оценка: в рекомендации долей нет
  - { on: cond.acs, kind: cure, band: usually, days: [1, 3], when: { type: [nste] } }
  # ТЭЛА (spec 2026-10-chapter-3, часть 43б): без шока — как НМГ; при шоке — болюс без промедления (I C), но без
  # реперфузии один гепарин помогает редко — тромболизис (ESC 2019, разделы 6.2.1 и 6.6). Доли — игровая оценка
  - { on: cond.pe, kind: cure, band: usually, days: [5, 14], when: { shock: [no] } }
  - { on: cond.pe, kind: cure, band: rarely, days: [1, 3], when: { shock: [yes] } }
texts:
  hint:
    ru: "Нефракционированный гепарин натрия — в вену: кровь меньше свёртывается, тромб в артерии не растёт. При острой ишемии ноги — сразу после диагноза, ещё в приёмном. При ОКС без подъёма ST — если нельзя фондапаринукс натрия и эноксапарин натрия. При фибрилляции предсердий — как можно раньше перед кардиоверсией."
sources:
  - { kind: guideline, title: "Острая ишемия конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/1006_1", note: "ID 1006_1, опубликованы 29.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1 (УУР С, УДД 4): ожидающим реваскуляризации — гепарин натрия, первая помощь — обезболивание и немедленное внутривенное введение НФГ, болюс и инфузия под контролем АЧТВ, сразу после установления диагноза, в приёмном отделении; раздел 3.2.1: медикаментозное лечение как монотерапия малоэффективно; частота — игровая оценка" }
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 04.10.2026; раздел 3.2.3.2 (ЕОК IB): если фондапаринукс натрия и эноксапарин натрия противопоказаны (например, при выраженном нарушении функции почек) — гепарин натрия; переходить с гепарина на эноксапарин и обратно не рекомендуется" }
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.1.2: если пациент не получал антикоагулянт — как можно быстрее начать гепарин натрия или эноксапарин натрия перед кардиоверсией, в том числе экстренной" }
  - { kind: guideline, title: "Рекомендации ESC по диагностике и лечению острой легочной эмболии, разработанные в сотрудничестве с Европейским респираторным обществом (ERS)", org: "ESC, ERS", year: 2019, url: "https://doi.org/10.15829/1560-4071-2020-3848", note: "перевод — Российский кардиологический журнал 2020;25(8):3848 (решение владельца, вопрос 25); стр. 28, раздел 6.2.1: НФГ — при нестабильной гемодинамике и перед первичной реперфузией, при КК ≤ 30 мл/мин; стр. 32, раздел 6.6: болюс НФГ без промедления при ТЭЛА высокого риска — I C; доли — игровая оценка" }
review: draft
