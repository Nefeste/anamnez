id: tx.thiamazole
name: { ru: "Тиамазол" }
kind: drug
# тионамид (АТХ H03BB; spec 2026-10-chapter-4, часть 56б): «Рекомендуется терапию тиреотоксикоза всегда начинать с назначения
# антитиреоидных препаратов независимо от выбора метода лечения БГ» (270_2, раздел 3.1, УУР С, УДД 3); тиамазол — препарат
# выбора для консервативного лечения (раздел 3.1.1). Перед первым назначением — общий анализ крови и печёночные пробы (УУР С, УДД 3).
# Доз в игре нет; ₽ — игровое число
class: hormone.antithyroid
# без ТТГ не назначают: «Выполнено исследование уровня тиреотропного гормона (ТТГ) в крови до начала лечения» (270_2, критерий
# качества 1). Тиреотоксический криз подтверждают по признакам — там лечат сразу
confirmFirst: true
route: oral
cost: 150
effects:
  # «спустя 3-4 недели удается достичь нормализации уровней СТ4 и СТ3» (раздел 3.1.1): как часто — игровая оценка
  - { on: cond.thyrotoxicosis, kind: cure, band: usually, days: [21, 28] }
  # тиреотоксический криз — антитиреоидный препарат в мультимодальном лечении (раздел 3.5, УУР С, УДД 4); смертность около 10 %
  # (там же) — доля и сроки игровые
  - { on: cond.thyroid_storm, kind: cure, band: usually, days: [3, 10] }
contraindications:
  # в 1 триместре беременности тиамазол отменяют и назначают пропилтиоурацил (раздел 3.2.2, УУР С, УДД 4): триместра в игре нет —
  # относительное противопоказание; эмбриопатия — после смены, как у иАПФ
  - { id: risk.pregnancy, level: relative, reaction: never }
texts:
  hint:
    ru: "Подавляет выработку гормонов щитовидной железы — первая линия при тиреотоксикозе. Гормоны приходят в норму за 3–4 недели, сердцебиение до того снимает бета-адреноблокатор. Перед первой таблеткой — анализ крови. В первые месяцы беременности вместо него — пропилтиоурацил."
sources:
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 3.1 (УУР С, УДД 3): лечение всегда начинают с антитиреоидных препаратов; раздел 3.1.1: тиамазол — препарат выбора; перед началом — общий анализ крови с лейкоцитарной формулой, АСТ, АЛТ, билирубин (УУР С, УДД 3); нормализация свободных Т4 и Т3 через 3–4 недели; раздел 3.2.2 (УУР С, УДД 4): в 1 триместре беременности — пропилтиоурацил; раздел 3.5 (УУР С, УДД 4): при кризе — тиамазол или пропилтиоурацил; доли и сроки — игровая оценка" }
review: draft
