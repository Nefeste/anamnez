id: tx.cortisol_sample
name: { ru: "Кровь на кортизол и АКТГ до гидрокортизона" }
kind: procedure
# подозрение на надпочечниковый криз (spec 2026-10-chapter-4, часть 56а): «Перед назначением ГК в первую очередь исследуют уровень
# АКТГ и кортизола», но лечение «не должно быть отсрочено до получения результатов анализов» (524_3, раздел 3, УУР C, УДД 5); забор
# — «если имеется такая возможность» (раздел 2). Ответ — через часы, в смене его нет: поэтому это назначение, а не обследование,
# как посевы крови при сепсисе. ₽ — игровое число
cost: 900
texts:
  hint:
    ru: "Пробирка крови на кортизол и АКТГ — до первой дозы гидрокортизона, если успеваете: после него анализ уже не покажет недостаточность. Результата не ждут — гидрокортизон сразу за забором. Диагноз подтверждают потом, когда больному лучше."
sources:
  - { kind: guideline, title: "Первичная надпочечниковая недостаточность", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/524_3", note: "ID 524_3, опубликованы 22.04.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 2: тяжёлым больным с признаками недостаточности — забор крови в диагностических целях, если имеется возможность, и лечение глюкокортикоидами, не дожидаясь результатов; раздел 3: перед назначением ГК в первую очередь исследуют АКТГ и кортизол; подтверждающие пробы — после стабилизации; критерий качества 1: кортизол и АКТГ при подозрении на недостаточность" }
review: draft
