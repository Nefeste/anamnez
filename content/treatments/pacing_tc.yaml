id: tx.pacing_tc
name: { ru: "Наружная кардиостимуляция" }
kind: procedure
# временная стимуляция через кожу электродами монитора с дефибриллятором (spec 2026-10-chapter-3, часть 42в; 160_2,
# раздел 3.2): при гемодинамически значимой брадиаритмии, рефрактерной к лекарствам (ЕОК I C), и когда
# трансвенозная невозможна или недоступна (ЕОК IIa C); приложение Б, табл. 3 — «Чрескожная стимуляция», затем
# постоянная. У постели — в смотровой приёмного и в ПИТ; ₽ — игровое число
class: antiarrhythmic.pacing
cost: 1500
bedside: { equipment: [eq.monitor_defib] }
effects:
  # пульс задаёт стимулятор — при любом уровне блока, обычно (игровая оценка); причину не лечит
  - { on: cond.av_block, kind: relieve, band: usually, days: [0, 0] }
texts:
  hint:
    ru: "Электроды на грудь и спину, монитор с дефибриллятором задаёт ритм через кожу — сердце бьётся с нужной частотой при любой блокаде. Неприятно, нужна седация; это мост до кардиостимулятора в центре, куда больного переводят."
sources:
  - { kind: guideline, title: "Брадиаритмии и нарушения проводимости", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/160_2", note: "ID 160_2, опубликованы 18.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.2: временная ЭКС рекомендована при гемодинамически значимой брадиаритмии, рефрактерной к ритм-учащающим препаратам (ЕОК I C), и когда временная трансвенозная стимуляция невозможна или недоступна (ЕОК IIa C); доступы — чрескожно, через пищевод, трансвенозно; приложение Б, табл. 3: нестабильность несмотря на лекарства — чрескожная стимуляция, затем постоянная; доля успеха — игровая оценка" }
review: draft
