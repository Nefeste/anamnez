id: tx.wound_dressing
name: { ru: "Асептическая повязка" }
kind: procedure
class: wound.dressing
cost: 100
effects:
  # свежей чистой ране с сомкнутыми краями повязки хватает (688_2, раздел 3.2); срок — игровая оценка
  - { on: cond.hand_wound, kind: cure, band: usually, days: [7, 10], when: { cause: [cut], delay: [fresh], edges: [together], tendon: [intact] } }
texts:
  hint:
    ru: "Рану промывают, края обрабатывают антисептиком и закрывают стерильной повязкой. Небольшой ране с сомкнутыми краями этого хватает; после шва или обработки повязку накладывают всегда."
sources:
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1 (УУР C, УДД 5): повязка всем с открытой раной — критерий качества 4; раздел 3.2: шов — если повязка не обеспечивает сопоставления краёв; промывание водопроводной водой не повышает риск инфекции" }
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1 (УУР C, УДД 5): ссадины и поверхностные раны без повреждения апоневроза и кровотечения — обработка антисептиком и асептическая повязка; раздел 6: асептическая повязка на догоспитальном этапе — критерий качества 1" }
review: draft
