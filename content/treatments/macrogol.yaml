id: tx.macrogol
name: { ru: "Макрогол" }
kind: drug
# осмотическое слабительное (spec 2026-10-chapter-4, часть 55б): при запоре, когда диета и псиллиум не помогли, — «в качестве
# препаратов первой линии рекомендуется назначение макрогола» (274_3, раздел 3.2, УУР А, УДД 1), он эффективнее лактулозы;
# критерий качества 4 — макрогол на 4–6 недель. При СРК с запором — осмотические слабительные (892_1, раздел 3.3, УУР C, УДД
# 5): ответ через 3 месяца у 52 % против 11 % на плацебо. Полосы и сроки — игровая оценка; доз нет (ADR 0012); ₽ — игровое
# число
class: laxative.osmotic
route: oral
cost: 300
effects:
  - { on: cond.constipation, kind: cure, band: usually, days: [3, 14] }
  - { on: cond.ibs, kind: cure, band: often, days: [14, 28], when: { variant: [constipation] } }
texts:
  hint:
    ru: "Осмотическое слабительное: удерживает воду в кишке, кал мягче и объёмнее. Первая линия при функциональном запоре, когда диета и псиллиум не помогли, и средство при СРК с запором; можно долго, привыкания не вызывает."
sources:
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2 (УУР А, УДД 1): макрогол — первая линия, если диета и псиллиум неэффективны; по мета-анализу 10 РКИ эффективнее лактулозы, реже тошнота и вздутие; применяли до 17 месяцев; критерий качества 4 — на 4–6 недель; полосы и сроки — игровая оценка" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3 (УУР C, УДД 5): осмотические слабительные при СРК с запором — ПЭГ, лактулоза, лактитол; ответ через 3 месяца у 52 % против 11 % на плацебо; критерий качества 4; дозы опущены" }
review: draft
