id: tx.breathing_exercises
name: { ru: "Дыхательная гимнастика" }
kind: regimen
cost: 0
# на сращение не действует: упражнения на глубокое дыхание и активный кашель снижают частоту
# осложнений (728_2, разделы 3 и 4, критерий качества 8) — роль «облегчает»
texts:
  hint:
    ru: "Глубоко вдыхать, выдыхать с сопротивлением, откашливаться, раньше вставать с постели. Сломанные рёбра болят, человек дышит поверхностно — а так лёгкие хорошо расправляются и пневмонии меньше."
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3: обезболивание позволяет заниматься дыхательными упражнениями; раздел 4: ранняя мобилизация, упражнения на глубокое дыхание и с положительным давлением на выдохе, активный кашель — для снижения частоты осложнений (УУР C, УДД 5); критерий качества 8: дыхательные упражнения дренирующие и (или) лечебная физкультура" }
review: draft
