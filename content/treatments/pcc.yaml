id: tx.pcc
name: { ru: "Протромбиновый комплекс" }
kind: drug
# факторы свёртывания крови II, VII, IX и X в комбинации (АТХ B02BD01) — в каждой ветви алгоритма инактивации
# антитромботических средств при гипертензивной ВМГ (spec 2026-10-chapter-3, часть 41в; 523_3, приложение Б2):
# при антагонистах витамина K — с фитоменадионом, при дабигатране — вместо идаруцизумаба, при ривароксабане и
# апиксабане — сам. Режим и дозы — не в игре; цена — игровое число
class: hemostatic.pcc
route: iv
cost: 30000
texts:
  hint:
    ru: "Концентрат факторов свёртывания II, VII, IX и X в вену: за минуты возвращает свёртывание у того, кто принимает антикоагулянт. При кровоизлиянии в мозг — при варфарине вместе с витамином K1, при ривароксабане, апиксабане и дабигатране — сам."
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.1: при АВК — отмена и фитоменадион с факторами свёртывания II, VII, IX и X или свежезамороженной плазмой, МНО ниже 1,5 в первый час; при дабигатране — идаруцизумаб или протромбиновый комплекс; при ривароксабане и апиксабане — протромбиновый комплекс; приложение Б2: алгоритм инактивации антитромботических средств" }
review: draft
