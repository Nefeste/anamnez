id: tx.psyllium
name: { ru: "Псиллиум" }
kind: drug
# оболочка семян подорожника, слабительное, увеличивающее объём кишечного содержимого (spec 2026-10-chapter-4, часть 55б):
# при запоре — растительные волокна (274_3, раздел 3.1, УУР А, УДД 1; критерий качества 3), из них псиллиум — «Наиболее
# эффективными … являются псиллиум»; при СРК с запором — слабительные АТХ A06AC (892_1, раздел 3.3, УУР B, УДД 2), а
# отруби «могут приводить к усилению симптомов». Полосы и сроки — игровая оценка; доз нет (ADR 0012); ₽ — игровое число
class: laxative.bulk
route: oral
cost: 300
effects:
  - { on: cond.constipation, kind: cure, band: often, days: [7, 28] }
  - { on: cond.ibs, kind: cure, band: sometimes, days: [14, 28], when: { variant: [constipation] } }
texts:
  hint:
    ru: "Оболочка семян подорожника: набухает в кишке, кал становится мягче и объёмнее. Первая ступень при функциональном запоре и средство при СРК с запором; пьют с водой. Не раздражает кишку и не вызывает привыкания, бывает вздутие."
sources:
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1 (УУР А, УДД 1): растительные волокна при запоре — ОР 1,48 по 16 РКИ, лучший — псиллиум, минус — метеоризм; у пожилых псиллиум не уступал макроголу; критерий качества 3; полосы и сроки — игровая оценка" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3 (УУР B, УДД 2): при СРК с запором — слабительные, увеличивающие объём кишечного содержимого, оболочка семян подорожника лучше отрубей; критерий качества 4; дозы опущены" }
review: draft
