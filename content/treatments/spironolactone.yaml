id: tx.spironolactone
name: { ru: "Спиронолактон" }
kind: drug
# калийсберегающий диуретик, антагонист альдостерона (АТХ C03DA01; spec 2026-10-chapter-4, часть 54а): при циррозе с
# асцитом второй степени — вместе с ограничением соли (715_2, раздел 3.2.1, УУР A, УДД 2), «основа лечения асцита»; после
# лечебного парацентеза — чтобы асцит не вернулся (УУР C, УДД 5). Внутрь; режим и дозы — не в игре (ADR 0012); ₽ — игровое
# число
class: diuretic.aldosterone
route: oral
cost: 150
effects:
  # критерий эффективности — минус 2 кг в неделю, эффект от смены дозы — через 72 ч (раздел 3.2.1); как часто асцит уходит
  # и за сколько дней — игровая оценка
  - { on: cond.cirrhosis_ascites, kind: cure, band: usually, days: [7, 14] }
texts:
  hint:
    ru: "Мочегонное, которое блокирует альдостерон: при циррозе этот гормон задерживает в теле соль и воду — так и копится асцит. Основа лечения асцита; действует не сразу, за несколько дней. Может поднять калий."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.1 (УУР A, УДД 2): спиронолактон в дополнение к диете с ограничением натрия при впервые возникшем асците второй степени; монотерапия схожа по эффективности с комбинацией с фуросемидом; после объёмного парацентеза — диуретики с диетой (УУР C, УДД 5); критерий эффективности — уменьшение массы тела не менее 2 кг в неделю; дозы опущены; как часто и за сколько дней — игровая оценка" }
review: draft
