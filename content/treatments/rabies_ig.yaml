texts:
  hint:
    ru: "Готовые антитела против вируса бешенства: как можно больше вводят в ткани вокруг раны и в её глубину, остальное — в мышцу, до вакцины. Нужен при опасных укусах — в голову, лицо, шею, кисть и пальцы, при глубоких и множественных укусах."
sources:
  - { kind: guideline, title: "Бешенство (гидрофобия) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/979_1", note: "ID 979_1, опубликованы 09.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 5.2 (УУР C, УДД 5): при опасной локализации и глубине повреждений — комбинированный курс: иммуноглобулин антирабический и вакцина, сначала иммуноглобулин, как можно больше — в ткани вокруг раны; приложение А3: любые укусы головы, лица, шеи, кисти, пальцев — категория 3, сразу иммуноглобулин и вакцина" }
