id: tx.aed_own
name: { ru: "Свой противоэпилептический препарат — без пропусков" }
# при известной эпилепсии — продолжать исходные противоэпилептические препараты (spec 2026-10-chapter-3, часть 44в;
# 741_1, блок «Оказание медицинской помощи пациенту с эпилептическим статусом»: «продолжать исходные ПЭП»; раздел
# 1.6.7: несоблюдение режима приёма — фактор риска статуса). Свой препарат больного; ₽ — игровое число
kind: drug
class: anticonvulsant.oral
route: oral
cost: 0
effects:
  # без своего препарата у больного эпилепсией приступ повторяется — вернуться к нему: приступов больше нет; доля —
  # игровая оценка
  - { on: cond.seizure, kind: cure, band: usually, days: [0, 0], when: { history: [epilepsy] } }
texts:
  hint:
    ru: "У больного эпилепсией — его же противоэпилептический препарат, тот, что назначил невролог, и без пропусков: пропуск — частая причина приступа и статуса. После первого в жизни приступа лекарство сразу не назначают: решает невролог по ЭЭГ и МРТ."
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; блок «Оказание медицинской помощи пациенту с эпилептическим статусом»: у пациентов с эпилепсией продолжать исходные ПЭП; раздел 1.6.7: несоблюдение режима приёма, снижение дозы, замена и отмена ПЭП — факторы риска статуса; раздел 3: ПЭП после первого приступа — при высоком риске повторения по ЭЭГ и МРТ; насколько помогает — игровая оценка" }
review: draft
