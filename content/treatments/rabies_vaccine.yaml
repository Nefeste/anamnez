id: tx.rabies_vaccine
name: { ru: "Вакцина для профилактики бешенства" }
kind: drug
class: vaccine.rabies
route: im
cost: 1500
texts:
  hint:
    ru: "Курс прививок от бешенства после укуса: первую — сразу, в тот же день, остальные — по графику, в плечо. Если укусившее животное 10 дней наблюдения остаётся здоровым, курс прекращают после третьей прививки."
sources:
  - { kind: guideline, title: "Бешенство (гидрофобия) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/979_1", note: "ID 979_1, опубликованы 09.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 5.2 (УУР C, УДД 5): лечебно-профилактическая иммунизация всем, подвергшимся риску заражения, — немедленно, до результатов обследования животного; вакцина в дельтовидную мышцу; курс прекращают, если животное под наблюдением 10 дней не заболело; приложение А3: схема по категориям повреждения" }
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 5 (УУР C, УДД 5): вакцинация от бешенства всем после укуса животным; критерий качества 3" }
