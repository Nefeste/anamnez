id: tx.sodium_thiosulfate
name: { ru: "Натрия тиосульфат" }
kind: drug
# антидот цианидов в дыме пожара (spec 2026-10-chapter-4, часть 57б): «Рекомендовано в качестве этиотропной терапии отравления
# продуктами горения, содержащими цианистый водород лицам старше 18 лет применение натрия тиосульфата» (885_1, раздел 3.2, УУР С, УДД
# 5): в Российской Федерации это единственный зарегистрированный антидот цианидов (там же). Критериев, кому его вводить, в 885_1 нет —
# в игре можно при отравлении на пожаре. Доз нет; ₽ — игровое
class: antidote.cyanide
route: iv
cost: 150
effects:
  # цианиды горящего пластика (раздел 1.1): доля облегчения — игровая оценка
  - { on: cond.co_poisoning, kind: relieve, band: sometimes, days: [0, 1], when: { exposure: [fire] } }
texts:
  hint:
    ru: "Антидот цианидов: превращает их в малотоксичные соединения, которые выходят с мочой. В дыму пожара, где горит пластик, кроме угарного газа бывает и цианистый водород. При отравлении от печи или мотора цианидов нет — антидот не нужен."
sources:
  - { kind: guideline, title: "Токсическое действие окиси углерода. Токсическое действие других газов, дымов и паров", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/885_1", note: "ID 885_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.1: при горении азотсодержащих полимеров образуется цианистый водород; раздел 3.2 (УУР С, УДД 5): этиотропная терапия отравления продуктами горения с цианистым водородом у лиц старше 18 лет, в России зарегистрирован только натрия тиосульфат; критериев назначения нет; доля облегчения — игровая оценка" }
review: draft
