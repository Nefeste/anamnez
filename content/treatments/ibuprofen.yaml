texts:
  hint:
    ru: "Нестероидный противовоспалительный препарат: снимает жар и боль — в горле, в мышцах, в спине, головную. Лечит не причину, а самочувствие. Нельзя при аллергии на НПВС; при боли в груди он вреден."
