id: tx.ibuprofen
name: { ru: "Ибупрофен" }
kind: drug
class: analgesic.nsaid
route: oral
cost: 80
effects:
  - { on: cond.arvi, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.influenza, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.strep_pharyngitis, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.acute_bronchitis, kind: relieve, band: often, days: [0, 1] }
  - { on: cond.covid19, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.sinusitis_acute, kind: relieve, band: often, days: [0, 1] }
  - { on: cond.sinusitis_bacterial, kind: relieve, band: often, days: [0, 1] }
  - { on: cond.cystitis, kind: relieve, band: often, days: [0, 2] }
  - { on: cond.migraine, kind: cure, band: often, days: [0, 1] }
  - { on: cond.tension_headache, kind: cure, band: usually, days: [0, 1] }
  - { on: cond.low_back_pain, kind: relieve, band: often, days: [0, 3] }
  # желчная колика: НПВП — первая линия, до разрешения симптомов (877_1, раздел 3.2)
  - { on: cond.biliary_colic, kind: cure, band: usually, days: [0, 1] }
  - { on: cond.pancreatitis, kind: relieve, band: often, days: [0, 2] }
  # почечная колика: НПВП — первая линия, обезболивают лучше опиоидов (587_2, раздел 3.1.1); с
  # инфекцией за камнем нужно неотложное дренирование почки (587_2, раздел 3.2) — одно обезболивание
  # не лечит
  - { on: cond.renal_colic, kind: cure, band: usually, days: [0, 1], when: { infection: [no] } }
  # травма (часть 32): обезболивание — НПВП и парацетамол (846_1 и 855_1, раздел 3.1; 832_2, раздел
  # 3.1); на сращение не действует
  - { on: cond.distal_radius_fracture, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.ankle_fracture, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.ankle_sprain, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.wrist_contusion, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.mt5_fracture, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.foot_contusion, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.femoral_neck_fracture, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.hip_contusion, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.clavicle_fracture, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.shoulder_contusion, kind: relieve, band: usually, days: [0, 1] }
  # травма груди (часть 32в): анальгезия всем — НПВП (728_2, раздел 3, УУР C, УДД 5), парацетамол —
  # в критерии качества 5. При переломе рёбер обезболивание и есть лечение: без него дыхание
  # поверхностное и развивается пневмония (раздел 1.6); сращение — через 3–4 недели (раздел 7). Три
  # ребра и больше — «обычно»: пневмония у поступивших — 17 % до 65 лет и 31 % старше (Bulger 2000)
  - { on: cond.chest_contusion, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.rib_fracture, kind: cure, band: always, days: [21, 28], when: { ribs: [one_two] } }
  - { on: cond.rib_fracture, kind: cure, band: usually, days: [21, 28], when: { ribs: [three_plus, flail] } }
  - { on: cond.traumatic_pneumothorax, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.traumatic_hemothorax, kind: relieve, band: usually, days: [0, 1] }
  # травма головы (часть 32г): от головной боли при сотрясении — анальгетики, кроме опиоидов (734_2,
  # раздел 3.1.1); при ушибе мягких тканей головы — как при ушибах конечностей (832_2, раздел 3.1)
  - { on: cond.concussion, kind: relieve, band: often, days: [0, 1] }
  - { on: cond.head_bruise, kind: relieve, band: often, days: [0, 1] }
  - { on: cond.hand_wound, kind: relieve, band: often, days: [0, 1] }
  - { on: cond.head_wound, kind: relieve, band: often, days: [0, 1] }
  # колено (часть 32д): НПВП и парацетамол — мультимодальная анальгезия (691_2, раздел 3.3, УУР A;
  # критерий качества 3; 970_1, раздел 3.3); при ушибе — как при ушибах конечностей (832_2, раздел 3.1)
  - { on: cond.knee_contusion, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.knee_ligament, kind: relieve, band: usually, days: [0, 1] }
  - { on: cond.patella_fracture, kind: relieve, band: usually, days: [0, 1] }
  # тромбофлебит (часть 33а): при низком риске — системные НПВП, чтобы тромб не рос (668_2, раздел
  # 3.0.2.1, УУР B); при умеренном и высоком — от боли и воспаления в дополнение к антикоагулянтам
  - { on: cond.superficial_thrombophlebitis, kind: cure, band: usually, days: [7, 21], when: { risk: [low] } }
  - { on: cond.superficial_thrombophlebitis, kind: relieve, band: often, days: [1, 5], when: { risk: [moderate, high] } }
  # надрыв икроножной мышцы (часть 33а): НПВП при ушибах и растяжениях (832_2, раздел 3.1)
  - { on: cond.calf_strain, kind: relieve, band: usually, days: [0, 1] }
  # острый перикардит (часть 43д): ибупрофен — первая линия наравне с АСК, с колхицином; НПВП стабилизируют 90–95 %
  # перикардитов, курс 1–2 недели (746_2, раздел 3.1.1; табл. А3-11)
  - { on: cond.pericarditis, kind: cure, band: usually, days: [7, 14] }
contraindications:
  - { id: risk.allergy_nsaid, level: absolute, reaction: often }
  - { id: risk.pregnancy, level: relative, reaction: never }
texts:
  hint:
    ru: "Нестероидный противовоспалительный препарат: снимает жар и боль — в горле, в мышцах, в спине, головную. Обычно лечит не причину, а самочувствие; при перикардите — само лечение: снимает воспаление. Нельзя при аллергии на НПВС; при инфаркте и сердечной недостаточности он вреден."
sources:
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; приложение А3.1: ибупрофен — в обезболивании при травматолого-ортопедических вмешательствах, амбулаторно; при ране головы — по аналогии, игровая оценка" }
  - { kind: guideline, title: "Острые респираторные вирусные инфекции (ОРВИ) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/724_2", note: "ID 724_2, опубликованы 04.08.2025, применяются; сверено с рубрикатором 28.09.2026" }
  - { kind: guideline, title: "Желчнокаменная болезнь", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/877_1", note: "ID 877_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2: при приступе желчной колики — НПВП (М01А) до разрешения симптомов" }
  - { kind: guideline, title: "Почечная колика", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/587_2", note: "ID 587_2, опубликованы 09.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1.1: НПВП (M01A), в том числе ибупрофен, — первая линия обезболивания при почечной колике, эффективнее опиоидов; сначала купируют боль" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: при ушибах и растяжениях — ненаркотические анальгетики (N02) и НПВП (M01A), системные НПВП — до 7 суток" }
  - { kind: guideline, title: "Переломы дистального отдела костей предплечья", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/846_1", note: "ID 846_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1, «Обезболивание»: мультимодальная анальгезия — НПВП, парацетамол, габапентиноиды, опиоиды короткого действия" }
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3: всем с закрытой травмой груди — адекватная анальгезия, НПВП (M01A) (УУР C, УДД 5), обезболивание позволяет поддерживать вентиляцию, продуктивный кашель и дыхательные упражнения; критерий качества 5: лечение НПВП и (или) парацетамолом; раздел 7: сращение рёбер — через 3–4 недели" }
  - { kind: paper, title: "Bulger EM, Arneson MA, Mock CN, Jurkovich GJ. Rib fractures in the elderly. J Trauma 2000;48(6):1040–1046", url: "https://pubmed.ncbi.nlm.nih.gov/10866248/", note: "PMID 10866248, сверено 29.09.2026: 277 больных 65 лет и старше и 187 моложе с переломами рёбер; пневмония — 31 и 17 %, смертность — 22 и 10 %; на каждое сломанное ребро — отношение шансов смерти 1,19, пневмонии — 1,16" }
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1.1 (УУР C, УДД 5): при головной боли — сначала немедикаментозное лечение, затем анальгетики, за исключением опиоидов" }
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей.", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1.2 (УУР C, УДД 5): обезболивание при ВАШ больше 3 баллов; на начальном этапе — «другие анальгетики и антипиретики» или НПВП, при нарастании боли — опиоиды; критерий качества первичной помощи 1 — назначены анальгетики" }
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.0.2.1 (УДД 2, УУР B): при низком риске перехода тромба в остром и стихающем периоде — системные НПВП (M01A); раздел 3.3.2 (УДД 1, УУР А): НПВП от воспаления и боли при любом риске; МНН в тексте нет — ибупрофен как НПВП системного действия, игровая оценка; раздел 3.1.6.9: у беременных НПВП не рекомендуются" }
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1: АСК, ибупрофен и колхицин — основные препараты при остром перикардите (ЕОК IA); ибупрофен — при непереносимости АСК и как препарат первой линии с минимумом побочных эффектов; НПВП стабилизируют 90–95 % перикардитов, 1–2 недели" }
