id: tx.acyclovir_iv
name: { ru: "Ацикловир в вену" }
kind: drug
# противовирусное при герпетическом энцефалите (spec 2026-10-chapter-4, часть 50б): «препарат выбора для лечения тяжелых
# или диссеминированных форм ПГ или заболеваний ЦНС», применение «не следует откладывать до установления диагноза»
# (492_2, раздел 3.1.1, УУР С, УДД 5); вводят медленно, следят за почками и питьём. Курс — 14–21 день
class: antiviral.herpes
route: iv
cost: 2500
effects:
  # снижает смертность «не менее чем на 20–30 %» (раздел 3.1.1): полоса излечения — игровая оценка
  - { on: cond.hsv_encephalitis, kind: cure, band: usually, days: [14, 21] }
texts:
  hint:
    ru: "Противовирусный препарат против вирусов герпеса. При подозрении на герпетический энцефалит его вводят в вену сразу, не дожидаясь ПЦР ликвора и МРТ, и отменяют, только если диагноз опровергнут. Вводят медленно: высокие концентрации вредят почкам."
sources:
  - { kind: guideline, title: "Простой герпес (ПГ) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/492_2", note: "ID 492_2, опубликованы 27.10.2025, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.1 (УУР С, УДД 5): внутривенное введение ацикловира при поражении ЦНС, тяжёлом или диссеминированном течении, судорогах; не откладывать до установления диагноза; при доказанном энцефалите — 14 дней, до 21 дня; снижает смертность не менее чем на 20–30 %; без противовирусного лечения смертность превышает 70 %; раздел 7.1: вводить медленно — кристаллизация в почечных канальцах; полоса излечения — игровая оценка" }
review: draft
