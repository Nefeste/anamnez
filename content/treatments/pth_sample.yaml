id: tx.pth_sample
name: { ru: "Кровь на паратгормон" }
kind: procedure
# диагноз гипопаратиреоза — гипокальциемия «в сочетании со снижением уровня ПТГ» (spec 2026-10-chapter-4, часть 56в; 627_3, раздел
# 2, УУР С, УДД 5); в первые сутки после операции на шее — ПТГ и кальций (раздел 5, УУР В, УДД 3); критерий качества 1. Ответ —
# через часы, в смене его нет: поэтому это назначение, а не обследование, как кровь на кортизол при надпочечниковом кризе. ₽ —
# игровое число
cost: 700
texts:
  hint:
    ru: "Пробирка крови на паратиреоидный гормон. Низкий при низком кальции — гипопаратиреоз: околощитовидные железы не работают. Ответ придёт после смены, лечение его не ждёт: кальций в вену назначают по кальцию крови."
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 2 (УУР С, УДД 5): диагноз гипопаратиреоза — гипокальциемия в сочетании со снижением ПТГ; раздел 5 (УУР В, УДД 3): в первые сутки после операции в области шеи — ПТГ и кальций; критерий качества 1: исследование ПТГ; время ответа — игровая оценка" }
review: draft
