id: tx.steroid_iv
name: { ru: "Системные глюкокортикостероиды в вену" }
kind: drug
class: steroid.systemic
route: iv
cost: 150
# перед противоботулинической сывороткой — преднизолон в вену всем с подозрением на ботулизм, «для снижения риска развития
# анафилактического шока» (spec 2026-10-chapter-4, часть 51в; 911_1, раздел 3.1.2, УУР C, УДД 5): спутник антитоксина, на
# причину не действует. С частью 52а — при печёночной коме при гепатите A и B: вместе с инфузией не позднее 30 минут от поступления
# (718_2 и 672_2, раздел 3.1.2, УУР C, УДД 5), при гепатите B — и при тяжёлой форме с нарастающей интоксикацией. С частью 52б — при
# ГЛПС: тяжёлое течение, шок с полиорганной дисфункцией (347_2, раздел 3.1.2.1, УУР С, УДД 5)
effects:
  # после эпинефрина и стабилизации давления — снизить риск продлённой фазы (263_2, рек. 24,
  # критерий качества 7): причину не лечат — облегчение, игровая оценка
  - { on: cond.anaphylaxis, kind: relieve, band: sometimes, days: [0, 1] }
  # невропатия лицевого нерва (spec 2026-10-chapter-3, часть 44б): начало лечения в первые 3 дня и тяжесть выше IV
  # по шкале Хауса-Брэкманна — однократно метилпреднизолон в вену вместо преднизолона внутрь (895_1, раздел 3.2.1);
  # действие — как у таблеток, игровая оценка
  - { on: cond.bell_palsy, kind: cure, band: usually, days: [14, 21], when: { h72: [yes] } }
  - { on: cond.bell_palsy, kind: cure, band: often, days: [21, 42], when: { h72: [no] } }
  # отёк мозга при менингококковом менингите (spec 2026-10-chapter-4, часть 50а): дексаметазон до антибиотика или вместе с ним
  # — «с целью профилактики прогрессирования отека мозга» (1020_1, раздел 3.1.2); причину не лечит — облегчение, игровая оценка
  - { on: cond.meningococcal, kind: relieve, band: often, days: [0, 1], when: { ongm: [yes] } }
  # печёночная кома при гепатите A (spec 2026-10-chapter-4, часть 52а): противовирусных нет, при коме — инфузия и глюкокортикоиды
  # не позднее 30 минут (718_2, раздел 3.1.2, УУР C, УДД 5); молниеносный гепатит «зачастую является смертельным» (приложение
  # В) — выживает половина, игровая оценка
  - { on: cond.hepatitis_a, kind: cure, band: often, days: [14, 28], when: { severity: [coma] } }
  # ГЛПС с инфекционно-токсическим шоком (spec 2026-10-chapter-4, часть 52б): глюкокортикоиды — при шоке, отёке мозга, выраженном
  # воспалении с полиорганной дисфункцией (347_2, раздел 3.1.2.1); причину не лечат — облегчение, игровая оценка
  - { on: cond.hfrs, kind: relieve, band: often, days: [0, 1], when: { severity: [complicated] } }
  # тяжёлая атака язвенного колита (spec 2026-10-chapter-4, часть 55а): в/в ГКС — «в качестве первой линии терапии» курсом 7
  # дней (193_2, раздел 3.1.6, УУР А, УДД 2); при сверхтяжёлой атаке консервативная терапия эффективна «не более» чем в 50 %
  # (раздел 3.1.7). Доля при тяжёлой — игровая оценка
  - { on: cond.uc_attack, kind: cure, band: usually, days: [7, 14], when: { attack: [severe] } }
  - { on: cond.uc_attack, kind: cure, band: often, days: [7, 14], when: { attack: [fulminant] } }
  # надпочечниковый криз (spec 2026-10-chapter-4, часть 56а): «В качестве альтернативы возможно назначение в эквивалентных дозах
  # #преднизолона» (524_3, раздел 3, УУР C, УДД 4) — у него меньше натрийзадерживающего действия, чем у гидрокортизона; как часто
  # помогает — игровая оценка
  - { on: cond.adrenal_crisis, kind: cure, band: usually, days: [2, 6] }
texts:
  hint:
    ru: "Метилпреднизолон, преднизолон, дексаметазон — в вену. Анафилактический шок — после эпинефрина; тяжёлая невропатия лицевого нерва в первые 3 дня — однократно; менингит с отёком мозга — дексаметазон до антибиотика или с ним; ботулизм — перед сывороткой; печёночная кома и тяжёлая атака язвенного колита — преднизолон."
sources:
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; рек. 24 (УУР С, УДД 5): после стабилизации АД и устранения респираторных проявлений после эпинефрина — кортикостероиды системного действия для снижения риска продлённой фазы: метилпреднизолон, гидрокортизон, преднизолон, дексаметазон; критерий качества 7 — всем" }
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.2.1: если лечение начинают в первые 3 дня и тяжесть выше IV степени по шкале Хауса-Брэкманна — однократное внутривенное введение метилпреднизолона (АТХ H02AB04) вместо перорального преднизолона; раздел 6.2.1: экстренная госпитализация, в том числе в дневной стационар, — для этого введения" }
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.2 (УУР В, УДД 1): при менингите, осложнённом ОНГМ, дексаметазон в вену до начала антибактериальной терапии или совместно — для профилактики прогрессирования отёка мозга; при бактериальных гнойных менингитах не влияет на летальность, но снижает частоту тугоухости, если введён до антибиотика; глюкокортикоиды с профилактической целью при ГФМИ без ИТШ не показаны" }
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.2 (УУР C, УДД 5): глюкокортикоид в вену до начала введения противоботулинической сыворотки всем пациентам с подозрением на ботулизм — для снижения риска анафилактического шока; наблюдение 30 минут после введения" }
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.2 (УУР C, УДД 5): при печёночной коме — инфузионно-трансфузионная терапия и глюкокортикоиды не позднее 30 минут от поступления" }
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.2 (УУР С, УДД 5): глюкокортикоиды — при фульминантной форме (прекома, кома, массивный некроз печени), тяжёлых формах с печёночной недостаточностью и с нарастающей интоксикацией; препарат выбора — преднизолон; при коме — не позднее 30 минут" }
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.2.1 (УУР С, УДД 5): глюкокортикоиды для системного применения — при тяжёлом течении, в том числе септическом шоке с полиорганной дисфункцией, с противовоспалительной целью; показания — септический шок, отёк головного мозга, выраженный воспалительный синдром с полиорганной дисфункцией; раздел 3.1.2.2 — то же в олигурическом периоде" }
  - { kind: guideline, title: "Язвенный колит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/193_2", note: "ID 193_2, опубликованы 29.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.6 (УУР А, УДД 2): в/в ГКС — первая линия при тяжёлой атаке, курс 7 дней, ответ оценивают с 3-го по 7-й день; раздел 3.1.7 (УУР С, УДД 4): при сверхтяжёлой атаке — в/в ГКС, эффективность консервативной терапии не более 50 %; дозы опущены; доля при тяжёлой атаке — игровая оценка" }
  - { kind: guideline, title: "Первичная надпочечниковая недостаточность", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/524_3", note: "ID 524_3, опубликованы 22.04.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3: при аддисоническом кризе — гидрокортизон, в качестве альтернативы — преднизолон в эквивалентных дозах, в исключительных случаях — дексаметазон (УУР C, УДД 4); как часто помогает — игровая оценка" }
review: draft
