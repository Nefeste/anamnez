id: tx.steroid_iv
name: { ru: "Системные глюкокортикостероиды в вену" }
kind: drug
class: steroid.systemic
route: iv
cost: 150
effects:
  # после эпинефрина и стабилизации давления — снизить риск продлённой фазы (263_2, рек. 24,
  # критерий качества 7): причину не лечат — облегчение, игровая оценка
  - { on: cond.anaphylaxis, kind: relieve, band: sometimes, days: [0, 1] }
  # невропатия лицевого нерва (spec 2026-10-chapter-3, часть 44б): начало лечения в первые 3 дня и тяжесть выше IV
  # по шкале Хауса-Брэкманна — однократно метилпреднизолон в вену вместо преднизолона внутрь (895_1, раздел 3.2.1);
  # действие — как у таблеток, игровая оценка
  - { on: cond.bell_palsy, kind: cure, band: usually, days: [14, 21], when: { h72: [yes] } }
  - { on: cond.bell_palsy, kind: cure, band: often, days: [21, 42], when: { h72: [no] } }
texts:
  hint:
    ru: "Метилпреднизолон, преднизолон, дексаметазон — в вену. При анафилактическом шоке — после эпинефрина, когда давление поднялось: снижают риск, что удушье вернётся; вместо эпинефрина не помогают. При тяжёлой невропатии лицевого нерва в первые 3 дня — метилпреднизолон в вену однократно вместо таблеток."
sources:
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; рек. 24 (УУР С, УДД 5): после стабилизации АД и устранения респираторных проявлений после эпинефрина — кортикостероиды системного действия для снижения риска продлённой фазы: метилпреднизолон, гидрокортизон, преднизолон, дексаметазон; критерий качества 7 — всем" }
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.2.1: если лечение начинают в первые 3 дня и тяжесть выше IV степени по шкале Хауса-Брэкманна — однократное внутривенное введение метилпреднизолона (АТХ H02AB04) вместо перорального преднизолона; раздел 6.2.1: экстренная госпитализация, в том числе в дневной стационар, — для этого введения" }
review: draft
