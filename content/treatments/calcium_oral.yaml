id: tx.calcium_oral
name: { ru: "Препараты кальция внутрь" }
kind: drug
# «Одновременно назначаются пероральные препараты кальция и препараты витамина D и его аналогов» (spec 2026-10-chapter-4, часть
# 56в; 627_3, раздел 7.1); «Изолированное назначение препаратов кальция патогенетически не оправдано и вызывает лишь кратковременное
# повышение показателей кальциемии сыворотки крови» (раздел 3.2, комментарий; УУР С, УДД 4). Доз нет; ₽ — игровое число
class: mineral.calcium
route: oral
cost: 40
effects:
  # кратковременное повышение кальция (раздел 3.2): доля и сроки — игровая оценка
  - { on: cond.hypocalcemia_acute, kind: relieve, band: sometimes, days: [0, 1] }
texts:
  hint:
    ru: "Кальций в таблетках — во время еды или сразу после. Один он поднимает кальций крови ненадолго, поэтому при гипопаратиреозе его дают только вместе с альфакальцидолом или кальцитриолом."
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 7.1: одновременно с кальцием в вену — пероральные препараты кальция и препараты витамина D и его аналогов, кальций — во время или сразу после еды; раздел 3.2 (УУР С, УДД 4): стандартная терапия — препараты витамина D и его аналогов с препаратами кальция, изолированный кальций патогенетически не оправдан; критерий качества 9; доля и сроки — игровая оценка" }
review: draft
