id: tx.fondaparinux
name: { ru: "Фондапаринукс натрия под кожу" }
kind: drug
class: anticoagulant.fondaparinux
route: sc
# курс на 45 дней, ₽ — игровое число
cost: 2200
effects:
  # тромбофлебит: при умеренном риске — первая линия вместе с промежуточными дозами НМГ, 45 дней
  # (668_2, раздел 3.0.2.2, УУР В; раздел 3.3.3.3: минимальный риск ТЭЛА, ТГВ и прогрессирования)
  - { on: cond.superficial_thrombophlebitis, kind: cure, band: usually, days: [7, 21], when: { risk: [moderate, high] } }
  # ТГВ: допустим в лечебных дозах (960_1, раздел 3.2.5.1)
  - { on: cond.dvt, kind: cure, band: usually, days: [14, 42] }
  # ОКС без подъёма ST в своей палате интенсивной терапии (spec 2026-10-chapter-3, часть 39в): антикоагулянт
  # снижает риск смерти и инфаркта (154_4, раздел 3.2.3.2, ЕОК IA) — игровая оценка: в рекомендации долей нет
  - { on: cond.acs, kind: cure, band: usually, days: [1, 3], when: { type: [nste] } }
  # ТЭЛА без шока (spec 2026-10-chapter-3, часть 43б): как НМГ (ESC 2019, раздел 6.7, I A) — игровая оценка
  - { on: cond.pe, kind: cure, band: usually, days: [5, 14], when: { shock: [no] } }
contraindications:
  # у беременных не рекомендуется (668_2, раздел 3.1.6.7)
  - { id: risk.pregnancy, level: relative, reaction: rarely }
texts:
  hint:
    ru: "Укол под кожу раз в день, снижает свёртываемость крови. При тромбофлебите ствола подкожной вены дальше 3 см от впадения в глубокую — первая линия, 45 дней: короче 14 дней хуже, чем ничего. При ОКС без подъёма ST, если коронарографию в первые сутки не делают, — антикоагулянт первого выбора."
sources:
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.0.2.2 (УДД 1, УУР В): при умеренном риске — промежуточные дозы НМГ или фондапаринукс натрия; раздел 3.0.3.1 (УУР В): 45 дней; курс короче 14 дней по риску ТГВ и ТЭЛА хуже, чем без лечения; раздел 3.1.6.7: у беременных не рекомендуется" }
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2.5.1: фондапаринукс натрия — среди лечебных антикоагулянтов при ТГВ; раздел 3.2.5.6: не при клиренсе креатинина меньше 30 мл/мин" }
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 04.10.2026; раздел 3.2.3.2 (ЕОК IB): если в ранние сроки коронарографию не планируют — фондапаринукс натрия как имеющий наиболее благоприятный профиль эффективности и безопасности; если его нет — эноксапарин натрия" }
  - { kind: guideline, title: "Рекомендации ESC по диагностике и лечению острой легочной эмболии, разработанные в сотрудничестве с Европейским респираторным обществом (ERS)", org: "ESC, ERS", year: 2019, url: "https://doi.org/10.15829/1560-4071-2020-3848", note: "перевод — Российский кардиологический журнал 2020;25(8):3848 (решение владельца, вопрос 25); стр. 32, раздел 6.7: при начале парентеральной антикоагуляции предпочтительно НМГ или фондапаринукс — I A; доля успеха — игровая оценка" }
review: draft
