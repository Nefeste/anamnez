id: tx.nitroglycerin
name: { ru: "Нитроглицерин под язык" }
kind: drug
class: antianginal.nitrate
route: oral
cost: 50
effects:
  - { on: cond.acs, kind: relieve, band: sometimes, days: [0, 0] }
  # приступ стенокардии напряжения проходит через 1–3 минуты после нитроглицерина (155_2, раздел 2.1) —
  # это и признак типичной стенокардии; на сами приступы впредь не действует (часть 39г)
  - { on: cond.angina_stable, kind: relieve, band: usually, days: [0, 0] }
texts:
  hint:
    ru: "Расширяет сосуды сердца и снимает давящую боль. Если боль прошла от нитроглицерина, инфаркт всё равно не исключён. При низком давлении его не дают. При стенокардии напряжения — всегда с собой: приступ проходит за 1–3 минуты."
sources:
  - { kind: guideline, title: "2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J 2023;44(38):3720–3826" }
  - { kind: guideline, title: "Стабильная ишемическая болезнь сердца", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/155_2", note: "ID 155_2, опубликованы 04.10.2024, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.2.1: органические нитраты короткого действия — для устранения приступа (ЕОК IB); раздел 2.1: приступ проходит через 1–3 минуты после нитроглицерина" }
review: draft
