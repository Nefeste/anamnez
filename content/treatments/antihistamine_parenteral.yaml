id: tx.antihistamine_parenteral
name: { ru: "Антигистаминные в мышцу или в вену (клемастин, хлоропирамин, дифенгидрамин)" }
kind: drug
class: antihistamine.first_generation
route: iv
cost: 100
effects:
  # после стабилизации давления, при сыпи и отёке — меньше зуд и отёк (263_2, рек. 25): причину не
  # лечат — облегчение, игровая оценка
  - { on: cond.anaphylaxis, kind: relieve, band: often, days: [0, 1] }
texts:
  hint:
    ru: "Уколы от аллергии: уменьшают зуд, сыпь и отёк. При анафилактическом шоке — только после эпинефрина, когда давление поднялось: сразу пользы нет, а быстрое введение в вену может ещё снизить давление."
sources:
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; рек. 25 (УУР С, УДД 5): после стабилизации АД при проявлениях со стороны кожи и слизистых — антигистаминные системного действия (клемастин, хлоропирамин, дифенгидрамин внутривенно или внутримышечно); немедленного введения пользы нет, быстрое внутривенное — риск усилить гипотензию; частота — игровая оценка" }
review: draft
