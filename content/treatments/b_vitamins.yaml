id: tx.b_vitamins
name: { ru: "Витамины группы B" }
kind: drug
# радикулопатия (spec 2026-10-chapter-4, часть 58б): «Витамины группы В (Витамин B1 в комбинации с витаминами B6 и/или B12, АТХ
# код: A11DB) рекомендуется при острой ДПКР в комбинации с НПВП для уменьшения боли» (777_1, раздел 3.1.2, Р29, УУР B, УДД 2);
# доз нет; ₽ — игровое
class: vitamin.b
route: oral
cost: 150
effects:
  # «может оказать дополнительное обезболивающее действие» — вместе с НПВП; как часто — игровая оценка
  - { on: cond.radiculopathy, kind: relieve, band: sometimes, days: [1, 7] }
texts:
  hint:
    ru: "Витамин B1 с B6 и B12. При острой радикулопатии их добавляют к НПВП: вместе боль уходит немного быстрее. Сами по себе грыжу не лечат."
sources:
  - { kind: guideline, title: "Дискогенная пояснично-крестцовая радикулопатия", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/777_1", note: "ID 777_1, опубликованы 07.12.2023, применяются; сверено с рубрикатором 12.10.2026; раздел 3.1.2, Р29 (УУР B, УДД 2): витамины группы B — при острой ДПКР вместе с НПВП для уменьшения боли; критерий качества 7" }
review: draft
