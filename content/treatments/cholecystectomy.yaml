id: tx.cholecystectomy
name: { ru: "Холецистэктомия" }
kind: surgery
class: surgery.abdominal
# расходники операции, ₽ — игровое число
cost: 12000
# удаление желчного пузыря с камнями устраняет причину; выписка — через срок стационара болезни
effects:
  - { on: cond.cholecystitis, kind: cure, band: { pct: 100 }, days: [3, 6] }
# лапароскопическая, в первые 72 ч от начала болезни (877_1, раздел 3.3); осложнения за 75 дней после
# ранней лапароскопической — 11,8 % (ACDC); смертность после лапароскопической — 0,27 % (877_1,
# раздел 3.3, РФ 2023); длительность — игровая оценка
surgery:
  room: room.or
  team: [role.surgeon, role.anesthetist, role.or_nurse]
  equipment: [eq.or_table, eq.anesthesia]
  minutes: 60
  complications: { pct: 11.8 }
  death: { pct: 0.27 }
texts:
  hint: { ru: "Удаление желчного пузыря вместе с камнями, лучше лапароскопически — через проколы. При остром холецистите — в первые трое суток от начала болезни: позже воспаление спаивает ткани, и операция труднее и опаснее." }
sources:
  - { kind: guideline, title: "Желчнокаменная болезнь", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/877_1", note: "ID 877_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.3: ранняя холецистэктомия в первые 72 часа от начала заболевания, предпочтительно лапароскопическая; летальность после открытой — 4,31 %, после лапароскопической — 0,27 % (РФ, 2023)" }
  - { kind: paper, title: "Gutt CN et al. Acute cholecystitis: early versus delayed cholecystectomy, a multicenter randomized trial (ACDC study, NCT00447304). Ann Surg 2013;258(3):385–393", url: "https://pubmed.ncbi.nlm.nih.gov/24022431/", note: "PMID 24022431, сверено 29.09.2026: лапароскопическая холецистэктомия в первые 24 ч от поступления — осложнения за 75 дней 11,8 % против 34,4 % при отсроченной; в стационаре в среднем 5,4 дня против 10,0" }
review: draft
