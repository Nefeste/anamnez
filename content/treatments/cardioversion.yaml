id: tx.cardioversion
name: { ru: "Электрическая кардиоверсия" }
kind: procedure
# синхронизированный разряд дефибриллятора под кратким наркозом (spec 2026-10-chapter-3, часть 42а; 382_2,
# раздел 3.1.2.2.2): у постели под монитором с дефибриллятором — в смотровой приёмного и в ПИТ; ₽ — игровое
# число
class: antiarrhythmic.cardioversion
cost: 3000
bedside: { equipment: [eq.monitor_defib] }
# антикоагулянт — до и после (раздел 3.1.1.2): перед ней как можно раньше — гепарин натрия, эноксапарин натрия
# или ПОАК с быстрым началом действия; после — не меньше 4 недель
companions: [[tx.heparin_iv, tx.lmwh, tx.doac]]
effects:
  # восстанавливает синусовый ритм сразу; как часто — игровая оценка: в 382_2 доли нет. Стабильному при 48 часах
  # и больше разряд в игре не лечит, а вредит: ритм вернётся, а сгусток уйдёт
  - { on: cond.af, kind: cure, band: always, days: [0, 0], when: { recent: [yes] } }
  - { on: cond.af, kind: cure, band: always, days: [0, 0], when: { unstable: [yes] } }
  # 48 часов и больше без трёх недель антикоагулянта — тромбоэмболия у 5–7 из 100 (раздел 3.1.1.2): в игре 6.
  # Нестабильному разряд нужен сразу и при поздней аритмии — вред в игре только у стабильного
  - { on: cond.af, kind: harm, band: { pct: 6 }, days: [1, 5], when: { recent: [no], unstable: [no] }, as: cond.stroke_ischemic }
texts:
  hint:
    ru: "Разряд дефибриллятора под кратким наркозом возвращает синусовый ритм. При фибрилляции или трепетании предсердий с низким давлением — сразу; стабильному — если аритмии меньше 48 часов, иначе сгусток из предсердия может уйти в мозг. Антикоагулянт — до и не меньше 4 недель после."
sources:
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.2.2: экстренная наружная электрическая кардиоверсия при ФП с острыми нарушениями гемодинамики (ЕОК IB); раздел 3.1.2.2.2: плановая — при неэффективности или противопоказаниях к ААП; раздел 3.1.1.2: при 48 часах и больше или неизвестной давности — антикоагулянт не меньше 3 недель до кардиоверсии; без него тромбоэмболии в среднем у 5–7 %, с ним — меньше 1 %; после кардиоверсии — антикоагулянт не меньше 4 недель; доля успеха — игровая оценка" }
review: draft
