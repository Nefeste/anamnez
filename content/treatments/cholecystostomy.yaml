id: tx.cholecystostomy
name: { ru: "Чрескожная холецистостомия под контролем УЗИ" }
# контроль источника при сепсисе из желчного пузыря (spec 2026-10-chapter-4, часть 48б): очаг, требующий экстренного
# контроля, убирают «в течение до 12 часов» (898_1, раздел 3.1, УДД 2, УУР А; критерий качества 8); при тяжёлом
# калькулёзном холецистите (Grade III) — этапное лечение, первым этапом — чрескожная чреспечёночная холецистостомия
# (877_1, УДД 4, УУР С), холецистэктомия — потом. В игре — у постели под монитором, как пункция перикарда (часть 43д):
# отдельный аппарат УЗИ для неё не нужен; ₽ — игровое число
kind: procedure
class: drainage.biliary
cost: 3500
bedside: { equipment: [eq.monitor_defib] }
effects:
  # гной из пузыря выпустили — очаг убран; выздоравливает с антибиотиком так же часто, как сепсис из лёгких и мочевых
  # путей (30-дневная смертность при сепсисе — 12,0 %, при шоке — 38,1 %, EpiSEP): игровая оценка
  - { on: cond.sepsis, kind: cure, band: { pct: 88 }, days: [5, 10], when: { source: [abdomen], shock: [no] } }
  - { on: cond.sepsis, kind: cure, band: { pct: 62 }, days: [7, 14], when: { source: [abdomen], shock: [yes] } }
texts:
  hint:
    ru: "Под контролем УЗИ через кожу и печень в желчный пузырь ставят тонкий дренаж: гной выходит наружу, очаг сепсиса убран. Желчный пузырь удаляют потом, когда больной окрепнет. Очаг, который можно убрать, убирают в первые 12 часов."
sources:
  - { kind: guideline, title: "Сепсис (у взрослых)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/898_1", note: "ID 898_1, опубликованы 27.12.2024, применяются; раздел 3.1: контроль источника — «в течение до 12 часов» (УДД 2, УУР А); критерий качества 8: выполнены вмешательства по санации очага" }
  - { kind: guideline, title: "Желчнокаменная болезнь", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/877_1", note: "ID 877_1, опубликованы 25.12.2024, применяются; тяжёлый острый холецистит (Grade III) — этапное хирургическое лечение (УДД 4, УУР С); ЧЧХЦС — чрескожная чреспечёночная холецистостомия" }
  - { kind: paper, title: "Wolfertz N, Böhm L, Keitel V, Hannappel O, Kümpers P, Bernhard M. Epidemiology, management, and outcome of infection, sepsis, and septic shock in a German emergency department (EpiSEP study). Front Med (Lausanne) 2022;9:997992", url: "https://pubmed.ncbi.nlm.nih.gov/36325382/", note: "PMID 36325382: 30-дневная смертность при сепсисе — 12,0 %, при шоке — 38,1 %" }
review: draft
