id: tx.antibiotic_iv
name: { ru: "Антибиотик широкого спектра в вену" }
kind: drug
# эмпирическая антимикробная терапия при сепсисе (spec 2026-10-chapter-4, часть 48а; 898_1, раздел 3.2): выбор препарата
# — по очагу и риску резистентности (приложение А.3.3); в игре — одна строка «широкий спектр», без подбора препарата
# (спецификация, «Лечение»; ADR 0012 — без доз). ₽ — игровое число
class: antibiotic.broad_iv
route: iv
cost: 1500
effects:
  # 30-дневная смертность больных сепсисом в приёмном — 12,0 %, при шоке — 38,1 % (EpiSEP, Wolfertz 2022): выздоравливает
  # остальной — как часто помогает, по этим числам
  - { on: cond.sepsis, kind: cure, band: { pct: 88 }, days: [5, 10], when: { source: [lungs, urinary], shock: [no] } }
  - { on: cond.sepsis, kind: cure, band: { pct: 62 }, days: [7, 14], when: { source: [lungs, urinary], shock: [yes] } }
  # очаг в желчном пузыре антибиотик не вычищает (898_1, раздел 3.1: контроль источника): без холецистостомии — только
  # легче (часть 48б), выздоравливает — с ней
  - { on: cond.sepsis, kind: relieve, band: usually, days: [1, 3], when: { source: [abdomen] } }
  # кишечные инфекции (spec 2026-10-chapter-4, часть 49б): цефалоспорины III поколения — при тяжёлом и среднетяжёлом
  # сальмонеллёзе (700_3, раздел 3.1.1), цефтриаксон — вторая линия при шигеллёзе (869_1, раздел 3.1.1). Дни — игровая оценка
  - { on: cond.salmonellosis, kind: cure, band: usually, days: [3, 7], when: { severity: [moderate, severe] } }
  - { on: cond.shigellosis, kind: cure, band: usually, days: [3, 6] }
texts:
  hint:
    ru: "Антибиотик, который действует на большинство возбудителей, — в вену, пока посев не назвал микроб. При сепсисе — в первые 3 часа, при шоке — в первый час; посевы крови берут до него. При тяжёлом сальмонеллёзе и шигеллёзе — цефалоспорин III поколения."
sources:
  - { kind: guideline, title: "Сепсис (у взрослых)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/898_1", note: "ID 898_1, опубликованы 27.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.2: неотложная антимикробная терапия — при шоке в течение 1 часа, без шока — 3 часов; выбор — по риску MRSA, полирезистентных грамотрицательных и кандидоза (приложение А.3.3); в игре — без выбора препарата" }
  - { kind: paper, title: "Wolfertz N, Böhm L, Keitel V, Hannappel O, Kümpers P, Bernhard M. Epidemiology, management, and outcome of infection, sepsis, and septic shock in a German emergency department (EpiSEP study). Front Med (Lausanne) 2022;9:997992", url: "https://pubmed.ncbi.nlm.nih.gov/36325382/", note: "PMID 36325382, PMC9618593, сверено 06.10.2026: 30-дневная смертность — сепсис 12,0 %, септический шок 38,1 %; в игре — доля выздоровевших при лечении" }
  - { kind: guideline, title: "Сальмонеллез у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/700_3", note: "ID 700_3, опубликованы 17.09.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.1 (УУР C, УДД 5): при тяжёлом течении — в том числе цефалоспорины III поколения (цефотаксим, цефтриаксон, цефтазидим), 7–14 дней" }
  - { kind: guideline, title: "Шигеллез", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/869_1", note: "ID 869_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.1 (УУР C, УДД 5): вторая линия — цефтриаксон 4–14 дней" }
review: draft
