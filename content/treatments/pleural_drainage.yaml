id: tx.pleural_drainage
name: { ru: "Дренирование плевральной полости" }
kind: procedure
class: drainage.pleural
# дренаж и работа, ₽ — игровое число
cost: 3000
effects:
  # пневмоторакс — дренирование всем, кроме незначительного объёма без дыхательной недостаточности;
  # клапанный — экстренная декомпрессия торакоцентезом и дренированием (728_2, раздел 3, УУР C, УДД 5);
  # дренирования хватает «в подавляющем большинстве» (Vodička 2017); сроки — игровая оценка: дренаж
  # снимают через 1–2 суток после того, как перестал идти воздух (раздел 3)
  - { on: cond.traumatic_pneumothorax, kind: cure, band: always, days: [2, 5] }
  # кровь — пункция с удалением крови или дренирование всем (раздел 3, УУР C, УДД 5); свернувшийся
  # гемоторакс остаётся после дренажа у 17,6 % (Scott 2017) — «обычно»
  - { on: cond.traumatic_hemothorax, kind: cure, band: usually, days: [3, 7], when: { volume: [moderate] } }
  # тотальный гемоторакс — торакотомия (прил. Г2); дренаж только облегчает дыхание
  - { on: cond.traumatic_hemothorax, kind: relieve, band: usually, days: [0, 1], when: { volume: [massive] } }
texts:
  hint:
    ru: "Через разрез в межреберье в плевральную полость ставят трубку, и воздух или кровь уходят наружу: лёгкое расправляется. Трубку снимают, когда воздух и кровь перестали идти."
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3: устранение пневмоторакса дренированием у всех, кроме незначительного объёма без признаков дыхательной недостаточности; клапанный — экстренная декомпрессия торакоцентезом и дренированием; гемоторакс — пункция с удалением крови или дренирование, целесообразен дренаж большого диаметра; удаление дренажей через 1–2 суток после прекращения поступления воздуха и экссудата (все — УУР C, УДД 5)" }
  - { kind: paper, title: "Vodička J, Špidlen V, Třeška V, Vejvodová Š, Doležal J, Židková A, Škorpil J. Traumatic pneumothorax — diagnosis and treatment of 322 cases over a five-year period. Rozhl Chir 2017;96(11):457–462", url: "https://pubmed.ncbi.nlm.nih.gov/29318887/", note: "PMID 29318887, сверено 29.09.2026: статья на чешском, реферат на английском; 322 больных с травматическим пневмотораксом, тупая травма — 94,1 %; дренаж — у 259 (80,5 %), его хватило в подавляющем большинстве; смертность — 4,7 %" }
  - { kind: paper, title: "Scott MF, Khodaverdian RA, Shaheen JL, Ney AL, Nygaard RM. Predictors of retained hemothorax after trauma and impact on patient outcomes. Eur J Trauma Emerg Surg 2017;43(2):179–184", url: "https://pubmed.ncbi.nlm.nih.gov/26619854/", note: "PMID 26619854, сверено 29.09.2026: 398 больных с дренажом при гемотораксе; свернувшийся гемоторакс остался у 17,6 %" }
review: draft
