id: tx.benzodiazepine
name: { ru: "Диазепам в вену медленно или мидазолам в мышцу" }
# первая очередь при эпилептическом статусе судорожных приступов (spec 2026-10-chapter-3, часть 44в; 741_1, блок
# «Оказание медицинской помощи пациенту с эпилептическим статусом», УУР C, УДД 5): диазепам в вену медленно, иначе
# остановка дыхания и падение давления; без вены — мидазолам в мышцу. Доз и схем в игре нет (ADR 0012); ₽ — игровое
# число
kind: drug
class: anticonvulsant.benzodiazepine
route: iv
cost: 300
effects:
  # купирует статус часто; не помог — вальпроевая кислота в вену (вторая очередь) — доли игровые
  - { on: cond.status_epilepticus, kind: cure, band: often, days: [2, 5] }
texts:
  hint:
    ru: "Первое средство при эпилептическом статусе: диазепам в вену медленно — иначе может остановиться дыхание и упасть давление; без вены — мидазолам в мышцу. Не помогло — вальпроевая кислота в вену. После закончившегося приступа не нужен."
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; блок «Оказание медицинской помощи пациенту с эпилептическим статусом» (УУР C, УДД 5): диазепам в/в медленно — иначе остановка дыхания, снижение АД; мидазолам в/м — на догоспитальном этапе в/м лучше лоразепама в/в; доз и схем в игре нет (ADR 0012); насколько помогает — игровая оценка" }
review: draft
