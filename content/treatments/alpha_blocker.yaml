# насколько чаще выходит камень, в тексте числа нет — действия на причину в игре нет
texts:
  hint:
    ru: "Расслабляет гладкие мышцы мочеточника (тамсулозин и другие) — помогает камню до 7 мм выйти самому. Назначают, когда боль купирована, а камень небольшой."
