id: tx.colchicine
name: { ru: "Колхицин" }
# в 746_2 — «безвременника осеннего семян экстракт (источник алкалоида колхицина)», МНН алкалоида — колхицин
# (spec 2026-10-chapter-3, часть 43д). К АСК или ибупрофену — всем с острым перикардитом (раздел 3.1.1, ЕОК IA), при
# непереносимости НПВП — один; ₽ — игровое число
kind: drug
class: cardiac.colchicine
route: oral
cost: 300
effects:
  # улучшает ответ на противовоспалительное лечение и снижает рецидивы (раздел 3.1.1); один — при непереносимости
  # НПВП; за сколько и как часто — игровая оценка
  - { on: cond.pericarditis, kind: cure, band: often, days: [7, 14] }
contraindications:
  - { id: risk.pregnancy, level: relative, reaction: never }
texts:
  hint:
    ru: "Противовоспалительное средство из безвременника. При перикардите его добавляют к ацетилсалициловой кислоте или ибупрофену на несколько месяцев: воспаление уходит быстрее и реже возвращается. При непереносимости НПВП — один."
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1: АСК, ибупрофен и колхицин — основные препараты, к АСК или ибупрофену следует присоединить колхицин для лучшего ответа и снижения риска рецидива (ЕОК IA), при непереносимости НПВП — монопрепарат; прил. А3, табл. А3-11: колхицин — 3 месяца; насколько помогает — игровая оценка" }
review: draft
