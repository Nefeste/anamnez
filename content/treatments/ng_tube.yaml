id: tx.ng_tube
name: { ru: "Назогастральный зонд" }
kind: procedure
cost: 300
# зонд через нос в желудок — декомпрессия при непроходимости кишки; ставят не всем, а при
# непрекращающейся рвоте: зонд на 30 % повышает риск аспирации (327_3, раздел 3.1). На причину
# не действует — облегчает, пока идёт неоперативное лечение. С частью 51в (spec 2026-10-chapter-4) — при ботулизме, когда
# нарушено глотание жидкости: эвакуировать застойное содержимое и промывать желудок (911_1, раздел 3, УУР C, УДД 4)
texts:
  hint:
    ru: "Трубка через нос в желудок. При непроходимости по ней уходят газ и жидкость, но саму непроходимость она не устраняет. При инсульте с нарушением глотания по ней кормят и дают лекарства — без аспирации. При ботулизме, когда не проходит вода, через неё ещё и промывают желудок."
sources:
  - { kind: guideline, title: "Острая неопухолевая кишечная непроходимость", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/327_3", note: "ID 327_3, опубликованы 06.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: неоперативное лечение — инфузионная терапия, декомпрессия кишечника назогастральным или назоинтестинальным зондом, профилактика аспирации; зонд — только при непрекращающейся рвоте, он на 30 % повышает риск аспирации" }
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 2.2: при невозможности проверить глотание или при дисфагии — назогастральный зонд; раздел 3.1.1.6: с установленной дисфагией — зонд для профилактики аспирации и кормления" }
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3 (УУР C, УДД 4): при нарушении глотания жидкости — назогастральный зонд всем с подозрением на ботулизм для эвакуации застойного содержимого и фракционного промывания желудка; энтеральное питание через зонд при дисфагии — для профилактики аспирационной пневмонии" }
review: draft
