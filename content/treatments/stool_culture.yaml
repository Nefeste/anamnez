id: tx.stool_culture
name: { ru: "Посев кала до антибиотика" }
kind: procedure
# посев кала на сальмонеллы и шигеллы (spec 2026-10-chapter-4, часть 49б): всем, до начала антибактериальной терапии (700_3,
# раздел 2.3; 869_1, раздел 2.3; критерии качества 9). Ответ — через 2–3 суток, в смене его нет: поэтому это назначение, а
# не обследование, как посевы крови при сепсисе (часть 48а). ₽ — игровое число
cost: 600
texts:
  hint:
    ru: "Кал или мазок из прямой кишки, при рвоте — и рвотные массы, на питательную среду: вырастет возбудитель — диагноз подтверждён, и видно, какой антибиотик на него действует. Берут до первой дозы антибиотика; ответ — через 2–3 суток."
sources:
  - { kind: guideline, title: "Сальмонеллез у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/700_3", note: "ID 700_3, опубликованы 17.09.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.3 (УУР C, УДД 5): посев фекалий или ректального мазка, при рвоте — рвотных масс, всем; желательно в ранние сроки до начала антибактериальной терапии; критерий качества 9" }
  - { kind: guideline, title: "Шигеллез", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/869_1", note: "ID 869_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.3 (УУР C, УДД 5): посев на шигеллы и сальмонеллы всем, до начала антибактериальной терапии; критерий качества 9" }
review: draft
