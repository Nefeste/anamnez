id: tx.lactulose
name: { ru: "Лактулоза" }
# осмотическое слабительное (spec 2026-10-chapter-4, часть 54а): при варикозном кровотечении — «удаление крови из
# желудочно-кишечного тракта … с целью профилактики ПЭ» (715_2, раздел 3.2.2, УУР A, УДД 2); при явной печёночной
# энцефалопатии — «для уменьшения её клинических симптомов и улучшения клинических исходов» (раздел 3.2.3, УУР A, УДД 1):
# внутрь, через зонд или клизмами. С частью 55б — и при запоре: «в качестве препаратов первой линии» (274_3, раздел 3.2, УУР
# С, УДД 4), слабее макрогола; при СРК с запором — осмотическое слабительное (892_1, раздел 3.3, УУР C, УДД 5). Без доз (ADR
# 0012); ₽ — игровое число
kind: drug
class: laxative.osmotic
route: oral
cost: 300
effects:
  # как часто и за сколько дней проходит энцефалопатия — игровая оценка; устранение провокаторов купирует её «в 90 % случаев»
  # (раздел 3.2.3) — их в игре нет
  - { on: cond.hepatic_encephalopathy, kind: cure, band: usually, days: [2, 5] }
  # запор — реже макрогола: по мета-анализу 10 РКИ макрогол эффективнее (274_3, раздел 3.2); полосы — игровая оценка
  - { on: cond.constipation, kind: cure, band: often, days: [3, 14] }
  - { on: cond.ibs, kind: cure, band: sometimes, days: [14, 28], when: { variant: [constipation] } }
texts:
  hint:
    ru: "Сироп-слабительное. При циррозе выводит из кишечника кровь и аммиак, которые отравляют мозг: первое лекарство при печёночной энцефалопатии, а при кровотечении из вен пищевода — чтобы она не развилась. При запоре и СРК с запором — первая линия, но слабее макрогола."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.2 (УУР A, УДД 2): лактулоза внутрь или клизмами до прекращения мелены — удалить кровь из кишечника и предупредить печёночную энцефалопатию; раздел 3.2.3 (УУР A, УДД 1): лактулоза при явной ПЭ — уменьшить симптомы и аммиак, улучшить исходы; внутрь, клизмами, через зонд; раздел 5: при остром варикозном кровотечении — профилактика ПЭ орнитином, рифаксимином или лактулозой; критерий качества 12; как часто и за сколько дней — игровая оценка" }
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2 (УУР С, УДД 4): лактулоза — первая линия, если диета и псиллиум неэффективны; препарат выбора при беременности и у пожилых; макрогол эффективнее по мета-анализу 10 РКИ; полоса — игровая оценка" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3 (УУР C, УДД 5): осмотические слабительные (ПЭГ, лактулоза, лактитол) при СРК с запором; критерий качества 4; полоса — игровая оценка" }
review: draft
