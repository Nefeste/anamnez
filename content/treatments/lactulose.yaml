id: tx.lactulose
name: { ru: "Лактулоза" }
# осмотическое слабительное (spec 2026-10-chapter-4, часть 54а): при варикозном кровотечении — «удаление крови из
# желудочно-кишечного тракта … с целью профилактики ПЭ» (715_2, раздел 3.2.2, УУР A, УДД 2); при явной печёночной
# энцефалопатии — «для уменьшения её клинических симптомов и улучшения клинических исходов» (раздел 3.2.3, УУР A, УДД 1):
# внутрь, через зонд или клизмами; без доз (ADR 0012); ₽ — игровое число
kind: drug
class: laxative.osmotic
route: oral
cost: 300
effects:
  # как часто и за сколько дней проходит энцефалопатия — игровая оценка; устранение провокаторов купирует её «в 90 % случаев»
  # (раздел 3.2.3) — их в игре нет
  - { on: cond.hepatic_encephalopathy, kind: cure, band: usually, days: [2, 5] }
texts:
  hint:
    ru: "Сироп-слабительное: выводит из кишечника кровь и аммиак, которые при циррозе отравляют мозг. Первое лекарство при печёночной энцефалопатии — внутрь, через зонд или клизмой; при кровотечении из вен пищевода её дают, чтобы энцефалопатия не развилась."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.2 (УУР A, УДД 2): лактулоза внутрь или клизмами до прекращения мелены — удалить кровь из кишечника и предупредить печёночную энцефалопатию; раздел 3.2.3 (УУР A, УДД 1): лактулоза при явной ПЭ — уменьшить симптомы и аммиак, улучшить исходы; внутрь, клизмами, через зонд; раздел 5: при остром варикозном кровотечении — профилактика ПЭ орнитином, рифаксимином или лактулозой; критерий качества 12; как часто и за сколько дней — игровая оценка" }
review: draft
