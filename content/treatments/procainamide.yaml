id: tx.procainamide
name: { ru: "Прокаинамид в вену" }
kind: drug
# антиаритмический препарат IA класса (spec 2026-10-chapter-3, часть 42б): купирует устойчивую желудочковую
# тахикардию при стабильной гемодинамике (569_2, раздел 3.1.3, ЕОК IIaB); в вену под монитором — у постели;
# ₽ — игровое число
class: antiarrhythmic.procainamide
route: iv
cost: 400
bedside: { equipment: [eq.monitor_defib] }
effects:
  # ритм восстанавливается — часто: игровая оценка, в 569_2 долей нет
  - { on: cond.vt, kind: cure, band: often, days: [0, 0], when: { unstable: [no] } }
# не применяют при тяжёлой сердечной недостаточности, остром инфаркте и терминальной почечной
# недостаточности (раздел 3.1.3): в базе — сердечная недостаточность; гипотония — игровая оценка
contraindications:
  - { id: risk.heart_failure, level: relative, reaction: sometimes }
texts:
  hint:
    ru: "В вену под монитором: восстанавливает ритм при желудочковой тахикардии со стабильным давлением. При тяжёлой сердечной недостаточности и остром инфаркте его не применяют — тогда амиодарон или разряд. Как и все антиаритмические, может снизить давление."
sources:
  - { kind: guideline, title: "Желудочковые нарушения ритма сердца. Внезапная сердечная смерть.", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/569_2", note: "ID 569_2, опубликованы 07.10.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.3 (ЕОК IIaB): при установленной или вероятной структурной патологии сердца — в/в прокаинамид; не применять при тяжёлой сердечной недостаточности, остром ИМ и терминальной почечной недостаточности; без установленного диагноза — амиодарон (ЕОК IIbB); все ААП могут вызвать гипотонию; доля успеха — игровая оценка" }
review: draft
