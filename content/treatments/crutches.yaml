id: tx.crutches
name: { ru: "Костыли без нагрузки на ногу" }
kind: regimen
class: immobilization.crutches
# костыли напрокат, ₽ — игровое число
cost: 500
effects:
  # разгрузка сустава костылями — часть консервативного лечения связок (691_2, раздел 3.1); при
  # переломе надколенника осевая нагрузка — не раньше 6 недель (970_1, раздел 4): сами по себе
  # костыли не лечат, а облегчают
  - { on: cond.knee_ligament, kind: relieve, band: often, days: [1, 7] }
  - { on: cond.patella_fracture, kind: relieve, band: often, days: [1, 7] }
texts:
  hint:
    ru: "Ходить на костылях, не наступая на больную ногу или наступая слегка: сустав разгружен, боль меньше. При разрыве связок колена — до уменьшения боли и отёка, при переломе надколенника — не наступать в полную силу первые 6 недель."
sources:
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: консервативное лечение включает ограничение физических нагрузок, разгрузку сустава с помощью костылей" }
  - { kind: guideline, title: "Переломы надколенника", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/970_1", note: "ID 970_1, опубликованы 25.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 4: осевая нагрузка на конечность — не ранее 6 недель после перелома; обучение ходьбе с дополнительной опорой на костыли" }
review: draft
