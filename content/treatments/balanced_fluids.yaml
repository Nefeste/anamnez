id: tx.balanced_fluids
name: { ru: "Сбалансированный солевой раствор в вену" }
kind: drug
# инфузия при сепсисе (spec 2026-10-chapter-4, часть 48а; 898_1, раздел 3.3): растворы электролитов первой линии,
# «приоритет сбалансированным растворам электролитов вместо 0,9% раствора натрия хлорида»; объём — без доз (ADR 0012).
# ₽ — игровое число
class: rehydration.balanced
route: iv
cost: 400
effects:
  # причину не лечит — давление и перфузию поддерживает: облегчение, игровая оценка
  - { on: cond.sepsis, kind: relieve, band: often, days: [0, 1] }
  # регидратация в вену при кишечной инфекции (spec 2026-10-chapter-4, часть 49а; 875_1, раздел 3.1.2): полиионные
  # кристаллоидные растворы госпитализированным с шоком, острым повреждением почек, обезвоживанием II–III степени; при
  # дегидратационном шоке — быстро (раздел 1.6). «Часто адекватная регидратационная терапия приводит к выздоровлению… даже
  # без каких-либо дополнительных методов лечения» — при тяжёлом обезвоживании это лечение причины опасности; дни — игровая
  # оценка
  - { on: cond.gastroenteritis, kind: cure, band: usually, days: [2, 4], when: { severity: [severe, critical] } }
  - { on: cond.gastroenteritis, kind: relieve, band: usually, days: [0, 1], when: { severity: [moderate] } }
texts:
  hint:
    ru: "Раствор солей, близкий по составу к плазме, — капельно в вену. При сепсисе с ним начинают в первые 3 часа; сбалансированные растворы предпочитают физиологическому. При кишечной инфекции с тяжёлым обезвоживанием им восполняют потерянные воду и соли, при шоке — быстро."
sources:
  - { kind: guideline, title: "Сепсис (у взрослых)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/898_1", note: "ID 898_1, опубликованы 27.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.3 (УДД 5, УУР С): растворы электролитов — первая линия волемической терапии, приоритет сбалансированным перед 0,9 % натрия хлорида; гидроксиэтилкрахмал не рекомендуется; критерий качества 7; облегчение — игровая оценка" }
  - { kind: guideline, title: "Острые кишечные инфекции (ОКИ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/875_1", note: "ID 875_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.2 (УУР C, УДД 5): внутривенная регидратация госпитализированным с шоком, острым повреждением почек, обезвоживанием II–III степени, неукротимой рвотой; полиионные растворы (калия хлорид + натрия ацетат + натрия хлорид и другие); раздел 1.6: при дегидратационном шоке — быстрое введение сбалансированных изотонических солевых растворов" }
review: draft
