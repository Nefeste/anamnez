id: tx.rib_block
name: { ru: "Блокада нервов при переломе рёбер" }
kind: procedure
class: analgesic.nerve_block
# местный анестетик и работа, ₽ — игровое число
cost: 1500
effects:
  # множественные переломы и боль, которую не снимают системные анальгетики, — межрёберная,
  # паравертебральная или перидуральная блокада (728_2, раздел 3, УУР C, УДД 2); доля — игровая
  - { on: cond.rib_fracture, kind: relieve, band: usually, days: [0, 1], when: { ribs: [three_plus, flail] } }
texts:
  hint:
    ru: "Местный анестетик вводят рядом с межрёберными нервами — межрёберно, паравертебрально или перидурально. Боль при дыхании стихает, и человек может глубоко дышать и откашливаться. Перелом блокада не лечит."
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3: у всех с множественными переломами рёбер и болью, не купируемой системными анальгетиками, — межрёберная, паравертебральная или перидуральная блокада (УУР C, УДД 2); обезболивание позволяет поддерживать вентиляцию, продуктивный кашель и дыхательные упражнения" }
review: draft
