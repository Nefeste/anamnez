id: tx.pericardiocentesis
name: { ru: "Пункция перикарда под контролем УЗИ" }
# жизнеспасающее вмешательство при тампонаде (spec 2026-10-chapter-3, часть 43д): оптимально в ПИТ или
# рентгеноперационной, не вслепую — под ЭхоКГ (746_2, раздел 3.2); абсолютное показание — тампонада (приложение Б).
# В игре — у постели под монитором, аппарат УЗИ для неё отдельно не нужен; ₽ — игровое число
kind: procedure
class: drainage.pericardial
cost: 3000
bedside: { equipment: [eq.monitor_defib] }
effects:
  # выпот удалили — сердце наполняется; причину не лечит (раздел 3.2: высокая частота рецидива) — игровая оценка
  - { on: cond.pericarditis, kind: relieve, band: always, days: [0, 0], when: { form: [tamponade] } }
texts:
  hint:
    ru: "Иглой под мечевидным отростком под контролем УЗИ входят в полость перикарда и выпускают жидкость, оставляют дренаж. При тампонаде — спасает жизнь: сердце снова наполняется кровью. Делают у постели под монитором, лучше в палате интенсивной терапии."
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.2: при тампонаде перикардиоцентез — жизнеспасающее вмешательство; оптимально в реанимации, ПИТ или рентгеноперационной; не вслепую — под контролем ЭхоКГ или рентгеноскопии; осложнения у 4–10 %; без чрескожного дренирования нецелесообразно; приложение Б: абсолютное показание — тампонада" }
review: draft
