id: tx.epinephrine_im
name: { ru: "Эпинефрин в мышцу бедра" }
kind: drug
class: adrenergic.epinephrine
route: im
cost: 100
effects:
  # анафилактический шок: незамедлительно, в переднебоковую поверхность верхней трети бедра (263_2,
  # рек. 12–13, критерий качества 2); нет ответа — повтор не раньше чем через 5 минут (рек. 16);
  # доля ответивших в тексте не дана — «обычно», игровая оценка
  - { on: cond.anaphylaxis, kind: cure, band: usually, days: [0, 1] }
texts:
  hint:
    ru: "Эпинефрин (адреналин) — укол в переднюю боковую поверхность бедра, можно через одежду. Первое и главное при анафилактическом шоке: сужает сосуды, поднимает давление, снимает отёк и спазм бронхов. Нет ответа — повтор через 5 минут."
sources:
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; рек. 12 (УУР С, УДД 5): всем — незамедлительно ввести эпинефрин, критерий качества 2; рек. 13 (УУР В, УДД 2): внутримышечно в переднебоковую поверхность верхней трети бедра, при необходимости через одежду — лучше, чем в дельтовидную мышцу или под кожу; рек. 16: при отсутствии ответа — повтор не менее чем через 5 минут, критерий качества 5; доля ответивших — игровая оценка" }
review: draft
