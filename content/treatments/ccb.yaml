id: tx.ccb
name: { ru: "Блокаторы кальциевых каналов (амлодипин)" }
kind: drug
class: antihypertensive.ccb
route: oral
cost: 150
effects:
  - { on: cond.hypertension_new, kind: cure, band: usually, days: [7, 30] }
  # стенокардия напряжения (часть 39г; 155_2, раздел 3.1.2.1): при III–IV ФК — вместе с
  # бета-адреноблокатором; один дигидропиридиновый — не первая линия, «иногда» — игровая оценка
  - { on: cond.angina_stable, kind: cure, band: sometimes, days: [3, 28] }
texts:
  hint:
    ru: "Расширяют артерии и снижают давление; одна из основных групп при гипертонии, часто в одной таблетке с ингибитором АПФ. При стенокардии напряжения III–IV класса — вместе с бета-адреноблокатором. Бывают отёки лодыжек."
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 28.09.2026" }
  - { kind: guideline, title: "2023 ESH Guidelines for the management of arterial hypertension. J Hypertens 2023;41(12):1874–2071" }
  - { kind: guideline, title: "Стабильная ишемическая болезнь сердца", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/155_2", note: "ID 155_2, опубликованы 04.10.2024, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.2.1: при III–IV ФК — сразу бета-адреноблокатор с дигидропиридиновым блокатором кальциевых каналов (ЕОК IC); при I–II ФК первая линия — БАБ или верапамил, дилтиазем" }
review: draft
