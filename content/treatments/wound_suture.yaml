id: tx.wound_suture
name: { ru: "Хирургическая обработка раны и шов" }
kind: procedure
class: wound.suture
cost: 1500
effects:
  # свежая неукушенная неинфицированная рана кисти — первичный шов (688_2, раздел 3.2); швы снимают на
  # 14-е сутки (приложение В)
  - { on: cond.hand_wound, kind: cure, band: usually, days: [12, 14], when: { cause: [cut], delay: [fresh], tendon: [intact] } }
  # простая рана головы — первичная хирургическая обработка с ушиванием, лучше в первые 24 ч (733_2,
  # раздел 3.2); срок заживления в тексте не дан — игровая оценка
  - { on: cond.head_wound, kind: cure, band: usually, days: [7, 10], when: { cause: [blunt] } }
texts:
  hint:
    ru: "Под местной анестезией рану промывают, удаляют грязь, инородные тела и нежизнеспособные ткани, останавливают кровотечение и зашивают. Так закрывают свежую чистую рану — в первые сутки после травмы."
sources:
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2 (УУР C, УДД 5): первичная хирургическая обработка простых ран — ревизия, удаление инородных тел и нежизнеспособных тканей, гемостаз, ушивание; максимально рано, оптимально — в первые 24 ч; раздел 5: антибиотикопрофилактика — однократно во время обработки; критерий качества 3" }
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2 (УУР C, УДД 5): первичное ушивание — неукушенной ране, полученной менее суток назад и неинфицированной; раздел 3.3: местные анестетики N01B — лидокаин, бупивакаин; приложение В: швы снимают на 14-е сутки" }
review: draft
