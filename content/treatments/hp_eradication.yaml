id: tx.hp_eradication
name: { ru: "Эрадикационная терапия H. pylori" }
kind: regimen
# эрадикация (spec 2026-10-chapter-4, часть 53б; 277_2, раздел 3.2, УУР A, УДД 1): первая линия на выбор — стандартная
# тройная терапия, усиленная висмута трикалия дицитратом (ИПН, кларитромицин, амоксициллин, висмут — 14 дней), классическая
# четырёхкомпонентная (висмут, ИПН, тетрациклин, метронидазол — 10 или 14 дней) и квадротерапия без висмута (ИПН,
# амоксициллин, кларитромицин, метронидазол — 14 дней); в игре — одна строка, без доз. В группе «желудок» — рядом с ИПН
class: acid.eradication
route: oral
cost: 1500
effects:
  # добавление висмута повышает эрадикацию «выше 90%» (277_2, раздел 3.2; 708_2, раздел 3.1.1): у гастрита инфекция и есть
  # болезнь — эрадикация «позволяет излечить неатрофический гастрит» (708_2, раздел 3.1.1)
  - { on: cond.gastritis_hp, kind: cure, band: { pct: 90 }, days: [14, 42] }
  # эрадикация — «с целью заживления язвы» (277_2, раздел 3.2); полоса — игровая оценка
  - { on: cond.peptic_ulcer, kind: cure, band: usually, days: [28, 42], when: { hp: [yes] } }
contraindications:
  # «эрадикационная терапия инфекции Н. pylori у беременных не проводится» (277_2, раздел 7.1.1)
  - { id: risk.pregnancy, level: absolute, reaction: never }
texts:
  hint:
    ru: "Курс из трёх-четырёх лекарств сразу на 10–14 дней: ингибитор протонной помпы с кларитромицином, амоксициллином и висмутом; или висмут, ИПН, тетрациклин и метронидазол; или ИПН, амоксициллин, кларитромицин и метронидазол. Убивает H. pylori — так лечат гастрит и язву."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2 (УУР A, УДД 1): эрадикация при положительном тесте — для заживления язвы и профилактики рецидивов; три схемы первой линии; стандартная тройная за 14 дней — 86,2 %, с висмутом — выше 90 %; раздел 7.1.1: у беременных эрадикацию не проводят" }
  - { kind: guideline, title: "Гастрит и дуоденит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/708_2", note: "ID 708_2, опубликованы 10.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.1 (УУР B, УДД 2): эрадикация всем с хроническим гастритом и положительным тестом; первая линия по выбору — тройная с висмутом, классическая четырёхкомпонентная с висмутом, квадротерапия без висмута, все — 14 дней; эрадикация позволяет излечить неатрофический гастрит; раздел 3.1.4 (УУР A, УДД 1): при необследованной диспепсии с положительным тестом" }
review: draft
