id: tx.valproate_iv
name: { ru: "Вальпроевая кислота в вену" }
# вторая очередь при эпилептическом статусе (spec 2026-10-chapter-3, часть 44в; 741_1, блок «Оказание медицинской
# помощи пациенту с эпилептическим статусом», табл. 10, УУР C, УДД 5) — если бензодиазепин не помог. Доз и схем в
# игре нет (ADR 0012); ₽ — игровое число
kind: drug
class: anticonvulsant.valproate
route: iv
cost: 1200
effects:
  # после бензодиазепина — вторая очередь; насколько помогает — игровая оценка
  - { on: cond.status_epilepticus, kind: relieve, band: often, days: [1, 3] }
texts:
  hint:
    ru: "Противоэпилептический препарат в вену — вторая очередь при эпилептическом статусе, если бензодиазепин не помог. Женщинам, которые планируют беременность, в постоянном лечении эпилепсии его избегают."
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; блок «Оказание медицинской помощи пациенту с эпилептическим статусом» (УУР C, УДД 5): вальпроевая кислота для внутривенного введения с целью купирования ЭС у взрослых; табл. 10 — вторая очередь; доз и схем в игре нет (ADR 0012); раздел 3: не рекомендуется женщинам репродуктивного возраста, планирующим беременность (УУР A); насколько помогает — игровая оценка" }
review: draft
