id: tx.vitamin_k
name: { ru: "Фитоменадион (витамин K1) в вену" }
kind: drug
# при кровоизлиянии на фоне антагонистов витамина K — вместе с протромбиновым комплексом, не дожидаясь анализов
# (spec 2026-10-chapter-3, часть 41в; 523_3, раздел 3.1.1, приложение Б2); менадион — не рекомендуется. Режим и
# дозы — не в игре; цена — игровое число
class: hemostatic.vitamin_k
route: iv
cost: 300
texts:
  hint:
    ru: "Витамин K1 возвращает свёртывание при варфарине и других антагонистах витамина K — за часы, поэтому при кровоизлиянии его вводят вместе с протромбиновым комплексом. На ривароксабан, апиксабан и дабигатран не действует; менадион вместо него не рекомендуется."
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.1: при АВК — фитоменадион в вену с протромбиновым комплексом или СЗП, начинать, не дожидаясь анализов и снимков; не рекомендуется менадиона натрия бисульфит; приложение Б2" }
review: draft
