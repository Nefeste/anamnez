id: tx.propylthiouracil
name: { ru: "Пропилтиоурацил" }
kind: drug
# тионамид (АТХ H03BA; spec 2026-10-chapter-4, часть 56б): вместо тиамазола в 1 триместре беременности (270_2, раздел 3.2.2,
# УУР С, УДД 4); при тиреотоксическом кризе — тиамазол или пропилтиоурацил (раздел 3.5). Гепатотоксичнее тиамазола: во II и III
# триместре его снова меняют на тиамазол (раздел 3.2.2). Доз в игре нет; ₽ — игровое число
class: hormone.antithyroid
# без ТТГ не назначают: «Выполнено исследование уровня тиреотропного гормона (ТТГ) в крови до начала лечения» (270_2, критерий
# качества 1). Тиреотоксический криз подтверждают по признакам — там лечат сразу
confirmFirst: true
route: oral
cost: 200
effects:
  # как тиамазол — игровая оценка
  - { on: cond.thyrotoxicosis, kind: cure, band: usually, days: [21, 28] }
  - { on: cond.thyroid_storm, kind: cure, band: usually, days: [3, 10] }
texts:
  hint:
    ru: "Тоже подавляет выработку гормонов щитовидной железы. Его выбирают в первые месяцы беременности вместо тиамазола; печень он поражает чаще, поэтому в остальных случаях первая линия — тиамазол."
sources:
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 3.2.2 (УУР С, УДД 4): в 1 триместре беременности тиамазол отменяют и назначают пропилтиоурацил, во II и III триместре его из-за гепатотоксичности меняют на тиамазол; раздел 3.5 (УУР С, УДД 4): при кризе — тиамазол или пропилтиоурацил; доли и сроки — игровая оценка" }
review: draft
