id: tx.folic_acid
name: { ru: "Фолиевая кислота" }
kind: drug
# отравление метанолом (spec 2026-10-chapter-4, часть 57в): «Рекомендовано всем пациентам при остром отравлении метанолом с целью
# ускорения метаболизма формиата применение #фолиевой кислоты» (873_1, раздел 3.2, УУР С, УДД 5); польза показана на животных, «но
# клинические исследования не смогли подтвердить улучшение результатов лечения» (там же) — в игре можно. Доз нет; ₽ — игровое
class: vitamin.folate
route: iv
cost: 60
effects: []
texts:
  hint:
    ru: "Витамин, который помогает организму обезвредить муравьиную кислоту — самый ядовитый продукт метанола. При отравлении метанолом рекомендация советует его всем, но в исследованиях на людях пользу пока не подтвердили."
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 3.2 (УУР С, УДД 5): фолиевая кислота всем при отравлении метанолом — ускорить метаболизм формиата, эффект показан на животных, клинические исследования улучшения не подтвердили" }
review: draft
