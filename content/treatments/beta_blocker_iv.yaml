id: tx.beta_blocker_iv
name: { ru: "Бета-адреноблокатор в вену" }
kind: drug
# метопролол, эсмолол, пропранолол в вену (АТХ C07A; spec 2026-10-chapter-3, часть 43а): при расслоении аорты —
# антиимпульсная терапия до верхнего давления 100–120 и пульса реже 60 (946_1, раздел 3.1.1; критерии качества 2 и
# 3); при наджелудочковой тахикардии — если вагусные пробы и трифосаденин не помогли (619_3, раздел 3.1.1, ЕОК IIa
# C); при фибрилляции и трепетании предсердий — урежение (382_2, раздел 3.1.2.1). В вену под контролем ЭКГ и
# давления — у постели под монитором; режим и дозы — не в игре; ₽ — игровое число
class: antiarrhythmic.beta_blocker
route: iv
cost: 200
bedside: { equipment: [eq.monitor_defib] }
effects:
  # неосложнённый тип B лечат лекарствами (946_1, раздел 3.2.3): обезболивание и антиимпульсная терапия под
  # контролем давления — как часто удаётся стабилизировать, игровая оценка; тип A без операции не вылечить
  - { on: cond.aortic_dissection, kind: cure, band: usually, days: [3, 7], when: { type: [b] } }
  # обрывает тахикардию с участием АВ-узла и урежает фибрилляцию — обычно, как верапамил: игровая оценка
  - { on: cond.svt, kind: cure, band: usually, days: [0, 0], when: { unstable: [no] } }
  - { on: cond.af, kind: cure, band: usually, days: [1, 7], when: { unstable: [no] } }
# противопоказания — астма, ХОБЛ и АВ-блокада (946_1, приложение А3); бронхоспазм — игровая оценка, как у
# бета-адреноблокатора в таблетках; АВ-блокада — болезнь базы: там он вреден
contraindications:
  - { id: cond.asthma, level: absolute, reaction: often }
  - { id: cond.copd, level: relative, reaction: sometimes }
texts:
  hint:
    ru: "В вену под монитором: урежает пульс и снижает давление. При расслоении аорты — сразу, до верхнего 100–120 и пульса реже 60: меньше нагрузка на стенку. При наджелудочковой тахикардии — после трифосаденина. При астме и АВ-блокаде нельзя."
sources:
  - { kind: guideline, title: "Расслоение аорты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/946_1", note: "ID 946_1, опубликованы 23.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1: бета-адреноблокатор внутривенно (преимущественно метопролол) медленно под контролем ЭКГ и АД, цель — САД 100–120 и ЧСС < 60; критерии качества 2 и 3; приложение А3: внутривенные пропранолол, эсмолол или метопролол, противопоказания — астма, ХОБЛ, АВ-блокада; раздел 3.2.3: неосложнённый тип B — изолированная медикаментозная терапия; доля успеха — игровая оценка" }
  - { kind: guideline, title: "Наджелудочковые тахикардии", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/619_3", note: "ID 619_3, опубликованы 17.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1 (ЕОК IIa C): при неэффективности вагусных приёмов и трифосаденина — внутривенно бета-адреноблокаторы, эсмолол или метопролол" }
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.2.1: при тяжёлой симптоматике — внутривенно или внутрь препараты, замедляющие АВ-проведение: бета-адреноблокаторы или верапамил, дилтиазем; приложение А3, таблица П11: метопролол и эсмолол внутривенно" }
review: draft
