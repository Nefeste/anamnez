id: tx.norepinephrine
name: { ru: "Норэпинефрин в вену" }
kind: drug
# вазопрессор при кардиогенном шоке (spec 2026-10-chapter-4, часть 47): при ОДСН и кардиогенном шоке — вазопрессоры,
# «предпочтительно норэпинефрина» (156_2, ЕОК IIbB), при них — мониторирование ЭКГ и АД (ЕОК IC); при ИМпST и
# кардиогенном шоке — рассмотреть вазопрессоры, норэпинефрин предпочтительнее допамина «в связи с меньшей частотой
# побочных действий» (157_5, ЕОК IIbB). Инфузией под монитором — у постели, как допамин; ₽ — игровое число
class: adrenergic.norepinephrine
route: iv
cost: 600
bedside: { equipment: [eq.monitor_defib] }
effects:
  # «холодная» ОДСН (часть 43в): давление и перфузия — как у допамина; при кардиогенном шоке в стационаре умирает
  # почти каждый второй (ALARM-HF) — как часто помогает, игровая оценка
  - { on: cond.adhf, kind: cure, band: often, days: [3, 10], when: { type: [cold] } }
  # инфаркт с кардиогенным шоком: давление поднимает, причину не лечит — игровая оценка
  - { on: cond.acs, kind: relieve, band: often, days: [0, 1], when: { killip: [iv] } }
texts:
  hint:
    ru: "Капельно в вену под монитором: сужает сосуды и поднимает давление при шоке. При кардиогенном шоке его предпочитают допамину — меньше побочных эффектов. Ритм и давление при нём проверяют постоянно."
sources:
  - { kind: guideline, title: "Хроническая сердечная недостаточность", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/156_2", note: "ID 156_2, опубликованы 07.10.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 7.4.1.5, «Вазопрессорные средства»: у пациентов с ОДСН и кардиогенным шоком может быть рекомендовано применение вазопрессорных средств, предпочтительно норэпинефрина (ЕОК IIbB); при вазопрессорах рекомендуется мониторирование ЭКГ и АД (ЕОК IC); насколько помогает — игровая оценка" }
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 06.10.2026; у пациентов с ИМпST и кардиогенным шоком при артериальной гипотонии рекомендуется рассмотреть вазопрессоры, предпочтительно норэпинефрин по сравнению с допамином — меньше побочных эффектов (ЕОК IIbB)" }
review: draft
