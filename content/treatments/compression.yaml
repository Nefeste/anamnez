id: tx.compression
name: { ru: "Компрессионный трикотаж" }
kind: regimen
class: vascular.compression
# чулок, ₽ — игровое число
cost: 1500
effects:
  # ТГВ: 30–40 мм рт. ст. в первые 24 часа — меньше боль и отёк (960_1, раздел 3.11, УУР В; критерий
  # качества 6); тромбофлебит: 23–32 мм рт. ст. (668_2, раздел 3.0.2.5, УУР В)
  - { on: cond.dvt, kind: relieve, band: often, days: [1, 7] }
  - { on: cond.superficial_thrombophlebitis, kind: relieve, band: sometimes, days: [1, 7] }
texts:
  hint:
    ru: "Эластичный чулок, который давит на ногу снизу вверх: меньше отёк и боль, вены быстрее очищаются от тромба. При тромбозе глубоких вен — с первых суток и на 6–12 месяцев. Сам по себе он тромб не лечит."
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.11 (УДД 2, УУР В): компрессия 30–40 мм рт. ст. в первые 24 часа — уменьшить боль и отёк, ускорить реканализацию; 6–12 месяцев; не как единственная мера; критерий качества 6" }
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.0.2.5 (УДД 2, УУР В): эластическая компрессия 23–32 мм рт. ст. в остром и стихающем периоде; сама по себе не лечение" }
review: draft
