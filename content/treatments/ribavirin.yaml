id: tx.ribavirin
name: { ru: "Рибавирин внутрь" }
kind: drug
class: antiviral.ribavirin
route: oral
# клещевой энцефалит (spec 2026-10-chapter-4, часть 51б; 567_2, раздел 3.1, УУР C, УДД 5): в комплексной терапии всем, не
# позднее 7 суток, в сочетании с интерфероном альфа-2b; применение — вне инструкции (#). Отдельно от интерферона излечения в игре
# не даёт; ₽ — игровое число. С частью 52б — при ГЛПС среднетяжёлого и тяжёлого течения, в стационаре не позднее 48 часов от
# начала болезни (347_2, раздел 3.1.1, УУР С, УДД 5)
cost: 600
effects:
  # ГЛПС (spec 2026-10-chapter-4, часть 52б): «Данные об эффективности лечения рибавирином противоречивы» — в Китае при раннем
  # введении заболеваемость и смертность ниже, в российском исследовании кривые выживаемости как с плацебо (347_2, раздел 3.1.1):
  # помогает иногда — игровая оценка. Среднетяжёлая проходит и без него
  - { on: cond.hfrs, kind: cure, band: sometimes, days: [18, 25], when: { severity: [severe, complicated], h48: [yes] } }
texts:
  hint:
    ru: "Противовирусное средство внутрь. При клещевом энцефалите — вместе с интерфероном альфа-2b в первые 7 суток болезни, вне инструкции по применению; при геморрагической лихорадке с почечным синдромом — само по себе, при среднетяжёлом и тяжёлом течении в первые 48 часов от начала."
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1 (УУР C, УДД 5): #рибавирин в комплексной терапии всем пациентам с КЭ, не позднее 7 суток, целесообразно в комбинации с интерфероном альфа-2b; широко используется при ГЛПС (монотерапия)" }
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1.1 (УУР С, УДД 5): противовирусные препараты прямого действия — в стационаре не позднее 48 часов от начала болезни; #рибавирин — пациентам со среднетяжёлым и тяжёлым течением, внутрь, при невозможности — в вену; данные об эффективности противоречивы; нежелательные эффекты — обратимая анемия; как часто помогает — игровая оценка" }
review: draft
