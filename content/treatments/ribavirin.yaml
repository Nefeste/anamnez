texts:
  hint:
    ru: "Противовирусное средство внутрь. При клещевом энцефалите — вместе с интерфероном альфа-2b в первые 7 суток болезни, вне инструкции по применению; при геморрагической лихорадке с почечным синдромом — само по себе."
sources:
