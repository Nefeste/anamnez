id: tx.glucagon
name: { ru: "Глюкагон в мышцу" }
# средство для лечения гипогликемии (АТХ H04AA01): под кожу, в мышцу или в нос — при тяжёлой гипогликемии, когда
# декстрозу в вену ввести нельзя (spec 2026-10-chapter-3, часть 44а; 290_2, раздел 3.7); в игре — в мышцу; ₽ —
# игровое число
kind: drug
class: hormone.glucagon
route: im
cost: 1500
effects:
  # при гипогликемии от алкоголя эффект может быть снижен (286_3, раздел 3.6); насколько помогает — игровая оценка
  - { on: cond.hypoglycemia, kind: cure, band: often, days: [0, 0] }
texts:
  hint:
    ru: "Гормон, который выпускает в кровь запас глюкозы из печени. Укол в мышцу при тяжёлой гипогликемии, когда вену не найти; сделать его могут и родные. Сознание возвращается за несколько минут."
sources:
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7 (УУР C, УДД 5): глюкагон (АТХ H04AA01) п/к, в/м или интраназально при тяжёлой гипогликемии при невозможности в/в введения декстрозы; вводить могут медицинские работники и родственники" }
  - { kind: guideline, title: "Сахарный диабет 1 типа у взрослых", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/286_3", note: "ID 286_3, опубликованы 02.03.2026, применяются; сверено с рубрикатором 05.10.2026; раздел 3.6: при гипогликемии, индуцированной алкоголем, эффект глюкагона может быть снижен; насколько помогает — игровая оценка" }
review: draft
