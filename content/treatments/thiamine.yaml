id: tx.thiamine
name: { ru: "Тиамин в мышцу" }
kind: drug
# витамин B1 (spec 2026-10-chapter-4, часть 54б): «всем пациентам с диагнозом ААС назначение тиамина с целью профилактики
# развития энцефалопатии Гайе-Вернике» (784_1, раздел 3.1, УУР C, УДД 5; критерий качества 7); «парентеральные формы
# тиамина по инструкции вводятся только внутримышечно», потом — внутрь (там же). «Глюкоза вызывает истощение тиамина,
# повышая риск развития энцефалопатии» (там же). Доз нет (ADR 0012); ₽ — игровое число
class: vitamin.thiamine
route: im
cost: 100
effects: []
texts:
  hint:
    ru: "Витамин B1. У пьющих его не хватает, а без него развивается энцефалопатия Вернике — спутанность, шаткость, двоение в глазах — и потом корсаковский психоз. Тиамин колют каждому с синдромом отмены алкоголя; глюкозу пьющему — только вместе с тиамином: она расходует последние запасы витамина."
sources:
  - { kind: guideline, title: "Психические и поведенческие расстройства, вызванные употреблением алкоголя. Синдром отмены алкоголя (алкогольное абстинентное состояние)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/784_1", note: "ID 784_1, опубликованы 20.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.1 (УУР C, УДД 5): тиамин всем пациентам с синдромом отмены — профилактика энцефалопатии Гайе-Вернике; парентеральные формы по инструкции — только внутримышечно, затем внутрь; глюкоза вызывает истощение тиамина, повышая риск энцефалопатии; критерий качества 7; дозы опущены" }
  - { kind: guideline, title: "Алкогольная болезнь печени", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/711_2", note: "ID 711_2, опубликованы 30.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.6: энцефалопатия Вернике без лечения — смертность 15 %, переход в корсаковский психоз — до 60 %; раздел 3.2: любое введение углеводов требует превентивного назначения тиамина; при энцефалопатии Вернике или подозрении на неё — тиамин незамедлительно (УУР C, УДД 5); дозы опущены" }
review: draft
