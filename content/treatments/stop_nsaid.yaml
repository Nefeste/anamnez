id: tx.stop_nsaid
name: { ru: "Отменить НПВП" }
kind: regimen
# отказ от препаратов «с ульцерогенным действием» — часть лечения язвенной болезни (spec 2026-10-chapter-4, часть 53б;
# 277_2, раздел 3); при кровотечении НПВП «должен быть прекращен (замена препаратами других групп)» (раздел 3.5). Отдельного
# действия на заживление в тексте нет: лечит ИПН, отмена убирает причину
cost: 0
effects: []
texts:
  hint:
    ru: "Ибупрофен, диклофенак и другие НПВП повреждают слизистую желудка: при язве их отменяют, а боль снимают лекарством другой группы. Пока НПВП продолжают, язва заживает хуже и может кровоточить."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3: лечение включает отказ от препаратов, обладающих ульцерогенным действием; раздел 3.5: при кровотечении приём НПВП прекращают, заменяя препаратами других групп; раздел 1.6: язвы — у 20–25 % длительно принимающих НПВП" }
review: draft
