id: tx.antihistamine
name: { ru: "Антигистаминные II поколения (цетиризин, лоратадин)" }
kind: drug
class: antihistamine.second_generation
route: oral
cost: 200
effects:
  - { on: cond.allergic_rhinitis, kind: cure, band: often, days: [1, 3] }
  # острая крапивница (spec 2026-10-urticaria-dka, часть 73): «с целью полного устранения симптомов» (264_2, раздел
  # 3.3.1, рек. 1, УУР A, УДД 1); доля и сроки — игровая оценка. Кто их уже пил без толку, тому они и не помогают
  - { on: cond.urticaria_acute, kind: cure, band: usually, days: [1, 3], when: { tried: [no] } }
texts:
  hint:
    ru: "Таблетки от аллергии: убирают чихание, зуд и насморк при аллергическом рините, волдыри и зуд при острой крапивнице, почти не вызывая сонливости. При простуде и синусите не помогают, при анафилактическом шоке эпинефрин не заменяют."
sources:
  - { kind: guideline, title: "Brożek JL et al. Allergic Rhinitis and its Impact on Asthma (ARIA) guidelines — 2016 revision. J Allergy Clin Immunol 2017;140(4):950–958" }
  - { kind: guideline, title: "Аллергический ринит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/261_2", note: "ID 261_2, опубликованы 11.07.2024, применяются; сверено с рубрикатором 28.09.2026" }
  - { kind: guideline, title: "Крапивница", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/264_2", note: "ID 264_2, опубликованы 19.07.2023, применяются; сверено с рубрикатором 15.10.2026; раздел 3.3.1, рек. 1 (УУР A, УДД 1): при острой крапивнице и/или ангиоотёке — антигистаминные системного действия неседативные, второго поколения, критерий качества 1; среди них — цетиризин и лоратадин (раздел 3.3.2.1); доля и сроки — игровая оценка; дозы опущены" }
review: draft
