id: tx.thrombolysis_pe
name: { ru: "Тромболизис при ТЭЛА" }
kind: drug
# тромболитик в вену (АТХ B01AD): рекомбинантный тканевой активатор плазминогена — предпочтительно, стрептокиназа,
# урокиназа (ESC 2019, раздел 6.3.1); режим и дозы — не в игре
class: thrombolytic
route: iv
# тромболитик дорогой, ₽ — игровое число, как у тромболизиса при инфаркте и инсульте
cost: 45000
# у постели под монитором (spec 2026-10-chapter-3, часть 43б): ТЭЛА высокого риска — шок, лечат в ПИТ, как
# тромболизис при инфаркте и инсульте
bedside: { equipment: [eq.monitor_defib] }
# с гепарином натрия в вену: при ТЭЛА высокого риска — болюс без промедления (I C), НФГ можно продолжать во время
# инфузии алтеплазы (раздел 6.3.1)
companions: [tx.heparin_iv]
effects:
  # ТЭЛА высокого риска — системный тромболизис (I B): насколько часто удаётся — игровая оценка (неэффективность через
  # 36 часов — у 8 %, раздел 6.3.1)
  - { on: cond.pe, kind: cure, band: usually, days: [0, 2], when: { shock: [yes] } }
  # без шока — рутинный тромболизис не рекомендован (III B): тяжёлое кровотечение — у 9,9 %, внутричерепное — у 1,7 %
  # (раздел 6.3.1)
  - { on: cond.pe, kind: harm, band: { pct: 10 }, days: [0, 2], when: { shock: [no] } }
  # как тромболизис при инфаркте и инсульте: вред при кровоизлиянии в мозг и расслоении аорты — игровая оценка
  - { on: cond.ich, kind: harm, band: usually, days: [0, 1] }
  - { on: cond.sah, kind: harm, band: usually, days: [0, 1] }
  - { on: cond.aortic_dissection, kind: harm, band: usually, days: [0, 1] }
# противопоказания (табл. 10): абсолютные — инсульт (геморрагический — когда-либо, ишемический — за 6 месяцев),
# политравма, операция, травма головы за 3 недели, кровоточивость; относительные — пероральные антикоагулянты,
# беременность. Кровотечение при противопоказании — игровая оценка
contraindications:
  - { id: risk.stroke_history, level: absolute, reaction: often }
  - { id: risk.recent_bleed_surgery, level: absolute, reaction: often }
  - { id: risk.bleeding_tendency, level: absolute, reaction: often }
  - { id: risk.anticoagulants, level: relative, reaction: sometimes }
  - { id: risk.pregnancy, level: relative, reaction: sometimes }
texts:
  hint:
    ru: "Тромболитик в вену растворяет тромбы в лёгочных артериях. Только при тромбоэмболии с шоком — давлении ниже 90: тогда он спасает жизнь, вместе с гепарином в вену и под монитором. Без шока тромболизис не делают — кровотечение опаснее пользы."
sources:
  - { kind: guideline, title: "Рекомендации ESC по диагностике и лечению острой легочной эмболии, разработанные в сотрудничестве с Европейским респираторным обществом (ERS)", org: "ESC, ERS", year: 2019, url: "https://doi.org/10.15829/1560-4071-2020-3848", note: "перевод — Российский кардиологический журнал 2020;25(8):3848 (решение владельца, вопрос 25); стр. 30, раздел 6.3.1: предпочтительна ускоренная инфузия рТАП, НФГ можно назначать во время инфузии алтеплазы; тяжёлое кровотечение — 9,9 %, внутричерепное — 1,7 %; неэффективность через 36 часов — у 8 % больных высокого риска; стр. 32, раздел 6.6: системный тромболизис при ТЭЛА высокого риска — I B, болюс НФГ без промедления — I C; раздел 6.7: рутинный первичный тромболизис при промежуточном и низком риске не рекомендован — III B; стр. 28, табл. 10: противопоказания; доля успеха — игровая оценка" }
review: draft
