id: tx.lmwh
name: { ru: "Низкомолекулярный гепарин под кожу" }
kind: drug
class: anticoagulant.lmwh
route: sc
# курс уколов, ₽ — игровое число
cost: 2500
effects:
  # ТГВ: допустимая замена ПОАК; при беременности — препарат выбора (960_1, разделы 3.2.5.1,
  # 3.8.1); перед дезобструкцией — начальная терапия (раздел 3.2.5.2)
  - { on: cond.dvt, kind: cure, band: usually, days: [14, 42] }
  # тромбофлебит: промежуточные дозы при умеренном риске 45 дней, лечебные — при высоком (668_2,
  # разделы 3.0.2.2–3.0.2.3)
  - { on: cond.superficial_thrombophlebitis, kind: cure, band: usually, days: [7, 21], when: { risk: [moderate, high] } }
  # ТЭЛА без шока (spec 2026-10-chapter-3, часть 43б): в стационаре — предпочтительно НМГ или фондапаринукс (ESC 2019,
  # раздел 6.7, I A); при шоке — гепарин в вену и тромболизис. Как часто и за сколько дней — игровая оценка
  - { on: cond.pe, kind: cure, band: usually, days: [5, 14], when: { shock: [no] } }
texts:
  hint:
    ru: "Эноксапарин натрия, надропарин кальция, далтепарин натрия — уколы под кожу живота, снижают свёртываемость крови. Замена таблеткам при тромбозе; при беременности — только они. Перед операцией на венах начинают с них. Перед кардиоверсией при фибрилляции предсердий — эноксапарин натрия, как можно раньше."
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2.5.1: для начальной и длительной терапии — лечебные дозы НФГ, НМГ, фондапаринукса натрия, АВК, ПОАК; раздел 3.2.5.2 (УДД 4, УУР С): при показаниях к дезобструкции — в/в НФГ или п/к НМГ; раздел 3.8.1 (УДД 5, УУР С): при ТГВ во время беременности — лечебные дозы НМГ" }
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.0.2.2 (УДД 1, УУР В): при умеренном риске — промежуточные дозы НМГ или фондапаринукс натрия; раздел 3.0.3.1: 45 дней; раздел 3.1.6.7: у беременных — НМГ" }
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.1.2: перед кардиоверсией без предшествующей антикоагуляции — #эноксапарин натрия или гепарин натрия как можно раньше" }
  - { kind: guideline, title: "Рекомендации ESC по диагностике и лечению острой легочной эмболии, разработанные в сотрудничестве с Европейским респираторным обществом (ERS)", org: "ESC, ERS", year: 2019, url: "https://doi.org/10.15829/1560-4071-2020-3848", note: "перевод — Российский кардиологический журнал 2020;25(8):3848 (решение владельца, вопрос 25); стр. 28, раздел 6.2.1: НМГ или фондапаринукс ассоциированы с меньшим риском больших кровотечений и ГИТ, чем НФГ; стр. 32, раздел 6.7: предпочтительно НМГ или фондапаринукс — I A; доля успеха — игровая оценка" }
review: draft
