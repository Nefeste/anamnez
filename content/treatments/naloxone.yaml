id: tx.naloxone
name: { ru: "Налоксон" }
kind: drug
# антидот опиоидов (spec 2026-10-chapter-4, часть 57а): «при острых отравлениях опиоидными наркотическими веществами легкой степени и не
# сопровождающихся нарушениями дыхания и тяжелой гипоксией, незамедлительно на догоспитальном этапе или при поступлении больного в
# стационар» (743_2, раздел 3.3.5, УУР А, УДД 2; критерий качества 11). При выраженных нарушениях дыхания, долгой экспозиции и тяжёлой
# гипоксии он строго противопоказан — побочные эффекты: отёк лёгких, судороги, синдром отмены (там же); при средней и тяжёлой степени —
# противопоказан (приложение А3, табл. 10 и 11). Это строже привычного — вопрос владельцу 30; игра следует тексту. Доз нет; ₽ — игровое
class: antidote.opioid
route: iv
cost: 120
effects:
  # эффект в вену — через 1–2 минуты, действует 45–90 минут (раздел 3.3.5): при лёгкой степени — игровая оценка
  - { on: cond.opioid_poisoning, kind: cure, band: usually, days: [0, 0], when: { severity: [mild] } }
  # отёк лёгких, судороги, отмена (раздел 3.3.5): доля — игровая оценка
  - { on: cond.opioid_poisoning, kind: harm, band: sometimes, days: [0, 1], when: { severity: [moderate, severe] } }
texts:
  hint:
    ru: "Антидот опиоидов: в вену через минуту-две возвращает сознание и дыхание. По российской рекомендации — только при лёгком отравлении без нарушений дыхания. При коме и редком дыхании противопоказан: сначала интубация и ИВЛ. Действует час-полтора, а метадон — до двух суток."
sources:
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 3.3.5 (УУР А, УДД 2): антидотная терапия налоксоном — при отравлениях лёгкой степени без нарушений дыхания и тяжёлой гипоксии, незамедлительно; при выраженных нарушениях дыхания, длительной экспозиции и тяжёлой гипоксии строго противопоказан, побочные эффекты — отёк лёгких, судороги, синдром отмены; эффект в вену через 1–2 минуты, действует 45–90 минут, у метадона период полувыведения до 48 часов — возможна реинтоксикация, больной подлежит длительному наблюдению; приложение А3, табл. 10 и 11: при средней и тяжёлой степени противопоказан; критерий качества 11; доли и сроки — игровая оценка" }
review: draft
