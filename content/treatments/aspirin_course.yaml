id: tx.aspirin_course
name: { ru: "Ацетилсалициловая кислота курсом" }
# противовоспалительный курс при перикардите (spec 2026-10-chapter-3, часть 43д): АСК — препарат первого выбора
# наравне с ибупрофеном, 1–2 недели (746_2, раздел 3.1.1; прил. А3, табл. А3-11). Разжёванная таблетка при инфаркте —
# другое назначение (tx.aspirin_acs); ₽ — игровое число
kind: drug
class: analgesic.nsaid
route: oral
cost: 100
effects:
  # НПВП стабилизируют 90–95 % перикардитов (раздел 3.1.1); за 1–2 недели — табл. А3-11
  - { on: cond.pericarditis, kind: cure, band: usually, days: [7, 14] }
contraindications:
  - { id: risk.allergy_nsaid, level: absolute, reaction: often }
texts:
  hint:
    ru: "Ацетилсалициловая кислота против воспаления — курсом на одну-две недели, пока не уйдут боль и температура. При перикардите — препарат первого выбора наравне с ибупрофеном, вместе с колхицином и защитой желудка. Разжёванная таблетка при инфаркте — другое назначение."
sources:
  - { kind: guideline, title: "Перикардиты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/746_2", note: "ID 746_2, опубликованы 01.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1: препаратом первого выбора может быть АСК в больших дозах до нормализации температуры, как правило 1–2 недели; при непереносимости — ибупрофен; НПВП позволяют стабилизировать 90–95 % перикардитов; гастропротекция с первых часов лечения обязательна; табл. А3-11 — длительность по симптомам и СРБ" }
