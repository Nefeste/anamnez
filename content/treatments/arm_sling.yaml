id: tx.arm_sling
name: { ru: "Косыночная повязка" }
kind: procedure
class: immobilization.sling
# косынка, ₽ — игровое число
cost: 200
effects:
  # без смещения — косыночная повязка, повязка Дезо или гипсовая (853_1, раздел 3.1); иммобилизация —
  # 3–6 недель (раздел 4); без смещения прогноз благоприятный (Robinson 1998) — доля — игровая
  # оценка; со смещением без операции несращение — 10–23 % (853_1, раздел 3.2): срастается у
  # 77–90 %, взята середина, 83,5 %
  - { on: cond.clavicle_fracture, kind: cure, band: always, days: [21, 42], when: { displacement: [none] } }
  - { on: cond.clavicle_fracture, kind: cure, band: { pct: 83.5 }, days: [28, 42], when: { displacement: [displaced] } }
  # при ушибе руку поддерживает косынка — облегчает, но не нужна всем (832_2, раздел 4)
  - { on: cond.shoulder_contusion, kind: relieve, band: often, days: [1, 5] }
texts:
  hint:
    ru: "Руку, согнутую в локте, подвешивают на косынке к шее: надплечье не тянет отломки вниз, боль меньше. Так лечат перелом ключицы без смещения — 3–6 недель; восьмиобразная повязка не лучше, а носить её тяжелее."
sources:
  - { kind: guideline, title: "Переломы ключицы и лопатки", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/853_1", note: "ID 853_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: консервативное лечение — всем с закрытыми переломами ключицы без смещения и при отказе от операции: косыночная повязка, повязка Дезо, гипсовая повязка (УУР C, УДД 5); восьмиобразная не лучше косыночной и неудобнее; раздел 3.2: несращение при консервативном лечении — 10–23 %, после операции — 1–2 %; раздел 4: иммобилизация 3–6 недель" }
  - { kind: paper, title: "Robinson CM. Fractures of the clavicle in the adult. Epidemiology and classification. J Bone Joint Surg Br 1998;80(3):476–484", url: "https://pubmed.ncbi.nlm.nih.gov/9619941/", note: "PMID 9619941, сверено 29.09.2026: 1000 переломов; у переломов диафиза без смещения (тип 2A) прогноз обычно благоприятный, осложнения сращения чаще при смещении (тип 2B)" }
review: draft
