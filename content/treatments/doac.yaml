id: tx.doac
name: { ru: "Прямые оральные антикоагулянты" }
kind: drug
class: anticoagulant.doac
route: oral
# курс на 3 месяца, ₽ — игровое число
cost: 3500
effects:
  # ТГВ: первая линия, без предварительного гепарина — апиксабан и ривароксабан (960_1, раздел
  # 3.2.5.2); за сколько дней стихают боль и отёк, в тексте нет — игровая оценка
  - { on: cond.dvt, kind: cure, band: usually, days: [14, 42] }
  # тромбофлебит: при высоком риске — лечебные дозы, как при ТГВ; при умеренном — #ривароксабан,
  # если уколы нельзя (668_2, разделы 3.0.2.2–3.0.2.3)
  - { on: cond.superficial_thrombophlebitis, kind: cure, band: usually, days: [7, 21], when: { risk: [moderate, high] } }
  # ТЭЛА низкого риска — дома (spec 2026-10-chapter-3, часть 43б): ПОАК вместо варфарина (ESC 2019, раздел 6.7, I A),
  # ранняя выписка (раздел 6.10, IIa A); как часто и за сколько дней — игровая оценка
  - { on: cond.pe, kind: cure, band: usually, days: [5, 21], when: { shock: [no] } }
contraindications:
  # при беременности — низкомолекулярный гепарин (960_1, раздел 3.8.1; 668_2, раздел 3.1.6.7)
  - { id: risk.pregnancy, level: absolute, reaction: rarely }
texts:
  hint:
    ru: "Апиксабан, ривароксабан, дабигатрана этексилат — таблетки против тромбов. При тромбозе глубоких вен — первая линия, не меньше 3 месяцев. При фибрилляции предсердий защищают от инсульта: постоянно — по шкале CHA₂DS₂-VASc, после кардиоверсии — 4 недели. При беременности не применяют."
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2.5.2 (УДД 3, УУР В): ПОАК — для начальной и длительной терапии; апиксабан и ривароксабан — без предварительного парентерального введения, дабигатрана этексилат и эдоксабан — только после него; раздел 3.3.3.5 (УУР В): всем не меньше 3 месяцев; критерий качества 5; раздел 3.8.1: при беременности — лечебные дозы НМГ" }
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.0.2.2 (УДД 2, УУР А): при умеренном риске и ограничениях к парентеральным формам — #ривароксабан, 45 дней; раздел 3.0.2.3: при высоком риске — лечебные дозы антикоагулянтов, как при ТГВ, 3 месяца; раздел 3.1.6.7: ривароксабан у беременных не рекомендуется" }
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.1.1: ПОАК — первая линия профилактики инсульта (ЕОК IA): мужчинам с 2 баллов CHA₂DS₂-VASc, женщинам с 3; антиагреганты для профилактики инсульта не рекомендованы (ЕОК IIIA); раздел 3.1.1.2: ПОАК с быстрым началом действия — перед кардиоверсией, после неё — не меньше 4 недель" }
  - { kind: guideline, title: "Рекомендации ESC по диагностике и лечению острой легочной эмболии, разработанные в сотрудничестве с Европейским респираторным обществом (ERS)", org: "ESC, ERS", year: 2019, url: "https://doi.org/10.15829/1560-4071-2020-3848", note: "перевод — Российский кардиологический журнал 2020;25(8):3848 (решение владельца, вопрос 25); стр. 32, раздел 6.7: если начинают пероральную антикоагуляцию — ПОАК (апиксабан, дабигатран, эдоксабан, ривароксабан) вместо АВК, I A; стр. 33, раздел 6.10: ранняя выписка при низком риске — IIa A; доля успеха — игровая оценка" }
review: draft
