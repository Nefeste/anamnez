id: tx.topical_heparin
name: { ru: "Гель с гепарином или НПВП" }
kind: drug
class: vascular.topical
# тюбик, ₽ — игровое число
cost: 350
effects:
  # местно при тромбофлебите — уменьшить воспаление и боль (668_2, разделы 3.0.2.5, 3.3.6, УУР А)
  - { on: cond.superficial_thrombophlebitis, kind: relieve, band: often, days: [1, 5] }
texts:
  hint:
    ru: "Гель или мазь на кожу над воспалённой веной — с гепарином натрия или НПВП. Уменьшает боль и покраснение при тромбофлебите; тромб в глубоких венах не лечит."
sources:
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.3.6 (УДД 2, УУР А): гепарин-содержащие препараты для местного применения (C05BA) на основе НПВП и/или гепарина натрия — в остром и стихающем периоде; раздел 3.3.2 (УДД 1, УУР А): НПВП для наружного применения (M02AA)" }
review: draft
