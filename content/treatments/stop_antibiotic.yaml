id: tx.stop_antibiotic
name: { ru: "Отменить антибиотик, на котором начался понос" }
kind: regimen
# отмена антибиотика — фактора риска (spec 2026-10-chapter-4, часть 49б; 878_1, раздел 3.1.1, УУР C, УДД 5; критерий
# качества 11): «как можно скорейшая отмена», если это не противоречит лечению других болезней. При лёгкой диарее
# «спонтанное выздоровление происходит через 5–10 дней после отмены» (раздел 1.6) — облегчение, игровая оценка
cost: 0
effects:
  - { on: cond.cdiff, kind: relieve, band: usually, days: [2, 5], when: { abx: [taking] } }
texts:
  hint:
    ru: "Антибиотик, на котором начался понос, отменяют как можно скорее, если без него можно обойтись: пока он идёт, C. difficile размножается дальше. Если курс уже закончен, отменять нечего."
sources:
  - { kind: guideline, title: "Энтероколит, вызванный Clostridioides difficile (C. difficile)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/878_1", note: "ID 878_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.1 (УУР C, УДД 5): отмена антибактериальной терапии, служащей фактором риска, если это не противоречит лечению других заболеваний; критерий качества 11; раздел 1.6: при лёгкой диарее выздоровление через 5–10 дней после отмены" }
review: draft
