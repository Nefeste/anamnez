id: tx.cpap
name: { ru: "Неинвазивная вентиляция маской (CPAP)" }
kind: procedure
# постоянное положительное давление в дыхательных путях через маску (spec 2026-10-chapter-3, часть 43в): при ОДСН с
# дыхательной недостаточностью — частота дыхания выше 25, сатурация ниже 90 % — и при отёке лёгких «рекомендуется
# скорейшее начало» неинвазивной вентиляции (156_2, раздел 7.4.1.2); при артериальной гипотонии — не рекомендуется.
# Аппарат в игре отдельно не покупается: маску ставят у постели под монитором; ₽ — игровое число
class: oxygen.niv
route: inhaled
cost: 2000
bedside: { equipment: [eq.monitor_defib] }
effects:
  # дыхательная недостаточность отступает за часы, причину не лечит; насколько — игровая оценка
  - { on: cond.adhf, kind: relieve, band: usually, days: [0, 1], when: { type: [edema] } }
  - { on: cond.adhf, kind: relieve, band: often, days: [0, 1], when: { rr_above25: [yes] } }
texts:
  hint:
    ru: "Плотная маска с постоянным давлением на вдохе и выдохе: расправляет альвеолы и выдавливает жидкость из лёгких. При отёке лёгких и частом дыхании — сразу, у постели под монитором. При низком давлении нельзя: оно падает ещё ниже."
sources:
  - { kind: guideline, title: "Хроническая сердечная недостаточность", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/156_2", note: "ID 156_2, опубликованы 07.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 7.4.1.2: при дыхательной недостаточности (ЧДД > 25/мин, SpO₂ < 90 %) и при отёке лёгких — скорейшее начало НИВЛ, CPAP или BiPAP; не рекомендуется при артериальной гипотонии; насколько помогает — игровая оценка" }
review: draft
