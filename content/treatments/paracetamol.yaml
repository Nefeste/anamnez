  - { kind: paper, title: "Bulger EM, Arneson MA, Mock CN, Jurkovich GJ. Rib fractures in the elderly. J Trauma 2000;48(6):1040–1046", url: "https://pubmed.ncbi.nlm.nih.gov/10866248/", note: "PMID 10866248, сверено 29.09.2026: 277 больных 65 лет и старше и 187 моложе с переломами рёбер; пневмония — 31 и 17 %, смертность — 22 и 10 %; на каждое сломанное ребро — отношение шансов смерти 1,19, пневмонии — 1,16" }
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1.1 (УУР C, УДД 5): при головной боли — сначала немедикаментозное лечение, затем анальгетики, за исключением опиоидов" }
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2 (УУР C, УДД 5): обезболивание — другие анальгетики и антипиретики (N02B)" }
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1.2 (УУР C, УДД 5): обезболивание при ВАШ больше 3 баллов; на начальном этапе — «другие анальгетики и антипиретики» или НПВП, при нарастании боли — опиоиды; критерий качества первичной помощи 1 — назначены анальгетики" }
