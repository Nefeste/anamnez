  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3: всем с закрытой травмой груди — адекватная анальгезия, НПВП (M01A) (УУР C, УДД 5), обезболивание позволяет поддерживать вентиляцию, продуктивный кашель и дыхательные упражнения; критерий качества 5: лечение НПВП и (или) парацетамолом; раздел 7: сращение рёбер — через 3–4 недели" }
  - { kind: paper, title: "Bulger EM, Arneson MA, Mock CN, Jurkovich GJ. Rib fractures in the elderly. J Trauma 2000;48(6):1040–1046", url: "https://pubmed.ncbi.nlm.nih.gov/10866248/", note: "PMID 10866248, сверено 29.09.2026: 277 больных 65 лет и старше и 187 моложе с переломами рёбер; пневмония — 31 и 17 %, смертность — 22 и 10 %; на каждое сломанное ребро — отношение шансов смерти 1,19, пневмонии — 1,16" }
