id: tx.valaciclovir
name: { ru: "Валацикловир или ацикловир внутрь" }
kind: drug
# противовирусные системного действия при невропатии лицевого нерва (spec 2026-10-chapter-3, часть 44б): только
# вместе с глюкокортикоидом, на ранних стадиях при тяжёлой (895_1, раздел 3.2.1); одни — не помогают
class: antiviral.herpes
route: oral
cost: 900
effects:
  # вместе с глюкокортикоидом при тяжёлой — облегчает, игровая оценка: в 895_1 величины эффекта нет
  - { on: cond.bell_palsy, kind: relieve, band: sometimes, days: [7, 21], when: { severity: [severe] } }
texts:
  hint:
    ru: "Противовирусные против вирусов герпеса. При невропатии лицевого нерва их дают только вместе с глюкокортикоидом и только при тяжёлой — в первые дни: одни они не помогают."
sources:
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.2.1 (УУР B, УДД 1): противовирусные средства системного действия — совместно с глюкокортикостероидами, на ранних стадиях заболевания у пациентов с тяжёлой НЛН и/или при подтверждённой вирусной инфекции, в качестве монотерапии не показали эффективность; ацикловир (АТХ J05AB01), валацикловир (J05AB11)" }
review: draft
