id: tx.tbe_ig
name: { ru: "Иммуноглобулин против клещевого энцефалита" }
kind: drug
class: vaccine.tbe_ig
route: im
cost: 4000
# экстренная профилактика (spec 2026-10-chapter-4, часть 51а; 567_2, раздел 5.1, УУР C, УДД 5; критерий качества 27): при
# присасывании вирусофорного клеща не болевшим и не привитым, а также с незавершённым курсом — в первые 72 часа; ₽ — игровое
# число
effects:
  # у заболевшего (spec 2026-10-chapter-4, часть 51б; 567_2, раздел 3.1, УУР C, УДД 5): «только на этапе виремии» — при
  # лихорадочной форме; при очаговых — «сведения об утяжелении течения КЭ», «высока опасность прогрессирования
  # иммунопатологических реакций». Доли — игровая оценка
  - { on: cond.tbe, kind: cure, band: sometimes, days: [5, 10], when: { form: [fever] } }
  - { on: cond.tbe, kind: harm, band: sometimes, days: [1, 3], when: { form: [encephalitic, encephalitic_coma, polio, polio_breath] } }
texts:
  hint:
    ru: "Готовые антитела против вируса клещевого энцефалита — в мышцу. После укуса их вводят не привитому, если в клеще нашли вирус, и только в первые 72 часа. У заболевшего — только при лихорадочной форме: при поражении мозга они утяжеляют течение."
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 5.1: рекомендуется при присасывании вирусофорных клещей не болевшим и не вакцинированным ранее людям, а также с незавершённым или дефектным курсом, в первые 72 часа; позже 3–4 дней иммуноглобулин не показан" }
review: draft
