id: tx.variceal_ligation
name: { ru: "Эндоскопическое лигирование вен пищевода" }
# лигирование кровоточащих вен через эндоскоп (spec 2026-10-chapter-4, часть 54а): при продолжающемся кровотечении из вен
# пищевода и желудка 1 типа «предпринять попытку лигирования» (715_2, раздел 3.3.1, УУР C, УДД 5), вместе с терлипрессином
# или октреотидом (УУР A, УДД 1); после кровотечения — лигирование и бета-адреноблокатор для вторичной профилактики (раздел
# 5). В эндоскопическом кабинете; ₽ — игровое число
kind: procedure
class: hemostasis.endoscopic
cost: 6000
room: room.endoscopy
effects:
  # «комбинация двух методов лечения наиболее эффективна» (715_2, раздел 3.3.1); доля без повторного кровотечения в тексте
  # не названа — игровая оценка
  - { on: cond.variceal_bleeding, kind: cure, band: { pct: 85 }, days: [3, 7] }
texts:
  hint:
    ru: "Через эндоскоп на варикозную вену пищевода надевают тугое резиновое кольцо: вена перестаёт кровоточить и потом зарастает. Делают при кровотечении из вен у больного циррозом — вместе с терлипрессином или октреотидом."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3.1 (УУР C, УДД 5): лигирование источника при продолжающемся кровотечении из вен пищевода и желудка 1 типа; (УУР A, УДД 1): в комбинации с терлипрессином или октреотидом; раздел 5: после кровотечения — лигирование с бета-адреноблокатором; критерий качества 17; доля успеха — игровая оценка" }
review: draft
