id: tx.salbutamol
name: { ru: "Сальбутамол" }
kind: drug
class: bronchodilator.saba
route: inhaled
cost: 250
effects:
  - { on: cond.copd_exacerbation, kind: cure, band: often, days: [1, 4] }
  - { on: cond.asthma_exacerbation, kind: cure, band: often, days: [1, 4] }
  # анафилактический шок (часть 33б): бронхоспазм, который держится после эпинефрина, — сальбутамол
  # через небулайзер (263_2, рек. 26); причину не лечат — облегчение, игровая оценка
  - { on: cond.anaphylaxis, kind: relieve, band: sometimes, days: [0, 1] }
texts:
  hint:
    ru: "Ингалятор или небулайзер, быстро расширяющий бронхи: при обострении ХОБЛ и астмы облегчает дыхание за минуты. При анафилактическом шоке — если бронхоспазм держится после эпинефрина."
sources:
  - { kind: guideline, title: "Хроническая обструктивная болезнь легких", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/603_3", note: "ID 603_3, опубликованы 17.12.2024, применяются; сверено с рубрикатором 28.09.2026" }
  - { kind: guideline, title: "Global Strategy for the Diagnosis, Management and Prevention of COPD (GOLD) 2024", org: "GOLD", note: "черновик: сверить раздел об обострениях" }
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; рек. 26 (УУР С, УДД 5): при бронхоспазме, сохраняющемся несмотря на эпинефрин, — селективный бета2-адреномиметик: сальбутамол через небулайзер" }
review: draft
