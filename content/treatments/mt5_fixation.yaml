id: tx.mt5_fixation
name: { ru: "Остеосинтез пятой плюсневой кости" }
kind: surgery
class: surgery.bone
# винт или пластина и расходники, ₽ — игровое число
cost: 15000
effects:
  - { on: cond.mt5_fracture, kind: cure, band: { pct: 100 }, days: [1, 2] }
# операция — при значительном смещении и угрозе мягким тканям (856_1, раздел 3.2); длительность и
# доля осложнений в стационаре в источниках не даны — игровые оценки
surgery:
  room: room.or
  team: [role.surgeon, role.anesthetist, role.or_nurse]
  equipment: [eq.or_table, eq.anesthesia]
  minutes: 45
  complications: { pct: 5 }
texts:
  hint:
    ru: "Репозиция отломков пятой плюсневой кости и фиксация винтом или пластиной из доступа по наружному краю стопы. Нужна, когда отломки значительно смещены и сами не встанут."
sources:
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2: оперативное лечение — при значительном смещении костных отломков, угрозе сдавления сосудисто-нервного пучка, угрозе перфорации кожи (УУР A, УДД 2); спицы, винты, пластины; к изолированному перелому 5 плюсневой — продольный латеральный доступ; срок операции в часах не назван" }
review: draft
