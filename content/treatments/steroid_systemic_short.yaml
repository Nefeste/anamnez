id: tx.steroid_systemic_short
name: { ru: "Системные глюкокортикостероиды коротким курсом" }
kind: drug
class: steroid.systemic
route: oral
cost: 100
effects:
  - { on: cond.copd_exacerbation, kind: cure, band: often, days: [2, 5] }
  - { on: cond.asthma_exacerbation, kind: cure, band: usually, days: [2, 5] }
  # невропатия лицевого нерва (spec 2026-10-chapter-3, часть 44б): преднизолон внутрь — как можно раньше, оптимально
  # в первые 72 часа (895_1, раздел 3.2.1, УУР A): полное восстановление чаще на 17 %, у 80 % выздоровевших — за 2–3
  # недели (раздел 2.4). Доли — игровая оценка
  - { on: cond.bell_palsy, kind: cure, band: usually, days: [14, 21], when: { h72: [yes] } }
  - { on: cond.bell_palsy, kind: cure, band: often, days: [21, 42], when: { h72: [no] } }
  # тяжёлый алкогольный гепатит (spec 2026-10-chapter-4, часть 54б): индекс Маддрея 32 и больше, нет активной инфекции —
  # преднизолон внутрь (711_2, раздел 3.3, УУР C, УДД 5; критерий качества 8 — «коротким курсом»); к 28-му дню без него
  # выживает 52 %, с ним — 78 % (приложение Г7, шкала GAHS)
  - { on: cond.alcoholic_hepatitis, kind: cure, band: usually, days: [14, 28], when: { severity: [severe] } }
  # острая крапивница (часть 73): без эффекта от антигистаминных — глюкокортикоиды «с целью купирования острых
  # проявлений минимальным необходимым курсом», у взрослых до 10 дней (264_2, раздел 3.3.1, рек. 2, УУР C, УДД 4); доля и
  # сроки — игровая оценка. Первым, до антигистаминных, — не по рекомендации: в игре только облегчение
  - { on: cond.urticaria_acute, kind: cure, band: usually, days: [1, 5], when: { tried: [failed] } }
  - { on: cond.urticaria_acute, kind: relieve, band: usually, days: [0, 1], when: { tried: [no] } }
texts:
  hint:
    ru: "Гормон (например, преднизолон), снимающий воспаление: короткий курс ускоряет выздоровление при обострении ХОБЛ и астмы; при невропатии лицевого нерва — в первые 72 часа; при тяжёлом алкогольном гепатите — если нет инфекции; при острой крапивнице — если не помогли таблетки от аллергии. При простуде и бронхите не нужен."
sources:
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.2.1 (УУР A, УДД 1): глюкокортикостероиды как можно раньше, оптимально в первые 72 часа, независимо от тяжести; преднизолон внутрь (АТХ H02AB06)" }
  - { kind: guideline, title: "Хроническая обструктивная болезнь легких", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/603_3", note: "ID 603_3, опубликованы 17.12.2024, применяются; сверено с рубрикатором 28.09.2026" }
  - { kind: guideline, title: "Global Strategy for the Diagnosis, Management and Prevention of COPD (GOLD) 2024", org: "GOLD", note: "черновик: сверить раздел об обострениях" }
  - { kind: guideline, title: "Алкогольная болезнь печени", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/711_2", note: "ID 711_2, опубликованы 30.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3 (УУР C, УДД 5): при тяжёлом алкогольном гепатите (индекс Маддрея 32 и больше, MELD 20 и больше) без активной инфекции — преднизолон внутрь, до начала обследовать на инфекции и желудочно-кишечное кровотечение; приложение Г7: при GAHS больше 8 к 28-му дню выживает 52 %, с глюкокортикостероидами — 78 %; критерий качества 8; дозы опущены" }
  - { kind: guideline, title: "Крапивница", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/264_2", note: "ID 264_2, опубликованы 19.07.2023, применяются; сверено с рубрикатором 15.10.2026; раздел 3.3.1, рек. 2 (УУР C, УДД 4): при отсутствии эффекта от антигистаминных — глюкокортикоиды минимальным необходимым курсом, у взрослых до 10 дней, постепенной отмены не требуется; преднизолон внутрь, дексаметазон; критерий качества 3; доля и сроки — игровая оценка; дозы опущены" }
review: draft
