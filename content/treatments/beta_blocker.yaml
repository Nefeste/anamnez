# Бета-адреноблокатор (spec 2026-10-chapter-3, часть 39г): при стабильной стенокардии I–II ФК и ЧСС больше
# 60 — препарат первой линии (155_2, раздел 3.1.2.1, ЕОК IA), при III–IV ФК — сразу вместе с
# дигидропиридиновым блокатором кальциевых каналов (ЕОК IC). Действие на причину — урежает пульс и снижает
# потребность сердца в кислороде; оценивают через 3–5 дней и через 2–4 недели (там же). Доли — игровая
# оценка
id: tx.beta_blocker
name: { ru: "Бета-адреноблокатор" }
kind: drug
class: antianginal.beta_blocker
route: oral
cost: 150
effects:
  - { on: cond.angina_stable, kind: cure, band: usually, days: [3, 28] }
# абсолютные противопоказания — синоатриальная и АВ-блокада 2–3-й степени, синдром слабости синусового
# узла и бронхиальная астма (62_3); в базе из них — астма. Бронхоспазм при противопоказании — игровая оценка
contraindications:
  - { id: cond.asthma, level: absolute, reaction: often }
texts:
  hint:
    ru: "Урежает пульс и снижает потребность сердца в кислороде: приступов стенокардии меньше. Первая линия при стенокардии напряжения; при бронхиальной астме нельзя — вызывает бронхоспазм."
sources:
  - { kind: guideline, title: "Стабильная ишемическая болезнь сердца", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/155_2", note: "ID 155_2, опубликованы 04.10.2024, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.2.1: при I–II ФК и ЧСС больше 60 — БАБ или не-ДГП-БКК первой линии (ЕОК IA), при III–IV ФК — сразу БАБ с ДГП-БКК (ЕОК IC); оценка эффекта через 3–5 дней и 2–4 недели" }
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 04.10.2026; абсолютные противопоказания к бета-адреноблокаторам: синоатриальная и атриовентрикулярная блокада 2–3-й степени, синдром слабости синусового узла, бронхиальная астма" }
review: draft
