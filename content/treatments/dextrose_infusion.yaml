id: tx.dextrose_infusion
name: { ru: "Декстроза капельно" }
# раствор декстрозы в вену капельно (spec 2026-10-chapter-3, часть 44а; 290_2, раздел 3.7): не пришёл в себя после
# декстрозы струйно — и госпитализировать; от таблеток с большой продолжительностью действия — до нормализации
# гликемии и полного выведения препарата. Концентрация и объём — не в игре (ADR 0012); ₽ — игровое число
kind: drug
class: glucose.iv
route: iv
cost: 300
effects:
  # насколько помогает — игровая оценка
  - { on: cond.hypoglycemia, kind: cure, band: usually, days: [0, 1] }
texts:
  hint:
    ru: "Раствор декстрозы через капельницу, часами. Нужен, когда после декстрозы струйно сознание не вернулось, и при тяжёлой гипогликемии от таблеток сульфонилмочевины: они действуют до суток, и без капельницы сахар падает снова."
sources:
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: если сознание не восстанавливается после декстрозы в/в струйно — в/в капельно и госпитализировать; при передозировке ПССП с большой продолжительностью действия — капельно до нормализации гликемии и полного выведения препарата; приложение А3: сульфонилмочевина действует 8–24 часа; насколько помогает — игровая оценка" }
review: draft
