id: tx.drotaverine
name: { ru: "Дротаверин" }
kind: drug
class: analgesic.spasmolytic
route: iv
cost: 60
# спазмолитик (папаверин и его производные, АТХ A03AD): при желчной колике — вместе с НПВП до
# разрешения симптомов (877_1, раздел 3.2); при остром холецистите — парентерально до операции
effects:
  - { on: cond.biliary_colic, kind: cure, band: usually, days: [0, 1] }
  - { on: cond.cholecystitis, kind: relieve, band: often, days: [0, 1] }
  # шигеллёз (spec 2026-10-chapter-4, часть 49б): дротаверин взрослым при болях (869_1, раздел 3.1.2); облегчение — игровая
  # оценка
  - { on: cond.shigellosis, kind: relieve, band: often, days: [0, 1] }
  # синдром раздражённого кишечника (spec 2026-10-chapter-4, часть 55б): спазмолитики АТХ A03 при боли (892_1, раздел 3.3, УУР
  # A, УДД 1), дротаверин — тоже A03 (A03AD02), но по имени в 892_1 не назван: полоса ниже, чем у мебеверина, — игровая оценка
  - { on: cond.ibs, kind: cure, band: sometimes, days: [7, 28] }
contraindications: []
texts:
  hint:
    ru: "Спазмолитик: расслабляет гладкие мышцы желчных путей и кишки. При желчной колике — вместе с противовоспалительным, пока не пройдёт боль; при шигеллёзе — от схваткообразной боли в животе; при синдроме раздражённого кишечника — можно, но выбор там мебеверин. Причину не убирает."
sources:
  - { kind: guideline, title: "Желчнокаменная болезнь", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/877_1", note: "ID 877_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2: при приступе желчной колики — НПВП и в дополнение спазмолитики до разрешения симптомов; при остром холецистите — спазмолитики парентерально" }
  - { kind: guideline, title: "Шигеллез", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/869_1", note: "ID 869_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 3.1.2 (УУР C, УДД 5): спазмолитик дротаверин взрослым при болях" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3 (УУР A, УДД 1): спазмолитики АТХ A03 при боли в животе; названы гиосцина бутилбромид, пинаверия бромид, отилония бромид и мебеверин, дротаверина в тексте нет; критерий качества 2 — назначены спазмолитики; полоса — игровая оценка" }
review: draft
