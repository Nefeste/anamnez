id: tx.drotaverine
name: { ru: "Дротаверин" }
kind: drug
class: analgesic.spasmolytic
route: iv
cost: 60
# спазмолитик (папаверин и его производные, АТХ A03AD): при желчной колике — вместе с НПВП до
# разрешения симптомов (877_1, раздел 3.2); при остром холецистите — парентерально до операции
effects:
  - { on: cond.biliary_colic, kind: cure, band: usually, days: [0, 1] }
  - { on: cond.cholecystitis, kind: relieve, band: often, days: [0, 1] }
contraindications: []
texts:
  hint:
    ru: "Спазмолитик: расслабляет гладкие мышцы желчных путей. При желчной колике — вместе с противовоспалительным, пока не пройдёт боль. Причину, камень, не убирает."
sources:
  - { kind: guideline, title: "Желчнокаменная болезнь", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/877_1", note: "ID 877_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2: при приступе желчной колики — НПВП и в дополнение спазмолитики до разрешения симптомов; при остром холецистите — спазмолитики парентерально" }
review: draft
