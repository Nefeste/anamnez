id: tx.zinc_bisvinylimidazole
name: { ru: "Цинка бисвинилимидазола диацетат" }
kind: drug
# антидот угарного газа по 885_1 (spec 2026-10-chapter-4, часть 57б): «Рекомендовано в качестве этиотропной терапии при отравлении
# монооксидом углерода у лиц старше 18 лет применение цинка бисвинилимидазола диацетата» (раздел 3.1, УУР С, УДД 5) — в мышцу, «в
# наиболее ранние сроки вне зависимости от тяжести поражения» (раздел 3.2); критерий качества 14 — каждому взрослому. Снижает
# сродство гемоглобина к угарному газу (раздел 3.2); лечит кислород, этот препарат облегчает — игровая оценка. Доз нет; ₽ — игровое
class: antidote.co
route: im
cost: 250
effects:
  - { on: cond.co_poisoning, kind: relieve, band: sometimes, days: [0, 1] }
texts:
  hint:
    ru: "Антидот угарного газа по российской рекомендации: в мышцу как можно раньше, при любой тяжести, только взрослым. Снижает сродство гемоглобина к угарному газу и помогает тканям получать кислород. Главное лечение — кислород, а этот препарат ему помогает."
sources:
  - { kind: guideline, title: "Токсическое действие окиси углерода. Токсическое действие других газов, дымов и паров", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/885_1", note: "ID 885_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 3.1 (УУР С, УДД 5): этиотропная терапия у лиц старше 18 лет, в мышцу сразу после эвакуации из очага; раздел 3.2 (УУР С, УДД 5): в наиболее ранние сроки вне зависимости от тяжести, снижает кооперативность гемов и относительное сродство гемоглобина к угарному газу; критерий качества 14; доля облегчения — игровая оценка" }
review: draft
