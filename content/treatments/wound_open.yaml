id: tx.wound_open
name: { ru: "Хирургическая обработка раны, шов отложен" }
kind: procedure
class: wound.open
cost: 1200
effects:
  # обработка без шва закрывает любую рану, дольше шва — игровая оценка; укус и рана старше суток —
  # ПХО (688_2, раздел 3.2)
  # перерезанное сухожилие обработка кожи не лечит — его шьёт кистевой хирург
  - { on: cond.hand_wound, kind: cure, band: usually, days: [14, 21], when: { tendon: [intact] } }
  # укушенные и загрязнённые раны — многократная обработка 48 ч, затем шов (733_2, раздел 3.2)
  - { on: cond.head_wound, kind: cure, band: usually, days: [10, 14] }
texts:
  hint:
    ru: "Рану обрабатывают так же, как перед швом, но наглухо не зашивают: перевязывают и промывают, а зашивают через двое суток, когда рана очистится. Так лечат укушенные, загрязнённые и поздние раны — зашитые сразу, они нагнаиваются."
sources:
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2: загрязнённые раны скальпа, в том числе укусы животных и людей, — отсроченное вторичное закрытие: рану многократно обрабатывают в течение 48 ч и после очищения ушивают" }
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2 (УУР C, УДД 5): первичная хирургическая обработка — укушенной ране, неукушенной ране давностью сутки и более или инфицированной; критерий качества 1" }
  - { kind: guideline, title: "Бешенство (гидрофобия) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/979_1", note: "ID 979_1, опубликованы 09.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 5.2 (УУР C, УДД 5): немедленная местная обработка — промывание водой с мылом до 15 минут, края — антисептиком; наложение швов на раны при риске бешенства не рекомендуется" }
review: draft
