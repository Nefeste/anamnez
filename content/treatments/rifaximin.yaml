id: tx.rifaximin
name: { ru: "Рифаксимин" }
kind: drug
# невсасывающийся антибиотик (spec 2026-10-chapter-4, часть 54а): подавляет образующую аммиак флору кишечника; при явной
# печёночной энцефалопатии II–III стадии — «с целью уменьшения симптомов ПЭ, снижения уровня аммиака» (715_2, раздел 3.2.3,
# УУР A, УДД 1), один или с лактулозой. Внутрь; доз нет (ADR 0012); ₽ — игровое число
class: antibiotic.rifaximin
route: oral
cost: 900
effects:
  # как часто и за сколько дней проходит энцефалопатия — игровая оценка
  - { on: cond.hepatic_encephalopathy, kind: cure, band: often, days: [3, 7], when: { grade: [g2, g3] } }
texts:
  hint:
    ru: "Антибиотик, который почти не всасывается и действует в кишечнике: подавляет бактерии, образующие аммиак. При печёночной энцефалопатии II–III стадии — вместе с лактулозой или вместо неё."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.3 (УУР A, УДД 1): рифаксимин при явной ПЭ II–III стадии — уменьшить симптомы и уровень аммиака; лактулоза, рифаксимин и орнитин — монотерапией или вместе, по усмотрению врача; критерий качества 12; дозы опущены; как часто и за сколько дней — игровая оценка" }
