id: tx.rifaximin
name: { ru: "Рифаксимин" }
kind: drug
# невсасывающийся антибиотик (spec 2026-10-chapter-4, часть 54а): подавляет образующую аммиак флору кишечника; при явной
# печёночной энцефалопатии II–III стадии — «с целью уменьшения симптомов ПЭ, снижения уровня аммиака» (715_2, раздел 3.2.3,
# УУР A, УДД 1), один или с лактулозой. С частью 55б — при синдроме раздражённого кишечника с диареей: короткий курс 10 дней
# «для купирования диареи» (892_1, раздел 3.3, УУР A, УДД 1; критерий качества 3), NNT 10,2 — полоса игровая. Внутрь; доз
# нет (ADR 0012); ₽ — игровое число
class: antibiotic.rifaximin
route: oral
cost: 900
effects:
  # как часто и за сколько дней проходит энцефалопатия — игровая оценка
  - { on: cond.hepatic_encephalopathy, kind: cure, band: often, days: [3, 7], when: { grade: [g2, g3] } }
  - { on: cond.ibs, kind: cure, band: sometimes, days: [7, 21], when: { variant: [diarrhea] } }
texts:
  hint:
    ru: "Антибиотик, который почти не всасывается и действует в кишечнике: подавляет бактерии, образующие аммиак. При печёночной энцефалопатии II–III стадии — вместе с лактулозой или вместо неё. При синдроме раздражённого кишечника с диареей — короткий курс 10 дней."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.3 (УУР A, УДД 1): рифаксимин при явной ПЭ II–III стадии — уменьшить симптомы и уровень аммиака; лактулоза, рифаксимин и орнитин — монотерапией или вместе, по усмотрению врача; критерий качества 12; дозы опущены; как часто и за сколько дней — игровая оценка" }
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3 (УУР A, УДД 1): рифаксимин при СРК с диареей курсом 10 дней — по мета-анализу 18 РКИ купирует диарею и уменьшает вздутие, NNT 10,2; критерий качества 3; доля излечения — игровая оценка" }
review: draft
