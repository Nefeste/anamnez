id: tx.nose_pinch
name: { ru: "Прижать крылья носа" }
kind: procedure
class: nasal.first_aid
cost: 0
effects:
  # при переднем кровотечении — всем сначала, 5 минут и дольше (977_1, раздел 3.1.2, УУР В, УДД 3);
  # сколько кровотечений останавливает одно прижатие, в тексте нет — «иногда», игровая оценка
  - { on: cond.epistaxis, kind: cure, band: sometimes, days: [0, 0], when: { source: [anterior_visible, anterior_hidden] } }
texts:
  hint:
    ru: "Сидя или стоя, голова немного наклонена вперёд, кровь не глотают: высморкать сгустки и плотно прижать крылья носа к перегородке на 5–15 минут. Если кровь стекает в горло и при прижатых крыльях, кровит сзади."
sources:
  - { kind: guideline, title: "Носовое кровотечение", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/977_1", note: "ID 977_1, опубликованы 08.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1.2 (УУР В, УДД 3): при активном кровотечении из передних отделов — всем сначала прижать крылья носа к перегородке на 5 минут и дольше, вертикально, голова немного вперёд; продолжающееся стекание крови при прижатии — источник в задних отделах; прил. В: до 15 минут, кровь не глотать; доля остановленных — игровая оценка" }
review: draft
