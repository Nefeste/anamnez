id: tx.dopamine
name: { ru: "Допамин в вену" }
kind: drug
# учащает ритм и улучшает проведение при ДСУ и ПЖБ II–III степени с симптомами или нарушением гемодинамики — «при
# низкой вероятности ишемической болезни сердца» (spec 2026-10-chapter-3, часть 42в; 160_2, разделы 3.1.1 и 3.1.2,
# применение вне инструкции); инфузией под монитором — у постели; ₽ — игровое число
class: adrenergic.dopamine
route: iv
cost: 400
bedside: { equipment: [eq.monitor_defib] }
effects:
  # пульс чаще — часто, при любом уровне блока (игровая оценка); причину не лечит
  - { on: cond.av_block, kind: relieve, band: often, days: [0, 0] }
  # «холодная» острая сердечная недостаточность (часть 43в): инотроп при гипотонии и гипоперфузии (156_2, раздел
  # 7.4.1.5); при кардиогенном шоке в стационаре умирает почти каждый второй (ALARM-HF: 43 % умерших — от шока) —
  # как часто помогает, игровая оценка
  - { on: cond.adhf, kind: cure, band: often, days: [3, 10], when: { type: [cold] } }
# при ИБС — с осторожностью: «при низкой вероятности ишемической болезни сердца» (раздел 3.1.2); ишемия при
# сосудистом риске — игровая оценка
contraindications:
  - { id: risk.vascular, level: relative, reaction: rarely }
texts:
  hint:
    ru: "Капельно в вену под монитором: сердце бьётся чаще и сильнее. Им учащают редкий пульс, пока не наладят стимуляцию. При ишемической болезни сердца — с осторожностью: сердцу нужно больше кислорода."
sources:
  - { kind: guideline, title: "Брадиаритмии и нарушения проводимости", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/160_2", note: "ID 160_2, опубликованы 18.06.2025, применяются; сверено с рубрикатором 05.10.2026; разделы 3.1.1 и 3.1.2: при ДСУ и ПЖБ II–III степени с симптоматикой или гемодинамически значимым состоянием при низкой вероятности ИБС допамин рекомендован (УУР B, УДД 2), применение вне инструкции; доля успеха и реакция при ИБС — игровая оценка" }
review: draft
