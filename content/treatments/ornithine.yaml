id: tx.ornithine
name: { ru: "Орнитин в вену" }
kind: drug
# L-орнитин-L-аспартат (spec 2026-10-chapter-4, часть 54а): связывает аммиак, усиливая цикл мочевины; при явной печёночной
# энцефалопатии II–IV стадии — «для уменьшения симптомов ПЭ, уровня аммиака крови, 28-дневной смертности» (715_2, раздел
# 3.2.3, УУР A, УДД 1); капельно в вену, потом внутрь. Ограничен при тяжёлой почечной недостаточности. Доз нет (ADR 0012);
# ₽ — игровое число
class: liver.ornithine
route: iv
cost: 1200
effects:
  # как часто и за сколько дней проходит энцефалопатия — игровая оценка
  - { on: cond.hepatic_encephalopathy, kind: cure, band: often, days: [3, 7] }
texts:
  hint:
    ru: "Капельница с аминокислотами, которые помогают печени и мышцам превращать аммиак в безвредную мочевину. При печёночной энцефалопатии II–IV стадии — и при коме — вместе с лактулозой или вместо неё."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.3 (УУР A, УДД 1): орнитин при явной ПЭ II–IV стадии — уменьшить симптомы, аммиак крови и 28-дневную смертность; в вену капельно, затем внутрь; ограничен при креатинине выше 266 мкмоль/л; критерий качества 12; дозы опущены; как часто и за сколько дней — игровая оценка" }
review: draft
