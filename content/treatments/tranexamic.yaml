id: tx.tranexamic
name: { ru: "Транексамовая кислота" }
kind: drug
# антифибринолитик (АТХ B02AA02): при гипертензивной ВМГ рутинно не рекомендуется; при аСАК антифибринолитики
# для рутинного лечения не рекомендуются (spec 2026-10-chapter-3, часть 41в; 523_3, разделы 3.1.1 и 3.2.1).
# Режим и дозы — не в игре; цена — игровое число
class: hemostatic.antifibrinolytic
route: iv
cost: 500
texts:
  hint:
    ru: "Антифибринолитик: мешает растворяться сгустку. При кровоизлиянии в мозг рутинно не рекомендуется — гематома растёт чуть меньше, а смертность и инвалидность те же; при субарахноидальном кровоизлиянии антифибринолитики тоже не рекомендуются. При кровотечении из вен пищевода не помогает."
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 3.1.1: не рекомендуется рутинное применение транексамовой кислоты, на смертность и зависимость к 90-му дню значимо не влияла, рост гематомы через 24 часа — меньше; раздел 3.2.1: антифибринолитическая терапия для рутинного лечения аСАК не рекомендуется" }
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2.2 (УУР A, УДД 1): при варикозных кровотечениях у больных циррозом — воздерживаться от транексамовой кислоты, эффективность не доказана" }
review: draft
