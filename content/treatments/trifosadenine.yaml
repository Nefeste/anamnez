id: tx.trifosadenine
name: { ru: "Трифосаденин в вену" }
kind: drug
# препарат выбора при наджелудочковой тахикардии с узкими комплексами, когда вагусные пробы не помогли
# (spec 2026-10-chapter-3, часть 42б; 619_3, раздел 3.1.1, ЕОК IB): в крови быстро превращается в аденозин и
# на секунды блокирует АВ-узел. Болюсом под ЭКГ — у постели с монитором; ₽ — игровое число
class: antiarrhythmic.trifosadenine
route: iv
cost: 300
bedside: { equipment: [eq.monitor_defib] }
effects:
  # обрывает тахикардию с участием АВ-узла — почти всегда: игровая оценка, в 619_3 долей нет; нестабильному —
  # разряд сразу (раздел 3.1.1, ЕОК IB)
  - { on: cond.svt, kind: cure, band: { pct: 90 }, days: [0, 0], when: { unstable: [no] } }
# противопоказания — тяжёлая бронхиальная астма и стенокардия (раздел 3.1.1): в базе из них — астма;
# бронхоспазм при противопоказании — игровая оценка
contraindications:
  - { id: cond.asthma, level: absolute, reaction: sometimes }
texts:
  hint:
    ru: "В вену быстро, под монитором: на несколько секунд блокирует проведение в сердце и обрывает приступ наджелудочковой тахикардии. Человека предупреждают: будет прилив к лицу и короткая нехватка воздуха. При бронхиальной астме и стенокардии нельзя."
sources:
  - { kind: guideline, title: "Наджелудочковые тахикардии", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/619_3", note: "ID 619_3, опубликованы 17.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 2.5: трифосаденин — аденозин с тремя фосфатными группами, быстро превращается в аденозин; раздел 3.1.1 (ЕОК IB): препарат выбора при стабильной тахикардии с узкими QRS после вагусных приёмов, болюсом; противопоказания — тяжёлая бронхиальная астма и стенокардия; побочные — прилив к лицу, бронхоспазм, АВ-блокада, о них предупреждают; доля успеха — игровая оценка" }
review: draft
