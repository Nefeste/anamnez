id: tx.iv_fluids
name: { ru: "Инфузионная терапия" }
kind: drug
class: rehydration.iv
route: iv
cost: 300
# растворы, влияющие на водно-электролитный баланс (АТХ B05BB): при остром холецистите — для
# коррекции нарушений (877_1, раздел 3.2); при остром панкреатите — основа лечения ранней фазы
# (903_1, раздел 3.1); лёгкий панкреатит проходит за несколько дней — игровая оценка
effects:
  - { on: cond.pancreatitis, kind: cure, band: usually, days: [3, 7] }
  - { on: cond.cholecystitis, kind: relieve, band: sometimes, days: [0, 2] }
contraindications: []
texts:
  hint:
    ru: "Растворы солей в вену через капельницу: возмещают потерю жидкости при рвоте и воспалении в животе. При остром панкреатите — основа лечения первых дней."
sources:
  - { kind: guideline, title: "Острый панкреатит", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/903_1", note: "ID 903_1, опубликованы 20.01.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: инфузионная терапия в ранней фазе, обезболивание, профилактические антибиотики не рекомендуются" }
  - { kind: guideline, title: "Желчнокаменная болезнь", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/877_1", note: "ID 877_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2: при остром холецистите — инфузионная терапия (B05BB)" }
review: draft
