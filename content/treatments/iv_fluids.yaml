id: tx.iv_fluids
name: { ru: "Инфузионная терапия" }
kind: drug
class: rehydration.iv
route: iv
cost: 300
# растворы, влияющие на водно-электролитный баланс (АТХ B05BB): при остром холецистите — для
# коррекции нарушений (877_1, раздел 3.2); при остром панкреатите — основа лечения ранней фазы
# (903_1, раздел 3.1); лёгкий панкреатит проходит за несколько дней — игровая оценка. При
# непроходимости кишки восполнение жидкости нужно всем (327_3, раздел 3.1): неоперативное лечение
# разрешает спаечную непроходимость у 70–90 % (WSES 2017), у 71,4 % начавших его (SnapSBO 2025),
# в пределах 72 ч — и только без ишемии кишки: с ней нужна операция (327_3, раздел 2.2). При ожоге
# больше 15 % поверхности тела — внутривенная инфузия (687_3, раздел 3.1.4): её начинают до перевода
# в ожоговый центр, лечения причины в ней нет
effects:
  - { on: cond.pancreatitis, kind: cure, band: usually, days: [3, 7] }
  - { on: cond.cholecystitis, kind: relieve, band: sometimes, days: [0, 2] }
  - { on: cond.adhesive_sbo, kind: cure, band: usually, days: [1, 3], when: { ischemia: [no] } }
  # анафилактический шок (часть 33б): после эпинефрина — растворы электролитов, 0,9 % натрия хлорид,
  # для коррекции относительной гиповолемии (263_2, рек. 23); причину не лечат — облегчение, игровая
  # оценка
  - { on: cond.anaphylaxis, kind: relieve, band: often, days: [0, 1] }
contraindications: []
texts:
  hint:
    ru: "Растворы солей в вену через капельницу: возмещают потерю жидкости при рвоте, воспалении в животе, ожоге и шоке. При остром панкреатите — основа лечения первых дней, при непроходимости кишки без ишемии — вместе с голодом, при ожоге больше 15 % — до перевода, при анафилактическом шоке — после эпинефрина."
sources:
  - { kind: guideline, title: "Острый панкреатит", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/903_1", note: "ID 903_1, опубликованы 20.01.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: инфузионная терапия в ранней фазе, обезболивание, профилактические антибиотики не рекомендуются" }
  - { kind: guideline, title: "Желчнокаменная болезнь", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/877_1", note: "ID 877_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.2: при остром холецистите — инфузионная терапия (B05BB)" }
  - { kind: guideline, title: "Острая неопухолевая кишечная непроходимость", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/327_3", note: "ID 327_3, опубликованы 06.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: независимо от причины начальное восполнение жидкости нужно всем, основные растворы — кристаллоидные; стабильным без признаков ишемии и перитонита — начальное неоперативное лечение, оно позволяет избежать операции 50–90 % больных спаечной непроходимостью" }
  - { kind: guideline, title: "ten Broek RPG et al. Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the world society of emergency surgery ASBO working group. World J Emerg Surg 2018;13:24", url: "https://pubmed.ncbi.nlm.nih.gov/29946347/", note: "PMID 29946347, PMC6006983, сверено 29.09.2026: неоперативное лечение эффективно примерно у 70–90 %; пробовать его безопасно 72 ч; противопоказания — перитонит, странгуляция, ишемия" }
  - { kind: paper, title: "Kaplan LJ et al.; SnapSBO Collaborators. Small bowel obstruction outcomes according to compliance with the World Society of Emergency Surgery Bologna guidelines. Br J Surg 2025;112(4):znaf080", url: "https://pubmed.ncbi.nlm.nih.gov/40246692/", note: "PMID 40246692, PMC12005947, сверено 29.09.2026: 982 больных спаечной непроходимостью; неоперативное лечение начали у 79,9 %, успешно — у 71,4 % из них; койко-день после успешного — 4,7 суток (в реферате — 5,3)" }
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1.4 (УУР C, УДД 5): у взрослых при площади ожогов меньше 15 % — энтеральная регидратация, больше 15 % — инфузионная терапия, в начале — растворы, влияющие на водно-электролитный баланс (B05BB); раздел 3.1.1: при ожоговом шоке — венозный доступ и инфузия среди первых неотложных мер" }
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; рек. 23 (УУР С, УДД 5): всем после введения эпинефрина — внутривенно растворы электролитов (0,9 % натрия хлорид) для коррекции относительной гиповолемии; растворы декстрозы не рекомендуются" }
review: draft
