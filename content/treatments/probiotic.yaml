id: tx.probiotic
name: { ru: "Пробиотик" }
kind: drug
# штаммоспецифические пробиотики (spec 2026-10-chapter-4, часть 55б): при СРК «для уменьшения выраженности симптомов
# заболевания» (892_1, раздел 3.3, УУР A, УДД 1; АТХ A07FA — противодиарейные микроорганизмы), при СРК с диареей — в
# критерии качества 3; при функциональном запоре — «с целью увеличения частоты стула и улучшения его консистенции» (274_3,
# раздел 3.2, УУР А, УДД 1). Полосы и сроки — игровая оценка; доз и торговых названий нет (ADR 0012); ₽ — игровое число
class: antidiarrheal.probiotic
route: oral
cost: 400
effects:
  - { on: cond.ibs, kind: cure, band: sometimes, days: [14, 28] }
  - { on: cond.constipation, kind: cure, band: sometimes, days: [14, 28] }
texts:
  hint:
    ru: "Живые бактерии или дрожжи штаммов с доказанным действием, например сахаромицеты буларди. При синдроме раздражённого кишечника уменьшают боль и вздутие, при варианте с диареей — и диарею; при функциональном запоре учащают стул."
sources:
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.3 (УУР A, УДД 1): штаммоспецифические пробиотики (A07FA: бифидобактерии лонгум с энтерококкус фэциум, сахаромицеты буларди) — ОР 1,50, NNT 5 по 22 РКИ; меньше боль и вздутие; критерий качества 3 — при СРК с диареей; полосы — игровая оценка" }
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 3.2 (УУР А, УДД 1): штаммоспецифические пробиотики при функциональном запоре — короче транзит, чаще стул, лучше консистенция; полосы — игровая оценка" }
review: draft
