id: tx.thrombolysis_stroke
name: { ru: "Тромболизис при ишемическом инсульте" }
kind: drug
# тромболитик в вену (АТХ B01AD): алтеплаза, тенектеплаза, рекомбинантный белок со стафилокиназой —
# 814_1, раздел 3.1.2.1.1; режим и дозы — не в игре
class: thrombolytic
route: iv
# тромболитик дорогой, ₽ — игровое число, как у тромболизиса при инфаркте
cost: 45000
# у постели под монитором (spec 2026-10-chapter-3, часть 41а): в смотровой приёмного и в ПИТ, как при
# инфаркте (часть 39а); первичная госпитализация при ОНМК — в палату интенсивной терапии (814_1, раздел 6)
bedside: { equipment: [eq.monitor_defib] }
# спутников нет: антитромботики после тромболизиса откладывают на 24 часа (раздел 3.1.2.1.1)
effects:
  # польза по минутам от начала до тромболизиса (часть 41а; раздел 2.2): в первые 90 минут хороший исход —
  # у одного из 4,5 пролеченных, через 91–180 минут — у одного из 9; через 3–4,5 часа — 35,3 % против
  # 30,1 % без него (Emberson 2014), около 5 %; позже 4,5 часа пользы нет. Малый инсульт в игре —
  # неинвалидизирующий: пользы нет (раздел 3.1.2.1.1)
  - { on: cond.stroke_ischemic, kind: cure, band: { pct: 22 }, days: [2, 3], when: { window: [yes], lysis90: [yes], minor: [no] } }
  - { on: cond.stroke_ischemic, kind: cure, band: { pct: 11 }, days: [2, 3], when: { window: [yes], lysis90: [no], lysis180: [yes], minor: [no] } }
  - { on: cond.stroke_ischemic, kind: cure, band: { pct: 5 }, days: [2, 3], when: { window: [yes], lysis180: [no], minor: [no] } }
  # вред при кровоизлиянии в мозг (spec 2026-10-chapter-3, часть 41в): кровь на КТ — абсолютное противопоказание
  # (814_1, раздел 2.4), тромболизис — одна из причин внутричерепного кровоизлияния (523_3, раздел 1.2);
  # кровотечение — игровая оценка
  - { on: cond.ich, kind: harm, band: usually, days: [0, 1] }
  - { on: cond.sah, kind: harm, band: usually, days: [0, 1] }
contraindications:
  # названные в тексте 814_1 (раздел 3.1.2.1.1): приём ПОАК меньше 48 часов назад — в игре «принимает
  # антикоагулянты»; гипокоагуляция — «кровоточивость»; кровь на КТ (раздел 2.4) — вред при кровоизлияниях
  # (часть 41в, выше). Кровотечение при противопоказании — игровая оценка
  - { id: risk.anticoagulants, level: absolute, reaction: often }
  - { id: risk.bleeding_tendency, level: absolute, reaction: often }
texts:
  hint:
    ru: "Тромболитик в вену растворяет тромб в артерии мозга. В первые 4,5 часа от начала, после КТ без крови и при глюкозе в норме; чем раньше, тем больше пользы. Нельзя при антикоагулянтах и кровоточивости; АСК — только через сутки."
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.1.2.1.1 (УУР A): тромболизис в первые 4,5 часа — алтеплаза, тенектеплаза, белок со стафилокиназой; по одной бесконтрастной КТ после 4,5 часа — не рекомендуется; противопоказан при гипокоагуляции, ПОАК — если последний приём больше 48 часов назад; антитромботики — через 24 часа; раздел 2.2: ЧБНЛ 4,5 в первые 90 минут и 9 через 91–180 минут; раздел 2.4: кровь на КТ — абсолютное противопоказание" }
  - { kind: paper, title: "Emberson J, Lees KR, Lyden P и др. Effect of treatment delay, age, and stroke severity on the effects of intravenous thrombolysis with alteplase for acute ischaemic stroke: a meta-analysis of individual patient data from randomised trials. Lancet 2014;384(9958):1929–1935", note: "PMID 25106063; хороший исход (mRS 0–1): до 3 ч — 32,9 % против 23,1 %, 3–4,5 ч — 35,3 % против 30,1 %, позже 4,5 ч — 32,6 % против 30,6 % (часть 41а)" }
review: draft
