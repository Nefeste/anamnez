id: tx.muscle_relaxant
name: { ru: "Миорелаксант центрального действия" }
kind: drug
# радикулопатия (spec 2026-10-chapter-4, часть 58б): «Миорелаксанты центрального действия (АТХ код: M03BX; толперизон,
# тизанидин**, циклобензаприн) рекомендуются при ДПКР» — «если имеются дополнительные скелетно-мышечные причины боли» (777_1,
# раздел 3.1.2, Р30, УУР B, УДД 1); доз нет; ₽ — игровое
class: analgesic.muscle_relaxant
route: oral
cost: 250
effects:
  # при напряжении мышц спины — игровая оценка
  - { on: cond.radiculopathy, kind: relieve, band: sometimes, days: [0, 3] }
texts:
  hint:
    ru: "Толперизон, тизанидин или циклобензаприн расслабляют спазмированные мышцы спины. При радикулопатии — когда к боли от корешка добавилась мышечная. Возможна сонливость; два миорелаксанта вместе не дают."
sources:
  - { kind: guideline, title: "Дискогенная пояснично-крестцовая радикулопатия", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/777_1", note: "ID 777_1, опубликованы 07.12.2023, применяются; сверено с рубрикатором 12.10.2026; раздел 3.1.2, Р30 (УУР B, УДД 1): миорелаксанты центрального действия — толперизон, тизанидин, циклобензаприн — если есть дополнительные скелетно-мышечные причины боли; их не комбинируют, учитывают седативный эффект; критерий качества 7" }
review: draft
