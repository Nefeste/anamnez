id: tx.verapamil_iv
name: { ru: "Верапамил в вену" }
kind: drug
# блокатор кальциевых каналов с прямым действием на сердце (spec 2026-10-chapter-3, часть 42б): обрывает
# наджелудочковую тахикардию, если трифосаденин не помог (619_3, раздел 3.1.1, ЕОК IIaB); в вену — под
# монитором, у постели; ₽ — игровое число
class: antiarrhythmic.verapamil
route: iv
cost: 200
bedside: { equipment: [eq.monitor_defib] }
effects:
  # обрывает тахикардию с участием АВ-узла — обычно: игровая оценка, в 619_3 долей нет
  - { on: cond.svt, kind: cure, band: usually, days: [0, 0], when: { unstable: [no] } }
  # при низком давлении снижает его ещё (619_3, раздел 3.2.2: «в отсутствие гипотензии»); при желудочковой
  # тахикардии — падение давления (569_2, раздел 3.1.3, ЕОК IIIB) — как часто, игровая оценка
  - { on: cond.svt, kind: harm, band: sometimes, days: [0, 0], when: { unstable: [yes] } }
  - { on: cond.vt, kind: harm, band: often, days: [0, 0] }
  # при расслоении аорты — замена бета-адреноблокатору, если он противопоказан (spec 2026-10-chapter-3, часть 43а;
  # 946_1, раздел 3.1.1): неосложнённый тип B — как с ним, игровая оценка
  - { on: cond.aortic_dissection, kind: cure, band: usually, days: [3, 7], when: { type: [b] } }
# при сердечной недостаточности противопоказан (619_3, приложение А3-1); декомпенсация — игровая оценка
contraindications:
  - { id: risk.heart_failure, level: absolute, reaction: sometimes }
texts:
  hint:
    ru: "В вену под монитором: замедляет проведение через АВ-узел и обрывает приступ наджелудочковой тахикардии, если не помог трифосаденин; при расслоении аорты — вместо бета-адреноблокатора, если он противопоказан. При широких комплексах на ЭКГ и сердечной недостаточности нельзя."
sources:
  - { kind: guideline, title: "Наджелудочковые тахикардии", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/619_3", note: "ID 619_3, опубликованы 17.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1 (ЕОК IIaB): при неэффективности трифосаденина — верапамил или бета-адреноблокатор; раздел 3.1.2 (ЕОК IIIB): верапамил не рекомендуется при тахикардии с широкими QRS неизвестной этиологии; приложение А3-1: противопоказан при ХСН; доля успеха — игровая оценка" }
  - { kind: guideline, title: "Расслоение аорты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/946_1", note: "ID 946_1, опубликованы 23.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1: при противопоказаниях к бета-адреноблокаторам — блокаторы кальциевых каналов (верапамил); совместно с бета-адреноблокаторами в целом нежелателен; доля успеха — игровая оценка" }
  - { kind: guideline, title: "Желудочковые нарушения ритма сердца. Внезапная сердечная смерть.", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/569_2", note: "ID 569_2, опубликованы 07.10.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.3 (ЕОК IIIB): в/в верапамил не рекомендуется для купирования тахикардии с широкими QRS неизвестной этиологии — может снизить АД у пациентов с ЖТ; доля вреда — игровая оценка" }
review: draft
