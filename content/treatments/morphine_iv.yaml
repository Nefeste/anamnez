id: tx.morphine_iv
name: { ru: "Морфин в вену" }
kind: drug
# наркотический анальгетик (АТХ N02AA — природные алкалоиды опия; spec 2026-10-chapter-3, часть 43а): при расслоении
# аорты — обезболивание в вену медленно, повторно до купирования боли (946_1, раздел 3.1.1; критерий качества 1); при
# ОКС — для обезболивания (157_5 и 154_4, раздел 3.1.1, ЕОК I C). В вену — у постели под монитором; режим и дозы —
# не в игре; ₽ — игровое число
class: analgesic.opioid
route: iv
cost: 150
bedside: { equipment: [eq.monitor_defib] }
effects:
  # снимает боль, причину не лечит; как часто — игровая оценка
  - { on: cond.aortic_dissection, kind: relieve, band: usually, days: [0, 0] }
  - { on: cond.acs, kind: relieve, band: usually, days: [0, 0] }
texts:
  hint:
    ru: "Сильное обезболивающее в вену медленно, под монитором. При расслоении аорты — первым делом вместе с бета-адреноблокатором: боль поднимает давление и пульс. При инфаркте снимает боль и страх. Может снизить давление и угнетать дыхание."
sources:
  - { kind: guideline, title: "Расслоение аорты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/946_1", note: "ID 946_1, опубликованы 23.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1: обезболивание — морфин внутривенно медленно, при необходимости повторно до купирования боли; гипотония и угнетение дыхания — побочные эффекты; критерий качества 1" }
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1 (ЕОК I C): для обезболивания — внутривенно наркотический анальгетик, предпочтительно морфин" }
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.1.1 (ЕОК I C): для обезболивания — внутривенно наркотический анальгетик, предпочтительно морфин" }
review: draft
