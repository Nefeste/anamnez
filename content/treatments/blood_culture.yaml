id: tx.blood_culture
name: { ru: "Посевы крови до антибиотика" }
kind: procedure
# посевы при сепсисе (spec 2026-10-chapter-4, часть 48а; 898_1, раздел 2.3, УДД 2, УУР В): из очага и крови — перед
# антимикробной терапией, если это не задержит её на 45 минут и больше; не меньше двух проб крови, аэробный и
# анаэробный флаконы. Ответ — через 2–3 суток, в смене его нет: поэтому это назначение, а не обследование, — посевы
# берут, и сразу за ними антибиотик. ₽ — игровое число
cost: 1200
texts:
  hint:
    ru: "Две пробы крови из вены во флаконы для посева — до первой дозы антибиотика: после неё микроб может не вырасти. Ответ — через 2–3 суток; антибиотик его не ждёт."
sources:
  - { kind: guideline, title: "Сепсис (у взрослых)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/898_1", note: "ID 898_1, опубликованы 27.12.2024, применяются; сверено с рубрикатором 06.10.2026; раздел 2.3 (УДД 2, УУР В): посевы из очага и крови перед антимикробной терапией, если это не задержит её на 45 минут и больше; не менее двух проб крови по 20 мл; критерий качества 9; результат — через несколько суток" }
review: draft
