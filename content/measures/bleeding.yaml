id: measure.bleeding
name: { ru: "Давящая повязка" }
tx: tx.pressure_dressing
abc: C
order: 4
minutes: 3
# шаг ухудшения без меры — игровая оценка (spec 2026-10-first-measures)
every: [20, 40]
# тяжёлый — большая рана с кровопотерей: кровотечение бывает интенсивным, до геморрагического шока (733_2, раздел 1.6)
severe: { f: sign.wound_large, roles: [beforeTransfer, require, firstLine, supportive] }
# ступени — к классам кровопотери ATLS (Gutierrez 2004, табл. 1: пульс чаще 100, 120 и 140, давление падает с класса III);
# сдвиги — игровая оценка: пульс чаще на 15, верхнее давление ниже на 10; на третьей — спутанность
steps:
  - { change: { vital.tachycardia: 15, vital.bp_low: -10 } }
  - { change: { vital.tachycardia: 15, vital.bp_low: -10 } }
  - { change: { vital.tachycardia: 15, vital.bp_low: -10 }, add: [sym.confusion] }
# кровотечение остановлено: дальше не хуже, но потерянная кровь не возвращается — пульс и давление остаются
effect: { undo: false }
texts:
  hint: { ru: "Давление на рану, потом тугая повязка: кровотечение останавливается, пока рану не обработали. Потерянную кровь повязка не вернёт." }
  why: { ru: "Большая рана с кровопотерей: кожа головы кровит так, что бывает шок. Сначала остановить кровотечение, потом всё остальное." }
sources:
  - { kind: guideline, title: "Об утверждении Порядка оказания первой помощи (приказ № 220н)", org: "Минздрав России", year: 2024, note: "приказ от 03.05.2024 № 220н, зарегистрирован в Минюсте России 31.05.2024 № 78363; приложение 2, пункт 2: прямое давление на рану, остановлено — давящая повязка, жгут — при обширном повреждении конечности; сверено 25.10.2026" }
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 25.10.2026; раздел 1.6: кровотечение бывает интенсивным, до геморрагического шока; раздел 3.2: давящая повязка на 30–60 минут, пока нельзя оперировать; раздел 6: при продолжающемся кровотечении — компрессия, достаточная для его прекращения" }
  - { kind: review, title: "Gutierrez G, Reines HD, Wulf-Gutierrez ME. Clinical review: hemorrhagic shock. Crit Care 2004;8(5):373–381", year: 2004, note: "doi:10.1186/cc2851; табл. 1 (по ATLS, American College of Surgeons): кровопотеря до 15 %, 15–30 %, 30–40 %, больше 40 %; пульс до 100, чаще 100, 120 и 140" }
review: draft
