id: cond.alcohol_dependence
name: { ru: "Синдром зависимости от алкоголя" }
# фон для синдрома отмены (spec 2026-10-chapter-4, часть 54б): «ААС – тяжелое психофизическое состояние, возникающее только у
# больных СЗА» (784_1, раздел 1.6) — синдром отмены бывает только при нём (`requires`). С самой зависимостью в приёмное не
# приходят: её лечит психиатр-нарколог
icd10: F10.2
department: dept.therapy
system: nerves
kind: disease
severity: moderate
presenting: false
epidemiology:
  prevalence: uncommon
  age: { min: 18 }
  # злоупотребляют алкоголем 12,5 % взрослых, зависимость — у 5 % (711_2, раздел 1.3: Москва, 5000 человек, опросники CAGE и
  # AUDIT): у злоупотребляющих — у 40 из 100. У непьющих её почти нет — доля игровая
  chronic: { band: { pct: 0.1 }, ageMin: 18, risks: [ { id: risk.alcohol, x: 400 } ] }
course:
  stages:
    - { id: stable, days: [0, 36500] }
findings:
  # «опохмелялись, чтобы успокоить свои нервы, или избавиться от плохого самочувствия» — вопрос 4 CAGE (711_2, приложение
  # Г3). Признаются не все: «склонны преуменьшать количество выпиваемого алкоголя или вовсе отрицать сам факт» (711_2, раздел
  # 2) — полоса игровая
  - { f: hx.binge, band: usually }
confirm: clinical
texts:
  summary:
    ru: >-
      Алкоголизм: человек не может остановиться, начав пить, пьёт запоями и опохмеляется по утрам, а бросив, получает синдром
      отмены — дрожь, пот, тревогу, бессонницу, иногда судороги и белую горячку. Его лечит психиатр-нарколог; печень у таких
      больных страдает почти всегда.
simplified: "Стадий зависимости и её лечения нет: с ней не приходят — только фон синдрома отмены. Опросники AUDIT и CAGE не считают: о запоях спрашивают в расспросе об образе жизни."
sources:
  - { kind: guideline, title: "Алкогольная болезнь печени", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/711_2", note: "ID 711_2, опубликованы 30.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.2: АБП диагностируется практически у всех пациентов с алкогольной зависимостью; раздел 1.3: в Москве (2012, 5000 человек) злоупотребляют алкоголем 12,5 %, зависимость — у 5 % по CAGE и AUDIT; раздел 2: пациенты склонны преуменьшать выпитое или отрицать употребление; приложение Г3: вопросник CAGE; доля у непьющих и полоса признака — игровая оценка" }
  - { kind: guideline, title: "Психические и поведенческие расстройства, вызванные употреблением алкоголя. Синдром отмены алкоголя (алкогольное абстинентное состояние)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/784_1", note: "ID 784_1, опубликованы 20.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: в 2021 г. зарегистрировано 1 159 031 больной синдромом зависимости, 791,4 на 100 тыс.; раздел 1.6: синдром отмены возникает только у больных синдромом зависимости" }
review: draft
