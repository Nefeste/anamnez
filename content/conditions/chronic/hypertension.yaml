id: cond.hypertension
name: { ru: "Гипертоническая болезнь" }
icd10: I10
department: dept.therapy
kind: disease
severity: moderate
presenting: false
epidemiology:
  prevalence: common
  age: { min: 30 }
  chronic: { band: { pct: 25 }, ageMin: 35, risks: [ { id: risk.obesity, x: 1.8 }, { id: risk.alcohol, x: 1.3 } ] }
