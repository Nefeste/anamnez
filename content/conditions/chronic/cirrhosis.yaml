id: cond.cirrhosis
name: { ru: "Цирроз печени" }
# фон для осложнений (spec 2026-10-chapter-4, часть 54а): кровотечение из варикозных вен, асцит и его инфицирование,
# печёночная энцефалопатия бывают только при нём (`requires`). Сам компенсированный цирроз «может протекать скрыто в течение
# нескольких лет» (715_2, раздел 1.1) — с ним не приходят
icd10: K74.6
department: dept.therapy
system: digestive
kind: disease
severity: serious
presenting: false
epidemiology:
  prevalence: uncommon
  age: { min: 30 }
  # компенсированный цирроз — 1395 на 100 тыс. человек в мире (715_2, раздел 1.3): 1 % и вчетверо чаще у пьющих — тогда
  # алкоголь у трети больных, а в мире его доля у декомпенсированных 23–33 % (там же). Множитель — игровая оценка
  chronic: { band: { pct: 1 }, ageMin: 30, risks: [ { id: risk.alcohol, x: 4 } ] }
course:
  stages:
    - { id: stable, days: [0, 36500] }
findings:
  # «может протекать скрыто в течение нескольких лет» (715_2, раздел 1.1): о болезни знают не все — игровая оценка
  - { f: hx.cirrhosis, band: often }
  # при осмотре — сосудистые звёздочки, пальмарная эритема, плотная печень, увеличенная селезёнка (715_2, раздел 2.2); у
  # алкогольного селезёнка может быть почти не увеличена (раздел 2.3). Полосы — игровая оценка
  - { f: sign.spider_angiomas, band: often }
  - { f: sign.palmar_erythema, band: sometimes }
  - { f: sign.splenomegaly, band: often }
  # «чаще всего у пациентов отмечается цитопения (в большей степени — тромбоцитопения)» (715_2, раздел 2.3)
  - { f: lab.platelets_low, band: usually }
  - { f: lab.bilirubin_high, band: sometimes }
  - { f: lab.pti_low, band: sometimes }
  - f: img.egd_varices
    band: { pct: 35 }
    note: "варикозные вены — у 30–40 % больных компенсированным циррозом (715_2, раздел 1.3): середина"
  - f: img.us_cirrhosis
    band: { pct: 100 }
    note: "цирроз — перестройка печени с портальной гипертензией: найдёт ли её УЗИ — точность обследования (715_2, раздел 2.4)"
confirm: [exam.us_abdomen]
texts:
  summary:
    ru: >-
      Конечная стадия хронических болезней печени: печёночная ткань замещается рубцами и узлами, давление в воротной вене
      растёт. Чаще всего — от алкоголя, вирусных гепатитов B и C и ожирения. Годами может ничем не проявляться; потом
      приходят осложнения — асцит, кровотечение из варикозных вен пищевода, печёночная энцефалопатия, инфекции.
simplified: "Причины цирроза — одна запись: алкоголь — множитель, вирусных и метаболических отдельно нет. Компенсированного цирроза как болезни приёма нет — только фон осложнений; Чайлд-Пью и MELD не считают."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.1: компенсированный цирроз может протекать скрыто несколько лет, декомпенсация — асцит, кровотечение из варикозных вен, печёночная энцефалопатия, инфекции; раздел 1.3: 1395 на 100 тыс. человек (2017), у декомпенсированного алкоголь — 23 %, за 2000–2019 гг. — с 28 до 33 %; варикозные вены — у 30–40 % компенсированных; раздел 2.2: звёздочки, пальмарная эритема, увеличенная селезёнка; раздел 2.3: тромбоцитопения; раздел 2.4: УЗИ — воротная вена 13 мм и шире, спленомегалия; полосы признаков и множитель алкоголя — игровая оценка" }
review: draft
