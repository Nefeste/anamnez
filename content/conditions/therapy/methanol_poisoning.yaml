id: cond.methanol_poisoning
name: { ru: "Отравление метанолом" }
# острое отравление метанолом (spec 2026-10-chapter-4, часть 57в; 873_1): пьют по ошибке или «с целью опьянения» — фальсифицированный
# алкоголь, купленный дёшево через интернет, стеклоомывающую жидкость, спиртосодержащий концентрат для ванн (разделы 1.2 и 1.3).
# Метанол и этиленгликоль «сравнительно малотоксичны», всё делают метаболиты — у метанола формальдегид и муравьиная кислота
# (разделы 1.1 и 1.2). МКБ-10 — T51.1, «токсическое действие метанола» (раздел 1.4); «формулировка „суррогаты алкоголя“ в настоящее
# время не приемлема» (раздел 1.1): в диагнозе — вещество
icd10: T51.1
department: dept.therapy
system: poisoning
kind: state
# «Все пациенты с острым отравлением токсифицирующимися спиртами нуждаются в оказании скорой медицинской помощи вне медицинской
# организации выездной бригадой» (раздел 2.1, УУР С, УДД 5)
arrival: ambulance
severity: critical
epidemiology:
  # 2,2 % отравлений спиртосодержащей продукцией в России за 2012–2021 годы и 6,9 % смертей от них; в центре острых отравлений
  # Санкт-Петербурга — 10–15 больных в год (раздел 1.3): реже угарного газа, полоса — подобрана прогоном генератора, игровая оценка
  prevalence: exceptionally_rare
  # стеклоомыватель с метанолом продают нелегально «в зимнее время» (раздел 1.3); множители — игровая оценка
  season: { winter: 1.5, spring: 0.9, summer: 0.7, autumn: 0.9 }
  # возраста и пола в 873_1 нет — игровая оценка
  age: { min: 18, max: 80, peak: [30, 60] }
  sex: { m: 1, f: 0.3 }
params:
  # «легкую (синдром общих расстройств, токсический гастрит), среднюю (офтальмическую) и тяжелую (генерализованную) формы»
  # (раздел 1.5.1); лабораторных границ у форм нет. «практически все поступившие пациенты … находились в критическом состоянии»
  # (раздел 1.3): доли — игровая оценка
  severity: { mild: 30, moderate: 30, severe: 40 }
  # производные — доли для вывода, пока кровь не смотрели: ацидоз — около 70 из 100, низкое давление — у каждого второго тяжёлого;
  # игровая оценка
  acidosis: { no: 30, yes: 70 }
  hypotension: { no: 80, yes: 20 }
derived:
  # ацидоз — от него натрия гидрокарбонат (раздел 3.2)
  acidosis: { has: lab.acidosis }
  # низкое давление — противошоковая терапия (раздел 3.2)
  hypotension: { has: vital.bp_low }
course:
  stages:
    - { id: acute, days: [0, 2] }
  # начальный период — «от 1-2 до 12 и более часов», скрытый — «от 6 до 44 часов» (раздел 1.6.1): привозят в первые сутки или на
  # следующий день
  presentation: [0, 1]
  # тяжёлая без лечения — «на 1-2-е сутки … наступает летальный исход» (раздел 1.5.1); средняя — слепота «с атрофией зрительных
  # нервов» (там же); отпущенного в скрытом периоде догоняет отравление. Доли и сроки — игровая оценка
  untreated:
    - { band: always, days: [0, 1], when: { severity: [severe] } }
    - { band: usually, days: [0, 2], when: { severity: [moderate] } }
    - { band: often, days: [1, 2] }
  # лёгкие — «в среднем до 5 дней» (раздел 6.1)
  stay: [4, 6]
findings:
  # о выпитом скажут скорая и родные: «обычно за медицинской помощью обращаются родственники или знакомые» (раздел 2.1), но
  # токсикологический анамнез собрать удаётся «далеко не всегда» (комментарий к рекомендации о первичном осмотре); полоса — игровая
  # оценка
  - { f: sym.methanol_drink, band: usually }
  # лёгкая: «головокружение, головная и абдоминальная боль, тошнота, рвота, нарушения зрения (неясность видения, потемнение в глазах,
  # мелькание „мушек“)»; «умеренное расширение зрачков и ослабление фотореакции»; «Глазное дно сохраняет нормальный вид» (раздел
  # 1.5.1). Частот в 873_1 нет — полосы игровые
  - { f: sym.dizziness, band: usually, when: { severity: [mild] } }
  - { f: sym.headache, band: usually, when: { severity: [mild] } }
  - { f: sym.nausea, band: usually, when: { severity: [mild] } }
  - { f: sym.abdominal_pain, band: often, when: { severity: [mild] } }
  - { f: sym.vomiting, band: often, when: { severity: [mild] } }
  - { f: sym.vision_blurred, band: often, when: { severity: [mild] } }
  - { f: sign.mydriasis, band: sometimes, when: { severity: [mild] } }
  - { f: lab.acidosis, band: sometimes, when: { severity: [mild] } }
  # средняя — «постепенно нарастающими тяжелыми нарушениями зрения, вплоть до полной слепоты»; на глазном дне — «гиперемия и
  # размытость границ сосков зрительных нервов, расширение вен и кровоизлияния» (раздел 1.5.1); токсический гастрит и ацидоз —
  # период выраженных проявлений (раздел 1.6.1)
  - f: sym.vision_loss
    band: { pct: 100 }
    when: { severity: [moderate] }
    note: "по определению параметра: средняя степень — офтальмическая форма, тяжёлые нарушения зрения вплоть до слепоты (873_1, раздел 1.5.1)"
  - { f: sign.mydriasis, band: usually, when: { severity: [moderate] } }
  - { f: sign.optic_disc_blurred, band: usually, when: { severity: [moderate] } }
  - { f: sym.nausea, band: often, when: { severity: [moderate] } }
  - { f: sym.vomiting, band: often, when: { severity: [moderate] } }
  - { f: sym.epigastric_pain, band: often, when: { severity: [moderate] } }
  - { f: sym.headache, band: often, when: { severity: [moderate] } }
  - { f: sign.kussmaul, band: often, when: { severity: [moderate] } }
  - { f: lab.acidosis, band: usually, when: { severity: [moderate] } }
  # тяжёлая: «мидриаз, стремительное нарушение зрения. Пострадавший теряет сознание, быстро нарушатся дыхание, нарастает цианоз,
  # прогрессирует сердечно-сосудистая недостаточность вплоть до экзотоксического шока. В отдельных случаях возможно развитие резкого
  # возбуждения и клонических судорог» (раздел 1.5.1)
  - f: sym.found_unconscious
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "по определению параметра: при тяжёлой форме пострадавший теряет сознание (873_1, раздел 1.5.1)"
  - f: sign.gcs_coma
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "по определению параметра: тяжёлая форма — потеря сознания (873_1, раздел 1.5.1); глубина комы — игровая оценка"
  - { f: sign.mydriasis, band: always, when: { severity: [severe] } }
  - { f: sign.optic_disc_blurred, band: often, when: { severity: [severe] } }
  - { f: sign.kussmaul, band: usually, when: { severity: [severe] } }
  - { f: sign.cyanosis, band: often, when: { severity: [severe] } }
  - { f: vital.tachycardia, band: often, when: { severity: [severe] } }
  - { f: vital.bp_low, band: often, when: { severity: [severe] } }
  - { f: sym.seizure, band: rarely, when: { severity: [severe] } }
  - f: lab.acidosis
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "по определению параметра: «Среди метаболических нарушений ведущим является декомпенсированный метаболический ацидоз» (873_1, раздел 1.6.1)"
  # «У пациентов с острым отравлением токсифицирующимися спиртами тяжелой степени часто развиваются нарушения … в виде развития
  # декомпенсированного смешанного респираторного и метаболического ацидоза, а также гиперкалиемии» (комментарий к рекомендации о КОС)
  - { f: lab.k_high, band: often, when: { severity: [severe] } }
  - f: lab.methanol_blood
    band: { pct: 100 }
    note: "отравился метанолом — метанол в крови у каждого; уровень в крови и моче определяют газовой хроматографией всем с подозрением (873_1, раздел 2.3); точность — у обследования"
confirm: [exam.toxic_alcohols]
redFlags: [sign.gcs_coma]
# с чем спутать (раздел 2.5): ЧМТ, ОНМК, отравления этанолом и другими спиртами, наркотиками, психотропными, диабетический
# кетоацидоз, инфекции ЦНС. Набор — игровая оценка
differential: [cond.ethylene_glycol_poisoning, cond.opioid_poisoning, cond.stroke_ischemic]
treatment:
  # первой линии сверх обязательного нет. Антидот — «Рекомендуется всем пациентам с острыми отравлениями метанолом и этиленгликолем
  # с целью антидотной терапии применять #этанол» (раздел 3.2, УУР С, УДД 5; критерий качества 21) — в стационаре, и до перевода
  firstLine: []
  # фолиевая кислота — «Рекомендовано всем пациентам при остром отравлении метанолом с целью ускорения метаболизма формиата», но
  # «клинические исследования не смогли подтвердить улучшение результатов лечения» (раздел 3.2, УУР С, УДД 5); промывание желудка —
  # «в ранние сроки» (раздел 3.1, УУР С, УДД 5; критерий качества 2), а «эффективность этого мероприятия через несколько часов будет
  # сомнительна» (там же): часов от приёма в игре нет — можно
  acceptable: [tx.folic_acid, tx.gastric_lavage]
  # растворы — при расстройствах гемодинамики и для детоксикации (раздел 3.1)
  supportive: [tx.iv_fluids]
  # «Не рекомендуется … применение активированного угля» — он «практически не сорбирует или очень слабо сорбирует спирты» (раздел
  # 3.1, УУР С, УДД 5)
  notIndicated: [tx.activated_charcoal]
  harmful: []
  beforeTransfer: [tx.ethanol_antidote]
  byParam:
    # «с целью купирования метаболического ацидоза в/в инфузия натрия гидрокарбоната» (раздел 3.2, УУР С, УДД 5; критерий качества 23)
    - when: { acidosis: [yes] }
      beforeTransfer: [tx.sodium_bicarbonate]
    # «при тяжелых гемодинамических расстройствах проведение противошоковой терапии» (раздел 3.2, УУР С, УДД 5): в игре — при низком
    # давлении
    - when: { hypotension: [yes] }
      beforeTransfer: [[tx.balanced_fluids, tx.iv_fluids]]
  # «Рекомендуется медицинская эвакуация пациента в стационар, специализирующийся на лечении острых отравлений, при невозможности – в
  # стационар, имеющий возможность проведения гемодиализа» (раздел 3.1, УУР С, УДД 5): применение гемодиализа «является основным
  # методом неотложной детоксикации», ранний — «в течение первых 6-12 часов» (раздел 3.2). В игре его нет — перевод (вопрос владельцу
  # 31). Лёгкое можно лечить и у себя: без гемодиализа антидот вводят «по меньшей мере 3-5 суток» (раздел 3.2) — палата или ПИТ не
  # ошибка
  setting:
    default: transfer
    also:
      - { when: { severity: [mild] }, settings: [ward, icu] }
texts:
  summary:
    ru: >-
      Отравление метанолом — стеклоомывателем, дешёвым алкоголем с рук. Сначала опьянение слабее выпитого, потом от 6 до 44 часов
      почти ничего, затем рвота, боль в животе, мушки и пелена перед глазами, вплоть до слепоты; при тяжёлом — кома и ацидоз.
      Подтверждает анализ крови на спирты. Антидот — этанол, ацидоз снимает натрия гидрокарбонат, главное лечение — ранний
      гемодиализ.
pearls:
  - ru: "Жалобы на зрение после спиртного — метанол, пока не доказано обратное."
  - ru: "Скрытый период длится до 44 часов: того, кто чувствует себя неплохо после стеклоомывателя, домой не отпускают."
  - ru: "Активированный уголь спирты почти не связывает, и при метаноле его не дают."
simplified: "Доз нет. Гемодиализа нет — перевод по вопросу 31. Форсированного диуреза, меглюмина натрия сукцината, этанола и формиата в крови, консультации офтальмолога и токсиколога нет; повторных сеансов гемодиализа тоже. Тяжесть — параметр: лабораторных границ у форм в рекомендации нет."
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.1: формулировка «суррогаты алкоголя» не приемлема; раздел 1.3: 2,2 % отравлений спиртосодержащей продукцией, контрафактный стеклоомыватель зимой, практически все поступившие — в критическом состоянии; раздел 1.5.1: лёгкая, средняя (офтальмическая) и тяжёлая (генерализованная) формы; раздел 1.6.1: начальный период — от 1–2 до 12 часов и более, скрытый — от 6 до 44 часов; раздел 2.1: жалобы на зрение после спиртосодержащей жидкости — заподозрить метанол; раздел 2.3: метанол, этиленгликоль и этанол в крови и моче — газовой хроматографией, КОС при средней и тяжёлой степени; раздел 3.1 (УУР С, УДД 5): промывание желудка в ранние сроки, активированный уголь не рекомендуется, эвакуация в центр острых отравлений или стационар с гемодиализом; раздел 3.2 (УУР С, УДД 5): этанол — антидот, только в стационаре, натрия гидрокарбонат при ацидозе, ранний гемодиализ в первые 6–12 часов, фолиевая кислота; раздел 6.1: лёгкие — до 5 дней, средние и тяжёлые — ОРИТ; критерии качества 2, 4, 10, 21–23; доли, полосы и сроки — игровая оценка" }
review: draft
