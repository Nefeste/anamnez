id: cond.opioid_poisoning
name: { ru: "Отравление опиоидами" }
# острое отравление опиоидными наркотическими веществами (spec 2026-10-chapter-4, часть 57а; 743_2): «В последние 10 лет наиболее частой
# причиной отравлений опиоидами стал метадон» (раздел 1.2) — в центре острых отравлений Санкт-Петербурга в 2024 году 97,8 % поступивших
# (раздел 1.3). МКБ-10 — T40.3 «Отравление метадоном»; героин, морфин и другие — в той же записи
icd10: T40.3
department: dept.therapy
system: poisoning
kind: state
# привозит скорая — с улицы, из подъезда, из квартиры (раздел 2.1)
arrival: ambulance
severity: critical
epidemiology:
  # 12–14 % госпитализированных в токсикологию (раздел 1.3): среди привезённых скорой — около 0,4 %, рядом с алкогольной абстиненцией;
  # подобрано прогоном генератора — игровая оценка
  prevalence: extremely_rare
  # возраста и пола в 743_2 нет — игровая оценка
  age: { min: 18, max: 70, peak: [22, 45] }
  sex: { m: 1, f: 0.35 }
params:
  # тяжесть (раздел 1.5): лёгкая — оглушение, 15–13 по шкале комы Глазго, витальные функции не нарушены; средняя — поверхностная кома,
  # точечные зрачки, брадипноэ до 6–8; тяжёлая — глубокая кома, гипотония, брадипноэ меньше 6 или апноэ. «В большинстве случаев
  # пациенты … поступают в критическом состоянии» (раздел 1.3): доли — игровая оценка
  severity: { mild: 30, moderate: 40, severe: 30 }
  # производный — доля для вывода, пока давление не мерили: низкое — у трёх из четырёх тяжёлых, около 25 из 100; игровая оценка
  hypotension: { no: 75, yes: 25 }
derived:
  # низкое давление — от него капельница (раздел 3.3.2 «Лечение нарушений гемодинамики»)
  hypotension: { has: vital.bp_low }
course:
  stages:
    - { id: acute, days: [0, 2] }
  presentation: [0, 0]
  # без помощи — остановка дыхания; отпущенного после налоксона догоняет метадон: «возможна повторная манифестация нарушений дыхания
  # после окончания действия препарата (реинтоксикация)» (раздел 3.3.5). Доли и сроки — игровая оценка
  untreated:
    - { band: always, days: [0, 0], when: { severity: [moderate, severe] } }
    - { band: sometimes, days: [0, 1] }
  # койко-дней: лёгкая — 1–2, средняя — 3–5, тяжёлая — 6–14 (приложение А3): в игре — от 2 до 6
  stay: [2, 6]
  # лёгкая под наблюдением проходит сама — опиоид выводится: «Нарушений витальных функций нет» (раздел 1.5); кома без ИВЛ — нет,
  # с ИВЛ проходит (эффект у «Интубации трахеи и ИВЛ»)
  selfLimiting: { when: { severity: [mild] } }
findings:
  # лёгкая: «нарушение сознание на уровне оглушения» (раздел 1.5) — жалоба родных на заторможенность
  - f: sym.confusion
    band: { pct: 100 }
    when: { severity: [mild] }
    note: "по определению параметра: лёгкая степень — оглушение, контакт сохранён (743_2, раздел 1.5)"
  - f: sign.gcs_low
    band: { pct: 100 }
    when: { severity: [mild] }
    note: "по определению параметра: оглушение — 15–13 баллов по шкале комы Глазго (743_2, раздел 1.5); в игре — 13–14"
  - f: sym.found_unconscious
    band: { pct: 100 }
    when: { severity: [moderate, severe] }
    note: "по определению параметра: поверхностная или глубокая кома (743_2, раздел 1.5)"
  - f: sign.gcs_coma
    band: { pct: 100 }
    when: { severity: [moderate, severe] }
    note: "по определению параметра: кома — 8 баллов и ниже по шкале комы Глазго"
  - f: vital.bradypnea
    band: { pct: 100 }
    when: { severity: [moderate, severe] }
    note: "по определению параметра: брадипноэ до 6–8 при средней степени, меньше 6 — при тяжёлой (743_2, раздел 1.5)"
  # миоз — ведущий симптом (разделы 1.5 и 1.6); частот в 743_2 нет — полосы игровые
  - { f: sign.miosis, band: usually, when: { severity: [mild] } }
  - { f: sign.miosis, band: always, when: { severity: [moderate, severe] } }
  # при нарушении дыхания — цианоз губ и лица, гипоксия (раздел 2.2); тяжёлая — гипотония (раздел 1.5)
  - { f: sign.cyanosis, band: often, when: { severity: [moderate] } }
  - { f: sign.cyanosis, band: usually, when: { severity: [severe] } }
  - { f: vital.spo2_low, band: usually, when: { severity: [moderate] } }
  - { f: vital.spo2_low, band: always, when: { severity: [severe] } }
  - { f: vital.bp_low, band: usually, when: { severity: [severe] } }
  - { f: vital.bradycardia, band: sometimes, when: { severity: [moderate, severe] } }
  # следы инъекций — «далеко не всегда», в вену — почти 80 % (разделы 1.2 и 2.2); о наркотиках скажут знакомые
  - { f: sign.injection_marks, band: often }
  - { f: hx.drug_use, band: often }
  - f: lab.opioids_urine
    band: { pct: 100 }
    note: "принимал опиоид: тест мочи его находит, кроме производных фентанила (743_2, раздел 2.3) — точность у обследования"
confirm: [exam.urine_drug_test]
redFlags: [sign.gcs_coma, vital.bradypnea]
# с чем спутать (раздел 2.5 и комментарии раздела 2.2): травма головы, инсульт, инфекция нервной системы — без сознания с улицы; глюкоза —
# в первый час (раздел 2.3). Набор — игровая оценка
differential: [cond.hypoglycemia, cond.ich, cond.meningococcal]
treatment:
  # сначала дыхание (раздел 3.2): проходимость дыхательных путей, интубация при коме, ИВЛ, кислород. Первой линии нет: лечат по
  # степени
  firstLine: []
  acceptable: []
  supportive: [tx.oxygen_mask, tx.iv_fluids]
  notIndicated: []
  harmful: []
  byParam:
    # налоксон — «при острых отравлениях опиоидными наркотическими веществами легкой степени и не сопровождающихся нарушениями дыхания и
    # тяжелой гипоксией» (раздел 3.3.5, УУР А, УДД 2): «Выполнена антидотная терапия налоксоном» — критерий качества 11, обязательно
    - when: { severity: [mild] }
      require: [tx.naloxone]
    # кома — ИВЛ «незамедлительно» при 8 баллах и ниже (раздел 3.3.1, УУР С, УДД 5; критерий качества 13); налоксон при средней и тяжёлой
    # степени противопоказан (приложение А3, табл. 10 и 11) — вопрос владельцу 30
    - when: { severity: [moderate, severe] }
      harmful: [tx.naloxone]
      require: [tx.ventilation]
    # инфузия — «всем пациентам с острыми отравлениями опиоидными наркотическими веществами, сопровождающимися нарушениями
    # водно-электролитного баланса» (раздел 3.3.2 «Лечение нарушений гемодинамики», УУР С, УДД 5; критерий качества 12): в игре —
    # обязательна при низком давлении, оно обычно при тяжёлой (раздел 1.5); без него облегчает
    - when: { hypotension: [yes] }
      require: [tx.iv_fluids]
  # без токсикологического отделения — «в отделение реанимации и интенсивной терапии или палату интенсивной терапии терапевтического
  # стационара» (раздел 6); в реанимацию — при угнетении сознания «с ШКГ менее 11 баллов» (там же). Лёгкую — и в терапевтическое
  # отделение (раздел 3.2): палата не ошибка
  setting:
    default: icu
    param: { name: severity, map: { mild: icu, moderate: ricu, severe: ricu } }
    also:
      - { when: { severity: [mild] }, settings: [ward] }
texts:
  summary:
    ru: >-
      Передозировка метадона, героина или другого опиоида: угнетены сознание и дыхание. Привозит скорая — нашли без сознания или
      не могли добудиться. Зрачки узкие, как точки, дыхание редкое, губы синюшные. При лёгкой степени — оглушение без нарушений
      дыхания — налоксон в вену и наблюдение в ПИТ. При коме налоксон противопоказан: интубация и ИВЛ в реанимации.
pearls:
  - ru: "Угнетение сознания, редкое дыхание и узкие зрачки — отравление опиоидами."
  - ru: "Налоксон — только при лёгкой степени без нарушений дыхания; при коме — интубация и ИВЛ."
  - ru: "Метадон действует до двух суток, налоксон — час-полтора: после антидота больной остаётся под наблюдением."
simplified: "Доз нет; что за опиоид, в игре не различают. Аспирации, пневмонии, некардиогенного отёка лёгких, позиционного сдавления и отравления вместе с алкоголем нет. Токсиколога и центра острых отравлений нет: их место — ПИТ и реанимация. Глюкоза — глюкометром, без срока в первый час; газов крови нет."
sources:
  - { kind: guideline, title: "Острые отравления опиоидными наркотическими веществами", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/743_2", note: "ID 743_2, опубликованы 29.01.2026, применяются; сверено с рубрикатором 12.10.2026; раздел 1.2: самая частая причина — метадон, внутривенно почти в 80 % случаев; раздел 1.3: 12–14 % госпитализированных в токсикологию, метадон — 97,8 % в 2024 году, в большинстве случаев поступают в критическом состоянии; раздел 1.5: лёгкая степень — оглушение, 15–13 баллов, средняя — поверхностная кома, точечные зрачки, брадипноэ до 6–8, тяжёлая — глубокая кома, гипотония, брадипноэ меньше 6 или апноэ; раздел 2.2: цианоз губ и лица при нарушении дыхания, следы инъекций далеко не всегда; раздел 2.3 (УУР В, УДД 3): экспресс-тест мочи и подтверждающие методы, (УУР С, УДД 4): глюкоза не позднее 1 ч при нарушении сознания; раздел 3.3.1 (УУР С, УДД 5): ИВЛ незамедлительно при 8 баллах и ниже; раздел 3.3.2 (УУР С, УДД 5): инфузия при нарушениях водно-электролитного баланса; раздел 3.3.5 (УУР А, УДД 2): налоксон при лёгкой степени без нарушений дыхания, при выраженных нарушениях дыхания строго противопоказан; приложение А3: при средней и тяжёлой степени налоксон противопоказан, койко-дни; раздел 6: без токсикологического отделения — ОРИТ или палата интенсивной терапии, в реанимацию — при шкале комы Глазго меньше 11 баллов; критерии качества 2, 10–13; доли, полосы и сроки — игровая оценка" }
review: draft
