id: cond.pe
name: { ru: "Тромбоэмболия лёгочной артерии" }
# I26.9 — без острого лёгочного сердца, I26.0 — с ним; одна запись на оба — I26.9
icd10: I26.9
department: dept.therapy
system: heart
kind: disease
severity: critical
epidemiology:
  # 39–115 на 100 000 в год (ESC 2019, раздел 3.1) — 13–38 на 100 случаев ОКС (около 300 на 100 000, 157_5,
  # раздел 1.3); у скорой в игре — около 22 на 100 ОКС (подобрано прогоном генератора: с полосой very_rare было бы
  # 65 — у ТЭЛА много сильных факторов риска)
  prevalence: extremely_rare
  # ВТЭ после 80 лет — почти в 8 раз чаще, чем в пятом десятилетии (раздел 3.1); пик и границы — игровая оценка
  age: { min: 18, peak: [60, 90] }
  sex: { m: 1, f: 1 }
  # факторы риска (табл. 3): высокий (ОШ > 10) — перелом ноги, ВТЭ в прошлом, обширная травма и операция; умеренный
  # (2–9) — рак, сердечная недостаточность; низкий (< 2) — постельный режим, поездки, ожирение, беременность,
  # варикоз. Множители — игровая оценка по этим группам
  risks:
    - { id: risk.prior_dvt, x: 10 }
    - { id: risk.leg_cast, x: 10 }
    - { id: risk.recent_bleed_surgery, x: 5 }
    - { id: risk.cancer_active, x: 4 }
    - { id: risk.heart_failure, x: 3 }
    - { id: risk.bed_rest, x: 1.5 }
    - { id: risk.travel, x: 1.5 }
    - { id: risk.obesity, x: 1.5 }
    - { id: risk.pregnancy, x: 1.5 }
    - { id: risk.varicose, x: 1.5 }
params:
  # высокий риск — нестабильная гемодинамика, верхнее давление ниже 90 (табл. 4): «возникает редко» (раздел 4.1) —
  # 5 из 100, игровая оценка
  shock: { no: 95, yes: 5 }
  # промежуточно-высокий риск — расширенный правый желудочек на КТ-ангиографии и повышенный тропонин (табл. 8); в
  # игре одним параметром: у кого ПЖ расширен, у того и тропонин повышен. Доля — игровая оценка
  rv: { no: 75, yes: 25 }
  # тромб в венах ноги: у 30–50 % больных ТЭЛА его находит УЗИ (раздел 4.10), отёк голени или бедра — у 41 %
  # (PIOPED II)
  dvt: { no: 60, yes: 40 }
  # где тромбы на КТ-ангиографии — доли игровые
  side: { both: 60, right: 25, left: 15 }
  # сатурация ниже 90 % — производный параметр по числу (как у ОКС, часть 38б); доли — для вывода, пока сатурацию не
  # мерили: игровая оценка по прогону генератора
  spo2_below90: { no: 75, yes: 25 }
  # sPESI 1 и больше — производный по баллам правила; доли — для вывода, пока пункты не известны: игровая оценка по
  # прогону генератора
  spesi: { no: 30, yes: 70 }
derived:
  # гипоксемия — SaO2 < 90 % (раздел 6.1.1: кислород)
  spo2_below90: { f: vital.spo2_low, below: 90 }
  spesi: rule.spesi
course:
  stages:
    - { id: acute, days: [0, 14] }
  # приходят в первые дни: тромболизис полезнее всего в первые 48 часов (раздел 6.3.1); доли — игровая оценка
  presentation: [0, 3]
  # без лечения: при шоке — почти всегда хуже в первые сутки (34 % умерших от ВТЭ — внезапно или за часы, раздел 3.1);
  # при расширенном ПЖ — вторичная декомпенсация через 24–48 часов (раздел 3.3; PEITHO — в среднем 1,8 дня, раздел
  # 7.2.2); остальным — повторная эмболия, часто за две недели. Доли и сроки — игровая оценка
  untreated:
    - { band: always, days: [0, 1], when: { shock: [yes] } }
    - { band: usually, days: [1, 3], when: { rv: [yes] } }
    - { band: often, days: [2, 14] }
  # в стационаре — неделя; длительности госпитализации в ESC нет — игровая оценка (НМГ при промежуточно-высоком
  # риске — первые 2–3 дня, раздел 7.2.2)
  stay: [5, 9]
findings:
  # одышка — у 73 %, из них началась за секунды или минуты — у 72 %, то есть у 53 из 100 (PIOPED II). Внезапная одышка
  # — и просто одышка (follows). Доли в записи — с поправкой: без жалоб не приходят, и тому, у кого жалобы не выпало,
  # достаётся самая частая — внезапная одышка; у пришедших выходит 53 и 73 (подобрано прогоном генератора)
  - f: sym.dyspnea_sudden
    band: { pct: 46 }
    note: "одышка началась за секунды или минуты — у 53 из 100 (PIOPED II: одышка у 73 %, внезапная — у 72 % из них)"
  - f: sym.dyspnea
    band: { pct: 35 }
    note: "одышка — у 73 из 100, нараставшая часами и днями — у 20 (PIOPED II)"
  - f: sym.pleuritic_pain
    band: { pct: 44 }
    attrs: { side: $side }
    note: "боль при дыхании — у 44 % (PIOPED II): раздражение плевры при дистальной эмболии (ESC 2019, раздел 4.1)"
  - f: sym.cough
    band: { pct: 34 }
    note: "кашель — у 34 % (PIOPED II)"
  - f: sym.hemoptysis
    band: { pct: 5 }
    note: "кровохарканье — у 5 % (PIOPED II)"
  # обморок — при выраженной нестабильности гемодинамики (раздел 4.1); доли — игровая оценка
  - { f: sym.syncope, band: often, when: { shock: [yes] } }
  - { f: sym.syncope, band: rarely, when: { shock: [no] } }
  - f: vital.tachypnea
    band: { pct: 54 }
    note: "частота дыхания 20 и больше — у 54 % (PIOPED II)"
  - { f: vital.tachycardia, band: usually, when: { shock: [yes] } }
  - f: vital.tachycardia
    band: { pct: 24 }
    when: { shock: [no] }
    note: "пульс чаще 100 — у 24 % (PIOPED II); синусовая тахикардия — у 40 % (ESC 2019, раздел 4.1)"
  - f: vital.spo2_low
    band: { pct: 60 }
    note: "нормальная сатурация — не больше чем у 40 % (ESC 2019, раздел 4.1)"
  - f: vital.bp_low
    band: { pct: 100 }
    when: { shock: [yes] }
    note: "высокий риск — по определению: верхнее давление ниже 90 (табл. 4)"
  - f: lab.d_dimer_high
    band: { pct: 95 }
    note: "D-димер ИФА — чувствительность 95 % и выше (ESC 2019, раздел 4.4)"
  # тропонин: у промежуточно-высокого риска — по определению (табл. 8); повышен у 30–60 % больных ТЭЛА (раздел 5.3.1) —
  # у остальных иногда, при шоке — обычно; доли — игровая оценка
  - f: lab.troponin_high
    band: { pct: 100 }
    when: { rv: [yes] }
    note: "промежуточно-высокий риск — дисфункция ПЖ и повышенный тропонин (ESC 2019, табл. 8)"
  - { f: lab.troponin_high, band: usually, when: { shock: [yes], rv: [no] } }
  - { f: lab.troponin_high, band: sometimes, when: { shock: [no], rv: [no] } }
  # тромб в венах ноги: боль и отёк голени, болезненность по ходу вен, на УЗИ — тромб (раздел 4.10)
  - { f: sym.leg_pain, band: often, when: { dvt: [yes] } }
  - { f: sign.calf_swelling_3cm, band: usually, when: { dvt: [yes] } }
  - { f: sign.deep_vein_tenderness, band: often, when: { dvt: [yes] } }
  - f: img.us_dvt_prox
    band: { pct: 100 }
    when: { dvt: [yes] }
    note: "тромб в венах ноги находит УЗИ с компрессией у 30–50 % больных ТЭЛА (ESC 2019, раздел 4.10)"
  - f: img.cta_pe
    band: { pct: 100 }
    attrs: { side: $side }
    note: "тромбы в лёгочных артериях — по определению болезни; пропустить их может само обследование: чувствительность 83 % (PIOPED II, ESC 2019, раздел 4.5)"
  - f: img.cta_rv_overload
    band: { pct: 100 }
    when: { rv: [yes] }
    note: "ПЖ/ЛЖ ≥ 1 — дисфункция ПЖ (ESC 2019, раздел 5.2.2)"
  - f: img.cta_rv_overload
    band: { pct: 100 }
    when: { shock: [yes] }
    note: "при шоке — ПЖ/ЛЖ > 1 (ESC 2019, рис. 4)"
confirm: [exam.cta_chest]
redFlags: [vital.bp_low, img.cta_rv_overload]
differential: [cond.acs, cond.pneumonia_cap, cond.aortic_dissection]
treatment:
  # антикоагулянт — всем без промедления (I C): в стационаре предпочтительно НМГ или фондапаринукс (I A), гепарин в
  # вену — при шоке и перед реперфузией (I C); дома — пероральный, предпочтительно ПОАК (I A вместо варфарина)
  firstLine: [tx.lmwh, tx.fondaparinux]
  acceptable: [tx.heparin_iv, tx.doac]
  plan: [tx.lmwh]
  # антиагреганты ТЭЛА не лечат; антибиотики — при пневмонии, не здесь; тромболизис при инфаркте и инсульте — другие
  # назначения: при ТЭЛА — свой
  notIndicated: [tx.aspirin_acs, tx.clopidogrel, tx.amoxicillin, tx.amoxicillin_clavulanate, tx.macrolide, tx.thrombolysis, tx.thrombolysis_stroke]
  byParam:
    # высокий риск (рис. 6): реперфузия — системный тромболизис (I B) и гепарин в вену без промедления (I C);
    # пероральный антикоагулянт — после стабилизации (раздел 7.2.1)
    - when: { shock: [yes] }
      firstLine: []
      acceptable: []
      supportive: []
      notIndicated: [tx.doac]
      harmful: []
      plan: [tx.heparin_iv]
      require: [tx.thrombolysis_pe, tx.heparin_iv]
    # без шока — рутинный тромболизис не рекомендован (III B)
    - when: { shock: [no] }
      firstLine: []
      acceptable: []
      supportive: []
      notIndicated: []
      harmful: [tx.thrombolysis_pe]
    # низкий риск — дома: пероральный антикоагулянт, ПОАК (рис. 6; раздел 6.7, I A)
    - when: { shock: [no], rv: [no], spesi: [no] }
      firstLine: [tx.doac]
      acceptable: []
      supportive: []
      notIndicated: []
      harmful: []
      plan: [tx.doac]
    # кислород при сатурации ниже 90 % (раздел 6.1.1)
    - when: { spo2_below90: [yes] }
      firstLine: []
      acceptable: []
      supportive: []
      notIndicated: []
      harmful: []
      require: [tx.oxygen_mask]
  # где лечить (рис. 6): низкий риск — ранняя выписка и дома; sPESI 1 и больше — стационар; шок или расширенный
  # правый желудочек — монитор, своя ПИТ; без своей ПИТ — «Вызвать скорую»
  setting:
    default: home
    param: { name: spesi, map: { yes: ward, no: home } }
    redFlag: icu
    # ранняя выписка при низком риске — «следует рассмотреть» (IIa A, раздел 6.10): оставить в стационаре — не ошибка
    also:
      - when: { spesi: [no] }
        settings: [ward]
    # ранняя выписка — из больницы, после КТ-ангиографии и оценки риска (раздел 6.10); без монитора у постели — в
    # кабинете поликлиники, где ни КТ-ангиографии, ни монитора, — в стационар
    without: { equipment: [eq.monitor_defib], setting: ward }
texts:
  summary:
    ru: >-
      Тромб из вен ноги уходит в лёгочную артерию и закупоривает её. Одышка начинается внезапно, бывает
      боль при дыхании, кашель с кровью, обморок; нога иногда отёчна. Вероятность считают Женевской
      шкалой: высокая — сразу КТ-ангиография, низкая и промежуточная — сначала D-димер. Диагноз —
      тромбы в лёгочных артериях на КТ-ангиографии. Антикоагулянт — сразу. Шок — тромболизис с
      гепарином в вену и палата интенсивной терапии; без шока тромболизис вреден. Где лечить, решает
      sPESI: 0 баллов — дома, 1 и больше — в стационаре, расширенный правый желудочек — под монитором.
pearls:
  - ru: "Одышка началась внезапно, без простуды и температуры, — посчитайте Женевскую шкалу и посмотрите ноги."
  - ru: "D-димер при высокой вероятности ТЭЛА не нужен: в норме он её не исключит — сразу КТ-ангиография."
  - ru: "Тромболизис при ТЭЛА — только при шоке; без шока кровотечение опаснее пользы."
simplified: "Шкалы Уэллса для ТЭЛА, PESI, Hestia и PERC нет; ЭКГ-признаков перегрузки правого желудочка, УЗИ сердца у постели, V/Q-сцинтиграфии и МРТ нет. Промежуточно-высокий риск в игре — расширенный правый желудочек на КТ-ангиографии, и тропонин при нём всегда повышен. Пульс 75–94 в Женевской шкале не различается, пороги sPESI — пульс чаще 100, давление ниже 90 и сатурация ниже 95. Хирургической эмболэктомии, катетерного лечения, ЭКМО и кава-фильтра нет; антикоагулянт до снимка, выбор ПОАК по почкам, беременность и рак — без особенностей."
sources:
  - { kind: guideline, title: "Рекомендации ESC по диагностике и лечению острой легочной эмболии, разработанные в сотрудничестве с Европейским респираторным обществом (ERS)", org: "ESC, ERS", year: 2019, url: "https://doi.org/10.15829/1560-4071-2020-3848", note: "перевод — Российский кардиологический журнал 2020;25(8):3848 (решение владельца, вопрос 25); стр. 9, раздел 3.1: 39–115 на 100 000 в год, после 80 лет ВТЭ почти в 8 раз чаще; стр. 10, табл. 3: факторы риска по ОШ; стр. 12, табл. 4: нестабильная гемодинамика — САД < 90; стр. 13, раздел 4.1: признаки неспецифичны, нестабильность возникает редко, нормальная SaO2 — не больше чем у 40 %, синусовая тахикардия — у 40 %; стр. 14, раздел 4.4: D-димер ИФА — чувствительность ≥ 95 %; стр. 19, раздел 4.10: УЗИ вен находит ТГВ у 30–50 %; стр. 22, раздел 5.3.1: тропонин повышен у 30–60 %; стр. 25, табл. 8: классы риска; стр. 26, раздел 6.1.1: кислород при SaO2 < 90 %; стр. 32, разделы 6.6–6.7: антикоагулянт без промедления — I C, НМГ или фондапаринукс предпочтительнее НФГ — I A, ПОАК вместо АВК — I A, тромболизис при высоком риске — I B, рутинный при промежуточном и низком — III B; стр. 36, рис. 6: место по классу риска; доли параметров и сроки течения — игровая оценка" }
  - { kind: paper, title: "Stein PD, Beemath A, Matta F и др. Clinical characteristics of patients with acute pulmonary embolism: data from PIOPED II. Am J Med 2007;120(10):871–879", url: "https://pubmed.ncbi.nlm.nih.gov/17904458/", note: "PMID 17904458, сверено 05.10.2026: 133 больных ТЭЛА без прежних болезней сердца и лёгких — одышка 73 % (за секунды или минуты — у 72 % из них), боль при дыхании 44 %, кашель 34 %, кровохарканье 5 %, отёк голени или бедра 41 %, частое дыхание (≥ 20) 54 %, пульс > 100 — 24 %" }
review: draft
