id: cond.hepatic_encephalopathy
name: { ru: "Печёночная энцефалопатия" }
# нарушение работы мозга при циррозе (spec 2026-10-chapter-4, часть 54а): аммиак и другие токсины из кишечника печень не
# обезвреживает (715_2, раздел 1.2). С ней приходят при явной форме — со II стадии по West Haven: «явная энцефалопатия (2-я
# стадия и выше)» — показание к госпитализации (раздел 6). МКБ-10 — K72.9, печёночная недостаточность неуточнённая
icd10: K72.9
department: dept.therapy
system: digestive
kind: disease
severity: serious
epidemiology:
  # явная энцефалопатия — у 10–20 % при манифестации цирроза, за болезнь — у 30–40 % (715_2, раздел 1.3): приходят с ней не
  # реже, чем с кровотечением из вен. Полоса подобрана прогоном генератора — игровая оценка
  prevalence: very_common
  age: { min: 30 }
  requires: [cond.cirrhosis]
params:
  # стадия по West Haven (715_2, раздел 1.5, табл. 2): вторая — вялость, дезориентация во времени, астериксис; третья —
  # сонливость до полуступора, спутанность, дезориентация в пространстве; четвёртая — кома. Доли — игровая оценка
  grade: { g2: 55, g3: 35, g4: 10 }
  # декомпенсированный цирроз — асцит и желтуха (раздел 1.6): асцит — и на осмотре, и на УЗИ, и в пункции; доля — игровая
  # оценка
  decomp: { yes: 60, 'no': 40 }
course:
  stages:
    - { id: overt, days: [0, 7] }
  presentation: [0, 3]
  # без лечения энцефалопатия углубляется до комы; доли и сроки — игровая оценка
  untreated:
    - { band: usually, days: [1, 3], when: { grade: [g3, g4] } }
    - { band: often, days: [2, 5], when: { grade: [g2] } }
  # длительности госпитализации в 715_2 нет — игровая оценка
  stay: [5, 10]
findings:
  # вторая стадия — вялость, дезориентация во времени (табл. 2), сон днём и бессонница ночью (раздел 2.1): с этого явная
  # энцефалопатия начинается, об этом говорят родные — и у больного в коме
  - f: sym.daytime_sleepiness
    band: { pct: 100 }
    note: "начало явной энцефалопатии — вялость, дезориентация во времени со II стадии по West Haven (715_2, раздел 1.5, табл. 2), сонливость днём и бессонница ночью (раздел 2.1): об этом говорят родные"
  # третья — спутанность и дезориентация в пространстве (табл. 2); у второй — неадекватное поведение, игровая оценка
  - f: sym.confusion
    band: { pct: 100 }
    when: { grade: [g3] }
    note: "третья стадия по West Haven — спутанность, выраженная дезориентация (715_2, раздел 1.5, табл. 2)"
  - { f: sym.confusion, band: sometimes, when: { grade: [g2] } }
  # сонливость до полуступора — оглушение по шкале Глазго: им III стадию и отличают от II; глубина — игровая оценка
  - f: sign.gcs_low
    band: { pct: 100 }
    when: { grade: [g3] }
    note: "третья стадия по West Haven — сонливость до полуступора (715_2, раздел 1.5, табл. 2): оглушение по шкале Глазго"
  - f: sign.gcs_coma
    band: { pct: 100 }
    when: { grade: [g4] }
    note: "четвёртая стадия по West Haven — кома, нет реакции даже на боль (715_2, раздел 1.5, табл. 2)"
  # в коме сам не расскажет: родные не смогли разбудить и вызвали скорую (с частью 57а, spec 2026-10-chapter-4) — жалоба та же,
  # что у отравленного опиоидами
  - f: sym.found_unconscious
    band: { pct: 100 }
    when: { grade: [g4] }
    note: "по определению параметра: четвёртая стадия по West Haven — кома (715_2, раздел 1.5, табл. 2), о ней говорят те, кто вызвал скорую"
  # астериксис — признак второй стадии (табл. 2), держится и в третьей; полоса — игровая оценка
  - { f: sign.asterixis, band: usually, when: { grade: [g2, g3] } }
  # сладковатый запах изо рта — тяжёлая печёночная недостаточность (раздел 2.2); полоса — игровая оценка
  - { f: sign.fetor_hepaticus, band: sometimes }
  # гипераммониемия — ключевой фактор (раздел 1.2); полоса — игровая оценка
  - { f: lab.ammonia_high, band: always }
  # запор — провоцирующий фактор (раздел 1.5, табл. 3); полоса — игровая оценка
  - { f: sym.constipation, band: often }
  - { f: sign.ascites, band: { pct: 100 }, when: { decomp: [yes] }, note: "асцит при декомпенсации: заметят ли его — точность осмотра (715_2, раздел 2.2)" }
  - { f: img.us_ascites, band: { pct: 100 }, when: { decomp: [yes] }, note: "асцит на УЗИ — у каждого, у кого он заметен на осмотре (715_2, раздел 1.5)" }
  - { f: lab.ascitic_fluid, band: { pct: 100 }, when: { decomp: [yes] }, note: "асцитическая жидкость при парацентезе — у каждого с асцитом (715_2, раздел 2.3)" }
  - { f: sign.jaundice, band: often, when: { decomp: [yes] } }
  - f: sym.insomnia
    band: { pct: 100 }
    note: "инверсия сна — бессонница ночью при сонливости днём (715_2, раздел 2.1): у каждого, у кого сонлив днём"
confirm: clinical
redFlags: [sign.gcs_coma, sym.confusion]
treatment:
  # лактулоза при явной энцефалопатии (715_2, раздел 3.2.3, УУР A, УДД 1); рифаксимин — при II–III стадии, орнитин — при II–IV
  # (УУР A, УДД 1): «все три препарата применяются в качестве монотерапии или сочетаются друг с другом» — первая линия из
  # равных, обычно — лактулоза
  firstLine: [tx.lactulose, tx.rifaximin, tx.ornithine]
  plan: [tx.lactulose]
  acceptable: []
  supportive: []
  # бензодиазепины — провокатор у 10–15 из 100, диуретики — у 25–30 (табл. 3); углубление энцефалопатии — основание отменить
  # диуретики (раздел 3.2.1)
  harmful: [tx.benzodiazepine, tx.furosemide_iv, tx.spironolactone]
  notIndicated: []
  byParam:
    # кома: рифаксимин — при II–III стадии (раздел 3.2.3), орнитин и лактулоза через зонд или клизмой — да; ИВЛ — защитить
    # дыхательные пути, не ошибка (игровая оценка)
    - when: { grade: [g4] }
      notIndicated: [tx.rifaximin]
      acceptable: [tx.ventilation]
  # явная энцефалопатия — госпитализация (раздел 6); третья стадия — интенсивная терапия, кома — реанимация (раздел 6: «в
  # отделение интенсивной терапии и реанимации»; распределение по стадиям — игровая оценка)
  setting:
    default: ward
    param: { name: grade, map: { g2: ward, g3: icu, g4: ricu } }
    also:
      - { when: { grade: [g3] }, settings: [ricu] }
texts:
  summary:
    ru: >-
      Нарушение работы мозга при циррозе: печень не обезвреживает аммиак из кишечника, и он отравляет мозг. Сначала —
      вялость, сонливость днём и бессонница ночью, путаница в днях, хлопающий тремор кистей; потом — спутанность, оглушение,
      кома. Провоцируют кровотечение, инфекция, запор, снотворные и мочегонные. Лечат лактулозой, рифаксимином или орнитином
      и устраняют провокатор.
pearls:
  - ru: "Больной циррозом стал сонлив днём и путает дни — проверьте хлопающий тремор и сахар крови: печёночная энцефалопатия начинается тихо."
  - ru: "Снотворные и успокоительные при печёночной энцефалопатии — вред: бензодиазепины углубляют её до комы."
simplified: "Минимальной и первой стадии нет — с ними не приходят. Провоцирующие факторы не разбирают: кровотечение, инфекция и электролиты — отдельными болезнями или никак; белок в диете не считают. Психометрических тестов нет — стадию видно по сознанию и тремору."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.2: гипераммониемия — ключевой фактор ПЭ; раздел 1.3: явная ПЭ — у 10–20 % при манифестации ЦП; раздел 1.5, табл. 2: стадии по West Haven; табл. 3: провокаторы — ЖКК 25–30 %, инфекция 10–18 %, бензодиазепины 10–15 %, азотемия 25–30 %, диуретики 25–30 %, запор; раздел 2.2: сладковатый запах изо рта; раздел 3.2.1: углубление ПЭ — основание отменить диуретики; раздел 3.2.3: устранение провокаторов (УУР C, УДД 5), лактулоза (УУР A, УДД 1), рифаксимин при II–III стадии (УУР A, УДД 1), орнитин при II–IV (УУР A, УДД 1); раздел 6: явная ПЭ — госпитализация, в том числе в ОРИТ; доли стадий и полосы признаков — игровая оценка" }
review: draft
