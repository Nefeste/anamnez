id: cond.gastritis_hp
name: { ru: "Хронический гастрит, ассоциированный с H. pylori" }
# хронический гастрит неуточнённый, антральный — K29.5 (708_2, раздел 1.4): своего кода у гастрита, вызванного H. pylori,
# в МКБ-10 нет, по Киотской классификации он — инфекционный (раздел 1.5)
icd10: K29.5
department: dept.therapy
system: digestive
# кислотозависимые болезни с болью под ложечкой (spec 2026-10-chapter-4, часть 53б): с язвой, функциональной диспепсией и
# рефлюксом их различают тест на H. pylori и ЭГДС
group: grp.acid_dyspepsia
kind: disease
severity: minor
epidemiology:
  # гастрит и дуоденит впервые — 462 на 100 000 взрослых в 2019 г. (708_2, раздел 1.3); H. pylori — у 38,8 % взрослых без
  # прежней эрадикации по 13С-уреазному дыхательному тесту (там же). Доля среди пришедших с болью под ложечкой — полоса
  # подобрана прогоном генератора, игровая оценка
  prevalence: uncommon
  age: { min: 18 }
course:
  stages:
    - { id: active, days: [0, 365] }
  presentation: [14, 90]
  # без эрадикации не хуже, но и не проходит; атрофия и риск рака — за годами, в игре их нет
  untreated: { band: never, days: [7, 7] }
findings:
  # диспепсия — боль или жжение в эпигастрии, переполнение, раннее насыщение (708_2, раздел 1.6); частот при H. pylori-
  # гастрите в тексте нет — полосы, игровая оценка
  - { f: sym.epigastric_pain, band: usually }
  - { f: sym.early_satiety, band: often }
  # голодные боли бывают не только при язве (277_2, раздел 1.6: симптомы «могут встречаться» при гастрите) — игровая оценка
  - { f: sym.hunger_pain, band: sometimes }
  - { f: sym.nausea, band: rarely }
  - { f: sym.heartburn, band: rarely }
  # «как правило, нет данных, которые были бы характерны для гастрита» (708_2, раздел 2.2)
  - { f: sign.epigastric_tenderness, band: rarely }
  - f: lab.h_pylori
    band: { pct: 100 }
    note: "по определению: «положительные тесты на H.pylori свидетельствуют о наличии хронического гастрита» (708_2, раздел 2)"
  # диффузная эритема и отёк слизистой — «часто» при H. pylori (708_2, Приложение А3)
  - { f: img.egd_gastritis, band: often }
# тест на H. pylori подтверждает гастрит (708_2, раздел 2), ЭГДС с биопсией — его стадию (раздел 2.4)
confirm: [exam.hp_stool, exam.egd]
treatment:
  # всем с хроническим гастритом и положительным тестом — эрадикация как этиологическое лечение (708_2, раздел 3.1.1, УУР
  # B, УДД 2); при необследованной диспепсии с положительным тестом — тоже (раздел 3.1.4, УУР A, УДД 1)
  firstLine: [tx.hp_eradication]
  # ИПН — симптоматическое лечение диспепсии, особенно боли и жжения (708_2, раздел 3.1.4, УУР A, УДД 1)
  supportive: [tx.ppi]
  # эрадикация — схемой из трёх-четырёх препаратов, а не одним антибиотиком (708_2, раздел 3.1.1)
  notIndicated: [tx.amoxicillin, tx.amoxicillin_clavulanate, tx.macrolide, tx.metronidazole, tx.fluoroquinolone, tx.cephalosporin_oral]
  # «большинство пациентов с гастритом подлежат наблюдению и лечению в амбулаторных условиях» (708_2, раздел 6)
  setting: { default: home }
texts:
  summary:
    ru: >-
      Воспаление слизистой желудка, которое вызывает бактерия Helicobacter pylori. Часто ничем не проявляется, а у части
      больных даёт диспепсию: боль или жжение под ложечкой, тяжесть и быстрое насыщение после еды. Инфекцию находят
      дыхательным тестом, антигеном в кале или быстрым уреазным тестом при ЭГДС. Лечат дома эрадикацией — курсом из
      нескольких лекарств сразу; это и профилактика язвы и рака желудка.
pearls:
  - ru: "Диспепсия и положительный тест на H. pylori — это гастрит, а не функциональная диспепсия: функциональную ставят, когда инфекции нет или жалобы остались после успешной эрадикации."
  - ru: "Эрадикация — сразу несколько лекарств на 14 дней; одним антибиотиком H. pylori не вылечить."
simplified: "Атрофии, кишечной метаплазии, стадий OLGA и наблюдения за ними нет; аутоиммунного гастрита нет. Контроля эрадикации через 4 недели и повторного курса другой схемой нет: у кого эрадикация не удалась, жалобы остаются. ИПН за 2 недели до теста отменять не нужно: точность теста от них не зависит."
sources:
  - { kind: guideline, title: "Гастрит и дуоденит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/708_2", note: "ID 708_2, опубликованы 10.07.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: впервые выявлено 462 на 100 000 взрослых (2019), H. pylori — 38,8 % по 13С-уреазному дыхательному тесту; раздел 1.6: диспепсия — боль, жжение, переполнение, раннее насыщение; симптомы связаны с H. pylori, если стойко исчезают после эрадикации, а сохраняются — функциональная диспепсия; раздел 2: положительный тест на H. pylori свидетельствует о хроническом гастрите; раздел 2.2: характерных физикальных данных нет; раздел 3.1.1 (УУР B, УДД 2): эрадикация всем с положительным тестом, первая линия — 14 дней; добавление висмута — эрадикация выше 90 %; раздел 6: лечат амбулаторно; Приложение А3: Киотская эндоскопическая характеристика; полосы признаков — игровая оценка" }
review: draft
