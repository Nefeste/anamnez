id: cond.hypocalcemia_acute
name: { ru: "Острая гипокальциемия" }
# «Острая гипокальциемия (гипокальциемический криз) – это жизнеугрожающее состояние, которое требует неотложных лечебных
# мероприятий» (spec 2026-10-chapter-4, часть 56в; 627_3, раздел 1.6.1). В игре — после операции на щитовидной железе:
# послеоперационный гипопаратиреоз, МКБ-10 — E89.2 «Гипопаратиреоз, возникший после медицинских процедур» (раздел 1.4)
icd10: E89.2
department: dept.therapy
system: metabolic
kind: disease
# угрожает жизни ларингоспазмом, но лечат её в палате; ОМС по тяжести — игровая оценка
severity: serious
epidemiology:
  # транзиторный гипопаратиреоз — у 25–30 % после тотальной тиреоидэктомии (раздел 1.2.3); полоса подобрана прогоном генератора —
  # игровая оценка
  prevalence: extremely_rare
  # «Послеоперационный гипопаратиреоз чаще встречается среди женщин, что связано с более частой патологией ЩЖ и, следовательно,
  # тиреоидэктомией» (раздел 1.3): соотношения в 627_3 нет — женщин вчетверо больше, игровая оценка; возраст — игровая оценка
  age: { min: 18, peak: [35, 65] }
  sex: { m: 0.25, f: 1 }
params:
  # явная тетания — судорогой сводит кисти; без неё — только парестезии, тетания скрытая (раздел 1.6.1). Доля — игровая оценка:
  # тетанию называют 70 из 100 опрошенных больных гипопаратиреозом (раздел 2.1, табл. 3), это не частота при остром кризе
  tetany: { yes: 70, no: 30 }
course:
  stages:
    - { id: acute, days: [0, 3] }
  # гипокальциемия развивается «в первые 24 часа после операции на органах шеи» («Термины и определения»); с первыми симптомами
  # приходят в тот же день — игровая оценка
  presentation: [0, 1]
  # без лечения — ларингоспазм, нарушения ритма, генерализованные судороги (раздел 6, показания к экстренной госпитализации): доли и
  # сроки — игровая оценка
  untreated:
    - { band: often, days: [0, 2], when: { tetany: [yes] } }
    - { band: sometimes, days: [1, 5] }
  # выписка — при стойком улучшении (раздел 6); транзиторный гипопаратиреоз проходит за 4–6 недель («Термины и определения»): срок —
  # игровая оценка
  stay: [3, 7]
findings:
  - f: hx.thyroidectomy
    band: { pct: 100 }
    note: "в игре — после операции на щитовидной железе: так возникает около 75 % гипопаратиреоза (627_3, раздел 1.2.3)"
  - f: lab.ca_low
    band: { pct: 100 }
    note: "по определению: гипокальциемия"
  # тетании «могут предшествовать парестезии лица, кистей и стоп» (раздел 1.6.1); без явной тетании жалоба — они
  - { f: sym.perioral_paresthesia, band: always, when: { tetany: [yes] } }
  - f: sym.perioral_paresthesia
    band: { pct: 100 }
    when: { tetany: ['no'] }
    note: "по определению параметра: без явной тетании гипокальциемия проявляется парестезиями"
  - f: sym.hand_spasm
    band: { pct: 100 }
    when: { tetany: [yes] }
    note: "по определению параметра: явная тетания — судорогой сводит кисти"
  # скрытая тетания — у каждого; сколько найдут пробы, решает их точность (раздел 2.2)
  - f: sign.trousseau
    band: { pct: 100 }
    note: "признак — сама гипокальциемия: проба находит её у 94 из 100 (627_3, раздел 2.2)"
  - f: sign.chvostek
    band: { pct: 100 }
    note: "признак — сама гипокальциемия: проба находит её у 70 из 100 (627_3, раздел 2.2)"
  - f: sign.neck_scar
    band: { pct: 100 }
    note: "по определению: шов после операции на щитовидной железе"
  # «чувство страха, беспокойство» (раздел 1.6.1): доля — игровая оценка, тревожность называют 59 из 100 опрошенных (табл. 3)
  - { f: sym.anxiety, band: often }
  # «Активация симпатической нервной системы приводит к тахикардии, повышению артериального давления» (раздел 1.6.1): доля —
  # игровая оценка
  - { f: vital.tachycardia, band: sometimes }
  # «Удлинение интервала QT» (раздел 1.6.2, табл. 2): доля — игровая оценка
  - { f: ecg.qt_long, band: sometimes }
  # «от классического карпопедального спазма до жизнеугрожающего ларингоспазма» (раздел 1.6): доля — игровая оценка
  - { f: sign.stridor, band: rarely, when: { tetany: [yes] } }
confirm: [exam.calcium]
redFlags: [sign.stridor]
# с чем спутать — сравнения в 627_3 нет, игровая оценка: тревога и частый пульс после операции на щитовидной железе — как
# тиреотоксический криз; беспокойство и онемение — как гипогликемия; судороги — как судорожный приступ
differential: [cond.thyroid_storm, cond.hypoglycemia, cond.seizure]
treatment:
  # «Для купирования острой гипокальциемии используется внутривенное введение препаратов кальция в 2 этапа»; «Предпочтительно
  # использование кальция глюконата» — у кальция хлорида некроз тканей при выходе раствора из вены (раздел 7.1; без УУР и УДД).
  # Кровь на ПТГ — для диагноза гипопаратиреоза (раздел 2, УУР С, УДД 5; раздел 5, УУР В, УДД 3)
  firstLine: [tx.calcium_gluconate_iv]
  acceptable: [tx.pth_sample]
  supportive: []
  notIndicated: []
  harmful: [tx.calcium_chloride_iv]
  # «Одновременно назначаются пероральные препараты кальция и препараты витамина D и его аналогов» (раздел 7.1): назначать один
  # кальций «патогенетически не оправдано» (раздел 3.2, комментарий; УУР С, УДД 4); критерий качества 9
  require: [tx.calcium_oral, tx.active_vitamin_d]
  # «Показания для экстренной госпитализации» — первое из них острая гипокальциемия (раздел 6); ПИТ в 627_3 не названа: при тетании
  # — не ошибка, игровая оценка
  setting:
    default: ward
    also:
      - { when: { tetany: [yes] }, settings: [icu] }
texts:
  summary:
    ru: >-
      Кальций крови упал так, что нервы и мышцы перевозбуждены. В игре — после операции на щитовидной железе, когда задеты
      околощитовидные железы: в первые сутки-двое немеет вокруг рта и колет пальцы, потом судорогой сводит кисти, бывает
      ларингоспазм. Симптом Труссо положительный, кальций с поправкой на альбумин ниже нормы. Кальция глюконат в вену и сразу —
      кальций внутрь с альфакальцидолом или кальцитриолом; лечат в палате.
pearls:
  - ru: "Покалывание вокруг рта и судороги кистей после операции на щитовидной железе — острая гипокальциемия: кальций крови и кальция глюконат в вену."
  - ru: "Одного кальция мало: сразу же — кальций внутрь с альфакальцидолом или кальцитриолом."
  - ru: "Кальция хлорид, выйдя из вены, омертвляет ткани — выбирают кальция глюконат."
simplified: "Острая гипокальциемия в игре — только после операции на щитовидной железе; хронический гипопаратиреоз, другие его причины и псевдогипопаратиреоз не моделируются. Магний, фосфор, креатинин, витамин D и суточная моча — после смены, ответ паратгормона — тоже. Доз и трёх способов ввести кальций нет; центрального катетера нет — кальция хлорид в игре только вредит. Судорог и аритмий от гипокальциемии нет, ларингоспазм — шумный вдох."
sources:
  - { kind: guideline, title: "Гипопаратиреоз у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/627_3", note: "ID 627_3, опубликованы 23.06.2025, применяются; сверено с рубрикатором 12.10.2026; «Термины и определения»: транзиторный послеоперационный гипопаратиреоз — гипокальциемия в первые 24 часа после операции на органах шеи, проходит за 4–6 недель; раздел 1.2.3: операция на шее — около 75 % всех случаев, транзиторный — у 25–30 % после тотальной тиреоидэктомии; раздел 1.3: чаще у женщин; раздел 1.4: E89.2; раздел 1.6: от карпопедального спазма до ларингоспазма; раздел 1.6.1: острая гипокальциемия — жизнеугрожающее состояние, тетании предшествуют парестезии, страх и беспокойство, тахикардия; раздел 1.6.2, табл. 2: удлинение QT; раздел 2 (УУР С, УДД 5): диагноз — кальций с поправкой на альбумин или ионизированный и ПТГ; раздел 2.2 (УУР С, УДД 5): симптомы Хвостека и Труссо; раздел 3.2 (УУР С, УДД 4): препараты витамина D и его аналогов с препаратами кальция; раздел 5 (УУР В, УДД 3): ПТГ и кальций в первые сутки после операции; раздел 6: экстренная госпитализация; раздел 7.1 (без УУР и УДД): кальция глюконат в вену в 2 этапа, кальция хлорид — некроз при выходе из вены, одновременно кальций внутрь и активный витамин D; критерии качества 1–3 и 9; доли, полосы, сроки и место — игровая оценка" }
review: draft
