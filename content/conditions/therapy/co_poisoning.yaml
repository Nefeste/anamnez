id: cond.co_poisoning
name: { ru: "Отравление угарным газом" }
# острое отравление монооксидом углерода (spec 2026-10-chapter-4, часть 57б; 885_1): на пожаре и дома — печь, отопительный прибор,
# мотор в закрытом помещении (разделы 1.1 и 2). МКБ-10 — T58 «Токсическое действие окиси углерода» (раздел 1.4); на пожаре — и
# продукты горения
icd10: T58
department: dept.therapy
system: poisoning
kind: state
# все пострадавшие нуждаются в скорой помощи выездной бригадой (раздел 2.1, УУР С, УДД 5)
arrival: ambulance
severity: critical
epidemiology:
  # 3,2 % всех отравлений, второе место среди их причин смерти (раздел 1.3): реже отравления опиоидами; доля подобрана прогоном
  # генератора — игровая оценка
  prevalence: ultra_rare
  # отопительный сезон и время года в 885_1 не названы: печи и колонки — зимой, пожары — круглый год; игровая оценка
  season: { winter: 1.6, spring: 0.9, summer: 0.5, autumn: 1.0 }
  # возраста и пола в 885_1 нет — игровая оценка
  age: { min: 18, max: 85 }
  sex: { m: 1, f: 0.6 }
params:
  # тяжесть — по карбоксигемоглобину: лёгкая — менее 30 %, средняя — 30–50 %, тяжёлая — более 50 % (раздел 1.5); доли — игровая
  # оценка
  severity: { mild: 40, moderate: 35, severe: 25 }
  # «подавляющее большинство пострадавших, подвергшихся интоксикации монооксидом углерода, в настоящее время, доставляют из очагов
  # пожаров» (раздел 1.1): долей нет — игровая оценка
  exposure: { fire: 75, home: 25 }
  # производный — доля для вывода, пока давление не мерили: низкое — у каждого четвёртого тяжёлого; игровая оценка
  hypotension: { no: 92, yes: 8 }
derived:
  # низкое давление — от него растворы (раздел 3.2)
  hypotension: { has: vital.bp_low }
course:
  stages:
    - { id: acute, days: [0, 1] }
  presentation: [0, 0]
  # на свежем воздухе угарный газ уходит из крови и сам — период полураспада около 320 минут (раздел 3.2, комментарий): лёгкое
  # отравление под наблюдением проходит
  selfLimiting: { when: { severity: [mild] } }
  # без кислорода тяжёлое — кома углубляется, остановка дыхания; среднее — часто хуже; отпущенному домой с лёгким — иногда:
  # доли и сроки — игровая оценка
  untreated:
    - { band: always, days: [0, 0], when: { severity: [severe] } }
    - { band: often, days: [0, 1], when: { severity: [moderate] } }
    - { band: sometimes, days: [0, 1] }
  # сроков лечения в 885_1 нет: «до стабилизации нарушенных витальных функций» (раздел 6.2) — игровая оценка
  stay: [1, 5]
findings:
  # откуда угарный газ (разделы 1.1 и 2): о пожаре скажут всегда; о печи и моторе — обычно: скорая судит по обстановке, но анамнез
  # собрать удаётся «далеко не всегда» (раздел 2.1) — тогда узнают по карбоксигемоглобину; полоса — игровая оценка
  - f: sym.smoke_inhaled
    band: { pct: 100 }
    when: { exposure: [fire] }
    note: "по определению параметра: отравление на пожаре (885_1, раздел 1.1)"
  - { f: sym.co_home, band: usually, when: { exposure: [home] } }
  # на пожаре — ингаляционная травма: копоть, изменение голоса, одышка (разделы 2.1 и 2.2); полосы — игровая оценка
  - { f: sign.soot_face, band: usually, when: { exposure: [fire] } }
  - { f: sign.hoarse_voice, band: sometimes, when: { exposure: [fire] } }
  - { f: sym.dyspnea, band: sometimes, when: { exposure: [fire] } }
  # «В случае поражений легкой и средней степени пациенты могут предъявлять жалобы на головную боль преимущественно в височной
  # области, пульсирующую боль в затылочной области, головокружение, слабость, тошноту» (раздел 2.1); частот в 885_1 нет — полосы
  # игровые
  - { f: sym.headache, band: usually, when: { severity: [mild, moderate] } }
  - { f: sym.dizziness, band: often, when: { severity: [mild, moderate] } }
  - { f: sym.nausea, band: often, when: { severity: [mild, moderate] } }
  - { f: sym.fatigue, band: often, when: { severity: [mild, moderate] } }
  # синкопальная форма (раздел 2.1, комментарий) и спутанность при средней степени (приложение Г2) — игровая оценка
  - { f: sym.syncope, band: sometimes, when: { severity: [moderate] } }
  - { f: sym.confusion, band: sometimes, when: { severity: [moderate] } }
  # «В случае тяжелого отравления сбор анамнеза и жалоб будет затруднен ввиду угнетения сознания» (раздел 2.1)
  - f: sym.found_unconscious
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "по определению параметра: тяжёлое отравление — угнетение сознания (885_1, раздел 2.1)"
  - f: sign.gcs_coma
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "по определению параметра: при тяжёлом — угнетение сознания до комы (885_1, раздел 2.1); глубина — игровая оценка"
  # «При тяжелых отравлениях на ЭКГ регистрируют нарушения ритма и проводимости, признаки гипоксии миокарда» (раздел 2.3); давление —
  # противошоковая терапия (раздел 3.2); полосы — игровая оценка
  - { f: ecg.st_depression, band: sometimes, when: { severity: [severe] } }
  - { f: vital.tachycardia, band: often, when: { severity: [moderate, severe] } }
  - { f: vital.bp_low, band: sometimes, when: { severity: [severe] } }
  # розовые слизистые — «патогномоничного признака» (раздел 2.2); частоты нет — игровая оценка
  - { f: sign.pink_mucosa, band: sometimes }
  - f: lab.cohb_high
    band: { pct: 100 }
    note: "отравился угарным газом — карбоксигемоглобин повышен у каждого: «Основной метод диагностики» (885_1, раздел 2.3); точность — у обследования"
confirm: [exam.cohb]
redFlags: [sign.gcs_coma]
# с чем спутать (раздел 2.5): с состояниями с нарушением сознания — травма головы, отравления наркотиками, нарушения углеводного
# обмена. Набор — игровая оценка
differential: [cond.opioid_poisoning, cond.hypoglycemia, cond.concussion]
treatment:
  # кислород — этиотропная терапия: «Рекомендовано всем пострадавшим … проведение оксигенотерапии 100% кислородом» (раздел 3.1, УУР
  # С, УДД 5), нормобарическая и гипербарическая оксигенация (раздел 3.2, УУР С, УДД 5; критерий качества 13): период полураспада
  # карбоксигемоглобина — 320 минут на воздухе, 71 — на кислороде. Барокамеры в игре нет — вопрос владельцу 31
  firstLine: [tx.oxygen_mask]
  acceptable: []
  supportive: [tx.iv_fluids]
  notIndicated: []
  harmful: []
  # антидот — каждому взрослому (разделы 3.1 и 3.2, УУР С, УДД 5; критерий качества 14)
  require: [tx.zinc_bisvinylimidazole]
  byParam:
    # дым пожара — ещё и цианиды: натрия тиосульфат (раздел 3.2, УУР С, УДД 5); критериев нет — можно
    - when: { exposure: [fire] }
      acceptable: [tx.sodium_thiosulfate]
    # угнетение сознания — интубация и ИВЛ (раздел 3.2, УУР С, УДД 5; критерий качества 16)
    - when: { severity: [severe] }
      require: [tx.ventilation]
    # «при тяжелых гемодинамических расстройствах проведение противошоковой терапии» (раздел 3.2, УУР С, УДД 5; критерий качества
    # 15): в игре — при низком давлении
    - when: { hypotension: [yes] }
      require: [tx.iv_fluids]
  # всех — в центр острых отравлений; без него тяжёлых с осложнениями — в ОРИТ (раздел 6.1). Центра в игре нет: лёгкое — палата,
  # среднее — ПИТ, тяжёлое — реанимация; лёгкое в ПИТ и среднее в палате — не ошибка: тяжесть при поступлении видна не по числу
  setting:
    default: ward
    param: { name: severity, map: { mild: ward, moderate: icu, severe: ricu } }
    also:
      - { when: { severity: [mild] }, settings: [icu] }
      - { when: { severity: [moderate] }, settings: [ward] }
texts:
  summary:
    ru: >-
      Отравление угарным газом на пожаре или дома — от печи, газовой колонки, мотора в закрытом гараже. Болит голова, кружится,
      тошнит, слабость; при тяжёлом — кома. Слизистые бывают ярко-розовыми, на пожаре — копоть на лице. Подтверждает
      карбоксигемоглобин крови, но тяжесть при поступлении по нему не судят. Лечит кислород; антидот — каждому взрослому, при коме —
      интубация и ИВЛ.
pearls:
  - ru: "Головная боль и тошнота у нескольких человек из одной квартиры зимой — угарный газ, пока не доказано обратное."
  - ru: "Карбоксигемоглобин при поступлении ниже, чем был на месте: тяжесть судят по больному, а не по числу."
  - ru: "С пожара — не только угарный газ: в дыму бывают цианиды, а ожог дыхательных путей проявляется через 1–3 суток."
simplified: "Доз нет. Барокамеры нет — по вопросу 31. Ингаляционной травмы, бронхоскопии, отёка лёгких, рабдомиолиза и отсроченных неврологических нарушений нет; этанола в крови, газов крови и антигипоксантов тоже. Тяжесть — параметр: по числу карбоксигемоглобина её не определить."
sources:
  - { kind: guideline, title: "Токсическое действие окиси углерода. Токсическое действие других газов, дымов и паров", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/885_1", note: "ID 885_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.1: подавляющее большинство пострадавших доставляют из очагов пожаров, при горении азотсодержащих полимеров — цианистый водород; раздел 1.3: 3,2 % всех отравлений, второе место среди причин смерти от отравлений; раздел 1.5: тяжесть по карбоксигемоглобину — менее 30, 30–50 и более 50 %, при поступлении он ниже, чем на месте; раздел 2.1: жалобы при лёгкой и средней степени — головная боль, головокружение, слабость, тошнота, при тяжёлой — угнетение сознания; раздел 2.2: розовое окрашивание слизистых — патогномоничный признак, копоть и изменение голоса — признаки ингаляционной травмы; раздел 2.3: карбоксигемоглобин — основной метод диагностики, при тяжёлых на ЭКГ нарушения ритма и признаки гипоксии миокарда; раздел 3.1 (УУР С, УДД 5): 100 % кислород, антидот у лиц старше 18 лет; раздел 3.2 (УУР С, УДД 5): НБО и ГБО всем при технической возможности, интубация и ИВЛ при угнетении сознания и дыхательной недостаточности, противошоковая терапия, натрия тиосульфат при цианидах; раздел 6.1: без центра острых отравлений тяжёлых — в ОРИТ; критерии качества 2, 10, 13–16; доли, полосы и сроки — игровая оценка" }
review: draft
