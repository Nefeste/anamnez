id: cond.acs
name: { ru: "Острый коронарный синдром" }
icd10: I24.9
department: dept.therapy
system: heart
kind: syndrome
severity: critical
epidemiology:
  prevalence: rare
  age: { min: 35, peak: [55, 85] }
  sex: { m: 1, f: 0.5 }
  risks:
    - { id: risk.smoking, x: 1.5 }
    - { id: risk.family_cad, x: 1.5 }
    - { id: risk.obesity, x: 1.2 }
    - { id: cond.hypertension, x: 1.5 }
    - { id: cond.diabetes2, x: 1.5 }
params:
  # с подъёмом ST — около трети (157_5, раздел 1.3: в 2022 г. 150 845 случаев ОКСпST из 438 315 ОКС)
  type: { stemi: 35, nste: 65 }
  # стенка инфаркта с подъёмом ST — по ней лента и отведения подъёма (часть 39а); доли — игровая
  # оценка: в 157_5 их нет
  wall: { inferior: 45, anterior: 40, lateral: 15 }
  # в окне тромболизиса — меньше 12 часов от начала боли (часть 39а; 157_5, раздел 3.1.3); доли —
  # по часам от начала ниже, для вывода, пока о начале не спросили
  early: { yes: 85, no: 15 }
  # сатурация ниже 90 % — производный параметр по числу (часть 38б); доли — для вывода, пока сатурацию
  # не мерили: игровая оценка по прогону генератора
  spo2_below90: { no: 93, yes: 7 }
  # класс Killip — сердечная недостаточность при поступлении (157_5, раздел 3.4.1, приложение А3: I — нет
  # признаков, II — III тон и влажные хрипы внизу, III — отёк лёгких, хрипы выше углов лопаток, IV —
  # кардиогенный шок). Доли — игровая оценка: II–IV — у 22 % больных ОКС (Gulf RACE, El-Menyar 2012), III
  # и IV — поровну, по 4 %
  killip: { i: 78, ii: 14, iii: 4, iv: 4 }
  # инфаркт или нестабильная стенокардия (spec 2026-10-chapter-3, часть 39в): у ОКС без подъёма ST — по
  # тропонину. 154_4, раздел 1.3: в 2022 г. ОКС без подъёма ST — 287 470, с подъёмом — 150 845, инфаркт —
  # 219 240; если каждый ОКС с подъёмом ST — инфаркт, инфарктов без подъёма не меньше (219 240 − 150 845) /
  # 287 470 = 23,8 %. С подъёмом ST — инфаркт всегда, параметр у него ни на что не влияет
  mi: { yes: 25, no: 75 }
  # нужна ли коронарография в первые сутки — производный параметр по правилу rule.acs_invasive на
  # настоящих признаках (часть 39в); доли — для вывода, пока признаки правила не известны: по прогону
  # генератора
  invasive: { no: 17, yes: 83 }
derived:
  # гипоксемия — SpO2 < 90 % (157_5 и 154_4: коррекция гипоксемии)
  spo2_below90: { f: vital.spo2_low, below: 90 }
  # окно тромболизиса — не больше 12 часов от начала симптомов (157_5, раздел 3.1.3)
  early: { f: hx.onset_hours, below: 12 }
  # коронарография в первые сутки — по категориям риска (154_4, приложение А3; часть 39в)
  invasive: rule.acs_invasive
# исход перевода в сосудистый центр по часам до реперфузии (spec 2026-10-chapter-3, часть 39б): при подъёме
# ST артерию открывают тромболизисом здесь или вмешательством в центре. Смертность в стационаре — в
# границах класса Killip из 157_5 (приложение А3), %; к верхней — по доле потери: польза реперфузии
# падает с часами — 65 жизней на 1000 в первый час, 37 во второй, 26–29 до шестого (Boersma 1996), около
# 20 до двенадцатого и нет позже (FTT 1994): доля потери — 0, 43, 60 и 69 % до 1, 2, 6 и 12 ч, позже —
# 100 %. Тромболизис открывает артерию у 63 % (кровоток TIMI 3 к 90-й минуте, тенектеплаза, TIMI 10B) —
# за час: ST снижается за 60–90 минут (157_5, раздел 3.1.3). Игровая оценка по этим числам.
reperfusion:
  when: { type: [stemi] }
  by: killip
  death: { i: [2, 3], ii: [5, 12], iii: [10, 20], iv: [50, 81] }
  loss: [[1, 0], [2, 43], [6, 60], [12, 69]]
  lysis: { tx: tx.thrombolysis, pct: 63, hours: 1 }
# фибрилляция желудочков до реперфузии (часть 39б) — событие минут: 1 % в час в первые 12 часов от начала.
# Игровая оценка по APEX-AMI (Mehta 2009): желудочковая тахикардия или фибрилляция — у 5,7 % больных с
# подъёмом ST, две трети — до конца коронарографии. Под монитором её снимают разрядом (157_5, раздел
# 3.4.2.1: немедленная дефибрилляция), без монитора — смерть
arrest:
  when: { type: [stemi] }
  perHour: 1
  hours: 12
course:
  stages:
    - { id: acute, days: [0, 1] }
  presentation: [0, 0]
  untreated: { band: usually, days: [0, 1] }
  # в своей палате интенсивной терапии (часть 39в) — при невысоком риске: мониторирование ЭКГ до 24 часов
  # (154_4, раздел 6.3) и нагрузочная проба в первые 72 часа (раздел 2.4) — 1–3 суток, игровая оценка
  stay: [1, 3]
  # часов от начала боли до прихода (часть 39а), целыми часами — игровая оценка: в 157_5 долей нет, а
  # медиана от начала симптомов до первичного ЧКВ — 315 минут (раздел 1.3, регистр РЕГИОН-ИМ);
  # значит, приходят чаще всего в первые часы, а через 12 часов и позже — каждый седьмой
  onset:
    f: hx.onset_hours
    hours: [[2, 30], [6, 35], [12, 20], [24, 10], [48, 5]]
findings:
  - { f: sym.chest_pain_pressing, band: usually }
  - { f: sym.pain_radiation, band: often }
  - { f: sym.sweating, band: often }
  - { f: sym.dyspnea, band: sometimes }
  - { f: sym.nausea, band: sometimes }
  - { f: sym.epigastric_pain, band: rarely }
  - { f: sym.fatigue, band: rarely }
  - { f: vital.tachycardia, band: sometimes }
  - { f: vital.bp_high, band: sometimes }
  - { f: vital.spo2_low, band: rarely }
  - { f: sign.crackles_local, band: rarely, attrs: { side: { both: 80, right: 10, left: 10 } } }
  - f: ecg.st_elevation
    band: { pct: 100 }
    when: { type: [stemi] }
    attrs: { wall: $wall }
    note: "инфаркт с подъёмом ST — по определению подъём ST (157_5, раздел 1.1): у каждого такого больного, а на ленте его может пропустить ЭКГ"
  - f: hx.onset_hours
    band: { pct: 100 }
    note: "когда стало плохо, больной говорит при расспросе: время — у каждого, и без боли в груди"
  - { f: ecg.st_depression, band: often, when: { type: [nste] } }
  # тропонин по алгоритму 0/1 час (часть 39в; 154_4, раздел 2.3, приложение А3): у инфаркта — и с подъёмом
  # ST, и без — прирост за час у каждого (в игре нет «серой зоны» алгоритма: иначе он «исключил» бы
  # инфаркт); 52 нг/л и выше по первому анализу — «часто», игровая оценка: тропонин поднимается через 1–6
  # часов, а приходят чаще в первые часы (часть 39а). У нестабильной стенокардии некроза нет — тропонин не
  # растёт
  - f: lab.troponin_rise
    band: { pct: 100 }
    when: { type: [nste], mi: [yes] }
    note: "инфаркт без подъёма ST подтверждают тропонином (154_4, раздел 2.3): за час он растёт у каждого, «серой зоны» алгоритма 0/1 час (приложение А3) в игре нет"
  - f: lab.troponin_rise
    band: { pct: 100 }
    when: { type: [stemi] }
    note: "инфаркт — некроз миокарда: за час тропонин растёт у каждого, «серой зоны» алгоритма в игре нет"
  - { f: lab.troponin_high, band: often, when: { type: [nste], mi: [yes] } }
  - { f: lab.troponin_high, band: often, when: { type: [stemi] } }
  # класс Killip (часть 39б; 157_5, приложение А3): II и III — влажные хрипы внизу с обеих сторон; III —
  # отёк лёгких: одышка, частое дыхание, сатурация ниже 90 %; IV — шок: верхнее давление ниже 90 у каждого
  # (это его определение), частый пульс, бледность. Прочие доли — игровая оценка: в рекомендации
  # определения классов, а не частоты признаков
  - { f: sign.crackles_local, band: usually, when: { killip: [ii, iii] }, attrs: { side: { both: 100 } } }
  - { f: sym.dyspnea, band: always, when: { killip: [iii, iv] } }
  - { f: vital.tachypnea, band: usually, when: { killip: [iii, iv] } }
  - { f: vital.spo2_low, band: usually, when: { killip: [iii, iv] } }
  - f: vital.bp_low
    band: { pct: 100 }
    when: { killip: [iv] }
    note: "кардиогенный шок — это Killip IV, и его основной признак — стойкая гипотензия, систолическое ≤ 90 мм рт. ст. (157_5, раздел 3.4.1.2): у каждого такого больного"
  - { f: vital.tachycardia, band: usually, when: { killip: [iv] } }
  - { f: sign.pallor, band: often, when: { killip: [iv] } }
confirm: [exam.ecg]
redFlags: [sym.chest_pain_pressing, ecg.st_elevation, ecg.st_depression]
treatment:
  firstLine: [tx.aspirin_acs, tx.nitroglycerin]
  # антитромботическое лечение (часть 39а; 157_5, разделы 3.2.3.1–3.2.3.2): парентеральный антикоагулянт —
  # всем с ИМпST при любой стратегии (ЕОК IA), ингибитор P2Y12 до вмешательства — не ошибка ни так, ни
  # так; при тромболизисе — его обязательные спутники
  supportive: [tx.clopidogrel, tx.enoxaparin_acs, tx.fondaparinux, tx.heparin_iv]
  harmful: [tx.ibuprofen]
  notIndicated: [tx.ppi, tx.antacid, tx.amoxicillin, tx.amoxicillin_clavulanate, tx.macrolide]
  byParam:
    # кислород (часть 38б): при SpO2 < 90 % — обязательно (157_5 и 154_4: ЕОК IC), при 90 % и выше —
    # не нужен (ЕОК IIIB: «не рекомендуется», пользы нет)
    - when: { spo2_below90: [yes] }
      require: [tx.oxygen_mask]
    - when: { spo2_below90: [no] }
      notIndicated: [tx.oxygen_mask]
    # тромболизис (часть 39а; 157_5, раздел 3.1.3, ЕОК IA): сосудистый центр в двух часах — до
    # вмешательства дальше 120 минут, и в первые 12 часов тромб растворяют здесь, а потом везут
    - when: { type: [stemi], early: [yes] }
      beforeTransfer: [tx.thrombolysis]
    # позже 12 часов — перевод без тромболизиса: пользы уже нет, а риск кровотечения остаётся
    # (12–24 часа — только у отдельных больных; в игре — нет)
    - when: { type: [stemi], early: [no] }
      notIndicated: [tx.thrombolysis]
    # без подъёма ST тромболизис не рекомендуется (154_4)
    - when: { type: [nste] }
      harmful: [tx.thrombolysis]
    # без подъёма ST и с коронарографией в первые 24 часа — ингибитор P2Y12 до неё не добавляют (часть 39в;
    # 154_4, раздел 3.2.3.1, ЕОК IIIA): перевод без клопидогрела
    - when: { type: [nste], invasive: [yes] }
      notIndicated: [tx.clopidogrel]
    # без подъёма ST и невысокого риска — лечат здесь (часть 39в; 154_4, раздел 3.1.1: избирательная
    # инвазивная стратегия): к ацетилсалициловой кислоте — клопидогрел (раздел 3.2.3.1, ЕОК IIaB) и
    # антикоагулянт — фондапаринукс натрия первым (раздел 3.2.3.2, ЕОК IB), эноксапарин натрия, если его
    # нет, гепарин натрия, если нельзя обоих; критерий качества 7 — АСК, ингибитор P2Y12 и антикоагулянт в
    # начале лечения. Переведённому их дают в центре
    - when: { type: [nste], invasive: [no] }
      require: [tx.clopidogrel, [tx.fondaparinux, tx.enoxaparin_acs, tx.heparin_iv]]
  # место (часть 39в): невысокий риск — своя палата интенсивной терапии (154_4, раздел 6.1: первичные
  # сосудистые отделения с ПИТ принимают ОКС без подъёма ST); коронарография в первые сутки — перевод в
  # сосудистый центр (раздел 3.1.1: стационары без ЧКВ переводят), и при подъёме ST — тоже. Без своей ПИТ
  # и из амбулатории — «Вызвать скорую», как прежде
  setting:
    default: icu
    param: { name: invasive, map: { yes: transfer, no: icu } }
texts:
  summary:
    ru: >-
      Внезапное нарушение кровотока в артерии сердца — нестабильная стенокардия или
      инфаркт. Давящая боль за грудиной дольше 20 минут, отдаёт в левую руку или челюсть,
      холодный пот, одышка. Из поликлиники — скорая: разжевать ацетилсалициловую кислоту, нитроглицерин под
      язык и ЭКГ, не дожидаясь анализов. В больнице — ЭКГ в первые 10 минут и тропонин сейчас и через
      час: инфаркт это или нестабильная стенокардия и нужна ли коронарография в первые сутки.
pearls:
  - ru: "Давящая боль за грудиной дольше 20 минут — скорая сразу, а не «сдайте анализы и приходите»."
  - ru: "Нормальная ЭКГ инфаркт не исключает: у половины больных без подъёма ST она почти не изменена."
  - ru: "Ибупрофен и другие НПВС при подозрении на инфаркт вредны; обезболивает нитроглицерин."
  - ru: "Первый тропонин в норме инфаркт не исключает: он поднимается через 1–6 часов — нужен второй анализ через час."
simplified: "Тропонин и коронарография — в стационаре; в поликлинике задача — заподозрить, дать ацетилсалициловую кислоту и вызвать скорую."
sources:
  - { kind: guideline, title: "2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J 2023;44(38):3720–3826", note: "частоты — черновик" }
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 04.10.2026; раздел 1.3 — ОКС без подъёма ST, с подъёмом и инфаркты в 2022 г.; раздел 2.3 — тропонин по алгоритму 0/1 час; раздел 3.1.1 и приложение А3 — категории риска и сроки коронарографии; раздел 3.2.3 — АСК, ингибитор P2Y12 и антикоагулянт; разделы 6.1 и 6.3 — первичные сосудистые отделения с ПИТ, мониторирование до 24 часов" }
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 1.3 — доля ИМпST и медиана от начала симптомов до ЧКВ (РЕГИОН-ИМ); раздел 1.5 — локализация по отведениям; раздел 3.1.3 — тромболизис в первые 12 часов, если до ЧКВ дальше 120 минут; разделы 3.2.3.1–3.2.3.2 — АСК, клопидогрел и антикоагулянт" }
  - { kind: paper, title: "Swap CJ, Nagurney JT. Value and limitations of chest pain history in the evaluation of patients with suspected acute coronary syndromes. JAMA 2005;294(20):2623–2629" }
  - { kind: paper, title: "Boersma E, Maas AC, Deckers JW, Simoons ML. Early thrombolytic treatment in acute myocardial infarction: reappraisal of the golden hour. Lancet 1996;348(9030):771–775", note: "PMID 8813982; жизней на 1000 леченых — 65, 37, 26 и 29 в 0–1, 1–2, 2–3 и 3–6 ч от начала: доля потери пользы по часам (часть 39б)" }
  - { kind: paper, title: "Fibrinolytic Therapy Trialists' (FTT) Collaborative Group. Indications for fibrinolytic therapy in suspected acute myocardial infarction. Lancet 1994;343(8893):311–322", note: "PMID 7905143; около 30 жизней на 1000 в первые 6 ч, около 20 в 7–12 ч, позже 12 ч пользы нет (часть 39б)" }
  - { kind: paper, title: "Cannon CP, Gibson CM, McCabe CH и др. TNK-tissue plasminogen activator compared with front-loaded alteplase in acute myocardial infarction: results of the TIMI 10B trial. Circulation 1998;98(25):2805–2814", note: "PMID 9860780; кровоток TIMI 3 к 90-й минуте после тенектеплазы — 62,8 %: доля удачного тромболизиса (часть 39б)" }
  - { kind: paper, title: "Mehta RH, Starr AZ, Lopes RD и др. Incidence of and outcomes associated with ventricular tachycardia or fibrillation in patients undergoing primary percutaneous coronary intervention. JAMA 2009;301(17):1779–1789", note: "PMID 19417195; APEX-AMI, 5745 больных с подъёмом ST: желудочковая тахикардия или фибрилляция — у 5,7 %, 64 % из них — до конца коронарографии, 90 % — в первые 48 ч (часть 39б)" }
  - { kind: paper, title: "El-Menyar A, Zubaid M, AlMahmeed W и др. Killip classification in patients with acute coronary syndrome: insight from a multicenter registry. Am J Emerg Med 2012;30(1):97–103", note: "PMID 21159479; регистр Gulf RACE, 6704 больных ОКС: Killip II–IV — у 22 % (часть 39б)" }
review: draft
