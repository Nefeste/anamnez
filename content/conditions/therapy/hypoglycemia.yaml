id: cond.hypoglycemia
name: { ru: "Гипогликемия" }
# лекарственная гипогликемия без комы — E16.0; кома при диабете кодируется по диабету (E11.0), её в игре нет. Одна
# запись — E16.0
icd10: E16.0
department: dept.therapy
system: metabolic
kind: disease
# лёгкая — съесть сахар, тяжёлая — угроза жизни; ОМС по тяжести — между ними, игровая оценка
severity: serious
epidemiology:
  # частоты гипогликемий в 290_2 и 286_3 нет. Полоса подобрана прогоном генератора — игровая оценка
  prevalence: common
  # у пожилых сахароснижающее лечение часто избыточно (290_2, раздел 7.9); с 35 — как диабет в игре, пик — игровая
  # оценка
  age: { min: 35, peak: [60, 85] }
  sex: { m: 1, f: 1 }
  # только у тех, у кого диабет 2 типа уже есть, — как криз у гипертоника: гипогликемию дают инсулин и
  # сульфонилмочевина (290_2, раздел 3.7). Алкоголь — провоцирующий фактор (там же), множитель игровой
  requires: [cond.diabetes2]
  risks:
    - { id: risk.alcohol, x: 1.5 }
params:
  # чем лечат диабет (spec 2026-10-chapter-3, часть 44а): инсулины — «высокий риск гипогликемии», сульфонилмочевина
  # — «риск» (290_2, раздел 3.4.1, табл. 11). Доли — игровая оценка
  drug: { insulin: 55, sulfonylurea: 45 }
  # лёгкая — справился сам; тяжёлая (уровень 3) — нарушение сознания, нужна помощь другого лица (290_2, раздел 3.7).
  # Доли — игровая оценка; скорая везёт тяжёлую чаще (economy.yaml, `ambulance.severe`)
  severity: { mild: 60, severe: 40 }
  # нарушение речи при тяжёлой — дизартрия (290_2, раздел 3.7): «маска» инсульта (814_1, раздел 2.3). Доля — игровая
  # оценка
  speech: { no: 80, yes: 20 }
  # производный — доля для вывода, пока о лекарствах не спросили: сульфонилмочевину пьют 45 из 100 по параметру и
  # четверть остальных — по диабету (cond.diabetes2), около 59 из 100; игровая оценка
  su: { no: 41, yes: 59 }
derived:
  # пьёт ли таблетки сульфонилмочевины — от какой бы причины ни упал сахар (часть 44а): от них капельница
  su: { has: hx.sulfonylurea }
course:
  stages:
    - { id: acute, days: [0, 1] }
  # приходят в первые часы — игровая оценка
  presentation: [0, 0]
  # без лечения: лёгкая часто переходит в тяжёлую — углеводы «для профилактики развития тяжелой гипогликемии»
  # (290_2, раздел 3.7), тяжёлая — хуже сразу. Доли — игровая оценка
  untreated:
    - { band: often, days: [0, 0], when: { severity: [mild] } }
    - { band: always, days: [0, 0], when: { severity: [severe] } }
  # длительности госпитализации нет — игровая оценка
  stay: [1, 3]
findings:
  - f: lab.glucose_low
    band: { pct: 100 }
    note: "уровень 2 — глюкоза плазмы ниже 3,0 ммоль/л, клинически значимая гипогликемия (290_2, раздел 3.7); уровень 1 (3,0–3,9) в игре не отдельно"
  - f: hx.diabetes
    band: { pct: 100 }
    note: "гипогликемию дают инсулин и сульфонилмочевина (290_2, раздел 3.7): диабет у такого больного уже известен"
  - f: hx.insulin
    band: { pct: 100 }
    when: { drug: [insulin] }
    note: "по определению параметра: колет инсулин"
  - f: hx.sulfonylurea
    band: { pct: 100 }
    when: { drug: [sulfonylurea] }
    note: "по определению параметра: пьёт таблетки сульфонилмочевины"
  # пропуск еды или мало углеводов — провоцирующий фактор (290_2, раздел 3.7); доля — игровая оценка
  - { f: hx.missed_meal, band: often }
  # вегетативные: сердцебиение, дрожь, потливость, сильный голод (290_2, раздел 3.7); нейрогликопенические —
  # головокружение. Доли — игровая оценка
  - { f: sym.sweating, band: usually }
  - { f: sym.tremor, band: usually, when: { severity: [mild] } }
  - { f: sym.hunger, band: often, when: { severity: [mild] } }
  - { f: sym.palpitations, band: often, when: { severity: [mild] }, attrs: { rhythm: { regular: 100 } } }
  - { f: vital.tachycardia, band: sometimes }
  - { f: sym.dizziness, band: sometimes, when: { severity: [mild] } }
  # тяжёлая (уровень 3): дезориентация, спутанность — по определению (290_2, раздел 3.7)
  - f: sym.confusion
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "тяжёлая гипогликемия — с таким нарушением когнитивных функций, что нужна помощь другого лица (290_2, раздел 3.7)"
  - f: sign.gcs_low
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "спутанная речь — 4 балла из 5 по шкале комы Глазго: всего 14 и меньше (734_2, приложение Г1); кома в игре не моделируется"
  - f: sym.speech_trouble
    band: { pct: 100 }
    when: { severity: [severe], speech: [yes] }
    note: "дизартрия — нейрогликопенический симптом (290_2, раздел 3.7): по определению параметра"
  - f: sign.speech_deficit
    band: { pct: 100 }
    when: { severity: [severe], speech: [yes] }
    note: "нарушение речи слышно на осмотре у каждого, у кого оно есть: признак — это оно само"
  - f: sign.nihss
    band: { pct: 100 }
    when: { severity: [severe], speech: [yes] }
    note: "дизартрия даёт баллы по шкале инсульта NIH (814_1, приложение Г1): «маска» инсульта"
confirm: [exam.glucometer]
redFlags: [sym.confusion, sign.gcs_low, sym.speech_trouble]
# с чем спутать: гипогликемия — «маска» инсульта (814_1, раздел 2.3): глюкоза — единственный анализ, нужный перед
# тромболизисом; речь и сознание возвращаются, когда поднимают сахар
differential: [cond.stroke_ischemic, cond.tia]
treatment:
  # лёгкая (290_2, раздел 3.7; 286_3, раздел 3.6): быстро усваиваемые углеводы внутрь; через 15 минут не прошла —
  # повторить. Декстроза в вену в сознании — тоже поднимает сахар; глюкагон и капельница — только при тяжёлой: при
  # лёгкой не названы, «не показано». Тромболизис — при «маске» инсульта: кровотечение без пользы, игровое правило
  firstLine: [tx.fast_carbs]
  acceptable: [tx.dextrose_iv]
  supportive: []
  notIndicated: []
  harmful: [tx.thrombolysis_stroke, tx.thrombolysis]
  byParam:
    # тяжёлая (290_2, раздел 3.7): декстроза в вену струйно до восстановления сознания; без вены — глюкагон в мышцу;
    # без сознания нельзя вливать в рот сладкие растворы — асфиксия; не пришёл в себя — капельница. До приезда
    # скорой — декстроза или глюкагон
    - when: { severity: [severe] }
      firstLine: [tx.dextrose_iv]
      acceptable: [tx.glucagon]
      supportive: [tx.dextrose_infusion]
      harmful: [tx.fast_carbs]
      plan: [tx.dextrose_iv]
      preHospital: [tx.dextrose_iv, tx.glucagon]
    # от таблеток с большой продолжительностью действия — капельно до нормализации гликемии и полного выведения
    # препарата (290_2, раздел 3.7): сульфонилмочевина действует 8–24 часа (приложение А3). Пьёт их и вместе с
    # инсулином — тоже капельница
    - when: { severity: [severe], su: [yes] }
      require: [tx.dextrose_infusion]
  # где лечить (290_2, раздел 6): гипогликемическое состояние с дезориентацией, нарушением речи, сознания —
  # экстренная госпитализация; лёгкая — дома, после еды: критериев в рекомендации нет, игровая оценка
  setting:
    default: home
    param: { name: severity, map: { mild: home, severe: ambulance } }
texts:
  summary:
    ru: >-
      Сахар крови упал ниже 3,0 ммоль/л — у больного диабетом на инсулине или таблетках сульфонилмочевины, чаще
      когда лекарство было, а еды не было. Лёгкая — дрожь, пот, сердцебиение, сильный голод: человек в сознании,
      ему дают сахар или сладкий сок. Тяжёлая — спутанность, невнятная речь, оглушение: сладкое в рот нельзя,
      декстроза в вену, без вены — глюкагон в мышцу, и в стационар. От таблеток сульфонилмочевины сахар падает снова
      — капельница с декстрозой до их выведения.
pearls:
  - ru: "Спутанность, невнятная речь или слабость у больного диабетом — сначала глюкометр: гипогликемия бывает «маской» инсульта и проходит за минуты после декстрозы."
  - ru: "Без сознания — ничего сладкого в рот: захлебнётся. Декстроза в вену, без вены — глюкагон в мышцу."
  - ru: "Таблетки сульфонилмочевины действуют до суток: после тяжёлой гипогликемии от них сахар падает снова — капельница с декстрозой до их выведения."
simplified: "Гипогликемия в игре — только у больных диабетом 2 типа на инсулине или сульфонилмочевине; диабет 1 типа, глиниды, алкоголь без диабета, голодание и опухоли не моделируются. Уровень 1 (3,0–3,9 ммоль/л) отдельно не выделен, кома и судороги — нет: тяжёлая в игре — спутанность и оглушение. Повторный глюкометр через 15 минут, медленные углеводы после пролонгированного инсулина и пересмотр лечения диабета не проверяются."
sources:
  - { kind: guideline, title: "Сахарный диабет 2 типа у взрослых", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/290_2", note: "ID 290_2, опубликованы 12.07.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: уровни гипогликемии — 1 (3,0–3,9), 2 (ниже 3,0), 3 — тяжёлая, нужна помощь другого лица; вегетативные и нейрогликопенические симптомы; провоцирующие факторы; лёгкая — быстро усваиваемые углеводы; тяжёлая — декстроза в вену струйно, без сознания ничего в рот, не пришёл в себя — капельно и госпитализировать, от ПССП с большой продолжительностью действия — капельно до полного выведения; глюкагон — при невозможности в/в; раздел 3.4.1, табл. 11: инсулины — высокий риск, сульфонилмочевина — риск гипогликемии; раздел 6: экстренная госпитализация при гипогликемической коме и гипогликемии с дезориентацией, нарушением речи, сознания; доли форм, признаков и сроки — игровая оценка" }
  - { kind: guideline, title: "Сахарный диабет 1 типа у взрослых", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/286_3", note: "ID 286_3, опубликованы 02.03.2026, применяются; сверено с рубрикатором 05.10.2026; раздел 3.6: те же уровни и лечение; если через 15 минут гипогликемия не купируется — повторить; при гипогликемии от алкоголя эффект глюкагона может быть снижен" }
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 2.3: гипо- или гипергликемия — имитатор («маска») инсульта; уровень гликемии — единственный лабораторный показатель, необходимый перед тромболизисом" }
review: draft
