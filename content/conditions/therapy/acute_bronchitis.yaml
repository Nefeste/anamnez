id: cond.acute_bronchitis
name: { ru: "Острый бронхит" }
icd10: J20.9
department: dept.therapy
group: grp.viral_respiratory
kind: disease
severity: minor
epidemiology:
  prevalence: common
  age: { min: 18 }
  season: { winter: 1.4, spring: 1.0, summer: 0.6, autumn: 1.2 }
  risks:
    - { id: risk.smoking, x: 1.3 }
course:
  stages:
    - { id: onset, days: [0, 3] }
    - { id: peak, days: [3, 7] }
    - { id: protracted, days: [7, 21] }
  presentation: [3, 14]
  selfLimiting: true
findings:
  - { f: sym.cough, band: always, attrs: { character: { productive: 60, dry: 40 } } }
  - { f: sym.cough_long, band: always, stages: [protracted] }
  - { f: sym.purulent_sputum, band: sometimes }
  - { f: sign.wheezes, band: sometimes }
  - { f: sym.fever_hx, band: sometimes }
  - { f: vital.fever, band: rarely }
  - { f: sym.rhinorrhea, band: sometimes }
  - { f: sym.sore_throat, band: sometimes }
  - { f: sign.crackles_local, band: rarely, attrs: { side: { right: 45, left: 45, both: 10 } } }
  - { f: sym.pleuritic_pain, band: rarely, attrs: { side: { right: 40, left: 40, both: 20 } } }
  - { f: lab.wbc_high, band: rarely }
  - { f: lab.crp_high, band: rarely }
  - { f: vital.tachypnea, band: very_rarely }
  - { f: img.cxr_infiltrate, band: never }
confirm: clinical
texts:
  summary:
    ru: >-
      Воспаление бронхов, чаще вирусное: кашель до трёх недель, иногда с мокротой и
      свистящими хрипами, без признаков пневмонии. Проходит сам.
pearls:
  - ru: "Кашель до трёх недель без изменений на рентгене — чаще всего вирусный бронхит; антибиотик не нужен."
  - ru: "Гнойная мокрота сама по себе не означает бактериальную инфекцию."
sources:
  - { kind: guideline, title: "Острый бронхит", org: "Минздрав РФ", note: "точное название и редакцию сверить на cr.minzdrav.gov.ru; частоты — черновик прототипа" }
review: draft
