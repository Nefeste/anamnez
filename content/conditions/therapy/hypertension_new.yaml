id: cond.hypertension_new
name: { ru: "Артериальная гипертензия, впервые выявленная" }
icd10: I10
department: dept.therapy
system: heart
kind: disease
checkup: true
severity: moderate
epidemiology:
  prevalence: common
  age: { min: 30, peak: [45, 75] }
  excludes: [cond.hypertension]
  risks:
    - { id: risk.obesity, x: 2 }
    - { id: risk.alcohol, x: 1.5 }
    - { id: risk.nsaid_use, x: 1.3 }
course:
  stages:
    - { id: active, days: [0, 36500] }
  presentation: [0, 365]
  untreated: { band: never, days: [7, 7] }   # за неделю без лечения ничего не случится — «без изменений»
findings:
  - { f: vital.bp_high, band: always }
  - { f: sym.high_bp_readings, band: often }
  - { f: sym.headache, band: sometimes }
  - { f: sym.dizziness, band: sometimes }
  - { f: sym.fatigue, band: rarely }
  - { f: ecg.lvh, band: sometimes }
  - { f: lab.creatinine_high, band: rarely }
confirm: [exam.vitals]
treatment:
  firstLine: [tx.lifestyle, tx.ace_inhibitor, tx.arb, tx.ccb, tx.thiazide]
  notIndicated: [tx.ibuprofen, tx.steroid_systemic_short]
  plan: [tx.lifestyle, tx.ace_inhibitor, tx.ccb]
  setting: { default: home }
texts:
  summary:
    ru: >-
      Давление 140/90 и выше при повторных измерениях у человека, который об этом не знал.
      Часто ничем себя не выдаёт; находят при профосмотре или когда человек сам намерил.
      Лечат изменением образа жизни и обычно сразу двумя препаратами в малых дозах.
pearls:
  - ru: "Гипертония чаще всего ничем не болит — давление надо мерить всем взрослым, даже без жалоб."
  - ru: "Большинству начинают сразу с двух препаратов (ингибитор АПФ или сартан плюс амлодипин или индапамид), но ингибитор АПФ вместе с сартаном не назначают."
simplified: "Диагноз в жизни ставят по повторным измерениям и суточному мониторированию; в игре достаточно измерения на приёме. Сочетания лекарств пока не проверяются."
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", note: "точное название и редакцию сверить на cr.minzdrav.gov.ru; частоты — черновик" }
  - { kind: guideline, title: "2023 ESH Guidelines for the management of arterial hypertension. J Hypertens 2023;41(12):1874–2071" }
review: draft
