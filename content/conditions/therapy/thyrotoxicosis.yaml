id: cond.thyrotoxicosis
name: { ru: "Тиреотоксикоз" }
# «Тиреотоксикоз – синдром, обусловленный избыточным содержанием тиреоидных гормонов в крови и их токсическим действием на
# различные органы и ткани» (spec 2026-10-chapter-4, часть 56б; 270_2, «Термины и определения»): болезнь Грейвса (E05.0) или
# токсический узловой и многоузловой зоб (E05.1, E05.2). Запись одна, причина — параметр: тактика в смене у них одна
icd10: E05.0
department: dept.therapy
system: metabolic
kind: disease
severity: moderate
epidemiology:
  # распространённость явного тиреотоксикоза — 0,5–0,6 % (раздел 1.3); полоса — как у гипотиреоза, подобрана прогоном генератора:
  # игровая оценка
  prevalence: rare
  # «Пик заболеваемости БГ приходится на пациентов в возрасте 30-60 лет», узловая автономия — «в основном у лиц старшей
  # возрастной группы (после 45 лет)» (разделы 1.2 и 1.3)
  age: { min: 18, peak: [30, 60] }
  # «Примерно у 3% женщин и 0,5% мужчин БГ развивается в течение жизни» (раздел 1.3) — шесть к одному; у узлового зоба
  # соотношения нет — общее пять к одному, как у гипотиреоза: игровая оценка
  sex: { m: 0.2, f: 1 }
params:
  # болезнь Грейвса — самая частая причина там, где йода хватает, функциональная автономия узлов — в йододефицитных районах
  # (раздел 1.2): доли нет, игровая оценка
  cause: { graves: 65, nodular: 35 }
  # производный — доля для вывода, пока пульс не измерили: тахикардия «у большинства больных» (раздел 1.6), игровая оценка
  tachy: { yes: 75, no: 25 }
derived:
  # бета-адреноблокатор — «пациентам с тиреотоксикозом и тахикардией» (раздел 3.1.1, УУР А, УДД 2): пульс чаще 100; разбор судит
  # по измеренному пульсу, не измеряли — по правде
  tachy: { f: vital.tachycardia, above: 100, seen: true }
course:
  stages:
    - { id: active, days: [0, 36500] }
  # симптомы нарастают быстро и приводят к врачу через 6–12 месяцев от начала (раздел 1.6)
  presentation: [180, 365]
  # без лечения растёт риск аритмий, недостаточности кровообращения и тромбоэмболий (раздел 7): доля и срок — игровая оценка
  untreated: { band: rarely, days: [14, 60] }
findings:
  # жалобы и осмотр (разделы 1.6 и 2.1): тахикардия «у большинства больных», похудание — «характерно», остальное без частот —
  # полосы игровые
  - { f: vital.tachycardia, band: usually }
  - { f: sym.palpitations, band: usually, attrs: { rhythm: { regular: 100 } } }
  - { f: sym.weight_loss, band: usually }
  - { f: sym.appetite_high, band: often }
  - { f: sym.heat_intolerance, band: often }
  - { f: sym.tremor, band: often }
  - { f: sym.anxiety, band: often }
  - { f: sym.insomnia, band: often }
  - { f: sym.fatigue, band: often }
  # «Нередко больные отмечают … частый стул» (раздел 1.6)
  - { f: sym.diarrhea, band: sometimes }
  # «ЩЖ в 80% случаев при БГ диффузно увеличена», при узловом зобе пальпируются узлы (раздел 1.6)
  - { f: sign.goiter, band: usually }
  # «Примерно у 40-50% пациентов с БГ развивается ЭОП» (раздел 1.6); при узловом зобе офтальмопатии нет
  - { f: sign.exophthalmos, band: often, when: { cause: [graves] } }
  # явный тиреотоксикоз по определению: ТТГ ниже 0,1, свободный Т4 повышен (раздел 2.3.1)
  - { f: lab.tsh_low, band: always }
  - { f: lab.ft4_high, band: always }
confirm: [exam.tsh]
# фибрилляция предсердий бывает и сама по себе: «ИБС, гипертоническая болезнь, пороки сердца могут сами по себе вызывать нарушение
# ритма» (раздел 1.6); криз — то же, но угроза жизни
differential: [cond.af, cond.thyroid_storm]
treatment:
  # тиамазол — первая линия (разделы 3.1 и 3.1.1, УУР С, УДД 3), пропилтиоурацил — вместо него в 1 триместре беременности (раздел 3.2.2,
  # УУР С, УДД 4); бета-адреноблокатор снимает сердцебиение и дрожь до действия тиамазола (раздел 3.1.1) — облегчает; левотироксин
  # при избытке гормонов не нужен — игровая оценка
  firstLine: [tx.thiamazole]
  acceptable: [tx.propylthiouracil]
  supportive: [tx.beta_blocker]
  notIndicated: [tx.levothyroxine]
  harmful: []
  byParam:
    # «Рекомендуется назначение бета-адреноблокаторов пациентам с тиреотоксикозом и тахикардией на период до достижения
    # эутиреоза» (раздел 3.1.1, УУР А, УДД 2)
    - when: { tachy: [yes] }
      require: [tx.beta_blocker]
  # госпитализация — при осложнённом тиреотоксикозе и кризе (раздел 6); неосложнённый — дома, к эндокринологу (раздел 5)
  setting: { default: home }
texts:
  summary:
    ru: >-
      Щитовидная железа выделяет слишком много гормонов — чаще при болезни Грейвса, у пожилых — при узловом зобе. Сердце
      колотится, человек худеет, хотя ест больше, потеет, дрожит, плохо спит; железа увеличена, при болезни Грейвса глаза блестят и
      выпучены. ТТГ ниже 0,1, свободный Т4 высокий. Тиамазол — первая линия, при частом пульсе — бета-адреноблокатор; дальше ведёт
      эндокринолог.
pearls:
  - ru: "Худеет, хотя ест больше, сердце колотится, потеет и дрожит — проверьте ТТГ."
  - ru: "ТТГ ниже 0,1 — смотрят свободный Т4 и делают ЭКГ, а перед тиамазолом — анализ крови и печёночные пробы."
  - ru: "Тиамазол действует через 3–4 недели; сердцебиение до того снимает бета-адреноблокатор."
simplified: "Запись одна на болезнь Грейвса и узловой зоб. Субклинического тиреотоксикоза, свободного Т3, антител к рецептору ТТГ, УЗИ и сцинтиграфии нет — их делают после смены. Осложнённого тиреотоксикоза с фибрилляцией предсердий и сердечной недостаточностью нет. Доз, радиойодтерапии и операции нет."
sources:
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; «Термины и определения»; раздел 1.2: причины, узловая автономия — после 45 лет; раздел 1.3: распространённость явного тиреотоксикоза 0,5–0,6 %, пик болезни Грейвса — 30–60 лет, у 3 % женщин и 0,5 % мужчин; раздел 1.6: тахикардия у большинства, диффузный зоб у 80 %, офтальмопатия у 40–50 % при болезни Грейвса, похудание при повышенном аппетите; раздел 2.1: жалобы; раздел 2.3.1: ТТГ ниже 0,1, свободный Т4 при низком ТТГ; раздел 3.1: начинать с антитиреоидных препаратов (УУР С, УДД 3); раздел 3.1.1: тиамазол — препарат выбора, бета-адреноблокатор при тахикардии (УУР А, УДД 2); раздел 7: без лечения — аритмии, недостаточность кровообращения, тромбоэмболии; раздел 3.2.2: пропилтиоурацил в 1 триместре (УУР С, УДД 4); раздел 6: показания к госпитализации; доли, полосы и сроки — игровая оценка" }
review: draft
