id: cond.svt
name: { ru: "Пароксизмальная наджелудочковая тахикардия" }
icd10: I47.1
department: dept.therapy
system: heart
kind: disease
severity: moderate
# приступ частого ровного сердцебиения (spec 2026-10-chapter-3, часть 42б): приходят сами и привозит скорая.
# Чаще молодые: АВ-узловая ри-ентри — около половины всех НЖТ, дебют в среднем в 32 года, чаще у женщин;
# АВ ри-ентри с дополнительным путём — в 23 года (619_3, разделы 1.6.5 и 1.6.7). Доли — игровая оценка
epidemiology:
  prevalence: very_rare
  age: { min: 15, peak: [25, 60] }
  sex: { m: 0.67, f: 1 }
params:
  # нестабильный — выраженная гипотония, острая левожелудочковая недостаточность, ангинозный синдром,
  # нарушение мозгового кровообращения (619_3, раздел 6): в игре — давление ниже 90; доля — игровая оценка:
  # обмороки при НЖТ «встречаются реже» (раздел 2.1)
  unstable: { yes: 5, no: 95 }
course:
  stages:
    - { id: acute, days: [0, 1] }
  presentation: [0, 0]
  # без купирования приступ держится — вернётся, его привезёт скорая: игровая оценка
  untreated:
    - { band: always, days: [0, 1], when: { unstable: [yes] } }
    - { band: usually, days: [0, 1] }
  # в ПИТ после купирования — сутки: игровая оценка, в 619_3 срока нет
  stay: [1, 1]
  # часов от начала до прихода — игровая оценка: в 619_3 долей нет; с приступом приходят в первые часы
  onset:
    f: hx.onset_hours
    hours: [[2, 35], [6, 35], [24, 25], [48, 5]]
findings:
  - f: sym.palpitations
    band: { pct: 100 }
    attrs: { rhythm: { regular: 100 } }
    note: "с чем приходят: приступ частого ровного сердцебиения — у каждого, бессимптомной формы в игре нет"
  - f: hx.onset_hours
    band: { pct: 100 }
    note: "когда началось, больной называет при расспросе — у каждого"
  - f: vital.tachycardia
    band: { pct: 100 }
    note: "тахикардия — по определению: ЧСС больше 100 в минуту (619_3, раздел 1.1)"
  - f: vital.tachycardia_150
    band: { pct: 100 }
    note: "частота при приступе — 150–250 в минуту (619_3, раздел 2.4): у каждого в игре"
  - f: ecg.svt
    band: { pct: 100 }
    note: "тахикардия с узкими QRS видна на ЭКГ у каждого, у кого она есть: признак — это она сама"
  - f: vital.bp_low
    band: { pct: 100 }
    when: { unstable: [yes] }
    note: "нестабильный в игре — с давлением ниже 90 по определению параметра (619_3, раздел 6: выраженная гипотония)"
  - { f: sym.dizziness, band: sometimes, when: { unstable: [no] } }
  - { f: sym.dizziness, band: usually, when: { unstable: [yes] } }
  - { f: sym.dyspnea, band: sometimes }
  - { f: sign.pallor, band: usually, when: { unstable: [yes] } }
# диагноз — по ЭКГ: регистрация электрокардиосигнала во время приступа (619_3, раздел 2; критерий качества 3)
confirm: [exam.ecg]
redFlags: [vital.bp_low]
treatment:
  # стабильному — по порядку (619_3, раздел 3.1.1, приложение Б-3; критерий качества 7): вагусные пробы лёжа с
  # поднятыми ногами (ЕОК IB), затем трифосаденин болюсом (ЕОК IB), затем верапамил или бета-адреноблокатор
  # в вену (ЕОК IIaB / IIaC; бета-адреноблокатор в вену — с частью 43а), при неэффективности — синхронизированная
  # кардиоверсия (ЕОК IB). Бета-адреноблокатор и верапамил таблетками приступ не снимают — для профилактики
  # (раздел 3.2.5)
  firstLine: [tx.vagal, tx.trifosadenine]
  acceptable: [tx.verapamil_iv, tx.beta_blocker_iv, tx.cardioversion, tx.beta_blocker, tx.verapamil]
  notIndicated: [tx.amiodarone_iv, tx.doac, tx.heparin_iv, tx.lmwh, tx.aspirin_acs]
  plan: [tx.vagal, tx.trifosadenine]
  byParam:
    # стабильный: приступ снимают здесь — трифосаденином, верапамилом или разрядом, если вагусные пробы не
    # помогли; где монитора у постели нет — вагусные пробы и в больницу (`without`), здесь не в вину
    - when: { unstable: [no] }
      require: [[tx.trifosadenine, tx.verapamil_iv, tx.beta_blocker_iv, tx.cardioversion]]
    # нестабильный (619_3, раздел 3.1.1, ЕОК IB; критерий качества 6): синхронизированная кардиоверсия сразу;
    # верапамил при гипотонии — вредно (раздел 3.2.2: «в отсутствие гипотензии»), пробы, таблетки и
    # бета-адреноблокатор в вену — не то
    - when: { unstable: [yes] }
      harmful: [tx.verapamil_iv]
      notIndicated: [tx.vagal, tx.trifosadenine, tx.beta_blocker, tx.verapamil, tx.beta_blocker_iv]
      require: [tx.cardioversion]
  # после приступа — домой (619_3, раздел 6: экстренной госпитализации не подлежат без нестабильности);
  # нестабильный — в больницу обязательно, в игре — ПИТ. Без монитора у постели приступ не снять: вагусные
  # пробы, и — своя ПИТ или скорая («при отсутствии эффекта неотложной помощи … экстренно направлять»)
  setting:
    default: home
    param: { name: unstable, map: { yes: icu, no: home } }
    without: { equipment: [eq.monitor_defib], setting: icu }
texts:
  summary:
    ru: >-
      Приступ частого ровного сердцебиения — 150–250 в минуту: начинается внезапно и так же внезапно кончается.
      На ЭКГ — тахикардия с узкими комплексами QRS. По порядку: вагусные пробы лёжа с поднятыми ногами, не
      помогло — трифосаденин в вену под монитором, затем верапамил. Низкое давление, обморок, боль в груди —
      электрическая кардиоверсия сразу. После приступа — домой и к кардиологу: аблация избавляет от приступов.
pearls:
  - ru: "Вагусные пробы делают лёжа с поднятыми ногами; массаж сонной артерии — только с одной стороны."
  - ru: "Перед трифосаденином предупреждают: будет прилив к лицу и короткая нехватка воздуха — так он действует."
  - ru: "Широкие комплексы на ЭКГ — это не наджелудочковая тахикардия, пока не доказано иное: верапамил тогда нельзя."
simplified: "Механизм тахикардии (АВ-узловая, с дополнительным путём, предсердная) и тест с трифосаденином не различаются; синдрома WPW, фибрилляции предсердий с предвозбуждением, тахикардии с аберрацией, синусовой тахикардии как отдельной болезни нет. Бета-адреноблокатор в вену — без выбора препарата: эсмолол и метопролол одним назначением. Повторной ЭКГ после купирования, ЭхоКГ, холтера, аблации и беременности нет. Без монитора у постели трифосаденин не назначить — и при отправке в ПИТ из кабинета тоже: его назначают на обходе."
sources:
  - { kind: guideline, title: "Наджелудочковые тахикардии", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/619_3", note: "ID 619_3, опубликованы 17.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6.5: АВУРТ — около половины НЖТ, чаще у женщин, средний возраст дебюта — 32 года; раздел 1.6.7: АВРТ — 23 года; раздел 2.1: обмороки реже; раздел 3.1.1 и приложение Б-3: нестабильная — синхронизированная ЭИТ (ЕОК IB); стабильная — вагусные приёмы (ЕОК IB), трифосаденин (ЕОК IB), верапамил (ЕОК IIaB) или бета-адреноблокатор (ЕОК IIaC), ЭИТ (ЕОК IB); раздел 6: госпитализация при нестабильности и при неэффективности неотложной помощи; критерии качества 6 и 7; доли — игровая оценка" }
review: draft
