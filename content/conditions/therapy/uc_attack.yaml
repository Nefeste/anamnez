id: cond.uc_attack
name: { ru: "Язвенный колит, тяжёлая атака" }
# «хроническое заболевание толстой кишки, характеризующееся иммунным воспалением ее слизистой оболочки» (spec
# 2026-10-chapter-4, часть 55а; 193_2, раздел «Термины и определения»); с атакой приходят. МКБ-10 — K51 (паспорт 193_2). Лёгкой и
# среднетяжёлой атаки в игре нет: их лечат месалазином, с ними в приёмное не приходят
icd10: K51
department: dept.therapy
system: digestive
kind: disease
severity: serious
epidemiology:
  # распространённость — до 505 на 100 тыс., риск тяжёлого обострения за жизнь — 15 % (193_2, разделы 1.3 и 7). Полоса
  # подобрана прогоном генератора — игровая оценка
  prevalence: very_rare
  # «Пик заболеваемости приходится на возрастной интервал 20-30 лет», бывает второй — в 60–70 лет; мужчины и женщины болеют
  # одинаково (раздел 1.3)
  age: { min: 18, peak: [20, 30] }
params:
  # тяжёлая атака по Трулаву–Виттсу (раздел 1.5, табл. 2) и «так называемая „сверхтяжелая или крайне тяжелая атака“» (раздел
  # 1.5): доли — игровая оценка. Параметр не `severity`: скорая поднимает тяжесть до «severe» и прятала бы сверхтяжёлую
  attack: { severe: 75, fulminant: 25 }
course:
  stages:
    - { id: attack, days: [0, 21] }
  # атака нарастает днями — игровая оценка
  presentation: [5, 14]
  # без лечения — токсическая дилатация, перфорация с «почти 50%» летальностью (раздел 3.2.2); при сверхтяжёлой колэктомия —
  # «единственным путем спасения жизни» при ухудшении (раздел 3.1.7). Доли и сроки — игровая оценка
  untreated:
    - { band: usually, days: [3, 10], when: { attack: [severe] } }
    - { band: always, days: [1, 4], when: { attack: [fulminant] } }
  # в/в ГКС — курс 7 дней, дальше таблетки (раздел 3.1.6); длительности госпитализации в 193_2 нет — игровая оценка
  stay: [10, 21]
findings:
  - f: sym.bloody_diarrhea
    band: { pct: 100 }
    note: "тяжёлая атака по Трулаву–Виттсу — стул с кровью 6 раз в сутки и чаще (193_2, раздел 1.5, табл. 2): по определению"
  - f: lab.crp_high
    band: { pct: 100 }
    note: "к стулу с кровью — хотя бы один признак системного воспаления (193_2, табл. 2): в игре у каждого — СРБ выше 30 мг/л, тот же порог"
  # другие признаки табл. 2 — полосами; пороги игры грубее: пульс чаще 100 (в таблице — 90), лихорадка 38 и выше (37,8),
  # гемоглобин ниже нормы (105). Сверхтяжёлая — «лихорадкой выше 38°С», «нарастающим падением гемоглобина» (раздел 1.5)
  - { f: vital.tachycardia, band: often, when: { attack: [severe] } }
  - { f: vital.tachycardia, band: usually, when: { attack: [fulminant] } }
  - { f: vital.fever, band: sometimes, when: { attack: [severe] } }
  - f: vital.fever
    band: { pct: 100 }
    when: { attack: [fulminant] }
    note: "сверхтяжёлая атака — «лихорадкой выше 38°С» (193_2, раздел 1.5)"
  - { f: lab.hb_low, band: often, when: { attack: [severe] } }
  - f: lab.hb_low
    band: { pct: 100 }
    when: { attack: [fulminant] }
    note: "сверхтяжёлая атака — «нарастающим падением гемоглобина» (193_2, раздел 1.5)"
  # эндотоксемия — лейкоцитоз (раздел 1.6); полоса — игровая оценка
  - { f: lab.wbc_high, band: often }
  # «Для ЯК, в отличие от БК, боль в животе не характерна», бывает спастическая перед стулом; тенезмы — «чаще при проктитах»
  # (раздел 1.6)
  - { f: sym.abdominal_pain, band: sometimes }
  - { f: sym.tenesmus, band: sometimes }
  # интоксикация и метаболические расстройства: слабость, «потеря массы тела» (раздел 1.6)
  - { f: sym.fatigue, band: usually }
  - { f: sym.weight_loss, band: often }
  # колит уже находили — обострение; бывает и первая атака (раздел 3.1.7): доля — игровая оценка
  - { f: hx.uc, band: usually }
  - f: img.colon_uc
    band: { pct: 100 }
    note: "у каждого — диффузное воспаление от прямой кишки (193_2, разделы 1.1 и 2.4); увидит ли его эндоскопист — точность обследования"
# эндоскопия с биопсией — для диагноза (раздел 2.4): при выраженной активности — сигмоидоскопия
confirm: [exam.sigmoidoscopy, exam.colonoscopy]
# «острыми кишечными инфекциями (дизентерия, сальмонеллез…)», «поражениями кишечника, ассоциированными с Cl.difficile» (раздел
# 2.5)
differential: [cond.shigellosis, cond.cdiff, cond.salmonellosis]
treatment:
  # в/в глюкокортикоиды — «в качестве первой линии терапии» (раздел 3.1.6, УУР А, УДД 2; при сверхтяжёлой — раздел 3.1.7, УУР С,
  # УДД 4)
  firstLine: [tx.steroid_iv]
  # гепарин — «госпитализированным пациентам при наличии показаний» (раздел 3.1.6, УУР С, УДД 4); антибиотики — «При развитии
  # признаков системного воспаления» (там же, УУР А, УДД 1): чем их измерить, не сказано — не ошибка, но и не обязательно
  acceptable: [tx.lmwh, tx.antibiotic_iv]
  # растворы — при метаболических нарушениях, для регидратации и коррекции электролитов (раздел 3.1.6, УУР C, УДД 5)
  supportive: [tx.iv_fluids, tx.balanced_fluids]
  notIndicated: []
  # «прием антидиарейных препаратов» — фактор риска токсической дилатации (раздел 3.2.2)
  harmful: [tx.loperamide]
  byParam:
    # сверхтяжёлая — наблюдение колопроктолога (хирурга) с решением об операции «в течение 24 часов» (раздел 3.1.7)
    - when: { attack: [fulminant] }
      require: [tx.coloproctologist_consult]
  # «в гастроэнтерологическое отделение, колопроктологическое отделение» (раздел 6); критериев перевода в ОРИТ при атаке в
  # 193_2 нет
  setting: { default: ward }
texts:
  summary:
    ru: >-
      Хроническое воспаление толстой кишки: оно начинается в прямой кишке и идёт выше. При тяжёлой атаке — жидкий стул с кровью 6
      раз в сутки и чаще, днём и ночью, частый пульс, температура, анемия, высокий С-реактивный белок. Кишку смотрят
      сигмоидоскопией: колоноскопия с подготовкой слабительными при атаке опасна. Кал проверяют на токсины C. difficile. Лечат
      в стационаре глюкокортикоидами в вену, при сверхтяжёлой атаке с первого дня решают с хирургом об операции.
pearls:
  - ru: "Стул с кровью 6 раз в сутки и чаще и хоть один признак воспаления — тяжёлая атака: стационар и глюкокортикоиды в вену."
  - ru: "При тяжёлой атаке — сигмоидоскопия, а не колоноскопия: подготовка слабительными может раздуть кишку."
  - ru: "Лоперамид при атаке колита — вред: он тоже провоцирует токсическую дилатацию."
simplified: "Лёгкой и среднетяжёлой атаки нет — с ними не приходят. Пороги пульса, температуры и гемоглобина в игре грубее, чем в шкале Трулава–Виттса; альбумин и электролиты не считают. Ответ на глюкокортикоиды на 3-й и 7-й день, «терапия спасения» и колэктомия — за пределами смены; рентгенография живота, биопсия на цитомегаловирус, месалазин в клизмах и переливание крови — нет."
sources:
  - { kind: guideline, title: "Язвенный колит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/193_2", note: "ID 193_2, опубликованы 29.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.1: поражается только толстая кишка, прямая — всегда; раздел 1.3: распространённость до 505 на 100 тыс., пик 20–30 лет, мужчины и женщины одинаково; раздел 1.5, таблица 2: критерии Трулава–Виттса, сверхтяжёлая атака — стул чаще 10–15 раз, лихорадка выше 38 °С, падение гемоглобина; раздел 1.6: кровь в стуле в 95–100 %, боль не характерна, эндотоксемия, потеря массы тела; раздел 2.3 (УУР С, УДД 4): кал на токсины C. difficile при обострении; раздел 2.4 (УУР С, УДД 4): при выраженной активности — сигмоидоскопия; раздел 2.5: дифференциальный диагноз с кишечными инфекциями и C. difficile; раздел 3.1.6: в/в ГКС — первая линия (УУР А, УДД 2), инфузия (УУР C, УДД 5), гепарины при показаниях (УУР С, УДД 4), антибиотики при системном воспалении (УУР А, УДД 1); раздел 3.1.7: при сверхтяжёлой атаке консервативная терапия эффективна не более чем в 50 %, хирург решает об операции в течение 24 часов; раздел 3.2.2: антидиарейные и подготовка осмотическими слабительными — факторы риска токсической дилатации, перфорация — почти 50 % летальности; раздел 6: гастроэнтерологическое или колопроктологическое отделение; раздел 7: риск тяжёлого обострения за жизнь — 15 %; доли тяжести, полосы признаков, сроки и место — игровая оценка" }
review: draft
