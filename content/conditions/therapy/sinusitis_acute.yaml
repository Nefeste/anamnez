id: cond.sinusitis_acute
name: { ru: "Острый риносинусит" }
icd10: J01.9
department: dept.therapy
system: airways
kind: disease
severity: minor
epidemiology:
  prevalence: common
  age: { min: 18 }
  season: { winter: 1.3, spring: 1.1, summer: 0.7, autumn: 1.1 }
course:
  stages:
    - { id: peak, days: [5, 12] }
    - { id: resolution, days: [12, 21] }
  presentation: [6, 14]
  selfLimiting: true
findings:
  - { f: sym.nasal_congestion, band: always }
  - { f: sym.rhinorrhea, band: usually }
  - { f: sym.purulent_nasal, band: often }
  - { f: sym.facial_pain, band: usually }
  - { f: sym.nasal_long, band: usually }
  - { f: sym.anosmia, band: often }
  - { f: sym.headache, band: often }
  - { f: sym.cough, band: sometimes, attrs: { character: { dry: 60, productive: 40 } } }
  - { f: sym.sore_throat, band: sometimes }
  - { f: sym.double_worsening, band: rarely }
  - { f: sym.fever_hx, band: rarely }
  - { f: vital.fever, band: very_rarely }
  - { f: sign.purulent_discharge_nose, band: sometimes }
  - { f: sign.sinus_tenderness, band: sometimes }
  - { f: lab.crp_high, band: rarely }
confirm: clinical
treatment:
  firstLine: [tx.nasal_saline, tx.nasal_steroid]
  supportive: [tx.paracetamol, tx.ibuprofen]
  notIndicated: [tx.amoxicillin, tx.amoxicillin_clavulanate, tx.macrolide, tx.oseltamivir, tx.antihistamine, tx.steroid_systemic_short]
  setting: { default: home }
texts:
  summary:
    ru: >-
      Воспаление слизистой носа и околоносовых пазух, чаще всего — затянувшаяся вирусная
      инфекция: нос не дышит больше 10 дней, давит в лице, снижено обоняние. Проходит
      сам; промывание и гормональный спрей в нос ускоряют выздоровление.
pearls:
  - ru: "Насморк дольше 10 дней — ещё не повод для антибиотика: чаще это затянувшийся вирусный риносинусит."
  - ru: "Густые зелёные выделения сами по себе не говорят о бактериях."
simplified: "Вирусный и поствирусный риносинусит объединены; рентген пазух не делают — он не нужен для диагноза."
sources:
  - { kind: guideline, title: "Fokkens WJ et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020. Rhinology 2020;58(Suppl S29):1–464", note: "частоты — черновик" }
  - { kind: guideline, title: "Острый синусит", org: "Минздрав РФ", note: "точное название и редакцию сверить на cr.minzdrav.gov.ru" }
  - { kind: guideline, title: "Sinusitis (acute): antimicrobial prescribing. NICE guideline NG79", org: "NICE", year: 2017 }
review: draft
