id: cond.hhs
name: { ru: "Гиперосмолярное гипергликемическое состояние" }
# «ГГС – острая декомпенсация СД, с резко выраженной гипергликемией (как правило, уровень глюкозы плазмы > 35 ммоль/л),
# высокой осмолярностью плазмы и резко выраженной дегидратацией, при отсутствии кетоза и ацидоза» (Алгоритмы, 11-й
# выпуск, 2023, раздел 8.2, с. 47; spec 2026-10-urticaria-dka, часть 73). Кода в «Алгоритмах» нет; в игре — у больного
# диабетом 2 типа, в МКБ-10 гиперосмолярная кома — E11.0: одна запись
icd10: E11.0
department: dept.therapy
system: metabolic
kind: disease
severity: critical
epidemiology:
  # частоты нет; полоса — игровая оценка, реже кетоацидоза
  prevalence: very_rare
  # «пожилой возраст» — среди провоцирующих факторов (с. 47); возраст — игровая оценка
  age: { min: 45, peak: [65, 90] }
  # в игре — у известного диабета 2 типа: тип в разделе 8.2 не назван, игровая запись
  requires: [cond.diabetes2]
params:
  # провоцирующие факторы (с. 47): рвота, диарея, лихорадка, другие острые заболевания, диуретики и другое; инфекция с
  # лихорадкой — отдельно: от неё антибиотики («Частая сопутствующая терапия: как при ДКА», с. 48). Доли — игровая оценка
  factor: { infection: 45, fluid_loss: 30, other: 25 }
course:
  stages:
    - { id: acute, days: [0, 3] }
  # нарастает днями — игровая оценка
  presentation: [0, 2]
  # без лечения хуже: «вплоть до коллапса и гиповолемического шока; сонливость, сопор и кома» (с. 47); сроки — игровая
  # оценка
  untreated: { band: always, days: [0, 1] }
  stay: [4, 8]
findings:
  - f: lab.glucose_high
    band: { pct: 100 }
    note: "гипергликемия — по определению (Алгоритмы, с. 43, 47); число — по порогу ниже: одно измерение"
  - f: lab.glucose_14
    band: { pct: 100 }
    note: "резко выраженная гипергликемия — по определению (Алгоритмы, с. 47); «повышена» — то же измерение"
  # «как правило, уровень глюкозы плазмы > 35 ммоль/л» (с. 47): «обычно» — игровая оценка
  - { f: lab.glucose_35, band: usually }
  - f: lab.osm_high
    band: { pct: 100 }
    note: "высокая осмолярность плазмы — по определению; в анализах — выше 320 мосмоль/л (с. 47–48)"
  - f: sign.dehydration
    band: { pct: 100 }
    note: "резко выраженная дегидратация — по определению (с. 47)"
  # «Массивная глюкозурия» (с. 47); «выраженная полиурия», «выраженная жажда (у пожилых может отсутствовать)», «сниженный
  # тургор кожи, мягкость глазных яблок, тахикардия, позднее – артериальная гипотензия», «сонливость, сопор и кома» (с. 47).
  # Частот нет — полосы игровые
  - { f: lab.urine_glucose, band: usually }
  - { f: sym.polyuria, band: usually }
  - { f: sym.thirst, band: often }
  - { f: sym.fatigue, band: usually }
  - { f: sym.headache, band: sometimes }
  - { f: sign.dry_mucosa, band: usually }
  - { f: vital.tachycardia, band: usually }
  - { f: vital.bp_low, band: sometimes }
  - { f: sym.confusion, band: usually }
  - { f: sign.gcs_low, band: often }
  - { f: sign.gcs_coma, band: rarely }
  # «полиморфная неврологическая симптоматика (судороги, дизартрия, … парезы и параличи …), которая не укладывается в
  # какой-либо четкий синдром, изменчива и исчезает при нормализации осмолярности» (с. 47): «маска» инсульта; доли — игровая
  # оценка
  - { f: sym.speech_trouble, band: sometimes }
  - { f: sign.speech_deficit, band: sometimes }
  - { f: sym.weakness_one_side, band: rarely }
  - { f: sym.seizure, band: rarely }
  # «Повышение креатинина (непостоянно; чаще всего указывает на транзиторную почечную недостаточность, вызванную
  # гиповолемией)» (с. 48); «Лейкоцитоз: < 15000 – стрессовый, > 25000 – инфекция» (с. 47)
  - { f: lab.creatinine_high, band: often }
  - { f: lab.wbc_high, band: usually, when: { factor: [infection] } }
  - { f: lab.wbc_high, band: sometimes, when: { factor: [fluid_loss, other] } }
  # причина: лихорадка — при инфекции, рвота и понос — при потере жидкости (с. 47); доли — игровая оценка
  - { f: vital.fever, band: usually, when: { factor: [infection] } }
  - { f: sym.vomiting, band: usually, when: { factor: [fluid_loss] } }
  - { f: sym.diarrhea, band: often, when: { factor: [fluid_loss] } }
# «Запаха ацетона и дыхания Куссмауля нет» (с. 47); «кетонурии нет», «Ацидоза нет: рН > 7,3» (с. 47–48)
masks: [sign.acetone_breath, sign.kussmaul, lab.urine_ketones, lab.acidosis]
# диагноз — по глюкозе и осмолярности, кетоны в моче — чтобы отличить от ДКА: «Экспресс-анализ ГП и любой порции мочи на
# кетоновые тела» (с. 48), «Расчет скорректированного Na+» (там же)
confirm: [exam.electrolytes, exam.urine_dipstick]
redFlags: [sign.gcs_low, vital.bp_low, sign.speech_deficit]
# ДКА — та же гипергликемия, но с кетозом и ацидозом; неврологическая симптоматика — как при инсульте (с. 47); «крайне
# важен дифференциальный диагноз с отеком мозга» (там же) — отёка мозга в игре нет
differential: [cond.dka, cond.stroke_ischemic]
treatment:
  # регидратация — первым: «Как при ДКА, со следующими особенностями» — раствор по скорректированному натрию (с. 48);
  # «в начале инфузионной терапии инсулин не вводят или вводят в очень малых дозах», если гипергликемия держится — как
  # при ДКА (там же). Доз и выбора раствора по натрию в игре нет
  firstLine: [tx.iv_fluids]
  acceptable: []
  # инсулин — позже и малыми дозами; калий — «по тем же принципам, что при ДКА» (с. 48); гепарин — «как при ДКА»
  supportive: [tx.insulin_iv, tx.potassium_iv, tx.lmwh]
  notIndicated: [tx.sodium_bicarbonate, tx.dextrose_iv, tx.dextrose_infusion]
  # «во избежание ОШИБОЧНОГО назначения мочегонных ВМЕСТО РЕГИДРАТАЦИИ» (с. 47)
  harmful: [tx.furosemide_iv]
  plan: [tx.iv_fluids, tx.insulin_iv, tx.potassium_iv]
  byParam:
    # до госпитализации — 0,9 % раствор NaCl в вену капельно (с. 45; при ГГС — с. 48): у всех
    - when: { factor: [infection, fluid_loss, other] }
      preHospital: [tx.iv_fluids]
    # «Частая сопутствующая терапия: как при ДКА» (с. 48) — антибиотики при инфекции
    - when: { factor: [infection] }
      supportive: [tx.antibiotic_iv]
  # «В реанимационном отделении или отделении интенсивной терапии» (с. 48)
  setting:
    default: icu
    also:
      - { when: { factor: [infection, fluid_loss, other] }, settings: [ricu] }
texts:
  summary:
    ru: >-
      Острая декомпенсация диабета 2 типа, чаще у пожилых: глюкоза очень высокая, обычно выше 35 ммоль/л, осмолярность крови
      высокая, резкое обезвоживание, а кетонов и ацидоза нет. Начинается с инфекции, рвоты и поноса, мочегонных. Много мочи, жажда
      (у пожилых её может не быть), сухость, частый пульс, потом давление падает; сонливость, сопор, кома, бывают
      судороги, нарушение речи и параличи, как при инсульте, — они проходят, когда осмолярность выправляется. Запаха
      ацетона и шумного дыхания нет. Лечат в реанимации: сначала растворы, инсулин — позже и малыми дозами, калий.
pearls:
  - ru: "Очень высокий сахар и обезвоживание у пожилого больного диабетом без кетонов в моче — гиперосмолярное состояние: сначала растворы."
  - ru: "Мочегонные при гиперосмолярном состоянии — ошибка: спутанность и нарушения речи от обезвоживания, их лечит регидратация."
  - ru: "Нарушение речи и слабость в руке у больного диабетом с глюкозой выше 35 — не всегда инсульт: при гиперосмолярном состоянии неврологические симптомы проходят с регидратацией."
simplified: "Гиперосмолярное состояние в игре — у больного диабетом 2 типа. Выбор раствора по скорректированному натрию, доз и скоростей нет; лактатацидоз, отёк мозга и коагулограмма не моделируются."
sources:
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом. 11-й выпуск", org: "Под ред. И.И. Дедова, М.В. Шестаковой, А.Ю. Майорова", year: 2023, url: "https://doi.org/10.14341/DM13042", note: "Сахарный диабет. 2023;26(2S):1–157; полный текст — https://www.dia-endojournals.ru/jour/article/download/13042/pdf_232, сверено 15.10.2026 (решение владельца по вопросу 28, Nefeste/anamnez#118); раздел 8.2, с. 47–48: определение (как правило глюкоза > 35, высокая осмолярность, резкая дегидратация, без кетоза и ацидоза); провоцирующие факторы — рвота, диарея, лихорадка, другие острые заболевания, диуретики, пожилой возраст; клиническая картина — полиурия, жажда (у пожилых может отсутствовать), сниженный тургор, тахикардия, позднее гипотензия, сонливость, сопор, кома, полиморфная неврологическая симптоматика, запаха ацетона и дыхания Куссмауля нет; лабораторные изменения — осмолярность > 320, кетонурии нет, рН > 7,3; лечение — 0,9 % NaCl, раствор по скорректированному Na+, инсулин вначале не вводят или в очень малых дозах, калий как при ДКА, сопутствующая терапия как при ДКА; ошибочное назначение мочегонных вместо регидратации; место — реанимация или ОИТ; кодов МКБ, частот и летальности в тексте нет; доли и сроки — игровая оценка; дозы и скорости опущены" }
review: draft
