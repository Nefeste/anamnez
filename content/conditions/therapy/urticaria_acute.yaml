id: cond.urticaria_acute
name: { ru: "Острая крапивница" }
# кода именно для острой крапивницы в 264_2 нет (раздел 1.4: L50.0–L50.9 и T78.3, без деления на острую и хроническую):
# в игре одна запись — L50.9, неуточнённая крапивница
icd10: L50.9
department: dept.therapy
system: skin
kind: disease
severity: minor
epidemiology:
  # «Распространенность острой крапивницы составляет 20%» (264_2, раздел 1.3) — за жизнь или за год, не сказано; к
  # терапевту с ней приходят реже, чем с простудой: полоса — игровая оценка
  prevalence: uncommon
  # у детей острая крапивница чаще, чем у взрослых (раздел 1.3); в игре — взрослые. Пол и возраст для острой не даны
  age: { min: 18 }
params:
  # причины без долей (264_2, разделы 1.2, 2.1, 3.1): лекарства — ацетилсалициловая кислота, НПВП, ингибиторы АПФ и
  # другие, инфекции (в игре — простуда, `ari`), пища; доли и «причину не нашли» — игровая оценка
  trigger: { drug: 30, ari: 25, food: 15, unknown: 30 }
  # уже пил таблетки от аллергии, и они не помогли: о них спрашивают (раздел 2.1: «эффективность антигистаминных
  # средств системного действия»), и тогда — глюкокортикоиды коротким курсом (раздел 3.3.1, рек. 2). Доля — игровая
  # оценка
  tried: { no: 80, failed: 20 }
course:
  # острая — меньше 6 недель, каждый волдырь — не дольше суток, при острой — несколько часов (раздел 1.6, приложение
  # А3.2)
  stages:
    - { id: acute, days: [0, 42] }
  # приходят в первые дни; кто уже пил таблетки от аллергии — позже: игровая оценка
  presentation: [0, 3]
  # без лечения не хуже, но и не проходит: зуд и сыпь остаются — «без изменений», как при аллергическом рините; игровая
  # оценка
  untreated: { band: never, days: [7, 7] }
findings:
  - f: sym.hives
    band: { pct: 100 }
    note: "крапивницу диагностируют по обратимым волдырям и/или ангиоотёкам (264_2, раздел 2, рек. 1); волдырь — с зудом, иногда жжением (раздел 1.6): у каждого"
  # ангиоотёк — частный случай крапивницы: веки, губы, щёки, язык; без зуда, держится до 72 часов (264_2, раздел 1.6);
  # как часто он сопровождает острую крапивницу, в тексте нет — игровая оценка
  - { f: sign.angioedema, band: sometimes }
  # «в ряде случаев высыпания захватывают практически весь кожный покров и могут сопровождаться повышением
  # температуры тела» (раздел 1.6) — «редко», игровая оценка
  - { f: vital.fever, band: rarely }
  - f: hx.new_drug
    band: { pct: 100 }
    when: { trigger: [drug] }
    note: "по определению параметра: незадолго до сыпи — ацетилсалициловая кислота, НПВП или ингибитор АПФ (264_2, раздел 2.1; раздел 3.1.1)"
  - f: hx.recent_cold
    band: { pct: 100 }
    when: { trigger: [ari] }
    note: "по определению параметра: перед сыпью была острая инфекция (264_2, раздел 2.1; раздел 3.1.2)"
  - f: hx.trigger_food
    band: { pct: 100 }
    when: { trigger: [food] }
    note: "по определению параметра: связь с едой (264_2, раздел 2.1; раздел 3.1.3)"
  - f: hx.antihistamine_failed
    band: { pct: 100 }
    when: { tried: [failed] }
    note: "по определению параметра: таблетки от аллергии уже пил, и они не помогли"
# диагноз клинический: «Диагностика крапивницы обычно не требует лабораторного подтверждения» (264_2, раздел 2), а
# обследовать при острой крапивнице всех не рекомендуется, только по указанию в анамнезе (раздел 2.3, рек. 1)
confirm: clinical
# крапивница и ангиоотёк бывают симптомом анафилаксии — тогда лечат её (раздел 3.3.1, комментарий): главный двойник
differential: [cond.anaphylaxis]
treatment:
  # антигистаминные системного действия неседативные, второго поколения (264_2, раздел 3.3.1, рек. 1, УУР A, УДД 1;
  # критерий качества 1). Подозреваемое лекарство отменяют (раздел 3.1.1) — в игре не отдельным назначением
  firstLine: [tx.antihistamine]
  # уколы антигистаминных первого поколения — «только по особым показаниям (генерализованная крапивница со стабильными
  # показателями гемодинамики)» (раздел 3.3.1): не ошибка — игровое правило
  acceptable: [tx.antihistamine_parenteral]
  supportive: []
  # эпинефрин и растворы — при анафилаксии (раздел 3.3.1, комментарий: «см. клинические рекомендации «Анафилактический
  # шок»»). Глюкокортикоиды внутрь — когда антигистаминные не помогли (раздел 3.3.1, рек. 2): до того не названы, то
  # есть «не показано»
  notIndicated: [tx.steroid_iv, tx.epinephrine_im, tx.iv_fluids]
  plan: [tx.antihistamine]
  byParam:
    # антигистаминные уже не помогли — глюкокортикоиды коротким курсом, у взрослых до 10 дней, без постепенной отмены
    # (раздел 3.3.1, рек. 2, УУР C, УДД 4; критерий качества 3); антигистаминные дальше — не ошибка
    - when: { tried: [failed] }
      firstLine: [tx.steroid_systemic_short]
      acceptable: [tx.antihistamine]
      plan: [tx.steroid_systemic_short]
  # госпитализируют тяжёлые формы, ангиоотёк гортани с риском асфиксии и крапивницу при анафилаксии (раздел 6); острую
  # без них ведёт терапевт амбулаторно (там же)
  setting: { default: home }
texts:
  summary:
    ru: >-
      Внезапные волдыри с зудом, как от крапивы: каждый держится несколько часов и исчезает бесследно, весь эпизод —
      меньше шести недель. Бывает отёк губ или век — без зуда, до трёх суток. Причина — лекарство (ацетилсалициловая кислота,
      обезболивающие из группы НПВП, таблетки от давления — ингибиторы АПФ), инфекция или еда. Анализы при первом эпизоде не нужны.
      Лечат таблетками от аллергии второго поколения дома; не помогли — короткий курс гормона. Если с сыпью падает
      давление — это анафилактический шок; осиплость голоса — отёк гортани, он опасен удушьем.
pearls:
  - ru: "Сыпь с зудом и нормальное давление — крапивница, таблетки от аллергии дома. Сыпь и верхнее давление ниже 90 — анафилактический шок: эпинефрин в мышцу сразу."
  - ru: "При первом эпизоде острой крапивницы анализы не нужны: причину ищут по расспросу — новое лекарство, простуда, еда."
  - ru: "Гормон — не первым: короткий курс, только если таблетки от аллергии не помогли."
simplified: "Острая крапивница в игре — у взрослого, без отёка гортани и без индуцированных форм (холодовой, от давления и других). Подозреваемое лекарство отменяют без отдельного назначения; повышение дозы антигистаминных, наблюдение у аллерголога и хроническая крапивница не моделируются."
sources:
  - { kind: guideline, title: "Крапивница", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/264_2", note: "ID 264_2, опубликованы 19.07.2023, применяются; сверено с рубрикатором 15.10.2026; раздел 1.3: распространённость острой крапивницы — 20 %, у детей чаще; раздел 1.4: коды L50.0–L50.9, T78.3; раздел 1.6: острая — волдыри не дольше 24 часов, меньше 6 недель, от одного или нескольких провоцирующих факторов; ангиоотёк — без зуда, до 72 часов; распространённые высыпания могут сопровождаться повышением температуры; раздел 2, рек. 1: диагноз — по обратимым волдырям и/или ангиоотёкам; раздел 2.1: жалобы и анамнез — лекарства (АСК, НПВП, ингибиторы АПФ), инфекции, пища, эффективность антигистаминных; раздел 2.3, рек. 1 (УУР C, УДД 5): не рекомендуется обследовать при острой крапивнице всех пациентов; раздел 3.1: отменить подозреваемое лекарство; раздел 3.3.1, рек. 1 (УУР A, УДД 1): антигистаминные неседативные второго поколения; рек. 2 (УУР C, УДД 4): без эффекта — глюкокортикоиды коротким курсом, у взрослых до 10 дней, без постепенной отмены; первого поколения парентерально — только при генерализованной крапивнице со стабильной гемодинамикой; при анафилаксии — по рекомендации «Анафилактический шок»; раздел 6: показания к госпитализации; критерии качества 1 и 3; доли причин, ангиоотёка и сроки — игровая оценка; дозы опущены" }
review: draft
