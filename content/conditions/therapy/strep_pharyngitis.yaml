id: cond.strep_pharyngitis
name: { ru: "Острый стрептококковый тонзиллофарингит" }
icd10: J02.0
department: dept.therapy
system: airways
kind: disease
severity: moderate
epidemiology:
  prevalence: uncommon
  age: { min: 18, peak: [18, 44] }
  season: { winter: 1.2, spring: 1.3, summer: 0.6, autumn: 1.0 }
  risks:
    - { id: risk.sick_contact, x: 1.5 }
course:
  stages:
    - { id: onset, days: [0, 2] }
    - { id: peak, days: [2, 5] }
    - { id: resolution, days: [5, 10] }
  presentation: [1, 3]
  untreated: { band: rarely, days: [3, 7] }
  selfLimiting: true
findings:
  - { f: sym.sore_throat, band: always }
  - { f: sym.fever_hx, band: usually }
  - { f: vital.fever, band: often }
  - { f: sign.pharyngeal_hyperemia, band: always }
  - { f: sign.tonsillar_exudate, band: often }
  - { f: sign.tender_cervical_nodes, band: often }
  - { f: sym.cough, band: rarely, attrs: { character: { dry: 70, productive: 30 } } }
  - { f: sym.rhinorrhea, band: rarely }
  - { f: sym.headache, band: sometimes }
  - { f: sym.abrupt_onset, band: often }
  - { f: lab.strep_ag, band: always }
  - { f: lab.wbc_high, band: often }
  - { f: lab.crp_high, band: often }
  - { f: img.cxr_infiltrate, band: never }
confirm: [exam.strep_rapid]
treatment:
  firstLine: [tx.amoxicillin]
  acceptable: [tx.amoxicillin_clavulanate, tx.macrolide]
  supportive: [tx.paracetamol, tx.ibuprofen, tx.rest_fluids]
  notIndicated: [tx.oseltamivir, tx.steroid_systemic_short]
  setting: { default: home }
texts:
  summary:
    ru: >-
      Бактериальное воспаление миндалин и глотки, вызванное стрептококком группы А:
      сильная боль в горле, налёты, болезненные шейные лимфоузлы, лихорадка, обычно без
      насморка и кашля. Подтверждается экспресс-тестом или посевом.
pearls:
  - ru: "Налёты, болезненные шейные лимфоузлы, лихорадка и отсутствие кашля — критерии Сентора: чем их больше, тем вероятнее стрептококк."
  - ru: "Антибиотик назначают по положительному тесту, а не «по виду горла»."
sources:
  - { kind: guideline, title: "Острый тонзиллит и фарингит (Острый тонзиллофарингит)", org: "Минздрав РФ", note: "точное название и редакцию сверить на cr.minzdrav.gov.ru; частоты — черновик прототипа" }
  - { kind: paper, title: "Ebell MH et al. Does this patient have strep throat? JAMA 2000;284(22):2912–2918" }
  - { kind: score, title: "Centor RM et al. The diagnosis of strep throat in adults in the emergency room. Med Decis Making 1981;1(3):239–246" }
review: draft
