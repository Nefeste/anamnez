id: cond.constipation
name: { ru: "Функциональный запор" }
# «Первичный (функциональный) запор - заболевание функциональной природы, при котором отсутствуют органические (структурные)
# изменения» (spec 2026-10-chapter-4, часть 55б; 274_3, «Термины и определения»); МКБ-10 — K59.0 (раздел 1.4). Вторичного
# запора — от лекарств, гипотиреоза, опухоли — в игре нет: только его поиск
icd10: K59.0
department: dept.therapy
system: digestive
kind: disease
severity: minor
epidemiology:
  # симптомы запора — «у 12-19% взрослого населения», «у лиц старше 60 лет запор встречается чаще (в 36% случаев)» (274_3,
  # раздел 1.3); полоса подобрана прогоном генератора — игровая оценка
  prevalence: uncommon
  age: { min: 18, peak: [60, 85] }
course:
  stages:
    - { id: active, days: [0, 3650] }
  # срока «хронического» в 274_3 нет — полгода, как у СРК (892_1, раздел 2): игровая оценка
  presentation: [180, 1825]
  # «доброкачественное функциональное расстройство … самой жизни и здоровью, в целом, не угрожающее» (раздел 3.3)
  untreated: { band: never, days: [7, 7] }
findings:
  - f: sym.constipation_long
    band: { pct: 100 }
    note: "по определению: стул 1–2 типа по Бристольской шкале и реже 3 раз в неделю (274_3, раздел 2)"
  - f: sym.constipation
    band: { pct: 100 }
    note: "по определению: стул реже 3 раз в неделю (274_3, раздел 2)"
  # «вздутие живота, боль в животе» — среди других жалоб (раздел 2.1), частот нет. Боль не ведущая: иначе это СРК с запором
  # (892_1, раздел 2) — полосы игровые
  - { f: sym.bloating, band: often }
  - { f: sym.abdominal_pain, band: sometimes }
confirm: clinical
# «отсутствуют органические (структурные) изменения» — колита на колоноскопии не бывает («Термины и определения»)
masks: [img.colon_uc]
# СРК с запором — «запор с нормальным транзитом» (раздел 1.2); гипотиреоз — причина вторичного запора (раздел 1.2, табл. 1)
differential: [cond.ibs, cond.hypothyroidism]
treatment:
  # растительные волокна (раздел 3.1, УУР А, УДД 1; критерий качества 3), лучший — псиллиум; макрогол и лактулоза — «в
  # качестве препаратов первой линии», если диета и псиллиум не помогли (раздел 3.2, УУР А, УДД 1 и УУР С, УДД 4; критерий 4)
  firstLine: [tx.psyllium, tx.macrogol, tx.lactulose]
  # штаммоспецифические пробиотики (раздел 3.2, УУР А, УДД 1)
  acceptable: [tx.probiotic]
  supportive: []
  # лоперамид закрепляет — в 274_3 его нет, не по показаниям: игровая оценка
  notIndicated: [tx.loperamide]
  harmful: []
  # общие мероприятия — изменение образа жизни, диетические рекомендации (раздел 3; критерий качества 2)
  require: [tx.lifestyle]
  plan: [tx.psyllium]
  # плановая помощь — «как в амбулаторных, так и в стационарных условиях» (раздел 6); показаний к госпитализации нет
  setting: { default: home }
texts:
  summary:
    ru: >-
      Запор без органической причины: месяцами стул реже трёх раз в неделю, твёрдый, «орешками», с натуживанием и чувством
      неполного опорожнения, часто со вздутием. Живот ощупывают и проводят пальцевое исследование прямой кишки, общий анализ
      крови ищет анемию. Колоноскопия нужна старше 50 лет, при крови в кале, похудании, анемии и раке кишки у родственников.
      Лечат дома: образ жизни и питание с клетчаткой, псиллиум, макрогол или лактулоза.
pearls:
  - ru: "Хронический запор старше 50 лет, с кровью в кале, похуданием, анемией или раком кишки у родственников — колоноскопия: запор бывает первым признаком опухоли."
  - ru: "Сначала — питание с клетчаткой, вода, движение и псиллиум; не помогло — макрогол, он сильнее лактулозы и не вызывает привыкания."
  - ru: "Если ведущая жалоба — боль в животе, которая стихает после стула, это уже синдром раздражённого кишечника с запором."
simplified: "Вторичного запора — от лекарств, гипотиреоза, опухоли — в игре нет. Транзит по кишке, тест изгнания баллона, манометрию и проктографию не делают. Контактные слабительные — коротким курсом до 2 недель — и прукалоприд, когда слабительные не помогли, в игре не назначают; колэктомии нет."
sources:
  - { kind: guideline, title: "Запор", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/274_3", note: "ID 274_3, опубликованы 22.07.2024, применяются; сверено с рубрикатором 11.10.2026; «Термины и определения»: первичный (функциональный) запор — без органических изменений; раздел 1.2: механизмы, СРК с запором — с нормальным транзитом, табл. 1 — причины вторичного запора; раздел 1.3: 12–19 % взрослых, старше 60 лет — 36 %; раздел 1.6: стул 3 раза в неделю и реже, неполное опорожнение, натуживание; раздел 2: критерии — Бристольская шкала 1–2 типа, реже 3 раз в неделю; раздел 2.1: симптомы тревоги — кровь в кале, потеря более 10 % веса за 3 месяца, наследственность по колоректальному раку; раздел 2.2 (УУР С, УДД 5): пальпация живота и пальцевое исследование; раздел 2.3 (УУР С, УДД 5): ОАК — анемия от скрытой кровопотери; раздел 2.4 (УУР C, УДД 5): колоноскопия старше 50 лет, при симптомах тревоги и наследственности; раздел 3.1 (УУР А, УДД 1): растительные волокна, лучший — псиллиум; раздел 3.2: макрогол (УУР А, УДД 1) и лактулоза (УУР С, УДД 4) — первая линия, контактные слабительные — не дольше 2 недель, пробиотики (УУР А, УДД 1), прукалоприд — при неудаче слабительных; раздел 6: плановая помощь; критерии качества 1–5; полосы, сроки и доли — игровая оценка" }
review: draft
