id: cond.alcoholic_hepatitis
name: { ru: "Алкогольный гепатит" }
# «прогрессирующее воспалительно-дистрофическое поражение печени, которое может развиться на любом этапе АБП при длительном
# систематическом употреблении опасных доз этанола» (spec 2026-10-chapter-4, часть 54б; 711_2, раздел 1.6). МКБ-10 — K70.1
# (раздел 1.4). В игре — желтушная форма: с ней приходят; без желтухи гепатит находят только в анализах
icd10: K70.1
department: dept.therapy
system: digestive
kind: disease
severity: serious
epidemiology:
  # долей в 711_2 нет: при биопсии у злоупотребляющих алкоголем гепатит находят у 8,5 % (раздел 2.4). Полоса подобрана прогоном
  # генератора — игровая оценка
  prevalence: uncommon
  # после лет систематического пьянства — игровая оценка: возраста в 711_2 нет
  age: { min: 25 }
  # «АБП диагностируется практически у всех пациентов с алкогольной зависимостью» (раздел 1.2): в игре гепатит — только при ней
  requires: [cond.alcohol_dependence]
  # «В большинстве случаев тяжелый алкогольный гепатит развивается на фоне алкогольного цирроза печени» (раздел 1.5): доли нет —
  # множитель игровой, у половины больных гепатитом есть цирроз
  risks: [ { id: cond.cirrhosis, x: 24 } ]
params:
  # две формы — стеатогепатит и тяжёлый гепатит (раздел 1.5); тяжёлый — индекс Маддрея 32 и больше (раздел 3.3, приложение Г4).
  # Доли — игровая оценка; скорая везёт тяжёлый чаще (economy.yaml, `ambulance.severe`)
  severity: { mild: 60, severe: 40 }
course:
  stages:
    - { id: icteric, days: [0, 21] }
  # «быстрым прогрессированием печеночной недостаточности, развитием желтухи» (раздел 1.5): сроков нет — игровая оценка
  presentation: [3, 10]
  # нетяжёлый (индекс Маддрея меньше 32) — умирают за 3 месяца «менее чем у 10%» (приложение Г4): без алкоголя проходит
  selfLimiting: { when: { severity: [mild] } }
  # тяжёлый — летальность 30–50 % (раздел 1.5); без глюкокортикоидов к 28-му дню выживает 52 % (приложение Г7, шкала GAHS)
  untreated: { band: often, days: [7, 28], when: { severity: [severe] } }
  # длительности госпитализации в 711_2 нет — игровая оценка
  stay: [10, 21]
findings:
  - f: sym.yellow_skin
    band: { pct: 100 }
    note: "в игре — желтушная форма: «Больные могут предъявлять жалобы на желтушное окрашивание кожи и склер» (711_2, раздел 1.6)"
  - f: sign.jaundice
    band: { pct: 100 }
    note: "желтуха — у каждого, кто пришёл с гепатитом в игре; она же показание к госпитализации (711_2, раздел 6)"
  - f: lab.bilirubin_high
    band: { pct: 100 }
    note: "при желтухе билирубин повышен у каждого: гипербилирубинемия «с преобладанием как прямой фракции билирубина…, так и непрямой» (711_2, раздел 2.3)"
  # прямой билирубин окрашивает мочу (раздел 2.3); полоса — игровая оценка
  - { f: sym.dark_urine, band: often }
  # «реакциями острой фазы, к которым относят: лихорадку, общую слабость, артралгии, миалгии» (раздел 1.6); полосы — игровая
  # оценка: частот в 711_2 нет
  - { f: sym.fatigue, band: usually }
  - { f: vital.fever, band: often }
  # этанол «вызывает снижение аппетита вследствие собственной высокой калорийности» (раздел 1.2)
  - { f: sym.anorexia, band: often }
  # отёк печени растягивает её капсулу — «болью в правом подреберье» (раздел 1.6); печень «увеличенную, иногда болезненную при
  # пальпации» (раздел 2.2)
  - { f: sym.ruq_pain, band: often }
  - { f: sign.hepatomegaly, band: usually }
  - { f: sign.ruq_tenderness, band: sometimes }
  # «нередко обнаруживают стигмы длительного злоупотребления алкоголем»: телеангиэктазии, пальмарную эритему (раздел 2.2)
  - { f: sign.spider_angiomas, band: often }
  - { f: sign.palmar_erythema, band: often }
  # «иногда наблюдаются отеки и увеличение объема живота за счет асцита» (раздел 1.6)
  - { f: sign.leg_edema_bilateral, band: sometimes }
  # АЛТ и АСТ «более чем в два раза превышает норму, но редко бывает более 300» (раздел 2.3)
  - { f: lab.alt_high, band: usually }
  # «Как правило, уровень АСТ выше, чем АЛТ (индекс де Ритиса – АСТ/АЛТ > 1.)» (раздел 2.3)
  - { f: lab.ast_over_alt, band: usually }
  # «при выраженном некровоспалительном процессе в печени в анализах крови может наблюдаться нейтрофильный лейкоцитоз» (раздел
  # 2.3): у тяжёлого — чаще, полосы игровые
  - { f: lab.wbc_high, band: sometimes, when: { severity: [mild] } }
  - { f: lab.wbc_high, band: usually, when: { severity: [severe] } }
  # индекс Маддрея — по протромбиновому времени и билирубину (приложение Г4): в игре тяжёлый — оба за порогом
  - f: lab.bilirubin_200
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "тяжёлый гепатит — индекс Маддрея 32 и больше из билирубина и протромбинового времени (711_2, приложение Г4): в игре — билирубин выше 200 мкмоль/л, как в шкале GAHS (приложение Г7: 125–250 и больше)"
  - f: lab.pti_low
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "тяжёлый гепатит — «нарушением свертываемости крови» (711_2, раздел 1.5); протромбиновое время входит в индекс Маддрея (приложение Г4)"
# биохимия крови — всем с АБП (раздел 2.3, УУР С, УДД 5; критерий качества 2): билирубин, АЛТ и АСТ
confirm: [exam.liver_panel]
# «острые вирусные гепатиты» — в круге дифференциального диагноза (раздел 2.5)
differential: [cond.hepatitis_a, cond.hepatitis_b]
treatment:
  # отказ от алкоголя — «единственный этиотропный вариант терапии» (раздел 3.1, УУР C, УДД 4) и калорийная еда с большим
  # количеством белка (раздел 3.2, УУР С, УДД 5; критерий качества 7 — диетическое питание при заболеваниях печени)
  firstLine: [tx.liver_diet]
  acceptable: []
  # адеметионин — при АБП (раздел 3.3; критерий качества 10), при тяжёлом — вместе с преднизолоном (УУР В, УДД 2); тиамина у
  # пьющих не хватает «у подавляющего большинства» (раздел 3.2)
  supportive: [tx.ademetionine, tx.thiamine]
  notIndicated: []
  # «повышенная чувствительность злоупотребляющих алкоголем лиц к некоторым лекарственным препаратам (например, нестероидным
  # противовоспалительным средствам, анальгезирующим препаратам, в частности к парацетамолу)» (раздел 1.2)
  harmful: [tx.ibuprofen, tx.paracetamol]
  # к психиатру-наркологу — при подозрении на зависимость (раздел 3.1, УУР C, УДД 5): в игре гепатит — только при ней
  require: [tx.narcologist_consult]
  byParam:
    # тяжёлый, индекс Маддрея 32 и больше, — при отсутствии активной инфекции глюкокортикоид (раздел 3.3, УУР C, УДД 5;
    # критерий качества 8 — «коротким курсом»)
    - when: { severity: [severe] }
      require: [tx.steroid_systemic_short]
    # нетяжёлый — показаний к нему нет: порог — Маддрей 32 (раздел 2.5.2)
    - when: { severity: [mild] }
      notIndicated: [tx.steroid_systemic_short]
  # желтуха — показание к госпитализации, «в терапевтический или хирургический блок…, по показаниям – в отделение интенсивной
  # терапии и реанимации» (раздел 6); тяжёлый — летальность 30–50 % (раздел 1.5): ПИТ не ошибка, игровая оценка
  setting:
    default: ward
    also:
      - { when: { severity: [severe] }, settings: [icu] }
texts:
  summary:
    ru: >-
      Воспаление печени от многолетнего пьянства, часто на фоне цирроза. Желтеют глаза и кожа, слабость, температура, тяжесть
      под правыми рёбрами, печень увеличена; в анализах высокий билирубин, АСТ выше АЛТ. Тяжесть считают по индексу Маддрея — из
      билирубина и протромбинового времени. Каждому — отказ от алкоголя, калорийная еда с белком и нарколог; при тяжёлом —
      преднизолон, без него умирает до половины больных. Лечат в стационаре.
pearls:
  - ru: "Желтуха у пьющего и АСТ выше АЛТ — думайте об алкогольном гепатите, но маркёры вирусных гепатитов всё равно проверьте."
  - ru: "Индекс Маддрея 32 и больше — тяжёлый гепатит: преднизолон, если нет инфекции и кровотечения. Для индекса нужны билирубин и протромбиновое время."
  - ru: "Пьющему с больной печенью — ни парацетамола, ни ибупрофена: у злоупотребляющих алкоголем они опаснее."
simplified: "В игре — желтушная форма: стеатоза и гепатита без желтухи нет. Тяжесть — по билирубину и протромбиновому индексу, сам индекс Маддрея, MELD и шкалу GAHS не считают; индекс Лилль на 7-й день, отмена преднизолона без ответа и трансплантация печени — за пределами смены. Инфекцию и кровотечение перед преднизолоном не ищут: у больного в игре их нет. Асцита и энцефалопатии при гепатите нет: в игре это осложнения цирроза, у них свои записи."
sources:
  - { kind: guideline, title: "Алкогольная болезнь печени", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/711_2", note: "ID 711_2, опубликованы 30.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.2: АБП почти у всех с алкогольной зависимостью, этанол снижает аппетит, повышенная чувствительность пьющих к НПВП и парацетамолу; раздел 1.4: K70.1; раздел 1.5: стеатогепатит и тяжёлый гепатит, летальность тяжёлого 30–50 %, чаще на фоне цирроза; раздел 1.6: лихорадка, слабость, боль в правом подреберье, желтуха; раздел 2.2: увеличенная печень, стигмы; раздел 2.3: билирубин, АСТ выше АЛТ, нейтрофильный лейкоцитоз, коагулограмма; раздел 2.4: при биопсии у пьющих гепатит — у 8,5 %; раздел 2.5: дифференциальный диагноз; раздел 3.1: отказ от алкоголя (УУР C, УДД 4), нарколог (УУР C, УДД 5); раздел 3.2: калорийная еда с белком (УУР С, УДД 5); раздел 3.3: преднизолон при индексе Маддрея 32 и больше без активной инфекции (УУР C, УДД 5), с адеметионином (УУР В, УДД 2); раздел 6: желтуха — госпитализация, по показаниям — ОРИТ; приложения Г4 и Г7: летальность по Маддрею и GAHS; критерии качества 2, 7, 8, 10; доли тяжести, полосы признаков, возраст, множитель цирроза и срок госпитализации — игровая оценка" }
review: draft
