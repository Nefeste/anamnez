id: cond.ibs
name: { ru: "Синдром раздражённого кишечника" }
# «хроническое функциональное заболевание кишечника, при котором боль в животе связана с дефекацией, изменением частоты и
# характера стула» (spec 2026-10-chapter-4, часть 55б; 892_1, раздел 1.1). МКБ-10 — K58 (раздел 1.4: K58.0–K58.9 по
# вариантам). Диагноз — по Римским критериям IV, без «симптомов тревоги», после исключения органических болезней (раздел 2)
icd10: K58
department: dept.therapy
system: digestive
kind: disease
severity: minor
epidemiology:
  # «СРК страдают от 10 до 13% населения», к врачу идут «лишь 25-30%» (892_1, раздел 1.3); полоса подобрана прогоном
  # генератора — игровая оценка
  prevalence: uncommon
  # «Данным заболеванием чаще страдают женщины, а диагноз СРК в большинстве случаев устанавливается в возрасте от 30 до 50
  # лет» (раздел 1.3); соотношения полов в тексте нет — игровая оценка
  age: { min: 18, peak: [30, 50] }
  sex: { m: 0.5, f: 1 }
params:
  # варианты по Бристольской шкале (раздел 1.5): с диареей, с запором, смешанный; неклассифицируемого в игре нет. Долей в 892_1
  # нет — игровая оценка
  variant: { diarrhea: 35, constipation: 35, mixed: 30 }
course:
  stages:
    - { id: active, days: [0, 3650] }
  # Римские критерии IV: «последние 3 месяца при общей продолжительности не менее 6 месяцев» (раздел 2)
  presentation: [180, 1825]
  # «у большинства пациентов с СРК симптомы, несмотря на проводимое лечение, сохраняются, но не усиливаются» (раздел 7)
  untreated: { band: never, days: [7, 7] }
findings:
  - f: sym.abdominal_pain
    band: { pct: 100 }
    note: "по определению: Римские критерии IV — повторяющаяся боль в животе раз в неделю и чаще (892_1, раздел 2)"
  - f: sym.pain_with_stool
    band: { pct: 100 }
    note: "по определению: боль связана с дефекацией, частотой или формой стула, полгода и дольше (892_1, раздел 2)"
  - f: sym.diarrhea
    band: { pct: 100 }
    when: { variant: [diarrhea, mixed] }
    note: "по определению варианта: больше 25 % дефекаций — 6–7 тип по Бристольской шкале (892_1, раздел 1.5)"
  - f: sym.constipation
    band: { pct: 100 }
    when: { variant: [constipation, mixed] }
    note: "по определению варианта: больше 25 % дефекаций — 1–2 тип по Бристольской шкале (892_1, раздел 1.5)"
  - f: sym.constipation_long
    band: { pct: 100 }
    when: { variant: [constipation, mixed] }
    note: "запор при СРК — столько же, сколько сам СРК: полгода и дольше (892_1, разделы 1.5 и 2)"
  # «Ощущение вздутия живота менее выражено в утренние часы, нарастает в течение дня» (раздел 1.6); частоты нет — игровая
  # оценка. Симптомов тревоги — похудания, ночных симптомов, лихорадки, анемии, крови в кале — при СРК нет (раздел 2)
  - { f: sym.bloating, band: often }
# колоноскопия с биопсией — «всем взрослым пациентам с СРК … для исключения органических заболеваний» (раздел 2.4, УУР В, УДД
# 3); критерий качества 1. Как ЭГДС у язвенной болезни: без неё диагноз не подтверждён
confirm: [exam.colonoscopy]
# «отсутствуют органические изменения» — колита на колоноскопии при СРК не бывает (раздел 2)
masks: [img.colon_uc]
# запор с нормальным транзитом — это СРК с запором (274_3, раздел 1.2); антибиотико-ассоциированная диарея (892_1, раздел
# 2.3) и дивертикулит (раздел 2.5) — в дифференциальном ряду
differential: [cond.constipation, cond.cdiff, cond.diverticulitis]
treatment:
  # «первой линии» в 892_1 нет: штаммоспецифические пробиотики — при любом варианте, «для уменьшения выраженности симптомов»
  # (раздел 3.3, УУР A, УДД 1)
  firstLine: [tx.probiotic]
  acceptable: []
  # регулярное питание, пищевой дневник, умеренные нагрузки (раздел 3.2, без УУР)
  supportive: [tx.lifestyle]
  notIndicated: []
  harmful: []
  plan: [tx.probiotic]
  # спазмолитик АТХ A03 при боли (раздел 3.3, УУР A, УДД 1) — критерий качества 2, каждому: мебеверин — взрослым (УУР В, УДД
  # 3); дротаверин — тоже A03 (A03AD02), по имени в 892_1 не назван — можно
  require: [[tx.mebeverine, tx.drotaverine]]
  byParam:
    # СРК с диареей — критерий качества 3: лоперамид (УУР B, УДД 2), #рифаксимин курсом 10 дней (УУР A, УДД 1) и/или
    # пробиотики; слабительные — не по показаниям, игровая оценка
    - when: { variant: [diarrhea] }
      notIndicated: [tx.macrogol, tx.lactulose]
      require: [[tx.loperamide, tx.rifaximin, tx.probiotic]]
    # СРК с запором — критерий качества 4: слабительные, увеличивающие объём (УУР B, УДД 2), осмотические (УУР C, УДД 5);
    # лоперамид закрепляет — не по показаниям, игровая оценка
    - when: { variant: [constipation] }
      notIndicated: [tx.loperamide]
      require: [[tx.psyllium, tx.macrogol, tx.lactulose]]
  # ведут амбулаторно гастроэнтеролог и колопроктолог (раздел 6); экстренной госпитализации взрослых в 892_1 нет
  setting: { default: home }
texts:
  summary:
    ru: >-
      Хроническое функциональное расстройство кишечника: боль в животе раз в неделю и чаще, связанная со стулом, — полгода и
      дольше; после дефекации она стихает, меняются частота и вид стула. Бывает с диареей, с запором и смешанный. Симптомов
      тревоги нет — похудания, ночных симптомов, лихорадки, крови в кале, анемии. Колоноскопию делают всем взрослым, чтобы
      исключить органическое заболевание. Лечат дома: спазмолитик от боли, а по варианту — лоперамид, рифаксимин или пробиотик
      при диарее, слабительное при запоре.
pearls:
  - ru: "Боль в животе, которая стихает после стула, и стул то чаще, то реже — раз в неделю и чаще, полгода и дольше: это Римские критерии IV синдрома раздражённого кишечника."
  - ru: "Похудание, ночные симптомы, лихорадка, кровь в кале, анемия, начало в пожилом возрасте — симптомы тревоги: это не СРК, пока не исключено органическое заболевание."
  - ru: "Лоперамид при СРК с диареей уменьшает понос, но не боль: спазмолитик нужен всё равно."
simplified: "Неклассифицируемого варианта нет. Из анализов кала — только токсины C. difficile; кальпротектина, антител к тканевой трансглутаминазе, дыхательного теста, УЗИ и ЭГДС нет. Колоноскопию делают в тот же день, подготовка — в минутах процедуры. Амитриптилин, прукалоприд, психотерапия и психиатр — когда первое лечение не помогло, за пределами одного приёма; тримебутина и масла мяты нет."
sources:
  - { kind: guideline, title: "Синдром раздраженного кишечника", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/892_1", note: "ID 892_1, опубликованы 26.12.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.1: определение; раздел 1.3: 10–13 % населения, к врачу — 25–30 %, чаще женщины, диагноз в 30–50 лет, риск рака и ВЗК не повышен; раздел 1.5: варианты по Бристольской шкале; раздел 1.6: вздутие нарастает к вечеру, диарея утром, ночью её нет, кровь и гной в стуле не характерны; раздел 2: Римские критерии IV, симптомы тревоги, СРК — диагноз исключения; раздел 2.2: осмотр перианальной области и пальцевое исследование; раздел 2.3: ОАК, СРБ, биохимия — всем (УУР B, УДД 3), при диарее — токсины C. difficile (УУР C, УДД 4); раздел 2.4 (УУР В, УДД 3): колоноскопия с биопсией всем взрослым; раздел 3.3: спазмолитики (УУР A, УДД 1), мебеверин (УУР В, УДД 3), лоперамид (УУР B, УДД 2), рифаксимин (УУР A, УДД 1), слабительные при запоре (УУР B, УДД 2 и УУР C, УДД 5), пробиотики (УУР A, УДД 1); раздел 6: амбулаторно; раздел 7: симптомы сохраняются, но не усиливаются; критерии качества 1–4; доли вариантов, соотношение полов, полосы и сроки — игровая оценка" }
review: draft
