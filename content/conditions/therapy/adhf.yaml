id: cond.adhf
name: { ru: "Острая декомпенсация сердечной недостаточности" }
# I50.0 — застойная сердечная недостаточность, I50.1 — левожелудочковая (отёк лёгких); одна запись на обе — I50.0
icd10: I50.0
department: dept.therapy
system: heart
kind: disease
severity: critical
epidemiology:
  # частоты ОДСН в 156_2 нет; у скорой в игре — примерно как ОКС: игровая оценка, полоса подобрана прогоном генератора
  prevalence: very_rare
  # ХСН — болезнь пожилых (156_2, раздел 1.3); границы и пик — игровая оценка
  age: { min: 40, peak: [65, 90] }
  sex: { m: 1, f: 1 }
  # ХСН уже была у 64 из 100 (ALARM-HF: впервые — 36,2 %): множитель подобран прогоном генератора. Причины
  # декомпенсации (156_2, раздел 7.1): тахиаритмия, ишемия, НПВП, алкоголь — множители игровые
  risks:
    - { id: risk.heart_failure, x: 150 }
    - { id: risk.atrial_fibrillation, x: 2 }
    - { id: risk.vascular, x: 2 }
    - { id: risk.nsaid_use, x: 1.5 }
    - { id: risk.alcohol, x: 1.5 }
params:
  # форма (ALARM-HF, 4953 больных): декомпенсация с застоем — 38,6 %, отёк лёгких — 36,7 %, кардиогенный шок — 11,7 %;
  # три главные, на 100. «Холодный» — гипоперфузия (156_2, табл. 13), шок — её край
  type: { congestion: 44, edema: 42, cold: 14 }
  # производные — доли для вывода, пока не мерили: игровая оценка по прогону генератора
  spo2_below90: { no: 60, yes: 40 }
  rr_above25: { no: 65, yes: 35 }
  icu: { no: 35, yes: 65 }
derived:
  # гипоксемия — SpO₂ < 90 % (156_2, раздел 7.4.1.2: кислород)
  spo2_below90: { f: vital.spo2_low, below: 90 }
  # дыхательная недостаточность — частота дыхания выше 25 (раздел 7.4.1.2: НИВЛ; раздел 6: ПИТ)
  rr_above25: { f: vital.tachypnea, above: 25 }
  # ПИТ (раздел 6): отёк лёгких, гипоперфузия, частота дыхания выше 25, сатурация ниже 90 % несмотря на кислород — в
  # игре ниже 90 до кислорода
  icu: { any: { type: [edema, cold], rr_above25: [yes], spo2_below90: [yes] } }
course:
  stages:
    - { id: acute, days: [0, 7] }
  # приходят в первые дни нарастания одышки — игровая оценка
  presentation: [0, 2]
  # без лечения: шок и отёк лёгких — хуже в первые сутки, застой — за несколько дней; доли и сроки — игровая оценка
  # (ALARM-HF: в стационаре умерли 12 %, больше всего — при кардиогенном шоке)
  untreated:
    - { band: always, days: [0, 1], when: { type: [cold] } }
    - { band: usually, days: [0, 1], when: { type: [edema] } }
    - { band: often, days: [1, 5], when: { type: [congestion] } }
  # длительности госпитализации в 156_2 нет — игровая оценка
  stay: [7, 12]
findings:
  # одышка — чувствительность 89 % (156_2, раздел 1.6)
  - f: sym.dyspnea
    band: { pct: 89 }
    note: "одышка — единственный симптом с высокой чувствительностью: 89 % (156_2, раздел 1.6)"
  # ортопноэ: специфичность 89 %, чувствительность низкая (раздел 1.6); при отёке лёгких — почти всегда: игровая оценка
  - { f: sym.orthopnea, band: usually, when: { type: [edema] } }
  - { f: sym.orthopnea, band: sometimes, when: { type: [congestion, cold] } }
  # отёки обеих ног — чувствительность 53 % (раздел 1.6); при накоплении жидкости — чаще
  - f: sign.leg_edema_bilateral
    band: { pct: 70 }
    when: { type: [congestion] }
    note: "отёки — у 53 из 100 больных СН (156_2, раздел 1.6: чувствительность 53 %); по формам — игровая оценка: при накоплении жидкости чаще"
  - f: sign.leg_edema_bilateral
    band: { pct: 35 }
    when: { type: [edema, cold] }
    note: "отёки — у 53 из 100 больных СН (156_2, раздел 1.6); при отёке лёгких и гипоперфузии без накопления жидкости — реже: игровая оценка"
  # набухшие шейные вены — застой по большому кругу (раздел 7.3.1); доли — игровая оценка
  - { f: sign.neck_veins_distended, band: often, when: { type: [congestion, cold] } }
  - { f: sign.neck_veins_distended, band: sometimes, when: { type: [edema] } }
  # влажные хрипы внизу обоих лёгких (раздел 7.3.1); при отёке лёгких — и над всеми полями. Доли — игровая оценка
  - { f: sign.crackles_bilateral, band: always, when: { type: [edema] } }
  - { f: sign.crackles_bilateral, band: usually, when: { type: [congestion, cold] } }
  - { f: sign.crackles_diffuse, band: usually, when: { type: [edema] } }
  # гипоперфузия — по определению «холодного» (табл. 13); гипотония — часто, но не всегда (раздел 7.3.1)
  - f: sign.cold_clammy
    band: { pct: 100 }
    when: { type: [cold] }
    note: "«холодный» профиль — по определению: холодные влажные конечности, слабый пульс (156_2, раздел 7.3.1, табл. 13)"
  - { f: vital.bp_low, band: usually, when: { type: [cold] } }
  # высокое давление — частая причина отёка лёгких (раздел 7.3.1: быстрое повышение АД); доли — игровая оценка
  - { f: vital.bp_high, band: usually, when: { type: [edema] } }
  - { f: vital.bp_high, band: sometimes, when: { type: [congestion] } }
  # частое дыхание, низкая сатурация, частый пульс (раздел 7.3.2: что оценить при поступлении); доли — игровая оценка
  - { f: vital.tachypnea, band: always, when: { type: [edema] } }
  - { f: vital.tachypnea, band: usually, when: { type: [congestion, cold] } }
  - { f: vital.spo2_low, band: usually, when: { type: [edema, cold] } }
  - { f: vital.spo2_low, band: often, when: { type: [congestion] } }
  - { f: vital.tachycardia, band: often }
  # натрийуретический пептид — у больного ОДСН повышен; ложно низкий (ожирение, молниеносное начало, раздел 7.3.2) — в
  # чувствительности анализа (ICON — 90 %)
  - f: lab.ntprobnp_high
    band: { pct: 100 }
    note: "NT-proBNP за ОДСН — выше порога для возраста (156_2, раздел 7.3.2); чувствительность анализа — 90 % (ICON)"
  # застой на снимке — у каждого больного ОДСН; пропуск каждого пятого (Collins 2006) — в точности снимка; при отёке
  # лёгких — и сам отёк
  - f: img.cxr_congestion
    band: { pct: 100 }
    note: "застой — главное, что ищут на снимке при ОДСН (156_2, раздел 7.3.2); без застоя на снимке — 18,7 % (Collins 2006)"
  - f: img.cxr_edema
    band: { pct: 100 }
    when: { type: [edema] }
    note: "отёк лёгких на снимке — по определению формы (156_2, раздел 7.3.2: верификация отёка лёгких); пропуск — в точности снимка"
  # тень сердца шире половины — у многих с ХСН (раздел 2.4); доля — игровая оценка
  - { f: img.cxr_cardiomegaly, band: often }
  # тропонин «практически всегда является повышенным» (раздел 7.3.2) — выше порога инфаркта 52 нг/л реже и без прироста
  # за час: доля — игровая оценка
  - { f: lab.troponin_high, band: sometimes }
confirm: [exam.nt_probnp]
redFlags: [vital.bp_low, sign.cold_clammy, sign.crackles_diffuse]
# с чем спутать при одышке чаще всего — пневмония и обострение ХОБЛ (156_2, раздел 7.3.2); у ОКС и ТЭЛА списки уже по
# три, ОКС находится по сходству признаков
differential: [cond.pneumonia_cap, cond.copd_exacerbation]
treatment:
  # с застоем — петлевой диуретик в вену (156_2, раздел 7.4.1.2; критерий качества 8 специализированной помощи);
  # вазодилататор в вену — при САД выше 110 без гипоперфузии «может быть рекомендовано» (раздел 7.4.1.5); профилактика
  # тромбоэмболий — НМГ под кожу (раздел 7.4.2). Морфин рутинно не рекомендуется (раздел 7.4.1.5); НПВП и верапамил при
  # ХСН — не рекомендуются (раздел 3.1.4: задержка жидкости, отрицательное инотропное действие)
  firstLine: [tx.furosemide_iv]
  acceptable: [tx.nitroglycerin_iv]
  supportive: [tx.lmwh]
  plan: [tx.furosemide_iv, tx.lmwh]
  notIndicated: [tx.morphine_iv, tx.amoxicillin, tx.amoxicillin_clavulanate, tx.macrolide, tx.thrombolysis, tx.thrombolysis_pe, tx.thrombolysis_stroke]
  harmful: [tx.ibuprofen, tx.verapamil, tx.verapamil_iv]
  byParam:
    # тёплый с застоем или отёком — диуретик обязательно; капельница — лишняя жидкость (игровое правило по разделу
    # 7.4.1.2: перегрузка жидкостью)
    - when: { type: [congestion, edema] }
      require: [tx.furosemide_iv]
      harmful: [tx.iv_fluids]
    # отёк лёгких: вазодилататор при высоком давлении (раздел 7.4.1.2) и НИВЛ — «скорейшее начало»; морфин — с
    # осторожностью при выраженной одышке (раздел 7.4.1.5)
    - when: { type: [edema] }
      firstLine: [tx.nitroglycerin_iv]
      acceptable: [tx.morphine_iv]
      plan: [tx.nitroglycerin_iv, tx.lmwh]
      require: [tx.cpap]
    # гипоперфузия: инотроп в вену — в игре допамин (раздел 7.4.1.5: добутамин, допамин, левосимендан); диуретик до
    # устранения гипоперфузии, вазодилататор и НИВЛ при гипотонии — не рекомендуются (разделы 7.4.1.2 и 7.4.1.5). С
    # частью 47 (spec 2026-10-chapter-4) — или норэпинефрин: при кардиогенном шоке вазопрессоры, «предпочтительно
    # норэпинефрина» (раздел 7.4.1.5, ЕОК IIbB); из группы хватит одного
    - when: { type: [cold] }
      harmful: [tx.furosemide_iv, tx.nitroglycerin_iv, tx.cpap, tx.morphine_iv]
      plan: [tx.lmwh]
      require: [[tx.dopamine, tx.norepinephrine]]
    # дыхательная недостаточность у тёплого — НИВЛ (раздел 7.4.1.2: ЧДД > 25, SpO₂ < 90 %)
    - when: { type: [congestion], rr_above25: [yes] }
      require: [tx.cpap]
    - when: { type: [congestion], spo2_below90: [yes] }
      require: [tx.cpap]
    # кислород — при сатурации ниже 90 % (раздел 7.4.1.2)
    - when: { spo2_below90: [yes] }
      require: [tx.oxygen_mask]
  # где лечить (раздел 6): декомпенсацию — в стационар; ПИТ — отёк лёгких, гипоперфузия, частота дыхания выше 25,
  # сатурация ниже 90 %; без своей ПИТ — «Вызвать скорую». Домой — нет
  setting:
    default: ward
    param: { name: icu, map: { yes: icu, no: ward } }
    redFlag: icu
texts:
  summary:
    ru: >-
      Сердце, которое давно работает плохо, перестаёт справляться: нарастают одышка и отёки ног,
      лёжа нечем дышать, в лёгких — влажные хрипы, при отёке лёгких — удушье. Подтверждает NT-proBNP
      выше порога для возраста, на снимке — застой. При тёплой коже и застое — фуросемид в вену, при
      отёке лёгких — ещё нитроглицерин в вену и маска CPAP. При холодной влажной коже и низком
      давлении мочегонное сначала вредно: нужны инотроп и палата интенсивной терапии. Лечат в
      стационаре, при отёке лёгких, частом дыхании и низкой сатурации — в ПИТ.
pearls:
  - ru: "Одышка с отёками обеих ног в пожилом возрасте или при ХСН — NT-proBNP и снимок груди: ниже 300 пг/мл острая сердечная недостаточность исключена."
  - ru: "Сначала потрогайте руки: холодные и влажные — мочегонное и нитроглицерин подождут, нужен инотроп."
  - ru: "Тропонин при декомпенсации часто повышен и без инфаркта — смотрите ЭКГ и прирост через час."
simplified: "Форм три — застой, отёк лёгких и «холодная» с гипоперфузией; «тёплая сухая» и правожелудочковая недостаточность не выделены. Нитроглицерин — без порога давления 110: у тёплых форм давление не низкое. ЭхоКГ, УЗИ лёгких, натрий мочи и ответ на диуретик, лактат и газы крови не делают. Инотроп в игре один — допамин, при «холодной» форме вместо него можно норэпинефрин; добутамина, левосимендана, ВАБК и механической поддержки кровообращения нет, ИВЛ при ОДСН в игре не назначают. Аппарат НИВЛ отдельно не покупается: маску CPAP ставят у постели под монитором. Сатурация ниже 90 % — до кислорода, без «несмотря на кислород»; впервые возникшая ОСН и декомпенсация прежней ХСН лечатся одинаково; бета-адреноблокаторы, иАПФ и выписка на таблетках — без особенностей."
sources:
  - { kind: guideline, title: "Хроническая сердечная недостаточность", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/156_2", note: "ID 156_2, опубликованы 07.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6: одышка — чувствительность 89 %, ортопноэ — специфичность 89 %, отёки — 53/72 %; раздел 3.1.4: НПВП и недигидропиридиновые блокаторы кальциевых каналов при ХСН не рекомендуются; раздел 6: госпитализация при декомпенсации, признаки для ПИТ; раздел 7.1: причины декомпенсации; раздел 7.3.1, табл. 13: застой и гипоперфузия, профили; раздел 7.3.2: ЭКГ, рентгенография, NT-proBNP с порогами по возрасту, тропонин практически всегда повышен; раздел 7.4.1.2: кислород при SpO₂ < 90 %, НИВЛ при ЧДД > 25 и SpO₂ < 90 % и при отёке лёгких, не при гипотонии; петлевые диуретики в вену при накоплении жидкости, не до ликвидации гипоперфузии; раздел 7.4.1.5: вазодилататоры при САД > 110, морфин — не рутинно, инотропы — при гипотонии и гипоперфузии; раздел 7.4.2: профилактика тромбоэмболий; критерий качества 8 (табл. 19); доли форм признаков и сроки течения — игровая оценка" }
  - { kind: paper, title: "Follath F, Yilmaz MB, Delgado JF и др. Clinical presentation, management and outcomes in the Acute Heart Failure Global Survey of Standard Treatment (ALARM-HF). Intensive Care Med 2011;37(4):619–626", url: "https://pubmed.ncbi.nlm.nih.gov/21210078/", note: "PMID 21210078, сверено 05.10.2026: 4953 больных — декомпенсация с застоем 38,6 %, отёк лёгких 36,7 %, кардиогенный шок 11,7 %; впервые — 36,2 %; диуретики в вену — 89,7 %, вазодилататоры — 41,1 %, инотропы — 39 %; умерли в стационаре 12 %" }
  - { kind: paper, title: "Januzzi JL, van Kimmenade R, Lainchbury J и др. NT-proBNP testing for diagnosis and short-term prognosis in acute destabilized heart failure: an international pooled analysis of 1256 patients: the International Collaborative of NT-proBNP Study. Eur Heart J 2006;27(3):330–337", url: "https://pubmed.ncbi.nlm.nih.gov/16293638/", note: "PMID 16293638, сверено 05.10.2026: пороги по возрасту 450, 900 и 1800 пг/мл — чувствительность 90 %, специфичность 84 %" }
  - { kind: paper, title: "Collins SP, Lindsell CJ, Storrow AB, Abraham WT. Prevalence of negative chest radiography results in the emergency department patient with decompensated heart failure. Ann Emerg Med 2006;47(1):13–18", url: "https://pubmed.ncbi.nlm.nih.gov/16387212/", note: "PMID 16387212, сверено 05.10.2026: у 18,7 % больных декомпенсацией СН на снимке в приёмном нет застоя" }
review: draft
