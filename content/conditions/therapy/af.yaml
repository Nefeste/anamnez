id: cond.af
name: { ru: "Фибрилляция и трепетание предсердий" }
icd10: I48
department: dept.therapy
system: heart
kind: disease
severity: serious
# пароксизм с сердцебиением (spec 2026-10-chapter-3, часть 42а): приходят сами и привозит скорая. Возраст и
# множители — игровая оценка: после 55 лет ФП — у 6,65 %, к 75 годам — у 10–12,8 % (382_2, раздел 1.3)
epidemiology:
  prevalence: rare
  age: { min: 40, peak: [60, 85] }
  risks:
    - { id: risk.atrial_fibrillation, x: 5 }
    - { id: cond.hypertension, x: 2 }
    - { id: risk.heart_failure, x: 3 }
    - { id: cond.diabetes2, x: 1.5 }
    - { id: risk.alcohol, x: 1.5 }
    - { id: risk.obesity, x: 1.5 }
params:
  # фибрилляция или трепетание — игровая оценка: в 382_2 долей нет; тактика у них одна (раздел 3.1.1.2)
  type: { fibrillation: 85, flutter: 15 }
  # нестабильный — гипотония с симптомами, обморок, ишемия, отёк лёгких (раздел 3.1.2.2): в игре — давление
  # ниже 90; доля — игровая оценка
  unstable: { yes: 10, no: 90 }
  # производные — доли для вывода, пока о начале не спросили и пунктов шкалы не знают: по часам от начала ниже
  # и по прогону генератора (60 000 пришедших в терапию: CHA₂DS₂-VASc с порога — у 43 %)
  recent: { yes: 65, no: 35 }
  oac: { yes: 43, no: 57 }
derived:
  # меньше 48 часов — ритм можно восстанавливать сразу; 48 и больше — только после трёх недель
  # антикоагулянта (раздел 3.1.1.2)
  recent: { f: hx.onset_hours, below: 48 }
  # антикоагулянт постоянно — мужчинам с 2 баллов CHA₂DS₂-VASc, женщинам с 3 (раздел 3.1.1.1)
  oac: rule.cha2ds2vasc
course:
  stages:
    - { id: acute, days: [0, 2] }
  presentation: [0, 0]
  # стабильный пароксизм меньше 48 часов часто проходит сам: «многие пароксизмы ФП могут купироваться
  # самостоятельно в течение нескольких часов» (раздел 3.1.2.2)
  selfLimiting: { when: { recent: [yes], unstable: [no] } }
  # без урежения и без разряда — хуже: игровая оценка
  untreated:
    - { band: always, days: [0, 1], when: { unstable: [yes] } }
    - { band: sometimes, days: [1, 3], when: { recent: [yes] } }
    - { band: often, days: [2, 7] }
  # в ПИТ после кардиоверсии — 1–3 суток: игровая оценка, в 382_2 срока нет
  stay: [1, 3]
  # часов от начала до прихода — игровая оценка: в 382_2 долей нет; пароксизм чаще проходит за 48 часов
  # (раздел 1.5), меньше 48 часов — около двух третей
  onset:
    f: hx.onset_hours
    hours: [[12, 35], [48, 30], [168, 25], [336, 10]]
findings:
  - f: sym.palpitations
    band: { pct: 100 }
    attrs: { rhythm: { irregular: 100 } }
    note: "с чем приходят: в игре фибрилляция и трепетание — с сердцебиением у каждого, бессимптомной формы нет"
  - f: hx.onset_hours
    band: { pct: 100 }
    note: "когда началось, больной называет при расспросе — у каждого: «не знаю, когда началось» в игре нет"
  - f: ecg.af
    band: { pct: 100 }
    attrs: { kind: $type }
    note: "фибрилляция или трепетание видны на ЭКГ у каждого, у кого они есть: признак — это они сами"
  - { f: sign.pulse_irregular, band: always, when: { type: [fibrillation] } }
  # при трепетании проведение чаще постоянное — пульс ритмичный; меняется — неритмичный: игровая оценка
  - { f: sign.pulse_irregular, band: sometimes, when: { type: [flutter] } }
  - { f: vital.tachycardia, band: usually }
  - f: vital.bp_low
    band: { pct: 100 }
    when: { unstable: [yes] }
    note: "нестабильный в игре — с давлением ниже 90 по определению параметра (382_2, раздел 3.1.2.2: выраженная гипотензия)"
  - { f: sym.dyspnea, band: sometimes, when: { unstable: [no] } }
  - { f: sym.dyspnea, band: usually, when: { unstable: [yes] } }
  - { f: sym.fatigue, band: often }
  - { f: sym.dizziness, band: sometimes, when: { unstable: [no] } }
  - { f: sym.dizziness, band: usually, when: { unstable: [yes] } }
  - { f: sign.pallor, band: usually, when: { unstable: [yes] } }
# диагноз — по ЭКГ: запись 12 отведений с эпизодом аритмии (раздел 2)
confirm: [exam.ecg]
redFlags: [vital.bp_low]
treatment:
  # стабильному — урежение пульса: бета-адреноблокатор или верапамил (раздел 3.1.2.1, ЕОК IA); при тяжёлой
  # симптоматике — и в вену (там же; бета-адреноблокатор в вену — с частью 43а). Антикоагулянты — можно;
  # антиагреганты для профилактики инсульта не рекомендованы (раздел 3.1.1.1, ЕОК IIIA)
  firstLine: [tx.beta_blocker, tx.verapamil]
  acceptable: [tx.doac, tx.heparin_iv, tx.lmwh, tx.beta_blocker_iv]
  notIndicated: [tx.aspirin_acs, tx.clopidogrel]
  plan: [tx.beta_blocker]
  byParam:
    # нестабильный (раздел 3.1.2.2, ЕОК IB): экстренная кардиоверсия и как можно быстрее гепарин натрия или
    # эноксапарин натрия (раздел 3.1.1.2); амиодарон — если разряд не помог (раздел 3.1.2.1.2); урежать
    # таблетками при низком давлении — не то
    - when: { unstable: [yes] }
      acceptable: [tx.amiodarone_iv]
      notIndicated: [tx.beta_blocker, tx.verapamil, tx.beta_blocker_iv]
      require: [tx.cardioversion, [tx.heparin_iv, tx.lmwh]]
    # стабильный, меньше 48 часов: урежение может избавить от кардиоверсии (раздел 3.1.2.2), а можно сразу
    # восстановить ритм — разрядом или амиодароном, с антикоагулянтом
    - when: { unstable: [no], recent: [yes] }
      firstLine: [tx.cardioversion, tx.amiodarone_iv]
    # стабильный, 48 часов и больше: урежение и антикоагулянт; восстанавливать ритм — только после трёх
    # недель антикоагулянта (раздел 3.1.1.2), сейчас — вредно
    - when: { unstable: [no], recent: [no] }
      harmful: [tx.cardioversion, tx.amiodarone_iv]
    # высокий риск инсульта по CHA₂DS₂-VASc — антикоагулянт постоянно, лучше прямой пероральный (раздел
    # 3.1.1.1, ЕОК IA); нестабильному в ПИТ — гепарин, таблетки потом
    - when: { oac: [yes], unstable: [no] }
      require: [tx.doac]
  # нестабильный — палата интенсивной терапии; стабильный — дома: экстренная госпитализация при гемодинамике
  # и пароксизме до 48 часов, когда восстановить ритм не удалось (раздел 6.2)
  setting:
    default: home
    param: { name: unstable, map: { yes: icu, no: home } }
    # стабильный ранний: восстанавливать ритм в больницу — не ошибка (раздел 6.2)
    also:
      - { when: { unstable: [no], recent: [yes] }, settings: [ambulance] }
texts:
  summary:
    ru: >-
      Предсердия не сокращаются, а дрожат — или часто и правильно сокращаются, как при трепетании, — и
      сердце бьётся часто и неровно. Диагноз — по ЭКГ. Низкое давление, обморок, боль в груди —
      электрическая кардиоверсия сразу и гепарин. Стабильному — урежение пульса бета-адреноблокатором или
      верапамилом, а если аритмии меньше 48 часов, можно и сразу восстановить ритм. 48 часов и больше —
      только урежение: восстановленный ритм выталкивает сгусток из предсердия, и без трёх недель
      антикоагулянта бывает инсульт. Антикоагулянт постоянно — по шкале CHA₂DS₂-VASc.
pearls:
  - ru: "Не знают, когда началось, — считают, что 48 часов и больше: восстанавливать ритм нельзя, пока три недели не принимает антикоагулянт."
  - ru: "Кардиоверсия без антикоагулянта при аритмии 48 часов и дольше — инсульт у 5–7 из 100; с ним — меньше 1."
  - ru: "Ацетилсалициловая кислота от инсульта при фибрилляции предсердий не защищает: нужен антикоагулянт."
  - ru: "При сердечной недостаточности пульс урежают бета-адреноблокатором, не верапамилом."
simplified: "Давность всегда известна: «не знаю, когда началось» в игре нет — в жизни это то же, что 48 часов и больше. ЭхоКГ и чреспищеводной ЭхоКГ, пропафенона, дигоксина, «таблетки в кармане», аблации и электрокардиостимуляции при трепетании нет; прокаинамид — только при желудочковой тахикардии. Нестабильный — по давлению ниже 90; эмболии после экстренной кардиоверсии у нестабильного нет. Антикоагулянт рядом с кардиоверсией — любой из трёх, «4 недели после» — словами. Тиреотоксикоз, калий и другие обратимые причины не ищут; HAS-BLED, варфарин и механические клапаны не вошли."
sources:
  - { kind: guideline, title: "Фибрилляция и трепетание предсердий", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/382_2", note: "ID 382_2, опубликованы 26.09.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 1.1: определения ФП и ТП; раздел 1.3: распространённость; раздел 1.5: пароксизмальная — в большинстве случаев до 48 часов; раздел 2: ЭКГ-критерии; раздел 3.1.1.1: CHA₂DS₂-VASc и ПОАК, антиагреганты не рекомендованы (ЕОК IIIA); раздел 3.1.1.2: 48 часов — граница, антикоагулянт 3 недели до и 4 недели после кардиоверсии, тромбоэмболии без него у 5–7 %; раздел 3.1.2.1: контроль ЧСС; раздел 3.1.2.2: экстренная кардиоверсия при нестабильности (ЕОК IB), многие пароксизмы проходят сами; раздел 6.2: экстренная госпитализация; доли — игровая оценка" }
review: draft
