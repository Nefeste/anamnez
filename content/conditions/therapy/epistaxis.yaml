id: cond.epistaxis
name: { ru: "Носовое кровотечение" }
# R04.0 (977_1, раздел 1.4)
icd10: R04.0
department: dept.therapy
system: airways
kind: syndrome
severity: moderate
epidemiology:
  # частота у взрослых в населении не дана (977_1, раздел 1.3): в игре — около 1 % пришедших, игровая
  # оценка
  prevalence: rare
  # возраст и пол взрослых не даны; особо выделены пожилые (разделы 2.1, 7): с 18 лет, пик — игровая
  # оценка
  age: { min: 18, peak: [45, 85] }
  # на антикоагулянтах и антиагрегантах кровотечения чаще повторяются и бывают обильнее (раздел 2.1);
  # во сколько раз растёт риск, в тексте нет — игровая оценка
  risks:
    - { id: risk.anticoagulants, x: 2 }
params:
  # передний источник виден при риноскопии, передний не виден, задний: долей у взрослых в тексте нет
  # (раздел 1.3; у детей — «чаще всего» передний, раздел 3.1.2) — игровая оценка
  source: { anterior_visible: 70, anterior_hidden: 20, posterior: 10 }
course:
  stages:
    - { id: acute, days: [0, 1] }
  presentation: [0, 0]
  # без остановки кровотечение продолжается: частоты в тексте нет — игровая оценка
  untreated: { band: often, days: [0, 1] }
findings:
  - f: sym.nosebleed
    band: { pct: 100 }
    note: "с этой жалобой приходят все: без кровотечения диагноза нет"
  - f: sign.nasal_bleeding_point
    band: { pct: 100 }
    when: { source: [anterior_visible] }
    note: "источник спереди на перегородке виден у каждого такого пациента; увидит ли его врач — точность осмотра"
  - f: sign.blood_pharynx
    band: { pct: 100 }
    when: { source: [posterior] }
    note: "при заднем источнике кровь стекает в носоглотку у каждого (977_1, раздел 1.6)"
  # АД измеряют всем — гипертензия и гиповолемия (раздел 2.2); при заднем источнике кровопотеря
  # больше: тахикардия и низкий гемоглобин (разделы 1.6, 2.3); частот нет — игровые
  - { f: vital.bp_high, band: sometimes }
  - { f: vital.tachycardia, band: sometimes, when: { source: [posterior] } }
  - { f: lab.hb_low, band: sometimes, when: { source: [posterior] } }
confirm: [exam.nose_exam]
treatment:
  # прижать крылья носа — всем с передним кровотечением сначала (977_1, раздел 3.1.2, УУР В); источник
  # виден — турунда с сосудосуживающим или гемостатиком (раздел 3.1.1, УУР А; критерий качества 2);
  # передняя тампонада останавливает и видимый источник
  firstLine: [tx.nasal_turunda]
  acceptable: [tx.anterior_packing]
  supportive: [tx.nose_pinch]
  plan: [tx.nose_pinch, tx.nasal_turunda]
  byParam:
    # источник не виден — передняя тампонада (раздел 3.1.2, УУР В; критерий качества 3);
    # сосудосуживающая турунда перед ней — облегчает
    - when: { source: [anterior_hidden] }
      firstLine: [tx.anterior_packing]
      supportive: [tx.nose_pinch, tx.nasal_turunda]
      plan: [tx.nose_pinch, tx.anterior_packing]
    # задний источник — передняя и задняя тампонада, только в стационаре (раздел 3.1.2; раздел 6):
    # перевод в стационар с дежурным ЛОР-врачом (раздел 2.2); до приезда скорой — прижать крылья
    # носа, передняя тампонада (прил. Б, В)
    - when: { source: [posterior] }
      supportive: [tx.nose_pinch, tx.anterior_packing, tx.nasal_turunda]
      plan: [tx.nose_pinch, tx.anterior_packing]
      preHospital: [tx.nose_pinch, tx.anterior_packing]
  # незначительное или остановленное — амбулаторно, при задней тампонаде госпитализация обязательна
  # (раздел 6)
  setting:
    default: home
    param: { name: source, map: { anterior_visible: home, anterior_hidden: home, posterior: transfer } }
texts:
  summary:
    ru: >-
      Кровь из носа. Чаще кровит сосуд в передней части перегородки: его видно при осмотре. Сначала —
      сидя, голова немного вперёд, прижать крылья носа на 5–15 минут. Сосуд виден — турунда с
      сосудосуживающим или кровоостанавливающим, не виден — передняя тампонада; после остановки —
      домой. Кровь стекает по задней стенке глотки и при прижатых крыльях — кровит сзади: такую
      тампонаду ставят в стационаре с ЛОР-врачом. Давление измеряют всем.
pearls:
  - ru: "Кровь стекает в горло, даже когда крылья носа прижаты, — источник сзади: нужна задняя тампонада, её ставят в стационаре."
  - ru: "Антикоагулянт при кровотечении из носа сразу не отменяют: сначала останавливают кровь на месте."
  - ru: "Сосудосуживающие капли на турунде при гипертонии и болезнях сердца — с осторожностью."
simplified: "Носовое кровотечение в игре — у взрослого, без травмы и без тяжёлой кровопотери. Коагуляции, эндоскопии, задней тампонады и лечения гипертонии после остановки кровотечения в игре нет; ЛОР-врача в районной больнице нет."
sources:
  - { kind: guideline, title: "Носовое кровотечение", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/977_1", note: "ID 977_1, опубликованы 08.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.5: источник — передние или задние отделы носа и др.; раздел 1.6: при переднем кровь идёт наружу, при заднем стекает в носоглотку; раздел 2: диагноз — по риноскопии и фарингоскопии; раздел 2.1: антикоагулянты и антиагреганты — чаще рецидивы; раздел 2.2: АД всем — критерий качества 4; раздел 3.1: при неопасном для жизни кровотечении сначала местная остановка, затем коррекция свёртывания; раздел 3.1.1 (УУР А): видимый источник — анемизация или гемостатик на турунде, критерий качества 2; раздел 3.1.2 (УУР В): прижатие крыльев носа, передняя тампонада при невидимом источнике — критерий качества 3; задний источник — передняя и задняя тампонада в стационаре; раздел 6: незначительное — амбулаторно, при задней тампонаде госпитализация обязательна; доли источников и частоты признаков не даны — игровые" }
review: draft
