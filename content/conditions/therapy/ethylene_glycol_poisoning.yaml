id: cond.ethylene_glycol_poisoning
name: { ru: "Отравление этиленгликолем" }
# острое отравление этиленгликолем (spec 2026-10-chapter-4, часть 57в; 873_1): он входит в антифризы, тормозные, амортизаторные и
# гидравлические жидкости (раздел 1.2); «В большинстве случаев отравление этиленгликолем (антифризами) происходит при приеме его
# внутрь в целях опьянения» (там же). Токсичны продукты его окисления — гликолевая, глиоксиловая и щавелевая кислоты (раздел 1.2).
# МКБ-10 — T52.3, «токсическое действие гликолей» (раздел 1.4; в разделе 1.1 — опечатка в коде)
icd10: T52.3
department: dept.therapy
system: poisoning
kind: state
# всем — скорая помощь выездной бригадой (раздел 2.1, УУР С, УДД 5)
arrival: ambulance
severity: critical
epidemiology:
  # общероссийских данных нет; в центре острых отравлений Санкт-Петербурга — 1–2 больных в год против 10–15 с метанолом (раздел
  # 1.3): полоса на ступень ниже метанола — игровая оценка
  prevalence: vanishingly_rare
  # возраста и пола в 873_1 нет — игровая оценка
  age: { min: 18, max: 80, peak: [30, 60] }
  sex: { m: 1, f: 0.25 }
params:
  # «легкую степень отравления, средней степени тяжести и тяжелую» (раздел 1.5.2): скрытый период — 8–12 часов и более, 6–8 и 1–5;
  # лабораторных границ нет. Доли — игровая оценка
  severity: { mild: 30, moderate: 35, severe: 35 }
  # производные — доли для вывода, пока кровь не смотрели: ацидоз — около 70 из 100, низкий кальций — у каждого четвёртого, низкое
  # давление — у каждого второго тяжёлого; игровая оценка
  acidosis: { no: 30, yes: 70 }
  hypocalcemia: { no: 75, yes: 25 }
  hypotension: { no: 82, yes: 18 }
derived:
  # ацидоз — от него натрия гидрокарбонат (раздел 3.2)
  acidosis: { has: lab.acidosis }
  # гипокальциемия — от неё кальций в вену (раздел 3.2)
  hypocalcemia: { has: lab.ca_low }
  # низкое давление — противошоковая терапия (раздел 3.2)
  hypotension: { has: vital.bp_low }
course:
  stages:
    - { id: acute, days: [0, 3] }
  # опьянение — «В течение первых 30 минут», скрытый период — «от 1 до 12 часов, иногда дольше» (раздел 1.6.2): привозят в первые
  # сутки или на следующий день
  presentation: [0, 1]
  # тяжёлая — «Если не наступит смерть (1-2 сутки)», дальше почки (раздел 1.5.2); средняя — токсическая нефропатия и олигурия (там
  # же); лёгкая — «Выраженных нарушений почечной функции не бывает» (там же). Доли и сроки — игровая оценка
  untreated:
    - { band: always, days: [0, 1], when: { severity: [severe] } }
    - { band: usually, days: [1, 3], when: { severity: [moderate] } }
    - { band: sometimes, days: [1, 3] }
  # лёгкие — «в среднем до 5 дней» (раздел 6.1)
  stay: [4, 6]
findings:
  # о выпитом скажут скорая и родные (раздел 2.1), но токсикологический анамнез собрать удаётся «далеко не всегда» (комментарий к
  # рекомендации о первичном осмотре); полоса — игровая оценка
  - { f: sym.antifreeze_drink, band: usually }
  # лёгкая: «головная боль, тошнота, рвота, умеренные боли в животе, жажда, общая слабость. Выраженных нарушений почечной функции не
  # бывает. Возможна кратковременная токсическая нефропатия, характеризующаяся не резко выраженными изменениями мочи» (раздел
  # 1.5.2). Частот в 873_1 нет — полосы игровые
  - { f: sym.headache, band: usually, when: { severity: [mild] } }
  - { f: sym.nausea, band: usually, when: { severity: [mild] } }
  - { f: sym.vomiting, band: often, when: { severity: [mild] } }
  - { f: sym.abdominal_pain, band: often, when: { severity: [mild] } }
  - { f: sym.thirst, band: often, when: { severity: [mild] } }
  - { f: sym.fatigue, band: often, when: { severity: [mild] } }
  - { f: lab.urine_protein, band: sometimes, when: { severity: [mild] } }
  - { f: lab.acidosis, band: sometimes, when: { severity: [mild] } }
  # средняя: «Более отчетливые симптомы токсического поражения мозга и внутренних органов. В дальнейшем развивается токсическая
  # нефропатия, кратковременная олигурия» (раздел 1.5.2). В фазе мозговых нарушений — шаткая походка, расстройство координации, рвота
  # «часто многократная», «сильные боли в животе и в области поясницы, из-за чего часто таких больных нередко оперируют с подозрением
  # на острое хирургическое заболевание органов брюшной полости» (раздел 1.6.2)
  - { f: sym.abdominal_pain, band: usually, when: { severity: [moderate] } }
  - { f: sym.flank_pain, band: usually, when: { severity: [moderate] }, attrs: { side: { both: 100 } } }
  - { f: sym.vomiting, band: usually, when: { severity: [moderate] } }
  - { f: sym.nausea, band: usually, when: { severity: [moderate] } }
  - { f: sym.headache, band: often, when: { severity: [moderate] } }
  - { f: sym.dizziness, band: often, when: { severity: [moderate] } }
  - { f: sign.romberg_unsteady, band: often, when: { severity: [moderate] } }
  - { f: sym.confusion, band: sometimes, when: { severity: [moderate] } }
  - { f: sign.kussmaul, band: often, when: { severity: [moderate] } }
  - { f: lab.acidosis, band: usually, when: { severity: [moderate] } }
  - { f: lab.urine_protein, band: usually, when: { severity: [moderate] } }
  - { f: lab.creatinine_high, band: sometimes, when: { severity: [moderate] } }
  - { f: sym.less_urine, band: sometimes, when: { severity: [moderate] } }
  - { f: sign.cva_tenderness, band: sometimes, when: { severity: [moderate] } }
  - { f: lab.ca_low, band: sometimes, when: { severity: [moderate] } }
  # тяжёлая: «Позже наступает сон, сопор и кома („мозговая“ фаза)» (раздел 1.5.2); «Лицо отравленного гиперемировано, одутловато,
  # дыхание неправильное, иногда глубокое, шумное (типа Куссмауля)», давление снижается, «У части больных в коматозном состоянии
  # наблюдается ригидность затылочных мышц»; спустя 4–12 часов угнетение ЦНС «может проявляться развитием судорог, отеком головного
  # мозга, комой» (раздел 1.6.2)
  - f: sym.found_unconscious
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "по определению параметра: при тяжёлом отравлении — сопор и кома, «мозговая» фаза (873_1, раздел 1.5.2)"
  - f: sign.gcs_coma
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "по определению параметра: тяжёлое отравление — кома (873_1, раздел 1.5.2); глубина — игровая оценка"
  - { f: sign.kussmaul, band: usually, when: { severity: [severe] } }
  - { f: sign.face_flushing, band: often, when: { severity: [severe] } }
  - { f: vital.bp_low, band: often, when: { severity: [severe] } }
  - { f: vital.tachycardia, band: often, when: { severity: [severe] } }
  - { f: sym.seizure, band: sometimes, when: { severity: [severe] } }
  - { f: sign.neck_stiffness, band: sometimes, when: { severity: [severe] } }
  - f: lab.acidosis
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "по определению параметра: при тяжёлом — тяжёлый метаболический ацидоз с большим анионным разрывом от гликолевой кислоты (873_1, раздел 1.6.2)"
  - { f: lab.ca_low, band: often, when: { severity: [severe] } }
  - { f: lab.creatinine_high, band: often, when: { severity: [severe] } }
  # «часто … гиперкалиемии» у тяжёлых (комментарий к рекомендации о КОС)
  - { f: lab.k_high, band: often, when: { severity: [severe] } }
  # в моче — гипокальциемия и кристаллурия (раздел 1.6.2): «Кристаллы оксалата кальция могут появиться в моче еще в первой фазе, но
  # их отсутствие не исключает отравление этиленгликолем» (там же); частоты нет — полосы игровые
  - { f: lab.oxalate_crystals, band: sometimes, when: { severity: [mild] } }
  - { f: lab.oxalate_crystals, band: often, when: { severity: [moderate, severe] } }
  - f: lab.eg_blood
    band: { pct: 100 }
    note: "отравился этиленгликолем — этиленгликоль в крови у каждого: «Золотым стандартом» диагностики названо его исследование в крови и моче газовой хроматографией (873_1, раздел 1.6.2); точность — у обследования"
confirm: [exam.toxic_alcohols]
redFlags: [sign.gcs_coma]
# с чем спутать: с острым хирургическим животом — сильные боли в животе и пояснице (раздел 1.6.2); с состояниями с нарушением
# сознания (раздел 2.5). Набор — игровая оценка
differential: [cond.methanol_poisoning, cond.pancreatitis, cond.opioid_poisoning]
treatment:
  # первой линии сверх обязательного нет: антидот — этанол (раздел 3.2, УУР С, УДД 5; критерий качества 21), в стационаре и до перевода
  firstLine: []
  # пиридоксин и тиамин — «При отравлении этиленгликолем с целью ускорения метаболизма» глиоксилата (раздел 3.2, УУР С, УДД 5),
  # критериев нет; промывание желудка — «в ранние сроки» (раздел 3.1, УУР С, УДД 5; критерий качества 2), а через несколько часов
  # его эффективность «будет сомнительна» (там же): часов от приёма в игре нет — можно
  acceptable: [tx.pyridoxine, tx.thiamine, tx.gastric_lavage]
  # растворы — при расстройствах гемодинамики и для детоксикации (раздел 3.1), но при этиленгликоле — «под строгим контролем
  # волемии», риск острого повреждения почек (раздел 3.2)
  supportive: [tx.iv_fluids]
  # активированный уголь «практически не сорбирует или очень слабо сорбирует спирты» (раздел 3.1, УУР С, УДД 5)
  notIndicated: [tx.activated_charcoal]
  harmful: []
  beforeTransfer: [tx.ethanol_antidote]
  byParam:
    # натрия гидрокарбонат — купировать метаболический ацидоз (раздел 3.2, УУР С, УДД 5; критерий качества 23)
    - when: { acidosis: [yes] }
      beforeTransfer: [tx.sodium_bicarbonate]
    # «Рекомендовано с целью лечения гипокальциемии всем пациентам с острым отравлением этиленгликолем включение в состав инфузионной
    # терапии раствора кальция хлорида или #кальция глюконата под контролем уровня кальция в крови» (раздел 3.2, УУР С, УДД 5): любой
    # из двух, первым — глюконат, как при острой гипокальциемии (627_3)
    - when: { hypocalcemia: [yes] }
      beforeTransfer: [[tx.calcium_gluconate_iv, tx.calcium_chloride_iv]]
    # противошоковая терапия «при тяжелых гемодинамических расстройствах» (раздел 3.2, УУР С, УДД 5): в игре — при низком давлении
    - when: { hypotension: [yes] }
      beforeTransfer: [[tx.balanced_fluids, tx.iv_fluids]]
  # в центр острых отравлений, при невозможности — в стационар с гемодиализом (раздел 3.1, УУР С, УДД 5); гемодиализа в игре нет —
  # перевод (вопрос владельцу 31). Лёгкое — лечат и у себя антидотом: палата или ПИТ не ошибка, как при метаноле
  setting:
    default: transfer
    also:
      - { when: { severity: [mild] }, settings: [ward, icu] }
texts:
  summary:
    ru: >-
      Отравление этиленгликолем — антифризом, тормозной жидкостью: их пьют вместо спиртного. Сначала опьянение, потом сон, затем
      рвота и сильная боль в животе и пояснице — таких больных нередко оперируют, приняв за острый живот. При тяжёлом — кома,
      судороги, ацидоз, низкий кальций, потом почки. Подтверждает анализ крови на спирты. Антидот — этанол, главное лечение —
      ранний гемодиализ.
pearls:
  - ru: "Сильная боль в животе и пояснице с рвотой после «опьянения» — вспомнить об антифризе, прежде чем оперировать."
  - ru: "Кристаллы оксалата кальция в моче — довод за этиленгликоль, но их отсутствие его не исключает."
  - ru: "Кальций при этиленгликоле уходит на оксалаты: его проверяют и восполняют."
simplified: "Доз нет. Гемодиализа нет — перевод по вопросу 31. Форсированного диуреза, меглюмина натрия сукцината, гликолевой кислоты в крови и поражения черепных нервов нет; поражение почек — только находками при поступлении. Тяжесть — параметр: лабораторных границ у степеней в рекомендации нет."
sources:
  - { kind: guideline, title: "Токсическое действие метанола и этиленгликоля", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/873_1", note: "ID 873_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 12.10.2026; раздел 1.2: этиленгликоль — в антифризах, тормозных и гидравлических жидкостях, его пьют в целях опьянения; раздел 1.3: в центре острых отравлений Санкт-Петербурга — 1–2 больных в год; раздел 1.5.2: лёгкая, средняя и тяжёлая степени, скрытый период — 8–12, 6–8 и 1–5 часов; раздел 1.6.2: «мозговая» фаза — боли в животе и пояснице, из-за которых таких больных нередко оперируют, гиперемия лица, дыхание Куссмауля, судороги и кома, гипокальциемия, кристаллурия, ацидоз с большим анионным разрывом, оксалаты в моче могут появиться рано, но их отсутствие отравления не исключает; раздел 2.3: этиленгликоль в крови и моче — газовой хроматографией; раздел 3.1 (УУР С, УДД 5): промывание желудка в ранние сроки, активированный уголь не рекомендуется, эвакуация в центр острых отравлений или стационар с гемодиализом; раздел 3.2 (УУР С, УДД 5): этанол — антидот, натрия гидрокарбонат при ацидозе, пиридоксин и тиамин, кальций при гипокальциемии, инфузия под контролем волемии, ранний гемодиализ; раздел 6.1: лёгкие — до 5 дней, средние и тяжёлые — ОРИТ; критерии качества 2, 4, 10, 15, 21–23; доли, полосы и сроки — игровая оценка" }
review: draft
