id: cond.radiculopathy
name: { ru: "Дискогенная пояснично-крестцовая радикулопатия" }
# грыжа диска прижимает корешок (spec 2026-10-chapter-4, часть 58б): «повреждение поясничных или первого крестцового корешков
# спинномозговых нервов (СМН) вследствие их компрессии компонентами межпозвонкового диска» (777_1, термины). M51.1 — «Поражения
# межпозвонковых дисков поясничного и других отделов с радикулопатией» (раздел 1.4)
icd10: M51.1
department: dept.therapy
# одна группа с неспецифической болью в спине: лечат одинаково — перепутать их значит поставить диагноз частично верно
group: grp.back_pain
system: nerves
kind: disease
# жизни не угрожает, но боль сильная и бывает парез — средней тяжести, игровая оценка
severity: moderate
# приходят сами — в поликлинику и в приёмное: лечат амбулаторно, планово госпитализируют при парезе ноги, без эффекта
# амбулаторного лечения и при выраженной инвалидизации из-за боли (777_1, раздел 6)
epidemiology:
  # у врача общей практики при боли в спине такой диагноз ставят «в 2-11% случаев» (раздел 1.3): полоса в десять раз ниже
  # неспецифической боли в спине
  prevalence: rare
  # «преобладает в возрасте 45-64 лет, чаще встречается у мужчин, чем у женщин» (раздел 1.3); во сколько раз — нет, игровая
  # оценка
  age: { min: 18, peak: [45, 64] }
  sex: { m: 1.3, f: 1 }
  # первый эпизод — «тяжелой физической нагрузки, ожирения и курения» (раздел 1.2); множители — игровая оценка. Тяжёлый
  # труд — с профессией (spec 2026-10-occupation, 0.5.10): «тяжелый физический труд, нефизиологические позы при работе»
  # (раздел 1.2)
  risks:
    - { id: risk.obesity, x: 1.3 }
    - { id: risk.smoking, x: 1.2 }
    - { id: risk.heavy_labor, x: 1.5 }
params:
  # «Чаще (до 90% случаев) поражаются пятый поясничный и первый крестцовый корешки» (раздел 1.6): в игре — только они, поровну,
  # игровая оценка
  root: { l5: 50, s1: 50 }
  # слабость индикаторной мышцы: доли в 777_1 нет — игровая оценка; с парезом ноги госпитализация — плановая (раздел 6)
  paresis: { yes: 30, no: 70 }
course:
  stages:
    - { id: acute, days: [0, 28] }
    - { id: subacute, days: [28, 84] }
  # к врачу — в первые дни боли, игровая оценка
  presentation: [0, 10]
  # «Течение ДПКР - благоприятное, примерно у половины пациентов состояние улучшается в течение 4-12 недель» (раздел 1.6)
  selfLimiting: true
findings:
  - f: sym.back_pain
    band: { pct: 100 }
    note: "«боль в нижней части спины с иррадиацией в ногу» — первое из основных клинических проявлений (777_1, раздел 1.6): с ней и приходят"
  # L5 и S1: боль «обычно распространяется ниже колена в стопу и пальцы» (раздел 1.6)
  - { f: sym.sciatica, band: usually }
  # «часто усиливается при кашле, чихании, наклоне вперед и ослабевает в положении лёжа», «часто возникает на фоне значительной
  # физической нагрузки, например, подъема тяжести» (раздел 1.6)
  - { f: sym.pain_cough, band: often }
  - { f: sym.pain_movement, band: often }
  - { f: hx.heavy_lifting, band: often }
  # невропатическая боль — с парестезиями (раздел 1.6); частот признаков в 777_1 нет — полосы игровые
  - { f: sym.leg_tingling, band: usually }
  # тесты натяжения — часть триады диагноза (раздел 2.2, Р6): Ласег при L5 и S1 (приложение Г3)
  - { f: sign.slr_positive, band: usually }
  - { f: sign.leg_hypoesthesia, band: often }
  - { f: sign.paraspinal_spasm, band: often }
  - f: sign.heel_walk_weak
    band: { pct: 100 }
    when: { root: [l5], paresis: [yes] }
    note: "слабость тыльного сгибания стопы — L5 (777_1, приложение Г1), «затруднение ходьбы (стояния) на пятке – о возможном поражении пятого поясничного корешка» (приложение Г3): по определению пареза L5"
  - f: sign.toe_walk_weak
    band: { pct: 100 }
    when: { root: [s1], paresis: [yes] }
    note: "слабость подошвенного сгибания стопы — S1 (777_1, приложение Г1), затруднение ходьбы на носке — первый крестцовый корешок (приложение Г3): по определению пареза S1"
  # ахиллов рефлекс — S1, при L5 рефлексы не меняются (приложение Г1)
  - { f: sign.ankle_reflex_low, band: usually, when: { root: [s1] } }
# «Постановка диагноза ДПКР рекомендуется на основании триады» — нет признаков специфической причины, неврологические признаки и
# тесты натяжения, нейровизуализация — «при их наличии» (раздел 2.2, Р6): диагноз клинический
confirm: clinical
# с чем спутать: неспецифическая боль в спине — люмбоишиалгия «не корешки спинномозговых нервов» (термины); конский хвост —
# среди «красных флажков» той же грыжи (раздел 2.2, табл. 2)
differential: [cond.low_back_pain, cond.cauda_equina]
treatment:
  # рассказать о благоприятном прогнозе и сохранять активность (раздел 3.1.1, Р17, УУР B); НПВП при острой и подострой (раздел
  # 3.1.2, Р26, УУР A)
  firstLine: [tx.stay_active, tx.ibuprofen]
  # витамины группы B к НПВП в острой стадии (Р29, УУР B); габапентин или прегабалин (Р27, УУР B); миорелаксанты — при мышечной
  # боли (Р30, УУР B)
  acceptable: [tx.b_vitamins, tx.gabapentinoid, tx.muscle_relaxant]
  # системные глюкокортикоиды (Р31, УУР A), парацетамол сам по себе (Р32, УУР A) и опиоиды (Р33, УУР B) не рекомендуются;
  # постельный режим — «способ уменьшить боль, а не метод лечения», дольше 3–5 дней ухудшает течение (раздел 3.1.1)
  notIndicated: [tx.steroid_systemic_short, tx.paracetamol, tx.morphine_iv, tx.bed_rest]
  plan: [tx.stay_active, tx.ibuprofen]
  # дома; с парезом ноги — плановая госпитализация (раздел 6): палата не ошибка
  setting:
    default: home
    also:
      - { when: { paresis: [yes] }, settings: [ward] }
texts:
  summary:
    ru: >-
      Грыжа межпозвонкового диска прижимает корешок нерва, чаще всего пятый поясничный или первый крестцовый. Боль простреливает
      из поясницы в ногу ниже колена, сильнее при кашле и наклоне, легче лёжа; немеет голень и стопа, бывает трудно встать на
      пятку или на носок. Лечат как обычную боль в спине: рассказать о хорошем прогнозе, сохранять активность, НПВП. Снимки в
      первые 4 недели не нужны, если нет тревожных признаков. У половины всё проходит за 4–12 недель.
pearls:
  - ru: "Боль ниже колена, Ласег, онемение по полоске кожи и слабая стопа — это корешок, а не мышцы."
  - ru: "Не стоит на пятке — L5, не встаёт на носок и снижен ахиллов рефлекс — S1."
  - ru: "МРТ в первые 4 недели без тревожных признаков исход не меняет: грыжу находят и у многих без боли."
  - ru: "Задержка мочи, онемение промежности, слабость обеих ног — уже не радикулопатия, а конский хвост: МРТ и нейрохирург экстренно."
simplified: "Корешки в игре — только L5 и S1 (до 90 % случаев); IV поясничного и верхних нет. Стадии — без хронической: антидепрессантов, психологических методов, массажа, рефлексотерапии и санаторного лечения нет. Эпидуральных глюкокортикоидов, ЛФК, мануальной терапии, трамадола при непереносимой боли, ЭНМГ, вопросников Освестри и Роланда–Морриса, плановой операции через 6–12 недель тоже нет: игра — первый приём."
sources:
  - { kind: guideline, title: "Дискогенная пояснично-крестцовая радикулопатия", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/777_1", note: "ID 777_1, опубликованы 07.12.2023, применяются; сверено с рубрикатором 12.10.2026; раздел 1.2: грыжа диска — сочетание возрастных изменений и нагрузки; первый эпизод — тяжёлая нагрузка, ожирение, курение; раздел 1.3: распространённость 1,6–13,4 %, 45–64 года, чаще у мужчин, у врача общей практики — 2–11 % болей в спине; раздел 1.6: L5 и S1 — до 90 %, боль ниже колена, сильнее при кашле, чихании, наклоне, легче лёжа, часто после подъёма тяжести; течение благоприятное, половина улучшается за 4–12 недель; раздел 2.2, Р6: диагноз — по триаде; приложения Г1, Г3: признаки корешков, пятка — L5, носок — S1; раздел 3.1.1, Р17 (УУР B): информировать, сохранять активность, постельный режим не дольше 3–5 дней; раздел 3.1.2: НПВП (Р26, УУР A), габапентин и прегабалин (Р27, УУР B), витамины группы B (Р29, УУР B), миорелаксанты (Р30, УУР B); системные ГК (Р31, УУР A), парацетамол сам по себе (Р32, УУР A) и опиоиды (Р33, УУР B) не рекомендуются; раздел 6: плановая госпитализация — при парезе ноги; доли корешков, пареза и признаков — игровая оценка" }
review: draft
