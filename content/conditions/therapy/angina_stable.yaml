# Стабильная стенокардия напряжения (spec 2026-10-chapter-3, часть 39г): 155_2 — стабильная ИБС, её самая
# частая форма. Отличать — от нестабильной стенокардии (впервые возникшая и утяжелившаяся — это уже ОКС,
# 154_4, раздел 1.5), от боли не от сердца (раздел 2.1: неангинозная боль) и от вторичной стенокардии при
# анемии (раздел 2.3: общий анализ крови при первичном обследовании)
id: cond.angina_stable
name: { ru: "Стабильная стенокардия напряжения" }
icd10: I20.8
department: dept.therapy
system: heart
kind: disease
severity: moderate
epidemiology:
  # реже простуды и гипертонии, чаще ОКС — игровая оценка
  prevalence: uncommon
  # предтестовая вероятность ИБС (155_2, приложение А3, таблица ПА3-2): с 30–39 лет, растёт с возрастом;
  # у мужчин при типичной стенокардии в 50–69 лет — 32–44 %, у женщин — 13–16 %: мужчин вдвое больше
  age: { min: 35, peak: [55, 80] }
  sex: { m: 1, f: 0.5 }
  # факторы риска (155_2, раздел 2.4: семейный анамнез, сахарный диабет, гипертензия, курение, ожирение)
  # — множители, как у ОКС, игровая оценка
  risks:
    - { id: risk.smoking, x: 1.5 }
    - { id: risk.family_cad, x: 1.5 }
    - { id: risk.obesity, x: 1.2 }
    - { id: cond.hypertension, x: 1.5 }
    - { id: cond.diabetes2, x: 1.5 }
params:
  # функциональный класс (приложение А3, таблица ПА3-1): I–II — приступы при высокой и средней нагрузке,
  # III–IV — при ходьбе до 500 м, на 1–2 пролёта и легче. Доли — игровая оценка: в 155_2 их нет
  fc: { i_ii: 70, iii_iv: 30 }
course:
  stages:
    - { id: active, days: [0, 36500] }
  # стабильная — больше месяца без изменений (опросник Роуза, приложение Г1: впервые боли — «более 1 месяца
  # назад», характер за месяц не изменился)
  presentation: [30, 3650]
  untreated: { band: never, days: [7, 7] }   # за неделю без лечения — без изменений
findings:
  # типичная стенокардия — все три признака (раздел 2.1): за грудиной, при нагрузке, проходит в покое или
  # от нитроглицерина; отдаёт в левую руку, спину, челюсть — «возможно»; одышка — эквивалент боли
  - f: sym.chest_pain_exertion
    band: { pct: 100 }
    note: "стенокардия напряжения — по определению боль при нагрузке, которая проходит в покое (155_2, раздел 2.1)"
  - { f: sym.pain_radiation, band: sometimes }
  - { f: sym.dyspnea, band: sometimes }
  - f: hx.angina_low_threshold
    band: { pct: 100 }
    when: { fc: [iii_iv] }
    note: "III–IV функциональный класс — по определению приступы при ходьбе до 500 м и на 1–2 пролёта (приложение А3)"
  # дислипидемия — фактор риска (раздел 2.4); «часто» — игровая оценка
  - { f: lab.ldl_high, band: often }
confirm: clinical
treatment:
  # на приступ — нитроглицерин (раздел 3.1.2.1, ЕОК IB); против приступов — бета-адреноблокатор (I–II ФК
  # и ЧСС больше 60, ЕОК IA); блокатор кальциевых каналов дигидропиридиновый — не первая линия при I–II ФК
  # (там — верапамил или дилтиазем), но допустим
  firstLine: [tx.nitroglycerin, tx.beta_blocker]
  acceptable: [tx.ccb]
  supportive: [tx.lifestyle]
  # статин — всем с ИБС сразу после диагноза (раздел 3.1.2.2, ЕОК IA). АСК без визуализирующего
  # подтверждения ИБС и без инфаркта в прошлом — «можно рассмотреть» (там же, комментарий): не обязательна
  require: [tx.statin]
  notIndicated: [tx.antacid, tx.ppi, tx.amoxicillin]
  byParam:
    # III–IV ФК — сразу два: бета-адреноблокатор с дигидропиридиновым блокатором кальциевых каналов
    # (раздел 3.1.2.1, ЕОК IC)
    - when: { fc: [iii_iv] }
      require: [tx.beta_blocker, tx.ccb]
  plan: [tx.nitroglycerin, tx.beta_blocker, tx.lifestyle]
  # вне обострения — амбулаторно под наблюдением терапевта (раздел 6)
  setting: { default: home }
texts:
  summary:
    ru: >-
      Ишемическая болезнь сердца, которая давно не меняется: давящая боль за грудиной при нагрузке —
      быстрой ходьбе, лестнице, на холоде, при волнении — проходит в покое за несколько минут или от
      нитроглицерина. Лечат дома: нитроглицерин на приступ, бета-адреноблокатор, статин. Если такие боли
      появились впервые или стали чаще и сильнее, это уже острый коронарный синдром — в больницу.
pearls:
  - ru: "Впервые возникшая или утяжелившаяся стенокардия — не стабильная: это острый коронарный синдром, больного везут в больницу."
  - ru: "ЭКГ в покое при стенокардии напряжения обычно нормальная — это не повод исключить ишемическую болезнь."
  - ru: "Статин — всем с ишемической болезнью сердца, сразу и при любом холестерине."
simplified: "Нагрузочные пробы с визуализацией и КТ коронарных артерий подтверждают диагноз в специализированном центре; в поликлинике задача — распознать стенокардию, отличить её от нестабильной, начать лечение."
sources:
  - { kind: guideline, title: "Стабильная ишемическая болезнь сердца", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/155_2", note: "ID 155_2, опубликованы 04.10.2024, применяются; сверено с рубрикатором 04.10.2026; раздел 2.1 — типичная стенокардия: три признака; раздел 2.4 — ЭКГ покоя обычно без признаков ишемии, факторы, повышающие предтестовую вероятность; раздел 3.1.2 — нитроглицерин на приступ, БАБ или не-ДГП-БКК при I–II ФК, БАБ с ДГП-БКК при III–IV ФК, статин всем, АСК — после визуализирующего подтверждения; раздел 6 — вне обострения амбулаторно, впервые возникшая стенокардия и обострение — экстренная госпитализация; приложение А3 — функциональные классы и предтестовая вероятность" }
  - { kind: guideline, title: "Острый коронарный синдром без подъема сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/154_4", note: "ID 154_4, опубликованы 23.10.2024, применяются; сверено с рубрикатором 04.10.2026; раздел 1.5 — формы нестабильной стенокардии: в покое дольше 20 минут, впервые возникшая не меньше II ФК, утяжелившаяся до III ФК, постинфарктная" }
review: draft
