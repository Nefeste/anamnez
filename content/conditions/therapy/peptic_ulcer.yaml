id: cond.peptic_ulcer
name: { ru: "Язвенная болезнь" }
# обострение без осложнений (spec 2026-10-chapter-4, часть 53б): язва желудка — K25, двенадцатиперстной кишки — K26; в игре
# одна запись, язва ДПК «в 4 раза чаще» (277_2, раздел 1.3) — её код, хроническая без кровотечения и прободения
icd10: K26.7
department: dept.therapy
system: digestive
# кислотозависимые болезни с болью под ложечкой: спутать язву с гастритом, функциональной диспепсией или рефлюксом —
# частично верно, их различают ЭГДС и тест на H. pylori
group: grp.acid_dyspepsia
kind: disease
severity: moderate
epidemiology:
  # заболеваемость в России — 79,5 на 100 000 в 2017 г. (277_2, раздел 1.3); доля среди пришедших с болью под ложечкой —
  # полоса подобрана прогоном генератора, игровая оценка
  prevalence: rare
  age: { min: 18 }
  # за жизнь заболевают 11–14 % мужчин и 8–11 % женщин (277_2, раздел 1.3) — середины
  sex: { m: 1, f: 0.76 }
  # у длительно принимающих НПВП риск язв «возрастает в 4-5 раз» (277_2, раздел 1.6) — середина; курение — фактор без
  # числа (раздел 1.2), множитель — игровая оценка
  risks:
    - { id: risk.nsaid_use, x: 4.5 }
    - { id: risk.smoking, x: 1.5 }
params:
  # с H. pylori ассоциированы около 80 % язв ДПК и 60 % язв желудка (277_2, раздел 1.2), язвы ДПК вчетверо чаще (раздел
  # 1.3): 0,8 × 0,8 + 0,2 × 0,6 = 76 из 100
  hp: { yes: 76, no: 24 }
  # производный — доля для вывода, пока о лекарствах не спросили: игровая оценка по прогону генератора
  nsaid: { yes: 37, no: 63 }
derived:
  # принимает ли НПВП — от какой бы причины ни была язва: их отменяют (277_2, раздел 3)
  nsaid: { has: hx.nsaid_use }
course:
  stages:
    - { id: active, days: [0, 56] }
  # обострение длится «от 3-4 до 6-8 недель» (277_2, раздел 1.6): приходят в первые недели — игровая оценка
  presentation: [3, 21]
  # без лечения язва рубцуется дольше и может осложниться кровотечением или прободением (277_2, раздел 1.6); доли в тексте
  # нет — игровая оценка
  untreated: { band: rarely, days: [7, 28] }
findings:
  # ведущий симптом обострения — «боль в подложечной области» (277_2, раздел 1.6)
  - { f: sym.epigastric_pain, band: always }
  # у язвы пилорического канала и луковицы ДПК — поздняя, «голодная» и ночная боль, проходит после еды (277_2, раздел 1.6);
  # язвы ДПК — 4 из 5 (раздел 1.3), полоса — игровая оценка
  - { f: sym.hunger_pain, band: usually }
  # «типичными для ЯБ являются сезонные (весной и осенью) периоды усиления боли» (277_2, раздел 1.6); болезнь
  # хроническая рецидивирующая (раздел 1.1), язва в прошлом — критерий диагноза (раздел 2). Полосы — игровая оценка
  - { f: hx.seasonal_pain, band: often }
  - { f: hx.ulcer, band: often }
  # диспепсия — отрыжка кислым, тошнота, запоры; рвота «встречается сравнительно редко»; «нередко отмечается похудание»
  # (277_2, раздел 1.6). Полосы — игровая оценка
  - { f: sym.heartburn, band: sometimes }
  - { f: sym.nausea, band: sometimes }
  - { f: sym.constipation, band: rarely }
  - { f: sym.vomiting, band: rarely }
  - { f: sym.weight_loss, band: sometimes }
  # болезненность в эпигастрии с умеренной резистентностью мышц (277_2, раздел 1.6)
  - { f: sign.epigastric_tenderness, band: usually }
  # H. pylori-негативные язвы «чаще всего» — от НПВП (277_2, раздел 1.2); полоса — игровая оценка
  - { f: hx.nsaid_use, band: usually, when: { hp: ['no'] } }
  - f: lab.h_pylori
    band: { pct: 100 }
    when: { hp: [yes] }
    note: "по определению параметра: язва, ассоциированная с H. pylori (277_2, раздел 1.5)"
  # H. pylori даёт и гастрит: диффузная эритема и отёк — «часто» (708_2, Приложение А3)
  - { f: img.egd_gastritis, band: often, when: { hp: [yes] } }
  # язвенный дефект — то, что подтверждает диагноз (277_2, раздел 2.4)
  - f: img.egd_ulcer
    band: { pct: 100 }
    note: "язвенная болезнь — дефект в стенке желудка или ДПК: его и находит ЭГДС (277_2, разделы 1.1 и 2.4)"
# «диагноз ЯБ должен обязательно подтверждаться инструментальными методами» (277_2, раздел 1.6); ЭГДС — критерий качества 1
confirm: [exam.egd]
treatment:
  # ИПН 4–6 недель при обострении (277_2, раздел 3.2, УУР C, УДД 5)
  firstLine: [tx.ppi]
  # диетотерапия всем, отказ от курения и алкоголя (277_2, раздел 3.1, УУР C, УДД 5)
  supportive: [tx.lifestyle]
  # отказ от препаратов «с ульцерогенным действием» (277_2, раздел 3)
  harmful: [tx.ibuprofen, tx.aspirin_course]
  # эрадикация — схемой из трёх-четырёх препаратов, а не одним антибиотиком (277_2, раздел 3.2)
  notIndicated: [tx.amoxicillin, tx.amoxicillin_clavulanate, tx.macrolide, tx.metronidazole, tx.fluoroquinolone, tx.cephalosporin_oral]
  plan: [tx.ppi, tx.lifestyle]
  byParam:
    # при положительном тесте — эрадикация «с целью заживления язвы» и профилактики рецидивов (277_2, раздел 3.2, УУР A,
    # УДД 1)
    - when: { hp: [yes] }
      require: [tx.hp_eradication]
    - when: { hp: ['no'] }
      notIndicated: [tx.hp_eradication]
    # принимает НПВП — отменить (277_2, раздел 3: отказ от препаратов с ульцерогенным действием)
    - when: { nsaid: [yes] }
      require: [tx.stop_nsaid]
  # «пациенты с неосложненным течением обострения … подлежат лечению в амбулаторных условиях» (277_2, раздел 6)
  setting: { default: home }
texts:
  summary:
    ru: >-
      Хроническая болезнь, при которой в стенке желудка или двенадцатиперстной кишки образуется язва. Боль под
      ложечкой — у язвы двенадцатиперстной кишки натощак и ночью, проходит после еды; обострения весной и осенью.
      Чаще всего виноват Helicobacter pylori, реже — обезболивающие из группы НПВП. Диагноз ставят по ЭГДС, всем
      делают тест на H. pylori. Лечат дома: ингибитор протонной помпы 4–6 недель, при H. pylori — эрадикация, НПВП
      отменяют.
pearls:
  - ru: "Голодные и ночные боли, которые проходят после еды, — привычный рассказ о язве двенадцатиперстной кишки; но так болит и при гастрите: диагноз ставит ЭГДС."
  - ru: "Язва без H. pylori — повод спросить про обезболивающие: чаще всего её дают НПВП."
simplified: "Локализации язвы и её размера нет: язва желудка и двенадцатиперстной кишки — одна запись. Биопсии из краёв язвы желудка, контроля эрадикации через 4–6 недель и повторной ЭГДС нет. ИПН за 2 недели до теста на H. pylori отменять не нужно: точность теста от них не зависит. Эрадикация после ушивания прободной язвы — вне приёма."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.2: с H. pylori ассоциированы около 80 % язв ДПК и 60 % язв желудка, H. pylori-негативные — чаще от НПВП; раздел 1.3: заболеваемость 79,5 на 100 000 (2017), язвы ДПК в 4 раза чаще, за жизнь — 11–14 % мужчин и 8–11 % женщин; раздел 1.6: боль в подложечной области, поздняя, голодная и ночная боль при язве ДПК, сезонность, похудание, риск язв при НПВП в 4–5 раз выше; раздел 2.4: ЭГДС всем с подозрением на ЯБ (УУР C, УДД 5); раздел 2.5: тест на H. pylori всем (УУР B, УДД 2); раздел 3.2: ИПН 4–6 недель (УУР C, УДД 5), эрадикация при положительном тесте (УУР A, УДД 1); раздел 6: неосложнённое обострение — амбулаторно; полосы признаков — игровая оценка" }
review: draft
