id: cond.hypertensive_crisis
name: { ru: "Гипертонический криз" }
# криз кодируют по гипертонической болезни — I10–I13 (62_3); гипертоническая энцефалопатия — I67.4. Одна запись — I10
icd10: I10
department: dept.therapy
system: heart
kind: disease
severity: critical
epidemiology:
  # частоты в 62_3 нет; кризы — больше четверти неотложных обращений, из них с поражением органов — 24 из 100, а
  # энцефалопатия — 16 из 100 таких (Zampaglione 1996). Полоса подобрана прогоном генератора: у скорой — 6 кризов на
  # 100 инсультов, сами в приёмное и в поликлинику — 9 и 12 на 20 тысяч; игровая оценка
  prevalence: very_rare
  # возраст при кризе с поражением органов — 67 ± 16 (Zampaglione 1996); с 35 — как гипертония в игре; границы — игровая
  # оценка
  age: { min: 35, peak: [55, 85] }
  sex: { m: 1, f: 1 }
  # только у тех, у кого гипертония уже есть, — как обострение астмы: гипертония была известна у 92 из 100
  # (Zampaglione 1996); неизвестная — «Упрощено». Множителем риска было бы нельзя: при «Разнообразии» жребий
  # сглаживает полосу, а множитель оставляет как в жизни — криз стал бы самой частой болезнью
  requires: [cond.hypertension]
  # НПВП и алкоголь поднимают давление (62_3) — множители игровые
  risks:
    - { id: risk.nsaid_use, x: 1.5 }
    - { id: risk.alcohol, x: 1.5 }
params:
  # поражение органов (62_3, раздел 3.7): энцефалопатия или злокачественная гипертензия — глазное дно и почки. Отёк
  # лёгких, ОКС, расслоение аорты и инсульт — свои болезни базы; доли — игровая оценка (Zampaglione 1996:
  # энцефалопатия — 16 из 100 кризов с поражением органов)
  organ: { encephalopathy: 60, malignant: 40 }
course:
  stages:
    - { id: acute, days: [0, 5] }
  # приходят в первые часы подъёма — игровая оценка
  presentation: [0, 1]
  # без лечения: энцефалопатия — обычно хуже в первые сутки (судороги, кома, инсульт), злокачественная — часто за
  # несколько дней (почечная недостаточность, сердечная); доли и сроки — игровая оценка
  untreated:
    - { band: usually, days: [0, 1], when: { organ: [encephalopathy] } }
    - { band: often, days: [1, 4], when: { organ: [malignant] } }
  # длительности госпитализации в 62_3 нет — игровая оценка
  stay: [5, 10]
findings:
  # значительное повышение АД — по определению (62_3, раздел 3.7): у каждого 180/110 и выше, это и «140/90 и выше»
  - f: vital.bp_very_high
    band: { pct: 100 }
    note: "криз — значительное повышение АД с острым поражением органов-мишеней (62_3, раздел 3.7); в игре у каждого 180/110 и выше — АГ 3-й степени (приложение А3, табл. П2)"
  - f: vital.bp_high
    band: { pct: 100 }
    note: "то же число, что «180/110 и выше» (62_3, раздел 3.7)"
  - { f: sym.bp_surge, band: usually }
  # энцефалопатия — головная боль, тошнота и рвота, оглушение, нарушения зрения (62_3, разделы 3.7 и 6.2); в игре её
  # узнают по оглушению — оно почти всегда; доли — игровая оценка
  - { f: sym.headache, band: always, when: { organ: [encephalopathy] } }
  - { f: sym.headache, band: often, when: { organ: [malignant] } }
  - { f: sym.nausea, band: usually, when: { organ: [encephalopathy] } }
  - { f: sym.vomiting, band: often, when: { organ: [encephalopathy] } }
  - { f: sign.gcs_low, band: always, when: { organ: [encephalopathy] } }
  - { f: sym.vision_blurred, band: often, when: { organ: [encephalopathy] } }
  - { f: sym.vision_blurred, band: usually, when: { organ: [malignant] } }
  # злокачественная гипертензия — по глазному дну (раздел 3.7): кровоизлияния и отёк диска у каждого; почки —
  # креатинин и кровь в моче; при энцефалопатии отёк диска — иногда. Доли — игровая оценка
  - f: sign.retinopathy_acute
    band: { pct: 100 }
    when: { organ: [malignant] }
    note: "злокачественная АГ — изменения на глазном дне: кровоизлияния и/или отёк соска зрительного нерва (62_3, раздел 3.7)"
  - { f: sign.retinopathy_acute, band: sometimes, when: { organ: [encephalopathy] } }
  - { f: lab.creatinine_high, band: usually, when: { organ: [malignant] } }
  - { f: lab.urine_blood, band: often, when: { organ: [malignant] } }
  # давняя гипертония — гипертрофия левого желудочка на ЭКГ; доля — игровая оценка
  - { f: ecg.lvh, band: often }
confirm: clinical
redFlags: [sign.gcs_low, sym.vision_blurred, sign.retinopathy_acute]
# с чем спутать: подъём давления без поражения органов, инсульт и кровоизлияние в мозг — при оглушении и рвоте их
# исключает КТ (62_3, раздел 3.7: КТ или МРТ головного мозга по показаниям)
differential: [cond.bp_uncontrolled, cond.stroke_ischemic, cond.ich]
treatment:
  # препарат в вену с коротким периодом полувыведения — в первые 15 минут, среднее давление — минус 20–25 %
  # (раздел 3.7); при злокачественной — осторожно и таблетки иАПФ или БРА в стационаре. Тромболизис при давлении
  # выше 185/110 — нельзя (814_1, противопоказания) — у криза, принятого за инсульт, это вред
  require: [tx.bp_iv]
  supportive: [tx.ace_inhibitor, tx.arb]
  harmful: [tx.thrombolysis_stroke, tx.thrombolysis]
  # где лечить (раздел 6.2): энцефалопатия, острые нарушения зрения, почечная недостаточность — интенсивная терапия;
  # без своей ПИТ — «Вызвать скорую»
  setting: { default: icu }
texts:
  summary:
    ru: >-
      Давление поднялось так, что страдают органы: мозг — головная боль, рвота, оглушение, пелена перед глазами
      (энцефалопатия), или сосуды глаз и почек — кровоизлияния на глазном дне, креатинин (злокачественная
      гипертензия). Само число ещё не криз: решает поражение органов. Давление снижают препаратом в вену под
      монитором в первые 15 минут, но не больше чем на четверть за первые часы, лечат в палате интенсивной терапии.
pearls:
  - ru: "Давление 200/120 без поражения органов — не криз: таблетки и домой. С оглушением, пеленой перед глазами или кровоизлияниями на глазном дне — криз: в вену и в ПИТ."
  - ru: "Оглушение и рвота при очень высоком давлении бывают и при инсульте и кровоизлиянии в мозг — их исключает КТ: лечат их иначе."
  - ru: "Резко снижать давление нельзя: мозгу и сердцу не хватит крови. Минус 20–25 % за первые часы."
simplified: "Формы криза в игре две — гипертоническая энцефалопатия и злокачественная гипертензия; отёк лёгких, ОКС, расслоение аорты и инсульт с высоким давлением — свои болезни. Криз в игре — только у тех, у кого гипертония уже была. Препарат в вену один — «Снижение давления препаратом в вену»; нитропруссид, эналаприлат и урапидил не различаются. Срок «препарат в вену за 15 минут» не проверяется: решение в игре одно, после обследования. Беременность и эклампсия, феохромоцитома, наркотики, микроангиопатия (ЛДГ, гаптоглобин) не моделируются."
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: ГК — значительное повышение АД с острым поражением органов-мишеней; злокачественная АГ — глазное дно, энцефалопатия, почки; осмотр за 10 минут, ЭКГ за 15, препарат в вену за 15; рутинно — офтальмоскопия, ЭКГ, креатинин, анализ мочи; снижение не больше 25 % за 2 часа, при энцефалопатии — среднее АД на 20–25 % сразу; раздел 6.2: экстренная госпитализация, интенсивная терапия при энцефалопатии, нарушениях зрения, почечной недостаточности; доли форм, признаков и сроки — игровая оценка" }
  - { kind: paper, title: "Zampaglione B, Pascale C, Marchisio M, Cavallo-Perin P. Hypertensive urgencies and emergencies. Prevalence and clinical presentation. Hypertension 1996;27(1):144–147", url: "https://pubmed.ncbi.nlm.nih.gov/8591878/", note: "PMID 8591878, сверено 05.10.2026: кризы — больше четверти неотложных обращений, 76 % — без поражения органов, 24 % — с поражением; инфаркт мозга 24 %, отёк лёгких 23 %, энцефалопатия 16 %, кровоизлияние в мозг 4,5 %; возраст 67 ± 16 и 60 ± 14; гипертония неизвестна — у 8 и 28 %" }
review: draft
