id: cond.aortic_dissection
name: { ru: "Расслоение аорты" }
icd10: I71.0
department: dept.therapy
system: heart
kind: disease
severity: critical
# привозит скорая (spec 2026-10-chapter-3, часть 43а): острое расслоение — показание к экстренной госпитализации
# (946_1, раздел 6); в смотровую приёмного, к монитору. В поликлинику с ним в игре не приходят — игровое правило
arrival: ambulance
epidemiology:
  # 6 на 100 000 в год (946_1, раздел 1.3) — в 50 раз реже острого коронарного синдрома (около 300 на 100 000:
  # 438 315 случаев в 2022 году, 157_5, раздел 1.3); у скорой в игре — около 2 на 100 ОКС (подобрано прогоном
  # генератора: с полосой ultra_rare было бы 5,5)
  prevalence: exceptionally_rare
  # средний возраст — 63 года, мужчин — 65 % (946_1, раздел 1.3, по регистру IRAD); границы возраста — игровая
  # оценка
  age: { min: 35, peak: [50, 80] }
  sex: { m: 1, f: 0.54 }
  # гипертония — у 65–75 % больных (946_1, раздел 1.3), курение — среди факторов риска (там же); множители —
  # игровая оценка
  risks:
    - { id: cond.hypertension, x: 4 }
    - { id: risk.smoking, x: 1.5 }
params:
  # тип по Стэнфорду (946_1, раздел 1.5): A — расслоена восходящая аорта, B — без неё; тип A — у 62,3 % из 464
  # больных регистра IRAD (Hagan 2000)
  type: { a: 62, b: 38 }
course:
  # острое расслоение — до 14 дней (946_1, раздел 1.5)
  stages:
    - { id: acute, days: [0, 14] }
  presentation: [0, 0]
  # без лечения — «острое, почти всегда смертельное кровотечение» (946_1, приложение В): тип A — почти всегда в
  # первые сутки, тип B — обычно в первые дни; сроки и доли — игровая оценка
  untreated:
    - { band: always, days: [0, 1], when: { type: [a] } }
    - { band: usually, days: [1, 3], when: { type: [b] } }
  # тип B в палате интенсивной терапии под антиимпульсной терапией (946_1, раздел 3.2.3) — неделя, игровая оценка:
  # длительности госпитализации в 946_1 нет
  stay: [5, 9]
findings:
  # боль — у 90 %, внезапная — у 84 % (Klompas 2002); спереди в груди — чаще при типе A, в спине и животе — при
  # типе B (946_1, раздел 1.6); доли места — игровая оценка
  - f: sym.tearing_pain
    band: { pct: 85 }
    when: { type: [a] }
    attrs: { site: { chest: 85, back: 15 } }
    note: "резко начавшаяся сильная боль в груди и/или в спине — самая типичная, резкость начала — самая специфичная черта (946_1, раздел 1.6); внезапная — у 84 % (Klompas 2002)"
  - f: sym.tearing_pain
    band: { pct: 85 }
    when: { type: [b] }
    attrs: { site: { back: 65, chest: 35 } }
    note: "у расслоения типа B чаще боль в спине или животе (946_1, раздел 1.6); внезапная — у 84 % (Klompas 2002)"
  # дефицит пульса — у 30 % при типе A и у 15 % при типе B; разница давления на руках — при распространении на
  # ветви дуги (946_1, раздел 1.6): в игре одним признаком
  - f: sign.bp_arm_difference
    band: { pct: 30 }
    when: { type: [a] }
    note: "дефицит пульса — у 30 % при типе A (946_1, раздел 1.6)"
  - f: sign.bp_arm_difference
    band: { pct: 15 }
    when: { type: [b] }
    note: "дефицит пульса — у 15 % при типе B (946_1, раздел 1.6)"
  # обморок — у 15 % при типе A и у 5 % при типе B (946_1, раздел 1.6)
  - f: sym.syncope
    band: { pct: 15 }
    when: { type: [a] }
    note: "обморок — у 15 % при типе A (946_1, раздел 1.6)"
  - f: sym.syncope
    band: { pct: 5 }
    when: { type: [b] }
    note: "обморок — у 5 % при типе B (946_1, раздел 1.6)"
  - f: vital.bp_high
    band: { pct: 49 }
    note: "давление повышено при поступлении у 49 % (Klompas 2002)"
  # на обзорном снимке груди изменений нет у 12,4 % (Hagan 2000); средостение и контур аорты в игре — одним
  # признаком, доля — игровая оценка по этому числу
  - f: img.cxr_wide_mediastinum
    band: { pct: 85 }
    note: "снимок груди без изменений — у 12,4 % больных регистра IRAD (Hagan 2000); нормальные аорта и средостение снижают вероятность расслоения (Klompas 2002)"
  # D-димер выше 500 нг/мл — у 96,7 % больных острым аортальным синдромом (ADvISED, Nazerian 2018)
  - f: lab.d_dimer_high
    band: { pct: 97 }
    note: "D-димер выше 500 нг/мл — чувствительность 96,7 % при остром аортальном синдроме (Nazerian 2018); в алгоритме 946_1 (приложение Б) — при низкой вероятности"
  - f: img.cta_aortic_dissection
    band: { pct: 100 }
    attrs: { extent: $type }
    note: "отслоённая интима и два просвета на КТ-ангиографии — по определению болезни (946_1, раздел 1.1); пропустить её может само обследование"
confirm: [exam.cta_chest]
redFlags: [sym.tearing_pain, sign.bp_arm_difference, img.cta_aortic_dissection]
differential: [cond.acs]
treatment:
  # обезболивание и антиимпульсная терапия — всем (946_1, раздел 3.1.1; критерии качества 1–3): морфин в вену и
  # бета-адреноблокатор в вену до верхнего давления 100–120 и пульса реже 60; при противопоказаниях к нему —
  # верапамил в вену (там же). Нитроглицерин в вену — если давление не снизилось, и только после
  # бета-адреноблокатора (приложение А3): без него — рефлекторная тахикардия. Антикоагулянты и антиагреганты 946_1
  # не обсуждает — в игре они «не нужно». Обязательное — в `require`, первой линии сверх него нет
  firstLine: []
  acceptable: [tx.nitroglycerin_iv]
  # тромболизис при подозрении на расслоение аорты — абсолютное противопоказание (157_5, раздел 3.1.3)
  harmful: [tx.thrombolysis, tx.thrombolysis_stroke]
  require: [tx.morphine_iv, [tx.beta_blocker_iv, tx.verapamil_iv]]
  beforeTransfer: [tx.morphine_iv, [tx.beta_blocker_iv, tx.verapamil_iv]]
  # тип A — решение об операции в первые 24 часа (946_1, раздел 3.2.1; критерий качества 13): перевод в
  # кардиохирургию; неосложнённый тип B — медикаментозная терапия под контролем боли и давления (раздел 3.2.3) — в
  # игре своя ПИТ. Без своей ПИТ — «Вызвать скорую», перевод — не ошибка
  setting:
    default: icu
    param: { name: type, map: { a: transfer, b: icu } }
texts:
  summary:
    ru: >-
      Кровь прорывается в стенку аорты и расслаивает её: появляется второй, ложный просвет. Внезапная
      сильнейшая боль в груди или спине — сразу во всю силу, бывает обморок, давление на руках разное.
      Диагноз — КТ-ангиография: на ней видна отслоённая интима. Сразу — морфин и бета-адреноблокатор в вену
      до верхнего давления 100–120 и пульса реже 60. Тип A (с восходящей аортой) — перевод на операцию, тип
      B — палата интенсивной терапии. Тромболизис при подозрении на расслоение смертельно опасен.
pearls:
  - ru: "Боль, которая сразу во всю силу и «рвёт» грудь или спину, — не инфаркт, пока не доказано: давление на обеих руках и КТ-ангиография."
  - ru: "Нитроглицерин в вену при расслоении — только после бета-адреноблокатора: без него сердце забьётся чаще и нагрузит стенку аорты."
  - ru: "Тромболизис и до КТ при подозрении на расслоение аорты нельзя: это абсолютное противопоказание."
simplified: "Интрамуральной гематомы, пенетрирующей язвы и травмы аорты нет; осложнённого типа B, тампонады, разрыва, недостаточности аортального клапана и мальперфузии органов — тоже: в игре тип A — всегда перевод, тип B — всегда неосложнённый, лечат в ПИТ. Шкалы ADD-RS нет; УЗИ сердца, чреспищеводной ЭхоКГ, МРТ, артериального катетера и операций — нет."
sources:
  - { kind: guideline, title: "Расслоение аорты", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/946_1", note: "ID 946_1, опубликованы 23.09.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.3: 6 случаев на 100 000 в год, АГ у 65–75 %, средний возраст 63 года, мужчин 65 % (IRAD), курение; раздел 1.5: Стэнфорд A и B, острое — до 14 дней; раздел 1.6: боль в груди 80 %, в спине 40 %, дефицит пульса 30 % A и 15 % B, обморок 15 % A и 5 % B; раздел 2.2: давление на обеих руках; раздел 2.4: КТ-ангиография аорты — предпочтительный метод; раздел 3.1.1: морфин в вену, бета-адреноблокатор в вену до САД 100–120 и ЧСС < 60, верапамил при противопоказаниях, нитроглицерин — после бета-адреноблокатора; раздел 3.2.1: тип A — решение об операции в первые 24 часа; раздел 3.2.3: неосложнённый тип B — медикаментозная терапия; приложение В: без лечения — почти всегда смертельное кровотечение; сроки течения и доли места боли — игровая оценка" }
  - { kind: guideline, title: "Острый инфаркт миокарда с подъемом сегмента ST электрокардиограммы", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/157_5", note: "ID 157_5, опубликованы 25.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 3.1.3: подозрение на расслоение аорты — абсолютное противопоказание к тромболизису" }
  - { kind: paper, title: "Hagan PG, Nienaber CA, Isselbacher EM и др. The International Registry of Acute Aortic Dissection (IRAD): new insights into an old disease. JAMA 2000;283(7):897–903", url: "https://pubmed.ncbi.nlm.nih.gov/10685714/", note: "PMID 10685714, сверено 05.10.2026: 464 больных, средний возраст 63 года, мужчин 65,3 %, тип A — 62,3 %; снимок груди без изменений — у 12,4 %, ЭКГ — у 31,3 %" }
  - { kind: review, title: "Klompas M. Does this patient have an acute thoracic aortic dissection? JAMA 2002;287(17):2262–2272", url: "https://pubmed.ncbi.nlm.nih.gov/11980527/", note: "PMID 11980527, сверено 05.10.2026: 21 исследование; сильная боль — у 90 %, внезапная — у 84 %, давление повышено у 49 %, дефицит пульса или разница давления — у 31 % (отношение правдоподобия 5,7); снимок груди изменён — чувствительность 90 %" }
  - { kind: paper, title: "Nazerian P, Mueller C, Soeiro AM и др. Diagnostic accuracy of the aortic dissection detection risk score plus D-dimer for acute aortic syndromes: the ADvISED prospective multicenter study. Circulation 2018;137(3):250–258", url: "https://pubmed.ncbi.nlm.nih.gov/29030346/", note: "PMID 29030346, сверено 05.10.2026: 1850 больных, острый аортальный синдром — у 241; D-димер выше 500 нг/мл — чувствительность 96,7 %, специфичность 64 %" }
review: draft
