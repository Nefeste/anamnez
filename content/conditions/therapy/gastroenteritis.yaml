id: cond.gastroenteritis
name: { ru: "Острый гастроэнтерит" }
icd10: A09
department: dept.therapy
kind: disease
severity: moderate
epidemiology:
  prevalence: common
  age: { min: 18 }
  season: { winter: 1.2, spring: 0.9, summer: 1.2, autumn: 0.9 }
  risks:
    - { id: risk.sick_contact, x: 2 }
    - { id: risk.travel, x: 3 }
params:
  severity: { mild: 80, moderate: 17, severe: 3 }
course:
  stages:
    - { id: active, days: [0, 3] }
    - { id: resolution, days: [3, 7] }
  presentation: [0, 2]
  selfLimiting: true
  untreated: { band: rarely, days: [1, 3] }
findings:
  - { f: sym.diarrhea, band: always }
  - { f: sym.nausea, band: usually }
  - { f: sym.vomiting, band: often }
  - { f: sym.abdominal_pain, band: often }
  - { f: sym.anorexia, band: often }
  - { f: sym.fatigue, band: often }
  - { f: sym.fever_hx, band: sometimes }
  - { f: vital.fever, band: sometimes }
  - { f: sym.myalgia, band: sometimes }
  - { f: sym.headache, band: sometimes }
  - { f: sign.dehydration, band: rarely }
  - { f: sign.dehydration, band: sometimes, when: { severity: [moderate] } }
  - { f: sign.dehydration, band: usually, when: { severity: [severe] } }
  - { f: vital.tachycardia, band: rarely }
  - { f: vital.tachycardia, band: usually, when: { severity: [severe] } }
  - { f: lab.wbc_high, band: sometimes }
  - { f: lab.crp_high, band: sometimes }
  - { f: sign.rlq_tenderness, band: very_rarely }
confirm: clinical
redFlags: [sign.dehydration]
treatment:
  firstLine: [tx.ors]
  supportive: [tx.rest_fluids, tx.paracetamol]
  notIndicated: [tx.amoxicillin, tx.amoxicillin_clavulanate, tx.macrolide, tx.fluoroquinolone, tx.cephalosporin_oral, tx.ppi, tx.ibuprofen]
  setting: { default: home, param: { name: severity, map: { mild: home, moderate: home, severe: ward } }, redFlag: ward }
texts:
  summary:
    ru: >-
      Кишечная инфекция, чаще вирусная: жидкий стул, тошнота и рвота, схваткообразная
      боль в животе, иногда температура. Проходит за несколько дней; главное — пить
      солевые растворы. Антибиотики почти никогда не нужны.
pearls:
  - ru: "При кишечной инфекции главное — восполнить воду и соли: солевые растворы маленькими глотками."
  - ru: "Боль, которая сместилась вправо вниз, без поноса — это не отравление, а повод думать об аппендиците."
simplified: "Кишечные инфекции с кровью в стуле и тяжёлые бактериальные — позже, с инфекционным отделением."
sources:
  - { kind: guideline, title: "Riddle MS et al. ACG Clinical Guideline: Diagnosis, Treatment, and Prevention of Acute Diarrheal Infections in Adults. Am J Gastroenterol 2016;111(5):602–622", note: "частоты — черновик" }
  - { kind: guideline, title: "Острые кишечные инфекции у взрослых", org: "Минздрав РФ", note: "точное название и редакцию сверить на cr.minzdrav.gov.ru" }
review: draft
