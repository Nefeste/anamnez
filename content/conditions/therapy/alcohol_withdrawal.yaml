id: cond.alcohol_withdrawal
name: { ru: "Синдром отмены алкоголя" }
# алкогольное абстинентное состояние (spec 2026-10-chapter-4, часть 54б): «комплекс вегетативных, соматических,
# неврологических и психических нарушений, возникающих у больных с синдромом зависимости при полном прекращении приёма или
# снижении дозы алкоголя» (784_1, раздел 1.1). МКБ-10 — F10.3 (раздел 1.4); с делирием (F10.4) в 784_1 его нет — нет и в игре
icd10: F10.3
department: dept.therapy
system: nerves
kind: disease
severity: serious
epidemiology:
  # «ААС самая частая причина обращения за специализированной медицинской помощью, однако… точные эпидемиологические данные
  # отсутствуют» (784_1, раздел 1.3). Полоса подобрана прогоном генератора — игровая оценка
  prevalence: common
  age: { min: 18 }
  # «возникающее только у больных СЗА» (раздел 1.6)
  requires: [cond.alcohol_dependence]
params:
  # тяжесть по CIWA-Ar (784_1, раздел 2.1): лёгкая — до 8 баллов, средняя — 9–15, тяжёлая — 16 и больше. Доли — игровая
  # оценка; скорая везёт тяжёлую чаще (economy.yaml, `ambulance.severe`)
  severity: { mild: 45, moderate: 35, severe: 20 }
course:
  stages:
    - { id: acute, days: [0, 5] }
  # «возникает через несколько часов после прекращения употребления алкоголя и, если не осложняется, проходит за 2-5 дней»
  # (раздел 1.1); самый опасный — 2–3 день (приложение В)
  presentation: [0, 2]
  selfLimiting: { when: { severity: [mild] } }
  # без лечения — судороги и психоз (раздел 1.1): доли и сроки — игровая оценка
  untreated:
    - { band: usually, days: [1, 3], when: { severity: [severe] } }
    - { band: sometimes, days: [1, 4], when: { severity: [moderate] } }
  # «курс лечения составляет, в среднем, до 10 суток» (раздел 6)
  stay: [5, 10]
findings:
  - f: hx.stopped_drinking
    band: { pct: 100 }
    note: "критерий диагноза 1 — недавнее прекращение приёма или снижение дозы алкоголя (784_1, раздел 2): у каждого"
  # частот симптомов в 784_1 нет — полосы игровые. Дрожь рук, пот, тревога, бессонница (раздел 2), пункты 2–4 CIWA-Ar
  # (приложение Г1)
  - { f: sym.tremor, band: usually }
  - { f: sym.sweating, band: usually }
  - { f: sym.anxiety, band: usually }
  - { f: sym.insomnia, band: usually }
  # влечение «опохмелиться» — основное отличие от похмелья (раздел 1.6)
  - { f: sym.craving, band: usually }
  # тошнота или рвота, тахикардия или артериальная гипертензия, головная боль (раздел 2)
  - { f: sym.nausea, band: often }
  - { f: sym.vomiting, band: sometimes }
  - { f: vital.tachycardia, band: often }
  - { f: vital.bp_high, band: often }
  - { f: sym.headache, band: sometimes }
  # обманы восприятия — при средней иногда, при тяжёлой обычно: «угрожающий делирий» (раздел 2.1)
  - { f: sym.hallucinations, band: sometimes, when: { severity: [moderate] } }
  - { f: sym.hallucinations, band: usually, when: { severity: [severe] } }
  # дезориентация — пункт 10 CIWA-Ar (приложение Г1)
  - { f: sym.confusion, band: often, when: { severity: [severe] } }
  # «ААС может осложняться большими судорожными припадками» (раздел 1.1; F10.31 — раздел 1.4): в игре — при средней и
  # тяжёлой, доли игровые
  - { f: sym.seizure, band: rarely, when: { severity: [moderate] } }
  - { f: sym.seizure, band: sometimes, when: { severity: [severe] } }
  - f: sign.ciwa
    band: { pct: 100 }
    when: { severity: [moderate] }
    note: "средняя степень — 9–15 баллов по CIWA-Ar (784_1, раздел 2.1): по определению"
  - f: sign.ciwa_16
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "тяжёлая степень — 16 баллов и больше по CIWA-Ar (784_1, раздел 2.1): по определению"
confirm: clinical
redFlags: [sym.seizure, sym.hallucinations, sym.confusion]
# дрожь, пот и спутанность — и гипогликемия; спутанность и бессонница у больного циррозом — печёночная энцефалопатия;
# судорожный припадок — первый приступ
differential: [cond.hypoglycemia, cond.hepatic_encephalopathy, cond.seizure]
treatment:
  # бензодиазепин — «всем пациентам с диагнозом ААС» (784_1, раздел 3.1, УУР A, УДД 1; критерий качества 6): диазепам —
  # «наиболее используемый»; при 16 баллах и больше — в вену (там же)
  firstLine: [tx.benzodiazepine]
  # противоэпилептический — «при наличии соответствующих показаний» (раздел 3.1, УУР A, УДД 2): дополнительно к бензодиазепину,
  # «когда проведение базового лечения… является недостаточным» — не ошибка
  acceptable: [tx.valproate_iv]
  # при лёгкой — «назначением жидкости и пероральных солевых составов для регидратации», при средней и тяжёлой — растворы в
  # вену (раздел 3.1)
  supportive: [tx.ors, tx.balanced_fluids, tx.iv_fluids]
  notIndicated: []
  harmful: []
  # тиамин — всем: профилактика энцефалопатии Гайе-Вернике (раздел 3.1, УУР C, УДД 5; критерий качества 7)
  prevent: [tx.thiamine]
  # приём психиатра-нарколога — каждому (раздел 6, УУР C, УДД 5; критерий качества 1)
  require: [tx.narcologist_consult]
  byParam:
    # лёгкая — «как правило, не требует активного медикаментозного вмешательства» (раздел 2.1): типичное — солевые растворы
    # внутрь
    - when: { severity: [mild] }
      plan: [tx.ors]
    # средняя и тяжёлая — бензодиазепин, когда баллы «превышают 8» (раздел 3.1), и растворы в вену — сбалансированные
    # полиионные (там же, УУР C, УДД 5; критерий качества 8)
    - when: { severity: [moderate, severe] }
      require: [tx.benzodiazepine, [tx.balanced_fluids, tx.iv_fluids]]
  setting:
    default: home
    # лёгкая — амбулаторно (раздел 6.2), средняя и тяжёлая, в том числе с судорожными припадками, — в стационаре (раздел 6.1)
    param: { name: severity, map: { mild: home, moderate: ward, severe: ward } }
    # тяжёлая — оценка каждые 10–15 минут и бензодиазепин в вену (раздел 3.1): ПИТ не ошибка (игровая оценка; критериев
    # перевода в ОРИТ в 784_1 нет)
    also:
      - { when: { severity: [severe] }, settings: [icu] }
texts:
  summary:
    ru: >-
      У зависимого от алкоголя, который бросил пить, через несколько часов начинаются дрожь рук, пот, тревога, бессонница,
      тошнота, частый пульс; тянет опохмелиться. Тяжесть считают по шкале CIWA-Ar: лёгкую лечат дома, среднюю и тяжёлую — в
      стационаре бензодиазепином и растворами в вену. Тиамин и консультация нарколога — каждому. Тяжёлая отмена грозит
      судорогами и белой горячкой.
pearls:
  - ru: "Дрожь, пот и тревога у человека, который вчера бросил пить, — спросите про запои и посчитайте CIWA-Ar: от баллов зависит, отпустить ли домой."
  - ru: "Тиамин — каждому с синдромом отмены: без него грозит энцефалопатия Вернике."
simplified: "Делирия (белой горячки) нет: в 784_1 его нет. CIWA-Ar считают один раз при приёме, без переоценки по часам. Барбитуратов, антиоксидантов и габапентина нет; калий, натрий и кислотно-основное состояние не считают."
sources:
  - { kind: guideline, title: "Психические и поведенческие расстройства, вызванные употреблением алкоголя. Синдром отмены алкоголя (алкогольное абстинентное состояние)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/784_1", note: "ID 784_1, опубликованы 20.05.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.1: возникает через несколько часов после прекращения употребления и проходит за 2–5 дней, может осложняться судорогами и психозом; раздел 1.3: точных эпидемиологических данных нет; раздел 1.4: F10.30, F10.31 — с судорожными припадками; раздел 1.6: только у больных синдромом зависимости, влечение опохмелиться — основное отличие от похмелья; раздел 2: критерии диагноза и список признаков; раздел 2.1 (УУР C, УДД 4): шкала CIWA-Ar — 0–8, 9–15, 16 и более; раздел 3.1: бензодиазепины всем (УУР A, УДД 1), при 16 и более — в вену, растворы при средней и тяжёлой (УУР C, УДД 5), тиамин всем (УУР C, УДД 5), противоэпилептические — при показаниях (УУР A, УДД 2); раздел 6: приём нарколога (УУР C, УДД 5), курс — в среднем до 10 суток; разделы 6.1–6.2: средняя, тяжёлая и с судорогами — стационар, лёгкая — амбулаторно; критерии качества 1, 6, 7, 8; доли тяжести и полосы признаков, судороги только при средней и тяжёлой — игровая оценка" }
review: draft
