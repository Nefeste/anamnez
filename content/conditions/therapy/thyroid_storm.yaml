id: cond.thyroid_storm
name: { ru: "Тиреотоксический криз" }
# «Тиреотоксический криз (ТК) – опасное состояние, угрожающее жизни больного» (spec 2026-10-chapter-4, часть 56б; 270_2, раздел
# 3.5); МКБ-10 — E05.5 «Тиреотоксический криз или кома» (раздел 1.4). Фоновой записи тиреотоксикоза нет: знают ли о нём — параметр
icd10: E05.5
department: dept.therapy
system: metabolic
kind: disease
severity: critical
epidemiology:
  # частоты криза в 270_2 нет, смертность — около 10 % (раздел 3.5); полоса подобрана прогоном генератора — игровая оценка
  prevalence: ultra_rare
  # возраст и пол — как у тиреотоксикоза (раздел 1.3)
  age: { min: 18, peak: [30, 60] }
  sex: { m: 0.2, f: 1 }
params:
  # знают ли о тиреотоксикозе: критерии криза приведены для больных с тяжёлым течением болезни Грейвса (раздел 3.5), но он бывает
  # и первым проявлением — доля игровая
  diagnosed: { yes: 70, no: 30 }
  # криз при узловом зобе ведут так же (раздел 3.6); доли — игровая оценка
  cause: { graves: 80, nodular: 20 }
course:
  stages:
    - { id: storm, days: [0, 7] }
  presentation: [0, 1]
  # «При смертности, оцениваемой в 10%, ТК требует быстрой диагностики и экстренного лечения» (раздел 3.5): без лечения — игровая
  # оценка
  untreated: { band: usually, days: [1, 3] }
  stay: [7, 14]
findings:
  - f: hx.thyrotoxicosis
    band: { pct: 100 }
    when: { diagnosed: [yes] }
    note: "по определению параметра: тиреотоксикоз уже находили"
  # диагностические критерии: «лихорадку, тахикардию, аритмию, застойную сердечную недостаточность, возбуждение, бред, психоз,
  # ступор, кому, тошноту, рвоту, диарею, печеночную недостаточность» (раздел 3.5). Частот нет — полосы игровые; аритмий, кроме
  # частого пульса, в игре нет
  - { f: vital.fever, band: always }
  - { f: vital.tachycardia, band: always }
  - { f: vital.tachycardia_150, band: sometimes }
  - { f: sym.dyspnea, band: sometimes }
  - { f: sym.confusion, band: usually }
  - { f: sign.gcs_low, band: sometimes }
  - { f: sym.nausea, band: often }
  - { f: sym.vomiting, band: often }
  - { f: sym.diarrhea, band: often }
  - { f: sign.jaundice, band: sometimes }
  # фон — тиреотоксикоз (раздел 1.6)
  - { f: sym.weight_loss, band: usually }
  - { f: sym.tremor, band: often }
  - { f: sym.heat_intolerance, band: often }
  - { f: sign.goiter, band: usually }
  - { f: sign.exophthalmos, band: often, when: { cause: [graves] } }
  - { f: lab.tsh_low, band: always }
  - { f: lab.ft4_high, band: always }
# «ТК требует быстрой диагностики и экстренного лечения» (раздел 3.5): в приёмном — по признакам, гормоны подтвердят позже
confirm: clinical
redFlags: [sym.confusion, sign.gcs_low, vital.tachycardia_150]
# лихорадка, частый пульс и спутанность — как при сепсисе и синдроме отмены алкоголя (сравнения в 270_2 нет — игровая оценка);
# тиреотоксикоз — тот же, без угрозы жизни
differential: [cond.sepsis, cond.alcohol_withdrawal, cond.thyrotoxicosis]
treatment:
  # «Рекомендуется использовать мультимодальный подход к лечению пациентов с БГ и тиреотоксическим кризом, включающий терапию
  # антитиреоидными препаратами, введение системных глюкокортикоидов, бета-адреноблокаторов, ликвидацию гипоксии, гипертермии,
  # дегидратации, реанимационные мероприятия, симптоматическую терапию, пищевую поддержку, респираторную помощь и мониторинг в
  # отделении интенсивной терапии» (раздел 3.5, УУР С, УДД 4). Тионамид — первая линия: тиамазол или пропилтиоурацил; глюкокортикоид
  # в вену и бета-адреноблокатор — обязательно; раствор и жаропонижающее — облегчают (препаратов в 270_2 нет — игровая оценка)
  firstLine: [tx.thiamazole]
  acceptable: [tx.propylthiouracil]
  supportive: [tx.iv_fluids, tx.paracetamol]
  notIndicated: []
  harmful: []
  require: [tx.steroid_iv, [tx.beta_blocker, tx.beta_blocker_iv]]
  # «мониторинг в отделении интенсивной терапии» (раздел 3.5), экстренная госпитализация (раздел 6)
  setting: { default: icu }
texts:
  summary:
    ru: >-
      Угрожающее жизни обострение тиреотоксикоза: гормонов щитовидной железы столько, что отказывают сердце, мозг и печень. Жар,
      пульс за 120, возбуждение или забытьё, рвота и понос, бывает желтуха; у многих тиреотоксикоз уже известен, железа увеличена.
      Лечат сразу и вместе: тиамазол, глюкокортикоид в вену и бета-адреноблокатор, в палате интенсивной терапии.
pearls:
  - ru: "Жар, частый пульс и спутанность у больного тиреотоксикозом — тиреотоксический криз: в ПИТ, лечение сразу."
  - ru: "При кризе — три лекарства вместе: тиамазол, глюкокортикоид в вену и бета-адреноблокатор."
  - ru: "Анализов не ждут: ТТГ и свободный Т4 подтвердят диагноз потом."
simplified: "Фоновой записи тиреотоксикоза нет: с ним приходят и сами, и кризом. Шкал криза в 270_2 нет — его узнают по признакам. Фибрилляции предсердий и сердечной недостаточности, препаратов йода и плазмафереза нет; причину криза не ищут."
sources:
  - { kind: guideline, title: "Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/270_2", note: "ID 270_2, опубликованы 20.06.2025, применяются; сверено с рубрикатором 12.10.2026; раздел 1.4: E05.5; раздел 3.5: определение, смертность около 10 %, диагностические критерии у больных с тяжёлым течением болезни Грейвса, мультимодальное лечение — антитиреоидные препараты, системные глюкокортикоиды, бета-адреноблокаторы, ликвидация гипоксии, гипертермии и дегидратации, мониторинг в отделении интенсивной терапии (УУР С, УДД 4); раздел 6: экстренная госпитализация; шкалы криза в рекомендации нет; доли, полосы и сроки — игровая оценка" }
review: draft
