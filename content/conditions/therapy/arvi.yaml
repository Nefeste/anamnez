id: cond.arvi
name: { ru: "Острая респираторная вирусная инфекция (ОРВИ)" }
icd10: J06.9
department: dept.therapy
system: airways
group: grp.viral_respiratory
kind: disease
severity: minor
epidemiology:
  prevalence: very_common
  age: { min: 18 }
  season: { winter: 1.3, spring: 1.0, summer: 0.6, autumn: 1.2 }
  risks:
    - { id: risk.sick_contact, x: 1.5 }
course:
  stages:
    - { id: onset, days: [0, 2] }
    - { id: peak, days: [2, 5] }
    - { id: resolution, days: [5, 10] }
  presentation: [1, 5]
  selfLimiting: true
findings:
  - { f: sym.rhinorrhea, band: usually }
  - { f: sym.sore_throat, band: often }
  - { f: sym.cough, band: often, attrs: { character: { dry: 60, productive: 40 } } }
  - { f: sym.cough_long, band: rarely, stages: [resolution] }
  - { f: sym.fever_hx, band: sometimes }
  - { f: vital.fever, band: rarely }
  - { f: sym.myalgia, band: sometimes }
  - { f: sym.headache, band: sometimes }
  - { f: sym.chills, band: rarely }
  - { f: sym.abrupt_onset, band: rarely }
  - { f: sign.pharyngeal_hyperemia, band: usually }
  - { f: sign.tonsillar_exudate, band: rarely }
  - { f: sign.tender_cervical_nodes, band: rarely }
  - { f: lab.wbc_high, band: rarely }
  - { f: lab.crp_high, band: very_rarely }
  - { f: img.cxr_infiltrate, band: never }
confirm: clinical
treatment:
  firstLine: [tx.rest_fluids]
  supportive: [tx.paracetamol, tx.ibuprofen, tx.nasal_saline]
  notIndicated: [tx.amoxicillin, tx.amoxicillin_clavulanate, tx.macrolide, tx.oseltamivir, tx.steroid_systemic_short]
  setting: { default: home }
texts:
  summary:
    ru: >-
      Вирусное воспаление верхних дыхательных путей: насморк, першение и боль в горле,
      кашель, иногда небольшая температура. Проходит само за неделю-полторы; антибиотики
      не помогают.
pearls:
  - ru: "Насморк и умеренная боль в горле без налётов — довод за вирусную инфекцию."
  - ru: "Антибиотик при ОРВИ не показан: он не ускоряет выздоровление."
sources:
  - { kind: guideline, title: "Острые респираторные вирусные инфекции (ОРВИ) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/724_2", note: "ID 724_2, опубликованы 04.08.2025, применяются; сверено с рубрикатором 28.09.2026; частоты — черновик прототипа" }
review: draft
