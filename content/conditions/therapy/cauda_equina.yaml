id: cond.cauda_equina
name: { ru: "Синдром конского хвоста" }
# большая грыжа диска сдавливает корешки конского хвоста (spec 2026-10-chapter-4, часть 58б): «Синдром поражения корешков
# конского хвоста» — «Тазовые расстройства, парезы конечностей, анестезия промежности» (777_1, раздел 2.2, табл. 2). Определения
# и своего шифра в 777_1 нет: G83.4 — синдром конского хвоста по МКБ-10
icd10: G83.4
department: dept.therapy
system: nerves
kind: syndrome
severity: critical
# приходят сами и привозит скорая; показание для экстренной госпитализации (раздел 6)
epidemiology:
  # «В редких случаях, когда возникают нарушения мочеиспускания, дефекации и слабость ног, требуется экстренная операция»
  # (приложение В): частоты нет — в 100 раз реже радикулопатии, игровая оценка; скорая везёт тяжёлых чаще — среди привезённых
  # он реже отравления угарным газом
  prevalence: exceptionally_rare
  age: { min: 18, peak: [40, 64] }
  sex: { m: 1.3, f: 1 }
course:
  stages:
    - { id: acute, days: [0, 14] }
  presentation: [0, 2]
  # экстренная операция «снижает боль и предупреждает инвалидность» (раздел 3.2, Р36): без перевода хуже обычно, игровая оценка
  untreated: { band: usually, days: [1, 7] }
findings:
  - f: sym.back_pain
    band: { pct: 100 }
    note: "сдавлены корешки той же грыжей диска (777_1, раздел 2.2, табл. 2): боль в спине — у каждого, игровая оценка"
  - { f: sym.sciatica, band: usually }
  # пять наборов признаков в 777_1 (таблица 2, разделы 2.4, 3.2, 6, приложение В): нарушения мочеиспускания, онемение
  # промежности, слабость ног; частот нет — полосы игровые
  - { f: sym.urinary_retention, band: usually }
  - { f: sym.saddle_numbness, band: usually }
  - { f: sym.legs_weak, band: often }
  - { f: sign.saddle_anesthesia, band: usually }
  - { f: sign.legs_paresis, band: often }
  - { f: sign.bladder_distended, band: often }
  - { f: sign.ankle_reflex_low, band: usually }
  - { f: sign.slr_positive, band: often }
  - f: img.mri_canal_block
    band: { pct: 100 }
    note: "канал перекрыт грыжей у каждого — по определению синдрома в игре; увидит ли это МРТ — точность обследования"
# сдавление видно на МРТ: экстренная МРТ — «с целью определения дальнейшей тактики лечения» (раздел 2.4, Р11)
confirm: [exam.mri_spine]
# задержка мочи и онемение промежности — экстренная госпитализация (раздел 6)
redFlags: [sym.urinary_retention, sym.saddle_numbness, sign.saddle_anesthesia]
differential: [cond.radiculopathy]
treatment:
  # экстренная МРТ и срочно нейрохирург (табл. 2), операция «в ранние сроки (первые дни заболевания)» (раздел 3.2, Р36, УУР B,
  # УДД 2); нейрохирургии в игре нет — перевод. Обезболивание НПВП — не ошибка; системные ГК не рекомендуются (Р31)
  firstLine: []
  acceptable: [tx.ibuprofen]
  notIndicated: [tx.steroid_systemic_short, tx.bed_rest]
  setting: { default: transfer }
texts:
  summary:
    ru: >-
      Большая грыжа диска перекрывает позвоночный канал и сдавливает корешки конского хвоста — те, что идут к ногам, мочевому
      пузырю и промежности. Боль в спине и в ногах, не получается помочиться или моча подтекает, немеет промежность, слабеют
      обе ноги. Нужны экстренная МРТ и нейрохирург: операция в первые дни предупреждает инвалидность. Домой — нельзя.
pearls:
  - ru: "Боль в спине и задержка мочи — спросить про онемение промежности и проверить её чувствительность."
  - ru: "Слабость обеих ног — не один корешок: перекрыт канал."
  - ru: "Отпустить домой с обезболивающим — пропустить операцию, которая предупреждает инвалидность."
simplified: "Конский хвост в игре — только от грыжи диска: опухолей, переломов, абсцессов и стеноза канала нет. Ректального осмотра, катетера и остаточной мочи в 777_1 нет — в игре тоже. Операции нет: перевод в нейрохирургию."
sources:
  - { kind: guideline, title: "Дискогенная пояснично-крестцовая радикулопатия", org: "Минздрав РФ", year: 2023, url: "https://cr.minzdrav.gov.ru/view-cr/777_1", note: "ID 777_1, опубликованы 07.12.2023, применяются; сверено с рубрикатором 12.10.2026; раздел 2.2, табл. 2: тазовые расстройства, парезы конечностей, анестезия промежности — МРТ или КТ, срочная консультация нейрохирурга; раздел 2.4, Р11 (УУР C, УДД 5): экстренная МРТ или КТ при синдроме конского хвоста; раздел 3.2, Р36 (УУР B, УДД 2): экстренная операция в первые дни снижает боль и предупреждает инвалидность; раздел 6: подозрение на синдром — показание к экстренной госпитализации; приложение В: в редких случаях — нарушения мочеиспускания, дефекации и слабость ног, нужна экстренная операция; частоты, доли признаков и полоса — игровая оценка; шифр G83.4 — МКБ-10" }
review: draft
