id: cond.av_block
name: { ru: "АВ-блокада II–III степени" }
# полная — I44.2; Мобитц II — I44.1: в игре одна болезнь с видом блока — тактика та же (spec 2026-10-chapter-3,
# часть 42в)
icd10: I44.2
department: dept.therapy
system: heart
kind: disease
severity: critical
# приобретённая далеко зашедшая II степени и полная — «200 случаев на миллион в год» (160_2, раздел 1.3); у
# пожилых, при ИБС и сердечной недостаточности чаще (раздел 1.2: ИБС, инфаркт, кардиомиопатии среди причин) —
# возраст и множители игровая оценка
epidemiology:
  prevalence: extremely_rare
  age: { min: 50, peak: [65, 90] }
  sex: { m: 1, f: 0.8 }
  risks:
    - { id: risk.vascular, x: 3 }
    - { id: risk.heart_failure, x: 3 }
params:
  # вид: Мобитц II, полная с узким выскальзывающим ритмом из АВ-соединения и полная с широким — из желудочков
  # (раздел 1.5: уровень — ПЖУ или ниже). Атропин «наиболее эффективен при ПЖБ на уровне ПЖУ» (раздел 3.1.2) — в
  # игре помогает только при узком. Доли — игровая оценка
  block: { mobitz2: 30, narrow: 25, wide: 45 }
  # нестабильный — гемодинамически значимая брадикардия (раздел 3.1.2): в игре — давление ниже 90; доля — игровая
  # оценка
  unstable: { yes: 30, no: 70 }
course:
  stages:
    - { id: acute, days: [0, 3] }
  presentation: [0, 0]
  # без стимуляции и кардиостимулятора — хуже: нестабильный — сразу, стабильный — обычно в первые дни (обмороки,
  # асистолия); игровая оценка, в 160_2 долей нет
  untreated:
    - { band: always, days: [0, 0], when: { unstable: [yes] } }
    - { band: usually, days: [0, 3] }
findings:
  # полная блокада — выскальзывающий ритм реже 50 у каждого; Мобитц II 3 : 2 и 2 : 1 — обычно (игровая оценка)
  - f: vital.bradycardia
    band: { pct: 100 }
    when: { block: [narrow, wide] }
    note: "при полной блокаде желудочки бьются в своём выскальзывающем ритме — 20–55 в минуту (160_2, раздел 1.5); в игре реже 50 у каждого"
  - { f: vital.bradycardia, band: usually, when: { block: [mobitz2] } }
  - f: ecg.av_block
    band: { pct: 100 }
    attrs: { kind: $block }
    note: "блокада видна на ЭКГ у каждого, у кого она есть: признак — это она сама (160_2, раздел 2: диагноз — по ЭКГ с клиникой)"
  - f: vital.bp_low
    band: { pct: 100 }
    when: { unstable: [yes] }
    note: "нестабильный в игре — с давлением ниже 90 по определению параметра (160_2, раздел 3.1.2: гемодинамически значимая брадикардия)"
  # симптомы (раздел 1.6): головокружение и спутанность, предобмороки и обмороки до приступов Морганьи — Адамса —
  # Стокса, слабость и утомляемость, одышка; доли — игровая оценка
  - { f: sym.dizziness, band: usually }
  - { f: sym.syncope, band: often }
  - { f: sym.fatigue, band: often }
  - { f: sym.dyspnea, band: sometimes }
  - { f: sign.pallor, band: usually, when: { unstable: [yes] } }
# пульс чаще 100 при блокаде II–III степени не бывает: к желудочкам проходит лишь часть импульсов или ни
# одного — и у того, у кого частый пульс пришёл бы с фоном (игровое правило)
masks: [vital.tachycardia]
# диагноз — по ЭКГ: «на основании документированного подтверждения… электрокардиография… в сочетании с клинической
# симптоматикой» (160_2, раздел 2)
confirm: [exam.ecg]
redFlags: [vital.bp_low, ecg.av_block]
treatment:
  # стабильному на месте лечить нечего: постоянный кардиостимулятор при Мобитц II, высокой и III степени «независимо
  # от наличия симптомов» (160_2, раздел 3.3.2, ЕОК IC) — в центре, где его ставят (раздел 6). С симптомами атропин и
  # допамин можно (раздел 3.1.2); стимуляция стабильному — не нужна (раздел 3.2: при гемодинамически значимой).
  # Вредно то, что тормозит проведение: бета-адреноблокаторы, блокаторы кальциевых каналов, антиаритмические I и III
  # классов (раздел 1.2 — причины брадиаритмий), трифосаденин блокирует АВ-узел
  firstLine: []
  acceptable: [tx.atropine, tx.dopamine]
  harmful: [tx.beta_blocker, tx.beta_blocker_iv, tx.verapamil, tx.verapamil_iv, tx.trifosadenine, tx.amiodarone_iv, tx.procainamide]
  notIndicated: [tx.pacing_tc, tx.vagal, tx.cardioversion]
  byParam:
    # нестабильному — до перевода (раздел 3.1.2; приложение Б, табл. 3): атропин — мост; не помог — стимуляция
    # через кожу (раздел 3.2: при рефрактерности к лекарствам, ЕОК I C; когда трансвенозная недоступна, ЕОК IIa C)
    # или допамин «при низкой вероятности ИБС»
    - when: { unstable: [yes], block: [narrow] }
      beforeTransfer: [[tx.atropine, tx.pacing_tc, tx.dopamine]]
    # широкий выскальзывающий ритм и Мобитц II — блок ниже АВ-узла: атропин в игре не поможет — стимуляция или
    # допамин
    - when: { unstable: [yes], block: [wide, mobitz2] }
      beforeTransfer: [[tx.pacing_tc, tx.dopamine]]
  # госпитализация — туда, где реанимация и мониторное наблюдение, оптимально — где ставят кардиостимулятор; «при
  # отсутствии технической возможности — направление в учреждение, где проводится имплантация» (раздел 6)
  setting: { default: transfer }
texts:
  summary:
    ru: >-
      Импульс от предсердий к желудочкам проходит не весь: при Мобитц II часть ударов выпадает, при полной блокаде
      желудочки бьются в своём редком ритме. Головокружение, слабость, обмороки; пульс реже 50. Диагноз — по ЭКГ.
      Кардиостимулятор нужен и без симптомов — перевод в центр, где его ставят. При низком давлении до перевода —
      атропин (при узких комплексах), наружная стимуляция или допамин. Бета-адреноблокаторы и верапамил нельзя.
pearls:
  - ru: "Редкий пульс и головокружение или обморок — ЭКГ сразу: полная блокада бывает и при нормальном давлении."
  - ru: "При широких комплексах выскальзывающего ритма атропин не поможет — стимуляция через кожу или допамин."
  - ru: "Бета-адреноблокаторы, верапамил и антиаритмические препараты при блокаде нельзя: они ещё сильнее тормозят проведение."
simplified: "Блокады I степени и Мобитц I, синдрома слабости синусового узла, лекарственной брадикардии и блокад ножек в игре нет. Обратимые причины — лекарства, калий, гипотиреоз, инфаркт — не ищут; адреналина и временной трансвенозной стимуляции нет; постоянный кардиостимулятор ставят в центре, после перевода."
sources:
  - { kind: guideline, title: "Брадиаритмии и нарушения проводимости", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/160_2", note: "ID 160_2, опубликованы 18.06.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.3: далеко зашедшая II степени и полная — 200 на миллион в год; раздел 1.5: Мобитц II, полная, уровень блока; раздел 1.6: головокружение, обмороки, приступы Морганьи — Адамса — Стокса, слабость, одышка; раздел 3.1.2: атропин и допамин при симптомах и гемодинамически значимом состоянии; раздел 3.2: временная стимуляция при рефрактерности (ЕОК I C); раздел 3.3.2: постоянная стимуляция при Мобитц II, высокой и III степени независимо от симптомов (ЕОК IC); раздел 6: госпитализация с реанимацией и мониторингом, оптимально — где ставят кардиостимулятор, иначе направление; доли и множители — игровая оценка" }
review: draft
