id: cond.adrenal_crisis
name: { ru: "Надпочечниковый криз" }
# «жизнеугрожающее осложнение надпочечниковой недостаточности (НН), возникающее при несоответствии уровня кортизола
# увеличенной потребности в нем» (spec 2026-10-chapter-4, часть 56а; 524_3, «Термины и определения»). МКБ-10 — E27.2 «Аддисонов
# криз» (раздел 1.4). Фоновой записи надпочечниковой недостаточности нет: с ней приходят только кризом, а распространённость —
# 100–144 на миллион (раздел 1.3)
icd10: E27.2
department: dept.therapy
system: metabolic
kind: disease
severity: critical
epidemiology:
  # кризов — 6,6–8,3 на 100 пациенто-лет (раздел 3); полоса подобрана прогоном генератора — игровая оценка
  prevalence: ultra_rare
  # первичная недостаточность у взрослых — чаще аутоиммунная; возраст и доля женщин — игровая оценка («увеличение
  # распространенности, особенно среди женщин», раздел 1.3)
  age: { min: 18, peak: [25, 60] }
  sex: { m: 1, f: 1.3 }
params:
  # известна ли болезнь: криз бывает и первым её проявлением, доли в 524_3 нет — игровая оценка
  known: { yes: 70, no: 30 }
  # что вызвало криз: «Наиболее частой причиной кризов являются инфекции: ЖКТ – 32,6 % и 24,3 % – иной локализации» (раздел
  # 3); остальное — без явной причины, игровая оценка
  trigger: { gi: 33, infection: 24, none: 43 }
  # шок — давление ниже 90: «Выраженная гипотензия» (табл. 3); доля — игровая оценка
  shock: { yes: 50, no: 50 }
course:
  stages:
    - { id: crisis, days: [0, 7] }
  # «Среднее время от проявления первых симптомов до явного надпочечникового криза – 1 день» (раздел 3)
  presentation: [0, 1]
  # «Несвоевременное лечение значительно увеличивает летальность» (раздел 3): доли и сроки — игровая оценка
  untreated:
    - { band: always, days: [0, 1], when: { shock: [yes] } }
    - { band: usually, days: [0, 2], when: { shock: ['no'] } }
  # гидрокортизон в вену — несколько суток с постепенным снижением дозы, потом таблетки (табл. 6); выписка — при стойком
  # улучшении и нормальных электролитах (раздел 6). Сроки — игровая оценка
  stay: [6, 10]
findings:
  - f: hx.adrenal_insufficiency
    band: { pct: 100 }
    when: { known: [yes] }
    note: "по определению параметра: болезнь Аддисона уже находили, принимает гидрокортизон"
  # табл. 3: при кризе — выраженная слабость, обмороки, боли в животе, тошнота и рвота, «клинические симптомы, идентичные „острому
  # животу“», резкие боли в пояснице, спутанность, сопор; выраженная гипотензия, лихорадка, олигурия; гипонатриемия (менее 132),
  # гиперкалиемия, гипогликемия, повышение креатинина. Частот в 524_3 нет — полосы игровые
  - { f: sym.fatigue, band: always }
  - f: vital.bp_low
    band: { pct: 100 }
    when: { shock: [yes] }
    note: "по определению параметра: шок — давление ниже 90"
  - { f: sym.dizziness, band: often }
  - { f: sym.syncope, band: sometimes }
  - { f: sym.nausea, band: usually }
  - { f: sym.vomiting, band: usually, when: { trigger: [gi] } }
  - { f: sym.vomiting, band: often, when: { trigger: [infection, none] } }
  - { f: sym.diarrhea, band: usually, when: { trigger: [gi] } }
  - { f: sym.abdominal_pain, band: often }
  - { f: sym.back_pain, band: sometimes }
  - { f: vital.fever, band: usually, when: { trigger: [infection] } }
  - { f: vital.fever, band: often, when: { trigger: [gi] } }
  - { f: vital.fever, band: sometimes, when: { trigger: [none] } }
  - { f: vital.tachycardia, band: often }
  - { f: sym.confusion, band: sometimes }
  - { f: sign.gcs_low, band: sometimes, when: { shock: [yes] } }
  - { f: lab.na_low, band: usually }
  # «чаще после манифестации гипонатриемии» (раздел 1.6)
  - { f: lab.k_high, band: often }
  - { f: lab.glucose_low, band: sometimes }
  - { f: lab.creatinine_high, band: often }
  # только при первичной, бывает незаметна (раздел 1.6)
  - { f: sign.hyperpigmentation, band: often }
  # хроническая недостаточность до криза: «Анорексия, абдоминальный дискомфорт», «Снижение веса» (табл. 3)
  - { f: sym.anorexia, band: often }
  - { f: sym.weight_loss, band: sometimes }
# диагноз в приёмном — по признакам; подтверждающие пробы — после лечения, когда больному лучше (разделы 2 и 3)
confirm: clinical
redFlags: [vital.bp_low, sym.confusion, sign.gcs_low]
# «клинические симптомы, идентичные „острому животу“» (табл. 3); рвота и понос — как при кишечной инфекции; лихорадка и шок — как
# при сепсисе
differential: [cond.gastroenteritis, cond.sepsis, cond.appendicitis]
treatment:
  # гидрокортизон — «Пациентам с АК рекомендуется проводить терапию гидрокортизоном» (раздел 3, УУР C, УДД 4); «В качестве
  # альтернативы возможно назначение в эквивалентных дозах #преднизолона» — системные ГКС можно. Кровь на кортизол и АКТГ — до
  # первой дозы, «если имеется такая возможность» (раздел 2); декстроза на солевом растворе — вместо него (табл. 6)
  firstLine: [tx.hydrocortisone_iv]
  acceptable: [tx.steroid_iv, tx.cortisol_sample, tx.dextrose_infusion]
  supportive: []
  # «при АК введение адренергических и дофаминергических средств неэффективно, так как глюкокортикоидный дефицит уменьшает
  # сосудистую реактивность к норадреналину» (раздел 3)
  notIndicated: [tx.norepinephrine]
  harmful: []
  # провести гидратацию (раздел 3, УУР C, УДД 4): 0,9 % натрия хлорид в первый час (табл. 6) — обязательно, срок —
  # target.adrenal_saline
  require: [tx.iv_fluids]
  plan: [tx.hydrocortisone_iv]
  # «Показания для госпитализации … (форма – экстренная …): 1) АК; 2) подозрение на АК» (раздел 6); показаний к ОРИТ в 524_3 нет
  # — при шоке и без него ПИТ не ошибка
  setting:
    default: ward
    also:
      - { when: { shock: [yes, 'no'] }, settings: [icu] }
texts:
  summary:
    ru: >-
      Острая нехватка гормонов коры надпочечников. Бывает у больных болезнью Аддисона, когда при инфекции, рвоте и поносе
      гидрокортизона нужно больше, чем они получают, а иногда — первым проявлением болезни. Выраженная слабость, рвота, боль в
      животе, как при «остром животе», давление падает, бывает спутанность; натрий низкий, калий высокий. Гидрокортизон в вену и
      солевой раствор — сразу, не дожидаясь анализов: кровь на кортизол берут до первой дозы.
pearls:
  - ru: "Рвота, боль в животе и давление ниже 90 у больного болезнью Аддисона — надпочечниковый криз: гидрокортизон в вену сразу."
  - ru: "Анализы на кортизол не ждут: кровь — до первой дозы, лечение — сразу за забором."
  - ru: "Норэпинефрин без гидрокортизона давление при кризе не поднимет."
simplified: "Фоновой записи надпочечниковой недостаточности нет: с ней приходят только кризом. Доз нет; минералокортикоид, обучение больного и проба для подтверждения диагноза — после смены. Гиперкалиемию и гипогликемию отдельно не лечат: их выправляют гидрокортизон с раствором. Вторичной недостаточности и врождённой дисфункции коры надпочечников нет."
sources:
  - { kind: guideline, title: "Первичная надпочечниковая недостаточность", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/524_3", note: "ID 524_3, опубликованы 22.04.2025, применяются; сверено с рубрикатором 11.10.2026; «Термины и определения»: аддисонический криз; раздел 1.3: распространённость 100–144 на миллион; раздел 1.4: E27.2; раздел 1.6, табл. 3: клиника хронической недостаточности и криза, гипонатриемия менее 132 ммоль/л, гиперкалиемия, гипогликемия, повышение креатинина, гиперпигментация только при первичной; раздел 2: забор крови, если имеется возможность, и лечение, не дожидаясь результатов; раздел 3: кризов 6,6–8,3 на 100 пациенто-лет, инфекции ЖКТ — 32,6 %, иной локализации — 24,3 %, от первых симптомов до криза в среднем 1 день; незамедлительно (УУР C, УДД 5), гидрокортизон, альтернатива — преднизолон (УУР C, УДД 4), гидратация (УУР C, УДД 4), вазопрессоры без глюкокортикоидов неэффективны; табл. 6: 0,9 % натрия хлорид в течение первого часа; раздел 6: криз и подозрение на криз — экстренная госпитализация; доли, полосы признаков, сроки и место — игровая оценка" }
review: draft
