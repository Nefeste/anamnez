id: cond.anaphylaxis
name: { ru: "Анафилактический шок" }
# T78.2 — анафилактический шок неуточнённый (263_2, раздел 1.4)
icd10: T78.2
department: dept.therapy
# шок — сосуды не держат давление: «Сердце и сосуды»
system: heart
kind: syndrome
severity: critical
epidemiology:
  # анафилаксия — 1,5–7,9 на 100 000 в год, анафилактический шок в Казани — 0,37 на 10 000 (263_2,
  # раздел 1.3); в игре чаще, чтобы встречался в смене: игровая оценка
  prevalence: rare
  # возраст и пол заболевших в тексте не даны; в игре — взрослые
  age: { min: 18 }
params:
  # лекарства 31,2–46,5 %, пища 23,3–31 %, яд перепончатокрылых 14,9–20 %, не установлена — 24–26 %
  # (раздел 1.2): 40 : 25 : 20 : 15 — игровая оценка по этим числам
  trigger: { drug: 40, food: 25, sting: 20, unknown: 15 }
course:
  stages:
    - { id: acute, days: [0, 1] }
  # начало обычно в течение 2 ч после контакта (раздел 1.6): приходят в тот же день
  presentation: [0, 0]
  # при смертельных реакциях до остановки кровообращения — в среднем 30, 15 и 5 минут (пища, яд,
  # лекарства в вену; раздел 1.6); летальность — до 1 % (раздел 1.3): без эпинефрина хуже «обычно» —
  # игровая оценка
  untreated: { band: usually, days: [0, 0] }
findings:
  # признаки — разделы 2.1–2.2; частот в тексте нет — полосы игровые
  - { f: sym.hives, band: usually }
  - { f: sym.dyspnea, band: often }
  - { f: sym.dizziness, band: often }
  - { f: sym.wheezing, band: sometimes }
  - { f: sym.vomiting, band: sometimes }
  - { f: sym.abdominal_pain, band: rarely }
  - { f: sign.angioedema, band: often }
  # стридор и осиплость — возможны со 2-й степени (раздел 1.5)
  - { f: sign.stridor, band: sometimes }
  - { f: sign.wheezes, band: sometimes }
  # шок — верхнее давление ниже 90 или на 30 % ниже рабочего (термины): у 1-й степени оно бывает выше
  # 90 — «обычно», игровая оценка
  - { f: vital.bp_low, band: usually }
  - { f: vital.tachycardia, band: usually }
  - { f: vital.tachypnea, band: often }
  - { f: vital.spo2_low, band: sometimes }
  - f: hx.trigger_drug
    band: { pct: 100 }
    when: { trigger: [drug] }
    note: "причина — лекарство: укол перед реакцией был у каждого такого пациента"
  - f: hx.trigger_food
    band: { pct: 100 }
    when: { trigger: [food] }
    note: "причина — пища: у каждого такого пациента"
  - f: hx.trigger_sting
    band: { pct: 100 }
    when: { trigger: [sting] }
    note: "причина — ужаление: у каждого такого пациента"
# диагноз клинический (раздел 2): анализов, которые его подтверждают, в экстренной помощи нет
confirm: clinical
redFlags: [vital.bp_low, sign.stridor, sign.angioedema]
# дифференциальный диагноз — другие шоки, инфаркт миокарда, ТЭЛА, обмороки (263_2, раздел 2): в игре —
# острый коронарный синдром
differential: [cond.acs]
treatment:
  # эпинефрин в мышцу бедра — незамедлительно, всем (263_2, рек. 12–13; критерий качества 2) — и до
  # приезда скорой; после эпинефрина — растворы (рек. 23), после стабилизации — глюкокортикостероиды
  # (рек. 24, критерий качества 7), при сыпи — антигистаминные (рек. 25), при бронхоспазме —
  # сальбутамол (рек. 26); таблетки от аллергии и гормоны внутрь — не экстренная помощь
  firstLine: [tx.epinephrine_im]
  supportive: [tx.iv_fluids, tx.steroid_iv, tx.antihistamine_parenteral, tx.salbutamol]
  notIndicated: [tx.antihistamine, tx.steroid_systemic_short]
  plan: [tx.epinephrine_im, tx.iv_fluids, tx.steroid_iv]
  # вне больницы или без реанимации — вызвать скорую (рек. 7, критерий качества 3); госпитализация —
  # в стационар с реанимацией, в ней не меньше 24 ч (раздел 6): реанимации в игре нет — перевод
  setting: { default: transfer }
texts:
  summary:
    ru: >-
      Тяжёлая аллергическая реакция с падением давления: за минуты после укола лекарства, еды или
      ужаления. Сыпь и зуд, отёк губ и век, одышка, свистящий или шумный вдох, головокружение;
      верхнее давление ниже 90. Главное — сразу эпинефрин в мышцу бедра, через 5 минут без ответа —
      ещё раз; уложить, ноги приподнять, при удушье — посадить; убрать причину. Потом растворы в вену,
      гормоны и антигистаминные. Лечат в реанимации: из поликлиники — скорая, из районной больницы
      без реанимации — перевод.
pearls:
  - ru: "Сначала эпинефрин в мышцу бедра, потом всё остальное. Антигистаминные и гормоны вместо него не помогают: они действуют слишком медленно."
  - ru: "В шоке не сажают и не поднимают: лёжа, ноги приподняты. Сидя — только при удушье."
  - ru: "Реакция может вернуться через несколько часов: даже после ответа на эпинефрин нужно наблюдение в стационаре."
simplified: "Анафилактический шок в игре — у взрослого, без степеней и повторных доз: эпинефрин один раз. Реанимации, эпинефрина в вену, кислорода, положения тела и удаления жала в игре нет; анафилаксии без шока и крапивницы без анафилаксии — тоже."
sources:
  - { kind: guideline, title: "Анафилактический шок", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/263_2", note: "ID 263_2, опубликованы 14.04.2025, применяются; сверено с рубрикатором 29.09.2026; термины: АШ — систолическое АД ниже 90 мм рт. ст. или на 30 % ниже рабочего; раздел 1.2: причины — лекарства 31,2–46,5 %, пища 23,3–31 %, яд перепончатокрылых 14,9–20 %, не установлена — 24–26 %; раздел 1.3: анафилаксия 1,5–7,9 на 100 000 в год, летальность до 1 %; раздел 1.6: начало обычно в течение 2 ч; разделы 2.1–2.2: признаки; раздел 2: диагноз клинический; рек. 7: вызвать скорую или реанимационную бригаду — критерий качества 3; рек. 9, 11: лёжа с приподнятыми ногами, при удушье — сидя; рек. 12–13: эпинефрин в мышцу бедра незамедлительно — критерий качества 2; рек. 23–26: растворы, глюкокортикостероиды (критерий качества 7), антигистаминные, сальбутамол; раздел 6: стационар с реанимацией, в ней не меньше 24 ч; частоты признаков не даны — игровые" }
review: draft
