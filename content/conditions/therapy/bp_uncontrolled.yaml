id: cond.bp_uncontrolled
name: { ru: "Подъём давления без поражения органов" }
# «недостижение целевых цифр АД» — вместо «неосложнённого криза» (62_3, раздел 3.7); код — по гипертонии, I10
icd10: I10
department: dept.therapy
system: heart
kind: disease
severity: moderate
epidemiology:
  # без поражения органов — 76 из 100 кризов (Zampaglione 1996): втрое чаще всех кризов с поражением органов вместе.
  # Полоса подобрана прогоном генератора: сами в приёмное — в 8 раз чаще криза, в поликлинике — в 11; скорая везёт их
  # реже (снижает давление на вызове, 62_3, раздел 3.7) — примерно столько же, сколько криза; игровая оценка
  prevalence: uncommon
  # возраст — 60 ± 14 (Zampaglione 1996); с 35 — как гипертония в игре; границы — игровая оценка
  age: { min: 35, peak: [45, 80] }
  sex: { m: 1, f: 1 }
  # только у тех, у кого гипертония уже есть, — как криз: была известна у 72 из 100 (Zampaglione 1996); впервые
  # выявленная гипертония в игре — до 179 («Упрощено»). НПВП и алкоголь — игровые
  requires: [cond.hypertension]
  risks:
    - { id: risk.nsaid_use, x: 1.5 }
    - { id: risk.alcohol, x: 1.5 }
course:
  stages:
    - { id: active, days: [0, 30] }
  presentation: [0, 1]
  # без лечения за неделю ничего не случится — «без изменений» (как у впервые выявленной гипертонии)
  untreated: { band: never, days: [7, 7] }
findings:
  - f: vital.bp_very_high
    band: { pct: 100 }
    note: "резкий подъём АД без осложнений — «недостижение целевых цифр АД» (62_3, раздел 3.7); в игре — 180/110 и выше, как при кризе: отличает их не число, а поражение органов"
  - f: vital.bp_high
    band: { pct: 100 }
    note: "то же число, что «180/110 и выше» (62_3, раздел 3.7)"
  - { f: sym.bp_surge, band: always }
  # головная боль — 22 %, носовое кровотечение — 17 %, головокружение и возбуждение — 10 % (Zampaglione 1996); в
  # игре — головная боль часто, головокружение иногда: кровотечение из носа — своя болезнь базы
  - { f: sym.headache, band: often }
  - { f: sym.dizziness, band: sometimes }
  - { f: sym.palpitations, band: rarely }
  - { f: ecg.lvh, band: sometimes }
confirm: [exam.vitals]
differential: [cond.hypertensive_crisis, cond.hypertension_new]
treatment:
  # таблетки, лучше сразу двумя: иАПФ или БРА с блокатором кальциевых каналов или диуретиком (раздел 3.4.1);
  # снижать — амбулаторно, препаратами для приёма внутрь (раздел 3.7). Препарат в вену без поражения органов —
  # быстрое снижение, которое «может привести к осложнениям» (раздел 3.7): вред — игровое правило
  firstLine: [tx.ace_inhibitor, tx.arb, tx.ccb, tx.thiazide]
  plan: [tx.ace_inhibitor, tx.ccb]
  harmful: [tx.bp_iv]
  notIndicated: [tx.thrombolysis_stroke, tx.thrombolysis]
  setting: { default: home }
texts:
  summary:
    ru: >-
      Давление резко поднялось до 180/110 и выше, но органы не страдают: нет оглушения, пелены перед глазами,
      кровоизлияний на глазном дне, изменений на ЭКГ и в анализах. Это не криз, а «недостижение целевых цифр»:
      давление перемеряют, подбирают таблетки — лучше сразу две — и отпускают домой под наблюдение. Снижать его в
      вену не нужно и опасно.
pearls:
  - ru: "Не число делает криз кризом: при 200/120 сначала ищут поражение органов — глазное дно, ЭКГ, креатинин, моча."
  - ru: "Без поражения органов — таблетки и наблюдение у своего врача; ингибитор АПФ вместе с сартаном не назначают."
simplified: "Давление в игре перемеряют один раз; трёх измерений через 2 минуты нет. Сочетания таблеток не проверяются. Подъём давления до 180/110 и выше в игре — только у тех, у кого гипертония уже была; впервые выявленная — до 179."
sources:
  - { kind: guideline, title: "Артериальная гипертензия у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/62_3", note: "ID 62_3, опубликованы 03.10.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 3.7: «неосложнённый гипертонический криз» не рекомендован — «недостижение целевых цифр АД», трёхкратное измерение, снижение АД амбулаторно препаратами для приёма внутрь, быстрое неконтролируемое снижение не рекомендовано; раздел 3.4.1: стартовая комбинация иРААС с АК или диуретиком; доли признаков — игровая оценка" }
  - { kind: paper, title: "Zampaglione B, Pascale C, Marchisio M, Cavallo-Perin P. Hypertensive urgencies and emergencies. Prevalence and clinical presentation. Hypertension 1996;27(1):144–147", url: "https://pubmed.ncbi.nlm.nih.gov/8591878/", note: "PMID 8591878, сверено 05.10.2026: 76 % кризов — без поражения органов; головная боль 22 %, носовое кровотечение 17 %, головокружение и возбуждение 10 %; гипертония неизвестна — у 28 %" }
review: draft
