id: cond.sepsis
name: { ru: "Сепсис" }
# сепсис и септический шок (spec 2026-10-chapter-4, часть 48а): органная дисфункция в ответ на инфекцию — очаг и
# совокупные проявления органной дисфункции (898_1, разделы 1.1 и 2). Источник в игре — лёгкие или мочевые пути:
# пневмония и необструктивный пиелонефрит контроля источника не требуют; живот и операция — часть 48б. A41.9 — сепсис
# неуточнённый; шок — R57.2 дополнительным кодом (раздел 1.4)
icd10: A41.9
department: dept.therapy
# источник угадан — диагноз частично верный (часть 48а): у сепсиса из лёгких поставили пневмонию — очаг нашли, органной
# дисфункции не увидели
source: { param: source, map: { lungs: cond.pneumonia_cap, urinary: cond.pyelonephritis } }
# септический шок — дистрибутивный (898_1, раздел 1.6): сосуды не держат давление — «Сердце и сосуды», как
# анафилактический шок
system: heart
kind: syndrome
severity: critical
# с очагом инфекции и двумя баллами qSOFA — госпитализация скорой (898_1, раздел 6)
arrival: ambulance
epidemiology:
  # в приёмном немецкой больницы — 175 из 6607 больных, 2,6 % (EpiSEP); в России данных о частоте нет (898_1,
  # раздел 1.3). Полоса подобрана прогоном генератора — игровая оценка
  prevalence: rare
  # в группе риска — пожилые (898_1, приложение В); границы и пик — игровая оценка
  age: { min: 18, peak: [65, 90] }
params:
  # очаг у больных сепсисом в приёмном: дыхательные пути 43,6 %, мочеполовые 27,1 % (EpiSEP, группа сепсиса) — на два
  # источника части 48а: 62 : 38
  source: { lungs: 62, urinary: 38 }
  # септический шок — 42 из 175 больных сепсисом, 24 % (EpiSEP)
  shock: { no: 76, yes: 24 }
  # какая органная дисфункция видна в игре без шкалы SOFA (часть 48б): почки — креатинин, сознание — оглушение,
  # кровообращение — давление 100 и ниже. Чаще всего — почки (EpiSEP: креатинин у больных сепсисом — медиана 1,41 мг/дл,
  # Глазго — 15 (14–15), верхнее давление — 123 (109–144)); доли — игровая оценка
  organ: { kidney: 40, mind: 30, pressure: 30 }
  # сторона очага — как у пневмонии и пиелонефрита, игровая оценка
  side: { right: 50, left: 38, both: 12 }
  # сатурация ниже 90 % — производный по числу, как у пневмонии (часть 38б); доли — для вывода, пока сатурацию не
  # мерили: игровая оценка по прогону генератора
  spo2_below90: { no: 80, yes: 20 }
derived:
  spo2_below90: { f: vital.spo2_low, below: 90 }
course:
  stages:
    - { id: acute, days: [0, 3] }
    - { id: resolution, days: [3, 14], needs: treatment }
  # сепсис развивается на фоне инфекции, начавшейся за дни до него (898_1, раздел 2.1: «предсуществующего воспалительного
  # … процесса»); дни — игровая оценка
  presentation: [1, 5]
  # без лечения: летальность при сепсисе с органной дисфункцией — 20–40 %, при шоке — 40–80 % (898_1, раздел 1.3); хуже —
  # почти всегда, при шоке — в первые сутки: игровая оценка
  untreated:
    - { band: always, days: [0, 1], when: { shock: [yes] } }
    - { band: usually, days: [1, 3], when: { shock: [no] } }
  # выписка — после клинической стабилизации и лечения очага (898_1, раздел 6); сроков в рекомендации нет — игровая
  # оценка
  stay: [7, 14]
findings:
  # общие жалобы — «слабость, миалгия, недомогание…; повышение температуры тела (жар, озноб, потливость)» (898_1,
  # раздел 2.1); частот в тексте нет — полосы игровые
  - { f: sym.fever_hx, band: usually }
  - { f: vital.fever, band: often }
  - { f: sym.chills, band: often }
  - { f: sym.fatigue, band: usually }
  - { f: sym.myalgia, band: sometimes }
  - { f: vital.tachycardia, band: usually, when: { shock: [no] } }
  - { f: vital.tachycardia, band: always, when: { shock: [yes] } }
  # частое дыхание — пункт qSOFA (приложение Г.2): скорая привозит при очаге и двух баллах qSOFA (раздел 6) — в игре у
  # большинства; в приёмном вообще — реже (EpiSEP: частота дыхания при сепсисе — 18 (16–21)). Полосы — игровая оценка
  - { f: vital.tachypnea, band: usually, when: { source: [lungs] } }
  - { f: vital.tachypnea, band: often, when: { source: [urinary], shock: [no] } }
  - { f: vital.tachypnea, band: usually, when: { source: [urinary], shock: [yes] } }
  # очаг в лёгких — как у пневмонии (654_2): кашель, мокрота, хрипы и инфильтрат на снимке (898_1, раздел 2.2: «влажных
  # хрипов и крепитации над пневмоническими участками»); полосы — игровая оценка
  - { f: sym.cough, band: usually, when: { source: [lungs] }, attrs: { character: { productive: 70, dry: 30 } } }
  - { f: sym.dyspnea, band: usually, when: { source: [lungs] } }
  - { f: sym.dyspnea, band: sometimes, when: { source: [urinary] } }
  - { f: sym.purulent_sputum, band: often, when: { source: [lungs] } }
  - { f: sym.pleuritic_pain, band: sometimes, when: { source: [lungs] }, attrs: { side: $side } }
  - { f: sign.crackles_local, band: usually, when: { source: [lungs] }, attrs: { side: $side } }
  - { f: sign.dullness, band: sometimes, when: { source: [lungs] }, attrs: { side: $side } }
  - f: img.cxr_infiltrate
    band: { pct: 100 }
    when: { source: [lungs] }
    attrs: { side: $side }
    note: "очаг в лёгких — пневмония: инфильтрат на снимке у каждого такого больного, как при пневмонии (654_2); пропустить его может сам снимок"
  - { f: vital.spo2_low, band: usually, when: { source: [lungs] } }
  - { f: vital.spo2_low, band: rarely, when: { source: [urinary] } }
  # очаг в мочевых путях — как у пиелонефрита (9_3): боль в пояснице, поколачивание, лейкоциты в моче; полосы — игровая
  # оценка
  - { f: sym.flank_pain, band: usually, when: { source: [urinary] }, attrs: { side: $side } }
  - { f: sign.cva_tenderness, band: usually, when: { source: [urinary] } }
  - { f: sym.dysuria, band: often, when: { source: [urinary] } }
  - { f: sym.frequency, band: often, when: { source: [urinary] } }
  - { f: sym.nausea, band: often, when: { source: [urinary] } }
  - { f: sym.vomiting, band: sometimes, when: { source: [urinary] } }
  - f: lab.urine_leuk
    band: { pct: 100 }
    when: { source: [urinary] }
    note: "очаг в мочевых путях — пиелонефрит: лейкоциты в моче у каждого такого больного, как при пиелонефрите"
  - { f: lab.urine_nitrite, band: often, when: { source: [urinary] } }
  - { f: lab.urine_blood, band: often, when: { source: [urinary] } }
  # воспаление: лейкоцитоз и С-реактивный белок (898_1, раздел 2.3: лейкоцитарная формула и СРБ при подозрении на
  # сепсис); полосы — игровая оценка
  - { f: lab.wbc_high, band: usually }
  - { f: lab.crp_high, band: usually }
  # шок в игре — верхнее давление ниже 90 и лактат выше 2 у каждого (898_1, раздел 2: гипотония с вазопрессорами для
  # среднего давления 65 и лактат > 2 ммоль/л несмотря на инфузию; что давление падает уже после растворов, в игре нет)
  - f: vital.bp_low
    band: { pct: 100 }
    when: { shock: [yes] }
    note: "септический шок — гипотония, которую держат вазопрессорами (898_1, раздел 2): в игре давление ниже 90 у каждого такого больного"
  - f: lab.lactate_high
    band: { pct: 100 }
    when: { shock: [yes] }
    note: "септический шок — лактат выше 2 ммоль/л по определению (898_1, раздел 2)"
  # без шока лактат выше 2 — у половины: медиана у больных сепсисом — 2,0 ммоль/л (EpiSEP)
  - { f: lab.lactate_high, band: often, when: { shock: [no] } }
  # ранний шок — «тёплый», на поздних стадиях конечности холодные и бледные (898_1, раздел 2.2): доля — игровая оценка
  - { f: sign.cold_clammy, band: sometimes, when: { shock: [yes] } }
  # органная дисфункция — у каждого больного сепсисом (898_1, раздел 2): одна из видимых в игре — по параметру `organ`,
  # остальные — реже (игровая оценка). Кровообращение — пункт qSOFA «верхнее давление 100 и ниже» (приложение Г.2)
  - f: vital.bp_100
    band: { pct: 100 }
    when: { organ: [pressure], shock: [no] }
    note: "органная дисфункция — кровообращение: верхнее давление 100 и ниже у каждого такого больного (898_1, приложение Г.2)"
  - { f: vital.bp_100, band: sometimes, when: { organ: [kidney, mind], shock: [no] } }
  # сознание — оглушение по шкале комы Глазго (приложения Г.1–Г.3); «ранним симптомом, особенно у пожилых людей может
  # быть спутанность сознания» (раздел 2.2) — о ней говорят родные или бригада
  - f: sign.gcs_low
    band: { pct: 100 }
    when: { organ: [mind] }
    note: "органная дисфункция — сознание: оглушение по шкале комы Глазго у каждого такого больного (898_1, приложения Г.1–Г.2)"
  - { f: sign.gcs_low, band: sometimes, when: { organ: [kidney, pressure], shock: [no] } }
  - { f: sign.gcs_low, band: often, when: { organ: [kidney, pressure], shock: [yes] } }
  - { f: sym.confusion, band: often, when: { organ: [mind] } }
  # почки — креатинин выше нормы (приложение Г.1: SOFA — от 110 мкмоль/л; раздел 3.6: «весьма уязвимые органы»)
  - f: lab.creatinine_high
    band: { pct: 100 }
    when: { organ: [kidney] }
    note: "органная дисфункция — почки: креатинин выше нормы у каждого такого больного (898_1, приложение Г.1)"
  - { f: lab.creatinine_high, band: often, when: { organ: [mind, pressure] } }
# диагноз клинический (898_1, раздел 6): очаг и органная дисфункция; ни один анализ его не подтверждает
confirm: clinical
redFlags: [vital.bp_low, lab.lactate_high, sign.gcs_low]
# с чем спутать (898_1, раздел 2.2): органную дисфункцию принимают за проявления других болезней — сердца, эмболии
# лёгочной артерии; очаг без органной дисфункции — пневмония и пиелонефрит
differential: [cond.pneumonia_cap, cond.pyelonephritis, cond.pe]
treatment:
  # антибиотик широкого спектра в вену — без выбора препарата (spec 2026-10-chapter-4, «Лечение»; 898_1, раздел 3.2):
  # при шоке — в первый час, без шока — в первые 3 часа (сроки — `targets/`); обязателен и здесь, и до перевода — в
  # `require` и `beforeTransfer`, первой линии сверх них нет. Антибиотики внутрь при сепсисе — не то лечение: в игре
  # «не нужно», сепсис они не лечат
  firstLine: []
  supportive: [tx.paracetamol]
  # допамин — «альтернатива норэпинефрину в очень узкой субпопуляции пациентов с … брадикардией», низкие дозы «не должны
  # быть использованы» (898_1, раздел 3.4): в игре — «не нужно»
  notIndicated: [tx.dopamine, tx.amoxicillin, tx.amoxicillin_clavulanate, tx.macrolide, tx.fluoroquinolone, tx.cephalosporin_oral]
  # посевы крови — до антибиотика (898_1, раздел 2.3, УДД 2, УУР В; критерий качества 9); антибиотик (раздел 3.2;
  # критерий качества 6); растворы электролитов — первая линия, сбалансированным приоритет перед 0,9 % натрия хлорида
  # (раздел 3.3; критерий качества 7): из группы хватит одного, первое — выбора
  require: [tx.blood_culture, tx.antibiotic_iv, [tx.balanced_fluids, tx.iv_fluids]]
  # без своей ПИТ — перевод (раздел 6), и до него — посевы, антибиотик и раствор: антибиотик срок не ждёт
  beforeTransfer: [tx.blood_culture, tx.antibiotic_iv, [tx.balanced_fluids, tx.iv_fluids]]
  byParam:
    # шок: вазопрессор первой линии — норэпинефрин (раздел 3.4, УДД 5, УУР С), в периферическую вену, «не дожидаясь
    # обеспечения доступа к центральной вене»; «раннее назначение … параллельно с интенсивной инфузионной терапией» — и
    # до перевода, если у постели монитор
    - when: { shock: [yes] }
      require: [tx.norepinephrine]
      beforeTransfer: [tx.norepinephrine]
    # кислород — при сатурации ниже 90 %, как у пневмонии (654_2; часть 38б)
    - when: { spo2_below90: [yes] }
      require: [tx.oxygen_mask]
    - when: { spo2_below90: [no] }
      notIndicated: [tx.oxygen_mask]
  # явный сепсис при поступлении — «в палату реанимации и интенсивной терапии стационарного отделения скорой медицинской
  # помощи (при его наличии) либо непосредственно в ОРИТ» (898_1, раздел 6, УДД 5, УУР С): своя ПИТ или реанимация, нет
  # их — перевод
  setting: { default: icu }
texts:
  summary:
    ru: >-
      Инфекция, на которую организм ответил поражением органов: падает давление, учащается дыхание,
      путается сознание, почки выделяют меньше мочи — креатинин и лактат выше нормы. Источник — чаще
      пневмония или пиелонефрит. При инфекции два пункта qSOFA из трёх — давление 100 и ниже, дыхание
      22 и чаще, оглушение — повод искать сепсис. Сразу — посевы крови, антибиотик широкого спектра в
      вену и солевой раствор; при шоке — давление ниже 90 и лактат выше 2 — норэпинефрин, антибиотик в
      первый час. Лечат в палате интенсивной терапии или реанимации.
pearls:
  - ru: "Сепсис — это инфекция и поражение органов. Одной температуры мало: смотрите давление, дыхание, сознание, креатинин и лактат."
  - ru: "При септическом шоке антибиотик — в первый час. Посевы крови берут до него, но ответа не ждут: он придёт через двое-трое суток."
  - ru: "Меньше двух баллов qSOFA сепсис не исключает: у пожилых он часто начинается со спутанности без высокой температуры."
simplified: "Источник в игре — лёгкие или мочевые пути; живот и контроль источника операцией, а с ними шкала SOFA — часть 48б. Шок виден сразу: давление ниже 90 и лактат выше 2; что давление падает уже после растворов, в игре нет. Антибиотик — одной строкой «широкого спектра в вену», без выбора препарата и риска резистентности; посевы «взяты», ответ приходит через 2–3 суток и в смене не виден. Прокальцитонина, газов крови, времени наполнения капилляров, объёма растворов и целевого среднего давления нет; ИВЛ при сепсисе, гидрокортизона и эпинефрина — тоже. Частота дыхания в qSOFA — «больше 20» вместо «22 и чаще»."
sources:
  - { kind: guideline, title: "Сепсис (у взрослых)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/898_1", note: "ID 898_1, опубликованы 27.12.2024, применяются; сверено с рубрикатором 06.10.2026; разделы 1.1 и 2: сепсис — очаг инфекции и органная дисфункция (SOFA на 2 балла и больше), шок — гипотония с вазопрессорами для среднего АД 65 и лактат > 2 ммоль/л несмотря на инфузию; раздел 1.3: летальность при сепсисе с органной дисфункцией 20–40 %, при шоке 40–80 %, в России данных о частоте нет; раздел 1.6: шок дистрибутивный; разделы 2.1–2.2: жалобы и осмотр, спутанность у пожилых, «тёплый» и «холодный» шок; раздел 2.2 и приложение Г.2: qSOFA; раздел 2.3: анализы, лактат при гипотонии, посевы до антибиотика, если не задержат его на 45 минут; раздел 3.2: антибиотик при шоке — в течение 1 часа, без шока — 3 часов; раздел 3.3: растворы электролитов, приоритет сбалансированным; раздел 3.4: норэпинефрин — первая линия, допамин — узкая группа с брадикардией; раздел 6: диагноз клинический, госпитализация скорой при очаге и qSOFA 2 и больше, палата реанимации и интенсивной терапии или ОРИТ; критерии качества 1, 5–7, 9; частоты признаков не даны — игровые" }
  - { kind: paper, title: "Wolfertz N, Böhm L, Keitel V, Hannappel O, Kümpers P, Bernhard M. Epidemiology, management, and outcome of infection, sepsis, and septic shock in a German emergency department (EpiSEP study). Front Med (Lausanne) 2022;9:997992", url: "https://pubmed.ncbi.nlm.nih.gov/36325382/", note: "PMID 36325382, PMC9618593, сверено 06.10.2026: 6607 больных приёмного, сепсис — 133, септический шок — 42 (24 % из 175); очаги у сепсиса — дыхательные пути 43,6 %, мочеполовые 27,1 %, живот 12,0 %; медианы у сепсиса — qSOFA 1 (0–1), лактат 2,0 ммоль/л, верхнее давление 123 мм рт. ст., Глазго 15 (14–15), креатинин 1,41 мг/дл; у шока — qSOFA 1 (1–2), лактат 3,5; антибиотик в первый час — 8,3 и 14,3 %; 30-дневная смертность — 12,0 и 38,1 %" }
review: draft
