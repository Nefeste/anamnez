id: cond.sbp
name: { ru: "Спонтанный бактериальный перитонит" }
# инфекция асцитической жидкости без видимого источника в брюшной полости (spec 2026-10-chapter-4, часть 54а): бактерии
# проникают из кишечника (715_2, раздел 1.2). МКБ-10 — K65.0, острый перитонит
icd10: K65.0
department: dept.therapy
system: digestive
kind: disease
severity: serious
group: grp.cirrhosis_ascites
epidemiology:
  # у стационарных больных циррозом с асцитом — 27 % (1302 больных), половина — у только что госпитализированных (715_2,
  # раздел 1.3): каждый седьмой при поступлении. Полоса подобрана прогоном генератора: в игре — примерно каждый восьмой
  # пришедший с асцитом, игровая оценка
  prevalence: uncommon
  age: { min: 30 }
  requires: [cond.cirrhosis]
course:
  stages:
    - { id: acute, days: [0, 7] }
  presentation: [0, 3]
  # «в случае поздней диагностики и отсроченного лечения смертность от СБП может превышать 90 %» (715_2, раздел 1.3)
  untreated: { band: always, days: [1, 4] }
  # антибиотик — 5–7 дней (715_2, раздел 3.2.5); длительность госпитализации — игровая оценка
  stay: [7, 10]
findings:
  - f: sign.ascites
    band: { pct: 100 }
    note: "перитонит — инфекция асцитической жидкости: без асцита его нет (715_2, раздел 1.5)"
  - f: img.us_ascites
    band: { pct: 100 }
    note: "асцит на УЗИ — у каждого, у кого он заметен на осмотре (715_2, раздел 1.5)"
  - f: lab.ascitic_fluid
    band: { pct: 100 }
    note: "асцитическая жидкость при парацентезе — у каждого с асцитом (715_2, раздел 2.3)"
  - f: lab.ascites_pmn_250
    band: { pct: 100 }
    note: "нейтрофилов больше 250 в 1 мм³ — критерий СБП (715_2, раздел 1.5)"
  # живот растёт от асцита — игровая оценка
  - { f: sym.abdomen_enlarged, band: usually }
  # боль без чёткой локализации, лихорадка — у 50 %, нарастание печёночной энцефалопатии без видимых провокаторов;
  # раздражение брюшины — у 8–10 %; у 10–33 % начальных симптомов нет (715_2, раздел 1.6). Полосы без чисел — игровая оценка
  - { f: sym.abdominal_pain, band: often }
  - { f: sym.fever_hx, band: often }
  - { f: vital.fever, band: often }
  - { f: sym.confusion, band: sometimes }
  - { f: sign.peritoneal_signs, band: rarely }
  - { f: vital.tachycardia, band: sometimes }
  - { f: sign.leg_edema_bilateral, band: often }
  - { f: sign.jaundice, band: sometimes }
confirm: [exam.paracentesis]
redFlags: [sym.confusion]
treatment:
  # эмпирический антибиотик в вену — незамедлительно (715_2, раздел 3.2.5, УУР C, УДД 5), цефалоспорины III поколения —
  # первая линия (УУР A, УДД 2); альбумин — к антибиотику: гепаторенальный синдром — с 30 до 10 %, смертность — с 29 до 10 %
  # (УУР A, УДД 1)
  require: [tx.antibiotic_iv, tx.albumin]
  firstLine: []
  # асцит остаётся: мочегонное, диета и лечебный парацентез — по его степени (раздел 3.2.1)
  acceptable: [tx.spironolactone, tx.paracentesis_large]
  supportive: [tx.low_salt_diet]
  # НПВП — острое повреждение почек и гипонатриемия (разделы 1.2 и 1.5)
  harmful: [tx.ibuprofen, tx.aspirin_course]
  # ИПН при асците — «ограничивать»: длительный приём повышает риск СБП (раздел 5.2.1, УУР C, УДД 4); фуросемид в вену — при
  # отёке лёгких
  notIndicated: [tx.ppi, tx.ppi_iv, tx.furosemide_iv]
  setting: { default: ward }
texts:
  summary:
    ru: >-
      Инфекция асцитической жидкости у больного циррозом: бактерии проникают в неё из кишечника. Боль по всему животу,
      температура, спутанность — а у каждого третьего жалоб почти нет. Ставят диагноз по пункции: нейтрофилов в жидкости
      больше 250 в 1 мм³. Антибиотик в вену — сразу, вместе с альбумином: так реже отказывают почки и меньше умирают.
pearls:
  - ru: "У больного циррозом с асцитом температура, боль в животе или спутанность — сначала пункция асцита: спонтанный перитонит без неё не увидеть."
  - ru: "Альбумин при спонтанном перитоните — не лишний: он втрое реже даёт гепаторенальный синдром и смерть."
simplified: "Внутрибольничной инфекции асцита и подбора антибиотика по резистентности нет — в игре один антибиотик в вену. Повторной пункции через двое суток и посева нет; вторичного перитонита от перфорации — тоже."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: СБП у 27 % из 1302 стационарных больных циррозом с асцитом, половина — у только что госпитализированных; при поздней диагностике смертность может превышать 90 %; раздел 1.5: СБП — нейтрофилов в асцитической жидкости более 250 в 1 мм³; раздел 1.6: боль без чёткой локализации, лихорадка у 50 %, нарастание ПЭ, раздражение брюшины у 8–10 %, у 10–33 % симптомов нет; раздел 2.3 (УУР B, УДД 2): диагностический парацентез при подозрении на инфицирование; раздел 3.2.5: эмпирический антибиотик в вену незамедлительно (УУР C, УДД 5), цефалоспорины III поколения (УУР A, УДД 2), альбумин (УУР A, УДД 1); раздел 5.2.1 (УУР C, УДД 4): ограничивать ИПП при асците; доля в игре и полосы признаков — игровая оценка" }
review: draft
