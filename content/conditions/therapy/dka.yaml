id: cond.dka
name: { ru: "Диабетический кетоацидоз" }
# «ДКА – требующая экстренной госпитализации острая декомпенсация СД, с гипергликемией (уровень глюкозы плазмы > 13,9
# ммоль/л … у взрослых), гиперкетонемией (> 5 ммоль/л), кетонурией (≥ ++), метаболическим ацидозом (рН < 7,3, уровень
# бикарбоната < 15 ммоль/л у взрослых)» (Алгоритмы, 11-й выпуск, 2023, раздел 8.1, с. 43; spec 2026-10-urticaria-dka,
# часть 73). Кода в «Алгоритмах» нет, тип диабета в игре не различают — E14.1, неуточнённый сахарный диабет с
# кетоацидозом
icd10: E14.1
department: dept.therapy
system: metabolic
kind: disease
severity: critical
epidemiology:
  # частоты в «Алгоритмах» нет; полоса — игровая оценка
  prevalence: rare
  # возраста нет; «манифестация СД, особенно 1 типа» (с. 44) — у молодых, остальное — игровая оценка
  age: { min: 18 }
params:
  # провоцирующие факторы (с. 44, без долей): интеркуррентные заболевания, пропуск или отмена инсулина, манифестация СД;
  # инфекция — «высокая вероятность инфекций как причины ДКА» (с. 47). Доли — игровая оценка
  factor: { infection: 40, missed_insulin: 35, new_onset: 25 }
  # «Классификация ДКА по степени тяжести» (с. 44): лёгкая, умеренная, тяжёлая. Доли — игровая оценка
  severity: { mild: 30, moderate: 45, severe: 25 }
course:
  stages:
    - { id: acute, days: [0, 3] }
  # приходят в первые сутки-двое: игровая оценка
  presentation: [0, 1]
  # без лечения хуже: декомпенсация, «требующая экстренной госпитализации» (с. 43); сроки — игровая оценка
  untreated:
    - { band: always, days: [0, 0], when: { severity: [severe] } }
    - { band: always, days: [0, 1], when: { severity: [mild, moderate] } }
  # длительности госпитализации нет: разрешение — глюкоза ниже 11 и выправленный ацидоз (с. 47), потом инсулин под кожу
  # и питание — игровая оценка
  stay: [3, 7]
findings:
  - f: lab.glucose_high
    band: { pct: 100 }
    note: "гипергликемия — по определению (Алгоритмы, с. 43, 47); число — по порогу ниже: одно измерение"
  - f: lab.glucose_14
    band: { pct: 100 }
    note: "гипергликемия — по определению: глюкоза плазмы выше 13,9 ммоль/л (Алгоритмы, с. 43); «повышена» — то же измерение"
  - f: lab.urine_ketones
    band: { pct: 100 }
    note: "кетонурия ≥ ++ — по определению (с. 43); «анализ любой порции мочи на кетоновые тела» — первым делом (с. 45)"
  - f: lab.acidosis
    band: { pct: 100 }
    note: "метаболический ацидоз, рН ниже 7,3 — по определению (с. 43); КЩС — «декомпенсированный метаболический ацидоз» (с. 44)"
  # «Общий анализ мочи: глюкозурия, кетонурия» (с. 44); доля — игровая оценка
  - { f: lab.urine_glucose, band: usually }
  # «Полиурия, жажда, признаки дегидратации и гиповолемии … слабость, отсутствие аппетита, тошнота, рвота, запах ацетона в
  # выдыхаемом воздухе, головная боль, одышка» (с. 44). Частот нет — полосы игровые
  - { f: sym.polyuria, band: usually }
  - { f: sym.thirst, band: usually }
  - { f: sign.dehydration, band: usually }
  - { f: sym.fatigue, band: usually }
  - { f: sym.anorexia, band: often }
  - { f: sym.nausea, band: often }
  - { f: sym.vomiting, band: often }
  - { f: sign.acetone_breath, band: usually }
  - { f: sym.headache, band: sometimes }
  - { f: sym.dyspnea, band: sometimes }
  # «Часто – абдоминальный синдром (ложный «острый живот», диабетический псевдоперитонит) – боли в животе, рвота,
  # напряжение и болезненность брюшной стенки» (с. 44): «часто» — так и в игре; напряжение — реже, игровая оценка
  - { f: sym.abdominal_pain, band: often }
  - { f: sign.peritoneal_signs, band: sometimes }
  # «Лейкоцитоз: < 15000 – стрессовый, > 25000 – инфекция» (с. 44); доли — игровая оценка
  - { f: lab.wbc_high, band: often, when: { factor: [missed_insulin, new_onset] } }
  - { f: lab.wbc_high, band: usually, when: { factor: [infection] } }
  # «Повышение креатинина (непостоянно; чаще указывает на транзиторную «преренальную» почечную недостаточность, вызванную
  # гиповолемией)» (с. 44)
  - { f: lab.creatinine_high, band: sometimes }
  # тяжесть по таблице (с. 44): сознание — «Нет» при лёгкой, «Нет или сонливость» при умеренной, «Сопор или кома» при
  # тяжёлой; САД ниже 90 и ЧСС ниже 60 или выше 100 — при тяжёлой; дыхание Куссмауля — «в терминальном состоянии»
  - { f: sign.gcs_low, band: sometimes, when: { severity: [moderate] } }
  - f: sign.gcs_low
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "при тяжёлой — сопор или кома (Алгоритмы, с. 44, таблица тяжести)"
  - { f: sign.gcs_coma, band: sometimes, when: { severity: [severe] } }
  - f: vital.bp_low
    band: { pct: 100 }
    when: { severity: [severe] }
    note: "при тяжёлой систолическое давление ниже 90 (с. 44, таблица тяжести)"
  - { f: vital.tachycardia, band: usually, when: { severity: [severe] } }
  - { f: sign.kussmaul, band: often, when: { severity: [severe] } }
  # причина: диабет уже известен — при пропуске инсулина и при инфекции у больного на инсулине; при манифестации — нет
  # (с. 44). Доли — игровая оценка
  - f: hx.diabetes
    band: { pct: 100 }
    when: { factor: [missed_insulin, infection] }
    note: "пропуск инсулина и интеркуррентное заболевание — у того, у кого диабет уже есть (с. 44)"
  - f: hx.insulin
    band: { pct: 100 }
    when: { factor: [missed_insulin] }
    note: "«пропуск или отмена инсулина больными» (с. 44): по определению параметра"
  - { f: hx.insulin, band: usually, when: { factor: [infection] } }
  - f: hx.missed_insulin
    band: { pct: 100 }
    when: { factor: [missed_insulin] }
    note: "по определению параметра"
  # инфекция — с лихорадкой: игровая оценка (в «Алгоритмах» лихорадки как признака ДКА нет, есть «поиск возможного очага
  # инфекции», с. 45)
  - { f: vital.fever, band: usually, when: { factor: [infection] } }
# диагноз — по глюкозе, кетонам в моче и КЩС: «Экспресс-анализ гликемии и анализ любой порции мочи на кетоновые тела» (с.
# 45), «Газоанализ и рН» (там же)
confirm: [exam.urine_dipstick, exam.abg]
redFlags: [sign.gcs_low, vital.bp_low, sign.kussmaul]
# ГГС — тоже резкая гипергликемия, но без кетоза и ацидоза (с. 47–48); абдоминальный синдром — «ложный «острый живот»»
# (с. 44)
differential: [cond.hhs, cond.appendicitis]
treatment:
  # «Основные компоненты: устранение инсулиновой недостаточности; борьба с дегидратацией и гиповолемией; восстановление
  # электролитного баланса и КЩС; выявление и лечение сопутствующих заболеваний» (с. 45). Инсулин — в вену, режим малых доз
  # (с. 45): «Этиологическое лечение метаболического ацидоза при ДКА – инсулин» (с. 47). Доз и скоростей в игре нет
  firstLine: [tx.insulin_iv]
  acceptable: []
  # калий в вену — «одновременно с введением инсулина» (с. 46), кроме калия выше 5,5; низкомолекулярный гепарин в
  # профилактической дозе (с. 47). Уровень калия в игре не различают — калий не ошибка и не обязателен
  supportive: [tx.potassium_iv, tx.lmwh]
  # бикарбонат — только при рН ≤ 6,9 или бикарбонате < 5, «без определения рН/КЩС введение бикарбоната противопоказано!»
  # (с. 47): таких чисел в игре нет; глюкозу — только когда глюкоза плазмы снизилась до 13 (с. 46): при поступлении не нужна
  notIndicated: [tx.sodium_bicarbonate, tx.dextrose_iv, tx.dextrose_infusion, tx.furosemide_iv]
  harmful: []
  # регидратация — 0,9 % раствор NaCl в вену капельно уже «на догоспитальном этапе или в приемном отделении» (с. 45–46):
  # обязательно и здесь, и до перевода
  beforeTransfer: [tx.iv_fluids]
  plan: [tx.insulin_iv, tx.potassium_iv]
  byParam:
    # «Антибиотики широкого спектра действия (высокая вероятность инфекций как причины ДКА)» (с. 47)
    - when: { factor: [infection] }
      supportive: [tx.antibiotic_iv]
  # «В реанимационном отделении или отделении интенсивной терапии (лечение ДКА легкой степени проводится в
  # эндокринологическом / терапевтическом отделении)» (с. 45)
  setting:
    default: ward
    param: { name: severity, map: { mild: ward, moderate: icu, severe: icu } }
    also:
      - { when: { severity: [moderate, severe] }, settings: [ricu] }
texts:
  summary:
    ru: >-
      Острая декомпенсация сахарного диабета: инсулина не хватает, глюкоза выше 13,9 ммоль/л, в моче кетоны, кровь
      закисляется. Чаще — у больного на инсулине, который его пропустил или заболел инфекцией, или первым проявлением
      диабета. Жажда, много мочи, слабость, тошнота и рвота, запах ацетона изо рта; часто боль в животе, как при «остром
      животе»; при тяжёлом — давление падает, сопор, глубокое шумное дыхание. Сначала глюкометр и кетоны в моче, потом
      кислотно-основное состояние. Лечат в реанимации или палате интенсивной терапии, лёгкий — в отделении: солевой
      раствор, инсулин в вену малыми дозами, калий.
pearls:
  - ru: "Боль в животе и рвота у больного диабетом — сначала глюкометр и кетоны в моче: кетоацидоз бывает «ложным острым животом»."
  - ru: "Главное лечение — инсулин в вену малыми дозами и солевой раствор; калий — вместе с инсулином: при лечении он в крови падает."
  - ru: "Бикарбонат — не всем: только при очень тяжёлом ацидозе и только по анализу кислотно-основного состояния."
simplified: "Кетоацидоз в игре — у взрослого, без деления на диабет 1 и 2 типа. Доз, скоростей инфузии и почасового контроля глюкозы нет; уровень калия и pH не различают: калий и бикарбонат в игре не зависят от анализа. Эугликемического кетоацидоза, отёка мозга при лечении и перевода на инсулин под кожу нет."
sources:
  - { kind: guideline, title: "Алгоритмы специализированной медицинской помощи больным сахарным диабетом. 11-й выпуск", org: "Под ред. И.И. Дедова, М.В. Шестаковой, А.Ю. Майорова", year: 2023, url: "https://doi.org/10.14341/DM13042", note: "Сахарный диабет. 2023;26(2S):1–157; полный текст — https://www.dia-endojournals.ru/jour/article/download/13042/pdf_232, сверено 15.10.2026 (решение владельца по вопросу 28, Nefeste/anamnez#118: источник вне рубрикатора, как ТЭЛА по ESC 2019); раздел 8.1, с. 43–47: определение (глюкоза > 13,9, кетонемия > 5, кетонурия ≥ ++, рН < 7,3, бикарбонат < 15); провоцирующие факторы без долей; клиническая картина, «часто — абдоминальный синдром»; таблица тяжести (сознание, САД, ЧСС); лабораторные изменения; лечение — 0,9 % NaCl уже до госпитализации, инсулин в вену в режиме малых доз, калий одновременно с инсулином (не вводить при K+ > 5,5), бикарбонат только при рН ≤ 6,9 или бикарбонате < 5, антибиотики широкого спектра, низкомолекулярный гепарин; место — реанимация или ОИТ, лёгкий — эндокринологическое или терапевтическое отделение; кодов МКБ, частот, летальности в тексте нет; доли и сроки — игровая оценка; дозы и скорости опущены" }
review: draft
