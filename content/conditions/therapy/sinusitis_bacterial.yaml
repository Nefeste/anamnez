id: cond.sinusitis_bacterial
name: { ru: "Острый бактериальный риносинусит" }
icd10: J01.9
department: dept.therapy
system: airways
kind: disease
severity: moderate
epidemiology:
  prevalence: uncommon
  age: { min: 18 }
  season: { winter: 1.3, spring: 1.1, summer: 0.7, autumn: 1.1 }
course:
  stages:
    - { id: peak, days: [5, 14] }
    - { id: resolution, days: [14, 28] }
  presentation: [6, 14]
  selfLimiting: true
  untreated: { band: sometimes, days: [3, 7] }
findings:
  - { f: sym.nasal_congestion, band: usually }
  - { f: sym.rhinorrhea, band: usually }
  - { f: sym.purulent_nasal, band: usually }
  - { f: sym.facial_pain, band: usually }
  - { f: sym.double_worsening, band: often }
  - { f: sym.nasal_long, band: often }
  - { f: sym.fever_hx, band: usually }
  - { f: vital.fever, band: often }
  - { f: sym.headache, band: often }
  - { f: sym.anosmia, band: sometimes }
  - { f: sym.cough, band: sometimes, attrs: { character: { dry: 40, productive: 60 } } }
  - { f: sign.purulent_discharge_nose, band: usually }
  - { f: sign.sinus_tenderness, band: often }
  - { f: lab.crp_high, band: usually }
  - { f: lab.wbc_high, band: sometimes }
confirm: clinical
treatment:
  firstLine: [tx.amoxicillin]
  acceptable: [tx.amoxicillin_clavulanate, tx.macrolide]
  supportive: [tx.nasal_saline, tx.nasal_steroid, tx.paracetamol, tx.ibuprofen]
  notIndicated: [tx.oseltamivir, tx.antihistamine, tx.steroid_systemic_short]
  setting: { default: home }
texts:
  summary:
    ru: >-
      Бактериальное воспаление пазух — осложнение простуды у немногих. Подозревают по
      сочетанию: второе ухудшение после улучшения, сильная односторонняя боль в лице,
      температура выше 38 °C, гнойные выделения, высокий С-реактивный белок.
pearls:
  - ru: "Бактериальный синусит узнают по сочетанию признаков, а не по одному: второе ухудшение, сильная боль в лице, температура выше 38 °C, высокий С-реактивный белок."
  - ru: "Препарат выбора — амоксициллин; макролиды — только при аллергии на пенициллины: к ним устойчив пневмококк."
sources:
  - { kind: guideline, title: "Fokkens WJ et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020. Rhinology 2020;58(Suppl S29):1–464", note: "критерии бактериального риносинусита; частоты — черновик" }
  - { kind: guideline, title: "Chow AW et al. IDSA clinical practice guideline for acute bacterial rhinosinusitis in children and adults. Clin Infect Dis 2012;54(8):e72–e112" }
  - { kind: guideline, title: "Острый синусит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/313_3", note: "ID 313_3, опубликованы 28.10.2024, применяются; сверено с рубрикатором 28.09.2026" }
review: draft
