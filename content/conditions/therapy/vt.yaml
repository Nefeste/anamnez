id: cond.vt
name: { ru: "Желудочковая тахикардия" }
icd10: I47.2
department: dept.therapy
system: heart
kind: disease
severity: critical
# устойчивая мономорфная желудочковая тахикардия (spec 2026-10-chapter-3, часть 42б): «в подавляющем
# большинстве случаев осложняет течение тяжелых заболеваний сердца» — ИБС с постинфарктным рубцом,
# кардиомиопатии (569_2, раздел 1.2); ИБС — 75–80 % внезапной сердечной смерти, у мужчин чаще (раздел 1.3).
# Распространённость, возраст и множители — игровая оценка
epidemiology:
  prevalence: extremely_rare
  age: { min: 40, peak: [55, 85] }
  sex: { m: 1, f: 0.43 }
  risks:
    - { id: risk.vascular, x: 6 }
    - { id: risk.heart_failure, x: 6 }
params:
  # нестабильный — симптомная гипотония, обморок или предобморок, ишемия, отёк лёгких (569_2, раздел 3.1.2):
  # в игре — давление ниже 90; доля — игровая оценка
  unstable: { yes: 30, no: 70 }
course:
  stages:
    - { id: acute, days: [0, 1] }
  presentation: [0, 0]
  # без купирования — хуже: нестабильный — почти всегда и сразу, стабильный — обычно («у пациента может
  # произойти быстрое ухудшение состояния», раздел 3.1.3); игровая оценка
  untreated:
    - { band: always, days: [0, 0], when: { unstable: [yes] } }
    - { band: usually, days: [0, 1] }
  # в ПИТ после купирования — 2–5 суток: игровая оценка, в 569_2 срока нет
  stay: [2, 5]
  # часов от начала до прихода — игровая оценка: в 569_2 долей нет
  onset:
    f: hx.onset_hours
    hours: [[2, 50], [6, 30], [24, 20]]
findings:
  - f: sym.palpitations
    band: usually
    attrs: { rhythm: { regular: 100 } }
  - f: hx.onset_hours
    band: { pct: 100 }
    note: "когда началось, больной называет при расспросе — у каждого"
  - f: vital.tachycardia
    band: { pct: 100 }
    note: "по определению: три и более сокращения подряд с частотой больше 100 в минуту, исходящие из желудочков (569_2, термины и определения)"
  # быстрая — 150 в минуту и чаще, медленная — реже (569_2, раздел 1.5, классификация): доля — игровая оценка
  - { f: vital.tachycardia_150, band: usually }
  - f: ecg.vt
    band: { pct: 100 }
    note: "тахикардия с широкими QRS видна на ЭКГ у каждого, у кого она есть: признак — это она сама"
  - f: vital.bp_low
    band: { pct: 100 }
    when: { unstable: [yes] }
    note: "нестабильный в игре — с давлением ниже 90 по определению параметра (569_2, раздел 3.1.2: симптомная артериальная гипотензия)"
  - { f: sym.dizziness, band: usually }
  - { f: sym.syncope, band: sometimes, when: { unstable: [no] } }
  - { f: sym.syncope, band: often, when: { unstable: [yes] } }
  - { f: sym.dyspnea, band: sometimes, when: { unstable: [no] } }
  - { f: sym.dyspnea, band: usually, when: { unstable: [yes] } }
  - { f: sign.pallor, band: usually, when: { unstable: [yes] } }
# диагноз — по ЭКГ: широкий QRS 120 мс и больше, без предшествующего P (569_2, раздел 2)
confirm: [exam.ecg]
redFlags: [vital.bp_low, ecg.vt]
treatment:
  # тахикардию с широкими QRS считают желудочковой, пока НЖТ не доказана (569_2, раздел 3.1.3, ЕОК IC);
  # стабильному — электрическая кардиоверсия, если риск седации низок (ЕОК IC), или прокаинамид (ЕОК IIaB),
  # амиодарон (ЕОК IIbB); верапамил при широких QRS неясной этиологии — не рекомендуется (ЕОК IIIB);
  # бета-адреноблокатор — при болезни сердца, после купирования
  firstLine: [tx.cardioversion, tx.procainamide]
  acceptable: [tx.amiodarone_iv, tx.beta_blocker]
  harmful: [tx.verapamil_iv, tx.verapamil]
  notIndicated: [tx.vagal, tx.trifosadenine, tx.doac, tx.heparin_iv, tx.lmwh, tx.aspirin_acs]
  plan: [tx.cardioversion]
  byParam:
    # нестабильный (раздел 3.1.2, ЕОК IA): экстренная кардиоверсия — и перед переводом; лекарства — не то
    - when: { unstable: [yes] }
      notIndicated: [tx.procainamide, tx.amiodarone_iv]
      require: [tx.cardioversion]
      beforeTransfer: [tx.cardioversion]
    # стабильный: «незамедлительное купирование рекомендуется даже при стабильной гемодинамике» (раздел 3.1.3)
    - when: { unstable: [no] }
      require: [[tx.cardioversion, tx.procainamide, tx.amiodarone_iv]]
  # госпитализация — всем, и после купированного приступа (раздел 6); в игре — ПИТ. Перевод в центр более
  # высокого уровня — не ошибка («целесообразно направление», раздел 6): перевод закрывает и ПИТ
  setting:
    default: icu
texts:
  summary:
    ru: >-
      Частая тахикардия из желудочков — чаще у тех, кто перенёс инфаркт или живёт с сердечной недостаточностью.
      Сердцебиение, головокружение, обморок. На ЭКГ — широкие комплексы QRS: такую тахикардию считают
      желудочковой, даже если давление нормальное. Низкое давление — электрическая кардиоверсия сразу;
      стабильному — разряд под седацией или прокаинамид, амиодарон. Верапамил нельзя. Потом — ПИТ и центр:
      коронарография, ЭхоКГ, кардиовертер-дефибриллятор.
pearls:
  - ru: "Нормальное давление не значит, что тахикардия наджелудочковая: широкие комплексы — желудочковая, пока не доказано иное."
  - ru: "Верапамил при тахикардии с широкими комплексами может уронить давление."
  - ru: "При тяжёлой сердечной недостаточности прокаинамид не применяют — амиодарон или разряд."
simplified: "Морфологических критериев ЖТ и НЖТ с аберрацией нет: широкие комплексы в игре — всегда желудочковая тахикардия. Нет полиморфной ЖТ и «пируэта», электрического шторма, ИКД, фибрилляции желудочков и остановки кровообращения; калий, магний и лекарственные причины не ищут; седация перед разрядом — словами. ЭхоКГ, коронарографии и направления на ИКД — в центре, после перевода."
sources:
  - { kind: guideline, title: "Желудочковые нарушения ритма сердца. Внезапная сердечная смерть.", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/569_2", note: "ID 569_2, опубликованы 07.10.2025, применяются; сверено с рубрикатором 05.10.2026; раздел 1.2: ЖТ осложняет тяжёлые болезни сердца — ИБС, постинфарктный рубец, кардиомиопатии; раздел 1.6: сердцебиение, предобморок и обмороки — три главных симптома; раздел 2: широкий QRS ≥ 120 мс без предшествующего P; раздел 3.1.2: экстренная кардиоверсия при острых нарушениях гемодинамики (ЕОК IA); раздел 3.1.3: широкие QRS — ЖТ, пока НЖТ не доказана (ЕОК IC), кардиоверсия при низком риске седации (ЕОК IC), прокаинамид (ЕОК IIaB), амиодарон (ЕОК IIbB), верапамил не рекомендуется (ЕОК IIIB); раздел 6: госпитализация, направление в центры более высокого уровня; доли — игровая оценка" }
review: draft
