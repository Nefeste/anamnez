id: cond.pulmonary_tb
name: { ru: "Туберкулёз лёгких" }
# впервые выявленный инфильтративный туберкулёз лёгких у взрослого (часть 110, spec 2026-11-tb; вопрос 77): воспалительные
# фокусы больше 1 см с распадом или без (КР «Туберкулез у взрослых», 16_4, раздел 1.5). Задача врача первичного звена —
# заподозрить и направить: обследование — рентген груди и мокрота на КУМ (приказ № 932н, пункт 9), направление в
# противотуберкулёзный диспансер в 3-дневный срок (пункт 12); диагноз подтверждает врачебная комиссия
# противотуберкулёзной организации, лечит фтизиатр (КР, раздел 2; раздел 6) — схем химиотерапии в игре нет. A15 —
# туберкулёз органов дыхания, подтверждённый бактериологически и гистологически
icd10: A15
department: dept.therapy
system: lungs
kind: disease
severity: serious
# передаётся по воздуху (КР, раздел 1.2): «Заразна» в энциклопедии; изолирует и лечит диспансер — не бокс своей больницы
isolation: airborne
epidemiology:
  # заболеваемость в 2024 году — 26,9 на 100 000 (КР, раздел 1.3): реже пневмонии, как гипотиреоз; полоса, возраст и пол —
  # игровая оценка
  prevalence: rare
  age: { min: 18, peak: [25, 55] }
  sex: { m: 1, f: 0.5 }
  # контакт с больным и злоупотребление алкоголем — множители игровые
  risks:
    - { id: risk.tb_contact, x: 8 }
    - { id: risk.alcohol, x: 2 }
    - { id: risk.smoking, x: 1.5 }
params:
  side: { right: 45, left: 35, both: 20 }
  # фаза распада (КР, раздел 1.5) — доля игровая
  cavity: { no: 60, yes: 40 }
course:
  stages:
    - { id: active, days: [0, 3650] }
  # симптомы развиваются постепенно, дату начала часто не назвать (КР, раздел 1.6): приходят через недели
  presentation: [21, 120]
  # за неделю без лечения заметно не изменится — «без изменений»; болезнь идёт месяцами — игровая оценка
  untreated: { band: never, days: [7, 7] }
# жалобы и признаки — КР, раздел 1.6: интоксикация — длительная субфебрильная лихорадка к вечеру, «ночные поты», слабость,
# снижение аппетита, похудание; кашель с мокротой или сухой, кровохарканье, боль в груди, одышка при обширном поражении;
# раздел 2.2: «скудность физикальных проявлений». Доли — игровая оценка
findings:
  - { f: sym.cough, band: usually, attrs: { character: { productive: 60, dry: 40 } } }
  - { f: sym.cough_long, band: always }
  - { f: sym.cough_3w, band: usually }
  - { f: sym.fatigue, band: usually }
  - { f: sym.fever_hx, band: often }
  - { f: sym.night_sweats, band: often }
  - { f: sym.weight_loss, band: often }
  - { f: sym.anorexia, band: sometimes }
  - { f: sym.hemoptysis, band: sometimes }
  - { f: sym.pleuritic_pain, band: rarely, attrs: { side: $side } }
  - { f: sym.dyspnea, band: rarely }
  - { f: vital.fever, band: rarely }
  - { f: sign.crackles_local, band: rarely, attrs: { side: $side } }
  - { f: lab.crp_high, band: sometimes }
  - { f: lab.wbc_high, band: rarely }
  - { f: img.cxr_tb, band: always, attrs: { side: $side } }
  - { f: img.cxr_cavity, band: always, when: { cavity: [yes] }, attrs: { side: $side } }
  # микроскопия находит не больше половины впервые выявленных (КР, раздел 2.3); при распаде — чаще: доли игровые, вместе —
  # около 45 %
  - { f: lab.afb_sputum, band: usually, when: { cavity: [yes] } }
  - { f: lab.afb_sputum, band: sometimes, when: { cavity: [no] } }
confirm: [exam.xray_chest]
treatment:
  # лечит фтизиатр после врачебной комиссии (КР, раздел 2; раздел 6): у врача приёма первой линии нет. Антибиотики при
  # туберкулёзе — не то лечение, глюкокортикоиды — тоже: в игре «не нужно»
  firstLine: []
  supportive: [tx.paracetamol]
  notIndicated: [tx.amoxicillin, tx.amoxicillin_clavulanate, tx.macrolide, tx.fluoroquinolone, tx.cephalosporin_oral, tx.steroid_systemic_short]
  # направить в противотуберкулёзный диспансер (приказ № 932н, пункт 12) — «К фтизиатру»; с кровохарканьем — тоже: лёгочное
  # кровотечение — показание к госпитализации в противотуберкулёзный стационар (КР, раздел 6), её решает диспансер
  setting: { default: phthisiatry }
texts:
  summary:
    ru: >-
      Хроническая инфекция лёгких, которую вызывают микобактерии туберкулёза; передаётся по воздуху.
      Начинается исподволь: кашель неделями, слабость, небольшая температура к вечеру, ночная
      потливость, похудание. На снимке — тени в верхних отделах, иногда полость распада. Врач приёма
      направляет к фтизиатру; лечат в противотуберкулёзном диспансере.
pearls:
  - ru: "Кашель дольше трёх недель — повод для рентгена лёгких и мокроты на КУМ, даже если человек выглядит здоровым."
  - ru: "Микроскопия мокроты находит не больше половины больных: «не нашли» туберкулёз не исключает."
  - ru: "При туберкулёзе лёгкие часто «молчат»: хрипов мало или нет, решает снимок."
sources:
  - { kind: guideline, title: "Туберкулез у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/16_4", note: "ID 16_4, опубликованы 16.01.2026, применяются; сверено с рубрикатором 20.11.2026 по карточке, которую прислал владелец (вопрос 78), текст — по копии документа; раздел 1.3: заболеваемость в 2024 году — 26,9 на 100 000; раздел 1.5: инфильтративный туберкулёз — фокусы больше 1 см, возможна деструкция; раздел 1.6: интоксикация, ночные поты, кашель, кровохарканье, симптомы развиваются постепенно; раздел 2: диагноз подтверждает комиссия врачей противотуберкулёзной медицинской организации; раздел 2.2: скудность физикальных проявлений; раздел 2.3 (УУР B, УДД 1): микроскопия — не менее двух образцов, находит не больше 50 % впервые выявленных; раздел 2.4 (УУР B, УДД 1): рентгенография лёгких в двух проекциях и/или КТ; раздел 6: при бактериовыделении и осложнениях, в том числе кровохарканье, — госпитализация в круглосуточный стационар; доли признаков и параметров — игровая оценка" }
  - { kind: guideline, title: "Об утверждении Порядка оказания медицинской помощи больным туберкулезом (приказ № 932н)", org: "Минздрав России", year: 2012, note: "приказ от 15.11.2012 № 932н, зарегистрирован в Минюсте России 07.03.2013 № 27557; пункт 9: рентген груди, общий анализ крови, мокрота на КУМ микроскопией; пункт 11: обследовать при кашле больше 3 недель, кровохарканье, интоксикации 2 недели и больше; пункт 12: направить в противотуберкулёзный диспансер в 3-дневный срок; сверено 20.11.2026" }
review: draft
