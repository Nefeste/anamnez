id: cond.cirrhosis_ascites
name: { ru: "Цирроз печени с асцитом" }
# декомпенсация цирроза (spec 2026-10-chapter-4, часть 54а): асцит — «самое частое осложнение» (715_2, раздел 1.3); приходят
# с впервые возникшим или напряжённым — показание к госпитализации (раздел 6). МКБ-10 — R18, асцит
icd10: R18
department: dept.therapy
system: digestive
kind: disease
severity: moderate
# асцит с инфекцией и без неё: перепутать — частично верно, различает диагностический парацентез (715_2, раздел 2.3)
group: grp.cirrhosis_ascites
epidemiology:
  # асцит — самое частое осложнение (715_2, раздел 1.3): приходят с ним не реже, чем с кровотечением из варикозных вен, хотя
  # кровотечение чаще везёт скорая. Полоса подобрана прогоном генератора — игровая оценка
  prevalence: very_common
  age: { min: 30 }
  requires: [cond.cirrhosis]
# степень по ICA (715_2, раздел 1.5): вторая — «симметричное увеличение живота», третья — напряжённый асцит; первая
# определяется только на УЗИ, с ней не приходят. Доли — игровая оценка
params:
  grade: { moderate: 60, tense: 40 }
course:
  stages:
    - { id: decompensated, days: [0, 21] }
  # живот растёт неделями — игровая оценка
  presentation: [7, 21]
  # без лечения асцит нарастает: одышка, ухудшение почек (715_2, раздел 3.2.1) — доли нет, игровая оценка
  untreated:
    - { band: often, days: [3, 10], when: { grade: [tense] } }
    - { band: sometimes, days: [7, 21], when: { grade: [moderate] } }
  # длительности госпитализации в 715_2 нет — игровая оценка
  stay: [5, 10]
findings:
  - f: sym.abdomen_enlarged
    band: { pct: 100 }
    note: "с увеличением живота и приходят: асцит второй степени — симметричное увеличение живота, третьей — напряжённый (715_2, раздел 1.5)"
  - f: sign.ascites
    band: { pct: 100 }
    note: "асцит второй и третьей степени виден на осмотре; заметят ли его — точность осмотра (715_2, раздел 2.2: притупление во фланках — 57,1 %)"
  - f: img.us_ascites
    band: { pct: 100 }
    note: "асцит на УЗИ — у каждого, у кого он заметен на осмотре (715_2, раздел 1.5)"
  - f: lab.ascitic_fluid
    band: { pct: 100 }
    note: "асцитическая жидкость при парацентезе — у каждого с асцитом (715_2, раздел 2.3)"
  - f: sign.ascites_tense
    band: { pct: 100 }
    when: { grade: [tense] }
    note: "третья степень по ICA — напряжённый асцит (715_2, раздел 1.5)"
  # напряжённый асцит — одышка: лечебный парацентез «для … уменьшения одышки» (715_2, раздел 3.2.1); живот распирает —
  # игровая оценка
  - { f: sym.dyspnea, band: usually, when: { grade: [tense] } }
  - { f: sym.dyspnea, band: rarely, when: { grade: [moderate] } }
  - { f: sym.abdominal_pain, band: sometimes, when: { grade: [tense] } }
  # отёчно-асцитический синдром — симметричные отёки ног и увеличение живота (715_2, раздел 1.6); вес растёт; желтуха,
  # слабость — декомпенсация (разделы 1.6 и 2.1). Полосы — игровая оценка
  - { f: sign.leg_edema_bilateral, band: often }
  - { f: sym.weight_gain, band: usually }
  - { f: sign.jaundice, band: sometimes }
  - { f: sym.fatigue, band: often }
confirm: [exam.paracentesis]
treatment:
  # спиронолактон с диетой — при второй степени (715_2, раздел 3.2.1, УУР A, УДД 2 и УУР C, УДД 5); после лечебного парацентеза
  # — тоже диуретики с диетой (УУР C, УДД 5)
  firstLine: [tx.spironolactone]
  acceptable: []
  supportive: [tx.low_salt_diet]
  # приём НПВП задерживает жидкость — асцит не уходит (раздел 3.2.1), провоцирует гипонатриемию и острое повреждение почек
  # (разделы 1.2 и 1.5)
  harmful: [tx.ibuprofen, tx.aspirin_course]
  # инфекции нет — антибиотик не нужен; фуросемид в вену — при отёке лёгких, асцит лечат таблетками (раздел 3.2.1)
  notIndicated: [tx.antibiotic_iv, tx.furosemide_iv]
  byParam:
    # напряжённый асцит — лечебный парацентез (раздел 3.2.1, УУР B, УДД 2), больше 5 л — с альбумином (УУР B, УДД 2; раздел
    # 5.2.4: УУР A, УДД 1)
    - when: { grade: [tense] }
      require: [tx.paracentesis_large, tx.albumin]
  # впервые возникший или напряжённый асцит — госпитализация в терапию (715_2, раздел 6)
  setting: { default: ward }
texts:
  summary:
    ru: >-
      Самое частое осложнение цирроза: давление в воротной вене растёт, белка в крови мало, почки задерживают соль и воду —
      в животе копится жидкость. Живот растёт неделями, отекают ноги, при напряжённом асците тяжело дышать. Жидкость
      пунктируют каждому с впервые возникшим асцитом — исключить инфекцию. Лечат спиронолактоном и ограничением соли; при
      напряжённом асците жидкость выпускают и вводят альбумин.
pearls:
  - ru: "Асцит впервые — диагностический парацентез, даже если жалоб на боль и температуры нет: спонтанный перитонит бывает почти без симптомов."
  - ru: "Ибупрофен и другие НПВП при асците — вред: задерживают воду и бьют по почкам."
simplified: "Асцита первой степени, видного только на УЗИ, нет: с ним не приходят. Резистентного асцита, гепаторенального синдрома и гипонатриемии отдельно нет; петлевой диуретик внутрь — при неэффективности спиронолактона — не в игре. Белок и альбумин в асцитической жидкости, СААГ и посев не считают."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: асцит — самое частое осложнение; раздел 1.5: степени асцита по ICA; раздел 1.6: отёчно-асцитический синдром — отёки ног и увеличение живота; раздел 2.2: притупление во фланках; раздел 2.3 (УУР B, УДД 2): диагностический парацентез при впервые возникшем асците; раздел 3.2.1: ограничение натрия (УУР C, УДД 5), спиронолактон (УУР A, УДД 2), лечебный парацентез при третьей степени (УУР B, УДД 2) и альбумин после него больше 5 л (УУР B, УДД 2), затем диуретики с диетой (УУР C, УДД 5); НПВП — причина неэффективности диуретиков; раздел 5.2.4 (УУР A, УДД 1): лечебный парацентез с альбумином — профилактика ГРС-ОПП; раздел 6: впервые возникший или напряжённый асцит — госпитализация; доли степеней и полосы признаков — игровая оценка" }
review: draft
