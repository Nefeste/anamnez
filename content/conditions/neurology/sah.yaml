id: cond.sah
name: { ru: "Субарахноидальное кровоизлияние" }
icd10: I60.9
department: dept.neurology
system: nerves
kind: disease
severity: critical
# кровь под паутинной оболочкой мозга из разорвавшейся аневризмы (spec 2026-10-chapter-3, часть 41в): приходят
# сами — с внезапной головной болью — и привозит скорая; в игре его принимает больница с кабинетом КТ
epidemiology:
  # аСАК — 2–5 % всех инсультов (523_3, раздел 1.3): в игре у скорой — 4 на 100 ишемических инсультов
  # (подобрано прогоном: с полосой very_rare было бы 37 — скорая везёт тяжёлых, а пик у САК — в 30–60 лет)
  prevalence: ultra_rare
  # чаще в 30–50 лет, у женщин аневризмы в 1,5 раза чаще (523_3, раздел 1.3); границы — игровая оценка
  age: { min: 18, peak: [30, 60] }
  sex: { m: 0.67, f: 1 }
params:
  # сторона слабости, если она есть
  side: { right: 50, left: 50 }
  # двигательный дефицит — у 10–15 % (523_3, раздел 1.6)
  motor: { yes: 12, no: 88 }
  # производное — доля для вывода, пока давление не измерили
  sbp160: { yes: 80, no: 20 }
derived:
  # верхнее давление ниже 160 — цель при аСАК (523_3, раздел 3.2.1): выше — снижать в вену; разбор судит по
  # тонометру (seen)
  sbp160: { f: vital.bp_high, below: 160, seen: true }
course:
  # острый период — 14 дней, острейший — первые 72 часа (523_3, раздел 1.5)
  stages:
    - { id: acute, days: [0, 14] }
  presentation: [0, 0]
  # без операции — повторное кровотечение: летальность без лечения — до 60 % (раздел 1.3); отпущенному домой —
  # хуже, игровая оценка
  untreated: { band: usually, days: [0, 3] }
findings:
  - f: sym.thunderclap
    band: { pct: 70 }
    note: "типичное начало — у 70 % (523_3, раздел 1.6): внезапная сильная боль «по типу удара в голову», «худшая головная боль в моей жизни»"
  - { f: sym.headache, band: always }
  - { f: sym.vomiting, band: often }
  - { f: sym.photophobia, band: often }
  - { f: sym.loss_of_consciousness, band: sometimes }
  - { f: sign.neck_stiffness, band: usually }
  - { f: sign.gcs_low, band: sometimes }
  - { f: sym.weakness_one_side, band: always, when: { motor: [yes] }, attrs: { side: $side } }
  - f: sign.hemiparesis
    band: { pct: 100 }
    when: { motor: [yes] }
    attrs: { side: $side }
    note: "двигательный дефицит виден на осмотре у каждого, у кого он есть: признак — это он сам"
  - f: vital.bp_high
    band: { pct: 50 }
    note: "лёгкое или умеренное повышение давления — примерно у половины (523_3, раздел 1.6)"
  - f: img.ct_blood
    band: { pct: 100 }
    note: "кровь на КТ — по определению болезни (523_3, раздел 2); пропустить её может само обследование"
  - f: img.ct_sah
    band: { pct: 100 }
    note: "кровь в бороздах и цистернах — то, что отличает САК на КТ (523_3, раздел 1.1)"
confirm: [exam.ct_head, exam.cta_head]
redFlags: [sym.thunderclap, sign.neck_stiffness]
differential: [cond.migraine, cond.tension_headache]
treatment:
  # первой линии нет: аневризму выключают в нейрохирургии — перевод. Тромболизис — вред (кровь на КТ —
  # абсолютное противопоказание, 814_1, раздел 2.4); антитромботики отменяют (523_3, раздел 3.2.1) — назначить
  # их — вред; антифибринолитики рутинно не рекомендуются (там же)
  harmful: [tx.thrombolysis_stroke, tx.thrombolysis, tx.thrombolysis_pe, tx.aspirin_acs, tx.clopidogrel, tx.doac, tx.heparin_iv, tx.lmwh, tx.enoxaparin_acs, tx.fondaparinux]
  notIndicated: [tx.tranexamic]
  # до операции — постельный режим, обезболивание, нимодипин внутрь 21 день (раздел 3.2.1)
  supportive: [tx.bed_rest, tx.paracetamol, tx.ibuprofen, tx.nimodipine]
  # консультация нейрохирурга — до перевода: она согласует перевод (раздел 6, критерий качества 2)
  beforeTransfer: [tx.nsg_consult]
  byParam:
    # верхнее давление 160 и выше — снизить в вену до перевода (раздел 3.2.1)
    - when: { sbp160: [no] }
      beforeTransfer: [tx.bp_iv]
    - when: { sbp160: [yes] }
      notIndicated: [tx.bp_iv]
  # при невозможности операции на месте — в центр с нейрохирургической и эндоваскулярной помощью (раздел
  # 3.2.2): аневризму выключают в первые 72 часа от её выявления (УУР B)
  setting: { default: transfer }
texts:
  summary:
    ru: >-
      Разорвалась аневризма артерии мозга, и кровь растеклась под паутинной оболочкой. Голова болит
      внезапно, как от удара, — «худшая боль в жизни»; рвота, свет режет глаза, затылок не согнуть,
      бывает потеря сознания, а у многих на осмотре больше ничего нет. КТ — сразу: кровь в бороздах и
      цистернах. Перевод в нейрохирургию, чтобы выключить аневризму в первые 72 часа, — без этого
      повторное кровотечение убивает. До перевода — давление ниже 160 и нейрохирург в первые 60 минут
      после КТ.
pearls:
  - ru: "Первая в жизни внезапная сильнейшая головная боль — не мигрень, пока КТ не сказала обратного."
  - ru: "У 40 из 100 больных с субарахноидальным кровоизлиянием на осмотре нет никаких неврологических симптомов: решает расспрос о начале боли и КТ."
  - ru: "До выключения аневризмы — постельный режим, обезболивание, давление ниже 160 и нимодипин внутрь."
simplified: "Субарахноидальное кровоизлияние в игре — из аневризмы: ангиографию и выключение аневризмы делают в нейрохирургии, переводом. Атипичные формы — только головная боль без внезапного начала. Шкал Hunt–Hess, WFNS и Fisher, спазма артерий, повторного кровотечения в ПИТ и люмбальной пункции нет."
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 1.3: аСАК — 2–5 % инсультов, чаще в 30–50 лет, аневризмы у женщин в 1,5 раза чаще, летальность без лечения — до 60 %; раздел 1.5: острый период 14 дней, острейший — 72 часа; раздел 1.6: типичное начало у 70 %, ригидность затылочных мышц, двигательный дефицит у 10–15 %, у 40 % — без неврологических симптомов, давление повышено у половины; раздел 3.2.1: давление ниже 160 — нимодипин или урапидил, постельный режим, анальгезия, отмена антитромботиков, нимодипин внутрь 21 день, антифибринолитики не рекомендуются; раздел 3.2.2: выключение аневризмы в первые 72 часа, перевод в центр с нейрохирургией; частота ригидности, рвоты и светобоязни — игровая оценка" }
review: draft
