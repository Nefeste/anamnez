id: cond.bell_palsy
name: { ru: "Невропатия лицевого нерва" }
# идиопатическая — паралич Белла, G51.0 (895_1, раздел 1.4); синдром Рамсея Ханта (G51.1), травма, опухоли и
# отогенные — «Упрощено»
icd10: G51.0
department: dept.neurology
system: nerves
kind: disease
# не угрожает жизни, но лицо, глаз и сроки лечения — средней тяжести, игровая оценка
severity: moderate
# приходят сами (spec 2026-10-chapter-3, часть 44б): с перекошенным лицом — как при подозрении на инсульт, в
# больницу, где есть невролог и КТ
epidemiology:
  # 8–32 на 100 000 в год (895_1, раздел 1.3) — в десятки раз реже инсульта; полоса подобрана прогоном генератора,
  # игровая оценка
  prevalence: very_rare
  # «преимущественно в возрасте 40–60 лет», мужчины и женщины поровну (раздел 1.3); с 18 — рекомендация для
  # взрослых, игровая оценка
  age: { min: 18, peak: [40, 60] }
  sex: { m: 1, f: 1 }
  # сезонность — осень, смена температур (раздел 1.2); множители — игровая оценка
  season: { winter: 1.0, spring: 1.0, summer: 0.8, autumn: 1.3 }
  # коморбидный фон — сахарный диабет (раздел 1.2); множитель — игровая оценка
  risks:
    - { id: cond.diabetes2, x: 1.5 }
params:
  # сторона пареза
  side: { right: 50, left: 50 }
  # тяжёлая — V–VI степень по шкале Хауса-Брэкманна (895_1, разделы 3.2.1 и 4.2.1; приложение Г4): доля — игровая
  # оценка, в 895_1 её нет
  severity: { moderate: 70, severe: 30 }
  # производные — доли для вывода, пока о начале не спросили и глаз не видели: по долям часов от начала ниже, по
  # лагофтальму и тяжести
  h72: { yes: 80, no: 20 }
  eye: { yes: 75, no: 25 }
  iv: { yes: 24, no: 76 }
derived:
  # глюкокортикоид оптимально в первые 72 часа от дебюта (раздел 3.2.1): часы идут, пока идёт обследование
  h72: { f: hx.onset_hours, below: 72, clock: true }
  # глаз не закрывается — увлажнение глаза (раздел 3.2.1)
  eye: { has: sign.lagophthalmos }
  # тяжёлая в первые 3 дня — метилпреднизолон в вену вместо таблеток (раздел 3.2.1) и госпитализация для него
  # (раздел 6.2.1)
  iv: { all: { severity: [severe], h72: [yes] } }
course:
  stages:
    - { id: acute, days: [0, 21] }
  presentation: [0, 0]
  # без глюкокортикоида в первые дни: «в первые дни возможно нарастание слабости мышц» (раздел 3.2.1); доля —
  # игровая оценка
  untreated: { band: sometimes, days: [1, 3], when: { h72: [yes] } }
  # в палате — 1–2 дня (игровая оценка): однократное введение метилпреднизолона, в том числе в дневном стационаре
  stay: [1, 2]
  # часов от начала до прихода: развивается за 24–48 часов, максимум — 72 (раздел 1.6); в первые 72 часа — 80 из
  # 100, игровая оценка
  onset:
    f: hx.onset_hours
    hours: [[12, 25], [24, 25], [48, 20], [72, 10], [168, 15], [336, 5]]
findings:
  - f: sym.face_droop
    band: { pct: 100 }
    note: "асимметрия лица за счёт односторонней слабости мимических мышц — по определению (895_1, раздел 1.1): с ней и приходят"
  - f: sign.facial_palsy_peripheral
    band: { pct: 100 }
    attrs: { side: $side }
    note: "слабость верхней и нижней групп мимических мышц половины лица — по определению; только нижней — признак центрального поражения (895_1, раздел 1.6)"
  - f: sign.facial_palsy_severe
    band: { pct: 100 }
    when: { severity: [severe] }
    attrs: { side: $side }
    note: "тяжёлая — V–VI степень по шкале Хауса-Брэкманна: движений почти или совсем нет — по определению параметра"
  # лагофтальм «встречается у 3/4 пациентов разной степени выраженности» (895_1, раздел 1.6): при тяжёлой глаз не
  # закрывается у каждого, при умеренной — у 64 из 100, всего — у 3/4 (игровая оценка разбивки)
  - f: sign.lagophthalmos
    band: { pct: 100 }
    when: { severity: [severe] }
    attrs: { side: $side }
    note: "при V–VI степени по шкале Хауса-Брэкманна глаз не закрыть даже с усилием — по определению степени"
  - f: sign.lagophthalmos
    band: { pct: 64 }
    when: { severity: [moderate] }
    attrs: { side: $side }
    note: "при умеренной — у 64 из 100: всего с тяжёлой — 3/4, как в 895_1, раздел 1.6"
  # боль за ухом в день заболевания или за 1–2 дня (приложение В3); доля — игровая оценка
  - { f: sym.ear_pain_behind, band: often }
  - f: hx.onset_hours
    band: { pct: 100 }
    note: "когда перекосило, больной называет при расспросе — у каждого: от этого зависит глюкокортикоид (895_1, раздел 3.2.1)"
# диагноз клинический: паралич Белла — диагноз исключения (895_1, раздел 1.2), периферический парез видит невролог
confirm: [exam.neuro_exam]
# с чем спутать: перекошенное лицо — признак инсульта; лоб морщится — центральный парез (раздел 1.6)
differential: [cond.stroke_ischemic, cond.tia]
treatment:
  # глюкокортикоид — как можно раньше, оптимально в первые 72 часа, независимо от тяжести (895_1, раздел 3.2.1,
  # УУР A; критерий качества): преднизолон внутрь. Тромболизис — при «маске» инсульта: кровотечение без пользы,
  # игровое правило
  firstLine: [tx.steroid_systemic_short]
  acceptable: []
  supportive: []
  notIndicated: []
  harmful: [tx.thrombolysis_stroke]
  byParam:
    # тяжёлая в первые 3 дня — однократно метилпреднизолон в вену вместо преднизолона внутрь; противовирусные —
    # вместе с глюкокортикоидом, на ранних стадиях при тяжёлой (раздел 3.2.1, УУР B)
    - when: { iv: [yes] }
      firstLine: [tx.steroid_iv]
      acceptable: [tx.steroid_systemic_short]
      supportive: [tx.valaciclovir]
    # глаз не закрывается — увлажнение днём и на ночь (раздел 3.2.1, УУР C): иначе кератит и язва роговицы
    - when: { eye: [yes] }
      prevent: [tx.eye_lubricant]
  # где лечить (раздел 6.2.1): экстренная госпитализация, в том числе в дневной стационар, — «в первые 72 часа от
  # дебюта симптомов» для метилпреднизолона в вену; в игре — тяжёлой в первые 72 часа. Выбравшему таблетки — дома
  # тоже не ошибка; остальным — дома (реабилитация «в большей степени… дома», раздел 4.2.1)
  setting:
    default: home
    param: { name: iv, map: { yes: ward, no: home } }
    also:
      - { when: { iv: [yes] }, settings: [home] }
texts:
  summary:
    ru: >-
      Воспаление и отёк лицевого нерва: за сутки-двое перекашивает половину лица — не поднимается бровь, не
      закрывается глаз, опущен угол рта; накануне часто болит за ухом. От инсульта отличает лоб: при инсульте он
      морщится с обеих сторон, здесь — нет. Глюкокортикоид — как можно раньше, лучше в первые 72 часа; глаз, который
      не закрывается, — капли днём и гель на ночь. У большинства лицо восстанавливается за 2–3 недели.
pearls:
  - ru: "Перекосило лицо — сначала попросить поднять брови: не морщится и лоб — невропатия лицевого нерва, КТ в экстренном порядке не нужна; морщится — подозрение на инсульт."
  - ru: "Глюкокортикоид — чем раньше, тем лучше, оптимально в первые 72 часа: полное восстановление чаще на 17 %."
  - ru: "Глаз не закрывается — роговица сохнет: искусственная слеза днём и гель на ночь, иначе кератит и язва."
simplified: "Невропатия в игре — только паралич Белла: синдром Рамсея Ханта, болезнь Лайма, травма, опухоли, отогенные и двусторонние поражения и рецидивы не моделируются. Тяжесть — две степени вместо шести по шкале Хауса-Брэкманна. Осмотр ЛОР-врача и офтальмолога, ТТГ и биохимия, ЭНМГ и МРТ через 3 недели, повязка на глаз на ночь, ЛФК, кинезиотейп, ботулинотерапия и операции не проверяются."
sources:
  - { kind: guideline, title: "Краниальные мононейропатии у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/895_1", note: "ID 895_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 1.3: 8–32 на 100 000 в год, мужчины и женщины поровну, 40–60 лет; раздел 1.6: развивается за 24–48 часов, максимум 72; слабость только нижней группы мышц — центральное поражение; лагофтальм у 3/4; раздел 2.4: при типичной картине КТ и МРТ в экстренном порядке нецелесообразны, при нетипичной и подозрении на ОНМК — экстренно; раздел 3.2.1: глюкокортикоиды как можно раньше, оптимально в первые 72 часа, независимо от тяжести (УУР A); в первые 3 дня при тяжести выше IV — метилпреднизолон в вену однократно; противовирусные — с глюкокортикоидом при тяжёлой (УУР B); искусственные слёзы при лагофтальме (УУР C); раздел 6.2.1: экстренная госпитализация в первые 72 часа — для метилпреднизолона в вену; доли тяжести и боли за ухом, сроки выздоровления — игровая оценка" }
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 05.10.2026; приложение Г1: парез лицевой мускулатуры — центральный (нижняя часть лица) и периферический (вся половина лица)" }
review: draft
