id: cond.status_epilepticus
name: { ru: "Эпилептический статус" }
# эпилептический статус судорожных приступов (spec 2026-10-chapter-3, часть 44в): приступы один за другим, между
# ними человек не приходит в сознание (741_1, разделы 1.1.2 и 1.6.7). Привозит скорая. Бессудорожный, фокальный и
# рефрактерный статусы — «Упрощено»
icd10: G41.0
department: dept.neurology
system: nerves
kind: disease
severity: critical
arrival: ambulance
epidemiology:
  # 1,29–73,7 на 100 000 взрослых в год (741_1, раздел 1.3.2); полоса подобрана прогоном генератора — игровая
  # оценка
  prevalence: ultra_rare
  # чаще у людей старше 60 и у мужчин (раздел 1.3.2); пик и доля по полу — игровая оценка
  age: { min: 18, peak: [60, 85] }
  sex: { m: 1.4, f: 1 }
  # алкоголизация и отмена седативных провоцируют статус (раздел 1.6.7); множитель — игровая оценка
  risks:
    - { id: risk.alcohol, x: 1.5 }
params:
  # у больного эпилепсией или впервые — доли игровые (раздел 1.6.7: у длительно страдающих эпилепсией реже нужны
  # сложные диагностические процедуры)
  history: { first: 50, epilepsy: 50 }
  # синдром нарушения дыхания при статусе (раздел 1.6.7): производный — по измеренной сатурации; доли для вывода —
  # игровая оценка
  spo2_below90: { no: 85, yes: 15 }
derived:
  spo2_below90: { f: vital.spo2_low, below: 90 }
course:
  stages:
    - { id: acute, days: [0, 3] }
  presentation: [0, 0]
  # без лечения статус не кончается: с 30-й минуты — долгосрочные повреждения мозга (раздел 1.1.2, t2)
  untreated: { band: always, days: [0, 0] }
  # палата интенсивной терапии — игровая оценка
  stay: [3, 7]
findings:
  - f: sym.seizure_ongoing
    band: { pct: 100 }
    note: "по определению: приступы один за другим, сознание между ними не возвращается"
  - f: sign.gcs_low
    band: { pct: 100 }
    note: "синдром нарушения сознания — от оглушения до комы (раздел 1.6.7); в игре — оглушение, кома не вошла"
  # синдром нарушения дыхания (раздел 1.6.7): сатурация снижена — иногда; доля — игровая оценка
  - { f: vital.spo2_low, band: sometimes }
  # тахикардия при судорогах — игровая оценка
  - { f: vital.tachycardia, band: often }
  - f: hx.epilepsy
    band: { pct: 100 }
    when: { history: [epilepsy] }
    note: "по определению параметра: эпилепсия известна"
  - f: hx.first_seizure
    band: { pct: 100 }
    when: { history: [first] }
    note: "по определению параметра: приступ впервые в жизни"
  # несоблюдение режима приёма ПЭП — фактор риска статуса (раздел 1.6.7); доля — игровая оценка
  - { f: hx.missed_aed, band: often, when: { history: [epilepsy] } }
# «Постановка диагноза ЭССП не вызывает затруднений» (раздел 1.6.7): диагноз клинический
confirm: clinical
redFlags: [sym.seizure_ongoing]
differential: [cond.seizure, cond.hypoglycemia]
treatment:
  # первая очередь — бензодиазепин: диазепам в вену медленно или мидазолам в мышцу; вторая — вальпроевая кислота в
  # вену (блок «Оказание медицинской помощи пациенту с эпилептическим статусом», УУР C, УДД 5); при эпилепсии —
  # продолжать исходные ПЭП. Тромболизис — вред: статус не инсульт, кровотечение без пользы — игровое правило
  firstLine: [tx.benzodiazepine]
  acceptable: [tx.valproate_iv]
  supportive: []
  notIndicated: []
  harmful: [tx.thrombolysis_stroke]
  byParam:
    # кислород при сатурации ниже 90 — по принципам реанимации (блок о статусе: «кислород»; часть 38б)
    - when: { spo2_below90: [yes] }
      require: [tx.oxygen_mask]
    - when: { history: [epilepsy] }
      supportive: [tx.aed_own]
  # раздел 6: при признаках эпилептического статуса — лечение в отделении реанимации и интенсивной терапии
  setting:
    default: icu
texts:
  summary:
    ru: >-
      Приступы идут один за другим, и между ними человек не приходит в сознание, или один приступ длится дольше
      5 минут. Чем дольше, тем сильнее страдает мозг: с 30-й минуты — долгосрочные повреждения. Противосудорожное —
      сразу: диазепам в вену медленно или мидазолам в мышцу, не помогло — вальпроевая кислота в вену; глюкоза,
      кислород при низкой сатурации и палата интенсивной терапии.
pearls:
  - ru: "Судороги не прекращаются — бензодиазепин сразу, не дожидаясь анализов: к приезду в больницу первые 5 минут статуса уже прошли."
  - ru: "Диазепам в вену — только медленно: при быстром введении может остановиться дыхание и упасть давление."
  - ru: "Частая причина статуса у больного эпилепсией — пропущенное или отменённое лекарство."
simplified: "Статус в игре — только судорожный: бессудорожный, фокальный, миоклонический и рефрактерный статусы, анестетики и ИВЛ, ЭЭГ-мониторинг, повторное введение бензодиазепина и поиск причины в палате интенсивной терапии не моделируются. Кома — как оглушение."
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 1.1.2: определение статуса, у тонико-клонического t1 — 5 минут, t2 — 30 минут; раздел 1.3.2: 1,29–73,7 на 100 000 взрослых, чаще у мужчин и старше 60; раздел 1.6.7: эпилептический статус судорожных приступов — диагноз не вызывает затруднений; синдромы нарушения сознания и дыхания; факторы риска — несоблюдение режима ПЭП, алкоголизация, отмена седативных; блок «Оказание медицинской помощи пациенту с эпилептическим статусом» (УУР C, УДД 5): диазепам в/в медленно или мидазолам в/м, вальпроевая кислота в/в, при эпилепсии — продолжать исходные ПЭП, кислород; раздел 6: при эпилептическом статусе — отделение реанимации и интенсивной терапии; доли форм и признаков — игровая оценка" }
review: draft
