id: cond.seizure
name: { ru: "Судорожный приступ" }
# генерализованный тонико-клонический приступ, к приезду закончился (spec 2026-10-chapter-3, часть 44в): впервые в
# жизни или при известной эпилепсии. Код — R56.8 «Другие и неуточнённые судороги» (в рубрикаторе у 741_1); при
# известной эпилепсии — G40.x: код у болезни один, «Упрощено»
icd10: R56.8
department: dept.neurology
system: nerves
kind: disease
# сам приступ прошёл, но первый в жизни — повод искать причину в стационаре (741_1, раздел 6): игровая оценка
severity: serious
epidemiology:
  # полоса подобрана прогоном генератора (игровая оценка): заболеваемость эпилепсией — 67,77 на 100 000 в год
  # (741_1, раздел 1.3.1); доли приступов среди вызовов в 741_1 нет
  prevalence: rare
  # взрослые (с 18 лет — КТ по 741_1, раздел 2.4.5); пик — игровая оценка
  age: { min: 18, peak: [20, 80] }
  sex: { m: 1, f: 1 }
  # алкоголизация и депривация сна провоцируют приступ (741_1, раздел 1.6.7); множитель — игровая оценка
  risks:
    - { id: risk.alcohol, x: 1.5 }
params:
  # впервые в жизни или при известной эпилепсии — доли игровые: скорая чаще везёт больных эпилепсией
  history: { first: 40, epilepsy: 60 }
course:
  stages:
    - { id: acute, days: [0, 1] }
  presentation: [0, 0]
  # приступ к приезду закончился (большинство длится 2–5 минут, 741_1, раздел 1.6.5.3)
  selfLimiting: true
  # без своего препарата у больного эпилепсией приступы повторяются — серия и статус (741_1, раздел 1.6.7:
  # несоблюдение режима приёма ПЭП — фактор риска статуса); доля и срок — игровая оценка
  untreated: { band: sometimes, days: [0, 3], when: { history: [epilepsy] }, as: cond.status_epilepticus }
  # обследование при первом приступе в стационаре — игровая оценка
  stay: [2, 5]
findings:
  - f: sym.seizure
    band: { pct: 100 }
    note: "приступ видели очевидцы — по определению: с ним и привозят"
  - f: sign.postictal
    band: { pct: 100 }
    note: "постприступная спутанность — в 100 % случаев после генерализованного тонико-клонического приступа (741_1, раздел 2.1)"
  # постприступное оглушение (741_1, раздел 1.6.5.3): спутанная речь — 14 баллов; доля — игровая оценка
  - { f: sign.gcs_low, band: often }
  - f: hx.first_seizure
    band: { pct: 100 }
    when: { history: [first] }
    note: "по определению параметра: приступ впервые в жизни"
  - f: hx.epilepsy
    band: { pct: 100 }
    when: { history: [epilepsy] }
    note: "по определению параметра: эпилепсия известна"
  # пропуск препарата провоцирует приступ у больного эпилепсией (741_1, раздел 1.6.7); доля — игровая
  - { f: hx.missed_aed, band: often, when: { history: [epilepsy] } }
# диагноз клинический — по рассказу очевидцев и самого больного (741_1, раздел 2.1)
confirm: clinical
# крови на КТ при приступе не бывает: если она есть, это кровоизлияние в мозг, а не приступ
masks: [img.ct_blood]
# с чем спутать: тяжёлая гипогликемия — спутанность и оглушение; обморок при АВ-блокаде (синкопе с судорожным
# компонентом клинически может не отличаться, 741_1, раздел 1.6.6); инсульт — приступ в дебюте и постприступный
# дефицит как «маска» (814_1)
differential: [cond.hypoglycemia, cond.av_block, cond.stroke_ischemic]
treatment:
  # при известной эпилепсии — свой препарат и без пропусков (741_1: продолжать исходные ПЭП). Приступ закончился:
  # бензодиазепин и вальпроевая кислота не нужны. Тромболизис — вред: приступ в дебюте — «маска» инсульта (814_1),
  # кровотечение без пользы — игровое правило
  firstLine: [tx.aed_own]
  acceptable: []
  supportive: []
  notIndicated: [tx.benzodiazepine, tx.valproate_iv]
  harmful: [tx.thrombolysis_stroke]
  byParam:
    # после первого приступа противоэпилептический сразу не назначают — решает невролог по ЭЭГ и МРТ (741_1,
    # раздел 3), а своего препарата у впервые заболевшего нет
    - when: { history: [first] }
      notIndicated: [tx.aed_own]
  # где лечить (741_1, раздел 6): «пациент с впервые выявленным эпилептическим приступом… подлежит обследованию и
  # лечению в условиях стационара» — палата; при известной эпилепсии и обычном приступе — дома (в 741_1 этого нет:
  # игровая оценка), палата — тоже не ошибка
  setting:
    default: home
    param: { name: history, map: { first: ward, epilepsy: home } }
    also:
      - { when: { history: [epilepsy] }, settings: [ward] }
texts:
  summary:
    ru: >-
      Генерализованный судорожный приступ: человек теряет сознание, тело напрягается, потом дёргаются руки и ноги,
      обычно 2–5 минут; после — сонливость и спутанность, приступа не помнит. Первым делом — глюкоза: приступ бывает
      и от гипогликемии. Приступ впервые в жизни — КТ головы и стационар: ищут кровоизлияние, инсульт, опухоль,
      травму. При известной эпилепсии частая причина — пропущенное лекарство: свой препарат без пропусков, и домой.
pearls:
  - ru: "После приступа — сначала глюкометр: гипогликемия бывает и с судорогами."
  - ru: "Первый приступ в жизни — не эпилепсия, пока не доказано: КТ головы и обследование в стационаре."
  - ru: "Приступ закончился — бензодиазепин не нужен; он для статуса, когда судороги не прекращаются."
simplified: "Приступ в игре — только генерализованный тонико-клонический: фокальные, абсансы, миоклонии, психогенные и фебрильные приступы, алкогольная абстиненция и приступы при кровоизлиянии и гипогликемии не моделируются. ЭЭГ, МРТ, электролиты, люмбальная пункция, выбор противоэпилептического препарата и запрет водить машину не проверяются."
sources:
  - { kind: guideline, title: "Эпилепсия и эпилептический статус у взрослых и детей", org: "Минздрав РФ", year: 2022, url: "https://cr.minzdrav.gov.ru/view-cr/741_1", note: "ID 741_1, опубликованы 15.08.2022, применяются; сверено с рубрикатором 05.10.2026; раздел 1.1.1: эпилепсия — два неспровоцированных приступа с интервалом больше 24 часов; раздел 1.3.1: заболеваемость и распространённость; раздел 1.6.5.3: генерализованный судорожный приступ — тоническая и клоническая фазы, постприступное оглушение и сон, большинство приступов 2–5 минут; раздел 1.6.6: синкопе с судорожным компонентом клинически может не отличаться; раздел 1.6.7: провоцирующие факторы — несоблюдение режима ПЭП, депривация сна, алкоголизация; раздел 2.1: описание приступа очевидцами, постприступная спутанность — 100 % после ГТКП; раздел 2.4.5: КТ после первого приступа; раздел 6: впервые выявленный приступ — обследование и лечение в стационаре (неврология); доли форм и признаков, место при известной эпилепсии — игровая оценка" }
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 05.10.2026; раздел 1.6, табл. 6: эпилептический приступ в дебюте — имитатор инсульта (постиктальный неврологический дефицит)" }
review: draft
