id: cond.myasthenic_crisis
name: { ru: "Миастенический криз" }
# обострение миастении (spec 2026-10-chapter-4, часть 58в): «Миастенический криз – это острое жизнеугрожающее состояние,
# характеризующееся нарастающей мышечной слабостью с развитием нарушений глотания и дыхательной недостаточности, требующей
# применения инвазивной или неинвазивной вентиляции легких» (165_2, «Термины и определения»). Как кодировать криз, в 165_2 не
# сказано: G70.0 — миастения гравис (раздел 1.4)
icd10: G70.0
department: dept.neurology
system: nerves
kind: disease
severity: critical
# приходит сам с нарастающей слабостью и привозит скорая: нарастающие бульбарные и дыхательные нарушения и кризовое течение —
# показания к экстренной госпитализации (раздел 6)
epidemiology:
  # миастения в России — 5,3–10,7 на 100 000 (раздел 1.3); криз «наблюдается у 15-20% пациентов с миастенией хотя бы один раз в
  # жизни» (там же): по игровой оценке — сотни кризов в год, как случаев ботулизма (400–500 в год, 911_1). Скорая привозит его чуть
  # чаще ботулизма — он критический; полоса подобрана прогоном генератора
  prevalence: exceptionally_rare
  # «Наиболее часто это состояние развивается в первые два года после дебюта заболевания и у женщин детородного возраста, чаще до
  # 30 лет» (раздел 1.3); при раннем начале мужчин и женщин — 1:3 (там же): множитель — игровая оценка
  age: { min: 18, peak: [20, 40] }
  sex: { m: 1, f: 2 }
params:
  # известна ли миастения: «у 20% пациентов криз может стать первым симптомом, свидетельствующим о наличии еще не
  # диагностированной миастении» (раздел 1.3)
  mg: { known: 80, new: 20 }
  # что вызвало: «наиболее распространены респираторные инфекции», «у 30-40% пациентов выявить конкретный инициирующий фактор не
  # удается» (раздел 7); операции, беременности, пропуска лекарств и прививок в игре нет — доли игровые
  cause: { infection: 60, none: 40 }
  # дыхание: криз по определению — с дыхательной недостаточностью, которой нужна вентиляция (Термины); без неё — «нарастающих
  # бульбарных и дыхательных нарушений, являющихся потенциальной угрозой для развития криза» (раздел 6). Доли — игровая оценка
  resp: { failure: 60, threat: 40 }
course:
  stages:
    - { id: acute, days: [0, 14] }
  # слабость нарастает за дни: к врачу — в первые сутки-двое, игровая оценка
  presentation: [0, 2]
  # смертность — «от 2-5% до более чем 16%» (раздел 1.3): без лечения хуже — при дыхательной недостаточности сразу, без неё —
  # обычно, за дни; игровая оценка
  untreated:
    - { band: always, days: [0, 1], when: { resp: [failure] } }
    - { band: usually, days: [1, 3] }
  # выписка — «Стабилизация состояния пациента с устойчивым восстановлением функции дыхания и бульбарных нарушений» (раздел 6);
  # улучшение после иммуноглобулина — через 10–14 дней (раздел 3.1.2): в стационаре 14–28 дней, игровая оценка
  stay: [14, 28]
findings:
  - f: hx.myasthenia
    band: { pct: 100 }
    when: { mg: [known] }
    note: "по определению параметра: миастению уже находили, принимает пиридостигмин"
  # нарушения глотания — в определении криза; бульбарные нарушения — «дизартрия, нарастающая при речевой нагрузке, назолалия,
  # дисфония, дисфагия, часто с назальной регургитацией жидкой пищи» (раздел 2.2). Частот в 165_2 нет — полосы игровые
  - f: sym.swallow_trouble
    band: { pct: 100 }
    note: "нарушения глотания — в определении криза (165_2, «Термины и определения»)"
  - { f: sym.choking_liquids, band: often }
  - { f: sign.dysphagia, band: usually }
  - { f: sign.nasal_speech, band: usually }
  # глаза: «Часто первыми жалобами являются двоение в глазах и опускание век» (раздел 1.6); «Размер зрачков и зрачковые реакции
  # сохранены» (раздел 2.2) — широких зрачков, как при ботулизме, нет
  - { f: sym.diplopia, band: usually }
  - { f: sign.ptosis, band: usually }
  # «наиболее пораженными мышцами при миастении являются отводящие мышцы плеча, сгибатели бедра и мышцы шеи» (раздел 2.2)
  - { f: sym.neck_weakness, band: often }
  # «Типична динамичность этих симптомов с их нарастанием в течение дня» (раздел 1.6)
  - { f: sym.fatigue_evening, band: usually }
  - { f: sym.fatigue, band: usually }
  # дыхание: «оценку экскурсии грудной клетки, кашлевого толчка и частоты дыхания» (раздел 2.2)
  - f: sym.dyspnea
    band: { pct: 100 }
    when: { resp: [failure] }
    note: "дыхательная недостаточность, которой нужна вентиляция, — по определению криза (165_2, «Термины и определения»)"
  - { f: sym.dyspnea, band: often, when: { resp: [threat] } }
  - f: sign.weak_cough
    band: { pct: 100 }
    when: { resp: [failure] }
    note: "дыхательные мышцы не справляются — по определению криза с дыхательной недостаточностью"
  - { f: sign.weak_cough, band: often, when: { resp: [threat] } }
  - { f: vital.tachypnea, band: usually, when: { resp: [failure] } }
  # сатурация падает поздно, когда дыхательные мышцы уже не справляются — игровая оценка
  - { f: vital.spo2_low, band: sometimes, when: { resp: [failure] } }
  # респираторная инфекция — пусковой фактор (раздел 7)
  - { f: vital.fever, band: usually, when: { cause: [infection] } }
  - { f: sym.cough, band: usually, when: { cause: [infection] } }
# антитела к рецепторам ацетилхолина — результат приходит поздно, электромиографии в игре нет: диагноз — по жалобам, осмотру и
# известной миастении; холодовая проба при птозе — подсказка (раздел 2.5)
confirm: clinical
# поперхивается водой и одышка — угроза дыханию (раздел 6)
redFlags: [sym.choking_liquids, sym.dyspnea]
# с чем спутать: ботулизм — «в первую очередь» в перечне (раздел 2.3, комментарий к рекомендации об антителах); инсульт ствола —
# бульбарные нарушения; сравнения с ними в 165_2 нет
differential: [cond.botulism, cond.stroke_ischemic]
treatment:
  # быстрая патогенетическая терапия: иммуноглобулин в вену (раздел 3.1.2, УУР A, УДД 1) или плазмообмен (раздел 3.2, УУР A, УДД 2) —
  # критерий качества 10. Плазмообмена в игре нет: его делают там, куда переводят
  firstLine: []
  require: [tx.ivig]
  # иммуносупрессию «инициировать или продолжить» вместе с плазмообменом (раздел 3.2, комментарий); глюкокортикоиды могут временно
  # ухудшить в первые 2 недели (приложение А3) — можно, не обязательно. Зонд для кормления — класс MGFA IVb (раздел 1.5)
  acceptable: [tx.steroid_iv, tx.ng_tube]
  # приложение А3: фторхинолоны и макролиды — «Избегать использования или использовать с осторожностью»; бензодиазепины и опиоиды
  # угнетают дыхание (раздел 3.5, комментарий к рекомендации о премедикации)
  harmful: [tx.fluoroquinolone, tx.macrolide, tx.benzodiazepine, tx.morphine_iv]
  byParam:
    # дыхательная недостаточность — вентиляция, инвазивная или неинвазивная (Термины): одно из
    - when: { resp: [failure] }
      require: [[tx.ventilation, tx.cpap]]
    # угроза криза — вентиляция не ошибка: порогов для неё в 165_2 нет, а бульбарные и дыхательные нарушения нарастают (раздел 6)
    - when: { resp: [threat] }
      acceptable: [tx.ventilation, tx.cpap]
    # респираторная инфекция — раннее лечение инфекций (раздел 5): антибиотик широкого спектра в вену — можно, но не из приложения А3
    - when: { cause: [infection] }
      acceptable: [tx.antibiotic_iv]
  # интенсивная терапия: «могут быть опасны для жизни и требовать интенсивной терапии» (раздел 2.2). С дыхательной недостаточностью —
  # реанимация; угроза криза — ПИТ, реанимация не ошибка. Перевод в центр с плазмообменом — не ошибка (раздел 3.2: «безотлагательное
  # начало лечения оправдано»)
  setting:
    default: icu
    param: { name: resp, map: { failure: ricu, threat: icu } }
    also:
      - { when: { resp: [threat] }, settings: [ricu, transfer] }
      - { when: { resp: [failure] }, settings: [transfer] }
texts:
  summary:
    ru: >-
      Миастения — антитела мешают нервам передавать сигнал мышцам, и мышцы быстро устают. В криз её чаще всего обрушивает инфекция,
      иногда лекарство; у каждого пятого криз — первое проявление болезни. Опускаются веки, двоится, голос гнусавый, не получается
      глотать, вода попадает в нос, слабеют шея и руки; затем не хватает сил дышать. Зрачки при этом обычные. Нужны реанимация,
      иммуноглобулин в вену или плазмообмен, при дыхательной недостаточности — ИВЛ.
pearls:
  - ru: "Птоз, двоение и гнусавый голос, а зрачки обычные — думать о миастении; широкие зрачки и консервы — о ботулизме."
  - ru: "Слабый кашель и поверхностный вдох у больного миастенией — дыхание скоро откажет: в реанимацию, не ждать сатурации."
  - ru: "При миастении нельзя фторхинолоны, макролиды и успокоительные: они ослабляют мышцы и угнетают дыхание."
simplified: "Угроза криза — нарастающие бульбарные и дыхательные нарушения без вентиляции — в игре тот же диагноз. Причина — респираторная инфекция или не найдена: операций, беременности, пропуска пиридостигмина и прививок нет. Холинергического криза, пиридостигмина, пробы с неостигмином, антител, электромиографии и КТ средостения тоже нет. Плазмообмена своего нет — перевод."
sources:
  - { kind: guideline, title: "Миастения", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/165_2", note: "ID 165_2, опубликованы 15.12.2025, применяются; сверено с рубрикатором 12.10.2026; «Термины и определения»: криз — нарастающая слабость с нарушениями глотания и дыхательной недостаточностью, требующей вентиляции; раздел 1.3: распространённость 5,3–10,7 на 100 000, криз у 15–20 % больных, чаще в первые два года и у женщин до 30 лет, у 20 % — первое проявление, смертность от 2–5 до 16 %; раздел 1.6: двоение и птоз — частые первые жалобы, нарастают к вечеру; раздел 2.2: бульбарные нарушения, мышцы шеи и плеч, зрачки и рефлексы сохранены, оценка экскурсии грудной клетки, кашлевого толчка и частоты дыхания; раздел 2.3: ботулизм — в дифференциальном ряду; раздел 2.5 (УУР A, УДД 1): холодовая проба; раздел 3.1.2 (УУР A, УДД 1): иммуноглобулин при жизнеугрожающих симптомах; раздел 3.2 (УУР A, УДД 2): плазмообмен без отсрочки; раздел 6: экстренная госпитализация; раздел 7: инфекции — самый частый пусковой фактор, у 30–40 % причина не найдена; приложение А3: фторхинолоны и макролиды — избегать; критерий качества 10; доли параметров и полосы — игровая оценка" }
review: draft
