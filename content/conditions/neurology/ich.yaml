id: cond.ich
name: { ru: "Внутримозговое кровоизлияние" }
icd10: I61.9
department: dept.neurology
system: nerves
kind: disease
severity: critical
# привозит скорая, как инсульт (spec 2026-10-chapter-3, часть 41в): клиника кровоизлияние от инфаркта мозга не
# отличает — решает КТ (523_3, раздел 2; 814_1, раздел 1.6); в игре — в смотровую приёмного, к монитору
arrival: ambulance
epidemiology:
  # гипертензивные ВМГ — 10–15 % всех нарушений мозгового кровообращения (523_3, раздел 1.3), ишемических — 85 %
  # (814_1, раздел 1.3): в игре у скорой — 12 на 100 ишемических инсультов (подобрано прогоном: с полосой
  # very_rare было бы 27)
  prevalence: extremely_rare
  # средний возраст 60–65 лет, риск растёт после 55 и удваивается с каждым десятилетием; мужчин в 1,6 раза
  # больше (523_3, раздел 1.3); нижняя граница и пик — игровая оценка
  age: { min: 40, peak: [55, 85] }
  sex: { m: 1, f: 0.63 }
  # самая частая причина — артериальная гипертония, бывает на фоне антикоагулянтов (523_3, раздел 1.2);
  # множители — игровая оценка
  risks:
    - { id: cond.hypertension, x: 4 }
    - { id: risk.anticoagulants, x: 4 }
params:
  # сторона слабости и пареза лица — напротив гематомы
  side: { right: 50, left: 50 }
  # что выпало — как у ишемического инсульта (игровая оценка): очаговые симптомы — по месту гематомы (523_3,
  # раздел 1.6)
  deficit: { motor: 25, motor_face: 25, motor_face_speech: 20, motor_speech: 10, face_speech: 8, speech: 7, face: 5 }
  # тяжесть по шкале инсульта NIH — игровая оценка
  nihss: { low: 45, high: 55 }
  # объём: небольшие — до 20–30 мл, средние — 30–50/60 мл, большие — свыше 60 мл (523_3, раздел 1.5); доли —
  # игровая оценка
  volume: { small: 65, large: 35 }
  # нарушение глотания — как у ишемического инсульта, игровая оценка
  dysphagia: { yes: 45, no: 55 }
  # производные — доли для вывода, пока давление не измерили и об антикоагулянтах не спросили
  sbp140: { yes: 20, no: 80 }
  reversal: { yes: 15, no: 85 }
derived:
  # верхнее давление ниже 140 — цель первого часа (523_3, раздел 3.1.1): выше — снижать в вену; разбор судит
  # по тонометру (seen) — давление снижают по тому, что он показал
  sbp140: { f: vital.bp_high, below: 140, seen: true }
  # принимает антикоагулянт — нейтрализовать (раздел 3.1.1, приложение Б2)
  reversal: rule.ich_reversal
course:
  stages:
    - { id: acute, days: [0, 3] }
  presentation: [0, 0]
  # отпущенному домой — хуже: игровая оценка (летальность ВМГ — 40–50 %, 523_3, раздел 1.3)
  untreated: { band: always, days: [0, 1] }
  # в ПИТ — игровая оценка: в 523_3 срока нет; давление ниже 140 держат 7 дней (раздел 3.1.1)
  stay: [3, 5]
  settles: true
  # часов от начала — как у ишемического инсульта, игровая оценка: в 523_3 долей нет
  onset:
    f: hx.onset_hours
    hours: [[2, 12], [4, 18], [6, 10], [12, 20], [24, 22], [48, 18]]
findings:
  - { f: sym.weakness_one_side, band: always, when: { deficit: [motor, motor_face, motor_face_speech, motor_speech] }, attrs: { side: $side } }
  - f: sign.hemiparesis
    band: { pct: 100 }
    when: { deficit: [motor, motor_face, motor_face_speech, motor_speech] }
    attrs: { side: $side }
    note: "двигательный дефицит виден на осмотре у каждого, у кого он есть: признак — это он сам"
  - { f: sym.face_droop, band: usually, when: { deficit: [face, motor_face, motor_face_speech, face_speech] } }
  - f: sign.facial_weakness
    band: { pct: 100 }
    when: { deficit: [face, motor_face, motor_face_speech, face_speech] }
    attrs: { side: $side }
    note: "центральный парез лица виден на осмотре у каждого, у кого он есть: признак — это он сам"
  - { f: sym.speech_trouble, band: always, when: { deficit: [speech, motor_speech, motor_face_speech, face_speech] } }
  - f: sign.speech_deficit
    band: { pct: 100 }
    when: { deficit: [speech, motor_speech, motor_face_speech, face_speech] }
    note: "нарушение речи слышно на осмотре у каждого, у кого оно есть: признак — это оно само"
  - f: sym.headache
    band: { pct: 40 }
    note: "головная боль — около 40 % (523_3, раздел 1.6): не обязательный симптом ВМГ"
  - f: sym.vomiting
    band: { pct: 45 }
    note: "тошнота и рвота — 40–50 % (523_3, раздел 1.6)"
  - f: sign.gcs_low
    band: { pct: 50 }
    note: "снижение уровня сознания — около 50 % (523_3, раздел 1.6); в игре — оглушение, кома не вошла"
  - { f: sign.neck_stiffness, band: rarely }
  - { f: vital.bp_high, band: usually }
  - f: sign.nihss
    band: { pct: 100 }
    when: { nihss: [low] }
    note: "NIHSS при очаговом дефиците — 1 балл и больше (814_1, приложение Г1); 6 и больше — следующий признак, на том же числе"
  - f: sign.nihss_high
    band: { pct: 100 }
    when: { nihss: [high] }
    note: "6 баллов и больше — по определению тяжести (814_1, раздел 2.4)"
  - f: sign.dysphagia
    band: { pct: 100 }
    when: { dysphagia: [yes] }
    note: "нарушение глотания у того, у кого оно есть, — признак его самого; находит тест глотания"
  - f: img.ct_blood
    band: { pct: 100 }
    note: "кровь в веществе мозга на КТ — по определению болезни (523_3, раздел 2); пропустить её может само обследование"
  - f: img.ct_hematoma
    band: { pct: 100 }
    when: { volume: [small] }
    attrs: { side: -$side }
    note: "гематома до 30 см³ — по определению параметра; в полушарии напротив слабости"
  - f: img.ct_hematoma_large
    band: { pct: 100 }
    when: { volume: [large] }
    attrs: { side: -$side }
    note: "гематома больше 30 см³ — по определению параметра; в полушарии напротив слабости"
  - f: hx.onset_hours
    band: { pct: 100 }
    note: "когда началось, больной или родные называют при расспросе: время — у каждого (523_3, раздел 2.1)"
confirm: [exam.ct_head, exam.cta_head]
redFlags: [sym.weakness_one_side, sym.speech_trouble, sym.face_droop]
differential: [cond.stroke_ischemic]
treatment:
  # первой линии нет: давление, нейтрализация антикоагулянта и зонд — по параметрам, место — по объёму.
  # Тромболизис — вред: кровь на КТ — абсолютное противопоказание (814_1, раздел 2.4); антиагреганты и
  # антикоагулянты при кровоизлиянии — вред; дексаметазон не рекомендуется: повышает риск смерти (523_3,
  # раздел 3.1.1, УУР B); транексамовая кислота рутинно не рекомендуется (там же)
  harmful: [tx.thrombolysis_stroke, tx.thrombolysis, tx.aspirin_acs, tx.clopidogrel, tx.doac, tx.heparin_iv, tx.lmwh, tx.enoxaparin_acs, tx.fondaparinux, tx.steroid_iv]
  notIndicated: [tx.tranexamic]
  # консультация нейрохирурга в первые 60 минут после КТ — всем с кровью, и тем, кого оставляют, и тем, кого
  # переводят: она решает о переводе (523_3, раздел 6, критерий качества 2)
  require: [tx.nsg_consult]
  beforeTransfer: [tx.nsg_consult]
  byParam:
    # верхнее давление 140 и выше — снизить в вену ниже 140 в течение часа, не ниже 130 (раздел 3.1.1, УУР B);
    # и до перевода
    - when: { sbp140: [no] }
      require: [tx.bp_iv]
      beforeTransfer: [tx.bp_iv]
    - when: { sbp140: [yes] }
      notIndicated: [tx.bp_iv]
    # принимает антикоагулянт — немедленная отмена и протромбиновый комплекс (раздел 3.1.1, приложение Б2), и
    # до перевода; витамин K1 — при варфарине вместе с ним (какой антикоагулянт — в игре не уточняется)
    - when: { reversal: [yes] }
      require: [tx.pcc]
      beforeTransfer: [tx.pcc]
      supportive: [tx.vitamin_k]
    - when: { reversal: [no] }
      notIndicated: [tx.pcc, tx.vitamin_k]
    # дисфагия — назогастральный зонд, как при ишемическом инсульте (814_1, раздел 3.1.1.6); тест глотания в
    # первые 3 часа (523_3, раздел 2.2)
    - when: { dysphagia: [yes] }
      require: [tx.ng_tube]
    - when: { dysphagia: [no] }
      supportive: [tx.ng_tube]
  # первичная госпитализация при ОНМК — в ПИТ (523_3, раздел 6); гематома полушария больше 30 см³ с дефицитом
  # или смещением — операция: перевод в нейрохирургию (раздел 3.1.2)
  setting:
    default: icu
    param: { name: volume, map: { small: icu, large: transfer } }
texts:
  summary:
    ru: >-
      Лопнула артерия в глубине мозга — чаще всего от давно повышенного и не леченного давления, бывает
      на фоне антикоагулянтов. Внезапно — слабость, перекошенное лицо, нарушенная речь, часто головная
      боль, рвота и оглушение. Клиника кровоизлияние от инфаркта мозга не отличает: КТ — в первые 40
      минут, и кровь на ней — абсолютное противопоказание к тромболизису. Давление ниже 140 в первый
      час, антикоагулянт — отменить и нейтрализовать, нейрохирург — в первые 60 минут после КТ. До 30
      см³ — палата интенсивной терапии, больше — перевод в нейрохирургию.
pearls:
  - ru: "Кровоизлияние и инфаркт мозга с виду одинаковы: тромболизис — только после КТ без крови, при крови на КТ он смертельно опасен."
  - ru: "Давление при кровоизлиянии снижают быстро, но аккуратно: ниже 140 в первый час, не ниже 130 и не быстрее чем на 60 в час — и держат так неделю."
  - ru: "Принимает антикоагулянт — протромбиновый комплекс сразу, при варфарине — с витамином K1, не дожидаясь анализов."
  - ru: "Глюкокортикоиды при кровоизлиянии не помогают и повышают риск смерти."
  - ru: "Объём гематомы по КТ — длина на ширину на высоту пополам: больше 30 см³ со смещением — повод для операции."
simplified: "Гематомы мозжечка и ствола, прорыв крови в желудочки и гидроцефалия не вошли: все гематомы — в полушариях, большая — со смещением. Кома (8 баллов и меньше по шкале комы Глазго) не вошла: таким нужна ИВЛ — она в главе 4. Какой антикоагулянт принимает больной, не уточняется: протромбиновый комплекс нейтрализует все три группы; идаруцизумаба и плазмы нет. Операции — в нейрохирургии, переводом. Смертности в ПИТ и шкалы ICH score нет."
sources:
  - { kind: guideline, title: "Геморрагический инсульт", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/523_3", note: "ID 523_3, опубликованы 26.12.2025, применяются; сверено с рубрикатором 04.10.2026; раздел 1.2: причины — гипертония, амилоидная ангиопатия, антикоагулянты, тромболизис; раздел 1.3: 10–15 % нарушений мозгового кровообращения, средний возраст 60–65 лет, мужчин в 1,6 раза больше, летальность 40–50 %; раздел 1.5: объём; раздел 1.6: частоты симптомов; раздел 2.4: КТ за 40 минут; раздел 3.1.1: давление, инактивация антитромботиков, дексаметазон и транексамовая кислота; раздел 3.1.2: показания к операции; раздел 6: ПИТ, нейрохирург за 60 минут, перевод; частоты дефицита и доли объёма — игровая оценка" }
review: draft
