id: cond.stroke_ischemic
name: { ru: "Ишемический инсульт" }
icd10: I63.9
department: dept.neurology
system: nerves
kind: disease
severity: critical
# привозит скорая (spec 2026-10-chapter-3, часть 41а): при подозрении на ОНМК давностью меньше 4,5 часа —
# в ближайшую больницу, где делают тромболизис (814_1, раздел 6); в игре — в смотровую приёмного, к монитору
arrival: ambulance
epidemiology:
  prevalence: rare
  # возраст и пол — игровая оценка: в 814_1 распределения нет
  age: { min: 40, peak: [60, 85] }
  # множители — игровая оценка; кардиоэмболический инсульт — у 25 % (814_1, раздел 1.3), источник
  # высокого риска — фибрилляция предсердий (раздел 1.5)
  risks:
    - { id: risk.atrial_fibrillation, x: 5 }
    - { id: cond.hypertension, x: 2 }
    - { id: cond.diabetes2, x: 1.5 }
    - { id: risk.smoking, x: 1.5 }
    - { id: risk.stroke_history, x: 3 }
params:
  # сторона слабости и пареза лица — напротив очага в мозге
  side: { right: 50, left: 50 }
  # что выпало — рука и нога, лицо, речь (игровая оценка: в 814_1 долей нет): хоть что-то из этого есть у
  # каждого, жалоба и признак на осмотре — вместе; рука и нога — у 80 %, лицо — у 58 %, речь — у 45 %
  deficit: { motor: 25, motor_face: 25, motor_face_speech: 20, motor_speech: 10, face_speech: 8, speech: 7, face: 5 }
  # тяжесть по шкале инсульта NIH: до 5 баллов — и 6 и больше. «Около половины всех ишемических инсультов
  # изначально являются малыми (NIHSS < 5)» (814_1, раздел 3.1.2.1.1): при 60 малых (1–4) — 48 %
  nihss: { low: 60, high: 40 }
  # окклюзия крупной артерии при NIHSS 6 и больше — игровая оценка: в 814_1 доли нет
  lvo: { yes: 50, no: 50 }
  # нарушение глотания — игровая оценка: «частое проявление острого инсульта» (раздел 2.2)
  dysphagia: { yes: 45, no: 55 }
  # производные — доли для вывода, пока о начале не спросили и NIHSS не знают: по долям часов от начала
  # ниже и тяжести выше
  window: { yes: 35, no: 65 }
  early6: { yes: 40, no: 60 }
  lysis90: { yes: 12, no: 88 }
  lysis180: { yes: 21, no: 79 }
  minor: { yes: 48, no: 52 }
  thrombectomy: { yes: 8, no: 92 }
derived:
  # окно тромболизиса — 4,5 часа от начала до тромболизиса (раздел 3.1.2.1.1): часы идут, пока идёт
  # обследование (clock)
  window: { f: hx.onset_hours, below: 4.5, clock: true }
  # тромбэктомия по КТ-ангиографии — в первые 6 часов (разделы 2.4 и 3.1.2.1.3)
  early6: { f: hx.onset_hours, below: 6, clock: true }
  # польза тромболизиса по минутам (раздел 2.2): первые 90 минут и 91–180
  lysis90: { f: hx.onset_hours, below: 1.5, clock: true }
  lysis180: { f: hx.onset_hours, below: 3, clock: true }
  # малый инсульт — NIHSS меньше 5 (раздел 3.1.2.1.1)
  minor: { f: sign.nihss, below: 5 }
  # тромбэктомия: окклюзия, NIHSS 6 и больше, меньше 6 часов (ASPECTS 6 и больше и mRS 0–2 в игре —
  # всегда; разделы 2.4 и 3.1.2.1.3)
  thrombectomy: { all: { lvo: [yes], nihss: [high], early6: [yes] } }
course:
  # острейший период — первые 3 суток (раздел 1.5)
  stages:
    - { id: acute, days: [0, 3] }
  presentation: [0, 0]
  # отпущенному домой — хуже: игровая оценка
  untreated: { band: usually, days: [0, 2] }
  # в ПИТ — больше суток (раздел 6): 2–3 суток, игровая оценка; перевода из ПИТ в палату в игре нет
  stay: [2, 3]
  settles: true
  # часов от начала до прихода — игровая оценка: в 814_1 долей нет; в окне 4,5 часа — около трети
  onset:
    f: hx.onset_hours
    hours: [[2, 12], [4, 18], [6, 10], [12, 20], [24, 22], [48, 18]]
findings:
  - { f: sym.weakness_one_side, band: always, when: { deficit: [motor, motor_face, motor_face_speech, motor_speech] }, attrs: { side: $side } }
  - f: sign.hemiparesis
    band: { pct: 100 }
    when: { deficit: [motor, motor_face, motor_face_speech, motor_speech] }
    attrs: { side: $side }
    note: "двигательный дефицит виден на осмотре у каждого, у кого он есть: признак — это он сам"
  - { f: sym.face_droop, band: usually, when: { deficit: [face, motor_face, motor_face_speech, face_speech] } }
  - f: sign.facial_weakness
    band: { pct: 100 }
    when: { deficit: [face, motor_face, motor_face_speech, face_speech] }
    attrs: { side: $side }
    note: "центральный парез лица виден на осмотре у каждого, у кого он есть: признак — это он сам"
  - { f: sym.speech_trouble, band: always, when: { deficit: [speech, motor_speech, motor_face_speech, face_speech] } }
  - f: sign.speech_deficit
    band: { pct: 100 }
    when: { deficit: [speech, motor_speech, motor_face_speech, face_speech] }
    note: "нарушение речи слышно на осмотре у каждого, у кого оно есть: признак — это оно само"
  - { f: sym.headache, band: rarely }
  - { f: sym.dizziness, band: rarely }
  - { f: sym.vomiting, band: rarely }
  - { f: sign.gcs_low, band: sometimes, when: { nihss: [high] } }
  - { f: vital.bp_high, band: often }
  - f: sign.nihss
    band: { pct: 100 }
    when: { nihss: [low] }
    note: "NIHSS при инсульте — 1 балл и больше: 0 — дефицита нет (814_1, приложение Г1); 6 и больше — следующий признак, на том же числе"
  - f: sign.nihss_high
    band: { pct: 100 }
    when: { nihss: [high] }
    note: "6 баллов и больше — по определению тяжести (814_1, раздел 2.4)"
  - f: sign.dysphagia
    band: { pct: 100 }
    when: { dysphagia: [yes] }
    note: "нарушение глотания у того, у кого оно есть, — признак его самого; находит тест глотания"
  - f: img.cta_occlusion
    band: { pct: 100 }
    when: { lvo: [yes], nihss: [high] }
    note: "окклюзия крупной артерии — по определению параметра; на КТ-ангиографии её может пропустить само обследование"
  - f: hx.onset_hours
    band: { pct: 100 }
    note: "когда началось, больной или родные называют при расспросе: время — у каждого (814_1, раздел 2.1)"
# КТ или МРТ обязательны всем с подозрением на инсульт (814_1, раздел 1.6): клиника не отличает
# ишемический инсульт от геморрагического
confirm: [exam.ct_head, exam.cta_head]
redFlags: [sym.weakness_one_side, sym.speech_trouble, sym.face_droop]
treatment:
  # первой линии нет: тромболизис — по окну и тяжести, антиагрегант — без него, зонд — по глотанию
  notIndicated: [tx.thrombolysis, tx.doac, tx.steroid_iv]
  byParam:
    # в окне и не малый (раздел 3.1.2.1.1, УУР A): тромболизис обязателен — и тому, кого переводят: на
    # тромбэктомию — не дожидаясь его действия (раздел 3.1.2.1.2), без своей ПИТ — в ПИТ другой
    # больницы; антитромботики после него — через 24 часа
    - when: { window: [yes], minor: [no] }
      require: [tx.thrombolysis_stroke]
      beforeTransfer: [tx.thrombolysis_stroke]
      notIndicated: [tx.aspirin_acs, tx.clopidogrel]
    # вне окна — не рекомендуется по одной КТ (раздел 3.1.2.1.1); АСК или клопидогрел — в первые сутки
    # (рис. 5 приложения Б; раздел 5.1: не позднее 48 часов)
    - when: { window: [no] }
      notIndicated: [tx.thrombolysis_stroke]
      require: [[tx.aspirin_acs, tx.clopidogrel]]
    # малый инсульт — в игре неинвалидизирующий: по инструкции к алтеплазе тромболизис не рекомендуется
    # (раздел 3.1.2.1.1); антиагрегант — сразу
    - when: { minor: [yes] }
      notIndicated: [tx.thrombolysis_stroke]
      require: [[tx.aspirin_acs, tx.clopidogrel]]
    # дисфагия — назогастральный зонд (раздел 3.1.1.6); без неё зонд не ошибка: его ставят и тогда, когда
    # глотание проверить нельзя
    - when: { dysphagia: [yes] }
      require: [tx.ng_tube]
    - when: { dysphagia: [no] }
      supportive: [tx.ng_tube]
  # первичная госпитализация при ОНМК — в палату интенсивной терапии (раздел 6); тромбэктомия — в
  # сосудистом центре: перевод
  setting:
    default: icu
    param: { name: thrombectomy, map: { yes: transfer, no: icu } }
texts:
  summary:
    ru: >-
      Тромб перекрыл артерию мозга. Внезапно — слабость в руке и ноге с одной стороны, перекошенное
      лицо, нарушенная речь. Клиника кровоизлияние от инфаркта мозга не отличает: КТ — каждому, с
      заключением в первые 40 минут, а осмотр с NIHSS — в первые 10. В первые 4,5 часа от начала без
      противопоказаний — тромболизис, и чем раньше, тем больше пользы; при окклюзии крупной артерии,
      NIHSS 6 и больше и меньше 6 часов — ещё и перевод на тромбэктомию. Всем — палата интенсивной
      терапии и тест глотания в первые 3 часа.
pearls:
  - ru: "Время — мозг: тромболизис в первые 90 минут помогает каждому четвёртому-пятому, через полтора-три часа — вдвое реже, позже 4,5 часа — уже нет."
  - ru: "Не знают, когда началось, — считают от времени, когда человека последний раз видели здоровым: спросите родных, хоть по телефону."
  - ru: "Перед тромболизисом из анализов нужна только глюкоза: гипогликемия бывает «маской» инсульта."
  - ru: "Антиагреганты тромболизису не мешают, а после него АСК дают только через сутки."
  - ru: "До теста глотания — ни еды, ни таблеток через рот."
simplified: "МРТ, перфузионной КТ, ASPECTS и шкалы Рэнкина в игре нет: окно — 4,5 часа и 6 часов по часам от начала, тромбэктомия — при окклюзии и NIHSS 6 и больше. Время неизвестно и инсульт при пробуждении — не вошли. Малый инсульт в игре — неинвалидизирующий: без тромболизиса. Давление перед тромболизисом снижать игра пока не умеет. Кровоизлияния после тромболизиса без противопоказаний, отёка мозга и вторичной профилактики после выписки нет; ТИА — с частью 41б."
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 1.3: 85 % инсультов — ишемические, кардиоэмболический — 25 %; раздел 1.5: острейший период — 3 суток; раздел 1.6: КТ или МРТ — всем с подозрением на инсульт; раздел 2.1: время начала или последнего контакта; раздел 2.2: осмотр за 10 минут, ЧБНЛ 4,5 и 9, тест глотания за 3 часа; раздел 2.4: КТ за 40 минут, КТ-ангиография; раздел 3.1.2.1.1: тромболизис в первые 4,5 часа, малый инсульт; раздел 3.1.2.1.3: тромбэктомия; раздел 5.1: антиагреганты не позднее 48 часов; раздел 6: ПИТ всем с ОНМК; частоты признаков — игровая оценка" }
  - { kind: paper, title: "Emberson J, Lees KR, Lyden P и др. Effect of treatment delay, age, and stroke severity on the effects of intravenous thrombolysis with alteplase for acute ischaemic stroke: a meta-analysis of individual patient data from randomised trials. Lancet 2014;384(9958):1929–1935", note: "PMID 25106063; польза тромболизиса через 3–4,5 часа (часть 41а)" }
review: draft
