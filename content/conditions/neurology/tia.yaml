id: cond.tia
name: { ru: "Транзиторная ишемическая атака" }
icd10: G45.9
department: dept.neurology
system: nerves
kind: disease
severity: serious
# слабость или нарушение речи прошли (spec 2026-10-chapter-3, часть 41б): приходят сами и привозит скорая;
# при подозрении на ОНМК — экстренная госпитализация в больницу с неврологическим отделением для ОНМК
# (814_1, раздел 6): в игре её принимает больница с кабинетом КТ
epidemiology:
  prevalence: rare
  # возраст, пол и множители — как у инсульта, игровая оценка: в 814_1 долей ТИА нет
  age: { min: 40, peak: [60, 85] }
  risks:
    - { id: risk.atrial_fibrillation, x: 5 }
    - { id: cond.hypertension, x: 2 }
    - { id: cond.diabetes2, x: 1.5 }
    - { id: risk.smoking, x: 1.5 }
    - { id: risk.stroke_history, x: 3 }
params:
  # сторона слабости — напротив очага
  side: { right: 50, left: 50 }
  # что было (игровая оценка): слабость — у 75 %, вместе с речью — у 30 %; одна речь — у 25 %
  episode: { weakness: 45, weakness_speech: 30, speech: 25 }
  # сколько длилось (игровая оценка): по шкале ABCD2 — до 10 минут, 10–59 и час и дольше
  duration: { short: 20, mid: 35, long: 45 }
  # производные — доли для вывода, пока баллы не известны: у пациентов игры 4 балла и больше — у 78 %,
  # 6 и больше — у 15 % (у Johnston 2007 — 66 и 21 %: в игре пункты шкалы друг от друга не зависят)
  dapt: { yes: 78, no: 22 }
  high: { yes: 15, no: 85 }
  moderate: { yes: 62, no: 38 }
derived:
  # ТИА высокого риска — больше 3 баллов по ABCD2 (814_1, раздел 5.3): два антиагреганта
  dapt: rule.abcd2
  # высокий риск — 6 баллов и больше (приложение Г17): инсульт за неделю — у 12 %
  high: { rule: rule.abcd2, from: 6 }
  # умеренный — 4–5 баллов: инсульт за неделю — у 5,9 %
  moderate: { all: { dapt: [yes], high: [no] } }
course:
  stages:
    - { id: acute, days: [0, 2] }
  presentation: [0, 1]
  # симптомы уже прошли: сама атака проходит; опасность — инсульт в ближайшие дни
  selfLimiting: true
  # без профилактики — инсульт за 7 дней по группе ABCD2 (приложение Г17): 1,2, 5,9 и 12 %
  untreated:
    - { band: { pct: 1.2 }, days: [1, 7], when: { dapt: [no] }, as: cond.stroke_ischemic }
    - { band: { pct: 5.9 }, days: [1, 7], when: { moderate: [yes] }, as: cond.stroke_ischemic }
    - { band: { pct: 12 }, days: [1, 7], when: { high: [yes] }, as: cond.stroke_ischemic }
  # в ПИТ — больше суток (раздел 6): 1–2 суток, игровая оценка
  stay: [1, 2]
findings:
  - f: sym.transient_weakness
    band: { pct: 100 }
    when: { episode: [weakness, weakness_speech] }
    attrs: { side: $side }
    note: "эпизод — то, с чем приходят: жалоба у каждого, у кого он был; на осмотре его уже нет"
  - f: sym.transient_speech
    band: { pct: 100 }
    when: { episode: [speech, weakness_speech] }
    note: "эпизод — то, с чем приходят: жалоба у каждого, у кого он был; на осмотре его уже нет"
  - f: hx.tia_short
    band: { pct: 100 }
    when: { duration: [short] }
    note: "сколько длилось, больной или родные называют при расспросе — у каждого"
  - f: hx.tia_mid
    band: { pct: 100 }
    when: { duration: [mid] }
    note: "сколько длилось, больной или родные называют при расспросе — у каждого"
  - f: hx.tia_long
    band: { pct: 100 }
    when: { duration: [long] }
    note: "сколько длилось, больной или родные называют при расспросе — у каждого"
  # давление 140/90 и выше — пункт ABCD2; доля — игровая оценка
  - { f: vital.bp_high, band: usually }
  - { f: sym.headache, band: rarely }
# КТ или МРТ — всем с признаками ОНМК (814_1, разделы 1.6 и 2.4): ТИА — когда на снимке инфаркта нет
confirm: [exam.ct_head]
redFlags: [sym.transient_weakness, sym.transient_speech]
treatment:
  # первой линии нет: антиагреганты — по баллам ABCD2; тромболизиса нет — нет и дефицита
  notIndicated: [tx.thrombolysis, tx.thrombolysis_stroke, tx.doac]
  byParam:
    # до 3 баллов — один антиагрегант сразу после диагностики (раздел 5.1; рис. 5 приложения Б)
    - when: { dapt: [no] }
      require: [[tx.aspirin_acs, tx.clopidogrel]]
    # больше 3 баллов — ацетилсалициловая кислота и клопидогрел вместе, не меньше 21 суток (раздел 5.3)
    - when: { dapt: [yes] }
      require: [tx.aspirin_acs, tx.clopidogrel]
  # первичная госпитализация при ОНМК — в палату интенсивной терапии (раздел 6)
  setting:
    default: icu
texts:
  summary:
    ru: >-
      Мозгу ненадолго не хватило крови: слабость в руке и ноге с одной стороны или нарушение речи — и
      через минуты или часы всё прошло. Прошло — не значит обошлось: в ближайшие дни бывает инсульт, и
      чем больше баллов по шкале ABCD2, тем чаще. КТ — каждому, как при инсульте; антиагрегант — сразу,
      а больше 3 баллов — два: ацетилсалициловая кислота и клопидогрел. Лечат в палате интенсивной
      терапии, как всех с острым нарушением мозгового кровообращения.
pearls:
  - ru: "Прошло — не повод отпускать домой: после ТИА инсульт за неделю бывает у 1–12 %, по баллам ABCD2."
  - ru: "Шкала ABCD2: возраст, давление, слабость или речь, сколько длилось, диабет. Больше 3 баллов — два антиагреганта."
  - ru: "КТ при ТИА нужна так же, как при инсульте: другая причина симптомов, кровь — её не отличить по рассказу."
simplified: "МРТ, УЗИ сонных артерий, мониторинг ЭКГ и ЭхоКГ в игре пока нет; ретинальной ТИА и стеноза сонных артерий нет. Двойная антиагрегантная терапия с тикагрелором — нет, только с клопидогрелом. Инсульта в ПИТ после ТИА в игре нет: возврат с инсультом — только у отпущенного домой."
sources:
  - { kind: guideline, title: "Ишемический инсульт и транзиторная ишемическая атака", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/814_1", note: "ID 814_1, опубликованы 20.11.2024, применяются; сверено с рубрикатором 03.10.2026; раздел 1.1: ТИА — эпизод неврологического дефицита не дольше 24 часов без острого инфаркта на нейровизуализации; разделы 1.6 и 2.4: КТ или МРТ — всем с признаками ОНМК; раздел 2.2: осмотр невролога за 10 минут; раздел 5.1: профилактика — сразу после диагностики ТИА, снижает риск на 20–30 %; раздел 5.3: ДАТТ при ABCD2 больше 3; раздел 6: экстренная госпитализация при ОНМК, первично — в ПИТ, обычно больше 24 часов; приложение Г17: шкала ABCD2 и риск инсульта по группам; доли эпизодов — игровая оценка" }
  - { kind: paper, title: "Johnston SC, Rothwell PM, Nguyen-Huynh MN, Giles MF, Elkins JS, Bernstein AL, Sidney S. Validation and refinement of scores to predict very early stroke risk after transient ischaemic attack. Lancet 2007;369(9558):283–292", url: "https://pubmed.ncbi.nlm.nih.gov/17258668/", note: "PMID 17258668, сверено 04.10.2026: группы ABCD2 — 6–7 баллов у 21 %, 4–5 у 45 %, 0–3 у 34 %" }
review: draft
