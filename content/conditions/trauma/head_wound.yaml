id: cond.head_wound
name: { ru: "Открытая рана волосистой части головы" }
icd10: S01.0
department: dept.trauma
system: skin
kind: injury
severity: minor
epidemiology:
  # раны головы без ЧМТ — 5 % госпитализированных в нейрохирургию (733_2, раздел 1.3); доля среди
  # пришедших с травмой — игровая оценка: столько же, сколько сотрясений
  prevalence: uncommon
  # возраста и пола в 733_2 нет; дети — отдельно, в игре только взрослые
  age: { min: 18 }
params:
  # падения, аварии, удары предметами; укушенная рана — свой вид (733_2, разделы 1.2 и 1.5); долей
  # нет — игровая оценка
  cause: { blunt: 95, bite: 5 }
  # госпитализация — большая рана, требующая наблюдения, с кровопотерей (раздел 6); доля — игровая оценка
  extent: { small: 90, large: 10 }
  # столбняк — как при ране кисти (856_1, приложение А3.1); доли — игровая оценка
  tetanus: { current: 20, overdue: 50, none: 30 }
course:
  # сроков заживления и снятия швов у взрослых в 733_2 нет — игровая оценка
  stages:
    - { id: acute, days: [0, 10] }
  presentation: [0, 1]
  # без обработки — кровотечение и нагноение: осложнения у 5–10 % пролеченных (733_2, приложение В);
  # без лечения — игровая оценка
  untreated: { band: often, days: [1, 4] }
  # большая рана с кровопотерей — в стационаре до клинического улучшения (раздел 6); суток нет —
  # игровая оценка
  stay: [1, 2]
findings:
  - f: sym.head_wound
    band: { pct: 100 }
    note: "с этой жалобой приходят все: без неё раны нет — жалоба травмы, а не признак с частотой"
  - f: sym.animal_bite
    band: { pct: 100 }
    when: { cause: [bite] }
    note: "укус видно по ране и слышно от пациента — у каждого укушенного"
  # расхождение краёв — одно из показаний к обработке (733_2, раздел 3.2); частоты нет — полоса игровая
  - { f: sign.wound_gaping, band: usually }
  - f: sign.wound_large
    band: { pct: 100 }
    when: { extent: [large] }
    note: "большая рана с кровопотерей видна у каждого такого; увидит ли её врач — точность осмотра"
  # кровопотеря — гиповолемия (733_2, раздел 1.2); частоты нет — полоса игровая
  - { f: vital.tachycardia, band: sometimes, when: { extent: [large] } }
  - f: hx.tetanus_records
    band: { pct: 100 }
    when: { tetanus: [current, overdue] }
    note: "записи о прививках есть у каждого привитого по документам"
  - f: hx.tetanus_recent
    band: { pct: 100 }
    when: { tetanus: [current] }
    note: "последняя прививка меньше 5 лет назад — у каждого, кому профилактика не нужна"
# критерии качества 733_2: общеклинический и неврологический осмотр
confirm: [exam.wound_exam, exam.neuro_exam]
treatment:
  # простая рана — первичная хирургическая обработка с ушиванием, лучше в первые 24 ч; однократный
  # антибиотик во время обработки — её часть (733_2, разделы 3.2 и 5); обезболивание — N02B (раздел 3.2)
  firstLine: [tx.wound_suture]
  acceptable: [tx.wound_open]
  supportive: [tx.wound_dressing, tx.paracetamol, tx.ibuprofen]
  plan: [tx.wound_suture, tx.paracetamol]
  byParam:
    # укус — отсроченное закрытие после обработки (раздел 3.2); швы при риске бешенства не
    # рекомендуются (979_1, раздел 5.2); любые укусы головы — категория 3: иммуноглобулин и вакцина
    # сразу (979_1, приложение А3); антибиотик — как при укусе кисти (688_2, раздел 3.1.1), игровая оценка
    - when: { cause: [bite] }
      firstLine: [tx.wound_open]
      harmful: [tx.wound_suture]
      plan: [tx.wound_open, tx.paracetamol]
      prevent: [tx.rabies_vaccine, tx.rabies_ig, tx.amoxicillin_clavulanate]
    # столбняк — прививка, если не сделана в срок (733_2, раздел 5); что вводить — 856_1, приложение А3.1
    - when: { tetanus: [overdue] }
      prevent: [tx.tetanus_toxoid]
    - when: { tetanus: [none] }
      prevent: [tx.tetanus_toxoid, tx.tetanus_ig]
  # амбулаторно (733_2, раздел 6); большая рана с кровопотерей, требующая наблюдения, — стационар
  setting:
    default: home
    param: { name: extent, map: { small: home, large: ward } }
texts:
  summary:
    ru: >-
      Рана волосистой части головы после падения, удара или укуса; кожа головы хорошо снабжается
      кровью, и рана сильно кровит. Пока черепно-мозговая травма не исключена, пострадавшего ведут как
      с ней: расспрос о сознании, памяти и рвоте и неврологический осмотр. Свежую рану обрабатывают и
      зашивают в первые сутки, укушенную — обрабатывают и зашивают позже; большую рану с кровопотерей
      лечат в стационаре. Профилактика столбняка — по записям о прививках, после укуса — ещё вакцина от
      бешенства с иммуноглобулином.
pearls:
  - ru: "Маленькая рана не исключает сотрясения: тяжесть раны и тяжесть черепно-мозговой травмы не связаны — неврологический осмотр нужен каждому."
  - ru: "Рана головы может кровить так, что начнётся шок: сначала остановить кровотечение давящей повязкой, потом всё остальное."
simplified: "Сотрясения вместе с раной в игре нет: рана головы здесь — без признаков черепно-мозговой травмы. Ран лица, скальпированных ран и ран с дефектом кожи, требующих пересадки, нет."
sources:
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.3: раны без ЧМТ — 5 % госпитализированных в нейрохирургию, рана — у 20–30 % с лёгкой ЧМТ; раздел 1.6: боль и кровотечение, тяжесть раны не коррелирует с тяжестью ЧМТ; раздел 2: критерий диагноза — отсутствие признаков ЧМТ; раздел 2.1: вести как ЧМТ, пока не доказано обратное, спросить о прививках; раздел 3.2: обработка и шов в первые 24 ч, укусы — отсроченное закрытие; раздел 5: антибиотикопрофилактика однократно во время обработки, вакцинация от столбняка и бешенства; раздел 6: амбулаторно, большая рана с кровопотерей — стационар; критерии качества — повязка, неврологический осмотр, обработка раны; частоты признаков не даны — игровые" }
  - { kind: guideline, title: "Бешенство (гидрофобия) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/979_1", note: "ID 979_1, опубликованы 09.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 5.2 (УУР C, УДД 5): швы при риске бешенства не накладывают; приложение А3: любые укусы головы — категория 3, иммуноглобулин и вакцина сразу" }
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; приложение А3.1: схема выбора средств экстренной профилактики столбняка" }
review: draft
