id: cond.wrist_contusion
name: { ru: "Ушиб запястья" }
icd10: S60.2
department: dept.trauma
system: bones
kind: injury
severity: minor
epidemiology:
  # доля среди пришедших с травмой — игровая оценка: столько же, сколько переломов лучевой кости
  prevalence: uncommon
  age: { min: 18 }
params:
  # сторона — поровну, игровая оценка
  side: { right: 1, left: 1 }
course:
  # восстановление при лёгком ушибе — 1–3 недели (832_2, прил. В)
  stages:
    - { id: acute, days: [0, 21] }
  presentation: [0, 2]
  selfLimiting: true
findings:
  # боль, припухлость, кровоподтёк, ограничение функции (832_2, раздел 1.6); частот нет — полосы игровые
  - f: sym.wrist_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  # при ушибе движения вначале сохранены (832_2, раздел 1.6)
  - { f: sym.immediate_dysfunction, band: sometimes }
  - { f: sign.wrist_swelling, band: usually }
  - { f: sign.wrist_axial_pain, band: rarely }
confirm: clinical
treatment:
  # покой 3–5 дней, холод, эластичная компрессия; обезболивание — НПВП и анальгетики; системные
  # кортикостероиды не рекомендованы (832_2, раздел 3.1); короткая иммобилизация — 3–5 дней (раздел 4)
  firstLine: [tx.rice]
  acceptable: [tx.cast_splint]
  supportive: [tx.ibuprofen, tx.paracetamol]
  notIndicated: [tx.steroid_systemic_short]
  plan: [tx.rice, tx.ibuprofen]
  setting: { default: home }
texts:
  summary:
    ru: >-
      Ушиб мягких тканей запястья при падении на руку. Боль и припухлость, движения сначала
      сохранены; деформации и боли при нагрузке по оси предплечья обычно нет. Перелом лучевой
      кости исключают осмотром и снимком. Лечат покоем, холодом и эластичным бинтом; проходит за
      1–3 недели.
pearls:
  - ru: "При ушибе движения в суставе сначала сохранены и пропадают позже, по мере отёка; при переломе — сразу."
simplified: "Растяжения связок запястья в игре нет — только ушиб."
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.4: S60.2 — ушиб других частей запястья и кисти; раздел 1.6: клиника ушиба, движения вначале сохранены; раздел 3.1: покой, холод, компрессия, НПВП и анальгетики, кортикостероиды не рекомендованы; раздел 4: иммобилизация при ушибе — 3–5 дней; прил. В: восстановление при лёгких ушибах — 1–3 недели; частоты признаков не даны — полосы игровые" }
review: draft
