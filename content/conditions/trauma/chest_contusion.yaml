id: cond.chest_contusion
name: { ru: "Ушиб грудной клетки" }
icd10: S20.2
department: dept.trauma
system: bones
kind: injury
severity: minor
epidemiology:
  # травмы груди без повреждения костей встречаются реже, чем с ними (728_2, раздел 1.3); у
  # отпущенных домой после лёгкой травмы груди перелом рёбер — у 32,8 % (Chauny 2012); доля среди
  # пришедших с травмой — игровая оценка: ушибов чуть меньше, чем переломов с воздухом и кровью
  prevalence: uncommon
  # возраст — игровая оценка
  age: { min: 18, peak: [25, 65] }
params:
  # сторона — поровну, игровая оценка
  side: { right: 1, left: 1 }
course:
  # сроков выздоровления в 728_2 нет — игровая оценка
  stages:
    - { id: acute, days: [0, 21] }
  presentation: [0, 2]
  selfLimiting: true
findings:
  # боль при костной травме — в 100 % случаев (728_2, раздел 1.6); ушиб — гематомы мягких тканей
  # грудной стенки (раздел 1.3); симптома прерванного вдоха при ушибе не бывает (раздел 1.6); частот
  # нет — полосы игровые
  - f: sym.chest_injury_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  - { f: sym.pleuritic_pain, band: often, attrs: { side: $side } }
  - { f: sign.chest_wall_tenderness, band: always }
  - { f: sign.rib_compression_pain, band: rarely }
  - { f: sym.dyspnea, band: rarely }
confirm: [exam.xray_chest]
treatment:
  # анальгезия всем с закрытой травмой груди — НПВП (M01A) (728_2, раздел 3, УУР C, УДД 5),
  # парацетамол — в критерии качества 5
  firstLine: [tx.ibuprofen, tx.paracetamol]
  plan: [tx.ibuprofen]
  # ушиб легче одиночного перелома рёбер, который лечат амбулаторно (728_2, раздел 6)
  setting: { default: home }
texts:
  summary:
    ru: >-
      Ушиб грудной стенки после удара или падения: боль и припухлость в месте удара, кровоподтёк,
      больно глубоко вдохнуть. От перелома рёбер отличают по осмотру: при ушибе нет симптома
      прерванного вдоха, крепитации и ступеньки, на снимке переломов не видно. Лечат обезболиванием
      дома, проходит сам.
pearls:
  - ru: "Прерванный вдох — глубокий вдох обрывается от боли. При ушибе его не бывает: если он есть — ищите перелом ребра."
simplified: "Ушиба лёгкого и сердца в игре нет: ушиб только грудной стенки."
sources:
  - { kind: guideline, title: "Закрытая травма груди", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/728_2", note: "ID 728_2, опубликованы 18.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.4: S20.2 — ушиб грудной клетки; раздел 1.3: травмы без повреждения костей встречаются реже, чем с ними, и представлены кровоизлияниями и гематомами мягких тканей грудной стенки; раздел 1.6: боль при костной травме — в 100 % случаев, симптом «прерванного вдоха» не возникает при ушибе грудной клетки; раздел 2.4: рентгенография лёгких всем с закрытой травмой груди (УУР C, УДД 5); раздел 3: анальгезия всем — НПВП (M01A) (УУР C, УДД 5); критерий качества 5: НПВП и (или) парацетамол; частоты признаков не даны — полосы игровые" }
  - { kind: paper, title: "Chauny JM, Émond M, Plourde M, Guimont C, Le Sage N, Vanier L, Bergeron E, Dufresne M, Allain-Boulé N, Fratu R. Patients with rib fractures do not develop delayed pneumonia: a prospective, multicenter cohort study of minor thoracic injury. Ann Emerg Med 2012;60(6):726–731", url: "https://pubmed.ncbi.nlm.nih.gov/22542306/", note: "PMID 22542306, сверено 29.09.2026: 1 057 отпущенных домой после лёгкой травмы груди; перелом рёбер — у 347 (32,8 %); пневмония — у 0,6 %" }
review: draft
