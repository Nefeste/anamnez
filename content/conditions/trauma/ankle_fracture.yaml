id: cond.ankle_fracture
name: { ru: "Перелом лодыжек" }
icd10: S82.6
department: dept.trauma
system: bones
kind: injury
severity: moderate
epidemiology:
  # 179 на 100 тыс. в год (Juto 2018; 855_1, раздел 1.3); среди острых травм голеностопа переломы
  # лодыжек — 11,7 % (Stiell 1993), в игре переломов к растяжениям 1 : 3 (см. растяжение); доля
  # среди пришедших с травмой — игровая оценка
  prevalence: uncommon
  # средний возраст — 45 лет, два пика: молодые — чаще мужчины, пожилые — женщины (855_1, раздел
  # 1.3); 65 лет и старше — 34,6 % (Juto 2018)
  age: { min: 18 }
  # женщин — 58,4 % (Juto 2018)
  sex: { m: 0.71, f: 1 }
params:
  # одна лодыжка (A1, B1, изолированная внутренняя) — 54,8 %, нестабильные (две и три лодыжки, C) —
  # 41,6 %, неклассифицированные 3,3 % не считаем (Juto 2018, табл. 1)
  stability: { stable: 57, unstable: 43 }
  # сторона — поровну, игровая оценка
  side: { right: 1, left: 1 }
course:
  # иммобилизация и ограничение нагрузки — обычно до 6–8 недель после травмы (855_1, раздел 3.1)
  stages:
    - { id: acute, days: [0, 56] }
  presentation: [0, 1]
  # без иммобилизации — боль и смещение: на какой день хуже — игровая оценка
  untreated: { band: often, days: [2, 10] }
  # в палате без операции — сутки-двое, игровая оценка: длительности госпитализации в 855_1 нет
  stay: [1, 2]
# нестабильный перелом — остеосинтез, экстренная госпитализация (855_1, разделы 3.2 и 6); срока
# операции от травмы в рекомендации нет; стационар после операции — 2–5 суток, игровая оценка
surgery: { tx: tx.ankle_orif, stay: [2, 5] }
findings:
  # боль, отёк, болезненность при пальпации и осевой нагрузке, нарушение функции (855_1, раздел
  # 1.6); частот нет — полосы игровые
  - f: sym.ankle_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  - { f: sym.immediate_dysfunction, band: usually }
  - { f: sign.ankle_swelling, band: usually }
  # оттавские правила ловят почти все переломы: чувствительность 1,0 (Stiell 1993)
  - { f: sign.malleolus_tenderness, band: always }
  - { f: sign.no_weight_bearing, band: often, when: { stability: [stable] } }
  - { f: sign.no_weight_bearing, band: usually, when: { stability: [unstable] } }
  - { f: sign.lateral_ligament_tenderness, band: sometimes }
  # при смещении, вывихе и подвывихе — деформация (855_1, раздел 1.6); отёк и гематома у внутренней
  # лодыжки — довод за нестабильность (раздел 2.2)
  - { f: sign.ankle_deformity, band: often, when: { stability: [unstable] } }
  - { f: sign.medial_ankle_swelling, band: often, when: { stability: [unstable] } }
  - f: img.xr_ankle_fracture
    band: { pct: 100 }
    attrs: { side: $side }
    note: "перелом есть у каждого; увидит ли его снимок — чувствительность обследования (игровая оценка)"
  - f: img.xr_ankle_unstable
    band: { pct: 100 }
    when: { stability: [unstable] }
    note: "сдвиг таранной кости есть у каждого с нестабильным переломом; увидит ли его снимок — чувствительность обследования"
confirm: [exam.xray_ankle]
redFlags: [sign.ankle_deformity]
treatment:
  # стабильный — гипсовая повязка до 6–8 недель (855_1, раздел 3.1); обезболивание — НПВП и
  # парацетамол (раздел 3.3.1)
  firstLine: [tx.cast_splint]
  supportive: [tx.ibuprofen, tx.paracetamol]
  plan: [tx.cast_splint, tx.ibuprofen]
  byParam:
    # операция при стабильном переломе — больше нужного
    - when: { stability: [stable] }
      acceptable: [tx.ankle_orif]
    # нестабильный — остеосинтез (855_1, раздел 3.2); до операции — иммобилизация и обезболивание
    # (раздел 3.1: минимум помощи в приёмном)
    - when: { stability: [unstable] }
      supportive: [tx.cast_splint]
  # консервативно — в травмпункте (855_1, прил. В); нестабильный перелом, смещение, вывих и подвывих —
  # экстренная госпитализация и операция (раздел 6)
  setting:
    default: home
    param: { name: stability, map: { stable: home, unstable: surgery } }
    redFlag: surgery
texts:
  summary:
    ru: >-
      Перелом наружной, внутренней или обеих лодыжек, чаще после того, как подвернулась стопа.
      Боль, отёк, болезненность кости у лодыжки, трудно наступить на ногу; нужен ли снимок,
      подсказывают оттавские правила. Стабильный перелом — одна лодыжка без смещения — лечат
      гипсом 6–8 недель, нестабильный — две лодыжки, сдвиг таранной кости — оперируют.
pearls:
  - ru: "Болезненна кость у лодыжки или не может пройти четыре шага — нужен снимок; нет ни того, ни другого — перелом маловероятен."
  - ru: "Сломана одна лодыжка, а у другой отёк и гематома — подумайте о разрыве связки: перелом может быть нестабильным."
simplified: "Перелом в игре стабильный или нестабильный; стресс-снимков, КТ и контрольных снимков нет. Оперирует хирург — травматолога-ортопеда в штате нет. Открытых переломов, вывиха стопы, повреждения сосудов и нервов и переломов у детей нет."
sources:
  - { kind: guideline, title: "Переломы лодыжек", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/855_1", note: "ID 855_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: стабильные и нестабильные — два и более повреждения кольца; раздел 1.3: 179 на 100 тыс., средний возраст 45 лет; раздел 1.6: клиника; раздел 2.2: отёк и гематома у внутренней лодыжки при переломе наружной; раздел 2.4: снимок в двух проекциях; раздел 3.1: консервативно — стабильный перелом, до 6–8 недель; раздел 3.2: операция при нестабильных; раздел 6: экстренная госпитализация; частоты признаков не даны — полосы игровые" }
  - { kind: paper, title: "Juto H, Nilsson H, Morberg P. Epidemiology of Adult Ankle Fractures: 1756 cases identified in Norrbotten County during 2009–2013 and classified according to AO/OTA. BMC Musculoskelet Disord 2018;19:441", url: "https://pubmed.ncbi.nlm.nih.gov/30545314/", note: "PMID 30545314, PMC6293653, сверено 29.09.2026: 179 на 100 тыс. в год; женщин 58,4 %; 65 лет и старше — 34,6 %; табл. 1: одна лодыжка — 54,8 %, остальные — 41,6 %, неклассифицированы 3,3 %" }
  - { kind: paper, title: "Stiell IG, Greenberg GH, McKnight RD, Nair RC, McDowell I, Reardon M, Stewart JP, Maloney J. Decision rules for the use of radiography in acute ankle injuries. Refinement and prospective validation. JAMA 1993;269(9):1127–1132", url: "https://pubmed.ncbi.nlm.nih.gov/8433468/", note: "PMID 8433468, сверено 29.09.2026: 1032 взрослых с острой травмой голеностопа, 121 перелом в зоне лодыжек (11,7 %); чувствительность правил — 1,0" }
review: draft
