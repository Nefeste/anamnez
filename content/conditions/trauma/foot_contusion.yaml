id: cond.foot_contusion
name: { ru: "Ушиб стопы" }
icd10: S90.3
department: dept.trauma
system: bones
kind: injury
severity: minor
epidemiology:
  # доля среди пришедших с травмой — игровая оценка: ушибов к переломам основания пятой плюсневой
  # 3 : 1, как растяжений к переломам лодыжек, — иначе без признаков оттавских правил уверенности
  # в ушибе не хватает и разумный врач делает снимок, который правилам не нужен
  prevalence: uncommon
  # возраст — как у переломов основания пятой плюсневой: пара для различения, игровая оценка
  age: { min: 18, peak: [25, 60] }
params:
  # сторона — поровну, игровая оценка
  side: { right: 1, left: 1 }
course:
  # восстановление при лёгком ушибе — 1–3 недели (832_2, прил. В)
  stages:
    - { id: acute, days: [0, 21] }
  presentation: [0, 2]
  selfLimiting: true
findings:
  # боль, припухлость, кровоподтёк, ограничение функции (832_2, раздел 1.6); частот нет — полосы
  # игровые; болезненность кости бывает и без перелома — снимков по оттавским правилам меньше
  # только на 30–40 % (832_2, раздел 2.4)
  - f: sym.foot_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  - { f: sign.foot_swelling, band: usually }
  - { f: sign.mt5_tenderness, band: sometimes }
  - { f: sign.navicular_tenderness, band: sometimes }
  - { f: sign.no_weight_bearing, band: sometimes }
  - { f: sym.immediate_dysfunction, band: rarely }
confirm: clinical
treatment:
  # покой 3–5 дней, холод, эластичная компрессия; обезболивание — НПВП и анальгетики; системные
  # кортикостероиды не рекомендованы (832_2, раздел 3.1); короткая разгрузка — 3–5 дней (раздел 4)
  firstLine: [tx.rice]
  acceptable: [tx.rigid_shoe]
  supportive: [tx.ibuprofen, tx.paracetamol]
  notIndicated: [tx.steroid_systemic_short]
  plan: [tx.rice, tx.ibuprofen]
  setting: { default: home }
texts:
  summary:
    ru: >-
      Ушиб мягких тканей стопы, когда её подвернули или на неё упало тяжёлое. Боль, припухлость,
      кровоподтёк; наступать больно, но можно. Нужен ли снимок, решают оттавские правила для стопы.
      Лечат покоем, холодом и эластичным бинтом; проходит за 1–3 недели.
pearls:
  - ru: "Без болезненности костей стопы и с четырьмя шагами — это ушиб: снимок не нужен, совет прийти через 5–7 дней, если боль не пройдёт."
simplified: "Растяжения связок стопы в игре нет — только ушиб."
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.4: S90.3 — ушиб другой и неуточнённой части стопы; раздел 1.6: клиника ушиба; раздел 2.4: оттавские правила для голеностопа и стопы — снимков меньше на 30–40 %; раздел 3.1: покой, холод, компрессия, НПВП и анальгетики, кортикостероиды не рекомендованы; раздел 4: иммобилизация при ушибе — 3–5 дней; прил. В: восстановление при лёгких ушибах — 1–3 недели; частоты признаков не даны — полосы игровые" }
review: draft
