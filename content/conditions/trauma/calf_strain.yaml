id: cond.calf_strain
name: { ru: "Надрыв икроножной мышцы" }
# травма мышц задней группы на уровне голени — S86.1 (832_2, раздел 1.4)
icd10: S86.1
department: dept.trauma
system: bones
kind: injury
severity: minor
epidemiology:
  # растяжения связок, сухожилий и мышц — около 4 % обращений в неотложную помощь (832_2, раздел 1.3);
  # надрыв икроножной мышцы в игре — около 1 % пришедших: игровая оценка
  prevalence: uncommon
  # дегенеративные изменения мышц у лиц старше 30 лет способствуют разрыву (раздел 1.2); пик и пол —
  # игровая оценка
  age: { min: 18, peak: [30, 55] }
  sex: { m: 1.5, f: 1 }
params:
  side: { right: 1, left: 1 }
course:
  # лёгкая степень восстанавливается за 7–21 день, средняя — за 2–3 месяца (раздел 4)
  stages:
    - { id: acute, days: [0, 42] }
  # приходят, когда голень опухла, — через день-два: игровая оценка
  presentation: [0, 3]
  selfLimiting: true
findings:
  - f: sym.leg_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с болью в голени приходят все: без неё надрыва нет"
  - f: hx.calf_snap
    band: { pct: 100 }
    note: "832_2, раздел 1.6: острая боль в момент травмы — у каждого; расскажет ли о ней человек — точность расспроса"
  # напряжённость мышцы при нагрузке, снижение силы, подкожное кровоизлияние (раздел 1.6); кровоподтёк
  # при ушибе мышц — на 2–3-и сутки, бывает вдали от места (там же); частот нет — полосы игровые
  - { f: sign.calf_muscle_tenderness, band: usually }
  - { f: sign.calf_bruise, band: often }
  - { f: sign.calf_swelling_3cm, band: sometimes }
  - { f: sign.pitting_edema, band: rarely }
  - { f: sign.deep_vein_tenderness, band: rarely }
  - f: sign.homans
    band: { pct: 70 }
    note: "960_1, раздел 1.6: специфичность симптома Хоманса — 30,4 %: у 70 % без тромбоза он тоже положителен"
  - f: lab.d_dimer_high
    band: { pct: 56 }
    note: "Stein 2004: специфичность быстрого количественного D-димера при подозрении на ТГВ — около 0,44 (отношение правдоподобия отрицательного 0,09 при чувствительности 0,96): у 56 % без тромба он повышен"
  - { f: img.us_muscle_tear, band: usually }
confirm: [exam.leg_exam]
treatment:
  # покой 3–5 дней, холод 12–24 ч, эластичная компрессия, возвышенное положение; НПВП или парацетамол;
  # при неполном разрыве мышцы — иммобилизация не больше 10 дней; ГКС не рекомендованы (832_2,
  # раздел 3.1); антикоагулянты без тромбоза не нужны
  firstLine: [tx.rice]
  acceptable: [tx.cast_splint, tx.crutches]
  supportive: [tx.ibuprofen, tx.paracetamol]
  notIndicated: [tx.doac, tx.lmwh, tx.steroid_systemic_short]
  plan: [tx.rice, tx.ibuprofen]
  # амбулаторно; разрыв больше половины мышцы — операция (раздел 3.2): в игре таких нет
  setting: { default: home }
texts:
  summary:
    ru: >-
      Надрыв икроножной мышцы при рывке — на бегу, в прыжке, на корте: резкая боль в икре, будто
      ударили сзади. Потом икра опухает, трудно встать на носок, на 2–3-и сутки появляется
      кровоподтёк, иногда у лодыжки. Похоже на тромбоз глубоких вен, поэтому при боли в ноге его
      исключают: шкала Уэллса и D-димер, при сомнении — УЗИ. Лечат покоем, холодом и эластичным
      бинтом, обезболивают НПВП; лёгкий надрыв проходит за 1–3 недели.
pearls:
  - ru: "Резкая боль в икре во время рывка — довод за надрыв мышцы, но тромбоз всё равно исключают: шкала Уэллса и D-димер."
  - ru: "Кровоподтёк у лодыжки через пару дней после рывка — кровь из надорванной мышцы спустилась вниз."
  - ru: "Антикоагулянты при надрыве мышцы не нужны: тромба нет."
simplified: "Надрыв в игре — неполный: полного разрыва, операции и МРТ нет."
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: на ноге чаще всего повреждается икроножная мышца, разрыв — от резкого мышечного напряжения, у лиц старше 30 лет; раздел 1.3: растяжения связок, сухожилий и мышц — около 4 % обращений; раздел 1.6: острая боль в момент травмы, напряжённость мышцы при нагрузке, снижение силы, подкожное кровоизлияние, кровоподтёк при ушибе мышц — на 2–3-и сутки; раздел 2.4: УЗИ мышцы при признаках разрыва; раздел 3.1: покой, холод, компрессия, возвышенное положение, НПВП или парацетамол, иммобилизация до 10 дней при неполном разрыве, ГКС не рекомендованы; раздел 4: лёгкая степень — 7–21 день, средняя — 2–3 месяца; частоты признаков не даны — игровые" }
  - { kind: paper, title: "Stein PD, Hull RD, Patel KC, Olson RE, Ghali WA, Brant R, Biel RK, Bharadia V, Kalra NK. D-dimer for the exclusion of acute venous thrombosis and pulmonary embolism: a systematic review. Ann Intern Med 2004;140(8):589–602", url: "https://pubmed.ncbi.nlm.nih.gov/15096330/", note: "PMID 15096330, сверено 30.09.2026: быстрый количественный ELISA — чувствительность 0,96, отношение правдоподобия отрицательного результата 0,09, отсюда специфичность около 0,44" }
review: draft
