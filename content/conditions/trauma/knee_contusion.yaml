id: cond.knee_contusion
name: { ru: "Ушиб коленного сустава" }
icd10: S80.0
department: dept.trauma
system: bones
kind: injury
severity: minor
epidemiology:
  # среди острых травм колена переломы — 6,5 % (Stiell 1995: 68 из 1047), остальное — связки, мениски
  # и ушибы; связки — одна из самых частых внутрисуставных травм (691_2, раздел 1.3). В игре ушибов,
  # повреждений связок и переломов надколенника — 100 : 100 : 30, игровая оценка: при ушибах втрое
  # чаще связок положительный вальгус-тест у внутренней боковой связки перевешивала доля ушибов, и
  # разумный врач принимал разрыв за ушиб
  prevalence: uncommon
  # оттавские правила — для взрослых (832_2, раздел 2.4); возраст и пол — игровая оценка
  age: { min: 18 }
params:
  # сторона — поровну, игровая оценка
  side: { right: 1, left: 1 }
course:
  stages:
    - { id: acute, days: [0, 21] }
  presentation: [0, 2]
  selfLimiting: true
findings:
  # боль, припухлость, нарушение функции; при ушибе движения вначале сохранены и теряются по мере
  # отёка (832_2, раздел 1.6); частот нет — полосы игровые
  - f: sym.knee_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  - { f: hx.knee_blow, band: usually }
  - { f: sign.knee_swelling, band: usually }
  - { f: sign.knee_effusion, band: sometimes }
  # признаки оттавских правил бывают и без перелома: специфичность правил — 0,54 (Stiell 1995),
  # снимков меньше на 28 % — доли подобраны под это, игровая оценка
  - { f: sign.patella_tenderness, band: sometimes }
  - { f: sign.fibular_head_tenderness, band: rarely }
  - { f: sign.knee_flexion_limited, band: sometimes }
  - { f: sign.no_weight_bearing, band: rarely }
  - { f: sym.immediate_dysfunction, band: rarely }
confirm: [exam.knee_exam]
treatment:
  # покой 3–5 дней, холод 12–24 ч, эластичная компрессия, возвышенное положение; НПВП или
  # парацетамол; системные глюкокортикостероиды не рекомендованы (832_2, раздел 3.1)
  firstLine: [tx.rice]
  acceptable: [tx.knee_brace]
  supportive: [tx.ibuprofen, tx.paracetamol]
  notIndicated: [tx.steroid_systemic_short, tx.cast_splint]
  plan: [tx.rice, tx.ibuprofen]
  # амбулаторно; госпитализация — при выраженной боли и отёке, угрозе сдавления, для дообследования
  # или операции (832_2, раздел 6)
  setting: { default: home }
texts:
  summary:
    ru: >-
      Ушиб колена после удара или падения на него. Боль, отёк, кровоподтёк; движения сохранены, но
      болезненны, по мере отёка их становится меньше. Нужен ли снимок, решают оттавские правила для
      колена. Лечат покоем, холодом и эластичным бинтом, обезболивают НПВП; проходит за 1–3 недели.
pearls:
  - ru: "Болит после удара, а надколенник и головка малоберцовой не болезненны, колено сгибается за прямой угол и человек проходит четыре шага — снимок не нужен."
  - ru: "Колено раскрывается при вальгус-тесте или голень уходит вперёд при тесте Лахмана — это уже связки, а не ушиб."
simplified: "Ушиб в игре один — без гематом мягких тканей, повреждений менисков и хряща."
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: при ушибе движения вначале сохранены и теряются по мере отёка; раздел 2.4: оттавские правила для коленного сустава; раздел 3.1: покой 3–5 дней, холод 12–24 ч, компрессия, возвышенное положение, НПВП или парацетамол, глюкокортикостероиды не рекомендованы; раздел 6: госпитализация — при выраженной боли, угрозе сдавления, для дообследования или операции; прил. В: восстановление при лёгких ушибах — 1–3 недели; частоты признаков не даны — полосы игровые" }
  - { kind: paper, title: "Stiell IG, Greenberg GH, Wells GA, McKnight RD, Cwinn AA, Cacciotti T, McDowell I, Smith NA. Derivation of a decision rule for the use of radiography in acute knee injuries. Ann Emerg Med 1995;26(4):405–413", url: "https://pubmed.ncbi.nlm.nih.gov/7574120/", note: "PMID 7574120, сверено 29.09.2026: 1047 взрослых с острой травмой колена, переломов — 68; пять признаков правила; чувствительность 1,0, специфичность 0,54; снимков меньше на 28 % (с 68,6 до 49,4 %)" }
review: draft
