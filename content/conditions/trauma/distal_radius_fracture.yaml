id: cond.distal_radius_fracture
name: { ru: "Перелом дистального отдела лучевой кости" }
icd10: S52.5
department: dept.trauma
system: bones
kind: injury
severity: moderate
epidemiology:
  # 7,5 % всех переломов (846_1, раздел 1.3); доля среди пришедших с травмой — игровая оценка:
  # столько же, сколько ушибов запястья
  prevalence: uncommon
  # средний возраст — 62,7 года; до 50 лет мужчин и женщин поровну, после 50 — чаще женщины
  # (Rundgren 2020); чаще всего — у женщин старше 65 лет (846_1, раздел 1.3)
  age: { min: 18, peak: [50, 85] }
  # женщин — 78 % (Rundgren 2020)
  sex: { m: 0.28, f: 1 }
params:
  # оперировали 26 % (Rundgren 2020) — нестабильный; без смещения и со смещением, стабильный после
  # репозиции, — игровая оценка
  displacement: { none: 40, displaced: 34, unstable: 26 }
  # сторона — поровну, игровая оценка
  side: { right: 1, left: 1 }
course:
  # сращение в гипсовой лонгете — около 5–7 недель (846_1, раздел 3.1)
  stages:
    - { id: acute, days: [0, 42] }
  presentation: [0, 1]
  # без иммобилизации — боль и нарастающее смещение: на какой день хуже — игровая оценка
  untreated: { band: often, days: [2, 10] }
  # в палате без операции — сутки-двое, игровая оценка: длительности госпитализации в 846_1 нет
  stay: [1, 2]
# нестабильный перелом — операция, при её плане — госпитализация (846_1, разделы 3.2 и 6); срока
# операции при закрытом переломе в рекомендации нет; стационар после операции — 1–3 суток, игровая
# оценка
surgery: { tx: tx.radius_plate, stay: [1, 3] }
findings:
  # боль, болезненность при пальпации и осевой нагрузке, отёк нижней трети предплечья и кисти
  # (846_1, раздел 1.6); частот нет — полосы игровые
  - f: sym.wrist_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  - { f: sym.immediate_dysfunction, band: usually }
  - { f: sign.wrist_swelling, band: usually }
  - { f: sign.wrist_axial_pain, band: usually }
  # при смещении — видимая угловая или штыкообразная деформация (846_1, раздел 1.6)
  - { f: sign.wrist_deformity, band: usually, when: { displacement: [displaced, unstable] } }
  - f: img.xr_radius_fracture
    band: { pct: 100 }
    attrs: { side: $side }
    note: "перелом есть у каждого; увидит ли его снимок — чувствительность обследования (игровая оценка)"
  - f: img.xr_radius_displaced
    band: { pct: 100 }
    when: { displacement: [displaced, unstable] }
    note: "смещение есть у каждого со смещённым переломом; увидит ли его снимок — чувствительность обследования"
  - f: img.xr_radius_unstable
    band: { pct: 100 }
    when: { displacement: [unstable] }
    note: "признаки нестабильности (846_1, раздел 2.4) есть у каждого с нестабильным переломом; увидит ли их снимок — чувствительность обследования"
  - f: img.xr_ulnar_styloid
    band: { pct: 31 }
    note: "846_1, раздел 1.3: в 31 % случаев перелом сочетается с переломом шиловидного отростка локтевой кости"
confirm: [exam.xray_wrist]
treatment:
  # без смещения — гипсовая лонгета (846_1, раздел 3.1); вправлять незачем, но лонгета после
  # репозиции его тоже держит; обезболивание — НПВП и парацетамол (раздел 3.1, «Обезболивание»)
  firstLine: [tx.cast_splint]
  acceptable: [tx.closed_reduction]
  supportive: [tx.ibuprofen, tx.paracetamol]
  plan: [tx.cast_splint, tx.ibuprofen]
  byParam:
    # операция при переломе без смещения — больше нужного
    - when: { displacement: [none] }
      acceptable: [tx.radius_plate]
    # со смещением — закрытая репозиция и лонгета; нет признаков нестабильности после неё —
    # консервативно (846_1, раздел 3.1); лонгета без репозиции смещение не устраняет
    - when: { displacement: [displaced] }
      firstLine: [tx.closed_reduction]
      acceptable: [tx.radius_plate]
      supportive: [tx.cast_splint]
      plan: [tx.closed_reduction, tx.ibuprofen]
    # нестабильный — остеосинтез (раздел 3.2); до операции — иммобилизация и обезболивание (раздел
    # 3.1: минимум помощи в приёмном)
    - when: { displacement: [unstable] }
      supportive: [tx.cast_splint, tx.closed_reduction]
  # консервативно — амбулаторно: в травмпункте (846_1, раздел 2.4 и прил. В); нестабильный —
  # операция: смещение после репозиции — показание к экстренной госпитализации (раздел 6)
  setting:
    default: home
    param: { name: displacement, map: { none: home, displaced: home, unstable: surgery } }
texts:
  summary:
    ru: >-
      Перелом лучевой кости над запястьем — перелом «в типичном месте», чаще у женщин старше 50
      лет после падения на кисть. Боль, отёк, при смещении — штыкообразная деформация;
      подтверждает снимок в двух проекциях. Без смещения — гипсовая лонгета на 5–7 недель, со
      смещением — закрытая репозиция и лонгета, нестабильный перелом оперируют.
pearls:
  - ru: "Падение на вытянутую руку у женщины старше 50 — прежде всего подумайте о переломе лучевой кости."
  - ru: "Смещённый отломок сначала вправляют; если после репозиции он не держится — укорочение, наклон, ступенька суставной поверхности, — нужна операция."
  - ru: "После перелома от падения с высоты роста стоит подумать об остеопорозе — чтобы не было следующего перелома."
simplified: "Смещение в игре трёх видов: без смещения, со смещением и нестабильный; контрольного снимка после репозиции и вторичного смещения нет. Оперирует хирург — травматолога-ортопеда в штате нет. Открытых переломов, повреждения нерва и сосудов и переломов у детей нет."
sources:
  - { kind: guideline, title: "Переломы дистального отдела костей предплечья", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/846_1", note: "ID 846_1, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.3: 7,5 % всех переломов, чаще у женщин старше 65, в 31 % — с переломом шиловидного отростка локтевой; раздел 1.6: клиника; раздел 2.4: снимок в двух проекциях, критерии нестабильности, при плане операции — госпитализация; раздел 3.1: консервативно — без смещения и стабильные после репозиции, лонгета около 5–7 недель; раздел 3.2: показания к операции; раздел 6: экстренная госпитализация при сохраняющемся после репозиции смещении; частоты признаков не даны — полосы игровые" }
  - { kind: paper, title: "Rundgren J, Bojan A, Mellstrand Navarro C, Enocson A. Epidemiology, classification, treatment and mortality of distal radius fractures in adults: an observational study of 23,394 fractures from the national Swedish fracture register. BMC Musculoskelet Disord 2020;21:88", url: "https://pubmed.ncbi.nlm.nih.gov/32035488/", note: "PMID 32035488, PMC7007648, сверено 29.09.2026: 23 394 перелома; женщин 78 %, средний возраст 62,7 года; простое падение — 75 %; без операции — 74 %, операция — 26 % (пластина — 82 % из них); вторичная операция — у 9,1 % леченных без операции" }
review: draft
