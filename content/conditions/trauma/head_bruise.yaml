id: cond.head_bruise
name: { ru: "Ушиб мягких тканей головы" }
icd10: S00.0
department: dept.trauma
system: nerves
kind: injury
severity: minor
epidemiology:
  # поверхностная травма волосистой части головы (733_2, раздел 1.4); доля среди пришедших с
  # травмой — игровая оценка: столько же, сколько сотрясений
  prevalence: uncommon
  age: { min: 18 }
course:
  # сроков в 733_2 нет — игровая оценка
  stages:
    - { id: acute, days: [0, 7] }
  presentation: [0, 1]
  selfLimiting: true
findings:
  - f: sym.head_injury
    band: { pct: 100 }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  # боль в месте удара — основной симптом (733_2, раздел 1.6); признаков ЧМТ — потери сознания, рвоты,
  # амнезии, неврологических расстройств — нет по определению (раздел 2, термины); частот нет —
  # полосы игровые
  - { f: sym.headache, band: sometimes }
  - { f: hx.road_accident, band: rarely }
# критерий диагноза — отсутствие признаков ЧМТ (733_2, раздел 2); критерий качества 2 —
# общеклинический и неврологический осмотр
confirm: [exam.neuro_exam]
# крови на КТ при сотрясении и ушибе не бывает по определению (734_2, раздел 1.1): с частью 41в она есть у
# кровоизлияний в мозг, а у этих болезней её нет, откуда бы она ни шла (spec 2026-10-chapter-3)
masks: [img.ct_blood]
treatment:
  # консервативно (733_2, раздел 3.1, УУР C, УДД 5); обезболивание — «другие анальгетики и
  # антипиретики» N02B (раздел 3.2, УУР C, УДД 5): парацетамол; НПВП при ушибах мягких тканей
  # конечностей (832_2, раздел 3.1) — можно также
  firstLine: [tx.paracetamol]
  acceptable: [tx.ibuprofen]
  plan: [tx.paracetamol]
  setting: { default: home }
texts:
  summary:
    ru: >-
      Ушиб мягких тканей головы после удара или падения: болит место удара, бывает шишка или
      кровоподтёк. Признаков черепно-мозговой травмы нет: потери сознания, амнезии, рвоты и судорог
      не было, неврологический осмотр в норме. Пока это не проверено, такого пациента ведут как
      пострадавшего с черепно-мозговой травмой. Лечат дома, от боли — парацетамол.
pearls:
  - ru: "Любого с травмой головы считают пострадавшим с черепно-мозговой травмой, пока не доказано обратное: сначала расспрос о сознании, памяти и рвоте и неврологический осмотр."
simplified: "Ссадин и ран головы в этой версии нет — они будут в 0.2.2."
sources:
  - { kind: guideline, title: "Открытые раны головы", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/733_2", note: "ID 733_2, опубликованы 13.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.4: S00.0 — поверхностная травма волосистой части головы; раздел 1.6: основной симптом — боль; раздел 2: критерий диагноза — отсутствие признаков ЧМТ; раздел 2.1 (УУР C, УДД 5): терял ли сознание, была ли рвота, помнит ли обстоятельства травмы, двигательные и чувствительные расстройства; вести как пострадавшего с ЧМТ, пока не доказано её отсутствие; раздел 3.1 (УУР C, УДД 5): консервативное лечение ссадин и поверхностных ран; раздел 3.2 (УУР C, УДД 5): обезболивание — N02B; раздел 6: амбулаторное лечение; частоты признаков не даны — полосы игровые" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: при ушибах — ненаркотические анальгетики (N02) и НПВП (M01A); для головы — по аналогии, игровая оценка" }
review: draft
