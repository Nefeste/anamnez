id: cond.concussion
name: { ru: "Сотрясение головного мозга" }
icd10: S06.0
department: dept.trauma
system: nerves
kind: injury
severity: moderate
epidemiology:
  # лёгкая ЧМТ — 60–95 % всех черепно-мозговых травм, сотрясения к лёгким ушибам мозга — 4:1 (734_2,
  # раздел 1.3); доля среди пришедших с травмой — игровая оценка
  prevalence: uncommon
  # чаще у молодых до 30 лет и у пожилых; мужчин — 70–81 % (734_2, раздел 1.3); пик — игровая оценка
  age: { min: 18, peak: [18, 30] }
  sex: { m: 1, f: 0.33 }
params:
  # показана ли КТ — производный параметр: по правилу rule.ct_head на настоящих признаках и возрасте;
  # доли — для вывода, пока признаки правила не известны: игровая оценка по прогону генератора
  ct: { no: 32, yes: 68 }
derived:
  ct: rule.ct_head
course:
  # симптомы проходят в среднем за 4–5 суток, острый период — до 2 недель (734_2, разделы 1.5 и 1.6);
  # без отказа от экранов — медиана 8 суток (Macnow 2021); конец стадии — игровая оценка
  stages:
    - { id: acute, days: [0, 7] }
  presentation: [0, 1]
  selfLimiting: true
  # в палате — наблюдение не менее 24 часов (734_2, приложение Б); выписка — при клиническом
  # улучшении (раздел 6); срок — игровая оценка
  stay: [1, 2]
findings:
  - f: sym.head_injury
    band: { pct: 100 }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  # жалобы и частоты — 734_2, раздел 1.6
  - f: sym.loss_of_consciousness
    band: { pct: 70 }
    note: "«у 70% отмечается кратковременная утрата сознания в момент травмы» (734_2, раздел 1.6)"
  - f: sym.amnesia
    band: { pct: 40 }
    note: "амнезия на период от нескольких минут до 1 часа — «30-50% случаев» (734_2, раздел 1.6); середина"
  - f: sym.vomiting
    band: { pct: 35 }
    note: "«рвота (преимущественно однократная, около 35%)» (734_2, раздел 1.6)"
  # тошнота без рвоты — числа в 734_2 нет, полоса игровая
  - { f: sym.nausea, band: sometimes }
  # головная боль «до 90%», головокружение «около 70-75%», слабость «около 75%» (раздел 1.6)
  - { f: sym.headache, band: usually }
  - { f: sym.dizziness, band: usually }
  - { f: sym.fatigue, band: usually }
  - f: vital.tachycardia
    band: { pct: 40 }
    note: "вегетативные симптомы: «тахикардия (40%)» (734_2, раздел 1.6)"
  # судороги сразу после травмы — 1–2 % (раздел 1.6)
  - { f: sym.seizure_after_injury, band: very_rarely }
  # ДТП — одна из причин лёгкой ЧМТ (раздел 1.3); доля — игровая оценка
  - { f: hx.road_accident, band: rarely }
  # оглушение 13–14 баллов — категория 3 (раздел 2.4, табл. 1); доли в 734_2 нет — полоса игровая
  - { f: sign.gcs_low, band: rarely }
  # неврологический статус — 734_2, раздел 2.2.1
  - f: sign.nystagmus
    band: { pct: 40 }
    note: "«мелкоразмашистый нистагм (40%)» (734_2, раздел 2.2.1)"
  - f: sign.romberg_unsteady
    band: { pct: 20 }
    note: "«статическая атаксия (20%)» (734_2, раздел 2.2.1)"
  - f: sign.anisoreflexia
    band: { pct: 20 }
    note: "«негрубая анизорефлексия сухожильных и кожных рефлексов (20%)» (734_2, раздел 2.2.1)"
# критерии диагноза — анамнез, осмотр, тщательный неврологический осмотр и КТ по показаниям (734_2,
# раздел 2); критерии качества 1–2 — неврологический статус и шкала Глазго при поступлении. КТ есть
# не везде, а изменений на ней при сотрясении нет — подтверждает неврологический осмотр
confirm: [exam.neuro_exam]
# крови на КТ при сотрясении и ушибе не бывает по определению (734_2, раздел 1.1): с частью 41в она есть у
# кровоизлияний в мозг, а у этих болезней её нет, откуда бы она ни шла (spec 2026-10-chapter-3)
masks: [img.ct_blood]
redFlags: [sign.gcs_low, sym.seizure_after_injury]
treatment:
  # отказ от экранов 48 ч ускоряет регресс симптомов с 8 до 3,5 суток (734_2, раздел 3.1, УУР C, УДД 2);
  # головная боль — сначала без лекарств, затем анальгетики, кроме опиоидов (раздел 3.1.1, УУР C,
  # УДД 5): парацетамол и ибупрофен — неопиоидные анальгетики; постельный режим с исключением всей
  # стимуляции не рекомендован (раздел 3.1, УУР C, УДД 5)
  firstLine: [tx.screen_rest]
  supportive: [tx.paracetamol, tx.ibuprofen]
  notIndicated: [tx.bed_rest]
  plan: [tx.screen_rest, tx.paracetamol]
  # амбулаторно — после КТ или без показаний к ней; показана, а КТ нет — транспортировка в стационар
  # с КТ и нейрохирургией (734_2, раздел 6); при признаках госпитализации — наблюдение не менее 24
  # часов (приложение Б); без КТ — рентгенография черепа (критерий качества 4), в игре её нет
  setting:
    default: home
    param: { name: ct, map: { no: home, yes: transfer } }
    redFlag: transfer
    also:
      - when: { ct: [yes] }
        settings: [ward]
    # КТ сделана (часть 40): без патологии и тревожных признаков — «отпустить домой с инструкциями»;
    # с ними, и первый — ШКГ меньше 15, — госпитализация, наблюдение не менее 24 часов, консультация
    # нейрохирурга и повторная КТ (734_2, приложение Б), в нейрохирургию, а без неё — в травматологию
    # или неврологию (раздел 6): своя палата или перевод. Судороги сразу после травмы — показание к
    # КТ, но не к госпитализации: в списке приложения Б их нет, на исход они не влияют (раздел 1.6).
    # «Нарушения свёртываемости крови» в том списке — не «антикоагулянтная терапия» показаний к КТ:
    # при антикоагулянтах палата после КТ — не ошибка, как при любом показании к КТ (`also`)
    after:
      exams: [exam.ct_head]
      setting: home
      flags: { any: [sign.gcs_low], setting: ambulance }
texts:
  summary:
    ru: >-
      Самая лёгкая черепно-мозговая травма: после удара по голове — кратковременная потеря
      сознания или амнезия, головная боль, головокружение, тошнота и рвота, в неврологическом
      статусе — нистагм, пошатывание, негрубая разница рефлексов. От ушиба мягких тканей отличают
      расспросом и неврологическим осмотром. Нужна ли КТ, решает правило: при показаниях — КТ, а
      где её нет, перевод в больницу с КТ и нейрохирургией; без показаний — лечение дома. На КТ при
      сотрясении изменений нет: после неё — домой, а при оглушении — в стационар под наблюдение на
      сутки. Первые 48 часов — без экранов, от головной боли — обезболивающие, но не опиоиды;
      строгий постельный режим не нужен. Симптомы проходят за несколько дней.
pearls:
  - ru: "Без экранов первые двое суток: так симптомы сотрясения проходят быстрее."
  - ru: "Строгий постельный режим в тёмной тихой комнате не ускоряет, а затягивает выздоровление: после короткого покоя постепенно возвращаются к обычным делам."
  - ru: "Отпуская домой, предупредите пациента и близких: стало хуже — сразу к врачу."
simplified: "Рентгенографии черепа, эхоэнцефалографии и ушиба головного мозга в игре нет; где нет КТ, при показаниях к ней — перевод. Повторной КТ и консультации нейрохирурга после КТ нет: оглушённого после КТ кладут в палату. Из тревожных признаков приложения Б в игре — только оглушение. Персистирующей амнезии, амнезии дольше часа и признаков перелома черепа у сотрясения не бывает — в правиле их нет. Мелатонина от бессонницы, опиоидов, бензодиазепинов и противосудорожных в базе нет."
sources:
  - { kind: guideline, title: "Сотрясение головного мозга", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/734_2", note: "ID 734_2, опубликованы 15.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.1: лёгкая ЧМТ — кратковременная потеря сознания (до 30 минут) и/или амнезия (до 24 часов), сотрясение — без видимых изменений на КТ; раздел 1.3: мужчин 70–81 %, чаще молодые до 30 лет и пожилые, сотрясение к лёгкому ушибу мозга — 4:1; раздел 1.4: S06.0; раздел 1.6: утрата сознания — 70 %, амнезия — 30–50 %, головная боль — до 90 %, головокружение — 70–75 %, рвота — около 35 %, слабость — около 75 %, тахикардия — 40 %, судороги — 1–2 %, регресс симптомов — в среднем 4–5 суток; раздел 2.2.1: нистагм — 40 %, анизорефлексия — 20 %, статическая атаксия — 20 %, костных повреждений нет; раздел 2.4: факторы риска и табл. 1 (КТ); раздел 3.1: постельный режим с исключением стимуляции не рекомендован, отказ от экрана 48 ч (УУР C, УДД 2); раздел 3.1.1: анальгетики, кроме опиоидов; раздел 6: транспортировка в стационар с КТ и нейрохирургией, амбулаторно — после КТ или без показаний к ней; приложение Б: наблюдение не менее 24 часов; критерии качества 1–4" }
  - { kind: paper, title: "Macnow T, Curran T, Tolliday C, Martin K, McCarthy M, Ayturk D, Babu KM, Mannix R. Effect of Screen Time on Recovery From Concussion: A Randomized Clinical Trial. JAMA Pediatr 2021;175(11):1124–1131", url: "https://pubmed.ncbi.nlm.nih.gov/34491285/", note: "PMID 34491285, сверено 29.09.2026: 125 человек 12–25 лет с сотрясением в приёмном; медиана выздоровления с экранами — 8,0 суток, без экранов 48 часов — 3,5 суток" }
review: draft
