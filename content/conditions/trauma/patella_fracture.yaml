id: cond.patella_fracture
name: { ru: "Перелом надколенника" }
icd10: S82.0
department: dept.trauma
system: bones
kind: injury
severity: moderate
epidemiology:
  # 0,5–1,5 % повреждений опорно-двигательного аппарата (970_1, раздел 1.3); переломов среди острых
  # травм колена — 6,5 % (Stiell 1995). В игре надколенник — за все переломы колена, и их больше:
  # 13 % травм колена, чтобы в смене они встречались, — игровая оценка
  prevalence: rare
  # средний возраст — 51,3 года: мужчины 47,6, женщины 57,4 (970_1, раздел 1.3); форма — игровая
  age: { min: 18, peak: [40, 70] }
  # мужчин — 61,9 % (970_1, раздел 1.3)
  sex: { m: 1, f: 0.62 }
params:
  # около половины — без смещения, разгибательный механизм цел (970_1, раздел 1.2)
  displacement: { none: 50, displaced: 50 }
  side: { right: 1, left: 1 }
course:
  # иммобилизация — 4–8 недель (970_1, раздел 4)
  stages:
    - { id: acute, days: [0, 56] }
  presentation: [0, 1]
  # без иммобилизации — боль и смещение отломков: на какой день хуже — игровая оценка
  untreated: { band: often, days: [2, 10] }
  # в палате без операции — сутки-двое, игровая оценка: койко-дней при консервативном лечении нет
  stay: [1, 2]
# смещение — экстренная госпитализация и остеосинтез (970_1, разделы 3.2 и 6); срока операции в часах
# нет; выписка на 3–5-й день (раздел 4)
surgery: { tx: tx.patella_orif, stay: [3, 5] }
findings:
  # боль и отёк спереди колена, увеличение объёма и баллотирование надколенника, западение при
  # расхождении, невозможность активного разгибания при поперечном переломе (970_1, раздел 1.6);
  # частот нет — полосы игровые
  - f: sym.knee_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  # падение с высоты роста — 44,3 %, ДТП — 33 % (970_1, раздел 1.2)
  - { f: hx.knee_blow, band: usually }
  - f: sign.patella_tenderness
    band: { pct: 100 }
    note: "сломанный надколенник болит у каждого (970_1, раздел 1.6), на этом стоит чувствительность оттавских правил; найдёт ли болезненность врач — точность осмотра"
  - { f: sign.knee_swelling, band: usually }
  - { f: sign.knee_effusion, band: usually }
  - { f: img.xr_knee_effusion, band: usually }
  - { f: sign.knee_flexion_limited, band: usually }
  - { f: sign.no_weight_bearing, band: often }
  - { f: sym.immediate_dysfunction, band: usually }
  # без смещения разгибательный механизм цел (раздел 1.2); со смещением разгибание обычно утрачено
  - { f: sign.no_active_extension, band: usually, when: { displacement: [displaced] } }
  - { f: sign.no_active_extension, band: rarely, when: { displacement: [none] } }
  - { f: sign.patella_gap, band: often, when: { displacement: [displaced] } }
  - f: img.xr_patella_fracture
    band: { pct: 100 }
    attrs: { side: $side }
    note: "перелом есть у каждого; увидит ли его снимок — чувствительность обследования (игровая оценка)"
  - f: img.xr_patella_displaced
    band: { pct: 100 }
    when: { displacement: [displaced] }
    note: "расхождение 2 мм и больше есть у каждого со смещением; увидит ли его снимок — чувствительность обследования"
confirm: [exam.xray_knee]
treatment:
  # без смещения — гипсовая повязка или шарнирный ортез в разгибании 4–8 недель (970_1, разделы 3.1 и
  # 4); костыли: осевая нагрузка — не раньше 6 недель (раздел 4); обезболивание — НПВП и
  # парацетамол (раздел 3.3)
  firstLine: [tx.cast_splint]
  acceptable: [tx.knee_brace]
  supportive: [tx.crutches, tx.ibuprofen, tx.paracetamol, tx.rice]
  plan: [tx.cast_splint, tx.crutches, tx.ibuprofen]
  byParam:
    # остеосинтез без смещения — по социальным показаниям, чтобы сократить реабилитацию (раздел 3.2):
    # можно, но больше нужного
    - when: { displacement: [none] }
      acceptable: [tx.patella_orif]
    # смещение — операция (раздел 3.2); до неё — лонгета и обезболивание (раздел 3.1)
    - when: { displacement: [displaced] }
      supportive: [tx.cast_splint, tx.knee_brace]
  # без смещения — амбулаторно после осмотра в приёмном, прямо место не названо — игровая оценка;
  # смещение — экстренная госпитализация и операция (970_1, раздел 6)
  setting:
    default: home
    param: { name: displacement, map: { none: home, displaced: surgery } }
    redFlag: surgery
    also:
      - { when: { displacement: [none] }, settings: [ward] }
redFlags: [sign.no_active_extension]
texts:
  summary:
    ru: >-
      Перелом надколенника — после падения на колено или удара, чаще у мужчин средних лет. Болит спереди
      колена, оно быстро опухает, в суставе кровь; сгибать больно. Отломки не разошлись и колено
      разгибается — гипс в разгибании на 4–8 недель; разошлись на 2 мм и больше или разогнуть ногу
      сам человек не может — операция: отломки стягивают спицами и проволокой.
pearls:
  - ru: "Попросите поднять выпрямленную ногу: не может — разгибательный аппарат прерван, такой перелом оперируют."
  - ru: "Болит только надколенник — это признак оттавских правил: снимок нужен."
simplified: "Перелом в игре поперечный — со смещением или без; вертикальных, многооскольчатых, остеохондральных и открытых переломов, переломов плато большеберцовой кости и мыщелков бедра нет. Оперирует хирург — травматолога-ортопеда в штате нет."
sources:
  - { kind: guideline, title: "Переломы надколенника", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/970_1", note: "ID 970_1, опубликованы 25.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: около половины без смещения, разгибательный механизм цел; падение с высоты роста — 44,3 %, ДТП — 33,0 %; раздел 1.3: 0,5–1,5 % повреждений опорно-двигательного аппарата, мужчин — 61,9 %, средний возраст — 51,3 года; раздел 1.6: боль и отёк, баллотирование надколенника, западение, невозможность активного разгибания; раздел 2.4: рентгенография в двух проекциях; раздел 3.1: консервативно — стабильный без смещения или со смещением менее 2–3 мм; раздел 3.2: операция — диастаз 2 мм и более, ступенька больше 2 мм, утрата активного разгибания; раздел 4: гипс или шарнирный ортез в разгибании 4–8 недель, нагрузка — не раньше 6 недель, выписка на 3–5-й день после операции; раздел 6: смещение — экстренная госпитализация; частоты признаков не даны — полосы игровые" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 2.4: изолированная болезненность надколенника — признак оттавских правил" }
  - { kind: paper, title: "Stiell IG, Greenberg GH, Wells GA, McKnight RD, Cwinn AA, Cacciotti T, McDowell I, Smith NA. Derivation of a decision rule for the use of radiography in acute knee injuries. Ann Emerg Med 1995;26(4):405–413", url: "https://pubmed.ncbi.nlm.nih.gov/7574120/", note: "PMID 7574120, сверено 29.09.2026: 1047 взрослых с острой травмой колена, переломов — 68; пять признаков правила; чувствительность 1,0, специфичность 0,54; снимков меньше на 28 % (с 68,6 до 49,4 %)" }
review: draft
