id: cond.knee_ligament
name: { ru: "Повреждение связок коленного сустава" }
icd10: S83.5
department: dept.trauma
system: bones
kind: injury
severity: minor
epidemiology:
  # второе место среди внутрисуставных травм после менисков (691_2, раздел 1.3); доля среди
  # пришедших с травмой — игровая оценка: столько же, сколько ушибов колена
  prevalence: uncommon
  # преимущественно молодой трудоспособный возраст; 50 % разрывов ПКС — в 15–25 лет (691_2, раздел
  # 1.3); в спорте женщин к мужчинам 3 : 1, вне спорта соотношения нет — пол поровну, игровая оценка
  age: { min: 18, peak: [18, 35] }
params:
  # среди повреждений связок преобладают разрывы ПКС (691_2, раздел 1.3); числа нет — 70 к 30,
  # игровая оценка
  ligament: { acl: 70, mcl: 30 }
  side: { right: 1, left: 1 }
course:
  # ортез до 6–8 недель (691_2, раздел 4)
  stages:
    - { id: acute, days: [0, 56] }
  presentation: [0, 2]
  # без иммобилизации — боль и нестабильность: на какой день хуже — игровая оценка
  untreated: { band: sometimes, days: [3, 14] }
findings:
  # жалобы — боль, ограничение движений, припухлость, нестабильность, блокада (691_2, раздел 2);
  # частот нет — полосы игровые
  - f: sym.knee_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  - { f: sym.knee_instability, band: often, when: { ligament: [acl] } }
  - { f: sym.knee_instability, band: sometimes, when: { ligament: [mcl] } }
  # большая часть разрывов ПКС — бесконтактный механизм при фиксированной стопе; причина
  # повреждения связок — и прямой удар в область колена (691_2, раздел 1.2): у внутренней боковой,
  # которую рвёт вальгусная нагрузка, — обычно он. Полосы — игровые
  - { f: hx.knee_twist, band: usually, when: { ligament: [acl] } }
  - { f: hx.knee_twist, band: sometimes, when: { ligament: [mcl] } }
  - { f: hx.knee_blow, band: sometimes, when: { ligament: [acl] } }
  - { f: hx.knee_blow, band: usually, when: { ligament: [mcl] } }
  - { f: sign.knee_swelling, band: usually }
  # гемартроз или выпот (691_2, раздел 1.6): внутрисуставная ПКС кровит в сустав, внутренняя боковая —
  # снаружи капсулы, выпот реже — игровая оценка
  - { f: sign.knee_effusion, band: usually, when: { ligament: [acl] } }
  - { f: sign.knee_effusion, band: sometimes, when: { ligament: [mcl] } }
  - { f: sign.lachman_positive, band: always, when: { ligament: [acl] } }
  - { f: sign.valgus_laxity, band: always, when: { ligament: [mcl] } }
  # признаки оттавских правил — резкое ограничение движений (раздел 1.6), игровая оценка
  - { f: sign.knee_flexion_limited, band: often }
  - { f: sign.no_weight_bearing, band: sometimes }
  - { f: sym.immediate_dysfunction, band: sometimes }
# диагноз — по жалобам, механизму и тестам (691_2, раздел 2); МРТ в районной больнице нет
confirm: [exam.knee_ligament_tests]
treatment:
  # консервативно: ограничение нагрузок и разгрузка костылями, НПВП, ортез до 6–8 недель; тутор или
  # гипсовая лонгета — тоже (691_2, разделы 3.1 и 4); полный разрыв — гипс или функциональная повязка
  # 4–6 недель (832_2, раздел 3.1). Операция — плановая, при хронической нестабильности (691_2,
  # раздел 3.2): в приёмном её нет
  firstLine: [tx.knee_brace]
  acceptable: [tx.cast_splint]
  supportive: [tx.crutches, tx.rice, tx.ibuprofen, tx.paracetamol]
  notIndicated: [tx.steroid_systemic_short]
  plan: [tx.knee_brace, tx.crutches, tx.ibuprofen]
  # амбулаторно; в стационар — для операции или при неэффективности консервативного лечения (691_2,
  # раздел 6)
  setting: { default: home }
texts:
  summary:
    ru: >-
      Надрыв или разрыв связок колена — чаще передней крестообразной, когда колено подворачивается при
      стоящей на месте стопе, реже внутренней боковой. Боль, быстро нарастающий отёк, кровь в суставе,
      колено подкашивается. Разрыв показывают тест Лахмана и вальгус-тест; снимок связки не видит. В
      приёмном — ортез, костыли и НПВП, потом МРТ и решение об операции у травматолога-ортопеда.
pearls:
  - ru: "Хруст при повороте, быстро опухшее колено и кровь в суставе после травмы без удара — думайте о передней крестообразной связке."
  - ru: "Тест Лахмана сравнивают со здоровой ногой: у кого связки от природы мягкие, голень смещается и там."
simplified: "Связки в игре две — передняя крестообразная и внутренняя боковая; повреждений задней крестообразной и наружной боковой, менисков, МРТ и плановой пластики связок нет. Выпот на снимке в игре виден только при переломе надколенника; на деле его видно и при крови в суставе от разрыва связки, но ставят этот диагноз не по снимку."
sources:
  - { kind: guideline, title: "Повреждение связок коленного сустава", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/691_2", note: "ID 691_2, опубликованы 20.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: большая часть повреждений ПКС — бесконтактный механизм; раздел 1.3: второе место после менисков, преобладают разрывы ПКС, 50 % — в 15–25 лет; раздел 1.6: боль, гемартроз или выпот, нестабильность; раздел 2.2: тесты Лахмана, выдвижных ящиков, варус и вальгус; раздел 3.1: консервативное лечение — разгрузка костылями, НПВП, ЛФК; раздел 3.2: операция — при хронической нестабильности; раздел 4: ортез до 6–8 недель; раздел 6: госпитализация — для операции или при неэффективности консервативного лечения; критерий качества 3: НПВП или анальгетики; частоты признаков не даны — полосы игровые" }
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 3.1: полный разрыв связок с нестабильностью при варус- и вальгус-тесте — гипс или функциональная повязка 4–6 недель" }
review: draft
