id: cond.hip_contusion
name: { ru: "Ушиб области тазобедренного сустава" }
icd10: S70.0
department: dept.trauma
system: bones
kind: injury
severity: minor
epidemiology:
  # доля среди пришедших с травмой — игровая оценка: столько же, сколько переломов шейки бедра;
  # возраст — как у них: пара для различения
  prevalence: uncommon
  age: { min: 60, peak: [70, 90] }
params:
  # сторона — поровну, игровая оценка
  side: { right: 1, left: 1 }
course:
  # восстановление при лёгком ушибе — 1–3 недели (832_2, прил. В)
  stages:
    - { id: acute, days: [0, 21] }
  presentation: [0, 2]
  selfLimiting: true
findings:
  # боль, припухлость, кровоподтёк, ограничение функции (832_2, раздел 1.6); при ушибе движения
  # вначале сохранены; частот нет — полосы игровые
  - f: sym.hip_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  - { f: sign.hip_tenderness, band: usually }
  - { f: sign.straight_leg_raise, band: rarely }
  - { f: sign.no_weight_bearing, band: rarely }
  - { f: sym.immediate_dysfunction, band: rarely }
confirm: clinical
treatment:
  # покой 3–5 дней, холод, компрессия; обезболивание — НПВП и анальгетики; системные
  # кортикостероиды не рекомендованы (832_2, раздел 3.1)
  firstLine: [tx.rice]
  supportive: [tx.paracetamol, tx.ibuprofen]
  notIndicated: [tx.steroid_systemic_short, tx.hip_block]
  plan: [tx.rice, tx.paracetamol]
  setting: { default: home }
texts:
  summary:
    ru: >-
      Ушиб мягких тканей у тазобедренного сустава после падения на бок. Боль и кровоподтёк над
      вертелом, но выпрямленную ногу человек поднимает и ходит, хромая. Перелом шейки бедра
      исключают осмотром и снимком. Лечат покоем и холодом; проходит за 1–3 недели.
pearls:
  - ru: "Ходит и поднимает выпрямленную ногу — скорее ушиб; но у пожилого после падения снимок таза и сустава всё равно нужен."
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.4: S70.0 — ушиб области тазобедренного сустава; раздел 1.6: клиника ушиба, движения вначале сохранены; раздел 3.1: покой, холод, компрессия, НПВП и анальгетики, кортикостероиды не рекомендованы; прил. В: восстановление при лёгких ушибах — 1–3 недели; частоты признаков не даны — полосы игровые" }
review: draft
