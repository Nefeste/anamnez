id: cond.hand_wound
name: { ru: "Открытая рана кисти" }
icd10: S61.9
department: dept.trauma
system: skin
kind: injury
severity: minor
epidemiology:
  # раны запястья и кисти — у каждого пятого из 8,8 тыс. пациентов центра хирургии кисти (688_2,
  # раздел 1.3); доля среди пришедших в приёмное с травмой — игровая оценка: частая травма
  prevalence: common
  # молодые травмируются чаще пожилых (688_2, раздел 1.3); форма — игровая оценка
  age: { min: 18, peak: [18, 45] }
  # чаще мужчины (раздел 1.3); доли нет — игровая оценка
  sex: { m: 1, f: 0.5 }
params:
  # чаще всего — механизмы на производстве, режущие и колющие предметы; укушенная рана — свой вид
  # (688_2, разделы 1.2 и 1.5); долей нет — игровая оценка
  cause: { cut: 80, bite: 20 }
  # меньше суток — шов, от суток — обработка без шва (раздел 3.2); доля поздних — игровая оценка
  delay: { fresh: 85, late: 15 }
  # повязка не сводит края — шов (раздел 3.2); доля — игровая оценка
  edges: { apart: 70, together: 30 }
  # сухожилие перерезано — сложная рана, вне 688_2 (разделы 1.1, 1.5), экстренно в стационар (раздел
  # 6); доля — игровая оценка
  tendon: { intact: 90, cut: 10 }
  # столбняк (856_1, приложение А3.1): полный курс не больше 5 лет назад — ничего; больше 5 лет —
  # анатоксин; записей нет — анатоксин и иммуноглобулин; доли — игровая оценка
  tetanus: { current: 20, overdue: 50, none: 30 }
course:
  # швы снимают на 14-е сутки (688_2, приложение В)
  stages:
    - { id: acute, days: [0, 14] }
  presentation: [0, 1]
  # без обработки рана нагнаивается: частоты в 688_2 нет — игровая оценка
  untreated: { band: often, days: [2, 5] }
findings:
  - f: sym.hand_wound
    band: { pct: 100 }
    note: "с этой жалобой приходят все: без неё раны нет — жалоба травмы, а не признак с частотой"
  - f: sym.animal_bite
    band: { pct: 100 }
    when: { cause: [bite] }
    note: "укус видно по ране и слышно от пациента — у каждого укушенного"
  - f: hx.wound_late
    band: { pct: 100 }
    when: { delay: [late] }
    note: "давность раны пациент знает; услышит ли её врач — точность расспроса"
  - f: sign.wound_gaping
    band: { pct: 100 }
    when: { edges: [apart] }
    note: "края расходятся у каждого с такой раной; увидит ли врач — точность осмотра"
  - f: sign.finger_flexion_loss
    band: { pct: 100 }
    when: { tendon: [cut] }
    note: "с перерезанным сухожилием палец не сгибается у каждого; найдёт ли это врач — точность проверки"
  - f: hx.tetanus_records
    band: { pct: 100 }
    when: { tetanus: [current, overdue] }
    note: "записи о прививках есть у каждого привитого по документам"
  - f: hx.tetanus_recent
    band: { pct: 100 }
    when: { tetanus: [current] }
    note: "последняя прививка меньше 5 лет назад — у каждого, кому профилактика не нужна"
confirm: [exam.wound_exam]
treatment:
  # свежая неукушенная неинфицированная рана, края под повязкой не сходятся — первичный шов (688_2,
  # раздел 3.2, УУР C, УДД 5); повязка — всем (раздел 3.1, критерий 4); обезболивание — N02B (раздел 3.3)
  firstLine: [tx.wound_suture]
  acceptable: [tx.wound_open]
  supportive: [tx.wound_dressing, tx.paracetamol, tx.ibuprofen]
  plan: [tx.wound_suture, tx.paracetamol]
  byParam:
    # перерезанное сухожилие — экстренно в стационар (688_2, раздел 6), в игре перевод к кистевому
    # хирургу: в приёмном — повязка, кожу над сухожилием не зашивают (запись первой: её роли главнее)
    - when: { tendon: [cut] }
      firstLine: [tx.wound_dressing]
      notIndicated: [tx.wound_suture]
      plan: [tx.wound_dressing, tx.paracetamol]
    # укус — первичная хирургическая обработка (раздел 3.2); швы при риске бешенства не рекомендуются
    # (979_1, раздел 5.2); любые укусы кисти и пальцев — категория 3: иммуноглобулин и вакцина сразу
    # (979_1, приложение А3); антибиотик при укусе млекопитающего — J01CR (688_2, раздел 3.1.1)
    - when: { cause: [bite] }
      firstLine: [tx.wound_open]
      harmful: [tx.wound_suture]
      plan: [tx.wound_open, tx.paracetamol]
      prevent: [tx.rabies_vaccine, tx.rabies_ig, tx.amoxicillin_clavulanate]
    # неукушенная рана давностью сутки и более — обработка вместо первичного шва (раздел 3.2)
    - when: { cause: [cut], delay: [late] }
      firstLine: [tx.wound_open]
      notIndicated: [tx.wound_suture]
      plan: [tx.wound_open, tx.paracetamol]
    # свежая, края сходятся — повязки хватит: шов — если она не сводит края (раздел 3.2)
    - when: { cause: [cut], delay: [fresh], edges: [together] }
      firstLine: [tx.wound_dressing]
      acceptable: [tx.wound_suture]
      plan: [tx.wound_dressing, tx.paracetamol]
    # столбняк (856_1, приложение А3.1; СанПиН 3.3686-21, п. 4159–4160): больше 5 лет — экстренная
    # ревакцинация анатоксином; записей нет — анатоксин и иммуноглобулин
    - when: { tetanus: [overdue] }
      prevent: [tx.tetanus_toxoid]
    - when: { tetanus: [none] }
      prevent: [tx.tetanus_toxoid, tx.tetanus_ig]
  # простую рану лечат амбулаторно (688_2, разделы 3.2 и 6, приложение В); глубокая рана с повреждением
  # сухожилий — экстренная госпитализация (раздел 6): кистевой хирургии в районной больнице нет — перевод
  setting:
    default: home
    param: { name: tendon, map: { intact: home, cut: transfer } }
texts:
  summary:
    ru: >-
      Резаная, колотая или укушенная рана кисти или пальца — одна из самых частых травм. Свежую чистую
      рану, края которой не сходятся, в первые сутки зашивают, небольшой хватает повязки; укушенную и
      рану старше суток обрабатывают и сразу не зашивают. Всегда проверяют движения пальцев: перерезанное
      сухожилие шьёт кистевой хирург. При ране — профилактика столбняка по записям о прививках, после
      укуса — вакцина от бешенства с иммуноглобулином и антибиотик.
pearls:
  - ru: "Перед швом попросите согнуть и разогнуть каждый палец: перерезанное сухожилие под зашитой кожей — упущенная функция руки."
  - ru: "Укушенную рану не зашивают: сначала обработка и профилактика бешенства, шов — позже, когда рана очистится."
  - ru: "О прививках от столбняка спрашивают при любой ране: больше 5 лет — анатоксин, записей нет — анатоксин и иммуноглобулин."
simplified: "Рана в игре — резаная или укус собаки. Инородных тел, рентгена кисти, повреждений ногтевого ложа, загрязнения землёй и водой, нагноения и сложных ран с пересадкой кожи нет. Наблюдения за укусившим животным нет: курс прививок от бешенства всегда полный."
sources:
  - { kind: guideline, title: "Открытая рана запястья и кисти", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/688_2", note: "ID 688_2, опубликованы 18.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.3: раны кисти — у каждого пятого пациента центра хирургии кисти, чаще мужчины и молодые; раздел 1.6: жалобы — рана, боль, кровотечение; раздел 3.1: повязка всем; раздел 3.2: шов — неукушенной ране моложе суток, иначе и при укусе — первичная хирургическая обработка; раздел 3.1.1: антибиотики при укусах млекопитающих — J01CR; раздел 5: анатоксин столбнячный, вакцина от бешенства после укуса; раздел 6: глубокая рана с повреждением сухожилий — экстренная госпитализация; приложение В: швы снимают на 14-е сутки; частоты признаков и доли видов ран не даны — игровые" }
  - { kind: guideline, title: "Бешенство (гидрофобия) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/979_1", note: "ID 979_1, опубликованы 09.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 5.2 (УУР C, УДД 5): швы при риске бешенства не накладывают; приложение А3: любые укусы кисти и пальцев — категория 3, иммуноглобулин и вакцина сразу" }
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; приложение А3.1: схема выбора средств экстренной профилактики столбняка" }
  - { kind: review, title: "Griffin M, Hindocha S, Jordan D, Saleh M, Khan W. An overview of the management of flexor tendon injuries. Open Orthop J 2012;6:28–35", url: "https://pubmed.ncbi.nlm.nih.gov/22431948/", note: "PMID 22431948, PMC3293389, сверено 29.09.2026: сгибатели проверяют по отдельности; первичный шов сухожилия даёт лучший результат, чем отсроченный" }
review: draft
