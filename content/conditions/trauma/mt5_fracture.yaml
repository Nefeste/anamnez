id: cond.mt5_fracture
name: { ru: "Перелом основания пятой плюсневой кости" }
icd10: S92.3
department: dept.trauma
system: bones
kind: injury
severity: minor
epidemiology:
  # переломы стопы — около 20 % всех переломов, чаще всего ломается пятая плюсневая (856_1, раздел
  # 1.3); доля среди пришедших с травмой — игровая оценка: втрое меньше ушибов стопы и не больше,
  # чем переломов лучевой кости и лодыжек
  prevalence: rare
  # средний возраст — 42 года, среди пожилых больше женщин (Petrisor 2006); оттавские правила — у
  # взрослых (832_2, раздел 2.4); распределение по возрасту и полу — игровая оценка
  age: { min: 18, peak: [25, 60] }
params:
  # без операции лечили 94,4 % из 834 переломов основания пятой плюсневой (Pettersen 2022) —
  # значительное смещение, которое оперируют, — 6 %; зоны 1–3 (61,2 / 18,8 / 20,0 %) тактику по
  # 856_1 не меняют — в игре их нет
  displacement: { none: 94, displaced: 6 }
  # сторона — поровну, игровая оценка
  side: { right: 1, left: 1 }
course:
  # иммобилизация — 4–6 недель (856_1, раздел 3.1); сращение — в среднем 7,5–9,2 недели (Pettersen 2022)
  stages:
    - { id: acute, days: [0, 42] }
  presentation: [0, 2]
  # без разгрузки стопы — боль и хромота дольше: на какой день хуже — игровая оценка
  untreated: { band: sometimes, days: [3, 14] }
  stay: [1, 2]
# значительное смещение — операция, при её плане — госпитализация (856_1, разделы 3.2 и 6); срока
# операции в часах нет; стационар после операции — 1–2 суток, игровая оценка
surgery: { tx: tx.mt5_fixation, stay: [1, 2] }
findings:
  # при подвороте стопы (супинации) — отрывной перелом основания пятой плюсневой (856_1, раздел 1.2);
  # боль при попытке наступить, гематома и отёк, болезненность в месте перелома (раздел 1.6);
  # частот нет — полосы игровые
  - f: sym.foot_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  - { f: sign.mt5_tenderness, band: always }
  - { f: sign.foot_swelling, band: usually }
  - { f: sign.no_weight_bearing, band: sometimes }
  - { f: sym.immediate_dysfunction, band: sometimes }
  - f: img.xr_mt5_fracture
    band: { pct: 100 }
    attrs: { side: $side }
    note: "перелом есть у каждого; увидит ли его снимок — чувствительность обследования (игровая оценка)"
  - f: img.xr_mt5_displaced
    band: { pct: 100 }
    when: { displacement: [displaced] }
    note: "значительное смещение есть у каждого со смещённым переломом; увидит ли его снимок — чувствительность обследования"
confirm: [exam.xray_foot]
treatment:
  # без смещения и с допустимым — обувь с жёсткой подошвой, ортопедическая обувь или гипс 4–6
  # недель (856_1, раздел 3.1); обезболивание — НПВП, парацетамол (раздел 3.3.2)
  firstLine: [tx.rigid_shoe]
  acceptable: [tx.cast_splint]
  supportive: [tx.ibuprofen, tx.paracetamol]
  plan: [tx.rigid_shoe, tx.ibuprofen]
  byParam:
    # операция при переломе без значительного смещения — больше нужного
    - when: { displacement: [none] }
      acceptable: [tx.mt5_fixation]
    # значительное смещение — операция (856_1, раздел 3.2); до неё обувь и гипс только облегчают
    - when: { displacement: [displaced] }
      supportive: [tx.rigid_shoe, tx.cast_splint]
  # консервативно — амбулаторно: показаний к госпитализации (856_1, раздел 6) нет; значительное
  # смещение — операция
  setting:
    default: home
    param: { name: displacement, map: { none: home, displaced: surgery } }
texts:
  summary:
    ru: >-
      Перелом основания пятой плюсневой кости — по наружному краю стопы, чаще всего отрыв
      бугристости, когда подвернулась стопа. Боль при опоре, отёк, болезненна кость у основания
      плюсневой; нужен ли снимок стопы, подсказывают оттавские правила. Без смещения — обувь с
      жёсткой подошвой или гипс на 4–6 недель, со значительным смещением — операция.
pearls:
  - ru: "Подвернул ногу, а болит не голеностоп, а наружный край стопы, — прощупайте основание пятой плюсневой: это частый перелом."
  - ru: "Почти все такие переломы срастаются без операции; оперируют значительное смещение."
simplified: "Зон основания пятой плюсневой — отрыв бугристости, перелом Джонса, стрессовый — в игре нет: по 856_1 лечат их одинаково. Переломов других плюсневых костей, пальцев и предплюсны нет."
sources:
  - { kind: guideline, title: "Переломы костей стопы (кроме переломов пяточной кости)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/856_1", note: "ID 856_1, опубликованы 19.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: супинационная травма — отрывной перелом основания пятой плюсневой кости; раздел 1.3: переломы стопы — около 20 % всех переломов, чаще других — пятая плюсневая; раздел 1.6: клиника; раздел 2.4: снимок стопы в двух проекциях, оттавские правила; раздел 3.1: консервативно без смещения и с допустимым — обувь с жёсткой подошвой, ортопедическая обувь или гипс 4–6 недель; раздел 3.2: при значительном смещении — операция; раздел 6: госпитализация при выраженной боли и отёке, угрозе мягким тканям, для операции; частоты признаков не даны — полосы игровые" }
  - { kind: paper, title: "Pettersen PM, Radojicic N, Grün W, Andresen TKM, Molund M. Proximal Fifth Metatarsal Fractures: A Retrospective Study of 834 Fractures With a Minimum Follow-up of 5 Years. Foot Ankle Int 2022;43(5):602–608", url: "https://pubmed.ncbi.nlm.nih.gov/35125016/", note: "PMID 35125016, сверено 29.09.2026: 834 перелома; зона 1 — 61,2 %, зона 2 — 18,8 %, зона 3 — 20,0 %; без операции — 94,4 %; сращение — 7,5, 7,7 и 9,2 недели по зонам" }
  - { kind: paper, title: "Petrisor BA, Ekrol I, Court-Brown C. The epidemiology of metatarsal fractures. Foot Ankle Int 2006;27(3):172–174", url: "https://pubmed.ncbi.nlm.nih.gov/16539897/", note: "PMID 16539897, сверено 29.09.2026: 411 переломов плюсневых костей у 355 больных за год; средний возраст — 42 года; чаще всего — пятая плюсневая; среди пожилых больше женщин" }
review: draft
