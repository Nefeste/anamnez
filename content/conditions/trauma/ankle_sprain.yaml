id: cond.ankle_sprain
name: { ru: "Растяжение связок голеностопного сустава" }
icd10: S93.4
department: dept.trauma
system: bones
kind: injury
severity: minor
epidemiology:
  # среди острых травм голеностопа переломы — 11,7 %, остальное — в основном связки (Stiell 1993);
  # в игре растяжений к переломам 3 : 1 — переломов больше: при 10 : 1 уверенность в растяжении
  # уже по жалобе выше порога разумного врача, и он не осматривает; игровая оценка
  prevalence: common
  # оттавские правила проверены у взрослых (832_2, раздел 2.4); возраст и пол — игровая оценка
  age: { min: 18 }
params:
  # сторона — поровну, игровая оценка
  side: { right: 1, left: 1 }
course:
  stages:
    - { id: acute, days: [0, 21] }
  presentation: [0, 2]
  selfLimiting: true
findings:
  # боль, припухлость, кровоподтёк, нарушение функции (832_2, раздел 1.6); частот нет — полосы игровые
  - f: sym.ankle_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  # при ушибе и растяжении движения вначале сохранены (832_2, раздел 1.6)
  - { f: sym.immediate_dysfunction, band: sometimes }
  - { f: sign.ankle_swelling, band: usually }
  # болезненность книзу и кпереди от наружной лодыжки — признак повреждения наружных связок (832_2,
  # раздел 1.6)
  - { f: sign.lateral_ligament_tenderness, band: usually }
  # признаки оттавских правил бывают и без перелома: специфичность умеренная, правила сокращают
  # снимки на 30–40 % (Bachmann 2003) — доли подобраны под это, игровая оценка
  - { f: sign.malleolus_tenderness, band: often }
  - { f: sign.no_weight_bearing, band: sometimes }
confirm: clinical
treatment:
  # покой 3–5 дней, холод, эластичная компрессия, возвышенное положение; обезболивание — НПВП и
  # парацетамол; системные кортикостероиды не рекомендованы (832_2, раздел 3.1); иммобилизация —
  # при нестабильности, полном разрыве связок (раздел 3.1)
  firstLine: [tx.rice]
  acceptable: [tx.cast_splint]
  supportive: [tx.ibuprofen, tx.paracetamol]
  notIndicated: [tx.steroid_systemic_short]
  plan: [tx.rice, tx.ibuprofen]
  # амбулаторно (832_2, раздел 1.3); операции на связках голеностопа взрослым не рекомендованы
  # (раздел 3.2)
  setting: { default: home }
texts:
  summary:
    ru: >-
      Надрыв наружных связок голеностопа, когда подворачивается стопа. Боль и отёк под наружной
      лодыжкой, кровоподтёк; наступать больно, но можно. Нужен ли снимок, решают оттавские
      правила. Лечат покоем, холодом и эластичным бинтом, обезболивают НПВП; проходит за 1–3
      недели.
pearls:
  - ru: "Боль под наружной лодыжкой, а кость у лодыжки не болит и человек проходит четыре шага — это связки, снимок не нужен."
  - ru: "Без снимка — совет прийти через 5–7 дней, если боль и хромота не проходят."
simplified: "Растяжение в игре одно — без разделения на степени; полных разрывов с нестабильностью сустава нет."
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.6: клиника, болезненность книзу и кпереди от наружной лодыжки; раздел 2.4: оттавские правила, совет прийти через 5–7 дней; раздел 3.1: покой, холод, компрессия, возвышенное положение, НПВП и анальгетики, кортикостероиды не рекомендованы; раздел 3.2: операция на связках голеностопа не рекомендована; частоты признаков не даны — полосы игровые" }
  - { kind: paper, title: "Stiell IG, Greenberg GH, McKnight RD, Nair RC, McDowell I, Reardon M, Stewart JP, Maloney J. Decision rules for the use of radiography in acute ankle injuries. Refinement and prospective validation. JAMA 1993;269(9):1127–1132", url: "https://pubmed.ncbi.nlm.nih.gov/8433468/", note: "PMID 8433468, сверено 29.09.2026: 1032 взрослых с острой травмой голеностопа, переломов в зоне лодыжек — 11,7 %" }
  - { kind: review, title: "Bachmann LM, Kolb E, Koller MT, Steurer J, ter Riet G. Accuracy of Ottawa ankle rules to exclude fractures of the ankle and mid-foot: systematic review. BMJ 2003;326(7386):417", url: "https://pubmed.ncbi.nlm.nih.gov/12595378/", note: "PMID 12595378, сверено 29.09.2026: 27 исследований, 15 581 больной; отношение правдоподобия отрицательного результата — 0,08; чувствительность почти 100 %, специфичность умеренная; снимков меньше на 30–40 %" }
review: draft
