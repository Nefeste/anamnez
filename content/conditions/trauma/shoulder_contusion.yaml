id: cond.shoulder_contusion
name: { ru: "Ушиб плечевого пояса" }
icd10: S40.0
department: dept.trauma
system: bones
kind: injury
severity: minor
epidemiology:
  # доля среди пришедших с травмой — игровая оценка: столько же, сколько переломов ключицы
  prevalence: uncommon
  age: { min: 18 }
params:
  # сторона — поровну, игровая оценка
  side: { right: 1, left: 1 }
course:
  # восстановление при лёгком ушибе — 1–3 недели (832_2, прил. В)
  stages:
    - { id: acute, days: [0, 21] }
  presentation: [0, 2]
  selfLimiting: true
findings:
  # боль, припухлость, кровоподтёк, ограничение функции (832_2, раздел 1.6); частот нет — полосы игровые
  - f: sym.shoulder_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с этой жалобой приходят все: без неё травмы нет — жалоба травмы, а не признак с частотой"
  - { f: sign.shoulder_motion_pain, band: often }
  - { f: sign.clavicle_tenderness, band: sometimes }
  - { f: sym.immediate_dysfunction, band: rarely }
confirm: clinical
treatment:
  # покой 3–5 дней, холод, компрессия; обезболивание — НПВП и анальгетики; системные
  # кортикостероиды не рекомендованы (832_2, раздел 3.1); короткая иммобилизация — 3–5 дней (раздел 4)
  firstLine: [tx.rice]
  acceptable: [tx.arm_sling]
  supportive: [tx.ibuprofen, tx.paracetamol]
  notIndicated: [tx.steroid_systemic_short]
  plan: [tx.rice, tx.ibuprofen]
  setting: { default: home }
texts:
  summary:
    ru: >-
      Ушиб мягких тканей плеча и надплечья после падения на плечо. Боль и кровоподтёк, рукой двигать
      больно, но ключица ровная и отломки под пальцами не смещаются. Перелом исключают осмотром и
      снимком. Лечат покоем и холодом; проходит за 1–3 недели.
pearls:
  - ru: "Ключица ровная по всей длине и без боли при ощупывании — перелом маловероятен; сомнение решает снимок."
sources:
  - { kind: guideline, title: "Закрытые повреждения мягких тканей конечностей", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/832_2", note: "ID 832_2, опубликованы 13.01.2026, применяются; сверено с рубрикатором 29.09.2026; раздел 1.4: S40.0 — ушиб плечевого пояса и плеча; раздел 1.6: клиника ушиба; раздел 3.1: покой, холод, компрессия, НПВП и анальгетики, кортикостероиды не рекомендованы; раздел 4: иммобилизация при ушибе — 3–5 дней; прил. В: восстановление при лёгких ушибах — 1–3 недели; частоты признаков не даны — полосы игровые" }
review: draft
