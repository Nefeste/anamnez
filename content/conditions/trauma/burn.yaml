id: cond.burn
name: { ru: "Термический ожог" }
# рука — T22, нога — T24, степень — последний знак; одна запись на обе — T30.0, ожог неуточнённой
# локализации (687_3: коды T20–T25, T29–T31)
icd10: T30.0
department: dept.trauma
system: skin
kind: injury
severity: moderate
epidemiology:
  # ожоги — 1,6 % травм, отравлений и других последствий внешних причин (687_3, раздел 1.3, Росстат
  # 2022); в игре — около 4 % пришедших с травмой, чтобы ожог встречался в смене: игровая оценка
  prevalence: uncommon
  # чаще всего — дети до 5 лет, затем взрослые 21–50 лет, мужчины чаще женщин (687_3, раздел 1.3);
  # в игре — взрослые, доля мужчин — игровая оценка
  age: { min: 18, peak: [21, 50] }
  sex: { m: 1, f: 0.7 }
params:
  # поверхностные ожоги в 80 % небольшие, в 70 % их лечат амбулаторно; около 30 % обожжённых лечатся
  # в ожоговом стационаре, из них 60–80 % — с поверхностными ожогами (687_3, раздел 1.3): небольшой
  # поверхностный, обширный поверхностный и глубокий — 70 : 20 : 10, игровая оценка по этим числам
  form: { minor: 70, extensive: 20, deep: 10 }
  # рука или нога — игровая оценка; особых зон (лицо, кисть, стопа, промежность) в игре нет
  site: { arm: 60, leg: 40 }
  # экстренная профилактика столбняка — всем с ожогом кожи, кроме одной гиперемии (687_3, раздел
  # 3.1.17); по записям о прививках — как при ране (856_1, приложение А3.1); доли — игровая оценка
  tetanus: { current: 20, overdue: 50, none: 30 }
course:
  # I степень с пузырями заживает до 10 дней, II — за 18–20 дней (687_3, раздел 1.5)
  stages:
    - { id: acute, days: [0, 20] }
  presentation: [0, 1]
  # без туалета раны и повязки ожог нагнаивается: частоты в 687_3 нет — игровая оценка
  untreated: { band: often, days: [2, 5] }
findings:
  - f: sym.burn
    band: { pct: 100 }
    attrs: { site: $site }
    note: "с этой жалобой приходят все: без неё ожога нет — жалоба травмы, а не признак с частотой"
  # I степень — тонкостенные пузыри с прозрачной жидкостью, II — толстостенные пузыри или отслоившийся
  # эпидермис, III — остатки пузырей с кровянистым содержимым (687_3, раздел 2.2); частот нет — полосы
  # игровые
  - { f: sign.burn_blisters, band: usually, when: { form: [minor, extensive] } }
  - { f: sign.burn_blisters, band: sometimes, when: { form: [deep] } }
  # III — толстый струп; тонкий светлый струп бывает и при II от агента с высокой температурой
  # (раздел 2.2); полосы у II — игровые
  - f: sign.burn_eschar
    band: { pct: 100 }
    when: { form: [deep] }
    note: "струп — омертвевшая кожа: он есть у каждого глубокого ожога; увидит ли его врач — точность осмотра"
  - { f: sign.burn_eschar, band: sometimes, when: { form: [extensive] } }
  - { f: sign.burn_eschar, band: rarely, when: { form: [minor] } }
  # III — болевой чувствительности и сосудистой реакции нет, волоски удаляются легко (раздел 2.2)
  - f: sign.burn_insensate
    band: { pct: 100 }
    when: { form: [deep] }
    note: "при III степени нервные окончания кожи погибли у каждого; найдут ли это пробы — их точность"
  # площадь — правилом ладони: ладонь больного — около 1 % поверхности тела (раздел 2.2)
  - f: sign.burn_large
    band: { pct: 100 }
    when: { form: [extensive] }
    note: "обширный ожог в игре — больше 15 % поверхности тела у каждого; оценит ли площадь врач — точность осмотра"
  # ожоговый шок — при площади больше 15–20 % (раздел 1.5); признаки видны через 6–8 ч, в первые часы
  # их может не быть (раздел 2.2): тахикардия — «иногда», игровая оценка
  - { f: vital.tachycardia, band: sometimes, when: { form: [extensive] } }
  - f: hx.tetanus_records
    band: { pct: 100 }
    when: { tetanus: [current, overdue] }
    note: "записи о прививках есть у каждого привитого по документам"
  - f: hx.tetanus_recent
    band: { pct: 100 }
    when: { tetanus: [current] }
    note: "последняя прививка меньше 5 лет назад — у каждого, кому профилактика не нужна"
confirm: [exam.burn_exam]
treatment:
  # туалет ожоговой раны и лечебная повязка — критерии качества 2 и 3 первичной помощи; I–II степень —
  # атравматичные повязки или повязки с влажной средой (687_3, раздел 3.2.2); обезболивание при ВАШ
  # больше 3 — «другие анальгетики и антипиретики» или НПВП (раздел 3.1.2, критерий качества 1);
  # при площади меньше 15 % — пить (раздел 3.1.4); системные антибиотики для профилактики не
  # рекомендованы (раздел 3.1.12)
  firstLine: [tx.burn_dressing]
  supportive: [tx.paracetamol, tx.ibuprofen, tx.ors]
  notIndicated: [tx.amoxicillin_clavulanate, tx.amoxicillin, tx.cephalosporin_oral]
  plan: [tx.burn_dressing, tx.ibuprofen]
  byParam:
    # больше 15 % — внутривенная инфузия (раздел 3.1.4, УУР C, УДД 5), её начинают до перевода в
    # ожоговое отделение (раздел 6, п. 11 и 18); повязка — лечебная или сухая стерильная (раздел 3.2.1)
    - when: { form: [extensive] }
      firstLine: [tx.iv_fluids]
      supportive: [tx.burn_dressing, tx.wound_dressing]
      plan: [tx.iv_fluids, tx.burn_dressing, tx.paracetamol]
      preHospital: [tx.iv_fluids]
    # III степень любой площади — ожоговое отделение: некрэктомия и пластика только там (раздел 6,
    # п. 11; раздел 3.3.2); до перевода — повязка и обезболивание
    - when: { form: [deep] }
      supportive: [tx.wound_dressing]
      plan: [tx.burn_dressing, tx.paracetamol]
      preHospital: [tx.burn_dressing, tx.wound_dressing]
    - when: { tetanus: [overdue] }
      prevent: [tx.tetanus_toxoid]
    - when: { tetanus: [none] }
      prevent: [tx.tetanus_toxoid, tx.tetanus_ig]
  # I–II степень до 10 % — амбулаторно (687_3, раздел 6, п. 7); от 10 % и III любой площади — ожоговое
  # отделение или центр (п. 11), перевод не позже 72 ч после травмы (п. 18): в районной больнице
  # ожогового отделения нет
  setting:
    default: home
    param: { name: form, map: { minor: home, extensive: transfer, deep: transfer } }
texts:
  summary:
    ru: >-
      Ожог кипятком, паром, пламенем или горячим предметом. Решают площадь и глубина. Площадь считают
      ладонями больного — ладонь около 1 % поверхности тела, глубину — по пузырям, струпу и пробам на
      чувствительность. Поверхностный ожог меньше 10 % лечат дома: туалет раны, повязка,
      обезболивание. Обширный ожог и глубокий любой площади лечат в ожоговом центре; при площади
      больше 15 % капельницу ставят ещё до перевода. Прививку от столбняка делают по записям, как при
      ране.
pearls:
  - ru: "Площадь считают ладонями самого больного: ладонь — около 1 %. Покраснение без пузырей в площадь не входит."
  - ru: "Струп бывает и при ожоге II степени. Глубокий ожог не чувствует укола иглой, а волоски из него выдёргиваются легко."
  - ru: "Антибиотик «на всякий случай» при ожоге не назначают: от инфекции защищают туалет раны и повязка."
simplified: "Ожог в игре — термический, на руке или ноге, у взрослого, и всегда с пузырями или глубже. Ожогов дыхательных путей, лица, кистей и стоп, химических, электрических и солнечных, детей и операций в ожоговом центре нет. Площадь от 10 до 15 % и больше 30 % в игре не встречается, глубокий ожог — небольшой."
sources:
  - { kind: guideline, title: "Ожоги термические и химические. Ожоги солнечные. Ожоги дыхательных путей", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/687_3", note: "ID 687_3, опубликованы 31.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.3: ожоги — 1,6 % травм (Росстат 2022), поверхностные в 80 % небольшие и в 70 % лечатся амбулаторно, около 30 % — в ожоговом стационаре; чаще взрослые 21–50 лет, мужчины чаще; раздел 1.5: I степень с пузырями заживает до 10 дней, II — за 18–20 дней, ожоговая болезнь — при площади больше 15–20 %; раздел 2.2: площадь по правилу ладони (1 %), глубина по пузырям, струпу, болевой чувствительности и волосковой пробе, признаки шока через 6–8 ч; раздел 3.1.2: обезболивание при ВАШ больше 3; раздел 3.1.4: меньше 15 % — пить, больше 15 % — внутривенная инфузия; раздел 3.1.12: системные антибиотики для профилактики не рекомендованы; раздел 3.1.17: профилактика столбняка всем, кроме одной гиперемии; раздел 3.2.2: туалет раны и повязка; раздел 6, п. 7, 11 и 18: I–II до 10 % — амбулаторно, от 10 % и III любой площади — ожоговое отделение, перевод не позже 72 ч; частоты признаков и доли видов ожогов не даны — игровые" }
review: draft
