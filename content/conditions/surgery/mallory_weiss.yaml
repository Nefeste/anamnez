id: cond.mallory_weiss
name: { ru: "Синдром Мэллори–Вейсса" }
icd10: K22.6
department: dept.surgery
system: digestive
kind: disease
severity: serious
# кровотечение из верхних отделов ЖКТ (spec 2026-10-chapter-4, часть 53а): язва и разрыв слизистой — одна группа, источник
# различает ЭГДС
group: grp.ugi_bleeding
epidemiology:
  # 7,5 случая на 100 000 человек (1026_1, раздел 1.3) против 90–160 кровотечений из язвы на 100 000 (277_2, раздел 1.3):
  # примерно один на 17 кровотечений из язвы. Полоса и множитель алкоголя подобраны прогоном генератора (100 000 пришедших
  # сами и 100 000 со скорой): скорая везёт тяжёлых, кровотечение из язвы — почти всегда с ней, поэтому разрыв на полосу
  # чаще — один на 16 при трёх пришедших сами на одного со скорой. «Чаще возникает у мужчин» — доли в тексте нет, игровая
  # оценка
  prevalence: ultra_rare
  age: { min: 18 }
  sex: { m: 1, f: 0.5 }
  # алкоголизм и булимия — частая и сильная рвота (1026_1, раздел 1.2); множитель — игровая оценка
  risks: [ { id: risk.alcohol, x: 8 } ]
# кровотечение из разрыва продолжается в момент ЭГДС или уже остановилось (1026_1, термины и раздел 3.3); долей в тексте нет —
# игровая оценка: чаще оно останавливается само
params:
  active: { yes: 20, 'no': 80 }
course:
  stages:
    - { id: early, days: [0, 2] }
  presentation: [0, 0]
  # без лечения кровотечение продолжается или повторяется — «в большинстве случаев рецидив развивается в процессе пребывания
  # в стационаре» (1026_1, термины); доли нет, игровая оценка
  untreated: { band: often, days: [0, 2] }
findings:
  # рвота кровью — от прожилок до массивного кровотечения (1026_1, раздел 1.6), после многократной «сухой» рвоты
  # (приложение В); частот в тексте нет — полосы
  - { f: sym.hematemesis, band: always }
  - { f: hx.vomiting_before_blood, band: usually }
  - { f: sym.vomiting, band: usually }
  - { f: sym.nausea, band: often }
  # мелена — «и/или» (приложение В); общие признаки кровопотери (раздел 1.6)
  - { f: sym.melena, band: sometimes }
  - { f: sym.fatigue, band: often }
  - { f: sym.dizziness, band: sometimes }
  - { f: sign.pallor, band: sometimes }
  - { f: vital.tachycardia, band: sometimes }
  # ЭГДС подтверждает разрыв (раздел 2.4); продолжается ли кровотечение — по параметру. Они — по определению у каждого:
  # пропустить их может только сама ЭГДС
  - { f: img.egd_tear, band: { pct: 100 }, note: "разрыв слизистой — сама болезнь: его и находит ЭГДС (1026_1, разделы 1.1 и 2.4)" }
  - { f: img.egd_bleeding, band: { pct: 100 }, when: { active: [yes] }, note: "кровь идёт из разрыва в момент ЭГДС — так параметр и определён (1026_1, раздел 3.3)" }
confirm: clinical
redFlags: [sym.hematemesis]
treatment:
  # ИПН в вену при поступлении всем (1026_1, раздел 3.2, УУР B, УДД 1); таблетки — допустимо
  firstLine: [tx.ppi_iv]
  acceptable: [tx.ppi]
  # нестабильная гемодинамика — сбалансированные солевые растворы (раздел 3.2)
  supportive: [tx.iv_fluids]
  # антитромботические прекращают (раздел 3.5); ацетилсалициловая кислота и НПВП раздражают слизистую (раздел 1.2)
  harmful: [tx.ibuprofen, tx.aspirin_acs, tx.clopidogrel, tx.doac, tx.lmwh, tx.enoxaparin_acs, tx.heparin_iv, tx.fondaparinux]
  notIndicated: [tx.antacid, tx.drotaverine, tx.amoxicillin, tx.amoxicillin_clavulanate, tx.cephalosporin_oral, tx.fluoroquinolone, tx.macrolide]
  byParam:
    # продолжается — гемостаз через эндоскоп (раздел 3.3, УУР B, УДД 1); остановилось — эндоскопическая профилактика рутинно
    # не рекомендуется (УУР C, УДД 5)
    - when: { active: [yes] }
      require: [tx.endoscopic_hemostasis]
    - when: { active: ['no'] }
      notIndicated: [tx.endoscopic_hemostasis]
  # экстренная госпитализация (раздел 6), осмотр хирурга в приёмном (раздел 2.1); ЭГДС и гемостаз — в первые 2 часа: где
  # эндоскопического кабинета нет — перевод
  setting:
    default: ward
    without: { rooms: [room.endoscopy], setting: transfer }
texts:
  summary:
    ru: >-
      Продольный разрыв слизистой там, где пищевод переходит в желудок: его рвёт многократная сильная
      рвота — после застолья, отравления. Сначала долго рвёт без крови, потом — кровью; бывает и чёрный
      стул, слабость, бледность. ЭГДС — в первые два часа от поступления: она находит разрыв. Кровь идёт —
      её останавливают через эндоскоп; остановилась сама — хватает ингибитора протонной помпы в вену и
      наблюдения. Где эндоскопии нет — перевод.
pearls:
  - ru: "«Сначала рвало без крови, потом — с кровью» — спросите об этом: так начинается разрыв слизистой, а не кровотечение из язвы."
  - ru: "Чаще всего кровотечение из разрыва останавливается само, но ЭГДС нужна и тогда — увидеть источник и не пропустить язву."
simplified: "Стадий разрыва по глубине нет; разрыв всех слоёв с медиастинитом — синдром Бурхаве — в игре не бывает. Повторного кровотечения, эмболизации и операции нет; переливания крови нет."
sources:
  - { kind: guideline, title: "Синдром Мэллори-Вейсса (желудочно-пищеводный разрывно-геморрагический синдром)", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1026_1", note: "ID 1026_1, опубликованы 02.02.2026, применяются; сверено с рубрикатором 11.10.2026; раздел 1.1: острые линейные разрывы слизистой брюшного отдела пищевода и кардии при рецидивирующей рвоте; раздел 1.2: многократная рвота, алкоголизм и булимия, ацетилсалициловая кислота; раздел 1.3: около 5 % кровотечений из верхних отделов ЖКТ, 7,5 на 100 000, чаще мужчины 40–50 лет, внутрибольничная летальность 2,7 %; раздел 1.6 и приложение В: рвота кровью после многократной рвоты, мелена, признаки кровопотери; раздел 2.4: ЭГДС в течение 2 часов от госпитализации; раздел 3.2: ИПН в вену при поступлении; раздел 3.3: гемостаз через эндоскоп при продолжающемся, при остановившемся — рутинно не рекомендуется; раздел 3.5: антитромботические прекращают; раздел 6: экстренная госпитализация; доли параметра и признаков — игровая оценка" }
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: кровотечения из язв — 90–160 на 100 000 человек, по ним — частота разрыва в игре" }
review: draft
