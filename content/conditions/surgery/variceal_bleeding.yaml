id: cond.variceal_bleeding
name: { ru: "Кровотечение из варикозных вен пищевода" }
# осложнение цирроза (spec 2026-10-chapter-4, часть 54а): портальная гипертензия расширяет вены пищевода, и они рвутся;
# МКБ-10 — I85.0, варикозное расширение вен пищевода с кровотечением
icd10: I85.0
department: dept.surgery
system: digestive
kind: disease
severity: critical
# кровотечение из верхних отделов ЖКТ: с язвой и разрывом Мэллори–Вейсса — одна группа, источник различает ЭГДС (715_2,
# раздел 2.4: исключить язву, синдром Мэллори–Вейсса и другие источники)
group: grp.ugi_bleeding
epidemiology:
  # варикозные вены — у 30–40 % больных компенсированным и у 60 % декомпенсированным циррозом, кровотечение — у каждого
  # четвёртого из них (715_2, раздел 1.3). Полоса подобрана прогоном генератора — игровая оценка
  prevalence: common
  age: { min: 30 }
  requires: [cond.cirrhosis]
# шок — тяжёлая кровопотеря: верхнее давление ниже 90, пульс чаще 100; кровотечения из вен «как правило, массивные» (715_2,
# раздел 1.6) — чаще, чем из язвы; доля — игровая оценка
params:
  shock: { yes: 35, 'no': 65 }
course:
  stages:
    - { id: early, days: [0, 2] }
  presentation: [0, 0]
  # без остановки кровотечение продолжается и повторяется, смертность высокая (715_2, раздел 3.2.2) — доли в тексте нет,
  # игровая оценка
  untreated: { band: usually, days: [0, 1] }
findings:
  # рвота свежей или реже видоизменённой кровью, мелена; общие признаки кровопотери — слабость, головокружение, бледность,
  # частый пульс (715_2, раздел 1.6). Частот нет — полосы, игровая оценка
  - { f: sym.hematemesis, band: always }
  - { f: sym.melena, band: usually }
  - { f: sym.fatigue, band: usually }
  - { f: sym.dizziness, band: often }
  - { f: sign.pallor, band: often }
  - { f: vital.tachycardia, band: often }
  - { f: lab.hb_low, band: sometimes }
  # декомпенсация — асцит, желтуха (715_2, разделы 1.1 и 1.6); варикозные вены — у 60 % декомпенсированных (раздел 1.3).
  # Полосы — игровая оценка
  - { f: sign.ascites, band: often }
  - { f: sign.jaundice, band: sometimes }
  # ЭГДС подтверждает «варикозный характер кровотечения» (715_2, раздел 2.4)
  - { f: img.egd_varices, band: { pct: 100 }, note: "источник — варикозные вены: их и находит ЭГДС (715_2, раздел 2.4)" }
  # идёт ли кровь в момент ЭГДС — доли в тексте нет, игровая оценка
  - { f: img.egd_bleeding, band: often }
  - { f: vital.bp_low, band: { pct: 100 }, when: { shock: [yes] }, note: "шок в игре — тяжёлая кровопотеря: верхнее давление ниже 90 (277_2, приложение Г1)" }
  - { f: vital.tachycardia, band: always, when: { shock: [yes] } }
confirm: clinical
redFlags: [sym.hematemesis, sym.melena]
treatment:
  # терлипрессин или октреотид — незамедлительно, до ЭГДС (715_2, раздел 3.2.2, УУР B, УДД 2); цефтриаксон 7 суток —
  # снижает инфекции и смертность (УУР B, УДД 2: «служит препаратом первой линии»; в игре — антибиотик в вену); лигирование
  # при продолжающемся кровотечении вместе с ними (раздел 3.3.1, УУР C, УДД 5 и УУР A, УДД 1). Вазоактивный препарат и
  # антибиотик — и до перевода: их начинают, не дожидаясь ЭГДС
  require: [tx.vasoactive_portal, tx.antibiotic_iv, tx.variceal_ligation]
  beforeTransfer: [tx.vasoactive_portal, tx.antibiotic_iv]
  # лактулоза — удалить кровь из кишечника и предупредить печёночную энцефалопатию (раздел 3.2.2, УУР A, УДД 2); растворы
  # при кровопотере
  supportive: [tx.lactulose, tx.iv_fluids]
  # как при любом кровотечении из верхних отделов ЖКТ — НПВП и антитромботические прекращают (277_2, разделы 3.3 и 3.5; в
  # 715_2 отдельно не сказано)
  harmful: [tx.ibuprofen, tx.aspirin_acs, tx.clopidogrel, tx.doac, tx.lmwh, tx.enoxaparin_acs, tx.heparin_iv, tx.fondaparinux]
  # транексамовая кислота — «воздерживаться» (раздел 3.2.2, УУР A, УДД 1); ИПН отменяют, как только источник — вены (УУР C,
  # УДД 4); укол с коагуляцией и клипсы — для язвы, вены лигируют
  notIndicated: [tx.tranexamic, tx.ppi_iv, tx.ppi, tx.endoscopic_hemostasis, tx.antacid, tx.drotaverine]
  byParam:
    # шок — растворы обязательны
    - when: { shock: [yes] }
      require: [tx.iv_fluids]
  # всем — осмотр реаниматолога и ОРИТ «для мониторирования витальных функций» (715_2, раздел 3.2.2, УУР C, УДД 5): в игре —
  # ПИТ, реанимация с ИВЛ — не ошибка. Где эндоскопического кабинета нет — перевод, как при язвенном кровотечении
  setting:
    default: icu
    also:
      - { when: { shock: [yes, 'no'] }, settings: [ricu] }
    without: { rooms: [room.endoscopy], setting: transfer }
texts:
  summary:
    ru: >-
      Осложнение цирроза: давление в воротной вене растёт, вены нижней трети пищевода расширяются и рвутся. Обильная рвота
      кровью, чёрный стул, слабость, частый пульс, часто шок; у больного — асцит, желтуха, сосудистые звёздочки. Сразу, ещё
      до ЭГДС, — терлипрессин или октреотид и антибиотик в вену; ЭГДС — как можно раньше, вены лигируют через эндоскоп.
      Лечат в интенсивной терапии; где эндоскопии нет — переводят.
pearls:
  - ru: "Рвота кровью у человека с асцитом и сосудистыми звёздочками — варикозные вены, пока ЭГДС не сказала иного: вазоактивный препарат и антибиотик дают сразу, не дожидаясь эндоскопии."
  - ru: "Транексамовая кислота и плазма кровотечение из вен не остановят: оно — от высокого давления в воротной вене, его и снижают."
simplified: "Переливания крови нет — целевой гемоглобин 70–90 г/л не держат, свежезамороженной плазмы тоже нет. Баллонной тампонады, стента, TIPS и повторной ЭГДС нет; кровотечения из вен желудка отдельно нет. Чайлд-Пью и MELD не считают: от них зависит TIPS — в игре его нет. Бета-адреноблокатор для вторичной профилактики — после выписки."
sources:
  - { kind: guideline, title: "Цирроз и фиброз печени", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/715_2", note: "ID 715_2, опубликованы 15.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: варикозные вены у 30–40 % компенсированных и 60 % декомпенсированных, кровотечение у каждого четвёртого; раздел 1.6: кровотечения, как правило, массивные — признаки кровопотери, рвота кровью, мелена; раздел 2.4 (УУР A, УДД 2): ЭГДС как можно раньше, желательно в первые 12 ч; раздел 3.2.2: ОРИТ (УУР C, УДД 5), целевой гемоглобин 7–9 г/дл, плазма не рекомендована, транексамовая кислота — воздерживаться (УУР A, УДД 1), цефтриаксон 7 дней (УУР B, УДД 2), лактулоза (УУР A, УДД 2), ИПП отменить (УУР C, УДД 4), терлипрессин или октреотид до эндоскопии (УУР B, УДД 2); раздел 3.3.1: лигирование вместе с ними (УУР A, УДД 1); доля шока и полосы признаков — игровая оценка" }
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; приложение Г1: тяжёлая кровопотеря — верхнее давление ниже 90; разделы 3.3 и 3.5: при кровотечении из верхних отделов ЖКТ НПВП отменяют, антитромботические прекращают" }
review: draft
