id: cond.limb_ischemia
name: { ru: "Острая ишемия ноги" }
# эмболия и тромбоз артерий ног — I74.3 (1006_1, раздел 1.4)
icd10: I74.3
department: dept.surgery
system: heart
kind: disease
severity: critical
epidemiology:
  # 1–2 на 100 000 в год (1006_1, раздел 1.3); в игре чаще, чтобы встречалась в смене: около 0,3 %
  # пришедших в приёмное — игровая оценка
  prevalence: rare
  # в Швеции — «преимущественно у пациентов старше 80 лет» (раздел 1.3); возраст и пол по России не
  # даны: с 50 лет, пик — игровая оценка
  age: { min: 50, peak: [70, 95] }
  # эмболия: 90–96 % — из-за болезней сердца, среди них фибрилляция предсердий (раздел 1.2);
  # курящим рекомендован отказ от курения (раздел 5.3); во сколько раз растёт риск, в тексте нет —
  # игровые оценки
  risks:
    - { id: risk.atrial_fibrillation, x: 10 }
    - { id: risk.smoking, x: 2 }
params:
  side: { right: 1, left: 1 }
course:
  stages:
    - { id: acute, days: [0, 1] }
  # приходят в первые часы: симптомы «менее двух недель» (раздел 1.1) — игровая оценка
  presentation: [0, 0]
  # необратимый некроз мышц — через 4–6 ч при эмболии, 12–24 ч при тромбозе (раздел 1.2)
  untreated: { band: usually, days: [0, 1] }
findings:
  - f: sym.leg_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "боль — в большинстве случаев первый признак (1006_1, раздел 2.1); в игре острая ишемия приходит с болью у каждого"
  # «6 П» (разделы 1.6, 2.1): частот в тексте нет — полосы игровые, кроме пульса
  - { f: sym.leg_numb, band: usually }
  - f: sign.foot_pulse_absent
    band: { pct: 100 }
    note: "ниже закрытой артерии пульса нет у каждого (раздел 2.1); найдёт ли его отсутствие врач — точность осмотра"
  - { f: sign.leg_cold_pale, band: usually }
  - { f: sign.leg_sensory_loss, band: often }
  # парез — с 2А степени, паралич — с 2Б (раздел 1.5, табл. 3)
  - { f: sign.leg_paresis, band: sometimes }
  # D-димер входит в первичную коагулограмму (раздел 2.3); как часто повышен, в тексте нет — игровая
  # оценка
  - { f: lab.d_dimer_high, band: usually }
  - f: img.us_artery_occluded
    band: { pct: 100 }
    note: "артерия закрыта тромбом или эмболом у каждого; увидит ли это УЗИ — точность обследования"
  - { f: vital.tachycardia, band: sometimes }
# диагноз — по «6 П»: они и есть основные клинические критерии (1006_1, раздел 2.1); УЗИ артерий —
# чтобы спланировать лечение, если оно не задерживает перевод (раздел 2.4)
confirm: clinical
redFlags: [sign.foot_pulse_absent, sign.leg_sensory_loss, sign.leg_paresis]
# отличают от тромбоза глубоких вен (1006_1, раздел 2.2): признаки разные, а путают
differential: [cond.dvt]
treatment:
  # гепарин натрия в вену — сразу после установления диагноза, в приёмном отделении (1006_1, раздел
  # 3.1); инфузия — там же; экстренный перевод из непрофильного стационара в сосудистый центр —
  # критерий качества 5 (раздел 3.3.1); компрессия и таблетки от тромбоза вен — не то лечение
  firstLine: [tx.heparin_iv]
  supportive: [tx.iv_fluids]
  notIndicated: [tx.compression, tx.doac]
  setting: { default: transfer }
texts:
  summary:
    ru: >-
      Внезапно закрылась артерия ноги — тромб или сгусток, чаще всего из сердца при мерцательной
      аритмии. Правило «6 П»: боль, нет пульса ниже закрытого места, бледность, холод, онемение и
      слабость ноги. Счёт идёт на часы: через 4–6 часов мышцы начинают гибнуть. Не путать с тромбозом
      вен: там нога отёчная и тёплая, пульс есть. В районной больнице — сразу гепарин в вену и
      экстренный перевод в сосудистый центр; УЗИ артерий — если оно не задерживает перевод.
pearls:
  - ru: "Нет пульса на стопе, нога бледная и холодная — это не тромбоз вен: шкалу Уэллса и D-димер не считают."
  - ru: "Онемение и слабость ноги — ишемия тяжёлая: без операции в ближайшие часы ногу не спасти."
  - ru: "Гепарин тромб не растворяет, он не даёт ему расти: ногу спасает операция в сосудистом центре."
simplified: "Острая ишемия в игре — на ноге, у пациента старше 50 лет, без степени ишемии: тактика в районной больнице одна — гепарин и перевод в сосудистый центр. Ишемии руки, операций, тромболизиса, ампутации и лечения после перевода нет; анализов на КФК и миоглобин в игре нет."
sources:
  - { kind: guideline, title: "Острая ишемия конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/1006_1", note: "ID 1006_1, опубликованы 29.12.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: 90–96 % эмболий — из-за болезней сердца (ИБС, инфаркт, фибрилляция предсердий, пороки); некроз мышц через 4–6 ч при эмболии и 12–24 ч при тромбозе; раздел 1.3: 1–2 на 100 000 в год, в Швеции — преимущественно старше 80 лет; разделы 1.6, 2.1: «правило 6 П»; раздел 2.2: дифференцировать с тромбозом глубоких вен; раздел 2.4: визуализация — если не откладывает лечение, этап не дольше 2 часов; раздел 2.4.4: дуплексное УЗИ или МР-ангиография — критерий качества 3; раздел 3.1: гепарин натрия сразу после диагноза, в приёмном отделении; раздел 3.3.1: экстренный перевод из непрофильного стационара в сосудистый центр — критерий качества 5; частоты признаков и множители риска не даны — игровые" }
review: draft
