id: cond.pancreatitis
name: { ru: "Острый панкреатит" }
icd10: K85.9
department: dept.surgery
system: digestive
kind: disease
severity: serious
epidemiology:
  # доля среди пришедших — игровая оценка: «очень редко» у тех, у кого нет ни алкоголя, ни камней,
  # — это и есть прочие причины, 10 %; в больнице с приёмным панкреатит — около 1,4 % пришедших
  prevalence: very_rare
  age: { min: 18 }
  # алкогольно-алиментарный — 55 %, билиарный — 35 % (903_1, раздел 1.2): множители подобраны
  # прогоном генератора (30 000 человек) так, чтобы при нынешних долях злоупотребления алкоголем и
  # камней в базе были эти доли — выходит 55/35/10
  risks: [ { id: risk.alcohol, x: 18 }, { id: cond.cholelithiasis, x: 32 } ]
params:
  # отёчный — 80–85 %, некротический — 15–20 %, он всегда средней или тяжёлой степени (903_1,
  # раздел 1.2): середины
  severity: { mild: 165, severe: 35 }
course:
  stages:
    # фаза IA — первая неделя, IB — вторая (903_1, раздел 1.2)
    - { id: early, days: [0, 7] }
    - { id: late, days: [7, 21] }
  presentation: [0, 1]
  # без инфузии и обезболивания становится хуже — доля и срок в тексте не названы, игровая оценка
  untreated: { band: often, days: [1, 3] }
  # лёгкий — в районной больнице до нормы самочувствия, температуры и анализов (903_1, раздел 6);
  # суток в тексте нет — игровая оценка
  stay: [4, 7]
findings:
  - f: sym.epigastric_pain
    band: { pct: 100 }
    note: "903_1, раздел 2.1: типичный болевой синдром возникает при остром панкреатите всегда"
  - { f: sym.abdominal_pain, band: usually }
  - { f: sym.back_radiation, band: usually }
  - { f: sym.vomiting, band: usually }
  - { f: sym.nausea, band: usually }
  - { f: sign.epigastric_tenderness, band: usually }
  - { f: sign.peritoneal_signs, band: rarely }
  - { f: sign.peritoneal_signs, band: often, when: { severity: [severe] } }
  - { f: vital.tachycardia, band: often }
  - { f: vital.tachycardia, band: usually, when: { severity: [severe] } }
  - { f: vital.tachypnea, band: often, when: { severity: [severe] } }
  - { f: vital.spo2_low, band: sometimes, when: { severity: [severe] } }
  - { f: vital.fever, band: sometimes }
  - { f: sign.jaundice, band: rarely }
  - { f: lab.lipase_high, band: usually }
  - { f: lab.wbc_high, band: often }
  - { f: lab.crp_high, band: often }
  - { f: lab.alt_high, band: sometimes }
  - { f: lab.bilirubin_high, band: sometimes }
confirm: [exam.lipase]
redFlags: [sign.peritoneal_signs]
treatment:
  firstLine: [tx.iv_fluids]
  supportive: [tx.ibuprofen]
  notIndicated: [tx.amoxicillin, tx.amoxicillin_clavulanate, tx.cephalosporin_oral, tx.fluoroquinolone, tx.macrolide, tx.antacid]
  plan: [tx.iv_fluids, tx.ibuprofen]
  # лёгкий — в районной больнице (МО первого уровня), средний и тяжёлый — второго и третьего,
  # в реанимацию (903_1, раздел 6)
  setting: { default: ambulance, param: { name: severity, map: { mild: ambulance, severe: transfer } }, redFlag: transfer }
texts:
  summary:
    ru: >-
      Воспаление поджелудочной железы — чаще после обильной еды с алкоголем или из-за камня в
      желчных путях. Сильная постоянная боль под ложечкой, отдаёт в спину или опоясывает,
      многократная рвота. Лёгкий проходит за несколько дней на капельницах и обезболивании,
      тяжёлый — с некрозом железы — лечат в реанимации больницы выше уровнем.
pearls:
  - ru: "Боль при панкреатите не снимается спазмолитиками — это не колика."
  - ru: "Начало болезни считают по началу боли, а не по времени поступления."
simplified: "Степени две: лёгкая — отёчный панкреатит, и тяжёлая — некротический, у которого и средняя, и тяжёлая степень; тяжесть видна по пульсу, дыханию и брюшине."
sources:
  - { kind: guideline, title: "Острый панкреатит", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/903_1", note: "ID 903_1, опубликованы 20.01.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: причины и доли форм, фазы; раздел 2: критерии — клиника, УЗИ, амилаза или липаза в 3 раза выше нормы; раздел 2.1: триада, боль — всегда; раздел 3.1: инфузия, обезболивание, профилактические антибиотики не рекомендуются; раздел 6: лёгкий — МО первого уровня, средний и тяжёлый — второго и третьего; частоты признаков — черновик" }
review: draft
