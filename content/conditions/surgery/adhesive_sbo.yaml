id: cond.adhesive_sbo
name: { ru: "Спаечная кишечная непроходимость" }
icd10: K56.5
department: dept.surgery
system: digestive
kind: disease
severity: serious
epidemiology:
  # доля среди пришедших — игровая оценка: со спаечной непроходимостью в 2020 г. в России лечились
  # 28 645 человек (327_3, раздел 1.3) — как с ущемлённой паховой грыжей; спайки — 49–73 % причин
  # механической тонкокишечной непроходимости (327_3, раздел 1.2). Возраста и пола в тексте нет
  prevalence: very_rare
  age: { min: 18 }
params:
  # странгуляция, ишемия кишки: у 18 из 166 больных тонкокишечной непроходимостью (Fevang 2002:
  # 9 оперированных сразу и 9 из лечившихся консервативно) — 10,8 %; при ранней спаечной — 8–10 %
  # (327_3, раздел 3.1)
  ischemia: { no: 892, yes: 108 }
course:
  stages:
    - { id: early, days: [0, 2] }
  # приходят в первые сутки-двое — игровая оценка
  presentation: [0, 1]
  # не помогло неоперативное лечение или есть ишемия — хуже; с ишемией кишки непроходимость без
  # операции смертельна (327_3, раздел 2.2); на какие сутки — игровая оценка в пределах 72 ч
  untreated: { band: always, days: [1, 3] }
  # после успешного неоперативного лечения в стационаре 4,7 суток (SnapSBO 2025, в реферате — 5,3),
  # 5 (WSES 2017) — 3–6 суток, игровая оценка по ним
  stay: [3, 6]
# ишемия или перитонит — экстренная операция, в течение 2 ч после госпитализации (327_3, термины и
# раздел 2.2); без них — неоперативное лечение до 72 ч (327_3, критерий качества 5; WSES 2017:
# пробовать 72 ч безопасно), не помогло — операция. После операции в стационаре — 8,3 суток у
# оперированных сразу (SnapSBO 2025, в реферате — 7,7): 6–10 суток, игровая оценка по ним
surgery: { tx: tx.adhesiolysis, window: 2, observe: 72, stay: [6, 10] }
# при полном прекращении кровотока необратимые изменения стенки кишки — к 6 ч (327_3, раздел 1.2;
# при 25 % кровотока за 12 ч значимых нет — в игре 6 ч у всех с ишемией): некроз, резекция кишки
complication:
  name: { ru: "некроз кишки" }
  after: 6
  when: { ischemia: [yes] }
findings:
  # ранний признак — боль в животе (327_3, прил. В); чаще схваткообразная (раздел 2.1); боль,
  # вздутие, тошнота, рвота, задержка стула и газов — неспецифические признаки (раздел 2.1)
  - { f: sym.abdominal_pain, band: always }
  - { f: sym.colicky_pain, band: usually }
  - { f: sym.nausea, band: usually }
  - { f: sym.vomiting, band: usually }
  - { f: sym.bloating, band: usually }
  # у части больных вместо задержки стула — жидкий стул (327_3, раздел 2.1)
  - { f: sym.no_stool_gas, band: usually }
  - f: hx.abdominal_surgery
    band: { pct: 85 }
    note: "327_3, раздел 2.1: операции на животе в прошлом указывают на спаечную непроходимость с чувствительностью 85 % и специфичностью 78 %; нет операций — спаечную не исключает"
  - f: img.xr_bowel_levels
    band: { pct: 100 }
    note: "непроходимость есть у каждого больного; видна ли она на снимке — чувствительность обследования (327_3, раздел 2.4: 50–60 %)"
  # обезвоживание от рвоты и невозможности пить (327_3, разделы 1.2 и 2.2)
  - { f: sign.dehydration, band: often }
  - f: sign.peritoneal_signs
    band: { pct: 17 }
    when: { ischemia: [no] }
    note: "Sarr 1983 (PMID 6849489): из 30 больных полной непроходимостью без странгуляции опытный хирург заподозрил её у 5 — 17 %; в игре это доля с симптомами раздражения брюшины"
  - f: sign.peritoneal_signs
    band: { pct: 48 }
    when: { ischemia: [yes] }
    note: "Sarr 1983 (PMID 6849489) и WSES 2017: осмотр опытного хирурга распознаёт странгуляцию у 48 % (10 из 21); в игре это доля с симптомами раздражения брюшины"
  - { f: vital.tachycardia, band: sometimes }
  - { f: vital.tachycardia, band: often, when: { ischemia: [yes] } }
  - f: lab.wbc_high
    band: { pct: 50 }
    when: { ischemia: [no] }
    note: "327_3, раздел 2.3: специфичность лейкоцитоза для ишемии кишки — 50 %, то есть он и у половины больных без ишемии"
  - { f: lab.wbc_high, band: usually, when: { ischemia: [yes] } }
  - { f: vital.fever, band: rarely, when: { ischemia: [no] } }
  - f: vital.fever
    band: { pct: 3 }
    when: { ischemia: [yes] }
    note: "327_3, раздел 2.1: лихорадка — только у 3 % больных странгуляционной непроходимостью"
# снимок или КТ живота — критерий качества 2 (327_3)
confirm: [exam.xray_abdomen]
redFlags: [sign.peritoneal_signs]
treatment:
  # восполнение жидкости — всем (327_3, раздел 3.1)
  firstLine: [tx.iv_fluids]
  # зонд — при непрекращающейся рвоте (327_3, раздел 3.1)
  supportive: [tx.ng_tube]
  # антибиотики без перфорации, перитонита и сепсиса не рекомендуются (327_3, раздел 3.2); основа
  # неоперативного лечения — ничего через рот (WSES 2017)
  notIndicated: [tx.amoxicillin, tx.amoxicillin_clavulanate, tx.cephalosporin_oral, tx.fluoroquinolone, tx.ors]
  # ишемия кишки или перитонит — экстренная операция; остальных — в стационар, неоперативное
  # лечение (327_3, разделы 2.2 и 3.1)
  setting: { default: ambulance, param: { name: ischemia, map: { no: ambulance, yes: surgery } }, redFlag: surgery }
texts:
  summary:
    ru: >-
      Спайка после операции на животе пережимает тонкую кишку: содержимое не проходит дальше. Боль
      схватками, вздутие, рвота, не отходят газы, на снимке — раздутые петли с уровнями жидкости.
      Без ишемии кишки и перитонита лечат в палате: капельница, голод, при рвоте — зонд, до 72 ч.
      Если кишка пережата вместе с сосудами — ишемия, она омертвеет за несколько часов: нужна
      экстренная операция.
pearls:
  - ru: "Странгуляцию до операции надёжно не распознать ни по одному признаку: пока непроходимость не прошла, о ней думают."
  - ru: "У больного с непроходимостью осматривают все грыжевые ворота и рубцы: ущемлённую грыжу легко пропустить."
  - ru: "Не прошло за 72 ч лечения в палате — оперируют."
simplified: "КТ, пробы с контрастом и контроля каждые 12 ч в игре пока нет: в палате — утренний обход по суткам. Толстокишечной непроходимости, заворота и других причин нет."
sources:
  - { kind: guideline, title: "Острая неопухолевая кишечная непроходимость", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/327_3", note: "ID 327_3, опубликованы 06.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: спайки — 49–73 % причин тонкокишечной непроходимости, необратимые изменения кишки при полном прекращении кровотока — к 6 ч; раздел 1.3: в 2020 г. — 28 645 больных спаечной непроходимостью; раздел 2.1: признаки, операции в прошлом — 85 и 78 %, лихорадка при странгуляции — 3 %; раздел 2.2: ишемия или перитонит — экстренная операция; раздел 2.3: специфичность лейкоцитоза — 50 %; раздел 2.4: снимок находит непроходимость у 50–60 %; раздел 3.1: неоперативное лечение; критерии качества; частоты без пояснений — черновик" }
  - { kind: guideline, title: "ten Broek RPG et al. Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the world society of emergency surgery ASBO working group. World J Emerg Surg 2018;13:24", url: "https://pubmed.ncbi.nlm.nih.gov/29946347/", note: "PMID 29946347, PMC6006983, сверено 29.09.2026: спайки — 60 % причин тонкокишечной непроходимости; в среднем 8 суток в больнице и 3 % умирают за эпизод; оперируют 20–30 %; неоперативное лечение — у всех без перитонита, странгуляции и ишемии, эффективно у 70–90 %, 72 ч — безопасно; осмотр находит странгуляцию только у 48 %; после неоперативного лечения — 5 суток в больнице" }
  - { kind: paper, title: "Fevang BT, Jensen D, Svanes K, Viste A. Early operation or conservative management of patients with small bowel obstruction? Eur J Surg 2002;168(8–9):475–481", url: "https://pubmed.ncbi.nlm.nih.gov/12549688/", note: "PMID 12549688, сверено 29.09.2026: 166 эпизодов тонкокишечной непроходимости без грыж и рака; 20 оперированы рано, странгуляция — у 9; из 146 лечившихся консервативно 93 (64 %) обошлись без операции, у 9 (6 %) — странгуляция, 3 (2 %) умерли" }
  - { kind: paper, title: "Sarr MG, Bulkley GB, Zuidema GD. Preoperative recognition of intestinal strangulation obstruction. Prospective evaluation of diagnostic capability. Am J Surg 1983;145(1):176–182", url: "https://pubmed.ncbi.nlm.nih.gov/6849489/", note: "PMID 6849489, сверено 29.09.2026: 51 больной полной непроходимостью перед операцией, странгуляция — у 21; ни один признак её надёжно не выявляет; опытный хирург распознал её у 10 из 21 (48 %), простую верно назвал у 25 из 36 заключений" }
  - { kind: paper, title: "Kaplan LJ et al.; SnapSBO Collaborators. Small bowel obstruction outcomes according to compliance with the World Society of Emergency Surgery Bologna guidelines. Br J Surg 2025;112(4):znaf080", url: "https://pubmed.ncbi.nlm.nih.gov/40246692/", note: "PMID 40246692, PMC12005947, сверено 29.09.2026: 982 больных спаечной непроходимостью; неоперативное лечение успешно у 57,1 % всех, после его неудачи оперировали 22,8 %, сразу — 20,1 %; койко-день — 4,7, 13,0 и 8,3 суток (в реферате — 5,3, 12,9 и 7,7)" }
review: draft
