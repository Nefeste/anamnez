id: cond.renal_colic
name: { ru: "Почечная колика" }
icd10: N23
department: dept.surgery
system: urinary
kind: syndrome
severity: moderate
epidemiology:
  # 1,7 % всех неотложных обращений в стационар (587_2, раздел 1.3); полоса — по прогону генератора
  prevalence: uncommon
  # мочекаменная болезнь чаще у мужчин — 3:1, по NHANES 1,75:1 — взято 1,75:1; чаще в 40–50 лет
  # (587_2, раздел 1.3)
  age: { min: 18, peak: [40, 50] }
  sex: { m: 1, f: 0.57 }
params:
  # сторона — поровну: в тексте нет
  side: { right: 50, left: 50 }
  # инфекция мочевых путей — у 8 % (587_2, раздел 2.3): осложнённая колика
  infection: { no: 92, yes: 8 }
course:
  stages:
    - { id: attack, days: [0, 1] }
  # с приступом приходят сразу — игровая оценка
  presentation: [0, 0]
  # без обезболивания приступ не проходит или повторяется — игровая оценка; две трети камней
  # мочеточника выходят сами за 4 недели (587_2, раздел 3.1.1)
  untreated: { band: often, days: [0, 2] }
findings:
  # острая выраженная боль в пояснице, внезапно, с периодами обострения и затишья (587_2, раздел 1.6)
  - { f: sym.flank_pain, band: always, attrs: { side: $side } }
  - { f: sym.colicky_pain, band: usually }
  - { f: sym.abrupt_onset, band: usually }
  - { f: sym.abdominal_pain, band: sometimes }
  # при спуске камня по мочеточнику боль отдаёт в пах и половые органы (587_2, раздел 1.6)
  - { f: sym.groin_radiation, band: often }
  # острое начало, тошнота и макрогематурия — самые значимые симптомы (587_2, раздел 2.1)
  - { f: sym.nausea, band: usually }
  - { f: sym.vomiting, band: often }
  - { f: sym.hematuria, band: sometimes }
  - { f: sym.frequency, band: sometimes }
  - f: lab.urine_blood
    band: { pct: 85 }
    note: "587_2, раздел 2.3: эритроцитурия может отсутствовать у 15 % больных почечной коликой"
  # лейкоцитурия — у 14,5 % всех больных почечной коликой, и посев мочи при ней положителен в 10 раз
  # чаще, чем без неё (587_2, раздел 2.3): 60 % с инфекцией и 6,7 % без неё дают вместе с фоновыми
  # 4 % 14,5 % у всех и инфекцию при лейкоцитурии в 9,5 раза чаще
  - f: lab.urine_leuk
    band: { pct: 60 }
    when: { infection: [yes] }
    note: "подобрано под 587_2, раздел 2.3: у всех больных почечной коликой лейкоцитурия — 14,5 %, при ней посев положителен в 10 раз чаще"
  - f: lab.urine_leuk
    band: { pct: 6.7 }
    when: { infection: [no] }
    note: "подобрано под 587_2, раздел 2.3: у всех больных почечной коликой лейкоцитурия — 14,5 %, при ней посев положителен в 10 раз чаще"
  - { f: lab.urine_nitrite, band: often, when: { infection: [yes] } }
  - f: lab.wbc_high
    band: { pct: 80 }
    note: "587_2, раздел 2.3: незначительный лейкоцитоз — примерно у 80 % больных почечной коликой"
  - { f: vital.fever, band: rarely, when: { infection: [no] } }
  - { f: vital.fever, band: usually, when: { infection: [yes] } }
  - { f: sym.chills, band: often, when: { infection: [yes] } }
  # от боли — тахикардия, бледность (587_2, раздел 2.2)
  - { f: vital.tachycardia, band: sometimes }
  - { f: sign.pallor, band: sometimes }
  - { f: sign.cva_tenderness, band: often }
  - { f: hx.kidney_stones, band: often }
  - f: img.us_hydronephrosis
    band: { pct: 89.1 }
    note: "587_2, раздел 2.4: расширение полостной системы почки — только у 89,1 % больных с камнем мочеточника по КТ"
# без КТ — УЗИ почек (587_2, раздел 2.4); анализ мочи — обязателен (раздел 2.3)
confirm: [exam.us_kidney]
redFlags: [vital.fever]
treatment:
  # НПВП — первая линия обезболивания, лучше опиоидов (587_2, раздел 3.1.1)
  firstLine: [tx.ibuprofen]
  # альфа-адреноблокаторы — при камне до 7 мм (587_2, раздел 3.1.1)
  acceptable: [tx.alpha_blocker]
  # спазмолитики и стимуляция диуреза капельницей не рекомендуются (587_2, раздел 3.1.1)
  notIndicated: [tx.drotaverine, tx.iv_fluids]
  # неосложнённая колика с купированной болью — домой; с инфекцией (пиелонефрит, сепсис) —
  # неотложное дренирование почки — урологии в больнице нет, перевод; беременность — госпитализация
  # (587_2, разделы 3.2 и 6)
  setting:
    default: home
    param: { name: infection, map: { no: home, yes: transfer } }
    redFlag: transfer
    risks: [ { id: risk.pregnancy, setting: ward } ]
texts:
  summary:
    ru: >-
      Приступ боли, когда камень закупоривает мочеточник и моча не может оттечь из почки. Вдруг —
      сильная боль в пояснице, волнами, отдаёт в пах; удобного положения не найти, тошнит, в моче —
      кровь. На УЗИ расширена лоханка. Лечение — противовоспалительное; маленький камень обычно
      выходит сам. С температурой — инфекция за камнем: нужна срочная разгрузка почки.
pearls:
  - ru: "Спазмолитики и капельница «для промывания» при колике не нужны: снимает боль противовоспалительное."
  - ru: "Колика с температурой — возможно, инфекция за камнем: нужна срочная разгрузка почки в урологии."
  - ru: "Если человеку больше 60 лет, помните об аневризме аорты: её разрыв похож на колику, и без уверенного диагноза — в стационар."
simplified: "Колика в игре всегда от камня в мочеточнике; размера камня, КТ почек, обзорной урографии и урологических операций нет — осложнённую колику переводят."
sources:
  - { kind: guideline, title: "Почечная колика", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/587_2", note: "ID 587_2, опубликованы 09.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.3: 1,7 % неотложных обращений, мужчины 3:1 (NHANES — 1,75:1), 40–50 лет; разделы 1.6 и 2.1: клиника; раздел 2.3: эритроцитурии нет у 15 %, лейкоцитурия — 14,5 %, инфекция — 8 %, лейкоцитоз — около 80 %; раздел 2.4: КТ — метод выбора, УЗИ одно не рекомендуется; раздел 3.1.1: НПВП — первая линия, спазмолитики и стимуляция диуреза не рекомендуются, альфа-адреноблокаторы при камне до 7 мм; раздел 3.2: при осложнённой колике — неотложное дренирование; раздел 6: показания к госпитализации; частоты без пояснений — черновик" }
review: draft
