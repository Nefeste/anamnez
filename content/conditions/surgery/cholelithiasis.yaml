id: cond.cholelithiasis
name: { ru: "Камни в желчном пузыре" }
icd10: K80.2
department: dept.surgery
system: digestive
kind: disease
severity: minor
presenting: false
epidemiology:
  prevalence: common
  age: { min: 18 }
  # ЖКБ — у 10–15 % взрослых, при метаболическом синдроме — у 20–30 % (877_1, раздел 1.3): 10 % и
  # вдвое чаще при ожирении — в среднем по базе около 12 %
  chronic: { band: { pct: 10 }, risks: [ { id: risk.obesity, x: 2 } ] }
course:
  stages:
    - { id: stable, days: [0, 36500] }
findings:
  - f: img.us_gallstones
    band: { pct: 100 }
    note: "камни — и есть болезнь; найдёт ли их УЗИ — точность обследования (877_1, раздел 2.4: порядка 95 %)"
  # о камнях знают не все: у двух-трёх из четырёх они не болят (877_1, раздел 1.6) — полоса «иногда»
  - { f: hx.gallstones, band: sometimes }
confirm: [exam.us_abdomen]
texts:
  summary:
    ru: >-
      Камни в желчном пузыре. У двух-трёх из четырёх они никогда не болят, и их находят случайно
      на УЗИ. Опасны приступами — желчной коликой, острым холециститом, панкреатитом.
simplified: "У женщин и пожилых камни чаще; в базе доля одна на всех и выше только при ожирении."
sources:
  - { kind: guideline, title: "Желчнокаменная болезнь", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/877_1", note: "ID 877_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.3: ЖКБ у 10–15 % взрослых, при метаболическом синдроме — у 20–30 %; раздел 1.6: без симптомов — 66–75 %" }
review: draft
