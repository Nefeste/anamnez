id: cond.perforated_ulcer
name: { ru: "Прободная язва" }
icd10: K27.5
department: dept.surgery
system: digestive
kind: disease
severity: critical
epidemiology:
  # доля среди пришедших — игровая оценка: в России 17,1 на 100 тыс. в год (277_2, раздел 1.3) —
  # примерно в шесть раз реже аппендицита
  prevalence: very_rare
  # основная часть больных — молодого и среднего возраста, мужчин вдвое больше (277_2, раздел 1.3)
  age: { min: 18, peak: [18, 59] }
  sex: { m: 1, f: 0.5 }
course:
  stages:
    - { id: early, days: [0, 1] }
    - { id: late, days: [1, 3] }
  # с «кинжальной» болью приходят в первые сутки — игровая оценка; позже 24 ч перфорация
  # становится давней, если операцию затянули
  presentation: [0, 0]
  # консервативное лечение не рекомендуется: высокий риск осложнений и смерти (277_2, раздел 3.5)
  untreated: { band: always, days: [0, 1] }
  # после операции — антибиотики 3–5 суток и ИПН в вену до 7 дней (277_2, раздел 3.5): срока
  # стационара в тексте нет, 5–8 суток — игровая оценка
  stay: [5, 8]
# экстренная операция, максимально раннее ушивание (277_2, раздел 3.5); экстренная — в течение
# 2 ч после госпитализации (так её определяют рекомендации 327_3, термины)
surgery: { tx: tx.ulcer_suture, window: 2 }
# давняя перфорация — больше 24 ч до операции — фактор риска шкалы Boey: летальность после
# операции 14,4 % вместо 1,5 % (277_2, Прил. Г8); перфорация неизбежно ведёт к перитониту (277_2,
# раздел 3.5). Название — в строках «если была …», поэтому женского рода
complication:
  name: { ru: "давняя перфорация" }
  after: 24
findings:
  - f: sym.dagger_pain
    band: { pct: 92 }
    note: "277_2, раздел 1.6: резкая боль в эпигастрии и мезогастрии в первый час болезни — 92 %; внезапная «кинжальная» боль — симптом Дьелафуа (раздел 2.1)"
  - { f: sym.abdominal_pain, band: always }
  - { f: sym.epigastric_pain, band: usually }
  - { f: sym.nausea, band: sometimes }
  - { f: sym.vomiting, band: sometimes }
  - { f: sign.epigastric_tenderness, band: usually }
  - { f: sign.board_abdomen, band: often }
  - f: sign.peritoneal_signs
    band: { pct: 67 }
    note: "WSES 2020: местный или разлитой перитонит — только у двух третей больных; в 277_2 (раздел 1.6) — 98 % для симптомов раздражения брюшины в первый час и 35–50 % для симптомов перитонита: источники расходятся, взято WSES"
  - f: sign.liver_dullness_loss
    band: { pct: 37 }
    note: "277_2, раздел 1.6: исчезновение печёночной тупости (симптом Кларка) и высокий тимпанит над печенью (симптом Спижарного) — 37 %"
  - { f: hx.ulcer, band: often }
  - { f: vital.tachycardia, band: sometimes }
  - { f: vital.tachycardia, band: usually, stages: [late] }
  - { f: vital.fever, band: rarely }
  - { f: vital.fever, band: often, stages: [late] }
  - { f: lab.wbc_high, band: often }
  - f: img.xr_free_gas
    band: { pct: 100 }
    note: "газ выходит в живот у каждого больного с прободением; виден ли он на снимке — чувствительность обследования (277_2, раздел 2.4, и WSES 2020: 30–85 %)"
confirm: [exam.xray_abdomen]
redFlags: [sym.dagger_pain, sign.board_abdomen, sign.peritoneal_signs]
treatment:
  # предоперационная подготовка — коррекция органной дисфункции, при сепсисе — до среднего
  # давления выше 65 мм рт. ст. и нормального лактата (277_2, раздел 3.5)
  supportive: [tx.iv_fluids]
  # консервативное лечение не рекомендуется (277_2, раздел 3.5)
  notIndicated: [tx.ppi, tx.antacid, tx.amoxicillin, tx.amoxicillin_clavulanate, tx.cephalosporin_oral, tx.fluoroquinolone, tx.macrolide, tx.drotaverine]
  setting: { default: surgery }
texts:
  summary:
    ru: >-
      Сквозное разрушение стенки желудка или двенадцатиперстной кишки в зоне язвы: содержимое
      изливается в живот. Внезапная «кинжальная» боль под ложечкой, живот напряжён как доска,
      больной лежит неподвижно, подтянув колени. На снимке стоя — газ под куполом диафрагмы.
      Лечение — экстренная операция: отверстие ушивают как можно раньше.
pearls:
  - ru: "Нет газа на снимке — прободение не исключено: снимок находит его не у каждого."
  - ru: "Каждый час до операции снижает шанс выжить: диагноз и подготовку не затягивают."
simplified: "Прикрытой и атипичной перфорации, КТ, ЭГДС и поиска газа на УЗИ в игре пока нет. Смертность по шкале Boey — только по давности перфорации, без давления при поступлении и сопутствующих болезней."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.3: 17,1 на 100 тыс. в год, мужчин и женщин 2:1, больше молодых и среднего возраста; раздел 1.6: признаки и их частоты; раздел 2.4: обзорный снимок стоя — всем, точность 30–85 %, отрицательный снимок перфорацию не исключает; раздел 3.5: экстренная операция; Прил. Г8: шкала J. Boey; частоты без пояснений — черновик" }
  - { kind: guideline, title: "Tarasconi A et al. Perforated and bleeding peptic ulcer: WSES guidelines. World J Emerg Surg 2020;15:3", url: "https://pubmed.ncbi.nlm.nih.gov/31921329/", note: "PMID 31921329, PMC6947898, сверено 29.09.2026: боль начинается внезапно; перитонит — только у двух третей больных; свободный газ на снимке — у 30–85 %" }
  - { kind: guideline, title: "Острая неопухолевая кишечная непроходимость", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/327_3", note: "ID 327_3, опубликованы 06.12.2024, применяются; сверено с рубрикатором 29.09.2026; термины: экстренная операция выполняется в течение 2 часов после госпитализации" }
review: draft
