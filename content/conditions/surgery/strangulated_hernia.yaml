id: cond.strangulated_hernia
name: { ru: "Ущемлённая паховая грыжа" }
icd10: K40.3
department: dept.surgery
system: digestive
kind: disease
severity: critical
epidemiology:
  # доля среди пришедших — игровая оценка: с ущемлённой паховой грыжей в 2022 г. в России
  # госпитализировано более 24 тыс. (684_2, раздел 1.3) — примерно в шесть раз реже аппендицита
  prevalence: very_rare
  # паховые грыжи — у мужчин в 82,6 %, чаще старше 40 лет (684_2, раздел 1.3)
  age: { min: 18, peak: [40, 100] }
  sex: { m: 1, f: 0.21 }
params:
  # при поступлении непроходимость кишечника — у 14,3 % (Ge 2010)
  obstruction: { no: 857, yes: 143 }
course:
  stages:
    - { id: early, days: [0, 1] }
  presentation: [0, 0]
  # неликвидированное ущемление за несколько часов ведёт к некрозу; консервативное лечение не
  # рекомендуется (684_2, разделы 1.2 и 3.1)
  untreated: { band: always, days: [0, 1] }
  # после экстренной пластики по Лихтенштейну — 3,8 ± 2,1 дня (Lohsiriwat 2007)
  stay: [2, 6]
# экстренная операция в возможно короткий срок от поступления (684_2, раздел 3.2); экстренная — в
# течение 2 ч после госпитализации (327_3, термины)
surgery: { tx: tx.hernia_repair, window: 2 }
findings:
  # внезапная постоянная боль в области грыжи и её невправимость — главное (684_2, разделы 1.6 и 2.1)
  - { f: sym.groin_bulge, band: always }
  - f: sign.hernia_strangulated
    band: { pct: 100 }
    note: "ущемлённая грыжа есть у каждого больного; найдёт ли её врач — чувствительность осмотра (684_2, раздел 2.2: 74,5–92 %)"
  - { f: sym.abdominal_pain, band: often }
  # ущемляется чаще ранее свободно вправлявшаяся грыжа (684_2, раздел 1.6)
  - { f: hx.hernia, band: usually }
  - { f: sym.nausea, band: sometimes }
  - { f: sym.vomiting, band: rarely }
  # с непроходимостью — схваткообразные боли, повторная рвота, не отходят стул и газы (684_2, раздел 1.6)
  - { f: sym.vomiting, band: usually, when: { obstruction: [yes] } }
  - { f: sym.no_stool_gas, band: usually, when: { obstruction: [yes] } }
  - f: img.xr_bowel_levels
    band: { pct: 100 }
    when: { obstruction: [yes] }
    note: "непроходимость есть у каждого больного с ней; видна ли она на снимке — чувствительность обследования (327_3, раздел 2.4: 50–60 %)"
  - f: sign.peritoneal_signs
    band: { pct: 3.8 }
    note: "Ge 2010 (PMID 20012331): явный перитонит при поступлении — у 3,8 %"
  - { f: vital.tachycardia, band: sometimes }
  - { f: lab.wbc_high, band: sometimes }
# с типичными симптомами грыжи достаточно клинического обследования (684_2, раздел 2.2)
confirm: clinical
redFlags: [sign.hernia_strangulated, sign.peritoneal_signs]
treatment:
  # консервативное лечение ущемлённой грыжи не рекомендуется, вправлять недопустимо (684_2, разделы 2.2 и 3.1)
  notIndicated: [tx.drotaverine, tx.ibuprofen, tx.paracetamol]
  setting: { default: surgery }
texts:
  summary:
    ru: >-
      Сдавление органов живота — чаще петли тонкой кишки или сальника — в узких воротах паховой
      грыжи. Выпячивание в паху, которое раньше уходило само, вдруг перестало вправляться, стало
      напряжённым и болезненным, кашлевого толчка в нём нет. За несколько часов ущемлённая кишка
      может омертветь: нужна экстренная операция, вправлять нельзя.
pearls:
  - ru: "У больного с непроходимостью кишечника осматривают все грыжевые ворота и рубцы: ущемлённую грыжу легко пропустить."
  - ru: "Грыжа вправилась сама — всё равно в хирургию: вправление бывает ложным."
simplified: "Бедренной, пупочной и послеоперационной грыжи отдельно нет. Омертвения кишки и её удаления в игре пока нет — они входят в долю осложнений операции."
sources:
  - { kind: guideline, title: "Паховая и бедренная грыжа", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/684_2", note: "ID 684_2, опубликованы 18.10.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: без устранения ущемления — некроз за несколько часов; раздел 1.3: 82,6 % паховых грыж — у мужчин, чаще старше 40 лет, с ущемлённой паховой грыжей в 2022 г. госпитализировано более 24 тыс.; разделы 1.6 и 2.1: признаки; раздел 2.2: осмотр — чувствительность 74,5–92 %, специфичность 93 %, вправлять недопустимо, даже вправившуюся — в стационар; разделы 3.1 и 3.2: консервативное лечение не рекомендуется, экстренная операция; частоты без пояснений — черновик" }
  - { kind: guideline, title: "Острая неопухолевая кишечная непроходимость", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/327_3", note: "ID 327_3, опубликованы 06.12.2024, применяются; сверено с рубрикатором 29.09.2026; термины: экстренная операция — в течение 2 часов после госпитализации; раздел 2.2: всем с непроходимостью — осмотр всех грыжевых ворот и рубцов; раздел 2.4: снимок находит тонкокишечную непроходимость у 50–60 %" }
  - { kind: paper, title: "Ge BJ, Huang Q, Liu LM, Bian HP, Fan YZ. Risk factors for bowel resection and outcome in patients with incarcerated groin hernias. Hernia 2010;14(3):259–264", url: "https://pubmed.ncbi.nlm.nih.gov/20012331/", note: "PMID 20012331, сверено 29.09.2026: 182 больных; непроходимость при поступлении — 14,3 %, явный перитонит — 3,8 %, резекция кишки — 15,4 %" }
  - { kind: paper, title: "Lohsiriwat V et al. Surgical outcomes of Lichtenstein tension-free hernioplasty for acutely incarcerated inguinal hernia. Surg Today 2007;37(3):212–214", url: "https://pubmed.ncbi.nlm.nih.gov/17342359/", note: "PMID 17342359, сверено 29.09.2026: в стационаре 3,8 ± 2,1 дня" }
review: draft
