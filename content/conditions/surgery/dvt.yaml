id: cond.dvt
name: { ru: "Тромбоз глубоких вен ноги" }
# бедренная вена — I80.1, другие глубокие вены ноги — I80.2 (960_1, раздел 1.4); одна запись на все
# уровни — I80.2
icd10: I80.2
department: dept.surgery
system: heart
kind: disease
severity: serious
epidemiology:
  # изолированный ТГВ — 45–117 на 100 000 в год (960_1, раздел 1.3); с факторами риска в игре —
  # около 1 % пришедших в приёмное: игровая оценка
  prevalence: rare
  # чаще с возрастом; у мужчин 130, у женщин 110 на 100 000 (раздел 1.3); рекомендации — для
  # взрослых; пик — игровая оценка
  age: { min: 18, peak: [50, 85] }
  sex: { m: 1.2, f: 1 }
  # во сколько раз растёт риск (раздел 1.3): операция — в 4–6, иммобилизация — в 2–4, травма — в 20,
  # рак — в 4–7, беременность — в 4, дальние поездки — в 2–3; варикоз и ожирение — без веса, 1,5 —
  # игровая оценка; тромбоз в прошлом — рецидив 4–7 % в год (раздел 3.2.3.2) против 0,1 % впервые:
  # 15 — игровая оценка
  risks:
    - { id: risk.cancer_active, x: 5 }
    - { id: risk.bed_rest, x: 5 }
    - { id: risk.leg_cast, x: 4 }
    - { id: risk.prior_dvt, x: 15 }
    - { id: risk.pregnancy, x: 4 }
    - { id: risk.travel, x: 2.5 }
    - { id: risk.obesity, x: 1.5 }
    - { id: risk.varicose, x: 1.5 }
params:
  # дистальный — до 50 % всех ТГВ (раздел 1.6); бедренно-подколенный и подвздошно-бедренный — 40 и 15,
  # игровая оценка
  level: { distal: 45, femoropopliteal: 40, iliofemoral: 15 }
  side: { right: 1, left: 1 }
  # тромбофлебит подкожной вены вместе с ТГВ: у больных тромбофлебитом ТГВ находят у 18–25 % (668_2,
  # разделы 1.2–1.3); у каждого третьего с ТГВ в игре — и тяж: тогда ТГВ примерно у пятой части
  # пришедших с тяжом — игровая оценка
  surface: { no: 2, yes: 1 }
course:
  stages:
    - { id: acute, days: [0, 90] }
  # приходят в первую неделю: частот нет — игровая оценка
  presentation: [1, 7]
  # риск прогрессирования максимален в первую неделю (раздел 3.2.2); ТЭЛА у нелеченых в тексте не
  # дана — «часто» за 3–21 день, игровая оценка
  untreated: { band: often, days: [3, 21] }
  # в палате — беременные: койко-дней в тексте нет, игровая оценка
  stay: [5, 10]
findings:
  - f: sym.leg_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "с болью или отёком ноги приходят все: бессимптомный тромбоз находят при обследовании, а не в приёмном"
  # признаки — раздел 2.1–2.2 и шкала Уэллса (прил. Г1); частот нет — полосы игровые, кроме Хоманса
  - { f: sign.deep_vein_tenderness, band: often }
  # отёк всей ноги — при высоком тромбозе (раздел 1.6: от лодыжки до паха); голень — самый ценный
  # признак (раздел 2.1)
  - { f: sign.leg_swollen_whole, band: usually, when: { level: [iliofemoral] } }
  - { f: sign.leg_swollen_whole, band: sometimes, when: { level: [femoropopliteal] } }
  - { f: sign.calf_swelling_3cm, band: usually, when: { level: [femoropopliteal, iliofemoral] } }
  - { f: sign.calf_swelling_3cm, band: often, when: { level: [distal] } }
  - { f: sign.pitting_edema, band: often }
  - { f: sign.collateral_veins, band: often, when: { level: [iliofemoral] } }
  - { f: sign.collateral_veins, band: rarely, when: { level: [distal, femoropopliteal] } }
  - f: sign.homans
    band: { pct: 56 }
    note: "960_1, раздел 1.6: частота выявления симптома Хоманса — 56 %"
  - { f: sign.calf_muscle_tenderness, band: rarely }
  - { f: hx.calf_snap, band: very_rarely }
  - f: sign.superficial_cord
    band: { pct: 100 }
    when: { surface: [yes] }
    note: "тромбофлебит вместе с ТГВ: тяж есть у каждого такого больного — найдёт ли его врач, точность осмотра"
  # тромбофлебит, перешедший на глубокие вены, — чаще на варикозных венах и через ствол подкожной
  # вены и соустье (668_2, разделы 1.2, 3.1.1): у такого ТГВ варикоз, ствол и соустье — как у
  # тромбофлебита высокого риска; полосы — игровые
  - { f: sign.varicose_veins, band: often, when: { surface: [yes] } }
  - { f: img.us_saphenous_trunk, band: often, when: { surface: [yes] } }
  - { f: img.us_near_junction, band: sometimes, when: { surface: [yes] } }
  - f: lab.d_dimer_high
    band: { pct: 96 }
    note: "Stein 2004: чувствительность D-димера (ELISA) при ТГВ — 0,96"
  # УЗИ: что видно по уровню тромба — точность у обследования
  - f: img.us_dvt_calf
    band: { pct: 100 }
    when: { level: [distal] }
    note: "дистальный тромбоз — тромб в венах голени у каждого"
  - f: img.us_dvt_prox
    band: { pct: 100 }
    when: { level: [femoropopliteal, iliofemoral] }
    note: "проксимальный тромбоз — тромб в подколенной, бедренной или подвздошной вене у каждого"
  - f: img.us_dvt_iliac
    band: { pct: 100 }
    when: { level: [iliofemoral] }
    note: "подвздошно-бедренный тромбоз — тромб выше паховой складки у каждого"
  - f: img.us_superficial_thrombus
    band: { pct: 100 }
    when: { surface: [yes] }
    note: "тромбофлебит вместе с ТГВ — тромб и в подкожной вене"
  # тахикардия — признак ТЭЛА (раздел 2.5); ТЭЛА в игре нет — «редко», игровая оценка
  - { f: vital.tachycardia, band: rarely }
confirm: [exam.us_leg_veins]
treatment:
  # всем с ТГВ — антикоагулянт (критерий качества 5): ПОАК — первая линия (960_1, раздел 3.2.5.2, УУР
  # В), НМГ и фондапаринукс натрия — допустимы (раздел 3.2.5.1); компрессия с первых суток (раздел
  # 3.11, критерий 6); активный режим, не постельный (раздел 4); АСК вместо антикоагулянта — нет
  # (раздел 3.2.3.6, УУР В)
  firstLine: [tx.doac]
  acceptable: [tx.lmwh, tx.fondaparinux]
  supportive: [tx.compression, tx.paracetamol]
  notIndicated: [tx.aspirin_acs, tx.bed_rest, tx.amoxicillin_clavulanate]
  plan: [tx.doac, tx.compression]
  byParam:
    # подвздошно-бедренный с давностью до 28 дней — ранняя дезобструкция (раздел 3.4.2, УУР А);
    # перед ней — в/в НФГ или п/к НМГ (раздел 3.2.5.2, УУР С); дома — только ниже паховой связки
    # (прил. В): перевод в сосудистый центр, НМГ — до приезда скорой
    - when: { level: [iliofemoral] }
      firstLine: [tx.lmwh]
      acceptable: [tx.doac, tx.fondaparinux]
      plan: [tx.lmwh, tx.compression]
      preHospital: [tx.lmwh]
  # большинство лечат дома (раздел 6; раздел 3.1.1, УУР А); беременных — в стационар (разделы
  # 3.8.1.3, 6), ПОАК у них противопоказаны — НМГ
  setting:
    default: home
    param: { name: level, map: { distal: home, femoropopliteal: home, iliofemoral: transfer } }
    risks:
      - { id: risk.pregnancy, setting: ward }
texts:
  summary:
    ru: >-
      Тромб в глубокой вене голени, бедра или таза. Нога болит и распирает, голень толще другой,
      бывает отёк всей ноги. Вероятность считают шкалой Уэллса: два балла и больше — сразу УЗИ вен,
      меньше — D-димер, и только повышенный ведёт на УЗИ. Диагноз ставит УЗИ: вена не сжимается
      датчиком. Лечат дома антикоагулянтом — не меньше 3 месяцев — и компрессионным трикотажем;
      постельный режим не нужен. Тромб выше паховой складки — перевод в сосудистый центр, беременную —
      в стационар.
pearls:
  - ru: "Шкала Уэллса меньше двух — сначала D-димер: в норме тромбоза нет, УЗИ можно не делать. Два балла и больше — сразу УЗИ, D-димер не нужен."
  - ru: "D-димер тромбоз исключает, но не доказывает: повышен он и после травмы, и у пожилых, и при тромбофлебите."
  - ru: "Симптом Хоманса ничего не решает: он положителен у половины больных с тромбом и у двух третей без него."
  - ru: "Вместо антикоагулянта ацетилсалициловую кислоту не назначают, постельный режим не нужен: гулять можно сразу."
simplified: "ТГВ в игре — на ноге, у взрослого, без ТЭЛА: одышки, боли в груди и кровохарканья нет. Повторного УЗИ через неделю, ТГВ руки, катетерных тромбозов и выбора длительности лечения нет; шкала Уэллса — без пункта «другой диагноз столь же вероятен»."
sources:
  - { kind: guideline, title: "Тромбоз глубоких вен конечностей", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/960_1", note: "ID 960_1, опубликованы 10.11.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.3: ТГВ 45–117 на 100 000 в год, у мужчин чаще, растёт с возрастом, веса факторов риска; раздел 1.6: дистальный — до 50 %, тяжелее всего подвздошно-бедренный; раздел 2: диагноз — симптомы и УЗИ; прил. Г1: шкала Уэллса, ≥ 2 — вероятен (28 %), ≤ 1 — маловероятен (5,5 %); раздел 2.3: при низкой вероятности — D-димер; раздел 2.4: УЗИ с компрессией; раздел 3.2.5: ПОАК — первая линия; раздел 3.3.3.5: не меньше 3 месяцев; раздел 3.4.2: подвздошно-бедренный до 28 дней — дезобструкция; раздел 3.11: компрессия; раздел 4: активный режим; раздел 6: большинство — амбулаторно, беременные — в стационар; прил. В: дома — только ниже паховой связки; критерии качества 1–6; частоты признаков, доли уровней и исход без лечения не даны — игровые" }
  - { kind: paper, title: "Wells PS, Anderson DR, Rodger M, Forgie M, Kearon C, Dreyer J, Kovacs G, Mitchell M, Lewandowski B, Kovacs MJ. Evaluation of D-dimer in the diagnosis of suspected deep-vein thrombosis. N Engl J Med 2003;349(13):1227–1235", url: "https://pubmed.ncbi.nlm.nih.gov/14507948/", note: "PMID 14507948, сверено 30.09.2026: 1096 амбулаторных пациентов с подозрением на ТГВ, распространённость ТГВ или ТЭЛА — 15,7 %; «маловероятен» по шкале и отрицательный D-димер — УЗИ не нужно, ВТЭО за 3 месяца — 0,4 %; без УЗИ обошлись 39 %" }
  - { kind: paper, title: "Stein PD, Hull RD, Patel KC, Olson RE, Ghali WA, Brant R, Biel RK, Bharadia V, Kalra NK. D-dimer for the exclusion of acute venous thrombosis and pulmonary embolism: a systematic review. Ann Intern Med 2004;140(8):589–602", url: "https://pubmed.ncbi.nlm.nih.gov/15096330/", note: "PMID 15096330, сверено 30.09.2026: при ТГВ чувствительность ELISA — 0,96, отношение правдоподобия положительного результата — 1,5–2,5" }
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; разделы 1.2–1.3: у больных тромбофлебитом ТГВ находят у 18,1–24,6 %; раздел 1.5.4: тромб перешёл на глубокие вены — диагноз ТГВ" }
review: draft
