id: cond.paraproctitis
name: { ru: "Острый парапроктит" }
icd10: K61
department: dept.surgery
system: digestive
kind: disease
severity: serious
epidemiology:
  # 16,1–20,2 на 100 тыс. взрослых в год (185_3, раздел 1.3) — как ущемлённая паховая грыжа;
  # доля среди пришедших — игровая оценка
  prevalence: very_rare
  age: { min: 18 }
  # мужчин — 70,3 % (NSQIP 2015–2020, 10 240 больных; в 185_3 пола нет)
  sex: { m: 1, f: 0.42 }
params:
  # подкожный и подслизистый — чаще всего, больше чем у половины (185_3, прил. В); 60 на 40 —
  # игровая оценка
  depth: { superficial: 60, deep: 40 }
course:
  stages:
    - { id: abscess, days: [0, 5] }
  # глубокий развивается дольше: неопределённые признаки — до 12 суток (185_3, раздел 1.6); с
  # какого дня приходят — игровая оценка
  presentation: [1, 4]
  # без вскрытия гной распространяется, образуется свищ (185_3, прил. В); на какой день хуже —
  # игровая оценка
  untreated: { band: usually, days: [1, 3] }
  # срока стационара в тексте нет — игровая оценка
  stay: [3, 6]
# вскрытие и дренирование — всем, в ближайшие часы после верификации диагноза (185_3, разделы 3.1,
# 3.2 и 6); часов в тексте нет — 12 ч, игровая оценка
surgery: { tx: tx.abscess_drainage, window: 12 }
findings:
  # боль у заднего прохода и в промежности, сильнее сидя и при дефекации (185_3, разделы 1.6 и 2.1)
  - { f: sym.perianal_pain, band: always }
  # подкожный — плотный болезненный инфильтрат с гиперемией; при глубоком местно почти ничего
  # (185_3, раздел 1.6 и прил. В)
  - { f: sign.perianal_infiltrate, band: always, when: { depth: [superficial] } }
  - { f: sign.perianal_infiltrate, band: rarely, when: { depth: [deep] } }
  # глубокий находит пальцевое исследование: выбухание, болезненность стенки (185_3, раздел 2.2)
  - { f: sign.rectal_bulge, band: usually, when: { depth: [deep] } }
  - { f: sign.rectal_bulge, band: sometimes, when: { depth: [superficial] } }
  # поверхностный — субфебрилитет, интоксикации чаще нет; глубокий — лихорадка, озноб, слабость
  # (185_3, раздел 1.6)
  - { f: vital.fever, band: sometimes, when: { depth: [superficial] } }
  - { f: vital.fever, band: usually, when: { depth: [deep] } }
  - { f: sym.chills, band: often, when: { depth: [deep] } }
  - { f: sym.fatigue, band: often, when: { depth: [deep] } }
  - { f: vital.tachycardia, band: sometimes, when: { depth: [deep] } }
  # затруднение дефекации (185_3, раздел 2.1)
  - { f: sym.constipation, band: sometimes }
  # при обширном воспалении — лейкоцитоз (185_3, раздел 2.3)
  - { f: lab.wbc_high, band: often }
# в большинстве случаев диагноз — по осмотру, инструментальная диагностика не нужна (185_3, раздел 2.4)
confirm: clinical
treatment:
  # антибиотики — при значительной распространённости, сепсисе, иммунодефиците (185_3, раздел 3.1);
  # об обезболивании до операции в тексте ничего нет
  acceptable: [tx.amoxicillin_clavulanate]
  # экстренная госпитализация для операции в ближайшие часы (185_3, раздел 6)
  setting: { default: surgery }
texts:
  summary:
    ru: >-
      Гнойное воспаление клетчатки рядом с прямой кишкой: инфекция из анальной железы. Боль у
      заднего прохода, сильнее сидя и при опорожнении кишки, температура. Подкожный гнойник видно
      и можно нащупать; глубокий находит только пальцевое исследование прямой кишки. Лечение —
      операция в ближайшие часы: гнойник вскрывают и дренируют.
pearls:
  - ru: "Боль у заднего прохода с температурой — осмотрите промежность и исследуйте прямую кишку пальцем: глубокий гнойник снаружи не виден."
  - ru: "Антибиотики гнойник не лечат: нужно вскрытие."
simplified: "Формы парапроктита в игре две — поверхностная и глубокая; анаэробного парапроктита, УЗИ и МРТ промежности, свищей после операции нет."
sources:
  - { kind: guideline, title: "Острый парапроктит", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/185_3", note: "ID 185_3, опубликованы 02.08.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.3: 16,1–20,2 на 100 тыс. взрослых; раздел 1.6 и прил. В: формы, подкожный — чаще всего; раздел 2.1: жалобы; раздел 2.2: осмотр и пальцевое исследование; раздел 2.4: инструментальная диагностика обычно не нужна; разделы 3.1–3.2 и 6: вскрытие и дренирование — всем, в ближайшие часы; частоты без пояснений — черновик" }
  - { kind: paper, title: "Khan MTA, Patnaik R, Huang JY, Campi HD, Montorfano L, De Stefano F, Rosenthal RJ, Wexner SD. Leukopenia is an independent risk factor for early postoperative complications following incision and drainage of anorectal abscess. Colorectal Dis 2023;25(4):717–727", url: "https://pubmed.ncbi.nlm.nih.gov/36550093/", note: "PMID 36550093, сверено 29.09.2026: 10 240 больных после вскрытия аноректального абсцесса (ACS-NSQIP 2015–2020), мужчин — 70,3 %" }
review: draft
