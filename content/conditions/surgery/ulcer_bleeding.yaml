id: cond.ulcer_bleeding
name: { ru: "Язвенное кровотечение" }
icd10: K27.4
department: dept.surgery
system: digestive
kind: disease
severity: critical
epidemiology:
  # доля среди пришедших — игровая оценка: в 2022 г. в России госпитализировано 47 483 больных
  # (277_2, раздел 1.3) — примерно вдвое больше, чем с прободной язвой
  prevalence: very_rare
  age: { min: 18 }
  # язвенной болезнью за жизнь заболевают 11–14 % мужчин и 8–11 % женщин (277_2, раздел 1.3) — середины
  sex: { m: 1, f: 0.76 }
course:
  stages:
    - { id: early, days: [0, 2] }
  presentation: [0, 0]
  # без остановки через эндоскоп кровотечение продолжается или повторяется — доля и срок в тексте не
  # названы, игровая оценка
  untreated: { band: usually, days: [0, 1] }
findings:
  # главные признаки — рвота кровью или «кофейной гущей» (чаще при язве желудка) и мелена (чаще при
  # язве двенадцатиперстной кишки) (277_2, раздел 1.6); частот в тексте нет — полосы
  - { f: sym.hematemesis, band: usually }
  - { f: sym.melena, band: usually }
  # общие признаки кровопотери: слабость, головокружение, холодный липкий пот, тахикардия; бледность
  # (277_2, разделы 1.6 и 2.2)
  - { f: sym.fatigue, band: usually }
  - { f: sym.dizziness, band: often }
  - { f: sym.sweating, band: sometimes }
  - { f: sign.pallor, band: often }
  - { f: vital.tachycardia, band: often }
  # боль в момент кровотечения обычно внезапно проходит (277_2, раздел 1.6)
  - { f: sym.epigastric_pain, band: sometimes }
  - { f: sym.nausea, band: sometimes }
  - { f: hx.ulcer, band: often }
  # в первые часы гемоглобин может ещё не снизиться (277_2, раздел 2.3)
  - { f: lab.hb_low, band: sometimes }
confirm: clinical
redFlags: [sym.hematemesis, sym.melena]
treatment:
  # при нестабильной гемодинамике — сбалансированные солевые растворы, при немассивной кровопотере —
  # инфузия рестриктивная (277_2, раздел 3.2)
  supportive: [tx.iv_fluids]
  # ИПН всем — в вену, до ЭГДС уменьшает потребность в эндоскопическом гемостазе (277_2, раздел 3.2);
  # в игре ИПН — таблетки, поэтому «допустимо», а не первая линия
  acceptable: [tx.ppi]
  # при кровотечении НПВП отменяют (277_2, раздел 3.3)
  harmful: [tx.ibuprofen]
  notIndicated: [tx.antacid, tx.drotaverine, tx.amoxicillin, tx.amoxicillin_clavulanate, tx.cephalosporin_oral, tx.fluoroquinolone, tx.macrolide]
  # ЭГДС и остановка кровотечения через эндоскоп — в первые 2 ч от госпитализации (277_2, раздел 3.3);
  # всех с кровотечением направляют туда, где эндоскопия есть круглосуточно (277_2, раздел 6)
  setting: { default: transfer }
texts:
  summary:
    ru: >-
      Кровотечение из язвы желудка или двенадцатиперстной кишки: язва разъедает сосуд в своём дне.
      Рвота кровью или «кофейной гущей», чёрный дёгтеобразный стул, слабость, головокружение,
      бледность, частый пульс; боль при этом часто стихает. Нужна эндоскопия в первые два часа от
      поступления: через эндоскоп кровотечение и останавливают. Где эндоскопии нет — перевод.
pearls:
  - ru: "Чёрный стул бывает и от препаратов железа, висмута и активированного угля: спросите, что принимал."
  - ru: "Боль, стихшая вместе с рвотой кровью, — не улучшение: так начинается кровотечение."
simplified: "Эндоскопии в игре пока нет, поэтому больных с кровотечением переводят. Низкого давления в игре пока нет: о кровопотере говорят пульс и бледность. Шкал тяжести кровопотери и риска повторного кровотечения нет."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 29.09.2026; раздел 1.3: 47 483 госпитализации в 2022 г., общая летальность 5,87 %; разделы 1.6 и 2.2: признаки кровопотери, рвота «кофейной гущей», мелена, боль стихает; раздел 2.3: гемоглобин в первые часы может не измениться; раздел 2.5: чёрный стул от препаратов железа, висмута, активированного угля; раздел 3.2: инфузия, ИПН в вену; раздел 3.3: ЭГДС и остановка кровотечения в первые 2 ч, НПВП отменяют; раздел 6: куда направлять; частоты признаков — черновик" }
review: draft
