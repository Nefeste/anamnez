id: cond.ulcer_bleeding
name: { ru: "Язвенное кровотечение" }
icd10: K27.4
department: dept.surgery
system: digestive
kind: disease
severity: critical
# кровотечение из верхних отделов ЖКТ (spec 2026-10-chapter-4, часть 53а): язва и разрыв слизистой — одна группа, источник
# различает ЭГДС
group: grp.ugi_bleeding
epidemiology:
  # доля среди пришедших — игровая оценка: в 2022 г. в России госпитализировано 47 483 больных
  # (277_2, раздел 1.3) — примерно вдвое больше, чем с прободной язвой
  prevalence: very_rare
  age: { min: 18 }
  # язвенной болезнью за жизнь заболевают 11–14 % мужчин и 8–11 % женщин (277_2, раздел 1.3) — середины
  sex: { m: 1, f: 0.76 }
# что видно в дне язвы на ЭГДС (spec 2026-10-chapter-4, часть 53а; 277_2, приложение Г5): продолжается (F1a–b), сосуд или
# сгусток (F2a–b), плоские пятна или чистое дно (F2c–F3); долей по классам в 277_2 нет — игровая оценка. Шок — тяжёлая
# кровопотеря (верхнее давление ниже 90, пульс чаще 100: 277_2, раздел 2.2, приложение Г1); его доля — тоже игровая
params:
  forrest: { active: 15, stigmata: 30, low: 55 }
  shock: { yes: 20, no: 80 }
course:
  stages:
    - { id: early, days: [0, 2] }
  presentation: [0, 0]
  # без остановки через эндоскоп кровотечение продолжается или повторяется — доля и срок в тексте не
  # названы, игровая оценка
  untreated: { band: usually, days: [0, 1] }
findings:
  # главные признаки — рвота кровью или «кофейной гущей» (чаще при язве желудка) и мелена (чаще при
  # язве двенадцатиперстной кишки) (277_2, раздел 1.6); частот в тексте нет — полосы
  - { f: sym.hematemesis, band: usually }
  - { f: sym.melena, band: usually }
  # общие признаки кровопотери: слабость, головокружение, холодный липкий пот, тахикардия; бледность
  # (277_2, разделы 1.6 и 2.2)
  - { f: sym.fatigue, band: usually }
  - { f: sym.dizziness, band: often }
  - { f: sym.sweating, band: sometimes }
  - { f: sign.pallor, band: often }
  - { f: vital.tachycardia, band: often }
  # боль в момент кровотечения обычно внезапно проходит (277_2, раздел 1.6)
  - { f: sym.epigastric_pain, band: sometimes }
  - { f: sym.nausea, band: sometimes }
  - { f: hx.ulcer, band: often }
  # в первые часы гемоглобин может ещё не снизиться (277_2, раздел 2.3)
  - { f: lab.hb_low, band: sometimes }
  # ЭГДС (spec 2026-10-chapter-4, часть 53а; 277_2, раздел 2.4, приложение Г5): источник — язва; что в её дне — класс
  # Форреста. Они — по определению у каждого: пропустить их может только сама ЭГДС
  - { f: img.egd_ulcer, band: { pct: 100 }, note: "источник кровотечения — язва: её и находит ЭГДС (277_2, раздел 2.4)" }
  - { f: img.egd_bleeding, band: { pct: 100 }, when: { forrest: [active] }, note: "F1a–b — продолжающееся кровотечение: так класс и определён (277_2, приложение Г5)" }
  - { f: img.egd_stigmata, band: { pct: 100 }, when: { forrest: [stigmata] }, note: "F2a–b — сосуд или сгусток в дне язвы: так класс и определён (277_2, приложение Г5)" }
  # шок — тяжёлая кровопотеря по Горбашко: верхнее давление ниже 90, пульс чаще 100 (277_2, раздел 2.2, приложение Г1);
  # давление ниже 90 — по определению у каждого
  - { f: vital.bp_low, band: { pct: 100 }, when: { shock: [yes] }, note: "шок в игре — тяжёлая кровопотеря по Горбашко: верхнее давление ниже 90 (277_2, приложение Г1)" }
  - { f: vital.tachycardia, band: always, when: { shock: [yes] } }
confirm: clinical
redFlags: [sym.hematemesis, sym.melena]
treatment:
  # ИПН всем — в вену при поступлении, до ЭГДС уменьшают нужду в гемостазе (277_2, раздел 3.2); таблетки — допустимо
  firstLine: [tx.ppi_iv]
  acceptable: [tx.ppi]
  # при нестабильной гемодинамике — сбалансированные солевые растворы, при немассивной кровопотере — инфузия рестриктивная
  # (277_2, раздел 3.2)
  supportive: [tx.iv_fluids]
  # при кровотечении НПВП отменяют, антитромботические — прекращают (277_2, разделы 3.3 и 3.5, УУР A, УДД 1)
  harmful: [tx.ibuprofen, tx.aspirin_acs, tx.clopidogrel, tx.doac, tx.lmwh, tx.enoxaparin_acs, tx.heparin_iv, tx.fondaparinux]
  notIndicated: [tx.antacid, tx.drotaverine, tx.amoxicillin, tx.amoxicillin_clavulanate, tx.cephalosporin_oral, tx.fluoroquinolone, tx.macrolide]
  byParam:
    # продолжается (F1a–b) — остановка через эндоскоп, сосуд или сгусток (F2a–b) — профилактика рецидива; плоские пятна и
    # чистое дно (F2c–F3) — эндоскопическая профилактика не рекомендуется (277_2, раздел 3.3, УУР C, УДД 5)
    - when: { forrest: [active, stigmata] }
      require: [tx.endoscopic_hemostasis]
    - when: { forrest: [low] }
      notIndicated: [tx.endoscopic_hemostasis]
    # шок — растворы обязательны (277_2, раздел 3.2: сбалансированные солевые при нестабильной гемодинамике)
    - when: { shock: [yes] }
      require: [tx.iv_fluids]
  # «в хирургический стационар или ОРИТ» (277_2, раздел 6); при шоке — интенсивная терапия (раздел 3.2: перевод по
  # стратификации, шоковый индекс выше 0,8), без шока ПИТ — не ошибка: лечение «целесообразно начинать в отделении
  # интенсивной терапии» (раздел 3.5). Эндоскопия должна быть круглосуточной (раздел 6): где эндоскопического кабинета
  # нет — перевод
  setting:
    default: ward
    param: { name: shock, map: { yes: icu, no: ward } }
    also:
      - { when: { shock: ['no'] }, settings: [icu] }
    without: { rooms: [room.endoscopy], setting: transfer }
texts:
  summary:
    ru: >-
      Кровотечение из язвы желудка или двенадцатиперстной кишки: язва разъедает сосуд в своём дне.
      Рвота кровью или «кофейной гущей», чёрный дёгтеобразный стул, слабость, головокружение,
      бледность, частый пульс; боль при этом часто стихает. ЭГДС — в первые два часа от поступления:
      если кровь идёт или в дне язвы виден сосуд или сгусток (Форрест F1–F2b), кровотечение тут же
      останавливают через эндоскоп; плоские пятна и чистое дно (F2c–F3) — без гемостаза. Всем —
      ингибитор протонной помпы в вену, при шоке — растворы и интенсивная терапия. Где эндоскопии нет —
      перевод.
pearls:
  - ru: "Чёрный стул бывает и от препаратов железа, висмута и активированного угля: спросите, что принимал."
  - ru: "Боль, стихшая вместе с рвотой кровью, — не улучшение: так начинается кровотечение."
simplified: "Шкал Глазго-Блэтчфорда, Рокалла и AIMS65 нет: в ПИТ — при шоке. Повторного кровотечения после гемостаза, эмболизации и операции нет; переливания крови нет. Эрадикация Helicobacter pylori — с частью 53б."
sources:
  - { kind: guideline, title: "Язвенная болезнь", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/277_2", note: "ID 277_2, опубликованы 13.01.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: 47 483 госпитализации в 2022 г., общая летальность 5,87 %; разделы 1.6 и 2.2: признаки кровопотери, рвота «кофейной гущей», мелена, боль стихает; раздел 2.3: гемоглобин в первые часы может не измениться; раздел 2.5: чёрный стул от препаратов железа, висмута, активированного угля; раздел 3.2: инфузия, ИПН в вену при поступлении; раздел 3.3: ЭГДС и остановка кровотечения в первые 2 ч, по Forrest — гемостаз при F1A-B и F2A-B, при FIIC и FIII не рекомендуется; разделы 3.3 и 3.5: НПВП отменяют, антитромботические прекращают; раздел 6: хирургический стационар или ОРИТ, круглосуточная эндоскопия; приложение Г5: Forrest; доли классов Forrest и шока — игровая оценка; частоты признаков — черновик" }
review: draft
