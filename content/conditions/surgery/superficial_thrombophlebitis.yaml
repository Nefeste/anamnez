id: cond.superficial_thrombophlebitis
name: { ru: "Тромбофлебит подкожной вены ноги" }
# поверхностные сосуды нижних конечностей — I80.0 (668_2, раздел 1.4)
icd10: I80.0
department: dept.surgery
system: heart
kind: disease
severity: moderate
epidemiology:
  # 0,64 % в год в популяционном исследовании (668_2, раздел 1.3); с варикозом в игре — около 1 %
  # пришедших в приёмное: игровая оценка
  prevalence: rare
  # средний возраст 54–65 лет, у женщин чаще, растёт с возрастом (раздел 1.3); 1,67 против 1,16 на
  # 1000 в год — женщины в 1,4 раза чаще (голландское исследование, там же)
  age: { min: 18, peak: [45, 75] }
  sex: { m: 1, f: 1.4 }
  # варикоз — у до 80 % больных (раздел 1.2): при варикозе у 15–30 % взрослых это в 6 раз чаще, и
  # варикоз почти у двух третей пришедших — игровая оценка по этим числам; ожирение, рак, тромбоз в
  # прошлом — без веса (раздел 1.2), игровые
  risks:
    - { id: risk.varicose, x: 6 }
    - { id: risk.obesity, x: 1.5 }
    - { id: risk.cancer_active, x: 3 }
    - { id: risk.prior_dvt, x: 3 }
params:
  # риск перехода тромба на глубокие вены (раздел 1.5.3): только притоки — низкий, ствол дальше 3 см
  # от соустья — умеренный, 3 см и ближе — высокий; доли в тексте не даны — игровая оценка
  risk: { low: 50, moderate: 35, high: 15 }
  side: { right: 1, left: 1 }
course:
  # стадии (раздел 1.5.2): острый 0–7 дней, стихающий 1–3 недели, стихший — больше 3 недель; в игре
  # приходят в остром
  stages:
    - { id: acute, days: [0, 21] }
  presentation: [1, 5]
  # при низком риске воспаление стихает само, при умеренном и высоком без антикоагулянтов тромб
  # переходит на глубокие вены у 7–32 % (раздел 1.2) — «иногда», игровая оценка
  selfLimiting: { when: { risk: [low] } }
  untreated: { band: sometimes, days: [5, 21], when: { risk: [moderate, high] } }
findings:
  - f: sym.leg_pain
    band: { pct: 100 }
    attrs: { side: $side }
    note: "боль по ходу вены — у каждого, с ней и приходят (668_2, раздел 2.1)"
  - f: sign.superficial_cord
    band: { pct: 100 }
    note: "признаки воспаления по ходу подкожной вены — критерий диагноза (668_2, раздел 2); найдёт ли их врач — точность осмотра"
  # отёк бывает (раздел 1.6); частот признаков нет, их не изучали (раздел 2.1) — полосы игровые
  - { f: sign.calf_swelling_3cm, band: rarely }
  - { f: sign.pitting_edema, band: rarely }
  - { f: sign.deep_vein_tenderness, band: rarely }
  - { f: sign.homans, band: often }
  - { f: lab.d_dimer_high, band: usually }
  - f: img.us_superficial_thrombus
    band: { pct: 100 }
    note: "тромб в подкожной вене — у каждого, это и есть тромбофлебит; увидит ли его врач УЗД — точность обследования"
  - f: img.us_saphenous_trunk
    band: { pct: 100 }
    when: { risk: [moderate, high] }
    note: "умеренный и высокий риск — тромб в стволе подкожной вены у каждого (раздел 1.5.3)"
  - f: img.us_near_junction
    band: { pct: 100 }
    when: { risk: [high] }
    note: "высокий риск — граница тромба в 3 см от соустья или ближе у каждого (раздел 1.5.3)"
confirm: [exam.us_leg_veins]
treatment:
  # низкий риск: системные НПВП (раздел 3.0.2.1, УУР B), гель, компрессия 23–32 мм рт. ст. (раздел
  # 3.0.2.5); антибиотики рутинно не нужны (раздел 3.3.1), АСК не рекомендуется (раздел 3.3.3.6, УУР А)
  firstLine: [tx.ibuprofen]
  supportive: [tx.topical_heparin, tx.compression, tx.paracetamol]
  notIndicated: [tx.aspirin_acs, tx.amoxicillin_clavulanate, tx.amoxicillin, tx.cephalosporin_oral]
  plan: [tx.ibuprofen, tx.topical_heparin, tx.compression]
  byParam:
    # умеренный: антикоагулянты — приоритет (раздел 3.0.2.2, УУР А): фондапаринукс натрия или
    # промежуточные дозы НМГ 45 дней, #ривароксабан — если уколы нельзя
    - when: { risk: [moderate] }
      firstLine: [tx.fondaparinux]
      acceptable: [tx.lmwh, tx.doac]
      supportive: [tx.ibuprofen, tx.topical_heparin, tx.compression]
      plan: [tx.fondaparinux, tx.topical_heparin, tx.compression]
    # высокий: лечебные дозы антикоагулянтов 3 месяца, как при ТГВ (разделы 3.0.2.3, 3.0.3.2)
    - when: { risk: [high] }
      firstLine: [tx.doac]
      acceptable: [tx.lmwh, tx.fondaparinux]
      supportive: [tx.ibuprofen, tx.topical_heparin, tx.compression]
      plan: [tx.doac, tx.compression]
  # в стационар — высокий риск, если помощь дома не обеспечить, и гнойный тромбофлебит (раздел 3.0.1;
  # раздел 6); остальные — индивидуально: в игре дома
  setting: { default: home }
texts:
  summary:
    ru: >-
      Тромб в подкожной вене ноги с воспалением вокруг: по ходу вены — плотный болезненный красный
      тяж, чаще на варикозных венах. УЗИ нужно всем, обеих ног: у каждого пятого тромб уже и в
      глубоких венах, а тактику решает, где он. Только в притоках — НПВП, гель и компрессия; в стволе
      подкожной вены — антикоагулянт на 45 дней; в 3 см от впадения в глубокую вену или ближе —
      лечат как тромбоз глубоких вен, 3 месяца. Анализы, в том числе D-димер, не нужны; антибиотики —
      тоже.
pearls:
  - ru: "При тромбофлебите D-димер не делают: он повышен и так, а тактику решает УЗИ."
  - ru: "УЗИ — обеих ног и глубоких вен: у каждого пятого с тромбофлебитом уже есть тромбоз глубоких вен."
  - ru: "Верхушка тромба в 3 см от соустья или ближе — это уже как тромбоз глубоких вен: лечебные дозы антикоагулянта на 3 месяца."
  - ru: "Воспаление без гноя — не инфекция: антибиотики при тромбофлебите не нужны."
simplified: "Тромбофлебит в игре — на ноге, у взрослых, в острой стадии. Гнойного тромбофлебита, вен рук, беременных, операций на венах и контроля УЗИ через 5–10 дней нет; тромб в глубоких венах — это уже диагноз «тромбоз глубоких вен»."
sources:
  - { kind: guideline, title: "Флебит и тромбофлебит поверхностных сосудов", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/668_2", note: "ID 668_2, опубликованы 02.11.2024, применяются; сверено с рубрикатором 29.09.2026; раздел 1.2: варикоз у до 80 % больных, ТГВ — у 18,1 %, переход на глубокие вены — 7–32 %; раздел 1.3: 0,64 % в год, средний возраст 54–65 лет, у женщин чаще, ТГВ — у 24,6 %; раздел 1.5.3: низкий, умеренный и высокий риск по границе тромба; раздел 2: диагноз — воспаление и тромб на УЗИ; раздел 2.3: анализы, в том числе D-димер, не нужны; раздел 2.4: УЗИ обеих ног; раздел 3.0.2: НПВП при низком риске, антикоагулянты 45 дней при умеренном, лечебные дозы 3 месяца при высоком; раздел 3.3.1: антибиотики рутинно не рекомендуются; раздел 3.3.3.6: АСК не рекомендуется; раздел 6: госпитализация — высокий риск при невозможности помощи дома и гнойный тромбофлебит; частоты признаков и доли по риску не даны — игровые" }
review: draft
