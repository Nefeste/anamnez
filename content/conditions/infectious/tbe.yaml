id: cond.tbe
name: { ru: "Клещевой энцефалит" }
# клещевой вирусный энцефалит (spec 2026-10-chapter-4, часть 51б; 567_2): природно-очаговая вирусная инфекция с лихорадкой,
# интоксикацией и поражением вещества или оболочек мозга (раздел 1.1). В игре — острое одноволновое течение: лихорадочная,
# менингеальная, менингоэнцефалитическая и полиомиелитическая формы. A84 — клещевой вирусный энцефалит
icd10: A84
department: dept.infectious
system: nerves
kind: disease
severity: serious
# больной не заразен: «инфицирование человека для ВКЭ является биологически тупиковым направлением» (раздел 1.2) — бокс не
# нужен; госпитализация — всех с подозрением (раздел 6). Приходит сам и привозит скорая
epidemiology:
  # 1,34 на 100 тыс. в 2022 году (раздел 1.3): реже болезни Лайма; полоса — игровая оценка. «Строгая весенне-летняя
  # сезонность», пик — май–июль (раздел 1.2, приложение В): зимой не бывает
  prevalence: extremely_rare
  age: { min: 18, peak: [30, 70] }
  season: { winter: 0, spring: 1.4, summer: 1.6, autumn: 0.4 }
  # работа в лесу и в поле (spec 2026-10-occupation, 0.5.10): заражаются при поездках «по бытовым причинам, связанным со
  # сбором грибов, ягод, работой и отдыхом на природе» (567_2, раздел 1.3), лесники — в группе риска (раздел 5); ×2 — игровая
  # оценка
  risks:
    - { id: risk.outdoor_work, x: 2 }
params:
  # формы (раздел 1.6): лихорадочная — 30–50 %, менингеальная — 50–60 %, очаговые — «сравнительно небольшая доля»; доли в
  # этих пределах — игровая оценка. Тяжёлая очаговая — своим значением: менингоэнцефалитическая с комой и полиомиелитическая
  # с дыхательной недостаточностью (раздел 1.6) — около трети очаговых, игровая оценка
  form: { fever: 35, meningeal: 55, encephalitic: 4, encephalitic_coma: 2, polio: 3, polio_breath: 1 }
  # сторона гемипареза при менингоэнцефалитической форме
  side: { right: 50, left: 50 }
  # производные — доли для вывода: очаговые — 10 %, тяжёлые из них — 3
  focal: { yes: 10, no: 90 }
  vent: { yes: 3, no: 97 }
derived:
  # очаговые формы — менингоэнцефалитическая и полиомиелитическая (раздел 1.5)
  focal: { all: { form: [encephalitic, encephalitic_coma, polio, polio_breath] } }
  # кома или дыхательная недостаточность — ОРИТ и ИВЛ (разделы 1.6 и 3.2)
  vent: { all: { form: [encephalitic_coma, polio_breath] } }
course:
  stages:
    - { id: acute, days: [0, 14] }
  # менингеальный синдром — на 1–5-й день лихорадки, очаговые — на 1–4-й (раздел 1.6): к врачу — в первые дни
  presentation: [1, 5]
  # лихорадочная — «как правило, заканчивается полным выздоровлением», менингеальная регрессирует к 8–20-му дню (раздел 1.6):
  # проходят сами; очаговые — нет
  selfLimiting: { when: { focal: [no] } }
  # «при быстро нарастающей коме и судорожном статусе летальный исход может наступить на 2-4 сутки», полиомиелитическая
  # форма «всегда тяжелое» (раздел 1.6): без лечения хуже — обычно, игровая оценка
  untreated: { band: usually, days: [1, 4], when: { focal: [yes] } }
  # лихорадка 5–8 дней, менингеальный синдром — до 8–20-го дня, выписка — по санации ликвора (разделы 1.6 и 6): в стационаре —
  # 10–21 день, игровая оценка
  stay: [10, 21]
findings:
  # укус клеща — за 1–35 дней, обычно 7–12 (раздел 1.6); помнят его не все, заражение бывает и с сырым молоком (раздел 1.1) —
  # доли в 567_2 нет
  - f: hx.tick_bite_recent
    band: { pct: 75 }
    note: "присасывание в последний месяц помнят не все: укус самца «иногда остается незамеченным», бывает и заражение с сырым молоком (567_2, разделы 1.1 и 1.2); 75 — игровая оценка"
  # начало острое: озноб, сильная головная боль, головокружение, температура 38–39, тошнота, рвота, мышечные боли (раздел 1.6);
  # полосы — игровая оценка
  - { f: sym.fever_hx, band: always }
  - { f: vital.fever, band: usually }
  - { f: sym.chills, band: usually }
  - { f: sym.headache, band: always }
  - { f: sym.vomiting, band: often }
  - { f: sym.dizziness, band: sometimes }
  - { f: sym.myalgia, band: often }
  - { f: sym.fatigue, band: usually }
  # лихорадочная — «иногда менингизм», ликвор без воспаления (раздел 1.6)
  - { f: sign.neck_stiffness, band: rarely, when: { form: [fever] } }
  - f: sign.neck_stiffness
    band: { pct: 100 }
    when: { form: [meningeal] }
    note: "ригидность затылочных мышц и симптом Кернига «с первых дней заболевания» — у каждого с менингеальной формой (567_2, раздел 1.6)"
  - f: lab.csf_pleocytosis
    band: { pct: 100 }
    when: { form: [meningeal] }
    note: "плеоцитоз от нескольких десятков до нескольких сотен клеток в 1 мкл — признак менингеальной формы (567_2, раздел 1.6)"
  # белок «умеренно повышен – до 0,66 г/л» (раздел 1.6)
  - { f: lab.csf_protein_high, band: often, when: { form: [meningeal] } }
  # очаговые — обычно с менингеальным синдромом (раздел 1.6)
  - { f: sign.neck_stiffness, band: usually, when: { form: [encephalitic, encephalitic_coma, polio, polio_breath] } }
  - { f: lab.csf_pleocytosis, band: usually, when: { form: [encephalitic, encephalitic_coma, polio, polio_breath] } }
  - { f: lab.csf_protein_high, band: often, when: { form: [encephalitic, encephalitic_coma, polio, polio_breath] } }
  # менингоэнцефалитическая (раздел 1.6): расстройства сознания вплоть до комы, судороги, спастический гемипарез; тяжелейшие —
  # с бредом и психомоторным возбуждением
  - { f: sym.confusion, band: usually, when: { form: [encephalitic] } }
  - { f: sign.gcs_low, band: usually, when: { form: [encephalitic] } }
  - f: sign.gcs_coma
    band: { pct: 100 }
    when: { form: [encephalitic_coma] }
    note: "тяжёлая менингоэнцефалитическая форма в игре — кома: «расстройства сознания различной степени, вплоть до комы» (567_2, раздел 1.6)"
  - { f: sym.seizure, band: often, when: { form: [encephalitic, encephalitic_coma] } }
  - { f: sign.hemiparesis, band: sometimes, when: { form: [encephalitic, encephalitic_coma] }, attrs: { side: $side } }
  - { f: sym.strange_behavior, band: sometimes, when: { form: [encephalitic] } }
  # полиомиелитическая (раздел 1.6): вялые параличи мышц шеи и плеч — «свисающая голова»; диафрагма — дыхание
  - f: sym.neck_weakness
    band: { pct: 100 }
    when: { form: [polio, polio_breath] }
    note: "голову не удержать и руки не поднять — с этим и приходят при полиомиелитической форме (567_2, раздел 1.6)"
  - f: sign.head_drop
    band: { pct: 100 }
    when: { form: [polio, polio_breath] }
    note: "синдром «свисающей головы» — «патогномоничный симптом» полиомиелитической формы (567_2, раздел 1.6)"
  - f: vital.spo2_low
    band: { pct: 100 }
    when: { form: [polio_breath] }
    note: "поражение мышц шеи и диафрагмы — «нарушение дыхания по периферическому типу» у каждого с тяжёлой полиомиелитической формой в игре (567_2, раздел 1.6)"
  - { f: sym.dyspnea, band: usually, when: { form: [polio_breath] } }
  # антитела IgM — с 3–4-го дня болезни (раздел 2.3.2): у пришедших в первые дни — не у всех
  - { f: lab.tbe_igm, band: usually }
# диагноз — по антителам IgM и IgG к вирусу (раздел 2.3.2, приложение Б)
confirm: [exam.tbe_elisa]
# судороги, кома и свисающая голова — тяжёлое течение, ОРИТ (разделы 2.5 и 3.2); полиомиелитическая форма — «течение болезни
# всегда тяжелое» (раздел 1.6): голова не держится — уже красный флаг
redFlags: [sym.seizure, sign.gcs_coma, sign.head_drop, sym.neck_weakness]
# лихорадка с менингеальным синдромом — менингококковая инфекция; спутанность и судороги — герпетический энцефалит; после
# клеща — болезнь Лайма (раздел 2.5, приложение А3)
differential: [cond.meningococcal, cond.hsv_encephalitis, cond.lyme]
treatment:
  # интерферон альфа-2b — всем, не позднее 7 суток (раздел 3.1, УУР B, УДД 3); #рибавирин — вместе с ним (УУР C, УДД 5);
  # парацетамол при температуре выше 38 (раздел 3.2); антибиотики без бактериальной инфекции «не показано» (раздел 3.1)
  firstLine: [tx.interferon_a2b]
  acceptable: [tx.ribavirin]
  supportive: [tx.paracetamol]
  byParam:
    # лихорадочная — иммуноглобулин «только на этапе виремии» (раздел 3.1, УУР C, УДД 5): не ошибка
    - when: { form: [fever] }
      acceptable: [tx.tbe_ig]
    # менингеальная — с интерфероном «нецелесообразно»: через гематоэнцефалический барьер не проходит (раздел 3.1)
    - when: { form: [meningeal] }
      notIndicated: [tx.tbe_ig]
    # очаговые — «высока опасность прогрессирования иммунопатологических реакций» (раздел 3.1): вредно
    - when: { form: [encephalitic, encephalitic_coma, polio, polio_breath] }
      harmful: [tx.tbe_ig]
    # кома и дыхательная недостаточность — ОРИТ и ИВЛ; глюкокортикоид при отёке мозга, «предпочтительно дексаметазона» (раздел
    # 3.2)
    - when: { vent: [yes] }
      require: [tx.ventilation]
      supportive: [tx.steroid_iv]
  # где лечить: в стационаре — всех с подозрением (разделы 3 и 6); в игре палата без изоляции; судороги, кома, свисающая
  # голова — ПИТ под монитором (красный флаг), кома и дыхательная недостаточность — реанимация с ИВЛ (раздел 3.2)
  setting:
    default: ward
    param: { name: vent, map: { yes: ricu, no: ward } }
    redFlag: icu
texts:
  summary:
    ru: >-
      Вирус, которого передаёт клещ, через неделю-две после укуса даёт высокую температуру, сильную головную боль и рвоту. У
      трети болезнь этим и ограничивается, у половины — менингит с ригидностью затылка и цитозом в ликворе; реже вирус
      поражает вещество мозга — спутанность, судороги и кома или вялые параличи шеи и рук, когда голова свисает на грудь.
      Диагноз подтверждают антитела к вирусу. Интерферон альфа-2b — всем в первую неделю; иммуноглобулин — только при
      лихорадочной форме, при очаговых он вреден. Кома и слабость дыхания — реанимация с ИВЛ.
pearls:
  - ru: "Лихорадка и головная боль весной и летом у того, кого кусал клещ, — клещевой энцефалит или Лайм, пока не доказано иное."
  - ru: "Иммуноглобулин против клещевого энцефалита у заболевшего — только при лихорадочной форме: при поражении мозга он утяжеляет течение."
  - ru: "Свисающая голова и слабые плечи после клеща — полиомиелитическая форма: следите за дыханием, диафрагма тоже слабеет."
simplified: "В игре — острое одноволновое течение без двухволнового, хронического и прогредиентного; стволовой (бульбарной) и полиоэнцефаломиелитической форм нет, кома при менингоэнцефалитической — одной строкой, без отёка мозга с дислокацией. ПЦР крови и ликвора, МРТ с очагами в таламусе, ЭЭГ, рибонуклеазы, меглюмина акридонацетата, иммуноглобулина человека нормального, противосудорожных и ноотропов нет; противовирусные — одной строкой, без доз и дней. Возврата клещевым энцефалитом после укуса без иммуноглобулина нет: вероятности заболеть в 567_2 нет."
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.1: определение, пути заражения; раздел 1.2: инфицирование человека — биологический тупик, сезонность; раздел 1.3: 1,34 на 100 тыс. в 2022 году; раздел 1.5: формы; раздел 1.6: инкубация 1–35 дней, обычно 7–12; лихорадочная 30–50 %, менингеальная 50–60 %, очаговые — небольшая доля; начало с озноба, головной боли, рвоты, температуры 38–39; ликвор — плеоцитоз 30–600, белок до 0,66 г/л; кома, судороги, свисающая голова, дыхание; раздел 2.3.2: ИФА — IgM с 3–4 дня; раздел 2.4: пункция; раздел 3.1: иммуноглобулин — только при виремии, при очаговых формах опасен; интерферон альфа-2b всем в первые 7 суток (УУР B), #рибавирин; антибиотики без бактериальной инфекции не показаны; раздел 3.2: ОРИТ при тяжёлом течении и отёке мозга, дексаметазон; раздел 6: госпитализация всех с подозрением; доли тяжёлых очаговых и полосы без пояснений — игровая оценка" }
review: draft
