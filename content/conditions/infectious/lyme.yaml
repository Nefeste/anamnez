id: cond.lyme
name: { ru: "Болезнь Лайма" }
# иксодовый клещевой боррелиоз (spec 2026-10-chapter-4, часть 51а): «наиболее частое из заболеваний, переносимых клещами» в
# России (566_2, приложение В). В игре — острое течение: мигрирующая эритема, неврит лицевого нерва с менингитом или без и
# кардит с АВ-блокадой. A69.2 — болезнь Лайма
icd10: A69.2
department: dept.infectious
system: skin
kind: disease
severity: moderate
epidemiology:
  # заболеваемости в 566_2 нет; реже присасывания клеща — игровая оценка. Болеют со 2–3-й декады апреля, пик — май–июль (раздел
  # 1.3): зимой не бывает
  prevalence: very_rare
  age: { min: 18, peak: [30, 70] }
  season: { winter: 0, spring: 1.4, summer: 1.8, autumn: 0.6 }
  # работа в лесу и в поле (spec 2026-10-occupation, 0.5.10): клещи нападают «в сельской местности, при посещении лесов
  # и лесопарковых зон» (приложение В), эпидемиологический анамнез — «пребывания в лесной зоне эндемичного района»
  # (раздел 2); ×2 — игровая оценка
  risks:
    - { id: risk.outdoor_work, x: 2 }
params:
  # сторона лица при неврите лицевого нерва
  side: { right: 50, left: 50 }
  # форма: мигрирующая эритема (I стадия), нейроборрелиоз и кардит (II стадия) — долей в 566_2 нет, игровая оценка: эритема —
  # у большинства, сердце «поражается относительно редко» (раздел 1.6)
  form: { erythema: 80, neuro: 15, carditis: 5 }
  # вид блокады при кардите: «AV-блокады I или II степени», «полная поперечная блокада сердца» (раздел 2.2); в игре — II
  # степени Мобитц II или полная с узким выскальзывающим ритмом, доли — игровая оценка
  block: { mobitz2: 40, narrow: 60 }
course:
  # эритема без лечения бледнеет за 2–4 недели (раздел 1.6), боррелии остаются: «лечение антибактериальными препаратами
  # системного действия показано во всех стадиях» (раздел 1.2)
  stages:
    - { id: acute, days: [0, 30] }
  # пятно — через дни и недели после укуса (приложение В: от нескольких часов до 30 дней), к врачу — в первую неделю: игровая
  # оценка
  presentation: [1, 7]
  # без лечения — «высокий риск… неврологических, кардиальных и суставных поражений» (раздел 7); за неделю наблюдения — у
  # части эритем, у нервов и сердца — у большинства: игровая оценка
  untreated:
    - { band: sometimes, days: [5, 14], when: { form: [erythema] } }
    - { band: usually, days: [3, 7] }
  # лечение — в инфекционном отделении (раздел 3), курс 10–21 день (раздел 3.2); в палате — неделя-две, игровая оценка
  stay: [7, 14]
findings:
  # присасывание в последний месяц — у большинства, но может остаться незамеченным (раздел 2.1)
  - f: hx.tick_bite_recent
    band: { pct: 80 }
    note: "о клеще за последний месяц помнят не все: присасывание «может остаться незамеченным» (566_2, раздел 2.1); 80 — игровая оценка"
  # эритемная форма — «при наличии патогномоничной мигрирующей эритемы» (раздел 1.5)
  - f: sym.rash_ring
    band: { pct: 100 }
    when: { form: [erythema] }
    note: "растущее пятно видит и сам больной — у каждого с эритемной формой: с ним и приходят"
  - f: sign.erythema_migrans
    band: { pct: 100 }
    when: { form: [erythema] }
    note: "эритемная форма — по определению: мигрирующая эритема на месте присасывания (566_2, разделы 1.5 и 1.6)"
  # дебют — лихорадка 38–39, озноб, артро-миалгия (раздел 1.6); полосы — игровая оценка
  - { f: sym.fatigue, band: usually }
  - { f: sym.fever_hx, band: often }
  - { f: vital.fever, band: sometimes }
  - { f: sym.chills, band: sometimes }
  - { f: sym.headache, band: often }
  - { f: sym.myalgia, band: often }
  # нейроборрелиоз: «чаще всего… неврит лицевой (VII пара) нерв с парезом лицевой мускулатуры» (раздел 1.6); в игре — у каждого
  # с этой формой, иногда с менингитом (синдром Баннварта)
  - f: sym.face_droop
    band: { pct: 100 }
    when: { form: [neuro] }
    note: "неврит лицевого нерва перекашивает лицо — с этим и приходят: в игре нейроборрелиоз — это он (566_2, раздел 1.6)"
  - f: sign.facial_palsy_peripheral
    band: { pct: 100 }
    when: { form: [neuro] }
    attrs: { side: $side }
    note: "парез лицевой мускулатуры по периферическому типу — у каждого с нейроборрелиозом в игре (566_2, раздел 1.6)"
  - { f: sign.neck_stiffness, band: sometimes, when: { form: [neuro] } }
  # ликвор — «лимфоцитарный плеоцитоз, незначительное повышение белка» (раздел 2.4); полосы — игровая оценка
  - { f: lab.csf_pleocytosis, band: usually, when: { form: [neuro] } }
  - { f: lab.csf_protein_high, band: often, when: { form: [neuro] } }
  # кардит: «AV-блокады I или II степени», «полная поперечная блокада сердца» (раздел 2.2); в игре — II–III степени
  - f: ecg.av_block
    band: { pct: 100 }
    when: { form: [carditis] }
    attrs: { kind: $block }
    note: "блокада на ЭКГ — у каждого с кардитом в игре: «AV-блокады I или II степени», «полная поперечная блокада сердца» (566_2, раздел 2.2)"
  - { f: vital.bradycardia, band: usually, when: { form: [carditis] } }
  - { f: sym.dizziness, band: often, when: { form: [carditis] } }
  - { f: sym.palpitations, band: sometimes, when: { form: [carditis] } }
  # эритема при поражении нервов и сердца — была раньше или есть сейчас: игровая оценка
  - { f: sign.erythema_migrans, band: sometimes, when: { form: [neuro, carditis] } }
  # антитела IgM — со 2-й недели (раздел 2): при свежей эритеме чаще ещё нет, у II стадии — есть
  - { f: lab.borrelia_igm, band: sometimes, when: { form: [erythema] } }
  - { f: lab.borrelia_igm, band: usually, when: { form: [neuro, carditis] } }
# эритемная форма — клинический диагноз: «не требует серологического подтверждения» (раздел 1.6); при остальных подтверждают ИФА
# (раздел 2) — в игре одна запись на болезнь, клиническая
confirm: clinical
# АВ-блокада — признак кардита (раздел 2.2); изолированный паралич лица ведут как невропатию лицевого нерва (раздел 3.2)
redFlags: [ecg.av_block]
differential: [cond.tick_bite, cond.bell_palsy, cond.av_block]
treatment:
  # I стадия — доксициклин внутрь, «препаратом выбора»; амоксициллин и цефуроксим — тоже внутрь; макролиды — 2-я линия (раздел 3.2)
  firstLine: [tx.doxycycline]
  acceptable: [tx.amoxicillin, tx.macrolide]
  # жаропонижающие и НПВС при болях (раздел 3.2)
  supportive: [tx.paracetamol, tx.ibuprofen]
  byParam:
    # II стадия: менингит и кардит — цефалоспорин III поколения в вену 14–21 день; при поражении периферических нервов —
    # доксициклин или амоксициллин внутрь (раздел 3.2, таблица); глюкокортикоид при параличе лица — как при невропатии
    # лицевого нерва (раздел 3.2)
    - when: { form: [neuro] }
      firstLine: [tx.antibiotic_iv]
      acceptable: [tx.doxycycline, tx.amoxicillin, tx.steroid_systemic_short]
    - when: { form: [carditis] }
      firstLine: [tx.antibiotic_iv]
      acceptable: [tx.doxycycline]
      notIndicated: [tx.amoxicillin, tx.macrolide]
  # «лечение больных с ЛБ проводить в условиях инфекционного отделения стационара», направление — в 24 часа (разделы 3 и 6);
  # изоляции нет: от человека человеку не передаётся. АВ-блокада — ПИТ под монитором (красный флаг)
  setting:
    default: ward
    redFlag: icu
texts:
  summary:
    ru: >-
      Боррелии, которых передаёт клещ, через дни и недели после укуса дают на коже мигрирующую эритему — растущее розовое кольцо с
      бледным центром, часто с температурой, слабостью и ломотой. Диагноз по эритеме ставят без анализов. Позже бывают неврит
      лицевого нерва, менингит и АВ-блокада. Лечат антибиотиком в инфекционном отделении: при эритеме — доксициклин внутрь, при
      поражении нервов и сердца — цефалоспорин в вену; при блокаде — под монитором.
pearls:
  - ru: "Растущее кольцо на месте укуса клеща — болезнь Лайма: анализы для диагноза не нужны, антитела в первые дни часто ещё нет."
  - ru: "Не помнит клеща — не повод отказаться от диагноза: присасывание часто остаётся незамеченным."
  - ru: "Паралич лица или АВ-блокада у того, кого летом кусал клещ, — ищите боррелиоз: антибиотик лечит причину."
simplified: "В игре — острое течение: эритема, неврит лицевого нерва с менингитом или без и кардит с АВ-блокадой II–III степени. Безэритемной формы, лимфоцитомы, артрита, акродерматита, хронического течения, иммуноблота, ПЦР и микст-инфекций нет; ИФА — одна строка. Кардиостимуляции при кардите нет: антибиотик в вену под монитором."
sources:
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: сезон с апреля, пик май–июль; раздел 1.5: стадии и формы; раздел 1.6: мигрирующая эритема — патогномоничный симптом без серологического подтверждения, дебют с лихорадки 38–39, артро-миалгии; неврит лицевого нерва — чаще всего; сердце поражается относительно редко; раздел 2: IgM со 2 недели; раздел 2.1: присасывание может остаться незамеченным; раздел 2.2: АВ-блокады при кардите; раздел 2.4: ликвор — лимфоцитарный плеоцитоз; раздел 3: лечение в инфекционном отделении; раздел 3.2: доксициклин — препарат выбора при I стадии, цефалоспорины III поколения в вену при менингите и кардите, макролиды — 2-я линия; раздел 6: направление в стационар в 24 часа; доли форм и полосы без пояснений — игровая оценка" }
review: draft
