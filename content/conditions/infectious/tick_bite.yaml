id: cond.tick_bite
name: { ru: "Присасывание клеща" }
# укус клеща без признаков болезни (spec 2026-10-chapter-4, часть 51а): приходят удалить клеща и узнать, нужна ли защита от
# клещевого энцефалита и болезни Лайма — иммуноглобулин в первые 72 часа, антибиотик не позже 5 суток (567_2 и 566_2, раздел
# 5.1). T14.0 — поверхностная травма, внешняя причина — W57: укус неядовитым членистоногим. Помощь — в пунктах
# серопрофилактики при инфекционных больницах: в игре приходят туда, где работает бокс
icd10: T14.0
department: dept.infectious
system: skin
kind: injury
severity: minor
epidemiology:
  # в эндемичном районе с присасыванием клеща весной и летом обращаются часто; доля среди пришедших — игровая оценка. Клещи
  # нападают с апреля по октябрь, пик — май и июнь (566_2, разделы 1.3 и 2.1): зимой не бывает
  prevalence: rare
  age: { min: 18, peak: [30, 70] }
  season: { winter: 0, spring: 2.5, summer: 1.5, autumn: 0.3 }
  # работа в лесу и в поле (spec 2026-10-occupation, 0.5.10): заражаются при поездках «по бытовым причинам, связанным со
  # сбором грибов, ягод, работой и отдыхом на природе» (567_2, раздел 1.3), лесники — в группе риска (раздел 5); ×2 — игровая
  # оценка
  risks:
    - { id: risk.outdoor_work, x: 2 }
params:
  # клещ ещё в коже — или его сняли сами и принесли в баночке (567_2, приложение В): доля — игровая оценка
  attached: { yes: 60, no: 40 }
  # вирус клещевого энцефалита в клеще: доли в 567_2 нет — игровая оценка
  tbe: { yes: 4, no: 96 }
  # боррелии в клеще: «спонтанная инфицированность клещей боррелиями в 5-15 раз выше, чем вирусом КЭ» (566_2, раздел 1.3); 30 —
  # игровая оценка в этих пределах
  borrelia: { yes: 30, no: 70 }
  # законченный курс прививок от клещевого энцефалита — три прививки и ревакцинация (567_2, раздел 5.1): доля — игровая оценка
  vaccinated: { yes: 25, no: 75 }
  # производные — доли для вывода, пока о часах не спросили: по долям часов ниже
  h72: { yes: 90, no: 10 }
  d5: { yes: 96, no: 4 }
derived:
  # иммуноглобулин — в первые 72 часа после присасывания (567_2, раздел 5.1): часы идут, пока идёт обследование (clock)
  h72: { f: hx.tick_hours, below: 72, clock: true }
  # антибиотик — не позднее 5 суток от присасывания (566_2, раздел 5.1)
  d5: { f: hx.tick_hours, below: 120, clock: true }
course:
  # ранка от укуса заживает за несколько дней; болезнь, если клещ её передал, проявляется позже — дни игровые
  stages:
    - { id: acute, days: [0, 5] }
  presentation: [0, 1]
  selfLimiting: true
  # без антибиотика после клеща с боррелиями — болезнь Лайма: в 566_2 вероятности нет. Игровая оценка — 12 из 100: у Nadelman 2001
  # мигрирующая эритема — у 3,2 % укушенных без профилактики, у 9,9 % после напитавшейся нимфы; приходят обычно через 7–14 дней
  # (566_2, раздел 1.6: инкубация 1–60, в среднем 7–14 дней)
  untreated: { band: { pct: 12 }, days: [5, 14], when: { borrelia: [yes] }, as: cond.lyme }
  # часов от присасывания до прихода: в первые сутки — 65 из 100, в первые 72 часа — 90; игровая оценка
  onset:
    f: hx.tick_hours
    hours: [[6, 25], [24, 40], [72, 25], [120, 6], [240, 4]]
findings:
  - f: sym.tick_bite
    band: { pct: 100 }
    note: "с этой жалобой приходят все: без неё присасывания нет — жалоба травмы, а не признак с частотой"
  - f: sign.tick_attached
    band: { pct: 100 }
    when: { attached: [yes] }
    note: "клещ в коже виден у каждого, кто его не снял; найдёт ли его врач — точность осмотра"
  - f: hx.tick_hours
    band: { pct: 100 }
    note: "когда присосался клещ, пациент называет при расспросе — у каждого: от этого зависит профилактика (567_2 и 566_2, раздел 5.1)"
  - f: hx.tick_bite_recent
    band: { pct: 100 }
    note: "клещ в последний месяц — тот самый, с которым пришёл: у каждого"
  - f: hx.tbe_vaccinated
    band: { pct: 100 }
    when: { vaccinated: [yes] }
    note: "о законченном курсе прививок привитый знает — у каждого с таким курсом"
  - f: lab.tick_tbe
    band: { pct: 100 }
    when: { tbe: [yes] }
    note: "вирус в клеще — у каждого клеща, в котором он есть; найдёт ли его ПЦР — точность исследования"
  - f: lab.tick_borrelia
    band: { pct: 100 }
    when: { borrelia: [yes] }
    note: "боррелии в клеще — у каждого клеща, в котором они есть; найдёт ли их ПЦР — точность исследования"
# клещ виден или его принесли: диагноз клинический
confirm: clinical
differential: [cond.lyme]
treatment:
  # лечить нечего — ранка заживает сама; клещ в коже — удалить (566_2, раздел 5.2); первая линия — всем месяц следить за
  # температурой и кожей (566_2, приложение В)
  firstLine: [tx.tick_watch]
  # йодофеназон — лицам после присасывания (567_2, раздел 5.1, критерий 28); антибиотик — «всем пациентам, пострадавшим от
  # нападения клеща» (566_2, раздел 5.1): и без боррелий в клеще не ошибка
  acceptable: [tx.iodophenazone, tx.doxycycline, tx.amoxicillin]
  supportive: []
  # иммуноглобулин без вируса в клеще, у привитого и позже 72 часов — не показан (567_2, раздел 5.1): вне записи по параметрам
  # он и так «не показано»
  notIndicated: []
  plan: [tx.tick_watch]
  byParam:
    # клещ в коже — удалить немедленно, целиком (566_2, раздел 5.2; 567_2, приложение В)
    - when: { attached: [yes] }
      require: [tx.tick_removal]
    # вирус в клеще, не привит или курс не закончен, первые 72 часа — иммуноглобулин (567_2, раздел 5.1, УУР C, УДД 5;
    # критерий качества 27)
    - when: { tbe: [yes], vaccinated: [no], h72: [yes] }
      prevent: [tx.tbe_ig]
    # боррелии в клеще, не позже 5 суток — антибиотик: доксициклин или амоксициллин (566_2, раздел 5.1, УУР C, УДД 5)
    - when: { borrelia: [yes], d5: [yes] }
      require: [[tx.doxycycline, tx.amoxicillin]]
  setting:
    default: home
texts:
  summary:
    ru: >-
      Клещ присосался к коже — чаще на шее, в подмышках, в паху, на голове. Его удаляют целиком, не раздавив, и исследуют: в клеще
      бывают вирус клещевого энцефалита и боррелии, возбудители болезни Лайма. Нашли вирус у непривитого — иммуноглобулин в
      первые 72 часа, нашли боррелии — антибиотик не позже 5 суток. Месяц после укуса следят за температурой и кожей: растущее
      красное пятно или лихорадка — к врачу.
pearls:
  - ru: "Клеща не мажут маслом и не раздавливают: выкручивают пинцетом или нитью и кладут в баночку — на исследование."
  - ru: "Иммуноглобулин против клещевого энцефалита — только в первые 72 часа, только непривитому и только если в клеще нашли вирус."
  - ru: "Боррелии в клеще — антибиотик в первые 5 суток: без него у части укушенных через неделю-две растёт красное кольцо."
simplified: "Район в игре эндемичный, клещ есть у каждого — сняли здесь или принёс в баночке, и исследование всегда готово через час. Беременности, укусов личинок, сырого молока, вакцинации после укуса и анализов крови укушенного нет; профилактика — одной строкой, без доз и дней. Болезнь Лайма у отпущенного без антибиотика возвращается мигрирующей эритемой; клещевой энцефалит после укуса — в части 51б."
sources:
  - { kind: guideline, title: "Клещевой вирусный энцефалит у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/567_2", note: "ID 567_2, опубликованы 23.10.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 5.1 (УУР C, УДД 5): иммуноглобулин — при присасывании вирусофорных клещей не болевшим и не вакцинированным, а также с незавершённым курсом, в первые 72 часа; йодофеназон — лицам после присасывания; критерии качества 27 и 28; приложение В: удалить клеща и исследовать; доли параметров — игровая оценка" }
  - { kind: guideline, title: "Болезнь Лайма у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/566_2", note: "ID 566_2, опубликованы 19.12.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: места присасывания, инфицированность боррелиями в 5–15 раз выше, чем вирусом КЭ, сезон с апреля; раздел 5.1: антибиотикопрофилактика при обнаружении в клеще ДНК боррелий — не позднее 5 суток, всем пострадавшим от нападения клеща; раздел 5.2: удалить немедленно, не раздавив; приложение В: памятка" }
  - { kind: paper, title: "Nadelman RB, Nowakowski J, Fish D, Falco RC, Freeman K, McKenna D, Welch P, Marcus R, Agüero-Rosenfeld ME, Dennis DT, Wormser GP. Prophylaxis with single-dose doxycycline for the prevention of Lyme disease after an Ixodes scapularis tick bite. N Engl J Med 2001;345(2):79–84", url: "https://pubmed.ncbi.nlm.nih.gov/11450675/", note: "PMID 11450675, сверено 11.10.2026: мигрирующая эритема — у 0,4 % с доксициклином и 3,2 % с плацебо, действенность 87 %; после напитавшейся нимфы без профилактики — 9,9 %" }
review: draft
