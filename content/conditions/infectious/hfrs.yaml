id: cond.hfrs
name: { ru: "Геморрагическая лихорадка с почечным синдромом" }
# ГЛПС (spec 2026-10-chapter-4, часть 52б; 347_2): острое вирусное зоонозное природно-очаговое заболевание — поражение мелких
# сосудов, геморрагический диатез, гемодинамические расстройства и острый интерстициальный нефрит с острой почечной
# недостаточностью (раздел 1.1). В игре — типичное течение в лихорадочном периоде и начале олигурического: с ними приходят;
# стёртых и бессимптомных форм нет. A98.5 — геморрагическая лихорадка с почечным синдромом
icd10: A98.5
department: dept.infectious
system: urinary
kind: disease
severity: serious
# «Передачи инфекции от человека к человеку не происходит» (раздел 1.3, приложение В) — бокс не нужен; госпитализируют всех
# независимо от тяжести (раздел 6, УУР С, УДД 5): амбулаторное наблюдение «нецелесообразно» (раздел 7)
epidemiology:
  # чисел заболеваемости в 347_2 нет — полоса игровая: около 97 % случаев — европейская часть России, крупнейшие очаги — между
  # Волгой и Уралом (раздел 1.3). «Выраженная летне-осенняя сезонность», пик «весной и особенно осенью» (раздел 1.3, приложение
  # В) — множители игровые. Мужчины — 70–90 % больных, 16–50 лет (раздел 1.3)
  prevalence: very_rare
  age: { min: 18, peak: [18, 50] }
  sex: { m: 1, f: 0.25 }
  season: { winter: 0.4, spring: 0.8, summer: 1.3, autumn: 1.6 }
params:
  # тяжесть (раздел 1.5, приложение А3): лёгкая, среднетяжёлая, тяжёлая и «крайне тяжёлая (осложнённая)» — в игре с
  # инфекционно-токсическим шоком. Долей в 347_2 нет — игровая оценка
  severity: { mild: 30, moderate: 45, severe: 20, complicated: 5 }
  # производное — доля для вывода, пока о начале не спросили: по долям часов от начала ниже
  h48: { yes: 40, no: 60 }
derived:
  # противовирусный препарат — «в стационарных условиях не позднее 48 часов от начала болезни» (раздел 3.1.1, УУР С, УДД 5):
  # часы идут, пока идёт обследование
  h48: { f: hx.onset_hours, below: 48, clock: true }
course:
  stages:
    # лихорадочный период — в среднем 3–7 дней, олигурический — 6–12 (раздел 1.6)
    - { id: fever, days: [0, 6] }
    - { id: oliguric, days: [6, 14] }
  # госпитализация — «до 3-4 дня болезни» (раздел 3): к врачу — в первые дни
  presentation: [1, 4]
  # лёгкая и среднетяжёлая проходят при базисной терапии в стационаре (разделы 3.1.2 и 6); тяжёлая и осложнённая — нет
  selfLimiting: { when: { severity: [mild, moderate] } }
  # тяжёлая без восстановления объёма крови — шок и острое повреждение почек (разделы 1.6 и 3.1.2.1): хуже часто;
  # осложнённая — всегда; игровая оценка
  untreated:
    - { band: always, days: [0, 2], when: { severity: [complicated] } }
    - { band: often, days: [1, 4], when: { severity: [severe] } }
  # постельный режим при тяжёлой — «не менее 3-4 недель от начала заболевания» (приложение В): в стационаре 18–25 дней, игровая
  # оценка
  stay: [18, 25]
  # часов от начала до прихода: госпитализация — до 3–4-го дня (раздел 3), обращаться — в первые 2–3 дня (приложение В); в первые
  # 48 часов — 40 из 100, игровая оценка
  onset:
    f: hx.onset_hours
    hours: [[24, 15], [48, 25], [72, 25], [96, 20], [168, 15]]
findings:
  # начало острое: озноб, головная боль, боли в мышцах и суставах, сухость во рту, жажда, выраженная слабость (раздел 1.6)
  - f: sym.fever_hx
    band: { pct: 100 }
    note: "лихорадка «у большинства больных в первый же день болезни достигает высоких цифр» (347_2, раздел 1.6): с ней и приходят"
  # лёгкая — «не выше 38°», среднетяжёлая — выше 39, тяжёлая — выше 39,5 (приложение А3); с 5–6-го дня снижается (приложение В)
  - { f: vital.fever, band: sometimes, when: { severity: [mild] } }
  - { f: vital.fever, band: usually, when: { severity: [moderate, severe, complicated] } }
  - { f: sym.chills, band: usually }
  - { f: sym.headache, band: always }
  - { f: sym.myalgia, band: usually }
  - { f: sym.fatigue, band: usually }
  - { f: sym.thirst, band: often }
  - { f: sym.dry_mouth, band: often }
  # «Часть больных отмечает чувство тяжести в пояснице» в лихорадочном периоде; с олигурическим боль в пояснице — «наиболее
  # постоянный признак» (раздел 1.6): с обеих сторон
  - { f: sym.flank_pain, band: often, when: { severity: [mild] }, attrs: { side: { both: 100 } } }
  - { f: sym.flank_pain, band: usually, when: { severity: [moderate] }, attrs: { side: { both: 100 } } }
  - f: sym.flank_pain
    band: { pct: 100 }
    when: { severity: [severe, complicated] }
    attrs: { side: { both: 100 } }
    note: "при тяжёлой — боли в пояснице «от неприятных ощущений тяжести до резких, мучительных» (347_2, раздел 1.6)"
  # Пастернацкий: лёгкая — «слабоположительный», среднетяжёлая — положителен, тяжёлая — «резко положителен» (приложение А3)
  - { f: sign.cva_tenderness, band: often, when: { severity: [mild] } }
  - { f: sign.cva_tenderness, band: usually, when: { severity: [moderate] } }
  - { f: sign.cva_tenderness, band: always, when: { severity: [severe, complicated] } }
  # «выраженная гиперемия кожи лица, шеи, верхней половины туловища»; «особенно заметна инъекция сосудов склер» (раздел 1.6)
  - { f: sign.face_flushing, band: usually }
  - { f: sign.scleral_injection, band: usually }
  # «туман, сетка» перед глазами — на 2–7-й день (раздел 1.6); у тяжёлой — нарушение зрения (приложение А3)
  - { f: sym.vision_blurred, band: sometimes, when: { severity: [mild] } }
  - { f: sym.vision_blurred, band: often, when: { severity: [moderate] } }
  - { f: sym.vision_blurred, band: usually, when: { severity: [severe, complicated] } }
  # интоксикация: среднетяжёлая — тошнота, редкая рвота, умеренные боли в животе; тяжёлая — многократная рвота (приложение А3)
  - { f: sym.nausea, band: often, when: { severity: [mild, moderate] } }
  - { f: sym.nausea, band: usually, when: { severity: [severe, complicated] } }
  - { f: sym.vomiting, band: sometimes, when: { severity: [moderate] } }
  - { f: sym.vomiting, band: usually, when: { severity: [severe, complicated] } }
  - { f: sym.abdominal_pain, band: sometimes, when: { severity: [moderate] } }
  - { f: sym.abdominal_pain, band: often, when: { severity: [severe, complicated] } }
  # геморрагический синдром: лёгкая — «необильная мелкоточечная сыпь», среднетяжёлая — сыпь, необильные носовые кровотечения,
  # тяжёлая — обильные (приложение А3)
  - { f: sign.petechial_rash, band: sometimes, when: { severity: [mild] } }
  - { f: sign.petechial_rash, band: often, when: { severity: [moderate] } }
  - { f: sign.petechial_rash, band: usually, when: { severity: [severe, complicated] } }
  - { f: sym.nosebleed, band: sometimes, when: { severity: [moderate] } }
  - { f: sym.nosebleed, band: often, when: { severity: [severe, complicated] } }
  # диурез: лёгкая — снижен незначительно, среднетяжёлая — олигурия, тяжёлая — олигоанурия или анурия (приложение А3)
  - { f: sym.less_urine, band: sometimes, when: { severity: [mild] } }
  - { f: sym.less_urine, band: usually, when: { severity: [moderate] } }
  - f: sym.less_urine
    band: { pct: 100 }
    when: { severity: [severe, complicated] }
    note: "тяжёлая — олигоанурия, меньше 350 мл мочи в сутки, или анурия (347_2, приложение А3)"
  # тромбоцитопения — «патогномоничный» признак раннего периода, нарастает с начального (разделы 1.6 и 2.3.1); у лёгкой —
  # «нормоцитоз» (приложение А3): ниже 100 — не у каждой
  - { f: lab.platelets_low, band: sometimes, when: { severity: [mild] } }
  - { f: lab.platelets_low, band: usually, when: { severity: [moderate] } }
  - f: lab.platelets_low
    band: { pct: 100 }
    when: { severity: [severe, complicated] }
    note: "тяжёлая — «выраженная тромбоцитопения» (347_2, приложение А3)"
  # моча: лёгкая — следы белка, единичные эритроциты; среднетяжёлая — протеинурия до 3,3 г/л, микрогематурия; тяжёлая — больше
  # 3,3 г/л, гематурия (приложение А3)
  - { f: lab.urine_protein, band: often, when: { severity: [mild] } }
  - f: lab.urine_protein
    band: { pct: 100 }
    when: { severity: [moderate, severe, complicated] }
    note: "среднетяжёлая — «значительная протеинурия (до 3,3 г/л)», тяжёлая — больше (347_2, приложение А3)"
  - { f: lab.urine_blood, band: sometimes, when: { severity: [mild] } }
  - { f: lab.urine_blood, band: usually, when: { severity: [moderate] } }
  - { f: lab.urine_blood, band: always, when: { severity: [severe, complicated] } }
  # азот: лёгкая — в норме; среднетяжёлая — креатинин 220–300, тяжёлая — до 600 мкмоль/л (приложение А3)
  - f: lab.creatinine_high
    band: { pct: 100 }
    when: { severity: [moderate, severe, complicated] }
    note: "среднетяжёлая — креатинин 220–300 мкмоль/л, тяжёлая — до 600 (347_2, приложение А3)"
  - f: lab.creatinine_300
    band: { pct: 100 }
    when: { severity: [severe, complicated] }
    note: "тяжёлая — креатинин выше 300, «до 600 мкмоль/л» (347_2, приложение А3): у среднетяжёлой — 220–300"
  # лейкоциты: среднетяжёлая — умеренный лейкоцитоз, тяжёлая — гиперлейкоцитоз (приложение А3)
  - { f: lab.wbc_high, band: sometimes, when: { severity: [moderate] } }
  - { f: lab.wbc_high, band: usually, when: { severity: [severe, complicated] } }
  # УЗИ почек: увеличение, отёк паренхимы, «синдром выделенных пирамидок» (раздел 2.4); доли — игровая оценка
  - { f: img.us_kidney_edema, band: often, when: { severity: [mild] } }
  - { f: img.us_kidney_edema, band: usually, when: { severity: [moderate, severe, complicated] } }
  - f: lab.hantavirus_igm
    band: { pct: 30 }
    note: "IgM к хантавирусам «обнаруживаются с 6-го по 56-й дни болезни» (347_2, раздел 2.3.2): у пришедших в первые дни — не у каждого; 30 из 100 — игровая оценка"
  # дача, лес, грибы и ягоды, уборка сарая, сено и хворост за 1–5 недель (разделы 1.3 и 2.1); доля — игровая оценка
  - { f: hx.rodent_contact, band: usually }
  - f: hx.onset_hours
    band: { pct: 100 }
    note: "когда началось, больной называет при расспросе — у каждого: от этого зависит противовирусный препарат (347_2, раздел 3.1.1)"
  # осложнённая — в игре с шоком: «клиника шока» — 17 баллов (приложение А3); гипотония, тахикардия, гипоксия по пульсоксиметру
  # (раздел 6); отёк лёгких — сатурация ниже 92 (раздел 2.5)
  - f: vital.bp_low
    band: { pct: 100 }
    when: { severity: [complicated] }
    note: "осложнённая в игре — с инфекционно-токсическим шоком: «клиника шока» — 17 баллов (347_2, приложение А3)"
  - { f: vital.tachycardia, band: usually, when: { severity: [complicated] } }
  - { f: vital.spo2_low, band: often, when: { severity: [complicated] } }
confirm: clinical
redFlags: [vital.bp_low, vital.spo2_low]
# с чем спутать (приложение А3): грипп — кашель и насморк, нет боли в пояснице и тромбоцитопении; пиелонефрит — боль с одной
# стороны, лейкоциты в моче; клещевой энцефалит — поражение мозга без почечных проявлений
differential: [cond.influenza, cond.pyelonephritis, cond.tbe]
treatment:
  # базисная терапия всем, независимо от тяжести (раздел 3.1.2, УУР С, УДД 5): постельный режим, диета, питьё с учётом диуреза;
  # строгий постельный режим до конца полиурии — среднетяжёлым и тяжёлым (раздел 3)
  firstLine: [tx.bed_rest]
  # жаропонижающие и обезболивающие — НПВП или анилиды при температуре выше 38,5 °C, мышечных и суставных болях (раздел 3.1.2.1,
  # УУР С, УДД 5)
  supportive: [tx.paracetamol, tx.ibuprofen]
  # антибиотиков в лечении ГЛПС нет (раздел 3) — вирус: не показаны; противогриппозное — тоже; игровое правило
  notIndicated: [tx.fluoroquinolone, tx.cephalosporin_oral, tx.antibiotic_iv, tx.oseltamivir]
  # салициловой кислоты и её производных «необходимо избегать» — нарушение гемостаза, обострение язвы (раздел 3.1.2.1)
  harmful: [tx.aspirin_course, tx.aspirin_acs]
  byParam:
    # лёгкая в первые 48 часов — рибавирин не ошибка: в первые дни тяжесть видна не всегда, прогностические признаки — на 2–4-й
    # день (раздел 1.6); игровое правило
    - when: { severity: [mild], h48: [yes] }
      acceptable: [tx.ribavirin]
    # среднетяжёлая — инфузионная дезинтоксикация (раздел 3.1.2.1, УУР C, УДД 5): проходит и без неё — поддерживающее
    - when: { severity: [moderate] }
      supportive: [tx.iv_fluids]
    # рибавирин — при среднетяжёлом и тяжёлом течении (раздел 3.1.1, УУР С, УДД 5), не позднее 48 часов от начала; позже — не
    # показан
    - when: { severity: [moderate, severe, complicated], h48: [yes] }
      require: [tx.ribavirin]
    # тяжёлая — инфузия, при гиповолемии — срочное восстановление объёма крови (раздел 3.1.2.1, УУР C, УДД 5); глюкокортикоид —
    # при тяжёлом течении (там же): не ошибка
    - when: { severity: [severe] }
      require: [tx.iv_fluids]
      acceptable: [tx.steroid_iv]
    # осложнённая — в ОРИТ: восстановление объёма крови и глюкокортикоиды при шоке с полиорганной дисфункцией (разделы 3.1.2.1 и
    # 3.1.2.2, УУР С, УДД 5); ИВЛ и вазопрессоры — по рекомендациям по неотложным состояниям: не ошибка. Фуросемид при гиповолемии
    # усиливает гипоперфузию почек и риск тромбоэмболий (раздел 3.1.2.2) — вредно
    - when: { severity: [complicated] }
      require: [tx.iv_fluids, tx.steroid_iv]
      acceptable: [tx.ventilation, tx.norepinephrine]
      harmful: [tx.furosemide_iv]
  # где лечить: стационар — всех (раздел 6), в игре палата инфекционного отделения; тяжёлая — ПИТ не ошибка; осложнённая — ОРИТ
  # (разделы 2.2, 2.5 и 3.1.2.2), гемодиализ при неэффективности консервативного лечения (раздел 3.1.2.2) — перевод не ошибка
  setting:
    default: ward
    param: { name: severity, map: { mild: ward, moderate: ward, severe: ward, complicated: ricu } }
    redFlag: ricu
    also:
      - { when: { severity: [severe] }, settings: [icu] }
      - { when: { severity: [complicated] }, settings: [transfer] }
texts:
  summary:
    ru: >-
      Вирус лесных мышей и полёвок: заражаются, вдыхая пыль с их помётом на даче, в лесу, в сарае. Болезнь начинается
      внезапно — высокая температура, головная боль, ломота, красное лицо и глаза, жажда; через несколько дней — боль в
      пояснице с обеих сторон, мочи всё меньше, туман перед глазами, кровоизлияния. Тромбоциты падают, в моче белок. Лечат в
      стационаре: строгий постельный режим, в первые 48 часов — противовирусное, при тяжёлой — растворы в вену, при шоке —
      реанимация.
pearls:
  - ru: "Высокая температура, боль в пояснице с обеих сторон и туман перед глазами летом или осенью — спросите про дачу и лес и посмотрите тромбоциты и белок в моче."
  - ru: "Противовирусное — только в первые 48 часов от начала болезни: часы считают с первого озноба, а не с прихода к врачу."
  - ru: "Мочи мало — не повод для фуросемида: при ГЛПС он нужен только при перегрузке жидкостью, а при гиповолемии усиливает поражение почек."
simplified: "В игре — типичное течение в лихорадочном и начале олигурического периода: стёртых форм, полиурии и выздоровления с канальцевыми нарушениями нет. Крайне тяжёлая форма — с шоком; разрыв почки, отёк мозга, кровоизлияния в органы, ДВС-синдром и гемодиализ не моделируются. Водный баланс, диета без белка и калия, парные сыворотки и ПЦР не проверяются."
sources:
  - { kind: guideline, title: "Геморрагическая лихорадка с почечным синдромом", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/347_2", note: "ID 347_2, опубликованы 18.08.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: зооноз, от человека к человеку не передаётся, мужчины 70–90 %, 16–50 лет, летне-осенняя сезонность; раздел 1.5: лёгкая, среднетяжёлая, тяжёлая, крайне тяжёлая (осложнённая); раздел 1.6: периоды болезни, симптомы, осложнения; раздел 2.3.2: IgM — с 6-го дня; раздел 2.4: УЗИ почек всем; раздел 3: строгий постельный режим, ранняя госпитализация до 3–4-го дня; раздел 3.1.1: рибавирин при среднетяжёлом и тяжёлом течении, не позднее 48 часов (УУР С, УДД 5), данные об эффективности противоречивы; раздел 3.1.2: базисная терапия всем; раздел 3.1.2.1: инфузия при среднетяжёлом и тяжёлом, глюкокортикоиды при тяжёлом, НПВП и анилиды, избегать салицилатов; раздел 3.1.2.2: фуросемид только при гиперволемии, ОРИТ при шоке, ДВС, ОПП, гемодиализ; раздел 6: госпитализация всех; приложение А3: критерии тяжести и дифференциальная диагностика; доли тяжести, полосы без пояснений и сроки — игровая оценка" }
review: draft
