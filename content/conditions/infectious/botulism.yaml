id: cond.botulism
name: { ru: "Ботулизм" }
# пищевой ботулизм (spec 2026-10-chapter-4, часть 51в; 911_1): нейротоксин Clostridium botulinum — симметричные нисходящие
# параличи: глаза, глотание, речь, дыхание; иногда с гастроэнтеритом в начале (раздел 1.1). Раневого, детского и
# ингаляционного в игре нет. A05.1 — ботулизм
icd10: A05.1
department: dept.infectious
system: nerves
kind: disease
severity: serious
# «Ботулизм не передается от человека человеку» (приложение В): бокс не нужен. Лечат всех с подозрением только в стационаре —
# из-за дыхательной недостаточности (раздел 3); приходит сам и привозит скорая
epidemiology:
  # в России — 400–500 случаев в год (раздел 1.3): реже клещевого энцефалита, самая редкая полоса; сезонности в 911_1 нет;
  # возраст — игровая оценка
  prevalence: ultra_rare
  age: { min: 18, peak: [25, 70] }
params:
  # тяжесть (раздел 1.5, приложение А3): лёгкая — только глаза; среднетяжёлая — глотка и гортань, жидкость глотает; тяжёлая —
  # нарушено глотание жидкости; с дыхательной недостаточностью — своим значением. Долей в 911_1 нет — игровая оценка
  severity: { mild: 30, moderate: 40, severe: 20, odn: 10 }
  # начало с тошноты, рвоты и жидкого стула — «почти у половины» (раздел 1.6)
  gi: { yes: 45, no: 55 }
  # производные — доли для вывода: глотание жидкости нарушено — 30 %, дыхание — 10
  liquids: { yes: 30, no: 70 }
derived:
  # «нарушение глотания жидкости любой степени выраженности, является абсолютным показанием к госпитализации… в
  # реанимационное отделение» (раздел 1.5)
  liquids: { all: { severity: [severe, odn] } }
course:
  stages:
    - { id: acute, days: [0, 14] }
  # инкубация — от 2–4 часов до 5 суток, симптомы обычно через 12–36 часов (раздел 1.6, приложение В): к врачу — в первые сутки-двое
  presentation: [0, 2]
  # без лечения параличи нарастают, дыхательная недостаточность «развивается совершенно закономерно» (раздел 1.6); летальность —
  # 7–9 % и с лечением (раздел 1.3): хуже — обычно, игровая оценка
  untreated:
    - { band: always, days: [0, 2], when: { severity: [odn] } }
    - { band: usually, days: [1, 3] }
  # восстановление — через 1–2 месяца, ИВЛ — недели (раздел 1.2, приложение В); выписка — при самостоятельном дыхании и
  # глотании (раздел 6): в стационаре 14–30 дней, игровая оценка
  stay: [14, 30]
findings:
  # домашние консервы — грибы (65–68 %), вяленая и копчёная рыба, мясо кустарного производства (раздел 1.3); за часы — до 7
  # суток до болезни (раздел 2)
  - f: hx.home_canned
    band: { pct: 90 }
    note: "домашние консервы в последние дни называет почти каждый: грибы — в 65–68 % случаев, рыба, мясо (911_1, раздел 1.3); 90 — игровая оценка"
  # первая жалоба — «туман» и «пелена» перед глазами, двоение (раздел 1.6); лёгкое течение — поражение одних глазодвигательных
  # мышц (раздел 1.5)
  - f: sym.diplopia
    band: { pct: 100 }
    note: "«как правило, первой жалобой большинства больных ботулизмом являются жалобы на нарушение зрения» (911_1, раздел 1.6), и при лёгком течении поражены глазодвигательные мышцы (раздел 1.5): в игре — у каждого"
  # мидриаз с вялыми зрачковыми реакциями, птоз, ограничение движений глаз (разделы 1.6 и 2.2)
  - { f: sign.mydriasis, band: usually }
  - { f: sign.ptosis, band: usually }
  # сухость во рту — столь же ранний симптом (раздел 1.6); слабость — «обязательная жалоба» (раздел 1.6)
  - { f: sym.dry_mouth, band: usually }
  - f: sym.fatigue
    band: { pct: 100 }
    note: "«слабость - обязательная жалоба больных даже с легкими формами ботулизма» (911_1, раздел 1.6)"
  # гастроэнтерит в начале — у половины: рвота до 3–5 раз, жидкий стул 2–4 раза, не дольше суток (раздел 1.6)
  - { f: sym.vomiting, band: usually, when: { gi: [yes] } }
  - { f: sym.diarrhea, band: often, when: { gi: [yes] } }
  # бульбарный синдром (раздел 1.6): среднетяжёлый — трудно глотать твёрдую пищу, гнусавость и осиплость; тяжёлый — не
  # глотает жидкость, поперхивается
  - f: sym.swallow_trouble
    band: { pct: 100 }
    when: { severity: [moderate, severe, odn] }
    note: "затруднение глотания твёрдой пищи — признак среднетяжёлого течения и тяжелее (911_1, раздел 1.5, приложение А3)"
  - { f: sign.hoarse_voice, band: usually, when: { severity: [moderate, severe, odn] } }
  - f: sym.choking_liquids
    band: { pct: 100 }
    when: { severity: [severe, odn] }
    note: "нарушение глотания жидкости — по определению тяжёлого течения (911_1, раздел 1.5): поперхивается, вода выливается через нос (раздел 1.6)"
  # дыхательная недостаточность — «дыхательный дискомфорт», затруднённый вдох, нехватка воздуха (разделы 1.5 и 1.6)
  - f: sym.dyspnea
    band: { pct: 100 }
    when: { severity: [odn] }
    note: "«даже минимальные жалобы… на дыхательный дискомфорт» — признак тяжёлого течения с дыхательной недостаточностью (911_1, раздел 1.5)"
  # гипоксемии нет «даже непосредственно перед переводом на ИВЛ» (раздел 1.6): сатурация падает поздно
  - { f: vital.spo2_low, band: sometimes, when: { severity: [odn] } }
  # температура — субфебрилитет или норма, сознание ясное (разделы 1.6 и 2.2)
  - { f: vital.fever, band: rarely }
# «диагностика ботулизма, как правило, основывается на эпидемиологических и клинических данных»; «не менее чем в 50 %
# случаев диагноз ботулизма ставится при отрицательных анализах» (раздел 2.3)
confirm: clinical
# нарушение глотания жидкости и дыхательный дискомфорт — сразу в реанимацию (раздел 1.5)
redFlags: [sym.choking_liquids, sym.dyspnea]
# бульбарные нарушения — инсульт ствола; гастроэнтерит в начале — «с сальмонеллезом и пищевыми токсикоинфекциями», в статье —
# сальмонеллёз; птоз и слабость — миастения (с частью 58в — её криз), синдром Гийена-Барре (раздел 2.6, приложение В) — его в игре
# нет; в «С чем спутать» — не больше трёх
differential: [cond.stroke_ischemic, cond.salmonellosis, cond.myasthenic_crisis]
treatment:
  # антитоксин ботулинический типов A, B, E — всем с подозрением, в максимально ранние сроки, однократно (раздел 3.1.1, УУР C,
  # УДД 4), не дожидаясь анализов; перед ним — глюкокортикоид в вену (спутник, раздел 3.1.2). Промывание желудка зондом и
  # сифонные клизмы (раздел 3, критерий качества 5), хлорамфеникол (раздел 3.1.2, УУР C, УДД 4) — всем с подозрением; первой
  # линии сверх обязательного нет. Начинают ещё до больницы (раздел 3): антитоксин и промывание — и до перевода
  firstLine: []
  require: [tx.botulism_antitoxin, tx.gastric_lavage, tx.chloramphenicol]
  beforeTransfer: [tx.botulism_antitoxin, tx.gastric_lavage]
  # инфузии — всем (раздел 3.1.2, критерий качества 10: «при отсутствии медицинских противопоказаний») — в игре
  # поддерживающее; глюкокортикоид — спутник антитоксина
  supportive: [tx.iv_fluids, tx.steroid_iv]
  byParam:
    # не глотает жидкость — назогастральный зонд: эвакуировать застойное содержимое и промывать желудок (раздел 3, УУР C, УДД 4).
    # ИВЛ до дыхательной недостаточности — не ошибка: назотрахеальная интубация позволяет перевести на ИВЛ «в "плановом" порядке,
    # т.е. до развития выраженных явлений ОДН» (раздел 3), при афагии — интубация (приложение Б)
    - when: { liquids: [yes] }
      require: [tx.ng_tube]
      acceptable: [tx.ventilation]
    # дыхательная недостаточность — проходимость дыхательных путей и ИВЛ «с целью предупреждения остановки дыхания» (раздел 3,
    # УУР C, УДД 4)
    - when: { severity: [odn] }
      require: [tx.ventilation]
  # только стационар (раздел 3, УУР C, УДД 4): палата инфекционного отделения без изоляции; нарушение глотания жидкости и
  # дыхательная недостаточность — реанимация (раздел 1.5; раздел 3: «госпитализация или перевод пациентов с тяжелой формой
  # ботулизма в ОРИТ»); среднетяжёлое — ПИТ не ошибка: дыхание может ухудшаться в первые 3 суток (раздел 1.6)
  setting:
    default: ward
    param: { name: liquids, map: { yes: ricu, no: ward } }
    redFlag: ricu
    also:
      - { when: { severity: [moderate] }, settings: [icu] }
texts:
  summary:
    ru: >-
      Токсин бактерии, которая растёт без воздуха в домашних консервах — грибах, рыбе, мясе, — парализует мышцы сверху вниз.
      Сначала туман и двоение в глазах, сухость во рту, у половины — рвота и понос; потом трудно глотать, голос гнусавый и
      сиплый, затем не проходит и вода, слабеет дыхание. Сознание ясное, температуры нет. Антитоксин вводят сразу, не дожидаясь
      анализов; промывают желудок, дают антибиотик. Не глотает жидкость или тяжело дышать — реанимация, ИВЛ.
pearls:
  - ru: "Туман в глазах, сухость во рту и слабость после домашних консервов — ботулизм, пока не доказано иное: антитоксин сразу."
  - ru: "Не глотает воду — уже реанимация: дыхание отказывает позже глотания, но внезапно."
  - ru: "Сознание ясное и температуры нет — этим ботулизм отличается от энцефалита и инсульта ствола."
simplified: "В игре — пищевой ботулизм: раневого, детского, ингаляционного и ятрогенного нет; групповых случаев и профилактики евшим тот же продукт — тоже. Анализов на токсин нет: диагноз клинический, как в половине случаев в жизни. Сыворотка — одна, без проб на чувствительность и без сывороточной болезни; ГБО, зондового питания и назотрахеальной интубации нет — ИВЛ одной строкой."
sources:
  - { kind: guideline, title: "Ботулизм у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/911_1", note: "ID 911_1, опубликованы 16.05.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: грибы 65–68 % случаев, 400–500 случаев в год, летальность 7–9 %; раздел 1.5: тяжесть, нарушение глотания жидкости — абсолютное показание к реанимации; раздел 1.6: туман и двоение — первая жалоба, сухость во рту, слабость обязательна, у половины начало с рвоты и поноса, дыхательная недостаточность; раздел 2.3: диагноз клинико-эпидемиологический, в 50 % анализы отрицательны; раздел 3: только стационар; раздел 3.1.1: антитоксин всем с подозрением, как можно раньше, однократно; раздел 3.1.2: глюкокортикоид перед сывороткой, промывание желудка зондом, хлорамфеникол; раздел 6: инфекционный стационар, при тяжёлой форме — интенсивная терапия или реанимация; приложение В: не передаётся от человека человеку; доли тяжести и полосы без пояснений — игровая оценка" }
review: draft
