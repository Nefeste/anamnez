id: cond.cdiff
name: { ru: "Энтероколит, вызванный C. difficile" }
# воспаление толстой кишки токсинами C. difficile, которая размножилась, когда антибиотик обеднил кишечную микробиоту (878_1,
# раздел 1.1; spec 2026-10-chapter-4, часть 49б). Тяжесть — по таблице 1: лёгкое и умеренное, тяжёлое, молниеносное
# (осложнённое). A04.7
icd10: A04.7
department: dept.infectious
group: grp.intestinal_infection
system: digestive
kind: disease
severity: serious
# споры передаются через руки и предметы, спирт их не берёт: отдельная палата с туалетом, перчатки и халат — до 48 часов
# после конца диареи (раздел 5.3); в игре — бокс
isolation: contact
epidemiology:
  # основная причина диареи у госпитализированных; в Санкт-Петербурге — 34,4 % антибиотико-ассоциированных диарей (раздел
  # 1.3). Вне больницы — реже: полоса — игровая оценка
  prevalence: very_rare
  # пожилой возраст (65 и старше) — фактор риска тяжёлого течения (разделы 2.1 и 7)
  age: { min: 18, peak: [65, 90] }
params:
  # тяжесть по таблице 1 (раздел 1.5): mild — лёгкое и умеренное, severe — тяжёлое, critical — молниеносное и осложнённое.
  # Долей в рекомендации нет — игровая оценка
  severity: { mild: 70, severe: 24, critical: 6 }
  # антибиотик: идёт сейчас, курс закончен, не было — у 36 % внебольничных случаев антибиотиков в анамнезе нет (раздел 1.3).
  # Доли — игровая оценка
  abx: { taking: 40, stopped: 45, none: 15 }
course:
  stages:
    - { id: active, days: [0, 5] }
    - { id: resolution, days: [5, 10] }
  # «чаще всего диарея возникает во время или сразу после антибактериальной терапии», в среднем через 2–3 дня (раздел 1.6)
  presentation: [1, 4]
  # лечение назначают при характерной картине и положительном тесте (раздел 3): само не проходит. Без лечения при тяжёлом —
  # обезвоживание, гипоальбуминемия, шок (раздел 1.6); полосы — игровая оценка
  untreated:
    - { band: sometimes, days: [2, 5], when: { severity: [mild] } }
    - { band: usually, days: [1, 3], when: { severity: [severe] } }
    - { band: always, days: [0, 1], when: { severity: [critical] } }
  # выписка — нормальный стул, температура, нет боли (раздел 6); сутки — игровая оценка
  stay: [6, 10]
findings:
  # «основным клиническим симптомом считается диарея (≥ 3 эпизодов жидкого стула) в течение 24 часов» (раздел 1.6); у
  # больного илеусом и мегаколоном водянистой диареи нет (таблица 1)
  - { f: sym.diarrhea, band: always, when: { severity: [mild, severe] } }
  - { f: sym.diarrhea, band: often, when: { severity: [critical] } }
  - { f: sym.abdominal_pain, band: often, when: { severity: [mild] } }
  - { f: sym.abdominal_pain, band: usually, when: { severity: [severe, critical] } }
  # кровь: скрытая в кале — часто, видимое кровотечение — редко (раздел 1.6)
  - { f: sym.mucus_blood_stool, band: rarely }
  # лихорадка: субфебрильная при лёгком, выше 38,5 — признак тяжёлого (таблица 1)
  - { f: sym.fever_hx, band: sometimes, when: { severity: [mild] } }
  - { f: sym.fever_hx, band: usually, when: { severity: [severe, critical] } }
  - { f: vital.fever, band: rarely, when: { severity: [mild] } }
  - { f: vital.fever, band: usually, when: { severity: [severe] } }
  - { f: vital.fever, band: always, when: { severity: [critical] } }
  - { f: sym.nausea, band: sometimes }
  - { f: sym.anorexia, band: often }
  - { f: sym.fatigue, band: usually }
  # тяжёлое: вздутие, сухость слизистых, сниженный тургор, лейкоциты больше 15, креатинин больше 1,5 мг/дл (таблица 1)
  - { f: sym.bloating, band: sometimes, when: { severity: [mild] } }
  - { f: sym.bloating, band: usually, when: { severity: [severe, critical] } }
  - { f: sign.dry_mucosa, band: usually, when: { severity: [severe, critical] } }
  - { f: sign.dehydration, band: sometimes, when: { severity: [severe] } }
  - { f: sign.dehydration, band: usually, when: { severity: [critical] } }
  - { f: lab.wbc_high, band: rarely, when: { severity: [mild] } }
  - { f: lab.wbc_high, band: always, when: { severity: [severe, critical] } }
  - { f: lab.creatinine_high, band: often, when: { severity: [severe] } }
  - { f: lab.creatinine_high, band: usually, when: { severity: [critical] } }
  - { f: lab.crp_high, band: usually }
  # молниеносное: гипотензия, шок, илеус, мегаколон, изменение сознания, лактат больше 2,2, ригидность брюшной стенки
  # (таблица 1) — хоть один признак у каждого; в игре чаще всех — давление ниже 90. Полосы — игровая оценка
  - { f: vital.bp_low, band: always, when: { severity: [critical] } }
  - { f: vital.tachycardia, band: often, when: { severity: [severe] } }
  - { f: vital.tachycardia, band: always, when: { severity: [critical] } }
  - { f: lab.lactate_high, band: usually, when: { severity: [critical] } }
  - { f: sign.peritoneal_signs, band: sometimes, when: { severity: [critical] } }
  - { f: sym.confusion, band: sometimes, when: { severity: [critical] } }
  # антибиотик — главный фактор риска (раздел 2.1): идёт сейчас или курс закончен в последние три месяца
  - { f: hx.antibiotics_recent, band: { pct: 100 }, when: { abx: [taking, stopped] }, note: "курс антибиотика в последние три месяца — у каждого больного с этим значением параметра, по его определению" }
  - { f: hx.antibiotic_now, band: { pct: 100 }, when: { abx: [taking] }, note: "антибиотик ещё идёт — по определению значения параметра" }
  # тест (раздел 2.3): первая ступень положительна у больного; токсины бывают ниже порога — в начале болезни и при осложнённом
  # течении, а при комнатной температуре разрушаются за 2 часа (полоса — игровая оценка в пределах таблиц 2–3)
  - { f: lab.cdiff_gdh, band: always }
  - { f: lab.cdiff_toxin, band: usually }
confirm: [exam.cdiff_stool]
redFlags: [vital.bp_low, lab.lactate_high, sign.peritoneal_signs]
differential: [cond.gastroenteritis, cond.salmonellosis, cond.shigellosis]
treatment:
  # ванкомицин внутрь — первая линия и при лёгком, и при тяжёлом течении (разделы 3.1.2–3.1.3); метронидазол внутрь — при
  # лёгком, если ванкомицин нельзя. Новый антибиотик широкого спектра поддерживает болезнь (раздел 5: ограничить
  # фторхинолоны, клиндамицин и цефалоспорины); препараты, снижающие моторику, — дилатация и перфорация кишки (раздел 3.1)
  firstLine: [tx.vancomycin_oral]
  # солевые растворы — для коррекции обезвоживания, гипокалиемии, гипонатриемии (раздел 3.1.1)
  supportive: [tx.ors, tx.rest_fluids]
  harmful: [tx.loperamide]
  notIndicated: [tx.fluoroquinolone, tx.antibiotic_iv, tx.amoxicillin, tx.amoxicillin_clavulanate, tx.cephalosporin_oral, tx.macrolide, tx.nitrofurantoin]
  byParam:
    - when: { severity: [mild] }
      acceptable: [tx.metronidazole]
    # тяжёлое — растворы в вену при обезвоживании (раздел 3.1.1): не ошибка
    - when: { severity: [severe] }
      acceptable: [tx.balanced_fluids, tx.iv_fluids]
    # молниеносное — ванкомицин внутрь вместе с метронидазолом в вену, коррекция обезвоживания (раздел 3.1.4); первой линии
    # сверх обязательного нет
    - when: { severity: [critical] }
      require: [tx.vancomycin_oral, tx.metronidazole, [tx.balanced_fluids, tx.iv_fluids]]
      beforeTransfer: [[tx.balanced_fluids, tx.iv_fluids]]
    # антибиотик ещё идёт — отменить (раздел 3.1.1; критерий качества 11); закончен — отменять нечего
    - when: { abx: [taking] }
      require: [tx.stop_antibiotic]
    - when: { abx: [stopped, none] }
      notIndicated: [tx.stop_antibiotic]
  # где лечить (раздел 6): лёгкое — амбулаторно; при обезвоживании и факторах риска тяжёлого течения — стационар, в игре
  # бокс; молниеносное и осложнённое — реанимация, в игре ПИТ: гипотензия, лактат, перитонит — признаки осложнённого
  # (таблица 1). Тяжёлое в ПИТ — не ошибка
  setting:
    default: home
    param: { name: severity, map: { mild: home, severe: box, critical: icu } }
    redFlag: icu
    also:
      - { when: { severity: [severe] }, settings: [icu] }
texts:
  summary:
    ru: >-
      Понос во время курса антибиотика или в первые недели после него: антибиотик обеднил кишку, и размножилась
      C. difficile, токсины которой воспаляют толстую кишку. Подтверждает тест кала в два шага — микроб, потом токсины.
      Антибиотик, на котором начался понос, отменяют; лечат ванкомицином внутрь. Лёгкое течение — дома, тяжёлое — бокс,
      молниеносное, с падением давления и вздутием, — интенсивная терапия. Лоперамид опасен: кишка может раздуться и
      порваться.
pearls:
  - ru: "Понос на антибиотике или вскоре после него — проверьте кал на C. difficile; без поноса тест не делают."
  - ru: "Первое действие — отменить антибиотик, на котором начался понос, если без него можно обойтись."
  - ru: "Споры C. difficile не берёт спирт: руки моют водой с мылом, больной лежит отдельно до 48 часов после конца поноса."
simplified: "Рецидивов, реинфекции, трансплантации фекальной микробиоты и колэктомии в игре нет: при молниеносном течении — интенсивная терапия, хирург — позже. Носительства без болезни как диагноза нет — у носителя бывает положительна только первая ступень теста. Энтероколит после антибиотиков, назначенных в нашей же больнице, — позже."
sources:
  - { kind: guideline, title: "Энтероколит, вызванный Clostridioides difficile (C. difficile)", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/878_1", note: "ID 878_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; разделы 1.1–1.6: определение, эпидемиология, клиника; таблица 1: тяжесть — лёгкое и умеренное, тяжёлое, молниеносное; раздел 2.1: факторы риска — антибиотики, возраст, госпитализация; раздел 2.3: двухступенчатый тест только при диарее; раздел 3: лечение при характерной картине и положительном тесте; раздел 3.1.1: отмена антибиотика-провокатора, регидратация; разделы 3.1.2–3.1.4: ванкомицин внутрь — первая линия, метронидазол — запасной, при осложнённом — вместе; раздел 3.1: лоперамид не рекомендуется; раздел 5.3: изоляция; раздел 6: где лечить; доли тяжести, антибиотика и полосы без пояснений — игровая оценка" }
review: draft
