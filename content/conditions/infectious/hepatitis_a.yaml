id: cond.hepatitis_a
name: { ru: "Острый гепатит A" }
# острый вирусный гепатит A (spec 2026-10-chapter-4, часть 52а; 718_2): «цикличным доброкачественным течением», общее
# недомогание, анорексия, тошнота, рвота, «иногда желтухой» (раздел 1.1). В игре — желтушная форма: с ней приходят; безжелтушных,
# стёртых и бессимптомных нет. B15 — острый гепатит A
icd10: B15
department: dept.infectious
# вирусный гепатит, как и гепатит B: перепутали A и B — диагноз частично верный, вирус не тот
group: grp.viral_hepatitis
system: digestive
kind: disease
severity: moderate
# «типичная кишечная инфекция с фекально-оральным механизмом»: вирус выделяется с фекалиями «в течение всего продромального
# (преджелтушного) и в первую неделю желтушного периодов» (раздел 1.3) — в стационаре бокс, как при кишечных инфекциях;
# требования к боксу в 718_2 нет — игровое правило главы 4
isolation: contact
epidemiology:
  # 2,42 на 100 тыс. населения в 2023 году, дети — 35 % (раздел 1.3): у взрослых — около 1,6, как клещевой энцефалит; полоса —
  # игровая оценка. «Осенне-зимний период» с максимумом в сентябре–ноябре (раздел 2.1); множители — игровая оценка
  prevalence: extremely_rare
  age: { min: 18, peak: [18, 45] }
  season: { winter: 1.2, spring: 0.7, summer: 0.6, autumn: 1.5 }
params:
  # тяжесть (раздел 1.6, приложение А3): лёгкая — билирубин до 100, ПТИ выше 60; средняя — 100–200, ПТИ 50–60; тяжёлая — выше
  # 200, ПТИ ниже 50; кома — фульминантное течение, «< 1 %» (раздел 3.2) — своим значением. Долей в 718_2 нет — игровая оценка
  severity: { mild: 45, moderate: 45, severe: 9, coma: 1 }
course:
  stages:
    - { id: icteric, days: [0, 21] }
  # приходят с желтухой: преджелтушный период — 4–7 дней (раздел 1.6), желтуха «уже в ближайшую неделю достигает своего
  # максимума»
  presentation: [0, 5]
  # «ГА относится к самолимитирующим инфекциям» (раздел 3): проходит сам, кроме молниеносного течения
  selfLimiting: { when: { severity: [mild, moderate, severe] } }
  # кома — «приводит к летальному исходу, особенно при отсутствии превентивной интенсивной терапии» (раздел 1.6): без
  # реанимации хуже почти всегда, игровая оценка
  untreated: { band: always, days: [0, 2], when: { severity: [coma] } }
  # выписка — АЛТ ниже 150, билирубин до 40, ПТИ не ниже 80 (раздел 6); билирубин и ферменты — к норме «к 20-25-му дню»
  # желтухи (раздел 1.6): в стационаре 14–21 день, игровая оценка
  stay: [14, 21]
findings:
  # желтуха — с неё приходят; моча темнеет за 2–3 дня до неё, кал обесцвечивается (раздел 1.6)
  - f: sym.yellow_skin
    band: { pct: 100 }
    note: "в игре — желтушная форма: «желтушностью склер, слизистых оболочек ротоглотки, а затем кожи» (718_2, раздел 1.6)"
  - f: sign.jaundice
    band: { pct: 100 }
    note: "желтушность кожи и слизистых — критерий диагноза (718_2, раздел 2)"
  - { f: sym.dark_urine, band: usually }
  - { f: sym.pale_stool, band: often }
  # с желтухой самочувствие «улучшается» (приложение А3), дольше всего — слабость и снижение аппетита, тяжесть в правом
  # подреберье (раздел 1.6)
  - { f: sym.fatigue, band: usually }
  - { f: sym.anorexia, band: usually }
  - { f: sym.nausea, band: often }
  - { f: sym.vomiting, band: rarely, when: { severity: [mild] } }
  - { f: sym.vomiting, band: often, when: { severity: [moderate] } }
  - { f: sym.vomiting, band: usually, when: { severity: [severe, coma] } }
  - { f: sym.ruq_pain, band: sometimes }
  # преджелтушный период чаще «по гриппоподобному типу»: 38–39 °С 2–3 дня (раздел 1.6, приложение А3); в желтушном температура
  # «обычно нормальная», при тяжёлой — лихорадка на фоне нарастающей желтухи
  - { f: sym.fever_hx, band: usually }
  - { f: vital.fever, band: rarely, when: { severity: [mild, moderate] } }
  - { f: vital.fever, band: usually, when: { severity: [severe, coma] } }
  # печень увеличена, уплотнена, чувствительна (раздел 1.6); при тяжёлой — увеличена на 4–6 см (приложение А3)
  - { f: sign.hepatomegaly, band: usually }
  - { f: sign.ruq_tenderness, band: often }
  # анализы: АЛТ «резко нарастает», билирубин — за счёт прямого (раздел 1.6); тяжёлая — билирубин выше 200 и ПТИ ниже 50
  # (приложение А3)
  - f: lab.alt_high
    band: { pct: 100 }
    note: "«резко нарастает активность аминотрансфераз, особенно аланинаминотрансферазы» (718_2, раздел 1.6)"
  - f: lab.bilirubin_high
    band: { pct: 100 }
    note: "у желтушной формы билирубин повышен у каждого (718_2, раздел 1.6)"
  - f: lab.bilirubin_200
    band: { pct: 100 }
    when: { severity: [severe, coma] }
    note: "тяжёлая форма — билирубин «Более 200» мкмоль/л (718_2, приложение А3)"
  - f: lab.pti_low
    band: { pct: 100 }
    when: { severity: [severe, coma] }
    note: "тяжёлая форма — ПТИ «Менее 50» % (718_2, приложение А3)"
  - f: lab.hav_igm
    band: { pct: 100 }
    note: "анти-HAV IgM появляются «с конца инкубационного периода - первых дней манифестации» (718_2, раздел 2.3): у пришедшего с желтухой — у каждого"
  # эпиданамнез: очаг, вспышка, поездка, больной дома (раздел 2.1); на один манифестный случай — 5–10 бессимптомных (раздел
  # 1.3): желтуху рядом называет не каждый — игровая оценка
  - { f: hx.jaundice_contact, band: often }
  # тяжёлая: тахикардия, петехии, носовые кровотечения (приложение А3)
  - { f: vital.tachycardia, band: usually, when: { severity: [severe, coma] } }
  - { f: sign.petechial_rash, band: sometimes, when: { severity: [severe, coma] } }
  - { f: sym.nosebleed, band: sometimes, when: { severity: [severe, coma] } }
  # кома — 8 баллов и меньше по шкале Глазго (приложение Г1), «чаще всего на 4-5-й день от начала желтухи» (раздел 1.6)
  - f: sign.gcs_coma
    band: { pct: 100 }
    when: { severity: [coma] }
    note: "печёночная кома — по определению формы: 8 баллов и меньше по шкале комы Глазго (718_2, приложение Г1)"
  # печёночная энцефалопатия: «эйфория/заторможенность, чувство «провалов», эхолалия, астериксис» (718_2, раздел 2.2) — со слов
  # родных путается и засыпает; в конце списка — прежние больные остались прежними
  - f: sym.confusion
    band: { pct: 100 }
    when: { severity: [coma] }
    note: "у печёночной комы — печёночная энцефалопатия: заторможенность, «провалы» (718_2, раздел 2.2); родные говорят, что путается и засыпает"
# подтверждает анти-HAV IgM (раздел 2.3, УУР C, УДД 4); «по виду» гепатит A от других не отличить (приложение В)
confirm: [exam.hepatitis_markers]
# печёночная кома — инфекционист в течение 10 минут, реаниматолог — в 30 (разделы 2.5 и 6)
redFlags: [sign.gcs_coma, sym.confusion]
# с чем спутать: другие вирусные гепатиты; желтуха с болью под рёбрами справа — камень и холецистит (приложение А3)
differential: [cond.hepatitis_b, cond.cholecystitis, cond.biliary_colic]
treatment:
  # базисная терапия — щадящий режим и диета всем (раздел 3.1.2, УУР C, УДД 5); «необходимо избегать неоправданного назначения
  # лекарственных средств» (раздел 3)
  firstLine: [tx.liver_diet]
  # дротаверин — при ноющих болях в правом подреберье (раздел 3.1.2, УУР C, УДД 5)
  supportive: [tx.drotaverine]
  # противовирусные — «не рекомендовано… независимо от тяжести течения заболевания» (раздел 3.1.1, УУР C, УДД 5)
  notIndicated: [tx.nucleoside_analog, tx.ribavirin, tx.interferon_a2b, tx.acyclovir_iv, tx.valaciclovir, tx.oseltamivir]
  byParam:
    # средняя — инфузионная дезинтоксикация (раздел 3.1.2, УУР C, УДД 5; критерий качества А-6): не ошибка
    - when: { severity: [moderate] }
      acceptable: [tx.iv_fluids]
    # тяжёлая — «усиление дезинтоксикационной терапии» (раздел 3.1.2): инфузии обязательно
    - when: { severity: [severe] }
      require: [tx.iv_fluids]
    # печёночная кома — инфузионно-трансфузионная терапия и глюкокортикоиды «не позднее 30 минут» (раздел 3.1.2, УУР C, УДД
    # 5; критерий качества Б-3); в коме — ИВЛ не ошибка (раздел 3.1.2)
    - when: { severity: [coma] }
      require: [tx.iv_fluids, tx.steroid_iv]
      acceptable: [tx.ventilation]
  # где лечить: подозрение — инфекционное отделение (раздел 6, УУР C, УДД 5), в игре бокс; лёгкая — дома не ошибка (раздел 3:
  # «могут лечиться на дому»; условия дома игра не проверяет); кома — реанимация (разделы 2.2 и 3.1.2), направление в центр
  # трансплантации — не ошибка (раздел 3.2: МНО больше 1,5 и энцефалопатия)
  setting:
    default: box
    param: { name: severity, map: { mild: box, moderate: box, severe: box, coma: ricu } }
    redFlag: ricu
    also:
      - { when: { severity: [mild] }, settings: [home] }
      - { when: { severity: [coma] }, settings: [transfer] }
texts:
  summary:
    ru: >-
      Вирус, который передаётся через грязные руки, воду и еду. Через 2–4 недели после заражения — температура, ломота,
      тошнота, слабость, через несколько дней темнеет моча, светлеет кал и желтеют глаза и кожа; с желтухой обычно
      становится легче. Подтверждают антитела IgM к вирусу. Болезнь проходит сама: противовирусных не нужно — режим,
      диета без алкоголя, при среднетяжёлой и тяжёлой форме — растворы в вену. Лечат в боксе инфекционного отделения;
      редкая молниеносная форма с печёночной комой — реанимация.
pearls:
  - ru: "Гепатит A проходит сам: противовирусные не нужны, лишние лекарства только нагружают печень."
  - ru: "С появлением желтухи при гепатите A обычно становится легче; если хуже — думайте о тяжёлой форме и гепатите B."
  - ru: "Сонливость, путаница и кровоточивость на фоне желтухи — начало печёночной комы: реанимация, растворы и глюкокортикоид в первые 30 минут."
simplified: "В игре — желтушная форма у взрослых: безжелтушной, стёртой и бессимптомной нет, холестатической и затяжной — тоже. Тяжесть — по билирубину и протромбиновому индексу; гепатопротекторов, лактулозы, урсодезоксихолевой кислоты, плазмы и экстракорпоральной детоксикации нет, растворы в вену — одной строкой. Дома лёгкую форму лечить можно, а условия — отдельная квартира, уход, наблюдение — игра не проверяет."
sources:
  - { kind: guideline, title: "Острый гепатит A (ГА) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/718_2", note: "ID 718_2, опубликованы 29.07.2025, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: фекально-оральный механизм, вирус в фекалиях в продроме и первую неделю желтухи, 2,42 на 100 тыс. в 2023 году, дети — 35 %; раздел 1.6: инкубация 15–30 дней, преджелтушный период 4–7 дней, желтуха, тёмная моча и ахолия, гепатомегалия, тяжесть по билирубину и ПТИ, кома на 4–5-й день желтухи; раздел 2.1: эпиданамнез и сезонность; раздел 2.3: анти-HAV IgM подтверждает диагноз (УУР C, УДД 4); раздел 3: самолимитирующая инфекция, лёгкая форма — можно дома; раздел 3.1.1: противовирусные не рекомендованы (УУР C, УДД 5); раздел 3.1.2: режим и диета всем, инфузии по тяжести, при коме инфузия и глюкокортикоиды за 30 минут, ОРИТ, ИВЛ; раздел 3.2: МНО больше 1,5 и энцефалопатия — центр трансплантации; раздел 6: госпитализация в инфекционное отделение, выписка по АЛТ, билирубину и ПТИ; приложение А3: критерии тяжести; доли тяжести и полосы без пояснений — игровая оценка" }
review: draft
