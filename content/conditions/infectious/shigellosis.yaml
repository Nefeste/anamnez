id: cond.shigellosis
name: { ru: "Шигеллёз (дизентерия)" }
# острая кишечная инфекция, вызванная шигеллами, с поражением дистального отдела толстой кишки (869_1, раздел 1.1; spec
# 2026-10-chapter-4, часть 49б). В игре — колитический вариант, у 60–80 % больных острым шигеллёзом (приложение В); вид
# шигеллы — нет. A03.9 — шигеллёз неуточнённый
icd10: A03.9
department: dept.infectious
group: grp.intestinal_infection
system: digestive
kind: disease
severity: moderate
# фекально-оральный механизм: контактно-бытовой, пищевой, водный путь (раздел 1.3); в стационаре — бокс
isolation: contact
epidemiology:
  # в России — в основном дизентерия Зонне, реже сальмонеллёза; на каждый выявленный случай — 4 невыявленных (раздел 1.3):
  # полоса — игровая оценка
  prevalence: very_rare
  age: { min: 18 }
  # «в странах с умеренным климатом пик приходится на летне-осенний период» (раздел 1.3); множители — игровая оценка
  season: { winter: 0.6, spring: 0.8, summer: 1.4, autumn: 1.2 }
params:
  # тяжесть — лёгкая, среднетяжёлая, тяжёлая по выраженности интоксикации, местных изменений и обезвоживания (раздел 1.5).
  # Долей в рекомендации нет — игровая оценка; скорая и вернувшийся хуже — тяжёлая
  severity: { mild: 45, moderate: 45, severe: 10 }
course:
  stages:
    - { id: active, days: [0, 5] }
    - { id: resolution, days: [5, 10] }
  # инкубация — 1–7 дней, начало острое (раздел 1.6); к врачу — в первые дни
  presentation: [0, 3]
  # антибиотик — всем после клинико-эпидемиологического диагноза (раздел 3.1.1): болезнь без него затягивается (раздел 6:
  # «позднее начало… этиотропной терапии приводит к более длительному течению»). Хуже — игровая оценка
  untreated:
    - { band: rarely, days: [2, 5], when: { severity: [mild] } }
    - { band: often, days: [1, 4], when: { severity: [moderate] } }
    - { band: usually, days: [0, 2], when: { severity: [severe] } }
  # выписка — не раньше чем через 3 дня после клинического выздоровления или после отрицательного посева (раздел 6); сутки —
  # игровая оценка
  stay: [5, 8]
findings:
  - { f: sym.diarrhea, band: always }
  # колитический синдром (раздел 2): схваткообразная боль внизу живота слева, тенезмы, ложные позывы, скудный
  # слизисто-кровянистый стул («ректальный плевок»); гемоколит — у 70–75 % (раздел 1.6)
  - { f: sym.mucus_blood_stool, band: often, when: { severity: [mild] } }
  - { f: sym.mucus_blood_stool, band: usually, when: { severity: [moderate] } }
  - { f: sym.mucus_blood_stool, band: always, when: { severity: [severe] } }
  - { f: sym.tenesmus, band: often, when: { severity: [mild] } }
  - { f: sym.tenesmus, band: usually, when: { severity: [moderate, severe] } }
  - { f: sym.abdominal_pain, band: usually }
  - { f: sym.llq_pain, band: usually }
  # пальпация — «спазмированная, тонически напряженная толстая кишка», сигмовидная — болезненный шнур (раздел 2.2)
  - { f: sign.llq_tenderness, band: usually }
  - { f: sym.green_stool, band: rarely }
  # интоксикация — критерий тяжести (раздел 1.5): озноб, жар, температура до 38–40 от нескольких часов до 2–5 дней (раздел
  # 1.6); при лёгкой — нормальная или невысокая. Полосы — игровая оценка
  - { f: sym.fever_hx, band: sometimes, when: { severity: [mild] } }
  - { f: sym.fever_hx, band: usually, when: { severity: [moderate, severe] } }
  - { f: vital.fever, band: rarely, when: { severity: [mild] } }
  - { f: vital.fever, band: always, when: { severity: [moderate, severe] } }
  - { f: sym.chills, band: often }
  - { f: sym.headache, band: often }
  - { f: sym.fatigue, band: usually }
  # рвота и обезвоживание для дизентерии «нехарактерны», рвота — редко (875_1, приложение А3.4); при тяжёлом течении —
  # тахикардия, снижение давления, инфекционно-токсический шок (869_1, раздел 1.6)
  - { f: sym.nausea, band: sometimes }
  - { f: sym.vomiting, band: rarely }
  - { f: sym.thirst, band: sometimes }
  - { f: sign.dry_mucosa, band: often, when: { severity: [severe] } }
  - { f: vital.tachycardia, band: often, when: { severity: [moderate] } }
  - { f: vital.tachycardia, band: usually, when: { severity: [severe] } }
  - { f: vital.bp_100, band: often, when: { severity: [severe] } }
  - { f: vital.bp_low, band: sometimes, when: { severity: [severe] } }
  - { f: sym.confusion, band: sometimes, when: { severity: [severe] } }
  # кровь: умеренный лейкоцитоз (раздел 2.3); полосы — игровая оценка
  - { f: lab.wbc_high, band: sometimes, when: { severity: [mild] } }
  - { f: lab.wbc_high, band: usually, when: { severity: [moderate, severe] } }
  - { f: lab.crp_high, band: usually }
confirm: clinical
redFlags: [vital.bp_low, sym.confusion]
differential: [cond.salmonellosis, cond.diverticulitis, cond.gastroenteritis]
treatment:
  # антибиотик — всем после клинико-эпидемиологического диагноза: ципрофлоксацин — препарат выбора при кровавой диарее,
  # цефтриаксон — вторая линия (раздел 3.1.1). Плохо проникают в слизистую кишки нитрофураны, цефалоспорины I–II поколения и
  # амоксициллин; к ампициллину, тетрациклину, хлорамфениколу шигеллы устойчивы. Регидратация — всем (раздел 3.1.2); посев
  # кала — до антибиотика (раздел 2.3; критерий качества 9). Препараты, снижающие моторику, затягивают и утяжеляют болезнь
  firstLine: [tx.fluoroquinolone]
  acceptable: [tx.antibiotic_iv]
  supportive: [tx.ors, tx.stool_culture, tx.drotaverine, tx.paracetamol, tx.rest_fluids]
  harmful: [tx.loperamide]
  notIndicated: [tx.amoxicillin, tx.amoxicillin_clavulanate, tx.cephalosporin_oral, tx.nitrofurantoin, tx.macrolide, tx.ppi, tx.norepinephrine]
  byParam:
    # тяжёлое течение — дезинтоксикация растворами в вену (раздел 3.1.2): не ошибка
    - when: { severity: [severe] }
      acceptable: [tx.balanced_fluids, tx.iv_fluids]
  # где лечить (раздел 6): среднетяжёлое и тяжёлое — инфекционный стационар, в игре бокс; лёгкое — можно амбулаторно, бокс —
  # не ошибка (группа риска, эпидемиологические показания); тяжёлое в ПИТ — тоже (раздел 2.5: при неотложных состояниях —
  # реаниматолог)
  setting:
    default: home
    param: { name: severity, map: { mild: home, moderate: box, severe: box } }
    also:
      - { when: { severity: [mild] }, settings: [box] }
      - { when: { severity: [severe] }, settings: [icu] }
texts:
  summary:
    ru: >-
      Дизентерия — кишечная инфекция, при которой воспаляется нижний отдел толстой кишки. Схваткообразная боль внизу
      живота слева, мучительные ложные позывы, частый скудный стул со слизью и кровью, температура. Антибиотик нужен
      каждому, препарат выбора — ципрофлоксацин; посев кала — до первой дозы. Лёгкое течение лечат дома, среднетяжёлое
      и тяжёлое — в боксе инфекционного отделения. Лоперамид и другие средства, замедляющие кишку, вредны.
pearls:
  - ru: "Скудный стул со слизью и кровью, ложные позывы и боль слева внизу живота — колит; у острого больного с температурой это прежде всего шигеллёз."
  - ru: "Антибиотик при шигеллёзе — каждому, в отличие от лёгкого сальмонеллёза. Нет улучшения за 48 часов — препарат меняют."
  - ru: "Лоперамид при дизентерии вреден: возбудитель задерживается в кишке, болезнь затягивается."
simplified: "В игре — колитический вариант без вида шигеллы; гастроэнтеритический вариант, затяжное и хроническое течение, носительство, гемолитико-уремический синдром и инфекционно-токсический шок — нет. Возраст старше 50 лет и работа в общепите как доводы за госпитализацию — нет: лёгкое течение в боксе не ошибка. ПЦР кала и результата посева в смене нет."
sources:
  - { kind: guideline, title: "Шигеллез", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/869_1", note: "ID 869_1, опубликованы 24.12.2024, применяются; сверено с рубрикатором 06.10.2026; разделы 1.1–1.6: определение, пути передачи, летне-осенний пик, колитический синдром, гемоколит у 70–75 %; раздел 2: критерии диагноза; раздел 2.2: пальпация сигмовидной кишки; раздел 2.3: посев кала до антибиотика; раздел 3.1.1: антибиотик всем, ципрофлоксацин — препарат выбора, цефтриаксон — вторая линия, нитрофураны, цефалоспорины I–II поколения и амоксициллин плохо проникают в слизистую; раздел 3.1.2: регидратация всем, препараты, снижающие моторику, не показаны; раздел 6: госпитализация средне-тяжёлых и тяжёлых; доли тяжести и полосы без пояснений — игровая оценка" }
  - { kind: guideline, title: "Острые кишечные инфекции (ОКИ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/875_1", note: "ID 875_1, опубликованы 25.12.2024, применяются; сверено с рубрикатором 06.10.2026; приложение А3.4: при дизентерии обезвоживание нехарактерно, рвота — редко, стул скудный со слизью и кровью" }
review: draft
