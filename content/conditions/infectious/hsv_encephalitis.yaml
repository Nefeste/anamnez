id: cond.hsv_encephalitis
name: { ru: "Герпетический энцефалит" }
# энцефалит, вызванный вирусом простого герпеса (spec 2026-10-chapter-4, часть 50б): «наиболее часто диагностируемый
# вирусный энцефалит», в 95 % — ВПГ-1, чаще из-за активации латентного вируса (492_2, разделы 1.3 и 1.6). Кожные и
# генитальные формы герпеса в игре — нет. B00.4 — герпетический энцефалит
icd10: B00.4
department: dept.infectious
system: nerves
kind: disease
severity: critical
# лихорадка со спутанностью и судорогами — привозит скорая; госпитализация — в инфекционное отделение (раздел 6). Изоляции
# нет: «карантинно-изоляционные мероприятия в отношении контактных лиц не организовываются» (раздел 5.2.2)
arrival: ambulance
epidemiology:
  # 1 на 250–500 тысяч человек (раздел 1.3): реже всего в базе, как менингококковая инфекция; возраст — игровая оценка
  prevalence: ultra_rare
  age: { min: 18, peak: [20, 80] }
params:
  # сторона очага в височной доле — игровая оценка: на срезе один очаг
  side: { right: 50, left: 50 }
  # грубые расстройства сознания до комы — у 12 % (раздел 1.6)
  coma: { no: 88, yes: 12 }
  # эпилептические припадки в остром периоде — «у более чем 50 % больных» (раздел 1.6); доля — игровая оценка
  seizures: { no: 45, yes: 55 }
course:
  stages:
    - { id: acute, days: [0, 7] }
    - { id: resolution, days: [7, 21], needs: treatment }
  # период инфекционных проявлений до неврологических — от 1 до 30 суток (раздел 1.6): к врачу — когда спутанность и
  # странное поведение; сутки — игровая оценка
  presentation: [1, 5]
  # «у не леченных пациентов герпетический энцефалит быстро прогрессирует… что приводит к смерти в течение 7–14 дней»,
  # летальность без лечения — больше 50–70 % (разделы 1.6 и 3.1.1); при коме — раньше, игровая оценка
  untreated:
    - { band: always, days: [3, 7], when: { coma: [yes] } }
    - { band: usually, days: [7, 14] }
  # ацикловир в вену — 14 дней, до 21 (раздел 3.1.1)
  stay: [14, 21]
findings:
  # начало — остро: высокая температура, слабость, головная боль, тошнота и рвота (раздел 1.6); полосы — игровая оценка
  - { f: sym.fever_hx, band: always }
  - { f: vital.fever, band: usually }
  - { f: sym.fatigue, band: usually }
  - { f: sym.headache, band: usually }
  - { f: sym.vomiting, band: often }
  - { f: vital.tachycardia, band: often }
  # спутанность, оглушённость, дезориентация — «у большинства больных», у 12 % — до комы (раздел 1.6)
  - { f: sym.confusion, band: usually, when: { coma: [no] } }
  - { f: sign.gcs_low, band: usually, when: { coma: [no] } }
  - f: sign.gcs_coma
    band: { pct: 100 }
    when: { coma: [yes] }
    note: "кома в игре — 8 баллов и меньше по шкале Глазго у каждого такого больного: «грубые расстройства сознания до уровня комы» (492_2, раздел 1.6)"
  # психические расстройства — у 80 % (раздел 1.6)
  - { f: sym.strange_behavior, band: usually }
  - f: sym.seizure
    band: { pct: 100 }
    when: { seizures: [yes] }
    note: "припадок — у каждого с этим значением параметра: «у 1/3 больных энцефалит начинается с судорожного синдрома» (492_2, раздел 1.6)"
  # афазии — «часто» (раздел 1.6)
  - { f: sym.speech_trouble, band: often }
  # центральные парезы — у трети (раздел 1.6), напротив очага
  - f: sign.hemiparesis
    band: { pct: 33 }
    attrs: { side: -$side }
    note: "двигательные нарушения — у трети больных (492_2, раздел 1.6)"
  # выраженный менингеальный синдром — у трети (раздел 1.6)
  - f: sign.neck_stiffness
    band: { pct: 33 }
    note: "выраженный менингеальный синдром — у трети больных (492_2, раздел 1.6)"
  # «в 1/3 случаев при поражении ЦНС кожных герпетических проявлений не отмечается» (раздел 1.6)
  - f: sign.herpes_labialis
    band: { pct: 67 }
    note: "у двух третей больных — кожные проявления: «в 1/3 случаев… не отмечается» (492_2, раздел 1.6)"
  # ликвор (разделы 1.6 и 2.3.2): лимфоцитарный или смешанный цитоз, белок повышен, эритроциты — примерно у половины; у 5–10 %
  # исходный ликвор нормальный, у 5–10 % первая ПЦР в первые дни отрицательна
  - f: lab.csf_pleocytosis
    band: { pct: 92 }
    note: "у 5–10 % взрослых с доказанным энцефалитом исходный ликвор без цитоза (492_2, раздел 2.3.2)"
  - { f: lab.csf_protein_high, band: usually }
  - f: lab.csf_blood
    band: { pct: 50 }
    note: "эритроцитов в ликворе больше нормы примерно в 50 % случаев (492_2, раздел 2.3.2)"
  - f: lab.csf_hsv
    band: { pct: 92 }
    note: "у 5–10 % первая ПЦР ликвора в первые дни отрицательна (492_2, раздел 2.3.2)"
  # очаги в лобно-височной области (раздел 2.4) — на стороне параметра; на МРТ видно у большинства — игровая оценка
  - { f: img.temporal_lesion, band: usually, attrs: { side: $side } }
# этиологический диагноз — ПЦР ликвора: «"золотой" стандарт» (раздел 2.3.2); КТ и МРТ «не достаточны для постановки
# этиологического диагноза» (раздел 2.4)
confirm: [exam.lumbar_puncture]
# кома и судороги — показание к пересмотру тактики и ОРИТ (разделы 2.5 и 6)
redFlags: [sign.gcs_coma, sym.seizure]
# лихорадка с менингеальными знаками — менингококковая инфекция; внезапная афазия и парез — инсульт; судороги — первый
# приступ; изменения поведения принимают за психическое заболевание или опьянение (раздел 2.2)
differential: [cond.meningococcal, cond.stroke_ischemic, cond.seizure]
treatment:
  # ацикловир в вену — препарат выбора при поражении ЦНС; «не следует откладывать до установления диагноза» (раздел 3.1.1,
  # УУР С, УДД 5): обязательно — и здесь, и до перевода; первой линии сверх него нет
  firstLine: []
  require: [tx.acyclovir_iv]
  beforeTransfer: [tx.acyclovir_iv]
  # жаропонижающие при температуре выше 38 (раздел 3.3)
  supportive: [tx.paracetamol]
  # антибиотик в вену, пока бактериальный менингит не исключён, — не ошибка: игровая оценка, в 492_2 об этом нет
  acceptable: [tx.antibiotic_iv]
  # внутрь при поражении ЦНС противовирусное не дают — только в вену (раздел 3.1.1)
  notIndicated: [tx.valaciclovir]
  # где лечить: инфекционное отделение (раздел 6) — в игре палата; судороги — ПИТ под монитором (красный флаг), кома —
  # реанимация, ПИТ не ошибка: «в палатах (блоках) интенсивной терапии, реанимационных отделениях» (разделы 2.5 и 6)
  setting:
    default: ward
    param: { name: coma, map: { yes: ricu, no: ward } }
    redFlag: icu
    also:
      - { when: { coma: [yes] }, settings: [icu] }
texts:
  summary:
    ru: >-
      Вирус простого герпеса, чаще всего тот же, что даёт пузырьки на губах, поражает вещество мозга — височные доли.
      Высокая температура, головная боль, спутанность и странное поведение, судороги, нарушение речи; у трети — парез, у
      трети нет пузырьков на коже. Без лечения болезнь смертельна за одну-две недели. Ацикловир в вену начинают сразу, не
      дожидаясь анализов; диагноз подтверждает ПЦР ликвора, МРТ показывает очаг в височной доле. При судорогах — палата
      интенсивной терапии, при коме — реанимация.
pearls:
  - ru: "Лихорадка со спутанностью, странным поведением или судорогами — ацикловир в вену сразу: ПЦР и МРТ его не задерживают."
  - ru: "Странное поведение при температуре — не психоз и не опьянение, пока не исключён энцефалит."
  - ru: "Пузырьков на губах может не быть, а первая ПЦР в первые дни бывает отрицательной: при подозрении ацикловир не отменяют."
simplified: "Энцефалит в игре — от ВПГ-1 у взрослых с нормальным иммунитетом: ВИЧ, трансплантации и химиотерапии нет, кожных, генитальных и висцеральных форм герпеса и неонатального герпеса — тоже. Повторной ПЦР, антител, ЭЭГ, противосудорожных и мер против отёка мозга нет; курс ацикловира — одной строкой, без доз и почек. Гемипарез запрещает пункцию, как в «Можно ли пункцию»: смещение мозга без снимка не исключить."
sources:
  - { kind: guideline, title: "Простой герпес (ПГ) у взрослых", org: "Минздрав РФ", year: 2025, url: "https://cr.minzdrav.gov.ru/view-cr/492_2", note: "ID 492_2, опубликованы 27.10.2025, применяются; сверено с рубрикатором 06.10.2026; раздел 1.3: 1 на 250 000–500 000, пути передачи — воздушно-капельный и контактно-бытовой; раздел 1.6: начало с лихорадки, слабости, головной боли, рвоты; нарушение сознания у большинства, кома у 12 %; припадки — более 50 %, у трети — начало с судорог; психические расстройства — 80 %; парезы у трети; менингеальный синдром у трети; в 1/3 нет кожных проявлений; без лечения — смерть через 7–14 дней, летальность более 50 %; раздел 2.3.2: ликвор, ПЦР — чувствительность 98 %, специфичность 100 %; раздел 2.4: пункция, противопоказания, КТ и МРТ; раздел 3.1.1: ацикловир в вену, не откладывая до диагноза, 14–21 день; раздел 5.2.2: изоляционные мероприятия к контактным не организуются; раздел 6: госпитализация в инфекционные отделения, ОРИТ при жизнеугрожающих состояниях; полосы без пояснений — игровая оценка" }
review: draft
