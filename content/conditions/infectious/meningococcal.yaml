id: cond.meningococcal
name: { ru: "Менингококковая инфекция" }
# генерализованная форма (spec 2026-10-chapter-4, часть 50а): менингит, менингококкемия или их сочетание (1020_1, разделы
# 1.1 и 1.5) с осложнениями — инфекционно-токсическим шоком и отёком-набуханием мозга. Носительства и назофарингита в игре
# нет. A39 — менингококковая инфекция
icd10: A39
department: dept.infectious
system: nerves
kind: disease
severity: critical
# госпитализация обязательна — в инфекционный стационар врачебной бригадой скорой (раздел 6): в игре привозит скорая
arrival: ambulance
# воздушно-капельный путь (раздел 1.1): отдельный бокс до клинического выздоровления (раздел 5.1)
isolation: airborne
epidemiology:
  # генерализованная форма в России — 0,45 на 100 тыс. в год, у взрослых реже, чем у детей (раздел 1.3): реже всего в
  # базе, как субарахноидальное кровоизлияние; полоса — игровая оценка
  prevalence: ultra_rare
  # закрытые коллективы — воинские части, общежития, хостелы (раздел 2.1): пик у молодых — игровая оценка; сезонности нет
  # (раздел 1.3)
  age: { min: 18, peak: [18, 30] }
params:
  # форма (раздел 1.5): «наиболее часто встречается сочетанная (смешанная) форма» (раздел 1.6); доли — игровая оценка
  form: { mixed: 50, meningitis: 25, sepsis: 25 }
  # инфекционно-токсический шок — осложнение менингококкемии (Термины): у менингококкемии и сочетанной формы. В ОРИТ — 69 %
  # госпитализированных в 2025 году (раздел 7); в игре в ПИТ или реанимацию — около половины: доля — игровая оценка
  shock: { no: 45, yes: 55 }
  # отёк-набухание головного мозга — осложнение менингита (Термины): у менингита и сочетанной формы; тяжёлый, с дислокацией, —
  # у 10–20 % генерализованных форм (раздел 1.6)
  edema: { no: 80, yes: 20 }
  # производные — доли для вывода: шок — 0,75 × 0,55, отёк мозга — 0,75 × 0,2
  itsh: { no: 59, yes: 41 }
  ongm: { no: 85, yes: 15 }
derived:
  itsh: { all: { form: [sepsis, mixed], shock: [yes] } }
  ongm: { all: { form: [meningitis, mixed], edema: [yes] } }
course:
  stages:
    - { id: acute, days: [0, 3] }
    - { id: resolution, days: [3, 14], needs: treatment }
  # к врачу — в первые сутки-двое: «Без адекватной терапии в течение 1-2 суток наступает летальный исход» (раздел 1.6)
  presentation: [0, 2]
  # «Выздоровление при менингококковой инфекции без медицинской помощи практически невозможно» (приложение В): хуже — почти
  # всегда; при шоке и отёке мозга — в первые сутки (раздел 1.6.2: смерть через 20–48 часов от начала)
  untreated:
    - { band: always, days: [0, 1], when: { itsh: [yes] } }
    - { band: always, days: [0, 1], when: { ongm: [yes] } }
    - { band: always, days: [1, 2] }
  # антибиотик 7–10 дней, выписка — после санации ликвора и нормальной температуры 5 дней и больше (разделы 3.1.1 и 6.2);
  # сутки — игровая оценка
  stay: [10, 14]
findings:
  # интоксикация у каждого (раздел 1.1): лихорадка, озноб, резкая слабость, боли в мышцах (раздел 2.1); полосы — игровая
  # оценка
  - { f: sym.fever_hx, band: always }
  - { f: sym.chills, band: usually }
  - { f: sym.fatigue, band: usually }
  - { f: sym.myalgia, band: sometimes }
  # при шоке «температура быстро снижается до нормального или субнормального уровня» (раздел 1.6)
  - { f: vital.fever, band: usually, when: { form: [meningitis] } }
  - { f: vital.fever, band: usually, when: { form: [sepsis, mixed], shock: [no] } }
  - { f: vital.fever, band: sometimes, when: { form: [sepsis, mixed], shock: [yes] } }
  - { f: vital.tachycardia, band: usually }
  - { f: lab.crp_high, band: usually }
  # лейкоцитоз 16–40 × 10⁹/л, при шоке — лейкопения (раздел 2.3)
  - { f: lab.wbc_high, band: usually, when: { form: [meningitis] } }
  - { f: lab.wbc_high, band: usually, when: { form: [sepsis, mixed], shock: [no] } }
  - { f: lab.wbc_high, band: sometimes, when: { form: [sepsis, mixed], shock: [yes] } }
  # менингит (раздел 1.6; 2.1): головная боль быстро усиливается и становится распирающей, усиливается от света и звука, рвота
  # «фонтаном»; менингеальные знаки — к концу первых суток, в первые часы могут быть отрицательны (раздел 2.2)
  - f: sym.headache
    band: { pct: 100 }
    when: { form: [meningitis, mixed] }
    note: "головная боль при менингите — у каждого такого больного: «быстро усиливается и к концу суток становится сильной, распирающей» (1020_1, раздел 1.6)"
  - { f: sym.headache_severe, band: usually, when: { form: [meningitis, mixed] } }
  - { f: sym.headache, band: often, when: { form: [sepsis] } }
  - { f: sym.vomiting, band: usually, when: { form: [meningitis, mixed] } }
  - { f: sym.photophobia, band: often, when: { form: [meningitis, mixed] } }
  - { f: sign.neck_stiffness, band: usually, when: { form: [meningitis, mixed] } }
  # ликвор при менингите (разделы 1.6 и 2.3): мутный, тысячи нейтрофилов, белок до 1,5–6 г/л, глюкоза ниже 1,5 — к 3-му дню;
  # ПЦР находит ДНК менингококка
  - f: lab.csf_pleocytosis
    band: { pct: 100 }
    when: { form: [meningitis, mixed] }
    note: "менингит — воспаление оболочек мозга: клеток в ликворе больше нормы у каждого такого больного (1020_1, раздел 1.6)"
  - { f: lab.csf_purulent, band: usually, when: { form: [meningitis, mixed] } }
  - { f: lab.csf_protein_high, band: usually, when: { form: [meningitis, mixed] } }
  - { f: lab.csf_glucose_low, band: often, when: { form: [meningitis, mixed] } }
  - { f: lab.csf_meningococcus, band: always, when: { form: [meningitis, mixed] } }
  # без отёка мозга — средней тяжести: менингеальные симптомы без общемозговых (раздел 1.6); оглушение — иногда
  - { f: sign.gcs_low, band: sometimes, when: { form: [meningitis, mixed], edema: [no] } }
  # отёк-набухание мозга (разделы 1.6 и 2.2): спутанность, возбуждение с быстрым переходом в кому, судороги, нарушения
  # дыхания; давление повышено до 140–180, относительная брадикардия
  - f: sign.gcs_coma
    band: { pct: 100 }
    when: { form: [meningitis, mixed], edema: [yes] }
    note: "отёк мозга в игре — кома, 8 баллов и меньше по шкале Глазго, у каждого такого больного: «психомоторное возбуждение с быстрым переходом в кому» (1020_1, раздел 1.6)"
  - { f: sym.confusion, band: usually, when: { form: [meningitis, mixed], edema: [yes] } }
  - { f: sym.seizure, band: often, when: { form: [meningitis, mixed], edema: [yes] } }
  - { f: vital.bp_high, band: sometimes, when: { form: [meningitis, mixed], edema: [yes] } }
  - { f: vital.bradycardia, band: sometimes, when: { form: [meningitis], edema: [yes] } }
  - { f: vital.tachypnea, band: often, when: { form: [meningitis, mixed], edema: [yes] } }
  - { f: vital.spo2_low, band: sometimes, when: { form: [meningitis, mixed], edema: [yes] } }
  # менингококкемия: геморрагическая сыпь в первые сутки — в 100 % (приложение А3.5); шок бывает и до сыпи (раздел 1.6)
  - { f: sign.petechial_rash, band: always, when: { form: [sepsis, mixed] } }
  # сыпь замечают и сами — со слов больного или родных (раздел 2.1: выяснить о сыпи); доля — игровая оценка
  - { f: sym.rash_spots, band: usually, when: { form: [sepsis, mixed] } }
  # тяжёлая — сыпь крупная, сливающаяся, с некрозами на лице и туловище (раздел 1.6)
  - { f: sign.rash_spreading, band: usually, when: { form: [sepsis, mixed], shock: [yes] } }
  - { f: sign.rash_spreading, band: rarely, when: { form: [sepsis, mixed], shock: [no] } }
  # инфекционно-токсический шок (разделы 2.1–2.2, схема 2): давление ниже 90, холодная бледная кожа, одышка чаще 22,
  # олигурия, ацидоз, тромбоцитопения; боли в животе и конечностях
  - f: vital.bp_low
    band: { pct: 100 }
    when: { form: [sepsis, mixed], shock: [yes] }
    note: "шок в игре — верхнее давление ниже 90 у каждого такого больного: критерий госпитализации в ОРИТ при ИТШ (1020_1, раздел 2.2); компенсированная фаза с нормальным давлением в игре — без шока"
  - { f: vital.tachycardia, band: always, when: { form: [sepsis, mixed], shock: [yes] } }
  - { f: sign.cold_clammy, band: usually, when: { form: [sepsis, mixed], shock: [yes] } }
  - { f: vital.tachypnea, band: usually, when: { form: [sepsis, mixed], shock: [yes] } }
  - { f: vital.spo2_low, band: sometimes, when: { form: [sepsis, mixed], shock: [yes] } }
  - { f: sym.less_urine, band: often, when: { form: [sepsis, mixed], shock: [yes] } }
  - { f: sym.abdominal_pain, band: sometimes, when: { form: [sepsis, mixed], shock: [yes] } }
  - { f: sign.gcs_low, band: often, when: { form: [sepsis, mixed], shock: [yes] } }
  - { f: lab.lactate_high, band: always, when: { form: [sepsis, mixed], shock: [yes] } }
  - { f: lab.platelets_low, band: usually, when: { form: [sepsis, mixed], shock: [yes] } }
  - { f: lab.platelets_low, band: rarely, when: { form: [sepsis, mixed], shock: [no] } }
  - { f: lab.creatinine_high, band: often, when: { form: [sepsis, mixed], shock: [yes] } }
  # эпиданамнез (раздел 2.1): контакт с лихорадящими больными в последние 7–10 дней, закрытый коллектив — игровая оценка
  - { f: hx.sick_contact, band: sometimes }
  # психомоторное возбуждение при отёке-набухании мозга (spec 2026-10-chapter-4, часть 50б; 1020_1, раздел 1.6) — со слов
  # родных «ведёт себя странно»; доля — игровая оценка. В конце списка: прежние больные остались прежними
  - { f: sym.strange_behavior, band: often, when: { form: [meningitis, mixed], edema: [yes] } }
# клинико-лабораторный диагноз допустим и при отрицательных посеве и ПЦР (раздел 2.3): лечение ликвора не ждёт
confirm: clinical
redFlags: [vital.bp_low, sign.rash_spreading, sign.gcs_coma]
# лихорадка с шоком — сепсис другой причины, головная боль и ригидность затылка — субарахноидальное кровоизлияние,
# лихорадка с головной болью — грипп (раздел 2.5)
differential: [cond.sepsis, cond.sah, cond.influenza]
treatment:
  # антибиотик в вену — цефалоспорины III поколения, цефтриаксон или цефотаксим, первый выбор (раздел 3.1.1, УУР С, УДД 4);
  # в игре — «антибиотик широкого спектра в вену», не позже часа (срок — `targets/`); первой линии сверх обязательного нет.
  # Внутрь при генерализованной форме антибиотики не применяют
  firstLine: []
  # лихорадка выше 38,5 — парацетамол (раздел 3.1.2)
  supportive: [tx.paracetamol]
  notIndicated: [tx.amoxicillin, tx.amoxicillin_clavulanate, tx.macrolide, tx.fluoroquinolone, tx.cephalosporin_oral, tx.dopamine]
  # кровь на посев — до антибиотика (раздел 2.3; критерий качества 6), антибиотик в вену (раздел 3.1.1, УУР В, УДД 3: не
  # позднее 1 часа после поступления и диагноза; критерий качества 11) — и здесь, и до перевода
  require: [tx.blood_culture, tx.antibiotic_iv]
  beforeTransfer: [tx.blood_culture, tx.antibiotic_iv]
  byParam:
    # шок: сбалансированные растворы — незамедлительно (раздел 3.1.2, УУР В, УДД 1; критерий качества 10), норэпинефрин —
    # первая линия вазопрессоров (УУР В, УДД 2) под монитором; раствор — и до перевода
    - when: { itsh: [yes] }
      require: [tx.norepinephrine, [tx.balanced_fluids, tx.iv_fluids]]
      beforeTransfer: [[tx.balanced_fluids, tx.iv_fluids]]
    # отёк мозга: дексаметазон до первой дозы антибиотика или вместе с ней (раздел 3.1.2, УУР В, УДД 1); ИВЛ — в реанимации,
    # перевозят только с ней (приложение А3.3); дексаметазон — и до перевода
    - when: { ongm: [yes] }
      require: [tx.steroid_iv, tx.ventilation]
      beforeTransfer: [tx.steroid_iv]
    # менингит без отёка мозга: дексаметазон до антибиотика снижает частоту тугоухости (раздел 3.1.2) — не ошибка
    - when: { form: [meningitis, mixed], ongm: [no] }
      acceptable: [tx.steroid_iv]
    # менингококкемия с шоком: гидрокортизон — при рефрактерном шоке (раздел 3.1.2) — не ошибка; без шока «применение
    # глюкокортикоидов с профилактической целью… не показано»
    - when: { form: [sepsis], itsh: [yes] }
      acceptable: [tx.steroid_iv]
    - when: { form: [sepsis], itsh: [no] }
      notIndicated: [tx.steroid_iv]
  # где лечить (раздел 6): инфекционная больница или отделение с боксами — в игре бокс; при шоке и отёке мозга — ОРИТ в
  # течение 30 минут (раздел 6.1): шок — ПИТ под монитором (реанимация не ошибка), отёк мозга — реанимация с ИВЛ
  setting:
    default: box
    param: { name: ongm, map: { yes: ricu, no: box } }
    redFlag: icu
texts:
  summary:
    ru: >-
      Менингококк проник в кровь или под оболочки мозга. Менингит — распирающая головная боль, рвота, ригидность
      затылка; менингококкемия — тёмно-красная сыпь звёздочками на ногах и ягодицах в первые сутки лихорадки; чаще всего
      то и другое вместе. Лихорадка с геморрагической сыпью — менингококковая инфекция, пока не доказано иное: кровь на
      посев и антибиотик в вену не позже часа. При шоке — растворы и норэпинефрин, при отёке мозга — дексаметазон и ИВЛ.
      Пункцию делают, только если нет противопоказаний. Лечат в боксе, при шоке и коме — в реанимации.
pearls:
  - ru: "Лихорадка и сыпь, которая не бледнеет под стаканом, — антибиотик в вену в первый час. Ликвор и анализы его не задерживают."
  - ru: "Менингеальных знаков в первые часы может не быть, а при шоке — сыпи и высокой температуры: падение температуры к норме — не улучшение."
  - ru: "Пункцию при коме, судорогах, шоке и нарастающей сыпи не делают: возможно вклинение мозга. Диагноз подтвердят посев и ПЦР крови."
simplified: "Носительства, назофарингита и редких форм — пневмонии, артрита, эндокардита — нет; серогрупп, повторных случаев при дефиците комплемента и синдрома Уотерхауса-Фридериксена — тоже. Антибиотик — одной строкой «широкого спектра в вену», без выбора между цефтриаксоном и цефотаксимом. Отёк мозга в игре — кома; маннитола, гидрокортизона при рефрактерном шоке, гемосорбции и профилактики контактным нет. Ликвор — одной пункцией, без контрольной на 7–10-е сутки."
sources:
  - { kind: guideline, title: "Менингококковая инфекция", org: "Минздрав РФ", year: 2026, url: "https://cr.minzdrav.gov.ru/view-cr/1020_1", note: "ID 1020_1, опубликованы 20.01.2026, применяются; сверено с рубрикатором 06.10.2026; разделы 1.1–1.6: определение, формы, эпидемиология (0,45 на 100 тыс.), клиника менингита и менингококкемии, ИТШ и ОНГМ; раздел 2.1–2.3: жалобы, менингеальные знаки, ликвор, посев крови до антибиотика, ПЦР; раздел 3.1.1: цефалоспорины III поколения, антибиотик в вену не позднее 1 часа; раздел 3.1.2: ОРИТ при ИТШ и ОНГМ, сбалансированные растворы, норэпинефрин первой линии, дексаметазон до антибиотика или вместе с ним, ИВЛ; раздел 6 и 6.1: госпитализация в боксы, ОРИТ в течение 30 минут; раздел 7: в ОРИТ — 69 % в 2025 году; приложение А3.3: противопоказания к пункции; приложение В: без медицинской помощи выздоровление практически невозможно; доли форм и осложнений, полосы без пояснений — игровая оценка" }
review: draft
