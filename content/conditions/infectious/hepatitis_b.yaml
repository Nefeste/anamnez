id: cond.hepatitis_b
name: { ru: "Острый гепатит B" }
# острый вирусный гепатит B (spec 2026-10-chapter-4, часть 52а; 672_2): гемоконтактный механизм — инъекции, переливания,
# операции, половой путь (раздел 1.3). В игре — желтушная форма без дельта-агента: с ней приходят; безжелтушных, стёртых,
# хронического гепатита и носительства нет. B16.9 — острый гепатит B без дельта-агента и без печёночной комы
icd10: B16.9
department: dept.infectious
# вирусный гепатит, как и гепатит A: перепутали — диагноз частично верный
group: grp.viral_hepatitis
system: digestive
kind: disease
severity: moderate
# бокса в 672_2 нет: кровь и половой путь, не кишечная инфекция — больной в общей палате инфекционного отделения не опасен;
# госпитализируют всех (разделы 3 и 6, УУР С, УДД 5)
epidemiology:
  # «регистрируются единичные случаи ОГВ» после массовой иммунизации (раздел 1.3): самая редкая полоса; возраст — игровая
  # оценка, сезонности нет
  prevalence: ultra_rare
  age: { min: 18, peak: [20, 50] }
params:
  # тяжесть (приложение А3): лёгкая — билирубин до 100; средняя — 100–200; тяжёлая — выше 200, ПТИ ниже 80; фульминантная —
  # «прекома, кома, признаки массивного некроза печени» (раздел 3.1.2), ОПН «в 0,8-1% случаев» (раздел 1.6) — своим значением.
  # Долей в 672_2 нет; желтушные — треть случаев (раздел 1.6), поэтому тяжёлых среди желтушных больше — игровая оценка
  severity: { mild: 35, moderate: 45, severe: 18, fulminant: 2 }
course:
  stages:
    - { id: icteric, days: [0, 42] }
  # преджелтушный период — 8–12 дней и больше, «болезнь начинается постепенно» (раздел 1.6): к врачу — с желтухой
  presentation: [0, 7]
  # лёгкая и средняя проходят сами: хронизация у взрослых — 6–10 % (раздел 1.6), её в игре нет
  selfLimiting: { when: { severity: [mild, moderate] } }
  # тяжёлая без противовирусного — осложнения (раздел 3.1.1): хуже часто; фульминантная — почти всегда; игровая оценка
  untreated:
    - { band: always, days: [0, 2], when: { severity: [fulminant] } }
    - { band: often, days: [3, 10], when: { severity: [severe] } }
  # выписка — АЛТ ниже 150, билирубин до 40, ПТИ не ниже 80 (раздел 6); желтуха — 2–6 недель (раздел 1.6): в стационаре 21–35
  # дней, игровая оценка
  stay: [21, 35]
findings:
  - f: sym.yellow_skin
    band: { pct: 100 }
    note: "в игре — желтушная форма: с ней приходят (672_2, раздел 1.6)"
  - f: sign.jaundice
    band: { pct: 100 }
    note: "желтуха нарастает, «достигая максимума на 2-3 неделе» (672_2, раздел 1.6)"
  - { f: sym.dark_urine, band: usually }
  - { f: sym.pale_stool, band: often }
  # «С появлением желтухи самочувствие больных не улучшается»: слабость, анорексия, тошнота, горечь во рту, головная боль
  # (раздел 1.6)
  - { f: sym.fatigue, band: always }
  - { f: sym.anorexia, band: usually }
  - { f: sym.nausea, band: usually }
  - { f: sym.vomiting, band: sometimes, when: { severity: [mild, moderate] } }
  - { f: sym.vomiting, band: usually, when: { severity: [severe, fulminant] } }
  - { f: sym.ruq_pain, band: often }
  - { f: sym.headache, band: sometimes }
  # лихорадка — не главная: субфебрилитет в продроме, в желтушном периоде температура нормальная (приложение А3); при тяжёлой
  # — фебрильная на фоне желтухи
  - { f: sym.fever_hx, band: sometimes }
  - { f: vital.fever, band: usually, when: { severity: [severe, fulminant] } }
  - { f: sign.hepatomegaly, band: usually }
  - { f: sign.ruq_tenderness, band: often }
  # АЛТ «в 30-50 раз» выше нормы в желтушном периоде (раздел 1.6); тяжёлая — билирубин выше 200 и ПТИ ниже 80 (приложение А3)
  - f: lab.alt_high
    band: { pct: 100 }
    note: "в желтушном периоде АЛТ повышена в десятки раз (672_2, раздел 1.6)"
  - f: lab.bilirubin_high
    band: { pct: 100 }
    note: "у желтушной формы билирубин повышен у каждого (672_2, приложение А3)"
  - f: lab.bilirubin_200
    band: { pct: 100 }
    when: { severity: [severe, fulminant] }
    note: "тяжёлая форма — билирубин «Более 200» мкмоль/л (672_2, приложение А3)"
  - f: lab.pti_low
    band: { pct: 100 }
    when: { severity: [severe, fulminant] }
    note: "тяжёлая форма — ПТИ «Менее 80» % (672_2, приложение А3)"
  - f: lab.hbv_markers
    band: { pct: 100 }
    note: "HBsAg и анти-HBc IgM — в крови уже к концу инкубационного периода (672_2, раздел 2.3.2): у пришедшего с желтухой — у каждого"
  # кровь, уколы, татуировки, связи за 1–6 месяцев (разделы 1.3 и 1.6); источник называет не каждый — игровая оценка
  - { f: hx.parenteral_risk, band: usually }
  # тяжёлая: тахикардия, петехии, носовые кровотечения (приложение А3)
  - { f: vital.tachycardia, band: usually, when: { severity: [severe, fulminant] } }
  - { f: sign.petechial_rash, band: sometimes, when: { severity: [severe, fulminant] } }
  - { f: sym.nosebleed, band: sometimes, when: { severity: [severe, fulminant] } }
  - f: sign.gcs_coma
    band: { pct: 100 }
    when: { severity: [fulminant] }
    note: "фульминантная форма — «прекома, кома» (672_2, раздел 3.1.2): в игре — кома по шкале Глазго"
  # печёночная энцефалопатия: «эйфория/заторможенность, чувство «провалов», эхолалия, астериксис» (672_2, раздел 2.2) — со слов
  # родных путается и засыпает; в конце списка — прежние больные остались прежними
  - f: sym.confusion
    band: { pct: 100 }
    when: { severity: [fulminant] }
    note: "у печёночной комы — печёночная энцефалопатия: заторможенность, «провалы» (672_2, раздел 2.2); родные говорят, что путается и засыпает"
# подтверждают HBsAg и анти-HBc IgM — «самым достоверным специфическим маркёром» (раздел 2.3.2)
confirm: [exam.hepatitis_markers]
redFlags: [sign.gcs_coma, sym.confusion]
# с чем спутать: гепатит A — острое начало, короткий продром, с желтухой лучше; камень в протоке и холецистит (приложение А3)
differential: [cond.hepatitis_a, cond.cholecystitis, cond.biliary_colic]
treatment:
  # базисная терапия — щадящий режим и диета всем (раздел 3.1.2, УУР С, УДД 4)
  firstLine: [tx.liver_diet]
  # дротаверин при ноющих болях в правом подреберье, ибупрофен при лихорадке (раздел 3.1.2, УУР С, УДД 5)
  supportive: [tx.drotaverine, tx.ibuprofen]
  byParam:
    # средняя — инфузионная терапия (раздел 3.1.2, УУР С, УДД 4): не ошибка
    - when: { severity: [moderate] }
      acceptable: [tx.iv_fluids]
    # тяжёлая — энтекавир или тенофовир «с целью предотвращения развития осложнений и хронизации» (раздел 3.1.1, УУР B, УДД 3),
    # усиленная инфузия (раздел 3.1.2); глюкокортикоид — при печёночной недостаточности и нарастающей интоксикации: не ошибка
    - when: { severity: [severe] }
      require: [tx.nucleoside_analog, tx.iv_fluids]
      acceptable: [tx.steroid_iv]
    # фульминантная — противовирусное, инфузия и глюкокортикоид за 30 минут (разделы 3.1.1 и 3.1.2); в коме — ИВЛ не ошибка
    - when: { severity: [fulminant] }
      require: [tx.nucleoside_analog, tx.iv_fluids, tx.steroid_iv]
      acceptable: [tx.ventilation]
  # где лечить: инфекционное отделение — всех (разделы 3 и 6), в игре палата; тяжёлая — ПИТ не ошибка; фульминантная —
  # реанимация (раздел 3.1.2), трансплантация печени — «для повышения их выживаемости» (раздел 3.2, УУР С, УДД 5): перевод не
  # ошибка
  setting:
    default: ward
    param: { name: severity, map: { mild: ward, moderate: ward, severe: ward, fulminant: ricu } }
    redFlag: ricu
    also:
      - { when: { severity: [severe] }, settings: [icu] }
      - { when: { severity: [fulminant] }, settings: [transfer] }
texts:
  summary:
    ru: >-
      Вирус, который передаётся с кровью — через уколы, переливания, татуировки — и при сексе. Болезнь начинается через 1–6
      месяцев исподволь: слабость, нет аппетита, тошнота, иногда боль в суставах; потом темнеет моча и желтеют глаза, а
      легче с желтухой не становится. Подтверждают HBsAg и антитела IgM. Лёгкая и средняя формы проходят сами — режим и
      диета без алкоголя; тяжёлую лечат противовирусными таблетками, молниеносную с комой — в реанимации.
pearls:
  - ru: "Желтуха, а легче не становится, и были уколы или случайные связи — проверьте маркёры гепатита B."
  - ru: "Противовирусное при остром гепатите B — только при тяжёлой и молниеносной форме; лёгкая и средняя проходят сами."
  - ru: "Гепатит B не передаётся с едой и через руки: бокс ему не нужен, а вот инструменты и кровь — опасны."
simplified: "В игре — желтушная форма без дельта-агента: безжелтушной, холестатической, затяжной, хронического гепатита и носительства нет. Тяжесть — по билирубину и протромбиновому индексу; гепатопротекторов, витаминов, лактулозы, плазмы, экстракорпоральной детоксикации и прививок контактным нет; энтекавир и тенофовир — одной строкой, без курса."
sources:
  - { kind: guideline, title: "Острый гепатит В (ГВ) у взрослых", org: "Минздрав РФ", year: 2024, url: "https://cr.minzdrav.gov.ru/view-cr/672_2", note: "ID 672_2, опубликованы 15.10.2024, применяются; сверено с рубрикатором 11.10.2026; раздел 1.3: гемоконтактный механизм, инъекции наркотиков — риск 80–100 %, половой путь, единичные случаи в РФ; раздел 1.6: инкубация 1–6 месяцев, преджелтушный период 8–12 дней, с желтухой не улучшается, АЛТ в 30–50 раз выше нормы, ОПН 0,8–1 %, хронизация 6–10 %; раздел 2.3.2: HBsAg и анти-HBc IgM — самый достоверный маркёр; раздел 3.1.1: энтекавир или тенофовир при тяжёлом и фульминантном течении (УУР B, УДД 3); раздел 3.1.2: режим и диета всем (УУР С, УДД 4), инфузии по тяжести, глюкокортикоиды при фульминантной и тяжёлой форме (УУР С, УДД 5), ОРИТ при ОПечН, ИВЛ в коме, ибупрофен при лихорадке; раздел 3.2: трансплантация при фульминантном течении (УУР С, УДД 5); разделы 3 и 6: госпитализация всех в инфекционное отделение; приложение А3: критерии тяжести; доли тяжести и полосы без пояснений — игровая оценка" }
review: draft
