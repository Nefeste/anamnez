# Подсказка заведующей в первую смену отделения (spec 2026-10-chapter-3, часть 45б): у привезённого с
# инсультом — время от начала, глюкоза, КТ за 40 минут, тромболизис в окне, тест глотания.
id: tip.stroke
order: 11
from: char.neurologist
chapter: chapter.vascular
name: { ru: "Инсульт: счёт от начала" }
when: { condition: cond.stroke_ischemic }
text:
  ru: >-
    Внезапная слабость, перекошенное лицо, нарушенная речь — считаем от начала: тромболизис — в первые
    4,5 часа. Сначала глюкоза — гипогликемия бывает похожа на инсульт, — потом КТ с заключением в первые
    40 минут: кровь на КТ — тромболизис нельзя. Крови и противопоказаний нет — растворяем тромб, а до первой
    еды и таблеток — тест глотания.
see: [cond.stroke_ischemic, exam.ct_head, tx.thrombolysis_stroke, exam.swallow_test]
