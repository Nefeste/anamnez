# Подсказка наставника: первый обход главы 2 — утром после первой смены.
id: tip.rounds
order: 9
from: char.mentor
chapter: chapter.hospital
name: { ru: "Обход" }
when: rounds
text:
  ru: >-
    На обходе смотрите не на число суток, а на показатели по суткам: температура, пульс,
    дыхание. Лучше — лечение действует; хуже — лечение не помогает, его пора сменить.
    Выписывают, когда болезнь прошла: раньше — человек вернётся хуже, позже — койка занята зря.
see: [room.ward]
