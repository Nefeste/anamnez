# Подсказка заведующей в первую смену отделения (spec 2026-10-chapter-3, часть 45б): перекошенное лицо — не
# всегда инсульт; при невропатии лицевого нерва на больной стороне не морщится и лоб (895_1, раздел 1.6).
id: tip.forehead
order: 12
from: char.neurologist
chapter: chapter.vascular
name: { ru: "Лицо и лоб" }
when: { condition: cond.bell_palsy }
text:
  ru: >-
    Перекошенное лицо — не всегда инсульт. Попросите наморщить лоб и зажмуриться: при невропатии лицевого
    нерва на больной стороне не морщится и лоб, а глаз не закрывается; при инсульте лоб морщится. Такой
    парез — не повод для экстренной КТ: глюкокортикоид лучше в первые 72 часа, а глаз берегут каплями и
    гелем.
see: [cond.bell_palsy, sign.facial_palsy_peripheral, tx.steroid_systemic_short, tx.eye_lubricant]
