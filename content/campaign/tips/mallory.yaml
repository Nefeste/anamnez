# Подсказка заведующей реанимацией в первую смену с ней (spec 2026-10-chapter-4, часть 60б): у пришедшего со рвотой
# кровью — ЭГДС в первые 2 часа, гемостаз через эндоскоп, ингибитор протонной помпы в вену (1026_1, 277_2).
id: tip.mallory
order: 14
from: char.icu_head
chapter: chapter.city
name: { ru: "Кровь после рвоты" }
when: { condition: cond.mallory_weiss }
text:
  ru: >-
    Рвота кровью после многократной рвоты — чаще всего разрыв слизистой у входа в желудок, синдром
    Мэллори–Вейсса; но так кровит и язва. Что именно — покажет ЭГДС, и сделать её нужно в первые 2 часа
    от поступления: продолжающееся кровотечение остановят через эндоскоп тут же. Ингибитор протонной
    помпы в вену — сразу; место — палата.
see: [cond.mallory_weiss, exam.egd, tx.endoscopic_hemostasis, tx.ppi_iv]
