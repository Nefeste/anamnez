# Подсказка наставника: у пациентки с циститом (заданный пациент главы 1).
id: tip.urine
order: 5
from: char.mentor
name: { ru: "Жалобы на мочеиспускание" }
when: { condition: cond.cystitis }
text:
  ru: >-
    При жалобах на мочеиспускание сделайте тест-полоску мочи прямо в кабинете: за пару минут
    видны лейкоциты и нитриты, лаборатория для этого не нужна. Отрицательная полоска при
    типичных жалобах цистит не исключает.
see: [exam.urine_dipstick, cond.cystitis]
