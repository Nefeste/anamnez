# Подсказка заведующей реанимацией в первую смену с ней (spec 2026-10-chapter-4, часть 60б): у пришедшей с поносом и
# тяжёлым обезвоживанием — растворы в вену, бокс, без антибиотика (875_1).
id: tip.dehydration
order: 15
from: char.icu_head
chapter: chapter.city
name: { ru: "Понос и бокс" }
when: { condition: cond.gastroenteritis }
text:
  ru: >-
    Понос и рвота с жаждой, сухим языком и редкой мочой — обезвоживание, и его степень решает, где и как
    лечить. Лёгкое и среднее — питьё солевых растворов дома; тяжёлое — растворы в вену в боксе: кишечная
    инфекция заразна, и в общей палате от больного заразятся соседи. Антибиотик при водянистом поносе
    не нужен.
see: [cond.gastroenteritis, tx.ors, tx.balanced_fluids, room.box]
