# Подсказка заведующей сосудистым отделением в первую смену отделения (spec 2026-10-chapter-3, часть 45б):
# у привезённого с инфарктом — ЭКГ у постели, стенка, тромболизис здесь и перевод.
id: tip.stemi
order: 10
from: char.neurologist
chapter: chapter.vascular
name: { ru: "Инфаркт и минуты" }
when: { condition: cond.acs }
text:
  ru: >-
    ЭКГ у постели — в первые 10 минут. Подъём ST в отведениях II, III и aVF — инфаркт нижней стенки.
    До сосудистого центра два часа: если от начала боли прошло меньше 12 часов, тромб растворяем здесь.
    Сначала спросите о противопоказаниях, потом — тромболизис с его спутниками и сразу перевод.
see: [cond.acs, tx.thrombolysis, exam.ecg]
