# Подсказка наставника (часть 100, spec 2026-10-publish-ready; ответ владельца на вопрос 67): в учебный день, когда во
# время приёма впервые ждёт кто-то срочнее, — что значат метки в очереди и «Попросить подождать».
id: tip.labels
order: 16
from: char.mentor
chapter: chapter.district
name: { ru: "Метки в очереди" }
when: urgent
text:
  ru: >-
    Пока вы с этим пациентом, в очереди ждёт кто-то срочнее. Метки ставит медсестра по жалобам: «срочно» —
    звать сразу, «нужно скоро» — не держать долго, остальные — по порядку. Если с этим пациентом сейчас
    ждать нечего, попросите его подождать в очереди и примите срочного, а потом вернитесь.
