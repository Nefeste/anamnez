# Подсказка заведующей реанимацией в первую смену с ней (spec 2026-10-chapter-4, часть 60б): у привезённого с
# септическим шоком — qSOFA, час на антибиотик от предположения, посевы до него, раствор и норэпинефрин (898_1).
id: tip.sepsis
order: 13
from: char.icu_head
chapter: chapter.city
name: { ru: "Сепсис: час на антибиотик" }
when: { condition: cond.sepsis }
text:
  ru: >-
    Давление 100 и ниже, дыхание 22 в минуту и чаще, спутанность — это qSOFA. Два признака у больного с
    инфекцией — сепсис, пока не доказано иное, и часы идут от этой минуты: при шоке антибиотик широкого
    спектра — в первый час, без шока — в первые три. Кровь на посев — до него, если это его не задержит.
    Сбалансированный раствор в вену; давление не держится — норэпинефрин под монитором; место — ПИТ.
see: [cond.sepsis, tx.blood_culture, tx.antibiotic_iv, tx.balanced_fluids, tx.norepinephrine]
