# Подсказка заведующего хирургией в первую смену главы 2: у пациента с аппендицитом.
id: tip.appendicitis
order: 8
from: char.surgeon
chapter: chapter.hospital
name: { ru: "Аппендицит и время" }
when: { condition: cond.appendicitis }
text:
  ru: >-
    При подозрении на аппендицит решает время. Боль, что началась у пупка и ушла вправо вниз,
    тошнота, отказ от еды, болезненность справа внизу живота, лейкоциты в анализе крови — чем
    больше этого, тем вероятнее аппендицит. Неосложнённый аппендицит оперируют в первые сутки
    после поступления: пока человек ждёт, растёт риск перфорации.
see: [cond.appendicitis, tx.appendectomy]
