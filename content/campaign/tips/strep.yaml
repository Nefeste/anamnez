# Подсказка наставника: у пациента со стрептококковой ангиной (заданный пациент главы 1).
id: tip.strep
order: 3
from: char.mentor
name: { ru: "Горло и антибиотик" }
when: { condition: cond.strep_pharyngitis }
text:
  ru: >-
    Боль в горле чаще всего вирусная, и антибиотик при ней не помогает. Нужен ли он, решает
    экспресс-тест на стрептококк: положительный — нужен, отрицательный — лечим как вирусную
    инфекцию. Налёты на миндалинах, болезненные узлы на шее, температура без кашля — чем
    больше этого, тем нужнее тест.
see: [exam.strep_rapid, cond.strep_pharyngitis]
