# Подсказка наставника в первую смену главы 2 (spec 2026-09-chapter-2, часть 34б): скорая
# привезла первого — ждёт сортировки.
id: tip.handover
order: 7
from: char.mentor
chapter: chapter.hospital
name: { ru: "Лист передачи" }
when: ambulance
text:
  ru: >-
    Скорая привезла человека — сначала лист передачи. Давление, пульс, частота дыхания,
    сатурация, температура и сознание — по ним решайте, кого смотреть первым: красного — сразу,
    жёлтого — скоро, зелёного — в порядке очереди. После смены вашу сортировку сверят со шкалой
    NEWS2.
see: [room.emergency]
