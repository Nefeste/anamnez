# Глава 4 «Большая больница» (spec 2026-10-chapter-4, часть 60а): городская больница в областном центре Верхнеборске —
# вымышленном, как Заречный и Нижнеборск (вопрос 29). Переход — как из главы 1 в главу 2: врач, сложность, достижения и
# энциклопедия — прежние, больница, штат и касса — новые; районная больница с сосудистым отделением остаётся в «Смене».
# Готовая больница `preset.city` — 56 × 40: приёмное, кабинеты, лаборатория, рентген, УЗИ, КТ, ЭКГ, операционная, палаты и
# ПИТ. Реанимацию, боксы, эндоскопию и МРТ врач строит заданиями главы (в записи больницы они `later`), специалистов —
# нанимает (`specialists`): гастроэнтеролога, эндокринолога, инфекциониста. Бюджет — на реанимацию с ИВЛ на шесть коек,
# три бокса и эндоскопический кабинет с видеоэндоскопом (около 1,8 млн; коридор к ним уже проложен) и запас на первые
# зарплаты нового штата; томограф МРТ (4,6 млн с кабинетом) — из заработанного, это дополнительное задание. Сумма
# игровая. Отделение главы — терапия, как в главах 1–3: больных инфекционного отделения привозят и
# записывают, когда работает бокс, неврологию — с кабинетом КТ (их `admits`). Сроки заданий — записи `targets/` с их
# источниками; антибиотик при сепсисе — срок без шока со сроком при шоке в его серии
id: chapter.city
order: 4
name: { ru: "Большая больница" }
place: { ru: "городская больница в Верхнеборске" }
move: { ru: "Перейти в городскую больницу" }
preset: preset.city
budget: 2500000
department: dept.therapy
specialists: true
build: [room.reception, room.waiting, room.office, room.triage, room.procedure, room.lab, room.ecg, room.xray, room.toilet, room.staff, room.emergency, room.ward, room.or, room.ultrasound, room.ct, room.icu, room.ricu, room.box, room.endoscopy, room.mri]
# первая смена с заведующей реанимацией (часть 60б) — в первый день главы, когда работают эндоскопический кабинет и бокс:
# без них кровотечение и заразного переводят. Первая — скорая с септическим шоком при остром пиелонефрите (посевы,
# антибиотик в первый час, раствор, норэпинефрин, ПИТ); потом пришедший сам со рвотой кровью — разрыв Мэллори–Вейсса,
# кровотечение продолжается (ЭГДС в первые 2 часа и гемостаз через эндоскоп); потом пришедшая сама — гастроэнтерит с
# обезвоживанием III степени (бокс, растворы в вену, без антибиотика: II степень по 875_1 лечат дома). Каждый — не раньше
# чем через 40 минут после предыдущего, как в главе 3. Жалобы заданы: у шока — жар и боль в пояснице (без жара qSOFA не
# считают, и срока антибиотика в карте не было бы), у разрыва — рвота кровью (срок ЭГДС — по ней)
tutorialRoom: [room.endoscopy, room.box]
tutorialGap: 40
tutorial:
  - { condition: cond.sepsis, ambulance: true, params: { source: urinary, shock: yes }, complaints: [sym.fever_hx, sym.flank_pain] }
  - { condition: cond.mallory_weiss, params: { active: yes }, complaints: [sym.hematemesis] }
  - { condition: cond.gastroenteritis, params: { severity: severe } }
missions:
  - id: ricu
    main: true
    kind: roomWorks
    room: room.ricu
    text: { ru: "Открыть реанимацию: построить, поставить у коек мониторы с дефибриллятором и аппараты ИВЛ, нанять медсестру и анестезиолога-реаниматолога" }
  - id: box
    main: true
    kind: roomWorks
    room: room.box
    text: { ru: "Открыть инфекционное отделение: построить бокс, нанять медсестру" }
  - id: endoscopy
    main: true
    kind: roomWorks
    room: room.endoscopy
    text: { ru: "Открыть эндоскопию: построить кабинет, поставить видеоэндоскоп, нанять эндоскописта и медсестру" }
  - id: staff
    main: true
    kind: staff
    count: 100
    accuracy: 85
    doctors: 3
    text: { ru: "Отделение с тремя врачами: 100 приёмов специалистов с точностью от 85 %" }
  # трое, а не пятеро (часть 60а): сепсис привозят три-четыре раза в месяц — пятерых подряд ждать дольше месяца
  - id: sepsis
    main: true
    kind: deadline
    target: target.sepsis_abx
    count: 3
    text: { ru: "Сепсис: антибиотик в срок — три больных подряд" }
  - id: mortality
    main: true
    kind: mortality
    days: 7
    percent: 2
    lying: 30
    text: { ru: "Неделя, когда в стационаре умерло не больше 2 % лежавших" }
  - id: mri
    main: false
    kind: roomWorks
    room: room.mri
    text: { ru: "Открыть кабинет МРТ: построить, поставить томограф 1,5 Тл, нанять рентгенолаборанта и рентгенолога" }
  - id: egd
    main: false
    kind: deadline
    target: target.egd_bleeding
    count: 5
    text: { ru: "ЭГДС при кровотечении в первые 2 часа: пять больных подряд" }
  - id: isolation
    main: false
    kind: days
    days: 5
    day: noInfectiousInWard
    text: { ru: "Пять смен без заразного больного в общей палате" }
letters:
  - id: hello
    from: char.city_chief
    when: start
    text:
      ru: >-
        Коллега, добро пожаловать в Верхнеборск. Городская больница принимает весь областной центр:
        приёмное, палаты, операционная, палата интенсивной терапии, КТ. Чего у нас нет — реанимации с
        аппаратами ИВЛ, инфекционного отделения, эндоскопии и МРТ: тяжёлых, заразных и кровотечения мы до
        сих пор переводили. Место под них — внизу участка, у третьего коридора; деньги на реанимацию, боксы
        и эндоскопию — в кассе. Томограф МРТ дорог, на него заработаем сами. И ещё: кабинеты для трёх
        специалистов стоят пустыми — нанять их вам.
  - id: sepsis
    from: char.icu_head
    when: start
    text:
      ru: >-
        Здравствуйте. Я заведую реанимацией — пока у меня только палата интенсивной терапии, без ИВЛ.
        Главное в городской больнице — сепсис. Заподозрить его помогает qSOFA: давление 100 и ниже,
        дыхание 22 в минуту и чаще, спутанность. Два признака из трёх у больного с инфекцией — и часы
        пошли: при шоке антибиотик нужен в первый час, без шока — в первые три, а кровь на посев берут
        до него, если это не задержит антибиотик. Срок считается не от прихода, а от того, когда сепсис
        можно было предположить. Когда заработают эндоскопия и боксы, первую смену в них проведём вместе.
  - id: team
    from: char.mentor
    when: start
    text:
      ru: >-
        Поздравляю с большим делом. Теперь вы работаете не в одиночку: специалисты ведут своих записанных
        сами, «красных» и привезённых скорой не берут — это ваши. Любой их случай можно открыть и забрать себе, если
        сомневаетесь. А вам остаётся то, где нужен опытный взгляд: сепсис, кровотечение, кома без ясной
        причины.
  - id: firstDay
    from: char.icu_head
    when: { afterDay: 1 }
    text:
      ru: >-
        Первая смена в городской больнице позади. В итогах дня — строка сроков: антибиотик при сепсисе,
        ЭГДС при кровотечении. А смертность считают за неделю: сколько умерло из всех, кто за неё лежал в
        стационаре, — и в палатах, и в ПИТ.
  - id: ricuDone
    from: char.icu_head
    when: { mission: ricu }
    text:
      ru: >-
        Реанимация открыта: у каждой койки монитор и аппарат ИВЛ. Кому нужна вентиляция — кома при
        отравлении, ботулизм, миастенический криз, — теперь остаётся у нас, а не едет в другую больницу.
  - id: boxDone
    from: char.city_chief
    when: { mission: box }
    text:
      ru: >-
        Инфекционное отделение работает: заразного кладут в бокс, отдельно от других. Кишечные инфекции,
        менингококковую инфекцию, гепатиты теперь лечим у себя, а не везём в инфекционную больницу.
  - id: endoscopyDone
    from: char.city_chief
    when: { mission: endoscopy }
    text:
      ru: >-
        Эндоскопия работает. Кровотечение из язвы и разрыв Мэллори–Вейсса теперь находят и останавливают
        через эндоскоп в первые два часа — без операции и без перевода.
  - id: staffDone
    from: char.city_chief
    when: { mission: staff }
    text:
      ru: >-
        Сто приёмов специалистов — и точность не ниже 85 %. Отделение держится не на одном враче: у
        каждого специалиста свои больные, а у вас — время на тех, кому нужен опытный взгляд.
  - id: sepsisDone
    from: char.icu_head
    when: { mission: sepsis }
    text:
      ru: >-
        Трое больных сепсисом подряд — и каждому антибиотик в срок. При шоке каждый час промедления
        повышает риск смерти, и эти часы вы не потеряли.
  - id: mortalityDone
    from: char.city_chief
    when: { mission: mortality }
    text:
      ru: >-
        Неделя, когда в стационаре умерло не больше двух из ста лежавших. Это главный счёт большой
        больницы: сортировка, сроки и место лечения — всё складывается в него.
  - id: mriDone
    from: char.city_chief
    when: { mission: mri }
    text:
      ru: >-
        Кабинет МРТ работает. Грыжа диска, сдавление конского хвоста и очаги энцефалита теперь видны на
        месте, и без облучения.
  - id: egdDone
    from: char.icu_head
    when: { mission: egd }
    text:
      ru: >-
        Пять кровотечений подряд — и у каждого ЭГДС в первые два часа. Через эндоскоп источник находят и
        сразу останавливают, пока человек не потерял слишком много крови.
  - id: isolationDone
    from: char.mentor
    when: { mission: isolation }
    text:
      ru: >-
        Пять смен — и ни одного заразного больного в общей палате. В инфекционном отделении мало вылечить
        одного: нужно, чтобы от него не заразились соседи.
  - id: end
    from: char.city_chief
    when: end
    text:
      ru: >-
        Коллега, городская больница работает в полную силу: реанимация, инфекционное отделение,
        эндоскопия, специалисты — и смертность в стационаре ниже порога. Вы прошли путь от участка в
        Заречном до большой больницы. Спасибо. Работы здесь хватит и дальше.
