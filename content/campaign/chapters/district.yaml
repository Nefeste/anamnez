# Глава 1 «Участок» (spec 2026-09-campaign): амбулатория в посёлке без лаборатории и рентгена,
# терапия. Сроков нет: глава идёт, пока не выполнены основные задания. Письма — персонажи игры.
id: chapter.district
order: 1
name: { ru: "Участок" }
place: { ru: "амбулатория в посёлке Заречный" }
preset: preset.village
budget: 300000
department: dept.therapy
# что можно строить в главе: всё, кроме рентгена — он в главе 2
build: [room.reception, room.waiting, room.office, room.triage, room.procedure, room.lab, room.ecg, room.toilet]
# первая смена — с наставником: первые трое пришедших — с этими болезнями, подсказки по одной
tutorial: [cond.arvi, cond.strep_pharyngitis, cond.cystitis]
missions:
  - id: seen
    main: true
    kind: seen
    count: 40
    accuracy: 75
    text: { ru: "Принять 40 пациентов с точностью от 75 %" }
  - id: lab
    main: true
    kind: roomWorks
    room: room.lab
    text: { ru: "Открыть лабораторию: построить, поставить анализатор, нанять лаборанта" }
  - id: antibiotics
    main: true
    kind: streak
    days: 3
    day: noNeedlessAntibiotic
    text: { ru: "Три дня подряд без антибиотика, который не показан" }
  - id: noLeft
    main: false
    kind: days
    days: 1
    day: noLeft
    text: { ru: "День без ушедших, не дождавшись приёма" }
  - id: cash
    main: false
    kind: days
    days: 5
    day: cashPositive
    text: { ru: "Пять дней с кассой в плюсе" }
letters:
  - id: hello
    from: char.mentor
    when: start
    text:
      ru: >-
        Здравствуйте, коллега. Тридцать лет я вела этот участок, теперь он ваш. Первых
        пациентов посмотрим вместе — я буду рядом. Правило у меня одно: сначала выслушать
        человека, потом осмотреть, а уж потом анализы. Жалобы и расспрос чаще всего и есть
        диагноз.
  - id: grant
    from: char.chief
    when: start
    text:
      ru: >-
        Добро пожаловать в Заречный. Амбулатория небольшая: кабинет, доврачебный,
        процедурный, ЭКГ. Лаборатории нет — анализы возим в район, и ждать их долго. Район
        выделил деньги на лабораторию, они в кассе. Постройте её, когда освоитесь:
        анализатор и лаборант — уже большое подспорье.
  - id: firstDay
    from: char.mentor
    when: { afterDay: 1 }
    text:
      ru: >-
        Первый день позади. Загляните в разбор каждого приёма: там видно, какой вопрос или
        анализ решил дело, а что ничего не добавило. И не спешите с антибиотиком: при ОРВИ
        он не помогает, а вред от него настоящий.
  - id: seenDone
    from: char.mentor
    when: { mission: seen }
    text:
      ru: >-
        Сорок пациентов, и почти у всех диагноз верный. Так и работают на участке: не быстро,
        а точно. Людям это заметно.
  - id: labDone
    from: char.chief
    when: { mission: lab }
    text:
      ru: >-
        Лаборатория работает — это видно по отчётам: диагнозы точнее, и страховая снимает
        меньше. Спасибо, коллега.
  - id: antibioticsDone
    from: char.mentor
    when: { mission: antibiotics }
    text:
      ru: >-
        Три дня — и ни одного лишнего антибиотика. Это меньше аллергий, меньше устойчивых
        микробов и меньше повторных визитов. Хорошая привычка на всю жизнь.
  - id: end
    from: char.chief
    when: end
    text:
      ru: >-
        Коллега, участок в порядке: лаборатория работает, диагнозы точные, люди к вам идут.
        В районной больнице открывается приёмное отделение, и мне нужен там врач. Подумайте —
        поговорим, когда будете готовы.
