# Глава 2 «Приёмное» (spec 2026-09-chapter-2, часть 34): районная больница в Нижнеборске —
# приёмное со скорой, две палаты и операционная; кабинета УЗИ нет, его строят заданием. Смотровая
# приёмного принимает хирургию и травму, поэтому отделение главы — терапия, как в главе 1.
# Бюджет — на кабинет УЗИ с аппаратом (грант района, письмо главврача) и запас на первые дни.
id: chapter.hospital
order: 2
name: { ru: "Приёмное" }
place: { ru: "районная больница в Нижнеборске" }
move: { ru: "Перейти в районную больницу" }
preset: preset.district
budget: 600000
department: dept.therapy
build: [room.reception, room.waiting, room.office, room.triage, room.procedure, room.lab, room.ecg, room.xray, room.toilet, room.staff, room.emergency, room.ward, room.or, room.ultrasound]
# первая смена — с наставником (часть 34б): первая скорая — аппендицит у молодого (пик 18–40 лет,
# запись болезни), первый пришедший сам —
# перелом лодыжек без смещения (снимок, лонгета, домой), вторая скорая — тяжёлая пневмония (палата,
# назавтра — обход). УЗИ ни одному не нужно: кабинет УЗИ строят заданием
tutorial:
  - { condition: cond.appendicitis, ambulance: true, age: [18, 40] }
  - { condition: cond.ankle_fracture, params: { stability: stable } }
  - { condition: cond.pneumonia_cap, ambulance: true, params: { severity: severe } }
missions:
  - id: triage
    main: true
    kind: triage
    count: 4
    text: { ru: "Смена без ошибок сортировки — хотя бы четыре пациента скорой" }
  - id: operation
    main: true
    kind: operations
    count: 1
    text: { ru: "Первая операция без осложнения" }
  - id: stay
    main: true
    kind: stay
    count: 10
    text: { ru: "Средняя длительность стационара — не выше обычной: десять выписанных подряд" }
  - id: ultrasound
    main: false
    kind: roomWorks
    room: room.ultrasound
    text: { ru: "Открыть кабинет УЗИ: построить, поставить УЗ-аппарат, нанять врача УЗД" }
  - id: onTime
    main: false
    kind: days
    days: 3
    day: noWaitComplication
    text: { ru: "Три дня с операциями без осложнений из-за ожидания" }
letters:
  - id: hello
    from: char.chief
    when: start
    text:
      ru: >-
        Коллега, рад видеть вас в Нижнеборске. Здесь приёмное отделение, две палаты на четыре
        койки и операционная со своей бригадой. Скорая привозит тяжёлых в любое время смены,
        остальные идут через регистратуру, как в Заречном. Кабинета УЗИ пока нет — деньги на
        него район выделил, они в кассе.
  - id: surgeon
    from: char.surgeon
    when: start
    text:
      ru: >-
        Здравствуйте. Я заведую хирургией. Нужна ли операция и как скоро — решаете вы, оперирует
        бригада: хирург, анестезиолог и операционная сестра. Неосложнённый аппендицит можно
        оперировать в первые сутки после поступления, но не позже: пока человек ждёт, отросток
        может прорваться, и тогда операция тяжелее, а стационар дольше.
  - id: mentor
    from: char.mentor
    when: start
    text:
      ru: >-
        Поздравляю с новым местом. Совет один: скорую сортируйте по листу передачи, а не по
        тому, как тяжело человек выглядит. Давление, пульс, частота дыхания, сатурация,
        температура и сознание — из них складывается шкала NEWS2, по ней после смены сверят вашу
        сортировку.
  - id: firstDay
    from: char.mentor
    when: { afterDay: 1 }
    text:
      ru: >-
        Первая смена позади. Загляните в итоги дня: там ваша сортировка сверена со шкалой — кого
        недооценили, кого переоценили. А в разборе каждого привезённого видно, какой показатель
        поднял цвет.
  - id: triageDone
    from: char.mentor
    when: { mission: triage }
    text:
      ru: >-
        Четыре скорых за смену — и ни одной ошибки сортировки. Недооценённый ждёт в очереди, пока
        ему хуже, переоценённый занимает чужое место. Вы не ошиблись ни в ту, ни в другую
        сторону.
  - id: operationDone
    from: char.surgeon
    when: { mission: operation }
    text:
      ru: >-
        Первая операция — и без осложнения. Запомните и то, что было до неё: опоздание с
        операцией лекарствами не исправить. Пока человек ждёт, болезнь идёт дальше.
  - id: stayDone
    from: char.chief
    when: { mission: stay }
    text:
      ru: >-
        Десять выписанных подряд, и никто не пролежал дольше обычного. ОМС платит за случай, а не
        за день: лишние сутки в палате ничего не приносят, а койка нужна следующему.
  - id: ultrasoundDone
    from: char.chief
    when: { mission: ultrasound }
    text:
      ru: >-
        Кабинет УЗИ работает. Камни в желчном пузыре, воспалённый отросток и тромб в вене ноги
        теперь видны на месте, без перевода и без облучения.
  - id: end
    from: char.chief
    when: end
    text:
      ru: >-
        Коллега, приёмное работает как надо: сортировка точная, операции вовремя, палаты не
        простаивают. Спасибо. А новое дело уже есть: область берёт Нижнеборск в программу
        сосудистых центров, и к больнице пристроим крыло с томографом и палатой интенсивной
        терапии. Подумайте — поговорим, когда будете готовы.
