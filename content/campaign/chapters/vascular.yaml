# Глава 3 «Сердце и мозг» (spec 2026-10-chapter-3, часть 45а): та же районная больница в Нижнеборске
# становится первичным сосудистым отделением. Больница главы 2 остаётся — штат, касса, репутация,
# построенное и лежащие, — а участок прирастает справа крылом на 12 клеток (`wing`): в нём строят кабинет
# КТ и палату интенсивной терапии. Бюджет главы приходит в кассу на крыло — областная программа
# сосудистых центров, сумма игровая: томограф на 16 срезов с кабинетом, палата на четыре койки с
# мониторами и коридоры — около 2,1 млн, остальное — на первые зарплаты нового штата. Готовая больница
# `preset.vascular` — районная больница с построенным крылом: её «Смена» и начало карьеры с главы 3.
# Отделение главы — терапия, как в главах 1–2: неврологию привозят, когда работает кабинет КТ (его
# `admits`). Сроки заданий — записи `targets/` с их источниками.
id: chapter.vascular
order: 3
name: { ru: "Сердце и мозг" }
place: { ru: "сосудистое отделение районной больницы в Нижнеборске" }
move: { ru: "Открыть сосудистое отделение" }
preset: preset.vascular
wing: 12
budget: 2500000
department: dept.therapy
build: [room.reception, room.waiting, room.office, room.triage, room.procedure, room.lab, room.ecg, room.xray, room.toilet, room.staff, room.emergency, room.ward, room.or, room.ultrasound, room.ct, room.icu]
missions:
  - id: ecg
    main: true
    kind: deadline
    target: target.ecg_chest_pain
    count: 10
    text: { ru: "ЭКГ при боли в груди в первые 10 минут: десять больных подряд" }
  - id: ct
    main: true
    kind: deadline
    target: target.stroke_ct
    count: 5
    text: { ru: "КТ при подозрении на инсульт в первые 40 минут: пять больных подряд" }
  - id: lysis
    main: true
    kind: thrombolysis
    count: 1
    text: { ru: "Тромболизис вовремя и без противопоказаний" }
  - id: ctRoom
    main: true
    kind: roomWorks
    room: room.ct
    text: { ru: "Открыть кабинет КТ: построить, поставить томограф, нанять рентгенолаборанта и рентгенолога" }
  - id: icu
    main: true
    kind: roomWorks
    room: room.icu
    text: { ru: "Открыть палату интенсивной терапии: построить, поставить мониторы с дефибриллятором, нанять медсестру и анестезиолога-реаниматолога" }
  - id: noMissedMI
    main: false
    kind: days
    days: 5
    day: noMissedMI
    text: { ru: "Пять смен без пропущенного инфаркта" }
  - id: swallow
    main: false
    kind: deadline
    target: target.stroke_swallow
    count: 5
    text: { ru: "Тест глотания каждому с инсультом в первые 3 часа: пять больных подряд" }
letters:
  - id: hello
    from: char.chief
    when: start
    text:
      ru: >-
        Коллега, область включила Нижнеборск в программу сосудистых центров: у нас будет
        первичное сосудистое отделение. Больница остаётся прежней — штат, палаты, касса, — а
        справа к ней пристраиваем крыло под кабинет КТ и палату интенсивной терапии. Деньги
        программы уже в кассе. Заведует отделением Елена Викторовна Соколова, она напишет вам
        сама.
  - id: minutes
    from: char.neurologist
    when: start
    text:
      ru: >-
        Здравствуйте. В нашем деле решают минуты. При боли в груди ЭКГ снимают и читают в
        первые 10 минут от прихода, при подозрении на инсульт КТ с заключением нужна в первые
        40: она исключает кровь в мозге, а без этого о тромболизисе не решить. Растворить тромб
        можно и у нас — если человек пришёл вовремя и противопоказаний нет. Остальное делают в
        региональном сосудистом центре, но до него два часа скорой, и решать, лечить здесь или
        везти туда, будете вы.
  - id: clock
    from: char.mentor
    when: start
    text:
      ru: >-
        Поздравляю с новым делом. Совет прежний, только часы теперь на виду: в карте больного с
        болью в груди или с признаками инсульта видно, сколько прошло с прихода и к какой минуте
        нужно главное обследование. Это не таймер: время по-прежнему идёт делами, и каждый
        вопрос и каждое обследование стоят своих минут. Поэтому сначала то, от чего зависит
        решение, остальное — потом.
  - id: firstDay
    from: char.neurologist
    when: { afterDay: 1 }
    text:
      ru: >-
        Первая смена отделения позади. В итогах дня есть строка сроков: у скольких ваших
        больных ЭКГ и КТ сделаны вовремя. А в разборе каждого видно, на какой минуте что
        сделано и на что ушло время.
  - id: ecgDone
    from: char.neurologist
    when: { mission: ecg }
    text:
      ru: >-
        Десять больных с болью в груди подряд — и у каждого ЭКГ в первые десять минут. Подъём
        ST виден на первой же ленте, и с неё начинается счёт до тромболизиса: чем раньше
        растворён тромб, тем больше сердца удаётся спасти.
  - id: ctDone
    from: char.neurologist
    when: { mission: ct }
    text:
      ru: >-
        Пять больных с подозрением на инсульт подряд — и у каждого КТ в первые сорок минут.
        Ишемический инсульт в первые часы на КТ почти не виден: снимок делают, чтобы исключить
        кровь. Крови нет, окно не прошло, других противопоказаний нет — тромб можно растворять.
  - id: lysisDone
    from: char.neurologist
    when: { mission: lysis }
    text:
      ru: >-
        Тромболизис — вовремя и без противопоказаний. Это и есть работа сосудистого отделения.
        Проверка противопоказаний — не формальность: при крови в мозге или расслоении аорты тот
        же препарат убивает.
  - id: ctRoomDone
    from: char.chief
    when: { mission: ctRoom }
    text:
      ru: >-
        Кабинет КТ работает: томограф, рентгенолаборант и рентгенолог на месте. Теперь скорая
        везёт к нам и больных с признаками инсульта, а не мимо нас, в центр.
  - id: icuDone
    from: char.chief
    when: { mission: icu }
    text:
      ru: >-
        Палата интенсивной терапии открыта: койки под мониторами, медсестра и
        анестезиолог-реаниматолог на месте. За самыми тяжёлыми теперь следят здесь, каждую
        минуту.
  - id: noMissedMIDone
    from: char.mentor
    when: { mission: noMissedMI }
    text:
      ru: >-
        Пять смен — и ни одного пропущенного инфаркта. Инфаркт не всегда похож на себя, и
        вернее всего его видно по ЭКГ и тропонину, а не по тому, как человек выглядит.
  - id: swallowDone
    from: char.mentor
    when: { mission: swallow }
    text:
      ru: >-
        Пять больных с инсультом подряд — и у каждого тест глотания в первые три часа. Мелочь,
        но важная: при нарушенном глотании еда и таблетки попадают в дыхательные пути, а с ними
        приходит пневмония. Пока глотание не проверено — ничего через рот.
  - id: end
    from: char.chief
    when: end
    text:
      ru: >-
        Коллега, сосудистое отделение работает: ЭКГ и КТ вовремя, тромболизис по показаниям,
        палата интенсивной терапии открыта. Для района это значит, что помощь при инфаркте и
        инсульте — в минутах, а не в двух часах дороги. Спасибо. О следующем деле поговорим
        позже.
