id: room.icu
name: { ru: "Палата интенсивной терапии" }
gen: { ru: "палаты интенсивной терапии" }
# spec 2026-10-chapter-3, часть 38а: медсестра и анестезиолог-реаниматолог — свой, не тот, что в
# операционной; у каждой койки — монитор с дефибриллятором. ИВЛ здесь нет: кому она нужна, того
# переводят (ОРИТ — глава 4)
staff: [role.nurse, role.anesthetist]
icu: true
# без единого монитора не работает: «нет аппарата»; койка работает, если у неё стоит монитор
needsEquipment: true
sizes:
  # две койки; места под мониторы — по порядку коек: монитор у первой койки, у второй
  - id: S
    w: 7
    h: 7
    cost: 45000
    upkeep: 400
    door: { x: 3, width: 2 }
    objects:
      - [bed, 1, 2]
      - [bed, 5, 2]
      - [cabinet, 1, 4]
      - [sink, 5, 4]
    slots: [[2, 2], [4, 2]]
    staff: { role.nurse: [3, 3], role.anesthetist: [3, 4] }
  # четыре койки
  - id: M
    w: 9
    h: 7
    cost: 70000
    upkeep: 650
    door: { x: 4, width: 2 }
    objects:
      - [bed, 1, 2]
      - [bed, 1, 4]
      - [bed, 7, 2]
      - [bed, 7, 4]
      - [sink, 4, 2]
    slots: [[2, 2], [2, 4], [6, 2], [6, 4]]
    staff: { role.nurse: [4, 3], role.anesthetist: [4, 4] }
texts:
  hint: { ru: "Койки для тех, за кем нужно следить каждую минуту: у каждой — монитор с дефибриллятором, при палате — медсестра и анестезиолог-реаниматолог. Койка без монитора не работает. Кому нужна искусственная вентиляция лёгких, того переводят." }
