id: room.endoscopy
name: { ru: "Эндоскопический кабинет" }
gen: { ru: "эндоскопического кабинета" }
staff: [role.endoscopist, role.nurse]
needsEquipment: true
# эндоскопический кабинет (spec 2026-10-chapter-4, часть 53а): пациент лежит на кушетке на левом боку, стойка — у
# изголовья, эндоскопист — рядом с ней, медсестра — с другой стороны; шкаф для эндоскопов и раковина — для их обработки.
# Работать он должен круглосуточно: «круглосуточно должны быть доступны эндоскопическая видеоаппаратура и персонал»
# (277_2, раздел 6). Цена и содержание — игровой баланс (вопрос 11)
sizes:
  - id: M
    w: 8
    h: 7
    cost: 40000
    upkeep: 300
    door: { x: 4 }
    slots: [[3, 2]]
    objects:
      - [couch, 4, 3]
      - [cabinet, 6, 2]
      - [sink, 6, 4]
      - [table, 1, 2]
    staff: { role.endoscopist: [3, 3], role.nurse: [5, 3] }
    patient: [4, 3]
texts:
  hint: { ru: "Эндоскопист проводит гибкий эндоскоп через рот и осматривает пищевод, желудок и двенадцатиперстную кишку: находит источник кровотечения и тут же останавливает его — уколом и коагуляцией или клипсой. Без облучения." }
