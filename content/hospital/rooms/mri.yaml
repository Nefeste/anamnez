id: room.mri
name: { ru: "Кабинет МРТ" }
gen: { ru: "кабинета МРТ" }
staff: [role.radiographer, role.radiologist]
needsEquipment: true
# работает кабинет МРТ — привозят и больных неврологии, как с кабинетом КТ (spec 2026-10-chapter-4, часть 50б): при
# подозрении на инсульт — «бесконтрастная КТ или МРТ» с заключением в первые 40 минут (814_1, раздел 2.4; 523_3,
# раздел 2.4)
admits: [dept.neurology]
# кабинет МРТ (часть 50б): магнит — посередине, пациент лежит на столе в тоннеле; рентгенолаборант — за пультом,
# рентгенолог — за столом, где описывает серии. Кабинет просторнее КТ: магнит больше кольца томографа, вокруг — зона,
# куда не вносят металл. Цена и содержание — игровой баланс (вопрос 11)
sizes:
  - id: L
    w: 11
    h: 8
    cost: 120000
    upkeep: 900
    door: { x: 5, width: 2 }
    slots: [[5, 3]]
    objects:
      - [table, 9, 3]
      - [table, 1, 3]
      - [chair, 1, 4]
      - [cabinet, 1, 2]
      - [cabinet, 9, 2]
    staff: { role.radiographer: [9, 4], role.radiologist: [1, 4] }
    patient: [5, 3]
texts:
  hint: { ru: "Магнитно-резонансный томограф снимает мозг сериями без облучения: дольше КТ, зато видит то, чего на КТ ещё нет, — свежий очаг инсульта, воспаление при энцефалите. Рентгенолаборант укладывает пациента в тоннель, рентгенолог описывает серии. Металл в кабинет не вносят." }
