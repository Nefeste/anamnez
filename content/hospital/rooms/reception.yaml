# Помещения (spec 2026-09-own-hospital): координаты — от левого верхнего угла стен, дверная
# сторона — нижняя; первый ряд внутри — под подпись, последний — проход у двери.
# Цены и содержание — игровой баланс, настраиваются симулятором экономики.
id: room.reception
name: { ru: "Регистратура" }
gen: { ru: "регистратуры" }
staff: [role.registrar]
sizes:
  - id: S
    w: 6
    h: 7
    cost: 150000
    upkeep: 300
    door: { x: 3 }
    objects:
      - [desk, 2, 3]
      - [chair, 2, 2]
      - [cabinet, 4, 2]
      - [plant, 4, 4]
    staff: { role.registrar: [2, 2] }
    patient: [2, 4]
texts:
  hint: { ru: "Здесь пациента записывают на приём и заводят карту. Без регистратуры и регистратора приём не начать." }
