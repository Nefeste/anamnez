id: role.anesthetist
name: { ru: "Анестезиолог-реаниматолог" }
gen: { ru: "анестезиолога-реаниматолога" }
salary: [3600, 6500]
texts:
  hint: { ru: "В операционной даёт наркоз и следит за дыханием, пульсом и давлением, в палате интенсивной терапии ведёт тяжёлых больных под мониторами. Человек работает в одном помещении: операционной и палате интенсивной терапии нужен каждой свой." }
