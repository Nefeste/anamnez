# Городская больница — больница главы 4 «Большая больница» (spec 2026-10-chapter-4, часть 60а): областной центр
# Верхнеборск, участок 56 × 40 (геймдизайн §7: «большая больница»). Четыре ряда помещений и три коридора. Сверху —
# регистратура, доврачебный, кабинет врача, процедурный, лаборатория, ординаторская на четыре места и два кабинета
# специалистов. Во втором ряду — зона ожидания, ЭКГ, проход ко второму коридору, рентген, УЗИ экспертного класса, КТ на 64
# среза, санузел и третий кабинет специалиста. В третьем — стационар: смотровая приёмного на три койки, две палаты, проход
# к третьему коридору, палата интенсивной терапии, операционная и третья палата. Нижний ряд строят заданиями главы
# (`later`): реанимация на шесть коек, три бокса, эндоскопический кабинет и кабинет МРТ — в карьере врач строит их сам,
# где захочет, а в «Смене» они стоят. Специалисты — гастроэнтеролог, эндокринолог и инфекционист — в «Смене» на местах,
# в карьере их нанимают; в начале главы их кабинеты пустуют. Пятый кабинет — терапевта, рядом с кабинетом МРТ: в «Смене»
# он берёт пришедших без записи к специалисту, в карьере его кабинет и терапевта — по желанию врача. Штат — на всё, что
