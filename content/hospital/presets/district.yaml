# Районная больница — больница главы 2 «Приёмное» (spec 2026-09-chapter-2, часть 34): на участке
# песочницы, три ряда помещений и два коридора. Сверху — регистратура, доврачебный, кабинет врача,
# процедурный, лаборатория и ординаторская; справа от неё место под кабинет УЗИ — его строят
# заданием главы. Посередине — зона ожидания, ЭКГ, проход ко второму коридору, рентген и санузел.
# Снизу — стационар: смотровая приёмного, две палаты на четыре койки и операционная; скорая везёт
# каталку от входа мимо регистратуры и зоны ожидания. Штат — на всё, что построено.
