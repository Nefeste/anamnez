# Районная больница с сосудистым отделением — больница главы 3 «Сердце и мозг» (spec 2026-10-chapter-3,
# часть 45а): районная больница главы 2, к участку которой справа пристроено крыло на 12 клеток. Её
# помещения — те же, на тех же местах и в том же порядке (это проверяет загрузчик); справа от
# ординаторской — кабинет УЗИ, его строят заданием главы 2. Оба коридора продлены в крыло: сверху в
# крыле — кабинет КТ, снизу — палата интенсивной терапии на четыре койки с мониторами. Штат — на всё,
# что построено. Это больница «Смены» и начала карьеры с главы 3; в карьере крыло строит сам врач.
