# Баланс своей больницы (spec 2026-09-own-hospital): числа игровые, с правдоподобными
# соотношениями; настраиваются отчётом симулятора экономики (часть 9) и меняются записью с
# отчётом в описании коммита, как база.
corridor: { cost: 300, upkeep: 5 }
refund: 50
# песочница: участок, вход в левом краю и отрезок коридора от него; бюджеты на выбор; с
# готовой амбулаторией в кассе остаётся доля бюджета
sandbox:
  plot: [40, 28]
  entrance: [0, 13]
  corridor:
    - [1, 13, 3, 13]
  budgets: { modest: 600000, normal: 1200000, generous: 2500000 }
  clinicShare: 25
# персонал: кандидатов на должность в день; навык 1–5 — веса; время обследования по навыку, %;
# рентгенолог — поправка чувствительности и специфичности снимка по навыку, п. п.; сколько
# отработанных дней на ступень навыка; черты — вес, зарплата (%), скорость (%), поправка
# чтения снимка, навык (от, до), рост (во сколько раз быстрее)
staff:
  candidates: [1, 2]
  skills: [15, 25, 30, 20, 10]
  speed: [130, 115, 100, 90, 80]
  reading: [[-8, -4], [-4, -2], [0, 0], [2, 1], [4, 2]]
  growthDays: 20
  noTrait: 30
  traits:
    careful: { weight: 20, reading: [2, 1], threshold: 3, forget: -100 }
    fast: { weight: 20, speed: 85, threshold: -4 }
    novice: { weight: 15, salary: 85, skills: [1, 2], growth: 2 }
    experienced: { weight: 15, salary: 115, skills: [4, 5], reading: [2, 1] }
  # нанятые врачи (spec 2026-09-hired-doctors) — тот же разумный врач, что проверяет базу, с
  # порогами по навыку 1–5: при какой уверенности ставит диагноз, %; наименьшая польза
  # обследования, тысячные бита (у разумного — 90 % и 20); как часто забывает спросить о
  # противопоказаниях перед лечением, %. Черты: «аккуратный» — порог выше и не забывает,
  # «быстрый» — порог ниже (его скорость — выше, `fast.speed`)
  doctor:
    threshold: [55, 65, 75, 83, 90]
    minGain: [100, 60, 45, 30, 20]
    forget: [40, 20, 0, 0, 0]
# экономика (часть 9). ОМС платит за обращение по тяжести поставленного диагноза и проверяет
# его, как экспертиза качества: доля тарифа по оценке «обоснованность» A–D, %, и доля, если
# диагноз не подтверждён обследованием из «Как подтвердить», %; обследования — те, что были
# показаны, когда их назначали, или подтверждают диагноз, % цены обследования в базе. ДМС —
# обращение и показанные обследования по прайсу, платно — обращение и всё сделанное, % цены.
tariffs:
  oms: { minor: 1500, moderate: 2000, serious: 2600, critical: 2600 }
  omsQuality: { A: 100, B: 90, C: 60, D: 30 }
  omsUnconfirmed: 50
  omsExam: 100
  dms: { visit: 2500, price: 200 }
  self: { visit: 2000, price: 200 }
# уровень амбулатории для ОМС, как коэффициент уровня в тарифах: доля тарифа за обращение, % —
# у любой амбулатории и прибавка, если работает помещение с обследованиями
level:
  base: 50
  rooms: { room.lab: 25, room.xray: 25 }
# доля ДМС и платных пациентов, % — при репутации 0, 50 и 100 (между — по прямой)
payers:
  dms: [2, 8, 16]
  self: [3, 7, 14]
# расходники обследования, % его цены — по виду
consumables: { ask: 0, physical: 0, bedside: 50, lab: 30, rapid: 60, functional: 10, imaging: 20 }
# процент на долг в день, сотые доли процента
interest: 50
# репутация 0–100: с чего начинается и на сколько процентов каждый вечер сдвигается к оценке
# дня. Оценка дня — доля довольных (верный диагноз) минус доли недовольных (ошибка, ушёл, не
# принят, вернулся хуже) и поправки за ожидание и санузел.
reputation:
  start: 50
  pull: 15
  waitShort: 5
  waitShortMin: 30
  waitLong: -10
  waitLongMin: 90
  noToilet: -10
# сколько пациентов приходит от репутации: ± % при 0 и 100
flow: 20
