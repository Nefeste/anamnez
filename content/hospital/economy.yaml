# Баланс своей больницы (spec 2026-09-own-hospital): числа игровые, с правдоподобными
# соотношениями; настраиваются отчётом симулятора экономики (часть 9) и меняются записью с
# отчётом в описании коммита, как база.
corridor: { cost: 3000, upkeep: 5 }
refund: 50
# песочница: участок, вход в левом краю и отрезок коридора от него; бюджеты на выбор; с
# готовой амбулаторией в кассе остаётся доля бюджета
sandbox:
  plot: [40, 28]
  entrance: [0, 13]
  corridor:
    - [1, 13, 3, 13]
  budgets: { modest: 3000000, normal: 6000000, generous: 12000000 }
  clinicShare: 25
# персонал: кандидатов на должность в день; навык 1–5 — веса; время обследования по навыку, %;
# рентгенолог — поправка чувствительности и специфичности снимка по навыку, п. п.; сколько
# отработанных дней на ступень навыка; черты — вес, зарплата (%), скорость (%), поправка
# чтения снимка, навык (от, до), рост (во сколько раз быстрее)
staff:
  candidates: [1, 2]
  skills: [15, 25, 30, 20, 10]
  speed: [130, 115, 100, 90, 80]
  reading: [[-8, -4], [-4, -2], [0, 0], [2, 1], [4, 2]]
  growthDays: 20
  noTrait: 30
  traits:
    careful: { weight: 20, reading: [2, 1] }
    fast: { weight: 20, speed: 85 }
    novice: { weight: 15, salary: 85, skills: [1, 2], growth: 2 }
    experienced: { weight: 15, salary: 115, skills: [4, 5], reading: [2, 1] }
